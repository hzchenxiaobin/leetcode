<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 100 → 121</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">100 的九进制是 121（100 = 1×81 + 2×9 + 1），按十进制读出来即答案</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="62" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="94" y="81" fill="#3a4a66" font-weight="bold">轮次</text>
    <rect x="150" y="62" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="194" y="81" fill="#3a4a66" font-weight="bold">进入的 n</text>
    <rect x="250" y="62" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="294" y="81" fill="#3a4a66" font-weight="bold">d = n % 9</text>
    <rect x="350" y="62" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="394" y="81" fill="#3a4a66" font-weight="bold">place</text>
    <rect x="450" y="62" width="88" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="494" y="81" fill="#3a4a66" font-weight="bold">ans</text>

    <rect x="50" y="96" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="94" y="115" fill="#555">第 1 轮</text>
    <rect x="150" y="96" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="194" y="115" fill="#555">100</text>
    <rect x="250" y="96" width="88" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="294" y="115" fill="#3a5a30">1</text>
    <rect x="350" y="96" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="394" y="115" fill="#555">1</text>
    <rect x="450" y="96" width="88" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="494" y="115" fill="#8a6a20">1</text>

    <rect x="50" y="130" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="94" y="149" fill="#555">第 2 轮</text>
    <rect x="150" y="130" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="194" y="149" fill="#555">11</text>
    <rect x="250" y="130" width="88" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="294" y="149" fill="#3a5a30">2</text>
    <rect x="350" y="130" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="394" y="149" fill="#555">10</text>
    <rect x="450" y="130" width="88" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="494" y="149" fill="#8a6a20">21</text>

    <rect x="50" y="164" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="94" y="183" fill="#555">第 3 轮</text>
    <rect x="150" y="164" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="194" y="183" fill="#555">1</text>
    <rect x="250" y="164" width="88" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="294" y="183" fill="#3a5a30">1</text>
    <rect x="350" y="164" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="394" y="183" fill="#555">100</text>
    <rect x="450" y="164" width="88" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="494" y="183" fill="#8a3a36">121</text>

    <rect x="50" y="198" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="94" y="217" fill="#888">结束</text>
    <rect x="150" y="198" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="194" y="217" fill="#888">0</text>
    <rect x="250" y="198" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="294" y="217" fill="#888">—</text>
    <rect x="350" y="198" width="88" height="28" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="5"/>
    <text x="394" y="217" fill="#888">—</text>
    <rect x="450" y="198" width="88" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="494" y="217" fill="#8a3a36">121</text>
  </g>

  <path d="M 240 110 L 240 210" stroke="#c9c9c9" stroke-width="1" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 194 124 L 194 130 M 194 158 L 194 164" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 的演变：100 → 11 → 1 → 0　　place 的演变：1 → 10 → 100</text>

  <rect x="120" y="262" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = 121（十进制表示里没有 9）</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">校验：[1, 121] 内不含 9 的正整数恰好 100 个</text>

  <rect x="60" y="318" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="338" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">对照 n = 9</text>
  <text x="76" y="356" font-size="10" fill="#555" filter="url(#rough2)">9 的九进制是 10：第一轮 d = 0、place = 1，第二轮 d = 1、place = 10 → ans = 10。</text>
  <text x="76" y="372" font-size="10" fill="#555" filter="url(#rough2)">正对应序列 1…8 之后直接跳到 10，9 被删掉了。</text>
</svg>
