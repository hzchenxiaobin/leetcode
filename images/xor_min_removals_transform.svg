<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">核心转化：删除集合的异或和被唯一确定</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums（整体异或和 S = 1 ⊕ 2 ⊕ 3 = 0）</text>

  <g filter="url(#rough2)">
    <rect x="248" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="296" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="344" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="272" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="368" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 292 120 Q 200 136 162 154" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 120 Q 440 136 478 154" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="36" y="158" width="252" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="162" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">保留 K（留下不删）</text>
  <g filter="url(#rough2)">
    <rect x="102" y="194" width="44" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="178" y="194" width="44" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="124" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="162" y="248" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">要求：XOR(K) = target = 2</text>

  <g filter="url(#rough2)">
    <rect x="352" y="158" width="252" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="478" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">删除 R（要删的元素）</text>
  <g filter="url(#rough2)">
    <rect x="456" y="194" width="44" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="478" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="478" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">于是：XOR(R) = S ⊕ target</text>

  <g filter="url(#rough2)">
    <rect x="90" y="280" width="460" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">恒等式：XOR(nums) = XOR(K) ⊕ XOR(R)</text>
  <text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">⇒ 删除集合的异或和被唯一确定：x = S ⊕ target</text>

  <g filter="url(#rough2)">
    <rect x="56" y="362" width="528" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="320" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">原问题 ⟺ 求异或和为 x 的最小子集，其大小 = 最少删除次数</text>
  <text x="320" y="405" text-anchor="middle" font-size="11.5" fill="#a06a10" filter="url(#rough2)">本例：x = 0 ⊕ 2 = 2 ⇒ 删 {2}，保留 [1,3]，1 ⊕ 3 = 2 ✓</text>
</svg>
