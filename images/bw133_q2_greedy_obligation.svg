<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">处理到下标 2：哪个窗口还能改变它？</text>

  <!-- 高亮列：下标 2 所在的纵向带 -->
  <rect x="212" y="44" width="60" height="196" fill="#fff8e1" opacity="0.75" filter="url(#rough2)"/>

  <!-- 瓷砖 -->
  <rect x="80" y="52" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="146" y="52" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="52" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="278" y="52" width="60" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="52" width="60" height="40" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="110" y="78" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="176" y="78" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="242" y="78" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="308" y="78" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">?</text>
  <text x="374" y="78" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">?</text>

  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已变 1</text>
  <text x="176" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已变 1</text>
  <text x="242" y="108" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">当前读 0</text>
  <text x="308" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未定</text>
  <text x="374" y="108" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">未定</text>

  <!-- 三条覆盖下标 2 的窗口 -->
  <text x="84" y="136" font-size="11" fill="#888" filter="url(#rough2)">起点 0 窗口：早已决定</text>
  <rect x="80" y="142" width="192" height="20" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <text x="150" y="178" font-size="11" fill="#888" filter="url(#rough2)">起点 1 窗口：早已决定</text>
  <rect x="146" y="184" width="192" height="20" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <text x="216" y="220" font-size="11" fill="#b85450" filter="url(#rough2)">起点 2 窗口：此刻唯一能动的</text>
  <rect x="212" y="226" width="192" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="260" y="272" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">下标 2 只被这三个窗口覆盖，前两个在更早的步骤已经用掉</text>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">于是 nums[2] 是 0 时，翻转 [2, 4] 是唯一选择，不存在分支</text>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">⇒ 贪心无需回溯：每步的选择被「最左边那个 0」强制</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（真正的实现顺序：先翻 [0,2] 再看下标 3、4 是否已被前面的窗口顺带翻好）</text>
</svg>
