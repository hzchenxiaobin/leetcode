<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">演算：整除筛选必要不充分——同计数，不同答案</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">"aabb" 与 "abba"：总计数同为 {a:2, b:2}，g = 2，候选 k ∈ {2, 1}</text>

  <!-- divider -->
  <path d="M270,62 L270,252" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- left column: aabb -->
  <text x="150" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">s = "aabb"</text>
  <g filter="url(#rough2)">
    <rect x="94" y="90" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <rect x="154" y="90" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="120" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">aa</text>
    <text x="180" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">bb</text>
    <text x="120" y="146" text-anchor="middle" font-size="10.5" fill="#b85450">{a:2}</text>
    <text x="180" y="146" text-anchor="middle" font-size="10.5" fill="#b85450">{b:2}</text>
  </g>
  <text x="150" y="170" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">计数不等 ✗ → k = 2 被淘汰</text>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">k = 1 → L = 4：整串一块，天然合法 ✓</text>
  <g filter="url(#rough2)">
    <rect x="75" y="204" width="150" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="150" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 4（t = "aabb"）</text>

  <!-- right column: abba -->
  <text x="390" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s = "abba"</text>
  <g filter="url(#rough2)">
    <rect x="334" y="90" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="394" y="90" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="360" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">ab</text>
    <text x="420" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">ba</text>
    <text x="360" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">{a:1,b:1}</text>
    <text x="420" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">{a:1,b:1}</text>
  </g>
  <text x="390" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">计数全等 ✓ → k = 2 合法，L = 4/2 = 2</text>
  <text x="390" y="192" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">t 可取任意一块，如 t = "ab"（"ab" + "ba"）</text>
  <g filter="url(#rough2)">
    <rect x="315" y="204" width="150" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="390" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2a" filter="url(#rough2)">ans = 2（t = "ab"）</text>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="36" y="262" width="468" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="270" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">同样的 cnt、同样的 g、同样的候选集，答案却差一倍</text>
  <text x="270" y="310" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">差别藏在块的边界与块内顺序里——整除筛选对此视而不见</text>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">通过筛选的每个 k 都必须逐块计数校验，充分性只有校验能给</text>
</svg>
