<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：forts = [1, 0, 0, -1, 0, 0, 0, 0, 1]</text>

  <!-- 数组格子，两行显示 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="68" y="86" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="96" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="124" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="152" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="180" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="208" y="60" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="236" y="86" text-anchor="middle" font-size="15" fill="#333">-1</text>
    <rect x="264" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="292" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="320" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="348" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="376" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="404" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
    <rect x="432" y="60" width="56" height="42" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="460" y="86" text-anchor="middle" font-size="15" fill="#333">0</text>
  </g>

  <!-- 下标标 -->
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="68" y="120">0</text>
    <text x="124" y="120">1</text>
    <text x="180" y="120">2</text>
    <text x="236" y="120">3</text>
    <text x="292" y="120">4</text>
    <text x="348" y="120">5</text>
    <text x="404" y="120">6</text>
    <text x="460" y="120">7</text>
  </g>
  <rect x="452" y="128" width="36" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="470" y="154" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>

  <!-- 扫描 1：从位置 0 向右到位置 3 -->
  <path d="M68,146 Q150,170 228,150" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <rect x="70" y="200" width="180" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 → 3：摧毁 2 个</text>

  <!-- 扫描 2：从位置 8 向左到位置 3 -->
  <path d="M468,196 Q350,260 244,168" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <rect x="270" y="252" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8 → 3：摧毁 4 个 ★</text>

  <!-- 结论 -->
  <rect x="120" y="308" width="280" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">ans = 4</text>
</svg>
