<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">状态设计与 O(n) 递推：后缀最大折叠两层博弈</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== state definition ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="64" width="800" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="90" y="90" font-size="12.5" font-weight="bold" fill="#2b6e9e">状态定义（1 ≤ i ≤ n-1，dp[n] := 0 为终止哨兵）</text>
  <text x="90" y="114" font-size="12" fill="#444" font-family="monospace">dp[i]：轮到当前玩家、最左石头已吞并前 i 个（指针在 i）时，(当前玩家 − 对手) 的最大分差</text>
  <text x="90" y="132" font-size="10.5" fill="#888">无后效性：后续博弈只依赖指针位置和轮到谁，与之前怎么合并无关 → 子问题独立，可 DP</text>

  <!-- ===== transition picture ===== -->
  <text x="470" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">转移：在状态 i，可选任意 j ∈ (i, n]，得 pre[j] 分后变成对手的回合</text>

  <g font-size="13">
    <g filter="url(#sk)"><circle cx="150" cy="240" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="150" y="245" text-anchor="middle" fill="#2b6e9e" font-weight="bold">i</text>
    <g filter="url(#sk)"><circle cx="370" cy="240" r="22" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="370" y="245" text-anchor="middle" fill="#2e6e2e" font-weight="bold">i+1</text>
    <g filter="url(#sk)"><circle cx="560" cy="240" r="20" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="560" y="245" text-anchor="middle" fill="#999">j</text>
    <g filter="url(#sk)"><circle cx="760" cy="240" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="760" y="245" text-anchor="middle" fill="#b03a3a" font-weight="bold">n</text>
  </g>
  <text x="760" y="206" text-anchor="middle" font-size="10" fill="#7a2828" font-weight="bold">选中即终局，dp[n] = 0</text>

  <!-- arcs from i -->
  <path d="M 172 230 Q 268 186 346 228" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="262" y="200" text-anchor="middle" font-size="10.5" fill="#2b6e9e" font-weight="bold">选 i+1：pre[i+1] − dp[i+1]</text>
  <path d="M 172 246 Q 360 300 540 246" stroke="#bbb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="5 3"/>
  <text x="360" y="296" text-anchor="middle" font-size="10.5" fill="#888">选 j &gt; i+1：pre[j] − dp[j]</text>
  <path d="M 174 252 Q 470 330 736 250" stroke="#bbb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="5 3"/>

  <!-- folding box -->
  <g filter="url(#sk)">
    <rect x="100" y="316" width="740" height="96" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="120" y="342" font-size="12.5" font-weight="bold" fill="#7a5415">后缀最大折叠：max{ pre[j] − dp[j] : j &gt; i+1 } 恰好等于 dp[i+1]</text>
  <text x="120" y="368" font-size="12.5" fill="#444" font-family="monospace" font-weight="bold">dp[i] = max( pre[i+1] − dp[i+1] ,  dp[i+1] )</text>
  <text x="120" y="390" font-size="11" fill="#666">直观读法：当前玩家要么把指针推到 i+1（显式一项），要么「跳过 i+1」—— 而跳过的最优价值正是 dp[i+1]</text>

  <!-- ===== boundary warning ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="436" width="800" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="90" y="462" font-size="12.5" font-weight="bold" fill="#7a2828">边界：dp[n-1] = pre[n]，是「强制」而非「可选」</text>
  <text x="90" y="486" font-size="11.5" fill="#444">状态 n−1 时只剩 2 块石头，规则要求必须操作且只能选 x = 2，得分 pre[n]，对手无从得分</text>
  <text x="90" y="510" font-size="11.5" fill="#7a2828" font-weight="bold">易错：不能写成 max(0, pre[n])！玩家无权弃权，pre[n] &lt; 0 也得吞（示例 3：答案 −22）</text>

  <!-- ===== complexity ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="552" width="390" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="90" y="578" font-size="12.5" font-weight="bold" fill="#2e6e2e">复杂度</text>
  <text x="90" y="602" font-size="11.5" fill="#444" font-family="monospace">倒序一趟 + 滚动变量 cur</text>
  <text x="90" y="624" font-size="12.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">时间 O(n)，额外空间 O(1)</text>

  <g filter="url(#sk)">
    <rect x="480" y="552" width="390" height="86" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="500" y="578" font-size="12.5" font-weight="bold" fill="#2b2b2b">对比：暴力 minimax</text>
  <text x="500" y="602" font-size="11.5" fill="#444" font-family="monospace">dp[i] = max{ pre[j] − dp[j] : j &gt; i } 直接双层循环</text>
  <text x="500" y="624" font-size="12" fill="#7a2828" font-family="monospace" font-weight="bold">O(n²) = 10¹⁰，n = 10⁵ 会超时 → 必须折叠</text>
</svg>
