<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：第 k 个空格即截断点</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">单词间仅单个空格 ⇒ 空格数 = 单词数 − 1，前 k 个单词恰好结束于第 k 个空格左侧</text>

  <!-- 单词块行 -->
  <rect x="42" y="76" width="68" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="114" y="76" width="16" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="134" y="76" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="76" width="16" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="206" y="76" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="76" width="16" height="40" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="274" y="76" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="322" y="76" width="16" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="342" y="76" width="88" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <text x="76" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Hello</text>
  <text x="158" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">how</text>
  <text x="228" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">are</text>
  <text x="296" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">you</text>
  <text x="386" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">Contestant</text>

  <!-- 词编号 -->
  <text x="76" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">词1</text>
  <text x="158" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">词2</text>
  <text x="228" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">词3</text>
  <text x="296" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">词4</text>
  <text x="386" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">词5</text>

  <!-- 截断虚线 + 标注 -->
  <path d="M 330 66 L 330 70" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#b27a10" filter="url(#rough2)">↓ 第 k=4 个空格</text>
  <path d="M 330 134 L 330 168" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="338" y="152" text-anchor="start" font-size="10" fill="#b27a10" filter="url(#rough2)">在此截断</text>

  <!-- 保留 / 丢弃 区标注 -->
  <path d="M 42 180 L 318 180" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 42 175 L 42 185 M 318 175 L 318 185" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="197" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">保留：前 k 个单词 + 其间 k−1 个空格</text>
  <path d="M 322 180 L 430 180" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="376" y="197" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">丢弃（含第 k 个空格）</text>

  <!-- 结果框 -->
  <rect x="60" y="212" width="400" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 s.substr(0, 17) = "Hello how are you"</text>

  <!-- 底部说明框 -->
  <rect x="30" y="262" width="460" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">k = 单词总数（示例 3）⇒ 不存在第 k 个空格</text>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">扫描结束 cnt 始终 &lt; k，循环自然兜底 return s —— 无需任何特判</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">扫描止于第 k 个空格，其后内容（Contestant）从未被访问 —— 天然提前终止</text>
</svg>
