<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：strs = ["10","0001","111001","1","0"]，m = 5, n = 3</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐个处理物品，只跟踪目标格 dp[5][3] 的变化</text>

  <rect x="32" y="58" width="496" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="48" y="76">字符串</text>
    <text x="176" y="76" text-anchor="middle">z</text>
    <text x="222" y="76" text-anchor="middle">o</text>
    <text x="300" y="76" text-anchor="middle">dp[5][3]</text>
    <text x="352" y="76">说明</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="84" width="496" height="26" fill="#ffffff" stroke="#e2e2e2" stroke-width="1" rx="4"/>
    <rect x="32" y="110" width="496" height="26" fill="#f7f9fc" stroke="#e2e2e2" stroke-width="1" rx="4"/>
    <rect x="32" y="136" width="496" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="32" y="162" width="496" height="26" fill="#f7f9fc" stroke="#e2e2e2" stroke-width="1" rx="4"/>
    <rect x="32" y="188" width="496" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="48" y="101">"10"</text>
    <text x="176" y="101" text-anchor="middle">1</text>
    <text x="222" y="101" text-anchor="middle">1</text>
    <text x="300" y="101" text-anchor="middle">1</text>
    <text x="352" y="101">先选它，用掉 (1, 1)</text>

    <text x="48" y="127">"0001"</text>
    <text x="176" y="127" text-anchor="middle">3</text>
    <text x="222" y="127" text-anchor="middle">1</text>
    <text x="300" y="127" text-anchor="middle">2</text>
    <text x="352" y="127">累计 (4, 2)，仍不超预算</text>

    <text x="48" y="153" fill="#8a3a36">"111001"</text>
    <text x="176" y="153" text-anchor="middle" fill="#8a3a36">2</text>
    <text x="222" y="153" text-anchor="middle" fill="#8a3a36">4</text>
    <text x="300" y="153" text-anchor="middle" fill="#8a3a36">2</text>
    <text x="352" y="153" fill="#8a3a36">o = 4 &gt; n = 3，整件跳过</text>

    <text x="48" y="179">"1"</text>
    <text x="176" y="179" text-anchor="middle">0</text>
    <text x="222" y="179" text-anchor="middle">1</text>
    <text x="300" y="179" text-anchor="middle">3</text>
    <text x="352" y="179">累计 (4, 3)，预算刚好够</text>

    <text x="48" y="205" fill="#3a5a30" font-weight="bold">"0"</text>
    <text x="176" y="205" text-anchor="middle" fill="#3a5a30" font-weight="bold">1</text>
    <text x="222" y="205" text-anchor="middle" fill="#3a5a30" font-weight="bold">0</text>
    <text x="300" y="205" text-anchor="middle" fill="#3a5a30" font-weight="bold">4</text>
    <text x="352" y="205" fill="#3a5a30" font-weight="bold">累计 (5, 3)，答案 = 4</text>
  </g>

  <text x="64" y="244" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结束后的 dp[i][3]（i = 0…5）：预算越多，件数不减</text>

  <path d="M 60 350 L 330 350" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2" fill="#e8f0fe">
    <rect x="70" y="330" width="30" height="20"/>
    <rect x="112" y="310" width="30" height="40"/>
    <rect x="154" y="290" width="30" height="60"/>
    <rect x="196" y="290" width="30" height="60"/>
    <rect x="238" y="290" width="30" height="60"/>
  </g>
  <rect x="280" y="270" width="30" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <g font-size="9" fill="#555" filter="url(#rough2)" text-anchor="middle">
    <text x="85" y="324">1</text><text x="127" y="304">2</text>
    <text x="169" y="284">3</text><text x="211" y="284">3</text>
    <text x="253" y="284">3</text>
    <text x="295" y="264" fill="#3a5a30" font-weight="bold">4</text>
  </g>
  <g font-size="9" fill="#777" filter="url(#rough2)" text-anchor="middle">
    <text x="85" y="366">i=0</text><text x="127" y="366">i=1</text><text x="169" y="366">i=2</text>
    <text x="211" y="366">i=3</text><text x="253" y="366">i=4</text><text x="295" y="366">i=5</text>
  </g>

  <rect x="340" y="252" width="192" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="352" y="272" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">选出的子集</text>
  <g font-size="9.5" fill="#555" filter="url(#rough2)">
    <text x="352" y="291">{"10", "0001", "1", "0"}</text>
    <text x="352" y="309">0 的总数 = 1+3+0+1 = 5 = m</text>
    <text x="352" y="327">1 的总数 = 1+1+1+0 = 3 = n</text>
    <text x="352" y="345" fill="#3a5a30">件数 4，两个预算恰好用满</text>
  </g>

  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">红行 = 被剪掉的超标物品；绿格 = 答案 dp[m][n]；每一格都只依赖更小的预算，故无后效性</text>
</svg>
