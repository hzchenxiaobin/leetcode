<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">为什么封顶：沿最短路走 d 步，高度至多剩 d</text>

  <!-- 左侧：4x4 网格，水域右下角 -->
  <g>
    <rect x="60" y="60" width="56" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="116" y="60" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="172" y="60" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="228" y="60" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="116" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="116" y="116" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="172" y="116" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="228" y="116" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="172" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="116" y="172" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="172" y="172" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="228" y="172" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="60" y="228" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="116" y="228" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="172" y="228" width="56" height="56" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="228" y="228" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="88" y="93" text-anchor="middle" font-size="16" fill="#b8642a" filter="url(#rough2)">?</text>
    <text x="144" y="93" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <text x="256" y="249" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">水 0</text>
  </g>
  <!-- 最短路箭头 (88,88)→(144,88)→(144,144)→(200,144)→(200,200)→(256,200)→(256,256) -->
  <path d="M100,88 L130,88" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M144,102 L144,132" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M158,144 L188,144" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M200,158 L200,188" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M214,200 L244,200" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M256,214 L256,244" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12.5" fill="#b85450" filter="url(#rough2)">左上角格到最近水域要走 6 步</text>

  <!-- 右侧：推导链 -->
  <rect x="320" y="60" width="176" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="79" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">相邻高度差 ≤ 1（双向）</text>
  <text x="408" y="97" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">h(u) ≤ h(v) + 1</text>

  <path d="M408,110 L408,126" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="130" width="176" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="149" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">沿 d 步最短路到水域：</text>
  <text x="408" y="167" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">h(起点) ≤ 0 + d</text>

  <path d="M408,180 L408,196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="200" width="176" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="219" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">任何合法方案都有</text>
  <text x="408" y="237" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">h ≤ d（逐点封顶）</text>

  <path d="M408,250 L408,266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="270" width="176" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="292" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">BFS 距离矩阵恰好每点取等</text>
  <text x="408" y="312" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">→ 逐点最优 ⇒ 最高高度最大</text>

  <text x="120" y="344" font-size="12.5" fill="#888" filter="url(#rough2)">例中左上角格高度 ≤ 6；BFS 给它恰好 6</text>
</svg>
