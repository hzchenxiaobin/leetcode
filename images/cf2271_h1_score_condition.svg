<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心改写：把「染黑顺序」看成一条时间线</text>
  <path d="M 150 42 Q 380 50 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="68" text-anchor="middle" font-size="12.4" fill="#5a6a7a" filter="url(#rough2)">x、y 视为时刻 0 就已染黑；之后每一步把一个新的点接到时间线末尾</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <path d="M 96 214 L 176 152" stroke="#8a8a8a" stroke-width="1.7" fill="none"/>
    <path d="M 96 214 L 176 276" stroke="#8a8a8a" stroke-width="1.7" fill="none"/>
    <path d="M 176 152 L 256 152" stroke="#8a8a8a" stroke-width="1.7" fill="none"/>
    <path d="M 256 152 L 336 214" stroke="#8a8a8a" stroke-width="1.7" fill="none"/>
    <path d="M 256 152 L 256 74" stroke="#8a8a8a" stroke-width="1.7" fill="none"/>
  </g>
  <circle cx="96" cy="214" r="19" fill="#446688" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <text x="96" y="220" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">x</text>
  <text x="96" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">时刻 0</text>
  <circle cx="176" cy="152" r="17" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="158" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">u</text>
  <circle cx="176" cy="276" r="17" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="282" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">w</text>
  <circle cx="256" cy="152" r="17" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="158" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">v</text>
  <circle cx="256" cy="74" r="17" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="80" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">t</text>
  <circle cx="336" cy="214" r="19" fill="#446688" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="220" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">y</text>
  <text x="336" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">时刻 0</text>

  <!-- 主干标注 -->
  <path d="M 96 306 Q 216 348 336 306" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="352" text-anchor="middle" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">主干：x 到 y 的唯一路径（u、v 是干上的点）</text>

  <!-- 右框：计分条件 -->
  <rect x="404" y="100" width="330" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="124" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">此时 v 有几个已染黑的邻居？</text>
  <text x="418" y="148" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">0 个 → 不得分，且开出一个新的黑连通块</text>
  <text x="418" y="168" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">1 个 → 得 1 分（这就是唯一的得分方式）</text>
  <text x="418" y="188" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">≥2 个 → 不得分，把多个黑块合成一个</text>

  <rect x="404" y="212" width="330" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="236" font-size="12.6" font-weight="bold" fill="#33582a" filter="url(#rough2)">关键：树无环 ⟹ 邻居不同的黑块必不同</text>
  <text x="418" y="260" font-size="11.8" fill="#33582a" filter="url(#rough2)">所以「邻居个数」=「接触到的黑连通块个数」，</text>
  <text x="418" y="280" font-size="11.8" fill="#33582a" filter="url(#rough2)">得分 = 恰好把一个黑块向外扩一圈。</text>

  <rect x="404" y="314" width="330" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="338" font-size="12.6" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">推论：黑块为 1 个时是「冷局面」</text>
  <text x="418" y="360" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">每步都能白拿 1 分 ⟹ 差值只由剩余点数奇偶决定，</text>
  <text x="418" y="378" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">与走法无关 = 剩 m 个白点时值为 m mod 2。</text>
</svg>
