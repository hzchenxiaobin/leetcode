<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：排序后按 q 切两段，绝对值「脱壳」</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">排序后 q 把数组切成「左段 &lt; q」与「右段 ≥ q」，绝对值方向固定 → 前缀和 O(1) 出段和</text>
  <path d="M 150 62 Q 340 70 530 62" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="36" y="86" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">排序后 a = [1, 3, 6, 8]（示例 1）</text>

  <g filter="url(#sk)"><rect x="90" y="94" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="122" y="121" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="240" y="94" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="272" y="121" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="390" y="94" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="422" y="121" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="540" y="94" width="64" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="572" y="121" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">8</text>

  <g filter="url(#sk)"><path d="M 347 80 L 347 260" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 300 66 L 344 74" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/></g>
  <text x="310" y="64" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">q = 5</text>
  <text x="330" y="278" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">切点 pos = 2（严格小于 q 的元素个数）</text>

  <g filter="url(#sk)"><path d="M 122 140 L 122 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)"/></g>
  <text x="132" y="172" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">增大 4</text>
  <text x="132" y="188" font-size="10.5" fill="#777" filter="url(#sk)">|1−5|</text>
  <g filter="url(#sk)"><path d="M 272 140 L 272 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)"/></g>
  <text x="282" y="172" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">增大 2</text>
  <text x="282" y="188" font-size="10.5" fill="#777" filter="url(#sk)">|3−5|</text>
  <g filter="url(#sk)"><path d="M 422 140 L 422 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/></g>
  <text x="432" y="172" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">减小 1</text>
  <text x="432" y="188" font-size="10.5" fill="#777" filter="url(#sk)">|6−5|</text>
  <g filter="url(#sk)"><path d="M 572 140 L 572 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/></g>
  <text x="582" y="172" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">减小 3</text>
  <text x="582" y="188" font-size="10.5" fill="#777" filter="url(#sk)">|8−5|</text>

  <g filter="url(#sk)"><rect x="90" y="222" width="64" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="122" y="249" text-anchor="middle" font-size="14" fill="#446688" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="240" y="222" width="64" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="272" y="249" text-anchor="middle" font-size="14" fill="#446688" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="390" y="222" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="422" y="249" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="540" y="222" width="64" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="572" y="249" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">5</text>

  <text x="36" y="308" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">左段（i &lt; pos）：aᵢ &lt; q，|aᵢ − q| = q − aᵢ（要增大）</text>
  <text x="36" y="328" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">右段（i ≥ pos）：aᵢ ≥ q，|aᵢ − q| = aᵢ − q（要减小）</text>

  <g filter="url(#sk)"><rect x="36" y="344" width="608" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="54" y="364" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">cost(q) = q·pos − pre[pos] ＋ (pre[n] − pre[pos]) − q·(n − pos)</text>
  <text x="54" y="383" font-size="11" fill="#777" filter="url(#sk)">pre[k] = 前 k 小元素之和；两段各自是「个数 × q」与「段和」之差</text>

  <g filter="url(#sk)"><rect x="36" y="402" width="608" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="54" y="426" font-size="11.5" fill="#8a3a36" filter="url(#sk)">注意量纲：q ≤ 10⁹、n ≤ 10⁵ ⇒ q·n 达 10¹⁴，C++ 必须用 long long 存中间量与答案</text>
</svg>
