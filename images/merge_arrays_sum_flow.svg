<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：三分支归并 + 扫尾</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="255" y="50" width="130" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">i=0, j=0, ans=[]</text>
  <path d="M 320 84 L 320 102" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <polygon points="320,108 424,146 320,184 216,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">i &lt; n</text>
  <text x="320" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">且 j &lt; m ?</text>

  <!-- no branch: sweep -->
  <path d="M 424 146 L 454 146" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="438" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3430">否</text>
  <g filter="url(#sk)">
    <rect x="460" y="122" width="168" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="544" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">扫尾：追加未耗尽</text>
  <text x="544" y="158" text-anchor="middle" font-size="11" fill="#a8843a">一侧的剩余整段</text>
  <path d="M 544 170 L 544 182 Q 544 194 558 194 L 606 194 Q 620 194 620 208 L 620 432" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- yes branch -->
  <path d="M 320 184 L 320 220" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="206" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- diamond 2 -->
  <polygon points="320,226 418,270 320,314 222,270" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3430">id₁ ? id₂</text>

  <!-- branch < -->
  <path d="M 222 270 L 196 270" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">&lt;</text>
  <g filter="url(#sk)">
    <rect x="28" y="246" width="164" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="110" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">收 [id₁, v₁]</text>
  <text x="110" y="282" text-anchor="middle" font-size="10.5" fill="#5a7a9a">i 前进一格</text>

  <!-- branch = -->
  <path d="M 320 314 L 320 342" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="334" font-size="13" font-weight="bold" fill="#b85450">=</text>
  <g filter="url(#sk)">
    <rect x="224" y="348" width="192" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3430">收 [id, v₁+v₂]</text>
  <text x="320" y="387" text-anchor="middle" font-size="10.5" fill="#a8605c">i、j 各前进一格</text>

  <!-- branch > -->
  <path d="M 418 270 L 444 270" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">&gt;</text>
  <g filter="url(#sk)">
    <rect x="448" y="246" width="156" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="526" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a22">收 [id₂, v₂]</text>
  <text x="526" y="282" text-anchor="middle" font-size="10.5" fill="#5a8a4e">j 前进一格</text>

  <!-- merge and loop back -->
  <g stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#sk)">
    <path d="M 110 294 L 110 418"/>
    <path d="M 320 400 L 320 418"/>
    <path d="M 526 294 L 526 418"/>
    <path d="M 110 418 L 526 418"/>
  </g>
  <path d="M 110 418 L 22 418 Q 10 418 10 406 L 10 158 Q 10 146 22 146 L 208 146" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="60" y="408" font-size="10.5" fill="#888">回到循环头</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="460" y="438" width="168" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="544" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">返回 ans</text>
  <text x="544" y="474" text-anchor="middle" font-size="10.5" fill="#5a7a9a">（天然按 id 升序）</text>
</svg>
