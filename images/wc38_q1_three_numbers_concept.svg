<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后只剩两个候选</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">乘积 = 符号 × 绝对值；“负负得正”让两个最负的数也有机会入选</text>

  <text x="67" y="72" font-size="10.5" fill="#666" filter="url(#rough2)">nums 升序排序后：</text>

  <g filter="url(#rough2)">
    <rect x="67" y="82" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="129" y="82" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="191" y="82" width="54" height="40" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="5"/>
    <rect x="253" y="82" width="54" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <rect x="315" y="82" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="377" y="82" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="439" y="82" width="54" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="94" y="107">a[0]</text>
    <text x="156" y="107">a[1]</text>
    <text x="218" y="107">a[2]</text>
    <text x="280" y="107">…</text>
    <text x="342" y="107">a[n−3]</text>
    <text x="404" y="107">a[n−2]</text>
    <text x="466" y="107">a[n−1]</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="125" y="140" fill="#b85450">最小的两个</text>
    <text x="466" y="140" fill="#d6a040">最大</text>
  </g>

  <path d="M 94 150 C 100 168, 110 172, 120 178" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 377 150 C 372 166, 366 170, 358 178" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 466 150 C 470 166, 474 170, 478 178" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="184" width="238" height="102" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="206" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">候选 A：两个最负 + 最大</text>
  <text x="56" y="228" font-size="11" fill="#444" filter="url(#rough2)">A = a[0] · a[1] · a[n−1]</text>
  <text x="56" y="248" font-size="10" fill="#666" filter="url(#rough2)">两个负数相乘得到正的大绝对值，</text>
  <text x="56" y="264" font-size="10" fill="#666" filter="url(#rough2)">再乘最大数，把正数放得最大。</text>

  <rect x="292" y="184" width="228" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="308" y="206" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">候选 B：三个最大</text>
  <text x="308" y="228" font-size="11" fill="#444" filter="url(#rough2)">B = a[n−3] · a[n−2] · a[n−1]</text>
  <text x="308" y="248" font-size="10" fill="#666" filter="url(#rough2)">全为非负数时最优；</text>
  <text x="308" y="264" font-size="10" fill="#666" filter="url(#rough2)">全为负数时也是最靠近 0 的三个。</text>

  <path d="M 200 286 L 228 306" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 286 L 350 306" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="312" width="256" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = max(候选 A, 候选 B)</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">其余 C(n,3) 个三元组都不可能超过这两者</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序 O(n log n) + O(1) 次乘法；用「维护最大三个 / 最小两个」可压到 O(n)</text>
  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">边界：n = 3 时两个候选是同一组数（如 [−1,−2,−3] → −6）</text>
</svg>
