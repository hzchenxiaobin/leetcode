<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">n = 13 的逐步走查：每轮先输出 cur，再算后继</text>
  <text x="360" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">步骤 1…7 在左表，8…13 在右表；最后一轮算出的后继不会被读取</text>

  <!-- ============ 左表 ============ -->
  <g filter="url(#rough2)">
    <rect x="10" y="70" width="344" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="30" y="90">步</text>
    <text x="78" y="90">cur</text>
    <text x="206" y="90">决策</text>
    <text x="330" y="90">下一个</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="10" y="100" width="344" height="34" fill="#e6f4ea" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="134" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="168" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="202" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="236" width="344" height="34" fill="#fce4ec" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="270" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="10" y="304" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <text x="30" y="122" text-anchor="middle">1</text>
    <text x="78" y="122" text-anchor="middle" font-weight="bold">1</text>
    <text x="114" y="122">有长子：10 ≤ 13 → 深入</text>
    <text x="330" y="122" text-anchor="middle">10</text>

    <text x="30" y="156" text-anchor="middle">2</text>
    <text x="78" y="156" text-anchor="middle" font-weight="bold">10</text>
    <text x="114" y="156">100 &gt; 13，兄弟 11 ≤ 13</text>
    <text x="330" y="156" text-anchor="middle">11</text>

    <text x="30" y="190" text-anchor="middle">3</text>
    <text x="78" y="190" text-anchor="middle" font-weight="bold">11</text>
    <text x="114" y="190">无长子，取兄弟</text>
    <text x="330" y="190" text-anchor="middle">12</text>

    <text x="30" y="224" text-anchor="middle">4</text>
    <text x="78" y="224" text-anchor="middle" font-weight="bold">12</text>
    <text x="114" y="224">无长子，取兄弟</text>
    <text x="330" y="224" text-anchor="middle">13</text>

    <text x="30" y="258" text-anchor="middle">5</text>
    <text x="78" y="258" text-anchor="middle" font-weight="bold">13</text>
    <text x="114" y="258">14 &gt; 13，回退到 1 再取兄弟</text>
    <text x="330" y="258" text-anchor="middle">2</text>

    <text x="30" y="292" text-anchor="middle">6</text>
    <text x="78" y="292" text-anchor="middle" font-weight="bold">2</text>
    <text x="114" y="292">20 &gt; 13，取兄弟</text>
    <text x="330" y="292" text-anchor="middle">3</text>

    <text x="30" y="326" text-anchor="middle">7</text>
    <text x="78" y="326" text-anchor="middle" font-weight="bold">3</text>
    <text x="114" y="326">无长子，取兄弟</text>
    <text x="330" y="326" text-anchor="middle">4</text>
  </g>

  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <path d="M 54 70 L 54 338"/>
    <path d="M 102 70 L 102 338"/>
    <path d="M 300 70 L 300 338"/>
  </g>

  <!-- ============ 右表 ============ -->
  <g filter="url(#rough2)">
    <rect x="362" y="70" width="344" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="382" y="90">步</text>
    <text x="430" y="90">cur</text>
    <text x="558" y="90">决策</text>
    <text x="682" y="90">下一个</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="362" y="100" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="362" y="134" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="362" y="168" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="362" y="202" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="362" y="236" width="344" height="34" fill="#ffffff" stroke="#d8d8d8" stroke-width="1"/>
    <rect x="362" y="270" width="344" height="34" fill="#fff8e1" stroke="#d8d8d8" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#333">
    <text x="382" y="122" text-anchor="middle">8</text>
    <text x="430" y="122" text-anchor="middle" font-weight="bold">4</text>
    <text x="466" y="122">无长子，取兄弟</text>
    <text x="682" y="122" text-anchor="middle">5</text>

    <text x="382" y="156" text-anchor="middle">9</text>
    <text x="430" y="156" text-anchor="middle" font-weight="bold">5</text>
    <text x="466" y="156">无长子，取兄弟</text>
    <text x="682" y="156" text-anchor="middle">6</text>

    <text x="382" y="190" text-anchor="middle">10</text>
    <text x="430" y="190" text-anchor="middle" font-weight="bold">6</text>
    <text x="466" y="190">无长子，取兄弟</text>
    <text x="682" y="190" text-anchor="middle">7</text>

    <text x="382" y="224" text-anchor="middle">11</text>
    <text x="430" y="224" text-anchor="middle" font-weight="bold">7</text>
    <text x="466" y="224">无长子，取兄弟</text>
    <text x="682" y="224" text-anchor="middle">8</text>

    <text x="382" y="258" text-anchor="middle">12</text>
    <text x="430" y="258" text-anchor="middle" font-weight="bold">8</text>
    <text x="466" y="258">无长子，取兄弟</text>
    <text x="682" y="258" text-anchor="middle">9</text>

    <text x="382" y="292" text-anchor="middle">13</text>
    <text x="430" y="292" text-anchor="middle" font-weight="bold">9</text>
    <text x="466" y="292">末位是 9，已是最后一个</text>
    <text x="682" y="292" text-anchor="middle">结束</text>
  </g>

  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <path d="M 406 70 L 406 304"/>
    <path d="M 454 70 L 454 304"/>
    <path d="M 652 70 L 652 304"/>
  </g>

  <!-- ============ 输出序列 ============ -->
  <text x="32" y="368" font-size="10" fill="#555" filter="url(#rough2)">输出序列（左 → 右）</text>

  <g filter="url(#rough2)">
    <rect x="32" y="376" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="83" y="376" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="134" y="376" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="185" y="376" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="236" y="376" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="287" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="338" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="389" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="440" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="491" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="542" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="593" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="644" y="376" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66">
    <text x="54" y="395">1</text>
    <text x="105" y="395">10</text>
    <text x="156" y="395">11</text>
    <text x="207" y="395">12</text>
    <text x="258" y="395">13</text>
    <text x="309" y="395">2</text>
    <text x="360" y="395">3</text>
    <text x="411" y="395">4</text>
    <text x="462" y="395">5</text>
    <text x="513" y="395">6</text>
    <text x="564" y="395">7</text>
    <text x="615" y="395">8</text>
    <text x="666" y="395">9</text>
  </g>

  <text x="360" y="424" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">绿色 = 节点 1 的子树（先序中连成一段），蓝色 = 根下其余孩子 2…9</text>
  <text x="360" y="443" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">决策列与正文表格一致：先判深入，再判兄弟，都不行才回退</text>
</svg>
