<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1,…,11]、n = 11、x = 3</text>
  <path d="M 205 74 L 125 144" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 205 74 L 290 144" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 125 144 L 75 214" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 125 144 L 172 214" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 144 L 240 214" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 144 L 342 214" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 75 214 L 40 284" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 75 214 L 100 284" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 172 214 L 146 284" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 172 214 L 204 284" stroke="#aaa" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="205" cy="74" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <circle cx="125" cy="144" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="148" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <circle cx="290" cy="144" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="148" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="75" cy="214" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="218" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>
  <circle cx="172" cy="214" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="218" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">5</text>
  <circle cx="240" cy="214" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="218" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">6</text>
  <circle cx="342" cy="214" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="342" y="218" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">7</text>
  <circle cx="40" cy="284" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="288" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">8</text>
  <circle cx="100" cy="284" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="288" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">9</text>
  <circle cx="146" cy="284" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="146" y="288" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">10</text>
  <circle cx="204" cy="284" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="204" y="288" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">11</text>
  <text x="240" y="250" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">l = 1</text>
  <text x="342" y="250" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">r = 1</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">父方区域 8 个</text>
  <rect x="400" y="44" width="256" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="66" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">区域大小（n = 11, x = 3）</text>
  <text x="414" y="90" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">左子树 {6}：l = 1</text>
  <text x="414" y="112" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">右子树 {7}：r = 1</text>
  <text x="414" y="134" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">父方区域：p = 11 − 1 − 1 − 1 = 8</text>
  <rect x="400" y="178" width="256" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="202" text-anchor="start" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">M = max(1, 1, 8) = 8</text>
  <text x="414" y="226" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">⌊n/2⌋ = 5 &lt; 8  ⇒  返回 true</text>
  <rect x="400" y="272" width="256" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="294" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">二号选 y = 2（x 的父节点）</text>
  <text x="414" y="316" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">蓝独占 8 个；红只剩 1、3、6、7</text>
  <text x="414" y="338" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">共 3 个 → 8 > 3，二号必胜</text>
  <text x="414" y="358" text-anchor="start" font-size="10" fill="#8a3a36" filter="url(#rough2)">若误选 6 或 7，仅得 1 个 → 必败</text>
  <text x="340" y="420" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">x = 3 处被红色封死：{6}、{7} 与父方区域三者互不相通</text>
  <text x="340" y="442" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">二号只需挑最大的那块（8 个）独吞，就拿到严格过半的节点</text>
</svg>
