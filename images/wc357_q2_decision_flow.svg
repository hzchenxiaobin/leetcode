<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：先特判 n ≤ 2，再一趟扫描相邻对</text>
  <path d="M 120 38 Q 280 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="195" y="48" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="65" text-anchor="middle" font-size="11" fill="#2b2b2b">读入 nums、m，n = len(nums)</text>
  <path d="M 280 74 L 280 88" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- diamond 1: n <= 2 ? -->
  <g filter="url(#sk)">
    <polygon points="280,88 368,122 280,156 192,122" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">n ≤ 2 ?</text>
  <text x="376" y="114" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 368 122 L 396 122" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="396" y="105" width="118" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="455" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a1e">返回 true</text>
  <text x="455" y="152" text-anchor="middle" font-size="10" fill="#7a7a7a">n = 1：无需任何操作</text>
  <text x="455" y="166" text-anchor="middle" font-size="10" fill="#7a7a7a">n = 2：切成两个长度 1</text>
  <path d="M 280 156 L 280 172" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="292" y="170" font-size="11" fill="#b85450">否</text>

  <!-- i = 0 -->
  <g filter="url(#sk)">
    <rect x="225" y="172" width="110" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="189" text-anchor="middle" font-size="11" fill="#2b2b2b">i = 0</text>
  <path d="M 280 198 L 280 212" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- diamond 2: pair >= m ? -->
  <g filter="url(#sk)">
    <polygon points="280,212 404,248 280,284 156,248" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">nums[i] + nums[i+1] ≥ m ?</text>
  <text x="410" y="240" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 404 248 L 428 248" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="428" y="231" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="478" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a1e">返回 true</text>
  <text x="478" y="280" text-anchor="middle" font-size="10" fill="#7a7a7a">找到锚点对</text>
  <path d="M 280 284 L 280 298" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="292" y="296" font-size="11" fill="#b85450">否</text>

  <!-- diamond 3: more pairs ? -->
  <g filter="url(#sk)">
    <polygon points="280,298 384,332 280,366 176,332" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">i &lt; n − 2 ?</text>
  <text x="162" y="322" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 384 332 L 406 332" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="392" y="324" font-size="11" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="406" y="315" width="134" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="473" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2f2c">返回 false</text>
  <text x="473" y="364" text-anchor="middle" font-size="10" fill="#7a7a7a">所有相邻对之和 &lt; m</text>

  <!-- loop back -->
  <path d="M 176 332 L 126 332 L 126 248 L 152 248" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="116" y="294" text-anchor="end" font-size="10.5" fill="#2b2b2b">i ← i + 1</text>

  <text x="280" y="390" text-anchor="middle" font-size="10.5" fill="#7a7a7a">一趟扫描 i ∈ [0, n−2] 共 n−1 对：时间 O(n)，额外空间 O(1)。</text>
</svg>
