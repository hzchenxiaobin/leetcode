<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：add O(1) 计数，count 枚举同列点</text>
  <path d="M 170 38 Q 350 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left column: add -->
  <text x="155" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">添加：维护频次表</text>
  <g filter="url(#sk)"><rect x="50" y="84" width="210" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="155" y="109" text-anchor="middle" font-size="12.5" fill="#2b2b2b">add([x, y])</text>
  <path d="M 155 124 L 155 148" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="50" y="152" width="210" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="155" y="177" text-anchor="middle" font-size="12.5" fill="#2b2b2b">cnt[x][y] += 1</text>
  <path d="M 155 192 L 155 216" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="50" y="220" width="210" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="155" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">O(1) 副本计数</text>
  <text x="155" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">重复点次数自然累积</text>
  <path d="M 155 282 L 155 306" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="50" y="310" width="210" height="94" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/></g>
  <text x="155" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">频次表（示例）</text>
  <text x="155" y="350" text-anchor="middle" font-size="11.5" fill="#333">(3,10) → 1</text>
  <text x="155" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040">(11,2) → 2</text>
  <text x="155" y="386" text-anchor="middle" font-size="11.5" fill="#333">(3,2) → 1</text>
  <g filter="url(#sk)"><rect x="50" y="438" width="210" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="155" y="460" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">单次 count 开销</text>
  <text x="155" y="480" text-anchor="middle" font-size="11.5" fill="#7a5415">O(同列点数) ≤ O(n)</text>

  <!-- connector -->
  <path d="M 260 344 C 298 344 292 160 330 152" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- right column: count -->
  <text x="480" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">查询：枚举同列点</text>
  <g filter="url(#sk)"><rect x="330" y="60" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="480" y="85" text-anchor="middle" font-size="12.5" fill="#2b2b2b">count([px, py])</text>
  <path d="M 480 100 L 480 122" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="126" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="480" y="146" text-anchor="middle" font-size="12" fill="#2b2b2b">查同列映射 cnt[px]：y → ny</text>
  <text x="480" y="163" text-anchor="middle" font-size="10.5" fill="#557799">（同列无点 → 直接返回 0）</text>
  <path d="M 480 170 L 480 194" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><polygon points="480,202 576,232 480,262 384,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="480" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">y == py ?</text>
  <path d="M 576 232 L 596 232" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="582" y="224" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)"><rect x="598" y="214" width="90" height="36" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="643" y="237" text-anchor="middle" font-size="11" fill="#b85450">跳过 d = 0</text>
  <path d="M 480 262 L 480 286" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="490" y="279" font-size="11" fill="#4a7a3a">否</text>
  <g filter="url(#sk)"><rect x="330" y="290" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="480" y="315" text-anchor="middle" font-size="12.5" fill="#2b2b2b">d = |y − py|（垂直边长）</text>
  <path d="M 480 330 L 480 352" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="356" width="300" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="480" y="376" text-anchor="middle" font-size="11.5" fill="#2b2b2b">朝右：ans += ny·cnt[px+d][py]·cnt[px+d][y]</text>
  <text x="480" y="394" text-anchor="middle" font-size="10.5" fill="#4a7a3a">x = px + d 处的另外两角</text>
  <path d="M 480 404 L 480 426" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="430" width="300" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="480" y="450" text-anchor="middle" font-size="11.5" fill="#2b2b2b">朝左：ans += ny·cnt[px−d][py]·cnt[px−d][y]</text>
  <text x="480" y="468" text-anchor="middle" font-size="10.5" fill="#4a7a3a">x = px − d 处的另外两角</text>
  <path d="M 480 478 L 480 500" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="504" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="480" y="526" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">枚举完所有 y → 返回 ans</text>
</svg>
