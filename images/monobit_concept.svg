<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：正的单比特数 = 全 1 数</text>
  <path d="M 160 42 Q 320 52 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- reasoning chain -->
  <g filter="url(#sk)">
    <rect x="50" y="60" width="150" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="125" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e">正数无前导零</text>
  <path d="M 205 83 L 235 83" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="245" y="60" width="150" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e">最高位必为 1</text>
  <path d="M 400 83 L 430 83" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="440" y="60" width="160" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="520" y="81" text-anchor="middle" font-size="13" fill="#2b6e9e">位全相同</text>
  <text x="520" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⟹ 全是 1</text>

  <!-- repunit row -->
  <text x="320" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">全 1 数（repunit）：每步 x ← 2x + 1，末尾追加一个 1</text>
  <g>
    <g filter="url(#sk)">
      <rect x="48" y="154" width="64" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    </g>
    <text x="80" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
    <text x="80" y="197" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">= 1</text>
    <path d="M 116 181 L 142 181" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
    <g filter="url(#sk)">
      <rect x="148" y="154" width="64" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    </g>
    <text x="180" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">11</text>
    <text x="180" y="197" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">= 3</text>
    <path d="M 216 181 L 242 181" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
    <g filter="url(#sk)">
      <rect x="248" y="154" width="64" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    </g>
    <text x="280" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">111</text>
    <text x="280" y="197" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">= 7</text>
    <path d="M 316 181 L 342 181" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
    <g filter="url(#sk)">
      <rect x="348" y="154" width="64" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    </g>
    <text x="380" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">1111</text>
    <text x="380" y="197" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">= 15</text>
    <path d="M 416 181 L 442 181" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
    <g filter="url(#sk)">
      <rect x="448" y="154" width="72" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    </g>
    <text x="484" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">11111</text>
    <text x="484" y="197" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">= 31</text>
    <text x="556" y="187" text-anchor="middle" font-size="16" fill="#666" filter="url(#sk)">⋯</text>
  </g>

  <!-- counter examples -->
  <text x="320" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">反例（位不全相同，最高位是 1 但混入了 0）</text>
  <g filter="url(#sk)">
    <rect x="48" y="254" width="120" height="42" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="108" y="273" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">10</text>
  <text x="108" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">= 2 ✗</text>
  <g filter="url(#sk)">
    <rect x="188" y="254" width="120" height="42" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="248" y="273" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">100</text>
  <text x="248" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">= 4 ✗</text>
  <g filter="url(#sk)">
    <rect x="328" y="254" width="120" height="42" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="388" y="273" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">101</text>
  <text x="388" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">= 5 ✗</text>
  <g filter="url(#sk)">
    <rect x="468" y="254" width="120" height="42" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="528" y="273" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace">110</text>
  <text x="528" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">= 6 ✗</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="314" width="560" height="58" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="338" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">[0, n] 内的单比特数 = { 0 } ∪ { 2^k − 1 ≤ n }</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">0, 1, 3, 7, 15, 31, 63, ⋯</text>

  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0 的二进制是 "0"，只有一个位，天然单比特 → 直接计入答案。</text>
</svg>
