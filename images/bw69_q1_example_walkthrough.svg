<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：title = "First leTTeR of EACH Word"</text>

  <!-- 五个单词的处理 -->
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="70" y="66">单词</text>
    <text x="70" y="96">长度</text>
    <text x="70" y="126">适用规则</text>
    <text x="70" y="156">规范化后</text>
  </g>

  <!-- First -->
  <g filter="url(#rough2)">
    <rect x="120" y="48" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="158" y="67" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">First</text>
  <text x="158" y="96" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="158" y="126" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">≥ 3，规则二</text>
  <g filter="url(#rough2)">
    <rect x="120" y="136" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="158" y="155" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">First</text>

  <!-- leTTeR -->
  <g filter="url(#rough2)">
    <rect x="208" y="48" width="76" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="246" y="67" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">leTTeR</text>
  <text x="246" y="96" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">6</text>
  <text x="246" y="126" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">≥ 3，规则二</text>
  <g filter="url(#rough2)">
    <rect x="208" y="136" width="76" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="246" y="155" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">Letter</text>

  <!-- of -->
  <g filter="url(#rough2)">
    <rect x="296" y="48" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="324" y="67" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">of</text>
  <text x="324" y="96" font-size="12.5" fill="#b85450" font-weight="bold" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="324" y="126" font-size="11.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">≤ 2，规则一</text>
  <g filter="url(#rough2)">
    <rect x="296" y="136" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="324" y="155" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">of</text>

  <!-- EACH -->
  <g filter="url(#rough2)">
    <rect x="364" y="48" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="396" y="67" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">EACH</text>
  <text x="396" y="96" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="396" y="126" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">≥ 3，规则二</text>
  <g filter="url(#rough2)">
    <rect x="364" y="136" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="396" y="155" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">Each</text>

  <!-- Word -->
  <g filter="url(#rough2)">
    <rect x="440" y="48" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="472" y="67" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">Word</text>
  <text x="472" y="96" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="472" y="126" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">≥ 3，规则二</text>
  <g filter="url(#rough2)">
    <rect x="440" y="136" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="472" y="155" font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">Word</text>

  <!-- 汇合箭头 -->
  <path d="M 280 170 C 280 200, 280 205, 280 218" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="110" y="225" width="340" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10"/>
  </g>
  <text x="280" y="245" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">"First Letter of Each Word"</text>
  <text x="280" y="263" font-size="11.5" fill="#666" text-anchor="middle" filter="url(#rough2)">空格位置不动，只有 "of" 被整词压成小写</text>

  <text x="280" y="308" font-size="12.5" fill="#666" text-anchor="middle" filter="url(#rough2)">易错点：长度 2 的 "of" 首字母也不能大写；长度 ≥ 3 的单词中间字母必须小写</text>
</svg>
