<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：三组走查</text>

  <!-- ============ 段 1：正数 665 + 6 ============ -->
  <text x="66" y="62" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 正数 n = "665", x = 6 —— 跳过 ≥ 6，找首个 &lt; 6</text>

  <text x="145" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">跳过 (6≥6)</text>
  <text x="193" y="80" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">跳过 (6≥6)</text>
  <text x="241" y="80" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">停！5&lt;6</text>

  <rect x="125" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="173" y="86" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="221" y="86" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="145" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="193" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <text x="66" y="156" font-size="12" fill="#333" filter="url(#rough2)">→ 插在下标 2 前："66" + <tspan font-weight="bold" fill="#b85450">"6"</tspan> + "5" = <tspan font-weight="bold" fill="#b85450">"6665"</tspan></text>
  <text x="66" y="178" font-size="10.5" fill="#999" filter="url(#rough2)">R0 = R1 = R2 = "6665"（= 打平，停在哪都无损），R3 = "6656" 最小</text>

  <!-- ============ 段 2：负数 -13 + 2 ============ -->
  <text x="66" y="210" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 负数 n = "-13", x = 2 —— 跳过负号与 ≤ 2，找首个 &gt; 2</text>

  <text x="145" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点 i=1</text>
  <text x="193" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">跳过 (1≤2)</text>
  <text x="241" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">停！3&gt;2</text>

  <rect x="125" y="234" width="40" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="254" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">-</text>
  <rect x="173" y="234" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="221" y="234" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="145" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-</text>
  <text x="193" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="278" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <text x="66" y="304" font-size="12" fill="#333" filter="url(#rough2)">→ 插在下标 2 前："-1" + <tspan font-weight="bold" fill="#b85450">"2"</tspan> + "3" = <tspan font-weight="bold" fill="#b85450">"-123"</tspan></text>
  <text x="66" y="326" font-size="10.5" fill="#999" filter="url(#rough2)">候选对照：-213 &lt; -123 &gt; -132，-123 的绝对值最小、数值最大</text>

  <!-- ============ 段 3：负数全打平 -55 + 5 ============ -->
  <text x="66" y="358" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 负数全打平 n = "-55", x = 5 —— 全 ≤ 5 跳过，落空追加</text>

  <text x="145" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点 i=1</text>
  <text x="193" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">跳过 (5≤5)</text>
  <text x="241" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">跳过 (5≤5)</text>

  <rect x="125" y="382" width="40" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="402" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">-</text>
  <rect x="173" y="382" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="402" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="221" y="382" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="402" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="145" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">-</text>
  <text x="193" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="241" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <text x="66" y="450" font-size="12" fill="#333" filter="url(#rough2)">→ 扫描落空，末尾追加："-55" + <tspan font-weight="bold" fill="#b85450">"5"</tspan> = <tspan font-weight="bold" fill="#b85450">"-555"</tspan></text>
  <text x="66" y="471" font-size="10.5" fill="#999" filter="url(#rough2)">四个插入位置结果全为 "-555"（d = x 的位停不停结果相同）</text>
</svg>
