<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">子段和 ≡ 0 (mod k)  ⟺  两个前缀和同余</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">例：k = 2，a = [2, 1, 3, 1, 4]，n = 5</text>

  <text x="168" y="85" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">a =</text>

  <g filter="url(#rough2)">
    <rect x="180" y="64" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="204" y="85" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
    <rect x="232" y="64" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="256" y="85" text-anchor="middle" font-size="13" fill="#3a4a66">1</text>
    <rect x="284" y="64" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="308" y="85" text-anchor="middle" font-size="13" fill="#3a4a66">3</text>
    <rect x="336" y="64" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="360" y="85" text-anchor="middle" font-size="13" fill="#3a4a66">1</text>
    <rect x="388" y="64" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="412" y="85" text-anchor="middle" font-size="13" fill="#3a4a66">4</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#a0a0a0" text-anchor="middle">
    <text x="204" y="110">1</text>
    <text x="256" y="110">2</text>
    <text x="308" y="110">3</text>
    <text x="360" y="110">4</text>
    <text x="412" y="110">5</text>
  </g>

  <text x="310" y="132" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">前缀和 P_i = a₁ + … + a_i（P₀ = 0）</text>

  <g filter="url(#rough2)">
    <circle cx="70" cy="180" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="70" y="185" text-anchor="middle" font-size="13" fill="#3a4a66">0</text>
    <text x="70" y="152" text-anchor="middle" font-size="9" fill="#888">i=0, P=0</text>

    <circle cx="166" cy="180" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="166" y="185" text-anchor="middle" font-size="13" fill="#3a4a66">0</text>
    <text x="166" y="152" text-anchor="middle" font-size="9" fill="#888">i=1, P=2</text>

    <circle cx="262" cy="180" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="262" y="185" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
    <text x="262" y="152" text-anchor="middle" font-size="9" fill="#888">i=2, P=3</text>

    <circle cx="358" cy="180" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="358" y="185" text-anchor="middle" font-size="13" fill="#3a4a66">0</text>
    <text x="358" y="152" text-anchor="middle" font-size="9" fill="#888">i=3, P=6</text>

    <circle cx="454" cy="180" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="454" y="185" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
    <text x="454" y="152" text-anchor="middle" font-size="9" fill="#888">i=4, P=7</text>

    <circle cx="550" cy="180" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="550" y="185" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
    <text x="550" y="152" text-anchor="middle" font-size="9" fill="#888">i=5, P=11</text>
  </g>

  <path d="M 70 197 Q 214 268 356 194" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 262 197 Q 406 288 548 194" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="186" y="252" font-size="10" fill="#4a7a3a" filter="url(#rough2)">距离 3 &gt; k = 2</text>
  <text x="392" y="276" font-size="10" fill="#b85450" filter="url(#rough2)">距离 3 &gt; k = 2</text>

  <text x="40" y="302" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① (i,j)=(0,3)：P₀≡P₃，j−i=3&gt;2 ⇒ a₁..a₃ = [2,1,3] 合法</text>
  <text x="40" y="324" font-size="11" fill="#b85450" filter="url(#rough2)">② (i,j)=(2,5)：P₂≡P₅，j−i=3&gt;2 ⇒ a₃..a₅ = [3,1,4] 合法</text>

  <text x="40" y="350" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">计数条件：i &lt; j，P_i ≡ P_j (mod k)，j − i &gt; k</text>
  <text x="40" y="374" font-size="10.5" fill="#777" filter="url(#rough2)">长度 &gt; k 等价于「前缀下标相距 &gt; k」，因此把找子段变成数同余下标对</text>
</svg>
