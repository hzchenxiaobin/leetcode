<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 314"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="314" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">三个示例：四个量一算就出答案</text>
  <rect x="46" y="58" width="170" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="226" y="58" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">total</text>
  <rect x="316" y="58" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">best</text>
  <rect x="416" y="58" width="100" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">worst</text>
  <rect x="526" y="58" width="120" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="79.96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">max(best, total−worst)</text>
  <rect x="46" y="102" width="170" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[5,-3,5]</text>
  <rect x="226" y="102" width="80" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="316" y="102" width="90" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="416" y="102" width="100" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="526" y="102" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="126.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="46" y="150" width="170" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[-3,-2,-3]</text>
  <rect x="226" y="150" width="80" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−8</text>
  <rect x="316" y="150" width="90" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="416" y="150" width="100" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−8</text>
  <rect x="526" y="150" width="120" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="174.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="46" y="198" width="170" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,-2,2,-3]</text>
  <rect x="226" y="198" width="80" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="316" y="198" width="90" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="416" y="198" width="100" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="526" y="198" width="120" height="40" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="294" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第二行全负时 best = −2 &lt; 0，走特殊分支，不能用 total − worst（会得 0）</text>
</svg>
