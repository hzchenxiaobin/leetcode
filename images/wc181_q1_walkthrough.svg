<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="484" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,4,0]，index = [0,1,2,3,0]</text>
  <text x="320" y="40" text-anchor="middle" font-size="10.5" fill="#888">红 = 新插入　蓝 = 不动　橙 = 被挤开右移</text>

  <!-- 表头 -->
  <rect x="30" y="52" width="580" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">步骤</text>
  <text x="120" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">nums[i]</text>
  <text x="188" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">index[i]</text>
  <text x="330" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">插入后 target</text>

  <!-- 行 0：insert 1 @ 0 -->
  <rect x="30" y="82" width="580" height="38" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">0</text>
  <rect x="100" y="88" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">1</text>
  <rect x="168" y="88" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">0</text>
  <rect x="240" y="86" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>

  <!-- 行 1：insert 2 @ 1 -->
  <rect x="30" y="124" width="580" height="38" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <rect x="100" y="130" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">2</text>
  <rect x="168" y="130" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">1</text>
  <rect x="240" y="128" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>
  <rect x="286" y="128" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="306" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>

  <!-- 行 2：insert 3 @ 2 -->
  <rect x="30" y="166" width="580" height="38" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <rect x="100" y="172" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">3</text>
  <rect x="168" y="172" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">2</text>
  <rect x="240" y="170" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>
  <rect x="286" y="170" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="306" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">2</text>
  <rect x="332" y="170" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="352" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>

  <!-- 行 3：insert 4 @ 3 -->
  <rect x="30" y="208" width="580" height="38" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <rect x="100" y="214" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">4</text>
  <rect x="168" y="214" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">3</text>
  <rect x="240" y="212" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">1</text>
  <rect x="286" y="212" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="306" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">2</text>
  <rect x="332" y="212" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="352" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">3</text>
  <rect x="378" y="212" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="398" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4</text>

  <!-- 行 4：insert 0 @ 0（关键行） -->
  <rect x="30" y="250" width="580" height="38" rx="4" fill="#fdf0f2" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <rect x="100" y="256" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">0</text>
  <rect x="168" y="256" width="40" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07828">0</text>
  <rect x="240" y="254" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">0</text>
  <rect x="286" y="254" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="306" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">1</text>
  <rect x="332" y="254" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="352" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">2</text>
  <rect x="378" y="254" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="398" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">3</text>
  <rect x="424" y="254" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="444" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828">4</text>
  <text x="478" y="266" font-size="9.5" fill="#b85450">插在缝隙 0：</text>
  <text x="478" y="280" font-size="9.5" fill="#b85450">1..4 全体右移</text>

  <!-- 结果 -->
  <path d="M 320 292 V 306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <rect x="140" y="310" width="380" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">最终 target = [0, 1, 2, 3, 4]</text>
  <text x="330" y="362" text-anchor="middle" font-size="10" fill="#888">后插的 0 反超到最前 —— 「挤开」的直观体现</text>

  <!-- 最坏情形 -->
  <text x="320" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444">自拟 · 最坏情形：index 全 0 —— 每步插头部、满额搬移，结果逆序</text>

  <rect x="44" y="402" width="24" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>
  <path d="M 72 415 H 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <rect x="100" y="402" width="24" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">2</text>
  <rect x="127" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="139" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828">1</text>
  <path d="M 155 415 H 177" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <rect x="183" y="402" width="24" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">3</text>
  <rect x="210" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828">2</text>
  <rect x="237" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="249" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828">1</text>
  <path d="M 265 415 H 287" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

  <rect x="293" y="402" width="24" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">4</text>
  <rect x="320" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="332" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828">3</text>
  <rect x="347" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="359" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07828">2</text>
  <rect x="374" y="402" width="24" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
