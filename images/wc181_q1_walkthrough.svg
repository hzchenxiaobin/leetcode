  <rect x="60" y="444" width="520" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="461" text-anchor="middle" font-size="10.5" fill="#446688">每步搬移 i 个元素，总搬移 Σi = n(n−1)/2 = O(n²)；n = 100 时约 4950 次，毫秒级稳过</text>
</svg>
