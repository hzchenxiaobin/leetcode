  <text x="330" y="358" font-size="10" fill="#555" filter="url(#rough2)">min(9, 14) = 9，与官方答案一致</text>

  <text x="310" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">∞ 表示不可达；k &gt; i 时必然不可达，循环里可提前收窄 k ≤ i</text>
