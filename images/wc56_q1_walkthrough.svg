<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：指针跳跃与字符分组</text>

  <text x="48" y="58" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1　bits = [1,0,0] → true</text>

  <g filter="url(#rough2)">
    <text x="69" y="80" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="117" y="80" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="165" y="80" text-anchor="middle" font-size="9" fill="#999">2</text>

    <rect x="48" y="86" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="69" y="112" text-anchor="middle" font-size="16" fill="#3a4a66">1</text>
    <rect x="96" y="86" width="42" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="117" y="112" text-anchor="middle" font-size="16" fill="#3a4a66">0</text>
    <rect x="144" y="86" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="165" y="112" text-anchor="middle" font-size="16" fill="#8a5a10">0</text>

    <rect x="46" y="132" width="94" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="93" y="146" text-anchor="middle" font-size="10" fill="#3a5a30">10 两比特</text>
    <rect x="142" y="132" width="46" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="165" y="146" text-anchor="middle" font-size="10" fill="#8a5a10">0 单独</text>

    <text x="210" y="104" font-size="10.5" fill="#555">i: 0 → 2</text>
    <text x="210" y="124" font-size="10.5" fill="#555">i = 2 = n-1</text>
    <text x="210" y="144" font-size="10.5" fill="#4a7a3a">末位 0 单独成字 → true</text>
  </g>

  <text x="48" y="196" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2　bits = [1,1,1,0] → false</text>

  <g filter="url(#rough2)">
    <text x="69" y="218" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="117" y="218" text-anchor="middle" font-size="9" fill="#999">1</text>
    <text x="165" y="218" text-anchor="middle" font-size="9" fill="#999">2</text>
    <text x="213" y="218" text-anchor="middle" font-size="9" fill="#999">3</text>

    <rect x="48" y="224" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="69" y="250" text-anchor="middle" font-size="16" fill="#3a4a66">1</text>
    <rect x="96" y="224" width="42" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="117" y="250" text-anchor="middle" font-size="16" fill="#3a4a66">1</text>
    <rect x="144" y="224" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="165" y="250" text-anchor="middle" font-size="16" fill="#3a4a66">1</text>
    <rect x="192" y="224" width="42" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="213" y="250" text-anchor="middle" font-size="16" fill="#8a3030">0</text>

    <rect x="46" y="270" width="94" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="93" y="284" text-anchor="middle" font-size="10" fill="#3a5a30">11 两比特</text>
    <rect x="142" y="270" width="94" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <text x="189" y="284" text-anchor="middle" font-size="10" fill="#8a3030">10 两比特</text>

    <text x="246" y="242" font-size="10.5" fill="#555">i: 0 → 2 → 4</text>
    <text x="246" y="262" font-size="10.5" fill="#555">i = 4 = n，越过末位</text>
    <text x="246" y="282" font-size="10.5" fill="#8a3030">末位 0 被 1 拼走 → false</text>
  </g>

  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">结局只有两种：停在末位 0 上返回 true，越过它返回 false</text>
  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">指针不会停在中间位置 —— 因为 bits 恒以 0 结尾，且移动只在 i &lt; n-1 时发生</text>
</svg>
