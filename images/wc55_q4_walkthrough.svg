<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例逐步演算：区间表的 6 次状态变化</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">删除只切掉 [14, 16)，左右两段保留；之后的查询都靠「覆盖 left 的那一段」判定</text>

  <!-- 表头 -->
  <rect x="40" y="66" width="560" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="90" y="88" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">调用</text>
  <text x="330" y="88" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">区间表（有序、互不相接）</text>
  <text x="530" y="88" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回</text>

  <!-- 行 0 -->
  <rect x="40" y="100" width="560" height="44" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="127" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="90" y="127" font-size="10.5" fill="#444" filter="url(#rough2)">RangeModule()</text>
  <text x="330" y="127" font-size="10.5" fill="#444" filter="url(#rough2)">{}</text>
  <text x="530" y="127" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 1 -->
  <rect x="40" y="144" width="560" height="44" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="90" y="171" font-size="10.5" fill="#444" filter="url(#rough2)">addRange(10, 20)</text>
  <text x="330" y="171" font-size="10.5" fill="#444" filter="url(#rough2)">{[10, 20)}</text>
  <text x="530" y="171" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 2：removeRange，橙色高亮 -->
  <rect x="40" y="188" width="560" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="215" text-anchor="middle" font-size="10.5" fill="#6a5220" filter="url(#rough2)">2</text>
  <text x="90" y="215" font-size="10.5" fill="#6a5220" filter="url(#rough2)">removeRange(14, 16)</text>
  <text x="330" y="215" font-size="10.5" fill="#6a5220" filter="url(#rough2)">{[10, 14), [16, 20)}</text>
  <text x="530" y="215" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 3：true -->
  <rect x="40" y="232" width="560" height="44" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="259" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="90" y="259" font-size="10.5" fill="#444" filter="url(#rough2)">queryRange(10, 14)</text>
  <text x="330" y="259" font-size="10.5" fill="#444" filter="url(#rough2)">{[10, 14), [16, 20)}</text>
  <text x="530" y="259" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行 4：false -->
  <rect x="40" y="276" width="560" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="303" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="90" y="303" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">queryRange(13, 15)</text>
  <text x="330" y="303" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">{[10, 14), [16, 20)}</text>
  <text x="530" y="303" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行 5：true -->
  <rect x="40" y="320" width="560" height="44" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="347" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="90" y="347" font-size="10.5" fill="#444" filter="url(#rough2)">queryRange(16, 17)</text>
  <text x="330" y="347" font-size="10.5" fill="#444" filter="url(#rough2)">{[10, 14), [16, 20)}</text>
  <text x="530" y="347" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 判定依据 -->
  <text x="45" y="390" font-size="9.5" fill="#666" filter="url(#rough2)">判定依据：覆盖 10 的是 [10,14)：14 ≥ 14 → true；覆盖 16 的是 [16,20)：20 ≥ 17 → true</text>
  <text x="45" y="404" font-size="9.5" fill="#666" filter="url(#rough2)">覆盖 13 的仍是 [10,14)：14 &lt; 15，缺口 [14,16) 未被跟踪 → false</text>

  <rect x="45" y="414" width="550" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="432" font-size="10" fill="#3a5a30" filter="url(#rough2)">每一步后都保持「有序 + 不相接」，故单个前驱区间即可回答整次查询。</text>
</svg>
