<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n ≤ 10 → 2^n 个保留掩码，逐个 Floyd 判定</text>

  <!-- 步骤 1 -->
  <rect x="120" y="46" width="320" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12.5" fill="#28415e" filter="url(#rough2)">① 枚举 open 掩码</text>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">（第 i 位 = 1 表示分部 i 保留）</text>

  <path d="M280,88 L280,108" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="105" y="110" width="350" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">② 建邻接矩阵：d[i][i]=0，其余 INF</text>
  <text x="280" y="148" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">只收两端都保留的道路，重边取最小权</text>

  <path d="M280,158 L280,178" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="105" y="180" width="350" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">③ Floyd：只用「保留点」作中转 k</text>
  <text x="280" y="218" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">d[i][j] ← min(d[i][j], d[i][k] + d[k][j])</text>

  <path d="M280,228 L280,248" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：判定 -->
  <polygon points="280,250 400,288 280,326 160,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12.5" fill="#7a3030" filter="url(#rough2)">所有保留点对</text>
  <text x="280" y="300" text-anchor="middle" font-size="12.5" fill="#7a3030" filter="url(#rough2)">d[i][j] ≤ maxDistance ？</text>

  <path d="M400,288 L465,288 L465,46" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="278" font-size="12" fill="#1c3a1c" filter="url(#rough2)">是</text>
  <rect x="440" y="330" width="100" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="355" text-anchor="middle" font-size="13" fill="#1c3a1c" filter="url(#rough2)">ans += 1</text>
  <path d="M465,288 L465,332" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M160,288 L60,288 L60,67 L116,67" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="278" font-size="12" fill="#b85450" filter="url(#rough2)">否（INF 也算否）</text>

  <rect x="70" y="348" width="330" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="363" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">剩 0 个或 1 个分部：没有点对要检查</text>
  <text x="235" y="381" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">→ 全关 / 只剩一个点恒合法，别漏！</text>
</svg>
