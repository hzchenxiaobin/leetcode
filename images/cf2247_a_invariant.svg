<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    一次操作：相邻两数同时取反 ⇒ 和只变化 4 的倍数
  </text>

  <text x="72" y="124" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">操作前</text>

  <rect x="110" y="96" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="96" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="96" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="302" y="96" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="96" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="138" y="125" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="202" y="125" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="266" y="125" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="125" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="394" y="125" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>

  <rect x="452" y="90" width="132" height="56" rx="8" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="518" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = -1</text>
  <text x="518" y="132" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">s mod 4 = 3</text>

  <path d="M234,148 C230,180 238,192 234,214" fill="none" stroke="#b85450"
        stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="190" font-size="13" fill="#b85450" filter="url(#rough2)">翻转 a₂, a₃</text>

  <text x="72" y="252" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">操作后</text>

  <rect x="110" y="224" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="224" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="224" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="302" y="224" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="224" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="138" y="253" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="202" y="253" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="266" y="253" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="330" y="253" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="394" y="253" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>

  <rect x="452" y="218" width="132" height="56" rx="8" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="518" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = -5</text>
  <text x="518" y="260" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">s mod 4 = 3</text>

  <rect x="48" y="296" width="524" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    取反的两数之和 ∈ {-2, 0, 2}，故 Δs = -2(aᵢ + aᵢ₊₁) ∈ {+4, 0, -4}
  </text>
  <text x="310" y="344" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">
    结论：s mod 4 是操作不变量，答案只能由它决定
  </text>
</svg>
