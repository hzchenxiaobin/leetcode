<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[1..9]，K=5 的二分轨迹</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">lo = 1（最小块），hi = 45 ÷ 6 = 7（鸽巢上界）</text>

  <g filter="url(#rough2)">
    <rect x="26" y="56" width="508" height="52" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
    <rect x="26" y="108" width="508" height="52" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
    <rect x="26" y="160" width="508" height="52" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="40" y="76" fill="#3a4a66" font-weight="bold">区间</text>
    <text x="130" y="76" fill="#3a4a66" font-weight="bold">mid</text>
    <text x="200" y="76" fill="#3a4a66" font-weight="bold">贪心切段（首次达到 mid 即落刀）</text>
    <text x="480" y="76" fill="#3a4a66" font-weight="bold">段数 ≥6?</text>

    <text x="40" y="96" fill="#333">[1,7]</text>
    <text x="130" y="96" fill="#333">4</text>
    <text x="200" y="96" fill="#333">1+2+3 ∥ 4+5 ∥ 6 ∥ 7 ∥ 8 ∥ 9</text>
    <text x="484" y="96" fill="#3a5a30" font-weight="bold">6 是 ✓</text>

    <text x="40" y="128" fill="#333">[4,7]</text>
    <text x="130" y="128" fill="#333">6</text>
    <text x="200" y="128" fill="#333">1+2+3 ∥ 4+5 ∥ 6 ∥ 7 ∥ 8 ∥ 9</text>
    <text x="484" y="128" fill="#3a5a30" font-weight="bold">6 是 ✓</text>

    <text x="40" y="180" fill="#333">[6,7]</text>
    <text x="130" y="180" fill="#333">7</text>
    <text x="200" y="180" fill="#333">1+2+3+4 ∥ 5+6 ∥ 7 ∥ 8 ∥ 9</text>
    <text x="484" y="180" fill="#b85450" font-weight="bold">5 否 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="226" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="250" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">hi = 6 = lo → 返回 6 ✓</text>

  <rect x="46" y="282" width="468" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">x=6 与 x=4 贪心切法恰好相同：阈值压低不解锁新切法，</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#8a6a20">二分找的正是「贪心还能挤出 K+1 段」的最大阈值</text>
</svg>
