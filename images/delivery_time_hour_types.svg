<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 385"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="385" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：1..T 中的小时只有四种类型</text>
  <path d="M 170 42 Q 330 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="66" text-anchor="middle" font-size="13" fill="#555">例：r₁ = 2，r₂ = 3，L = lcm(r₁, r₂) = 6</text>

  <!-- hour cells -->
  <g filter="url(#sk)">
    <rect x="70"  y="82" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="136" y="82" width="58" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="202" y="82" width="58" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="268" y="82" width="58" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="334" y="82" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="400" y="82" width="58" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="466" y="82" width="58" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="532" y="82" width="58" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="99"  y="109">1</text>
    <text x="165" y="109">2</text>
    <text x="231" y="109">3</text>
    <text x="297" y="109">4</text>
    <text x="363" y="109">5</text>
    <text x="429" y="109">6</text>
    <text x="495" y="109">7</text>
    <text x="561" y="109">8</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="99"  y="142" fill="#2e5e22">双可用</text>
    <text x="165" y="142" fill="#a06a10">仅机 2</text>
    <text x="231" y="142" fill="#2b4a6e">仅机 1</text>
    <text x="297" y="142" fill="#a06a10">仅机 2</text>
    <text x="363" y="142" fill="#2e5e22">双可用</text>
    <text x="429" y="142" fill="#8e3a34" font-weight="bold">双充电</text>
    <text x="495" y="142" fill="#2e5e22">双可用</text>
    <text x="561" y="142" fill="#a06a10">仅机 2</text>
  </g>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="62"  y="162" width="13" height="13" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="192" y="162" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="162" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="452" y="162" width="13" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="81"  y="173">C：两机都能送</text>
    <text x="211" y="173">A：仅机 1 能送</text>
    <text x="341" y="173">B：仅机 2 能送</text>
    <text x="471" y="173">D：双双充电·浪费</text>
  </g>

  <!-- counting boxes -->
  <g filter="url(#sk)">
    <rect x="40"  y="196" width="188" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="236" y="196" width="188" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="432" y="196" width="188" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="134" y="216" font-size="12" font-weight="bold" fill="#2b4a6e">机 1 的可用小时</text>
    <text x="134" y="236" font-size="13" fill="#2b4a6e">T − ⌊T/r₁⌋</text>
    <text x="330" y="216" font-size="12" font-weight="bold" fill="#7a5415">机 2 的可用小时</text>
    <text x="330" y="236" font-size="13" fill="#7a5415">T − ⌊T/r₂⌋</text>
    <text x="526" y="216" font-size="12" font-weight="bold" fill="#2e5e22">至少一架可用</text>
    <text x="526" y="236" font-size="13" fill="#2e5e22">T − ⌊T/L⌋</text>
  </g>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="90" y="262" width="480" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="330" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3a34">前缀 1..T 可行 ⟺ 三个不等式同时成立</text>
  <text x="330" y="312" text-anchor="middle" font-size="12.5" fill="#8e3a34">T−⌊T/r₁⌋ ≥ d₁　　T−⌊T/r₂⌋ ≥ d₂　　T−⌊T/L⌋ ≥ d₁+d₂</text>
  <text x="330" y="334" text-anchor="middle" font-size="11" fill="#a05a54">（Hall 条件：各自容量够 + 合并容量够 ⟹ 必有互不冲突的安排）</text>

  <text x="330" y="370" text-anchor="middle" font-size="10.5" fill="#888">关键：只有 L = lcm(r₁, r₂) 的倍数小时才两机同时充电、整小时浪费</text>
</svg>
