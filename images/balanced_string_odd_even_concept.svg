<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：下标奇偶 → 天然二分桶</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- string cells: 24123 -->
  <g filter="url(#rough2)">
    <rect x="188" y="58" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="58" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="296" y="58" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="350" y="58" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="404" y="58" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" filter="url(#rough2)">
    <text x="212" y="80" fill="#34557e">2</text>
    <text x="266" y="80" fill="#7a5415">4</text>
    <text x="320" y="80" fill="#34557e">1</text>
    <text x="374" y="80" fill="#7a5415">2</text>
    <text x="428" y="80" fill="#34557e">3</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    <text x="212" y="106">i=0</text>
    <text x="266" y="106">i=1</text>
    <text x="320" y="106">i=2</text>
    <text x="374" y="106">i=3</text>
    <text x="428" y="106">i=4</text>
  </g>

  <!-- split arrows -->
  <path d="M 258 116 Q 200 126 182 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 116 Q 440 126 458 148" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- even bucket -->
  <g filter="url(#rough2)">
    <rect x="58" y="156" width="240" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="178" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#34557e" filter="url(#rough2)">偶数下标（i % 2 == 0）</text>
  <text x="178" y="202" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">num[0] + num[2] + num[4]</text>
  <text x="178" y="220" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">2 + 1 + 3</text>
  <text x="178" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#34557e" font-family="monospace" filter="url(#rough2)">even = 6</text>

  <!-- vs -->
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#999" filter="url(#rough2)">vs</text>

  <!-- odd bucket -->
  <g filter="url(#rough2)">
    <rect x="342" y="156" width="240" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="462" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">奇数下标（i % 2 == 1）</text>
  <text x="462" y="202" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">num[1] + num[3]</text>
  <text x="462" y="220" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#rough2)">4 + 2</text>
  <text x="462" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#rough2)">odd = 6</text>

  <!-- compare arrows -->
  <path d="M 178 262 Q 210 280 248 294" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 462 262 Q 430 280 392 294" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <g filter="url(#rough2)">
    <rect x="190" y="298" width="260" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6 == 6 → true ✓</text>

  <text x="320" y="354" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">一次遍历 · 两个计数器 · O(1) 额外空间</text>
</svg>
