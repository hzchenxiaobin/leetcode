<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：5 × 5 箱子，只有 b0 掉出来</text>
  <path d="M 200 42 Q 360 50 520 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="360" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每格写挡板方向（1 向右、-1 向左）；绿格是 b0 走过的格子，红圈是被 V 形卡住的位置</text>

  <!-- column headers -->
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="126">列0</text>
    <text x="134" y="126">列1</text>
    <text x="186" y="126">列2</text>
    <text x="238" y="126">列3</text>
    <text x="290" y="126">列4</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">
    <text x="48" y="158">r0</text>
    <text x="48" y="202">r1</text>
    <text x="48" y="246">r2</text>
    <text x="48" y="290">r3</text>
    <text x="48" y="334">r4</text>
  </g>

  <!-- grid: 25 cells, 5 columns x 5 rows, cell 52x44, origin (56,132) -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="56" y="132" width="52" height="44" rx="3" fill="#e6f4ea" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="132" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="132" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="132" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="132" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <!-- row 1 -->
    <rect x="56" y="176" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="176" width="52" height="44" rx="3" fill="#e6f4ea" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="176" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="176" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="176" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <!-- row 2 -->
    <rect x="56" y="220" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="220" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="220" width="52" height="44" rx="3" fill="#e6f4ea" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="220" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="220" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <!-- row 3 -->
    <rect x="56" y="264" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="264" width="52" height="44" rx="3" fill="#e6f4ea" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="264" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="264" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="264" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <!-- row 4 -->
    <rect x="56" y="308" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="308" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="308" width="52" height="44" rx="3" fill="#e6f4ea" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="308" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="308" width="52" height="44" rx="3" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>

  <!-- boards: row0 = 1 1 1 -1 -1 -->
  <g stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <path d="M 56 132 L 108 176"/>
    <path d="M 108 132 L 160 176"/>
    <path d="M 160 132 L 212 176"/>
    <path d="M 264 132 L 212 176"/>
    <path d="M 316 132 L 264 176"/>
    <!-- row1 = 1 1 1 -1 -1 -->
    <path d="M 56 176 L 108 220"/>
    <path d="M 108 176 L 160 220"/>
    <path d="M 160 176 L 212 220"/>
    <path d="M 264 176 L 212 220"/>
    <path d="M 316 176 L 264 220"/>
    <!-- row2 = -1 -1 -1 1 1 -->
    <path d="M 108 220 L 56 264"/>
    <path d="M 160 220 L 108 264"/>
    <path d="M 212 220 L 160 264"/>
    <path d="M 212 220 L 264 264"/>
    <path d="M 264 220 L 316 264"/>
    <!-- row3 = 1 1 1 1 -1 -->
    <path d="M 56 264 L 108 308"/>
    <path d="M 108 264 L 160 308"/>
    <path d="M 160 264 L 212 308"/>
    <path d="M 212 264 L 264 308"/>
    <path d="M 316 264 L 264 308"/>
    <!-- row4 = -1 -1 -1 -1 -1 -->
    <path d="M 108 308 L 56 352"/>
    <path d="M 160 308 L 108 352"/>
    <path d="M 212 308 L 160 352"/>
    <path d="M 264 308 L 212 352"/>
    <path d="M 316 308 L 264 352"/>
  </g>

  <!-- board values -->
  <g font-size="9" fill="#9a9a9a" filter="url(#rough2)">
    <text x="100" y="145" text-anchor="end">1</text>
    <text x="152" y="145" text-anchor="end">1</text>
    <text x="204" y="145" text-anchor="end">1</text>
    <text x="218" y="145">-1</text>
    <text x="270" y="145">-1</text>
    <text x="100" y="189" text-anchor="end">1</text>
    <text x="152" y="189" text-anchor="end">1</text>
    <text x="204" y="189" text-anchor="end">1</text>
    <text x="218" y="189">-1</text>
    <text x="270" y="189">-1</text>
    <text x="62" y="233">-1</text>
    <text x="114" y="233">-1</text>
    <text x="166" y="233">-1</text>
    <text x="256" y="233" text-anchor="end">1</text>
    <text x="308" y="233" text-anchor="end">1</text>
    <text x="100" y="277" text-anchor="end">1</text>
    <text x="152" y="277" text-anchor="end">1</text>
    <text x="204" y="277" text-anchor="end">1</text>
    <text x="256" y="277" text-anchor="end">1</text>
    <text x="270" y="277">-1</text>
    <text x="62" y="321">-1</text>
    <text x="114" y="321">-1</text>
    <text x="166" y="321">-1</text>
    <text x="218" y="321">-1</text>
    <text x="270" y="321">-1</text>
  </g>

  <!-- b0 path -->
  <path d="M 82 154 L 134 198 L 186 242 L 134 286 L 186 330" stroke="#d6a040" stroke-width="2.4" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)">
    <circle cx="82" cy="154" r="6"/>
    <circle cx="134" cy="198" r="6"/>
    <circle cx="186" cy="242" r="6"/>
    <circle cx="134" cy="286" r="6"/>
    <circle cx="186" cy="330" r="6"/>
  </g>
  <text x="61" y="170" font-size="10" font-weight="bold" fill="#b07818" filter="url(#rough2)">b0</text>

  <!-- exit arrow -->
  <path d="M 186 330 L 140 356 L 136 376" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="144" y="394" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">出箱：第 1 列</text>

  <!-- V-shaped stuck points -->
  <g filter="url(#rough2)">
    <circle cx="212" cy="176" r="9" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="212" cy="220" r="9" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="212" y="181">✗</text>
    <text x="212" y="225">✗</text>
  </g>

  <!-- result table -->
  <g filter="url(#rough2)">
    <rect x="332" y="104" width="368" height="216" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#34557e" filter="url(#rough2)">
    <text x="352" y="126">球</text>
    <text x="396" y="126">起点</text>
    <text x="470" y="126">逐行所在列</text>
    <text x="640" y="126">结果</text>
  </g>
  <path d="M 344 134 L 688 134" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="352" y="158">b0</text>
    <text x="396" y="158">0</text>
    <text x="470" y="158">0 → 1 → 2 → 1 → 2</text>
    <text x="640" y="158" fill="#2e6e2e" font-weight="bold">1</text>

    <text x="352" y="188">b1</text>
    <text x="396" y="188">1</text>
    <text x="470" y="188">1 → 2 → 卡住</text>
    <text x="640" y="188" fill="#b85450">-1</text>

    <text x="352" y="218">b2</text>
    <text x="396" y="218">2</text>
    <text x="470" y="218">2 → 卡住</text>
    <text x="640" y="218" fill="#b85450">-1</text>

    <text x="352" y="248">b3</text>
    <text x="396" y="248">3</text>
    <text x="470" y="248">3 → 卡住</text>
    <text x="640" y="248" fill="#b85450">-1</text>

    <text x="352" y="278">b4</text>
    <text x="396" y="278">4</text>
    <text x="470" y="278">4 → 3 → 卡住</text>
    <text x="640" y="278" fill="#b85450">-1</text>
  </g>
  <path d="M 344 292 L 688 292" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="312" font-size="10" fill="#888" filter="url(#rough2)">「逐行所在列」= 球在第 r 行时占用的列</text>

  <g filter="url(#rough2)">
    <rect x="332" y="336" width="368" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="516" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">输出 [1, -1, -1, -1, -1]</text>

  <!-- legend -->
  <g font-size="11" fill="#555" filter="url(#rough2)">
    <text x="34" y="412">✗ 红圈 = 两板异向形成的 V 形卡死点</text>
    <text x="34" y="432">第 0 行的 列2|列3 之间 → b2、b3 在这里卡住</text>
    <text x="34" y="452">第 1 行的 列2|列3 之间 → b1、b4 在这里卡住</text>
    <text x="34" y="472">b0 每行只横移一格：0 → 1 → 2 → 1 → 2 → 出箱第 1 列</text>
  </g>
  <text x="34" y="496" font-size="11" fill="#888" filter="url(#rough2)">注意 b0 在第 2 行被 -1 推回列 1，路径可以左右反复</text>
</svg>
