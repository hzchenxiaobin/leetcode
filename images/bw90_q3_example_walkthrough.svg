<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三个输入的分组与选组</text>

  <g filter="url(#rough2)">
    <rect x="50" y="48" width="460" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="74" font-weight="bold" fill="#1a2b45">例 1：nums = [3,7,8,1,1,5]，s = 2</text>
    <text x="70" y="98">余 1 组 {3,7,1,1,5}：大小 5、最小 1；余 0 组 {8}：大小 1</text>
    <text x="70" y="122" fill="#b85450" font-weight="bold">→ 最大组余 1，答案 = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="150" width="460" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="176" font-weight="bold" fill="#1d3a17">例 2：nums = [1,3,5,2,4,6]，s = 2</text>
    <text x="70" y="200">奇数组 {1,3,5}：大小 3、最小 1；偶数组 {2,4,6}：大小 3、最小 2</text>
    <text x="70" y="224" fill="#b85450" font-weight="bold">→ 大小并列，取更小最小值 → 答案 = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="252" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="70" y="278" font-weight="bold" fill="#7a5a14">例 3：nums = [6,2,5]，s = 100</text>
    <text x="70" y="302">三数两两不同余（6、2、5），三组大小全为 1</text>
    <text x="70" y="326" fill="#b85450" font-weight="bold">→ 全并列，取组内最小 → 答案 = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="352" width="460" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="372">⚠️ 重复目标按次数计（例 1 的两个 1 算两个目标）；</text>
    <text x="280" y="394">space 高达 10⁹，分组必须用哈希表而不是数组桶</text>
  </g>
</svg>
