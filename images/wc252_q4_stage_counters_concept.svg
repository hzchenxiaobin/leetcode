<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="444" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">核心观察：0⁺1⁺2⁺ 三段单向推进，三个计数器分阶段累计</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A: shape demo -->
  <text x="58" y="68" font-size="12.5" fill="#555" filter="url(#sk)">特殊序列的形状（三段各至少 1 个，顺序 0 → 1 → 2 固定）：</text>
  <g filter="url(#sk)"><rect x="72" y="78" width="34" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="89" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="112" y="78" width="34" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="129" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="168" y="78" width="34" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="185" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="208" y="78" width="34" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="225" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="248" y="78" width="34" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="265" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="304" y="78" width="34" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="321" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">0⁺（≥1 个）</text>
  <text x="216" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">1⁺（≥1 个）</text>
  <text x="321" y="132" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#sk)">2⁺（≥1 个）</text>
  <text x="430" y="92" font-size="11.5" fill="#b85450" filter="url(#sk)">× [0,1,2,0]：2 段之后又冒出 0</text>
  <text x="430" y="114" font-size="11.5" fill="#b85450" filter="url(#sk)">× [1]、[2,1,0]：缺段 / 顺序错乱</text>

  <!-- B: state machine -->
  <text x="58" y="166" font-size="12.5" fill="#555" filter="url(#sk)">扫描时每个元素只能：延长所在段、开启新段、或被跳过 —— 状态 = 已凑到第几段：</text>

  <path d="M 30 231 L 76 231" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="53" y="214" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#sk)">空序列</text>
  <text x="53" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">开局 +1</text>

  <g filter="url(#sk)"><rect x="80" y="200" width="130" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="145" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#sk)">f₀</text>
  <text x="145" y="246" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">已凑出 0⁺</text>

  <g filter="url(#sk)"><rect x="275" y="200" width="130" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="340" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">f₁</text>
  <text x="340" y="246" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">已凑出 0⁺1⁺</text>

  <g filter="url(#sk)"><rect x="470" y="200" width="130" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="535" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#sk)">f₂</text>
  <text x="535" y="246" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">0⁺1⁺2⁺ · √ 答案</text>

  <path d="M 212 231 L 267 231" stroke="#666" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="242" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">遇 1</text>
  <text x="242" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">f₀ 个升级</text>

  <path d="M 407 231 L 462 231" stroke="#666" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="437" y="222" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">遇 2</text>
  <text x="437" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">f₁ 个升级</text>

  <text x="145" y="298" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">遇 0：f₀ ← 2f₀ + 1</text>
  <text x="340" y="298" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">遇 1：f₁ ← 2f₁ + f₀</text>
  <text x="535" y="298" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#sk)">遇 2：f₂ ← 2f₂ + f₁</text>
  <text x="145" y="320" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">（+1 即空序列开局）</text>

  <!-- C: banner -->
  <g filter="url(#sk)"><rect x="40" y="344" width="600" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="340" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">不变式：子序列末元素的值 = 所处段的编号 → 扫到 v，只有 f_v 的公式被触发</text>
  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">阶段只增不减（想回头补 0 / 1？×）⇒ 单向喂养、原地更新互不干扰，一趟扫描 O(1) 空间</text>
</svg>
