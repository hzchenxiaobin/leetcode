<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">偶数情形：奇偶不变量锁死小明</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="520" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="90" y="82" font-size="13.5" font-weight="bold" fill="#2e6e2e">① 小红：只移除一个元音字符（恰 1 个元音，奇 ✓）</text>
  <text x="90" y="104" font-size="12" fill="#2e6e2e">剩余元音数 = 偶 − 1 = 奇数 ≥ 1</text>
  <path d="M 320 120 Q 320 132 320 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="146" width="520" height="80" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="90" y="170" font-size="13.5" font-weight="bold" fill="#2b6e9e">② 小明：必须移除含偶数个元音的子串</text>
  <text x="90" y="192" font-size="12" fill="#2b6e9e">剩余元音数 = 奇 − 偶 = 奇数 ≥ 1（不变量保持）</text>
  <text x="90" y="214" font-size="12" fill="#b85450" font-weight="bold">想清场？整串元音数是奇数 → 对小明非法 ✗</text>
  <path d="M 320 226 Q 320 238 320 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="520" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="90" y="276" font-size="13.5" font-weight="bold" fill="#2e6e2e">③ 小红：整串恰含奇数个元音 → 合法，全部移除！</text>
  <text x="90" y="298" font-size="12" fill="#2e6e2e">字符串被清空</text>
  <path d="M 320 314 Q 320 326 320 338" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="520" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="90" y="364" font-size="13.5" font-weight="bold" fill="#b85450">④ 轮到小明：空串没有任何非空子串</text>
  <text x="90" y="386" font-size="12" fill="#b85450">小明无法操作 → 落败，小红胜</text>

  <!-- right margin note -->
  <text x="598" y="190" text-anchor="middle" font-size="11" fill="#8a6415" font-weight="bold" transform="rotate(90 598 190)">奇 − 偶 = 奇 ≠ 0</text>
</svg>
