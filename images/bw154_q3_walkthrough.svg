<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="336" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：nums = [6, 7, 8, 9]</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">两两异或只产生 4 个值，再回代后集合仍是这 4 个数</text>

  <rect x="40" y="64" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">pair (i ≤ j)</text>
  <rect x="190" y="64" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">异或值</text>
  <rect x="310" y="64" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">⊕ a 之后的可能值</text>

  <rect x="40" y="100" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="121" text-anchor="middle" font-size="10.5" fill="#333">6⊕6, 7⊕7, 8⊕8, 9⊕9</text>
  <rect x="190" y="100" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="121" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">0</text>
  <rect x="310" y="100" width="210" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="121" text-anchor="middle" font-size="10" fill="#666">{6, 7, 8, 9}（自身 ⊕ 0）</text>

  <rect x="40" y="136" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="157" text-anchor="middle" font-size="10.5" fill="#333">6⊕7, 8⊕9</text>
  <rect x="190" y="136" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="157" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">1</text>
  <rect x="310" y="136" width="210" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="157" text-anchor="middle" font-size="10" fill="#666">6⊕1=7、7⊕1=6、8⊕1=9、9⊕1=8</text>

  <rect x="40" y="172" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="193" text-anchor="middle" font-size="10.5" fill="#333">6⊕9, 7⊕8</text>
  <rect x="190" y="172" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="193" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">15</text>
  <rect x="310" y="172" width="210" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="193" text-anchor="middle" font-size="10" fill="#666">6⊕15=9、7⊕15=8、8⊕15=7、9⊕15=6</text>

  <rect x="40" y="208" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="229" text-anchor="middle" font-size="10.5" fill="#333">6⊕8, 7⊕9</text>
  <rect x="190" y="208" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="229" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">14</text>
  <rect x="310" y="208" width="210" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="229" text-anchor="middle" font-size="10" fill="#666">6⊕14=8、7⊕14=9、8⊕14=6、9⊕14=7</text>

  <rect x="90" y="256" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="10" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">不同异或值 = {6, 7, 8, 9}，共 4 个</text>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#666">与示例输出 4 一致</text>

  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#999">三个元素的异或可以看成「一个 pair 的异或」再拼上「单个元素」，这就是拆解的依据</text>
</svg>
