<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：不解压字符串，只维护 (i, cur, cnt) 三个标量</text>

  <text x="70" y="66" font-size="11.5" fill="#446688" filter="url(#rough2)">压缩串 s = "L1e2t1C1o1d1e1"（已走完 2 次 next 的状态）</text>

  <!-- 已解析的 4 格 -->
  <rect x="70" y="80" width="26" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="83" y="102" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">L</text>
  <rect x="96" y="80" width="26" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="102" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="122" y="80" width="26" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="102" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">e</text>
  <rect x="148" y="80" width="26" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="102" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">2</text>

  <!-- 未解析 -->
  <rect x="174" y="80" width="26" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>
  <rect x="200" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <rect x="252" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="278" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="304" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="330" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <rect x="356" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="369" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="382" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <rect x="408" y="80" width="26" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="421" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="83" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="109" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="135" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="161" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="187" y="128" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="213" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="239" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="265" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="291" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="317" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="343" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>
  <text x="369" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">11</text>
  <text x="395" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">12</text>
  <text x="421" y="128" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">13</text>

  <path d="M 70 144 Q 122 152 174 144" fill="none" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="162" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">已解析，不再回看</text>

  <path d="M 187 158 Q 187 140 187 120" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="198" y="152" font-size="11" fill="#a08030" filter="url(#rough2)">i = 4 指向下一个未解析字符</text>

  <!-- 状态三元组 -->
  <text x="44" y="192" font-size="11" fill="#555" filter="url(#rough2)">迭代器状态（构造 + 每次 next/hasNext 更新）：</text>

  <rect x="44" y="202" width="156" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="122" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i = 4</text>
  <text x="122" y="244" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下一块的起始下标</text>

  <rect x="212" y="202" width="156" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur = 'e'</text>
  <text x="290" y="244" text-anchor="middle" font-size="9.5" fill="#a08030" filter="url(#rough2)">当前块的字母</text>

  <rect x="380" y="202" width="156" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="458" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt = 1</text>
  <text x="458" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">本块还剩几个没输出</text>

  <!-- 剩余输出等价式 -->
  <text x="44" y="300" font-size="12.5" fill="#555" filter="url(#rough2)">剩余输出 =</text>

  <rect x="140" y="280" width="28" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="302" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="154" y="276" text-anchor="middle" font-size="9" fill="#a08030" filter="url(#rough2)">×cnt</text>

  <text x="182" y="302" font-size="14" fill="#888" filter="url(#rough2)">+</text>

  <rect x="202" y="276" width="166" height="44" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="210" y="282" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="222" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>
  <rect x="234" y="282" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <rect x="258" y="282" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="282" y="282" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="294" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <rect x="306" y="282" width="24" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="303" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <text x="285" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">decode(s[4..]) = "tCode"</text>

  <text x="382" y="302" font-size="14" fill="#888" filter="url(#rough2)">=</text>

  <rect x="402" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="415" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <rect x="428" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="441" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>
  <rect x="454" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="467" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <rect x="480" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="506" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="519" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d</text>
  <rect x="532" y="280" width="26" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="545" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <text x="480" y="338" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">剩余 6 个字符</text>

  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">cnt 归零时才解析下一块 → 每个压缩字符只被扫一次，next() 摊还 O(1)</text>
  <text x="300" y="398" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">解压总长最多约 500 × 10^9 ≈ 5×10^11，暴力展开必然 MLE/TLE</text>
</svg>
