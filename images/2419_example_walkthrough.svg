<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1,2,3,3,2,2]，mx = max(nums) = 3</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="42" y="74" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">第一趟：扫出最大值 mx = 3，即 k = 3</text>

  <g filter="url(#sk)"><rect x="120" y="86" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="153" y="110" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="186" y="86" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="219" y="110" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="252" y="86" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="285" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="318" y="86" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="351" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="384" y="86" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="417" y="110" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="450" y="86" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="483" y="110" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>

  <text x="153" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=0</text>
  <text x="219" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=1</text>
  <text x="285" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=2</text>
  <text x="351" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=3</text>
  <text x="417" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=4</text>
  <text x="483" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">i=5</text>

  <g filter="url(#sk)"><path d="M 246 158 Q 285 150 324 158" stroke="#4a7a3a" stroke-width="2" fill="none"/></g>
  <text x="285" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">绿色 = 等于 mx 的格子（可组段）</text>

  <text x="42" y="206" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">第二趟：数 3 的最长连续段（cur / ans 逐步演化）</text>

  <g filter="url(#sk)"><rect x="120" y="218" width="60" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="180" y="218" width="90" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="225" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">nums[i]</text>
  <g filter="url(#sk)"><rect x="270" y="218" width="90" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="315" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">== mx?</text>
  <g filter="url(#sk)"><rect x="360" y="218" width="70" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="395" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">cur</text>
  <g filter="url(#sk)"><rect x="430" y="218" width="70" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="465" y="235" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">ans</text>

  <text x="150" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>
  <text x="225" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">1</text>
  <text x="315" y="266" text-anchor="middle" font-size="11.5" fill="#a03a3a" filter="url(#sk)">否</text>
  <text x="395" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>
  <text x="465" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>

  <text x="150" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">1</text>
  <text x="225" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>
  <text x="315" y="292" text-anchor="middle" font-size="11.5" fill="#a03a3a" filter="url(#sk)">否</text>
  <text x="395" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>
  <text x="465" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>

  <text x="150" y="318" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>
  <text x="225" y="318" text-anchor="middle" font-size="11.5" fill="#2e5c24" font-weight="bold" filter="url(#sk)">3</text>
  <text x="315" y="318" text-anchor="middle" font-size="11.5" fill="#2e5c24" font-weight="bold" filter="url(#sk)">是</text>
  <text x="395" y="318" text-anchor="middle" font-size="11.5" fill="#2e5c24" font-weight="bold" filter="url(#sk)">1</text>
  <text x="465" y="318" text-anchor="middle" font-size="11.5" fill="#2e5c24" font-weight="bold" filter="url(#sk)">1</text>

  <g filter="url(#sk)"><rect x="116" y="330" width="388" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="150" y="347" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">3</text>
  <text x="225" y="347" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">3</text>
  <text x="315" y="347" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">是</text>
  <text x="395" y="347" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">2</text>
  <text x="465" y="347" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">2 ★</text>

  <text x="150" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">4</text>
  <text x="225" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>
  <text x="315" y="378" text-anchor="middle" font-size="11.5" fill="#a03a3a" filter="url(#sk)">否</text>
  <text x="395" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>
  <text x="465" y="378" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>

  <text x="150" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">5</text>
  <text x="225" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>
  <text x="315" y="404" text-anchor="middle" font-size="11.5" fill="#a03a3a" filter="url(#sk)">否</text>
  <text x="395" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0</text>
  <text x="465" y="404" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">2</text>

  <g filter="url(#sk)"><path d="M 516 246 L 516 394" stroke="#888" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/></g>
  <text x="530" y="270" font-size="10.5" fill="#888" filter="url(#sk)">cur 只统计</text>
  <text x="530" y="284" font-size="10.5" fill="#888" filter="url(#sk)">「当前正在</text>
  <text x="530" y="298" font-size="10.5" fill="#888" filter="url(#sk)">延续的段」</text>
  <text x="530" y="330" font-size="10.5" fill="#888" filter="url(#sk)">ans 记录</text>
  <text x="530" y="344" font-size="10.5" fill="#888" filter="url(#sk)">历史最长，</text>
  <text x="530" y="358" font-size="10.5" fill="#888" filter="url(#sk)">只增不减</text>

  <g filter="url(#sk)"><rect x="42" y="422" width="330" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="207" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最长连续段 [3,3]（下标 2~3）</text>
  <text x="207" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">整段 AND = 3 = k，答案 = 2 ✓</text>

  <g filter="url(#sk)"><rect x="392" y="422" width="246" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="515" y="440" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">示例 2：[1,2,3,4] 中 mx=4 仅出现一次</text>
  <text x="515" y="460" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">连续段长度 1，答案 = 1</text>
</svg>
