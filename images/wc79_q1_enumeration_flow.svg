<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：三重枚举 + 整数叉积</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n ≤ 50 时只有 C(50,3) = 19600 个三元组</text>

  <!-- 三重循环分组虚线框 -->
  <rect x="52" y="70" width="256" height="152" fill="none" stroke="#c9a86a" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="64" y="88" font-size="10.5" fill="#a8842e" filter="url(#rough2)">三重循环</text>

  <!-- B1 -->
  <rect x="72" y="96" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="116" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">i = 0 … n−1，取点 A</text>
  <!-- B2 -->
  <rect x="72" y="138" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="158" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">j = i+1 … n−1，取点 B</text>
  <!-- B3 -->
  <rect x="72" y="180" width="216" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">k = j+1 … n−1，取点 C</text>

  <path d="M 180 126 L 180 136" stroke="#777" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 168 L 180 178" stroke="#777" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 叉积 -->
  <rect x="42" y="252" width="276" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7" filter="url(#rough2)"/>
  <text x="180" y="271" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">cross = (xⱼ−xᵢ)(yₖ−yᵢ) − (yⱼ−yᵢ)(xₖ−xᵢ)</text>
  <text x="180" y="288" text-anchor="middle" font-size="10" fill="#a85a55" filter="url(#rough2)">c = |cross| 就是 2 倍面积（整数）</text>
  <path d="M 180 210 L 180 250" stroke="#777" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B5 更新 -->
  <rect x="60" y="322" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="342" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">best2 = max(best2, c)</text>
  <path d="M 180 296 L 180 320" stroke="#777" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B6 返回 -->
  <rect x="60" y="378" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="7" filter="url(#rough2)"/>
  <text x="180" y="399" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">return best2 / 2.0</text>
  <path d="M 180 352 L 180 376" stroke="#777" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧要点 -->
  <rect x="330" y="96" width="164" height="200" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="9" filter="url(#rough2)"/>
  <text x="344" y="118" font-size="10.5" fill="#555" filter="url(#rough2)">○ i &lt; j &lt; k</text>
  <text x="352" y="134" font-size="10" fill="#888" filter="url(#rough2)">每组恰好一次</text>
  <text x="344" y="162" font-size="10.5" fill="#555" filter="url(#rough2)">○ |cross| ≤ 20000</text>
  <text x="352" y="178" font-size="10" fill="#888" filter="url(#rough2)">int 够用，仍开</text>
  <text x="352" y="192" font-size="10" fill="#888" filter="url(#rough2)">long long 更稳</text>
  <text x="344" y="220" font-size="10.5" fill="#555" filter="url(#rough2)">○ 先取绝对值</text>
  <text x="352" y="236" font-size="10" fill="#888" filter="url(#rough2)">再更新 best2</text>
  <text x="344" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">○ 最后才除 2</text>
  <text x="352" y="280" font-size="10" fill="#888" filter="url(#rough2)">用 2.0 避免整除</text>
</svg>
