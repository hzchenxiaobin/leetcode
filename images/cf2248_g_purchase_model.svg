<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一笔购买：h &#8594; h &#8722; x + R(x)</text>
  <text x="340" y="51" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">x 是若干商品价格之和（可重复购买），R(x) = 满足 a&#8344; &#8804; x 的最大返利</text>

  <rect x="52" y="82" width="130" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="117" y="110" text-anchor="middle" font-size="14" fill="#33517a" filter="url(#rough2)">当前余额 h</text>

  <path d="M186 105 L242 105" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="76" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">支付 x（x &#8804; h）</text>

  <rect x="246" y="82" width="136" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="314" y="110" text-anchor="middle" font-size="14" fill="#33517a" filter="url(#rough2)">余额 h &#8722; x</text>

  <path d="M386 105 L442 105" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="76" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">加返利 R(x)</text>

  <rect x="446" y="82" width="182" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="537" y="110" text-anchor="middle" font-size="14" fill="#8a6a1f" filter="url(#rough2)">h&#8242; = h &#8722; x + R(x)</text>

  <rect x="214" y="152" width="252" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="177" text-anchor="middle" font-size="13.5" fill="#8d3a36" filter="url(#rough2)">净变化 &#948;(x) = R(x) &#8722; x（可正可负）</text>
  <path d="M537 132 L537 146 L470 146 L470 152" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- R(x) 阶梯图 -->
  <text x="86" y="214" font-size="12" fill="#33517a" filter="url(#rough2)">返利阶梯 R(x)</text>
  <path d="M80 350 L372 350" stroke="#3a3a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M80 350 L80 254" stroke="#3a3a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M96 350 L170 350 L170 300 L250 300 L250 268 L360 268"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M170 350 L170 356" stroke="#3a3a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M250 350 L250 356" stroke="#3a3a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="370" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a&#8321;</text>
  <text x="252" y="370" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a&#8322;</text>
  <text x="366" y="370" text-anchor="end" font-size="11.5" fill="#666" filter="url(#rough2)">购买总价 x</text>
  <text x="162" y="296" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b&#8321;</text>
  <text x="242" y="264" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b&#8322;</text>
  <text x="74" y="250" text-anchor="end" font-size="11.5" fill="#666" filter="url(#rough2)">R</text>
  <text x="124" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">无返利 0</text>

  <!-- 右侧三类净变化 -->
  <circle cx="424" cy="222" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="438" y="226" font-size="11.5" fill="#3d3d3d" filter="url(#rough2)">&#948; &gt; 0 净增益（可反复抬升）</text>
  <circle cx="424" cy="252" r="5" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>
  <text x="438" y="256" font-size="11.5" fill="#3d3d3d" filter="url(#rough2)">&#948; &lt; 0 净减少 d = &#8722;&#948; &gt; 0</text>
  <circle cx="424" cy="282" r="5" fill="#d6a040" stroke="#d6a040" filter="url(#rough2)"/>
  <text x="438" y="286" font-size="11.5" fill="#3d3d3d" filter="url(#rough2)">&#948; = 0 余额不变，可忽略</text>
  <text x="424" y="326" font-size="11" fill="#888" filter="url(#rough2)">门槛处上跳、段内线性下降</text>
  <text x="424" y="348" font-size="11" fill="#888" filter="url(#rough2)">同净减少 d 只留最便宜的总价</text>
</svg>
