<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：patterns = ["a","abc","bc","d"]，word = "abc"</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <text x="125" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">pattern</text>
  <text x="370" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">与 word 的对齐</text>
  <text x="640" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">命中?</text>
  <text x="775" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">count</text>

  <!-- ===== row 1: "a" ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="88" width="70" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="125" y="110" text-anchor="middle" font-size="14" fill="#7a5415">"a"</text>
  <g filter="url(#sk)">
    <rect x="300" y="88" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="352" y="88" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="404" y="88" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
  </g>
  <text x="322" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="374" y="110" text-anchor="middle" font-size="14" fill="#888">b</text>
  <text x="426" y="110" text-anchor="middle" font-size="14" fill="#888">c</text>
  <text x="486" y="110" font-size="11" fill="#666" font-family="monospace">word[0:1] = "a" ✓</text>
  <text x="640" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">✓</text>
  <g filter="url(#sk)">
    <circle cx="775" cy="105" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="775" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="818" y="109" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- ===== row 2: "abc" ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="156" width="70" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="125" y="178" text-anchor="middle" font-size="14" fill="#7a5415">"abc"</text>
  <g filter="url(#sk)">
    <rect x="300" y="156" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="352" y="156" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="404" y="156" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="322" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="374" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="426" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="486" y="178" font-size="11" fill="#666" font-family="monospace">word[0:3] = "abc" ✓</text>
  <text x="640" y="180" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">✓</text>
  <g filter="url(#sk)">
    <circle cx="775" cy="173" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="775" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="818" y="177" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- ===== row 3: "bc" ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="224" width="70" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="125" y="246" text-anchor="middle" font-size="14" fill="#7a5415">"bc"</text>
  <g filter="url(#sk)">
    <rect x="300" y="224" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="352" y="224" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="404" y="224" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="322" y="246" text-anchor="middle" font-size="14" fill="#888">a</text>
  <text x="374" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="426" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>
  <text x="486" y="246" font-size="11" fill="#666" font-family="monospace">word[1:3] = "bc" ✓</text>
  <text x="640" y="248" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">✓</text>
  <g filter="url(#sk)">
    <circle cx="775" cy="241" r="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="775" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="818" y="245" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>

  <!-- ===== row 4: "d" ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="292" width="70" height="34" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="125" y="314" text-anchor="middle" font-size="14" fill="#7a5415">"d"</text>
  <g filter="url(#sk)">
    <rect x="300" y="292" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="352" y="292" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="404" y="292" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.4"/>
    <rect x="294" y="286" width="164" height="46" rx="6" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="322" y="314" text-anchor="middle" font-size="14" fill="#888">a</text>
  <text x="374" y="314" text-anchor="middle" font-size="14" fill="#888">b</text>
  <text x="426" y="314" text-anchor="middle" font-size="14" fill="#888">c</text>
  <text x="486" y="314" font-size="11" fill="#b85450" font-family="monospace">未找到匹配位置</text>
  <text x="640" y="316" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">✗</text>
  <g filter="url(#sk)">
    <circle cx="775" cy="309" r="15" fill="#f0f0f0" stroke="#999999" stroke-width="1.6"/>
  </g>
  <text x="775" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777">3</text>
  <text x="818" y="313" font-size="11" fill="#999">+0</text>

  <!-- ===== answer ===== -->
  <path d="M 758 309 Q 680 348 582 356" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="330" y="340" width="250" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="455" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">答案：count = 3</text>

  <!-- ===== example 3 panel ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="394" width="760" height="112" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="90" y="420" font-size="13" font-weight="bold" fill="#7a5415">示例 3：patterns = ["a","a","a"]，word = "ab" —— 重复 pattern 各自计数</text>
  <g filter="url(#sk)">
    <rect x="100" y="438" width="52" height="30" rx="5" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="240" y="438" width="52" height="30" rx="5" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="380" y="438" width="52" height="30" rx="5" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="126" y="458" text-anchor="middle" font-size="13" fill="#7a5415">"a"</text>
  <text x="266" y="458" text-anchor="middle" font-size="13" fill="#7a5415">"a"</text>
  <text x="406" y="458" text-anchor="middle" font-size="13" fill="#7a5415">"a"</text>
  <text x="176" y="459" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="316" y="459" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="456" y="459" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="492" y="459" font-size="12" fill="#444">→ 各命中一次</text>
  <g filter="url(#sk)">
    <rect x="620" y="438" width="150" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="695" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">count = 3</text>
  <text x="90" y="488" font-size="11" fill="#b85450">⚠ 若误用 set 去重：{"a"} 只算 1 次 → 错误答案 1 ✗</text>

  <!-- ===== footer ===== -->
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#888">要点：① "abc" ⊆ "abc"，整串是自身的子串 ② 子串必须连续 ③ 重复 pattern 按位置计数</text>
</svg>
