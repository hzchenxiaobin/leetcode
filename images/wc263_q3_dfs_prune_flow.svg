<svg xmlns="http://www.w3.org/2000/svg" width="780" height="700" viewBox="0 0 780 700"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="780" height="700" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：DFS(i, curOR) 选 / 不选二叉决策 + 提前剪枝</text>
  <path d="M 220 40 Q 390 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- entry box -->
  <g filter="url(#rough2)">
    <rect x="295" y="56" width="190" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="390" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">进入 dfs(i, curOR)</text>

  <path d="M 390 98 L 390 118" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prune diamond -->
  <g filter="url(#rough2)">
    <polygon points="390,122 510,188 390,254 270,188" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="390" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">curOR == maxOR ?</text>
  <text x="390" y="199" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">（已全亮，再或不变）</text>

  <!-- prune yes branch -->
  <path d="M 510 188 L 545 188" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="524" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="548" y="130" width="222" height="116" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="659" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">ans += 2^(n−i) 后 return</text>
  <text x="659" y="176" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">剩余 n−i 个元素任选一个子集</text>
  <text x="659" y="193" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">全部命中——一步统计完</text>
  <text x="659" y="216" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">逐叶计数 → 内部节点批量计数</text>
  <text x="659" y="233" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">最坏仍 O(2ⁿ)，平均显著加速</text>

  <!-- prune no branch -->
  <path d="M 390 254 L 390 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="270" font-size="10.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">否</text>

  <!-- leaf diamond -->
  <g filter="url(#rough2)">
    <polygon points="390,276 490,342 390,408 290,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">i == n ?</text>
  <text x="390" y="353" text-anchor="middle" font-size="10.5" fill="#7a5c14" filter="url(#rough2)">（元素用尽）</text>

  <!-- leaf yes branch -->
  <path d="M 490 342 L 545 342" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="520" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="548" y="306" width="222" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="659" y="332" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">return（叶子不命中）</text>
  <text x="659" y="352" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">curOR ≠ maxOR，不计入答案；</text>
  <text x="659" y="369" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">能走到这里说明上方菱形已判「否」</text>

  <!-- leaf no branch: split into two -->
  <path d="M 390 408 C 390 428 170 416 170 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 408 C 390 428 610 416 610 436" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="430" font-size="10.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">否</text>

  <!-- two branch boxes -->
  <g filter="url(#rough2)">
    <rect x="60" y="440" width="220" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="500" y="440" width="220" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="170" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">不选 nums[i]</text>
  <text x="170" y="486" text-anchor="middle" font-size="11.5" fill="#3a5c2e" filter="url(#rough2)">dfs(i+1, curOR)</text>
  <text x="170" y="500" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">OR 原样下传</text>
  <text x="610" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">选 nums[i]</text>
  <text x="610" y="486" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">dfs(i+1, curOR | nums[i])</text>
  <text x="610" y="500" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">累入新元素</text>

  <path d="M 170 504 L 170 528" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 610 504 L 610 528" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- recursion note -->
  <g filter="url(#rough2)">
    <rect x="170" y="532" width="440" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="390" y="553" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#rough2)">curOR 按值传递——每层调用各存一份副本</text>
  <text x="390" y="573" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#rough2)">递归返回后无需撤销：没有共享可变状态要回滚</text>

  <!-- bottom note cards -->
  <g filter="url(#rough2)">
    <rect x="40" y="600" width="350" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="408" y="600" width="332" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="215" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">为什么剪枝正确？</text>
  <text x="52" y="642" font-size="10.5" fill="#444" filter="url(#rough2)">· 单调性 + maxOR 是上界：curOR == maxOR 后，</text>
  <text x="52" y="659" font-size="10.5" fill="#444" filter="url(#rough2)">  剩余元素选/不选，OR 都保持 maxOR 不变</text>
  <text x="52" y="676" font-size="10.5" fill="#444" filter="url(#rough2)">· 2^(n−i) 个叶子子树折叠成一次加法</text>
  <text x="574" y="622" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4666" filter="url(#rough2)">等价写法：增量 mask 递推（无递归）</text>
  <text x="420" y="642" font-size="10.5" fill="#444" filter="url(#rough2)">· f[0]=0；mask 从小到大：low = mask&amp;−mask</text>
  <text x="420" y="659" font-size="10.5" fill="#444" filter="url(#rough2)">· f[mask] = f[mask^low] | nums[low 的下标]</text>
  <text x="420" y="676" font-size="10.5" fill="#444" filter="url(#rough2)">· 每个 mask O(1)，总计 O(2ⁿ)，扫描式实现</text>
</svg>
