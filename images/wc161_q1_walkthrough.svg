<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="404" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：s1 = xxyxyy，s2 = yyxyxx（a = 3，b = 3）</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4 次交换后两串同时变成 yxxxyy</text>

  <!-- 表格底与外框 -->
  <rect x="44" y="64" width="472" height="204" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="44" y="64" width="472" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <path d="M 46 98 L 514 98" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 46 132 L 514 132" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 46 166 L 514 166" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 46 200 L 514 200" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 46 234 L 514 234" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <path d="M 118 66 L 118 266" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 386 66 L 386 266" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 450 66 L 450 266" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="81" y="86" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="128" y="86" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="418" y="86" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">花费</text>
  <text x="483" y="86" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">累计</text>

  <!-- 第 1 行 -->
  <text x="81" y="121" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="128" y="121" font-size="10.5" fill="#333" filter="url(#rough2)">交换 s1[0] ↔ s2[1]：A0、A1 同为 A 型</text>
  <text x="418" y="121" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="483" y="121" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>

  <!-- 第 2 行 -->
  <text x="81" y="155" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="128" y="155" font-size="10.5" fill="#333" filter="url(#rough2)">交换 s1[2] ↔ s2[4]：B2、B4 同为 B 型</text>
  <text x="418" y="155" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="483" y="155" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>

  <!-- 第 3 行 -->
  <text x="81" y="189" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="128" y="189" font-size="10.5" fill="#b85450" filter="url(#rough2)">交换 s1[3] ↔ s2[3]：把 A3 翻成 B 型（零头）</text>
  <text x="418" y="189" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="483" y="189" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>

  <!-- 第 4 行 -->
  <text x="81" y="223" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="128" y="223" font-size="10.5" fill="#333" filter="url(#rough2)">交换 s1[3] ↔ s2[5]：B3、B5 配对收尾</text>
  <text x="418" y="223" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="483" y="223" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>

  <!-- 合计行 -->
  <rect x="46" y="235" width="468" height="31" fill="#e6f4ea" stroke="#e6f4ea" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="81" y="255" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="128" y="255" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">6 个位置全部对齐，a//2 + b//2 + 2 = 4</text>
  <text x="418" y="255" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="483" y="255" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">—</text>

  <!-- 说明框 -->
  <rect x="44" y="282" width="472" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="302" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 3 步为什么不亏？</text>
  <text x="60" y="320" font-size="10" fill="#555" filter="url(#rough2)">这次自交换没有碰任何已匹配位置，只把 A 型翻成 B 型，</text>
  <text x="60" y="336" font-size="10" fill="#555" filter="url(#rough2)">让最后两个零头变成「同型」，于是第 4 步又能一次修好两处。</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">a = 3、b = 3 同为奇数 → 3 // 2 + 3 // 2 + 2 = 4（而非 3）</text>
</svg>
