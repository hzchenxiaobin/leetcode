<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="480" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "abccbaacz"</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 命中标注 -->
  <text x="415" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">命中！扫描在此停止</text>
  <path d="M 415 62 L 415 72" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>

  <!-- 字符串格子 -->
  <g filter="url(#sk)"><rect x="227" y="76" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="253" y="104" text-anchor="middle" font-size="16" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="281" y="76" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="307" y="104" text-anchor="middle" font-size="16" fill="#2b6e9e">b</text>
  <g filter="url(#sk)"><rect x="335" y="76" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="361" y="104" text-anchor="middle" font-size="16" fill="#2b6e9e">c</text>
  <g filter="url(#sk)"><rect x="389" y="76" width="52" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.5"/></g>
  <text x="415" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="443" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="469" y="104" text-anchor="middle" font-size="16" fill="#777">b</text>
  <g filter="url(#sk)"><rect x="497" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="523" y="104" text-anchor="middle" font-size="16" fill="#777">a</text>
  <g filter="url(#sk)"><rect x="551" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="577" y="104" text-anchor="middle" font-size="16" fill="#777">a</text>
  <g filter="url(#sk)"><rect x="605" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="631" y="104" text-anchor="middle" font-size="16" fill="#777">c</text>
  <g filter="url(#sk)"><rect x="659" y="76" width="52" height="44" rx="4" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="685" y="104" text-anchor="middle" font-size="16" fill="#777">z</text>

  <text x="253" y="138" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="307" y="138" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="361" y="138" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="415" y="138" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="469" y="138" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="523" y="138" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="577" y="138" text-anchor="middle" font-size="11" fill="#999">6</text>
  <text x="631" y="138" text-anchor="middle" font-size="11" fill="#999">7</text>
  <text x="685" y="138" text-anchor="middle" font-size="11" fill="#999">8</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="740" y="70" width="18" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="766" y="81" font-size="11" fill="#666">已登记</text>
  <g filter="url(#sk)"><rect x="740" y="92" width="18" height="14" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="766" y="103" font-size="11" fill="#666">命中</text>
  <g filter="url(#sk)"><rect x="740" y="114" width="18" height="14" rx="3" fill="#f7f6f1" stroke="#c9c8c0" stroke-width="1.4"/></g>
  <text x="766" y="125" font-size="11" fill="#666">未扫描</text>

  <!-- 演算表 -->
  <g filter="url(#sk)"><rect x="110" y="150" width="90" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="155" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">下标 i</text>
  <g filter="url(#sk)"><rect x="200" y="150" width="80" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="240" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">s[i]</text>
  <g filter="url(#sk)"><rect x="280" y="150" width="220" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="390" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">seen（处理前）</text>
  <g filter="url(#sk)"><rect x="500" y="150" width="100" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="550" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">命中？</text>
  <g filter="url(#sk)"><rect x="600" y="150" width="240" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="720" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">动作</text>

  <!-- 第 1 行 -->
  <g filter="url(#sk)"><rect x="110" y="188" width="90" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="155" y="214" text-anchor="middle" font-size="12" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="200" y="188" width="80" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="240" y="214" text-anchor="middle" font-size="12" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="280" y="188" width="220" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#333">∅</text>
  <g filter="url(#sk)"><rect x="500" y="188" width="100" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="550" y="214" text-anchor="middle" font-size="12" fill="#333">否</text>
  <g filter="url(#sk)"><rect x="600" y="188" width="240" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="720" y="214" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">seen ← {a}</text>

  <!-- 第 2 行 -->
  <g filter="url(#sk)"><rect x="110" y="230" width="90" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="155" y="256" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="200" y="230" width="80" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="240" y="256" text-anchor="middle" font-size="12" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="280" y="230" width="220" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="390" y="256" text-anchor="middle" font-size="12" fill="#333">{a}</text>
  <g filter="url(#sk)"><rect x="500" y="230" width="100" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="550" y="256" text-anchor="middle" font-size="12" fill="#333">否</text>
  <g filter="url(#sk)"><rect x="600" y="230" width="240" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="720" y="256" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">seen ← {a, b}</text>

  <!-- 第 3 行 -->
  <g filter="url(#sk)"><rect x="110" y="272" width="90" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="155" y="298" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="200" y="272" width="80" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="240" y="298" text-anchor="middle" font-size="12" fill="#333">c</text>
  <g filter="url(#sk)"><rect x="280" y="272" width="220" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="390" y="298" text-anchor="middle" font-size="12" fill="#333">{a, b}</text>
  <g filter="url(#sk)"><rect x="500" y="272" width="100" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="550" y="298" text-anchor="middle" font-size="12" fill="#333">否</text>
  <g filter="url(#sk)"><rect x="600" y="272" width="240" height="42" fill="#fffdf7" stroke="#b9b9b0" stroke-width="1.2"/></g>
  <text x="720" y="298" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">seen ← {a, b, c}</text>

  <!-- 第 4 行（命中，绿色高亮） -->
  <g filter="url(#sk)"><rect x="110" y="314" width="90" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="155" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="200" y="314" width="80" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="240" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="280" y="314" width="220" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="390" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">{a, b, c}</text>
  <g filter="url(#sk)"><rect x="500" y="314" width="100" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="550" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是 ✓</text>
  <g filter="url(#sk)"><rect x="600" y="314" width="240" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="720" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 'c'（终止）</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="110" y="384" width="730" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="140" y="412" font-size="12" fill="#333"><tspan font-weight="bold" fill="#2b6e9e">结论：</tspan>命中下标 3 正是 'c' 的第二次出现，早于 b@4 与 a@5，</text>
  <text x="140" y="438" font-size="12" fill="#333">是所有字母中第二次出现最早的位置——故 'c' 即答案，i = 4..8 无需再看。</text>
</svg>
