<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：可行和只有「射线」与「单点」两种形态</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0 必须换成严格正整数 ⟹ 每个零至少补 1；全部换成 1 得「基线」</text>

  <!-- ============ left panel: z > 0 ============ -->
  <rect x="18" y="68" width="260" height="278" rx="10" fill="#fcfcfc" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">z₁ = 2 &gt; 0：橡皮筋</text>

  <!-- original array [3,2,0,1,0] -->
  <text x="34" y="101" font-size="9" fill="#4a7a3a" filter="url(#rough2)">≥1</text>
  <text x="186" y="101" font-size="9" fill="#4a7a3a" filter="url(#rough2)">≥1</text>
  <rect x="34" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="51" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="72" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="89" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="104" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="127" y="123" text-anchor="middle" font-size="12" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="148" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="104" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="123" text-anchor="middle" font-size="12" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="148" y="152" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">全部换成 1 ⟹ 基线 min₁ = s₁ + z₁ = 6 + 2 = 8</text>

  <!-- baseline array [3,2,1,1,1] -->
  <rect x="34" y="158" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="51" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="72" y="158" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="89" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="158" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="127" y="177" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="148" y="158" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="158" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="203" y="177" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="148" y="210" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">增量 Δ ≥ 0 全堆给一个 0（换成 1+Δ）</text>

  <!-- reachability ray -->
  <rect x="60" y="222" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="239" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">可达和 [min₁, +∞) 无缺口</text>
  <path d="M 34 258 L 264 258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 252 L 60 264" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="280" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">min₁ = 8</text>
  <text x="148" y="316" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">任何 T ≥ min₁ 都凑得出</text>

  <!-- ============ right panel: z = 0 ============ -->
  <rect x="282" y="68" width="260" height="278" rx="10" fill="#fcfcfc" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="412" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">z₂ = 0：定值</text>

  <!-- array [6,5,7] no zeros -->
  <rect x="298" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="315" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="336" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="353" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="374" y="104" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="391" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="412" y="156" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">没有任何 0 ⟹ 没有可调整的元素</text>

  <!-- single point on axis -->
  <path d="M 298 210 L 526 210" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 204 L 322 216" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 502 204 L 502 216" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322" y="230" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">14</text>
  <text x="502" y="230" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">22</text>
  <circle cx="412" cy="210" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="412" y="256" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">可达和 = { s₂ = 18 }</text>
  <text x="412" y="316" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">和被钉死，一个数都动不了</text>

  <!-- ============ bottom conclusion ============ -->
  <rect x="30" y="356" width="500" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">答案 = 两个可达集合之交的最小元素 = max(min₁, min₂)</text>
  <text x="280" y="404" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">交为空 ⟺ 下界小的一侧是「定值」（z = 0）⟹ 返回 -1</text>
</svg>
