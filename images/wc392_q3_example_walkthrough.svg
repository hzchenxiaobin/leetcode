<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 428"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="428" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：a = [2,5,5,6,8]，m = 2，两个方向</text>

  <!-- table 1: k = 4 -->
  <text x="40" y="56" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">k = 4（中位数变小：左半压顶 + 中位下降）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="78" y="82" text-anchor="middle" font-size="9.5" fill="#446688">位置</text>
    <rect x="120" y="66" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="152" y="82" text-anchor="middle" font-size="9.5" fill="#446688">0</text>
    <rect x="190" y="66" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="222" y="82" text-anchor="middle" font-size="9.5" fill="#446688">1</text>
    <rect x="260" y="66" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="292" y="82" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688">2（中位）</text>
    <rect x="330" y="66" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="362" y="82" text-anchor="middle" font-size="9.5" fill="#446688">3</text>
    <rect x="400" y="66" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="432" y="82" text-anchor="middle" font-size="9.5" fill="#446688">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="92" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="109" text-anchor="middle" font-size="9.5" fill="#555">原值</text>
    <rect x="120" y="92" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="109" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="190" y="92" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="109" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="260" y="92" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="292" y="109" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="330" y="92" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="362" y="109" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="400" y="92" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="109" text-anchor="middle" font-size="12" fill="#333">8</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="120" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="137" text-anchor="middle" font-size="9.5" fill="#555">终值</text>
    <rect x="120" y="120" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="137" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="190" y="120" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <text x="222" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
    <rect x="260" y="120" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="292" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">4</text>
    <rect x="330" y="120" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="362" y="137" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="400" y="120" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="137" text-anchor="middle" font-size="12" fill="#333">8</text>
    <rect x="478" y="120" width="122" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="539" y="137" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">合计代价 = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="148" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="165" text-anchor="middle" font-size="9.5" fill="#555">代价</text>
    <rect x="120" y="148" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="165" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="190" y="148" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">1</text>
    <rect x="260" y="148" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="292" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">1</text>
    <rect x="330" y="148" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="362" y="165" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="400" y="148" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="165" text-anchor="middle" font-size="11" fill="#999">0</text>
  </g>

  <text x="78" y="190" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">终态 [2,4,4,6,8]，中位数 = 4 ✓（左半 5 超标压下 + 中位 5 降到 4）</text>

  <!-- table 2: k = 7 -->
  <text x="40" y="216" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k = 7（中位数变大：中位上升 + 右半托底）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="226" width="76" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="78" y="242" text-anchor="middle" font-size="9.5" fill="#446688">位置</text>
    <rect x="120" y="226" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="152" y="242" text-anchor="middle" font-size="9.5" fill="#446688">0</text>
    <rect x="190" y="226" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="222" y="242" text-anchor="middle" font-size="9.5" fill="#446688">1</text>
    <rect x="260" y="226" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="292" y="242" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688">2（中位）</text>
    <rect x="330" y="226" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="362" y="242" text-anchor="middle" font-size="9.5" fill="#446688">3</text>
    <rect x="400" y="226" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="432" y="242" text-anchor="middle" font-size="9.5" fill="#446688">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="252" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="269" text-anchor="middle" font-size="9.5" fill="#555">原值</text>
    <rect x="120" y="252" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="269" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="190" y="252" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="269" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="260" y="252" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="292" y="269" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="330" y="252" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="362" y="269" text-anchor="middle" font-size="12" fill="#333">6</text>
    <rect x="400" y="252" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="269" text-anchor="middle" font-size="12" fill="#333">8</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="280" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="297" text-anchor="middle" font-size="9.5" fill="#555">终值</text>
    <rect x="120" y="280" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="297" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="190" y="280" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="297" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="260" y="280" width="64" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="292" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">7</text>
    <rect x="330" y="280" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="362" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5e24">7</text>
    <rect x="400" y="280" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="297" text-anchor="middle" font-size="12" fill="#333">8</text>
    <rect x="478" y="280" width="122" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="539" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">合计代价 = 3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="308" width="76" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="325" text-anchor="middle" font-size="9.5" fill="#555">代价</text>
    <rect x="120" y="308" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="152" y="325" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="190" y="308" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="222" y="325" text-anchor="middle" font-size="11" fill="#999">0</text>
    <rect x="260" y="308" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="292" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">2</text>
    <rect x="330" y="308" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="362" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">1</text>
    <rect x="400" y="308" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <text x="432" y="325" text-anchor="middle" font-size="11" fill="#999">0</text>
  </g>

  <text x="78" y="350" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">终态 [2,5,7,7,8]，中位数 = 7 ✓（中位 5 升到 7 + 右半 6 不足抬上）</text>

  <!-- bottom: even-length example -->
  <g filter="url(#rough2)">
    <rect x="40" y="362" width="560" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="384" text-anchor="middle" font-size="10.5" fill="#8a6a1a">偶数长度示例（示例 3）：nums = [1,2,3,4,5,6]，n = 6，m = 3</text>
    <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#8a6a1a">a[3] = 4 = k，左半全 ≤ 4、右半全 ≥ 4 → 答案 0；若误取 m = 2 则白花 1 步</text>
  </g>
</svg>
