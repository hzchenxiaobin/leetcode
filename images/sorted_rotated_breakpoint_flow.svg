<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">断点计数算法流程</text>
  <path d="M 200 38 Q 320 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始框 -->
  <g filter="url(#sk)">
    <rect x="200" y="52" width="220" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">cnt = 0,  i = 0 … n−1</text>

  <g filter="url(#sk)">
    <path d="M 310 96 L 310 118" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 判断菱形 1 -->
  <g filter="url(#sk)">
    <polygon points="310,124 456,170 310,216 164,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="163" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">nums[i] &gt;</text>
  <text x="310" y="181" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">nums[(i+1) mod n] ?</text>

  <!-- 是分支：cnt++ -->
  <g filter="url(#sk)">
    <path d="M 456 170 L 512 170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="478" y="160" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="516" y="148" width="96" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="564" y="174" text-anchor="middle" font-size="13" fill="#b03a3a" font-family="monospace" font-weight="bold">cnt++</text>

  <!-- 否分支：i++ -->
  <g filter="url(#sk)">
    <path d="M 310 216 L 310 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="322" y="238" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="240" y="252" width="148" height="40" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="314" y="276" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">i++</text>

  <!-- cnt++ 汇入 i++ -->
  <g filter="url(#sk)">
    <path d="M 564 192 L 564 272 L 392 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 回环：i < n -->
  <g filter="url(#sk)">
    <path d="M 240 272 L 120 272 L 120 170 L 158 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="112" y="230" font-size="10" fill="#888" transform="rotate(-90 112 230)">i &lt; n 继续循环</text>

  <!-- 退出循环 -->
  <g filter="url(#sk)">
    <path d="M 314 292 L 314 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="358" y="304" font-size="10" fill="#888">i = n 退出</text>

  <!-- 判断菱形 2 -->
  <g filter="url(#sk)">
    <polygon points="314,310 424,348 314,386 204,348" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="314" y="353" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">cnt ≤ 1 ?</text>

  <!-- 是：true -->
  <g filter="url(#sk)">
    <path d="M 204 348 L 148 348" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="178" y="338" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="40" y="326" width="104" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="92" y="352" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 true</text>

  <!-- 否：false -->
  <g filter="url(#sk)">
    <path d="M 424 348 L 480 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="452" y="338" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="484" y="326" width="112" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="540" y="352" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">返回 false</text>
</svg>
