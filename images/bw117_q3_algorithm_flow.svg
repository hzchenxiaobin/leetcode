<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">流程：快速幂算 7 个幂次 → 一条闭式</text>

  <!-- 输入 -->
  <rect x="40" y="60" width="110" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">读入 n</text>
  <text x="95" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1 ≤ n ≤ 10⁵)</text>

  <!-- 特判 -->
  <path d="M 150 86 L 190 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="58" width="120" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="80" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">n &lt; 4 ?</text>
  <text x="252" y="100" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">是 → 返回 0</text>

  <!-- 快速幂 -->
  <path d="M 312 86 L 352 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="50" width="180" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="74" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">快速幂 O(log n)</text>
  <text x="444" y="94" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">26ⁿ 25ⁿ 24ⁿ 23ⁿ</text>
  <text x="444" y="110" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">25ⁿ⁻¹ 24ⁿ⁻¹ 23ⁿ⁻¹</text>

  <!-- 闭式计算 -->
  <path d="M 444 122 Q 444 150 300 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="140" width="260" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">代入闭式（模 10⁹+7）</text>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">带负系数 → 结果可能为负</text>

  <!-- 输出 -->
  <path d="M 260 204 Q 260 224 260 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="242" width="160" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">(ans % p + p) % p</text>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">调整到 [0, p) 返回</text>

  <!-- 备注箭头 -->
  <path d="M 392 172 Q 440 200 420 240" fill="none" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.6"/>
  <text x="470" y="230" font-size="11" fill="#446688" filter="url(#rough2)">C++ 的 % 保留负号</text>
  <text x="470" y="246" font-size="11" fill="#446688" filter="url(#rough2)">最后必须 +p 再取模</text>
</svg>
