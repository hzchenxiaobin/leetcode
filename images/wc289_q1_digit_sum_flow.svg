<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：外层 while len &gt; k，内层按步长 k 取组</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <ellipse cx="200" cy="76" rx="66" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="81" text-anchor="middle" font-size="13" fill="#2b4a6e">读入 s, k</text>

  <!-- outer decision -->
  <g filter="url(#sk2)">
    <polygon points="200,104 300,146 200,188 100,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="142" text-anchor="middle" font-size="13" fill="#7a5415">len(s) &gt; k ?</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#7a5415">（等于 k 即停）</text>

  <!-- no branch -->
  <path d="M 304 146 L 430 146" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="352" y="138" font-size="12" fill="#2e5e22" font-weight="bold">否</text>
  <g filter="url(#sk2)">
    <rect x="435" y="122" width="170" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="520" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">返回 s</text>
  <text x="520" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">初始长度 ≤ k 时原样返回</text>

  <!-- yes branch -->
  <path d="M 200 190 L 200 218" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="208" font-size="12" fill="#b85450" font-weight="bold">是</text>

  <g filter="url(#sk2)">
    <rect x="120" y="222" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="244" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">next = ""</text>

  <!-- inner decision -->
  <path d="M 200 258 L 200 284" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <polygon points="200,288 290,326 200,364 110,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="322" text-anchor="middle" font-size="13" fill="#7a5415">i &lt; len(s) ?</text>
  <text x="200" y="338" text-anchor="middle" font-size="11" fill="#7a5415">i 从 0 起步长 k</text>

  <!-- inner yes: process group -->
  <path d="M 294 326 L 340 326" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="318" font-size="12" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk2)">
    <rect x="345" y="288" width="270" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="480" y="310" text-anchor="middle" font-size="12" fill="#2e5e22" font-family="monospace">g = s[i : i+k] 的数位和</text>
  <text x="480" y="330" text-anchor="middle" font-size="12" fill="#2e5e22" font-family="monospace">next += str(g)</text>
  <text x="480" y="352" text-anchor="middle" font-size="10" fill="#b85450">切片越界自动截断，末组无需特判</text>

  <!-- inner loop back -->
  <path d="M 480 286 Q 480 262 300 240 Q 250 232 206 282" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="266" font-size="10" fill="#4a7a3a">i += k</text>

  <!-- inner no: update s -->
  <path d="M 200 366 L 200 392" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="384" font-size="12" fill="#2e5e22" font-weight="bold">否</text>
  <g filter="url(#sk2)">
    <rect x="120" y="396" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="200" y="418" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">s = next</text>

  <!-- outer loop back -->
  <path d="M 118 413 Q 40 413 38 300 Q 36 170 96 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="42" y="360" font-size="11" fill="#8a3a36" font-weight="bold">回到外层判断</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="330" y="398" width="280" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="470" y="417" text-anchor="middle" font-size="11" fill="#7a5415">str(0) 得 "0" 而非空串，零和不会漏拼；</text>
  <text x="470" y="435" text-anchor="middle" font-size="11" fill="#7a5415">每轮一轮 O(len)，轮数对数级。</text>
</svg>
