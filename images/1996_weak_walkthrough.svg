<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[[1,5],[10,4],[4,3]]</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">排序（攻击↑，同攻击防御↓）后：[(1,5), (4,3), (10,4)] —— 单趟扫描，栈只存防御值</text>

  <!-- ===== panel 1 : x0 = 36 ===== -->
  <ellipse cx="126" cy="76" rx="15" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="126" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">①</text>
  <g filter="url(#sk)">
    <rect x="84" y="100" width="84" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="126" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(1,5)</text>
  <text x="126" y="166" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">栈空 → 5 直接入栈</text>
  <text x="126" y="184" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">ans = 0</text>
  <path d="M 66 350 L 186 350" stroke="#999" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="90" y="320" width="72" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="126" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="126" y="368" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">栈（底 → 顶）</text>

  <!-- ===== panel 2 : x0 = 254 ===== -->
  <ellipse cx="344" cy="76" rx="15" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="344" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">②</text>
  <g filter="url(#sk)">
    <rect x="302" y="100" width="84" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="344" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(4,3)</text>
  <text x="344" y="166" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">栈顶 5 ≥ 3，不弹出</text>
  <text x="344" y="184" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">3 入栈，ans = 0</text>
  <path d="M 284 350 L 404 350" stroke="#999" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="308" y="320" width="72" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="344" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">5</text>
  <g filter="url(#sk)">
    <rect x="308" y="288" width="72" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="344" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="344" y="368" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">栈（底 → 顶）</text>

  <!-- ===== panel 3 : x0 = 472 ===== -->
  <ellipse cx="562" cy="76" rx="15" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="562" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">③</text>
  <g filter="url(#sk)">
    <rect x="520" y="100" width="84" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="562" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(10,4)</text>
  <text x="562" y="166" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">栈顶 3 &lt; 4 → 弹出！</text>
  <text x="562" y="184" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">栈顶 5 ≥ 4，4 入栈</text>
  <text x="562" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = 1</text>

  <!-- popped element -->
  <text x="562" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">弹出 → 记为弱！</text>
  <g filter="url(#sk)">
    <rect x="526" y="224" width="72" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <text x="562" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
  <path d="M 562 284 L 562 258" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>

  <path d="M 502 350 L 622 350" stroke="#999" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="526" y="320" width="72" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="562" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">5</text>
  <g filter="url(#sk)">
    <rect x="526" y="288" width="72" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="562" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>
  <text x="562" y="368" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">栈（底 → 顶）</text>

  <!-- inter-panel arrows -->
  <path d="M 222 250 L 246 250" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 250 L 464 250" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom summary -->
  <text x="340" y="404" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">最终 ans = 1：弱角色恰为 (4,3)，被 (10,4) 双属性压制；栈中残留 5、4 对应 (1,5)、(10,4)，均非弱 ✓</text>
</svg>
