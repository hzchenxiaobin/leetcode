<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>
<text x="280" y="26" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按边数分层：dp[e][v] = 恰好 e 条边、终点 v 的可行边权和集合</text>
<text x="110" y="58" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0 条边</text>
<text x="300" y="58" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1 条边</text>
<text x="480" y="58" font-size="12" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2 条边</text>
<text x="24" y="104" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">v=0</text>
<rect x="58" y="78" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="110" y="103" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0}</text>
<rect x="248" y="78" width="104" height="38" rx="6" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="300" y="103" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∅</text>
<rect x="428" y="78" width="104" height="38" rx="6" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="480" y="103" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∅</text>
<text x="24" y="180" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">v=1</text>
<rect x="58" y="154" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="110" y="179" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0}</text>
<rect x="248" y="154" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="300" y="179" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{1}</text>
<rect x="428" y="154" width="104" height="38" rx="6" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="480" y="179" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∅</text>
<text x="24" y="256" font-size="11" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">v=2</text>
<rect x="58" y="230" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="110" y="255" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{0}</text>
<rect x="248" y="230" width="104" height="38" rx="6" fill="#ffffff" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
<text x="300" y="255" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∅</text>
<rect x="428" y="230" width="104" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="480" y="255" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">{3}</text>
<path d="M162,97 L246,172" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="196" y="122" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">走边权 1</text>
<path d="M352,173 L426,248" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="398" y="205" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">走边权 2</text>
<text x="280" y="316" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">集合用位掩码表示：第 s 位为 1 表示“和 s 可达”；和 ≥ t 的位直接丢弃</text>
<text x="280" y="340" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">答案 = 第 k 层所有集合里最大的可达和，没有则 −1</text>
</svg>
