<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c96a2b"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">从右往左扫 + 单调栈 + 栈上二分</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: flow chart ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="78" width="330" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="215" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">预处理（O(1)/查询）</text>
  <text x="66" y="118" font-size="10.5" fill="#444">每个查询归一化：情况①②直接写答案；</text>
  <text x="66" y="136" font-size="10.5" fill="#444">情况③ 挂到 qs[hi]，记录 x = heights[lo]</text>

  <path d="M 215 148 L 215 172" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="176" width="310" height="30" rx="12" fill="#f3eefa" stroke="#8a6eb8" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="215" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">for i = n−1 downto 0 :</text>

  <path d="M 215 206 L 215 228" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="232" width="310" height="82" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="215" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">① 回答挂在 i 上的查询</text>
  <text x="76" y="274" font-size="10.5" fill="#444">对每个 (x, id)：在栈中二分，找「最靠</text>
  <text x="76" y="292" font-size="10.5" fill="#444">栈顶的」heights[st[t]] &gt; x 的 t，</text>
  <text x="76" y="308" font-size="10.5" fill="#444">ans[id] = st[t]；找不到 → −1</text>

  <path d="M 215 314 L 215 336" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="340" width="310" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="215" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">② 弹栈</text>
  <text x="76" y="384" font-size="10.5" fill="#444" font-family="monospace">while 栈非空 且 heights[st.top] ≤ heights[i]</text>

  <path d="M 215 400 L 215 420" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="424" width="310" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="215" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">③ 将 i 入栈</text>

  <!-- loop back arrow -->
  <path d="M 370 446 L 400 446 Q 410 446 410 436 L 410 250 Q 410 240 400 240 L 376 240" stroke="#8a6eb8" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="350" font-size="10.5" fill="#5a3a7a" font-weight="bold">i −−，回到循环头</text>

  <text x="215" y="500" text-anchor="middle" font-size="10.5" fill="#888">i 扫完 → 未被回答的查询保持 −1，输出 ans</text>

  <!-- ===== right: stack invariant ===== -->
  <text x="680" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">栈不变量：站在 i 处「抬头可见」的楼</text>

  <!-- stack: bottom cell j=5 h=7, top cell j=4 h=2 -->
  <g filter="url(#sk)">
    <rect x="490" y="290" width="130" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="555" y="312" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">下标 5</text>
  <text x="555" y="330" text-anchor="middle" font-size="10.5" fill="#2e6e2e">h = 7</text>
  <g filter="url(#sk)">
    <rect x="490" y="238" width="130" height="52" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="555" y="260" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">下标 4</text>
  <text x="555" y="278" text-anchor="middle" font-size="10.5" fill="#2b6e9e">h = 2</text>

  <!-- stack annotations -->
  <text x="555" y="222" text-anchor="middle" font-size="10" fill="#888">栈顶：刚扫到的位置（较小）</text>
  <text x="555" y="362" text-anchor="middle" font-size="10" fill="#888">栈底：最右、最高的可见楼</text>
  <path d="M 478 336 L 478 252" stroke="#8a6eb8" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="300" text-anchor="end" font-size="10" fill="#5a3a7a" font-weight="bold">向上：下标递减</text>
  <text x="470" y="314" text-anchor="end" font-size="10" fill="#5a3a7a" font-weight="bold">高度严格递减</text>

  <!-- binary search demo box -->
  <g filter="url(#sk)">
    <rect x="650" y="220" width="256" height="122" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="6 3"/>
  </g>
  <text x="778" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">栈上二分（查询 x = 6）</text>
  <text x="666" y="264" font-size="10.5" fill="#444" font-family="monospace">从栈顶往下：</text>
  <text x="666" y="284" font-size="10.5" fill="#a3541c" font-family="monospace">4 (h=2)：2 ≤ 6，✗ 跳过</text>
  <text x="666" y="304" font-size="10.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">5 (h=7)：7 &gt; 6，✓ 命中</text>
  <text x="666" y="326" font-size="10" fill="#666">→ 答案 = 下标 5（满足者中最靠</text>
  <text x="666" y="338" font-size="10" fill="#666">   栈顶 ⇒ 下标最小 ⇒ 最左楼）</text>

  <!-- invariant box -->
  <g filter="url(#sk)">
    <rect x="460" y="376" width="446" height="64" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="683" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b">为什么栈里只有这些楼？</text>
  <text x="683" y="418" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">j 在栈中 ⟺ j &gt; i 且 heights[j] &gt; (i, j) 中一切高度</text>
  <text x="683" y="434" text-anchor="middle" font-size="10" fill="#888">中间有楼挡住视线的，早在它入栈时就被弹掉了</text>

  <!-- complexity box -->
  <g filter="url(#sk)">
    <rect x="460" y="458" width="446" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="683" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">复杂度</text>
  <text x="683" y="500" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">每个下标进出栈各一次：O(n)；每查询一次二分：O(log n)</text>
  <text x="683" y="516" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">总时间 O(n + q log n)，空间 O(n + q)</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="50" y="560" width="856" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="478" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828">关键一步：查询在「i 入栈之前」回答</text>
  <text x="478" y="606" text-anchor="middle" font-size="11" fill="#7a2828">此刻栈中恰好只有 j &gt; i 的可见楼 —— 任何 j &gt; hi 且 heights[j] &gt; x 的楼若存在，最左边那栋一定在栈里</text>
</svg>
