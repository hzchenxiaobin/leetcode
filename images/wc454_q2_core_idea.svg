<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：固定中间 j，两侧独立计数</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [8, 4, 2, 8, 4]，取 j = 1（nums[j] = 4），目标值 t = 2 × 4 = 8</text>

  <rect x="82" y="57" width="62" height="62" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <rect x="202" y="57" width="182" height="62" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>

  <rect x="88" y="64" width="50" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="64" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="113" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="173" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="233" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="293" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="353" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <text x="113" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="173" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="233" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="293" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="353" y="126" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>

  <path d="M 173 145 L 173 132" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="173" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>

  <text x="113" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左侧 i &lt; j</text>
  <text x="293" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">右侧 k &gt; j</text>

  <path d="M 113 156 Q 118 168 130 178" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 293 156 Q 300 168 380 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="180" width="236" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="154" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">left[8]：左侧值恰为 8 的个数</text>
  <text x="154" y="226" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只有下标 0 → left[8] = 1</text>

  <rect x="288" y="180" width="236" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="406" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">right[8]：右侧值恰为 8 的个数</text>
  <text x="406" y="226" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">只有下标 3 → right[8] = 1</text>

  <path d="M 154 246 Q 200 262 244 272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 246 Q 360 262 316 272" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="274" width="340" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">固定 j = 1 的贡献 = left[8] × right[8] = 1 × 1</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">对应特殊三元组 (i, j, k) = (0, 1, 3)</text>

  <rect x="36" y="352" width="488" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i 与 k 的选取互不干扰 → 乘法原理</text>
  <text x="280" y="394" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">再对所有 j 求和：ans = Σ left[2·nums[j]] × right[2·nums[j]]</text>
</svg>
