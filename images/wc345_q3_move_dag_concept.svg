<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">三种移动都恰好右移一列：移动次数 = 终点列下标</text>
  <text x="260" y="47" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">从 (r,c) 只能到 (r−1,c+1)、(r,c+1)、(r+1,c+1)，列下标严格递增</text>

  <!-- 列标签 -->
  <text x="71" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c−1</text>
  <text x="117" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c</text>
  <text x="163" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c+1</text>
  <!-- 行标签 -->
  <text x="42" y="114" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">r−1</text>
  <text x="42" y="160" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">r</text>
  <text x="42" y="206" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">r+1</text>

  <!-- 中性格子 -->
  <rect x="48" y="88" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="48" y="134" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="48" y="180" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="48" y="226" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="88" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="180" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="226" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="140" y="226" width="46" height="46" rx="4" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="71" y="115" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="71" y="161" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="71" y="207" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="71" y="253" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="117" y="115" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>
  <text x="117" y="207" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="117" y="253" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="163" y="253" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>

  <!-- 当前格 -->
  <rect x="94" y="134" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="117" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="117" y="169" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">(r,c)</text>

  <!-- 三个目标格 -->
  <rect x="140" y="88" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">8</text>
  <text x="163" y="124" text-anchor="middle" font-size="9.5" fill="#3a5a2e" filter="url(#rough2)">行−1</text>
  <rect x="140" y="134" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">7</text>
  <text x="163" y="170" text-anchor="middle" font-size="9.5" fill="#3a5a2e" filter="url(#rough2)">行 0</text>
  <rect x="140" y="180" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">9</text>
  <text x="163" y="216" text-anchor="middle" font-size="9.5" fill="#3a5a2e" filter="url(#rough2)">行+1</text>

  <!-- 三条移动箭头 -->
  <path d="M140,146 L158,120" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140,157 L158,157" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140,168 L158,194" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="117" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">行 ∈ {−1, 0, +1}，列一律 +1 → 无环</text>

  <!-- 右侧观察框 -->
  <rect x="228" y="88" width="264" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">观察一：列下标严格递增</text>
  <text x="360" y="132" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">依赖无环（DAG）→ 可按列推进 DP</text>

  <rect x="228" y="158" width="264" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">观察二：每走一步恰右移一列</text>
  <text x="360" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">到达列 c ↔ 已移动 c 次</text>

  <rect x="228" y="228" width="264" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">观察三：答案 = 最大可达列下标</text>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">不必维护步数，布尔可达性即可</text>

  <!-- 底部结论 -->
  <rect x="30" y="318" width="460" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">数值 DP 可彻底布尔化：reach[r] 只记「能否到达」</text>
  <text x="260" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 最后一个非空可达列，遇空列即可提前终止</text>
</svg>
