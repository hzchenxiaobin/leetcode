<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：4×5 矩阵，最大幻方 k = 3</text>

  <!-- 4x5 网格 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="66" y="60" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92" y="91">7</text>
    <rect x="118" y="60" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="91">1</text>
    <rect x="170" y="60" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="196" y="91">4</text>
    <rect x="222" y="60" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="91">5</text>
    <rect x="274" y="60" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="300" y="91">6</text>

    <rect x="66" y="112" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92" y="143">2</text>
    <rect x="118" y="112" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="143">5</text>
    <rect x="170" y="112" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="196" y="143">1</text>
    <rect x="222" y="112" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="143">6</text>
    <rect x="274" y="112" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="300" y="143">4</text>

    <rect x="66" y="164" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92" y="195">1</text>
    <rect x="118" y="164" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="195">5</text>
    <rect x="170" y="164" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="196" y="195">4</text>
    <rect x="222" y="164" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="248" y="195">3</text>
    <rect x="274" y="164" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/><text x="300" y="195">2</text>

    <rect x="66" y="216" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="92" y="247">1</text>
    <rect x="118" y="216" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="144" y="247">2</text>
    <rect x="170" y="216" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="196" y="247">7</text>
    <rect x="222" y="216" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="248" y="247">3</text>
    <rect x="274" y="216" width="52" height="52" fill="#fafafa" stroke="#bbb" rx="4"/><text x="300" y="247">4</text>
  </g>
  <rect x="166" y="56" width="164" height="164" fill="none" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="248" y="46" font-size="13" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子块 (r,c) = (0,2)，k = 3</text>

  <!-- 右侧校验清单 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="360" y="60" width="180" height="208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="450" y="84" text-anchor="middle" font-weight="bold" fill="#7a5c1e">校验（幻值 12）</text>
    <text x="450" y="108" text-anchor="middle" font-size="12">行：4+5+6 = 15？</text>
    <text x="450" y="126" text-anchor="middle" font-size="12" fill="#b85450">✗ 不是这个子块！</text>
    <text x="450" y="150" text-anchor="middle" font-size="12" fill="#666">换 (r,c) = (1,1)：</text>
    <text x="450" y="172" text-anchor="middle" font-size="12">行 5+1+6 = 12 ✓</text>
    <text x="450" y="190" text-anchor="middle" font-size="12">行 5+4+3 = 12 ✓</text>
    <text x="450" y="208" text-anchor="middle" font-size="12">行 2+7+3 = 12 ✓</text>
    <text x="450" y="226" text-anchor="middle" font-size="12">列 5+5+2 = 12 ✓×3</text>
    <text x="450" y="244" text-anchor="middle" font-size="12">对角 5+4+3 = 12 ✓ 两条</text>
    <text x="450" y="262" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold">→ 是幻方，返回 3</text>
  </g>

  <!-- 结论 -->
  <rect x="66" y="290" width="474" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="303" y="312" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">示例 2（3×4 矩阵）不存在 3×3 幻方，但 [[3,3],[3,3]] 等满足 → 答案 2</text>
  <text x="303" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">左图红框只是枚举过程中的一个「候选」，不是答案本身</text>
</svg>
