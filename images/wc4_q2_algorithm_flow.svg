<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心算法流程：每轮只做一次判定</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环体执行几次，答案就是几；循环不变式是「cnt = 把当前 n 变成 1 的已用步数」</text>

  <!-- 开始 -->
  <rect x="205" y="62" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">输入 n，cnt = 0</text>

  <!-- 菱形 1：n > 1 -->
  <polygon points="192,152 270,116 348,152 270,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="157" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">n &gt; 1 ?</text>

  <rect x="404" y="135" width="136" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="472" y="157" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 cnt</text>

  <!-- 菱形 2：偶 ? -->
  <polygon points="192,244 270,208 348,244 270,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">n 是偶数 ?</text>

  <rect x="404" y="226" width="114" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="461" y="250" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">n ← n / 2</text>

  <!-- 菱形 3：n==3 或 n%4==1 -->
  <polygon points="162,344 270,308 378,344 270,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">n == 3 或 n % 4 == 1 ?</text>

  <rect x="22" y="326" width="104" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="350" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">n ← n − 1</text>

  <rect x="414" y="326" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="466" y="350" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">n ← n + 1</text>

  <rect x="180" y="414" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">cnt ← cnt + 1</text>

  <!-- 连线 -->
  <g stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 270 96 L 270 112" marker-end="url(#arr)"/>
    <path d="M 348 152 L 398 152" marker-end="url(#arr)"/>
    <path d="M 270 188 L 270 204" marker-end="url(#arr)"/>
    <path d="M 348 244 L 398 244" marker-end="url(#arr)"/>
    <path d="M 270 280 L 270 304" marker-end="url(#arr)"/>
    <path d="M 162 344 L 130 344" marker-end="url(#arr)"/>
    <path d="M 378 344 L 410 344" marker-end="url(#arr)"/>
    <path d="M 74 362 L 74 386 L 240 386 L 240 410" marker-end="url(#arr)"/>
    <path d="M 466 362 L 466 386 L 320 386 L 320 410" marker-end="url(#arr)"/>
    <path d="M 518 244 L 534 244 L 534 432 L 364 432" marker-end="url(#arr)"/>
    <path d="M 270 450 L 270 472 L 14 472 L 14 152 L 188 152" marker-end="url(#arr)"/>
  </g>

  <g font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">
    <text x="374" y="145">否</text>
    <text x="284" y="202">是</text>
    <text x="374" y="237">是</text>
    <text x="284" y="302">否</text>
    <text x="146" y="337">是</text>
    <text x="394" y="337">否</text>
    <text x="14" y="490">回边</text>
  </g>

  <text x="300" y="508" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每两轮 n 至少减半（先 ±1 变偶，再 /2），所以最多 2·log₂n + 1 轮</text>
</svg>
