<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：拼接数是底 10 的多项式，前缀相减还原区间值</text>

  <text x="30" y="66" font-size="12" fill="#555" filter="url(#rough2)">s =</text>

  <rect x="64" y="42" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="86" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="86" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">占位·进和</text>

  <rect x="116" y="42" width="44" height="44" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="63" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <text x="138" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">透明</text>

  <rect x="168" y="42" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">占位·进和</text>

  <rect x="220" y="42" width="44" height="44" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="63" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <text x="242" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">透明</text>

  <rect x="272" y="42" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="294" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="294" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">占位·进和</text>

  <rect x="324" y="42" width="44" height="44" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="63" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <text x="346" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">透明</text>

  <rect x="376" y="42" width="44" height="44" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="63" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">0</text>
  <text x="398" y="80" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">透明</text>

  <rect x="428" y="42" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="63" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="450" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">占位·进和</text>

  <text x="260" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">'0' 全透明：不占位、不进和、不计数 —— 对三个前缀都原地踏步</text>

  <text x="24" y="140" font-size="11" fill="#555" filter="url(#rough2)">P 生长（Horner）：</text>

  <rect x="140" y="124" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M178 137 L 212 137" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">×10+2</text>

  <rect x="216" y="124" width="42" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="237" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <path d="M262 137 L 296 137" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="279" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">×10+3</text>

  <rect x="300" y="124" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">123</text>

  <path d="M352 137 L 386 137" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="369" y="160" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">×10+4</text>

  <rect x="390" y="124" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1234</text>

  <rect x="20" y="176" width="158" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="99" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">P[i]：拼接前缀（mod M）</text>
  <text x="99" y="218" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">P[i+1] = P[i]·10 + d</text>
  <text x="99" y="236" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（非零 d 才更新）</text>

  <rect x="188" y="176" width="158" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="267" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">S[i]：数位和前缀</text>
  <text x="267" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sum = S[r+1] − S[l]</text>
  <text x="267" y="236" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（0 不进和）</text>

  <rect x="356" y="176" width="144" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="428" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">C[i]：非零个数前缀</text>
  <text x="428" y="218" text-anchor="middle" font-size="11" fill="#a07818" filter="url(#rough2)">幂次 = C[r+1] − C[l]</text>
  <text x="428" y="236" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（0 不占位）</text>

  <rect x="40" y="262" width="440" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">真值分解：P[r+1] = P[l]·10^k + x，k = C[r+1] − C[l]</text>
  <text x="260" y="310" text-anchor="middle" font-size="12.5" fill="#8a6a30" filter="url(#rough2)">x ≡ P[r+1] − P[l]·pow10[k] （mod M）</text>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#8a6a30" filter="url(#rough2)">sum = S[r+1] − S[l]，answer = x·sum mod M</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同余对加减乘封闭 ⟹ 模值代入依然成立；免逆元、免跳零</text>

  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全零区间：k = 0 且 P[r+1] = P[l] ⟹ 自动得 x = 0、sum = 0</text>
</svg>
