<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：只需要「行计数」与「列计数」</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">能否通信只取决于同行 / 同列还有没有别的服务器，与其它格子无关</text>

  <!-- 4 x 3 网格：grid = [[1,0,1,0],[0,1,0,0],[1,0,1,1]] -->
  <g filter="url(#rough2)">
    <!-- 第 0 行 -->
    <rect x="64" y="104" width="33" height="33" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="80" y="127" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <rect x="98" y="104" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="114" y="127" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <rect x="132" y="104" width="33" height="33" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="148" y="127" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <rect x="166" y="104" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="182" y="127" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <!-- 第 1 行 -->
    <rect x="64" y="138" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="80" y="161" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <rect x="98" y="138" width="33" height="33" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="114" y="161" text-anchor="middle" font-size="12" fill="#8a3a36">1</text>
    <rect x="132" y="138" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="148" y="161" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <rect x="166" y="138" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="182" y="161" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <!-- 第 2 行 -->
    <rect x="64" y="172" width="33" height="33" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="80" y="195" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <rect x="98" y="172" width="33" height="33" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="114" y="195" text-anchor="middle" font-size="12" fill="#bbbbbb">0</text>
    <rect x="132" y="172" width="33" height="33" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="148" y="195" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <rect x="166" y="172" width="33" height="33" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="182" y="195" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  </g>

  <!-- 右侧：行计数 -->
  <g filter="url(#rough2)">
    <rect x="212" y="106" width="30" height="29" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="227" y="126" text-anchor="middle" font-size="12" fill="#8a6a20">2</text>
    <rect x="212" y="140" width="30" height="29" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="227" y="160" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
    <rect x="212" y="174" width="30" height="29" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="227" y="194" text-anchor="middle" font-size="12" fill="#8a6a20">3</text>
    <text x="252" y="126" font-size="10.5" fill="#777">右侧方块 = 该行的服务器台数</text>
  </g>

  <!-- 下方：列计数 -->
  <g filter="url(#rough2)">
    <rect x="65" y="216" width="31" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="235" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <rect x="99" y="216" width="31" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="114" y="235" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <rect x="133" y="216" width="31" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="148" y="235" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <rect x="167" y="216" width="31" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="182" y="235" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="212" y="235" font-size="10.5" fill="#777">下方方块 = 该列的服务器台数</text>
  </g>

  <!-- 判定结论 -->
  <g filter="url(#rough2)">
    <rect x="44" y="266" width="228" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="58" y="286" font-size="10.5" fill="#3a5a30" font-weight="bold">rowCnt[i] &gt; 1 或 colCnt[j] &gt; 1</text>
    <text x="58" y="304" font-size="10" fill="#444">⇒ 与别的服务器通信，计入答案</text>
    <rect x="292" y="266" width="224" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="306" y="286" font-size="10.5" fill="#8a3a36" font-weight="bold">rowCnt[i] = 1 且 colCnt[j] = 1</text>
    <text x="306" y="304" font-size="10" fill="#444">⇒ 孤岛服务器，不计入答案</text>
  </g>

  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999">红色格子 (1,1)：行 1 台、列 1 台 → 孤岛；蓝色格子 (0,0)：同行还有 1 台 → 参与通信</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999">于是问题从「两两配对」降级为「两趟计数」</text>
</svg>
