<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">贪心流程：先配对，再补零头</text>

  <rect x="120" y="48" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">逐位比较 s1[i] 与 s2[i]</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">统计 a =(x,y) 型个数，b =(y,x) 型个数</text>

  <path d="M 280 90 L 280 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,112 392,158 280,204 168,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">(a + b) 为奇数？</text>
  <text x="280" y="170" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">即两串 x 总数是奇数</text>

  <path d="M 168 158 L 152 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="134" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="85" y="155" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <text x="85" y="171" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">奇偶性挡死</text>

  <path d="M 280 204 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="224" width="368" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">同类两两配对：每次交换同时修好两个位置</text>
  <text x="280" y="261" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">开销 a // 2 + b // 2</text>

  <path d="M 280 270 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="294" width="408" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">若 a、b 都是奇数：只剩 1 个 A 型和 1 个 B 型</text>
  <text x="280" y="331" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">同位置自交换翻转 1 次，再配对 1 次 → 额外 2 次</text>

  <path d="M 280 340 L 280 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="364" width="368" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">answer = a // 2 + b // 2 + 2 × (a mod 2)</text>
</svg>
