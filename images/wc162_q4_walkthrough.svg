<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：字母预算 a2 c1 d3 g1 o2（没有 t）</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先按「单个单词能否拼出」过滤，再在剩余单词上做选 / 不选</text>

  <!-- 表头 -->
  <rect x="26" y="58" width="508" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="78" text-anchor="middle" font-size="12" fill="#2f4a6b" filter="url(#rough2)">单词</text>
  <text x="210" y="78" text-anchor="middle" font-size="12" fill="#2f4a6b" filter="url(#rough2)">字母消耗向量</text>
  <text x="332" y="78" text-anchor="middle" font-size="12" fill="#2f4a6b" filter="url(#rough2)">价值</text>
  <text x="452" y="78" text-anchor="middle" font-size="12" fill="#2f4a6b" filter="url(#rough2)">判定</text>

  <!-- 第 1 行 dog -->
  <rect x="26" y="88" width="508" height="34" fill="#ffffff" stroke="#b9c6d8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dog</text>
  <text x="210" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d1 g1 o1</text>
  <text x="332" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="452" y="110" text-anchor="middle" font-size="11" fill="#3a7a3a" filter="url(#rough2)">✓ 可拼出</text>

  <!-- 第 2 行 cat -->
  <rect x="26" y="122" width="508" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cat</text>
  <text x="210" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a1 c1 t1</text>
  <text x="332" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="452" y="144" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗ 缺 t，剔除</text>

  <!-- 第 3 行 dad -->
  <rect x="26" y="156" width="508" height="34" fill="#ffffff" stroke="#b9c6d8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dad</text>
  <text x="210" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a1 d2</text>
  <text x="332" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">11</text>
  <text x="452" y="178" text-anchor="middle" font-size="11" fill="#3a7a3a" filter="url(#rough2)">✓ 可拼出</text>

  <!-- 第 4 行 good -->
  <rect x="26" y="190" width="508" height="34" fill="#ffffff" stroke="#b9c6d8" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="78" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">good</text>
  <text x="210" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d1 g1 o2</text>
  <text x="332" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">12</text>
  <text x="452" y="212" text-anchor="middle" font-size="11" fill="#3a7a3a" filter="url(#rough2)">✓ 可拼出</text>

  <path d="M 280 226 L 280 248" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预算消耗 -->
  <rect x="36" y="252" width="488" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">先选 good：a2 c1 d2 g0 o0　→　再选 dad：a1 c1 d0 g0 o0</text>

  <path d="M 280 286 L 280 306" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="310" width="488" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">选中 {dad, good}：11 + 12 = 23，字母刚好用尽</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#ab8a44" filter="url(#rough2)">回溯继续尝试其它分支，都无法超过 23，best 停在 23</text>

  <!-- 对照 -->
  <rect x="36" y="362" width="238" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="155" y="383" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">{dad, dog} = 11 + 10 = 21</text>

  <rect x="286" y="362" width="238" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="405" y="383" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">{good, dad, dog} 超 d 预算（4 &gt; 3）</text>

  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">注意 t 的分值是 0，但 letters 中根本没有 t —— 0 分字母同样要占字母表名额</text>
</svg>
