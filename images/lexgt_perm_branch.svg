<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="490" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：前缀对齐 + 一位抬升 + 升序后缀</text>
  <path d="M 190 42 Q 330 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- target row -->
  <text x="152" y="82" text-anchor="end" font-size="14" fill="#2b2b2b">target =</text>
  <g filter="url(#sk)">
    <rect x="170" y="58" width="54" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="226" y="58" width="54" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
    <rect x="282" y="58" width="54" height="38" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="197" y="83">b</text>
    <text x="253" y="83">b</text>
    <text x="309" y="83">a</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="197" y="112" fill="#4a7a3a" font-weight="bold">0 · 对齐段</text>
    <text x="253" y="112" fill="#b85450" font-weight="bold">1 · 分叉位 i</text>
    <text x="309" y="112" fill="#446688" font-weight="bold">2 · 自由段</text>
  </g>

  <!-- p row -->
  <text x="152" y="164" text-anchor="end" font-size="14" fill="#2b2b2b">构造 p =</text>
  <g filter="url(#sk)">
    <rect x="170" y="140" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="226" y="140" width="54" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="282" y="140" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="197" y="165" fill="#2e5e22">b</text>
    <text x="253" y="165" fill="#b85450">c</text>
    <text x="309" y="165" fill="#2f4a6b">a</text>
  </g>

  <!-- right annotations with leader lines -->
  <path d="M 336 76 Q 352 72 366 70" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="68" font-size="11.5" fill="#2e5e22" font-weight="bold">前缀逐字复制 target</text>
  <text x="372" y="84" font-size="11" fill="#2e5e22">所需字符从桶中扣除</text>

  <path d="M 282 158 Q 296 168 306 176" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="184" font-size="11.5" fill="#b85450" font-weight="bold">'c' = 桶中大于 target[i] 的最小字符</text>
  <text x="312" y="200" font-size="11" fill="#b85450">一位抬升，仅此一位</text>

  <path d="M 340 162 Q 354 162 366 162" stroke="#446688" stroke-width="0" fill="none"/>
  <text x="372" y="152" font-size="11.5" fill="#2f4a6b" font-weight="bold">尾部 = 剩余字符升序</text>
  <text x="372" y="168" font-size="11" fill="#2f4a6b">自由段能取的最小填充</text>

  <!-- divider -->
  <path d="M 120 218 Q 330 226 540 218" stroke="#c9c9c9" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- compare section -->
  <text x="330" y="246" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b">越晚分叉，结果越小（同例：s = "abc"，target = "bba"）</text>

  <!-- row i=0 -->
  <text x="108" y="280" text-anchor="end" font-size="12" fill="#666">i=0 早分叉</text>
  <g filter="url(#sk)">
    <rect x="120" y="258" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="160" y="258" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
    <rect x="200" y="258" width="38" height="34" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#555">
    <text x="139" y="280" fill="#b85450" font-weight="bold">c</text>
    <text x="179" y="280">a</text>
    <text x="219" y="280">b</text>
  </g>
  <text x="254" y="280" font-size="14.5" fill="#888" font-weight="bold">"cab"</text>

  <!-- row i=1 -->
  <text x="108" y="332" text-anchor="end" font-size="12" fill="#666">i=1 晚分叉</text>
  <g filter="url(#sk)">
    <rect x="120" y="310" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="160" y="310" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="200" y="310" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="139" y="332" fill="#2e5e22">b</text>
    <text x="179" y="332" fill="#b85450">c</text>
    <text x="219" y="332" fill="#2f4a6b">a</text>
  </g>
  <text x="254" y="332" font-size="14.5" fill="#d6a040" font-weight="bold">"bca"</text>

  <!-- compare notes -->
  <text x="372" y="272" font-size="11.5" fill="#555">两串首差在位置 0：</text>
  <text x="372" y="290" font-size="11.5" fill="#b85450" font-weight="bold">'c' &gt; 'b'  ⟹  "cab" &gt; "bca"</text>
  <text x="372" y="312" font-size="11" fill="#666">晚分叉的前缀贴 target 更久</text>
  <text x="372" y="328" font-size="11" fill="#666">⟹ 整串更小</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="150" y="374" width="360" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="330" y="401" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5415">答案取「最晚」的可行分叉位 ⟹ 本例为 "bca"</text>

  <text x="330" y="452" text-anchor="middle" font-size="11" fill="#888">s="abc" 的排列中大于 "bba" 的有 "bca"、"cab"、"cba"，最小者是 "bca" —— 与最晚分叉构造一致</text>
  <text x="330" y="472" text-anchor="middle" font-size="11" fill="#888">i=2 处前缀 "bb" 需要两个 'b'，桶中只有一个 ⟹ 不可行</text>
</svg>
