<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [7,2,5,10,8]，k = 2</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">lo = max = 10，hi = sum = 32，四轮判定后收敛到 18</text>

  <!-- 表头 -->
  <rect x="30" y="62" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="58" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">轮</text>
  <text x="106" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">lo</text>
  <text x="150" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">hi</text>
  <text x="194" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">mid</text>
  <text x="330" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">贪心切段</text>
  <text x="424" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">段数</text>
  <text x="462" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">判定</text>
  <text x="508" y="82" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">更新</text>

  <!-- 网格线 -->
  <path d="M 30 92 L 530 92" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 124 L 530 124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 156 L 530 156" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 188 L 530 188" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 220 L 530 220" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第 1 轮 -->
  <text x="58" y="113" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="106" y="113" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">10</text>
  <text x="150" y="113" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">32</text>
  <text x="194" y="113" text-anchor="middle" font-size="9" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">21</text>
  <text x="330" y="113" text-anchor="middle" font-size="8.4" fill="#555" filter="url(#rough2)">[7,2,5] | [10,8]</text>
  <text x="424" y="113" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="462" y="113" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="508" y="113" text-anchor="middle" font-size="8.6" fill="#555" filter="url(#rough2)">hi ← 21</text>

  <!-- 第 2 轮 -->
  <text x="58" y="145" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="106" y="145" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">10</text>
  <text x="150" y="145" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">21</text>
  <text x="194" y="145" text-anchor="middle" font-size="9" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">15</text>
  <text x="330" y="145" text-anchor="middle" font-size="8.4" fill="#555" filter="url(#rough2)">[7,2,5] | [10] | [8]</text>
  <text x="424" y="145" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="462" y="145" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="508" y="145" text-anchor="middle" font-size="8.6" fill="#555" filter="url(#rough2)">lo ← 16</text>

  <!-- 第 3 轮 -->
  <text x="58" y="177" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3</text>
  <text x="106" y="177" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">16</text>
  <text x="150" y="177" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">21</text>
  <text x="194" y="177" text-anchor="middle" font-size="9" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">18</text>
  <text x="330" y="177" text-anchor="middle" font-size="8.4" fill="#555" filter="url(#rough2)">[7,2,5] | [10,8]</text>
  <text x="424" y="177" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2</text>
  <text x="462" y="177" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="508" y="177" text-anchor="middle" font-size="8.6" fill="#555" filter="url(#rough2)">hi ← 18</text>

  <!-- 第 4 轮 -->
  <text x="58" y="209" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4</text>
  <text x="106" y="209" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">16</text>
  <text x="150" y="209" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">18</text>
  <text x="194" y="209" text-anchor="middle" font-size="9" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">17</text>
  <text x="330" y="209" text-anchor="middle" font-size="8.4" fill="#555" filter="url(#rough2)">[7,2,5] | [10] | [8]</text>
  <text x="424" y="209" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="462" y="209" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="508" y="209" text-anchor="middle" font-size="8.6" fill="#555" filter="url(#rough2)">lo ← 18</text>

  <!-- 结论 -->
  <rect x="40" y="234" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="254" font-size="8.9" fill="#8a6a20" filter="url(#rough2)">lo = hi = 18 时跳出循环 → 返回 18；最优分组 [7,2,5] | [10,8]，段和 14 与 18</text>
  <text x="54" y="272" font-size="8.9" fill="#555" filter="url(#rough2)">mid = 15、17 都只能切成 3 段：14 装不下 10，10 与 8 也挤不进一段</text>
  <text x="54" y="289" font-size="8.9" fill="#555" filter="url(#rough2)">mid = 18 恰好容下 [10,8]，段数降到 2 → 18 就是最小可行值</text>

  <!-- 收缩过程 -->
  <rect x="40" y="306" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="54" y="326" font-size="9" fill="#3a4a66" filter="url(#rough2)">二分只关心「可行 / 不可行」：可行收右界，不可行抬左界，每轮区间至少减半</text>
  <text x="54" y="345" font-size="9" fill="#555" filter="url(#rough2)">候选值个数：23 → 12 → 6 → 3 → 1（起始区间 [10, 32] 共 23 个整数）</text>
  <text x="54" y="360" font-size="8.6" fill="#888" filter="url(#rough2)">判定总耗时 O(4n) = 20 次加法，而穷举切法要 C(4,1) 次比较</text>

  <text x="280" y="388" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第 1、3 轮可行，第 2、4 轮不可行：答案左侧全不可行，右侧全可行</text>
</svg>
