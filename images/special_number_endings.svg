<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：被 25 整除 ⇔ 只看末两位</text>

  <!-- 分解：22450 -->
  <text x="40" y="62" font-size="12" fill="#555">任意数字串（以 22450 为例）：</text>
  <rect x="40" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="94" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="76" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="94" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="112" y="72" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="129" y="94" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="166" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="94" text-anchor="middle" font-size="14" fill="#333">5</text>
  <rect x="202" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="219" y="94" text-anchor="middle" font-size="14" fill="#333">0</text>
  <line x1="40" y1="114" x2="146" y2="114" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="93" y="132" text-anchor="middle" font-size="11" fill="#446688">q（×100 的部分）</text>
  <line x1="166" y1="114" x2="236" y2="114" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="201" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a">末两位 r = 50</text>

  <!-- 右侧公式面板 -->
  <rect x="300" y="56" width="220" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="80" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x = 100·q + r</text>
  <text x="410" y="102" text-anchor="middle" font-size="12" fill="#333">100 ≡ 0 (mod 25)</text>
  <text x="410" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⇒ x ≡ r (mod 25)</text>

  <!-- 四种合法结尾 -->
  <text x="40" y="170" font-size="12" fill="#555" font-weight="bold">合法结尾（0~99 中 25 的倍数）：</text>
  <text x="340" y="170" font-size="11" fill="#b85450" font-weight="bold">其余结尾 ✗</text>
  <rect x="40" y="180" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="64" y="202" text-anchor="middle" font-size="14" fill="#333">00</text>
  <text x="92" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="110" y="180" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="134" y="202" text-anchor="middle" font-size="14" fill="#333">25</text>
  <text x="162" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="180" y="180" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="202" text-anchor="middle" font-size="14" fill="#333">50</text>
  <text x="232" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="250" y="180" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="274" y="202" text-anchor="middle" font-size="14" fill="#333">75</text>
  <text x="302" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="348" y="180" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="372" y="202" text-anchor="middle" font-size="14" fill="#333">10</text>
  <text x="400" y="200" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="418" y="180" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="442" y="202" text-anchor="middle" font-size="14" fill="#333">55</text>
  <text x="470" y="200" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- 值为 0 的两种形态 -->
  <text x="40" y="240" font-size="12" fill="#555" font-weight="bold">另外两类目标：值 = 0（0 也能被 25 整除）：</text>
  <rect x="40" y="252" width="160" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">只留一个 '0' → 0</text>
  <text x="120" y="296" text-anchor="middle" font-size="11" fill="#888">代价 n − 1</text>
  <rect x="216" y="252" width="160" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="296" y="276" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">全删 → 空串 = 0</text>
  <text x="296" y="296" text-anchor="middle" font-size="11" fill="#888">代价 n</text>
  <rect x="392" y="252" width="128" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="456" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = 6 类目标</text>
  <text x="456" y="296" text-anchor="middle" font-size="11" fill="#333">代价取最小</text>

  <text x="40" y="340" font-size="11" fill="#888">结果允许前导零：整除性看数值的末两位，与书写形式无关</text>
  <text x="40" y="360" font-size="11" fill="#888">n ≤ 100（数值可达 10^100）→ 全程按字符串处理</text>
</svg>
