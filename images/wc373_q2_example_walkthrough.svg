<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：s = "baeyh"，k = 2</text>
  <path d="M 170 32 Q 320 40 470 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 120 46 Q 254 10 388 46" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="254" y="22" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">baey ✓</text>
  <path d="M 176 52 Q 284 30 392 52" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="284" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">aeyh ✓</text>

  <g filter="url(#sk)"><rect x="120" y="56" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="144" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">b</text>
  <g filter="url(#sk)"><rect x="176" y="56" width="48" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)"><rect x="232" y="56" width="48" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="256" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">e</text>
  <g filter="url(#sk)"><rect x="288" y="56" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="312" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">y</text>
  <g filter="url(#sk)"><rect x="344" y="56" width="48" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="368" y="81" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">h</text>

  <text x="144" y="112" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="200" y="112" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="256" y="112" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="312" y="112" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="368" y="112" text-anchor="middle" font-size="10.5" fill="#999">4</text>

  <g filter="url(#sk)"><rect x="436" y="60" width="14" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="456" y="71" font-size="11" fill="#666">元音</text>
  <g filter="url(#sk)"><rect x="436" y="82" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="456" y="93" font-size="11" fill="#666">辅音</text>

  <text x="95" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">子串</text>
  <text x="160" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">区间</text>
  <text x="215" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">v</text>
  <text x="256" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">L</text>
  <text x="299" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">2v==L</text>
  <text x="360" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">v²%2</text>
  <text x="427" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">美丽?</text>
  <path d="M 60 156 Q 277 153 494 157" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <text x="95" y="176" text-anchor="middle" font-size="12" fill="#333">ba</text>
  <text x="160" y="176" text-anchor="middle" font-size="11.5" fill="#666">0..1</text>
  <text x="215" y="176" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="256" y="176" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="299" y="176" text-anchor="middle" font-size="12" fill="#2e6e2e">✓</text>
  <text x="352" y="176" text-anchor="middle" font-size="11.5" fill="#b85450">1 ✗</text>
  <text x="427" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>
  <path d="M 60 188 Q 277 185 494 189" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="62" y="190" width="430" height="28" rx="4" fill="#e6f4ea"/></g>
  <text x="95" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">baey</text>
  <text x="160" y="209" text-anchor="middle" font-size="11.5" fill="#666">0..3</text>
  <text x="215" y="209" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="256" y="209" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="299" y="209" text-anchor="middle" font-size="12" fill="#2e6e2e">✓</text>
  <text x="352" y="209" text-anchor="middle" font-size="11.5" fill="#2e6e2e">0 ✓</text>
  <text x="427" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <path d="M 60 218 Q 277 215 494 219" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="62" y="221" width="430" height="28" rx="4" fill="#e6f4ea"/></g>
  <text x="95" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">aeyh</text>
  <text x="160" y="240" text-anchor="middle" font-size="11.5" fill="#666">1..4</text>
  <text x="215" y="240" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="256" y="240" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="299" y="240" text-anchor="middle" font-size="12" fill="#2e6e2e">✓</text>
  <text x="352" y="240" text-anchor="middle" font-size="11.5" fill="#2e6e2e">0 ✓</text>
  <text x="427" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <path d="M 60 250 Q 277 247 494 251" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="508" y="128" width="116" height="124" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="566" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">先筛 2v==L</text>
  <text x="566" y="172" text-anchor="middle" font-size="10.5" fill="#555">奇数长度、不</text>
  <text x="566" y="188" text-anchor="middle" font-size="10.5" fill="#555">平衡的直接出局</text>
  <text x="566" y="212" text-anchor="middle" font-size="10.5" fill="#555">全串 baeyh：</text>
  <text x="566" y="228" text-anchor="middle" font-size="10.5" fill="#555">2v=4 ≠ L=5 ✗</text>
  <text x="566" y="246" text-anchor="middle" font-size="10.5" fill="#555">只剩 3 个候选</text>

  <g filter="url(#sk)"><rect x="56" y="264" width="438" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="275" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">ans = 2：仅 "baey" 与 "aeyh" 美丽</text>
  <text x="275" y="309" text-anchor="middle" font-size="11" fill="#666">"ba" 虽平衡（v=1），但 v²=1 为奇，被 k=2 拒之门外</text>

  <g filter="url(#sk)"><rect x="56" y="332" width="438" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="275" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">对照示例 2：s = "abba"，k = 1</text>
  <text x="275" y="378" text-anchor="middle" font-size="11" fill="#666">平衡子串 ab / ba / abba，而 v² % 1 == 0 恒真 → 3 个全美丽</text>

  <g filter="url(#sk)"><rect x="508" y="262" width="116" height="134" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="566" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">被筛掉的</text>
  <text x="566" y="306" text-anchor="middle" font-size="10.5" fill="#555">ae：2v=4≠2 ✗</text>
  <text x="566" y="324" text-anchor="middle" font-size="10.5" fill="#555">yh：2v=0≠2 ✗</text>
  <text x="566" y="342" text-anchor="middle" font-size="10.5" fill="#555">eyh：奇长 L=3 ✗</text>
  <text x="566" y="360" text-anchor="middle" font-size="10.5" fill="#555">b：v=0≠L/2 ✗</text>
  <text x="566" y="382" text-anchor="middle" font-size="10.5" fill="#888">——双条件逐个筛</text>
</svg>
