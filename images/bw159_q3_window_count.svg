<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">固定最右质数 e，最小的合法左端 s，然后左右端点各自自由</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">总数 = (右端点可选数) × Σ(左端点可选数)</text>
  <rect x="40" y="58" width="540" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="85.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">对固定 e：窗口 [s,e] 合法 &lt;=&gt; max-min &lt;= k，且 s 越小窗口越大 -&gt; 合法性关于 s 单调</text>
  <rect x="120" y="118" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="139.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">单调队列维护 val[s..e] 的 max / min</text>
  <path d="M 290.0 152 L 290.0 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="166" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="187.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">max - min &gt; k 时右移 s（两队列同步弹出）</text>
  <path d="M 290.0 200 L 290.0 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="214" width="340" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="235.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">s 即为满足条件的最小左端</text>
  <rect x="40" y="296" width="260" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="170.0" y="323.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">右端点个数 = pos[e+1] - pos[e]</text>
  <text x="170.0" y="339.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">（取到下一个质数之前都行）</text>
  <rect x="320" y="296" width="260" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="450.0" y="323.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">左端点个数 = pos[e-1] - pos[s-1]</text>
  <text x="450.0" y="339.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">（对 s' ∈ [s, e-1] 求和后望远镜化简）</text>
  <text x="40" y="372" font-size="10" fill="#999" text-anchor="start" filter="url(#rough2)">两项相乘累加，O(m) 完成（m 为质数个数）</text>
</svg>
