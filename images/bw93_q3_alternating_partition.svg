<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">上界构造：偶数下标去程、奇数下标回程</text>

  <!-- 数轴与石头 stones = [0,2,5,6,7] -->
  <path d="M40,250 L480,250" stroke="#333" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrB)"/>

  <circle cx="70" cy="250" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="70" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 0</text>

  <circle cx="160" cy="250" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 1</text>

  <circle cx="250" cy="250" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 2</text>

  <circle cx="340" cy="250" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="340" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 3</text>

  <circle cx="430" cy="250" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 4</text>

  <!-- 去程：偶数下标（0 → 2 → 4），蓝色大弧 -->
  <path d="M70,236 Q160,140 248,234" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <path d="M252,236 Q340,140 428,234" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">去程跳 5</text>
  <text x="340" y="130" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">去程跳 2</text>

  <!-- 回程：奇数下标（4 → 3 → 1 → 0），绿色小弧 -->
  <path d="M432,264 Q387,320 344,266" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <path d="M336,264 Q250,330 164,266" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <path d="M156,264 Q110,320 74,266" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="388" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="250" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="115" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 说明 -->
  <rect x="40" y="60" width="440" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每条链都恰好「跨过」对方链上的石头</text>
  <text x="260" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每一跳 = stones[j] − stones[j−2] ≤ M</text>

  <text x="260" y="48" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">本例最大跳 = max(5, 4, 2) = 5，恰好达到下界</text>
</svg>
