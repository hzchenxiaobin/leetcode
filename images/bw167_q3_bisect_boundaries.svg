<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二分定位：l 取第一个 &gt;= start，r 取第一个 &gt; end</text>
  <path d="M 60 130 L 550 130" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="100" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="135" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="100" y="160" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">idx 0</text>
  <circle cx="210" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="135" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="210" y="160" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">idx 1</text>
  <circle cx="320" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="135" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="320" y="160" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">idx 2</text>
  <circle cx="430" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="135" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="430" y="160" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">idx 3</text>
  <path d="M 255 96 L 255 172" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="255" y="88" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">startTime = 3</text>
  <text x="255" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">l = 1</text>
  <path d="M 410 96 L 410 172" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">endTime = 8</text>
  <text x="410" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">r = 3（第一个 &gt; 8）</text>
  <rect x="70" y="218" width="470" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="305" y="245" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">区间 [l, r) = 下标 {1, 2} → 时刻 5 与 8 的考试</text>
  <rect x="70" y="274" width="470" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="88" y="296" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">若右端也用 lower_bound，时刻恰为 endTime 的考试会被漏掉</text>
  <text x="88" y="314" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 必须用 upper_bound（bisect_right）</text>
</svg>
