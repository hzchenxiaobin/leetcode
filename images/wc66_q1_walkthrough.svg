<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：A = [12, 28, 46, 32, 50]，B = [50, 12, 32, 46, 28]</text>
  <text x="320" y="51" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">建桶后逐位查表，每取出一个下标就从桶里弹掉它</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="95" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c">i</text>
    <text x="172" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c">A[i]</text>
    <text x="295" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c">桶 pos[ A[i] ]（当前剩余下标）</text>
    <text x="417" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c">弹出的 j</text>
    <text x="520" y="90" text-anchor="middle" font-size="11" fill="#2f3f5c">ans 累积</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="100" width="520" height="32" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.2" rx="4"/>
    <text x="95" y="121" text-anchor="middle" font-size="11" fill="#455">0</text>
    <text x="172" y="121" text-anchor="middle" font-size="11.5" fill="#455">12</text>
    <text x="295" y="121" text-anchor="middle" font-size="11" fill="#455">[1]  → 弹空</text>
    <text x="417" y="121" text-anchor="middle" font-size="11.5" fill="#8a6a20">1</text>
    <text x="520" y="121" text-anchor="middle" font-size="11" fill="#455">[1]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="132" width="520" height="32" fill="#eef4ec" stroke="#d5dde8" stroke-width="1.2" rx="4"/>
    <text x="95" y="153" text-anchor="middle" font-size="11" fill="#455">1</text>
    <text x="172" y="153" text-anchor="middle" font-size="11.5" fill="#455">28</text>
    <text x="295" y="153" text-anchor="middle" font-size="11" fill="#455">[4]  → 弹空</text>
    <text x="417" y="153" text-anchor="middle" font-size="11.5" fill="#8a6a20">4</text>
    <text x="520" y="153" text-anchor="middle" font-size="11" fill="#455">[1, 4]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="164" width="520" height="32" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.2" rx="4"/>
    <text x="95" y="185" text-anchor="middle" font-size="11" fill="#455">2</text>
    <text x="172" y="185" text-anchor="middle" font-size="11.5" fill="#455">46</text>
    <text x="295" y="185" text-anchor="middle" font-size="11" fill="#455">[3]  → 弹空</text>
    <text x="417" y="185" text-anchor="middle" font-size="11.5" fill="#8a6a20">3</text>
    <text x="520" y="185" text-anchor="middle" font-size="11" fill="#455">[1, 4, 3]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="196" width="520" height="32" fill="#eef4ec" stroke="#d5dde8" stroke-width="1.2" rx="4"/>
    <text x="95" y="217" text-anchor="middle" font-size="11" fill="#455">3</text>
    <text x="172" y="217" text-anchor="middle" font-size="11.5" fill="#455">32</text>
    <text x="295" y="217" text-anchor="middle" font-size="11" fill="#455">[2]  → 弹空</text>
    <text x="417" y="217" text-anchor="middle" font-size="11.5" fill="#8a6a20">2</text>
    <text x="520" y="217" text-anchor="middle" font-size="11" fill="#455">[1, 4, 3, 2]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="228" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="95" y="249" text-anchor="middle" font-size="11" fill="#8a6a20">4</text>
    <text x="172" y="249" text-anchor="middle" font-size="11.5" fill="#8a6a20">50</text>
    <text x="295" y="249" text-anchor="middle" font-size="11" fill="#8a6a20">[0]  → 弹空</text>
    <text x="417" y="249" text-anchor="middle" font-size="11.5" fill="#8a6a20">0</text>
    <text x="520" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20">[1, 4, 3, 2, 0]</text>
  </g>

  <text x="320" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">回代校验：B[1]=12、B[4]=28、B[3]=46、B[2]=32、B[0]=50，全部与 A[i] 对上 ✓</text>

  <g filter="url(#rough2)">
    <rect x="48" y="294" width="544" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="320" y="316" text-anchor="middle" font-size="11.5" fill="#8a3a36">重复值走查：A = [1, 1]，B = [1, 1] → 建桶 pos[1] = [0, 1]（升序）</text>
    <text x="320" y="338" text-anchor="middle" font-size="11" fill="#8a3a36">第 0 个 1 弹走下标 1，第 1 个 1 弹走下标 0 → ans = [1, 0]，两个下标互不相同 ✓</text>
    <text x="320" y="362" text-anchor="middle" font-size="11" fill="#8a3a36">若改成 pos[1] = 0 无条件覆盖，就得到 [0, 0]：同一下标被用两次，映射不再是一一对应 ✗</text>
  </g>

  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">多解时输出任意一个即可；本解法固定「弹桶尾」，因此答案是确定的</text>
</svg>
