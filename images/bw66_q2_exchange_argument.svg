<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="129"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">为什么放右侧不劣：交换论证</text>

  <!-- 左放 -->
  <text x="160" y="66" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">某最优解把桶放在了 i−1（左侧）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="80" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="132" y="80" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="184" y="80" width="52" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="106" y="107" fill="#d6a040" font-weight="bold">B</text>
    <text x="158" y="107" fill="#b85450">H</text>
    <text x="210" y="107" fill="#888">.</text>
  </g>
  <text x="160" y="152" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">这桶只可能喂到 i−2（若有）与 i</text>

  <!-- 交换箭头 -->
  <path d="M 270 102 L 350 102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">右移一格</text>

  <!-- 右放 -->
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">改放 i+1（右侧）：i 仍被喂</text>
  <g filter="url(#rough2)">
    <rect x="388" y="80" width="52" height="44" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="440" y="80" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="492" y="80" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="15" filter="url(#rough2)">
    <text x="414" y="107" fill="#888">.</text>
    <text x="466" y="107" fill="#b85450">H</text>
    <text x="518" y="107" fill="#d6a040" font-weight="bold">B</text>
  </g>
  <text x="460" y="152" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">额外还能喂 i+2（若有），只少喂了 i−2</text>

  <!-- 说明 -->
  <rect x="60" y="180" width="500" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="206" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">扫描从左到右：轮到 i 时，i−1 有没有桶已经确定</text>
  <text x="310" y="228" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">若 i−1 有桶 → i 已被覆盖，跳过，不新增桶</text>
  <text x="310" y="250" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">若 i−1 无桶 → 右侧 i+1 若为空必放右侧（还能覆盖后面的仓鼠）</text>

  <rect x="110" y="284" width="400" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">无解判定恰好是"左右都是 H 或越界"：连续 HH 块长度 ≥ 3 必无解，</text>
  <text x="310" y="325" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">长度 ≤ 2 的 HH 块两端的空位放桶即可（贪心天然覆盖）</text>
</svg>
