<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：words = ["gin","zen","gig","msg"]</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐行把单词翻译成点划串，再看集合是否因此变大</text>

  <!-- 表头 -->
  <text x="70" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">逐字母查表</text>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">变换串</text>
  <text x="530" y="80" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">集合状态</text>
  <path d="M 28 90 L 572 90" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="70" y="114" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">gin</text>
  <text x="150" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">g=--.</text>
  <text x="238" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">i=..</text>
  <text x="320" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n=-.</text>
  <text x="430" y="114" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">--...-.</text>
  <text x="530" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">新增 |S|=1</text>
  <path d="M 28 138 L 572 138" stroke="#e0e0e0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 行 2 -->
  <text x="70" y="164" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">zen</text>
  <text x="150" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">z=--..</text>
  <text x="238" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">e=.</text>
  <text x="320" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n=-.</text>
  <text x="430" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">--...-.</text>
  <text x="530" y="164" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">重复 |S|=1</text>
  <path d="M 28 188 L 572 188" stroke="#e0e0e0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <text x="70" y="214" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">gig</text>
  <text x="150" y="214" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <text x="238" y="214" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">i=..</text>
  <text x="320" y="214" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <text x="430" y="214" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">--...--.</text>
  <text x="530" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">新增 |S|=2</text>
  <path d="M 28 238 L 572 238" stroke="#e0e0e0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 行 4 -->
  <text x="70" y="264" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">msg</text>
  <text x="150" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">m=--</text>
  <text x="238" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s=...</text>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">g=--.</text>
  <text x="430" y="264" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">--...--.</text>
  <text x="530" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">重复 |S|=2</text>
  <path d="M 28 288 L 572 288" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="52" y="304" width="496" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">S = { "--...-.", "--...--." }，共 2 个不同串</text>
  <text x="300" y="354" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">答案 2，与示例 1 的输出一致</text>

  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意第 2、4 行：单词在字母层面完全不同，翻译后却撞到同一个串</text>
</svg>
