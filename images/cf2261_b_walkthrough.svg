<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 436" width="880" height="436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="436" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：只看 M、m、S 就能直接出答案</text>
  <path d="M 190 44 Q 440 51 690 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="60" y="62" width="770" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">数组 a</text>
  <text x="310" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">M</text>
  <text x="390" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">m</text>
  <text x="480" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">S</text>
  <text x="580" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">M ^ m</text>
  <text x="660" y="86" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">h</text>
  <text x="755" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">答案</text>

  <!-- 行 1：[0] -->
  <rect x="60" y="100" width="770" height="40" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[0]</text>
  <text x="310" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="390" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="480" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="580" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="660" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="755" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">0</text>

  <!-- 行 2：[1,2] -->
  <rect x="60" y="140" width="770" height="40" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[1, 2]</text>
  <text x="310" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="390" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="480" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="580" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="660" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="755" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">3</text>

  <!-- 行 3：[4,6] -->
  <rect x="60" y="180" width="770" height="40" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4, 6]</text>
  <text x="310" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="390" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="480" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="580" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="660" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="755" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">7</text>

  <!-- 行 4：[8,8,8] -->
  <rect x="60" y="220" width="770" height="40" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[8, 8, 8]</text>
  <text x="310" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="390" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="480" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="580" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="660" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="755" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">8</text>

  <!-- 行 5：[10,8] 高亮 -->
  <rect x="60" y="260" width="770" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[10, 8]</text>
  <text x="310" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">10</text>
  <text x="390" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">8</text>
  <text x="480" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">10</text>
  <text x="580" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="660" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="755" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">11</text>

  <!-- 行 6：[12,9,12,9] -->
  <rect x="60" y="300" width="770" height="40" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[12, 9, 12, 9]</text>
  <text x="310" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">12</text>
  <text x="390" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="480" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">13</text>
  <text x="580" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="660" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="755" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">15</text>

  <!-- 底部说明 -->
  <rect x="60" y="356" width="770" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="382" font-size="12.2" fill="#8c3a37" filter="url(#rough2)">[10, 8] 的操作轨迹：8 → 9 时 OR = 1010 | 1001 = 1011 = 11（最优）</text>
  <text x="80" y="404" font-size="12.2" fill="#8c3a37" filter="url(#rough2)">继续把 9 抬到 10，OR 退回 1010 = 10 ⇒ 不是抬到 max 就一定更好，见好就收</text>

  <path d="M 836 292 C 856 314 838 340 742 352" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
