<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算："abdcdbc" + "ac" 的一遍扫描</text>

  <!-- 串 -->
  <g filter="url(#rough2)">
    <rect x="42" y="52" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="106" y="52" width="64" height="38" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="170" y="52" width="64" height="38" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="234" y="52" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="298" y="52" width="64" height="38" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="362" y="52" width="64" height="38" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="426" y="52" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="74" y="76">a</text><text x="138" y="76">b</text><text x="202" y="76">d</text>
    <text x="266" y="76">c</text><text x="330" y="76">d</text><text x="394" y="76">b</text><text x="458" y="76">c</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="74" y="102">0</text><text x="138" y="102">1</text><text x="202" y="102">2</text>
    <text x="266" y="102">3</text><text x="330" y="102">4</text><text x="394" y="102">5</text><text x="458" y="102">6</text>
  </g>

  <!-- 扫描状态行 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#666">
    <text x="60" y="132">读入</text>
    <text x="60" y="154">a</text>
    <text x="60" y="176">b、d</text>
    <text x="60" y="198">c（下标 3）</text>
    <text x="60" y="220">d、b</text>
    <text x="60" y="242">c（下标 6）</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#33465e">
    <text x="180" y="154">a = 1</text>
    <text x="180" y="176">不变</text>
    <text x="180" y="198">b = 1</text>
    <text x="180" y="220">不变</text>
    <text x="180" y="242">b = 2</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#6a3a36">
    <text x="330" y="154">both = 0</text>
    <text x="330" y="176">both = 0</text>
    <text x="330" y="198">both += 1 → 1</text>
    <text x="330" y="220">both = 1</text>
    <text x="330" y="242">both += 1 → 2</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 266 108 C 260 130, 246 160, 236 186" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.6"/>
    <path d="M 458 108 C 452 140, 440 190, 434 230" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.6"/>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2a4a22">
    <text x="76" y="286">已有 both = 2；cnt_a = 1，cnt_b = 2</text>
    <text x="76" y="308">答案 = 2 + max(1, 2) = 4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="262" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#5a4a20">
    <text x="460" y="284" text-anchor="middle">最优：最左插 'a'</text>
    <text x="460" y="306" text-anchor="middle">→ "aabdcdbc" ✓</text>
  </g>
</svg>
