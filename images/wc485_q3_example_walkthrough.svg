<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：商品 7 的「真相表 vs 候选堆」全流程</text>

  <!-- 表头 -->
  <rect x="28" y="40" width="624" height="26" fill="#e8f0fe" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="57" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="291" y="57" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">真相 cur[7]</text>
  <text x="469" y="57" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">候选堆 hp[7]</text>
  <text x="607" y="57" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">返回</text>

  <!-- 行底色 -->
  <rect x="28" y="66" width="624" height="30" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="28" y="96" width="624" height="30" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="28" y="126" width="624" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="28" y="156" width="624" height="30" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="28" y="186" width="624" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="28" y="216" width="624" height="30" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="28" y="246" width="624" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="28" y="276" width="624" height="30" fill="#f0f0f0" filter="url(#rough2)"/>

  <!-- 行内容 -->
  <text x="117" y="85" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">addBid(1,7,5)</text>
  <text x="291" y="85" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1:5}</text>
  <text x="469" y="85" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(5,1)</text>
  <text x="607" y="85" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <text x="117" y="115" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">addBid(2,7,6)</text>
  <text x="291" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1:5, 2:6}</text>
  <text x="469" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(5,1)(6,2)</text>
  <text x="607" y="115" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <text x="117" y="145" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getHighestBidder(7)</text>
  <text x="291" y="145" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不变</text>
  <text x="469" y="145" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">堆顶 (6,2) ✓</text>
  <text x="607" y="145" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="117" y="175" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">updateBid(1,7,8)</text>
  <text x="291" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1:8, 2:6}</text>
  <text x="469" y="175" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">+(8,1) 入堆</text>
  <text x="607" y="175" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <text x="117" y="205" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getHighestBidder(7)</text>
  <text x="291" y="205" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不变</text>
  <text x="469" y="205" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">堆顶 (8,1) ✓</text>
  <text x="607" y="205" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="117" y="235" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">removeBid(2,7)</text>
  <text x="291" y="235" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1:8}</text>
  <text x="469" y="235" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">不变（(6,2) 沦为陈旧）</text>
  <text x="607" y="235" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <text x="117" y="265" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">getHighestBidder(7)</text>
  <text x="291" y="265" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不变</text>
  <text x="469" y="265" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">堆顶 (8,1) ✓</text>
  <text x="607" y="265" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="117" y="295" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">getHighestBidder(3)</text>
  <text x="291" y="295" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无记录</text>
  <text x="469" y="295" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">无记录</text>
  <text x="607" y="295" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">-1</text>

  <!-- 表格线 -->
  <line x1="206" y1="40" x2="206" y2="306" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="376" y1="40" x2="376" y2="306" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="562" y1="40" x2="562" y2="306" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="66" x2="652" y2="66" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="96" x2="652" y2="96" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="126" x2="652" y2="126" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="156" x2="652" y2="156" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="186" x2="652" y2="186" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="216" x2="652" y2="216" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="246" x2="652" y2="246" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="28" y1="276" x2="652" y2="276" stroke="#c8c8c8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="28" y="40" width="624" height="266" fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 延伸面板：懒删除弹栈轨迹 -->
  <rect x="28" y="322" width="624" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="343" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">延伸：第 7 步后 updateBid(1,7,3)（新入 (3,1)）再查询 —— 连弹三条陈旧条目</text>

  <rect x="68" y="354" width="104" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="374" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">(8,1) ✗ 弹</text>
  <path d="M172,370 L194,370" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="354" width="104" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="374" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">(6,2) ✗ 弹</text>
  <path d="M300,370 L322,370" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="324" y="354" width="104" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="374" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">(5,1) ✗ 弹</text>
  <path d="M428,370 L450,370" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="354" width="104" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="374" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(3,1) ✓ 答 1</text>

  <text x="596" y="374" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">弹出均只发生一次</text>

  <!-- 底部要点 -->
  <rect x="28" y="414" width="624" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="433" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">三条弹出一次性发生，但每条只弹这一次 —— 代价摊还给当初压入它的写操作</text>
  <text x="340" y="450" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">单次查询最坏 O(k) 弹出（k 为陈旧条目数），均摊仍 O(log Q)</text>
</svg>
