<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">f(x) 的阶梯与 S 的闭式统计：f(x) = k ⟺ 4^(k−1) ≤ x &lt; 4^k</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 阶梯 -->
  <g filter="url(#sk)">
    <rect x="56" y="176" width="74" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="130" y="146" width="100" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="230" y="116" width="110" height="94" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="340" y="86" width="110" height="124" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="450" y="56" width="110" height="154" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 56 210 L 600 210" stroke="#888" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">
    <text x="93" y="172" filter="url(#sk)">k=1</text>
    <text x="180" y="142" filter="url(#sk)">k=2</text>
    <text x="285" y="112" filter="url(#sk)">k=3</text>
    <text x="395" y="82" filter="url(#sk)">k=4</text>
    <text x="505" y="52" filter="url(#sk)">k=5</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#666">
    <text x="93" y="203" filter="url(#sk)">1~3</text>
    <text x="180" y="203" filter="url(#sk)">4~15</text>
    <text x="285" y="203" filter="url(#sk)">16~63</text>
    <text x="395" y="203" filter="url(#sk)">64~255</text>
    <text x="505" y="203" filter="url(#sk)">256~1023</text>
    <text x="578" y="188" font-size="16" font-weight="bold" filter="url(#sk)">…</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#666">
    <text x="56" y="226" filter="url(#sk)">1</text>
    <text x="130" y="226" filter="url(#sk)">4</text>
    <text x="230" y="226" filter="url(#sk)">16</text>
    <text x="340" y="226" filter="url(#sk)">64</text>
    <text x="450" y="226" filter="url(#sk)">256</text>
    <text x="560" y="226" filter="url(#sk)">1024</text>
  </g>
  <text x="600" y="46" text-anchor="end" font-size="11.5" font-weight="bold" fill="#a05a20" filter="url(#sk)">r ≤ 10⁹ &lt; 4^15 → k ≤ 15</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="48" y="240" width="544" height="118" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="264" text-anchor="middle" font-size="12.5" fill="#2b4a6b" filter="url(#sk)">第 j 层装着所有 x ≥ 4^(j−1) 的数；f(x) = x 覆盖的层数</text>
  <text x="320" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">F(n) = Σ f(x) = Σ max(0, n − 4^(j−1) + 1)　（j = 1, 2, …）</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">例：F(6) = (6−1+1) + (6−4+1) + 0 = 6 + 3 = 9</text>
  <text x="320" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a05a20" filter="url(#sk)">S(l, r) = F(r) − F(l−1)：每个查询 O(log₄ r) ≈ 15 项</text>

  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">思想：把「Σ 位数」拆成「逐层前缀计数」——第 j 层数一遍 ≥ 4^(j−1) 的元素个数</text>
</svg>
