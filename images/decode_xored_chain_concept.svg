<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：异或是自己的逆运算，链条从 first 逐项展开</text>

  <!-- 自反性两个小等式框 -->
  <rect x="60" y="48" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a ⊕ a = 0</text>
  <rect x="310" y="48" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0 ⊕ a = a</text>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">⇒ 同数异或两次 = 白异或</text>

  <!-- 推导箭头 -->
  <path d="M260,92 L260,118" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="110" font-size="11.5" fill="#b85450" filter="url(#rough2)">c = a ⊕ b 时，b = a ⊕ c</text>

  <!-- 链条：first → arr[1] → arr[2] → arr[3] -->
  <text x="60" y="150" font-size="11" fill="#888" filter="url(#rough2)">编码关系 encoded[i] = arr[i] ⊕ arr[i+1]，反解得递推：</text>

  <rect x="30" y="170" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="62" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">first</text>

  <!-- 钥匙1 + 箭头1 -->
  <rect x="84" y="136" width="52" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="154" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⊕ enc[0]</text>
  <path d="M98,190 L120,190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="126" y="170" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">arr[1]</text>

  <rect x="180" y="136" width="52" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="154" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⊕ enc[1]</text>
  <path d="M194,190 L216,190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="170" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">arr[2]</text>

  <rect x="276" y="136" width="52" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="154" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">⊕ enc[2]</text>
  <path d="M290,190 L312,190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="318" y="170" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">arr[3]</text>

  <text x="398" y="196" font-size="15" fill="#888" filter="url(#rough2)">……</text>
  <text x="448" y="192" font-size="11.5" fill="#446688" filter="url(#rough2)">到 arr[n−1]</text>

  <!-- 说明 -->
  <rect x="60" y="248" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">每个 enc[i] 像一把钥匙：配上前项，一步异或打开下一项</text>

  <rect x="60" y="304" width="400" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">起点被白送（first）⟹ 整条链可解，且每步唯一、无回溯</text>
</svg>
