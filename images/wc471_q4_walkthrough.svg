<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">示例 3 走查：入栈累加、出栈撤销（ans = 2）</text>
  <path d="M 140 36 Q 330 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: tree with visit order -->
  <text x="140" y="66" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">nums = [1,2,9,4]，core = [1,2,1,1]；①→④ 为访问序</text>
  <g filter="url(#sk)">
    <path d="M 112 116 L 84 160" stroke="#446688" stroke-width="1.8"/>
    <path d="M 138 116 L 190 160" stroke="#446688" stroke-width="1.8"/>
    <path d="M 84 186 L 84 224" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="125" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="80" cy="176" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="198" cy="176" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="80" cy="242" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">
    <text x="125" y="105">0</text>
    <text x="80" y="181">1</text>
    <text x="198" y="181">2</text>
    <text x="80" y="247">3</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="150" cy="84" r="10" fill="#d6a040"/>
    <circle cx="222" cy="160" r="10" fill="#d6a040"/>
    <circle cx="56" cy="160" r="10" fill="#d6a040"/>
    <circle cx="106" cy="262" r="10" fill="#d6a040"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#fff" filter="url(#sk)">
    <text x="150" y="88">1</text>
    <text x="222" y="164">2</text>
    <text x="56" y="164">3</text>
    <text x="106" y="266">4</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#667" filter="url(#sk)">
    <text x="125" y="76">c1</text>
    <text x="80" y="206">c2</text>
    <text x="198" y="206">c1</text>
    <text x="44" y="270">c1</text>
  </g>
  <text x="140" y="300" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">栈 LIFO：0 的邻居按 1、2 压栈，</text>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">故 2 先于 1 被访问（顺序无关正确性）</text>

  <!-- right: event table -->
  <g filter="url(#sk)">
    <rect x="270" y="56" width="380" height="26" rx="5" fill="#446688"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#fff" filter="url(#sk)">
    <text x="284" y="73">#</text>
    <text x="318" y="73">事件</text>
    <text x="366" y="73">节点(core)</text>
    <text x="436" y="73">读 cnt</text>
    <text x="502" y="73">ans</text>
    <text x="548" y="73">计数器变化</text>
  </g>

  <g filter="url(#sk)">
    <rect x="270" y="84" width="380" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="111" width="380" height="27" fill="#f2f6ee" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="138" width="380" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="165" width="380" height="27" fill="#f2f6ee" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="192" width="380" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="270" y="219" width="380" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="246" width="380" height="27" fill="#f2f6ee" stroke="#ccc" stroke-width="0.8"/>
    <rect x="270" y="273" width="380" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="284" y="102">1</text><text x="318" y="102" fill="#2e5e22" font-weight="bold">入</text><text x="366" y="102">0 (c1)</text><text x="436" y="102">cnt[1]=0</text><text x="502" y="102">0</text><text x="548" y="102">c1: 0→1</text>
    <text x="284" y="129">2</text><text x="318" y="129" fill="#2e5e22" font-weight="bold">入</text><text x="366" y="129">2 (c1)</text><text x="436" y="129">cnt[1]=1</text><text x="502" y="129">1</text><text x="548" y="129">c1: 1→2</text>
    <text x="284" y="156">3</text><text x="318" y="156" fill="#b85450" font-weight="bold">出</text><text x="366" y="156">2</text><text x="436" y="156" fill="#999">—</text><text x="502" y="156">1</text><text x="548" y="156" fill="#8f3a34">c1: 2→1 撤销</text>
    <text x="284" y="183">4</text><text x="318" y="183" fill="#2e5e22" font-weight="bold">入</text><text x="366" y="183">1 (c2)</text><text x="436" y="183">cnt[2]=0</text><text x="502" y="183">1</text><text x="548" y="183">c2: 0→1</text>
    <text x="284" y="210">5</text><text x="318" y="210" fill="#2e5e22" font-weight="bold">入</text><text x="366" y="210">3 (c1)</text><text x="436" y="210" font-weight="bold">cnt[1]=1</text><text x="502" y="210" font-weight="bold">2</text><text x="548" y="210">c1: 1→2</text>
    <text x="284" y="237">6</text><text x="318" y="237" fill="#b85450" font-weight="bold">出</text><text x="366" y="237">3</text><text x="436" y="237" fill="#999">—</text><text x="502" y="237">2</text><text x="548" y="237" fill="#8f3a34">c1: 2→1</text>
    <text x="284" y="264">7</text><text x="318" y="264" fill="#b85450" font-weight="bold">出</text><text x="366" y="264">1</text><text x="436" y="264" fill="#999">—</text><text x="502" y="264">2</text><text x="548" y="264" fill="#8f3a34">c2: 1→0</text>
    <text x="284" y="291">8</text><text x="318" y="291" fill="#b85450" font-weight="bold">出</text><text x="366" y="291">0</text><text x="436" y="291" fill="#999">—</text><text x="502" y="291">2</text><text x="548" y="291" fill="#8f3a34">c1: 1→0</text>
  </g>

  <!-- key moment callout -->
  <g filter="url(#sk)">
    <rect x="270" y="312" width="380" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="460" y="334" text-anchor="middle" font-size="11.5" fill="#8f3a34" filter="url(#sk)">关键在步骤 5：节点 3 读到 cnt[1] = 1 而非 2——</text>
  <text x="460" y="352" text-anchor="middle" font-size="11.5" fill="#8f3a34" filter="url(#sk)">节点 2 已在步骤 3 出栈撤销（2 不是 3 的祖先），</text>
  <text x="460" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a34" filter="url(#sk)">「出栈减一」正是计数器只装祖先的保证</text>

  <text x="330" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">最终 ans = 0+1+1 = 2：t₂ = 1（祖先 0），t₃ = 1（祖先 0）✓</text>
  <text x="330" y="432" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">（t₁ = 0：祖先 0 的 1×2 = 2 非平方，故无贡献）</text>
</svg>
