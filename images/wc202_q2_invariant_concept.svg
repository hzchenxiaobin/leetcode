<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：操作 = 搬 1 单位，总和不变 ⇒ 目标锁定为 n</text>
  <path d="M 130 34 Q 320 41 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 搬运大箭头：盈余侧 → 缺口侧 -->
  <path d="M 384 124 Q 230 68 88 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">每次操作：arr[x] −1、arr[y] +1（盈余侧 → 缺口侧）</text>

  <!-- 目标虚线 -->
  <path d="M 44 170 L 414 170" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="50" y="161" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">目标 n = 6</text>

  <!-- 柱状条（比例 7px / 单位，基线 y=212） -->
  <rect x="54" y="205" width="44" height="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="116" y="191" width="44" height="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="178" y="177" width="44" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="240" y="163" width="44" height="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="240" y="170" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="302" y="149" width="44" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="302" y="170" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="364" y="135" width="44" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="364" y="170" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- 缺口 / 盈余标注 -->
  <text x="76" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">缺 5</text>
  <text x="138" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">缺 3</text>
  <text x="200" y="174" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">缺 1</text>
  <text x="262" y="157" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">余 1</text>
  <text x="324" y="143" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">余 3</text>
  <text x="386" y="129" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">余 5</text>

  <!-- 基线与数值 / 下标 -->
  <path d="M 44 212 L 414 212" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="76" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="138" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="200" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="262" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <text x="324" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">9</text>
  <text x="386" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">11</text>
  <text x="76" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="138" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="200" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="262" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="324" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="386" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=5</text>

  <!-- 底部注释 -->
  <text x="230" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">缺口合计 5+3+1 = 盈余合计 1+3+5 = 9 = ⌊6²/4⌋</text>
  <text x="230" y="292" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">G − S = Σ(n − arr[i]) = n·n − n² = 0 ⇒ 总缺口 = 总盈余</text>

  <!-- 右侧要点面板 -->
  <rect x="432" y="52" width="192" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">不变量</text>
  <text x="528" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一减一加，总和恒为 n²</text>
  <text x="528" y="107" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ 终态公共值 = n²/n = n</text>

  <path d="M 528 114 L 528 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="432" y="134" width="192" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 总缺口 D</text>
  <text x="528" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">D = Σ (n − arr[i])</text>
  <text x="528" y="189" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n = 6 时 D = 5+3+1 = 9</text>

  <path d="M 528 196 L 528 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="432" y="216" width="192" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">每步恰搬 1 单位</text>
  <text x="528" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 步数 ≥ D（势函数下界）</text>
  <text x="528" y="271" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">对准缺口搬运恰 D 步（上界）</text>

  <text x="528" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对称结构 arr[i] + arr[n−1−i] = 2n</text>
  <text x="528" y="322" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⇒ D 可配对闭式求和，O(1) 出答案</text>
</svg>
