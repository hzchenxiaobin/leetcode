<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：gcd(2,n) 只取决于奇偶，LCM 退化为补因子 2</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="150" y="60" width="380" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#sk)">lcm(2, n) = 2n / gcd(2, n)</text>
  <text x="340" y="110" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">而 gcd(2, n) ∈ {1, 2}，只看 n 的奇偶 → 无需辗转相除</text>

  <g filter="url(#sk)"><path d="M 200 128 L 200 152" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 480 128 L 480 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="42" y="158" width="292" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="188" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">n 为偶数（如 n = 6）</text>
  <text x="188" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">6 = 2 × 3，素因子已含 2</text>
  <text x="188" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">gcd(2, 6) = 2</text>
  <text x="188" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">ans = 2×6 / 2 = 6 = n</text>
  <text x="188" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">n 自身已是 2 的倍数</text>
  <text x="188" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⟹ 返回 n，一个因子都不用补</text>

  <g filter="url(#sk)"><rect x="346" y="158" width="292" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="492" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">n 为奇数（如 n = 5）</text>
  <text x="492" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5 = 5，素因子不含 2</text>
  <text x="492" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">gcd(2, 5) = 1（互质）</text>
  <text x="492" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">ans = 2×5 / 1 = 10 = 2n</text>
  <text x="492" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">n 不是 2 的倍数</text>
  <text x="492" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">⟹ 恰好补一个因子 2，返回 2n</text>

  <g filter="url(#sk)"><rect x="42" y="348" width="292" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="188" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">一行位运算（无分支）</text>
  <text x="188" y="400" text-anchor="middle" font-size="13.5" fill="#2b4a68" filter="url(#sk)">ans = n &lt;&lt; (n &amp; 1)</text>
  <text x="188" y="426" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">奇数：n&amp;1=1，左移 1 位即 ×2</text>
  <text x="188" y="446" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">偶数：n&amp;1=0，左移 0 位即不变</text>

  <g filter="url(#sk)"><rect x="346" y="348" width="292" height="110" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="492" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">易错：别答成 min(2, n) 或 n+2</text>
  <text x="492" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">「最小公倍数」≠ 两数中较小者</text>
  <text x="492" y="424" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">n = 1 时答案是 2（1 不是 2 的倍数）</text>
  <text x="492" y="446" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">答案必是 n 的倍数：n 或 2n</text>
</svg>
