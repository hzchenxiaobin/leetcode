<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="640" height="600" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序 + 前缀和 + 两趟单调双指针</text>

  <!-- A: 排序 -->
  <g filter="url(#rough2)"><rect x="175" y="46" width="290" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">① 按 l 升序排序</text>
  <text x="320" y="74" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">区间互不重叠 ⇒ r 也随之升序</text>
  <path d="M 320 80 L 320 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B: 前缀和 -->
  <g filter="url(#rough2)"><rect x="175" y="96" width="290" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">② 区间前缀和 pre[i] = Σ cⱼ·(rⱼ−lⱼ+1)</text>
  <text x="320" y="124" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">pre[i+1] − pre[j+1] = 区间 j+1..i 的硬币总数</text>
  <path d="M 320 130 L 320 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- C: 两趟扫描 -->
  <g filter="url(#rough2)"><polygon points="160,176 320,146 480,176 320,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">③ 两趟扫描，哪个对齐先跑哪个</text>

  <path d="M 245 206 C 200 232 160 236 132 252" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 395 206 C 440 232 480 236 508 252" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- C1: 右端对齐 -->
  <g filter="url(#rough2)"><rect x="42" y="254" width="256" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="170" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">趟 A：右端贴 rᵢ（窗口 [rᵢ−k+1, rᵢ]）</text>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">left 指针 = 最小 j 使 rⱼ ≥ rᵢ−k+1</text>
  <text x="170" y="297" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">L 单调不减 ⇒ left 只前进 —— 均摊 O(n)</text>

  <!-- C2: 左端对齐 -->
  <g filter="url(#rough2)"><rect x="342" y="254" width="256" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="470" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">趟 B：左端贴 lᵢ（窗口 [lᵢ, lᵢ+k−1]）</text>
  <text x="470" y="286" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">right 指针 = 最大 j 使 lⱼ ≤ lᵢ+k−1</text>
  <text x="470" y="297" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">R 单调不减 ⇒ right 只前进 —— 均摊 O(n)</text>

  <path d="M 170 298 L 170 312" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 470 298 L 470 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- D: 三段式求和 -->
  <g filter="url(#rough2)"><rect x="75" y="314" width="490" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">④ 每个候选窗口 O(1) 求和：三段式</text>

  <!-- ===== 三段式结构图 ===== -->
  <text x="60" y="378" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">以趟 A 为例：窗口横跨多个区间时，分成三段</text>

  <!-- 数轴 + 区间条 -->
  <path d="M 70 452 L 580 452" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 区间条（窗口外的） -->
  <g filter="url(#rough2)"><rect x="90" y="438" width="52" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="116" y="450.5" text-anchor="middle" font-size="9.5" fill="#2b4a6b" filter="url(#rough2)">j−1</text>
  <g filter="url(#rough2)"><rect x="520" y="438" width="44" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="542" y="450.5" text-anchor="middle" font-size="9.5" fill="#2b4a6b" filter="url(#rough2)">i+1</text>

  <!-- 窗口 [L, R] 框 -->
  <g filter="url(#rough2)"><rect x="150" y="424" width="362" height="34" rx="5" fill="none" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="150" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">L = rᵢ−k+1</text>
  <text x="512" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">R = rᵢ</text>

  <!-- 三段填色 -->
  <g filter="url(#rough2)"><rect x="152" y="426" width="58" height="30" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="181" y="445" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">left段</text>
  <g filter="url(#rough2)"><rect x="212" y="426" width="220" height="30" fill="#e6f4ea" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="322" y="441" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">left+1 … i 整段覆盖</text>
  <text x="322" y="452" text-anchor="middle" font-size="9" fill="#2c5f2c" filter="url(#rough2)">pre[i+1] − pre[left+1]  O(1)</text>
  <g filter="url(#rough2)"><rect x="434" y="426" width="76" height="30" fill="#fff8e1" fill-opacity="0.9" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="472" y="445" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">区间 i（=R 端）</text>

  <!-- 公式标注 -->
  <path d="M 181 460 C 170 486 150 490 140 500" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="52" y="502" width="196" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="150" y="518" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">部分覆盖的区间 left：</text>
  <text x="150" y="532" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">c·(r_left − max(l_left, L) + 1)</text>

  <path d="M 472 460 C 480 484 500 488 508 498" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="392" y="502" width="196" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="490" y="518" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">趟 A 中 R = rᵢ，区间 i 恰好全含：</text>
  <text x="490" y="532" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">若 left = i，公式自动退化为整段</text>

  <g filter="url(#rough2)"><rect x="52" y="552" width="536" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">窗口和 = 部分区间贡献 + pre 差 + 整段贡献，全部 O(1)</text>
  <text x="320" y="582" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">排序 O(n log n) 为主项；两趟扫描各均摊 O(n)；空间 O(n)</text>
</svg>
