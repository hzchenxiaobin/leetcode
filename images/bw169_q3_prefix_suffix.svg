<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">pre[] 以 i 结尾、suf[] 以 i 开头的最长非递减段</text>

  <!-- nums 行 -->
  <text x="22" y="82" font-size="12" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="72" y="62" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="62" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="62" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="62" width="56" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="312" y="62" width="56" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="87" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="386" y="87" font-size="11" fill="#b85450" filter="url(#rough2)">← 待替换</text>

  <!-- pre 行 -->
  <text x="28" y="146" font-size="12" fill="#4a7a3a" filter="url(#rough2)">pre</text>
  <rect x="72" y="126" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="126" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="126" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="126" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="312" y="126" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="386" y="149" font-size="11" fill="#4a7a3a" filter="url(#rough2)">向左延伸</text>

  <!-- suf 行 -->
  <text x="28" y="212" font-size="12" fill="#d6a040" filter="url(#rough2)">suf</text>
  <rect x="72" y="192" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="132" y="192" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="192" y="192" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="192" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="312" y="192" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="386" y="215" font-size="11" fill="#d6a040" filter="url(#rough2)">向右延伸</text>

  <!-- 转移说明 -->
  <rect x="60" y="250" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre[i] = pre[i-1]+1</text>
  <text x="160" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">当 nums[i-1] ≤ nums[i]</text>

  <rect x="280" y="250" width="200" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">suf[i] = suf[i+1]+1</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">当 nums[i] ≤ nums[i+1]</text>
</svg>
