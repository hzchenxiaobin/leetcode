<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">查询流程：value → 坐标 → 方向枚举 → 求和</text>

  <!-- step 1: position lookup -->
  <g filter="url(#rough2)">
    <rect x="90" y="46" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="210" y="69" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">pos[value] → (x, y)</text>
  <text x="338" y="69" font-size="10.5" fill="#999999" filter="url(#rough2)">← O(1) 直接寻址</text>

  <path d="M 210 82 L 210 102" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: enumerate directions -->
  <g filter="url(#rough2)">
    <rect x="90" y="106" width="240" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="210" y="129" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">枚举 4 个方向偏移 (dx, dy)</text>
  <path d="M 90 114 C 60 110 58 140 86 137" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="50" y="130" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">×4</text>

  <path d="M 210 142 L 210 162" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body container -->
  <g filter="url(#rough2)">
    <rect x="58" y="166" width="404" height="148" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="448" y="184" text-anchor="end" font-size="10" fill="#999999" filter="url(#rough2)">每个方向执行一次</text>

  <!-- decision diamond -->
  <polygon points="170,196 268,240 170,284 72,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="244" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">nx, ny 都在网格内？</text>

  <path d="M 268 240 L 302 240" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="306" y="222" width="148" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="380" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s += grid[nx][ny]</text>

  <path d="M 170 284 L 170 298" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="306" font-size="11" fill="#b85450" filter="url(#rough2)">否：越界 → 跳过该方向</text>

  <path d="M 260 314 L 260 336" stroke="#888888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <g filter="url(#rough2)">
    <rect x="170" y="340" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="260" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 s</text>

  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">构造时：pos[grid[i][j]] = (i, j)，扫描全部 n² 个格子</text>
</svg>
