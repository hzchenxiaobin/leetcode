<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶统计公式速查：两类边界一图记牢</text>

  <!-- 左：长度为偶 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="60" width="230" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
    <text x="155" y="86" font-weight="bold">区间长度为偶数</text>
    <text x="155" y="112">奇偶恰好各占一半</text>
    <g>
      <rect x="70" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
      <rect x="100" y="128" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
      <rect x="130" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
      <rect x="160" y="128" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
      <rect x="190" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
      <rect x="220" y="128" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    </g>
    <text x="155" y="176">奇数个数 = len / 2</text>
    <text x="155" y="198" fill="#446688">与 low, high 奇偶无关</text>
  </g>

  <!-- 右：长度为奇 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="290" y="60" width="230" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="405" y="86" font-weight="bold">区间长度为奇数</text>
    <text x="405" y="112">两端点奇偶相同 ⟹ 多的一方</text>
    <g>
      <rect x="320" y="128" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
      <rect x="354" y="128" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
      <rect x="388" y="128" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
      <rect x="422" y="128" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
      <rect x="456" y="128" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    </g>
    <text x="405" y="176">两端同为奇 ⟹ (len+1)/2 个奇数</text>
    <text x="405" y="198">两端同为偶 ⟹ (len−1)/2 个奇数</text>
  </g>

  <!-- 公式统一 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="60" y="234" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <text x="280" y="258" font-weight="bold" fill="#2d5a22">统一成容斥，免分类讨论：</text>
    <text x="280" y="280" fill="#2d5a22">奇数个数 = ⌊(high+1)/2⌋ − ⌊low/2⌋</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#7a7a7a" text-anchor="middle">
    <text x="280" y="318">f(x) = ⌊(x+1)/2⌋ 数的是 [0, x] 里的奇数：每对 (2k, 2k+1) 贡献 1 个</text>
    <text x="280" y="340">⌊low/2⌋ = f(low−1)（整数下整除自带「减 1」）</text>
  </g>

  <text x="280" y="372" font-size="12" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">易错：写成 (high − low + 1) / 2 会漏掉两端同奇的情况</text>
</svg>
