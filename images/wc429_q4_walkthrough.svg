<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：s = "000001"，numOps = 1 → 二分 [1, 5]</text>

  <!-- A. 原串 -->
  <text x="80" y="62" font-size="12.5" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="120" y="46" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="46" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="46" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="234" y="46" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="46" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="46" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="177" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="215" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="253" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="291" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="329" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M120,82 L120,88 L306,88 L306,82" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M314,82 L314,88 L344,88 L344,82" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="213" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">L = 5</text>
  <text x="329" y="104" text-anchor="middle" font-size="11" fill="#7a6020" filter="url(#rough2)">L = 1</text>
  <text x="390" y="66" font-size="11.5" fill="#333" filter="url(#rough2)">runs = [5, 1]</text>
  <text x="390" y="86" font-size="11.5" fill="#333" filter="url(#rough2)">maxL = 5（0 刀即达成）</text>

  <!-- B. 二分轨迹表 -->
  <rect x="55" y="124" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="185" y="124" width="250" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="435" y="124" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">二分探针</text>
  <text x="310" y="144" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">check 结果</text>
  <text x="475" y="144" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">区间动作</text>

  <rect x="55" y="154" width="130" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="185" y="154" width="250" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="435" y="154" width="80" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mid = 3</text>
  <text x="310" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⌊5/4⌋+⌊1/4⌋ = 1 ≤ 1 ✓</text>
  <text x="475" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">hi = 3</text>

  <rect x="55" y="186" width="130" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="185" y="186" width="250" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="435" y="186" width="80" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mid = 2</text>
  <text x="310" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⌊5/3⌋+⌊1/3⌋ = 1 ≤ 1 ✓</text>
  <text x="475" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">hi = 2</text>

  <rect x="55" y="218" width="130" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="185" y="218" width="250" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="435" y="218" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="239" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mid = 1</text>
  <text x="310" y="239" text-anchor="middle" font-size="11.5" fill="#7a3a34" filter="url(#rough2)">交替判定 min(d, n−d) = 2 &gt; 1 ✗</text>
  <text x="475" y="239" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">lo = 2</text>

  <!-- C. 收敛与构造 -->
  <text x="60" y="282" font-size="13" fill="#2d4d24" filter="url(#rough2)">收敛 lo = hi = 2 → 答案 2</text>
  <text x="60" y="306" font-size="11.5" fill="#333" filter="url(#rough2)">构造（L = 5 的段，m = 2，刀口偏移 2）：</text>
  <rect x="150" y="316" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="316" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="316" width="38" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="264" y="316" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="316" width="38" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="316" width="38" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="207" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="245" y="336" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="283" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="321" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="359" y="336" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="400" y="336" font-size="11.5" fill="#666" filter="url(#rough2)">= "001001"，正是</text>
  <text x="400" y="354" font-size="11.5" fill="#666" filter="url(#rough2)">官方解释的翻 s[2]</text>

  <text x="60" y="384" font-size="11.5" fill="#666" filter="url(#rough2)">示例 2 "0000"，numOps = 2：mid=2 → ⌊4/3⌋ = 1 ≤ 2 ✓；mid=1 → min(2,2) = 2 ≤ 2 ✓ → 答案 1（"1010"）</text>
  <text x="60" y="406" font-size="11.5" fill="#666" filter="url(#rough2)">示例 3 "0101"，numOps = 0：maxL = 1，lo = hi = 1 直接返回，check 一次都不调用</text>
</svg>
