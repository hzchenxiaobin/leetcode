<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">数字 + 紧随的括号块 = 一棵子树</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">第 1 对括号挂左孩子，第 2 对挂右孩子，串首数字就是整棵树的根</text>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="56" y="64" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="70" y="84" fill="#8a6a20">4</text>
    <rect x="84" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="98" y="84" fill="#777">(</text>
    <rect x="112" y="64" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="84" fill="#3a4a66">2</text>
    <rect x="140" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="154" y="84" fill="#777">(</text>
    <rect x="168" y="64" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="84" fill="#3a4a66">3</text>
    <rect x="196" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="210" y="84" fill="#777">)</text>
    <rect x="224" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="238" y="84" fill="#777">(</text>
    <rect x="252" y="64" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="266" y="84" fill="#3a4a66">1</text>
    <rect x="280" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="294" y="84" fill="#777">)</text>
    <rect x="308" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="322" y="84" fill="#777">)</text>
    <rect x="336" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="350" y="84" fill="#777">(</text>
    <rect x="364" y="64" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="378" y="84" fill="#3a4a66">6</text>
    <rect x="392" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="406" y="84" fill="#777">(</text>
    <rect x="420" y="64" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="434" y="84" fill="#3a4a66">5</text>
    <rect x="448" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="462" y="84" fill="#777">)</text>
    <rect x="476" y="64" width="28" height="28" fill="#f3f3f3" stroke="#bbbbbb" stroke-width="1.3" rx="4"/>
    <text x="490" y="84" fill="#777">)</text>
  </g>

  <path d="M 120 94 L 120 108" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 330 94 L 330 108" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 372 94 L 372 108" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <path d="M 498 94 L 498 108" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="112" y="108" width="224" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="7"/>
    <text x="224" y="128" font-size="11" fill="#3a5a30">左孩子子树  2(3)(1)</text>
    <rect x="364" y="108" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="7"/>
    <text x="434" y="128" font-size="11" fill="#8a3a36">右孩子子树  6(5)</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="28" y="180">① build(s, i) 只解析 i 出发的子树</text>
    <text x="28" y="206">② 返回时 i 已越过整棵子树</text>
    <text x="28" y="232">③ 每层最多两对括号 ⇒ 先左后右</text>
    <text x="28" y="258">④ 指针不回退 ⇒ 总代价 O(n)</text>
  </g>

  <path d="M 430 190 L 375 218" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 190 L 490 218" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 250 L 346 282" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 250 L 388 282" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 495 250 L 470 282" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle" font-size="13">
    <circle cx="430" cy="175" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="430" y="180" fill="#8a6a20">4</text>
    <circle cx="365" cy="235" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="365" y="240" fill="#3a4a66">2</text>
    <circle cx="495" cy="235" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="495" y="240" fill="#3a4a66">6</text>
    <circle cx="338" cy="295" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="338" y="300" fill="#3a5a30">3</text>
    <circle cx="390" cy="295" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="390" y="300" fill="#3a5a30">1</text>
    <circle cx="466" cy="295" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="466" y="300" fill="#3a5a30">5</text>
  </g>

  <text x="400" y="337" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">解析出的二叉树</text>
</svg>
