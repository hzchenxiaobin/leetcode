<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 13</text>

  <!-- 步骤 1：反转 -->
  <text x="60" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 反转</text>
  <rect x="150" y="46" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="46" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <path d="M248,64 C278,52 306,52 336,64" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="348" y="46" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="388" y="46" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="70" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r = 31</text>
  <text x="470" y="92" font-size="12" fill="#8a6d1f" filter="url(#rough2)">区间 [13, 31]</text>

  <!-- 步骤 2：区间判定 -->
  <text x="60" y="132" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 逐点判定</text>
  <rect x="54" y="142" width="532" height="34" fill="none"/>
  <rect x="54" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="82" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="96" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">14</text>
  <rect x="110" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="124" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">15</text>
  <rect x="138" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="152" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">16</text>
  <rect x="166" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">17</text>
  <rect x="194" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">19</text>
  <rect x="222" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">20</text>
  <rect x="250" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="264" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">21</text>
  <rect x="278" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="292" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">22</text>
  <rect x="306" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">23</text>
  <rect x="334" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="348" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">24</text>
  <rect x="362" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">25</text>
  <rect x="390" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="404" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">26</text>
  <rect x="418" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="432" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">27</text>
  <rect x="446" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">28</text>
  <rect x="474" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="488" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">29</text>
  <rect x="502" y="142" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="164" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">30</text>
  <rect x="530" y="142" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="544" y="164" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">31</text>

  <!-- 步骤 3：代表性判定表 -->
  <text x="60" y="206" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 代表性判定（上界 d ≤ m/d）</text>
  <!-- 表头 -->
  <rect x="60" y="216" width="80" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">m</text>
  <rect x="144" y="216" width="300" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">试除过程</text>
  <rect x="448" y="216" width="132" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <!-- 行 1：13 -->
  <rect x="60" y="246" width="80" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="264" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="144" y="246" width="300" height="26" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="264" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=2、3：均不整除（4·4 > 13 停）</text>
  <rect x="448" y="246" width="132" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 质数</text>
  <!-- 行 2：15 -->
  <rect x="60" y="276" width="80" height="26" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="294" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">15</text>
  <rect x="144" y="276" width="300" height="26" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="294" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=3：15 mod 3 = 0 → 有因子</text>
  <rect x="448" y="276" width="132" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 合数</text>
  <!-- 行 3：25 -->
  <rect x="60" y="306" width="80" height="26" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="324" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">25</text>
  <rect x="144" y="306" width="300" height="26" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=5：25 mod 5 = 0（5·5 = 25 恰触界）</text>
  <rect x="448" y="306" width="132" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 合数</text>
  <!-- 行 4：29 -->
  <rect x="60" y="336" width="80" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="354" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">29</text>
  <rect x="144" y="336" width="300" height="26" rx="3" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="294" y="354" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d=2、3、5：均不整除（6·6 > 29 停）</text>
  <rect x="448" y="336" width="132" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 质数</text>

  <!-- 步骤 4：求和 -->
  <text x="60" y="396" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 求和</text>
  <rect x="60" y="406" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="426" text-anchor="middle" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">13 + 17 + 19 + 23 + 29 + 31</text>
  <text x="320" y="446" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">= 132 ✓</text>
</svg>
