<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：字母互不相同 ⇒ 答案只由长度 n 决定</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">每个字母恰好出现一次，贡献 = 位次；是谁、挂哪个键都无所谓（图为 n = 10）</text>

  <!-- layer 1 (green): first 8 letters each cost 1 -->
  <g filter="url(#sk)">
    <rect x="92"  y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="150" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="208" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="266" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="324" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="382" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="440" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="498" y="76" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="112" y="97">x</text><text x="170" y="97">y</text><text x="228" y="97">c</text><text x="286" y="97">d</text>
    <text x="344" y="97">e</text><text x="402" y="97">f</text><text x="460" y="97">g</text><text x="518" y="97">h</text>
  </g>

  <!-- layer 2 (blue): i, j used, 6 dashed empty slots -->
  <g filter="url(#sk)">
    <rect x="92"  y="114" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="150" y="114" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="112" y="135">i</text><text x="170" y="135">j</text>
  </g>
  <g filter="url(#sk)">
    <rect x="208" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="266" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="324" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="382" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="440" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="498" y="114" width="40" height="32" rx="4" fill="none" stroke="#4a8edb" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>

  <!-- layer labels on the right -->
  <g filter="url(#sk)" font-size="10.5" font-weight="bold">
    <text x="546" y="97"  fill="#4a8e4a">第1位·按1次</text>
    <text x="546" y="135" fill="#4a8edb">第2位·按2次</text>
  </g>

  <!-- key labels -->
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#777">
    <text x="112" y="168">键2</text><text x="170" y="168">键3</text><text x="228" y="168">键4</text><text x="286" y="168">键5</text>
    <text x="344" y="168">键6</text><text x="402" y="168">键7</text><text x="460" y="168">键8</text><text x="518" y="168">键9</text>
  </g>

  <!-- note box 1 -->
  <g filter="url(#sk)">
    <rect x="35" y="188" width="570" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="210" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">字母互异 ⇒ 无需统计频率：每个字母只交一次「位次税」，是谁、挂哪个键都不影响</text>
  <text x="320" y="230" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">「设计键盘」坍缩为「给 n 个字母各定一个位次」，最小化位次总和即可</text>

  <!-- formula banner -->
  <g filter="url(#sk)">
    <rect x="35" y="256" width="570" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="320" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans(n) = Σ ⌈i/8⌉ （i = 1..n）—— 答案只是 n 的函数</text>
  <text x="320" y="297" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">= 8×(1+2+…+q) + r×(q+1) = (q+1)(4q+r)，其中 q = ⌊n/8⌋，r = n mod 8</text>

  <!-- supply constraint note -->
  <g filter="url(#sk)">
    <rect x="35" y="322" width="570" height="48" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-size="11.5" fill="#a06b1a" filter="url(#sk)">供给约束：位次 ≤ p 的槽至多 8p 个——任何映射都逃不出，贪心分层恰好顶满</text>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#a06b1a" filter="url(#sk)">n ≤ 26 = 8+8+8+2 ⇒ 位次至多 4</text>

  <!-- four quick ranges -->
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">分档速查（每深一层，单价 +1）：</text>
  <g filter="url(#sk)">
    <rect x="35"  y="398" width="138" height="58" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="181" y="398" width="138" height="58" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="327" y="398" width="138" height="58" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="473" y="398" width="132" height="58" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold" text-anchor="middle" fill="#4a4a4a">
    <text x="104" y="420">n ≤ 8</text>
    <text x="250" y="420">9 ≤ n ≤ 16</text>
    <text x="396" y="420">17 ≤ n ≤ 24</text>
    <text x="539" y="420">25 ≤ n ≤ 26</text>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#2b5d85">
    <text x="104" y="443">ans = n</text>
    <text x="250" y="443">8 + 2(n−8)</text>
    <text x="396" y="443">24 + 3(n−16)</text>
    <text x="539" y="443">48 + 4(n−24)</text>
  </g>
</svg>
