<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">概念模型：每杯容量 1，溢出部分均分给左下与右下</text>

  <text x="196" y="103" text-anchor="end" font-size="13" fill="#667" filter="url(#rough2)">第 0 行</text>
  <text x="196" y="183" text-anchor="end" font-size="13" fill="#667" filter="url(#rough2)">第 1 行</text>
  <text x="196" y="263" text-anchor="end" font-size="13" fill="#667" filter="url(#rough2)">第 2 行</text>

  <rect x="314" y="76" width="92" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">(0,0)</text>

  <rect x="261" y="156" width="92" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="307" y="184" text-anchor="middle" font-size="14" fill="#2b4a6f" filter="url(#rough2)">(1,0)</text>
  <rect x="367" y="156" width="92" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="413" y="184" text-anchor="middle" font-size="14" fill="#2b4a6f" filter="url(#rough2)">(1,1)</text>

  <rect x="208" y="236" width="92" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="264" text-anchor="middle" font-size="14" fill="#33604a" filter="url(#rough2)">(2,0)</text>
  <rect x="314" y="236" width="92" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="14" fill="#33604a" filter="url(#rough2)">(2,1)</text>
  <rect x="420" y="236" width="92" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="264" text-anchor="middle" font-size="14" fill="#33604a" filter="url(#rough2)">(2,2)</text>

  <path d="M352,120 C330,132 315,140 309,152" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M368,120 C390,132 405,140 411,152" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M299,200 C277,212 262,220 256,232" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M315,200 C337,212 352,220 358,232" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M405,200 C383,212 368,220 362,232" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M421,200 C443,212 458,220 464,232" fill="none" stroke="#8a6a20" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="314" width="624" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="341" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">规则：某杯收到 x 杯，x &gt; 1 才溢出，把 (x − 1)/2 分给左右两个杯子</text>

  <rect x="48" y="368" width="624" height="42" rx="8" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="395" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">顶层 (0,0) 收到 poured 杯；底行溢出的香槟直接落地，答案恒 ≤ 1</text>
</svg>
