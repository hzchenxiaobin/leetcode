<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：sentence = [i, had, apple, pie]，rows = 4，cols = 5</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行内贪心塞词（词不可拆、顺序不变、相邻词恰好一个空格），T 为累计单词数</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="62" y="72" text-anchor="middle" filter="url(#rough2)">行 r</text>
    <text x="130" y="72" text-anchor="middle" filter="url(#rough2)">行首 cur</text>
    <text x="250" y="72" text-anchor="middle" filter="url(#rough2)">本行内容</text>
    <text x="352" y="72" text-anchor="middle" filter="url(#rough2)">k</text>
    <text x="420" y="72" text-anchor="middle" filter="url(#rough2)">T 累计</text>
    <text x="500" y="72" text-anchor="middle" filter="url(#rough2)">下一行 cur</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <rect x="44" y="82" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="62" y="100" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="130" y="100" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">0</text>
    <rect x="172" y="82" width="156" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="250" y="100" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i had</text>
    <text x="352" y="100" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">2</text>
    <text x="420" y="100" text-anchor="middle" fill="#555" filter="url(#rough2)">2</text>
    <text x="500" y="100" text-anchor="middle" fill="#555" filter="url(#rough2)">2</text>

    <rect x="44" y="120" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="62" y="138" text-anchor="middle" fill="#3a5a30" filter="url(#rough2)">2</text>
    <text x="130" y="138" text-anchor="middle" fill="#3a5a30" filter="url(#rough2)">2</text>
    <rect x="172" y="120" width="156" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="250" y="138" text-anchor="middle" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">apple</text>
    <text x="352" y="138" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="420" y="138" text-anchor="middle" fill="#555" filter="url(#rough2)">3</text>
    <text x="500" y="138" text-anchor="middle" fill="#555" filter="url(#rough2)">3</text>

    <rect x="44" y="158" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="62" y="176" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">3</text>
    <text x="130" y="176" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">3</text>
    <rect x="172" y="158" width="156" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="250" y="176" text-anchor="middle" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">pie i</text>
    <text x="352" y="176" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">2</text>
    <text x="420" y="176" text-anchor="middle" fill="#555" filter="url(#rough2)">5</text>
    <text x="500" y="176" text-anchor="middle" fill="#555" filter="url(#rough2)">1</text>

    <rect x="44" y="196" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="62" y="214" text-anchor="middle" fill="#8a3a36" filter="url(#rough2)">4</text>
    <text x="130" y="214" text-anchor="middle" fill="#8a3a36" filter="url(#rough2)">1</text>
    <rect x="172" y="196" width="156" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5"/>
    <text x="250" y="214" text-anchor="middle" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">had</text>
    <text x="352" y="214" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="420" y="214" text-anchor="middle" fill="#555" filter="url(#rough2)">6</text>
    <text x="500" y="214" text-anchor="middle" fill="#555" filter="url(#rough2)">2</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="250" y="240" filter="url(#rough2)">↑ 第 1 行放满 5 列（i + 空格 + had），下一个词 apple 放不下</text>
  </g>

  <rect x="54" y="252" width="452" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="70" y="274" font-weight="bold" filter="url(#rough2)">累计与取整</text>
    <text x="70" y="294" filter="url(#rough2)">T = 2 + 1 + 2 + 1 = 6（4 行一共放下 6 个单词）</text>
    <text x="70" y="312" filter="url(#rough2)">完整句子数 = ⌊T / n⌋ = ⌊6 / 4⌋ = 1；残留的 i、had 凑不成第 2 句</text>
  </g>

  <rect x="190" y="338" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">输出：1</text>
  <text x="280" y="383" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">若逐词模拟：每行 5 列最多 3 个词，rows = 4 时也只有 12 次尝试；rows = 2×10⁴ 时就会放大到 10⁸ 级</text>
</svg>
