<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">两条对角线：主对角线 nums[i][i] 与副对角线 nums[i][n-1-i]</text>

  <!-- matrix 3x3, cell 76px, origin (180, 56) -->
  <!-- row 0 -->
  <rect x="180" y="56" width="76" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="256" y="56" width="76" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="102" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">2</text>
  <rect x="332" y="56" width="76" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 1: center cell split into two triangles (on both diagonals) -->
  <rect x="180" y="132" width="76" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="178" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">5</text>
  <path d="M 256 132 L 332 132 L 256 208 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 332 132 L 332 208 L 256 208 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="294" y="178" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="332" y="132" width="76" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="178" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">7</text>

  <!-- row 2 -->
  <rect x="180" y="208" width="76" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="254" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">9</text>
  <rect x="256" y="208" width="76" height="76" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="254" text-anchor="middle" font-size="18" fill="#999" filter="url(#rough2)">10</text>
  <rect x="332" y="208" width="76" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="254" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">11</text>

  <!-- left annotation: main diagonal -->
  <text x="100" y="96" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">主对角线</text>
  <text x="100" y="114" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">nums[i][i]</text>
  <text x="100" y="132" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">= [1, 6, 11]</text>
  <path d="M 108 104 Q 140 100 172 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- right annotation: anti diagonal -->
  <text x="478" y="96" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">副对角线</text>
  <text x="478" y="114" font-size="11.5" fill="#d6a040" filter="url(#rough2)">nums[i][n-1-i]</text>
  <text x="478" y="132" font-size="11.5" fill="#d6a040" filter="url(#rough2)">= [3, 6, 9]</text>
  <path d="M 470 104 Q 440 100 414 84" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- center annotation -->
  <text x="478" y="160" font-size="11.5" fill="#7a5a9a" filter="url(#rough2)">中心点 6：</text>
  <text x="478" y="176" font-size="11.5" fill="#7a5a9a" filter="url(#rough2)">n 为奇数时</text>
  <text x="478" y="192" font-size="11.5" fill="#7a5a9a" filter="url(#rough2)">两条对角线重叠</text>
  <path d="M 470 166 Q 440 162 412 166" fill="none" stroke="#7a5a9a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom: candidate set -->
  <rect x="60" y="300" width="440" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">候选集 = {1, 3, 6, 9, 11}（6 重复出现，只算一次）</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">候选至多 2n ≤ 600 个 —— 只扫对角线，不扫全表 n² 个格子</text>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">其中质数：3 与 11 ⇒ 答案 = 11 ⭐</text>
</svg>
