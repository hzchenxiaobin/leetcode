<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">O(n) 一次扫描：边扫边更新 run，边扫边输出</text>

  <rect x="150" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="71" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">初始化 run = 1，results 为空</text>

  <path d="M 270 86 L 270 106" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="108" width="280" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">for i = 0 .. n - 1</text>
  <text x="270" y="146" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">若 nums[i] == nums[i-1] + 1 则 run += 1，否则 run = 1</text>

  <path d="M 270 154 L 270 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="176" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">i ≥ k - 1 时输出一个答案</text>
  <text x="270" y="213" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">results.push(run ≥ k ? nums[i] : -1)</text>

  <path d="M 270 220 L 270 240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="242" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">循环结束后返回 results</text>
  <text x="270" y="279" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度恰为 n - k + 1，无需额外裁剪</text>

  <rect x="60" y="306" width="420" height="66" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="76" y="328" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么不用窗口内再扫一遍？</text>
  <text x="76" y="348" font-size="10.5" fill="#555" filter="url(#rough2)">相邻窗口只差"进一个、出一个"两个元素，run 值天然携带了全部历史</text>
  <text x="76" y="365" font-size="10.5" fill="#555" filter="url(#rough2)">每步 O(1) 更新 ⇒ 总时间 O(n)，空间 O(1)（不计输出数组）</text>
</svg>
