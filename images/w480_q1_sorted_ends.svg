<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">排序后：最小 k 个在左端，最大 k 个在右端</text>

  <text x="160" y="91" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">原数组</text>
  <rect x="170" y="70" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="70" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="70" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="344" y="70" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="253" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="311" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="369" y="92" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <path d="M282 110 L282 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="130" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">排序</text>

  <text x="160" y="171" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">排序后</text>
  <rect x="170" y="150" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="150" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="150" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="344" y="150" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="195" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="253" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="311" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="369" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <path d="M286 144 L286 134 L394 134 L394 144" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="126" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">最大 k=2 个：4+5 = 9</text>

  <path d="M170 190 L170 200 L278 200 L278 190" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最小 k=2 个：2+2 = 4</text>

  <rect x="115" y="248" width="290" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 最大和 − 最小和</text>
  <text x="260" y="291" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">= 9 − 4 = 5</text>

  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">最大和 ≥ 最小和 恒成立，无需取绝对值</text>
</svg>
