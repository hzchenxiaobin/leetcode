<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：三条 gcd 链，两次提前退出</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每读入一个数就更新 g，g 单调不增；哪个子集最先让 g 变成 1，它就是裴蜀证书的来源</text>

  <g filter="url(#rough2)">
    <rect x="24" y="56" width="512" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.3" rx="6"/>
    <text x="40" y="75" font-size="10.5" fill="#444" font-weight="bold">数组 nums</text>
    <text x="214" y="75" font-size="10.5" fill="#444" font-weight="bold">逐步 gcd（g 只会变小）</text>
    <text x="446" y="75" font-size="10.5" fill="#444" font-weight="bold">结论</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="88" width="512" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6"/>
    <text x="40" y="108" font-size="11" fill="#3a5a30">[12, 5, 7, 23]</text>
    <text x="40" y="128" font-size="9" fill="#6b8f5e">子集 {12, 5} 已足够</text>
    <text x="214" y="108" font-size="11" fill="#3a5a30">12 → gcd(12,5) = 1</text>
    <text x="214" y="128" font-size="9" fill="#6b8f5e">第 2 步触到 1：7、23 不再参与</text>
    <text x="446" y="114" font-size="12" fill="#2f6b4f" font-weight="bold">true ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="148" width="512" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6"/>
    <text x="40" y="168" font-size="11" fill="#3a5a30">[29, 6, 10]</text>
    <text x="40" y="188" font-size="9" fill="#6b8f5e">子集 {29, 6} 已足够</text>
    <text x="214" y="168" font-size="11" fill="#3a5a30">29 → gcd(29,6) = 1</text>
    <text x="214" y="188" font-size="9" fill="#6b8f5e">第 2 步触到 1：10 不再参与</text>
    <text x="446" y="174" font-size="12" fill="#2f6b4f" font-weight="bold">true ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="208" width="512" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6"/>
    <text x="40" y="228" font-size="11" fill="#8a3a36">[3, 6]</text>
    <text x="40" y="248" font-size="9" fill="#b07b78">没有更小的 gcd 可用</text>
    <text x="214" y="228" font-size="11" fill="#8a3a36">3 → gcd(3,6) = 3</text>
    <text x="214" y="248" font-size="9" fill="#b07b78">3x + 6y = 3(x + 2y)，恒为 3 的倍数</text>
    <text x="446" y="234" font-size="12" fill="#b85450" font-weight="bold">false ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="276" width="512" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="40" y="296" font-size="10" fill="#8a6a20" font-weight="bold">对照裴蜀证书：把 1 写成这些数的整数系数组合</text>
    <text x="40" y="316" font-size="10" fill="#555">5·3 + 7·(−2) = 1    ·    12·3 + 5·(−7) = 1    ·    29·(−1) + 6·5 = 1</text>
    <text x="40" y="334" font-size="10" fill="#555">[3, 6] 无论挑哪个非空子集，系数怎么取都只能得到 3 的倍数，1 永远缺席。</text>
  </g>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：判定与「挑哪个子集」无关——只要全体 gcd = 1，就一定存在一个子集凑出 1</text>
</svg>
