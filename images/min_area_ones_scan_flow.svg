<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，只维护四个极值</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk2)">
    <rect x="270" y="58" width="60" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e">开始</text>
  <path d="M 300 86 L 300 96" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk2)">
    <rect x="195" y="100" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="300" y="118" text-anchor="middle" font-size="11.5" fill="#2b4a70">初始化：minRow = m, minCol = n</text>
  <text x="300" y="136" text-anchor="middle" font-size="11.5" fill="#2b4a70">maxRow = −1, maxCol = −1</text>
  <path d="M 300 144 L 300 154" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 双重循环（双线框） -->
  <g filter="url(#sk)">
    <rect x="183" y="160" width="234" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <rect x="187" y="164" width="226" height="32" rx="5" fill="none" stroke="#d6a040" stroke-width="1.3" filter="url(#sk2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">for i = 0…m−1 ：for j = 0…n−1</text>
  <path d="M 300 200 L 300 216" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <polygon points="300,222 405,264 300,306 195,264" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="300" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a70">grid[i][j] == 1 ?</text>

  <!-- 是 → 更新 -->
  <path d="M 300 306 L 300 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="312" y="320" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk2)">
    <rect x="140" y="330" width="320" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="300" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a2e">用 (i, j) 更新四个极值</text>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#3a5a2e">minRow = min(minRow, i)&#160;&#160;&#160;&#160;maxRow = max(maxRow, i)</text>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#3a5a2e">minCol = min(minCol, j)&#160;&#160;&#160;&#160;maxCol = max(maxCol, j)</text>

  <!-- 否：绕行汇合 -->
  <path d="M 405 264 L 470 264 L 470 448 L 312 448" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="482" y="356" text-anchor="middle" font-size="11.5" fill="#7a5415" transform="rotate(-90 482 356)">否（跳过这个格子）</text>

  <!-- 更新后下行到汇合点 -->
  <path d="M 300 406 L 300 442" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>
  <circle cx="300" cy="448" r="4" fill="#555" filter="url(#sk2)"/>

  <!-- 还有格子？ -->
  <polygon points="300,456 388,496 300,536 212,496" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="300" y="492" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">还有未扫的格子？</text>
  <text x="300" y="510" text-anchor="middle" font-size="10.5" fill="#999">（m×n 个都要看一遍）</text>

  <!-- 是：回到循环 -->
  <path d="M 212 496 L 96 496 L 96 178 L 177 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="82" y="340" text-anchor="middle" font-size="11.5" fill="#3a5a2e" transform="rotate(-90 82 340)">是 → 下一格</text>

  <!-- 否：扫完 → 返回 -->
  <path d="M 388 496 Q 436 496 462 522" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="424" y="482" font-size="11.5" font-weight="bold" fill="#b03a3a">否（扫完了）</text>
  <g filter="url(#sk2)">
    <rect x="470" y="504" width="340" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="640" y="523" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">return (maxRow − minRow + 1) × (maxCol − minCol + 1)</text>
  <text x="640" y="541" text-anchor="middle" font-size="10.5" fill="#999">两处跨度都要 +1：闭区间的格子数</text>

  <!-- 右侧说明 -->
  <g filter="url(#sk)">
    <rect x="500" y="70" width="400" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="522" y="94" font-size="13" font-weight="bold" fill="#7a5415">单趟 O(mn)：每个格子只看一眼</text>
  <text x="522" y="116" font-size="11.5" fill="#444">未命中：1 次比较就过；命中 1：至多再 4 次 min/max</text>
  <text x="522" y="138" font-size="11.5" fill="#444">m, n ≤ 1000 → 最多 10⁶ 格，毫秒级通过</text>

  <g filter="url(#sk)">
    <rect x="500" y="182" width="400" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="522" y="206" font-size="13" font-weight="bold" fill="#3a5a2e">哨兵初始化，免特判</text>
  <text x="522" y="228" font-size="11.5" fill="#444">min 类 = m / n：合法下标再小也小不过哨兵</text>
  <text x="522" y="250" font-size="11.5" fill="#444">max 类 = −1：任何 1 的下标都比 −1 大；题目保证至少一个 1</text>

  <g filter="url(#sk)">
    <rect x="500" y="294" width="400" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="522" y="318" font-size="13" font-weight="bold" fill="#2b4a70">为什么不能提前终止？</text>
  <text x="522" y="342" font-size="11.5" fill="#444">minRow / minCol 锁定后不会再变，但</text>
  <text x="522" y="364" font-size="11.5" fill="#444">maxRow / maxCol 可能被最后一行 / 列的 1 撑大，</text>
  <text x="522" y="386" font-size="11.5" fill="#444">没扫完就返回，答案可能偏小。最坏必须读遍全图，</text>
  <text x="522" y="408" font-size="11.5" font-weight="bold" fill="#b03a3a">未读的格子都可能藏着一个撑大盒子的 1（下界 O(mn)）</text>
</svg>
