<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：数对网格 —— ✓ 格子的个数就是答案</text>

  <text x="295" y="58" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">列头 = nums2[j] · k（示例 1 中 k = 1）</text>

  <rect x="190" y="68" width="70" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="260" y="68" width="70" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="330" y="68" width="70" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="88" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="156" y="100" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">行值</text>
  <rect x="128" y="104" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="127" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="142" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="165" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="128" y="180" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="203" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="190" y="104" width="70" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1%1=0 ✓</text>
  <rect x="260" y="104" width="70" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="127" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1%3=1 ✗</text>
  <rect x="330" y="104" width="70" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="365" y="127" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1%4=1 ✗</text>

  <rect x="190" y="142" width="70" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3%1=0 ✓</text>
  <rect x="260" y="142" width="70" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3%3=0 ✓</text>
  <rect x="330" y="142" width="70" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="365" y="165" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">3%4=3 ✗</text>

  <rect x="190" y="180" width="70" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="203" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4%1=0 ✓</text>
  <rect x="260" y="180" width="70" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="203" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4%3=1 ✗</text>
  <rect x="330" y="180" width="70" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="203" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4%4=0 ✓</text>

  <rect x="418" y="104" width="128" height="114" rx="8" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="482" y="128" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">✓ ⟺ 行值是列头的倍数</text>
  <text x="482" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数对 = 两数组全组合</text>
  <text x="482" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">共 n·m = 9 格</text>
  <text x="482" y="194" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">无 i&lt;j 限制，i=j 也算</text>

  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 个 ✓ —— 对应数对 (0,0) (1,0) (1,1) (2,0) (2,2)</text>
  <rect x="120" y="272" width="320" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">ans = Σ [ nums1[i] mod (nums2[j]·k) = 0 ]</text>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（示例 1：nums1 = nums2 = [1,3,4]，k = 1）</text>
</svg>
