<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>
  <text x="300" y="26" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">状态转移：一次 upper_bound 同时给出两种选择</text>
  <text x="300" y="47" font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">处理 arr1[i] 时，对每个可达的 (c, last) 向后推出两个后继状态</text>

  <rect x="44" y="96" width="172" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="130" y="122" font-size="13" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[c] = last</text>
  <text x="130" y="146" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">已处理前 i 个元素</text>
  <text x="130" y="164" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">恰好用掉 c 次替换</text>

  <path d="M 218 124 Q 274 110 326 104" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 218 158 Q 274 196 326 216" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="58" width="228" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="82" font-size="12" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① 保留 arr1[i]</text>
  <text x="444" y="104" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">前提：arr1[i] &gt; last</text>
  <text x="444" y="124" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">ndp[c] = min(ndp[c], arr1[i])</text>
  <text x="444" y="140" font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">列号 c 不变</text>

  <rect x="330" y="176" width="228" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="200" font-size="12" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② 替换 arr1[i]</text>
  <text x="444" y="221" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">v = min{ u ∈ arr2 | u &gt; last }</text>
  <text x="444" y="241" font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">前提：这样的 v 存在（未越界）</text>
  <text x="444" y="261" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">ndp[c+1] = min(ndp[c+1], v)</text>

  <text x="48" y="310" font-size="11.5" fill="#444" text-anchor="start" font-weight="bold" filter="url(#rough2)">arr2 排序去重：</text>
  <rect x="170" y="292" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="193" y="314" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="222" y="292" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="245" y="314" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="274" y="292" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="297" y="314" font-size="13" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="326" y="292" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="349" y="314" font-size="13" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">4</text>

  <text x="219" y="286" font-size="9.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">≤ last（不可选）</text>
  <text x="330" y="286" font-size="9.5" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">&gt; last（可选）</text>
  <rect x="164" y="290" width="110" height="42" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" rx="7" filter="url(#rough2)"/>
  <text x="297" y="350" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">upper_bound 返回 3</text>
  <text x="398" y="314" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">last = 2 时取 3</text>

  <rect x="44" y="362" width="512" height="30" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" font-size="10.5" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">共 n 轮、每轮至多 n 个 c ⇒ O(n²) 个状态，每个状态一次二分 ⇒ 时间 O(n² log m)、空间 O(n)</text>
</svg>
