<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">把每个位置翻译成 copy[0] 的区间，再求交集</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">示例 2：bounds = [[1,10],[2,9],[3,8],[4,7]]，d = [0,1,2,3]</text>
  <rect x="86" y="70" width="120" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="146.0" y="66" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">交集 [1,4]</text>
  <text x="8" y="99" text-anchor="start" font-size="9.5" fill="#555555" filter="url(#rough2)">i=0  d=0</text>
  <rect x="86" y="86" width="360" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="456" y="99" text-anchor="start" font-size="9.5" fill="#666666" filter="url(#rough2)">[1,10]</text>
  <text x="8" y="139" text-anchor="start" font-size="9.5" fill="#555555" filter="url(#rough2)">i=1  d=1</text>
  <rect x="86" y="126" width="280" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="376" y="139" text-anchor="start" font-size="9.5" fill="#666666" filter="url(#rough2)">[1,8]</text>
  <text x="8" y="179" text-anchor="start" font-size="9.5" fill="#555555" filter="url(#rough2)">i=2  d=2</text>
  <rect x="86" y="166" width="200" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="296" y="179" text-anchor="start" font-size="9.5" fill="#666666" filter="url(#rough2)">[1,6]</text>
  <text x="8" y="219" text-anchor="start" font-size="9.5" fill="#555555" filter="url(#rough2)">i=3  d=3</text>
  <rect x="86" y="206" width="120" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="216" y="219" text-anchor="start" font-size="9.5" fill="#666666" filter="url(#rough2)">[1,4]</text>
  <path d="M 46 292 L 486 292" stroke="#666666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 46 292 L 46 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="46" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">0</text>
  <path d="M 86 292 L 86 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="86" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">1</text>
  <path d="M 126 292 L 126 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="126" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">2</text>
  <path d="M 166 292 L 166 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="166" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">3</text>
  <path d="M 206 292 L 206 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="206" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">4</text>
  <path d="M 246 292 L 246 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="246" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">5</text>
  <path d="M 286 292 L 286 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="286" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">6</text>
  <path d="M 326 292 L 326 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="326" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">7</text>
  <path d="M 366 292 L 366 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="366" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">8</text>
  <path d="M 406 292 L 406 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="406" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">9</text>
  <path d="M 446 292 L 446 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="446" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">10</text>
  <path d="M 486 292 L 486 298" stroke="#999999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="486" y="312" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">11</text>
  <text x="290" y="340" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">交集大小 4 − 1 + 1 = 4，与示例输出 4 一致</text>
  <text x="280.0" y="388" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">区间端点可能到 10⁹，用 long long 收拢；交集为空直接返回 0</text>
</svg>
