<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,4,3,2,5]，k = 3</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#555">
    <text x="44" y="66" font-weight="bold" fill="#444">i</text>
    <text x="92" y="66" font-weight="bold" fill="#444">子数组</text>
    <text x="236" y="66" font-weight="bold" fill="#444">相邻差</text>
    <text x="368" y="66" font-weight="bold" fill="#444">结论</text>
    <text x="462" y="66" font-weight="bold" fill="#444">results[i]</text>
  </g>
  <path d="M 40 76 L 508 76" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5">
    <text x="44" y="104" fill="#555">0</text>
    <text x="92" y="104" fill="#3a4a66">[1, 2, 3]</text>
    <text x="236" y="104" fill="#4a7a3a">+1, +1</text>
    <text x="368" y="104" fill="#4a7a3a">连续上升</text>
    <text x="462" y="104" fill="#4a7a3a" font-weight="bold">3</text>

    <text x="44" y="140" fill="#555">1</text>
    <text x="92" y="140" fill="#3a4a66">[2, 3, 4]</text>
    <text x="236" y="140" fill="#4a7a3a">+1, +1</text>
    <text x="368" y="140" fill="#4a7a3a">连续上升</text>
    <text x="462" y="140" fill="#4a7a3a" font-weight="bold">4</text>

    <text x="44" y="176" fill="#555">2</text>
    <text x="92" y="176" fill="#8a3a36">[3, 4, 3]</text>
    <text x="236" y="176" fill="#b85450">+1, -1</text>
    <text x="368" y="176" fill="#b85450">断点</text>
    <text x="462" y="176" fill="#b85450" font-weight="bold">-1</text>

    <text x="44" y="212" fill="#555">3</text>
    <text x="92" y="212" fill="#8a3a36">[4, 3, 2]</text>
    <text x="236" y="212" fill="#b85450">-1, -1</text>
    <text x="368" y="212" fill="#b85450">断点</text>
    <text x="462" y="212" fill="#b85450" font-weight="bold">-1</text>

    <text x="44" y="248" fill="#555">4</text>
    <text x="92" y="248" fill="#8a3a36">[3, 2, 5]</text>
    <text x="236" y="248" fill="#b85450">-1, +3</text>
    <text x="368" y="248" fill="#b85450">断点</text>
    <text x="462" y="248" fill="#b85450" font-weight="bold">-1</text>
  </g>

  <rect x="40" y="276" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="298" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">输出：[3, 4, -1, -1, -1]</text>
  <text x="54" y="317" font-size="10.5" fill="#555" filter="url(#rough2)">只有前两个窗口的差值全为 +1，能量值取各自末元素</text>

  <rect x="40" y="340" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="360" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">注意 [-1, +3] 这种"先降后大跳"的窗口：相邻差里出现非 +1 就不合法</text>
  <text x="54" y="376" font-size="10" fill="#888" filter="url(#rough2)">最大值大并不代表能量值大，合法性优先于大小</text>
</svg>
