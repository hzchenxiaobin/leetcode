<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">边松弛：把 grid[v] 上调到与 d+1 同奇偶</text>

  <g filter="url(#rough2)">
    <rect x="90" y="48" width="500" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="73" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">t₀ = dist[u] + 1；若 t₀ ≥ grid[v]：无需等待，t = t₀</text>

  <!-- ===== 情形 A ===== -->
  <text x="60" y="126" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">情形 A：grid[v] ≡ t₀ (mod 2) → t = grid[v]</text>

  <path d="M 70 180 L 600 180" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <line x1="70" y1="173" x2="70" y2="187" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="132" y1="173" x2="132" y2="187" stroke="#446688" stroke-width="1.8"/>
    <line x1="194" y1="173" x2="194" y2="187" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="256" y1="173" x2="256" y2="187" stroke="#446688" stroke-width="1.8"/>
    <line x1="318" y1="173" x2="318" y2="187" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="380" y1="173" x2="380" y2="187" stroke="#446688" stroke-width="1.8"/>
    <line x1="442" y1="173" x2="442" y2="187" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="504" y1="173" x2="504" y2="187" stroke="#446688" stroke-width="1.8"/>
    <line x1="566" y1="173" x2="566" y2="187" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="204" fill="#d6a040">3</text>
    <text x="132" y="204" fill="#446688">4</text>
    <text x="194" y="204" fill="#d6a040">5</text>
    <text x="256" y="204" fill="#446688">6</text>
    <text x="318" y="204" fill="#d6a040">7</text>
    <text x="380" y="204" fill="#446688">8</text>
    <text x="442" y="204" fill="#d6a040">9</text>
    <text x="504" y="204" fill="#446688">10</text>
    <text x="566" y="204" fill="#d6a040">11</text>
  </g>
  <circle cx="194" cy="180" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="194" y="154" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t₀ = d+1</text>
  <circle cx="442" cy="180" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="442" y="154" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">grid[v]</text>
  <path d="M 198 168 C 280 130 360 130 436 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="138" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">弹跳等到 9（同奇偶的门）</text>
  <text x="340" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">橙刻度 = 奇数，蓝刻度 = 偶数</text>

  <!-- ===== 情形 B ===== -->
  <text x="60" y="262" font-size="13.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">情形 B：grid[v] ≢ t₀ (mod 2) → t = grid[v] + 1</text>

  <path d="M 70 310 L 600 310" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <line x1="70" y1="303" x2="70" y2="317" stroke="#446688" stroke-width="1.8"/>
    <line x1="132" y1="303" x2="132" y2="317" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="194" y1="303" x2="194" y2="317" stroke="#446688" stroke-width="1.8"/>
    <line x1="256" y1="303" x2="256" y2="317" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="318" y1="303" x2="318" y2="317" stroke="#446688" stroke-width="1.8"/>
    <line x1="380" y1="303" x2="380" y2="317" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="442" y1="303" x2="442" y2="317" stroke="#446688" stroke-width="1.8"/>
    <line x1="504" y1="303" x2="504" y2="317" stroke="#d6a040" stroke-width="1.8"/>
    <line x1="566" y1="303" x2="566" y2="317" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="334" fill="#446688">4</text>
    <text x="132" y="334" fill="#d6a040">5</text>
    <text x="194" y="334" fill="#446688">6</text>
    <text x="256" y="334" fill="#d6a040">7</text>
    <text x="318" y="334" fill="#446688">8</text>
    <text x="380" y="334" fill="#d6a040">9</text>
    <text x="442" y="334" fill="#446688">10</text>
    <text x="504" y="334" fill="#d6a040">11</text>
    <text x="566" y="334" fill="#446688">12</text>
  </g>
  <circle cx="70" cy="310" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="286" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t₀ = d+1</text>
  <circle cx="380" cy="310" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 374 304 L 386 316 M 386 304 L 374 316" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">grid[v]=9 奇偶不符 ✗</text>
  <circle cx="442" cy="310" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="452" y="286" text-anchor="middle" font-size="10.5" fill="#2e5a24" filter="url(#rough2)">t = grid[v]+1 ✓</text>
  <path d="M 384 296 C 400 286 426 286 438 298" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="411" y="278" text-anchor="middle" font-size="10" fill="#2e5a24" filter="url(#rough2)">+1 对齐奇偶</text>

  <!-- ===== 底部等价式 ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="352" width="580" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#2c4d70" filter="url(#rough2)">等价视角：h(v) = 不小于 grid[v] 且 ≡ r+c (mod 2) 的最小整数（奇偶上取整）</text>
  <text x="340" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">松弛值 t = max(d+1, h(v))；代码一行：t = grid[v] + (grid[v] − t) % 2</text>
</svg>
