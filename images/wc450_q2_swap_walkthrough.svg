<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：逐环交换，2 次归位</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="70" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">目标</text>
  <g filter="url(#sk)">
    <rect x="120" y="64" width="76" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="206" y="64" width="76" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="292" y="64" width="76" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="378" y="64" width="76" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="158" y="87">16</text>
    <text x="244" y="87">34</text>
    <text x="330" y="87">43</text>
    <text x="416" y="87">18</text>
  </g>
  <text x="475" y="86" font-size="11" fill="#888">数位和 = [7, 7, 7, 9]</text>

  <text x="70" y="120" text-anchor="middle" font-size="10.5" fill="#999">下标</text>
  <g font-size="10" text-anchor="middle" font-family="monospace" fill="#999">
    <text x="158" y="120">0</text>
    <text x="244" y="120">1</text>
    <text x="330" y="120">2</text>
    <text x="416" y="120">3</text>
  </g>

  <text x="70" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">初始</text>
  <g filter="url(#sk)">
    <rect x="120" y="148" width="76" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="206" y="148" width="76" height="36" rx="5" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="292" y="148" width="76" height="36" rx="5" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="378" y="148" width="76" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="158" y="171">18</text>
    <text x="244" y="171">43</text>
    <text x="330" y="171">34</text>
    <text x="416" y="171">16</text>
  </g>
  <text x="475" y="166" font-size="11" fill="#b85450">环 (0,3) 未归位</text>

  <path d="M 158 186 Q 287 196 413 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 416 186 Q 287 216 161 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="475" y="206" font-size="11.5" font-weight="bold" fill="#b85450">① swap：18 ↔ 16</text>

  <text x="70" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">① 后</text>
  <g filter="url(#sk)">
    <rect x="120" y="230" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="206" y="230" width="76" height="36" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="292" y="230" width="76" height="36" rx="5" fill="#ffffff" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="378" y="230" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="158" y="253">16</text>
    <text x="244" y="253">43</text>
    <text x="330" y="253">34</text>
    <text x="416" y="253">18</text>
  </g>
  <text x="475" y="248" font-size="11" fill="#2e6e2e">环 (1,2) 未归位</text>

  <path d="M 244 268 Q 287 280 326 306" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 330 268 Q 287 294 248 306" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="475" y="288" font-size="11.5" font-weight="bold" fill="#2e6e2e">② swap：43 ↔ 34</text>

  <text x="70" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">② 后</text>
  <g filter="url(#sk)">
    <rect x="120" y="312" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="206" y="312" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="292" y="312" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="378" y="312" width="76" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="158" y="335">16</text>
    <text x="244" y="335">34</text>
    <text x="330" y="335">43</text>
    <text x="416" y="335">18</text>
  </g>
  <text x="475" y="330" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 与目标一致</text>

  <g filter="url(#sk)">
    <rect x="40" y="366" width="560" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#888">每个长度 k 的环恰用 k − 1 次交换：总计 (2 − 1) + (2 − 1) = 2 次</text>
</svg>
