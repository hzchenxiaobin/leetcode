<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="360" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">翻转等价：每个节点的左右孩子可以互换</text>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">树 1</text>
  <circle cx="150" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="100" cy="152" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="200" cy="152" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="60" cy="212" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="130" cy="212" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="200" cy="212" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 150 112 L 100 132" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 150 112 L 200 132" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 100 172 L 60 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 100 172 L 130 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 200 172 L 200 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="62" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">树 2（翻转了 1、3、5）</text>
  <circle cx="440" cy="92" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="97" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="390" cy="152" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="157" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="490" cy="152" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="157" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="360" cy="212" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="420" cy="212" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="490" cy="212" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="217" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 440 112 L 390 132" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 440 112 L 490 132" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 390 172 L 360 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 390 172 L 420 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 490 172 L 490 192" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 236 100 L 336 100" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">逐层比对</text>
  <text x="300" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">根相同、孩子集合相同 ⇒ 可以靠交换变成一样</text>
  <rect x="120" y="284" width="360" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">value 相同 且（左左&右右 或 左右&右左）都等价</text>
  <text x="300" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">注意：不是「按层序数组相同」，层序会随翻转变化</text>
</svg>
