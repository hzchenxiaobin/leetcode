<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">在第 s 秒清零下标 i，到底“省”了多少？</text>

  <!-- 时间线 -->
  <g filter="url(#rough2)">
    <text x="60" y="64" font-size="12.5" fill="#555">每秒先全体 +nums2[i]，第 s 秒末可清零一个 nums1[i]：</text>
    <line x1="60" y1="100" x2="470" y2="100" stroke="#446688" stroke-width="2"/>
    <g font-size="10.5" fill="#555">
      <circle cx="100" cy="100" r="4" fill="#e8f0fe" stroke="#446688"/>
      <text x="100" y="120" text-anchor="middle">第1秒</text>
      <circle cx="180" cy="100" r="4" fill="#e8f0fe" stroke="#446688"/>
      <text x="180" y="120" text-anchor="middle">第2秒</text>
      <circle cx="260" cy="100" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
      <text x="260" y="120" text-anchor="middle" fill="#b85450">第 s 秒</text>
      <circle cx="400" cy="100" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
      <text x="400" y="120" text-anchor="middle" fill="#4a7a3a">第 t 秒（结算）</text>
    </g>
    <text x="260" y="86" text-anchor="middle" font-size="11.5" fill="#b85450">↑ 清零：nums1[i] 归 0，之前的累积一笔勾销</text>
    <path d="M 266 108 C 300 130, 360 130, 394 108" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text x="330" y="148" font-size="11.5" fill="#4a7a3a">清零后每秒仍 +nums2[i]，共再涨 (t − s) 秒</text>
  </g>

  <!-- 收益公式 -->
  <g filter="url(#rough2)">
    <rect x="36" y="166" width="448" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="192" font-size="13" fill="#8a6d1f">下标 i 在第 s 秒被清零后，第 t 秒末它的值：</text>
    <text x="260" y="220" text-anchor="middle" font-size="14.5" fill="#333">不清零：nums1[i] + t·nums2[i]　→　清零：(t − s)·nums2[i]</text>
    <text x="260" y="248" text-anchor="middle" font-size="14" fill="#b85450">折抵 = nums1[i] + s·nums2[i]（清得越晚，省得越多！）</text>
  </g>

  <!-- 总和公式 -->
  <g filter="url(#rough2)">
    <rect x="36" y="274" width="448" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="300" text-anchor="middle" font-size="13.5" fill="#1d5c1a">S(t) = S₁ + t·S₂ − Σ (nums1[i] + sᵢ·nums2[i])</text>
    <text x="260" y="328" text-anchor="middle" font-size="12" fill="#555">每秒至多清零一个下标；同一下标清两次没有意义（只有最后一次生效）</text>
  </g>
</svg>
