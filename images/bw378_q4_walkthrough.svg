<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：账本全配平为 true；总账相等但余量为负是 false</text>
  <path d="M 250 40 Q 470 50 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: positive example -->
  <text x="80" y="74" font-size="13" font-weight="bold" fill="#2e6e2e">正例（示例 3）：s = "acbcab"，查询 [1,2,4,5]</text>
  <g filter="url(#sk)">
    <rect x="100" y="88" width="40" height="32" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="144" y="88" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="188" y="88" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="100" y="126" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="144" y="126" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="188" y="126" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="142" y="86" width="88" height="36" rx="6" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="98" y="124" width="132" height="36" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="120" y="109" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="164" y="109" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="208" y="109" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="120" y="147" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="164" y="147" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="208" y="147" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="120" y="176" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="164" y="176" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="208" y="176" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="260" y="100" font-size="11" fill="#8e3a34" font-weight="bold">U1=[1,2]</text>
  <text x="260" y="118" font-size="11" fill="#b8862a" font-weight="bold">U2=[0,2]</text>
  <text x="260" y="136" font-size="11" fill="#444">交集 I=[1,2]</text>
  <text x="260" y="154" font-size="11" fill="#444">i=0 仅②，双×2</text>
  <text x="260" y="172" font-size="11" fill="#444">门外为空 → A ✓</text>

  <!-- left ledger table -->
  <g filter="url(#sk)">
    <rect x="96" y="192" width="352" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="96" y="216" width="352" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="96" y="240" width="352" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="96" y="264" width="352" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
  </g>
  <text x="118" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">v</text>
  <text x="162" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">X</text>
  <text x="206" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">Dx</text>
  <text x="256" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">X−Dx</text>
  <text x="306" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">Y</text>
  <text x="350" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">Dy</text>
  <text x="400" y="208" text-anchor="middle" font-size="10" fill="#2b5a8e" font-weight="bold">Y−Dy</text>
  <text x="118" y="232" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="162" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="206" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="306" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="350" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="118" y="256" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="162" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="206" y="256" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="306" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="350" y="256" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="400" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="118" y="280" text-anchor="middle" font-size="11" fill="#333">c</text>
  <text x="162" y="280" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="206" y="280" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="256" y="280" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="306" y="280" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#333">1</text>
  <g filter="url(#sk)">
    <rect x="96" y="300" width="352" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="272" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">三行全配平且非负 → true</text>
  <text x="272" y="348" text-anchor="middle" font-size="11" fill="#444">双位置配 b,c；仅②位置 0 由右池剩的 a 配 x[0]=a</text>
  <text x="272" y="366" text-anchor="middle" font-size="11" fill="#444">→ "abccba" 回文成立</text>

  <!-- right: trap example -->
  <text x="520" y="74" font-size="13" font-weight="bold" fill="#8e3a34">陷阱例：s = "abab"，查询 [0,0,2,2]</text>
  <g filter="url(#sk)">
    <rect x="540" y="88" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="584" y="88" width="40" height="32" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="540" y="126" width="40" height="32" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="584" y="126" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="538" y="86" width="44" height="36" rx="6" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="582" y="124" width="44" height="36" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="560" y="109" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="604" y="109" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="560" y="147" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="604" y="147" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="560" y="176" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="604" y="176" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="700" y="100" font-size="11" fill="#8e3a34" font-weight="bold">U1={0}</text>
  <text x="700" y="118" font-size="11" fill="#b8862a" font-weight="bold">U2={1}</text>
  <text x="700" y="136" font-size="11" fill="#444">无交集（各自单格）</text>
  <text x="700" y="154" font-size="11" fill="#444">重排 = 没排</text>
  <text x="700" y="172" font-size="11" fill="#444">门外为空 → A ✓</text>

  <!-- right ledger table -->
  <g filter="url(#sk)">
    <rect x="536" y="192" width="352" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="536" y="216" width="352" height="24" fill="#ffffff" stroke="#cccccc" stroke-width="0.8"/>
    <rect x="536" y="240" width="352" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="558" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">v</text>
  <text x="602" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">X</text>
  <text x="646" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">Dx</text>
  <text x="696" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">X−Dx</text>
  <text x="746" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">Y</text>
  <text x="790" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">Dy</text>
  <text x="840" y="208" text-anchor="middle" font-size="10" fill="#8e3a34" font-weight="bold">Y−Dy</text>
  <text x="558" y="232" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="602" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="646" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="696" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="746" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="790" y="232" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="840" y="232" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="558" y="256" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="602" y="256" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="646" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="696" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">−1</text>
  <text x="746" y="256" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="790" y="256" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="840" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">−1</text>
  <g filter="url(#sk)">
    <rect x="536" y="300" width="352" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="712" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e3a34">b 行：−1 = −1 相等但为负 → false</text>
  <text x="712" y="348" text-anchor="middle" font-size="11" fill="#444">左池掏不出 b 去配锁死的 y[0]=b</text>
  <text x="712" y="366" text-anchor="middle" font-size="11" fill="#444">「只查总账相等」的假算法在此翻车</text>

  <!-- bottom: example 2 interception -->
  <g filter="url(#sk)">
    <rect x="80" y="400" width="808" height="96" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="100" y="428" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2 的拦截方式：s = "abbcdecbba"，查询 [0,2,7,9]</text>
  <text x="100" y="452" font-size="12" fill="#444">U1 = [0,2] 与 U2 = [0,2] 完全重合 → 门外只剩 i ∈ {3, 4}：x[3]='c' vs y[3]='b'，x[4]='d' vs y[4]='e' 失配</text>
  <text x="100" y="476" font-size="12" font-weight="bold" fill="#8e3a34">条件 A 的容斥一步判 false——根本轮不到算账本（先查 A 的性能红利）</text>

  <!-- bottom formula reminder -->
  <g filter="url(#sk)">
    <rect x="80" y="516" width="808" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="544" font-size="13" font-weight="bold" fill="#2b5a8e">复盘一句话：</text>
  <text x="484" y="572" text-anchor="middle" font-size="14" font-family="monospace" font-weight="bold" fill="#333">可行 ⟺ 门外零失配 ∧ ∀v: Xv − Dxv = Yv − Dyv ≥ 0</text>
  <text x="484" y="594" text-anchor="middle" font-size="11" fill="#888">等式管「并集总账」，非负管「池子喂饱自家需求后的余量」——两半各自都不冗余</text>
</svg>
