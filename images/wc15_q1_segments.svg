<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：0 把数组切成若干段连续 1</text>
  <text x="280" y="49" text-anchor="middle" font-size="11" fill="#888">答案 = 所有「段长度」的最大值，段与段互不影响</text>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold">
    <rect x="120" y="96" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="174" y="96" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="228" y="96" width="50" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="282" y="96" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="336" y="96" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="390" y="96" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="145" y="126" fill="#3a5a30">1</text>
    <text x="199" y="126" fill="#3a5a30">1</text>
    <text x="253" y="126" fill="#8a3a36">0</text>
    <text x="307" y="126" fill="#3a4a66">1</text>
    <text x="361" y="126" fill="#3a4a66">1</text>
    <text x="415" y="126" fill="#3a4a66">1</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="145" y="160">0</text>
    <text x="199" y="160">1</text>
    <text x="253" y="160">2</text>
    <text x="307" y="160">3</text>
    <text x="361" y="160">4</text>
    <text x="415" y="160">5</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 120 172 L 224 172" stroke="#4a7a3a" stroke-width="2.2" fill="none"/>
    <path d="M 282 172 L 440 172" stroke="#446688" stroke-width="2.2" fill="none"/>
    <text x="172" y="190" text-anchor="middle" font-size="11" fill="#3a5a30">段 A：长度 2</text>
    <text x="253" y="190" text-anchor="middle" font-size="11" fill="#b85450">分隔</text>
    <text x="361" y="190" text-anchor="middle" font-size="11" fill="#3a4a66">段 B：长度 3</text>
  </g>

  <rect x="70" y="208" width="420" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="86" y="228" font-size="10.5" fill="#8a6a20">段内每个元素都是 1，段外紧邻的元素一定是 0 或数组边界，</text>
  <text x="86" y="246" font-size="10.5" fill="#8a6a20">所以「最长连续 1」只可能等于某一段的长度，扫描时记住最大值即可。</text>

  <rect x="150" y="276" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">答案 = max(2, 3) = 3</text>

  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999">陷阱：最后一段以 1 结尾时，若只在遇 0 时结算，会漏掉它</text>
</svg>
