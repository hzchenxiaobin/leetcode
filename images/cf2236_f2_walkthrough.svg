<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：样例 3，x = 4，a = [2, 4, 8, 13, 111, 6, 7]</text>
  <path d="M 128 40 Q 360 47 592 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="60" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">素因子 q = 2：容量 cᵢ = v₂(aᵢ) = (1, 2, 3, 0, 0, 1, 0)，M_q = 3，E_q = v₂(4) = 2，C₁ = 4、C₂ = 2、C₃ = 1</text>

  <rect x="40" y="76" width="640" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最大值 m</text>
  <text x="286" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">N_m 的母函数（每人的指数上限 = min(cᵢ, m)）</text>
  <text x="466" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">N_m(E+m)</text>
  <text x="552" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">N_m₋₁(E+m)</text>
  <text x="640" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">差值</text>

  <rect x="40" y="112" width="640" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m = 1</text>
  <text x="286" y="136" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">(1 + x)⁴</text>
  <text x="466" y="136" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="552" y="136" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="640" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>

  <rect x="40" y="152" width="640" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">m = 2</text>
  <text x="286" y="176" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">(1 + x)²(1 + x + x²)²</text>
  <text x="466" y="176" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <text x="552" y="176" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="640" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>

  <rect x="40" y="192" width="640" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">m = 3</text>
  <text x="286" y="216" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">(1 + x)²(1 + x + x²)(1 + x + x² + x³)</text>
  <text x="466" y="216" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">8</text>
  <text x="552" y="216" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="640" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>

  <rect x="40" y="234" width="640" height="34" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="257" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">每一行取“最大值 = m 且总和 = E+m”的补集差：N_m(E+m) − N_m₋₁(E+m)</text>
  <text x="640" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">Σ = 15</text>

  <rect x="40" y="280" width="330" height="118" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">剩下的素数都满足 E_q = 0</text>
  <text x="205" y="326" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">q = 3：1+1 = 2 ⇒ 2 + 1 = 3</text>
  <text x="205" y="348" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">q = 13：Σc = 1 ⇒ 2　　　q = 37：Σc = 1 ⇒ 2</text>
  <text x="205" y="370" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">q = 7：Σc = 1 ⇒ 2</text>
  <text x="205" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">乘积 = 3 × 2 × 2 × 2 = 24</text>

  <rect x="390" y="280" width="290" height="118" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="535" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">逐素因子相乘</text>
  <text x="535" y="332" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">ans = f₂ × 24</text>
  <text x="535" y="360" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">= 15 × 24 = 360 ✓</text>
  <text x="535" y="386" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">与官方输出一致</text>

  <rect x="150" y="414" width="420" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">15 × 24 = 360</text>

  <text x="360" y="482" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若某个 q | x 在所有人里都不出现，则 f_q = 0，答案直接为 0（样例 4 的 q = 5、样例 5 的 q = 3）</text>
</svg>
