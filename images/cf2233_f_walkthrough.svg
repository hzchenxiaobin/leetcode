<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="372" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：a = 16，b = 27，n = 27，答案 10</text>

  <rect x="40" y="58" width="600" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">步骤</text>
  <text x="185" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">当前顶点</text>
  <text x="292" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">除掉 d</text>
  <text x="382" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">乘上 m</text>
  <text x="482" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">代价 max(d,m)</text>
  <text x="600" y="83" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">新顶点</text>

  <rect x="40" y="102" width="600" height="38" rx="6" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="82" y="127" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">1</text>
  <text x="185" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">16</text>
  <text x="292" y="127" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">2</text>
  <text x="382" y="127" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">3</text>
  <text x="482" y="127" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="600" y="127" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">24</text>

  <rect x="40" y="146" width="600" height="38" rx="6" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="82" y="171" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">2</text>
  <text x="185" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">24</text>
  <text x="292" y="171" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">4</text>
  <text x="382" y="171" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">3</text>
  <text x="482" y="171" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="600" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">18</text>

  <rect x="40" y="190" width="600" height="38" rx="6" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="82" y="215" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">3</text>
  <text x="185" y="215" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">18</text>
  <text x="292" y="215" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">2</text>
  <text x="382" y="215" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">3</text>
  <text x="482" y="215" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="600" y="215" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">27</text>

  <rect x="40" y="238" width="600" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="263" text-anchor="middle" font-size="14" fill="#8a6420" filter="url(#rough2)">合计</text>
  <text x="382" y="263" text-anchor="middle" font-size="14" fill="#8a6420" filter="url(#rough2)">3 + 4 + 3</text>
  <text x="540" y="263" text-anchor="middle" font-size="16" fill="#8f3b38" filter="url(#rough2)">答案 = 10</text>

  <text x="40" y="306" font-size="13" fill="#666" filter="url(#rough2)">终点 27 = (16/16)·27，起点 16 = (16/1)·1：(D, M) 从 (1,1) 走到 (16,27)</text>
  <text x="40" y="330" font-size="13" fill="#666" filter="url(#rough2)">直接边 16 → 27 的代价是 27；(D,M) 每步的代价只看 (δ, μ)，与顶点绝对值无关</text>
  <text x="40" y="354" font-size="13" fill="#666" filter="url(#rough2)">同一组步骤换个顺序会经过 36 &gt; n = 27：顺序要挑「先减后增」的那种</text>
</svg>
