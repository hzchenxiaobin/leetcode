<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">以 0 为根：dp[v] = 子树内需反转的边数</text>

  <!-- 树：0 → 2 → 1 → 3，原边方向 2→0, 2→1, 1→3 -->
  <ellipse cx="260" cy="70" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <ellipse cx="260" cy="160" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="180" cy="250" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <ellipse cx="340" cy="250" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 边 2→0：从根往下走需要反转（红） -->
  <path d="M 262 88 L 262 136" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="112" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">原边 2→0</text>
  <text x="292" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">0→2 要反转 +1</text>

  <!-- 边 2→1：方向顺（绿） -->
  <path d="M 236 172 C 216 196, 200 210, 190 228" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="204" font-size="12" fill="#4a7a3a" filter="url(#rough2)">原边 2→1 ✓</text>

  <!-- 边 1→3：方向顺（绿） -->
  <path d="M 208 256 C 240 268, 280 268, 312 256" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">原边 1→3 ✓</text>

  <!-- dp 值 -->
  <rect x="380" y="60" width="120" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="78" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[0] = 1（+1）</text>
  <rect x="380" y="150" width="120" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[2] = 0</text>
  <rect x="380" y="240" width="120" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[1] = dp[3] = 0</text>

  <!-- 底部说明 -->
  <rect x="36" y="306" width="448" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[x] = Σ (dp[y] + cost(x→y))，cost 为 0/1，一次后序遍历完成</text>
</svg>
