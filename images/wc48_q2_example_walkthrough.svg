<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：low = 1, high = 3</text>

  <text x="170" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">原树（红 = 太小，橙 = 太大，绿 = 保留）</text>
  <text x="490" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">修剪后（层序 [3,2,null,1]）</text>

  <path d="M330,44 L330,392" stroke="#ccc" stroke-width="1.4" fill="none" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- 左：原树 -->
  <path d="M170,132 L108,167" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M170,132 L232,167" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M108,201 L152,238" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M152,274 L124,309" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="112" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="118" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <circle cx="108" cy="184" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="189" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <circle cx="232" cy="184" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="189" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <circle cx="152" cy="256" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="261" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <circle cx="124" cy="328" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="333" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <text x="88" y="180" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">0 &lt; low</text>
  <text x="256" y="180" font-size="10" fill="#8a6d1f" filter="url(#rough2)">4 &gt; high</text>
  <text x="196" y="243" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">trim(右)</text>
  <text x="176" y="300" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">1,2 在区间内</text>

  <!-- 右：修剪后 -->
  <path d="M490,132 L432,167" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M432,201 L404,239" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M490,132 L548,167" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M432,201 L490,239" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <circle cx="490" cy="112" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="118" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <circle cx="432" cy="184" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="189" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <circle cx="404" cy="256" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="404" y="261" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <circle cx="548" cy="184" r="15" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="548" y="189" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅</text>
  <circle cx="490" cy="256" r="15" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="490" y="261" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">∅</text>
  <text x="436" y="300" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">1 的孩子为空</text>
  <text x="572" y="300" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">∅ = null</text>

  <!-- 底部走查说明 -->
  <rect x="40" y="356" width="580" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="378" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3 在区间内 ⇒ 左右各递归；0 &lt; low ⇒ 丢弃 0 与其左子树，return trim(2) ⇒ 2 上移接在 3 的左指针</text>
  <text x="330" y="398" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4 &gt; high ⇒ 丢弃 4 与其右子树，return trim(4.left) = ∅；1 在区间内，保持为 2 的左孩子</text>
</svg>
