<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="486" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">能凑出重复双字母组的只有两种局面</text>
  <path d="M 178 44 Q 360 51 542 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 情况 1 -->
  <rect x="36" y="62" width="648" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="86" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">情况 ① 某个字母的张数 ≥ 3</text>
  <rect x="58" y="96" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="104" y="96" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="150" y="96" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="196" y="96" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="217" y="124" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="252" y="125" font-size="17" fill="#2f4a66" filter="url(#rough2)">…</text>
  <text x="284" y="112" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">把同一字母的卡片全部排在一起，</text>
  <text x="284" y="132" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">aa 就出现 c − 1 ≥ 2 次（可重叠）</text>
  <rect x="596" y="100" width="72" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="632" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 情况 2 -->
  <rect x="36" y="180" width="648" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="204" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">情况 ② 至少两个字母的张数 ≥ 2</text>
  <rect x="58" y="214" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="242" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">a</text>
  <rect x="104" y="214" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="242" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="150" y="214" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="242" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">a</text>
  <rect x="196" y="214" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="217" y="242" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">b</text>
  <text x="284" y="230" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">先各取 2 张排成 abab，其余卡片随便接在后面，</text>
  <text x="284" y="250" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">前三个双字母组是 ab, ba, ab，ab 出现 2 次</text>
  <rect x="596" y="218" width="72" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="632" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 情况 3 -->
  <rect x="36" y="298" width="648" height="106" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">情况 ③ 其余全部：最大张数 ≤ 2，且张数 ≥ 2 的字母至多一个</text>
  <rect x="58" y="332" width="42" height="44" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="79" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">a</text>
  <rect x="104" y="332" width="42" height="44" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">a</text>
  <rect x="150" y="332" width="42" height="44" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">b</text>
  <rect x="196" y="332" width="42" height="44" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="360" text-anchor="middle" font-size="19" font-weight="bold" fill="#a14340" filter="url(#rough2)">c</text>
  <text x="284" y="348" font-size="12.5" fill="#a14340" filter="url(#rough2)">ab 想出现两次，就至少要两个 a 和两个 b；</text>
  <text x="284" y="368" font-size="12.5" fill="#a14340" filter="url(#rough2)">aa 想出现两次，就至少要三个 a —— 都凑不齐</text>
  <rect x="596" y="336" width="72" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="632" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">NO</text>

  <!-- 结论 -->
  <rect x="36" y="420" width="648" height="50" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="442" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">判定式：max c ≥ 3 或 #{ i : c_i ≥ 2 } ≥ 2 ⇒ YES，否则 NO</text>
  <text x="360" y="461" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">两个条件覆盖了情况 ①②，其余（情况 ③）必然无解 —— 这就是完整的充要条件</text>
</svg>
