<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：逐 token 翻译与连接</text>

  <!-- 示例 1 -->
  <text x="40" y="56" font-size="13" fill="#333" filter="url(#rough2)">示例 1：command = "G()(al)"</text>

  <rect x="40" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="88" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>
  <rect x="136" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">)</text>
  <rect x="184" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>
  <rect x="232" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="280" y="68" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">l</text>

  <!-- token 分组括线 -->
  <path d="M40,106 L40,112 L84,112 L84,106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M88,106 L88,112 L180,112 L180,106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M184,106 L184,112 L324,112 L324,106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="62" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">token "G"</text>
  <text x="134" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">token "()"</text>
  <text x="254" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">token "(al)"</text>

  <path d="M62,134 L62,152" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M134,134 L134,152" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M254,134 L254,152" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="156" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="112" y="156" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="210" y="156" width="88" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">al</text>

  <text x="40" y="212" font-size="11" fill="#666" filter="url(#rough2)">i 前进：0 → 1 → 3 → 7（步进 +1、+2、+4），一遍扫完</text>

  <rect x="40" y="224" width="258" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="169" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">连接 → "Goal"</text>

  <!-- 示例 3 -->
  <text x="40" y="284" font-size="13" fill="#333" filter="url(#rough2)">示例 3：command = "(al)G(al)()()G"</text>

  <circle cx="84" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="84" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">1</text>
  <circle cx="158" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="158" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">2</text>
  <circle cx="232" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="232" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">3</text>
  <circle cx="318" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="318" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">4</text>
  <circle cx="394" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="394" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">5</text>
  <circle cx="458" cy="300" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="458" y="304" text-anchor="middle" font-size="9" fill="#fff" filter="url(#rough2)">6</text>

  <rect x="40" y="312" width="88" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(al)</text>
  <rect x="136" y="312" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="188" y="312" width="88" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(al)</text>
  <rect x="284" y="312" width="68" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">()</text>
  <rect x="360" y="312" width="68" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">()</text>
  <rect x="436" y="312" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>

  <path d="M84,350 L84,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M158,350 L158,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M232,350 L232,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M318,350 L318,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M394,350 L394,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M458,350 L458,366" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="54" y="370" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">al</text>
  <rect x="138" y="370" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="202" y="370" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">al</text>
  <rect x="301" y="370" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="377" y="370" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="438" y="370" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="391" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>

  <rect x="40" y="412" width="440" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">连接 → "alGalooG"</text>

  <text x="40" y="466" font-size="11" fill="#666" filter="url(#rough2)">i 前进：0 → 4 → 5 → 9 → 11 → 13，步进 +4、+1、+4、+2、+2、+1</text>
</svg>
