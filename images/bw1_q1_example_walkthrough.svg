<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：三组官方示例的 f 值与二分落点</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">橙虚线 = { f ≥ 0 } 后缀的左端点 i*，随后做一次最终判等</text>

  <!-- 例 1 -->
  <rect x="20" y="58" width="524" height="112" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="34" y="80" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：arr = [−10,−5,0,3,7] → 输出 3</text>

  <g filter="url(#rough2)">
    <rect x="36" y="90" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="84" y="90" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="132" y="90" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="180" y="90" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="228" y="90" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="58" y="110" fill="#333">−10</text>
    <text x="106" y="110" fill="#333">−5</text>
    <text x="154" y="110" fill="#333">0</text>
    <text x="202" y="110" fill="#333">3</text>
    <text x="250" y="110" fill="#333">7</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="128" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="84" y="128" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="132" y="128" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="180" y="128" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="128" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="58" y="147" fill="#b85450">−10</text>
    <text x="106" y="147" fill="#b85450">−6</text>
    <text x="154" y="147" fill="#b85450">−2</text>
    <text x="202" y="147" fill="#4a7a3a">0</text>
    <text x="250" y="147" fill="#446688">4</text>
  </g>
  <path d="M 178 88 L 178 160" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="300" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">i* = 3：arr[3] = 3 ✓</text>
  <text x="300" y="130" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小不动点 → 返回 3</text>
  <text x="300" y="148" font-size="10" fill="#999" filter="url(#rough2)">f = [−10,−6,−2,0,4]，单调不减</text>

  <!-- 例 2 -->
  <rect x="20" y="166" width="524" height="120" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="36" y="188" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">例 2：arr = [0,2,5,8,17] → 输出 0</text>

  <g filter="url(#rough2)">
    <rect x="36" y="200" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="84" y="200" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="132" y="200" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="180" y="200" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="228" y="200" width="44" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="58" y="220">0</text>
    <text x="106" y="220">2</text>
    <text x="154" y="220">5</text>
    <text x="202" y="220">8</text>
    <text x="250" y="220">17</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="238" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="84" y="238" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="132" y="238" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="180" y="238" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="228" y="238" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="58" y="257" fill="#4a7a3a">0</text>
    <text x="106" y="257" fill="#446688">1</text>
    <text x="154" y="257" fill="#446688">3</text>
    <text x="202" y="257" fill="#446688">5</text>
    <text x="250" y="257" fill="#446688">13</text>
  </g>
  <path d="M 30 197 L 30 270" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="300" y="216" font-size="10.5" fill="#555" filter="url(#rough2)">i* = 0：后缀从下标 0 就开始</text>
  <text x="300" y="234" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">arr[0] = 0 ✓ → 返回 0</text>
  <text x="300" y="252" font-size="10" fill="#999" filter="url(#rough2)">f 全非负，首个元素即不动点</text>

  <!-- 例 3 -->
  <rect x="20" y="282" width="524" height="128" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="36" y="304" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">例 3：arr = [−10,−5,3,4,7,9] → 输出 −1</text>

  <g filter="url(#rough2)">
    <rect x="36" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="78" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="120" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="162" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="204" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="246" y="316" width="38" height="30" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="55" y="336">−10</text>
    <text x="97" y="336">−5</text>
    <text x="139" y="336">3</text>
    <text x="181" y="336">4</text>
    <text x="223" y="336">7</text>
    <text x="265" y="336">9</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="36" y="354" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="78" y="354" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="120" y="354" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="162" y="354" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="204" y="354" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="246" y="354" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="55" y="373" fill="#b85450">−10</text>
    <text x="97" y="373" fill="#b85450">−6</text>
    <text x="139" y="373" fill="#446688">1</text>
    <text x="181" y="373" fill="#446688">1</text>
    <text x="223" y="373" fill="#446688">3</text>
    <text x="265" y="373" fill="#446688">4</text>
  </g>
  <path d="M 118 312 L 118 386" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="306" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">i* = 2：arr[2] = 3 ≠ 2 ✗</text>
  <text x="306" y="348" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">f(2) = 1 &gt; 0 ⇒ 之后 f 只增不减</text>
  <text x="306" y="366" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">全数组无不动点 → 返回 −1</text>
  <text x="306" y="384" font-size="10" fill="#999" filter="url(#rough2)">f = [−10,−6,1,1,3,4]</text>

  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#999">颜色：红 f&lt;0 排除，绿 f=0 命中，蓝 f&gt;0 已过端点</text>
</svg>
