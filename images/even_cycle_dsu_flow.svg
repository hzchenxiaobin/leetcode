<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- 起点 -->
  <rect x="190" y="16" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="38" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">取出边 (u, v, w)</text>
  <path d="M 280 50 L 280 72" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="74" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">find(u)、find(v) → 得 du、dv</text>
  <path d="M 280 108 L 280 130" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定一：是否同分量 -->
  <polygon points="280,130 388,180 280,230 172,180" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ru == rv ?</text>

  <!-- 否：不同分量 -->
  <path d="M 172 180 L 100 180 L 100 248" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">否</text>
  <text x="136" y="198" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（不同分量）</text>

  <rect x="18" y="250" width="164" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">新边是桥，不成环</text>
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 无条件加入</text>
  <text x="100" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">合并：par[rv] =</text>
  <text x="100" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">du ⊕ dv ⊕ w</text>

  <!-- 是：同分量 -->
  <path d="M 388 180 L 452 180 L 452 224" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是</text>
  <text x="420" y="198" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（同分量）</text>

  <!-- 判定二：奇偶是否一致 -->
  <polygon points="452,224 552,270 452,316 352,270" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="452" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">du ⊕ dv == w ?</text>

  <path d="M 452 316 L 452 348" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="465" y="338" font-size="12" fill="#333" filter="url(#rough2)">是</text>
  <rect x="378" y="350" width="148" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="372" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">加入（冗余边）</text>
  <text x="452" y="390" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">结构不变，仅计数</text>

  <path d="M 352 270 L 300 270 L 300 348" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="262" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">否</text>
  <rect x="222" y="350" width="156" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">会产生奇环</text>
  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ 拒绝该边</text>

  <!-- 不变量说明 -->
  <rect x="18" y="350" width="164" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="368" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">不变量：</text>
  <text x="100" y="384" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d[x] = x 到根的路径奇偶</text>
  <text x="100" y="400" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">δ(u,v) = d[u] ⊕ d[v]</text>
</svg>
