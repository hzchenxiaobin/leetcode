<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：各位独立，乘法原理一步计数</text>
  <path d="M 230 42 Q 450 52 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1：约束逐位局部化 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="780" height="242" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="82" font-size="13.5" font-weight="bold" fill="#33517a">第一步：约束逐位局部化——第 i 位能放什么，只看 i 的奇偶性（以 n = 8 演示）</text>

  <!-- 位置框：偶位蓝、奇位绿 -->
  <g filter="url(#sk)">
    <rect x="96"  y="98" width="58" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="184" y="98" width="58" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="272" y="98" width="58" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="360" y="98" width="58" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="448" y="98" width="58" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="536" y="98" width="58" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="624" y="98" width="58" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="712" y="98" width="58" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="125" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a">0</text>
  <text x="213" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="301" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a">2</text>
  <text x="389" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="477" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a">4</text>
  <text x="565" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="653" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a">6</text>
  <text x="741" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">7</text>
  <text x="450" y="166" text-anchor="middle" font-size="11" fill="#555">下标 i（从 0 开始）：蓝色 = 偶数下标，绿色 = 奇数下标</text>

  <!-- 箭头：位置组 → 允许集合 -->
  <g filter="url(#sk)">
    <path d="M 200 172 Q 200 190 250 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 172 Q 400 190 350 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 560 172 Q 560 190 500 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 720 172 Q 720 190 600 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="120" y="204" width="340" height="72" rx="8" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="290" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">偶数下标 → 允许 {0, 2, 4, 6, 8}</text>
  <text x="290" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">5 种选择</text>

  <g filter="url(#sk)">
    <rect x="500" y="204" width="300" height="72" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="650" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">奇数下标 → 允许 {2, 3, 5, 7}</text>
  <text x="650" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">4 种选择</text>

  <path d="M 450 300 L 450 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 2：乘法原理 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="322" width="780" height="196" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="346" font-size="13.5" font-weight="bold" fill="#8a6a1e">第二步：选择互不干扰 ⇒ 乘法原理，总数 = 各位可选数之积</text>

  <text x="100" y="378" font-size="12" fill="#444">偶位数 e = ⌈n/2⌉ = (n+1)/2（下标 0, 2, 4, …，总不少于奇位）</text>
  <text x="100" y="400" font-size="12" fill="#444">奇位数 o = ⌊n/2⌋ = n/2（下标 1, 3, 5, …）——整数除法自动覆盖 n 的奇偶两种情形</text>

  <g filter="url(#sk)">
    <rect x="180" y="416" width="540" height="44" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="450" y="445" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6a1e">ans = 5^e × 4^o  (mod 10^9 + 7)</text>

  <text x="100" y="490" font-size="12" fill="#5a4a2a">配对视角：相邻（偶位, 奇位）配成一对，每对 5 × 4 = 20 种 ⇒ ans = 5^(n mod 2) × 20^(n/2)，只需一次快速幂</text>

  <!-- ===== 底部注记 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="540" width="780" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="566" font-size="12" font-weight="bold" fill="#2e5e2e">为什么不用 DP？</text>
  <text x="80" y="588" font-size="11.5" fill="#444">只有当某位的可选集依赖前一位的选择（如「相邻两位数字不同」）时才需要 DP。本题各位零耦合，乘法原理一步封顶；</text>
  <text x="80" y="606" font-size="11.5" fill="#444">真正的难点不在公式，而在 n ≤ 10^15 的规模——O(n) 累乘都要 10^15 次，必须靠快速幂压到 O(log n)。</text>
</svg>
