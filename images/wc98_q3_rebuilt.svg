<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">示例 1 重建出的树（前序 1,2,4,5,3,6,7；后序 4,5,2,6,7,3,1）</text>
  <line x1="300" y1="100" x2="170" y2="152" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="100" x2="430" y2="152" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="170" y1="200" x2="100" y2="252" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="170" y1="200" x2="240" y2="252" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="430" y1="200" x2="360" y2="252" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="430" y1="200" x2="500" y2="252" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="76" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="170" cy="176" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="182" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="430" cy="176" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="182" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="100" cy="276" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="282" text-anchor="middle" font-size="15" fill="#33562a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="240" cy="276" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="282" text-anchor="middle" font-size="15" fill="#33562a" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="360" cy="276" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="282" text-anchor="middle" font-size="15" fill="#33562a" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="500" cy="276" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="282" text-anchor="middle" font-size="15" fill="#33562a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="80" y="340" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">左子树 3 个节点（4,5,2），右子树 3 个节点（6,7,3）</text>
  <text x="80" y="366" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">前序 = 根 → 左 → 右；后序 = 左 → 右 → 根</text>
</svg>
