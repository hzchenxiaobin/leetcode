<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">四向射线模型：警卫投射视线，遇墙/警卫即停</text>

  <!-- 网格 5x5，警卫在 (1,1)，墙 (1,3),(3,1) -->
  <g filter="url(#rough2)">
    <!-- 行 0 -->
    <rect x="130" y="52" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="52" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="230" y="52" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="52" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="52" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <!-- 行 1 -->
    <rect x="130" y="96" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="96" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="230" y="96" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="96" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="330" y="96" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <!-- 行 2 -->
    <rect x="130" y="140" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="140" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="230" y="140" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="140" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="330" y="140" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <!-- 行 3 -->
    <rect x="130" y="184" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="180" y="184" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="230" y="184" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="184" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="330" y="184" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <!-- 行 4 -->
    <rect x="130" y="228" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="180" y="228" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="230" y="228" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="228" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="330" y="228" width="46" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="203" y="121" text-anchor="middle" font-size="17" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">G</text>
  <text x="303" y="121" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">墙</text>
  <text x="153" y="209" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">墙</text>

  <!-- 射线箭头 -->
  <g filter="url(#rough2)">
    <path d="M 203 90 L 203 58" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none"/>
    <path d="M 203 166 L 203 232" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none"/>
    <path d="M 226 116 L 276 116" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none"/>
    <path d="M 178 116 L 136 116" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)" fill="none"/>
  </g>
  <text x="216" y="84" font-size="11" fill="#8a3a36" filter="url(#rough2)">北</text>
  <text x="212" y="196" font-size="11" fill="#8a3a36" filter="url(#rough2)">南</text>
  <text x="244" y="108" font-size="11" fill="#8a3a36" filter="url(#rough2)">东</text>
  <text x="148" y="108" font-size="11" fill="#8a3a36" filter="url(#rough2)">西</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="408" y="60" width="22" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="408" y="88" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="408" y="116" width="22" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="408" y="144" width="22" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="438" y="73">警卫（遮挡物）</text>
    <text x="438" y="101">墙（遮挡物）</text>
    <text x="438" y="129">被保卫（值 2）</text>
    <text x="438" y="157">未保卫空格（值 0）</text>
  </g>

  <!-- 规则框 -->
  <rect x="60" y="290" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">东射线停在墙前（值 1 截断）；南射线穿过 (2,1) 一路到 (4,1)</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">重复标记幂等：两个同线警卫重复扫同一段也无妨，总工作量 O(4mn)</text>

  <!-- 结论 -->
  <rect x="150" y="348" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">墙与警卫统一编码 = 遮挡格 → 判定只剩一条</text>
</svg>
