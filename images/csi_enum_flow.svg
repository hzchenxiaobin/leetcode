<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">枚举判定流程</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="62" rx="90" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">x 从 low 到 high</text>

  <path d="M 260 86 L 260 108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转字符串 -->
  <rect x="180" y="112" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333">s = str(x)，n = len(s)</text>

  <path d="M 260 146 L 260 168" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判奇偶 -->
  <polygon points="260,172 360,204 260,236 160,204" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#333">n 是奇数？</text>
  <text x="260" y="216" text-anchor="middle" font-size="10" fill="#888">(1 位 / 3 位 / 5 位)</text>

  <!-- 是 → 跳过 -->
  <path d="M 360 204 L 420 204" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="372" y="196" font-size="11" fill="#b85450">是</text>
  <rect x="424" y="188" width="76" height="32" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="462" y="208" text-anchor="middle" font-size="11" fill="#b85450">跳过 x</text>

  <!-- 否 → 求和 -->
  <path d="M 260 236 L 260 258" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="270" y="252" font-size="11" fill="#4a7a3a">否</text>

  <rect x="160" y="262" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#333">left / right = 前后半数字和</text>

  <path d="M 260 296 L 260 318" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判相等 -->
  <polygon points="260,322 350,354 260,386 170,354" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#333">left == right？</text>

  <path d="M 350 354 L 404 354" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="362" y="346" font-size="11" fill="#4a7a3a">是</text>
  <rect x="408" y="338" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="454" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <path d="M 170 354 L 120 354 L 120 62 L 168 62" stroke="#666" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="126" y="120" font-size="10" fill="#888" transform="rotate(-90 126 120)">下一个 x</text>
</svg>
