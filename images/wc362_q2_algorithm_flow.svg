<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">判定流程：两次绝对值 + 两个分支</text>

  <rect x="185" y="40" width="190" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dx = |sx − fx|,  dy = |sy − fy|</text>

  <path d="M 280 74 L 280 90" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="280,92 400,126 280,160 160,126" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="131" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">dx = dy = 0 ？</text>

  <path d="M 160 126 L 86 126 L 86 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="118" y="118" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 400 126 L 480 126 L 480 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="440" y="118" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="16" y="196" width="140" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="86" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 t ≠ 1</text>
  <text x="86" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">t=0 ✓   t=1 ✗   t≥2 ✓</text>

  <rect x="410" y="196" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d = max(dx, dy)</text>

  <path d="M 480 232 L 480 244" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="480,246 542,280 480,314 418,280" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="285" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">t ≥ d ？</text>

  <path d="M 480 314 L 480 330" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="494" y="330" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="442" y="334" width="76" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <path d="M 418 280 L 386 280" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="402" y="272" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="306" y="266" width="78" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <rect x="125" y="306" width="230" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全程 O(1)：绝对值 + max + 比较</text>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">坐标、t 均达 1e9 ⇒ 搜索出局</text>
</svg>
