<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">“好元素”只和左右距离 k 的两个邻居比较</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1, 3, 2, 1, 5, 4]，k = 2（缺邻居时自动视为满足）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <rect x="132" y="70" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
    <rect x="204" y="70" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <rect x="276" y="70" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
    <rect x="348" y="70" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
    <rect x="420" y="70" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold">
    <text x="92" y="100" fill="#446688" filter="url(#rough2)">1</text>
    <text x="164" y="100" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <text x="236" y="100" fill="#446688" filter="url(#rough2)">2</text>
    <text x="308" y="100" fill="#446688" filter="url(#rough2)">1</text>
    <text x="380" y="100" fill="#4a7a3a" filter="url(#rough2)">5</text>
    <text x="452" y="100" fill="#4a7a3a" filter="url(#rough2)">4</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="92" y="132" filter="url(#rough2)">i=0</text>
    <text x="164" y="132" filter="url(#rough2)">i=1</text>
    <text x="236" y="132" filter="url(#rough2)">i=2</text>
    <text x="308" y="132" filter="url(#rough2)">i=3</text>
    <text x="380" y="132" filter="url(#rough2)">i=4</text>
    <text x="452" y="132" filter="url(#rough2)">i=5</text>
  </g>

  <path d="M 164 142 C 130 168 116 168 96 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="120" y="176" font-size="9.5" fill="#999" filter="url(#rough2)">i−k = −1 不存在</text>
  <path d="M 164 142 C 210 172 260 172 300 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="236" y="190" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i+k = 3：1 &lt; 3 ✓</text>

  <path d="M 380 142 C 340 172 300 172 270 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="318" y="212" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i−k = 2：2 &lt; 5 ✓</text>
  <path d="M 380 142 C 424 172 470 172 496 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="470" y="236" font-size="9.5" fill="#999" filter="url(#rough2)">i+k = 6 不存在</text>

  <path d="M 452 142 C 412 176 360 180 330 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="404" y="264" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i−k = 3：1 &lt; 4 ✓</text>

  <rect x="60" y="284" width="210" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="304" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判据（注意“严格大于”）</text>
  <text x="74" y="322" font-size="10" fill="#555" filter="url(#rough2)">nums[i] &gt; nums[i−k]（若存在）且</text>
  <text x="74" y="334" font-size="10" fill="#555" filter="url(#rough2)">nums[i] &gt; nums[i+k]（若存在）</text>

  <rect x="300" y="284" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="314" y="304" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">本示例的好元素</text>
  <text x="314" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">3（i=1）、5（i=4）、4（i=5）</text>
  <text x="314" y="334" font-size="10" fill="#3a5a30" filter="url(#rough2)">和 = 3 + 5 + 4 = 12</text>

  <text x="300" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两个邻居都不存在时（k > i 且 i + k ≥ n），该元素无条件算“好”</text>
</svg>
