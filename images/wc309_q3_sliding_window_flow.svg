<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 512" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="512" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：滑动窗口 + OR 累积器 + XOR 撤销</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="170" y="44" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">left = 0，mask = 0，ans = 1</text>
  </g>

  <path d="M 280 86 L 280 110" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- diamond 1 -->
  <g filter="url(#rough2)">
    <polygon points="280,114 380,156 280,198 180,156" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="161" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">right &lt; n ?</text>
  </g>

  <!-- no branch (left) -->
  <path d="M 180 156 L 138 156" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="159" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#rough2)">
    <rect x="24" y="134" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="79" y="154" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 ans</text>
    <text x="79" y="170" text-anchor="middle" font-size="10" fill="#888">最长优雅长度</text>
  </g>

  <!-- yes branch -->
  <path d="M 280 198 L 280 222" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="292" y="216" font-size="12" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- x = nums[right] -->
  <g filter="url(#rough2)">
    <rect x="170" y="226" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="249" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">x = nums[right]</text>
  </g>

  <path d="M 280 262 L 280 284" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- diamond 2 -->
  <g filter="url(#rough2)">
    <polygon points="280,288 392,328 280,368 168,328" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="333" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">mask &amp; x ≠ 0 ?</text>
  </g>

  <!-- conflict branch (left) -->
  <path d="M 168 328 L 118 328" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="143" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是（冲突）</text>
  <g filter="url(#rough2)">
    <rect x="20" y="300" width="96" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="68" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">mask ^=</text>
    <text x="68" y="340" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">nums[left++]</text>
    <text x="68" y="362" text-anchor="middle" font-size="10.5" fill="#888">（XOR 撤销）</text>
  </g>
  <!-- loop back into diamond 2 -->
  <path d="M 68 300 L 68 268 L 224 268 L 224 303" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="140" y="262" font-size="10" fill="#b85450">重新检查冲突</text>

  <!-- no-conflict branch (down) -->
  <path d="M 280 368 L 280 390" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="292" y="384" font-size="11" fill="#4a7a3a" font-weight="bold">否（无冲突）</text>

  <!-- include -->
  <g filter="url(#rough2)">
    <rect x="150" y="394" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="415" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">mask |= x（纳入窗口）</text>
    <text x="280" y="436" text-anchor="middle" font-size="12" fill="#555">ans = max(ans, right − left + 1)</text>
  </g>

  <path d="M 280 444 L 280 464" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- right++ -->
  <g filter="url(#rough2)">
    <rect x="210" y="468" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="489" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">right++</text>
  </g>

  <!-- main loop back -->
  <path d="M 350 484 L 540 484 L 540 156 L 386 156" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- callout A: why XOR undoes OR -->
  <g filter="url(#rough2)">
    <rect x="14" y="196" width="126" height="64" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="77" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为何 XOR 能撤销 OR？</text>
    <text x="77" y="231" text-anchor="middle" font-size="10.5" fill="#666">窗口内比特独占</text>
    <text x="77" y="245" text-anchor="middle" font-size="10.5" fill="#666">→ 位集合两两不交</text>
    <text x="77" y="259" text-anchor="middle" font-size="10.5" fill="#666">→ 并 = 异或，⊕ 精确清位</text>
  </g>

  <!-- callout B: complexity -->
  <g filter="url(#rough2)">
    <rect x="424" y="394" width="108" height="70" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="8"/>
    <text x="478" y="414" text-anchor="middle" font-size="10.5" fill="#666">left、right 均</text>
    <text x="478" y="429" text-anchor="middle" font-size="10.5" fill="#666">单调不减</text>
    <text x="478" y="444" text-anchor="middle" font-size="10.5" fill="#666">总移动 ≤ 2n</text>
    <text x="478" y="458" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">时间 O(n)</text>
  </g>
</svg>
