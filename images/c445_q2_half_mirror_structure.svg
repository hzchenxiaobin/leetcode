<svg xmlns="http://www.w3.org/2000/svg" width="660" height="460" viewBox="0 0 660 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="460" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：半串决定一切</text>
  <path d="M 210 40 Q 330 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="54" width="480" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">任何回文排列 = 半串 h ＋ 中心 m ＋ rev(h)</text>

  <g filter="url(#sk)">
    <rect x="203" y="122" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="255" y="122" width="46" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="307" y="122" width="46" height="46" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="359" y="122" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="411" y="122" width="46" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="20" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="226" y="152" fill="#2b6e9e">a</text>
    <text x="278" y="152" fill="#2b6e9e">b</text>
    <text x="330" y="152" fill="#7a5415">b</text>
    <text x="382" y="152" fill="#2e6e2e">b</text>
    <text x="434" y="152" fill="#2e6e2e">a</text>
  </g>

  <g fill="none" filter="url(#sk)">
    <rect x="197" y="114" width="112" height="62" rx="10" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="6 4"/>
    <rect x="301" y="114" width="58" height="62" rx="10" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="353" y="114" width="112" height="62" rx="10" stroke="#4a8e4a" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>

  <g text-anchor="middle" font-size="12" font-weight="bold" filter="url(#sk)">
    <text x="252" y="196" fill="#2b6e9e">半串 h = "ab"</text>
    <text x="330" y="196" fill="#7a5415">中心 m = "b"</text>
    <text x="409" y="196" fill="#2e6e2e">rev(h) = "ba"</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">
    <text x="252" y="213">自由度全在这</text>
    <text x="330" y="213">奇计数 ⇒ 唯一</text>
    <text x="409" y="213">镜像锁死</text>
  </g>

  <path d="M 252 232 Q 330 266 408 232" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="243" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">前后互为镜像</text>

  <g filter="url(#sk)">
    <rect x="30" y="268" width="290" height="76" rx="10" fill="#f7f9f2" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="175" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">半串多重集固定</text>
  <text x="175" y="313" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">每种字符恰 cnt[c] ÷ 2 个</text>
  <text x="175" y="333" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">没有任何选择余地</text>

  <g filter="url(#sk)">
    <rect x="340" y="268" width="290" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="485" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">固定多重集的最小排列 = 升序</text>
  <text x="485" y="313" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">逆序对一交换立刻变小（交换论证）</text>
  <text x="485" y="333" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">a→z 桶序输出天然升序</text>

  <g filter="url(#sk)">
    <rect x="40" y="368" width="580" height="64" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">比较整串 ⇔ 比较半串：两个不同回文排列的第一个差异必落在前半</text>
  <text x="330" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">半串升序 ⇒ 整串字典序最小（以 s = "babab" → "abbba" 为例）</text>
</svg>
