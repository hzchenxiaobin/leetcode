<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：nums = [10,4,−8,7]，total = 13</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="70" y="52" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="52" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="52" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="278" y="52" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="374" y="52" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95" y="72">i</text>
    <text x="161" y="72">pre</text>
    <text x="237" y="72">右和</text>
    <text x="323" y="72">2×pre</text>
    <text x="429" y="72">≥ 13？</text>
  </g>

  <!-- 行 0 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="90" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="90" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="90" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="90" width="90" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="374" y="90" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="112">0</text><text x="161" y="112">10</text><text x="237" y="112">3</text>
    <text x="323" y="112">20</text><text x="429" y="112" fill="#2d5a22" font-weight="bold">✓ 计 +1</text>
  </g>
  <!-- 行 1 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="130" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="130" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="130" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="130" width="90" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="374" y="130" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="95" y="152">1</text><text x="161" y="152">14</text><text x="237" y="152">−1</text>
    <text x="323" y="152">28</text><text x="429" y="152" fill="#2d5a22" font-weight="bold">✓ 计 +1</text>
  </g>
  <!-- 行 2 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="170" width="50" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="126" y="170" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="202" y="170" width="70" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="278" y="170" width="90" height="34" fill="#fff" stroke="#ccc" rx="4"/>
    <rect x="374" y="170" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="95" y="192">2</text><text x="161" y="192">6</text><text x="237" y="192">7</text>
    <text x="323" y="192">12</text><text x="429" y="192" fill="#8a3a36">✗</text>
  </g>
  <!-- 行 3 排除 -->
  <g filter="url(#rough2)" font-size="13" fill="#999" text-anchor="middle">
    <rect x="70" y="210" width="50" height="34" fill="#f5f5f5" stroke="#ddd" rx="4"/>
    <rect x="126" y="210" width="70" height="34" fill="#f5f5f5" stroke="#ddd" rx="4"/>
    <rect x="202" y="210" width="70" height="34" fill="#f5f5f5" stroke="#ddd" rx="4"/>
    <rect x="278" y="210" width="90" height="34" fill="#f5f5f5" stroke="#ddd" rx="4"/>
    <rect x="374" y="210" width="110" height="34" fill="#f5f5f5" stroke="#ddd" rx="4"/>
    <text x="95" y="232">3</text><text x="161" y="232">13</text><text x="237" y="232">0（空）</text>
    <text x="323" y="232">26</text><text x="429" y="232">排除（右侧为空）</text>
  </g>

  <!-- 结论 -->
  <rect x="140" y="266" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">ans = 2 ✓（与官方输出一致）</text>

  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">若误把 i = 3 算入：26 ≥ 13 多计一次 → ans = 3 ✗（典型 WA）</text>
</svg>
