<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="368" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：链 0—1—2，initial = [0,1]</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">graph = [[1,1,0],[1,1,1],[0,1,1]]：0—1—2 连成一条链</text>
  <rect x="80" y="84" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="109.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <path d="M 150 104 L 208 104" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="84" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="109.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <path d="M 280 104 L 338 104" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="84" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375.0" y="109.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="60" y="168" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">删 0：剩源 {1} → 感染 {1,2}，cnt = 2</text>
  <text x="60" y="198" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">删 1：剩源 {0} → 感染 {0}（1 被删，0—1、1—2 的边都没了），cnt = 1</text>
  <rect x="60" y="218" width="540" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="245.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删 1 更优：cnt 1 &lt; 2 → 返回 1（与官方示例 2 输出一致）</text>
  <text x="60" y="300" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">对比 I 版同一张图：删 0 或 1 都只是取消初始感染，链仍整条连通 → 两个都救不下</text>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">「删点」会让图断开，这正是 II 版不能用块计数解决的根源</text>
</svg>
