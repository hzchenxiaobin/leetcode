<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">两步构造：整串失配，但极值在中间 —— card → acdr</text>

  <rect x="474" y="36" width="142" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545" y="52" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标 t = acdr</text>

  <!-- 行1：card 整串失配 -->
  <text x="66" y="106" font-size="11.5" fill="#666" filter="url(#rough2)">s</text>
  <rect x="96" y="76" width="56" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="124" y="105" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="158" y="76" width="56" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="186" y="105" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="220" y="76" width="56" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="248" y="105" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">r</text>
  <rect x="282" y="76" width="56" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="310" y="105" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="352" y="104" font-size="11" fill="#b85450" filter="url(#rough2)">整串失配</text>

  <path d="M215,128 L215,164" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="128" width="244" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="148" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">① 排 [0,1]：ca→ac，最小值 a 顶到首位</text>

  <!-- 行2：acrd 真子串失配 -->
  <text x="56" y="200" font-size="11.5" fill="#666" filter="url(#rough2)">一步后</text>
  <rect x="96" y="170" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="199" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="158" y="170" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="199" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="220" y="170" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="248" y="199" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">r</text>
  <rect x="282" y="170" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="310" y="199" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="352" y="198" font-size="11" fill="#d6a040" filter="url(#rough2)">真子串失配</text>

  <path d="M160,224 L160,264" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M220,224 L220,232 L338,232 L338,224" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="279" y="248" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">失配区间 [2,3]</text>
  <rect x="380" y="226" width="244" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="246" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 排 [2,3]：rd→dr，失配区间收尾</text>

  <!-- 行3：acdr 完成 -->
  <text x="56" y="296" font-size="11.5" fill="#666" filter="url(#rough2)">两步后</text>
  <rect x="96" y="270" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="299" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="158" y="270" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="299" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="220" y="270" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="299" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="282" y="270" width="56" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="299" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="352" y="298" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ = t</text>

  <rect x="24" y="344" width="592" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="361" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键：全局最小值出现在中间 [1, n−2] ⇒ 排一个包含它的前缀，即可救回左端点</text>
  <text x="320" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对称地：最大值在中间 ⇒ 排一个包含它的后缀救回右端点；两者其一成立，答案就是 2</text>
</svg>
