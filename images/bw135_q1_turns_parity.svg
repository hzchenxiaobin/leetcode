<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">轮数奇偶决定胜负</text>

  <!-- 奇数轮 -->
  <g filter="url(#rough2)">
    <text x="26" y="82" font-size="13" fill="#333">T = 3（奇数）</text>
    <circle cx="158" cy="76" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="158" y="81" text-anchor="middle" font-size="13" fill="#446688">A</text>
    <circle cx="242" cy="76" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="242" y="81" text-anchor="middle" font-size="13" fill="#4a7a3a">B</text>
    <circle cx="326" cy="76" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="326" y="81" text-anchor="middle" font-size="13" fill="#446688">A</text>
    <path d="M 182 76 L 214 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 266 76 L 298 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 350 76 L 382 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="392" y="58" width="146" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="465" y="82" text-anchor="middle" font-size="12" fill="#2d5a22">Bob 无币可取 → Alice 胜</text>
    <text x="158" y="118" text-anchor="middle" font-size="11" fill="#777">第 1 轮</text>
    <text x="242" y="118" text-anchor="middle" font-size="11" fill="#777">第 2 轮</text>
    <text x="326" y="118" text-anchor="middle" font-size="11" fill="#777">第 3 轮</text>
  </g>

  <!-- 偶数轮 -->
  <g filter="url(#rough2)">
    <text x="26" y="182" font-size="13" fill="#333">T = 2（偶数）</text>
    <circle cx="158" cy="176" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="158" y="181" text-anchor="middle" font-size="13" fill="#446688">A</text>
    <circle cx="242" cy="176" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="242" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a">B</text>
    <path d="M 182 176 L 214 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 266 176 L 298 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="308" y="158" width="230" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="423" y="182" text-anchor="middle" font-size="12" fill="#b85450">Alice 无币可取 → Bob 胜</text>
    <text x="158" y="218" text-anchor="middle" font-size="11" fill="#777">第 1 轮</text>
    <text x="242" y="218" text-anchor="middle" font-size="11" fill="#777">第 2 轮</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="26" y="246" width="508" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="42" y="270" fill="#333">T 为奇数：最后一轮由 Alice 执行，随后轮到 Bob 却无币可取 ⇒ Bob 输</text>
    <text x="42" y="292" fill="#333">T 为偶数：最后一轮由 Bob 执行 ⇒ Alice 输（T = 0 时 Alice 直接输）</text>
    <text x="42" y="312" fill="#666">因此只需回答 T = min(x, ⌊y / 4⌋) 的奇偶性，O(1)</text>
  </g>
</svg>
