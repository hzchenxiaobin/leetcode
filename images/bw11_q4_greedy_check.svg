<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：闭区间二分 + 贪心 check</text>

  <g filter="url(#rough2)">
    <rect x="30" y="48" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="130" y="66" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">lo = min(sweetness)（恒可行）</text>
  <text x="130" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">hi = Σ ÷ (K+1)（hi+1 恒不可行）</text>

  <g filter="url(#rough2)">
    <path d="M 130 90 L 130 112" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="150" y="114" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="270" y="136" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">mid = (lo+hi+1) / 2　← 上中位，防死循环</text>

  <g filter="url(#rough2)">
    <path d="M 270 150 L 270 172" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="100" y="174" width="340" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">check：cur 累加，cur ≥ mid 即 cnt++、cur 清零</text>
  <text x="270" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">cnt ≥ K+1 ？（段数下界：贪心落刀越早，留给后面的余量越大）</text>

  <g filter="url(#rough2)">
    <path d="M 190 228 L 130 262" stroke="#3a5a30" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 350 228 L 410 262" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="40" y="264" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="320" y="264" width="180" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="130" y="286" fill="#3a5a30">是：lo = mid</text>
    <text x="410" y="286" fill="#8a3a36">否：hi = mid − 1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 120 282 C 40 300, 40 60, 108 62" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 416 282 C 500 302, 520 40, 394 50" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="252" y="304" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">lo == hi 时收敛，返回 lo；每轮 O(n)，约 30 轮</text>
</svg>
