<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 3 演算：upper = 5，lower = 5，colsum = [2,1,2,0,1,0,1,2,0,1]</text>

  <g filter="url(#rough2)">
    <rect x="24" y="36" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="36" y="55" font-size="10" fill="#8a6a20">cnt2 = 3（第 0/2/7 列），cnt1 = 4 → u = 5 − 3 = 2，l = 5 − 3 = 2，u + l = 4 ✓</text>
  </g>

  <text x="24" y="86" font-size="10" fill="#888">行标签</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="62" y="112" fill="#666">下标 i</text>
    <text x="62" y="140" fill="#666">colsum</text>
    <text x="62" y="168" fill="#3a4a66">第 0 行</text>
    <text x="62" y="196" fill="#3a5a30">第 1 行</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="124" y="112" fill="#888">0</text>
    <text x="168" y="112" fill="#888">1</text>
    <text x="212" y="112" fill="#888">2</text>
    <text x="256" y="112" fill="#888">3</text>
    <text x="300" y="112" fill="#888">4</text>
    <text x="344" y="112" fill="#888">5</text>
    <text x="388" y="112" fill="#888">6</text>
    <text x="432" y="112" fill="#888">7</text>
    <text x="476" y="112" fill="#888">8</text>
    <text x="520" y="112" fill="#888">9</text>
  </g>

  <!-- colsum 行 -->
  <g filter="url(#rough2)">
    <rect x="104" y="120" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="124" y="138" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <rect x="148" y="120" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="168" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <rect x="192" y="120" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="212" y="138" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <rect x="236" y="120" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="256" y="138" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="280" y="120" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="300" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <rect x="324" y="120" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="344" y="138" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="368" y="120" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="388" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <rect x="412" y="120" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="432" y="138" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <rect x="456" y="120" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="476" y="138" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="500" y="120" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="520" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
  </g>

  <!-- 上行 -->
  <g filter="url(#rough2)">
    <rect x="104" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="124" y="166" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="148" y="148" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="168" y="166" text-anchor="middle" font-size="11" fill="#8a3a36">1</text>
    <rect x="192" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="212" y="166" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="236" y="148" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="256" y="166" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="280" y="148" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="300" y="166" text-anchor="middle" font-size="11" fill="#8a3a36">1</text>
    <rect x="324" y="148" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="344" y="166" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="368" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="388" y="166" text-anchor="middle" font-size="11" fill="#8a6a20">0</text>
    <rect x="412" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="432" y="166" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="456" y="148" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="476" y="166" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="500" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="520" y="166" text-anchor="middle" font-size="11" fill="#8a6a20">0</text>
  </g>

  <!-- 下行 -->
  <g filter="url(#rough2)">
    <rect x="104" y="176" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="124" y="194" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="148" y="176" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="168" y="194" text-anchor="middle" font-size="11" fill="#8a6a20">0</text>
    <rect x="192" y="176" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="212" y="194" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="236" y="176" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="256" y="194" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="280" y="176" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="300" y="194" text-anchor="middle" font-size="11" fill="#8a6a20">0</text>
    <rect x="324" y="176" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="344" y="194" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="368" y="176" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="388" y="194" text-anchor="middle" font-size="11" fill="#8a3a36">1</text>
    <rect x="412" y="176" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="432" y="194" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="456" y="176" width="40" height="26" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="476" y="194" text-anchor="middle" font-size="11" fill="#666">0</text>
    <rect x="500" y="176" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="520" y="194" text-anchor="middle" font-size="11" fill="#8a3a36">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="216" width="512" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="38" y="236" font-size="10.5" fill="#3a4a66" font-weight="bold">贪心填写过程（红框 = 自由分配的 1，橙框 = 该列被分到 0 的那一行）</text>
    <text x="38" y="256" font-size="10" fill="#444">第 0/2/7 列 colsum=2 → 两行都写 1；第 3/5/8 列 colsum=0 → 两行都写 0</text>
    <text x="38" y="274" font-size="10" fill="#444">第 1 列 colsum=1 → 上行还有额度（u: 2→1），1 写上行的；第 4 列同理（u: 1→0）</text>
    <text x="38" y="292" font-size="10" fill="#444">第 6 列 colsum=1 → 上行额度已为 0，1 写下行的（l: 2→1）；第 9 列同理（l: 1→0）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="312" width="512" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="38" y="332" font-size="10.5" fill="#3a5a30" font-weight="bold">填写结果</text>
    <text x="38" y="352" font-size="10.5" fill="#444">第 0 行：[1,1,1,0,1,0,0,1,0,0]，和 = 5 ✓</text>
    <text x="38" y="370" font-size="10.5" fill="#444">第 1 行：[1,0,1,0,0,0,1,1,0,1]，和 = 5 ✓　每列和与原 colsum 逐一相等 ✓</text>
  </g>
</svg>
