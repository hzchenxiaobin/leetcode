<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单格转移：正格一条路，强盗格二选一</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">best(k) = max(dp[i−1][j][k], dp[i][j−1][k])；越界记 −∞，起点 (0,0) 视作 best(0) = 0</text>

  <!-- top box -->
  <g filter="url(#rough2)"><rect x="170" y="66" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">best(k) ← 上 / 左（同层取 max）</text>
  <path d="M 280 98 L 280 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)"><polygon points="280,124 375,163 280,202 185,163" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">coins[i][j] &lt; 0 ？</text>

  <!-- no branch: positive cell -->
  <path d="M 184 163 L 172 163" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="177" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)"><rect x="30" y="140" width="138" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="99" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">正格（c ≥ 0）</text>
  <text x="99" y="179" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">dp[i][j][k] = best(k) + c</text>

  <!-- yes branch: robber cell, two options -->
  <path d="M 376 163 L 394 163" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="154" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)"><rect x="398" y="112" width="150" height="132" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/></g>

  <g filter="url(#rough2)"><rect x="406" y="120" width="46" height="19" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="429" y="133" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">挨抢</text>
  <text x="460" y="133" font-size="10" fill="#444" filter="url(#rough2)">best(k) + c</text>
  <text x="429" y="152" font-size="8.5" fill="#888" filter="url(#rough2)">同层挨这一刀（可能更亏）</text>

  <g filter="url(#rough2)"><rect x="406" y="162" width="46" height="19" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
  <text x="429" y="175" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">感化</text>
  <text x="460" y="175" font-size="10" fill="#444" filter="url(#rough2)">best(k−1) + 0</text>
  <text x="429" y="194" font-size="8.5" fill="#888" filter="url(#rough2)">需 k ≥ 1；只有强盗格可用</text>

  <path d="M 412 204 L 534 204" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="473" y="228" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">dp[i][j][k] = max(两者)</text>

  <!-- bottom: answer box -->
  <g filter="url(#rough2)"><rect x="60" y="320" width="270" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="76" y="344" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">答案 = max(dp[m−1][n−1][0], [1], [2])</text>
  <text x="76" y="366" font-size="10" fill="#444" filter="url(#rough2)">感化不必用完：k = 2 层可能不可达或更差</text>
  <text x="76" y="388" font-size="9.5" fill="#666" filter="url(#rough2)">示例 1 终点三层：max(7, 8, 5) = 8</text>

  <!-- bottom: implementation box -->
  <g filter="url(#rough2)"><rect x="350" y="320" width="190" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="366" y="344" font-size="11" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">实现：逐行填表</text>
  <text x="366" y="366" font-size="9.5" fill="#444" filter="url(#rough2)">只依赖上一行 + 本行左侧</text>
  <text x="366" y="388" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">两行滚动，空间 O(3n)</text>
</svg>
