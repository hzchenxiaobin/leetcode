<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇数直径 ⇒ 所有直径共穿同一条「中心边」（h = (D−1)/2）</text>
  <path d="M 92 42 Q 380 49 668 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">两条直径的交 = A 侧公共前缀 + 中心边 + B 侧公共前缀 = a + 1 + b</text>

  <!-- 共享部分（加粗橙色底衬） -->
  <path d="M 262 240 L 330 240 L 430 240 L 498 240" stroke="#d6a040" stroke-width="11"
        fill="none" stroke-linecap="round" opacity="0.55" filter="url(#rough2)"/>

  <!-- A 侧边 -->
  <path d="M 330 240 L 262 240" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 262 240 L 196 178" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 262 240 L 196 302" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <!-- 中心边 -->
  <path d="M 330 240 L 430 240" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>
  <!-- B 侧边 -->
  <path d="M 430 240 L 498 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 498 240 L 564 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 498 240 L 564 302" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 最深端点 -->
  <ellipse cx="196" cy="178" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="196" cy="302" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="564" cy="178" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="564" cy="302" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 内部节点 -->
  <ellipse cx="262" cy="240" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="330" cy="240" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="430" cy="240" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="498" cy="240" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="262" y="245" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">w₁</text>
  <text x="498" y="245" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">w₂</text>
  <text x="330" y="245" text-anchor="middle" font-size="13" fill="#7d2b26" filter="url(#rough2)">u</text>
  <text x="430" y="245" text-anchor="middle" font-size="13" fill="#7d2b26" filter="url(#rough2)">v</text>
  <text x="196" y="183" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x₁</text>
  <text x="196" y="307" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x₂</text>
  <text x="564" y="183" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">y₁</text>
  <text x="564" y="307" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">y₂</text>

  <text x="296" y="228" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="464" y="228" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">b</text>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#7d2b26" filter="url(#rough2)">中心边</text>

  <text x="96" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">A 侧</text>
  <text x="664" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B 侧</text>

  <text x="196" y="148" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">深度 h 的最深点</text>
  <text x="196" y="338" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">深度 h 的最深点</text>
  <text x="564" y="148" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">深度 h 的最深点</text>
  <text x="564" y="338" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">深度 h 的最深点</text>

  <text x="380" y="368" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a、b 分别是两侧 LCA 到 u、v 的距离；橙色加粗段即两条直径的公共部分</text>

  <rect x="150" y="386" width="460" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="412" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">k = a + 1 + b，a ∈ Q_A，b ∈ Q_B，且 1 ≤ k ≤ D</text>
</svg>
