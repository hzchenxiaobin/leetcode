<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：扫一遍卡片，再扫一遍值域</text>

  <!-- 输入 -->
  <rect x="150" y="46" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">读入 fronts、backs，共 n 张卡片</text>

  <path d="M 300 84 L 300 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第一遍 -->
  <rect x="80" y="102" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 1 遍：for i in 0 … n-1</text>
  <text x="300" y="143" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">present[fronts[i]] = present[backs[i]] = true　（标记出现过的数）</text>
  <text x="300" y="159" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 fronts[i] == backs[i]，则 blocked[fronts[i]] = true　（两面同数 → 封锁）</text>

  <path d="M 300 168 L 300 184" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二遍 -->
  <rect x="150" y="186" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">第 2 遍：v 从 1 递增到 2000</text>

  <path d="M 300 224 L 300 238" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="300,240 402,272 300,304 198,272" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="269" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">present[v] 且</text>
  <text x="300" y="284" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">!blocked[v] ?</text>

  <!-- 是 → 返回 v -->
  <path d="M 402 272 L 436 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="438" y="248" width="136" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="506" y="268" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第一个命中的 v</text>
  <text x="506" y="284" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">即最小好数字 → 返回</text>

  <!-- 否 → 继续 -->
  <path d="M 300 304 L 300 322" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="318" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="140" y="324" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="300" y="349" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">v++ 继续；1…2000 全扫完仍无命中 → 返回 0</text>

  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">值域只有 2000：用桶数组代替哈希集合，时间 O(n + V)、空间 O(V)，比排序更省一次 log</text>
</svg>
