<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">数位分割 = 十进制字符串展开</text>

  <!-- 上：整数 10921 -->
  <text x="130" y="72" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">整数 → 字符串</text>
  <rect x="60" y="84" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="113" text-anchor="middle" font-size="20" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">10921</text>

  <path d="M 210 106 C 250 106, 260 106, 300 106" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="96" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">to_string</text>

  <!-- 字符串 "10921" -->
  <g filter="url(#rough2)">
    <rect x="308" y="84" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="342" y="84" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="376" y="84" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="410" y="84" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="444" y="84" width="34" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="325" y="113">1</text><text x="359" y="113">0</text><text x="393" y="113">9</text>
    <text x="427" y="113">2</text><text x="461" y="113">1</text>
  </g>
  <text x="393" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">高位在前，逐字符 c − '0'</text>

  <!-- 下：算术路线 -->
  <text x="130" y="200" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">算术路线（取余）</text>
  <rect x="60" y="212" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="238" text-anchor="middle" font-size="14" fill="#8a3a34" filter="url(#rough2)">x % 10 逐位剥落</text>
  <path d="M 210 234 C 250 234, 260 234, 300 234" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="224" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">低位在前!</text>
  <g filter="url(#rough2)">
    <rect x="308" y="212" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="342" y="212" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="376" y="212" width="34" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="410" y="212" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="444" y="212" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="325" y="241">1</text><text x="359" y="241">2</text><text x="393" y="241">9</text>
    <text x="427" y="241">0</text><text x="461" y="241">1</text>
  </g>
  <path d="M 340 268 C 370 288, 420 288, 450 268" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="306" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">必须 reverse 一次，否则 13 会变成 [3,1]</text>

  <!-- 结论框 -->
  <rect x="70" y="324" width="420" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">两条路线殊途同归：字符串免反转，最不易错</text>
</svg>
