<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">从 √m 往下扫：第一个整除 i 就是最优小因数</text>
  <path d="M 120 40 Q 350 50 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)"><rect x="225" y="44" width="250" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="350" y="66" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk2)">输入 num（1 ≤ num ≤ 10⁹）</text>
  <path d="M 350 78 L 350 98" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box1 -->
  <g filter="url(#sk2)"><rect x="160" y="100" width="380" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="350" y="123" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk2)">对 m = num+1 与 m = num+2 各求一次最优对（long long）</text>
  <path d="M 350 136 L 350 156" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box2 -->
  <g filter="url(#sk2)"><rect x="160" y="158" width="380" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="350" y="181" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk2)">i ← ⌊√m⌋（整数开方：isqrt / 修正浮点误差）</text>
  <path d="M 350 194 L 350 214" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk2)"><polygon points="350,216 480,258 350,300 220,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="350" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">m % i == 0 ？</text>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#a07a30" filter="url(#sk2)">（i 是否整除 m）</text>

  <!-- no branch right -->
  <path d="M 480 258 L 554 258" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="516" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk2)">否</text>
  <g filter="url(#sk2)"><rect x="558" y="240" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="618" y="263" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#sk2)">i ← i − 1</text>
  <path d="M 618 276 L 618 336 L 350 336 L 350 304" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="493" y="329" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk2)">回退一格再试</text>

  <!-- yes branch left -->
  <path d="M 220 258 L 122 258" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk2)">是</text>
  <path d="M 120 258 L 120 379 L 136 379" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box4 -->
  <g filter="url(#sk2)"><rect x="140" y="360" width="420" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="350" y="384" text-anchor="middle" font-size="13" fill="#2e5e22" filter="url(#sk2)">候选对 ( i, m / i )，差 = m / i − i</text>

  <!-- box5 -->
  <g filter="url(#sk2)"><rect x="140" y="420" width="420" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="350" y="444" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#sk2)">两个候选比差 → 保留差更小的一对</text>
  <path d="M 350 398 L 350 418" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- end -->
  <g filter="url(#sk2)"><rect x="250" y="470" width="200" height="34" rx="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="350" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">返回这一对数</text>
  <path d="M 350 458 L 350 468" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="350" y="525" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk2)">循环最多执行 ⌊√m⌋ 次；一旦整除立即跳出，不再往小扫</text>
</svg>
