<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三步走：收集元音 → 按 ASCII 排序 → 原位回填</text>

  <!-- 第一步：收集 -->
  <g filter="url(#rough2)">
    <rect x="36" y="52" width="448" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="76" font-size="13.5" fill="#446688">① 扫一遍 s，把元音挑出来（辅音原位保留）</text>
    <text x="66" y="102" font-size="13" fill="#555">s = l E e t c O d e</text>
    <text x="66" y="124" font-size="12.5" fill="#b85450">收集到：E、O、e（红框位置）</text>
    <rect x="82" y="88" width="20" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="158" y="88" width="20" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="230" y="88" width="20" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>

  <!-- 第二步：排序 -->
  <g filter="url(#rough2)">
    <rect x="36" y="160" width="448" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="184" font-size="13.5" fill="#4a7a3a">② 对收集到的元音按 ASCII 值升序排序</text>
    <rect x="66" y="196" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="86" y="217" text-anchor="middle" font-size="14" fill="#b85450">E</text>
    <text x="96" y="228" font-size="9" fill="#555">69</text>
    <rect x="116" y="196" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="136" y="217" text-anchor="middle" font-size="14" fill="#b85450">O</text>
    <text x="146" y="228" font-size="9" fill="#555">79</text>
    <rect x="166" y="196" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="186" y="217" text-anchor="middle" font-size="14" fill="#b85450">e</text>
    <text x="196" y="228" font-size="9" fill="#555">101</text>
    <text x="240" y="217" font-size="12.5" fill="#4a7a3a">E &lt; O &lt; e（大写 ASCII 全在小写之前）</text>
  </g>

  <!-- 第三步：回填 -->
  <g filter="url(#rough2)">
    <rect x="36" y="268" width="448" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="292" font-size="13.5" fill="#8a6d1f">③ 按从左到右的顺序把排好的元音塞回元音位置</text>
    <text x="66" y="322" font-size="14" fill="#333">t = l</text>
    <text x="102" y="322" font-size="14" fill="#b85450">E</text>
    <text x="122" y="322" font-size="14" fill="#333">O</text>
    <text x="142" y="322" font-size="14" fill="#333">t c</text>
    <text x="182" y="322" font-size="14" fill="#b85450">e</text>
    <text x="202" y="322" font-size="14" fill="#333">d e = “lEOtcede”</text>
  </g>

  <path d="M 258 138 C 260 144, 260 148, 259 158" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M 258 246 C 260 252, 260 256, 259 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
</svg>
