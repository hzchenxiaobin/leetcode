<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [10, 5, 2, 6]，k = 100</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每一行代表右端点 right 推进一格后的「扩张、收缩、结算」三步</text>

  <rect x="30" y="70" width="700" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="30" y="114" width="700" height="52" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="30" y="166" width="700" height="52" fill="#e8f0fe" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="30" y="218" width="700" height="52" fill="#fce4ec" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="30" y="270" width="700" height="52" fill="#e6f4ea" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 92 70 L 92 322 M 192 70 L 192 322 M 360 70 L 360 322 M 492 70 L 492 322 M 558 70 L 558 322 M 642 70 L 642 322" stroke="#b8b8b8" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="61" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="142" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">nums[right]</text>
  <text x="276" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">prod（扩张后）</text>
  <text x="426" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">收缩动作</text>
  <text x="525" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">left</text>
  <text x="600" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">新增</text>
  <text x="686" y="98" text-anchor="middle" font-size="11.5" fill="#5a4410" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="61" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="142" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="276" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="426" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="525" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="600" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="686" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="61" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="276" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 × 5 = 50</text>
  <text x="426" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="525" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="600" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="686" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="61" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="276" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">50 × 2 = 100</text>
  <text x="426" y="248" text-anchor="middle" font-size="11" fill="#8f3830" filter="url(#rough2)">100 ≥ 100，除以 10</text>
  <text x="525" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="600" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="686" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="61" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="142" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="276" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 × 6 = 60</text>
  <text x="426" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <text x="525" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="600" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="686" y="300" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="30" y="338" width="700" height="78" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="362" text-anchor="middle" font-size="12" fill="#2e4f70" filter="url(#rough2)">新增数之和 = 1 + 2 + 2 + 3 = 8；right = 2 这一行是唯一的收缩点（乘积 50 × 2 恰好等于 k）</text>
  <text x="380" y="386" text-anchor="middle" font-size="11.5" fill="#2e4f70" filter="url(#rough2)">r0：[10]　r1：[5]、[10,5]　r2：[2]、[5,2]　r3：[6]、[2,6]、[5,2,6]</text>
  <text x="380" y="406" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">注意 [10,5,2] 乘积为 100，不满足「严格小于」，从未被计数</text>
</svg>
