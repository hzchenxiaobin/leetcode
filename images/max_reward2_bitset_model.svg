<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：dp 数组折进一个整数，一条转移走完一轮</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">以 v = 6、当前 f = {0,…,7} 为例：f |= (f &amp; (2^v − 1)) &lt;&lt; v</text>

  <!-- read-region mask label -->
  <text x="220" y="76" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">读区 [0, v−1] = 掩码 2^v − 1</text>
  <rect x="96" y="82" width="248" height="42" rx="6" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- strip A: current f, bits 0..7 set -->
  <text x="92" y="106" text-anchor="end" font-size="11" fill="#7a7a7a" filter="url(#sk)">处理前的 f</text>
  <g filter="url(#sk)">
    <rect x="100" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="180" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="220" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="260" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="340" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="380" y="88" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="420" y="88" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="460" y="88" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="500" y="88" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="540" y="88" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="120" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="160" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="200" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="240" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="280" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="320" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="360" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="400" y="108" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="440" y="108" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="480" y="108" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="520" y="108" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="560" y="108" fill="#aaaaaa" filter="url(#sk)">0</text>
  </g>
  <g text-anchor="middle" font-size="8.5" fill="#999">
    <text x="120" y="130" filter="url(#sk)">0</text>
    <text x="160" y="130" filter="url(#sk)">1</text>
    <text x="200" y="130" filter="url(#sk)">2</text>
    <text x="240" y="130" filter="url(#sk)">3</text>
    <text x="280" y="130" filter="url(#sk)">4</text>
    <text x="320" y="130" filter="url(#sk)">5</text>
    <text x="360" y="130" filter="url(#sk)">6</text>
    <text x="400" y="130" filter="url(#sk)">7</text>
    <text x="440" y="130" filter="url(#sk)">8</text>
    <text x="480" y="130" filter="url(#sk)">9</text>
    <text x="520" y="130" filter="url(#sk)">10</text>
    <text x="560" y="130" filter="url(#sk)">11</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 320 134 L 320 162" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="334" y="143" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 掩码：f &amp; (2^v − 1)</text>
  <text x="334" y="158" font-size="10" fill="#5a7a9e" filter="url(#sk)">只留低 v 位（条件：值 &gt; x）</text>

  <!-- strip B: shifted bits 6..11 -->
  <text x="92" y="186" text-anchor="end" font-size="11" fill="#7a7a7a" filter="url(#sk)">左移后的新位</text>
  <g filter="url(#sk)">
    <rect x="100" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="140" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="180" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="220" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="260" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="300" y="168" width="40" height="30" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>
    <rect x="340" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="380" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="420" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="460" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="500" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="540" y="168" width="40" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="120" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="160" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="200" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="240" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="280" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="320" y="188" fill="#aaaaaa" filter="url(#sk)">0</text>
    <text x="360" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="400" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="440" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="480" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="520" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="560" y="188" fill="#8a6a20" filter="url(#sk)">1</text>
  </g>

  <!-- arrow 2 -->
  <path d="M 320 206 L 320 240" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="334" y="216" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">② 整体左移 v 位</text>
  <text x="334" y="232" font-size="10" fill="#5a7a9e" filter="url(#sk)">读区 [0, v−1] → 写区 [v, 2v−1]</text>

  <!-- strip C: merged, all set, bit 11 highlighted -->
  <text x="92" y="266" text-anchor="end" font-size="11" fill="#7a7a7a" filter="url(#sk)">或合并后的 f</text>
  <g filter="url(#sk)">
    <rect x="100" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="140" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="180" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="220" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="260" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="300" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="340" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="380" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="420" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="460" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="500" y="248" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="540" y="248" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="120" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="160" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="200" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="240" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="280" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="320" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="360" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="400" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="440" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="480" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="520" y="268" fill="#2e5e2e" filter="url(#sk)">1</text>
    <text x="560" y="268" fill="#b85450" filter="url(#sk)">1</text>
  </g>
  <g text-anchor="middle" font-size="8.5" fill="#999">
    <text x="120" y="292" filter="url(#sk)">0</text>
    <text x="160" y="292" filter="url(#sk)">1</text>
    <text x="200" y="292" filter="url(#sk)">2</text>
    <text x="240" y="292" filter="url(#sk)">3</text>
    <text x="280" y="292" filter="url(#sk)">4</text>
    <text x="320" y="292" filter="url(#sk)">5</text>
    <text x="360" y="292" filter="url(#sk)">6</text>
    <text x="400" y="292" filter="url(#sk)">7</text>
    <text x="440" y="292" filter="url(#sk)">8</text>
    <text x="480" y="292" filter="url(#sk)">9</text>
    <text x="520" y="292" filter="url(#sk)">10</text>
    <text x="560" y="292" font-weight="bold" fill="#b85450" filter="url(#sk)">11</text>
  </g>

  <!-- step 3 -->
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">③ 按位或合并：f = {0, 1, …, 11}，<tspan font-weight="bold" fill="#b85450">最高置位 11</tspan> 即当前最优</text>

  <!-- green card -->
  <rect x="40" y="324" width="560" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="320" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">读写区不相交：本轮写入的位都 ≥ v，读取的位都 &lt; v</text>
  <text x="320" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">同一个 v 天然只用一次（Q3 引理），正序枚举、原地更新都安全</text>

  <!-- orange strip -->
  <rect x="40" y="384" width="560" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="409" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#sk)">转移打包进机器字：每个 v 只花 O(v/64) 次字操作，合计约 2×10^7 次</text>

  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">同样的 DP：Q3 逐位做 O(v)，Q4 逐字做 O(v/64)——64 路并行就是全部增量</text>
</svg>
