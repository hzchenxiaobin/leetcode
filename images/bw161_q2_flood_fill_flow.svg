<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">一次扫描 + 栈式洪泛：每个格子只进出一次</text>
  <rect x="40" y="62" width="120" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100.0" y="89.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">扫描 (i, j)</text>
  <rect x="196" y="62" width="150" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="271.0" y="89.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">grid&gt;0 且未访问？</text>
  <rect x="382" y="62" width="130" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="447.0" y="89.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">入栈，标记访问</text>
  <rect x="546" y="62" width="96" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="594.0" y="89.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">累加 sum</text>
  <path d="M 160 85 L 194 85" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 85 L 380 85" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 512 85 L 544 85" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">否 → 跳过</text>
  <rect x="300" y="170" width="240" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420.0" y="202.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">弹出栈顶，向四周扩展同类陆地</text>
  <path d="M 450 110 L 450 168" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">栈空 ⇒ 该岛屿遍历完毕，回到判定</text>
  <rect x="150" y="268" width="200" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250.0" y="296.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">sum % k == 0 ？</text>
  <rect x="400" y="268" width="170" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485.0" y="296.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans += 1</text>
  <path d="M 330 296 L 398 296" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 226 L 300 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="340" text-anchor="start" font-size="12.5" fill="#888" filter="url(#rough2)">总时间 O(m·n)，空间 O(m·n)</text>
</svg>
