<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">反转关系是「对合」：每个字符串至多一个配对对象</text>

  <!-- 第一层：words -->
  <text x="44" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">words[i]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="90" y="79" text-anchor="middle" font-size="13" fill="#333">"cd"</text>
    <rect x="140" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="79" text-anchor="middle" font-size="13" fill="#333">"ac"</text>
    <rect x="220" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="79" text-anchor="middle" font-size="13" fill="#333">"dc"</text>
    <rect x="300" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="330" y="79" text-anchor="middle" font-size="13" fill="#333">"ca"</text>
    <rect x="380" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="410" y="79" text-anchor="middle" font-size="13" fill="#333">"zz"</text>
  </g>

  <!-- 求反转箭头 -->
  <path d="M 90 96 C 90 108, 90 112, 90 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 96 C 170 108, 170 112, 170 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 96 C 250 108, 250 112, 250 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 96 C 330 108, 330 112, 330 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 96 C 410 108, 410 112, 410 124" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二层：reverse -->
  <text x="44" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">reverse</text>
  <g filter="url(#rough2)">
    <rect x="60" y="136" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="90" y="157" text-anchor="middle" font-size="13" fill="#333">"dc"</text>
    <rect x="140" y="136" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="170" y="157" text-anchor="middle" font-size="13" fill="#333">"ca"</text>
    <rect x="220" y="136" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="250" y="157" text-anchor="middle" font-size="13" fill="#333">"cd"</text>
    <rect x="300" y="136" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="330" y="157" text-anchor="middle" font-size="13" fill="#333">"ac"</text>
    <rect x="380" y="136" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="410" y="157" text-anchor="middle" font-size="13" fill="#333">"zz"</text>
  </g>
  <text x="250" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">命中！前面见过 "cd" → 配对 +1</text>
  <text x="330" y="202" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">命中！前面见过 "ac" → 配对 +1</text>
  <text x="456" y="150" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">回文：
  </text>
  <text x="456" y="164" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">reverse=自身，
  </text>
  <text x="456" y="178" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">查不到自己
  </text>

  <!-- 配对图 -->
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">把每个串与它的反转连边 → 只剩二元分量与孤立点</text>

  <g filter="url(#rough2)">
    <!-- 分量 1: cd — dc -->
    <path d="M 96 266 C 110 258, 140 258, 154 266" stroke="#446688" stroke-width="1.8" fill="none"/>
    <ellipse cx="80" cy="274" rx="34" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="80" y="279" text-anchor="middle" font-size="13" fill="#333">cd</text>
    <ellipse cx="170" cy="274" rx="34" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="170" y="279" text-anchor="middle" font-size="13" fill="#333">dc</text>
    <text x="125" y="308" text-anchor="middle" font-size="11.5" fill="#4a7a3a">1 对</text>

    <!-- 分量 2: ac — ca -->
    <path d="M 256 266 C 270 258, 300 258, 314 266" stroke="#446688" stroke-width="1.8" fill="none"/>
    <ellipse cx="240" cy="274" rx="34" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="279" text-anchor="middle" font-size="13" fill="#333">ac</text>
    <ellipse cx="330" cy="274" rx="34" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="330" y="279" text-anchor="middle" font-size="13" fill="#333">ca</text>
    <text x="285" y="308" text-anchor="middle" font-size="11.5" fill="#4a7a3a">1 对</text>

    <!-- 分量 3: zz 孤立 -->
    <ellipse cx="450" cy="274" rx="34" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="450" y="279" text-anchor="middle" font-size="13" fill="#333">zz</text>
    <path d="M 450 250 C 466 236, 484 240, 480 252" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrRed)"/>
    <text x="450" y="308" text-anchor="middle" font-size="11.5" fill="#b85450">孤立，无法配对</text>
  </g>

  <text x="280" y="344" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">一次遍历：查 reverse(w) 是否在 seen（已见过的串）里，命中即 ans++，然后才把 w 插入 seen</text>
</svg>
