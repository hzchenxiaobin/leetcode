<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：右端点右移时，最小合法左端点只增不减</text>
  <path d="M 130 38 Q 330 46 530 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== Row 1: violation ===== -->
  <text x="40" y="68" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">① r=6：'b' 进窗 → b 出现 3 次，违规 ✗</text>
  <!-- outside cells -->
  <g filter="url(#r)">
    <rect x="40" y="78" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="86" y="78" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="132" y="78" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
  </g>
  <text x="63" y="101" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#r)">b</text>
  <text x="109" y="101" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#r)">c</text>
  <text x="155" y="101" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#r)">b</text>
  <!-- window [3,6] -->
  <g filter="url(#r)">
    <rect x="178" y="78" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="224" y="78" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="270" y="78" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="316" y="78" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="201" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#r)">b</text>
  <text x="247" y="101" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#r)">b</text>
  <text x="293" y="101" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">c</text>
  <text x="339" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#r)">b</text>
  <rect x="362" y="78" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1" filter="url(#r)"/>
  <text x="385" y="101" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#r)">a</text>
  <!-- index labels -->
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#r)">
    <text x="63" y="126">0</text><text x="109" y="126">1</text><text x="155" y="126">2</text><text x="201" y="126">3</text>
    <text x="247" y="126">4</text><text x="293" y="126">5</text><text x="339" y="126">6</text><text x="385" y="126">7</text>
  </g>
  <!-- shrink arrow -->
  <path d="M 201 148 L 245 148" stroke="#b85450" stroke-width="2" marker-end="url(#arR)" filter="url(#r)"/>
  <text x="255" y="152" font-size="11" fill="#b85450" filter="url(#r)">l 右移：s[3]='b' 出窗</text>
  <!-- counter panel -->
  <g filter="url(#r)">
    <rect x="424" y="78" width="220" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="440" y="100" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">窗口内计数</text>
  <text x="440" y="122" font-size="12" font-family="monospace" fill="#b85450" font-weight="bold" filter="url(#r)">b=3 ⚠ (&gt;2)   c=1</text>

  <!-- ===== Row 2: after shrink ===== -->
  <text x="40" y="182" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">② 收缩一步 → 窗口 [4,6] = "bcb"，重新合法 ✓</text>
  <g filter="url(#r)">
    <rect x="40" y="192" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="86" y="192" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="132" y="192" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="178" y="192" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="224" y="192" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="270" y="192" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="316" y="192" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="362" y="192" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
  </g>
  <g filter="url(#r)">
    <text x="63" y="215" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="109" y="215" text-anchor="middle" font-size="15" fill="#aaa">c</text>
    <text x="155" y="215" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="201" y="215" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="247" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
    <text x="293" y="215" text-anchor="middle" font-size="15" fill="#333">c</text>
    <text x="339" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">b</text>
    <text x="385" y="215" text-anchor="middle" font-size="15" fill="#aaa">a</text>
  </g>
  <text x="247" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">l</text>
  <text x="339" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">r</text>
  <g filter="url(#r)">
    <rect x="424" y="192" width="220" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="440" y="214" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">窗口内计数</text>
  <text x="440" y="236" font-size="12" font-family="monospace" fill="#2e6e2e" font-weight="bold" filter="url(#r)">b=2 ✓   c=1 ✓</text>

  <!-- ===== Row 3: extend ===== -->
  <text x="40" y="296" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">③ r=7：'a' 进窗，无需收缩 → [4,7] = "bcba"，长度 4</text>
  <g filter="url(#r)">
    <rect x="40" y="306" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="86" y="306" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="132" y="306" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="178" y="306" width="46" height="36" fill="#f5f2ea" stroke="#ccc" stroke-width="1"/>
    <rect x="224" y="306" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="270" y="306" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="316" y="306" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="362" y="306" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)">
    <text x="63" y="329" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="109" y="329" text-anchor="middle" font-size="15" fill="#aaa">c</text>
    <text x="155" y="329" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="201" y="329" text-anchor="middle" font-size="15" fill="#aaa">b</text>
    <text x="247" y="329" text-anchor="middle" font-size="15" fill="#2b4a6e">b</text>
    <text x="293" y="329" text-anchor="middle" font-size="15" fill="#2b4a6e">c</text>
    <text x="339" y="329" text-anchor="middle" font-size="15" fill="#2b4a6e">b</text>
    <text x="385" y="329" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">a</text>
  </g>
  <text x="247" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">l</text>
  <text x="385" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">r</text>
  <g filter="url(#r)">
    <rect x="424" y="306" width="220" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="440" y="328" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">最终答案</text>
  <text x="440" y="350" font-size="12" font-family="monospace" fill="#2b4a6e" font-weight="bold" filter="url(#r)">ans = 4 ✓（"bcba"）</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#r)">
    <rect x="40" y="374" width="604" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="392" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">为什么是 O(n)</text>
  <text x="56" y="410" font-size="11" fill="#444" filter="url(#r)">合法窗口的子窗口仍合法 ⇒ 最小合法左端点 L(r) 单调不减 ⇒ l、r 各自只前进，合计移动 ≤ 2n 步</text>
</svg>
