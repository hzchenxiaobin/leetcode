<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">算法流程：一次 O(n) 的四段拼接</text>

  <rect x="150" y="48" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">boundaryOfBinaryTree(root)</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="104" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">root 为空 → 直接返回 []</text>

  <path d="M 280 138 L 280 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="160" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">ans = [root.val]（根先入答案）</text>

  <path d="M 280 194 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="216" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">root 是叶子 → 返回 [root.val]（单节点）</text>

  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="272" width="448" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="70" y="290" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">① 左边界（自上而下，跳过叶子）</text>
  <text x="70" y="306" font-size="10.5" fill="#556" filter="url(#rough2)">cur 从 root.left 出发：非叶子入 ans；cur = 有左取左，否则取右</text>

  <path d="M 280 314 L 280 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="336" width="448" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="70" y="354" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 叶子（自左向右）</text>
  <text x="70" y="370" font-size="10.5" fill="#556" filter="url(#rough2)">先左后右 DFS：是叶子就入 ans 并回溯，否则递归两侧子树</text>

  <path d="M 280 378 L 280 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="400" width="448" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="70" y="418" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 右边界（压栈）</text>
  <text x="70" y="434" font-size="10.5" fill="#556" filter="url(#rough2)">cur 从 root.right 出发：非叶子压栈；cur = 有右取右，否则取左</text>

  <path d="M 280 442 L 280 458" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="462" width="368" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="482" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">ans 追加栈中元素的逆序（自下而上）</text>

  <path d="M 280 492 L 280 508" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="206" y="510" width="148" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="528" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">返回 ans</text>
</svg>
