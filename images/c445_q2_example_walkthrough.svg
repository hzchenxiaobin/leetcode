<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="410" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：三个官方示例全部命中</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="58" width="95" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="125" y="58" width="140" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="265" y="58" width="110" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="375" y="58" width="90" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="465" y="58" width="165" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">
    <text x="78" y="81">输入 s</text>
    <text x="195" y="81">计数</text>
    <text x="320" y="81">中心 m</text>
    <text x="420" y="81">半串 h</text>
    <text x="547" y="81">ans = h＋m＋rev(h)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="98" width="95" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="125" y="98" width="140" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="265" y="98" width="110" height="54" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="375" y="98" width="90" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="465" y="98" width="165" height="54" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">
    <text x="78" y="130">"z"</text>
    <text x="195" y="130">z:1</text>
    <text x="320" y="130" font-weight="bold" fill="#7a5415">z</text>
    <text x="420" y="130">""（空）</text>
    <text x="547" y="130" font-size="14" font-weight="bold"><tspan fill="#7a5415">z</tspan></text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="156" width="95" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="125" y="156" width="140" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="265" y="156" width="110" height="54" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="375" y="156" width="90" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="465" y="156" width="165" height="54" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">
    <text x="78" y="188">"babab"</text>
    <text x="195" y="188">a:2, b:3</text>
    <text x="320" y="188" font-weight="bold" fill="#7a5415">b</text>
    <text x="420" y="188" font-weight="bold" fill="#2b6e9e">ab</text>
    <text x="547" y="188" font-size="14" font-weight="bold"><tspan fill="#2b6e9e">ab</tspan><tspan fill="#7a5415">b</tspan><tspan fill="#2e6e2e">ba</tspan></text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="214" width="95" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="125" y="214" width="140" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="265" y="214" width="110" height="54" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="375" y="214" width="90" height="54" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2"/>
    <rect x="465" y="214" width="165" height="54" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">
    <text x="78" y="246">"daccad"</text>
    <text x="195" y="246">a:2, c:2, d:2</text>
    <text x="320" y="246" font-weight="bold" fill="#b85450">∅（偶长）</text>
    <text x="420" y="246" font-weight="bold" fill="#2b6e9e">acd</text>
    <text x="547" y="246" font-size="14" font-weight="bold"><tspan fill="#2b6e9e">acd</tspan><tspan fill="#2e6e2e">dca</tspan></text>
  </g>

  <g filter="url(#sk)">
    <rect x="30" y="292" width="600" height="78" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">"daccad" 原串把 d 排在最前，最优解却把 a、c 挪到前半——</text>
  <text x="330" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">原串本身通常不是最优，必须重建升序半串</text>
  <text x="330" y="360" text-anchor="middle" font-size="11.5" fill="#865" filter="url(#sk)">n = 1 时半串为空、中心即整串，构造式天然兜住，无需特判</text>
</svg>
