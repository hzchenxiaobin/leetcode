  <rect x="406" y="158" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="461.0" y="176.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">3×P(8,1)=24</text>
  <text x="524.0" y="178.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">186</text>
  <rect x="34" y="198" width="44" height="30" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
