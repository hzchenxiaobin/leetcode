  <text x="410.0" y="64.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">方案数</text>
  <text x="524.0" y="64.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">累计</text>
  <rect x="34" y="78" width="44" height="30" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56.0" y="96.6" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="94" y="78" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="134.0" y="96.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">短位数</text>
  <rect x="190" y="78" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="97.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">—</text>
