  <text x="134.0" y="136.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i=0</text>
  <rect x="190" y="118" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="137.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280" y="118" width="130" height="30" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="345.0" y="136.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">x=1</text>
  <rect x="406" y="118" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="461.0" y="136.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">P(9,2)=72</text>
