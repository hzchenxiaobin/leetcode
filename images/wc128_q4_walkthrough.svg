  <text x="134.0" y="256.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">收尾</text>
  <rect x="190" y="238" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="257.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">—</text>
  <rect x="280" y="238" width="130" height="30" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="345.0" y="256.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">n 自身合法</text>
  <rect x="406" y="238" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="461.0" y="256.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">+1</text>
  <text x="524.0" y="258.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">190</text>
  <text x="30.0" y="292.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">cnt(245) = 190 → answer = 245 − 190 = 55</text>
  <rect x="30" y="312" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="333.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">同理 n = 1000：9 + 81 + 648 = 738 → 答案 262（示例 3）</text>
  <text x="40.0" y="349.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">分叉位置越靠前，方案数越大：P(9,2)=72 远大于 P(7,0)=1</text>
</svg>
