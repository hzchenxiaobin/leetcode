    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：n = 245 的分段计数</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">短位数 90 + 分叉 (72+24+3) + n 自身 1 = 190</text>
  <rect width="580" height="396" fill="#fafafa"/>
  <text x="40.0" y="64.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">步</text>
