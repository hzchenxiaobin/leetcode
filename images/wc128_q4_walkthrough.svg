  <rect x="406" y="78" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="461.0" y="96.2" font-size="9" fill="#333" text-anchor="middle" filter="url(#rough2)">9+81</text>
