<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [3,4,5,1,2] —— f = 6，答案 = 5</text>
  <path d="M 90 32 Q 280 38 470 32" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Recursion tree -->
  <rect x="205" y="42" width="150" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">[ 3, 4, 5, 1, 2 ]</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#9a7020" filter="url(#rough2)">root = 3 · l = 2 · r = 2 · C(4,2) = 6</text>

  <path d="M 234 70 Q 160 84 122 108" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="152" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">left（&lt; 3）</text>
  <path d="M 326 70 Q 400 84 438 108" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="97" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">right（&gt; 3）</text>

  <rect x="55" y="112" width="120" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">[ 1, 2 ]</text>
  <text x="115" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">root = 1 · l = 0 · r = 1</text>
  <text x="115" y="166" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">C(1,0) · f([]) · f([2]) = 1</text>
  <text x="115" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">递归基：长度 ≤ 1 → 1</text>

  <rect x="385" y="112" width="120" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">[ 4, 5 ]</text>
  <text x="445" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">root = 4 · l = 0 · r = 1</text>
  <text x="445" y="166" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">C(1,0) · f([]) · f([5]) = 1</text>
  <text x="445" y="182" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">递归基：长度 ≤ 1 → 1</text>

  <!-- Summary band -->
  <rect x="100" y="196" width="360" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">f(nums) = 6 × 1 × 1 = 6　→　答案 = 6 − 1 = 5</text>

  <!-- All 6 interleavings -->
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">全部 6 种交错排列（绿 = {1,2} 保序，蓝 = {4,5} 保序）：</text>

  <!-- col1 -->
  <g filter="url(#rough2)">
    <rect x="72" y="258" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="96" y="258" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="258" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="144" y="258" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="258" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="272">3</text><text x="106" y="272">1</text><text x="130" y="272">2</text><text x="154" y="272">4</text><text x="178" y="272">5</text>
  </g>
  <text x="206" y="272" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <g filter="url(#rough2)">
    <rect x="72" y="288" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="96" y="288" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="288" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="288" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="168" y="288" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="302">3</text><text x="106" y="302">1</text><text x="130" y="302">4</text><text x="154" y="302">2</text><text x="178" y="302">5</text>
  </g>
  <text x="206" y="302" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <g filter="url(#rough2)">
    <rect x="72" y="318" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="96" y="318" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="318" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="318" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="318" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="332">3</text><text x="106" y="332">1</text><text x="130" y="332">4</text><text x="154" y="332">5</text><text x="178" y="332">2</text>
  </g>
  <text x="206" y="332" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- col2 -->
  <g filter="url(#rough2)">
    <rect x="332" y="258" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="356" y="258" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="258" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="404" y="258" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="258" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="342" y="272">3</text><text x="366" y="272">4</text><text x="390" y="272">1</text><text x="414" y="272">2</text><text x="438" y="272">5</text>
  </g>
  <text x="466" y="272" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <g filter="url(#rough2)">
    <rect x="332" y="288" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="356" y="288" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="288" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="404" y="288" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="428" y="288" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="342" y="302">3</text><text x="366" y="302">4</text><text x="390" y="302">1</text><text x="414" y="302">5</text><text x="438" y="302">2</text>
  </g>
  <text x="466" y="302" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <g filter="url(#rough2)">
    <rect x="332" y="318" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="356" y="318" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="318" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="404" y="318" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="318" width="20" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="342" y="332">3</text><text x="366" y="332">4</text><text x="390" y="332">5</text><text x="414" y="332">1</text><text x="438" y="332">2</text>
  </g>
  <path d="M 328 328 L 452 328" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="466" y="332" font-size="9.5" fill="#b85450" filter="url(#rough2)">✗ 原排列，被减去</text>

  <!-- Bottom notes -->
  <text x="280" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">★ 交错 = 从 4 个槽位选 2 个放 {1,2}，共 C(4,2) = 6 种；其中 1 种恰是原排列</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5 个带 ✓ 的排列与示例 2 完全一致 —— 递推、枚举、官方答案三方互证</text>
</svg>
