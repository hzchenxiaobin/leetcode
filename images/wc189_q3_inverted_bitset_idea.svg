<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：子集判定 ⟺ 位集求交</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">全 1 起步，把清单里每个公司的「收藏者位集」逐个交上去</text>

  <text x="105" y="78" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">公司</text>
  <text x="294" y="78" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">收藏它的用户位集（第 i 位 = 用户 i）</text>

  <g font-size="10" fill="#446688" text-anchor="middle">
    <text x="227" y="96" filter="url(#rough2)">0</text>
    <text x="272" y="96" filter="url(#rough2)">1</text>
    <text x="317" y="96" filter="url(#rough2)">2</text>
    <text x="362" y="96" filter="url(#rough2)">3</text>
  </g>

  <!-- google 行 -->
  <rect x="40" y="104" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="125" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">google</text>
  <g filter="url(#rough2)">
    <rect x="210" y="107" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="255" y="107" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="300" y="107" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="345" y="107" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
  </g>
  <text x="400" y="125" font-size="10.5" fill="#666" filter="url(#rough2)">= {0,1,2,3}</text>

  <!-- facebook 行 -->
  <rect x="40" y="146" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="167" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">facebook</text>
  <g filter="url(#rough2)">
    <rect x="210" y="149" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="255" y="149" width="34" height="26" fill="#fafafa" stroke="#aaa" stroke-dasharray="3 3" rx="4"/>
    <rect x="300" y="149" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="345" y="149" width="34" height="26" fill="#fafafa" stroke="#aaa" stroke-dasharray="3 3" rx="4"/>
  </g>
  <text x="400" y="167" font-size="10.5" fill="#666" filter="url(#rough2)">= {0,2}</text>

  <!-- leetcode 行 -->
  <rect x="40" y="188" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="209" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">leetcode</text>
  <g filter="url(#rough2)">
    <rect x="210" y="191" width="34" height="26" fill="#446688" stroke="#446688" rx="4"/>
    <rect x="255" y="191" width="34" height="26" fill="#fafafa" stroke="#aaa" stroke-dasharray="3 3" rx="4"/>
    <rect x="300" y="191" width="34" height="26" fill="#fafafa" stroke="#aaa" stroke-dasharray="3 3" rx="4"/>
    <rect x="345" y="191" width="34" height="26" fill="#fafafa" stroke="#aaa" stroke-dasharray="3 3" rx="4"/>
  </g>
  <text x="400" y="209" font-size="10.5" fill="#666" filter="url(#rough2)">= {0}</text>

  <path d="M 294 222 L 294 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">对 L₀ = {leetcode, google, facebook} 求交</text>

  <rect x="70" y="256" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">{0} ∩ {0,1,2,3} ∩ {0,2} = {0}</text>

  <rect x="70" y="308" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="86" y="328" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">交集只剩自己 → 是答案</text>
  <text x="86" y="348" font-size="10" fill="#555" filter="url(#rough2)">除用户 0 外没人收藏齐这三家</text>

  <rect x="330" y="308" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="346" y="328" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">交集含别人 → 不是答案</text>
  <text x="346" y="348" font-size="10" fill="#555" filter="url(#rough2)">如用户 2：{0,1,2,3}∩{0,2}={0,2}</text>

  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">交集恰是「清单是 Lᵢ 超集」的用户集合</text>
  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">于是答案 = 包含偏序下的极大元，n² 次比较被换成位并行</text>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总运算量 O(Σ|Lᵢ| · n/64)：每人只做 |Lᵢ| 次机器字与运算</text>
</svg>
