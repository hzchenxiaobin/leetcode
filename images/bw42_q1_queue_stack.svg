<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">栈顶无人喜欢时，队列转一整圈也不会变</text>

  <!-- 三明治栈 -->
  <text x="120" y="60" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">三明治栈</text>
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="80" y="108" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="80" y="146" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="120" y="92" fill="#b85450" font-weight="bold">0 ← 栈顶</text>
    <text x="120" y="130">1</text>
    <text x="120" y="168">1</text>
  </g>

  <!-- 学生队列 -->
  <text x="400" y="60" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">学生队列（会转圈）</text>
  <g filter="url(#rough2)">
    <rect x="280" y="70" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="332" y="70" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="384" y="70" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="436" y="70" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="305" y="92">1</text><text x="357" y="92">1</text>
    <text x="409" y="92">1</text><text x="461" y="92">1</text>
  </g>
  <path d="M 490 106 C 510 140, 260 140, 288 110" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="140" font-size="12" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">没人喜欢 0 → 全部放弃回队尾，永远转圈</text>

  <!-- 卡死标记 -->
  <g filter="url(#rough2)">
    <path d="M 165 88 L 230 88" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="234" y="72" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <text x="254" y="93" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">✗</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="180" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="205">只要还有人喜欢栈顶类型 s，转一圈必轮到他 → 必被吃掉</text>
    <text x="280" y="228">喜欢 s 的人数为 0 → 栈顶永不动，压住的也轮不到</text>
  </g>

  <!-- 计数器 -->
  <g filter="url(#rough2)">
    <rect x="100" y="258" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="290" y="258" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="185" y="278">cnt[0] = 喜欢圆形的人数</text>
    <text x="185" y="296">（本题 = 0 → 卡死）</text>
    <text x="375" y="278">cnt[1] = 喜欢方形的人数</text>
    <text x="375" y="296">（= 4 → 答案）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="140" y="312" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="330" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">两个计数器就够，队列顺序根本无关！</text>
</svg>
