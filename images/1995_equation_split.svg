<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：等式拆半 —— 左半存和，右半查差</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- role labels -->
  <text x="206" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <text x="278" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">b</text>
  <text x="350" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">c ← 分割线</text>
  <text x="422" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="170" y="66" width="72" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="242" y="66" width="72" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)">
    <rect x="314" y="66" width="72" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="386" y="66" width="72" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>

  <text x="206" y="98" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="278" y="98" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="350" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#a06a10" filter="url(#sk)">3</text>
  <text x="422" y="98" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#sk)">6</text>

  <text x="206" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="278" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">1</text>
  <text x="350" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">2</text>
  <text x="422" y="134" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">3</text>

  <!-- braces under halves -->
  <g filter="url(#sk)">
    <path d="M 174 118 Q 244 150 314 118" stroke="#4a8edb" stroke-width="2.2" fill="none"/>
  </g>
  <text x="244" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">左半 (a,b)：nums[a]+nums[b] = 1+2 = 3</text>
  <g filter="url(#sk)">
    <path d="M 318 118 Q 388 156 458 118" stroke="#4a8e4a" stroke-width="2.2" fill="none"/>
  </g>
  <text x="388" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右半 (c,d)：nums[d]−nums[c] = 6−3 = 3</text>

  <!-- equation transform box -->
  <g filter="url(#sk)">
    <rect x="110" y="200" width="460" height="68" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="226" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#sk)">nums[a] + nums[b] + nums[c] = nums[d]</text>
  <text x="340" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">移项 ⟺ nums[a] + nums[b] = nums[d] − nums[c]</text>

  <!-- explanation boxes -->
  <g filter="url(#sk)">
    <rect x="36" y="288" width="300" height="112" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="186" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">左半：哈希 cnt 存「和」的次数</text>
  <text x="52" y="332" font-size="11.5" fill="#444" filter="url(#sk)">cnt[s]：分割线左侧 a &lt; b 的对中</text>
  <text x="52" y="350" font-size="11.5" fill="#444" filter="url(#sk)">nums[a]+nums[b] == s 的对数</text>
  <text x="52" y="368" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">分割线右移一格，增量补 O(c) 条</text>

  <g filter="url(#sk)">
    <rect x="352" y="288" width="292" height="112" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="498" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右半：枚举 (c,d)，O(1) 查差</text>
  <text x="368" y="332" font-size="11.5" fill="#444" filter="url(#sk)">固定 c，枚举所有 d &gt; c：</text>
  <text x="368" y="350" font-size="11.5" fill="#444" filter="url(#sk)">ans += cnt[nums[d] − nums[c]]</text>
  <text x="368" y="368" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">一次命中即一组合法四元组</text>

  <text x="340" y="422" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">a &lt; b &lt; c &lt; d 保证左半整体在分割线左侧，「先查后建」天然排除 b ≥ c 的非法对</text>
</svg>
