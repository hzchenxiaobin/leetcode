<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：最少操作数 = 把每个数抬到「前缀最大值水位线」</text>
  <text x="380" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">蓝柱 = 原值，粉色块 = 抬升量（每格 = 1 次操作），粗蓝线 = b（从 l 起的前缀最大值）</text>

  <!-- ===== left panel: feasible ===== -->
  <text x="195" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">可行：子数组 [3,1,2,4,4]（示例 1，l=1，k=7）</text>

  <line x1="50" y1="300" x2="355" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- original bars -->
  <g filter="url(#rough2)"><rect x="60" y="240" width="44" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="124" y="280" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="188" y="260" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="252" y="220" width="44" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="316" y="220" width="44" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <!-- increment regions -->
  <g filter="url(#rough2)"><rect x="124" y="240" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="188" y="240" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <!-- staircase b -->
  <path d="M 60 240 L 252 240 L 252 220 L 360 220" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <text x="82" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+0</text>
  <text x="146" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+2</text>
  <text x="210" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+1</text>
  <text x="274" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+0</text>
  <text x="338" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+0</text>

  <text x="82" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="274" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="338" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <text x="195" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">代价 = 0+2+1+0+0 = 3 ≤ 7 ✓</text>

  <!-- ===== right panel: infeasible ===== -->
  <text x="565" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">不可行：子数组 [6,3,1]（l=0，k=7）</text>

  <line x1="440" y1="300" x2="665" y2="300" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="448" y="180" width="44" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="523" y="240" width="44" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="598" y="280" width="44" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="523" y="180" width="44" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><rect x="598" y="180" width="44" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <path d="M 448 180 L 642 180" stroke="#446688" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <text x="470" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">+0</text>
  <text x="545" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">+3</text>
  <text x="620" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">+5</text>

  <text x="470" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="545" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="620" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="565" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">代价 = 0+3+5 = 8 &gt; 7 ✗</text>

  <!-- ===== bottom strip ===== -->
  <g filter="url(#rough2)"><rect x="40" y="366" width="680" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="390" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">为什么这样最省：任何非递减终数组 c 都满足 cᵢ ≥ bᵢ（归纳：cᵢ ≥ max(numsᵢ, cᵢ₋₁) ≥ bᵢ）</text>
  <text x="60" y="410" font-size="11" fill="#444" filter="url(#rough2)">b 本身非递减 ⇒ Σ(bᵢ−numsᵢ) 既是下界又可取到 —— 于是「数子数组」变成「对每个 l 找最大可行 r」</text>
</svg>
