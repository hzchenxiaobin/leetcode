<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 1, 2, 3, 2, 1, 2]</text>

  <!-- 数组 -->
  <rect x="92" y="46" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="116" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="46" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="46" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="46" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="46" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="332" y="46" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="356" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="46" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="404" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <text x="116" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="164" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="212" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="308" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="356" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="404" y="100" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <text x="92" y="126" text-anchor="start" font-size="13" fill="#555" filter="url(#rough2)">按值分组（位置天然升序）</text>

  <!-- 行 2 高亮背景 -->
  <rect x="150" y="170" width="346" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <!-- 值 1 -->
  <text x="130" y="155" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">值 1</text>
  <rect x="160" y="136" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="136" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="240" y="136" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="150" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">窗口 (0, 1, 5)，跨度 5</text>
  <text x="300" y="166" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">候选距离 2 × 5 = 10</text>

  <!-- 值 2 -->
  <text x="130" y="199" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">值 2</text>
  <rect x="160" y="180" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="180" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="180" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="300" y="194" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">窗口 (2, 4, 6)，跨度 4</text>
  <text x="300" y="210" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">候选距离 2 × 4 = 8 ← 最小</text>

  <!-- 值 3 -->
  <text x="130" y="243" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">值 3</text>
  <rect x="160" y="224" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="244" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">仅 1 次出现，不足 3 次，跳过</text>

  <!-- 结论框 -->
  <rect x="160" y="274" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最小跨度 = 4</text>
  <text x="260" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 2 × 4 = 8</text>
</svg>
