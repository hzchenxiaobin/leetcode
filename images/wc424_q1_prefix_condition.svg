<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">判定条件：一个零位置把数组切成左右两半</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array: [1,0,2,0,3], start i=3 -->
  <text x="340" y="72" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">起点 i = 3（nums[i] = 0），total = 6</text>
  <g filter="url(#sk)">
    <rect x="191" y="88" width="58" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="251" y="88" width="58" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="311" y="88" width="58" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="371" y="88" width="58" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="431" y="88" width="58" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="220" y="116" text-anchor="middle" font-size="14" fill="#2e6e2e">1</text>
  <text x="280" y="116" text-anchor="middle" font-size="14" fill="#2e6e2e">0</text>
  <text x="340" y="116" text-anchor="middle" font-size="14" fill="#2e6e2e">2</text>
  <text x="400" y="116" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">0</text>
  <text x="460" y="116" text-anchor="middle" font-size="14" fill="#2b6e9e">3</text>

  <!-- brackets -->
  <g filter="url(#sk)">
    <path d="M 191 142 L 191 152 L 369 152 L 369 142" stroke="#4a8e4a" stroke-width="1.4" fill="none"/>
  </g>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">SL = prefix[i] = 1+0+2 = 3</text>
  <g filter="url(#sk)">
    <path d="M 431 142 L 431 152 L 489 152 L 489 142" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>
  <text x="460" y="170" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">SR = total−prefix[i] = 3</text>

  <!-- direction condition boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="192" width="290" height="118" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">向右出发（首撞在右侧）</text>
  <text x="56" y="240" font-size="11" fill="#444">碰撞序列：R, L, R, L, ⋯（撞一次某侧和 −1）</text>
  <text x="56" y="262" font-size="11" fill="#444">末撞在左 → 向右越界：SR = SL</text>
  <text x="56" y="284" font-size="11" fill="#444">末撞在右 → 向左越界：SR = SL + 1</text>
  <text x="185" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">有效 ⟺ SR − SL ∈ {0, 1}</text>

  <g filter="url(#sk)">
    <rect x="350" y="192" width="290" height="118" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="495" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">向左出发（镜像）</text>
  <text x="366" y="240" font-size="11" fill="#444">碰撞序列：L, R, L, R, ⋯（撞一次某侧和 −1）</text>
  <text x="366" y="262" font-size="11" fill="#444">末撞在右 → 向左越界：SL = SR</text>
  <text x="366" y="284" font-size="11" fill="#444">末撞在左 → 向右越界：SL = SR + 1</text>
  <text x="495" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">有效 ⟺ SL − SR ∈ {0, 1}</text>

  <!-- unified box -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="84" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="340" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">统一写法：记 d = SR − SL = total − 2·prefix[i]</text>
  <text x="340" y="380" text-anchor="middle" font-size="12" fill="#444">向右有效 ⟺ d ∈ {0, 1}；向左有效 ⟺ d ∈ {0, −1}；d = 0 时两个方向都有效（贡献 2）</text>
  <text x="340" y="402" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">一次扫描维护 prefix，遇零位置 O(1) 判定 → 总时间 O(n)</text>
</svg>
