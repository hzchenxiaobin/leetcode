<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [5,3,6,2,4,null,7]</text>

  <rect x="45" y="52" width="230" height="308" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">k = 9：补数哈希（先查后插）</text>
  <text x="60" y="106" font-size="9.5" fill="#555" filter="url(#rough2)">5：9−5=4 ∉ → seen={5}</text>
  <text x="60" y="132" font-size="9.5" fill="#555" filter="url(#rough2)">3：9−3=6 ∉ → seen={5,3}</text>
  <text x="60" y="158" font-size="9.5" fill="#555" filter="url(#rough2)">2：9−2=7 ∉ → seen={5,3,2}</text>
  <text x="60" y="184" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4：9−4=5 ∈ ✔ 命中</text>
  <text x="60" y="214" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">返回 true，只访问了 4 个节点</text>
  <text x="60" y="250" font-size="9" fill="#777" filter="url(#rough2)">表中只需存「已访问过的值」</text>
  <text x="60" y="284" font-size="9" fill="#777" filter="url(#rough2)">访问顺序随 DFS/BFS 改变，</text>
  <text x="60" y="300" font-size="9" fill="#777" filter="url(#rough2)">但「先查后插」永远成立</text>
  <text x="60" y="336" font-size="9" fill="#446688" filter="url(#rough2)">双指针对照：2 + 7 = 9 一步命中</text>

  <rect x="285" y="52" width="230" height="308" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300" y="76" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k = 28：中序 + 双指针</text>
  <text x="300" y="106" font-size="9.5" fill="#555" filter="url(#rough2)">中序序列：2 3 4 5 6 7</text>
  <text x="300" y="132" font-size="9.5" fill="#555" filter="url(#rough2)">L=0,R=5：2+7=9 &lt; 28 → L=1</text>
  <text x="300" y="158" font-size="9.5" fill="#555" filter="url(#rough2)">L=1,R=5：3+7=10 &lt; 28 → L=2</text>
  <text x="300" y="184" font-size="9.5" fill="#555" filter="url(#rough2)">L=2,R=5：4+7=11 &lt; 28 → L=3</text>
  <text x="300" y="210" font-size="9.5" fill="#555" filter="url(#rough2)">L=3,R=5：5+7=12 &lt; 28 → L=4</text>
  <text x="300" y="236" font-size="9.5" fill="#555" filter="url(#rough2)">L=4,R=5：6+7=13 &lt; 28 → L=5</text>
  <text x="300" y="262" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">L=5 ≥ R=5 → 返回 false</text>
  <text x="300" y="298" font-size="9" fill="#777" filter="url(#rough2)">右指针始终指向当前最大值，</text>
  <text x="300" y="314" font-size="9" fill="#777" filter="url(#rough2)">和偏小只能靠左指针变大</text>
  <text x="300" y="336" font-size="9" fill="#4a7a3a" filter="url(#rough2)">共 6 步就判定完 6 个元素</text>

  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">补数哈希 O(n) 时间 / O(n) 空间；有序双指针 O(n) 时间、O(1) 额外空间</text>
</svg>
