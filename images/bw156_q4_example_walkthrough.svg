<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="540" height="390" fill="#fafafa"/>
<text x="270" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：反转 0、3、4、6，总和 27</text>
<path d="M270,80 L150,126" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<path d="M270,80 L390,126" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<path d="M150,170 L80,216" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<path d="M150,170 L220,216" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<path d="M390,170 L320,216" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<path d="M390,170 L460,216" stroke="#556677" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
<ellipse cx="270" cy="58" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="270" y="63" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<text x="270" y="102" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4 → −4</text>
<ellipse cx="150" cy="148" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="150" y="153" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<text x="150" y="192" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">−8 → 8</text>
<ellipse cx="390" cy="148" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="390" y="153" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="390" y="192" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">−6 → 6</text>
<ellipse cx="80" cy="238" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="80" y="243" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<text x="80" y="282" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3 → 3</text>
<ellipse cx="220" cy="238" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="220" y="243" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
<text x="220" y="282" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">7 → 7</text>
<ellipse cx="320" cy="238" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="320" y="243" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
<text x="320" y="282" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">−2 → 2</text>
<ellipse cx="460" cy="238" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="460" y="243" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6</text>
<text x="460" y="282" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5 → 5</text>
<text x="270" y="306" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">粉色 = 被反转的节点；子树内所有值取反</text>
<text x="270" y="336" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">总和 = −4 + 8 + 6 + 3 + 7 + 2 + 5 = 27</text>
<text x="270" y="364" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">所有“祖先-后代”反转对的距离都是 2 ≥ k = 2</text>
</svg>
