<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2,1,1,1,3,4,1]，k = 2</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="42" y="56" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="62" y="68" font-size="11.5" fill="#2b4a68" filter="url(#sk)">inc：以 i 结尾的非递增段长（正向一趟）</text>
  <g filter="url(#sk)"><rect x="400" y="56" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="420" y="68" font-size="11.5" fill="#2e5c24" filter="url(#sk)">dec：以 i 开头的非递减段长（反向一趟）</text>

  <text x="104" y="112" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">nums</text>
  <g filter="url(#sk)"><rect x="120" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="148" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="176" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="204" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="232" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="260" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="288" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="316" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="344" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="372" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="400" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="428" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="456" y="90" width="56" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="484" y="113" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>

  <text x="104" y="148" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">inc</text>
  <g filter="url(#sk)"><rect x="120" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="148" y="149" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="176" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="204" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="232" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="260" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="288" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="316" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="344" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="372" y="149" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="400" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="428" y="149" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="456" y="126" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="484" y="149" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">2</text>

  <text x="104" y="184" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">dec</text>
  <g filter="url(#sk)"><rect x="120" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="148" y="185" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="176" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="204" y="185" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="232" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="260" y="185" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="288" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="316" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="344" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="372" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="400" y="162" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="428" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="456" y="162" width="56" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="484" y="185" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">1</text>

  <text x="148" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="204" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="316" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="372" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="428" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>
  <text x="484" y="212" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">6</text>

  <g filter="url(#sk)"><path d="M 232 226 Q 288 240 344 226" stroke="#888" stroke-width="1.6" fill="none"/></g>
  <text x="288" y="258" text-anchor="middle" font-size="11.5" fill="#4a4a4a" filter="url(#sk)">候选 i ∈ [2, 5)（k ≤ i &lt; n−k）</text>

  <g filter="url(#sk)"><rect x="42" y="280" width="480" height="40" rx="8" fill="#f7fbf7" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="58" y="305" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">i = 2</text>
  <text x="110" y="305" font-size="12" fill="#2b4a68" filter="url(#sk)">inc[1] = 2 ≥ k ✓</text>
  <text x="268" y="305" font-size="12" fill="#2e5c24" filter="url(#sk)">dec[3] = 3 ≥ k ✓</text>
  <text x="428" y="305" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">⟹ 收集</text>

  <g filter="url(#sk)"><rect x="42" y="332" width="480" height="40" rx="8" fill="#f7fbf7" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="58" y="357" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">i = 3</text>
  <text x="110" y="357" font-size="12" fill="#2b4a68" filter="url(#sk)">inc[2] = 3 ≥ k ✓</text>
  <text x="268" y="357" font-size="12" fill="#2e5c24" filter="url(#sk)">dec[4] = 2 ≥ k ✓</text>
  <text x="428" y="357" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">⟹ 收集</text>

  <g filter="url(#sk)"><rect x="42" y="384" width="480" height="40" rx="8" fill="#fdf3f4" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="58" y="409" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#sk)">i = 4</text>
  <text x="110" y="409" font-size="12" fill="#2b4a68" filter="url(#sk)">inc[3] = 4 ≥ k ✓</text>
  <text x="268" y="409" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">dec[5] = 1 &lt; k ✗</text>
  <text x="428" y="409" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">⟹ 淘汰</text>

  <g filter="url(#sk)"><rect x="542" y="280" width="118" height="144" rx="10" fill="#f5f0fa" stroke="#8468a8" stroke-width="1.4"/></g>
  <text x="601" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4780" filter="url(#sk)">三趟全 O(n)</text>
  <text x="601" y="336" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#sk)">正扫 → inc</text>
  <text x="601" y="360" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#sk)">反扫 → dec</text>
  <text x="601" y="384" text-anchor="middle" font-size="11" fill="#4a4a4a" filter="url(#sk)">每候选 O(1) 查表</text>
  <text x="601" y="408" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">共 3n 步左右</text>

  <g filter="url(#sk)"><rect x="42" y="448" width="480" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="282" y="470" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = [2, 3] ✓</text>
  <text x="282" y="490" text-anchor="middle" font-size="10.5" fill="#4a4a4a" filter="url(#sk)">下标 4 前侧达标，后 k 格 [4,1] 不是非递减，被 dec[5] = 1 拦下</text>
</svg>
