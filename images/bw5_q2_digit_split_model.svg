<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">按位取数：模 10 剥最低位，除 10 去掉它</text>

  <!-- 153 的数位拆解 -->
  <text x="60" y="72" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 153（k = 3 位）</text>

  <g filter="url(#rough2)">
    <rect x="76"  y="88" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="230" y="88" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="384" y="88" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="121" y="112">1</text><text x="275" y="112">5</text><text x="429" y="112">3</text>
    <text x="121" y="132" font-size="11" fill="#888">百位</text>
    <text x="275" y="132" font-size="11" fill="#888">十位</text>
    <text x="429" y="132" font-size="11" fill="#888">个位</text>
  </g>

  <!-- 剥位过程 -->
  <rect x="60" y="170" width="440" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e">
    <text x="80" y="196">m = 153：d = 153 mod 10 = 3 → 累加 3³ = 27；m = 153 ÷ 10 = 15</text>
    <text x="80" y="222">m = 15 ：d = 15 mod 10 = 5 → 累加 5³ = 125；m = 15 ÷ 10 = 1</text>
    <text x="80" y="248">m = 1  ：d = 1 mod 10 = 1 → 累加 1³ = 1；  m = 1 ÷ 10 = 0</text>
    <text x="80" y="274" font-weight="bold" fill="#2d5a22">m = 0 停止：sum = 27 + 125 + 1 = 153 = n ✓</text>
  </g>

  <path d="M 121 142 C 121 156, 200 164, 250 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 142 C 429 156, 360 164, 320 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="152" font-size="12" fill="#446688" filter="url(#rough2)">低位先出：3、5、1</text>

  <!-- 底部公式 -->
  <rect x="70" y="308" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">判定：sum(dᵏ) == n ⟺ 阿姆斯特朗数（k 为位数）</text>
</svg>
