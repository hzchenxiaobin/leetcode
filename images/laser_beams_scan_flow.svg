<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">逐行扫描：空行跳过，非空行与上一非空行配对</text>
  <path d="M 150 40 Q 350 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="350" cy="70" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">开始</text>
  <path d="M 350 88 L 350 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="255" y="104" width="190" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="126" text-anchor="middle" font-size="12.5" fill="#333">prev = 0，ans = 0，i = 0</text>
  <path d="M 350 138 L 350 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 A：i < m ? -->
  <g filter="url(#sk)">
    <polygon points="350,156 402,186 350,216 298,186" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">i &lt; m ?</text>
  <path d="M 402 186 L 536 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="178" font-size="12" fill="#555">否</text>
  <g filter="url(#sk)">
    <rect x="540" y="167" width="122" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="601" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 ans ✓</text>
  <path d="M 350 216 L 350 230" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="228" font-size="12" fill="#555">是</text>

  <!-- 统计本行设备数 -->
  <g filter="url(#sk)">
    <rect x="248" y="234" width="204" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="256" text-anchor="middle" font-size="12.5" fill="#333">cnt = 第 i 行中 '1' 的个数</text>
  <path d="M 350 268 L 350 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 B：cnt > 0 ? -->
  <g filter="url(#sk)">
    <polygon points="350,286 405,318 350,350 295,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="323" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">cnt &gt; 0 ?</text>
  <path d="M 295 318 L 165 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="282" y="310" font-size="12" fill="#555">否（空行）</text>
  <g filter="url(#sk)">
    <rect x="42" y="298" width="122" height="40" rx="8" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="103" y="315" text-anchor="middle" font-size="11.5" fill="#666">什么都不做，</text>
  <text x="103" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">prev 保持不变！</text>
  <path d="M 350 350 L 350 364" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="362" font-size="12" fill="#555">是</text>

  <!-- 乘法累加 -->
  <g filter="url(#sk)">
    <rect x="240" y="368" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ans += prev × cnt</text>
  <text x="350" y="404" text-anchor="middle" font-size="12.5" fill="#b85450">prev = cnt</text>
  <path d="M 350 412 L 350 440" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 空行侧路汇合 -->
  <path d="M 103 338 L 103 458 L 272 458" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i++ -->
  <g filter="url(#sk)">
    <rect x="276" y="440" width="148" height="36" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="463" text-anchor="middle" font-size="12.5" fill="#333">i++，看下一行</text>

  <!-- 回边 -->
  <path d="M 424 458 L 660 458 L 660 186 L 406 186" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="672" y="322" font-size="11.5" fill="#8a8a8a" transform="rotate(-90 672 322)">回到循环开头</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="504" width="580" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="350" y="524" text-anchor="middle" font-size="12" fill="#8a6415">空行既不贡献乘积，也不清空 prev —— 「跳过」正是它阻挡不了上一个非空行的体现</text>
</svg>
