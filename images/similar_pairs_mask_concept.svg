<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：相似 ⇔ 字符集合相同 ⇔ 26 位掩码相等</text>
  <path d="M 180 44 Q 340 52 500 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- row A: word "aba" -->
  <rect x="50" y="64" width="90" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">"aba"</text>
  <path d="M 144 82 L 186 82" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <rect x="192" y="64" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="87" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#rough2)">集合 {a, b}</text>
  <path d="M 306 82 L 348 82" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <rect x="354" y="64" width="150" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="87" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#7a5415" filter="url(#rough2)">mask = 0…0011</text>

  <!-- row B: word "aabb" -->
  <rect x="50" y="112" width="90" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">"aabb"</text>
  <path d="M 144 130 L 186 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <rect x="192" y="112" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="135" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#rough2)">集合 {a, b}</text>
  <path d="M 306 130 L 348 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <rect x="354" y="112" width="150" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="135" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#7a5415" filter="url(#rough2)">mask = 0…0011</text>

  <!-- equal masks -->
  <text x="524" y="109" text-anchor="middle" font-size="26" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">=</text>
  <text x="592" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">相似 ✓</text>

  <!-- bit row -->
  <text x="50" y="180" font-size="12" fill="#444" filter="url(#rough2)">把字符集合压成一个 26 位二进制数（第 k 位 = 1 表示第 k 个字母出现过）：</text>
  <rect x="70" y="192" width="18" height="24" fill="#446688" stroke="#33507a" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="88" y="192" width="18" height="24" fill="#446688" stroke="#33507a" stroke-width="1" filter="url(#rough2)"/>
  <text x="97" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <rect x="106" y="192" width="432" height="24" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="322" y="209" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#999" filter="url(#rough2)">0  0  0  ⋯  0  0  0</text>
  <g stroke="#d9d9d9" stroke-width="1" filter="url(#rough)">
    <line x1="142" y1="192" x2="142" y2="216"/>
    <line x1="196" y1="192" x2="196" y2="216"/>
    <line x1="250" y1="192" x2="250" y2="216"/>
    <line x1="304" y1="192" x2="304" y2="216"/>
    <line x1="358" y1="192" x2="358" y2="216"/>
    <line x1="412" y1="192" x2="412" y2="216"/>
    <line x1="466" y1="192" x2="466" y2="216"/>
    <line x1="520" y1="192" x2="520" y2="216"/>
  </g>
  <text x="79" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">a</text>
  <text x="97" y="232" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">b</text>
  <text x="285" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">⋯（其余字母全为 0）</text>
  <text x="529" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">z</text>
  <rect x="550" y="190" width="13" height="13" rx="2" fill="#446688" filter="url(#rough2)"/>
  <text x="569" y="201" font-size="10.5" fill="#444" filter="url(#rough2)">1 = 出现</text>
  <rect x="550" y="210" width="13" height="13" rx="2" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="569" y="221" font-size="10.5" fill="#444" filter="url(#rough2)">0 = 未出现</text>

  <!-- counterexample -->
  <rect x="50" y="262" width="600" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="286" font-size="13" font-weight="bold" fill="#a3333c" filter="url(#rough2)">反例：集合不同 ⇒ 掩码不同 ⇒ 不相似（不计入答案）</text>
  <rect x="80" y="298" width="64" height="28" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#a3333c" filter="url(#rough2)">"nba"</text>
  <path d="M 148 312 L 178 312" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="194" y="317" font-size="12.5" font-family="monospace" fill="#444" filter="url(#rough2)">{a, b, n}</text>
  <text x="262" y="318" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <rect x="284" y="298" width="64" height="28" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#a3333c" filter="url(#rough2)">"cba"</text>
  <path d="M 352 312 L 382 312" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="398" y="317" font-size="12.5" font-family="monospace" fill="#444" filter="url(#rough2)">{a, b, c}</text>
  <text x="80" y="342" font-size="11" fill="#a3333c" filter="url(#rough2)">字符 n 只在左边出现，两个字符集合（掩码）必然不等。</text>

  <!-- key insight -->
  <rect x="50" y="360" width="600" height="48" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="381" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键观察：</text>
  <text x="148" y="381" font-size="11.5" fill="#444" filter="url(#rough2)">「相似」只由字符集合决定，与频次、顺序无关。</text>
  <text x="70" y="399" font-size="11.5" fill="#444" filter="url(#rough2)">把每个词编码成 26 位掩码后，问题退化为「统计掩码相等的下标对」——标准哈希计数。</text>
</svg>
