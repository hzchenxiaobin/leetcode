<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">块切分：累计收益首次为正就切一刀</text>
    <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888">d_j = b_j − a_j；块内任何真前缀的累计收益都 ≤ 0，整块才有正收益</text>
  </g>

  <g filter="url(#rough2)">
    <text x="75" y="82" font-size="10.5" fill="#666">每层花费 a / 收益 b：</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="75" y="92" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="120" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=5 b=0</text>
    <text x="120" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">d=−5</text>
    <rect x="175" y="92" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="220" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=3 b=0</text>
    <text x="220" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">d=−3</text>
    <rect x="275" y="92" width="90" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="320" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=0 b=9</text>
    <text x="320" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">d=+9</text>
    <rect x="375" y="92" width="90" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="420" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=4 b=0</text>
    <text x="420" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">d=−4</text>
    <rect x="475" y="92" width="90" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="520" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=2 b=0</text>
    <text x="520" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">d=−2</text>
    <rect x="575" y="92" width="90" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="620" y="112" text-anchor="middle" font-size="10.5" fill="#333">a=0 b=8</text>
    <text x="620" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">d=+8</text>
  </g>

  <g filter="url(#rough2)">
    <text x="75" y="160" font-size="10" fill="#888">层号 1…6</text>
  </g>

  <g filter="url(#rough2)">
    <line x1="75" y1="300" x2="665" y2="300" stroke="#9aa8b6" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="375" y1="75" x2="375" y2="380" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>

  <g filter="url(#rough2)">
    <path d="M 75 300 L 120 340 L 220 364 L 320 292" fill="none" stroke="#446688" stroke-width="2.2"/>
    <circle cx="120" cy="340" r="3.2" fill="#446688"/>
    <circle cx="220" cy="364" r="3.2" fill="#446688"/>
    <circle cx="320" cy="292" r="3.2" fill="#446688"/>
  </g>

  <g filter="url(#rough2)">
    <path d="M 375 300 L 420 332 L 520 348 L 620 284" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="420" cy="332" r="3.2" fill="#4a7a3a"/>
    <circle cx="520" cy="348" r="3.2" fill="#4a7a3a"/>
    <circle cx="620" cy="284" r="3.2" fill="#4a7a3a"/>
  </g>

  <g filter="url(#rough2)">
    <path d="M 220 372 L 220 392" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="228" y="396" font-size="11" fill="#b85450">need₁ = 8（最深的坑）</text>
    <path d="M 520 356 L 520 372" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="440" y="390" font-size="11" fill="#b85450">need₂ = 6</text>
    <text x="290" y="280" font-size="11" fill="#446688">gain₁ = 1</text>
    <text x="600" y="272" font-size="11" fill="#4a7a3a">gain₂ = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="440" y="150" width="230" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="455" y="170" font-size="10.5" fill="#333">块结束条件：累计和 sum &gt; 0</text>
    <text x="455" y="190" font-size="10.5" fill="#333">块 = (need, gain)，gain 严格为正</text>
  </g>

  <g filter="url(#rough2)">
    <text x="360" y="418" text-anchor="middle" font-size="10" fill="#888">两次切块：块 1 = 第 1–3 层（need 8, gain 1），块 2 = 第 4–6 层（need 6, gain 2）</text>
  </g>
</svg>
