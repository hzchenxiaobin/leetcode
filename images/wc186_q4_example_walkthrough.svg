<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 505" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="505" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [10, −2, −10, −5, 20]，k = 2</text>
  <text x="350" y="41" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口 [i−k, i−1]；队列为该步结束时状态（下标 : dp，绿框 = 队头）；粉底行 = 关键步骤</text>

  <g filter="url(#rough2)">
    <text x="87" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">i / nums[i]</text>
    <text x="240" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">队列（下标 : dp）</text>
    <text x="430" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">动作</text>
    <text x="630" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="68" width="652" height="74" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="80" width="110" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="87" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">i=0</text>
    <text x="87" y="119" text-anchor="middle" font-size="9.5" fill="#446688">nums=10</text>

    <rect x="158" y="92" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="111" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">0 : 10</text>

    <text x="372" y="92" font-size="9.8" fill="#444">窗口 [−2, −1] 空 → best = 0</text>
    <text x="372" y="108" font-size="9.8" fill="#444">dp[0] = 10 + max(0, 0) = 10</text>
    <text x="372" y="124" font-size="9.8" fill="#444">0 号入队（供后续查询）</text>

    <rect x="588" y="88" width="84" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="630" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="146" width="652" height="74" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="158" width="110" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="87" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">i=1</text>
    <text x="87" y="197" text-anchor="middle" font-size="9.5" fill="#446688">nums=−2</text>

    <rect x="158" y="170" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="189" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">0 : 10</text>
    <rect x="226" y="170" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="258" y="189" text-anchor="middle" font-size="10.5" fill="#555">1 : 8</text>

    <text x="372" y="170" font-size="9.8" fill="#444">best = dp[0] = 10</text>
    <text x="372" y="186" font-size="9.8" fill="#444">dp[1] = −2 + 10 = 8</text>
    <text x="372" y="202" font-size="9.8" fill="#444">dp[0] = 10 &gt; 8，不弹尾；1 号入队</text>

    <rect x="588" y="166" width="84" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="630" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="224" width="652" height="74" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
    <rect x="32" y="236" width="110" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="87" y="257" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">i=2</text>
    <text x="87" y="275" text-anchor="middle" font-size="9.5" fill="#446688">nums=−10</text>

    <rect x="158" y="248" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">0 : 10</text>
    <rect x="226" y="248" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="258" y="267" text-anchor="middle" font-size="10.5" fill="#555">1 : 8</text>
    <rect x="294" y="248" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="326" y="267" text-anchor="middle" font-size="10.5" fill="#555">2 : 0</text>

    <text x="372" y="248" font-size="9.8" font-weight="bold" fill="#b85450">队头 0 ≥ 2−2 = 0，不过期 ✓</text>
    <text x="372" y="264" font-size="9.8" fill="#b85450">距离恰为 k = 2 仍合法；best = 10</text>
    <text x="372" y="280" font-size="9.8" fill="#444">dp[2] = −10 + 10 = 0；入队</text>

    <rect x="588" y="244" width="84" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="630" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="302" width="652" height="74" rx="6" fill="#fce4ec" opacity="0.55" stroke="#b85450" stroke-width="1.4"/>
    <rect x="32" y="314" width="110" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="87" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">i=3</text>
    <text x="87" y="353" text-anchor="middle" font-size="9.5" fill="#446688">nums=−5</text>

    <rect x="158" y="326" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="190" y="345" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">1 : 8</text>
    <rect x="226" y="326" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="258" y="345" text-anchor="middle" font-size="10.5" fill="#555">3 : 3</text>

    <text x="372" y="326" font-size="9.8" font-weight="bold" fill="#b85450">队头 0 &lt; 3−2 = 1 → 过期弹出 0</text>
    <text x="372" y="342" font-size="9.8" fill="#444">best = dp[1] = 8；dp[3] = −5 + 8 = 3</text>
    <text x="372" y="358" font-size="9.8" fill="#444">弹尾 2:0 ≤ 3；3 号入队</text>

    <rect x="588" y="322" width="84" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="630" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">ans = 10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="380" width="652" height="74" rx="6" fill="#fce4ec" opacity="0.55" stroke="#b85450" stroke-width="1.4"/>
    <rect x="32" y="392" width="110" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="87" y="413" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">i=4</text>
    <text x="87" y="431" text-anchor="middle" font-size="9.5" fill="#446688">nums=20</text>

    <rect x="158" y="404" width="64" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="190" y="423" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a3a">4 : 23</text>

    <text x="372" y="404" font-size="9.8" font-weight="bold" fill="#b85450">队头 1 &lt; 4−2 = 2 → 过期弹出 1</text>
    <text x="372" y="420" font-size="9.8" fill="#444">best = dp[3] = 3；dp[4] = 20 + 3 = 23</text>
    <text x="372" y="436" font-size="9.8" font-weight="bold" fill="#b85450">弹尾 3:3 ≤ 23；ans 更新为 23</text>

    <rect x="588" y="400" width="84" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="630" y="422" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">ans = 23</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="460" width="652" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="350" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">答案 = 23：dp = [10, 8, 0, 3, 23]，子序列 [10, −2, −5, 20]（下标 0→1→3→4，相邻间距 1、2、1 ≤ 2）</text>
  </g>
</svg>
