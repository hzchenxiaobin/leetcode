<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#fdfcf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">回溯三叉树与剪枝：基料 ¥7，配料 [¥3, ¥4]，target = 10</text>
  <text x="430" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">进入节点先记录候选；cur ≥ target 立即剪枝 ✂</text>

  <g filter="url(#sk)">
    <rect x="374" y="62" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="400" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4c6e" filter="url(#sk)">7</text>
  <text x="400" y="89" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#sk)">d=3</text>

  <g filter="url(#sk)">
    <path d="M 400 94 L 154 154" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 94 L 400 154" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 94 L 646 154" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="258" y="116" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+0</text>
  <text x="414" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">+3</text>
  <text x="542" y="116" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+6</text>

  <g filter="url(#sk)">
    <rect x="124" y="158" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="374" y="158" width="52" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="624" y="158" width="52" height="32" rx="6" fill="#fdf2f4" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
  </g>
  <text x="150" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4c6e" filter="url(#sk)">7</text>
  <text x="150" y="185" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#sk)">d=3</text>
  <text x="400" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">10</text>
  <text x="400" y="185" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#sk)">d=0</text>
  <text x="455" y="172" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">← d = 0，命中 target！</text>
  <text x="650" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">13</text>
  <text x="650" y="185" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">d=3</text>
  <text x="682" y="168" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="650" y="215" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#sk)">子树整棵省略</text>

  <g filter="url(#sk)">
    <path d="M 150 190 L 79 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 150 190 L 150 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 150 190 L 221 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 190 L 314 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 190 L 400 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 400 190 L 486 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="95" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+0</text>
  <text x="163" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+4</text>
  <text x="205" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+8</text>
  <text x="338" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+0</text>
  <text x="413" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+4</text>
  <text x="462" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">+8</text>

  <g filter="url(#sk)">
    <rect x="49" y="286" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="124" y="286" width="52" height="32" rx="6" fill="#fdf2f4" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
    <rect x="199" y="286" width="52" height="32" rx="6" fill="#fdf2f4" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
    <rect x="284" y="286" width="52" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="286" width="52" height="32" rx="6" fill="#fdf2f4" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
    <rect x="464" y="286" width="52" height="32" rx="6" fill="#fdf2f4" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3"/>
  </g>
  <text x="75" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4c6e" filter="url(#sk)">7</text>
  <text x="75" y="313" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#sk)">d=3</text>
  <text x="150" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">11</text>
  <text x="150" y="313" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">d=1</text>
  <text x="178" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="225" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">15</text>
  <text x="225" y="313" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">d=5</text>
  <text x="253" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="310" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">10</text>
  <text x="310" y="313" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#sk)">d=0</text>
  <text x="400" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">14</text>
  <text x="400" y="313" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">d=4</text>
  <text x="428" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="490" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">18</text>
  <text x="490" y="313" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#sk)">d=8</text>
  <text x="518" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✂</text>

  <path d="M 775 58 L 775 350" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4,4" fill="none" filter="url(#sk)"/>
  <text x="816" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">选基料</text>
  <text x="816" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">配料0 ¥3</text>
  <text x="816" y="298" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">配料1 ¥4</text>
  <text x="816" y="338" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">各 0/1/2 份</text>
  <text x="816" y="384" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#sk)">绿 = 命中最优</text>
  <text x="816" y="404" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">红虚 ✂ = 剪枝</text>
  <text x="816" y="424" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">蓝 = 继续分支</text>

  <g filter="url(#sk)">
    <rect x="36" y="380" width="420" height="64" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="246" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">剪枝安全性：后代成本 c ≥ cur ≥ target</text>
  <text x="246" y="420" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">距离只会更大；等距时成本相同，并列还取更低</text>
  <text x="246" y="438" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">→ 子树中不存在更优候选，剪掉不丢解</text>

  <text x="430" y="462" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">最坏 O(n·3^m) ≈ 5.9×10⁵ 个节点（n, m ≤ 10），剪枝后实际访问远少于此；基料 ¥1 的另一棵树同理</text>
</svg>
