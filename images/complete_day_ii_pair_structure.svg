<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">24 个余数桶的配对结构</text>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">上行：余数 r ｜ 下行：其补集 24−r（上下对齐即配对）</text>

  <!-- self-pair buckets -->
  <rect x="36" y="112" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="59" y="135" text-anchor="middle" font-size="15" fill="#7c2b28" filter="url(#rough2)">0</text>
  <path d="M72,108 C96,92 104,128 76,138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="36" y="216" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="59" y="239" text-anchor="middle" font-size="15" fill="#7c2b28" filter="url(#rough2)">12</text>
  <path d="M72,212 C96,196 104,232 76,242" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- column pair arrows -->
  <path d="M128,152 L128,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M164,152 L164,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M200,152 L200,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M236,152 L236,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M272,152 L272,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M308,152 L308,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M344,152 L344,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M380,152 L380,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M416,152 L416,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M452,152 L452,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M488,152 L488,214" stroke="#8a8a8a" stroke-width="1.6" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- top row: r = 1..11 -->
  <rect x="112" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">1</text>
  <rect x="148" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">2</text>
  <rect x="184" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">3</text>
  <rect x="220" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">4</text>
  <rect x="256" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">5</text>
  <rect x="292" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">6</text>
  <rect x="328" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">7</text>
  <rect x="364" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">8</text>
  <rect x="400" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="416" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">9</text>
  <rect x="436" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="452" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">10</text>
  <rect x="472" y="112" width="32" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="135" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">11</text>

  <!-- bottom row: 23,22,...,13 -->
  <rect x="112" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="128" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">23</text>
  <rect x="148" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">22</text>
  <rect x="184" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">21</text>
  <rect x="220" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">20</text>
  <rect x="256" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="272" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">19</text>
  <rect x="292" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="308" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">18</text>
  <rect x="328" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="344" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">17</text>
  <rect x="364" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="380" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">16</text>
  <rect x="400" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="416" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">15</text>
  <rect x="436" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="452" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">14</text>
  <rect x="472" y="216" width="32" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">13</text>

  <!-- summary box -->
  <rect x="55" y="288" width="410" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="13" fill="#7c2b28" filter="url(#rough2)">自配对（r = 0、12）：桶内两两配，贡献 C(cnt, 2)</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">互补对（r 与 24−r）：两桶交叉配，贡献 cnt[r] × cnt[24−r]</text>
  <text x="260" y="360" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">统一公式：补集 = (24 − r) mod 24（r=0 不越界，r=12 指向自己）</text>
</svg>
