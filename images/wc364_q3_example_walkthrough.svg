<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：单调栈求 left（h = [6, 5, 3, 9, 2, 7]）</text>
  <text x="340" y="47" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">橙框 = 刚入栈的 i；蓝框 = 栈内旧元素（栈内 h 值非递减）</text>

  <!-- ================= row 1 ================= -->
  <!-- panel i=0 -->
  <rect x="30" y="55" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="128" y="77" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 0，h = 6</text>
    <text x="128" y="97" font-size="11" fill="#888">（栈空，无需弹栈）</text>
    <text x="128" y="116" font-size="11" fill="#555">j = −1（哨兵）</text>
    <text x="128" y="135" font-size="11.5" font-weight="bold" fill="#446688">L₀ = 6 × 1 = 6</text>
  </g>
  <text x="108" y="141" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="108" y="148" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="128" y="161" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">6</text>

  <path d="M 231 132 L 247 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- panel i=1 -->
  <rect x="252" y="55" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="350" y="77" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 1，h = 5</text>
    <text x="350" y="97" font-size="11" fill="#b85450">弹出 6（6 &gt; 5）</text>
    <text x="350" y="116" font-size="11" fill="#555">j = −1（哨兵）</text>
    <text x="350" y="135" font-size="11.5" font-weight="bold" fill="#446688">L₁ = 5 × 2 = 10</text>
  </g>
  <text x="330" y="141" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="330" y="148" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="350" y="161" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">5</text>

  <path d="M 453 132 L 469 132" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- panel i=2 -->
  <rect x="474" y="55" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="572" y="77" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 2，h = 3</text>
    <text x="572" y="97" font-size="11" fill="#b85450">弹出 5（5 &gt; 3）</text>
    <text x="572" y="116" font-size="11" fill="#555">j = −1（哨兵）</text>
    <text x="572" y="135" font-size="11.5" font-weight="bold" fill="#446688">L₂ = 3 × 3 = 9</text>
  </g>
  <text x="552" y="141" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="552" y="148" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="572" y="161" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">3</text>

  <!-- ================= row 2 ================= -->
  <!-- panel i=3 -->
  <rect x="30" y="225" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="128" y="247" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 3，h = 9</text>
    <text x="128" y="267" font-size="11" fill="#4a7a3a">3 &lt; 9，不弹</text>
    <text x="128" y="286" font-size="11" fill="#555">j = 2</text>
    <text x="128" y="305" font-size="11.5" font-weight="bold" fill="#446688">L₃ = 9 + 9 × 1 = 18</text>
  </g>
  <text x="66" y="311" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="108" y="318" width="40" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="128" y="331" text-anchor="middle" font-size="11" fill="#2b3a52" filter="url(#sk)">3</text>
  <rect x="108" y="296" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="128" y="309" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">9</text>

  <path d="M 231 302 L 247 302" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- panel i=4 -->
  <rect x="252" y="225" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="350" y="247" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 4，h = 2</text>
    <text x="350" y="267" font-size="11" fill="#b85450">弹出 9、3（都 &gt; 2）</text>
    <text x="350" y="286" font-size="11" fill="#555">j = −1（哨兵）</text>
    <text x="350" y="305" font-size="11.5" font-weight="bold" fill="#446688">L₄ = 2 × 5 = 10</text>
  </g>
  <text x="330" y="311" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="330" y="318" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="350" y="331" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">2</text>

  <path d="M 453 302 L 469 302" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- panel i=5 -->
  <rect x="474" y="225" width="196" height="155" rx="9" fill="#fdfdfd" stroke="#c8c8c8" stroke-width="1.3" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="572" y="247" font-size="12.5" font-weight="bold" fill="#2b2b2b">i = 5，h = 7</text>
    <text x="572" y="267" font-size="11" fill="#4a7a3a">2 &lt; 7，不弹</text>
    <text x="572" y="286" font-size="11" fill="#555">j = 4</text>
    <text x="572" y="305" font-size="11.5" font-weight="bold" fill="#446688">L₅ = 10 + 7 × 1 = 17</text>
  </g>
  <text x="510" y="311" font-size="10" fill="#999" filter="url(#sk)">栈：</text>
  <rect x="552" y="318" width="40" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="572" y="331" text-anchor="middle" font-size="11" fill="#2b3a52" filter="url(#sk)">2</text>
  <rect x="552" y="296" width="40" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="572" y="309" text-anchor="middle" font-size="11" fill="#8a6520" filter="url(#sk)">7</text>

  <!-- ================= bottom merge strip ================= -->
  <rect x="30" y="390" width="640" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" opacity="0.35" filter="url(#sk)"/>
  <text x="350" y="412" text-anchor="middle" font-size="11.5" fill="#2b3a52" filter="url(#sk)">反向扫描同理得 right = [21, 15, 10, 13, 4, 7]，合并 left[i] + right[i] − h[i]（峰只计一次）：</text>

  <g filter="url(#sk)">
    <rect x="74"  y="424" width="52" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="174" y="424" width="52" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="274" y="424" width="52" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="374" y="424" width="52" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="474" y="424" width="52" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="574" y="424" width="52" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="100" y="442" font-size="12" fill="#2b3a52">21</text>
    <text x="200" y="442" font-size="12" fill="#2b3a52">20</text>
    <text x="300" y="442" font-size="12" fill="#2b3a52">16</text>
    <text x="400" y="442" font-size="12.5" font-weight="bold" fill="#b85450">22 ★</text>
    <text x="500" y="442" font-size="12" fill="#2b3a52">12</text>
    <text x="600" y="442" font-size="12" fill="#2b3a52">17</text>
    <text x="100" y="466" font-size="10" fill="#666">i=0</text>
    <text x="200" y="466" font-size="10" fill="#666">i=1</text>
    <text x="300" y="466" font-size="10" fill="#666">i=2</text>
    <text x="400" y="466" font-size="10" font-weight="bold" fill="#8a6520">峰 i=3</text>
    <text x="500" y="466" font-size="10" fill="#666">i=4</text>
    <text x="600" y="466" font-size="10" fill="#666">i=5</text>
    <text x="350" y="484" font-size="11.5" font-weight="bold" fill="#2b2b2b">→ 答案 22：塔形 [3, 3, 3, 9, 2, 2]</text>
  </g>
</svg>
