<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：无限集 = 连续尾 [cur, ∞) ∪ 回收堆 S</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><path d="M 293 50 L 293 84" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)"/></g>
  <text x="305" y="68" text-anchor="start" font-size="14" font-weight="bold" fill="#a03a3a" filter="url(#sk)">cur = 4</text>

  <g filter="url(#sk)"><rect x="80" y="88" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="107" y="116" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="142" y="88" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="169" y="116" text-anchor="middle" font-size="14" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="204" y="88" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="231" y="116" text-anchor="middle" font-size="14" fill="#a03a3a" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="266" y="88" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/></g>
  <text x="293" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="328" y="88" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="355" y="116" text-anchor="middle" font-size="14" fill="#2b4a68" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="390" y="88" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="417" y="116" text-anchor="middle" font-size="14" fill="#2b4a68" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="452" y="88" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="479" y="116" text-anchor="middle" font-size="14" fill="#2b4a68" filter="url(#sk)">7</text>
  <text x="524" y="116" text-anchor="middle" font-size="20" fill="#2b4a68" filter="url(#sk)">…</text>

  <path d="M 80 146 Q 169 153 258 146" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="169" y="168" text-anchor="middle" font-size="12.5" fill="#a03a3a" filter="url(#sk)">已弹出过的数（都 &lt; cur）</text>
  <path d="M 266 146 Q 411 153 556 146" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="411" y="168" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#sk)">连续尾：从未被弹出，仍在集合中</text>

  <g filter="url(#sk)"><rect x="100" y="180" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="122" y="193" text-anchor="start" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">在 S 中（已加回）</text>
  <g filter="url(#sk)"><rect x="280" y="180" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="302" y="193" text-anchor="start" font-size="11.5" fill="#a03a3a" filter="url(#sk)">弹出未加回 → 缺席</text>
  <g filter="url(#sk)"><rect x="460" y="180" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="482" y="193" text-anchor="start" font-size="11.5" fill="#2b4a68" filter="url(#sk)">在连续尾中</text>

  <g filter="url(#sk)"><rect x="30" y="212" width="300" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="180" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">回收堆 S：离散的“加回”元素</text>
  <g filter="url(#sk)"><rect x="62" y="254" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="77" y="274" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="100" y="254" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="115" y="274" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="150" y="274" text-anchor="start" font-size="12.5" fill="#333" filter="url(#sk)">当前 S = {1, 2}</text>
  <text x="180" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">元素全部 &lt; cur，天然有序去重</text>
  <text x="180" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">候选最小值 = min(S)</text>

  <g filter="url(#sk)"><rect x="350" y="212" width="300" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="500" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">连续尾 [cur, ∞)：集合主体</text>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">从未被弹出，天然连续</text>
  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">一个 int 指针 cur 即 O(1) 表示</text>
  <text x="500" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">pop 时吃掉最前端：cur += 1</text>
  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">cur 只增不减</text>

  <g filter="url(#sk)"><rect x="110" y="358" width="460" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="340" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a3a" filter="url(#sk)">popSmallest( ) = min( min(S) , cur )</text>
  <text x="340" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">addBack(num)：仅当 num &lt; cur 且 num ∉ S 时入堆</text>
</svg>
