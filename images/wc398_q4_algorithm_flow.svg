<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/></marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：枚举向上次数 x，解出向下次数 y，组合数累加</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">k ≤ 10⁹ 时有效 x ≤ 29，枚举到 31 只是保险；非零项极少，通常只有 1~3 个 x 有贡献</text>

  <!-- 开始 -->
  <rect x="90" y="54" width="180" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="180" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">ans = 0</text>

  <path d="M 180 80 V 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- 取 x -->
  <rect x="90" y="96" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="180" y="113" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">取下一个 x（0,1,2,…,31）</text>

  <path d="M 180 122 V 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- 解 y -->
  <rect x="90" y="138" width="180" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="180" y="155" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">y = (1LL &lt;&lt; x) − k</text>

  <path d="M 180 164 V 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- 判断 1 -->
  <polygon points="180,180 262,214 180,248 98,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="180" y="218" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#r)">0 ≤ y ≤ x+1？</text>

  <!-- 否：跳过 -->
  <text x="268" y="209" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#r)">否</text>
  <path d="M 262 214 H 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <rect x="300" y="200" width="150" height="28" rx="4" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#r)"/>
  <text x="375" y="218" text-anchor="middle" font-size="10" fill="#666" filter="url(#r)">跳过：该 x 贡献 0</text>

  <!-- 是：累加 -->
  <text x="188" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#r)">是</text>
  <path d="M 180 248 V 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>

  <rect x="68" y="268" width="224" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="180" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">ans += C(x+1, y)</text>
  <text x="180" y="306" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">x+1 个空档中选 y 个；边乘边除求组合数</text>

  <path d="M 180 312 V 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>

  <!-- 判断 2 -->
  <polygon points="180,328 254,360 180,392 106,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="180" y="364" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#r)">x = 31？</text>

  <!-- 是：回边 -->
  <text x="74" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#r)">是</text>
  <path d="M 106 360 L 44 360 L 44 109 L 86 109" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="52" y="134" font-size="9.5" fill="#888" filter="url(#r)">换下一个 x</text>

  <!-- 否：返回 -->
  <text x="188" y="404" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#r)">否</text>
  <path d="M 180 392 V 406" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#r)"/>
  <rect x="115" y="408" width="130" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="180" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">返回 ans</text>

  <!-- 跳过框回边 -->
  <path d="M 375 228 L 375 109 L 274 109" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#r)"/>
  <text x="383" y="172" font-size="9.5" fill="#888" filter="url(#r)">换下一个 x</text>

  <!-- 侧注 -->
  <rect x="470" y="196" width="155" height="180" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="547" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#r)">为什么到 31 就够？</text>
  <text x="482" y="246" font-size="10" fill="#666" filter="url(#r)">非零项要求</text>
  <text x="482" y="266" font-size="10" fill="#666" filter="url(#r)">2ˣ ≤ k + x + 1 ≤ 10⁹+31</text>
  <text x="482" y="286" font-size="10" fill="#666" filter="url(#r)">而 2³⁰ ≈ 1.07×10⁹</text>
  <text x="482" y="306" font-size="10" fill="#666" filter="url(#r)">⟹ x ≥ 30 必败，x ≤ 29</text>
  <text x="482" y="330" font-size="10" fill="#666" filter="url(#r)">另：2 的幂指数稀疏，</text>
  <text x="482" y="350" font-size="10" fill="#666" filter="url(#r)">窗口 [k, k+32] 内通常</text>
  <text x="482" y="370" font-size="10" fill="#666" filter="url(#r)">只有 1 个（k=1 才有 3 个）</text>

  <!-- 复杂度条 -->
  <rect x="40" y="440" width="560" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="320" y="456" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">时间 O(log²k)：32 个 x × 每个 O(x) ≤ 30 步乘除；空间 O(1)，无预处理表</text>
</svg>
