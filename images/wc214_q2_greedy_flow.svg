<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 478" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="478" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：降序排频次，逐个压进不重复的槽</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">初始化：freq[26] ← 一趟计数；降序排序后 prev ← +∞，deletions ← 0</text>

  <!-- 右侧注记：为什么降序 -->
  <g filter="url(#rough2)">
    <rect x="470" y="74" width="152" height="104" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="546" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么降序？</text>
  <text x="546" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">大频次先占高槽</text>
  <text x="546" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">冲突只压一格</text>
  <text x="546" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一格都不多删</text>
  <text x="546" y="172" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">升序会逼大频次大砍</text>

  <!-- 取频次 -->
  <g filter="url(#rough2)">
    <rect x="225" y="74" width="190" height="34" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  </g>
  <text x="320" y="96" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个非零频次 f</text>
  <path d="M 320 108 L 320 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 压槽 -->
  <g filter="url(#rough2)">
    <rect x="180" y="122" width="280" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">target ← min(f, prev − 1)</text>
  <text x="320" y="157" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">能保住就保住；冲突就压到前一个的下一档</text>
  <path d="M 320 166 L 320 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：压穿 0？ -->
  <g filter="url(#rough2)">
    <polygon points="320,180 402,212 320,244 238,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">target &lt; 0 ?</text>

  <!-- 是：截断为 0 -->
  <path d="M 402 212 L 464 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="416" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="470" y="192" width="152" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="546" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">target ← 0</text>
  <text x="546" y="225" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">压穿底线：字符删光</text>
  <path d="M 546 232 L 546 280 L 466 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：计删除 -->
  <path d="M 320 244 L 320 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="253" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="180" y="258" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">deletions += f − target</text>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">prev ← target</text>
  <path d="M 320 302 L 320 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有频次？ -->
  <g filter="url(#rough2)">
    <polygon points="320,314 400,344 320,374 240,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">还有频次？</text>

  <!-- 是：循环 -->
  <path d="M 240 344 L 138 344 L 138 91 L 219 91" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>

  <!-- 否：返回 -->
  <path d="M 320 374 L 320 386" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="386" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="170" y="390" width="300" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 deletions</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="438" width="560" height="34" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="459" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">prev 单调不增：一旦压穿 0，其后字符全部删光；总删除数 ≤ n ≤ 10⁵，int 不溢出</text>
</svg>
