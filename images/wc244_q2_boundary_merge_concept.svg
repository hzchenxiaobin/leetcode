<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：降序排列，跨一条值边界就加一次「左侧元素数」</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- descending sorted blocks -->
  <text x="52" y="88" font-size="12" fill="#888">降序排序后</text>
  <g filter="url(#sk)">
    <rect x="70" y="66" width="52" height="40" rx="4" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="130" y="66" width="52" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="190" y="66" width="52" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="250" y="66" width="52" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="310" y="66" width="52" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="96" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">3</text>
  <text x="156" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="216" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="276" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="336" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- boundary lines -->
  <g filter="url(#sk)">
    <path d="M 126 58 L 126 148" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M 306 58 L 306 148" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="126" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">边界① 3|2</text>
  <text x="306" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">边界② 2|1</text>

  <!-- boundary contribution badges -->
  <g filter="url(#sk)">
    <rect x="82" y="158" width="96" height="30" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="130" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">ans += 1</text>
  <text x="130" y="204" text-anchor="middle" font-size="10.5" fill="#888">左侧 1 个元素</text>

  <g filter="url(#sk)">
    <rect x="262" y="158" width="96" height="30" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="310" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">ans += 3</text>
  <text x="310" y="204" text-anchor="middle" font-size="10.5" fill="#888">左侧 3 个元素</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="420" y="66" width="216" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="528" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">换值即跨边界（降序）</text>
  <text x="528" y="120" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">ans = Σ i·[nums[i]≠nums[i-1]]</text>
  <text x="528" y="144" text-anchor="middle" font-size="12" fill="#888">= 1 + 3 = 4</text>
  <text x="528" y="182" text-anchor="middle" font-size="10.5" fill="#888">i：换值位置左侧的元素个数</text>

  <!-- divider -->
  <path d="M 60 224 Q 340 232 620 224" stroke="#cccccc" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="340" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">另一视角：每个元素沿相邻层「逐级下跳」，跳一次 = 一次操作</text>

  <!-- ladder lanes -->
  <text x="128" y="286" text-anchor="end" font-size="12" font-weight="bold" fill="#7a5415">值 3（第2层）</text>
  <text x="128" y="336" text-anchor="end" font-size="12" font-weight="bold" fill="#2b6e9e">值 2（第1层）</text>
  <text x="128" y="386" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">值 1（第0层）</text>
  <g filter="url(#sk)">
    <path d="M 140 280 Q 350 284 560 280" stroke="#d8c9a3" stroke-width="1.6" fill="none"/>
    <path d="M 140 330 Q 350 334 560 330" stroke="#a8c4e0" stroke-width="1.6" fill="none"/>
    <path d="M 140 380 Q 350 384 560 380" stroke="#a3cdb0" stroke-width="1.6" fill="none"/>
  </g>

  <!-- elements on lanes -->
  <g filter="url(#sk)">
    <circle cx="200" cy="280" r="11" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.8"/>
    <circle cx="290" cy="330" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <circle cx="340" cy="330" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <circle cx="450" cy="380" r="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <circle cx="500" cy="380" r="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="200" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">3</text>
  <text x="290" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="340" y="335" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="450" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="500" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1</text>

  <!-- descent arrows (one per operation) -->
  <g filter="url(#sk)">
    <path d="M 200 293 L 200 316" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 200 343 L 200 366" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 290 343 L 290 366" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 340 343 L 340 366" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="164" y="312" text-anchor="middle" font-size="10" fill="#b03a3a">①</text>
  <text x="164" y="362" text-anchor="middle" font-size="10" fill="#b03a3a">②</text>
  <text x="272" y="362" text-anchor="middle" font-size="10" fill="#b03a3a">③</text>
  <text x="376" y="362" text-anchor="middle" font-size="10" fill="#b03a3a">④</text>

  <!-- ghost landing spot for the descended 3 -->
  <g filter="url(#sk)">
    <circle cx="200" cy="330" r="11" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <!-- verdict -->
  <g filter="url(#sk)">
    <rect x="552" y="316" width="112" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="608" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">箭头共 4 支</text>
  <text x="608" y="351" text-anchor="middle" font-size="11" fill="#2e6e2e">= 答案 4 ✓</text>
  <text x="450" y="412" text-anchor="middle" font-size="10.5" fill="#888">第 0 层的元素从不上跳也不下跳：0 次操作；一次只动「一个」元素，同层各自单独跳</text>
</svg>
