<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = “lEetcOde” → “lEOtcede”</text>

  <!-- 原串 -->
  <g filter="url(#rough2)">
    <text x="60" y="66" font-size="13" fill="#555">原串（下标 0~7）：</text>
    <g>
      <rect x="170" y="46" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="190" y="72" text-anchor="middle" font-size="15" fill="#333">l</text>
      <rect x="210" y="46" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="230" y="72" text-anchor="middle" font-size="15" fill="#b85450">E</text>
      <rect x="250" y="46" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="270" y="72" text-anchor="middle" font-size="15" fill="#b85450">e</text>
      <rect x="290" y="46" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="310" y="72" text-anchor="middle" font-size="15" fill="#333">t</text>
      <rect x="330" y="46" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="350" y="72" text-anchor="middle" font-size="15" fill="#333">c</text>
      <rect x="370" y="46" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="390" y="72" text-anchor="middle" font-size="15" fill="#b85450">O</text>
      <rect x="410" y="46" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="430" y="72" text-anchor="middle" font-size="15" fill="#333">d</text>
      <rect x="450" y="46" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="470" y="72" text-anchor="middle" font-size="15" fill="#b85450">e</text>
    </g>
    <g font-size="10" fill="#888">
      <text x="190" y="100" text-anchor="middle">0</text>
      <text x="230" y="100" text-anchor="middle">1</text>
      <text x="270" y="100" text-anchor="middle">2</text>
      <text x="310" y="100" text-anchor="middle">3</text>
      <text x="350" y="100" text-anchor="middle">4</text>
      <text x="390" y="100" text-anchor="middle">5</text>
      <text x="430" y="100" text-anchor="middle">6</text>
      <text x="470" y="100" text-anchor="middle">7</text>
    </g>
  </g>

  <!-- 收集与排序 -->
  <g filter="url(#rough2)">
    <rect x="36" y="118" width="448" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="144" font-size="13" fill="#4a7a3a">元音位置固定：1、2、5、7；收集到的元音序列：</text>
    <text x="66" y="170" font-size="14" fill="#333">收集：[</text>
    <text x="110" y="170" font-size="14" fill="#b85450">E</text>
    <text x="128" y="170" font-size="14" fill="#333">,</text>
    <text x="142" y="170" font-size="14" fill="#b85450">e</text>
    <text x="160" y="170" font-size="14" fill="#333">,</text>
    <text x="174" y="170" font-size="14" fill="#b85450">O</text>
    <text x="192" y="170" font-size="14" fill="#333">,</text>
    <text x="206" y="170" font-size="14" fill="#b85450">e</text>
    <text x="224" y="170" font-size="14" fill="#333">]</text>
    <text x="66" y="198" font-size="14" fill="#333">排序：[</text>
    <text x="110" y="198" font-size="14" fill="#b85450">E</text>
    <text x="128" y="198" font-size="14" fill="#333">,</text>
    <text x="142" y="198" font-size="14" fill="#b85450">O</text>
    <text x="160" y="198" font-size="14" fill="#333">,</text>
    <text x="174" y="198" font-size="14" fill="#b85450">e</text>
    <text x="192" y="198" font-size="14" fill="#333">,</text>
    <text x="206" y="198" font-size="14" fill="#b85450">e</text>
    <text x="224" y="198" font-size="14" fill="#333">]（69 &lt; 79 &lt; 101）</text>
  </g>

  <!-- 回填结果 -->
  <g filter="url(#rough2)">
    <rect x="36" y="228" width="448" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="254" font-size="13" fill="#8a6d1f">回填到位置 1、2、5、7：</text>
    <g>
      <rect x="170" y="264" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="190" y="290" text-anchor="middle" font-size="15" fill="#333">l</text>
      <rect x="210" y="264" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="230" y="290" text-anchor="middle" font-size="15" fill="#1d5c1a">E</text>
      <rect x="250" y="264" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="270" y="290" text-anchor="middle" font-size="15" fill="#1d5c1a">O</text>
      <rect x="290" y="264" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="310" y="290" text-anchor="middle" font-size="15" fill="#333">t</text>
      <rect x="330" y="264" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="350" y="290" text-anchor="middle" font-size="15" fill="#333">c</text>
      <rect x="370" y="264" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="390" y="290" text-anchor="middle" font-size="15" fill="#1d5c1a">e</text>
      <rect x="410" y="264" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <text x="430" y="290" text-anchor="middle" font-size="15" fill="#333">d</text>
      <rect x="450" y="264" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="470" y="290" text-anchor="middle" font-size="15" fill="#1d5c1a">e</text>
    </g>
    <text x="260" y="336" text-anchor="middle" font-size="13" fill="#333">输出 “lEOtcede”：辅音 l、t、c、d 原位未动 ✓</text>
  </g>
</svg>
