<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">关键观察：整条隐藏数组 = 定差折线整体上下平移</text>

  <!-- 坐标区 -->
  <g filter="url(#rough2)">
    <rect x="50" y="46" width="460" height="200" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="6"/>
  </g>
  <!-- lower/upper 横线 -->
  <g filter="url(#rough2)">
    <path d="M 60 76 L 500 76" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="8 5"/>
    <path d="M 60 216 L 500 216" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="8 5"/>
  </g>
  <text x="492" y="68" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="end">upper</text>
  <text x="492" y="232" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="end">lower</text>

  <!-- 折线1：高位（合法） -->
  <g filter="url(#rough2)">
    <path d="M 80 110 L 140 90 L 200 130 L 260 100 L 320 150 L 380 120" fill="none" stroke="#446688" stroke-width="2.5"/>
  </g>
  <!-- 折线2：中位（合法） -->
  <g filter="url(#rough2)">
    <path d="M 80 146 L 140 126 L 200 166 L 260 136 L 320 186 L 380 156" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <!-- 折线3：低位（非法，低于 lower） -->
  <g filter="url(#rough2)">
    <path d="M 80 226 L 140 206 L 200 246 L 260 216 L 320 266 L 380 236" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="390" y="112">x = hidden[0] 合法上限</text>
    <text x="390" y="150">x 再小一档仍合法（步进平移）</text>
  </g>
  <text x="390" y="250" font-size="12" fill="#b85450" filter="url(#rough2)">x 太小 → 峰谷穿出 lower ✗</text>

  <!-- 平移箭头 -->
  <g filter="url(#rough2)">
    <path d="M 240 236 C 240 260, 160 260, 152 232" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)"/>
  </g>
  <text x="196" y="268" font-size="11.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">整条折线只能刚性平移</text>

  <!-- 极差标注 -->
  <g filter="url(#rough2)">
    <path d="M 320 106 L 320 190" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  </g>
  <text x="348" y="146" font-size="12.5" fill="#d6a040" filter="url(#rough2)">range = mx − mn</text>
  <text x="348" y="164" font-size="11.5" fill="#666" filter="url(#rough2)">（与 x 无关的定值）</text>

  <!-- 底部公式区 -->
  <g filter="url(#rough2)">
    <rect x="50" y="270" width="460" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="296" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">可行起点 x 的个数</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="280" y="322">ans = (upper − lower + 1) − (mx − mn)</text>
    <text x="280" y="348">窗口高 − 折线极差；负数说明怎么平移都放不下 → 0</text>
  </g>
</svg>
