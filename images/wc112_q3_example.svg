<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="336" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">示例 2：两个分量，各留一块</text>
  <rect x="85" y="52" width="200" height="190" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分量 A：4 块</text>
  <circle cx="139" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="139" y="135" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">行</text>
  <circle cx="231" cy="130" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="231" y="135" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">列</text>
  <path d="M 155 122 L 215 122" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 155 122 L 215 122" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="185" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">可移除 3 块</text>
  <text x="185" y="196" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">留 1 块作为「根」</text>
  <rect x="330" y="52" width="200" height="190" rx="10" fill="#f0f0f0" stroke="#888888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="74" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">分量 B：1 块</text>
  <circle cx="384" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="384" y="135" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">行</text>
  <circle cx="476" cy="130" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="476" y="135" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">列</text>
  <path d="M 400 122 L 460 122" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">可移除 0 块</text>
  <text x="430" y="196" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">留 1 块作为「根」</text>
  <text x="300" y="268" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">石头 [[0,0],[0,2],[1,1],[2,0],[2,2]]</text>
  <text x="300" y="292" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">总量 5 块，2 个分量 ⇒ 5 − 2 = 3</text>
  <text x="300" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">孤立点（只有 1 块石头的分量）一块也移不掉</text>
</svg>
