<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">每位一个「可变成集合」：allowed(c) = {c} ∪ 映射像</text>

  <!-- mappings -->
  <text x="130" y="66" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">mappings</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="78" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="100">e → 3</text>
    <rect x="40" y="118" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="140">t → 7</text>
    <rect x="40" y="158" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="180">t → 8</text>
  </g>
  <path d="M 226 95 C 252 95, 272 95, 300 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 226 135 C 254 135, 274 137, 300 139" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 226 175 C 254 175, 276 168, 300 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="82" font-size="11.5" fill="#888" filter="url(#rough2)" text-anchor="middle">old → new</text>

  <!-- 可变成集合 -->
  <text x="425" y="66" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">可变成集合（每位独立选择）</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="310" y="78" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="425" y="100">allowed(e) = { e, 3 }</text>
    <rect x="310" y="122" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="425" y="144">allowed(t) = { t, 7, 8 }</text>
    <rect x="310" y="166" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="425" y="188">allowed(l) = { l }（未出现在 old 中）</text>
  </g>

  <!-- 匹配条件 -->
  <g filter="url(#rough2)">
    <rect x="40" y="228" width="480" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="252" text-anchor="middle">匹配条件（窗口起点 i）：对每个 j 都有</text>
    <text x="280" y="274" text-anchor="middle" font-weight="bold">s[i+j] ∈ allowed(sub[j])</text>
  </g>

  <!-- 底部注意 -->
  <g filter="url(#rough2)">
    <rect x="40" y="304" width="480" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450">
    <text x="280" y="328" text-anchor="middle" font-weight="bold">两个易错点：</text>
    <text x="280" y="348" text-anchor="middle">① 映射不传递：e→3 且 3→8 ≠ e→8（每个字符至多替换一次）</text>
    <text x="280" y="364" text-anchor="middle">② 同一字符的不同出现互相独立：第一个 e 换成 3、第二个 e 保留</text>
  </g>
</svg>
