<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">差分数组：区间加只改两个端点</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对区间 [l, r] 整体加 v  ⇔  diff[l] += v，diff[r+1] -= v</text>

  <text x="44" y="92" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 直接改：每个区间逐点累加（O(len)）</text>

  <rect x="60" y="97" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="114" text-anchor="middle" font-size="9" fill="#7a8aa6" filter="url(#rough2)">航班 1</text>
  <text x="86" y="133" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">0</text>

  <rect x="120" y="97" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="114" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">航班 2</text>
  <text x="146" y="133" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">25</text>

  <rect x="180" y="97" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="206" y="114" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">航班 3</text>
  <text x="206" y="133" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">25</text>

  <rect x="240" y="97" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="266" y="114" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">航班 4</text>
  <text x="266" y="133" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">25</text>

  <rect x="300" y="97" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="326" y="114" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">航班 5</text>
  <text x="326" y="133" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">25</text>

  <path d="M 128 158 L 344 158" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 128 158 L 128 150" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 344 158 L 344 150" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="236" y="174" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#rough2)">一条 [2,5] 加 25 要写 4 个格子</text>

  <text x="44" y="200" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 差分视角：一次区间加只落两个「事件」</text>

  <rect x="60" y="210" width="52" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="86" y="226" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[1]</text>
  <text x="86" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>

  <rect x="120" y="210" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="226" text-anchor="middle" font-size="9" fill="#5a8a48" filter="url(#rough2)">diff[2]</text>
  <text x="146" y="244" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">+25</text>

  <rect x="180" y="210" width="52" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="206" y="226" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[3]</text>
  <text x="206" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>

  <rect x="240" y="210" width="52" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="266" y="226" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[4]</text>
  <text x="266" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>

  <rect x="300" y="210" width="52" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="326" y="226" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">diff[5]</text>
  <text x="326" y="244" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>

  <rect x="360" y="210" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="226" text-anchor="middle" font-size="9" fill="#a86058" filter="url(#rough2)">diff[6]</text>
  <text x="386" y="244" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">-25</text>

  <text x="428" y="232" font-size="9.5" fill="#888" filter="url(#rough2)">6 = n + 1，越界一位</text>
  <text x="428" y="248" font-size="9.5" fill="#888" filter="url(#rough2)">用来「撤销」区间</text>

  <rect x="428" y="86" width="204" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="440" y="106" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">逐点累加的代价</text>
  <text x="440" y="126" font-size="10" fill="#555" filter="url(#rough2)">每条预订 O(len)</text>
  <text x="440" y="146" font-size="10" fill="#555" filter="url(#rough2)">最坏 O(n × m)</text>
  <text x="440" y="166" font-size="10" fill="#555" filter="url(#rough2)">= 2×10^4 × 2×10^4</text>
  <text x="440" y="182" font-size="10" fill="#446688" filter="url(#rough2)">= 4×10^8，超时</text>

  <rect x="428" y="268" width="204" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="440" y="288" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">差分 + 前缀和</text>
  <text x="440" y="308" font-size="10" fill="#555" filter="url(#rough2)">每条预订只改 2 格</text>
  <text x="440" y="328" font-size="10" fill="#555" filter="url(#rough2)">总计 O(n + m)</text>

  <path d="M 110 266 L 110 312" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="286" font-size="10" fill="#777" filter="url(#rough2)">一次前缀和</text>

  <rect x="60" y="318" width="342" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74" y="340" font-size="12" fill="#3a4a66" filter="url(#rough2)">ans[i] = ans[i-1] + diff[i]</text>
  <text x="74" y="360" font-size="9.5" fill="#555" filter="url(#rough2)">diff 的每个位置是「从 i 起生效」的增量</text>

  <text x="330" y="394" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">diff[l] += v：第 l 个航班开始生效；diff[r+1] -= v：第 r+1 个航班起撤销</text>
  <text x="330" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两条事件的时间点不同，故区间内的点共享同一增量，区间外自动归零</text>
  <text x="330" y="430" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">暴力 O(n·m) 太慢，差分把「区间加」降为两次「单点加」</text>
</svg>
