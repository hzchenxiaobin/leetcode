<svg xmlns="http://www.w3.org/2000/svg" width="680" height="408" viewBox="0 0 680 408"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="408" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">走查：n = 6，a = [3, 3, 5, 5, 5]，答案 = 4 + 4 = 8</text>
  <text x="340" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">最大值 n − 1 = 5 的连续段是 [3, 5]，故候选切点为 pos = 3 与 pos = 6</text>
  <rect x="30.0" y="70.0" width="300.0" height="212.0" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350.0" y="70.0" width="300.0" height="212.0" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="95.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">pos = 3（n 在第 3 位）</text>
  <text x="500.0" y="95.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos = 6（n 在最后一位）</text>
  <text x="180.0" y="124.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">钉死：位置 1 → 3，位置 6 → 5</text>
  <text x="180.0" y="150.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">自由：位置 2 上界 3</text>
  <text x="180.0" y="174.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">　　　位置 4、5 上界 5</text>
  <text x="180.0" y="204.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">b = 3：K = 2 − 0 − 0 = 2 → 2</text>
  <text x="180.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">b = 5：K = 4 − 1 − 1 = 2 → 2 × 1</text>
  <text x="180.0" y="262.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献 = 2 × 2 = 4</text>
  <text x="500.0" y="124.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">钉死：位置 1 → 3，位置 3 → 5</text>
  <text x="500.0" y="150.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">自由：位置 2 上界 3</text>
  <text x="500.0" y="174.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">　　　位置 4、5 上界 5</text>
  <text x="500.0" y="204.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">b = 3：K = 2 − 0 − 0 = 2 → 2</text>
  <text x="500.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">b = 5：K = 4 − 1 − 1 = 2 → 2 × 1</text>
  <text x="500.0" y="262.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">贡献 = 2 × 2 = 4</text>
  <text x="340.0" y="304.0" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">两个切点的强制值集合都是 {3, 5}，自由位上界都是 {3, 5, 5}</text>
  <path d="M 60.0 352.0 L 620.0 352.0" stroke="#c9c9c9" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="340.0" y="380.0" text-anchor="middle" font-size="13.5" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">总答案 = 4 + 4 = 8，与官方样例输出一致</text>
</svg>
