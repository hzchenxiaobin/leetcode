<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：收集匹配 → 双指针判定</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 & 2: collect A and B -->
  <rect x="70" y="60" width="230" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="185" y="81" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#sk)">① 扫描 s，收集 a 的全部匹配起点</text>
  <text x="185" y="98" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#sk)">s[i..i+|a|−1] == a → A（升序）</text>
  <rect x="340" y="60" width="230" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="455" y="81" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#sk)">② 扫描 s，收集 b 的全部匹配起点</text>
  <text x="455" y="98" text-anchor="middle" font-size="11" fill="#2c4a66" filter="url(#sk)">s[j..j+|b|−1] == b → B（升序）</text>
  <path d="M 185 110 Q 260 128 310 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 455 110 Q 380 128 330 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: iterate i in A with pointer p -->
  <rect x="200" y="146" width="240" height="40" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="171" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#sk)">p = 0，按升序遍历 i ∈ A</text>
  <path d="M 320 186 L 320 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision 1: B[p] < i-k ? -->
  <polygon points="320,208 430,244 320,280 210,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="240" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">B[p] &lt; i−k ?</text>
  <text x="320" y="256" text-anchor="middle" font-size="9.5" fill="#a07820" filter="url(#sk)">(候选太靠左)</text>
  <text x="436" y="238" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">是</text>
  <path d="M 430 244 L 486 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="490" y="226" width="66" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="523" y="249" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#sk)">p++</text>
  <path d="M 556 226 Q 556 196 430 216 Q 380 224 326 216" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="196" font-size="10" fill="#a07820" filter="url(#sk)">回头再判</text>
  <text x="330" y="298" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">否</text>
  <path d="M 320 280 L 320 298" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision 2: in window? -->
  <polygon points="320,302 445,340 320,378 195,340" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#sk)">p &lt; |B| 且</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#sk)">B[p] ≤ i+k ?</text>
  <path d="M 445 340 L 486 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="333" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">是</text>
  <rect x="490" y="322" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="545" y="345" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">i 收入答案</text>
  <path d="M 195 340 L 154 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="188" y="333" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <rect x="44" y="322" width="106" height="36" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="97" y="345" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold" filter="url(#sk)">跳过 i</text>

  <!-- merge to next i / finish -->
  <path d="M 545 358 Q 545 392 466 398" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 97 358 Q 97 392 174 398" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="178" y="386" width="284" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="406" text-anchor="middle" font-size="11.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">取 A 中下一个 i（若遍历完则结束）</text>
  <text x="320" y="423" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">返回 ans —— 天然升序，无需排序</text>
  <path d="M 320 432 Q 320 444 320 444" stroke="none" fill="none"/>

  <!-- side annotation: monotonicity -->
  <rect x="494" y="60" width="140" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="564" y="80" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold" filter="url(#sk)">i 升序 ⇒ i−k 单调不减</text>
  <text x="564" y="96" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">⇒ p 永不回退，</text>
  <text x="564" y="112" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">判定阶段 O(|A|+|B|)</text>
</svg>
