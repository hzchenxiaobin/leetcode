<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="760" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">循环左移一位：只有符号翻转才产生增益</text>
  <path d="M 250 46 Q 470 54 690 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== Panel 1: operation decomposition ===== -->
  <text x="470" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">① 操作拆解：中间段整体左移一位 + 首元素环转到 r（示例 l=1, r=4）</text>

  <!-- original row: index labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="154" y="104" filter="url(#rough)">下标 0</text>
    <text x="250" y="104" filter="url(#rough)">1</text>
    <text x="346" y="104" filter="url(#rough)">2</text>
    <text x="442" y="104" filter="url(#rough)">3</text>
    <text x="538" y="104" filter="url(#rough)">4</text>
    <text x="634" y="104" filter="url(#rough)">5</text>
  </g>
  <!-- original cells -->
  <g filter="url(#rough)">
    <rect x="114" y="112" width="80" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="210" y="112" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="306" y="112" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="402" y="112" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="498" y="112" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="594" y="112" width="80" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="154" y="139" fill="#555" filter="url(#rough)">a</text>
    <text x="250" y="139" fill="#b07a20" font-weight="bold" filter="url(#rough)">x1</text>
    <text x="346" y="139" fill="#b07a20" filter="url(#rough)">x2</text>
    <text x="442" y="139" fill="#b07a20" filter="url(#rough)">x3</text>
    <text x="538" y="139" fill="#b07a20" filter="url(#rough)">x4</text>
    <text x="634" y="139" fill="#555" filter="url(#rough)">b</text>
  </g>
  <!-- l / r markers -->
  <text x="250" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough)">l</text>
  <text x="538" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough)">r</text>
  <path d="M 250 166 L 250 160" stroke="#b85450" stroke-width="1.2" filter="url(#rough)"/>
  <path d="M 538 166 L 538 160" stroke="#b85450" stroke-width="1.2" filter="url(#rough)"/>
  <!-- signs row -->
  <g font-size="12" text-anchor="middle" fill="#446688">
    <text x="154" y="200" filter="url(#rough)">+</text>
    <text x="250" y="200" filter="url(#rough)">−</text>
    <text x="346" y="200" filter="url(#rough)">+</text>
    <text x="442" y="200" filter="url(#rough)">−</text>
    <text x="538" y="200" filter="url(#rough)">+</text>
    <text x="634" y="200" filter="url(#rough)">−</text>
  </g>
  <text x="726" y="200" font-size="11" fill="#888" filter="url(#rough)">← 位置符号</text>

  <!-- movement arrows -->
  <path d="M 250 210 C 300 248, 490 248, 534 282" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough)"/>
  <text x="392" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough)">首元素 x1 环转到 r</text>
  <path d="M 346 210 C 336 246, 322 258, 306 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough)"/>
  <path d="M 442 210 C 432 246, 420 258, 402 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough)"/>
  <path d="M 538 210 C 528 246, 516 258, 498 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough)"/>
  <text x="700" y="252" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough)">中间段各左移一位</text>

  <!-- after row -->
  <g filter="url(#rough)">
    <rect x="114" y="290" width="80" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="210" y="290" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="306" y="290" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="402" y="290" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="498" y="290" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="594" y="290" width="80" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="154" y="317" fill="#555" filter="url(#rough)">a</text>
    <text x="250" y="317" fill="#b07a20" filter="url(#rough)">x2</text>
    <text x="346" y="317" fill="#b07a20" filter="url(#rough)">x3</text>
    <text x="442" y="317" fill="#b07a20" filter="url(#rough)">x4</text>
    <text x="538" y="317" fill="#b07a20" font-weight="bold" filter="url(#rough)">x1</text>
    <text x="634" y="317" fill="#555" filter="url(#rough)">b</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#446688">
    <text x="154" y="354" filter="url(#rough)">+</text>
    <text x="250" y="354" filter="url(#rough)">−</text>
    <text x="346" y="354" filter="url(#rough)">+</text>
    <text x="442" y="354" filter="url(#rough)">−</text>
    <text x="538" y="354" filter="url(#rough)">+</text>
    <text x="634" y="354" filter="url(#rough)">−</text>
  </g>

  <!-- ===== Panel 2: gain analysis ===== -->
  <text x="470" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">② 增益来源：位置奇偶翻转 ⟺ 贡献变号（t_k = (−1)^k · nums[k]）</text>

  <g filter="url(#rough)">
    <rect x="60" y="420" width="396" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="258" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">中间段 x_k（l &lt; k ≤ r）</text>
  <text x="258" y="470" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough)">位置 k → k−1，奇偶必翻转</text>
  <text x="258" y="494" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough)">贡献 t_k → −t_k</text>
  <text x="258" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">增益 = −2·t_k</text>

  <g filter="url(#rough)">
    <rect x="484" y="420" width="396" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="682" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07a20" filter="url(#rough)">首元素 x_l</text>
  <text x="682" y="470" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough)">位置 l → r，符号看 l 与 r 的奇偶</text>
  <text x="682" y="494" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough)">r−l 奇：翻转 → 增益 −2·t_l</text>
  <text x="682" y="516" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough)">r−l 偶：不变 → 增益 0</text>

  <!-- ===== Panel 3: unified formula ===== -->
  <text x="470" y="562" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough)">③ 统一成前缀和之差（pre[j] = t_0 + t_1 + … + t_{j−1}）</text>

  <g filter="url(#rough)">
    <rect x="60" y="582" width="396" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="258" y="610" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#rough)">r−l 为奇：Δ = −2 ( pre[r+1] − pre[l] )</text>
  <text x="258" y="636" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough)">对应同奇偶对 (i, j) = (l, r+1)</text>
  <text x="258" y="656" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough)">例：(0,1) 交换 ⟺ (i,j) = (0,2)</text>

  <g filter="url(#rough)">
    <rect x="484" y="582" width="396" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="682" y="610" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#rough)">r−l 为偶：Δ = −2 ( pre[r+1] − pre[l+1] )</text>
  <text x="682" y="636" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough)">对应同奇偶对 (i, j) = (l+1, r+1)</text>
  <text x="682" y="656" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough)">已被奇跨度情形完全覆盖</text>

  <g filter="url(#rough)">
    <rect x="60" y="694" width="820" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="470" y="722" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">全部操作 ⟹ 同奇偶前缀和对之差：最大化增益 = 最小化 pre[j] − pre[i]（i ≡ j mod 2）</text>
</svg>
