<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    按二进制位统计：popcount 之和 + 最高位
  </text>

  <!-- 位表表头 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="12" fill="#666">
    <text x="120" y="70">值</text>
    <text x="230" y="70">bit 2</text>
    <text x="310" y="70">bit 1</text>
    <text x="390" y="70">bit 0</text>
    <text x="472" y="70">popcount</text>
  </g>

  <!-- 行：4 = 100 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="96" y="82" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="120" y="105" fill="#333">4</text>
    <rect x="204" y="82" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="228" y="105" fill="#b85450" font-weight="bold">1</text>
    <rect x="284" y="82" width="48" height="36" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="308" y="105" fill="#999">0</text>
    <rect x="364" y="82" width="48" height="36" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="388" y="105" fill="#999">0</text>
    <text x="472" y="105" fill="#446688">1</text>
  </g>
  <!-- 行：2 = 010 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="96" y="126" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="120" y="149" fill="#333">2</text>
    <rect x="204" y="126" width="48" height="36" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="228" y="149" fill="#999">0</text>
    <rect x="284" y="126" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="308" y="149" fill="#b85450" font-weight="bold">1</text>
    <rect x="364" y="126" width="48" height="36" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="388" y="149" fill="#999">0</text>
    <text x="472" y="149" fill="#446688">1</text>
  </g>
  <!-- 行：5 = 101 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="96" y="170" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="120" y="193" fill="#333">5</text>
    <rect x="204" y="170" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="228" y="193" fill="#b85450" font-weight="bold">1</text>
    <rect x="284" y="170" width="48" height="36" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="308" y="193" fill="#999">0</text>
    <rect x="364" y="170" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="388" y="193" fill="#b85450" font-weight="bold">1</text>
    <text x="472" y="193" fill="#446688">2</text>
  </g>

  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    每个 1（红色格）都对应一次单点 +1：合计 1 + 1 + 2 = 4
  </text>

  <!-- 最高位标注 -->
  <g filter="url(#rough2)">
    <rect x="60" y="258" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="260" y="278" text-anchor="middle" font-size="13" fill="#2f5a24">max = 5 = (101)₂，最高位在第 2 位</text>
    <text x="260" y="296" text-anchor="middle" font-size="13" fill="#2f5a24">→ 全体 ×2 共需 2 轮（其他元素跟着翻倍不花钱）</text>
  </g>

  <rect x="150" y="316" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">4 + 2 = 6 ✓（示例 3）</text>
</svg>
