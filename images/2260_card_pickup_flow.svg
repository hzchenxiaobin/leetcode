<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单层扫描 + 查表算跨度 + 覆盖更新</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- complexity note -->
  <g filter="url(#sk)">
    <rect x="470" y="56" width="185" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="11" fill="#2e6e2e" text-anchor="middle">
    <text x="562" y="76">每张卡牌：一次查表 + 一次覆盖</text>
    <text x="562" y="94">总计 O(n) 时间</text>
  </g>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="215" y="54" width="170" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="300" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = ∞, last = {}</text>
  <path d="M 300 88 L 300 104" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fetch next -->
  <text x="205" y="130" text-anchor="end" font-size="11.5" font-style="italic" fill="#666">for i = 0 … n−1</text>
  <g filter="url(#sk)">
    <rect x="215" y="108" width="170" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="300" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">取下一张 cards[i]</text>
  <path d="M 300 142 L 300 156" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: hit? -->
  <g filter="url(#sk)">
    <polygon points="205,196 300,158 395,196 300,234" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">
    <text x="300" y="192">last 里有</text>
    <text x="300" y="208">cards[i] ?</text>
  </g>
  <text x="420" y="188" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 395 196 L 451 196" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- hit: update ans -->
  <g filter="url(#sk)">
    <rect x="455" y="168" width="205" height="56" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">
    <text x="557" y="190">dist = i − last[v] + 1</text>
    <text x="557" y="210">ans = min(ans, dist)</text>
  </g>
  <path d="M 557 224 L 557 258 L 396 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- miss path -->
  <text x="308" y="250" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <path d="M 300 234 L 300 250" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- overwrite -->
  <g filter="url(#sk)">
    <rect x="215" y="240" width="181" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="305" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">last[cards[i]] = i（覆盖）</text>

  <!-- order warning -->
  <g filter="url(#sk)">
    <rect x="430" y="276" width="225" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#a04038">
    <text x="542" y="295">必须先查后写！</text>
    <text x="542" y="313">顺序颠倒 → 自己和自己配对，恒得 1</text>
  </g>
  <path d="M 430 298 L 398 278" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 305 276 L 305 292" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2: done? -->
  <g filter="url(#sk)">
    <polygon points="228,332 305,294 382,332 305,370" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">
    <text x="305" y="328">扫完</text>
    <text x="305" y="344">了吗？</text>
  </g>

  <!-- loop back -->
  <path d="M 228 332 L 150 332 L 150 125 L 211 125" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="188" y="324" text-anchor="middle" font-size="10.5" fill="#999">没有（i+1）</text>
  <text x="163" y="222" font-size="11" font-style="italic" fill="#999">循环</text>

  <!-- finish -->
  <text x="313" y="386" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 305 370 L 305 390" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="203" y="394" width="205" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="305" y="416" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">return ans == ∞ ? −1 : ans</text>
</svg>
