<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
  </defs>
  <rect width="620" height="452" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：逐轮模拟与公式核对</text>
  <path d="M 160 34 Q 310 42 460 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- Panel 1 -->
  <g filter="url(#r)">
    <rect x="30" y="44" width="560" height="190" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="52" y="68" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#r)">示例 1：happiness = [1,2,3]，k = 2（降序 [3,2,1]）</text>

  <!-- round 0 -->
  <text x="52" y="110" font-size="12" font-weight="bold" fill="#b0722a" filter="url(#r)">第 0 轮</text>
  <g filter="url(#r)"><rect x="118" y="88" width="38" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="163" y="88" width="38" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="208" y="88" width="38" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="137" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">1</text>
  <text x="182" y="110" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">2</text>
  <text x="227" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3230" filter="url(#r)">3</text>
  <path d="M 256 105 L 288 105" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="294" y="88" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="332" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">选 3 → +3</text>
  <path d="M 378 105 L 408 105" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="460" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">其余各 −1</text>
  <g filter="url(#r)"><rect x="418" y="88" width="38" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="463" y="88" width="38" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="437" y="110" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">1</text>
  <text x="482" y="110" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>

  <!-- round 1 -->
  <text x="52" y="160" font-size="12" font-weight="bold" fill="#b0722a" filter="url(#r)">第 1 轮</text>
  <g filter="url(#r)"><rect x="118" y="138" width="38" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#r)"><rect x="163" y="138" width="38" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="137" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3230" filter="url(#r)">1</text>
  <text x="182" y="160" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>
  <path d="M 208 155 L 240 155" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="246" y="138" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="284" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">选 1 → +1</text>
  <text x="340" y="160" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">累计 3 + 1 = 4 ✓</text>

  <!-- formula strip -->
  <g filter="url(#r)"><rect x="52" y="190" width="516" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="310" y="210" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#r)">公式：max(3−0, 0) + max(2−1, 0) = 3 + 1 = 4，与逐轮模拟一致</text>

  <!-- Panel 2 -->
  <g filter="url(#r)">
    <rect x="30" y="250" width="560" height="184" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="52" y="274" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#r)">示例 2：happiness = [1,1,1,1]，k = 2（全相同，任选其一）</text>

  <!-- round 0 -->
  <text x="52" y="316" font-size="12" font-weight="bold" fill="#b0722a" filter="url(#r)">第 0 轮</text>
  <g filter="url(#r)"><rect x="118" y="294" width="34" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#r)"><rect x="158" y="294" width="34" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="198" y="294" width="34" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="238" y="294" width="34" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="135" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3230" filter="url(#r)">1</text>
  <text x="175" y="316" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">1</text>
  <text x="215" y="316" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">1</text>
  <text x="255" y="316" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">1</text>
  <path d="M 282 311 L 296 311" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="302" y="294" width="70" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="337" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">选 1 → +1</text>
  <path d="M 378 311 L 392 311" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <text x="457" y="289" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">其余各 −1</text>
  <g filter="url(#r)"><rect x="400" y="294" width="34" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="440" y="294" width="34" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="480" y="294" width="34" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="417" y="316" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>
  <text x="457" y="316" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>
  <text x="497" y="316" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>

  <!-- round 1 -->
  <text x="52" y="366" font-size="12" font-weight="bold" fill="#b0722a" filter="url(#r)">第 1 轮</text>
  <g filter="url(#r)"><rect x="118" y="344" width="34" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#r)"><rect x="158" y="344" width="34" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <g filter="url(#r)"><rect x="198" y="344" width="34" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="135" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3230" filter="url(#r)">0</text>
  <text x="175" y="366" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>
  <text x="215" y="366" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#r)">0</text>
  <path d="M 240 361 L 262 361" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="268" y="344" width="70" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="303" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">选 0 → +0</text>
  <text x="352" y="366" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">累计 1 + 0 = 1 ✓</text>

  <!-- formula strip -->
  <g filter="url(#r)"><rect x="52" y="396" width="516" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="310" y="416" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#r)">公式：1 + max(1−1, 0) = 1 + 0 = 1 —— 第二个入选者已被扣到 0</text>
</svg>
