<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">影子对的判定：中间谁在「阻挡」？</text>

  <!-- ============ Row A: valid pair (1,4) ============ -->
  <text x="105" y="112" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 影子对 (1, 4)</text>

  <path d="M 279 82 Q 403 34 527 82" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="403" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i=1 → j=4</text>

  <rect x="250" y="88" width="58" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="312" y="88" width="58" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="341" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="374" y="88" width="58" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="436" y="88" width="58" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="117" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="498" y="88" width="58" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="527" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">5</text>

  <text x="279" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="341" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="403" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="465" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="527" y="152" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <rect x="600" y="74" width="320" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="760" y="99" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">nums[1] = 1 &lt; nums[4] = 5</text>
  <text x="760" y="121" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">中间的 4、1 都 ≥ 1，无阻挡 ✓</text>
  <text x="760" y="141" text-anchor="middle" font-size="11" fill="#557" filter="url(#rough2)">（1 是 nums[1..4] 的最小值）</text>

  <!-- ============ Row B: blocked pair (2,4) ============ -->
  <text x="105" y="262" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 非影子对 (2, 4)</text>

  <path d="M 403 232 Q 465 194 527 232" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="250" y="238" width="58" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="312" y="238" width="58" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="374" y="238" width="58" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="403" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">4</text>
  <rect x="436" y="238" width="58" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="465" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3030" filter="url(#rough2)">1</text>
  <text x="465" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">阻挡！k=3</text>
  <rect x="498" y="238" width="58" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="527" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">5</text>

  <text x="279" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="341" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="403" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="465" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="527" y="302" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <rect x="600" y="224" width="320" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="760" y="249" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">nums[2] = 4 &lt; nums[4] = 5，但</text>
  <text x="760" y="271" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">nums[3] = 1 &lt; 4，k = 3 阻挡 ✗</text>
  <text x="760" y="291" text-anchor="middle" font-size="11" fill="#557" filter="url(#rough2)">（4 不是 nums[2..4] 的最小值）</text>

  <!-- ============ Conclusion ============ -->
  <rect x="80" y="356" width="780" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">影子对 (i, j) 等价于：nums[i] &lt; nums[j] 且 min(nums[i+1 .. j−1]) ≥ nums[i]</text>
  <text x="470" y="406" text-anchor="middle" font-size="12" fill="#556" filter="url(#rough2)">即 nums[i] 恰是子数组 nums[i..j] 的最小值（相邻对 j = i+1 自动满足，相等元素不阻挡、也不配对）</text>
</svg>
