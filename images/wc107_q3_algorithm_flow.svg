<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 434"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="434" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：数 1 → 定位 → 逐位比对</text>
  <rect x="220" y="52" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="74.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数 1 的总数 ones</text>
  <polygon points="330 105.0 430.0 132 330 159.0 230.0 132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="136.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ones % 3 == 0 ?</text>
  <rect x="520" y="96" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580.0" y="119.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 [-1,-1]</text>
  <polygon points="330 193.0 445.0 220 330 247.0 215.0 220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="224.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ones == 0 ?</text>
  <rect x="60" y="280" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135.0" y="303.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 [0, n-1]</text>
  <rect x="250" y="282" width="190" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="305.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">定位 first/second/third</text>
  <rect x="250" y="344" width="190" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="367.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len = n - third，逐位比对</text>
  <rect x="470" y="344" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545.0" y="367.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">全等 → 输出下标</text>
  <path d="M 330 88 L 330 104" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 132 L 518 118" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 330 159 L 330 192" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 220 232 L 150 278" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 330 247 L 345 280" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="345" y="245" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">否（ones&gt;0）</text>
  <path d="M 345 322 L 345 342" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 440 364 L 468 364" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="330" y="414" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">全部判断都是线性的：定位用一次扫描，比对用 len 次</text>
</svg>
