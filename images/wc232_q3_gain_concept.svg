<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：边际增益递减，每轮给当前增益最大的班</text>

  <!-- 左上：增益公式 -->
  <rect x="28" y="52" width="272" height="116" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">加 1 名必过学生的边际增益</text>
  <text x="164" y="97" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Δ(p,t) = (p+1)/(t+1) − p/t</text>
  <text x="164" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= <tspan fill="#b85450" font-weight="bold">(t−p)</tspan> / <tspan fill="#446688" font-weight="bold">t(t+1)</tspan></text>
  <text x="164" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">分子 = 未过人数；分母 ≈ 体量平方级；t=p 时 Δ=0</text>

  <!-- 右上：小班 vs 大班 -->
  <rect x="322" y="52" width="210" height="116" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">增益 ≠ 通过率高低</text>
  <text x="427" y="93" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">小班 (1,2)：1/2 → 2/3</text>
  <text x="427" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Δ ≈ +0.167（大）</text>
  <text x="427" y="131" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">大班 (99,100)：0.990 → 0.9901</text>
  <text x="427" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">Δ ≈ +0.0001（微）</text>

  <!-- 左下：凹性条形图 -->
  <rect x="28" y="188" width="272" height="142" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">同一班连加 3 人：增益递减（凹性）</text>
  <line x1="52" y1="308" x2="284" y2="308" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="62" y="232" width="44" height="76" fill="#d6a040" stroke="#a87820" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="270" width="44" height="38" fill="#d6a040" stroke="#a87820" stroke-width="1.5" rx="3" opacity="0.75" filter="url(#rough2)"/>
  <rect x="194" y="285" width="44" height="23" fill="#d6a040" stroke="#a87820" stroke-width="1.5" rx="3" opacity="0.5" filter="url(#rough2)"/>
  <path d="M84,228 C 110,222 132,258 150,264 C 170,270 192,282 216,281" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+0.167</text>
  <text x="150" y="264" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+0.083</text>
  <text x="216" y="279" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+0.050</text>
  <text x="84" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 1 人</text>
  <text x="150" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 2 人</text>
  <text x="216" y="322" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 3 人</text>

  <!-- 右下：策略框 -->
  <rect x="322" y="188" width="210" height="142" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">策略：大顶堆增量分配</text>
  <text x="427" y="238" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">每轮取当前 Δ 最大的班</text>
  <text x="427" y="260" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">加 1 人 → 重算 Δ → 回推堆</text>
  <text x="427" y="282" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">其余 n−1 个班不动</text>
  <text x="427" y="310" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">正确性证明见 §5</text>

  <!-- 底部说明 -->
  <rect x="28" y="346" width="504" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="368" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 平均 = (Σ 各班通过率) / n，n 固定 ⟹ 最大化通过率之和即可</text>
  <text x="44" y="388" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 堆只对被改的班做「弹出−修改−回推」，每轮找最大从 O(n) 降到 O(log n)</text>
</svg>
