<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：一趟扫描，ans 只增不减</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <rect x="392" y="46" width="14" height="12" fill="#fdeaea" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="411" y="56" font-size="11" fill="#a04340">移除</text>
  <rect x="462" y="46" width="14" height="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="481" y="56" font-size="11" fill="#2e6e2e">保留</text>

  <!-- Row 1: example 1 -->
  <text x="48" y="97" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1</text>
  <g filter="url(#sk)">
    <rect x="100" y="76" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="138" y="76" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="176" y="76" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="214" y="76" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="252" y="76" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="290" y="76" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="328" y="76" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="119" y="98">1</text>
    <text x="157" y="98">−1</text>
    <text x="195" y="98">2</text>
    <text x="233" y="98">3</text>
    <text x="271" y="98">3</text>
    <text x="309" y="98">4</text>
    <text x="347" y="98">5</text>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="138" y="132" font-size="14" fill="#b85450">✗</text>
    <text x="176" y="132" font-size="14" fill="#4a8e4a">✓</text>
    <text x="214" y="132" font-size="14" fill="#4a8e4a">✓</text>
    <text x="252" y="132" font-size="14" fill="#b85450">✗</text>
    <text x="290" y="132" font-size="14" fill="#4a8e4a">✓</text>
    <text x="328" y="132" font-size="14" fill="#4a8e4a">✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="390" y="70" width="230" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="505" y="92" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">违规位置 i ∈ {0, 3}</text>
  <text x="505" y="112" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = 3 + 1 = 4</text>
  <text x="505" y="132" text-anchor="middle" font-size="11" fill="#555">保留 [3, 4, 5] 严格递增 ✓</text>

  <!-- Row 2: example 2 -->
  <text x="48" y="217" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2</text>
  <g filter="url(#sk)">
    <rect x="100" y="196" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="138" y="196" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="176" y="196" width="38" height="34" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="214" y="196" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="119" y="218">4</text>
    <text x="157" y="218">3</text>
    <text x="195" y="218">−2</text>
    <text x="233" y="218">−5</text>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="138" y="252" font-size="14" fill="#b85450">✗</text>
    <text x="176" y="252" font-size="14" fill="#b85450">✗</text>
    <text x="214" y="252" font-size="14" fill="#b85450">✗</text>
  </g>
  <g filter="url(#sk)">
    <rect x="390" y="190" width="230" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="505" y="212" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">违规位置 i ∈ {0, 1, 2}</text>
  <text x="505" y="232" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = 2 + 1 = 3</text>
  <text x="505" y="252" text-anchor="middle" font-size="11" fill="#555">保留 [−5]：单元素也算递增 ✓</text>

  <!-- Row 3: example 3 -->
  <text x="48" y="337" font-size="13" font-weight="bold" fill="#2b2b2b">示例 3</text>
  <g filter="url(#sk)">
    <rect x="100" y="316" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="138" y="316" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="176" y="316" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="214" y="316" width="38" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="119" y="338">1</text>
    <text x="157" y="338">2</text>
    <text x="195" y="338">3</text>
    <text x="233" y="338">4</text>
  </g>
  <g text-anchor="middle" font-weight="bold">
    <text x="138" y="372" font-size="14" fill="#4a8e4a">✓</text>
    <text x="176" y="372" font-size="14" fill="#4a8e4a">✓</text>
    <text x="214" y="372" font-size="14" fill="#4a8e4a">✓</text>
  </g>
  <g filter="url(#sk)">
    <rect x="390" y="310" width="230" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="505" y="332" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">无任何违规对</text>
  <text x="505" y="352" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = 0（空前缀）</text>
  <text x="505" y="372" text-anchor="middle" font-size="11" fill="#555">保留整个数组 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="392" width="580" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="407" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">写法：for i in range(n−1): nums[i] ≥ nums[i+1] ⟹ ans = i + 1；后写覆盖先写。</text>
</svg>
