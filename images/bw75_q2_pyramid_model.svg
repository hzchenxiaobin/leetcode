<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">三角归约：nums = [1,2,3,4,5] 一层层消融</text>

  <!-- 第 0 层 -->
  <text x="70" y="72" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">长度 5</text>
  <g filter="url(#rough2)">
    <rect x="180" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="360" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="420" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="208" y="74">1</text><text x="268" y="74">2</text><text x="328" y="74">3</text><text x="388" y="74">4</text><text x="448" y="74">5</text>
  </g>

  <!-- 第 1 层 -->
  <text x="70" y="124" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">长度 4</text>
  <g filter="url(#rough2)">
    <rect x="210" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="270" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="390" y="104" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="238" y="126">3</text><text x="298" y="126">5</text><text x="358" y="126">7</text><text x="418" y="126">9</text>
  </g>
  <text x="486" y="126" font-size="12" fill="#d6a040" filter="url(#rough2)">(1+2)%10 …</text>

  <!-- 第 2 层 -->
  <text x="70" y="176" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">长度 3</text>
  <g filter="url(#rough2)">
    <rect x="240" y="156" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="156" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="360" y="156" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="268" y="178">8</text><text x="328" y="178">2</text><text x="388" y="178">6</text>
  </g>

  <!-- 第 3 层 -->
  <text x="70" y="228" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">长度 2</text>
  <g filter="url(#rough2)">
    <rect x="270" y="208" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="208" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="298" y="230">0</text><text x="358" y="230">8</text>
  </g>

  <!-- 第 4 层：答案 -->
  <text x="70" y="280" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">长度 1</text>
  <g filter="url(#rough2)">
    <rect x="300" y="260" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="328" y="282" font-size="16" fill="#b85450" font-weight="bold" text-anchor="middle" filter="url(#rough2)">8</text>
  <text x="380" y="282" font-size="13" fill="#b85450" filter="url(#rough2)">← 三角和</text>

  <!-- 层间箭头 -->
  <path d="M 280 88 C 280 94, 280 96, 280 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 140 C 280 146, 280 148, 280 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 192 C 280 198, 280 200, 280 204" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 244 C 280 250, 280 252, 280 256" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 侧注：每层 n-1 个新数 -->
  <rect x="60" y="308" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">共 n−1 轮，每轮 O(当前长度)：总操作数 n(n−1)/2</text>
</svg>
