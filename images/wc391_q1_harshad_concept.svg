<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">哈沙德数判定：数位和 + 整除检查</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="430" y="58" width="186" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="523" y="78" text-anchor="middle" font-size="11" fill="#2b6e9e">1 ≤ x ≤ 100（最多 3 位）</text>
  <text x="523" y="96" text-anchor="middle" font-size="11" fill="#2b6e9e">s ≥ 1 恒成立，不会除零</text>

  <text x="170" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">示例 1：x = 18</text>

  <g filter="url(#sk)">
    <rect x="60" y="88" width="40" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <rect x="106" y="88" width="40" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="126" y="116" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="168" y="106" font-size="11" fill="#888">逐位提取</text>
  <text x="168" y="122" font-size="11" fill="#888">t%10, t/=10</text>

  <path d="M 103 134 C 105 150 110 158 115 168" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="44" y="170" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="119" y="192" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">s = 1 + 8 = 9</text>

  <path d="M 194 188 L 246 188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="250,188 318,146 386,188 318,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="318" y="192" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">x % s == 0 ?</text>

  <path d="M 318 146 C 318 118 370 138 456 138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="126" font-size="11" fill="#4a7a3a" font-weight="bold">是：s 整除 x ✓</text>
  <g filter="url(#sk)">
    <rect x="460" y="120" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="530" y="142" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 s = 9</text>

  <path d="M 318 230 C 318 258 380 254 456 254" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="368" y="262" font-size="11" fill="#b85450" font-weight="bold">否：有余数 ✗</text>
  <g filter="url(#sk)">
    <rect x="460" y="236" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="530" y="258" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">返回 -1</text>

  <text x="170" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">示例 2：x = 23</text>
  <g filter="url(#sk)">
    <rect x="52" y="322" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="348" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)">
    <rect x="92" y="322" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="110" y="348" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">3</text>
  <path d="M 132 342 L 158 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="162" y="324" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="227" y="346" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">s = 2 + 3 = 5</text>
  <path d="M 292 342 L 318 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="322" y="324" width="146" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="395" y="346" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">23 % 5 = 3 ≠ 0</text>
  <path d="M 468 342 L 494 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="498" y="324" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="553" y="346" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">返回 -1</text>
</svg>
