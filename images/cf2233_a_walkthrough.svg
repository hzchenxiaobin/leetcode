<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="404" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方样例走查：两条分支分别算，再取 min</text>
  <text x="340" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">ceil 表示向上取整：ceil(a / b) = (a + b − 1) / b（a, b 为正整数）</text>

  <g filter="url(#rough2)">
    <rect x="30" y="62" width="620" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="130" y="82" text-anchor="middle" font-size="10.5" fill="#33445c" font-weight="bold">(n, x, y, z)</text>
    <text x="282" y="82" text-anchor="middle" font-size="10.5" fill="#33445c" font-weight="bold">x·z ≥ n ?</text>
    <text x="378" y="82" text-anchor="middle" font-size="10.5" fill="#33445c" font-weight="bold">H₁ 不用 AI</text>
    <text x="510" y="82" text-anchor="middle" font-size="10.5" fill="#33445c" font-weight="bold">H₂ 用 AI</text>
    <text x="614" y="82" text-anchor="middle" font-size="10.5" fill="#33445c" font-weight="bold">min</text>
  </g>

  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="92" width="620" height="34" fill="#ffffff" stroke="#aab4c4" stroke-width="1.1" rx="4"/>
    <text x="130" y="114" text-anchor="middle" fill="#333">110, 10, 9, 1</text>
    <text x="282" y="114" text-anchor="middle" fill="#b85450">10 &lt; 110　否</text>
    <text x="378" y="114" text-anchor="middle" fill="#3a5a30">ceil(110/19) = 6</text>
    <text x="510" y="114" text-anchor="middle" fill="#8a6a20">1 + ceil(100/100) = 2</text>
    <text x="614" y="114" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <rect x="30" y="126" width="620" height="34" fill="#eef4e8" stroke="#aab4c4" stroke-width="1.1" rx="4"/>
    <text x="130" y="148" text-anchor="middle" fill="#333">30, 8, 1, 13</text>
    <text x="282" y="148" text-anchor="middle" fill="#4a7a3a">104 ≥ 30　是</text>
    <text x="378" y="148" text-anchor="middle" fill="#3a5a30">ceil(30/9) = 4</text>
    <text x="510" y="148" text-anchor="middle" fill="#8a6a20">ceil(30/8) = 4</text>
    <text x="614" y="148" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>

    <rect x="30" y="160" width="620" height="34" fill="#ffffff" stroke="#aab4c4" stroke-width="1.1" rx="4"/>
    <text x="130" y="182" text-anchor="middle" fill="#333">200, 3, 2, 4</text>
    <text x="282" y="182" text-anchor="middle" fill="#b85450">12 &lt; 200　否</text>
    <text x="378" y="182" text-anchor="middle" fill="#3a5a30">ceil(200/5) = 40</text>
    <text x="510" y="182" text-anchor="middle" fill="#8a6a20">4 + ceil(188/23) = 13</text>
    <text x="614" y="182" text-anchor="middle" fill="#b85450" font-weight="bold">13</text>

    <rect x="30" y="194" width="620" height="34" fill="#fdf1f3" stroke="#aab4c4" stroke-width="1.1" rx="4"/>
    <text x="130" y="216" text-anchor="middle" fill="#333">6, 2, 1, 3</text>
    <text x="282" y="216" text-anchor="middle" fill="#4a7a3a">6 ≥ 6　是</text>
    <text x="378" y="216" text-anchor="middle" fill="#3a5a30">ceil(6/3) = 2</text>
    <text x="510" y="216" text-anchor="middle" fill="#8a6a20">ceil(6/2) = 3</text>
    <text x="614" y="216" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="240" width="620" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="44" y="262" font-size="10" fill="#8a6a20" font-weight="bold">三处易错点就藏在这四行里</text>
    <text x="44" y="284" font-size="9.8" fill="#6a5a30">① 第 2 行：工程在搭 AI 期间就结束，H₂ 走 ceil(n/x)；且此时 H₂ ≥ H₁，AI 分支永远赢不了。</text>
    <text x="44" y="304" font-size="9.8" fill="#6a5a30">② 第 4 行：AI 反而更慢（3 &gt; 2），必须与 H₁ 取 min，不能默认「用 AI 一定更快」。</text>
    <text x="44" y="324" font-size="9.8" fill="#6a5a30">③ 样例 3（3, 1, 1, 1）：若写向下取整 floor(3/2) = 1，答案会错成 1，正确是 2。</text>
  </g>

  <text x="340" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每行都在 O(1) 时间内算完，与 n 的大小无关</text>
</svg>
