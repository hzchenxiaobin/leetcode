<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 444"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="444" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：极大段独立 + 每 m+1 个字符切一刀</text>

  <!-- A. 段分解 -->
  <text x="92" y="73" font-size="15" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="127" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="229" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="263" y="52" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="297" y="52" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="331" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="365" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="399" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="178" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="212" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="246" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="314" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="348" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="382" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="416" y="72" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <path d="M127,90 L127,96 L261,96 L261,90" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M265,90 L265,96 L329,96 L329,90" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M333,90 L333,96 L431,96 L431,90" fill="none" stroke="#7a7a7a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">L = 4</text>
  <text x="297" y="112" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">L = 2</text>
  <text x="382" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">L = 3</text>
  <text x="280" y="130" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">翻转只影响它所在的段 → 各段独立计数</text>

  <!-- B. 切刀构造 -->
  <text x="280" y="154" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">长 8 的段，m = 2：每 m+1 = 3 个字符切一刀，刀口选在段内部</text>
  <text x="220" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="380" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✕</text>
  <text x="470" y="188" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">✕ = 刀口（翻转）</text>
  <rect x="120" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="160" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="166" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="240" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="166" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="166" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="187" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="260" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="187" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="380" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="187" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <path d="M120,206 L120,212 L198,212 L198,206" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M242,206 L242,212 L318,212 L318,206" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M362,206 L362,212 L438,212 L438,206" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="159" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≤ 2 ✓</text>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≤ 2 ✓</text>
  <text x="400" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≤ 2 ✓</text>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">翻出的孤立 '1' 两侧都是 '0' → 被隔离成段长 1，不与相邻段粘连</text>

  <!-- C. m=1 合并陷阱 -->
  <text x="280" y="268" text-anchor="middle" font-size="12.5" fill="#7a3a34" filter="url(#rough2)">m = 1 的合并陷阱：长 2 的段没有「内部」刀位</text>
  <text x="85" y="298" font-size="14" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="120" y="278" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="278" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="278" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="278" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="174" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="246" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M174,312 L174,330" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="326" font-size="11" fill="#b85450" filter="url(#rough2)">翻 s[1]</text>
  <rect x="120" y="334" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="156" y="334" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="192" y="334" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="334" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="354" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="174" y="354" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="210" y="354" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="246" y="354" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M120,368 L120,374 L190,374 L190,368" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">并入左邻段 → 长 2 ✗</text>
  <text x="330" y="294" font-size="11.5" fill="#333" filter="url(#rough2)">公式：⌊1/2⌋ + ⌊2/2⌋ + ⌊1/2⌋ = 1 刀</text>
  <text x="330" y="314" font-size="11.5" fill="#333" filter="url(#rough2)">真值：翻任何一位，最长段仍为 2</text>
  <text x="330" y="334" font-size="11.5" fill="#666" filter="url(#rough2)">（翻 s[2] 同理得 "1011"）</text>
  <text x="330" y="354" font-size="11.5" fill="#7a3a34" filter="url(#rough2)">→ m = 1 只能整串严格交替</text>

  <!-- D. 结论 -->
  <rect x="40" y="400" width="480" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">check(m)：Σ ⌊L/(m+1)⌋ ≤ numOps（m ≥ 2，逐段独立）</text>
  <text x="280" y="433" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">m = 1：整串交替特判——min(d, n−d) ≤ numOps</text>
</svg>
