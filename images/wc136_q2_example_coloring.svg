<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 3：4 个花园两两相邻，正好用满 4 种颜色</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">paths = [[1,2],[2,3],[3,4],[4,1],[1,3],[2,4]]，输出 [1,2,3,4]</text>

  <g filter="url(#rough2)">
    <polygon points="150,140 300,140 300,250 150,250" fill="none" stroke="#ccc" stroke-width="1.2"/>
    <path d="M 150 140 L 300 250" stroke="#ddd" stroke-width="1.2" fill="none"/>
    <path d="M 300 140 L 150 250" stroke="#ddd" stroke-width="1.2" fill="none"/>
  </g>

  <circle cx="150" cy="140" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
  <circle cx="300" cy="140" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
  <circle cx="150" cy="250" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="12" fill="#8a6a20">4</text>
  <circle cx="300" cy="250" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#8a3a36">3</text>

  <text x="196" y="130" text-anchor="middle" font-size="9.5" fill="#888">1-2</text>
  <text x="256" y="212" text-anchor="middle" font-size="9.5" fill="#888">2-4</text>
  <text x="196" y="266" text-anchor="middle" font-size="9.5" fill="#888">4-3</text>
  <text x="256" y="184" text-anchor="middle" font-size="9.5" fill="#888">3-1</text>

  <rect x="352" y="76" width="180" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="366" y="96" font-size="11" fill="#8a6a20" font-weight="bold">逐个染色的过程</text>
  <text x="366" y="120" font-size="10" fill="#555">1 号：无邻居 → 选 1</text>
  <text x="366" y="142" font-size="10" fill="#555">2 号：邻居{1} → 选 2</text>
  <text x="366" y="164" font-size="10" fill="#555">3 号：邻居{1,2,4}？</text>
  <text x="366" y="182" font-size="10" fill="#555">　此时 4 号还没染，</text>
  <text x="366" y="200" font-size="10" fill="#555">　只看到 {1,2} → 选 3</text>
  <text x="366" y="222" font-size="10" fill="#555">4 号：邻居{1,2,3}</text>
  <text x="366" y="240" font-size="10" fill="#8a6a20">　→ 只能选 4 ✓</text>

  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#999">顺序染色时，后面的点看到的是「已染色的邻居」，这保证了每步都只剩一个可用颜色时不会冲突</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999">示例 1（三角形）得 [1,2,3]，示例 2（两条独立边）得 [1,2,1,2]</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#999">答案不唯一，返回任意合法方案即可</text>
</svg>
