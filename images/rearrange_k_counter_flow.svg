<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">算法流程：哈希计数比较块多重集</text>

  <!-- step 1 -->
  <rect x="150" y="52" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">块长 m = n / k</text>

  <path d="M 260 94 L 260 106" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="150" y="110" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">把 s 切成 k 块</text>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[block] += 1</text>

  <path d="M 260 162 L 260 174" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="150" y="178" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">把 t 切成 k 块</text>
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#2d5a20" filter="url(#rough2)">cnt[block] −= 1</text>

  <text x="452" y="198" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">减穿 &lt; 0</text>
  <text x="452" y="213" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">可提前</text>
  <text x="452" y="228" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">return false</text>

  <path d="M 260 230 L 260 244" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,246 348,292 260,338 172,292" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">计数全为 0？</text>

  <!-- branches -->
  <path d="M 210 322 C 180 345, 155 355, 140 366" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 310 322 C 340 345, 365 355, 380 366" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">是</text>
  <text x="372" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">否</text>

  <!-- verdict boxes -->
  <rect x="70" y="370" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="140" y="397" text-anchor="middle" font-size="16" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">true</text>

  <rect x="310" y="370" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="397" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">false</text>

  <text x="68" y="297" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两边各 k 块</text>
  <text x="68" y="312" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不减穿 ⟺ 全零</text>

  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n) · 空间 O(n)</text>
</svg>
