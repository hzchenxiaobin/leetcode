<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三步流水线：严格按题面顺序执行</text>

  <rect x="40" y="46" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="69" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">输入 caption（仅字母和空格）</text>

  <path d="M 140 86 L 140 108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="112" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 所有单词拼成驼峰串</text>
  <text x="140" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">并在最前面加 “#”</text>

  <path d="M 140 162 L 140 184" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="188" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="209" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 删除所有非字母字符</text>
  <text x="140" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">但保留第一个字符 “#”</text>

  <path d="M 140 238 L 140 260" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="264" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="285" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 截断为最多 100 个字符</text>
  <text x="140" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">“#” 也计入这 100 个</text>

  <path d="M 140 314 L 140 336" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="340" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="363" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">输出 tag（长度 ≤ 100）</text>

  <path d="M 240 135 L 266 135" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 211 L 266 211" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 287 L 266 287" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="104" width="272" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="286" y="126" font-size="11" fill="#333" filter="url(#rough2)">首词全小写；其余词首字母大写、剩余小写</text>
  <text x="286" y="144" font-size="11" fill="#333" filter="url(#rough2)">“Leetcode daily streak achieved”</text>
  <text x="286" y="160" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ “#leetcodeDailyStreakAchieved”（28 字符）</text>

  <rect x="272" y="178" width="272" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="286" y="200" font-size="11" fill="#333" filter="url(#rough2)">约束：caption 只含字母和空格</text>
  <text x="286" y="216" font-size="11" fill="#333" filter="url(#rough2)">分词拼接后串里只有字母和 “#”</text>
  <text x="286" y="232" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 无字符可删，本步是空操作 ✓</text>

  <rect x="272" y="252" width="272" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="286" y="274" font-size="11" fill="#333" filter="url(#rough2)">100 个字符 = “#” + 99 个字母</text>
  <text x="286" y="290" font-size="11" fill="#333" filter="url(#rough2)">示例 3：“#” + 101 个 h = 102 字符</text>
  <text x="286" y="306" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 截去末尾 2 个，剩 100 个字符</text>
</svg>
