<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="480" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：删除 → 左移 → 新下标 = 前面【保留】的元素个数（nums = [1,0,1,2]）</text>

  <!-- 原数组 -->
  <rect x="106" y="64" width="76" height="42" rx="6" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="230" y="64" width="76" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="354" y="64" width="76" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="478" y="64" width="76" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="268" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="392" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="516" y="91" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M114,72 L174,100" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M174,72 L114,100" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="144" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">删除它！</text>
  <text x="144" y="124" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="268" y="124" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="392" y="124" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="516" y="124" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>

  <!-- 删除箭头 -->
  <path d="M330,140 L330,182" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="166" font-size="12" fill="#666" filter="url(#rough2)">删除后左移，下标从 0 重新分配</text>

  <!-- 新数组 -->
  <rect x="168" y="196" width="76" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="292" y="196" width="76" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="416" y="196" width="76" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="223" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="330" y="223" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="454" y="223" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="206" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="330" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="454" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="206" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新下标 0</text>
  <text x="330" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新下标 1</text>
  <text x="454" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新下标 2</text>
  <text x="206" y="274" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（原 i=1）</text>
  <text x="330" y="274" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（原 i=2）</text>
  <text x="454" y="274" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（原 i=3）</text>
  <text x="580" y="221" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">三个</text>
  <text x="580" y="238" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">固定点！</text>

  <!-- 双重刻画 -->
  <rect x="56" y="300" width="268" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="322" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">v = nums[i]：想占的新下标</text>
  <text x="190" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= 它前面【保留】的元素个数</text>
  <text x="190" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">固定点的新下标互不相同</text>
  <text x="190" y="390" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⇒ v 必须严格递增</text>

  <rect x="336" y="300" width="268" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="322" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">u = i − v：垫背删除数</text>
  <text x="470" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= 它前面【删除】的元素个数</text>
  <text x="470" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">删除只会累积，不会撤销</text>
  <text x="470" y="390" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">⇒ u 必须单调不减</text>

  <!-- 结论 -->
  <rect x="56" y="422" width="548" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">合法固定点集合 ⇔ v 严格递增 且 u 单调不减</text>
  <text x="330" y="457" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（候选要求 nums[i] ≤ i，即 u ≥ 0）—— 这两条约束充分且必要</text>
</svg>
