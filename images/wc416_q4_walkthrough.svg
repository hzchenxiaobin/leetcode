<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：word1 = "abcba"，word2 = "abc"</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">need：a×1、b×1、c×1，less 初值 = 3（欠 a、b、c 三种）</text>

  <!-- string cells -->
  <g filter="url(#rough2)">
    <text x="230" y="102" text-anchor="end" font-size="12" fill="#888">word1：</text>
    <rect x="250" y="76" width="56" height="44" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="314" y="76" width="56" height="44" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="378" y="76" width="56" height="44" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="442" y="76" width="56" height="44" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <rect x="506" y="76" width="56" height="44" rx="4" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="278" y="104" text-anchor="middle" font-size="16" fill="#333">a</text>
    <text x="342" y="104" text-anchor="middle" font-size="16" fill="#333">b</text>
    <text x="406" y="104" text-anchor="middle" font-size="16" fill="#333">c</text>
    <text x="470" y="104" text-anchor="middle" font-size="16" fill="#333">b</text>
    <text x="534" y="104" text-anchor="middle" font-size="16" fill="#333">a</text>
    <text x="278" y="134" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="342" y="134" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="406" y="134" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="470" y="134" text-anchor="middle" font-size="11" fill="#999">3</text>
    <text x="534" y="134" text-anchor="middle" font-size="11" fill="#999">4</text>
  </g>

  <!-- row highlights -->
  <g filter="url(#rough2)">
    <rect x="61" y="196" width="718" height="51" fill="#e6f4ea"/>
    <rect x="61" y="248" width="718" height="51" fill="#fff8e1"/>
    <rect x="61" y="300" width="718" height="51" fill="#fce4ec"/>
  </g>

  <!-- table grid -->
  <g filter="url(#rough2)" stroke="#8a8a8a" stroke-width="1.2">
    <rect x="60" y="165" width="720" height="290" fill="none" stroke="#446688" stroke-width="1.8"/>
    <line x1="60" y1="195" x2="780" y2="195"/>
    <line x1="60" y1="247" x2="780" y2="247"/>
    <line x1="60" y1="299" x2="780" y2="299"/>
    <line x1="60" y1="351" x2="780" y2="351"/>
    <line x1="60" y1="403" x2="780" y2="403"/>
    <line x1="105" y1="165" x2="105" y2="455"/>
    <line x1="185" y1="165" x2="185" y2="455"/>
    <line x1="320" y1="165" x2="320" y2="455"/>
    <line x1="560" y1="165" x2="560" y2="455"/>
    <line x1="610" y1="165" x2="610" y2="455"/>
    <line x1="680" y1="165" x2="680" y2="455"/>
  </g>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="61" y="166" width="718" height="28" fill="#e8f0fe"/>
    <text x="82" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">r</text>
    <text x="145" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">入窗</text>
    <text x="252" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">less 变化</text>
    <text x="440" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">while 弹出（弹到失合法）</text>
    <text x="585" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">l</text>
    <text x="645" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">贡献</text>
    <text x="730" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">ans 累计</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)" font-size="12" fill="#444">
    <text x="82" y="227" text-anchor="middle">0</text>
    <text x="145" y="227" text-anchor="middle">a</text>
    <text x="252" y="227" text-anchor="middle">3 → 2</text>
    <text x="440" y="227" text-anchor="middle" font-size="11.5">—（窗口不合法）</text>
    <text x="585" y="227" text-anchor="middle">0</text>
    <text x="645" y="227" text-anchor="middle">0</text>
    <text x="730" y="227" text-anchor="middle">0</text>

    <text x="82" y="279" text-anchor="middle">1</text>
    <text x="145" y="279" text-anchor="middle">b</text>
    <text x="252" y="279" text-anchor="middle">2 → 1</text>
    <text x="440" y="279" text-anchor="middle" font-size="11.5">—</text>
    <text x="585" y="279" text-anchor="middle">0</text>
    <text x="645" y="279" text-anchor="middle">0</text>
    <text x="730" y="279" text-anchor="middle">0</text>

    <text x="82" y="331" text-anchor="middle">2</text>
    <text x="145" y="331" text-anchor="middle">c</text>
    <text x="252" y="331" text-anchor="middle" font-weight="bold" fill="#2b5a2b">1 → 0 ✓</text>
    <text x="440" y="331" text-anchor="middle" font-size="11.5">弹 a（跌破等号）</text>
    <text x="585" y="331" text-anchor="middle">1</text>
    <text x="645" y="331" text-anchor="middle" font-weight="bold" fill="#2b5a2b">1</text>
    <text x="730" y="331" text-anchor="middle" font-weight="bold" fill="#2b5a2b">1</text>

    <text x="82" y="383" text-anchor="middle">3</text>
    <text x="145" y="383" text-anchor="middle">b</text>
    <text x="252" y="383" text-anchor="middle" font-size="11.5">1（富余不动）</text>
    <text x="440" y="383" text-anchor="middle" font-size="11.5">—（[1,3] 仍缺 a）</text>
    <text x="585" y="383" text-anchor="middle">1</text>
    <text x="645" y="383" text-anchor="middle">1</text>
    <text x="730" y="383" text-anchor="middle">2</text>

    <text x="82" y="435" text-anchor="middle">4</text>
    <text x="145" y="435" text-anchor="middle">a</text>
    <text x="252" y="435" text-anchor="middle" font-weight="bold" fill="#a04a46">1 → 0 ✓</text>
    <text x="440" y="435" text-anchor="middle" font-size="11.5">弹 b（富余）→ 弹 c（跌破）</text>
    <text x="585" y="435" text-anchor="middle" font-weight="bold" fill="#a04a46">3</text>
    <text x="645" y="435" text-anchor="middle" font-weight="bold" fill="#a04a46">3</text>
    <text x="730" y="435" text-anchor="middle" font-weight="bold" fill="#a04a46">5</text>
  </g>

  <!-- callouts -->
  <g filter="url(#rough2)">
    <rect x="60" y="478" width="350" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="235" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10">r = 3：l 没动，但 [l−1, r] = [0,3] 仍合法</text>
    <text x="235" y="530" text-anchor="middle" font-size="11.5" fill="#9a7420">不变量兜底——贡献 1 恰好只计入 "abcb"</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="430" y="478" width="350" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="605" y="506" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">r = 4：弹掉富余的 b 后 less 仍为 0</text>
    <text x="605" y="530" text-anchor="middle" font-size="11.5" fill="#446688">继续弹到 c 才跌破——自动跳过冗余前缀</text>
  </g>

  <!-- answer box -->
  <g filter="url(#rough2)">
    <rect x="60" y="570" width="720" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="420" y="602" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a2b">答案 5：abc（r=2）· abcb（r=3）· cba、bcba、abcba（r=4 贡献 3 个）</text>
  </g>
</svg>
