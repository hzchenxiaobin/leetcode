<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次整除判定，O(1)</text>

  <!-- input -->
  <g filter="url(#rough2)">
    <rect x="190" y="52" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="79" font-size="15" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">读入 num（≤ 10^15）</text>

  <path d="M 280 96 C 280 112, 280 122, 280 134" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <g filter="url(#rough2)">
    <polygon points="280,138 400,184 280,230 160,184" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="180" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">num % 3 == 0 ？</text>
  <text x="280" y="202" font-size="13" fill="#666" text-anchor="middle" filter="url(#rough2)">（num = 3x 是否有整数解）</text>

  <!-- yes branch -->
  <path d="M 160 184 C 110 184, 80 192, 62 208" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="176" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="40" y="212" width="180" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="130" y="236" text-anchor="middle" font-weight="bold" fill="#2d5a22">x = num / 3</text>
    <text x="130" y="256" text-anchor="middle">返回 [x−1, x, x+1]</text>
    <text x="130" y="274" text-anchor="middle" font-size="12" fill="#666">num=0 时得 [−1,0,1] 也合法</text>
  </g>

  <!-- no branch -->
  <path d="M 400 184 C 450 184, 480 192, 498 208" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="176" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="340" y="212" width="180" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="430" y="240" text-anchor="middle" font-weight="bold" fill="#8c3a36">返回空数组 []</text>
    <text x="430" y="262" text-anchor="middle" font-size="12" fill="#666">余 1 或 2 → 中心数非整数</text>
  </g>

  <!-- pitfalls -->
  <g filter="url(#rough2)">
    <rect x="40" y="312" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#8a6d1f">
    <text x="280" y="334" text-anchor="middle">易错点：num ≤ 10^15 超出 32 位 int 范围（约 2.1×10^9），</text>
    <text x="280" y="354" text-anchor="middle">C++ 必须用 long long；返回类型是 long[]，别用 int 数组</text>
  </g>
</svg>
