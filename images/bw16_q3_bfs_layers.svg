<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="105"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">BFS 逐层累计：队列里永远只有「当前层」</text>

  <!-- 第 0 层 -->
  <ellipse cx="180" cy="76" rx="30" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="82" font-size="12.5" fill="#888" filter="url(#rough2)">第 0 层 sum=1</text>

  <path d="M 156 96 C 130 118, 118 130, 104 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 96 C 230 118, 242 130, 256 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 1 层 -->
  <ellipse cx="96" cy="170" rx="28" ry="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="264" cy="170" rx="28" ry="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="60" y="146" font-size="12.5" fill="#888" filter="url(#rough2)">第 1 层</text>
  <text x="60" y="162" font-size="12.5" fill="#888" filter="url(#rough2)">sum=2+3=5</text>

  <path d="M 80 190 C 66 212, 60 222, 54 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 112 190 C 126 212, 132 222, 138 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 190 C 230 214, 218 226, 206 242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 层 -->
  <ellipse cx="52" cy="262" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <ellipse cx="140" cy="262" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <ellipse cx="200" cy="262" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="60" y="232" font-size="12.5" fill="#888" filter="url(#rough2)">第 2 层</text>
  <text x="60" y="248" font-size="12.5" fill="#888" filter="url(#rough2)">sum=4+5+6=15</text>

  <path d="M 40 282 C 34 296, 32 304, 30 314" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 3 层 -->
  <ellipse cx="28" cy="336" rx="24" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="28" y="342" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="86" y="306" font-size="12.5" fill="#b85450" filter="url(#rough2)">第 3 层（最深层）</text>
  <text x="86" y="324" font-size="12.5" fill="#b85450" filter="url(#rough2)">sum=7 → 最终答案</text>

  <!-- 右侧说明 -->
  <rect x="360" y="120" width="250" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="148" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">每层的固定套路</text>
  <text x="485" y="174" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">1. sz = q.size() 先拍下</text>
  <text x="485" y="196" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">2. sum = 0 清零重来</text>
  <text x="485" y="218" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">3. 弹 sz 个：累加 + 子女入队</text>
  <text x="485" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">循环结束时，sum 恰好是</text>
  <text x="485" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最后一个非空层的和</text>
  <text x="485" y="286" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">（例中为 [1,2,3,4,5,null,6,7]）</text>

  <text x="360" y="330" font-size="12" fill="#888" filter="url(#rough2)">不需要先求「最大深度」再求和：层数信息藏在循环轮数里。</text>
</svg>
