<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">前缀和：任意区间和 O(1) 查询</text>

  <!-- nums row -->
  <text x="85" y="107" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="100" y="82" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="170" y="82" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="82" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="82" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="108" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="200" y="108" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="270" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="200" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="340" y="134" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <!-- bracket for queried subarray -->
  <path d="M 100 142 L 100 152 L 230 152 L 230 142" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="170" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">查询子数组 [3, −2]</text>

  <path d="M 165 178 Q 165 188 165 198" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="330" y="192" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">P[j] = 前 j 个数之和（P[0] = 0）</text>

  <!-- prefix row -->
  <text x="52" y="235" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">P</text>
  <rect x="70" y="210" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="210" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="210" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="210" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="210" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="236" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="170" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="236" text-anchor="middle" font-size="15" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="310" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">P[0]</text>
  <text x="170" y="264" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P[1]</text>
  <text x="240" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P[2]</text>
  <text x="310" y="264" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P[3]</text>
  <text x="380" y="264" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P[4]</text>

  <!-- converging arrows -->
  <path d="M 108 252 Q 118 284 172 296" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 252 252 Q 262 284 300 296" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="92" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">减数 P[0]=0</text>
  <text x="330" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">被减 P[2]=1</text>

  <!-- result box -->
  <rect x="100" y="302" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="240" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">sum(0..1) = P[2] − P[0] = 1</text>

  <!-- general formula -->
  <rect x="55" y="354" width="410" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">通用：sum(i..j) = P[j+1] − P[i]，长度 j − i + 1 ∈ [l, r]</text>
</svg>
