<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 单遍扫描，只跟队尾比</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不排序就得两两比较；排序把「找祖先」变成「看前一个保留项」</text>

  <rect x="200" y="56" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 把 folder 按字典序升序排序</text>

  <rect x="170" y="102" width="300" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">② ans = [folder[0]]，prev = folder[0]</text>
  <text x="320" y="140" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">从 i = 1 开始逐个考察（循环头）</text>

  <polygon points="320,160 452,212 320,264 188,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ folder[i] 以</text>
  <text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">prev + "/" 开头？</text>

  <path d="M 320 90 L 320 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 150 L 320 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="188" width="128" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="208" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">是 → 跳过</text>
  <text x="104" y="226" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">它是 prev 的子文件夹</text>
  <path d="M 186 212 L 172 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="472" y="188" width="128" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="536" y="208" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">否 → 保留</text>
  <text x="536" y="226" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">ans.push；prev = f</text>
  <path d="M 454 212 L 470 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="292" width="180" height="34" rx="6" fill="#eef0f2" stroke="#7a8088" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="314" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">④ i++，处理下一个 f</text>

  <path d="M 104 236 L 104 309 L 226 309" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 536 236 L 536 309 L 414 309" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 328 L 30 328 L 30 122 L 166 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="352" width="400" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⑤ i 走完 → 返回 ans（顺序任意，判题按集合比较）</text>

  <text x="320" y="406" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">排序 O(n log n) 次比较，扫描 O(n) 次前缀比较，量级 O(n log n · L)</text>
</svg>
