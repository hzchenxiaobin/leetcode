<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "cbaccba" → "acb"（三条规则各出场一次）</text>

  <!-- 输入条 -->
  <text x="52" y="60" font-size="11" fill="#666" filter="url(#rough2)">s =</text>
  <rect x="80" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="112" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="127" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="144" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="159" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="176" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="191" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="208" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="223" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="240" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="272" y="44" width="30" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="95" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="127" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="159" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="191" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="223" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="255" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="287" y="82" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">6</text>

  <text x="470" y="58" font-size="10" fill="#666" filter="url(#rough2)">通道一</text>
  <rect x="508" y="48" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="546" y="58" font-size="10" fill="#666" filter="url(#rough2)">通道二</text>
  <rect x="584" y="48" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="76" font-size="10" fill="#666" filter="url(#rough2)">修剪</text>
  <rect x="508" y="66" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 行模板：y0 = 96 + i*46 -->
  <!-- row 1: c -->
  <rect x="36" y="96" width="552" height="40" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="103" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="86" y="112" font-size="10" fill="#555" filter="url(#rough2)">直接入栈</text>
  <rect x="420" y="103" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="121" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="456" y="120" font-size="9" fill="#999" filter="url(#rough2)">← 新入栈</text>

  <!-- row 2: b 通道一 -->
  <rect x="36" y="142" width="552" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="149" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="86" y="158" font-size="10" fill="#2f5d24" filter="url(#rough2)">c &gt; b：后缀还有 c（下标 3、4）→ 弹【通道一】；入 b</text>
  <text x="86" y="172" font-size="9" fill="#666" filter="url(#rough2)">后面补得回来，先用更小的 b</text>
  <rect x="420" y="149" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="167" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- row 3: a 通道一 -->
  <rect x="36" y="188" width="552" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="195" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="86" y="204" font-size="10" fill="#2f5d24" filter="url(#rough2)">b &gt; a：后缀还有 b（下标 5）→ 弹【通道一】；入 a</text>
  <text x="86" y="218" font-size="9" fill="#666" filter="url(#rough2)">栈被清空，从头再来</text>
  <rect x="420" y="195" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="213" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- row 4: c -->
  <rect x="36" y="234" width="552" height="40" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="241" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="86" y="256" font-size="10" fill="#555" filter="url(#rough2)">a &lt; c：直接入栈</text>
  <rect x="420" y="241" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="450" y="241" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="259" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- row 5: c 试探 -->
  <rect x="36" y="280" width="552" height="40" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="287" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="86" y="296" font-size="10" fill="#555" filter="url(#rough2)">栈顶 c = c：相等不弹；无条件入栈（宽进试探）</text>
  <text x="86" y="310" font-size="9" fill="#666" filter="url(#rough2)">这份 c 是否留下，等后面的字符来裁决</text>
  <rect x="420" y="287" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="450" y="287" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="305" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="480" y="287" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="305" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- row 6: b 通道二 -->
  <rect x="36" y="326" width="552" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="333" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="86" y="342" font-size="10" fill="#8a6d1f" filter="url(#rough2)">c &gt; b：后缀无 c，但栈内 c 有 2 份 → 弹一份【通道二】</text>
  <text x="86" y="356" font-size="9" fill="#666" filter="url(#rough2)">再判：剩 1 份且后缀无 → 停（保底不许弹）；入 b</text>
  <rect x="420" y="333" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="450" y="333" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="480" y="333" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="351" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- row 7: a 卡住 -->
  <rect x="36" y="372" width="552" height="40" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="42" y="379" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="86" y="388" font-size="10" fill="#555" filter="url(#rough2)">b &gt; a：后缀无 b、栈内 b 仅 1 份 → 卡住不弹</text>
  <text x="86" y="402" font-size="9" fill="#666" filter="url(#rough2)">无条件入栈（宽进试探）——留不留，交给修剪裁决</text>
  <rect x="420" y="379" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="450" y="379" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="480" y="379" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="493" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="510" y="379" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="523" y="397" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- row 8: 修剪 -->
  <rect x="36" y="418" width="552" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="42" y="425" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="443" text-anchor="middle" font-size="12" fill="#a0433f" filter="url(#rough2)">✂</text>
  <text x="86" y="434" font-size="10" fill="#a0433f" filter="url(#rough2)">尾部修剪：末尾 a 栈内有 2 份 → 弹；b 仅 1 份 → 停</text>
  <text x="86" y="448" font-size="9" fill="#a0433f" filter="url(#rough2)">末字母必须唯一——试探失败的 a 被收回</text>
  <rect x="420" y="425" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="443" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="450" y="425" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="463" y="443" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="480" y="425" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="443" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="520" y="443" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= "acb" ✓</text>
</svg>
