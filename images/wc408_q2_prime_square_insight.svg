<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="672" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">「恰好两个真因数」 ⟺ 「恰好三个因数」 ⟺ 「质数的平方」</text>
  <path d="M 190 42 Q 380 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A: divisor pairing around sqrt(x), x = 36 ===== -->
  <text x="247" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 因数围绕 √x 成对出现（以 36 为例）</text>

  <!-- pairing arcs above the boxes -->
  <path d="M 77 144 Q 245 86 413 144" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 119 144 Q 245 104 371 144" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 161 144 Q 245 120 329 144" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 203 144 Q 245 134 287 144" stroke="#888888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="245" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1 × 36</text>
  <text x="245" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 × 18</text>
  <text x="245" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3 × 12</text>
  <text x="245" y="141" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">4 × 9</text>

  <!-- divisor boxes: 1 2 3 4 [6] 9 12 18 36 -->
  <g filter="url(#rough2)">
    <rect x="60" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="102" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="186" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="228" y="148" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="270" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="312" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="354" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="396" y="148" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="77" y="169">1</text>
    <text x="119" y="169">2</text>
    <text x="161" y="169">3</text>
    <text x="203" y="169">4</text>
    <text x="245" y="169" font-weight="bold" fill="#a07820">6</text>
    <text x="287" y="169">9</text>
    <text x="329" y="169">12</text>
    <text x="371" y="169">18</text>
    <text x="413" y="169">36</text>
  </g>
  <text x="245" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">√36 = 6 落单 → 自己和自己配对 → 因数个数 9 为奇数</text>
  <text x="245" y="222" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">非完全平方数的因数两两配对、个数必为偶数；</text>
  <text x="245" y="238" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">要恰好 3 个因数 ⟹ 必是完全平方数 m²</text>

  <!-- ===== Panel B: reasoning chain ===== -->
  <text x="611" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 三步推理链</text>

  <g filter="url(#rough2)">
    <rect x="486" y="92" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="611" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">「恰好 2 个真因数」</text>
  <text x="611" y="126" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（因数去掉自身 x）</text>
  <line x1="611" y1="134" x2="611" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="486" y="152" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="611" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">「恰好 3 个因数」</text>
  <text x="611" y="186" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（补回 x 本身：1 + 两个真因数）</text>
  <line x1="611" y1="194" x2="611" y2="210" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="486" y="212" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="611" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3 是奇数 ⟹ x = m²</text>
  <text x="611" y="246" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（奇数个因数 ⟺ 完全平方数）</text>
  <line x1="611" y1="254" x2="611" y2="270" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="486" y="272" width="250" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="611" y="291" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">因数恰为 1、m、m²</text>
  <text x="611" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">⟹ m 必是质数 p，即 x = p²</text>

  <!-- ===== Panel C: verify candidates ===== -->
  <text x="380" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 对账：候选数字逐个验证</text>

  <!-- card row 1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="372" width="232" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="140" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4 = 2²</text>
  <text x="140" y="426" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1, 2}：恰 2 个</text>
  <text x="140" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 特殊数字</text>

  <g filter="url(#rough2)">
    <rect x="264" y="372" width="232" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">9 = 3²</text>
  <text x="380" y="426" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1, 3}：恰 2 个</text>
  <text x="380" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 特殊数字</text>

  <g filter="url(#rough2)">
    <rect x="504" y="372" width="232" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="620" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">25 = 5²</text>
  <text x="620" y="426" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1, 5}：恰 2 个</text>
  <text x="620" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 特殊数字</text>

  <!-- card row 2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="486" width="232" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="140" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2828" filter="url(#rough2)">6 = 2×3</text>
  <text x="140" y="540" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1, 2, 3}：3 个</text>
  <text x="140" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#rough2)">✗ 不是（不是平方数）</text>

  <g filter="url(#rough2)">
    <rect x="264" y="486" width="232" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="380" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2828" filter="url(#rough2)">16 = 4²</text>
  <text x="380" y="540" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1, 2, 4, 8}：4 个</text>
  <text x="380" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#rough2)">✗ 不是（m = 4 是合数）</text>

  <g filter="url(#rough2)">
    <rect x="504" y="486" width="232" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="620" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2828" filter="url(#rough2)">7（质数）</text>
  <text x="620" y="540" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">真因数 {1}：仅 1 个</text>
  <text x="620" y="566" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2828" filter="url(#rough2)">✗ 不是（质数不是特殊数字）</text>

  <!-- ===== takeaway ===== -->
  <g filter="url(#rough2)">
    <rect x="24" y="606" width="712" height="52" rx="10" fill="#fffdf3" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="380" y="628" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">特殊数字 = {p² ： p 为质数}——形状一旦刻画，只需在 p ≤ ⌊√r⌋ ≤ 31622 的世界里数质数</text>
  <text x="380" y="648" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">全值域内特殊数字仅 π(31622) = 3401 个，区间再长，代价也只与 √r 有关</text>
</svg>
