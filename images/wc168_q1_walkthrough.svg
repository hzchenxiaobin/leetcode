<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：nums = [12, 345, 2, 6, 7896]</text>
  <text x="330" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逐个数位、逐次判定；绿色行表示命中（位数为偶数），ans 只在这些行自增</text>

  <g filter="url(#rough2)">
    <rect x="40" y="72" width="560" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="40" y="104" width="560" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="40" y="136" width="560" height="32" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <rect x="40" y="168" width="560" height="32" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <rect x="40" y="200" width="560" height="32" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2" rx="4"/>
    <rect x="40" y="232" width="560" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" stroke="#d5d5d5" stroke-width="1">
    <path d="M 118 74 L 118 262" fill="none"/>
    <path d="M 196 74 L 196 262" fill="none"/>
    <path d="M 376 74 L 376 262" fill="none"/>
    <path d="M 486 74 L 486 262" fill="none"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold">
    <text x="79" y="93">nums[i]</text>
    <text x="157" y="93">位数 d</text>
    <text x="286" y="93">命中区间</text>
    <text x="431" y="93">位数奇偶</text>
    <text x="543" y="93">ans</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <text x="79" y="125" fill="#3a5a30" font-weight="bold">12</text>
    <text x="157" y="125" fill="#333">2</text>
    <text x="286" y="125" fill="#3a5a30">[10, 100)</text>
    <text x="431" y="125" fill="#3a5a30" font-weight="bold">偶数 ✓</text>
    <text x="543" y="125" fill="#3a5a30" font-weight="bold">1</text>

    <text x="79" y="157" fill="#555">345</text>
    <text x="157" y="157" fill="#333">3</text>
    <text x="286" y="157" fill="#999">—</text>
    <text x="431" y="157" fill="#999">奇数 ✗</text>
    <text x="543" y="157" fill="#555">1</text>

    <text x="79" y="189" fill="#555">2</text>
    <text x="157" y="189" fill="#333">1</text>
    <text x="286" y="189" fill="#999">—</text>
    <text x="431" y="189" fill="#999">奇数 ✗</text>
    <text x="543" y="189" fill="#555">1</text>

    <text x="79" y="221" fill="#555">6</text>
    <text x="157" y="221" fill="#333">1</text>
    <text x="286" y="221" fill="#999">—</text>
    <text x="431" y="221" fill="#999">奇数 ✗</text>
    <text x="543" y="221" fill="#555">1</text>

    <text x="79" y="253" fill="#3a5a30" font-weight="bold">7896</text>
    <text x="157" y="253" fill="#333">4</text>
    <text x="286" y="253" fill="#3a5a30">[1000, 10000)</text>
    <text x="431" y="253" fill="#3a5a30" font-weight="bold">偶数 ✓</text>
    <text x="543" y="253" fill="#3a5a30" font-weight="bold">2</text>
  </g>

  <rect x="40" y="286" width="560" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="310" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结果：ans = 2（命中 12 与 7896）</text>
  <text x="56" y="334" font-size="10" fill="#555" filter="url(#rough2)">示例 2：nums = [555, 901, 482, 1771] → 位数 3, 3, 3, 4 → 只有 1771 命中 → 输出 1</text>

  <text x="330" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 345 与 2、6 只差在位数：三位、一位都属奇数位，判定为「不计数」而不是「提前退出」</text>
  <text x="330" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若把上界放宽到 10⁹，偶数位区间还要追加 [10⁶, 10⁷) 与 [10⁸, 10¹⁰)，或直接改用除以 10 的循环</text>
  <text x="330" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">整个流程没有排序、没有哈希，ans 的单调不减也保证了计数不会重复</text>
</svg>
