<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：classroom = ["LS","RL"]，energy = 4 → 最少 3 步</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== grid 2x2, cell 72, origin (90,100) ===== -->
  <g filter="url(#sk)"><rect x="90" y="100" width="72" height="72" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="126" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07020">L①</text>
  <text x="126" y="158" text-anchor="middle" font-size="11" fill="#888">e = 3 收①</text>

  <g filter="url(#sk)"><rect x="162" y="100" width="72" height="72" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="198" y="134" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a6a2a">S</text>
  <text x="198" y="158" text-anchor="middle" font-size="11" fill="#888">出发 e = 4</text>

  <g filter="url(#sk)"><rect x="90" y="172" width="72" height="72" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2.5"/></g>
  <text x="126" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">R</text>
  <text x="126" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">e = 4 回满!</text>

  <g filter="url(#sk)"><rect x="162" y="172" width="72" height="72" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="198" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#a07020">L②</text>
  <text x="198" y="230" text-anchor="middle" font-size="11" fill="#888">e = 3 收② 全满</text>

  <!-- winning path arrows -->
  <path d="M 176,136 L 154,136" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="165" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">1</text>
  <path d="M 126,150 L 126,192" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="104" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">2</text>
  <path d="M 138,208 L 186,208" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="162" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">3</text>

  <!-- ===== energy bars ===== -->
  <text x="90" y="282" font-size="12" font-weight="bold" fill="#2b2b2b">能量条（E = 4）</text>
  <text x="90" y="300" text-anchor="middle" font-size="10" fill="#666">步0 · S</text>
  <g filter="url(#sk)">
    <rect x="90" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="105" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="120" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="135" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
  </g>
  <text x="168" y="300" text-anchor="middle" font-size="10" fill="#666">步1 · L①</text>
  <g filter="url(#sk)">
    <rect x="168" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="183" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="198" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="213" y="306" width="13" height="10" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>
  <text x="246" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">步2 · R 重置</text>
  <g filter="url(#sk)">
    <rect x="246" y="306" width="13" height="10" fill="#b85450" stroke="#8a3a36" stroke-width="0.8"/>
    <rect x="261" y="306" width="13" height="10" fill="#b85450" stroke="#8a3a36" stroke-width="0.8"/>
    <rect x="276" y="306" width="13" height="10" fill="#b85450" stroke="#8a3a36" stroke-width="0.8"/>
    <rect x="291" y="306" width="13" height="10" fill="#b85450" stroke="#8a3a36" stroke-width="0.8"/>
  </g>
  <text x="324" y="300" text-anchor="middle" font-size="10" fill="#666">步3 · L②</text>
  <g filter="url(#sk)">
    <rect x="324" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="339" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="354" y="306" width="13" height="10" fill="#4a8edb" stroke="#2b6e9e" stroke-width="0.8"/>
    <rect x="369" y="306" width="13" height="10" fill="#ffffff" stroke="#999" stroke-width="0.8"/>
  </g>

  <!-- ===== why detour note ===== -->
  <g filter="url(#sk)"><rect x="90" y="336" width="279" height="96" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="106" y="362" font-size="12" font-weight="bold" fill="#7a5415">为什么「绕路」反而赢了？</text>
  <text x="106" y="386" font-size="11" fill="#444">踩 R 多花步数，换来的是满能量；</text>
  <text x="106" y="406" font-size="11" fill="#444">能量不进状态，这种「先充电再干活」</text>
  <text x="106" y="426" font-size="11" fill="#444">的走法根本无法表达。</text>

  <!-- ===== right: BFS level table ===== -->
  <g filter="url(#sk)"><rect x="390" y="92" width="520" height="38" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="650" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">按层 BFS 的状态列表 —— (位置, 掩码, 能量)</text>

  <g filter="url(#sk)"><rect x="390" y="142" width="520" height="42" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="408" y="168" font-size="11" font-weight="bold" fill="#4a8edb">第 0 层</text>
  <text x="486" y="168" font-size="12" fill="#333">((0,1), 00, 4) —— 起点 S，满能量</text>

  <g filter="url(#sk)"><rect x="390" y="194" width="520" height="42" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="408" y="220" font-size="11" font-weight="bold" fill="#4a8edb">第 1 层</text>
  <text x="486" y="220" font-size="12" fill="#333">((0,0), 01, 3) 收① ｜ ((1,1), 10, 3) 收②</text>

  <g filter="url(#sk)"><rect x="390" y="246" width="520" height="58" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="408" y="268" font-size="11" font-weight="bold" fill="#4a8edb">第 2 层</text>
  <text x="486" y="268" font-size="12" fill="#333">((0,1), 01, 2) ｜ ((1,0), 01, 4) ←踩 R 回满</text>
  <text x="486" y="290" font-size="12" fill="#333">((0,1), 10, 2) ｜ ((1,0), 10, 4) ←踩 R 回满</text>

  <g filter="url(#sk)"><rect x="390" y="316" width="520" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="408" y="344" font-size="11" font-weight="bold" fill="#2e6e2e">第 3 层</text>
  <text x="486" y="344" font-size="12" font-weight="bold" fill="#2e6e2e">((1,1), 11, ·)、((0,0), 11, ·) —— 掩码全满 → 返回 3</text>

  <g filter="url(#sk)"><rect x="390" y="378" width="520" height="132" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="406" y="404" font-size="12" font-weight="bold" fill="#7a5415">三个观察</text>
  <text x="406" y="428" font-size="11" fill="#444">· 第 2 层中 (1,0) 出现两次（掩码 01 / 10）—— 同格不同掩码 = 不同状态；</text>
  <text x="406" y="452" font-size="11" fill="#444">· 本例也有不踩 R 的 3 步路 S→L①→S→L②：两条路同层汇合，BFS 都返回 3；</text>
  <text x="406" y="476" font-size="11" fill="#444">· R 的真正价值在更难的图：直连能量不够时，「绕路回满」是唯一活路；</text>
  <text x="406" y="500" font-size="11" fill="#444">· 示例 3 无论怎么走都不够 → 队列耗尽，返回 −1。</text>
</svg>
