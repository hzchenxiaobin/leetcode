<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">删零 = 保序过滤，剩余数字顺序不变</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- original digits -->
  <text x="320" y="76" text-anchor="middle" font-size="13" fill="#666">n = 1020030 的十进制表示：</text>

  <g filter="url(#sk)">
    <rect x="148" y="88" width="44" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="198" y="88" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="248" y="88" width="44" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="298" y="88" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="348" y="88" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="398" y="88" width="44" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="448" y="88" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#2b2b2b" font-weight="bold">
    <text x="170" y="117">1</text>
    <text x="220" y="117" fill="#b85450">0</text>
    <text x="270" y="117">2</text>
    <text x="320" y="117" fill="#b85450">0</text>
    <text x="370" y="117" fill="#b85450">0</text>
    <text x="420" y="117">3</text>
    <text x="470" y="117" fill="#b85450">0</text>
  </g>
  <!-- X marks over zeros -->
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 203 93 L 237 127" fill="none"/>
    <path d="M 237 93 L 203 127" fill="none"/>
    <path d="M 303 93 L 337 127" fill="none"/>
    <path d="M 337 93 L 303 127" fill="none"/>
    <path d="M 353 93 L 387 127" fill="none"/>
    <path d="M 387 93 L 353 127" fill="none"/>
    <path d="M 453 93 L 487 127" fill="none"/>
    <path d="M 487 93 L 453 127" fill="none"/>
  </g>
  <text x="510" y="115" font-size="12" fill="#b85450" font-weight="bold">← 删掉 0</text>

  <!-- arrows -->
  <path d="M 170 140 Q 190 185 262 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 270 140 Q 290 185 318 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 140 Q 405 185 386 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- kept digits -->
  <text x="320" y="178" text-anchor="middle" font-size="12" fill="#888">只保留非零数字：</text>
  <g filter="url(#sk)">
    <rect x="248" y="212" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="304" y="212" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="360" y="212" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#2e6e2e" font-weight="bold">
    <text x="272" y="241">1</text>
    <text x="328" y="241">2</text>
    <text x="384" y="241">3</text>
  </g>
  <text x="452" y="242" font-size="22" fill="#2e6e2e" font-weight="bold">= 123</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="120" y="282" width="400" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">数学法：res = res × 10 + d（仅当 d ≠ 0）</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="560" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="363" text-anchor="middle" font-size="12" fill="#7a5415">n ≥ 1 ⇒ 最高位非零 ⇒ 结果至少保留一位（非空、非零），无需特判</text>
</svg>
