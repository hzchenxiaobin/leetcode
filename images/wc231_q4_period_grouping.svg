<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 462"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="462" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：相邻窗口相消 ⟹ 数组以 k 为周期</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2 —— nums = [3,4,5,2,1,7,3,4,7]，k = 3：修改后任何长度 3 的窗口异或都为 0</text>

  <!-- Adjacent windows -->
  <rect x="67" y="58" width="144" height="42" fill="none" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="139" y="55" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">XOR = 0</text>
  <rect x="114" y="62" width="144" height="42" fill="none" stroke="#4a7a3a" stroke-width="2" rx="6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="186" y="57" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">XOR = 0</text>

  <!-- Flat array cells -->
  <rect x="73" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="92" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="120" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="167" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="214" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="233" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="261" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="308" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="327" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="355" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="374" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="402" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="421" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="449" y="64" width="38" height="30" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="468" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="92" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="139" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="186" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="233" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="280" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="327" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="374" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="421" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="468" y="108" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>

  <!-- Cancellation equation -->
  <rect x="45" y="118" width="470" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#8a6a1c" filter="url(#rough2)">两个相邻窗口异或：公共的 k−1 个元素自我抵消，只剩 nums[i] ⊕ nums[i+k] = 0</text>
  <text x="280" y="147" text-anchor="middle" font-size="10" fill="#8a6a1c" filter="url(#rough2)">⇒ nums[i] = nums[i+k]：最终数组由前 k 个值以 k 为周期完全决定</text>

  <!-- Fold arrow -->
  <path d="M 280 156 L 280 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="168" font-size="10" fill="#4a7a3a" filter="url(#rough2)">按 k = 3 折行，同列 = 同组（i mod 3 相同）</text>

  <!-- Row labels -->
  <text x="38" y="201" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下标 0~2</text>
  <text x="38" y="243" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">3~5</text>
  <text x="38" y="285" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">6~8</text>

  <!-- Grid: row 0 -->
  <rect x="44" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="112" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="182" width="40" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Grid: row 1 -->
  <rect x="44" y="224" width="40" height="30" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="112" y="224" width="40" height="30" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="244" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="180" y="224" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <!-- Grid: row 2 -->
  <rect x="44" y="266" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="112" y="266" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="180" y="266" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <!-- Info box -->
  <rect x="252" y="182" width="282" height="114" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="266" y="202" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">分组后的问题（值域 [0,1024)）：</text>
  <text x="266" y="220" font-size="10" fill="#2f4a66" filter="url(#rough2)">选 v₀ … v_{k−1}，使 v₀ ⊕ v₁ ⊕ … ⊕ v_{k−1} = 0</text>
  <text x="266" y="238" font-size="10" fill="#2f4a66" filter="url(#rough2)">最小化 Σ ( sz_r − cnt_r[v_r] )</text>
  <text x="266" y="256" font-size="10" fill="#2f4a66" filter="url(#rough2)">组 r 的代价 = 组大小 − v_r 在组内的出现次数</text>
  <text x="266" y="274" font-size="10" fill="#b85450" filter="url(#rough2)">红框格子 = 需要修改的位置（共 3 处）</text>

  <!-- Column headers -->
  <text x="64" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">组 0</text>
  <text x="132" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">组 1</text>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">组 2</text>
  <text x="64" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3×2, 2×1</text>
  <text x="132" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">4×2, 1×1</text>
  <text x="200" y="328" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">5×1, 7×2</text>

  <!-- Target row -->
  <text x="38" y="366" text-anchor="end" font-size="10" fill="#444" filter="url(#rough2)">取值</text>
  <rect x="44" y="348" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="367" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="98" y="367" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⊕</text>
  <rect x="112" y="348" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="367" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="166" y="367" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⊕</text>
  <rect x="180" y="348" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="367" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="240" y="367" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0 ✓</text>
  <text x="286" y="360" font-size="10" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">代价 = (3−2) + (3−2) + (3−2) = 3</text>
  <text x="286" y="376" font-size="9.5" fill="#666" filter="url(#rough2)">每组保留众数、各改 1 处，共改 3 个元素</text>

  <!-- Bottom note -->
  <rect x="30" y="400" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">修改后：[3,4,7, 3,4,7, 3,4,7] —— 以 [3,4,7] 为周期循环</text>
  <text x="280" y="435" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">任何长度 3 的窗口都是这三个值的整体平移，异或恒为 0，答案 3 ✓</text>
</svg>
