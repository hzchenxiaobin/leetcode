<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">cnt 前缀和 pre：一次 O(U) 预处理，任意 #\{nums ≥ m\} 变 O(1)</text>

  <!-- 坐标 -->
  <path d="M 60 60 L 60 260 L 500 260" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="52" y="264">0</text><text x="104" y="278">1</text><text x="148" y="278">2</text>
    <text x="192" y="278">3</text><text x="236" y="278">4</text><text x="280" y="278">5</text>
    <text x="324" y="278">6</text><text x="368" y="278">7</text><text x="412" y="278">8</text>
    <text x="456" y="278">9</text><text x="500" y="278">10</text>
  </g>
  <g font-size="10.5" fill="#888" filter="url(#rough2)">
    <text x="44" y="224">1</text><text x="44" y="184">2</text><text x="44" y="144">3</text>
  </g>
  <text x="500" y="296" font-size="10.5" fill="#888" filter="url(#rough2)">值 v</text>

  <!-- pre 阶梯（nums=[2,5,9]） -->
  <path d="M 60 260 L 148 260 L 148 220 L 280 220 L 280 180 L 456 180 L 456 140 L 500 140"
        stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="148" cy="220" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="280" cy="180" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="456" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="10" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="152" y="212">pre[2]=1</text><text x="284" y="172">pre[5]=2</text><text x="446" y="132">pre[9]=3</text>
  </g>

  <!-- 查询点 m−1 -->
  <g filter="url(#rough2)">
    <circle cx="104" cy="260" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="192" cy="220" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="280" cy="180" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="368" cy="180" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="368" y="204" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">pre[7] = 2 → #≥8 = 1</text>
  <text x="192" y="204" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">pre[3] = 1 → #≥4 = 2</text>

  <!-- 说明框 -->
  <rect x="40" y="306" width="155" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="117" y="324" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">pre[v] = #\{nums ≤ v\}</text>
  <text x="117" y="341" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">一次线性扫描得到</text>

  <rect x="205" y="306" width="155" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="282" y="324" text-anchor="middle" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">#\{nums ≥ m\}</text>
  <text x="282" y="341" text-anchor="middle" font-size="10" fill="#2f5226" filter="url(#rough2)">= n − pre[m−1]，O(1)</text>

  <rect x="370" y="306" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="445" y="324" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Σ U/d ≈ U ln U</text>
  <text x="445" y="341" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">整体 O(U log U)</text>
</svg>
