<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 576" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="690" height="576" fill="#fafafa"/>
  <text x="345" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：leetcode / abcba / abcd 三用例逐对扫描</text>
  <path d="M 130 34 Q 345 42 560 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== table 1: leetcode ===== -->
  <text x="44" y="60" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">用例 1：s = "leetcode" —— 第 2 对命中自镜像 "ee"</text>
  <g filter="url(#r)">
    <rect x="30" y="68" width="630" height="98" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="30" y="68" width="630" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#r)">
    <rect x="30" y="132" width="630" height="34" fill="#e6f4ea" opacity="0.95"/>
  </g>
  <g stroke="#ddd" stroke-width="1" filter="url(#r)">
    <path d="M 30 132 L 660 132"/>
    <path d="M 66 68 L 66 166"/><path d="M 128 68 L 128 166"/><path d="M 210 68 L 210 166"/><path d="M 430 68 L 430 166"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#r)">
    <text x="48" y="88">i</text>
    <text x="97" y="88">当前对</text>
    <text x="169" y="88">a == b ?</text>
    <text x="320" y="88">查 seen[b][a]</text>
    <text x="545" y="88">动作（先判后记）</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="120" text-anchor="middle" fill="#444">1</text>
    <text x="97" y="120" text-anchor="middle" font-weight="bold" fill="#444">"le"</text>
    <text x="169" y="120" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="120" fill="#444">✗（表空）</text>
    <text x="442" y="120" fill="#444">记录 "le" → seen = {"le"}</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="154" text-anchor="middle" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="97" y="154" text-anchor="middle" font-weight="bold" fill="#2e6e2e">"ee"</text>
    <text x="169" y="154" text-anchor="middle" font-weight="bold" fill="#2e6e2e">✓</text>
    <text x="222" y="154" fill="#2e6e2e">——（无需再查）</text>
    <text x="442" y="154" font-weight="bold" fill="#2e6e2e">自镜像命中 → 返回 true ✓</text>
  </g>

  <!-- ===== table 2: abcba ===== -->
  <text x="44" y="192" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">用例 2：s = "abcba" —— 第 3 对查到镜像 "bc"</text>
  <g filter="url(#r)">
    <rect x="30" y="200" width="630" height="132" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="30" y="200" width="630" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#r)">
    <rect x="30" y="298" width="630" height="34" fill="#e6f4ea" opacity="0.95"/>
  </g>
  <g stroke="#ddd" stroke-width="1" filter="url(#r)">
    <path d="M 30 264 L 660 264"/><path d="M 30 298 L 660 298"/>
    <path d="M 66 200 L 66 332"/><path d="M 128 200 L 128 332"/><path d="M 210 200 L 210 332"/><path d="M 430 200 L 430 332"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#r)">
    <text x="48" y="220">i</text>
    <text x="97" y="220">当前对</text>
    <text x="169" y="220">a == b ?</text>
    <text x="320" y="220">查 seen[b][a]</text>
    <text x="545" y="220">动作（先判后记）</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="252" text-anchor="middle" fill="#444">1</text>
    <text x="97" y="252" text-anchor="middle" font-weight="bold" fill="#444">"ab"</text>
    <text x="169" y="252" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="252" fill="#444">✗</text>
    <text x="442" y="252" fill="#444">记录 "ab" → seen = {"ab"}</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="286" text-anchor="middle" fill="#444">2</text>
    <text x="97" y="286" text-anchor="middle" font-weight="bold" fill="#444">"bc"</text>
    <text x="169" y="286" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="286" fill="#444">✗</text>
    <text x="442" y="286" fill="#444">记录 "bc" → seen = {"ab","bc"}</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="320" text-anchor="middle" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="97" y="320" text-anchor="middle" font-weight="bold" fill="#2e6e2e">"cb"</text>
    <text x="169" y="320" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="320" font-weight="bold" fill="#2e6e2e">✓（"bc" 已在表中）</text>
    <text x="442" y="320" font-weight="bold" fill="#2e6e2e">镜像命中 → 返回 true ✓</text>
  </g>
  <text x="44" y="348" font-size="11" fill="#888" filter="url(#r)">注：i = 4 的相邻对 "ba" 不会再被处理——扫描已提前返回。</text>

  <!-- ===== table 3: abcd ===== -->
  <text x="44" y="374" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">用例 3：s = "abcd" —— 扫描完毕，无任何命中</text>
  <g filter="url(#r)">
    <rect x="30" y="382" width="630" height="132" fill="#fdfcf7" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="30" y="382" width="630" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#r)">
    <rect x="30" y="480" width="630" height="34" fill="#fce4ec" opacity="0.8"/>
  </g>
  <g stroke="#ddd" stroke-width="1" filter="url(#r)">
    <path d="M 30 446 L 660 446"/><path d="M 30 480 L 660 480"/>
    <path d="M 66 382 L 66 514"/><path d="M 128 382 L 128 514"/><path d="M 210 382 L 210 514"/><path d="M 430 382 L 430 514"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#r)">
    <text x="48" y="402">i</text>
    <text x="97" y="402">当前对</text>
    <text x="169" y="402">a == b ?</text>
    <text x="320" y="402">查 seen[b][a]</text>
    <text x="545" y="402">动作（先判后记）</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="434" text-anchor="middle" fill="#444">1</text>
    <text x="97" y="434" text-anchor="middle" font-weight="bold" fill="#444">"ab"</text>
    <text x="169" y="434" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="434" fill="#444">✗</text>
    <text x="442" y="434" fill="#444">记录 "ab" → seen = {"ab"}</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="468" text-anchor="middle" fill="#444">2</text>
    <text x="97" y="468" text-anchor="middle" font-weight="bold" fill="#444">"bc"</text>
    <text x="169" y="468" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="468" fill="#444">✗</text>
    <text x="442" y="468" fill="#444">记录 "bc" → seen = {"ab","bc"}</text>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="48" y="502" text-anchor="middle" fill="#444">3</text>
    <text x="97" y="502" text-anchor="middle" font-weight="bold" fill="#444">"cd"</text>
    <text x="169" y="502" text-anchor="middle" fill="#999">✗</text>
    <text x="222" y="502" fill="#444">✗</text>
    <text x="442" y="502" font-weight="bold" fill="#8a3a36">记录 "cd" → 全部扫完，返回 false ✗</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="30" y="526" width="630" height="42" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="46" y="543" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">为什么 "ee" 必须靠 a==b 特判</text>
  <text x="46" y="560" font-size="11" fill="#444" filter="url(#r)">一遍扫描「先判后记」：处理 (e,e) 时它自己尚未入表，seen[e][e] 必为假；两阶段写法先建全集合再查，则天然命中，无需特判</text>
</svg>
