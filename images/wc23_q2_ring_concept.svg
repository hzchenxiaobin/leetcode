<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <text x="28" y="40" font-size="18" fill="#333" filter="url(#rough2)">时间点排在一个环上：最短差可能跨过零点</text>

  <!-- 时钟外圈 -->
  <circle cx="210" cy="240" r="140" fill="none" stroke="#446688" stroke-width="2"
          stroke-dasharray="7 6" filter="url(#rough2)"/>
  <text x="210" y="232" text-anchor="middle" font-size="22" fill="#446688" filter="url(#rough2)">1440</text>
  <text x="210" y="254" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">分钟 / 一天</text>

  <!-- 四个刻标 -->
  <text x="252" y="90" font-size="12" fill="#333" filter="url(#rough2)">00:00</text>
  <text x="166" y="90" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">23:59</text>
  <text x="358" y="246" font-size="11" fill="#888" filter="url(#rough2)">06:00</text>
  <text x="210" y="404" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">12:00</text>
  <text x="62" y="246" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">18:00</text>

  <!-- 两个时刻 -->
  <circle cx="212" cy="100" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="188" cy="104" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M188,104 A140,140 0 0 1 212,100" fill="none" stroke="#b85450" stroke-width="4" filter="url(#rough2)"/>
  <text x="210" y="70" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">间隔 1 分钟</text>

  <!-- 右侧三张卡片 -->
  <rect x="400" y="68" width="450" height="88" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="98" font-size="14" fill="#2c3e50" filter="url(#rough2)">环上距离：两个时刻之间的「最短弧」</text>
  <text x="420" y="124" font-size="14" fill="#2c3e50" filter="url(#rough2)">23:59 与 00:00 的环上距离 = 1 分钟</text>
  <text x="420" y="146" font-size="12" fill="#446688" filter="url(#rough2)">一天首尾相接，23:59 之后紧接着就是 00:00</text>

  <rect x="400" y="180" width="450" height="88" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="210" font-size="14" fill="#7a5c1e" filter="url(#rough2)">直接按数值相减会漏掉跨零点的那一段</text>
  <text x="420" y="236" font-size="14" fill="#7a5c1e" filter="url(#rough2)">|1439 − 0| = 1439 分钟，而不是 1 分钟</text>
  <text x="420" y="258" font-size="12" fill="#a07a2a" filter="url(#rough2)">所以「排序后算相邻差」必须再补一条首尾回绕</text>

  <rect x="400" y="292" width="450" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="322" font-size="14" fill="#2f4f2f" filter="url(#rough2)">拆环成链：把 t[0] + 1440 接在 t[n−1] 后面</text>
  <text x="420" y="348" font-size="14" fill="#2f4f2f" filter="url(#rough2)">回绕差 = t[0] + 1440 − t[n−1]</text>
  <text x="420" y="370" font-size="12" fill="#4a7a3a" filter="url(#rough2)">答案 = min(所有相邻差, 回绕差)</text>
</svg>
