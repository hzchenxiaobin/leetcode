<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：tiles = "AAB" 的 6 个状态与计数</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">格内是 (A 的剩余个数, B 的剩余个数)；箭头 = 把该字母放到当前这一位</text>

  <rect x="220" y="110" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">(2, 1) 起点</text>
  <text x="270" y="145" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">g = 9</text>

  <rect x="90" y="110" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="128" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">(2, 0)</text>
  <text x="140" y="145" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">g = 3</text>

  <rect x="220" y="190" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="208" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">(1, 1)</text>
  <text x="270" y="225" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">g = 5</text>

  <rect x="90" y="190" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">(1, 0)</text>
  <text x="140" y="225" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">g = 2</text>

  <rect x="220" y="270" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(0, 1)</text>
  <text x="270" y="305" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">g = 2</text>

  <rect x="90" y="270" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="288" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(0, 0)</text>
  <text x="140" y="305" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">g = 1</text>

  <path d="M 270 154 L 270 190" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="176" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">选 A</text>

  <path d="M 220 132 L 190 132" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="124" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">选 B</text>

  <path d="M 270 234 L 270 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="256" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">选 A</text>

  <path d="M 220 212 L 190 212" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="204" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">选 B</text>

  <path d="M 140 154 L 140 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="176" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">选 A</text>

  <path d="M 140 234 L 140 270" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="256" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">选 A</text>

  <text x="90" y="334" font-size="10" fill="#777" filter="url(#rough2)">箭头数 = 每个状态的「候选首字母」数，同一字母只算一次</text>

  <rect x="380" y="86" width="300" height="176" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="396" y="106" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">按剩余字模数自底向上填表</text>
  <text x="396" y="130" font-size="10" fill="#444" filter="url(#rough2)">g(0,0) = 1</text>
  <text x="396" y="152" font-size="10" fill="#444" filter="url(#rough2)">g(1,0) = 1 + g(0,0) = 2</text>
  <text x="396" y="174" font-size="10" fill="#444" filter="url(#rough2)">g(2,0) = 1 + g(1,0) = 3</text>
  <text x="396" y="196" font-size="10" fill="#444" filter="url(#rough2)">g(0,1) = 1 + g(0,0) = 2</text>
  <text x="396" y="218" font-size="10" fill="#444" filter="url(#rough2)">g(1,1) = 1 + g(0,1) + g(1,0) = 5</text>
  <text x="396" y="240" font-size="10" fill="#444" filter="url(#rough2)">g(2,1) = 1 + g(1,1) + g(2,0) = 9</text>

  <rect x="380" y="278" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="396" y="306" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 = g(2,1) - 1 = 9 - 1 = 8</text>

  <text x="90" y="358" font-size="10" fill="#888" filter="url(#rough2)">扣掉的 1 就是空序列；剩下的 8 个串是：</text>
  <text x="90" y="376" font-size="10" fill="#888" filter="url(#rough2)">"A" "B" "AA" "AB" "BA" "AAB" "ABA" "BAA"</text>
  <text x="396" y="358" font-size="10" fill="#888" filter="url(#rough2)">g 值 = 从该状态出发的序列数（含空串）</text>
  <text x="350" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">状态 (2,1)→(1,1)→(0,1)→(0,0) 正是串 "AAB" 的构造路径</text>
</svg>
