<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">快速选择：只递归「第 k 个」落在的那一半</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">分区一次就能丢掉一半元素，平均 O(n)、原地 O(1) 额外空间</text>
  <text x="30" y="72" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">一次分区：把小于枢轴的点换到左边</text>
  <rect x="30" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="56.0" y="110.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="82" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="108.0" y="110.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">26</text>
  <rect x="134" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="110.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="186" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="212.0" y="110.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">45</text>
  <rect x="238" y="86" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="264.0" y="110.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="30" y="146" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">枢轴 = 20（下标 2）</text>
  <text x="30" y="190" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">分区后</text>
  <rect x="30" y="204" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="56.0" y="228.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="82" y="204" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="108.0" y="228.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="134" y="204" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="160.0" y="228.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="186" y="204" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="212.0" y="228.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">45</text>
  <rect x="238" y="204" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="264.0" y="228.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">26</text>
  <path d="M 142 196 L 142 252" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="150" y="176" font-size="11" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 3：前 3 个位置已定</text>
  <rect x="330" y="86" width="200" height="108" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="107" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">nth_element 语义</text><text x="340" y="122.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">左边 ≤ 第 k 个</text><text x="340" y="138.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">右边 ≥ 第 k 个</text><text x="340" y="154.85" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">两侧内部无序</text>
  <rect x="330" y="210" width="200" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="231" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">期望复杂度</text><text x="340" y="246.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每次砍掉一半</text><text x="340" y="262.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">T(n) = T(n/2) + O(n)</text><text x="340" y="278.84999999999997" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">= O(n)</text>
  <path d="M 310 226 L 300 226" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
