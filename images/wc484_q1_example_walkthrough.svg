<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：官方样例走查</text>

  <!-- ===== 表一：bob ===== -->
  <text x="30" y="56" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">s = "bob"（官方示例 3）</text>

  <!-- 命中列淡绿底（先画，垫底） -->
  <rect x="124" y="62" width="212" height="174" rx="8" fill="#e6f4ea" opacity="0.45" filter="url(#rough2)"/>

  <!-- 行标签 -->
  <text x="108" y="90" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">前缀</text>
  <text x="108" y="118" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">长度 L</text>
  <text x="108" y="150" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">L % 3</text>
  <text x="108" y="192" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">distinct</text>
  <text x="108" y="226" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">命中？</text>

  <!-- 前缀行 -->
  <rect x="130" y="68" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="88" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">b</text>
  <rect x="240" y="68" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="88" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">bo</text>
  <rect x="350" y="68" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="88" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">bob</text>

  <!-- 长度行 -->
  <text x="175" y="118" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="285" y="118" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="395" y="118" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>

  <!-- L%3 行 -->
  <rect x="130" y="128" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="148" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="240" y="128" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="148" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">2</text>
  <rect x="350" y="128" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="148" text-anchor="middle" font-size="12.5" fill="#a0433f" filter="url(#rough2)">0</text>

  <!-- distinct 行 -->
  <rect x="130" y="170" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="190" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="240" y="170" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="190" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="350" y="170" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="190" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">2</text>

  <!-- 命中行 -->
  <text x="175" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="285" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="395" y="230" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="395" y="248" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">3%3=0 需要 d=0——不可能</text>

  <!-- 答案框 -->
  <rect x="480" y="128" width="130" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">ans = 2</text>
  <text x="545" y="164" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">两个残差前缀</text>

  <!-- ===== 表二：dd ===== -->
  <text x="30" y="278" text-anchor="start" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">s = "dd"（官方示例 2）</text>

  <text x="108" y="306" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">前缀</text>
  <rect x="130" y="284" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="304" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">d</text>
  <rect x="240" y="284" width="90" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="304" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">dd</text>

  <text x="175" y="332" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">L=1，L%3=1，d=1</text>
  <text x="175" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 相等，命中</text>
  <text x="285" y="332" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">L=2，L%3=2，d=1</text>
  <text x="285" y="348" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不相等</text>

  <rect x="480" y="284" width="130" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">ans = 1</text>
  <text x="545" y="320" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">一个残差前缀</text>

  <text x="285" y="370" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">长度在涨、种类数停在 1——两条轨迹就此错开</text>

  <!-- 底部要点 -->
  <rect x="60" y="384" width="520" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="404" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">答案 ≥ 1：L=1 时 d=1=1%3 恒命中——返回 0 必有 bug</text>
  <text x="320" y="421" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">全同串（如 「aaaa」）：d 恒 1，只有 L≡1 (mod 3) 命中 → 答案 = ⌈n/3⌉</text>
  <text x="320" y="438" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">「bob」 的 d = 2（种类数），不是 3——别数出现次数</text>
</svg>
