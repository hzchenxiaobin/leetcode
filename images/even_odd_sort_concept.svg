<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：奇偶下标各自独立排序</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="58" y="90" font-size="13" fill="#555" filter="url(#rough2)">nums =</text>

  <rect x="130" y="70" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="70" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="234" y="70" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="70" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="208" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="312" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="156" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下标 0</text>
  <text x="208" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="312" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <rect x="392" y="72" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)"/>
  <text x="412" y="84" font-size="11" fill="#446688" filter="url(#rough2)">偶数下标</text>
  <rect x="392" y="94" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/>
  <text x="412" y="106" font-size="11" fill="#a07830" filter="url(#rough2)">奇数下标</text>

  <path d="M 210 122 Q 168 145 166 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 122 Q 358 145 362 164" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="48" y="170" width="236" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">偶数下标的值 {4, 2}</text>
  <text x="166" y="216" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">非递减（从小到大）排序</text>
  <text x="166" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">→ [2, 4]</text>

  <rect x="292" y="170" width="236" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">奇数下标的值 {1, 3}</text>
  <text x="410" y="216" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">非递增（从大到小）排序</text>
  <text x="410" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">→ [3, 1]</text>

  <path d="M 166 262 Q 168 286 208 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 362 262 Q 360 286 300 302" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="58" y="330" font-size="13" fill="#555" filter="url(#rough2)">答案 =</text>
  <rect x="130" y="310" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="182" y="310" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="234" y="310" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="286" y="310" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="312" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">奇偶两类互不交换值（各自的多重集合不变）→ 拆成两个独立的排序子问题</text>
</svg>
