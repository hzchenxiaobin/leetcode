<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一遍扫描计数：遇「新 0 段开头」累加 ones</text>

  <ellipse cx="280" cy="66" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 280 84 L 280 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="218" y="104" width="124" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 c = s[i]</text>

  <path d="M 280 136 L 280 152" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="280,156 352,194 280,232 208,194" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c == '1' ?</text>

  <path d="M 352 194 L 400 194" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="376" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="400" y="178" width="112" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ones += 1</text>

  <path d="M 280 232 L 280 252" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="304" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否（c 是 '0'）</text>

  <polygon points="280,256 372,294 280,332 188,294" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i &gt; 0 且</text>
  <text x="280" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s[i-1] == '1' ?</text>

  <path d="M 372 294 L 420 294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="396" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="420" y="278" width="116" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="299" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans += ones</text>
  <text x="478" y="326" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">新 0 段的开头</text>

  <path d="M 512 194 L 536 194" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 536 194 L 536 374" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <path d="M 280 332 L 280 346" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="304" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否（同段后续 0，跳过）</text>

  <polygon points="280,350 348,374 280,398 212,374" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i + 1 &lt; n ?</text>

  <path d="M 536 374 L 352 374" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <path d="M 212 374 L 96 374 L 96 120 L 214 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="152" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是，i += 1</text>

  <path d="M 280 398 Q 300 418 404 410" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="316" y="414" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <ellipse cx="456" cy="410" rx="50" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="415" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
