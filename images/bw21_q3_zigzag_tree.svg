<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">交错路径：每走一步必须换方向（示例 2，答案 4）</text>

  <!-- 示例树: [1,1,1,null,1,null,null,1,1,null,1] -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="64" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="180" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="420" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="180" cy="216" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="180" cy="292" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="110" cy="368" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="368" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <!-- 边: root.left=1, root.right=1; 左1.right=1(红); 该1.left=1(红); 该1.right=1(红) -->
  <g filter="url(#rough2)">
    <path d="M 286 78 L 194 126" fill="none" stroke="#b85450" stroke-width="2.8"/>
    <path d="M 314 78 L 406 126" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 180 160 L 180 196" fill="none" stroke="#b85450" stroke-width="2.8"/>
    <path d="M 180 236 L 180 272" fill="none" stroke="#b85450" stroke-width="2.8"/>
    <path d="M 166 306 L 122 354" fill="none" stroke="#999" stroke-width="1.6"/>
    <path d="M 194 306 L 240 354" fill="none" stroke="#b85450" stroke-width="2.8"/>
  </g>
  <!-- 节点标签 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="300" y="69">1</text>
    <text x="180" y="145">1</text>
    <text x="420" y="145">1</text>
    <text x="180" y="221">1</text>
    <text x="180" y="297">1</text>
    <text x="110" y="373">1</text>
    <text x="250" y="373">1</text>
  </g>
  <!-- 方向标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#8a3833" font-weight="bold">
    <text x="222" y="94">①左</text>
    <text x="196" y="184">②右</text>
    <text x="196" y="260">③左</text>
    <text x="228" y="336">④右</text>
  </g>
  <text x="448" y="176" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">右子树: 单节点</text>

  <!-- 说明框 -->
  <rect x="360" y="210" width="180" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="450" y="236" text-anchor="middle" font-weight="bold">红色路径方向序列</text>
    <text x="450" y="260" text-anchor="middle">左 → 右 → 左 → 右</text>
    <text x="450" y="284" text-anchor="middle">经过 5 个节点</text>
    <text x="450" y="308" text-anchor="middle">长度 = 5 − 1 = 4</text>
  </g>
  <text x="450" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">相邻两步方向必须交替</text>
</svg>
