<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二分答案长度 + 哈希判重：O(n log n)</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">关键性质：长度 L 有重复 ⇒ 所有 L′ &lt; L 都有重复（单调性）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="60" y="70" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="280" y="90" fill="#3a4a66">候选长度区间 [1, n−1]</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="60" y="118" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="160" y="140" fill="#3a5a30">有重复 → 记录答案，向右找更长</text>
    <rect x="300" y="118" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="400" y="140" fill="#8a3a36">无重复 → 向左缩小</text>
  </g>

  <text x="280" y="176" text-anchor="middle" font-size="10.5" fill="#555">每次判定用 Rabin-Karp 滚动哈希，把「取子串 + 比较」压到 O(1)</text>

  <rect x="60" y="196" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="216" font-size="11" fill="#8a6a20" font-weight="bold">check(L)</text>
  <text x="76" y="236" font-size="10" fill="#555">对每个起点 i 求 [i, i+L) 的双哈希值，用哈希表记录首次出现的起点；</text>
  <text x="76" y="250" font-size="10" fill="#555">命中已有哈希时再逐字符比较，确认后立即返回该起点。</text>

  <path d="M 280 268 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="296" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="96" y="316" font-size="10.5" fill="#3a5a30" font-weight="bold">复杂度</text>
  <text x="96" y="336" font-size="10" fill="#555">二分 O(log n) 轮，每轮 O(n) 次哈希 → 总 O(n log n)</text>
  <text x="96" y="350" font-size="10" fill="#555">空间 O(n)（前缀哈希 + 哈希表）</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999">示例 "banana"：L=3 命中 "ana"；L=4 无重复 → 答案 "ana"</text>
</svg>
