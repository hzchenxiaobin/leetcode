<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">倒序映射：v → 'z' − v</text>

  <g font-size="12" fill="#333">
    <rect x="40" y="56" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="57" y="76" text-anchor="middle">0</text>
    <rect x="86" y="56" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="103" y="76" text-anchor="middle">1</text>
    <rect x="132" y="56" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="149" y="76" text-anchor="middle">8</text>
    <rect x="178" y="56" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/><text x="195" y="76" text-anchor="middle">…</text>
    <rect x="224" y="56" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="241" y="76" text-anchor="middle">25</text>
  </g>
  <g font-size="13" fill="#333">
    <rect x="40" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="57" y="132" text-anchor="middle">z</text>
    <rect x="86" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="103" y="132" text-anchor="middle">y</text>
    <rect x="132" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="149" y="132" text-anchor="middle">r</text>
    <rect x="178" y="112" width="34" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/><text x="195" y="132" text-anchor="middle">…</text>
    <rect x="224" y="112" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="241" y="132" text-anchor="middle">a</text>
  </g>
  <path d="M57,92 L57,106" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M103,92 L103,106" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M149,92 L149,106" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M241,92 L241,106" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="52" width="220" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="76" font-size="11" fill="#333">权重和 S = Σ weights[ch−'a']</text>
  <text x="314" y="98" font-size="11" fill="#333">v = S mod 26（0 ≤ v ≤ 25）</text>
  <text x="314" y="120" font-size="11" fill="#333">char = chr(ord('z') − v)</text>
  <text x="314" y="140" font-size="10" fill="#888">也可写 'a' + (25 − v)</text>

  <rect x="60" y="186" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="211" font-size="11" fill="#333">示例：abcd 权重和 34，34 mod 26 = 8 → 'z' − 8 = 'r'</text>

  <rect x="60" y="240" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="265" font-size="11" fill="#b85450">易错：权重表是正序下标，取字符是倒序，两个方向别搞混</text>
</svg>
