<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3,4] → 3 次操作</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">偶数下标求质数、奇数下标求非质数，各位置独立累加</text>
  <rect x="36" y="66" width="488" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="94" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i=0</text>
  <text x="120" y="94" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">nums[0] = 1</text>
  <text x="240" y="94" text-anchor="start" font-size="10" fill="#3a5a30" filter="url(#rough2)">质数</text>
  <text x="330" y="94" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">1 → 2</text>
  <text x="470" y="94" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="36" y="120" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="148" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="120" y="148" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">nums[1] = 2</text>
  <text x="240" y="148" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">非质数</text>
  <text x="330" y="148" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">2 → 4</text>
  <text x="470" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">+2</text>
  <rect x="36" y="174" width="488" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="202" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="120" y="202" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">nums[2] = 3</text>
  <text x="240" y="202" text-anchor="start" font-size="10" fill="#3a5a30" filter="url(#rough2)">质数</text>
  <text x="330" y="202" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">3 本身是质数</text>
  <text x="470" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="36" y="228" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="256" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">i=3</text>
  <text x="120" y="256" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">nums[3] = 4</text>
  <text x="240" y="256" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">非质数</text>
  <text x="330" y="256" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">4 本身非质数</text>
  <text x="470" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="470" y="58" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">代价</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">总代价 = 1 + 2 + 0 + 0 = 3</text>
  <rect x="36" y="314" width="488" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="334" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么 2 要加 2 而不是 1</text>
  <text x="48" y="351" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">2 是质数，奇数下标要求非质数：2+1 = 3 仍是质数，再加 1 到 4 才满足</text>
  <text x="280" y="376" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">下标从 0 开始计：0、2 位要质数，1、3 位要非质数</text>
</svg>
