  <path d="M 70 178 L 70 188" stroke="#78909c" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70" y="202" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <path d="M 130 178 L 130 188" stroke="#78909c" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
