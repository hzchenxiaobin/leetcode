  <text x="490.0" y="242.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">diff[7]</text>
  <text x="26" y="234" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">diff</text>
  <text x="26" y="268" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">cur(p)</text>
  <rect x="44" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="104" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="164" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="224" y="278" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="284" y="278" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="344" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="404" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="464" y="278" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490.0" y="305.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="30" y="400" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">cur 的峰值 5 &gt; capacity = 4 ⇒ false；capacity = 5 时全程 ≤ 5 ⇒ true。</text>
  <text x="24" y="404" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">位置只有 0..1000，前缀和一趟扫完即可，无需排序或堆。</text>
</svg>
