  <text x="130.0" y="231.0" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="130.0" y="242.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">diff[1]</text>
  <rect x="223" y="212" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="231.0" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="250.0" y="242.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">diff[3]</text>
  <rect x="343" y="212" width="54" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370.0" y="231.0" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="370.0" y="242.0" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">diff[5]</text>
  <rect x="463" y="212" width="54" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
