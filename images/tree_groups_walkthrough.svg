<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：链 0-1-2，全组 1，k = 3</text>
  <path d="M 110 42 Q 320 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 处理顺序标注 -->
  <text x="320" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">处理顺序：2 → 1 → 0（逆 BFS 序，先孩子后父亲）</text>

  <!-- 链 -->
  <path d="M 220 92 L 300 92" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 340 92 L 420 92" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="200" cy="92" r="20" fill="#dbe9fb" stroke="#446688" stroke-width="2.2"/></g>
  <text x="200" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><circle cx="320" cy="92" r="20" fill="#dbe9fb" stroke="#446688" stroke-width="2.2"/></g>
  <text x="320" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="440" cy="92" r="20" fill="#dbe9fb" stroke="#446688" stroke-width="2.2"/></g>
  <text x="440" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">2</text>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#7a5a2a" filter="url(#sk)">边 (0,1)</text>
  <text x="380" y="126" text-anchor="middle" font-size="12" fill="#7a5a2a" filter="url(#sk)">边 (1,2)</text>

  <!-- 演算表 -->
  <g filter="url(#sk)"><rect x="48" y="152" width="544" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="108" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">处理节点 v</text>
  <text x="243" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">子树（组 1 计数 c）</text>
  <text x="373" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">统计的边</text>
  <text x="510" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">贡献 c×(3−c)</text>

  <g filter="url(#sk)"><rect x="48" y="186" width="544" height="44" rx="4" fill="#ffffff" stroke="#c8d4e0" stroke-width="1"/></g>
  <text x="108" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">v = 2（叶子）</text>
  <text x="243" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{2}，c = 1</text>
  <text x="373" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">(2,1)</text>
  <text x="510" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">1×(3−1) = 2</text>

  <g filter="url(#sk)"><rect x="48" y="230" width="544" height="44" rx="4" fill="#fbfcfe" stroke="#c8d4e0" stroke-width="1"/></g>
  <text x="108" y="257" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">v = 1</text>
  <text x="243" y="257" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{1,2}，c = 1+1 = 2</text>
  <text x="373" y="257" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">(1,0)</text>
  <text x="510" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">2×(3−2) = 2</text>

  <g filter="url(#sk)"><rect x="48" y="274" width="544" height="44" rx="4" fill="#ffffff" stroke="#c8d4e0" stroke-width="1"/></g>
  <text x="108" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">v = 0（根）</text>
  <text x="243" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">{0,1,2}，c = 2+1 = 3</text>
  <text x="373" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#sk)">—（根无边）</text>
  <text x="510" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#999" font-family="monospace" filter="url(#sk)">0</text>

  <!-- 计数上抛说明 -->
  <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="#8a6a3a" filter="url(#sk)">计数上抛：处理 2 时 cnt[2] 并入 cnt[1]；处理 1 时 cnt[1] 并入 cnt[0]</text>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#8a6a3a" filter="url(#sk)">（根的 cnt 最终等于全树计数，但根没有向上的边，不再产生贡献）</text>

  <!-- 结果框 -->
  <g filter="url(#sk)"><rect x="48" y="378" width="544" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="408" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">ans = 2 + 2 = 4 ✓</text>
  <text x="320" y="438" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#sk)">逐对验证：dist(0,1) + dist(1,2) + dist(0,2) = 1 + 1 + 2 = 4 ✓</text>
</svg>
