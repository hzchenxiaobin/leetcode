<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">反转单词前缀：定位 ch + 逆转前缀</text>
  <path d="M 210 42 Q 320 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input line -->
  <text x="34" y="76" font-size="14" fill="#444" font-family="monospace" font-weight="bold">word = "abcdefd"</text>

  <!-- ch tag -->
  <g filter="url(#sk)">
    <rect x="420" y="54" width="192" height="30" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="516" y="74" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">ch = 'd' → 首次出现 i = 3</text>
  <path d="M 424 84 Q 370 100 330 96" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#arO)"/>

  <!-- bracket over prefix -->
  <path d="M 154 96 L 154 88 L 342 88 L 342 96" stroke="#4a8edb" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="248" y="82" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">前缀 [0, i]</text>

  <!-- row 1: original -->
  <g font-size="17" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="100" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="176" y="128">a</text><text x="192" y="140" font-size="9" fill="#999" font-weight="normal">0</text>
    <g filter="url(#sk)"><rect x="202" y="100" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="224" y="128">b</text><text x="240" y="140" font-size="9" fill="#999" font-weight="normal">1</text>
    <g filter="url(#sk)"><rect x="250" y="100" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="272" y="128">c</text><text x="288" y="140" font-size="9" fill="#999" font-weight="normal">2</text>
    <g filter="url(#sk)"><rect x="298" y="100" width="44" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g><text x="320" y="128">d</text><text x="336" y="140" font-size="9" fill="#c98a2b" font-weight="bold">3=i</text>
    <g filter="url(#sk)"><rect x="346" y="100" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="368" y="128">e</text><text x="384" y="140" font-size="9" fill="#999" font-weight="normal">4</text>
    <g filter="url(#sk)"><rect x="394" y="100" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="416" y="128">f</text><text x="432" y="140" font-size="9" fill="#999" font-weight="normal">5</text>
    <g filter="url(#sk)"><rect x="442" y="100" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="464" y="128">d</text><text x="480" y="140" font-size="9" fill="#999" font-weight="normal">6</text>
  </g>

  <!-- reverse arrow -->
  <path d="M 320 156 L 320 192" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="334" y="178" font-size="12" fill="#555" font-family="monospace">reverse(word[0..3])</text>

  <!-- row 2: result -->
  <g font-size="17" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="200" width="44" height="44" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/></g><text x="176" y="228">d</text>
    <g filter="url(#sk)"><rect x="202" y="200" width="44" height="44" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/></g><text x="224" y="228">c</text>
    <g filter="url(#sk)"><rect x="250" y="200" width="44" height="44" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/></g><text x="272" y="228">b</text>
    <g filter="url(#sk)"><rect x="298" y="200" width="44" height="44" rx="5" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/></g><text x="320" y="228">a</text>
    <g filter="url(#sk)"><rect x="346" y="200" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="368" y="228">e</text>
    <g filter="url(#sk)"><rect x="394" y="200" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="416" y="228">f</text>
    <g filter="url(#sk)"><rect x="442" y="200" width="44" height="44" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="464" y="228">d</text>
  </g>
  <text x="452" y="262" font-size="11" fill="#4a8e4a">后缀原样不动</text>

  <!-- result banner -->
  <g filter="url(#sk)">
    <rect x="170" y="282" width="300" height="46" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="18" fill="#7a5415" font-family="monospace" font-weight="bold">"dcbaefd" ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="30" y="348" width="580" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-size="11" fill="#888">若 ch 不存在：find 返回 -1 / string::npos → 不做任何操作，原样返回 word。</text>
</svg>
