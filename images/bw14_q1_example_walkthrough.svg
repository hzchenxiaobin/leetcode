<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">两个示例的走向：257 合法，3 非法</text>

  <!-- Lane 1: 257 -> 101 -> IOI -->
  <rect x="40" y="90" width="120" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 num</text>
  <text x="100" y="133" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">"257"</text>

  <line x1="160" y1="117" x2="212" y2="117" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="106" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">÷16</text>

  <rect x="214" y="90" width="150" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">余数 1,0,1</text>
  <text x="289" y="132" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">逆序 → "101"</text>

  <line x1="364" y1="117" x2="416" y2="117" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="106" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">映射</text>

  <rect x="418" y="90" width="150" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1→I　0→O</text>
  <text x="493" y="133" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">"IOI" ✓</text>

  <text x="320" y="178" font-size="13" fill="#666" filter="url(#rough2)">每位都落在 {0,1,A..F}，合法 Hexspeak。</text>

  <!-- Lane 2: 3 -> ERROR -->
  <rect x="40" y="210" width="120" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 num</text>
  <text x="100" y="253" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">"3"</text>

  <line x1="160" y1="237" x2="212" y2="237" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="226" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">÷16</text>

  <rect x="214" y="210" width="150" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="289" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">余数 3</text>
  <text x="289" y="253" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">3 ∈ [2,9] ✗</text>

  <line x1="364" y1="237" x2="416" y2="237" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">报错</text>

  <rect x="418" y="210" width="150" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">数字残留</text>
  <text x="493" y="253" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">"ERROR" ✗</text>

  <text x="120" y="310" font-size="13" fill="#666" filter="url(#rough2)">N ≤ 10^12 ≈ 2^39.9：long long / Python int 都安全，</text>
  <text x="120" y="328" font-size="13" fill="#666" filter="url(#rough2)">最多 10 位十六进制，短除法循环极短。</text>
</svg>
