<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：s = 0192837465</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">指针从 0 出发，逐段计算环形距离 min(d, 10 − d)</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="480" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="122" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">从</text>
  <text x="174" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">到</text>
  <text x="250" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d = |a−b|</text>
  <text x="365" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">旋转次数</text>
  <text x="475" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">累计</text>

  <!-- 行背景 -->
  <rect x="40" y="88" width="480" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="114" width="480" height="26" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="140" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="166" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="192" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="218" width="480" height="26" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="244" width="480" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="270" width="480" height="26" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="296" width="480" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="322" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 列分隔线 -->
  <path d="M96,58 L96,348" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M148,58 L148,348" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M200,58 L200,348" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M300,58 L300,348" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M430,58 L430,348" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行：0→0 -->
  <text x="68" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="105" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="365" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="475" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 2 行：0→1 -->
  <text x="68" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="122" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="174" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="131" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="365" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 第 3 行：1→9（跨 0） -->
  <text x="68" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="122" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="174" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="250" y="157" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="365" y="157" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2 = 10−8</text>
  <text x="475" y="157" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <!-- 第 4 行：9→2 -->
  <text x="68" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="122" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="174" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="183" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="365" y="183" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3 = 10−7</text>
  <text x="475" y="183" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">6</text>

  <!-- 第 5 行：2→8 -->
  <text x="68" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="122" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="250" y="209" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="365" y="209" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">4 = 10−6</text>
  <text x="475" y="209" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">10</text>

  <!-- 第 6 行：8→3（对径） -->
  <text x="68" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="122" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="174" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="250" y="235" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <text x="365" y="235" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">5（两向等长）</text>
  <text x="475" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <!-- 第 7 行：3→7 -->
  <text x="68" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="122" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="174" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="250" y="261" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>
  <text x="365" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="475" y="261" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">19</text>

  <!-- 第 8 行：7→4 -->
  <text x="68" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="122" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="174" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="250" y="287" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">3</text>
  <text x="365" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="475" y="287" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">22</text>

  <!-- 第 9 行：4→6 -->
  <text x="68" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="122" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="174" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="250" y="313" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="365" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="475" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">24</text>

  <!-- 第 10 行：6→5 -->
  <text x="68" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="122" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="174" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="339" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="365" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="339" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">25</text>

  <!-- 脚注 -->
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">橙色行：d &gt; 5，跨过 0/9 的方向更短（1→9 只需 2 步而非 8 步）</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">指针每拨一位都停在刚拨的数字上，10 段距离互不影响，直接相加 = 25</text>
</svg>
