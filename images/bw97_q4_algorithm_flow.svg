<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两次 DFS：走一条、抹掉、再走一条</text>

  <!-- 步骤 1 -->
  <rect x="40" y="52" width="150" height="120" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="115" y="74" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">① 第一次 DFS</text>
  <!-- 小网格 3x3 -->
  <g filter="url(#rough2)">
    <rect x="75" y="86" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="99" y="86" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="123" y="86" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="75" y="110" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="99" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="123" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="75" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="99" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="123" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
  </g>
  <text x="115" y="176" font-size="11" fill="#666" filter="url(#rough2)" text-anchor="middle">走不通 → 直接 true</text>

  <!-- 箭头 1 -->
  <path d="M 196 112 C 216 112, 222 112, 240 112" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <text x="310" y="74" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">② 沿途格子全置 0</text>
  <g filter="url(#rough2)">
    <rect x="270" y="86" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="294" y="86" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="318" y="86" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="270" y="110" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="294" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="318" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="270" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="294" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="318" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
  </g>
  <text x="310" y="176" font-size="11" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">路径「物理删除」，grid 当 visited</text>

  <!-- 步骤 3 -->
  <text x="475" y="74" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">③ 恢复起终点</text>
  <g filter="url(#rough2)">
    <rect x="435" y="86" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="459" y="86" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="483" y="86" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="435" y="110" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="459" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="483" y="110" width="24" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="435" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="459" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="483" y="134" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
  </g>
  <text x="475" y="176" font-size="11" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">(0,0) 与 (2,2) 置回 1</text>

  <!-- 箭头 2 -->
  <path d="M 475 190 C 475 210, 475 216, 475 230" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：第二次 DFS 分支 -->
  <text x="280" y="220" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">④ 第二次 DFS（在抹掉路径后的矩阵上）</text>

  <rect x="60" y="240" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">走不通 → true</text>
  <text x="160" y="275" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">任何第二条路都与首条共享格子</text>

  <rect x="300" y="240" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="258" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">走得通 → false</text>
  <text x="400" y="275" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">存在不相交的第二条路径</text>

  <path d="M 260 262 C 280 262, 284 262, 296 262" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部提示 -->
  <rect x="60" y="300" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">忘恢复起终点 → 第二次 DFS 永远走不通 → 恒返回 true（高频 bug）</text>

  <rect x="60" y="342" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#2d4a66" filter="url(#rough2)">显式栈实现：无递归爆栈风险，进入即置 0 防重访</text>
</svg>
