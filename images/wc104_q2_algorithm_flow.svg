<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="352" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">两遍预处理 + 一遍扫描</text>
  <rect x="160" y="58" width="320" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="84.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">从右往左求后缀最小 suffixMin</text>
  <rect x="160" y="126" width="320" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="152.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">从左往右维护前缀最大 prefixMax</text>
  <rect x="160" y="194" width="320" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="220.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若 prefixMax ≤ suffixMin[i+1] 则返回 i+1</text>
  <rect x="160" y="262" width="320" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="288.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全部扫完仍未找到：返回 n（保证有解）</text>
  <path d="M 320,102 L 320,126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,170 L 320,194" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 320,238 L 320,262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第一个满足条件的位置就是「最短的 left」</text>
</svg>
