<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="450" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,3,5,2,7,5]，minK = 1，maxK = 5</text>
  <path d="M 160 38 Q 330 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)"><rect x="70" y="52" width="50" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="95" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" font-family="monospace">i</text>
  <g filter="url(#sk)"><rect x="120" y="52" width="70" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="155" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" font-family="monospace">nums[i]</text>
  <g filter="url(#sk)"><rect x="190" y="52" width="96" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="238" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14" font-family="monospace">lastInvalid</text>
  <g filter="url(#sk)"><rect x="286" y="52" width="84" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="328" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14" font-family="monospace">lastMin</text>
  <g filter="url(#sk)"><rect x="370" y="52" width="84" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="412" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14" font-family="monospace">lastMax</text>
  <g filter="url(#sk)"><rect x="454" y="52" width="66" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="487" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" font-family="monospace">贡献</text>
  <g filter="url(#sk)"><rect x="520" y="52" width="50" height="26" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="545" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" font-family="monospace">ans</text>

  <!-- rows -->
  <!-- i=0 -->
  <g filter="url(#sk)"><rect x="70" y="82" width="500" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <text x="95" y="99" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">0</text>
  <text x="155" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="238" y="99" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">-1</text>
  <text x="328" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="99" text-anchor="middle" font-size="11" fill="#2b5a94" font-family="monospace">-1</text>
  <text x="487" y="99" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">0</text>
  <text x="545" y="99" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">0</text>
  <!-- i=1 -->
  <g filter="url(#sk)"><rect x="70" y="108" width="500" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <text x="95" y="125" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">1</text>
  <text x="155" y="125" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">3</text>
  <text x="238" y="125" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">-1</text>
  <text x="328" y="125" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="125" text-anchor="middle" font-size="11" fill="#2b5a94" font-family="monospace">-1</text>
  <text x="487" y="125" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">0</text>
  <text x="545" y="125" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">0</text>
  <!-- i=2 -->
  <g filter="url(#sk)"><rect x="70" y="134" width="500" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="95" y="151" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">2</text>
  <text x="155" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a94" font-family="monospace">5</text>
  <text x="238" y="151" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">-1</text>
  <text x="328" y="151" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a94" font-family="monospace">2</text>
  <text x="487" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="545" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <!-- i=3 -->
  <g filter="url(#sk)"><rect x="70" y="160" width="500" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="95" y="177" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">3</text>
  <text x="155" y="177" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">2</text>
  <text x="238" y="177" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">-1</text>
  <text x="328" y="177" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="177" text-anchor="middle" font-size="11" fill="#2b5a94" font-family="monospace">2</text>
  <text x="487" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <text x="545" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <!-- i=4 -->
  <g filter="url(#sk)"><rect x="70" y="186" width="500" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="95" y="203" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">4</text>
  <text x="155" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" font-family="monospace">7</text>
  <text x="238" y="203" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" font-family="monospace">4</text>
  <text x="328" y="203" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="203" text-anchor="middle" font-size="11" fill="#2b5a94" font-family="monospace">2</text>
  <text x="487" y="203" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">0</text>
  <text x="545" y="203" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">2</text>
  <!-- i=5 -->
  <g filter="url(#sk)"><rect x="70" y="212" width="500" height="26" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/></g>
  <text x="95" y="229" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">5</text>
  <text x="155" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a94" font-family="monospace">5</text>
  <text x="238" y="229" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">4</text>
  <text x="328" y="229" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">0</text>
  <text x="412" y="229" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a94" font-family="monospace">5</text>
  <text x="487" y="229" text-anchor="middle" font-size="11" fill="#b03a3a" font-family="monospace">0</text>
  <text x="545" y="229" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">2</text>

  <text x="600" y="151" font-size="10.5" fill="#2e6e2e">← l ∈ (−1, 0] = {0}</text>
  <text x="600" y="177" font-size="10.5" fill="#2e6e2e">← l ∈ (−1, 0] = {0}</text>
  <text x="600" y="203" font-size="10.5" fill="#b03a3a">← 越界！墙立起</text>
  <text x="600" y="229" font-size="10.5" fill="#b03a3a">← 0 − 4 &lt; 0 → 空</text>

  <!-- strip: two winning subarrays -->
  <text x="60" y="266" font-size="13" font-weight="bold" fill="#2b5a94">命中复盘：唯二的定界子数组都被 l = 0 收编</text>
  <path d="M 108 296 Q 204 286 300 296" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="204" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">[1,3,5]（i=2 命中）</text>
  <path d="M 108 322 Q 232 312 356 322" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="232" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5a94">[1,3,5,2]（i=3 命中）</text>

  <g filter="url(#sk)"><rect x="108" y="330" width="48" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="132" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="156" y="330" width="48" height="40" rx="6" fill="#f0f4f8" stroke="#8aa2b8" stroke-width="1.4"/></g>
  <text x="180" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#557" font-family="monospace">3</text>
  <g filter="url(#sk)"><rect x="204" y="330" width="48" height="40" rx="6" fill="#d9e8fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="228" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">5</text>
  <g filter="url(#sk)"><rect x="252" y="330" width="48" height="40" rx="6" fill="#f0f4f8" stroke="#8aa2b8" stroke-width="1.4"/></g>
  <text x="276" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#557" font-family="monospace">2</text>
  <g filter="url(#sk)"><rect x="300" y="330" width="48" height="40" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="324" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" font-family="monospace">7</text>
  <g filter="url(#sk)"><rect x="348" y="330" width="48" height="40" rx="6" fill="#d9e8fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="372" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a94" font-family="monospace">5</text>
  <text x="324" y="384" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">7 &gt; maxK：墙一立，之后全空</text>

  <!-- example 2 note -->
  <g filter="url(#sk)"><rect x="60" y="396" width="540" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="330" y="413" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">示例 2：minK = maxK = 1，nums = [1,1,1,1] → 每步 lastMin = lastMax = i</text>
  <text x="330" y="431" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">贡献 = i − (−1) = i + 1，合计 1 + 2 + 3 + 4 = 10 ✓（minK = maxK 退化为等差求和）</text>
</svg>
