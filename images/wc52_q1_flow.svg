<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：最多两次 KMP 匹配</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">字符集预判 → 块数定位 → 两次线性匹配</text>

  <rect x="60" y="74" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① b 中出现的字符必须都在 a 中</text>

  <path d="M 180 116 L 180 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="132" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② q = ⌈|b| / |a|⌉，令 s = a 重复 q 次</text>
  <text x="180" y="166" text-anchor="middle" font-size="10" fill="#7a8aa6" filter="url(#rough2)">此时 |s| ≥ |b|，但起点不一定对齐</text>

  <path d="M 180 174 L 180 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="190" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">③ 在 s 中用 KMP 匹配 b</text>

  <path d="M 300 211 L 356 211" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">命中</text>
  <rect x="360" y="190" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="458" y="216" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 q</text>

  <path d="M 180 232 L 180 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="244" font-size="9.5" fill="#b85450" filter="url(#rough2)">未命中</text>

  <rect x="60" y="250" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="276" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">④ s 再追加一个 a（共 q+1 块）</text>

  <path d="M 180 292 L 180 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="308" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="334" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">⑤ 再做一次 KMP 匹配</text>

  <path d="M 300 329 L 356 329" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">命中</text>
  <rect x="360" y="308" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="458" y="334" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 q+1</text>

  <path d="M 180 350 L 180 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="362" font-size="9.5" fill="#b85450" filter="url(#rough2)">仍未命中</text>

  <rect x="60" y="368" width="240" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="394" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 −1（无论叠加多少次都不行）</text>

  <text x="458" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">负例只可能来自</text>
  <text x="458" y="394" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">字符集不合或周期错位</text>

  <text x="300" y="436" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">π 只对 b 求一次、两次匹配共用；文本总长为 O(|a| + |b|)，故整体 O(|a| + |b|)</text>
</svg>
