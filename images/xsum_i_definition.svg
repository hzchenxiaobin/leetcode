<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x-sum 三步曲：以窗口 [1,1,2,2,3,4]、x = 2 为例</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 阶段框 A：统计频次 -->
  <rect x="15" y="60" width="185" height="295" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="107" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 统计频次</text>

  <!-- 窗口格子 6 个 -->
  <rect x="35" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="47" y="115" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="59" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="71" y="115" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="83" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="115" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="107" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="119" y="115" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="131" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="143" y="115" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="155" y="98" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="167" y="115" text-anchor="middle" font-size="11.5" fill="#333">4</text>

  <path d="M 107 130 L 107 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 频次条形图：基线 y=312，频次 1 格 = 22px -->
  <rect x="40" y="268" width="20" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="262" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">×2</text>
  <rect x="78" y="268" width="20" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="262" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">×2</text>
  <rect x="116" y="290" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="126" y="284" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">×1</text>
  <rect x="154" y="290" width="20" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="284" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">×1</text>
  <path d="M 32 312 L 182 312" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="88" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="126" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="164" y="328" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="107" y="345" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值 → 出现次数</text>

  <!-- 阶段箭头 A→B -->
  <path d="M 200 205 L 222 205" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段框 B：排序取前 x -->
  <rect x="225" y="60" width="185" height="295" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="317" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">② 按 (频次, 值) 降序</text>

  <!-- 行 1：值 2 频次 2，保留 -->
  <rect x="245" y="105" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="124" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="318" y="113" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="333" y="113" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="123" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <!-- 行 2：值 1 频次 2，保留 -->
  <rect x="245" y="157" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="176" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="318" y="165" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="333" y="165" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="175" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <!-- 行 3：值 4 频次 1，淘汰 -->
  <rect x="245" y="209" width="26" height="26" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="258" y="228" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="318" y="217" width="11" height="11" rx="2" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="227" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <!-- 行 4：值 3 频次 1，淘汰 -->
  <rect x="245" y="261" width="26" height="26" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="258" y="280" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="318" y="269" width="11" height="11" rx="2" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="378" y="279" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <path d="M 240 252 L 395 252" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="317" y="330" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">取前 x = 2 种：</text>
  <text x="317" y="345" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">绿色保留，灰色淘汰</text>

  <!-- 阶段箭头 B→C -->
  <path d="M 410 205 L 432 205" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段框 C：求和 -->
  <rect x="435" y="60" width="190" height="295" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a15" filter="url(#rough2)">③ 求和（计入全部出现）</text>

  <!-- 保留格子：1 1 2 2 -->
  <rect x="470" y="105" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="483" y="124" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="500" y="105" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="513" y="124" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="530" y="105" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="543" y="124" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="560" y="105" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="573" y="124" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="530" y="172" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">1 + 1 + 2 + 2 =</text>
  <ellipse cx="530" cy="232" rx="38" ry="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="530" y="243" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">6</text>
  <text x="530" y="305" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">即 answer[0] = 6</text>
  <text x="530" y="333" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不足 x 种时：全保留 = 总和</text>
</svg>
