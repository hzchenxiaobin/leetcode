<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">后缀最小值数组：从右往左一趟递推</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="70" y="95" font-size="13" fill="#555" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="130" y="72" width="80" height="42" rx="4" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="210" y="72" width="80" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="290" y="72" width="80" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="370" y="72" width="80" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="450" y="72" width="80" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="15" fill="#333" text-anchor="middle">
    <text x="170" y="99">10</text>
    <text x="250" y="99">−1</text>
    <text x="330" y="99">3</text>
    <text x="410" y="99">−4</text>
    <text x="490" y="99" font-weight="bold">−5</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="170" y="126">j=0（用不到）</text>
    <text x="250" y="126">j=1</text>
    <text x="330" y="126">j=2</text>
    <text x="410" y="126">j=3</text>
    <text x="490" y="126">j=4（边界）</text>
  </g>

  <!-- sufMin row -->
  <text x="60" y="185" font-size="13" fill="#7a5415" font-weight="bold">sufMin</text>
  <g filter="url(#sk)">
    <rect x="130" y="162" width="80" height="42" rx="4" fill="#fdfdfb" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="210" y="162" width="80" height="42" rx="4" fill="#fff3e0" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="290" y="162" width="80" height="42" rx="4" fill="#fff3e0" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="162" width="80" height="42" rx="4" fill="#fff3e0" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="450" y="162" width="80" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="15" fill="#7a5415" text-anchor="middle">
    <text x="170" y="189">—</text>
    <text x="250" y="189">−5</text>
    <text x="330" y="189">−5</text>
    <text x="410" y="189">−5</text>
    <text x="490" y="189" font-weight="bold">−5</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#999" text-anchor="middle">
    <text x="170" y="216">无需计算</text>
    <text x="250" y="216">min(−1, −5)</text>
    <text x="330" y="216">min(3, −5)</text>
    <text x="410" y="216">min(−4, −5)</text>
    <text x="490" y="216">nums[4]</text>
  </g>

  <!-- base case arrow -->
  <g filter="url(#sk)">
    <path d="M 470 118 Q 468 138 476 156" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="530" y="140" font-size="11.5" fill="#2e6e2e" font-weight="bold">边界：sufMin[n−1] = nums[n−1]</text>

  <!-- recurrence arrows right to left -->
  <g filter="url(#sk)">
    <path d="M 452 150 Q 430 146 418 158" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 372 150 Q 350 146 338 158" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 292 150 Q 270 146 258 158" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="142" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">递推方向 ←</text>

  <!-- recurrence box -->
  <g filter="url(#sk)">
    <rect x="100" y="245" width="480" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="268" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">sufMin[j] = min(nums[j], sufMin[j+1])</text>
  <text x="340" y="288" text-anchor="middle" font-size="11" fill="#666">区间 [j, n−1] 的最小值 = 「j 自己」与「右邻区间 [j+1, n−1] 的最小值」取小</text>

  <!-- remark box -->
  <g filter="url(#sk)">
    <rect x="60" y="315" width="560" height="66" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="80" y="338" font-size="12" font-weight="bold" fill="#2b2b2b">本例观察：</text>
  <text x="80" y="356" font-size="11" fill="#444">向左扩展区间时，新元素 3、−1、10 都比当前最小值 −5 大，min 不变 → sufMin[1..4] 全是 −5。</text>
  <text x="80" y="373" font-size="11" fill="#444">查询 suffixMin(i) 时直接读 sufMin[i+1]，O(1)。j = 0 永远用不到（分割点 i ≥ 0，后缀从 i+1 ≥ 1 开始）。</text>
</svg>
