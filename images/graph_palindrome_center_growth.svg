<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fdfcf7"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：回文路径 = 中心 + 双端对称生长</text>
  <path d="M 300 42 Q 480 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section A: onion structure of a palindromic path ===== -->
  <text x="480" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888" filter="url(#sk)">一条回文路径的「洋葱」结构（路径 0 → 1 → 2 → 3 → 4，串 "abcba"）</text>

  <!-- edges -->
  <g stroke="#b8b8b8" stroke-width="2.5">
    <line x1="150" y1="152" x2="320" y2="146" filter="url(#sk)"/>
    <line x1="320" y1="146" x2="490" y2="154" filter="url(#sk)"/>
    <line x1="490" y1="154" x2="660" y2="147" filter="url(#sk)"/>
    <line x1="660" y1="147" x2="830" y2="153" filter="url(#sk)"/>
  </g>

  <!-- nested-pair arcs -->
  <path d="M 150 118 Q 490 28 830 118" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="490" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">label[0] = label[4] = 'a' ✓</text>
  <path d="M 320 112 Q 490 60 660 112" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="490" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">label[1] = label[3] = 'b' ✓</text>

  <!-- center ring -->
  <circle cx="490" cy="154" r="40" fill="none" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#sk)"/>

  <!-- nodes -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><circle cx="150" cy="152" r="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="150" y="158" fill="#2b6e9e" filter="url(#sk)">a</text>
    <g filter="url(#sk)"><circle cx="320" cy="146" r="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="320" y="152" fill="#2e6e2e" filter="url(#sk)">b</text>
    <g filter="url(#sk)"><circle cx="490" cy="154" r="30" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="490" y="160" fill="#7a5415" filter="url(#sk)">c</text>
    <g filter="url(#sk)"><circle cx="660" cy="147" r="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="660" y="153" fill="#2e6e2e" filter="url(#sk)">b</text>
    <g filter="url(#sk)"><circle cx="830" cy="153" r="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="830" y="159" fill="#2b6e9e" filter="url(#sk)">a</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="150" y="196" filter="url(#sk)">0</text>
    <text x="320" y="190" filter="url(#sk)">1</text>
    <text x="490" y="198" filter="url(#sk)">2</text>
    <text x="660" y="191" filter="url(#sk)">3</text>
    <text x="830" y="197" filter="url(#sk)">4</text>
  </g>
  <text x="490" y="222" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">节点 2 居中不配对 —— 奇数长度回文的「中心」</text>
  <text x="480" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">回文 ⟺ 首尾字符相等，且剥掉首尾后仍是回文（一层层往外配对）</text>

  <!-- ===== Section B: two kinds of centers ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="268" width="390" height="140" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="265" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">奇数长度：单节点中心</text>
  <g filter="url(#sk)"><circle cx="140" cy="350" r="24" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="140" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">c</text>
  <text x="140" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">w</text>
  <text x="210" y="336" font-size="12.5" font-family="monospace" fill="#2b2b2b" filter="url(#sk)">f[{w}][w][w] = 1</text>
  <text x="210" y="360" font-size="11" fill="#444" filter="url(#sk)">初始长度 1；任何节点</text>
  <text x="210" y="380" font-size="11" fill="#444" filter="url(#sk)">都能充当奇回文的中心</text>

  <g filter="url(#sk)">
    <rect x="500" y="268" width="390" height="140" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="695" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">偶数长度：相邻同字符对中心</text>
  <line x1="575" y1="350" x2="675" y2="350" stroke="#b8b8b8" stroke-width="2.5" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="575" cy="350" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="575" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="675" cy="350" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="675" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <text x="575" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">u</text>
  <text x="675" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">v</text>
  <text x="730" y="336" font-size="12.5" font-family="monospace" fill="#2b2b2b" filter="url(#sk)">f[{u,v}][u][v] = 1</text>
  <text x="730" y="360" font-size="11" fill="#444" filter="url(#sk)">需 u—v 有边，且</text>
  <text x="730" y="380" font-size="11" fill="#444" filter="url(#sk)">label(u) = label(v)，长度 2</text>

  <!-- ===== Section C: one growth step ===== -->
  <text x="480" y="442" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">一次生长：两端各接一个同字符的新点</text>

  <g filter="url(#sk)">
    <rect x="240" y="460" width="480" height="80" rx="8" fill="#eef5fc" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="480" y="478" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">当前回文路径（恰好覆盖点集 S，端点 u、v）</text>
  <g filter="url(#sk)"><circle cx="300" cy="512" r="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="300" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">u</text>
  <text x="480" y="519" text-anchor="middle" font-size="18" fill="#888" filter="url(#sk)">· · ·</text>
  <g filter="url(#sk)"><circle cx="660" cy="512" r="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="660" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">v</text>

  <g filter="url(#sk)"><circle cx="120" cy="512" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="120" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><circle cx="840" cy="512" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="840" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <path d="M 148 512 L 274 512" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="210" y="498" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">x ∈ N(u)</text>
  <path d="M 812 512 L 686 512" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="750" y="498" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">y ∈ N(v)</text>
  <text x="120" y="552" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">新点 x</text>
  <text x="840" y="552" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">新点 y</text>

  <g filter="url(#sk)">
    <rect x="100" y="566" width="760" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="480" y="584" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">条件：x, y ∉ S 且 x ≠ y，label(x) = label(y)（两侧字符相同）</text>
  <text x="480" y="602" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">⟹ f[S ∪ {x,y}][x][y] = 1，长度 + 2</text>
</svg>
