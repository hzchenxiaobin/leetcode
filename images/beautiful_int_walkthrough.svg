<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 312"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="312" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算：n = 467，target = 6</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">ds(467) = 4+6+7 = 17 &gt; 6，进入候选扫描</text>

  <!-- table -->
  <rect x="48" y="56" width="432" height="122" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="49" y="146" width="430" height="30" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>

  <path d="M48,86 L480,86" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M48,116 L480,116" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M48,146 L480,146" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M100,56 L100,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M170,56 L170,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M240,56 L240,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M310,56 L310,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M380,56 L380,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M430,56 L430,178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- header -->
  <text x="74" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="135" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">base</text>
  <text x="205" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">prefix</text>
  <text x="275" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">prefix+1</text>
  <text x="345" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">候选 c_i</text>
  <text x="405" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">位和</text>
  <text x="455" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">判定</text>

  <!-- row 0 -->
  <text x="74" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="135" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">467</text>
  <text x="275" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">468</text>
  <text x="345" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">468</text>
  <text x="405" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">18</text>
  <text x="455" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- row 1 -->
  <text x="74" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="205" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">46</text>
  <text x="275" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">47</text>
  <text x="345" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">470</text>
  <text x="405" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="455" y="134" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- row 2 (answer) -->
  <text x="74" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="135" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">100</text>
  <text x="205" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="275" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="345" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">500</text>
  <text x="405" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="455" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- answer callout -->
  <path d="M476,162 C500,196 300,218 258,217" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="196" width="206" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="151" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">x = 500 − 467 = 33</text>
  <text x="151" y="231" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">首个可行即最优（候选单调）</text>

  <!-- carry chain note -->
  <rect x="48" y="254" width="424" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">进位链的威力：n = 999 999 999 999（位和 108），target = 10</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c_0 = n + 1 = 10^12，位和 1 ≤ 10 → x = 1，加 1 贯穿 12 位进位</text>
</svg>
