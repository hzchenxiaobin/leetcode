<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">换根：从父节点的答案推出子节点的答案</text>
  <path d="M 180.0 44 Q 330.0 54 480.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="330.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">沿边 u → v 把根从 u 挪到 v，距离和只跟 sz[v] 有关</text>
  <g filter="url(#rough2)"><rect x="230" y="88" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">父节点 u 的答案 ans[u]</text>
  <path d="M 330 128 Q 330.0 139.0 330 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><circle cx="230" cy="190" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="230" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">u</text>
  <g filter="url(#rough2)"><circle cx="430" cy="190" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="430" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">v</text>
  <path d="M 252 190 L 408 190" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <text x="330" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">sz[v]</text>
  <g filter="url(#rough2)"><rect x="90" y="232" width="220" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="200" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">v 子树内：sz[v] 个点</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">它们到根的距离减 1</text>
  <text x="200" y="298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">贡献 −sz[v]</text>
  <g filter="url(#rough2)"><rect x="350" y="232" width="220" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="460" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">子树外：n − sz[v] 个点</text>
  <text x="460" y="276" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">它们到根的距离加 1</text>
  <text x="460" y="298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">贡献 +(n − sz[v])</text>
  <path d="M 200 328 Q 230.0 342.0 260 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <path d="M 460 328 Q 430.0 342.0 400 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="130" y="358" width="400" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="330" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#rough2)">ans[v] = ans[u] + n − 2·sz[v]</text>
  </svg>