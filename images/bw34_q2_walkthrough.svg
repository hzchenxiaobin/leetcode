<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    "10101" 的四种合法分割
  </text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="16">
    <!-- 分割 1: 1 | 010 | 1 -->
    <rect x="70" y="60" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="110" y="60" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="60" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="90" y="88" fill="#446688">1</text>
    <text x="160" y="88" fill="#8a6a1a">010</text>
    <text x="230" y="88" fill="#2f5a24">1</text>
    <text x="330" y="88" font-size="13" fill="#666">c₁=0，c₂=2</text>
    <!-- 分割 2: 1 | 01 | 01 -->
    <rect x="70" y="118" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="110" y="118" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="180" y="118" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="90" y="146" fill="#446688">1</text>
    <text x="145" y="146" fill="#8a6a1a">01</text>
    <text x="215" y="146" fill="#2f5a24">01</text>
    <text x="330" y="146" font-size="13" fill="#666">c₁=0，c₂=3</text>
    <!-- 分割 3: 10 | 10 | 1 -->
    <rect x="70" y="176" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="140" y="176" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="210" y="176" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="204" fill="#446688">10</text>
    <text x="175" y="204" fill="#8a6a1a">10</text>
    <text x="230" y="204" fill="#2f5a24">1</text>
    <text x="330" y="204" font-size="13" fill="#666">c₁=1，c₂=2</text>
    <!-- 分割 4: 10 | 1 | 01 -->
    <rect x="70" y="234" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="140" y="234" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="180" y="234" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="105" y="262" fill="#446688">10</text>
    <text x="160" y="262" fill="#8a6a1a">1</text>
    <text x="215" y="262" fill="#2f5a24">01</text>
    <text x="330" y="262" font-size="13" fill="#666">c₁=1，c₂=3</text>
  </g>

  <!-- 汇总 -->
  <rect x="96" y="298" width="330" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="261" y="318" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    c₁ ∈ {0, 1}，c₂ ∈ {2, 3}：各段 1 的个数都为 1
  </text>
  <text x="261" y="336" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    乘法原理 2 × 2 = 4 ✓
  </text>
</svg>
