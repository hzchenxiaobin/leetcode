<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">堂兄弟 = 深度相同 且 父亲不同</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两个条件必须同时满足：只看深度会把亲兄弟算进来，只看父亲会忽略深度</text>

  <path d="M 280 84 L 210 124" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 84 L 350 124" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 148 L 160 186" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 148 L 244 186" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 360 148 L 316 186" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 360 148 L 404 186" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="280" cy="72" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="78" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="200" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="146" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="360" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="146" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>

  <circle cx="150" cy="196" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="150" y="202" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="252" cy="196" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="252" y="202" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="308" cy="196" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="308" y="202" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="412" cy="196" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="412" y="202" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="24" y="238" width="170" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="109" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 与 6 → 堂兄弟 ✓</text>
  <text x="109" y="276" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">深度都是 2，父亲 2 ≠ 3</text>
  <text x="109" y="291" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">父亲不同是关键</text>

  <rect x="204" y="238" width="170" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="289" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 与 5 → 亲兄弟 ✗</text>
  <text x="289" y="276" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">深度相同，但父亲都是 2</text>
  <text x="289" y="291" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">被第二个条件否决</text>

  <rect x="384" y="238" width="152" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="460" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 与 3 → ✗</text>
  <text x="460" y="276" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">深度 2 与 1 不同</text>
  <text x="460" y="291" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">被第一个条件否决</text>
</svg>
