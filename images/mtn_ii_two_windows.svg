<svg xmlns="http://www.w3.org/2000/svg" width="640" height="375" viewBox="0 0 640 375" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="375" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">O(n²) → O(n) 的分水岭：扩张侧顺手滚，收缩侧先建表</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array with peak j -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="90"  y="64" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="136" y="64" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="182" y="64" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="228" y="64" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
      <rect x="274" y="64" width="52" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
      <rect x="326" y="64" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <rect x="372" y="64" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
      <rect x="418" y="64" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    </g>
    <g fill="#555" font-size="12">
      <text x="113" y="89" filter="url(#sk)">…</text>
      <text x="159" y="89" filter="url(#sk)">…</text>
      <text x="205" y="89" filter="url(#sk)">…</text>
      <text x="251" y="89" filter="url(#sk)">…</text>
      <text x="349" y="89" filter="url(#sk)">…</text>
      <text x="395" y="89" filter="url(#sk)">…</text>
      <text x="441" y="89" filter="url(#sk)">…</text>
    </g>
    <text x="300" y="89" fill="#a06a10" font-weight="bold" font-size="15" filter="url(#sk)">nums[j]</text>
    <text x="300" y="56" fill="#b85450" font-weight="bold" font-size="13" filter="url(#sk)">j（山峰）</text>
  </g>

  <!-- window motion arrows -->
  <path d="M 110 128 L 200 128" stroke="#4a8edb" stroke-width="1.6" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="155" y="121" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">j 右移 ⇒ 只扩张</text>
  <path d="M 500 128 L 410 128" stroke="#4a8e4a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="455" y="121" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">j 右移 ⇒ 只收缩</text>

  <!-- left window box -->
  <g filter="url(#sk)">
    <rect x="48" y="150" width="250" height="78" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2b6e9e">
    <text x="173" y="173" text-anchor="middle" font-weight="bold" filter="url(#sk)">左窗口 [0, j)：只进不出</text>
    <text x="173" y="194" text-anchor="middle" filter="url(#sk)">新元素直接 min 进滚动变量 preMin</text>
    <text x="173" y="215" text-anchor="middle" filter="url(#sk)">min 天生会「并入」→ O(1) 摊还</text>
  </g>

  <!-- right window box -->
  <g filter="url(#sk)">
    <rect x="342" y="150" width="250" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2e6e2e">
    <text x="467" y="173" text-anchor="middle" font-weight="bold" filter="url(#sk)">右窗口 (j, n)：只出不进</text>
    <text x="467" y="194" text-anchor="middle" filter="url(#sk)">丢掉的元素回不来，min 不会「删除」</text>
    <text x="467" y="215" text-anchor="middle" filter="url(#sk)">只好先沿右→左递推，存进 suf 数组</text>
  </g>

  <!-- summary strip -->
  <g filter="url(#sk)">
    <rect x="70" y="248" width="500" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">每个 j 的两侧查询从 O(n) 降到 O(1)，O(n²) 便塌成 O(n)</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">主循环里：左腿 = 顺手滚出来的 preMin，右腿 = 查表 suf[j+1]</text>

  <!-- flow -->
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="52" y="328" width="180" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
      <rect x="248" y="328" width="190" height="30" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
      <rect x="454" y="328" width="136" height="30" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    </g>
    <text x="142" y="348" fill="#2e6e2e" filter="url(#sk)">① 右→左递推建 suf</text>
    <text x="343" y="348" fill="#2b6e9e" filter="url(#sk)">② 左→右枚举 j（滚 preMin）</text>
    <text x="522" y="348" fill="#7a5415" filter="url(#sk)">③ 合法即更新 ans</text>
    <path d="M 236 343 L 244 343" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 440 343 L 450 343" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
</svg>
