<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：建桶之后，倒序一击命中</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板一：建桶 -->
  <text x="40" y="78" font-size="11" fill="#888">建桶：</text>
  <g filter="url(#sk)"><rect x="100" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="122" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="150" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="172" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="200" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="222" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="250" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="272" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="300" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="322" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="350" y="62" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="372" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="410" y="80" font-size="11" fill="#888">arr = [1,2,2,3,3,3]</text>

  <path d="M 275 96 L 275 122" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="285" y="114" font-size="11" fill="#888">元素 v 落进下标 v 的桶（一趟）</text>

  <g filter="url(#sk)"><rect x="100" y="130" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="128" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="170" y="130" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="198" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="240" y="130" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="268" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="128" y="178">下标 1</text>
    <text x="198" y="178">下标 2</text>
    <text x="268" y="178">下标 3</text>
  </g>
  <text x="330" y="148" font-size="12" fill="#2e6e2e">cnt = {1:1, 2:2, 3:3}（三值全命中）</text>
  <text x="330" y="168" font-size="12.5" font-weight="bold" fill="#2e6e2e">幸运数集合 = {1, 2, 3}</text>

  <!-- 分隔线 -->
  <path d="M 60 198 Q 320 208 580 198" stroke="#cccccc" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- 面板二：倒序扫描 -->
  <text x="40" y="234" font-size="11" fill="#888">倒序扫描：</text>
  <path d="M 118 250 L 468 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="293" y="244" text-anchor="middle" font-size="11" fill="#888">v 从大到小</text>

  <g filter="url(#sk)"><rect x="100" y="258" width="36" height="42" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="118" y="277" text-anchor="middle" font-size="12" fill="#6a7a90">…</text>
  <text x="118" y="293" text-anchor="middle" font-size="9.5" fill="#8a9ab0">全 0 ✗</text>

  <g filter="url(#sk)"><rect x="146" y="258" width="52" height="42" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="172" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a7a90">6</text>
  <text x="172" y="293" text-anchor="middle" font-size="10" fill="#8a9ab0">cnt=0 ✗</text>

  <g filter="url(#sk)"><rect x="206" y="258" width="52" height="42" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="232" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a7a90">5</text>
  <text x="232" y="293" text-anchor="middle" font-size="10" fill="#8a9ab0">cnt=0 ✗</text>

  <g filter="url(#sk)"><rect x="266" y="258" width="52" height="42" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="292" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a7a90">4</text>
  <text x="292" y="293" text-anchor="middle" font-size="10" fill="#8a9ab0">cnt=0 ✗</text>

  <g filter="url(#sk)"><rect x="326" y="258" width="52" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="352" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
  <text x="352" y="293" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">cnt[3]=3 ✓</text>

  <g filter="url(#sk)"><rect x="386" y="258" width="52" height="42" rx="4" fill="none" stroke="#8a9ab0" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="412" y="277" text-anchor="middle" font-size="13" fill="#b0b8c4">2</text>
  <text x="412" y="293" text-anchor="middle" font-size="10" fill="#b0b8c4">不再看</text>

  <g filter="url(#sk)"><rect x="446" y="258" width="52" height="42" rx="4" fill="none" stroke="#8a9ab0" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="472" y="277" text-anchor="middle" font-size="13" fill="#b0b8c4">1</text>
  <text x="472" y="293" text-anchor="middle" font-size="10" fill="#b0b8c4">不再看</text>

  <text x="320" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">首个命中 v = 3 ⟹ return 3（2 和 1 也是幸运数，但只要最大）</text>

  <!-- 面板三：示例 3 对照 -->
  <g filter="url(#sk)"><rect x="50" y="350" width="540" height="110" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="320" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">对照示例 3：arr = [2,2,2,3,3] → cnt = {2:3, 3:2}</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#7a4a48">cnt[2] = 3 ≠ 2 ✗　　cnt[3] = 2 ≠ 3 ✗（值与频次交叉错位）</text>
  <text x="320" y="430" text-anchor="middle" font-size="12" fill="#7a4a48">从 500 扫到 1 全程无命中 → return −1</text>
</svg>
