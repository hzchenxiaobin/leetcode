<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">点 = 行列二分图上的一条边，连通块 = 激活整体</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: 激活传播 ===== -->
  <text x="240" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 激活 = 沿「同 x / 同 y」传播（示例 1）</text>

  <!-- axes -->
  <path d="M 100 255 L 415 255" stroke="#999" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 100 255 L 100 65" stroke="#999" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="272" font-size="12" fill="#888">x</text>
  <text x="86" y="62" font-size="12" fill="#888">y</text>

  <!-- activation rays: from (1,2) -->
  <path d="M 190 115 L 190 178" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 205 100 L 295 100" stroke="#b03a3a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="150" y="152" font-size="10" fill="#b03a3a" text-anchor="end">同 x=1</text>
  <text x="250" y="92" font-size="10" fill="#b03a3a">同 y=2</text>

  <!-- points: (1,2) red start, (1,1) & (2,2) activated -->
  <g filter="url(#sk)"><circle cx="190" cy="100" r="9" fill="#fce4ec" stroke="#b03a3a" stroke-width="2"/></g>
  <text x="190" y="104" text-anchor="middle" font-size="9" fill="#b03a3a" font-weight="bold">起</text>
  <text x="178" y="88" font-size="10" fill="#b03a3a" font-weight="bold">(1,2)</text>

  <g filter="url(#sk)"><circle cx="190" cy="190" r="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="178" y="212" font-size="10" fill="#2b6e9e" font-weight="bold">(1,1)</text>

  <g filter="url(#sk)"><circle cx="300" cy="100" r="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="312" y="92" font-size="10" fill="#2b6e9e" font-weight="bold">(2,2)</text>

  <!-- axis ticks -->
  <text x="190" y="268" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="300" y="268" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="90" y="194" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="90" y="104" text-anchor="end" font-size="10" fill="#888">2</text>

  <text x="255" y="300" text-anchor="middle" font-size="11" fill="#444">激活 (1,2) → 同 x 的 (1,1)、同 y 的 (2,2) 被激活</text>
  <text x="255" y="318" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">传播 1 步后 3 个点全部激活</text>

  <!-- ===== Panel 2: 二分图建模 ===== -->
  <text x="690" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 换个视角：x 值、y 值是节点，点是边</text>

  <!-- enclosure -->
  <g filter="url(#sk)"><rect x="520" y="92" width="360" height="240" rx="14" fill="none" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="7 4"/></g>
  <text x="700" y="352" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">1 个连通块 = 3 条边 = 3 个点</text>

  <!-- X nodes -->
  <g filter="url(#sk)"><rect x="550" y="120" width="72" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="586" y="142" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">x=1</text>
  <g filter="url(#sk)"><rect x="550" y="250" width="72" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="586" y="272" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">x=2</text>

  <!-- Y nodes -->
  <g filter="url(#sk)"><rect x="780" y="120" width="72" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="816" y="142" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">y=1</text>
  <g filter="url(#sk)"><rect x="780" y="250" width="72" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="816" y="272" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">y=2</text>

  <!-- edges = points -->
  <path d="M 622 145 Q 700 165 780 145" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="700" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(1,1)</text>

  <path d="M 622 145 Q 710 210 780 258" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="676" y="212" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(1,2)</text>

  <path d="M 622 262 Q 700 280 780 262" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="700" y="296" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(2,2)</text>

  <!-- ===== Bottom: mapping + insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="390" width="420" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="80" y="414" font-size="13" font-weight="bold" fill="#7a5415">激活传播 = 沿公共端点的边扩散</text>
  <text x="80" y="438" font-size="11" fill="#444">(x,y) 与 (x',y') 同 x 或同 y</text>
  <text x="80" y="456" font-size="11" fill="#444">⟺ 边 (X_x,Y_y) 与 (X_x',Y_y') 有公共端点</text>
  <text x="80" y="480" font-size="11" fill="#b03a3a" font-weight="bold">→ 从任一点激活 = 点亮其所在连通块的全部边</text>

  <g filter="url(#sk)">
    <rect x="500" y="390" width="380" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="520" y="414" font-size="13" font-weight="bold" fill="#2b6e9e">离散化注意（X、Y 分开编号）</text>
  <text x="520" y="438" font-size="11" fill="#444">每个出现过的 x 值 → 节点 X_v（编号 [0, n)）</text>
  <text x="520" y="456" font-size="11" fill="#444">每个出现过的 y 值 → 节点 Y_v（编号 [n, 2n)）</text>
  <text x="520" y="480" font-size="11" fill="#b03a3a" font-weight="bold">值 v 既当 x 又当 y 时，X_v 与 Y_v 是两个节点！</text>

  <g filter="url(#sk)">
    <rect x="60" y="530" width="820" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="556" font-size="12" font-weight="bold" fill="#2b2b2b">关键洞察</text>
  <text x="80" y="580" font-size="11" fill="#444">新点 (x,y) 的激活范围只由两个因素决定：x 值挂在哪个连通块、y 值挂在哪个连通块</text>
  <text x="80" y="602" font-size="11" fill="#444">→ 不必模拟激活过程，只需求出各连通块大小，再考虑如何用新点「桥接」两个块</text>
</svg>
