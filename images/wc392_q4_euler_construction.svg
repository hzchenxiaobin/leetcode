<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">可达性构造：DFS 树折返游走，扫过分量内每条边</text>

  <!-- ============ 左：DFS 树 ============ -->
  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.7">
    <line x1="88" y1="118" x2="172" y2="92"/>
    <line x1="198" y1="92" x2="282" y2="118"/>
    <line x1="185" y1="100" x2="185" y2="205"/>
  </g>
  <!-- non-tree edge -->
  <path d="M 288,137 Q 250,195 200,228" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="102" y="94" font-size="8.5" fill="#446688" filter="url(#rough2)">树边 ×2</text>
  <text x="232" y="94" font-size="8.5" fill="#446688" filter="url(#rough2)">树边 ×2</text>
  <text x="200" y="158" font-size="8.5" fill="#446688" filter="url(#rough2)">树边 ×2</text>
  <text x="238" y="185" font-size="8.5" fill="#8a6a1a" filter="url(#rough2)">非树边 u→v→u 折返</text>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <circle cx="75" cy="125" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="75" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5e24">s</text>
    <circle cx="185" cy="85" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="185" y="90" text-anchor="middle" font-size="12" fill="#333">a</text>
    <circle cx="295" cy="125" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="295" y="130" text-anchor="middle" font-size="12" fill="#333">b</text>
    <circle cx="185" cy="220" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="185" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">t</text>
  </g>
  <text x="75" y="156" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">根 / 出发点</text>
  <text x="185" y="250" text-anchor="middle" font-size="8.5" fill="#8a6a1a" filter="url(#rough2)">终点</text>

  <text x="40" y="272" font-size="9.5" fill="#555" filter="url(#rough2)">实线 = 树边（下去 + 回来各一次）　虚线 = 非树边（折返踩一脚）</text>

  <!-- ============ 右：四步构造 ============ -->
  <g filter="url(#rough2)">
    <rect x="350" y="52" width="248" height="54" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="368" cy="79" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="368" y="83" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">①</text>
    <text x="388" y="74" font-size="10" fill="#333">从 s 出发按 DFS 序游走</text>
    <text x="388" y="92" font-size="9.5" fill="#666">每条树边「下去 + 回溯」各走一次</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="116" width="248" height="54" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="368" cy="143" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="368" y="147" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">②</text>
    <text x="388" y="138" font-size="10" fill="#333">非树边 (u,v) 首次遇到时</text>
    <text x="388" y="156" font-size="9.5" fill="#666">以 u→v→u 折返踩一脚</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="180" width="248" height="54" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="368" cy="207" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="368" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">③</text>
    <text x="388" y="202" font-size="10" fill="#333">闭游走回到 s 之后</text>
    <text x="388" y="220" font-size="9.5" fill="#666">再沿树路径走到 t</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="244" width="248" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="368" cy="271" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="368" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">④</text>
    <text x="388" y="266" font-size="10" fill="#333">x &amp; x = x，重复不改变 AND</text>
    <text x="388" y="284" font-size="9.5" fill="#2f5e24">⇒ 这趟旅途的代价 = AND(E_C)</text>
  </g>

  <!-- ============ 底部：欧拉观点 ============ -->
  <g filter="url(#rough2)">
    <rect x="25" y="320" width="570" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="310" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">等价说法：把每条无向边拆成两条有向弧，则每个点的入度 = 出度，</text>
    <text x="310" y="362" text-anchor="middle" font-size="10.5" fill="#2f5e24">有向图存在欧拉回路——「能扫过每条边」的另一条证明路径</text>
  </g>
</svg>
