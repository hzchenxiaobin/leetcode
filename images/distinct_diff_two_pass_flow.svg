<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- ============ Pass 1 ============ -->
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">第一趟 · 从右向左：预算 suf[i]（后缀不同元素数）</text>
  <path d="M 150 32 Q 330 38 510 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <rect x="200" y="46" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#2b2b2b">suf[n] = 0，cnt[·] = 0</text>

  <path d="M 280 76 L 280 92" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <polygon points="280,92 370,130 280,168 190,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#2b2b2b">cnt[nums[i]]</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#2b2b2b">== 0 ?</text>

  <!-- yes branch -->
  <text x="384" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 370 130 L 402 130" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="406" y="116" width="130" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="471" y="134" text-anchor="middle" font-size="11.5" fill="#2b2b2b">suf[i] = suf[i+1]+1</text>

  <!-- no branch -->
  <text x="294" y="182" text-anchor="middle" font-size="11" fill="#d6a040">否</text>
  <path d="M 280 168 L 280 188 L 310 188" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="314" y="174" width="130" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="379" y="192" text-anchor="middle" font-size="11.5" fill="#2b2b2b">suf[i] = suf[i+1]</text>

  <!-- converge into mark box -->
  <path d="M 471 144 L 471 224" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M 379 202 L 379 212 L 430 212 L 430 224" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <rect x="400" y="228" width="140" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="243" text-anchor="middle" font-size="11" fill="#2b2b2b">cnt[nums[i]] = 1</text>
  <text x="470" y="257" text-anchor="middle" font-size="11" fill="#2b2b2b">i −−</text>

  <!-- loop back to diamond -->
  <path d="M 400 244 L 190 244 L 190 134" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="295" y="238" text-anchor="middle" font-size="10.5" fill="#888">i ≥ 0 ⇒ 重复判断</text>

  <!-- exit to pass 2 -->
  <path d="M 470 260 L 470 296" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="482" y="284" font-size="10.5" fill="#666">i &lt; 0，第一趟结束</text>

  <!-- ============ Pass 2 ============ -->
  <text x="330" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">第二趟 · 从左到右：维护 pre 写出 diff[i]</text>
  <path d="M 150 320 Q 330 326 510 320" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <rect x="37" y="336" width="150" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="112" y="356" text-anchor="middle" font-size="11.5" fill="#2b2b2b">pre = 0，seen[·] = 0</text>

  <path d="M 187 352 L 203 352" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <rect x="207" y="336" width="200" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="349" text-anchor="middle" font-size="10.5" fill="#2b2b2b">seen[nums[i]] == 0 ?</text>
  <text x="307" y="363" text-anchor="middle" font-size="10.5" fill="#2b2b2b">是 ⇒ pre += 1，标记</text>

  <path d="M 407 352 L 421 352" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <rect x="425" y="336" width="200" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">diff[i] = pre − suf[i+1]</text>

  <!-- loop back -->
  <path d="M 525 368 L 525 392 L 334 392 L 334 371" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="440" y="387" text-anchor="middle" font-size="10.5" fill="#888">i++，i &lt; n ⇒ 重复</text>

  <!-- bottom note -->
  <rect x="40" y="406" width="580" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="424" text-anchor="middle" font-size="11.5" fill="#2b2b2b">关键：后缀依赖「未来」元素 ⇒ 必须先反向预算；前缀随扫随算即可</text>
</svg>
