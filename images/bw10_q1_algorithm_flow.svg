<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：全等收集，否则最小者齐推</text>

  <rect x="170" y="46" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold">i = j = k = 0</text>

  <line x1="280" y1="84" x2="280" y2="106" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,108 368,152 280,196 192,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr1[i] == arr2[j]</text>
  <text x="280" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== arr3[k] ?</text>

  <line x1="368" y1="152" x2="440" y2="152" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="142" font-size="11.5" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="442" y="132" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="497" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">收集该值</text>
  <text x="497" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i++ j++ k++</text>

  <line x1="280" y1="196" x2="280" y2="222" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="218" font-size="11.5" fill="#b85450" font-weight="bold">否</text>

  <rect x="150" y="224" width="260" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">mn = min(三元组)</text>
  <text x="280" y="266" text-anchor="middle" font-size="11.5" fill="#555">a==mn 则 i++；b==mn 则 j++；c==mn 则 k++</text>

  <line x1="150" y1="250" x2="96" y2="250" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="96" y1="250" x2="96" y2="152" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="96" y1="152" x2="188" y2="152" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,300 352,332 280,364 208,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有未越界的？</text>

  <line x1="352" y1="332" x2="420" y2="332" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="322" font-size="11.5" fill="#446688" font-weight="bold">是</text>
  <path d="M 420 332 Q 460 332 460 250" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="446" y="296" font-size="10.5" fill="#999">回到判定</text>

  <line x1="280" y1="364" x2="280" y2="386" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="384" font-size="11.5" fill="#b85450" font-weight="bold">否（任一数组耗尽）</text>

  <rect x="150" y="388" width="260" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回结果（天然升序）</text>

  <text x="30" y="70" font-size="11.5" fill="#555">每轮至少一个指针前进</text>
  <text x="30" y="88" font-size="11.5" fill="#555">→ 总轮数 ≤ 三数组长度和</text>

  <text x="30" y="416" font-size="11" fill="#999">bw10 Q1 · 三个有序数组的交集</text>
</svg>
