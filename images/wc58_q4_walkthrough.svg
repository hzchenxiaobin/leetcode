<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：s1 = abcdebdde，s2 = bde</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">表里每格是 dp[j]；−1 表示 T[0..j] 仍未被匹配出来</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="480" height="300" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4" rx="6"/>
    <rect x="90" y="70" width="60" height="300" fill="#f7f9fc" stroke="#c9d3e0" stroke-width="1" />
    <rect x="40" y="220" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="40" y="340" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="40" y="70" width="480" height="30" fill="#e8f0fe" stroke="#c9d3e0" stroke-width="1"/>
  </g>

  <g stroke="#d5dde8" stroke-width="1" filter="url(#rough2)">
    <path d="M 90 70 L 90 370"/>
    <path d="M 150 70 L 150 370"/>
    <path d="M 230 70 L 230 370"/>
    <path d="M 310 70 L 310 370"/>
    <path d="M 390 70 L 390 370"/>
    <path d="M 40 100 L 520 100"/>
    <path d="M 40 130 L 520 130"/>
    <path d="M 40 160 L 520 160"/>
    <path d="M 40 190 L 520 190"/>
    <path d="M 40 220 L 520 220"/>
    <path d="M 40 250 L 520 250"/>
    <path d="M 40 280 L 520 280"/>
    <path d="M 40 310 L 520 310"/>
  </g>

  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="90">i</text>
    <text x="120" y="90">s1[i]</text>
    <text x="190" y="90">dp[0]</text>
    <text x="270" y="90">dp[1]</text>
    <text x="350" y="90">dp[2]</text>
    <text x="455" y="90">候选窗口</text>
  </g>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="120">0</text>
    <text x="120" y="120">a</text>
    <text x="190" y="120">−1</text>
    <text x="270" y="120">−1</text>
    <text x="350" y="120">−1</text>
    <text x="455" y="120" font-size="11" fill="#aaa">—</text>

    <text x="65" y="150">1</text>
    <text x="120" y="150">b</text>
    <text x="190" y="150">1</text>
    <text x="270" y="150">−1</text>
    <text x="350" y="150">−1</text>
    <text x="455" y="150" font-size="11" fill="#aaa">—</text>

    <text x="65" y="180">2</text>
    <text x="120" y="180">c</text>
    <text x="190" y="180">1</text>
    <text x="270" y="180">−1</text>
    <text x="350" y="180">−1</text>
    <text x="455" y="180" font-size="11" fill="#aaa">—</text>

    <text x="65" y="210">3</text>
    <text x="120" y="210">d</text>
    <text x="190" y="210">1</text>
    <text x="270" y="210">1</text>
    <text x="350" y="210">−1</text>
    <text x="455" y="210" font-size="11" fill="#aaa">—</text>

    <text x="65" y="240" font-weight="bold" fill="#3a5a30">4</text>
    <text x="120" y="240" font-weight="bold" fill="#3a5a30">e</text>
    <text x="190" y="240" fill="#3a5a30">1</text>
    <text x="270" y="240" fill="#3a5a30">1</text>
    <text x="350" y="240" font-weight="bold" fill="#3a5a30">1</text>
    <text x="455" y="240" font-size="11" font-weight="bold" fill="#3a5a30">bcde，长 4</text>

    <text x="65" y="270">5</text>
    <text x="120" y="270">b</text>
    <text x="190" y="270">5</text>
    <text x="270" y="270">1</text>
    <text x="350" y="270">1</text>
    <text x="455" y="270" font-size="11" fill="#888">[1,5]，长 5</text>

    <text x="65" y="300">6</text>
    <text x="120" y="300">d</text>
    <text x="190" y="300">5</text>
    <text x="270" y="300">5</text>
    <text x="350" y="300">1</text>
    <text x="455" y="300" font-size="11" fill="#888">[1,6]，长 6</text>

    <text x="65" y="330">7</text>
    <text x="120" y="330">d</text>
    <text x="190" y="330">5</text>
    <text x="270" y="330">5</text>
    <text x="350" y="330">1</text>
    <text x="455" y="330" font-size="11" fill="#888">[1,7]，长 7</text>

    <text x="65" y="360" font-weight="bold" fill="#8a6a20">8</text>
    <text x="120" y="360" font-weight="bold" fill="#8a6a20">e</text>
    <text x="190" y="360" fill="#8a6a20">5</text>
    <text x="270" y="360" fill="#8a6a20">5</text>
    <text x="350" y="360" font-weight="bold" fill="#8a6a20">5</text>
    <text x="455" y="360" font-size="11" font-weight="bold" fill="#8a6a20">bdde，长 4</text>
  </g>

  <g filter="url(#rough2)">
    <text x="40" y="392" font-size="11" fill="#3a5a30">第 4 位首次凑齐 → 窗口 [1,4] = bcde，长度 4（绿色行）</text>
    <text x="40" y="410" font-size="11" fill="#8a3a36">第 8 位又出现等长的 [5,8] = bdde；等长不覆盖，保留更左的 bcde</text>
  </g>
</svg>
