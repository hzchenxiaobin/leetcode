<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：两遍单调栈 + 一次统计</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="48" y="58" width="290" height="72" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="193" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">① 从左到右，值递减栈求 left[i]</text>
  <text x="193" y="100" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">弹掉所有值小于 nums[i] 的栈顶</text>
  <text x="193" y="118" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">left[i] = 新栈顶（空则 −1），i 入栈</text>

  <path d="M 193 130 L 193 148" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="48" y="152" width="290" height="72" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="193" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">② 从右到左，对称求 right[i]</text>
  <text x="193" y="194" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">弹掉所有值小于 nums[i] 的栈顶</text>
  <text x="193" y="212" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">right[i] = 新栈顶（空则 n），i 入栈</text>

  <path d="M 193 224 L 193 242" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="48" y="246" width="290" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="193" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">③ 统计合法配对</text>
  <text x="193" y="288" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">left[i] ≠ −1 且 i − left[i] ≥ 2 → ans++</text>
  <text x="193" y="306" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">right[i] ≠ n 且 right[i] − i ≥ 2 → ans++</text>

  <path d="M 193 322 L 193 340" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="48" y="344" width="290" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="193" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans（≤ 2n，O(n) 时间）</text>

  <rect x="376" y="58" width="244" height="180" rx="8" fill="#ffffff" stroke="#c0cad2" stroke-width="1.4" filter="url(#sk)"/>
  <text x="498" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">栈内下标演化（左→右）</text>

  <text x="390" y="109" text-anchor="start" font-size="10" fill="#66778a" filter="url(#sk)">i=0</text>
  <rect x="422" y="94" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="109" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">0</text>
  <text x="490" y="109" text-anchor="start" font-size="9.5" fill="#a06a10" filter="url(#sk)">2 入栈</text>

  <text x="390" y="139" text-anchor="start" font-size="10" fill="#66778a" filter="url(#sk)">i=1</text>
  <rect x="422" y="124" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="139" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">1</text>
  <text x="490" y="139" text-anchor="start" font-size="9.5" fill="#a06a10" filter="url(#sk)">弹 0，5 入栈</text>

  <text x="390" y="169" text-anchor="start" font-size="10" fill="#66778a" filter="url(#sk)">i=2</text>
  <rect x="422" y="154" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="169" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">1</text>
  <rect x="448" y="154" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="459" y="169" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">2</text>
  <text x="490" y="169" text-anchor="start" font-size="9.5" fill="#a06a10" filter="url(#sk)">3 入栈</text>

  <text x="390" y="199" text-anchor="start" font-size="10" fill="#66778a" filter="url(#sk)">i=3</text>
  <rect x="422" y="184" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="199" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">1</text>
  <rect x="448" y="184" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="459" y="199" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">2</text>
  <rect x="474" y="184" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="485" y="199" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">3</text>
  <text x="512" y="199" text-anchor="start" font-size="9.5" fill="#a06a10" filter="url(#sk)">1 入栈</text>

  <text x="390" y="229" text-anchor="start" font-size="10" fill="#66778a" filter="url(#sk)">i=4</text>
  <rect x="422" y="214" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="229" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">1</text>
  <rect x="448" y="214" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="459" y="229" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#sk)">4</text>
  <text x="490" y="229" text-anchor="start" font-size="9.5" fill="#a06a10" filter="url(#sk)">弹 3、2，4 入栈</text>

  <rect x="376" y="252" width="244" height="136" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="498" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">left = [−1, −1, 1, 2, 1]</text>
  <text x="498" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">right = [1, 无, 4, 4, 无]</text>
  <text x="498" y="316" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">i=2：右距 4−2=2 ✓ → 碗 [3,1,4]</text>
  <text x="498" y="334" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">i=4：左距 4−1=3 ✓ → 碗 [5,3,1,4]</text>
  <text x="498" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2 ✓</text>
</svg>
