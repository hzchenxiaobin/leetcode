<svg xmlns="http://www.w3.org/2000/svg" width="560" height="480" viewBox="0 0 560 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="480" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：前缀和 + 一趟累加</text>
  <path d="M 150 42 Q 280 52 410 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: build prefix -->
  <g filter="url(#sk)">
    <rect x="130" y="60" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="82" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">① 构建前缀和</text>
  <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">pre[0]=0，pre[i+1]=pre[i]+nums[i]</text>

  <path d="M 280 110 L 280 128" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: loop -->
  <g filter="url(#sk)">
    <rect x="130" y="132" width="300" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="280" y="157" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">② 遍历 i = 0 … n−1</text>

  <path d="M 280 172 L 280 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="280,194 380,240 280,286 180,240" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">i − nums[i] &lt; 0 ?</text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#8a3a34">（左端越界？）</text>

  <!-- yes branch -->
  <path d="M 180 240 L 140 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="160" y="230" text-anchor="middle" font-size="11.5" fill="#8a3a34">是</text>
  <g filter="url(#sk)">
    <rect x="30" y="222" width="110" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="85" y="245" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">start = 0</text>

  <!-- no branch -->
  <path d="M 380 240 L 420 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="230" text-anchor="middle" font-size="11.5" fill="#8a3a34">否</text>
  <g filter="url(#sk)">
    <rect x="424" y="222" width="110" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="479" y="245" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">start=i−nums[i]</text>

  <!-- merge arrows -->
  <path d="M 85 258 L 85 300 L 190 320" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 479 258 L 479 300 L 370 320" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3: accumulate -->
  <g filter="url(#sk)">
    <rect x="140" y="326" width="280" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="348" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">③ 累加区间和</text>
  <text x="280" y="365" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">ans += pre[i+1] − pre[start]</text>

  <!-- loop back -->
  <path d="M 140 349 Q 90 349 90 176 L 130 152" stroke="#7a9a6a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="66" y="262" font-size="11" fill="#5a7a4a" transform="rotate(-90 66 262)">下一个 i</text>

  <!-- exit -->
  <path d="M 280 372 L 280 396" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="388" font-size="11" fill="#777">遍历结束</text>

  <!-- step 4: return -->
  <g filter="url(#sk)">
    <rect x="170" y="400" width="220" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="280" y="421" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">④ 返回 ans</text>
  <text x="280" y="437" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">时间 O(n)</text>

  <!-- footer -->
  <text x="280" y="466" text-anchor="middle" font-size="12" fill="#888">每个下标 O(1) 查询，两趟线性扫描</text>
</svg>
