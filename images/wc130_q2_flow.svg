<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：反复取非负余数，再除以 -2</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">商严格比 n 小，循环必然终止</text>
  <rect x="150.0" y="66.0" width="260.0" height="38.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="88.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n == 0 ? → 直接返回 "0"</text>
  <path d="M 280.0 104.0 L 280.0 122.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="122.0" width="260.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="145.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r = n mod 2  （取非负余数）</text>
  <path d="M 280.0 162.0 L 280.0 180.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="180.0" width="260.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="204.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">digits.push(r)；n = (n - r) / (-2)</text>
  <path d="M 280.0 222.0 L 280.0 242.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="242.0" width="220.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="266.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n == 0 ?</text>
  <path d="M 390 262 C 480 258 480 142 414 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452.0" y="208.0" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="408.0" y="242.0" width="140.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="478.0" y="265.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">是：反转输出</text>
  <path d="M 390.0 262.0 L 406.0 262.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="25.0" y="320.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每轮 |n| 至少缩小到 3/4：|q| ≤ (|n|+1)/2 &lt; |n|（|n| ≥ 2）。</text>
</svg>
