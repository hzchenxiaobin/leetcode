<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍扫描，原数与反转数各入集合一次</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- right top annotation -->
  <g filter="url(#sk)">
    <rect x="420" y="56" width="232" height="54" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="436" y="78" font-size="11" fill="#555" filter="url(#sk)">总时间 O(n·d)，d ≤ 7 为常数 → O(n)</text>
  <text x="436" y="98" font-size="11" fill="#555" filter="url(#sk)">空间 O(n)：集合至多存 2n 个不同值</text>

  <!-- step 1: iterate -->
  <g filter="url(#sk)">
    <rect x="150" y="56" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="250" y="81" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">① 取下一个 num ∈ nums</text>
  <g filter="url(#sk)">
    <path d="M 250 96 L 250 118" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: insert original -->
  <g filter="url(#sk)">
    <rect x="150" y="120" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="250" y="145" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace" filter="url(#sk)">② s.insert(num)</text>
  <g filter="url(#sk)">
    <path d="M 250 160 L 250 182" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- step 3: reverse digits -->
  <g filter="url(#sk)">
    <rect x="140" y="184" width="220" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ 反转数位</text>
  <text x="158" y="226" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">rev = 0; t = num</text>
  <text x="158" y="242" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">while t &gt; 0:</text>
  <text x="170" y="258" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">rev = rev*10 + t%10</text>
  <text x="170" y="272" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">t /= 10</text>
  <g filter="url(#sk)">
    <path d="M 250 276 L 250 300" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- right annotation for reverse -->
  <g filter="url(#sk)">
    <rect x="420" y="200" width="232" height="66" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="436" y="222" font-size="11" fill="#555" filter="url(#sk)">值域 1 ~ 10⁶：至多 7 位</text>
  <text x="436" y="240" font-size="11" fill="#555" filter="url(#sk)">rev(num) ≤ 999999，无溢出风险</text>
  <text x="436" y="258" font-size="11" fill="#555" filter="url(#sk)">单次反转耗时 O(d)，前导零自动丢</text>

  <!-- step 4: insert reverse -->
  <g filter="url(#sk)">
    <rect x="150" y="302" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="250" y="327" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace" filter="url(#sk)">④ s.insert(rev)</text>
  <g filter="url(#sk)">
    <path d="M 250 342 L 250 360" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- step 5: decision diamond -->
  <g filter="url(#sk)">
    <polygon points="250,356 362,394 250,432 138,394" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="250" y="399" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">⑤ 还有 num？</text>

  <!-- no branch -->
  <g filter="url(#sk)">
    <path d="M 362 394 L 452 394" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="405" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="454" y="372" width="150" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="529" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 s.size()</text>
  <text x="529" y="408" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">即不同整数数目 ✓</text>

  <!-- yes loop-back -->
  <g filter="url(#sk)">
    <path d="M 138 394 L 66 394 L 66 76 L 146 76" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="96" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是 ↻</text>
  <text x="76" y="240" font-size="11" fill="#999" filter="url(#sk)">循环 n 次</text>
</svg>
