<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="470" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：freq 桶随增删同步搬移</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="210" y="62" width="250" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="460" y="62" width="330" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="135" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">操作</text>
  <text x="335" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">cnt（数字→频率）</text>
  <text x="625" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24">freq（频率→个数）</text>

  <!-- 行 1: add(3) -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="150" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="210" y="100" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="100" width="330" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="135" y="125" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">add(3)</text>
  <text x="335" y="125" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{3: 1}</text>
  <text x="625" y="125" text-anchor="middle" font-size="12" fill="#2e5e24" font-family="monospace">桶1=1（桶0 无关紧要）</text>

  <!-- 行 2: add(3) -->
  <g filter="url(#sk)">
    <rect x="60" y="144" width="150" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="210" y="144" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="144" width="330" height="40" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="135" y="169" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">add(3)</text>
  <text x="335" y="169" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{3: 2}</text>
  <text x="625" y="169" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">桶1=0，桶2=1  ← 3 搬到桶2</text>

  <!-- 行 3: hasFrequency(2) -->
  <g filter="url(#sk)">
    <rect x="60" y="188" width="150" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="210" y="188" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="188" width="330" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="135" y="213" text-anchor="middle" font-size="12" fill="#2e5e24" font-family="monospace" font-weight="bold">hasFrequency(2)</text>
  <text x="335" y="213" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{3: 2}</text>
  <text x="625" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">freq[2]=1 &gt; 0 → true ✓</text>

  <!-- 行 4: deleteOne(3) -->
  <g filter="url(#sk)">
    <rect x="60" y="232" width="150" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="210" y="232" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="232" width="330" height="40" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="135" y="257" text-anchor="middle" font-size="12" fill="#7a3430" font-family="monospace">deleteOne(3)</text>
  <text x="335" y="257" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{3: 1}</text>
  <text x="625" y="257" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">桶1=1，桶2=0  ← 3 搬回桶1</text>

  <!-- 行 5: hasFrequency(2) -->
  <g filter="url(#sk)">
    <rect x="60" y="276" width="150" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="210" y="276" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="276" width="330" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="135" y="301" text-anchor="middle" font-size="12" fill="#2e5e24" font-family="monospace" font-weight="bold">hasFrequency(2)</text>
  <text x="335" y="301" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{3: 1}</text>
  <text x="625" y="301" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">freq[2]=0 → false ✗</text>

  <!-- 行 6: deleteOne(3) -->
  <g filter="url(#sk)">
    <rect x="60" y="320" width="150" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="210" y="320" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="320" width="330" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="135" y="345" text-anchor="middle" font-size="12" fill="#7a3430" font-family="monospace">deleteOne(3)</text>
  <text x="335" y="345" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{}</text>
  <text x="625" y="345" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">桶1=0（3 归零，守卫就位）</text>

  <!-- 行 7: deleteOne(3) 不存在 -->
  <g filter="url(#sk)">
    <rect x="60" y="364" width="150" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="210" y="364" width="250" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="364" width="330" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="135" y="389" text-anchor="middle" font-size="12" fill="#7a3430" font-family="monospace">deleteOne(3)</text>
  <text x="335" y="389" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">{}（old=0，不删）</text>
  <text x="625" y="389" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">两表原样，直接 return</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="60" y="416" width="730" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="425" y="434" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">每次 add / deleteOne 只动两个 freq 桶（±1），hasFrequency 一步读桶——全程无遍历</text>
  <text x="425" y="451" text-anchor="middle" font-size="10" fill="#888">对照示例 1、2：桶随 cnt 同步，查询 O(1) 出结果</text>
</svg>
