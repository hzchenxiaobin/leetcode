<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="445" fill="#fafafa"/>

  <text x="280" y="40" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">「几近缺失」= 恰好被 1 个大小为 k 的子数组覆盖</text>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums = [3, 9, 2, 1, 7]，k = 3，共 3 个窗口</text>

  <!-- W0 -->
  <text x="48" y="119" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">W0</text>
  <rect x="76" y="96" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="96" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="96" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="96" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="268" y="96" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="99" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="147" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="195" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="243" y="119" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <text x="291" y="119" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">7</text>
  <rect x="76" y="96" width="46" height="38" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="99" y="90" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">候选</text>
  <text x="330" y="119" font-size="13" fill="#446688" filter="url(#rough2)">→ 含 3、9、2</text>

  <!-- W1 -->
  <text x="48" y="185" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">W1</text>
  <rect x="76" y="162" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="124" y="162" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="162" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="162" width="46" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="268" y="162" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="99" y="185" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="147" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="195" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="243" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="291" y="185" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">7</text>
  <text x="330" y="185" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ 含 9、2、1</text>

  <!-- W2 -->
  <text x="48" y="251" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">W2</text>
  <rect x="76" y="228" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="124" y="228" width="46" height="38" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="172" y="228" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="228" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="268" y="228" width="46" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="251" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="147" y="251" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="195" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="243" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="291" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="268" y="228" width="46" height="38" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="291" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">候选</text>
  <text x="330" y="251" font-size="13" fill="#d6a040" filter="url(#rough2)">→ 含 2、1、7</text>

  <!-- 结论框 -->
  <rect x="60" y="292" width="440" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">覆盖数 cnt[x] = 含有值 x 的窗口个数</text>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">cnt[x] = 1 → 几近缺失：3 ✓、7 ✓</text>
  <text x="280" y="376" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">cnt[x] ≥ 2 → 出局：9 ✗、2 ✗、1 ✗</text>
  <text x="280" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">最大几近缺失整数 → 返回 7</text>
</svg>
