<svg xmlns="http://www.w3.org/2000/svg" width="560" height="545" viewBox="0 0 560 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="545" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：枚举对角点对，三关判定</text>
  <path d="M 170 38 Q 280 46 390 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- box A -->
  <g filter="url(#sk)">
    <rect x="130" y="44" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">全部点加入哈希集合 S；ans = −1</text>
  <path d="M 280 86 L 280 102" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- box B -->
  <g filter="url(#sk)">
    <rect x="130" y="102" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="280" y="128" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">双重循环枚举点对 (i&lt;j) 作对角线两端</text>
  <path d="M 280 144 L 280 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <path d="M 280 160 L 410 196 L 280 232 L 150 196 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">x₁ ≠ x₂ 且 y₁ ≠ y₂？</text>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#9a7a3a">（关 1 · 非退化）</text>
  <text x="418" y="192" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 280 232 L 280 248" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="290" y="245" text-anchor="start" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <path d="M 280 248 L 410 284 L 280 320 L 150 284 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">(x₁,y₂)、(x₂,y₁) 都在 S？</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#9a7a3a">（关 2 · 两角存在）</text>
  <text x="418" y="280" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 280 320 L 280 336" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="290" y="333" text-anchor="start" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>

  <!-- diamond 3 -->
  <g filter="url(#sk)">
    <path d="M 280 336 L 410 372 L 280 408 L 150 372 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">闭矩形内除四角外无点？</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#9a7a3a">（关 3 · 无空洞）</text>
  <text x="418" y="368" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 280 408 L 280 424" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="290" y="421" text-anchor="start" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>

  <!-- box C -->
  <g filter="url(#sk)">
    <rect x="130" y="424" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="280" y="449" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">ans ← max(ans, (x₂−x₁)×(y₂−y₁))</text>
  <path d="M 280 464 L 280 480" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- box D -->
  <g filter="url(#sk)">
    <rect x="130" y="480" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="280" y="505" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 ans（初值 −1 已覆盖无解）</text>

  <!-- fail collector -->
  <path d="M 410 196 L 445 196 L 445 455 L 448 455" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 410 284 L 445 284" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <path d="M 410 372 L 445 372" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="452" y="430" width="103" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="503" y="450" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 任一关不过</text>
  <text x="503" y="468" text-anchor="middle" font-size="11" fill="#b85450">→ 跳过该点对</text>
</svg>
