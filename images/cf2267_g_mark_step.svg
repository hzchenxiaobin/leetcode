<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心观察：把总花费拆成「每条路径的每一步」</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a"
        filter="url(#rough2)">一条路径的花费 = 各步 c_x 之和 ⇒ 交换求和顺序，只数「步长 x 一共被走了几次」</text>
  <path d="M 96 62 Q 400 70 704 62" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M 70 190 L 742 190" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 183 L 100 197" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 340 183 L 340 197" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 440 183 L 440 197" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 710 183 L 710 197" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="340" y="214" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">p</text>
  <text x="440" y="214" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">p + x</text>
  <text x="710" y="214" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n</text>

  <!-- 一条路径 -->
  <circle cx="100" cy="150" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="150" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="340" cy="150" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="440" cy="150" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="710" cy="150" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <path d="M 106 150 L 202 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 150 L 332 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 346 150 L 432 150" stroke="#d6a040" stroke-width="2.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 446 150 L 702 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="389" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015"
        filter="url(#rough2)">这一步长 = x，花钱 c_x</text>

  <!-- 前后缀括号 -->
  <path d="M 100 232 L 100 244 L 340 244 L 340 232" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="220" y="264" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">前缀 0 → p</text>
  <text x="220" y="282" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">共 f[p] 种走法</text>
  <path d="M 440 232 L 440 244 L 710 244 L 710 232" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="575" y="264" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">后缀 p+x → n 反转成 0 → n−x−p</text>
  <text x="575" y="282" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">共 f[n−x−p] 种走法</text>

  <!-- 公式 -->
  <rect x="56" y="298" width="688" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="400" y="324" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">Ans = Σ c_x · (f ∗ f)[n − x]　（x 取遍 m 的所有非零子掩码）</text>
  <text x="400" y="348" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">其中 (f ∗ f)[j] = Σ f[p] · f[j − p]（p 从 0 到 j），即 f 与自己的卷积</text>

  <text x="60" y="386" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">f[i] = 从 0 恰好走到 i 的路径条数（步长只能是 m 的子掩码）；步长集合在反转下不变，</text>
  <text x="60" y="408" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">所以「从 p+x 走到 n」的方案数正好等于「从 0 走到 n−x−p」的方案数。</text>
  <text x="60" y="432" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">问题归约为：求出 f 的前 n 项，再求出 f ∗ f —— 剩下的只是把子掩码 x 的贡献加起来。</text>
</svg>
