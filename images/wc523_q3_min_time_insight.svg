<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">getMinTime：让每个座位都只花 1 秒的顺序一定存在</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以第 3 排预订 A₃、B₃ 为例，先后顺序决定靠窗座是否加价</text>

  <rect x="36" y="66" width="218" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✔ 最优：先窗后中</text>
  <rect x="48" y="104" width="86" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="91" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">A₃ → 1 秒</text>
  <path d="M 136 120 L 158 120" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="104" width="86" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B₃ → 1 秒</text>
  <text x="145" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">合计 1 + 1 = 2 秒</text>

  <rect x="266" y="66" width="218" height="128" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="92" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✘ 顺手：先中后窗</text>
  <rect x="276" y="104" width="86" height="32" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B₃ → 1 秒</text>
  <path d="M 364 120 L 386 120" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="104" width="86" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="431" y="125" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">A₃ → 3 秒</text>
  <text x="375" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">合计 1 + 3 = 4 秒</text>

  <text x="260" y="234" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">第 3 排全订同理：每对「窗先中后」，四个座位都只要 1 秒</text>
  <rect x="64" y="246" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">A₃ · 1s</text>
  <path d="M 154 261 L 166 261" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="168" y="246" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B₃ · 1s</text>
  <path d="M 258 261 L 270 261" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="272" y="246" width="88" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">D₃ · 1s</text>
  <path d="M 362 261 L 374 261" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="376" y="246" width="88" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C₃ · 1s</text>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">合计 4 × 1 = 4 秒 = 座位数</text>

  <rect x="48" y="312" width="424" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">下界：任何座位预订开销 ≥ 1 秒 ⇒ 总时间 ≥ 已订座位数 k</text>
  <text x="260" y="354" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">上界：「窗先中后」的顺序让所有座位开销 = 1 秒 ⇒ 总时间 = k</text>
  <text x="260" y="376" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ getMinTime() = 已订座位数，O(1) 直接返回</text>
</svg>
