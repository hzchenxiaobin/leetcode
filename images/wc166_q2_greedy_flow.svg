<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次扫描 + 桶计数：满员即刻收割</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">对每个人 i 令 s = groupSizes[i]，整道题只需要一个 O(n) 的循环</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="180" y="58" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="78" fill="#3a4a66">i 从 0 扫描到 n − 1</text>
  </g>

  <path d="M 280 88 L 280 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="110" y="104" width="340" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="126" fill="#3a4a66">把 i 追加进桶 bucket[groupSizes[i]]</text>
  </g>

  <path d="M 280 138 L 280 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <polygon points="280,156 390,196 280,236 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="192" fill="#8a6a20" font-weight="bold">桶内已有 s 人？</text>
    <text x="280" y="210" fill="#8a6a20" font-size="9.5">s = groupSizes[i]</text>
  </g>

  <text x="166" y="188" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="394" y="188" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 170 196 L 156 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 196 L 406 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <rect x="20" y="172" width="134" height="48" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="8"/>
    <text x="87" y="192" fill="#666">桶未满</text>
    <text x="87" y="208" fill="#888">不做任何输出</text>
    <rect x="408" y="172" width="132" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="474" y="192" fill="#3a5a30">桶满 s 人</text>
    <text x="474" y="208" fill="#3a5a30">输出该桶并清空</text>
  </g>

  <path d="M 87 220 V 252 H 166" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 220 V 252 H 408" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="170" y="252" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="274" fill="#3a4a66">i ← i + 1，进入下一轮</text>
  </g>

  <path d="M 390 269 H 548 V 73 H 384" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="542" y="150" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">循环</text>

  <g filter="url(#rough2)">
    <rect x="36" y="310" width="488" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="50" y="330" font-size="10.5" fill="#8a3a36" font-weight="bold">循环不变量</text>
    <text x="50" y="350" font-size="10" fill="#444">桶内人数始终小于 s；一旦凑到 s 就立刻收割成一组并清空，绝不过夜</text>
    <text x="50" y="368" font-size="10" fill="#444">时间 O(n)（每人一次追加 + 一次比较）；空间 O(n)（桶内最多存 n 个下标）</text>
  </g>
</svg>
