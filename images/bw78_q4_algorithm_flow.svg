<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">受限 Kadane：dp0（自由段）与 dp1（至少含一个 b）</text>

  <!-- 两个状态框 -->
  <rect x="40" y="56" width="230" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold" filter="url(#rough2)">dp0：自由段</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#3a4a5a">
    <text x="56" y="104">以当前字符结尾的最大子段和</text>
    <text x="56" y="122">可不含 b（允许空段，恒 ≥ 0）</text>
    <text x="56" y="140">遇 a：dp0 += 1；遇 b：清零</text>
  </g>

  <rect x="290" y="56" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="405" y="80" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">dp1：受限段</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#6a5430">
    <text x="306" y="104">以当前字符结尾的最大子段和</text>
    <text x="306" y="122">至少含一个 b（不存在 = −∞）</text>
    <text x="306" y="140">遇 b：max(dp1−1, dp0−1) 接管</text>
  </g>

  <!-- 接管箭头 -->
  <path d="M 270 110 L 290 110" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">接入首个 b</text>

  <!-- 转移表 -->
  <rect x="50" y="170" width="460" height="120" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">单字符转移表（v = +1 / −1 / 0）</text>
  <g filter="url(#rough2)" font-size="12" fill="#444">
    <text x="70" y="220">遇 b（v=−1）：dp1 ← max(dp1−1, dp0−1)；dp0 ← 0</text>
    <text x="70" y="244">遇 a（v=+1）：dp1 ← dp1+1（若存在）；dp0 ← dp0+1</text>
    <text x="70" y="268">遇其他（v=0）：两状态原样延续（子串可包含该字符）</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#2d5a22">
    <text x="70" y="288">每步后：ans ← max(ans, dp1)（dp1 存在时）</text>
  </g>

  <!-- 直觉解读 -->
  <rect x="50" y="304" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">直觉：dp1 = 已吃进至少一个 b 的最大和；dp0 = 还没吃 b、攒着好牌</text>
  <text x="280" y="345" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">遇 b 时：要么旧受限段继续（dp1−1），要么把攒的好牌接上（dp0−1）</text>

  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">复杂度：26×25 对 × O(n) 扫描 = O(650n)</text>
</svg>
