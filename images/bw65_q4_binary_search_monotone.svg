<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="69"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单调性：能完成 k 个任务 ⇒ 必能完成 k−1 个（二分答案）</text>

  <!-- k 可行集合 -->
  <rect x="50" y="70" width="200" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">k 个任务的可行方案</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="150" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="180" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="120" cy="170" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="150" cy="170" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="180" cy="170" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="150" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k 个任务、k 个工人的一个匹配</text>

  <!-- 去掉一个 -->
  <path d="M 260 145 L 330 145" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="132" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">删掉任一任务</text>
  <text x="295" y="166" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（连同它的工人）</text>

  <!-- k-1 -->
  <rect x="340" y="70" width="200" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">k−1 个任务仍可行</text>
  <g filter="url(#rough2)">
    <circle cx="410" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="440" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="470" cy="130" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="410" cy="170" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="440" cy="170" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="440" y="212" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">删掉一个任务、一个工人、剩余药丸不变</text>

  <!-- 二分示意 -->
  <text x="320" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">可行域是前缀 [0, k*]，在 lo..hi 上二分最大可行 k</text>
  <g filter="url(#rough2)">
    <rect x="70" y="276" width="500" height="36" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="70" y="276" width="160" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="150" y="299" fill="#b85450">k = 0..k* 可行</text>
    <text x="400" y="299" fill="#4a7a3a">k &gt; k* 不可行</text>
  </g>
  <circle cx="240" cy="294" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">k*</text>
  <path d="M 240 308 Q 240 320 240 318" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="348" width="460" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">check(k) 的取法：最简单的 k 个任务 + 最强的 k 个工人（排序后切片）</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">「只做更难任务」永远不如「换成更容易任务」，故只需考察这一种取法（引理 1）</text>
</svg>
