<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">rank 表：把「字母表顺序」翻译成「名次」</text>
  <rect x="48" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="74" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">0</text>
  <rect x="108" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="134" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">1</text>
  <rect x="168" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="194" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <rect x="228" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="254" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="254" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">3</text>
  <rect x="288" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="314" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">4</text>
  <rect x="348" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="374" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">5</text>
  <rect x="408" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="434" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">6</text>
  <rect x="468" y="50" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="72" text-anchor="middle" font-size="17" fill="#33475b" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="494" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">7</text>
  <text x="280" y="116" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">order = "hlabcdefgijkmnopqrstuvwxyz"  ⇒  rank['h']=0, rank['l']=2</text>
  <rect x="70" y="140" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="166" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">"hello"</text>
  <rect x="320" y="140" width="170" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="166" text-anchor="middle" font-size="14" fill="#33475b" font-weight="bold" filter="url(#rough2)">"leetcode"</text>
  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">vs</text>
  <path d="M 145 180 L 145 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 180 L 405 208" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="210" width="440" height="40" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">首字符 h(0) &lt; l(2)  ⇒  hello 在前，有序</text>
  <rect x="60" y="262" width="440" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">一次 O(26) 建表，之后任意两个字母比大小都是 O(1)</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">整串校验只需 O(L)（L = 所有单词字符数之和）</text>
</svg>
