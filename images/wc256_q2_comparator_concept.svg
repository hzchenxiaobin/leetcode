<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：无前导零 ⇒「(长度, 字典序)」就是数值序</text>
  <path d="M 240 42 Q 440 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: why not convert to integer -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="390" height="252" rx="10" fill="#fffdf3" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="50" y="90" font-size="13" fill="#b85450" font-weight="bold">① 为什么不能转成整数？</text>
  <g filter="url(#sk)">
    <rect x="50" y="104" width="350" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="225" y="126" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-family="monospace">nums[i] 最长 100 位 → 值可达 10¹⁰⁰</text>
  <g filter="url(#sk)">
    <rect x="50" y="146" width="350" height="34" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="225" y="168" text-anchor="middle" font-size="12.5" fill="#777" font-family="monospace">long long 上限 ≈ 9.2×10¹⁸（仅 19 位）</text>
  <text x="225" y="208" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-family="monospace" font-weight="bold">stoll("…100位…") → 抛 out_of_range</text>
  <text x="225" y="230" text-anchor="middle" font-size="11" fill="#999">C++ / Java 无内置大整数，转换必炸</text>
  <g filter="url(#sk)">
    <rect x="50" y="248" width="350" height="52" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="225" y="269" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">题目要「比较大小」，从没要「算出数值」</text>
  <text x="225" y="289" text-anchor="middle" font-size="11" fill="#a08040">—— 比较两个数，不需要知道它们各是多少</text>

  <!-- right panel: two-case comparator -->
  <g filter="url(#sk)">
    <rect x="440" y="64" width="410" height="252" rx="10" fill="#f5f9fd" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="460" y="90" font-size="13" fill="#2b6e9e" font-weight="bold">② 两段式大数比较器</text>
  <g filter="url(#sk)">
    <rect x="460" y="104" width="370" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="645" y="127" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold" font-family="monospace">长度不同 → 位数多者大</text>
  <text x="645" y="149" text-anchor="middle" font-size="11.5" fill="#556" font-family="monospace">例："21"(2位) &gt; "9"(1位)；100 &gt; 99</text>
  <g filter="url(#sk)">
    <rect x="460" y="178" width="370" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="645" y="201" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold" font-family="monospace">长度相同 → 按字典序逐位比较</text>
  <text x="645" y="223" text-anchor="middle" font-size="11.5" fill="#556" font-family="monospace">例："12" &lt; "21" ⟺ 12 &lt; 21</text>
  <text x="645" y="262" text-anchor="middle" font-size="11" fill="#888">无前导零 ⇒ 长度 = 有效位数，量级由长度锁定</text>
  <g filter="url(#sk)">
    <rect x="515" y="274" width="260" height="30" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="645" y="294" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">等价排序键：(len(s), s)</text>

  <!-- conclusion banner -->
  <g filter="url(#sk)">
    <rect x="30" y="336" width="820" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="440" y="363" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">结论：以 (len(s), s) 为键排序，键序与数值序完全一致 —— 全程在字符串上比较，无需转整数</text>

  <!-- warning strip -->
  <g filter="url(#sk)">
    <rect x="30" y="396" width="820" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="440" y="417" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">⚠ 若跳过长度直接字典序："9" &gt; "21"（'9' &gt; '2'），但数值上 9 &lt; 21</text>
  <text x="440" y="436" text-anchor="middle" font-size="11" fill="#a05a5a">长度优先这步不可省 —— 示例 2 正是为此设计</text>
</svg>
