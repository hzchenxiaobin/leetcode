<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold"
        filter="url(#rough2)">示例 1 演算：nums1=[2,1,−2,5]，nums2=[3,0,−6]</text>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#888"
        filter="url(#rough2)">f[i][j] 逐行从左到右填表，答案落在右下角</text>

  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="178" y="84">j=1（3）</text>
    <text x="274" y="84">j=2（0）</text>
    <text x="370" y="84">j=3（−6）</text>
    <text x="66" y="110">i=1（2）</text>
    <text x="66" y="156">i=2（1）</text>
    <text x="66" y="202">i=3（−2）</text>
    <text x="66" y="248">i=4（5）</text>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="130" y="88" width="96" height="42" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1"/>
    <text x="178" y="114" fill="#555">6</text>
    <rect x="226" y="88" width="96" height="42" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1"/>
    <text x="274" y="114" fill="#555">6</text>
    <rect x="322" y="88" width="96" height="42" rx="5" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1"/>
    <text x="370" y="114" fill="#555">6</text>

    <rect x="130" y="134" width="96" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="178" y="160" fill="#2f4058">6</text>
    <rect x="226" y="134" width="96" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="274" y="160" fill="#2f4058">6</text>
    <rect x="322" y="134" width="96" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="370" y="160" fill="#2f4058">6</text>

    <rect x="130" y="180" width="96" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="178" y="206" fill="#2f4058">6</text>
    <rect x="226" y="180" width="96" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="274" y="206" fill="#2f4058">6</text>
    <rect x="322" y="180" width="96" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="370" y="206" fill="#8a3a36" font-weight="bold">18</text>

    <rect x="130" y="226" width="96" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="178" y="252" fill="#8a6a20">15</text>
    <rect x="226" y="226" width="96" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="274" y="252" fill="#8a6a20">15</text>
    <rect x="322" y="226" width="96" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="370" y="252" fill="#31512a" font-weight="bold">18</text>
  </g>

  <path d="M 274 176 L 322 196" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="446" y="186" width="140" height="78" rx="8" fill="#ffffff" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="456" y="206" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">f[3][3] = 6 + 12 = 18</text>
  <text x="456" y="224" font-size="9.5" fill="#555" filter="url(#rough2)">f[4][3] 取左邻 18：</text>
  <text x="456" y="240" font-size="9.5" fill="#555" filter="url(#rough2)">5 与 −6 配对只得 −30</text>
  <text x="456" y="256" font-size="9.5" fill="#555" filter="url(#rough2)">所以直接跳过 5</text>

  <rect x="60" y="292" width="480" height="150" rx="10" fill="#ffffff" stroke="#999"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="316" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">逐格填写的关键几步</text>
  <text x="78" y="340" font-size="10.5" fill="#444" filter="url(#rough2)">① f[1][1] = 2×3 = 6；同行的 6 向右“继承”，因为 0 乘任何数都是 0。</text>
  <text x="78" y="362" font-size="10.5" fill="#444" filter="url(#rough2)">② f[2][2] = max(6, 6, 6 + 1×0) = 6，仍是“2 配 3”。</text>
  <text x="78" y="384" font-size="10.5" fill="#444" filter="url(#rough2)">③ f[3][3] = max(6, 6, 6 + (−2)(−6)) = 18，负负得正让点积变大。</text>
  <text x="78" y="406" font-size="10.5" fill="#444" filter="url(#rough2)">④ f[4][1] = 5×3 = 15 超过上邻 6，于是最后一行变成 15；</text>
  <text x="78" y="428" font-size="10.5" fill="#444" filter="url(#rough2)">⑤ 但 f[4][3] 只能取到 18（左邻），答案 = 18。</text>
</svg>
