<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,3,3,2,2]，k = 2，p = 2</text>

  <!-- nums row -->
  <text x="52" y="80" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="100" y="58" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="146" y="58" width="42" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="192" y="58" width="42" height="34" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="238" y="58" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="284" y="58" width="42" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="121" y="80">2</text>
    <text x="167" y="80">3</text>
    <text x="213" y="80">3</text>
    <text x="259" y="80">2</text>
    <text x="305" y="80">2</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="121" y="104">下标 0</text>
    <text x="167" y="104">下标 1</text>
    <text x="213" y="104">下标 2</text>
    <text x="259" y="104">下标 3</text>
    <text x="305" y="104">下标 4</text>
  </g>
  <text x="356" y="80" font-size="11.5" fill="#2b6e9e">蓝 = 可被 2 整除（下标 0、3、4）</text>

  <!-- table frame -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.2" fill="none">
    <path d="M 35 110 L 662 110"/>
    <path d="M 35 140 L 662 140" stroke-width="1.6"/>
    <path d="M 35 194 L 662 194"/>
    <path d="M 35 248 L 662 248"/>
    <path d="M 35 302 L 662 302"/>
    <path d="M 35 356 L 662 356"/>
    <path d="M 35 410 L 662 410" stroke-width="1.6"/>
    <path d="M 35 110 L 35 410"/>
    <path d="M 78 110 L 78 410"/>
    <path d="M 148 110 L 148 410"/>
    <path d="M 322 110 L 322 410"/>
    <path d="M 572 110 L 572 410"/>
    <path d="M 618 110 L 618 410"/>
    <path d="M 662 110 L 662 410"/>
  </g>

  <!-- header -->
  <g font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="56" y="129">l</text>
    <text x="113" y="129">r 范围</text>
    <text x="235" y="129">触发 break？</text>
    <text x="447" y="129">本轮新建的子数组</text>
    <text x="595" y="129">新增</text>
    <text x="640" y="129">ans</text>
  </g>

  <!-- highlighted "+n" cells -->
  <g filter="url(#sk)">
    <rect x="572" y="140" width="46" height="54" fill="#e8f0fa" stroke="none" rx="3"/>
    <rect x="572" y="194" width="46" height="54" fill="#fff8e1" stroke="none" rx="3"/>
    <rect x="572" y="248" width="46" height="54" fill="#e6f4ea" stroke="none" rx="3"/>
    <rect x="572" y="302" width="46" height="54" fill="#fce4ec" stroke="none" rx="3"/>
  </g>

  <!-- row 1 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="56" y="172">0</text>
    <text x="113" y="172">0 → 3</text>
  </g>
  <text x="235" y="172" font-size="11" fill="#a04038" text-anchor="middle">r=4：第 3 个可整除 → break</text>
  <text x="447" y="172" font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">[2] [2,3] [2,3,3] [2,3,3,2]</text>
  <text x="595" y="172" font-size="12.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle">+4</text>
  <text x="640" y="172" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">4</text>

  <!-- row 2 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="56" y="226">1</text>
    <text x="113" y="226">1 → 4</text>
  </g>
  <text x="235" y="226" font-size="11" fill="#888" text-anchor="middle">未超限（恰 2 个可整除）</text>
  <text x="447" y="226" font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">[3] [3,3] [3,3,2] [3,3,2,2]</text>
  <text x="595" y="226" font-size="12.5" font-weight="bold" fill="#9a6a15" text-anchor="middle">+4</text>
  <text x="640" y="226" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">8</text>

  <!-- row 3 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="56" y="280">2</text>
    <text x="113" y="280">2 → 4</text>
  </g>
  <text x="235" y="280" font-size="11" fill="#888" text-anchor="middle">未超限</text>
  <text x="447" y="280" font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">[3,2] [3,2,2] <tspan fill="#999">[3] 已重复</tspan></text>
  <text x="595" y="280" font-size="12.5" font-weight="bold" fill="#2e6e2e" text-anchor="middle">+2</text>
  <text x="640" y="280" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">10</text>

  <!-- row 4 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="56" y="334">3</text>
    <text x="113" y="334">3 → 4</text>
  </g>
  <text x="235" y="334" font-size="11" fill="#888" text-anchor="middle">未超限</text>
  <text x="447" y="334" font-size="11.5" fill="#333" text-anchor="middle" font-family="monospace">[2,2] <tspan fill="#999">[2] 已重复</tspan></text>
  <text x="595" y="334" font-size="12.5" font-weight="bold" fill="#a04038" text-anchor="middle">+1</text>
  <text x="640" y="334" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">11</text>

  <!-- row 5 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="56" y="388">4</text>
    <text x="113" y="388">4</text>
  </g>
  <text x="235" y="388" font-size="11" fill="#888" text-anchor="middle">未超限</text>
  <text x="447" y="388" font-size="11.5" fill="#999" text-anchor="middle" font-family="monospace">—（[2] 已重复）</text>
  <text x="595" y="388" font-size="12.5" font-weight="bold" fill="#999" text-anchor="middle">+0</text>
  <text x="640" y="388" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">11</text>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="40" y="432" width="600" height="106" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">不同子数组数 = Trie 新节点数</text>
  <text x="340" y="482" text-anchor="middle" font-size="12" fill="#333">每轮只把「首次出现的内容」新建进 Trie；重复内容走到已有节点，O(1) 下行、不计数</text>
  <text x="340" y="505" text-anchor="middle" font-size="12" fill="#333">所以 [3]、[2] 虽在数组里出现多次，都只被数一次</text>
  <text x="340" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">总数 4 + 4 + 2 + 1 + 0 = 11 ✓</text>
</svg>
