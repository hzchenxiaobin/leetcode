  <text x="640" y="102" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450">b</text>
  <g filter="url(#sk)"><path d="M 620 112 L 660 76" stroke="#b85450" stroke-width="2" fill="none"/></g>
  <g filter="url(#sk)"><rect x="682" y="66" width="56" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="710" y="103" text-anchor="middle" font-size="22" font-weight="bold" fill="#a8781e">*</text>

  <text x="220" y="140" text-anchor="middle" font-size="10.5" fill="#2e6e2e">保留</text>
  <text x="290" y="140" text-anchor="middle" font-size="10.5" fill="#b85450">被 *(5) 删</text>
  <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#2e6e2e">保留</text>
  <text x="430" y="140" text-anchor="middle" font-size="10.5" fill="#b85450">被 *(4) 删</text>
  <text x="640" y="140" text-anchor="middle" font-size="10.5" fill="#b85450">被 *(7) 删</text>

  <g filter="url(#sk)"><rect x="36" y="186" width="138" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">i = 0…3</text>
  <text x="105" y="230" text-anchor="middle" font-size="11" fill="#555">c b c a</text>
  <text x="200" y="208" font-size="12.5" fill="#333">四个字母依次入各自的桶</text>
  <text x="200" y="230" font-size="11.5" fill="#777">a=[3]　b=[1]　c=[0,2]（栈内下标递增，栈顶=最右）</text>
  <g filter="url(#sk)"><rect x="632" y="208" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="655" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">3</text>
  <g filter="url(#sk)"><rect x="722" y="208" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="745" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="812" y="208" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="812" y="183" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
