  <text x="835" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">c</text>
  <path d="M 105 244 L 105 286" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)"><rect x="36" y="290" width="138" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="105" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a8781e">i = 4</text>
  <text x="105" y="334" text-anchor="middle" font-size="11" fill="#555">s[4] = '*'</text>
  <text x="200" y="312" font-size="12.5" fill="#333">最小非空桶 = a → 弹出栈顶 3</text>
  <text x="200" y="334" font-size="11.5" fill="#777">删除 a(3)，此后 a 桶为空</text>
  <text x="655" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✕ 3</text>
  <g filter="url(#sk)"><rect x="632" y="312" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="722" y="312" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="745" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="812" y="312" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="812" y="287" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="655" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">a</text>
  <text x="745" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">b</text>
  <text x="835" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">c</text>
  <path d="M 105 348 L 105 390" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)"><rect x="36" y="394" width="138" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="105" y="418" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a8781e">i = 5</text>
  <text x="105" y="438" text-anchor="middle" font-size="11" fill="#555">s[5] = '*'</text>
  <text x="200" y="416" font-size="12.5" fill="#333">最小非空桶 = b → 弹出栈顶 1</text>
  <text x="200" y="438" font-size="11.5" fill="#777">删除 b(1)，b 桶也清空</text>
  <g filter="url(#sk)"><rect x="632" y="416" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="745" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✕ 1</text>
  <g filter="url(#sk)"><rect x="722" y="416" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="812" y="416" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="812" y="391" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="655" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">a</text>
  <text x="745" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">b</text>
  <text x="835" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">c</text>
  <path d="M 105 452 L 105 494" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)"><rect x="36" y="498" width="138" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="522" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">i = 6</text>
  <text x="105" y="542" text-anchor="middle" font-size="11" fill="#555">s[6] = 'b'</text>
  <text x="200" y="520" font-size="12.5" fill="#333">字母 b → 下标 6 压入 b 桶</text>
  <text x="200" y="542" font-size="11.5" fill="#777">b(6) 晚于前两个 *，仍可被更右的 * 删除</text>
  <g filter="url(#sk)"><rect x="632" y="520" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="722" y="520" width="46" height="22" rx="3" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="745" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">6</text>
  <g filter="url(#sk)"><rect x="812" y="520" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="812" y="495" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="655" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">a</text>
  <text x="745" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">b</text>
  <text x="835" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">c</text>
  <path d="M 105 556 L 105 598" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)"><rect x="36" y="602" width="138" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="105" y="626" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a8781e">i = 7</text>
  <text x="105" y="646" text-anchor="middle" font-size="11" fill="#555">s[7] = '*'</text>
  <text x="200" y="624" font-size="12.5" fill="#333">最小非空桶 = b → 弹出栈顶 6</text>
  <text x="200" y="646" font-size="11.5" fill="#777">删除 b(6)（a 桶已空，探测时跳过它）</text>
  <g filter="url(#sk)"><rect x="632" y="624" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="745" y="594" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✕ 6</text>
  <g filter="url(#sk)"><rect x="722" y="624" width="46" height="22" rx="3" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk)"><rect x="812" y="624" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="639" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="812" y="599" width="46" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="835" y="614" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="655" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">a</text>
  <text x="745" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">b</text>
  <text x="835" y="664" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">c</text>
  <path d="M 105 660 L 105 702" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)"><rect x="36" y="706" width="138" height="54" rx="9" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="105" y="730" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">汇总</text>
  <text x="105" y="750" text-anchor="middle" font-size="11" fill="#555">拼接存活字符</text>
  <text x="200" y="728" font-size="12.5" fill="#333">存活只剩 c(0)、c(2)，按原下标序拼接</text>
  <text x="200" y="750" font-size="11.5" fill="#777">所有 * 连同被删字符一并消失</text>
  <g filter="url(#sk)"><rect x="660" y="712" width="150" height="48" rx="9" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="735" y="743" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e6e2e">答案 "cc"</text>
</svg>
