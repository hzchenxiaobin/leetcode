<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[1,1],[3,4]]，按值从大到小填 dp</text>

  <!-- grid with dp values -->
  <text x="130" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp 值（以该格为起点的路径数）</text>

  <rect x="62" y="72" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="91" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="91" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp=3</text>
  <rect x="124" y="72" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="153" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="153" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp=2</text>
  <rect x="62" y="134" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="91" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="91" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp=2</text>
  <rect x="124" y="134" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="153" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="153" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp=1</text>

  <!-- equal note -->
  <text x="122" y="216" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">上方两格值相等（都是 1），彼此无边</text>
  <text x="122" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(0,0) 只能先走向 (1,0)=3</text>

  <!-- steps column -->
  <text x="390" y="58" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按值从大到小逐格计算</text>

  <rect x="255" y="70" width="268" height="30" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="389" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① dp(1,1) = 1（4 是最大值，无出边）</text>

  <rect x="255" y="106" width="268" height="30" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="389" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② dp(1,0) = 1 + dp(1,1) = 2</text>

  <rect x="255" y="142" width="268" height="30" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="389" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ dp(0,1) = 1 + dp(1,1) = 2</text>

  <rect x="255" y="178" width="268" height="30" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="389" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ dp(0,0) = 1 + dp(1,0) = 3</text>

  <rect x="255" y="214" width="268" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="389" y="235" text-anchor="middle" font-size="11.5" fill="#2a5a1a" font-weight="bold" filter="url(#rough2)">ans = 1+2+2+3 = 8 ✓</text>

  <!-- path breakdown -->
  <rect x="48" y="264" width="464" height="148" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">路径按长度分解（与 dp 求和口径一致）</text>

  <rect x="80" y="306" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="140" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">长度 1：4 条</text>
  <rect x="220" y="306" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#2a5a1a" filter="url(#rough2)">长度 2：3 条</text>
  <rect x="360" y="306" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#a08030" filter="url(#rough2)">长度 3：1 条</text>

  <text x="140" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[1] [1] [3] [4]</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[1→3] [1→4] [3→4]</text>
  <text x="420" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">[1→3→4]</text>

  <text x="280" y="394" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">4 + 3 + 1 = 8，每个 dp 里的「1」正是所有单格路径的来源</text>
</svg>
