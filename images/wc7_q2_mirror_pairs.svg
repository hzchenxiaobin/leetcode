<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">回文的镜像结构：除中心外，每个字符都必须成对</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位置 i 与位置 L−1−i 同字符 ⇒ 频次为奇数的字符至多一个</text>

  <g filter="url(#rough2)" font-size="17" font-weight="bold" text-anchor="middle">
    <rect x="108" y="78" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="130" y="105" fill="#3a5a30">d</text>
    <rect x="158" y="78" width="44" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="180" y="105" fill="#3a4a66">c</text>
    <rect x="208" y="78" width="44" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="230" y="105" fill="#8a6a20">c</text>
    <rect x="258" y="78" width="44" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="280" y="105" fill="#8a3a36">a</text>
    <rect x="308" y="78" width="44" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="330" y="105" fill="#8a6a20">c</text>
    <rect x="358" y="78" width="44" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="380" y="105" fill="#3a4a66">c</text>
    <rect x="408" y="78" width="44" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="430" y="105" fill="#3a5a30">d</text>
  </g>

  <g filter="url(#rough2)" font-size="8" fill="#aaa" text-anchor="middle">
    <text x="130" y="120">0</text><text x="180" y="120">1</text><text x="230" y="120">2</text>
    <text x="330" y="120">4</text><text x="380" y="120">5</text><text x="430" y="120">6</text>
  </g>
  <text x="280" y="120" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">中心</text>

  <g filter="url(#rough2)" fill="none" stroke-width="1.8">
    <path d="M 130 127 C 130 181, 430 181, 430 127" stroke="#4a7a3a"/>
    <path d="M 180 127 C 180 171, 380 171, 380 127" stroke="#446688"/>
    <path d="M 230 127 C 230 161, 330 161, 330 127" stroke="#d6a040"/>
  </g>

  <text x="280" y="186" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">同色弧线连接镜像位置 i 与 6−i：必须同字符；只有正中心能落单</text>

  <rect x="54" y="200" width="452" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="222" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">计数公式（每步 O(1)）</text>
  <text x="70" y="246" font-size="12" fill="#444" filter="url(#rough2)">ans = 2 × Σ (cnt[c] ÷ 2 向下取整) + (有落单字符 ? 1 : 0)</text>
  <text x="70" y="266" font-size="9.5" fill="#777" filter="url(#rough2)">每一对贡献左右各一个位置；中心只能坐 1 个字符，多余的落单字符只能丢弃。</text>

  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">例 s = "abccccdd"：a:1 b:1 c:4 d:2，偶数部分 4 + 2 = 6，还有落单 → 6 + 1 = 7</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">例 s = "abcd"：四个字符各 1 个，偶数部分 0，只能取 1 个坐中心 → 答案 1，不能全放</text>
</svg>
