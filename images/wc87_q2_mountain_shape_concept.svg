<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">山脉 = 一段严格上升 + 一段严格下降</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 50 252 L 430 252" stroke="#9aa3ad" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 80 250 L 140 224 M 140 224 L 200 172 M 200 172 L 260 94" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 260 94 L 320 146 M 320 146 L 380 198" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><circle cx="80" cy="250" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk2)"><circle cx="140" cy="224" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk2)"><circle cx="200" cy="172" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk2)"><circle cx="260" cy="94" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk2)"><circle cx="320" cy="146" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk2)"><circle cx="380" cy="198" r="4.5" fill="#fff" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <text x="170" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">严格上升 up = 3</text>
  <text x="355" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">严格下降 down = 2</text>
  <text x="260" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">峰顶 i</text>
  <path d="M 260 82 L 260 88" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="435.0" y="67.0" width="200" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="535" y="96.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">长度 = up + down + 1</text>
  <text x="535" y="112.3" text-anchor="middle" font-size="12" fill="#2b4a6e">= 3 + 2 + 1 = 6</text>
  <g filter="url(#sk2)"><rect x="435.0" y="167.0" width="200" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="535" y="193.6" text-anchor="middle" font-size="11.5" fill="#2b4a6e">① 至少 1 步严格上升</text>
  <text x="535" y="209.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">且至少 1 步严格下降</text>
  <text x="535" y="224.6" text-anchor="middle" font-size="11.5" fill="#2b4a6e">② 峰顶不能在端点</text>
  <g filter="url(#sk2)"><rect x="435.0" y="279.0" width="200" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="535" y="306.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">③ 出现相等相邻值，</text>
  <text x="535" y="321.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">山脉在此断开</text>
  <g filter="url(#sk2)"><rect x="60.0" y="355.0" width="540" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="379.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">计「步数」而不是「点数」：up、down 是相邻比较的代价</text>
</svg>
