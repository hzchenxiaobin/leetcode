<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 5, 233, 7]，n = 4</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">格中填 dp[i][j]（当前玩家相对对手的最大分差），按长度 1 → 2 → 3 → 4 依次求出</text>

  <!-- 表头 -->
  <text x="104" y="72" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">i \ j</text>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="150" y="72" filter="url(#rough2)">0</text>
    <text x="222" y="72" filter="url(#rough2)">1</text>
    <text x="294" y="72" filter="url(#rough2)">2</text>
    <text x="366" y="72" filter="url(#rough2)">3</text>
  </g>
  <g font-size="10" text-anchor="end" fill="#888">
    <text x="104" y="104" filter="url(#rough2)">0</text>
    <text x="104" y="150" filter="url(#rough2)">1</text>
    <text x="104" y="196" filter="url(#rough2)">2</text>
    <text x="104" y="242" filter="url(#rough2)">3</text>
  </g>

  <!-- 下三角：非法区间 -->
  <g fill="#f2f2f2" stroke="#ddd" stroke-width="1">
    <rect x="118" y="126" width="64" height="38" rx="4" filter="url(#rough2)"/>
    <rect x="118" y="172" width="64" height="38" rx="4" filter="url(#rough2)"/>
    <rect x="118" y="218" width="64" height="38" rx="4" filter="url(#rough2)"/>
    <rect x="190" y="172" width="64" height="38" rx="4" filter="url(#rough2)"/>
    <rect x="190" y="218" width="64" height="38" rx="4" filter="url(#rough2)"/>
    <rect x="262" y="218" width="64" height="38" rx="4" filter="url(#rough2)"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#bbb">
    <text x="150" y="150" filter="url(#rough2)">·</text>
    <text x="150" y="196" filter="url(#rough2)">·</text>
    <text x="150" y="242" filter="url(#rough2)">·</text>
    <text x="222" y="196" filter="url(#rough2)">·</text>
    <text x="222" y="242" filter="url(#rough2)">·</text>
    <text x="294" y="242" filter="url(#rough2)">·</text>
  </g>

  <!-- 长度 1 -->
  <g font-size="14" text-anchor="middle">
    <rect x="118" y="80" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="105" fill="#3a4a66" filter="url(#rough2)">1</text>
    <rect x="190" y="126" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="222" y="151" fill="#3a4a66" filter="url(#rough2)">5</text>
    <rect x="262" y="172" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="294" y="197" fill="#3a4a66" filter="url(#rough2)">233</text>
    <rect x="334" y="218" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="366" y="243" fill="#3a4a66" filter="url(#rough2)">7</text>

    <!-- 长度 2 -->
    <rect x="190" y="80" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="222" y="105" fill="#3a5a30" filter="url(#rough2)">4</text>
    <rect x="262" y="126" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="294" y="151" fill="#3a5a30" filter="url(#rough2)">228</text>
    <rect x="334" y="172" width="64" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="366" y="197" fill="#3a5a30" filter="url(#rough2)">226</text>

    <!-- 长度 3 -->
    <rect x="262" y="80" width="64" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="294" y="105" fill="#8a6a20" filter="url(#rough2)">229</text>
    <rect x="334" y="126" width="64" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="366" y="151" fill="#b85450" filter="url(#rough2)">−221</text>

    <!-- 长度 4：答案 -->
    <rect x="334" y="80" width="64" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="366" y="105" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">222</text>
  </g>

  <text x="412" y="94" font-size="10" fill="#8a3a36" filter="url(#rough2)">答案格 dp[0][3]</text>
  <text x="412" y="110" font-size="9.5" fill="#999" filter="url(#rough2)">≥ 0 即玩家 1 不输</text>
  <path d="M 408 100 L 400 100" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 图例 -->
  <g>
    <rect x="60" y="258" width="14" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="80" y="269" font-size="10" fill="#555" filter="url(#rough2)">长度 1</text>
    <rect x="170" y="258" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="190" y="269" font-size="10" fill="#555" filter="url(#rough2)">长度 2</text>
    <rect x="280" y="258" width="14" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="300" y="269" font-size="10" fill="#555" filter="url(#rough2)">长度 3</text>
    <rect x="390" y="258" width="14" height="12" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="410" y="269" font-size="10" fill="#555" filter="url(#rough2)">长度 4</text>
  </g>
  <text x="60" y="286" font-size="9.5" fill="#999" filter="url(#rough2)">灰色格 i &gt; j 表示空区间，不合法</text>

  <!-- 转移推导 -->
  <rect x="48" y="294" width="464" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">dp[0][3] = max( 1 − dp[1][3], 7 − dp[0][2] )</text>
  <text x="280" y="331" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">= max( 1 − (−221), 7 − 229 ) = max( 222, −222 ) = 222</text>

  <!-- 结论 -->
  <rect x="48" y="350" width="464" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">总分 246 ⇒ 玩家 1 得 (246 + 222) / 2 = 234，玩家 2 得 12，返回 true</text>
</svg>
