<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 466" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="466" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 2, 3, 4, 2]</text>
  <path d="M 140 36 Q 310 42 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- part 1: nums row -->
  <text x="30" y="64" font-size="12.5" font-weight="bold" fill="#2e6e2e">① 从右向左预算 suf[i]（nums[i..n−1] 的不同元素数）</text>
  <text x="110" y="100" text-anchor="end" font-size="12" fill="#333">nums</text>
  <g filter="url(#rough2)">
    <rect x="120" y="78" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="174" y="78" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="228" y="78" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="282" y="78" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="336" y="78" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="143" y="101" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="197" y="101" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="251" y="101" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="305" y="101" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="359" y="101" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="251" y="128" text-anchor="middle" font-size="10" fill="#999">下标 i = 0 … 4（橙框 = 与左侧重复）</text>

  <!-- part 1: suf row -->
  <text x="110" y="172" text-anchor="end" font-size="12" fill="#333">suf</text>
  <g filter="url(#rough2)">
    <rect x="120" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="174" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="228" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="282" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="336" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="390" y="150" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="388" y="148" width="50" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4"/>
  </g>
  <text x="143" y="173" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="197" y="173" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="251" y="173" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="305" y="173" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="359" y="173" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="413" y="173" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <text x="413" y="144" text-anchor="middle" font-size="10" fill="#b85450">空后缀 ⇒ 0</text>
  <text x="278" y="202" text-anchor="middle" font-size="10" fill="#999">下标 i = 0 … 5（i = 5 为哨兵）</text>

  <!-- scan direction -->
  <path d="M 436 216 L 130 216" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="283" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a">从右向左：新值首次进后缀才 +1</text>

  <!-- part 2: diff table -->
  <text x="30" y="252" font-size="12.5" font-weight="bold" fill="#446688">② 从左向右维护 pre，写出 diff[i]</text>

  <rect x="121" y="341" width="378" height="24" fill="#fff8e1" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="262" width="380" height="156" rx="3" fill="none" stroke="#446688" stroke-width="1.4"/>
    <path d="M 120 288 L 500 288" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 120 314 L 500 314" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 120 340 L 500 340" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 120 366 L 500 366" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 120 392 L 500 392" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 180 262 L 180 418" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 240 262 L 240 418" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 320 262 L 320 418" stroke="#b0bccb" stroke-width="1" fill="none"/>
    <path d="M 410 262 L 410 418" stroke="#b0bccb" stroke-width="1" fill="none"/>
  </g>

  <text x="150" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">i</text>
  <text x="210" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">nums[i]</text>
  <text x="280" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">pre</text>
  <text x="365" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">suf[i+1]</text>
  <text x="455" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">diff[i]</text>

  <text x="150" y="305" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="210" y="305" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="280" y="305" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="365" y="305" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="455" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">−2</text>

  <text x="150" y="331" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="210" y="331" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="280" y="331" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="365" y="331" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="455" y="331" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">−1</text>

  <text x="150" y="357" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="210" y="357" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="280" y="357" text-anchor="middle" font-size="10" fill="#333">2（3 重复）</text>
  <text x="365" y="357" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <ellipse cx="455" cy="353" rx="13" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">0</text>

  <text x="150" y="383" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="210" y="383" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="280" y="383" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="365" y="383" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="455" y="383" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">2</text>

  <text x="150" y="409" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <text x="210" y="409" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="280" y="409" text-anchor="middle" font-size="10" fill="#333">3（2 重复）</text>
  <text x="365" y="409" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="455" y="409" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">3</text>

  <text x="310" y="436" text-anchor="middle" font-size="11.5" fill="#7a5415">i=2：nums[2]=3 已在前缀 {3,2} 中 ⇒ pre 不增，diff[2] = 2 − 2 = 0</text>
  <text x="310" y="456" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">diff = [−2, −1, 0, 2, 3] ✓</text>
</svg>
