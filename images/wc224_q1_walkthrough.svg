<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="345" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：一遍扫描 (maxLen, count) 逐步状态</text>
  <text x="620" y="54" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">橙色行：发现更大值 → 重置；绿色行：并列最大 → 计数</text>

  <!-- 表头 -->
  <rect x="70" y="62" width="550" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">步骤</text>
  <text x="176" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">矩形 [l, w]</text>
  <text x="272" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">k = min(l,w)</text>
  <text x="403" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">判断</text>
  <text x="521" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">maxLen</text>
  <text x="587" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">count</text>

  <!-- 行：初始 -->
  <rect x="70" y="94" width="550" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="121" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">初始</text>
  <text x="176" y="121" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="272" y="121" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="403" y="121" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="521" y="121" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="587" y="121" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行①：[5,8] -->
  <rect x="70" y="138" width="550" height="44" fill="#fff8e1" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="165" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">①</text>
  <text x="176" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[5, 8]</text>
  <text x="272" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="403" y="165" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">5 &gt; 0 → 更新</text>
  <text x="521" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="587" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 行②：[3,9] -->
  <rect x="70" y="182" width="550" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="209" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">②</text>
  <text x="176" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[3, 9]</text>
  <text x="272" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="403" y="209" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">3 &lt; 5 → 跳过</text>
  <text x="521" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="587" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行③：[5,12] -->
  <rect x="70" y="226" width="550" height="44" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="253" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">③</text>
  <text x="176" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[5, 12]</text>
  <text x="272" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="403" y="253" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5 == 5 → count++</text>
  <text x="521" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="587" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">2</text>

  <!-- 行④：[16,5] -->
  <rect x="70" y="270" width="550" height="44" fill="#e6f4ea" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="297" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">④</text>
  <text x="176" y="297" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[16, 5]</text>
  <text x="272" y="297" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="403" y="297" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5 == 5 → count++</text>
  <text x="521" y="297" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="587" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">3</text>

  <!-- 竖分隔线 -->
  <path d="M126,62 L126,314" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M226,62 L226,314" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M318,62 L318,314" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M488,62 L488,314" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M554,62 L554,314" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 结果横幅 -->
  <rect x="70" y="344" width="550" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">遍历结束：maxLen = 5，count = 3</text>
  <text x="345" y="388" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">能切出边长 5 正方形的矩形有 3 个 → 返回 3 ✓</text>

  <!-- 示例 2 验算注记 -->
  <rect x="70" y="416" width="550" height="44" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="345" y="434" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2 验算：[[2,3],[3,7],[4,3],[3,7]] → k 序列 [2, 3, 3, 3]</text>
  <text x="345" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">步骤② k = 3 &gt; maxLen = 2 → 重置 count = 1；③④ count++ → 返回 3 ✓</text>
</svg>
