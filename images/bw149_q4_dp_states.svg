<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态设计：只记“当前段字符 + 段长（封顶 3）”</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">段长 &lt; 3 时不能换字符；只有段长达到 3，才允许开新段</text>

  <rect x="60" y="86" width="110" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">段长 = 1</text>
  <text x="115" y="126" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">字符 c</text>

  <rect x="255" y="86" width="110" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">段长 = 2</text>
  <text x="310" y="126" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">字符 c</text>

  <rect x="450" y="86" width="120" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="12" filter="url(#rough2)"/>
  <text x="510" y="108" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">段长 ≥ 3</text>
  <text x="510" y="126" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">字符 c（合法收尾态）</text>

  <path d="M 170 112 L 251 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="210" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">放 c</text>
  <path d="M 365 112 L 446 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="405" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">放 c</text>
  <path d="M 510 86 C 470 46 430 46 400 74" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="60" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">放 c（继续延长，段长仍记 3）</text>

  <path d="M 510 140 C 510 200 230 200 140 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">放宽字符 c′ ≠ c（开新段，段长重置为 1）</text>

  <path d="M 20 112 L 56 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="24" y="100" font-size="9" fill="#666" filter="url(#rough2)">起</text>

  <rect x="40" y="222" width="250" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="242" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">前缀已经填过，代价是“沉没成本”</text>
  <text x="54" y="260" font-size="10" fill="#555" filter="url(#rough2)">f[i][c][t]：从位置 i 填到末尾的最小代价，</text>
  <text x="54" y="278" font-size="10" fill="#555" filter="url(#rough2)">已知位置 i 之前最后一段是“字符 c、长度 t”。</text>

  <rect x="330" y="222" width="250" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="242" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">收尾条件</text>
  <text x="344" y="260" font-size="10" fill="#555" filter="url(#rough2)">f[n][c][3] = 0，f[n][c][1] = f[n][c][2] = ∞：</text>
  <text x="344" y="278" font-size="10" fill="#555" filter="url(#rough2)">全串填完后最后一段必须 ≥ 3。</text>

  <rect x="40" y="306" width="540" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="326" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">为什么状态里不用记更长的段长？因为“≥ 3”与“= 5”对后续决策没有任何区别：都能自由换字符，</text>
  <text x="54" y="344" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">也都能继续延长同一字符。把段长封顶为 3，状态数就从 O(n) 压到常数。</text>
  <text x="54" y="358" font-size="10" fill="#888" filter="url(#rough2)">代价：把一个字符改成 c 需要 |s[i] − c| 次操作（相邻字母移动一次算 1 次）。</text>
</svg>
