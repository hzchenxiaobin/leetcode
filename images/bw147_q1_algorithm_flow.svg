<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="392" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：切分 → 两次查找 → 比较先后顺序</text>
  <text filter="url(#rough2)" x="290" y="48" text-anchor="middle" font-size="11" fill="#888">唯一的坑：right 必须从 left 结束之后开始找，不能从头找</text>

  <rect x="196" y="66" width="188" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">定位 '*' 并切成两段</text>
  <text filter="url(#rough2)" x="290" y="100" text-anchor="middle" font-size="10.5" fill="#555">left = p[0..star)，right = p(star..]</text>

  <path d="M 290 108 L 290 138" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="142" width="188" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="160" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">i = s.find(left)</text>
  <text filter="url(#rough2)" x="290" y="176" text-anchor="middle" font-size="10.5" fill="#555">left 的最左出现位置</text>

  <path d="M 384 163 L 428 163" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="432" y="142" width="126" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="495" y="160" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">i 不存在</text>
  <text filter="url(#rough2)" x="495" y="176" text-anchor="middle" font-size="10.5" fill="#555">返回 false</text>

  <path d="M 290 184 L 290 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="176" y="218" width="228" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="238" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">j = s.find(right, i + |left|)</text>
  <text filter="url(#rough2)" x="290" y="255" text-anchor="middle" font-size="10.5" fill="#555">从 left 结束位置起找 right</text>

  <path d="M 404 241 L 448 241" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="452" y="220" width="112" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="508" y="238" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">j 不存在</text>
  <text filter="url(#rough2)" x="508" y="254" text-anchor="middle" font-size="10.5" fill="#555">返回 false</text>

  <path d="M 290 264 L 290 294" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="196" y="298" width="188" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="290" y="318" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">存在这样的 (i, j)</text>
  <text filter="url(#rough2)" x="290" y="334" text-anchor="middle" font-size="10.5" fill="#555">返回 true</text>

  <text filter="url(#rough2)" x="24" y="330" font-size="10.5" fill="#888">left 空串时</text>
  <text filter="url(#rough2)" x="24" y="346" font-size="10.5" fill="#888">i = 0，等价于</text>
  <text filter="url(#rough2)" x="24" y="362" font-size="10.5" fill="#888">只看 right 是否存在</text>

  <text filter="url(#rough2)" x="474" y="330" font-size="10.5" fill="#888">right 空串时</text>
  <text filter="url(#rough2)" x="474" y="346" font-size="10.5" fill="#888">find 返回起点</text>
  <text filter="url(#rough2)" x="474" y="362" font-size="10.5" fill="#888">必然成功</text>

  <text filter="url(#rough2)" x="290" y="378" text-anchor="middle" font-size="10" fill="#999">两次 find 都是线性扫描，总复杂度 O(|s| + |p|)</text>
</svg>
