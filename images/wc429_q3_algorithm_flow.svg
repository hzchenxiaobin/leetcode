<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 648"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="648" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：扫描取段 → 二分答案 → 双分支判定</text>

  <!-- 开始 -->
  <rect x="205" y="32" width="150" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 s, numOps</text>
  <path d="M280,66 L280,80" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描取段 -->
  <rect x="170" y="84" width="220" height="36" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">一遍扫描：段长 L1..Lk 与 maxL</text>
  <path d="M280,120 L280,134" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分初始化 -->
  <rect x="170" y="138" width="220" height="36" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二分：lo = 1, hi = maxL</text>
  <text x="402" y="190" font-size="10" fill="#666" filter="url(#rough2)">hi = 初始最长段（0 刀即可行）</text>
  <path d="M280,174 L280,190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：mid=1? -->
  <polygon points="280,194 370,242 280,290 190,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">mid = 1 ?</text>

  <!-- 左分支：交替判定 -->
  <path d="M190,242 L164,242" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="234" text-anchor="middle" font-size="11" fill="#7a6020" filter="url(#rough2)">是</text>
  <rect x="20" y="214" width="140" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="238" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">交替判定</text>
  <text x="90" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min(d, n−d) ≤ numOps</text>
  <text x="90" y="272" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">d = 与 0101… 的距离</text>

  <!-- 右分支：公式判定 -->
  <path d="M370,242 L391,242" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="383" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="395" y="214" width="132" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="238" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">公式判定</text>
  <text x="461" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Σ ⌊L/(m+1)⌋ ≤ numOps</text>
  <text x="461" y="272" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">逐段独立求和</text>

  <!-- 汇入 可行？ -->
  <path d="M90,278 L90,300 L280,300" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M461,278 L461,300 L280,300" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M280,300 L280,326" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：可行？ -->
  <polygon points="280,330 360,375 280,420 200,375" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">可行？</text>

  <!-- 是：hi = mid -->
  <path d="M280,420 L280,438" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="433" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="200" y="442" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">hi = mid</text>

  <!-- 否：lo = mid + 1 -->
  <path d="M200,375 L154,375" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="367" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="20" y="358" width="130" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="380" text-anchor="middle" font-size="12.5" fill="#7a3a34" filter="url(#rough2)">lo = mid + 1</text>

  <!-- 汇入 lo<hi? -->
  <path d="M280,476 L280,501" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M85,392 L85,540 L204,540" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：lo<hi? -->
  <polygon points="280,505 350,540 280,575 210,540" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="545" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">lo &lt; hi ?</text>

  <!-- 是：回到二分 -->
  <path d="M350,540 L548,540 L548,154 L396,154" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="532" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <text x="400" y="532" font-size="10.5" fill="#666" filter="url(#rough2)">继续二分</text>

  <!-- 否：输出 -->
  <path d="M280,575 L280,590" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="586" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="332" y="586" font-size="10.5" fill="#666" filter="url(#rough2)">lo = hi</text>
  <rect x="200" y="594" width="160" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="616" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">输出 lo</text>
</svg>
