<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="121" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：切 与 不切</text>
  <path d="M 250 34 Q 320 40 390 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 示例 1 面板 -->
  <g filter="url(#sk)">
    <rect x="30" y="46" width="580" height="152" rx="10" fill="#fffdf3" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1：n = 6，m = 5，k = 5（切超长的 n）</text>
  <g filter="url(#sk)">
    <rect x="482" y="56" width="118" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="541" y="71" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">成本 1×5 = 5</text>

  <g filter="url(#sk)">
    <rect x="80" y="80" width="270" height="26" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="370" y="80" width="180" height="26" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="215" y="97" text-anchor="middle" font-size="12" fill="#8a6a2a">n = 6</text>
  <text x="460" y="97" text-anchor="middle" font-size="12" fill="#8a6a2a">m = 5</text>
  <path d="M 125 76 l 4 8 l -6 8 l 5 8" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>

  <path d="M 102 108 L 102 116" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 237 108 L 237 116" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 460 108 L 460 116" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="80" y="122" width="45" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="125" y="122" width="225" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="370" y="122" width="180" height="22" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="102" y="137" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="237" y="137" text-anchor="middle" font-size="11" fill="#2b5a88" font-weight="bold">5</text>
  <text x="460" y="137" text-anchor="middle" font-size="11" fill="#8a6a2a" font-weight="bold">5</text>

  <path d="M 102 146 L 102 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 237 146 L 237 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 460 146 L 460 154" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="80" y="158" width="60" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="175" y="158" width="175" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="370" y="158" width="180" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="95" cy="184" r="5" fill="#4a4a4a"/>
    <circle cx="125" cy="184" r="5" fill="#4a4a4a"/>
    <circle cx="190" cy="184" r="5" fill="#4a4a4a"/>
    <circle cx="335" cy="184" r="5" fill="#4a4a4a"/>
    <circle cx="385" cy="184" r="5" fill="#4a4a4a"/>
    <circle cx="535" cy="184" r="5" fill="#4a4a4a"/>
  </g>
  <text x="110" y="174" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="262" y="174" text-anchor="middle" font-size="12" fill="#2b5a88" font-weight="bold">5</text>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#8a6a2a" font-weight="bold">5</text>
  <text x="66" y="174" text-anchor="end" font-size="11" fill="#888">装车</text>

  <!-- 示例 2 面板 -->
  <g filter="url(#sk)">
    <rect x="30" y="212" width="580" height="134" rx="10" fill="#fffdf3" stroke="#cfcfcf" stroke-width="1.2"/>
  </g>
  <text x="320" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2：n = 4，m = 4，k = 6（都 ≤ k，不切）</text>

  <g filter="url(#sk)">
    <rect x="120" y="246" width="180" height="26" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="330" y="246" width="180" height="26" rx="4" fill="#fff3dd" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="210" y="263" text-anchor="middle" font-size="12" fill="#8a6a2a">n = 4</text>
  <text x="420" y="263" text-anchor="middle" font-size="12" fill="#8a6a2a">m = 4</text>

  <path d="M 210 274 L 210 284" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 420 274 L 420 284" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="290" width="180" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="330" y="290" width="180" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="525" y="290" width="75" height="24" rx="4" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="135" cy="316" r="5" fill="#4a4a4a"/>
    <circle cx="285" cy="316" r="5" fill="#4a4a4a"/>
    <circle cx="345" cy="316" r="5" fill="#4a4a4a"/>
    <circle cx="495" cy="316" r="5" fill="#4a4a4a"/>
    <circle cx="540" cy="316" r="5" fill="#4a4a4a"/>
    <circle cx="585" cy="316" r="5" fill="#4a4a4a"/>
  </g>
  <text x="210" y="306" text-anchor="middle" font-size="12" fill="#8a6a2a" font-weight="bold">4</text>
  <text x="420" y="306" text-anchor="middle" font-size="12" fill="#8a6a2a" font-weight="bold">4</text>
  <text x="562" y="306" text-anchor="middle" font-size="12" fill="#999">空</text>

  <g filter="url(#sk)">
    <rect x="235" y="324" width="170" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">成本 = 0（无需切割）</text>
</svg>
