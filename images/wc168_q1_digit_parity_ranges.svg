<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="410" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">偶数位数 = 三段数量级区间</text>
  <text x="330" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">位数 d 由数量级唯一确定：10^(d−1) ≤ x &lt; 10^d，因此「位数奇偶」就是「x 落在哪一段」</text>

  <text x="596" y="104" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">输入上界 nums[i] ≤ 10⁵</text>
  <path d="M 603 108 L 603 214" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="120" width="88" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="135" y="120" width="88" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <rect x="230" y="120" width="88" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="325" y="120" width="88" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <rect x="420" y="120" width="88" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="515" y="120" width="88" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#888">
    <text x="84" y="142">d = 1</text><text x="179" y="142">d = 2</text><text x="274" y="142">d = 3</text>
    <text x="369" y="142">d = 4</text><text x="464" y="142">d = 5</text><text x="559" y="142">d = 6</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-weight="bold">
    <text x="84" y="167" font-size="11" fill="#3a4a66">1 – 9</text>
    <text x="179" y="167" font-size="11" fill="#3a5a30">10 – 99</text>
    <text x="274" y="167" font-size="10" fill="#3a4a66">100 – 999</text>
    <text x="369" y="167" font-size="10" fill="#3a5a30">1000 – 9999</text>
    <text x="464" y="167" font-size="9" fill="#3a4a66">10000 – 99999</text>
    <text x="559" y="167" font-size="10" fill="#8a6a20">100000</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <text x="84" y="204" fill="#7a8ba8">奇数 ✗</text>
    <text x="179" y="204" fill="#4a7a3a">偶数 ✓</text>
    <text x="274" y="204" fill="#7a8ba8">奇数 ✗</text>
    <text x="369" y="204" fill="#4a7a3a">偶数 ✓</text>
    <text x="464" y="204" fill="#7a8ba8">奇数 ✗</text>
    <text x="559" y="204" fill="#8a6a20">偶数 ✓</text>
  </g>

  <path d="M 179 210 L 179 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 369 210 L 369 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 559 210 L 559 250" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="104" y="252" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="294" y="252" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="484" y="252" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="179" y="276" font-size="11" fill="#3a5a30" font-weight="bold">10 ≤ x &lt; 100</text>
    <text x="179" y="298" font-size="9.5" fill="#666">2 位 → 计数 +1</text>
    <text x="369" y="276" font-size="11" fill="#3a5a30" font-weight="bold">1000 ≤ x &lt; 10000</text>
    <text x="369" y="298" font-size="9.5" fill="#666">4 位 → 计数 +1</text>
    <text x="559" y="276" font-size="11" fill="#8a6a20" font-weight="bold">100000 ≤ x &lt; 10⁶</text>
    <text x="559" y="298" font-size="9.5" fill="#666">6 位，本题只有 100000</text>
  </g>

  <text x="330" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三段判定共 6 次整型比较：不用反复除 10，不用 to_string，也不用 log10（浮点可能少算一位）</text>
  <text x="330" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">写成半开区间 [10,100)、[1000,10000)、[100000,10⁶) 时，上界 10⁵ 恰好落在第三段的左端点</text>
  <text x="330" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">偶数位的 d 只取 2、4、6：每段都是形如 [10^(d−1), 10^d) 的一个数量级，段之间隔着奇数位那一级</text>
</svg>
