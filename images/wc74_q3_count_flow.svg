<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两次 O(n) 计数扫描，再做一次减法</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">先数「max ≤ right」，再数「max ≤ left − 1」，两者相减</text>

  <rect x="150" y="54" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">count(x)：run = 0，total = 0</text>

  <rect x="50" y="100" width="460" height="146" fill="none" stroke="#999" stroke-width="1.3" rx="12" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="64" y="118" font-size="9.5" fill="#888" filter="url(#rough2)">for v in nums（从左到右扫一遍）</text>

  <path d="M 280 84 L 280 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,148 380,170 280,192 180,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">v ≤ x ?</text>

  <path d="M 180 170 L 160 170 L 160 197" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 170 L 400 170 L 400 197" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="163" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="396" y="163" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="66" y="200" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="161" y="213" text-anchor="middle" font-size="9.6" fill="#3a5a30" filter="url(#rough2)">run += 1</text>
  <text x="161" y="226" text-anchor="middle" font-size="9.6" fill="#3a5a30" filter="url(#rough2)">total += run</text>

  <rect x="304" y="200" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="399" y="213" text-anchor="middle" font-size="9.6" fill="#8a3a36" filter="url(#rough2)">run = 0</text>
  <text x="399" y="226" text-anchor="middle" font-size="9.6" fill="#8a3a36" filter="url(#rough2)">（&gt; x 是墙，段被切断）</text>

  <path d="M 280 246 L 280 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="268" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="10.2" fill="#3a4a66" filter="url(#rough2)">返回 total = count(x)</text>

  <path d="M 280 298 L 280 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="324" width="380" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = count(right) − count(left − 1)</text>
  <text x="280" y="358" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">「max ≤ right」的集合减去「max ≤ left − 1」的集合</text>

  <path d="M 280 366 L 280 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="388" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="10.2" fill="#3a5a30" filter="url(#rough2)">返回 ans</text>

  <text x="280" y="442" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每个 v 被访问两次；run 就是「以当前位结尾、全部 ≤ x 的子数组数」，累加即得 total</text>
  <text x="280" y="458" text-anchor="middle" font-size="9.3" fill="#999" filter="url(#rough2)">时间 O(n)、额外空间 O(1)：只有 run / total 两个计数器</text>
</svg>
