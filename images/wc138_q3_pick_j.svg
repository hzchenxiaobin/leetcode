<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">再在 i 右侧挑「小于 arr[i] 的最大值」</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">相等时取最左边那个，才能保住更大的字典序</text>
  <text x="40" y="82" font-size="11" fill="#3a4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">主例</text>
  <rect x="90" y="64" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="86.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="142" y="64" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="168" y="86.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="194" y="64" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="86.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="246" y="64" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="86.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">7</text>
  <text x="90" y="122" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">i=1</text>
  <text x="142" y="122" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">候选：4、6、7 都 &lt; 9</text>
  <text x="90" y="146" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">取最大值 7（下标 4）→ 交换后 [1,7,4,6,9]</text>
  <text x="40" y="202" font-size="11" fill="#8a3a36" text-anchor="start" font-weight="bold" filter="url(#rough2)">重复值</text>
  <rect x="90" y="184" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="206.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="142" y="184" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="168" y="206.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="194" y="184" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="206.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="246" y="184" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="272" y="206.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="90" y="242" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">i=0</text>
  <text x="142" y="242" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">候选都是 1（下标 1、2）</text>
  <text x="90" y="266" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">必须取最左的 1（下标 1）→ [1,3,1,3]；取下标 2 会得到更小的 [1,1,3,3]</text>
  <rect x="90" y="288" width="470" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="325" y="307.5" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">为什么从右往左找第一个 &lt; arr[i] 的数？</text>
  <text x="325" y="324" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">它右侧没有更大的候选，而它与 arr[i] 的差最小 → 交换后字典序最大</text>
</svg>
