<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一维（1×m）：只剩三类操作，B 与 C 至多选一种</text>
  <text x="410" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 m = 6 示意；长度 ℓ ≤ m−2 的区间会被 A 逐格压制</text>

  <!-- 序列格子 -->
  <rect x="42" y="150" width="68" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="110" y="150" width="68" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="178" y="150" width="68" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="246" y="150" width="68" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="314" y="150" width="68" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="382" y="150" width="68" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="76" y="180" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">a1</text>
  <text x="144" y="180" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">a2</text>
  <text x="212" y="180" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">a3</text>
  <text x="280" y="180" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">a4</text>
  <text x="348" y="180" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">a5</text>
  <text x="416" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">am</text>

  <!-- A：整段 -->
  <text x="42" y="128" font-size="12.5" fill="#446688" filter="url(#rough2)">A 整段 [1, m]：每格都 +(m−2)</text>
  <path d="M60,140 L432,140 M60,140 L60,146 M432,140 L432,146" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- B：缺最后一格 -->
  <path d="M60,244 L364,244 M60,244 L60,238 M364,244 L364,238" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="42" y="268" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">B 缺末格 [1, m−1]：前 m−1 格 +(m−3)，第 m 格 +(m−1)</text>

  <!-- C：缺第一格 -->
  <path d="M128,298 L432,298 M128,298 L128,292 M432,298 L432,292" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="322" font-size="12.5" fill="#9c3b38" filter="url(#rough2)">C 缺首格 [2, m]：后 m−1 格 +(m−3)，第 1 格 +(m−1)</text>

  <!-- 右：压制与替换 -->
  <rect x="492" y="88" width="304" height="142" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="506" y="112" font-size="11.8" fill="#33517a" filter="url(#rough2)">长度 ℓ ≤ m−2 的区间：内部 +(ℓ−2) ≤ m−4，</text>
  <text x="506" y="134" font-size="11.8" fill="#33517a" filter="url(#rough2)">外部 +(ℓ) ≤ m−2，逐格都不如 A（m−2）。</text>
  <text x="506" y="160" font-size="11.8" fill="#33517a" filter="url(#rough2)">B、C 同时出现时，一次 B + 一次 C 换成</text>
  <text x="506" y="182" font-size="11.8" fill="#33517a" filter="url(#rough2)">两次 A：两端不变、中间更赚，</text>
  <text x="506" y="204" font-size="11.8" fill="#33517a" filter="url(#rough2)">故两族里只会用到一族。</text>

  <rect x="492" y="244" width="304" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="506" y="268" font-size="11.8" fill="#8a6212" filter="url(#rough2)">整段 x 次 + 缺格 y 次，t = x + y</text>
  <text x="506" y="292" font-size="11.8" fill="#8a6212" filter="url(#rough2)">主元格增益：d·t + y</text>
  <text x="506" y="314" font-size="11.8" fill="#8a6212" filter="url(#rough2)">其余格增益：d·t − y，其中 d = m−2</text>
  <text x="506" y="342" font-size="11.8" fill="#8a6212" filter="url(#rough2)">主元只能是第 1 格或第 m 格，</text>
  <text x="506" y="364" font-size="11.8" fill="#8a6212" filter="url(#rough2)">两种各二分一次，取小。</text>

  <text x="42" y="404" font-size="12.5" fill="#333" filter="url(#rough2)">族内判定：max(0, f_sp − d·t) ≤ y ≤ min(t, d·t − F(k−1))，对 t 单增，可二分</text>
  <text x="42" y="434" font-size="11.8" fill="#b85450" filter="url(#rough2)">F(k−1) = 非主元格中第 k−1 小的 f（k = 1 时没有这条约束）；m = 1、m = 2 单独判</text>
</svg>
