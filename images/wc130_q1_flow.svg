<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描，边读边取模</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每轮只做一次乘加、一次取模、一次比较</text>
  <rect x="170.0" y="66.0" width="220.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="89.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur = 0，answer 置空</text>
  <path d="M 280.0 104.0 L 280.0 124.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="124.0" width="260.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="149.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur = (cur * 2 + nums[i]) % 5</text>
  <path d="M 280.0 168.0 L 280.0 188.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="188.0" width="220.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="212.1" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur == 0 ?</text>
  <path d="M 390.0 198.0 L 408.0 198.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="399.0" y="190.0" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="408.0" y="178.0" width="130.0" height="36.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="473.0" y="199.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">追加 true</text>
  <path d="M 390.0 218.0 L 408.0 240.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="399.0" y="238.0" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="408.0" y="224.0" width="130.0" height="36.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="473.0" y="245.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">追加 false</text>
  <path d="M 468 214 L 468 300 L 300 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="282.0" width="150.0" height="34.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="302.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i += 1</text>
  <path d="M 150 299 C 100 296 100 190 146 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="25.0" y="336.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">取模结果始终落在 [0,4]，与前缀长度无关。</text>
</svg>
