<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 606" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="606" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：dfs(start) —— 剪枝 → 终止 → 枚举 end → 回溯</text>
  <path d="M 170 34 Q 310 42 450 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- 进入 dfs -->
  <g filter="url(#r)">
    <rect x="120" y="46" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="71" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#r)">进入 dfs(start)（携带 seen、best）</text>
  <g filter="url(#r)">
    <line x1="240" y1="86" x2="240" y2="100" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形 1：剪枝 -->
  <g filter="url(#r)">
    <polygon points="240,100 370,142 240,184 110,142" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="240" y="138" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#r)">|seen| + (n−start)</text>
  <text x="240" y="153" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#r)">≤ best ?</text>
  <g filter="url(#r)">
    <line x1="370" y1="142" x2="428" y2="142" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="430" y="120" width="150" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="505" y="138" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#r)">return ✂</text>
  <text x="505" y="154" text-anchor="middle" font-size="9.5" fill="#a06060" filter="url(#r)">子树不可能更优</text>
  <g filter="url(#r)">
    <line x1="240" y1="184" x2="240" y2="198" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="250" y="196" text-anchor="start" font-size="11" fill="#666" filter="url(#r)">否</text>

  <!-- 菱形 2：终止 -->
  <g filter="url(#r)">
    <polygon points="240,198 360,240 240,282 120,240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="240" y="245" text-anchor="middle" font-size="11.5" fill="#2f5d28" filter="url(#r)">start == n ?</text>
  <g filter="url(#r)">
    <line x1="360" y1="240" x2="418" y2="240" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#2f5d28" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="420" y="218" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="500" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d28" filter="url(#r)">best = max(best, |seen|)</text>
  <text x="500" y="252" text-anchor="middle" font-size="9.5" fill="#5a8a50" filter="url(#r)">切完整串，记录段数，return ✓</text>
  <g filter="url(#r)">
    <line x1="240" y1="282" x2="240" y2="296" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="250" y="294" text-anchor="start" font-size="11" fill="#666" filter="url(#r)">否</text>

  <!-- 枚举 end -->
  <g filter="url(#r)">
    <rect x="120" y="296" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="321" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#r)">枚举 end = start … n−1（短优先）</text>
  <g filter="url(#r)">
    <line x1="240" y1="336" x2="240" y2="350" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形 3：判重 -->
  <g filter="url(#r)">
    <polygon points="240,350 380,392 240,434 100,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="240" y="388" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#r)">sub = s[start..end]</text>
  <text x="240" y="404" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#r)">∈ seen ?</text>
  <g filter="url(#r)">
    <line x1="380" y1="392" x2="438" y2="392" stroke="#d6a040" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="440" y="370" width="140" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="510" y="388" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">跳过此 end ✗</text>
  <text x="510" y="404" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#r)">子串重复，换下一个</text>
  <g filter="url(#r)">
    <line x1="240" y1="434" x2="240" y2="448" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="250" y="446" text-anchor="start" font-size="11" fill="#666" filter="url(#r)">否</text>

  <!-- 插入 -->
  <g filter="url(#r)">
    <rect x="120" y="448" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="471" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#r)">seen.insert(sub) —— 做出选择</text>
  <g filter="url(#r)">
    <line x1="240" y1="484" x2="240" y2="498" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- 递归 -->
  <g filter="url(#r)">
    <rect x="120" y="498" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="240" y="521" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#r)">dfs(end + 1) —— 递归下一段</text>
  <g filter="url(#r)">
    <line x1="240" y1="534" x2="240" y2="548" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- 回溯 -->
  <g filter="url(#r)">
    <rect x="120" y="548" width="240" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="240" y="571" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">seen.erase(sub) —— 回溯，恢复现场 ↩</text>

  <!-- 循环回边 1：跳过后回到枚举 -->
  <g filter="url(#r)">
    <path d="M 580 392 L 600 392 L 600 326 L 362 326" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>
  <!-- 循环回边 2：回溯后回到枚举 -->
  <g filter="url(#r)">
    <path d="M 360 566 L 400 566 L 400 346 L 362 346" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>
  <text x="594" y="318" text-anchor="end" font-size="10" fill="#888" filter="url(#r)">下一个 end</text>
  <text x="406" y="562" text-anchor="start" font-size="10" fill="#888" filter="url(#r)">回到枚举下一个 end</text>

  <text x="310" y="598" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">顺序细节：剪枝在终止判定之前；end 从短到长 → 首条路径段数高 → best 早早抬升 → 剪枝更早生效</text>
</svg>
