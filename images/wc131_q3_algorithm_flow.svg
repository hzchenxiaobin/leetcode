<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：每个字符三分支，无需回溯</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">单次 O(|q|)，多查询共享 pattern</text>
  <rect x="150.0" y="62.0" width="260.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="83.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">j = 0（模式指针）</text>
  <path d="M 280.0 98.0 L 280.0 116.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190.0" y="116.0" width="180.0" height="36.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="137.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">读入 q[i]</text>
  <path d="M 230.0 152.0 L 110.0 178.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280.0 152.0 L 280.0 178.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 330.0 152.0 L 440.0 178.0" stroke="#78909c" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28.0" y="178.0" width="200.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="128.0" y="202.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">q[i] == p[j]</text>
  <text x="128.0" y="216.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">j += 1</text>
  <rect x="244.0" y="178.0" width="150.0" height="56.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="319.0" y="202.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">q[i] 是大写</text>
  <text x="319.0" y="216.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">→ 判 false</text>
  <rect x="406.0" y="178.0" width="150.0" height="56.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="481.0" y="202.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">小写：</text>
  <text x="481.0" y="216.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">插入，跳过</text>
  <path d="M 110.0 234.0 L 210.0 264.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280.0 234.0 L 280.0 264.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 470.0 234.0 L 360.0 264.0" stroke="#78909c" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="264.0" width="260.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="288.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">全部扫完：j == m ? true : false</text>
  <text x="25.0" y="332.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">结束条件 j == m 不能省：模式没配完就要判 false。</text>
</svg>
