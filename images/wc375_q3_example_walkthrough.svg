<svg xmlns="http://www.w3.org/2000/svg" width="640" height="442" viewBox="0 0 640 442" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="442" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 走查：nums = [1,3,2,3,3]，k = 2，mx = 3</text>
  <path d="M 160 32 Q 320 41 480 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="64" y="54" text-anchor="end" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">r</text>
  <text x="207" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">收缩后的窗口 [left, r]</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888" filter="url(#sk)">动作 → 贡献</text>

  <!-- r = 0：窗口 [0,0]，格子0亮 -->
  <text x="64" y="86" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">r = 0</text>
  <g filter="url(#sk)"><rect x="84" y="62" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="107" y="87" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="134" y="62" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="157" y="87" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="184" y="62" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="207" y="87" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="234" y="62" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="257" y="87" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="62" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="307" y="87" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <path d="M 84 106 L 130 106" stroke="#4a8e4a" stroke-width="3" filter="url(#sk)"/>
  <text x="352" y="80" font-size="11.5" fill="#555" filter="url(#sk)">并入 1：cnt = 0 &lt; 2，不收缩</text>
  <text x="352" y="97" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 0 → 0</text>

  <!-- r = 1：窗口 [0,1] -->
  <text x="64" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">r = 1</text>
  <g filter="url(#sk)"><rect x="84" y="124" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="107" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="134" y="124" width="46" height="40" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="157" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="184" y="124" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="207" y="149" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="234" y="124" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="257" y="149" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="124" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="307" y="149" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <path d="M 84 168 L 180 168" stroke="#4a8e4a" stroke-width="3" filter="url(#sk)"/>
  <text x="352" y="142" font-size="11.5" fill="#555" filter="url(#sk)">并入 3：cnt = 1 &lt; 2，不收缩</text>
  <text x="352" y="159" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 0 → 0</text>

  <!-- r = 2：窗口 [0,2] -->
  <text x="64" y="210" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">r = 2</text>
  <g filter="url(#sk)"><rect x="84" y="186" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="107" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="134" y="186" width="46" height="40" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="157" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="184" y="186" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="207" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="234" y="186" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="257" y="211" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="186" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="307" y="211" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <path d="M 84 230 L 230 230" stroke="#4a8e4a" stroke-width="3" filter="url(#sk)"/>
  <text x="352" y="204" font-size="11.5" fill="#555" filter="url(#sk)">并入 2：cnt = 1 &lt; 2，不收缩</text>
  <text x="352" y="221" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 0 → 0</text>

  <!-- r = 3：窗口 [2,3] -->
  <text x="64" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">r = 3</text>
  <g filter="url(#sk)"><rect x="84" y="248" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="107" y="273" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="134" y="248" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="157" y="273" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="184" y="248" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="207" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="234" y="248" width="46" height="40" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="257" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="248" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="307" y="273" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <path d="M 184 292 L 280 292" stroke="#4a8e4a" stroke-width="3" filter="url(#sk)"/>
  <text x="352" y="266" font-size="11.5" fill="#555" filter="url(#sk)">并入 3：cnt = 2 → 收缩，吐出 1、3 至 left = 2</text>
  <text x="352" y="283" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 2 → 2</text>

  <!-- r = 4：窗口 [4,4] -->
  <text x="64" y="334" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">r = 4</text>
  <g filter="url(#sk)"><rect x="84" y="310" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="107" y="335" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="134" y="310" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="157" y="335" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="184" y="310" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="207" y="335" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="234" y="310" width="46" height="40" rx="5" fill="#efefef" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="257" y="335" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="284" y="310" width="46" height="40" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="307" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <path d="M 284 354 L 330 354" stroke="#4a8e4a" stroke-width="3" filter="url(#sk)"/>
  <text x="352" y="328" font-size="11.5" fill="#555" filter="url(#sk)">并入 3：cnt = 2 → 收缩，吐出 2、3 至 left = 4</text>
  <text x="352" y="345" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 4 → 6</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="36" y="368" width="568" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="320" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 0 + 0 + 0 + 2 + 4 = 6 ✓</text>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">r=3 结尾：[1,3,2,3]、[3,2,3]；r=4 结尾：[1,3,2,3,3]、[3,2,3,3]、[2,3,3]、[3,3]</text>
</svg>
