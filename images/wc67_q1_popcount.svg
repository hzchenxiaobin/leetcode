<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">子问题：popcount(x) —— 二进制里 1 的个数</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">它把「数 x 有几个置位」与「判断这个数是不是质数」彻底拆开，两层都极轻</text>

  <text x="60" y="84" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">① 定义：21 = 10101₂，置位数为 3（绿色格子是 1）</text>

  <g filter="url(#rough2)">
    <rect x="96" y="94" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="138" y="94" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="180" y="94" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="222" y="94" width="36" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="264" y="94" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>

    <text x="114" y="118" text-anchor="middle" font-size="14" fill="#33552a">1</text>
    <text x="156" y="118" text-anchor="middle" font-size="14" fill="#777">0</text>
    <text x="198" y="118" text-anchor="middle" font-size="14" fill="#33552a">1</text>
    <text x="240" y="118" text-anchor="middle" font-size="14" fill="#777">0</text>
    <text x="282" y="118" text-anchor="middle" font-size="14" fill="#33552a">1</text>
  </g>

  <text x="96" y="150" font-size="9" fill="#aaa" filter="url(#rough2)">2⁴ = 16</text>
  <text x="138" y="150" font-size="9" fill="#aaa" filter="url(#rough2)">2³ = 8</text>
  <text x="180" y="150" font-size="9" fill="#aaa" filter="url(#rough2)">2² = 4</text>
  <text x="222" y="150" font-size="9" fill="#aaa" filter="url(#rough2)">2¹ = 2</text>
  <text x="264" y="150" font-size="9" fill="#aaa" filter="url(#rough2)">2⁰ = 1</text>

  <text x="336" y="112" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c = 1 + 1 + 1 = 3，3 是质数 ✓</text>
  <text x="336" y="132" font-size="10" fill="#888" filter="url(#rough2)">同一个 c 可能来自很多不同的 x，所以只查表就够</text>
  <text x="336" y="148" font-size="10" fill="#888" filter="url(#rough2)">例如 10 = 1010₂ 也有 c = 2，同样计入答案</text>

  <text x="60" y="180" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">② 求 c 的三种写法（任选其一，语义完全一致）</text>

  <text x="60" y="200" font-size="10.5" fill="#555" filter="url(#rough2)">a) Kernighan 消位法：x &amp;= x − 1 恰好消掉最低位的那个 1，循环 c 次后 x 归零</text>

  <g filter="url(#rough2)">
    <rect x="60" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="81" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="102" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="123" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="144" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>

    <rect x="206" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="227" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="248" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="269" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="290" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>

    <rect x="352" y="210" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="373" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="394" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="415" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="436" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>

    <rect x="498" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="519" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="540" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="561" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="582" y="210" width="20" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3"/>

    <text x="70" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>
    <text x="91" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="112" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>
    <text x="133" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="154" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>

    <text x="216" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>
    <text x="237" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="258" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>
    <text x="279" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="300" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>

    <text x="362" y="228" text-anchor="middle" font-size="11" fill="#33552a">1</text>
    <text x="383" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="404" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="425" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="446" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>

    <text x="508" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="529" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="550" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="571" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
    <text x="592" y="228" text-anchor="middle" font-size="11" fill="#777">0</text>
  </g>

  <path d="M 172 222 L 198 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 222 L 344 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 464 222 L 490 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="112" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">21，c = 0</text>
  <text x="258" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">20，c = 1</text>
  <text x="404" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">16，c = 2</text>
  <text x="550" y="254" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0，c = 3 停</text>

  <text x="60" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">b) __builtin_popcount(x)：GCC / Clang 内建，编译成单条 popcnt 指令（最快）</text>
  <text x="60" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">c) bin(x).count("1")：Python 最直观；3.10+ 还可写 x.bit_count()</text>

  <rect x="60" y="320" width="504" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="342" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">right ≤ 10⁶ &lt; 2²⁰，所以任何写法都在 20 次迭代内结束（c 最大 19）</text>
  <text x="76" y="362" font-size="10.5" fill="#555" filter="url(#rough2)">总时间 O(n · log right)，n = right − left + 1 ≤ 10⁴ + 1，最坏约 2 × 10⁵ 次位运算</text>

  <text x="310" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">这些都是精确整数运算，不存在浮点误差；也不需要筛法预处理</text>
</svg>
