<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：2932 → 52，4009 → 13</text>

  <!-- example 1 -->
  <text x="60" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：num = 2932</text>
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="80" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="80" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="80" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="80" y="103">2</text><text x="124" y="103">9</text>
    <text x="168" y="103">3</text><text x="212" y="103">2</text>
  </g>
  <path d="M 250 98 L 292 98" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="90" font-size="12" fill="#446688" filter="url(#rough2)">排序</text>
  <text x="310" y="96" font-size="14" fill="#333" filter="url(#rough2)">[2, 2, 3, 9]</text>
  <text x="310" y="118" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">23 + 29 = 52</text>
  <text x="470" y="96" font-size="13" fill="#4a7a3a" filter="url(#rough2)">两位 + 两位</text>
  <text x="470" y="114" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是最优组合</text>

  <!-- example 2 -->
  <text x="60" y="176" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：num = 4009</text>
  <g filter="url(#rough2)">
    <rect x="60" y="190" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="190" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="190" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="190" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="80" y="213">4</text><text x="124" y="213">0</text>
    <text x="168" y="213">0</text><text x="212" y="213">9</text>
  </g>
  <path d="M 250 208 L 292 208" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="206" font-size="14" fill="#333" filter="url(#rough2)">[0, 0, 4, 9]</text>
  <text x="310" y="228" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">04 + 09 = 13</text>
  <text x="470" y="206" font-size="13" fill="#d6a040" filter="url(#rough2)">前导 0 允许 →</text>
  <text x="470" y="224" font-size="13" fill="#d6a040" filter="url(#rough2)">两位拆分仍最优</text>

  <!-- bad example: 1+3 split -->
  <g filter="url(#rough2)">
    <rect x="60" y="268" width="470" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="295" y="290" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">反面对照：[223, 9] 这类 1+3 拆分 = 232，远差于 52</text>
  <text x="295" y="308" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">高位（百位）权重 100 太贵，全部塞进两位数才划算</text>
</svg>
