<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 462" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="462" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 降序 → 贪心累加 → 判停</text>
  <text x="260" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">累加到第 k 项时删掉的数量恰为前 k 大频率之和 F(k)</text>

  <rect x="110" y="66" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 统计频率：freq[v] += 1</text>

  <path d="M 260 110 L 260 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrDark)" filter="url(#rough2)"/>

  <rect x="110" y="136" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">② 取出全部频率，降序排序</text>

  <path d="M 260 180 L 260 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrDark)" filter="url(#rough2)"/>

  <rect x="110" y="206" width="300" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">③ k += 1，removed += 当前最大频率</text>
  <text x="260" y="245" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">（按降序依次吞掉最大的那一份）</text>

  <path d="M 260 254 L 260 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrDark)" filter="url(#rough2)"/>

  <polygon points="260,283 370,330 260,377 150,330" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">removed ≥ n/2 ?</text>

  <path d="M 370 330 L 440 330 L 440 230 L 416 230" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrDark)" filter="url(#rough2)"/>
  <text x="424" y="296" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="424" y="312" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">继续累加</text>

  <path d="M 260 378 L 260 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrDark)" filter="url(#rough2)"/>
  <text x="274" y="398" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="150" y="406" width="220" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">④ 返回 k（选中的值的个数）</text>
</svg>
