<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两张后缀表：还剩几个字符能匹配？</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">word1 = "bacdc"，word2 = "abc"（下标从 0 起，第 5 格是越界哨兵）</text>

  <text x="46" y="80" font-size="10" fill="#666">word1[i]</text>
  <rect x="170" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="338" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="64" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="64" width="56" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="198" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">b</text>
  <text x="254" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">a</text>
  <text x="310" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
  <text x="366" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">d</text>
  <text x="422" y="84" text-anchor="middle" font-size="12" fill="#3a4a66">c</text>
  <text x="478" y="84" text-anchor="middle" font-size="9.5" fill="#999">越界</text>
  <text x="198" y="108" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="254" y="108" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="310" y="108" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="366" y="108" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="422" y="108" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="478" y="108" text-anchor="middle" font-size="9" fill="#999">5</text>

  <rect x="46" y="120" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="101" y="139" text-anchor="middle" font-size="10" fill="#3a5a30">S0[i] 精确</text>
  <rect x="170" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="338" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="120" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">2</text>
  <text x="254" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <text x="310" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <text x="366" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <text x="422" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <text x="478" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">0</text>

  <rect x="46" y="156" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="101" y="175" text-anchor="middle" font-size="10" fill="#8a6a20">S1[i] 一次容错</text>
  <rect x="170" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="338" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="394" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="156" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">3</text>
  <text x="254" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">3</text>
  <text x="310" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">2</text>
  <text x="366" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">2</text>
  <text x="422" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
  <text x="478" y="176" text-anchor="middle" font-size="12" fill="#8a6a20">0</text>

  <rect x="46" y="222" width="232" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="162" y="244" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">S0[i]：最长可精确匹配的后缀长度</text>
  <text x="162" y="264" text-anchor="middle" font-size="10" fill="#555">word2 的后 S0[i] 个字符</text>
  <text x="162" y="282" text-anchor="middle" font-size="10" fill="#555">是 word1[i..] 的子序列</text>
  <text x="162" y="300" text-anchor="middle" font-size="10" fill="#555">从右往左贪心匹配即得</text>

  <rect x="292" y="222" width="232" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="408" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">S1[i]：同上，但允许 1 处不同</text>
  <text x="408" y="264" text-anchor="middle" font-size="10" fill="#555">S1[i] ≥ S0[i]，且最多为 m</text>
  <text x="408" y="282" text-anchor="middle" font-size="10" fill="#555">转移三选一：跳过 i / 精确用 i</text>
  <text x="408" y="300" text-anchor="middle" font-size="10" fill="#555">/ 把唯一的容错花在 i 上</text>

  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999">例：S1[2] = 2 表示 "bc" 能在 "cdc" 里带一次容错匹配（c 对 b 用掉容错，再 c 对 c）</text>
</svg>
