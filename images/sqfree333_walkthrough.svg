<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [3, 4, 4, 5] 的 dp 表演变</text>
  <path d="M 140 38 Q 330 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <rect x="40" y="60" width="110" height="30"/><rect x="150" y="60" width="70" height="30"/>
    <rect x="220" y="60" width="75" height="30"/><rect x="295" y="60" width="75" height="30"/>
    <rect x="370" y="60" width="85" height="30"/><rect x="455" y="60" width="175" height="30"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">
    <text x="95" y="80" text-anchor="middle">处理元素</text>
    <text x="185" y="80" text-anchor="middle">dp[∅]</text>
    <text x="257" y="80" text-anchor="middle">dp[{3}]</text>
    <text x="332" y="80" text-anchor="middle">dp[{5}]</text>
    <text x="412" y="80" text-anchor="middle">dp[{3,5}]</text>
    <text x="542" y="80" text-anchor="middle">说明</text>
  </g>

  <!-- 行 1：初始 -->
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#888888" stroke-width="1.2">
    <rect x="40" y="90" width="110" height="38"/><rect x="150" y="90" width="70" height="38"/>
    <rect x="220" y="90" width="75" height="38"/><rect x="295" y="90" width="75" height="38"/>
    <rect x="370" y="90" width="85" height="38"/><rect x="455" y="90" width="175" height="38"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="95" y="113" text-anchor="middle">—（初始）</text>
    <text x="185" y="113" text-anchor="middle">1</text>
    <text x="257" y="113" text-anchor="middle">0</text>
    <text x="332" y="113" text-anchor="middle">0</text>
    <text x="412" y="113" text-anchor="middle">0</text>
    <text x="542" y="113" text-anchor="middle">仅空集</text>
  </g>

  <!-- 行 2：v = 3 -->
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#888888" stroke-width="1.2">
    <rect x="40" y="128" width="110" height="38"/><rect x="150" y="128" width="70" height="38"/>
    <rect x="295" y="128" width="75" height="38"/><rect x="370" y="128" width="85" height="38"/>
    <rect x="455" y="128" width="175" height="38"/>
  </g>
  <rect x="220" y="128" width="75" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="95" y="151" text-anchor="middle">v = 3（m={3}）</text>
    <text x="185" y="151" text-anchor="middle">1</text>
    <text x="257" y="151" text-anchor="middle" font-weight="bold" fill="#8a6210">1</text>
    <text x="332" y="151" text-anchor="middle">0</text>
    <text x="412" y="151" text-anchor="middle">0</text>
    <text x="542" y="151" text-anchor="middle">∅ → {3}：并入 3</text>
  </g>

  <!-- 行 3：v = 4（淘汰） -->
  <g filter="url(#rough2)" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2">
    <rect x="40" y="166" width="110" height="38"/><rect x="150" y="166" width="70" height="38"/>
    <rect x="220" y="166" width="75" height="38"/><rect x="295" y="166" width="75" height="38"/>
    <rect x="370" y="166" width="85" height="38"/><rect x="455" y="166" width="175" height="38"/>
  </g>
  <g font-size="11.5" fill="#777" filter="url(#rough2)">
    <text x="95" y="189" text-anchor="middle">v = 4（含 2²）</text>
    <text x="185" y="189" text-anchor="middle">1</text>
    <text x="257" y="189" text-anchor="middle">1</text>
    <text x="332" y="189" text-anchor="middle">0</text>
    <text x="412" y="189" text-anchor="middle">0</text>
    <text x="542" y="189" text-anchor="middle">非平方自由：跳过</text>
  </g>

  <!-- 行 4：v = 4（淘汰） -->
  <g filter="url(#rough2)" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2">
    <rect x="40" y="204" width="110" height="38"/><rect x="150" y="204" width="70" height="38"/>
    <rect x="220" y="204" width="75" height="38"/><rect x="295" y="204" width="75" height="38"/>
    <rect x="370" y="204" width="85" height="38"/><rect x="455" y="204" width="175" height="38"/>
  </g>
  <g font-size="11.5" fill="#777" filter="url(#rough2)">
    <text x="95" y="227" text-anchor="middle">v = 4（含 2²）</text>
    <text x="185" y="227" text-anchor="middle">1</text>
    <text x="257" y="227" text-anchor="middle">1</text>
    <text x="332" y="227" text-anchor="middle">0</text>
    <text x="412" y="227" text-anchor="middle">0</text>
    <text x="542" y="227" text-anchor="middle">同上：跳过</text>
  </g>

  <!-- 行 5：v = 5 -->
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#888888" stroke-width="1.2">
    <rect x="40" y="242" width="110" height="38"/><rect x="150" y="242" width="70" height="38"/>
    <rect x="220" y="242" width="75" height="38"/>
  </g>
  <rect x="295" y="242" width="75" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="370" y="242" width="85" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#fdfdfd" stroke="#888888" stroke-width="1.2">
    <rect x="455" y="242" width="175" height="38"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="95" y="265" text-anchor="middle">v = 5（m={5}）</text>
    <text x="185" y="265" text-anchor="middle">1</text>
    <text x="257" y="265" text-anchor="middle">1</text>
    <text x="332" y="265" text-anchor="middle" font-weight="bold" fill="#8a6210">1</text>
    <text x="412" y="265" text-anchor="middle" font-weight="bold" fill="#8a6210">1</text>
    <text x="542" y="265" text-anchor="middle">∅→{5}、{3}→{3,5}</text>
  </g>

  <!-- 行 6：汇总 -->
  <g filter="url(#rough2)" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6">
    <rect x="40" y="280" width="110" height="38"/>
    <rect x="150" y="280" width="305" height="38"/>
    <rect x="455" y="280" width="175" height="38"/>
  </g>
  <g font-size="11.5" fill="#2e5a24" filter="url(#rough2)">
    <text x="95" y="303" text-anchor="middle" font-weight="bold">汇总</text>
    <text x="302" y="303" text-anchor="middle">Σ dp = 1 + 1 + 1 + 1 = 4</text>
    <text x="542" y="303" text-anchor="middle" font-weight="bold">减空集：4 − 1 = 3</text>
  </g>

  <!-- 底部：三个子集 -->
  <text x="330" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 个非空无平方子集：</text>

  <g filter="url(#rough2)">
    <rect x="70" y="356" width="155" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="252" y="356" width="155" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="435" y="356" width="155" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="147" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24">{3}</text>
    <text x="147" y="396" text-anchor="middle" font-size="10.5" fill="#2e5a24">乘积 3，无平方 ✓</text>
    <text x="329" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24">{5}</text>
    <text x="329" y="396" text-anchor="middle" font-size="10.5" fill="#2e5a24">乘积 5，无平方 ✓</text>
    <text x="512" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24">{3,5}</text>
    <text x="512" y="396" text-anchor="middle" font-size="10.5" fill="#2e5a24">乘积 15，无平方 ✓</text>
  </g>
</svg>
