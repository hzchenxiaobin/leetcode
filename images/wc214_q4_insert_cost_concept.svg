<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="445" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：只数不插——代价 = 两侧计数取 min</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1 第 ④ 步：x = 2，插入前 nums = [1, 5, 6]（值域 V = 6）</text>

  <!-- 左面板：有序数组视角 -->
  <text x="165" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">视角一：有序数组——数两侧</text>

  <g filter="url(#rough2)">
    <rect x="138" y="104" width="54" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="165" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 2</text>
  <path d="M 160 132 Q 145 142 122 148" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="152" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="118" y="152" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="166" y="152" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="92" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="188" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="66" y="147" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">nums</text>

  <text x="92" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">＜x：1 个</text>
  <text x="164" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">＞x：2 个</text>

  <g filter="url(#rough2)">
    <rect x="52" y="222" width="226" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="165" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4d6e" filter="url(#rough2)">cost = min(1, 2) = 1</text>
  <text x="165" y="266" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">从计数更少的一侧「挤进去」</text>

  <text x="165" y="298" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">插入到哪个位置无关紧要——</text>
  <text x="165" y="314" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">题面要的是两侧计数，不是数组形态</text>

  <!-- 右面板：值域频次视角 -->
  <text x="479" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">视角二：值域频次——前缀和</text>

  <text x="412" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">x 本尊</text>
  <g filter="url(#rough2)">
    <rect x="348" y="110" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="392" y="110" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="436" y="110" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="480" y="110" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="524" y="110" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="568" y="110" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="368" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#rough2)">2</text>
  <text x="456" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="500" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="544" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="588" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>

  <g filter="url(#rough2)">
    <rect x="348" y="138" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="392" y="138" width="40" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="436" y="138" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="480" y="138" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="524" y="138" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="568" y="138" width="40" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="342" y="127" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">值</text>
  <text x="342" y="156" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">freq</text>
  <text x="368" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="157" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="456" y="157" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="500" y="157" text-anchor="middle" font-size="12" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="544" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="588" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 348 172 L 348 179 L 388 179 L 388 172" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="368" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">＜x 的 1 个</text>
  <text x="368" y="208" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">= P(x−1)</text>
  <text x="412" y="194" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">＝x：0 个</text>
  <path d="M 436 172 L 436 179 L 608 179 L 608 172" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="522" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10" filter="url(#rough2)">＞x 的 2 个</text>
  <text x="522" y="208" text-anchor="middle" font-size="10.5" fill="#a06a10" filter="url(#rough2)">= total − P(x) = 3 − 1</text>

  <g filter="url(#rough2)">
    <rect x="348" y="222" width="262" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="479" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">less = P(x−1) = 1</text>
  <text x="479" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">greater = total − P(x) = 2</text>

  <text x="479" y="298" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">total = 3：已插入个数，普通变量 O(1) 维护</text>
  <text x="479" y="314" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">相等元素若落在 x 桶：计入 P(x)、不进 P(x−1)</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="332" width="560" height="98" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">每轮「两查一插」：单点 +1 ⇄ 前缀求和 交替进行 → 树状数组，各 O(log V)</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">等于 x 的元素被两侧同时排除——重复值零成本</text>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">值域 [1, 10⁵] 直接作桶下标，免离散化；n ≤ 10⁵ 下总操作约 5×10⁶</text>
</svg>
