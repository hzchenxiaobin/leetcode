<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">核心观察：每步只删前缀 → 剩余串永远是原串的后缀</text>
  <path d="M 170 44 Q 380 52 590 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 左面板：一步操作的演示 ===== -->
  <g filter="url(#sk2)">
    <rect x="20" y="62" width="470" height="336" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="255" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">一步操作 = 删掉一个「平方前缀」ww</text>

  <text x="36" y="120" font-size="13" fill="#555" filter="url(#sk2)">s =</text>
  <text x="76" y="120" font-size="11" fill="#999" filter="url(#sk2)">(l=0)</text>

  <!-- 第一行：aabaab，前 3 个绿 / 接下来 3 个蓝 -->
  <g filter="url(#sk)">
    <rect x="100" y="96" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="138" y="96" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="176" y="96" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="214" y="96" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="252" y="96" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="96" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="15" text-anchor="middle" filter="url(#sk2)">
    <text x="119" y="121" fill="#2f4f2f">a</text>
    <text x="157" y="121" fill="#2f4f2f">a</text>
    <text x="195" y="121" fill="#2f4f2f">b</text>
    <text x="233" y="121" fill="#2b4466">a</text>
    <text x="271" y="121" fill="#2b4466">a</text>
    <text x="309" y="121" fill="#2b4466">b</text>
  </g>
  <path d="M 102 142 Q 157 152 212 142" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk2)"/>
  <path d="M 216 142 Q 271 152 326 142" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk2)"/>
  <text x="157" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk2)">w = aab</text>
  <text x="271" y="168" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk2)">w = aab</text>
  <text x="364" y="150" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk2)">相等 ✓</text>
  <text x="364" y="168" font-size="10.5" fill="#999" filter="url(#sk2)">才允许删</text>

  <path d="M 214 178 L 214 216" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="226" y="200" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">删去前 j = 3 个（1 步）</text>

  <!-- 第二行：剩余 s[3:] -->
  <text x="36" y="244" font-size="13" fill="#555" filter="url(#sk2)">剩余 =</text>
  <g filter="url(#sk)">
    <rect x="100" y="222" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="138" y="222" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="176" y="222" width="38" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="15" text-anchor="middle" filter="url(#sk2)">
    <text x="119" y="247" fill="#6b4e12">a</text>
    <text x="157" y="247" fill="#6b4e12">a</text>
    <text x="195" y="247" fill="#6b4e12">b</text>
  </g>
  <text x="240" y="240" font-size="12.5" fill="#6b4e12" filter="url(#sk2)">仍是原串的后缀 s[3:]</text>
  <text x="240" y="257" font-size="11" fill="#999" filter="url(#sk2)">右端点不动，只有左端点在移</text>

  <path d="M 214 268 L 214 306" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#sk2)"/>
  <text x="226" y="290" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">j = 1：'a' == 'a' → 再删 1 个</text>

  <!-- 第三行：剩余 s[4:] -->
  <g filter="url(#sk)">
    <rect x="100" y="312" width="38" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
    <rect x="138" y="312" width="38" height="38" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle" filter="url(#sk2)">
    <text x="119" y="337" fill="#555">a</text>
    <text x="157" y="337" fill="#555">b</text>
  </g>
  <text x="196" y="337" font-size="12.5" fill="#555" filter="url(#sk2)">= s[4:]，最后一步删整串 → ∅</text>
  <text x="255" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk2)">左端点 0 → 3 → 4：状态就是一个整数 l</text>

  <!-- ===== 右面板：状态设计 ===== -->
  <g filter="url(#sk2)">
    <rect x="506" y="62" width="234" height="336" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="623" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk2)">状态设计</text>

  <g filter="url(#sk)">
    <rect x="520" y="96" width="206" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="530" y="118" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk2)">① 操作只删前缀</text>
  <text x="530" y="138" font-size="12" fill="#333" filter="url(#sk2)">右端点 n−1 恒定不变</text>
  <text x="530" y="158" font-size="12" fill="#333" filter="url(#sk2)">剩余串 = s[l:]，由 l 唯一决定</text>

  <g filter="url(#sk)">
    <rect x="520" y="188" width="206" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="530" y="210" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">② dp[l]：删空 s[l:]</text>
  <text x="530" y="230" font-size="12" fill="#333" filter="url(#sk2)">所需的最大操作数</text>
  <text x="530" y="250" font-size="12" fill="#333" filter="url(#sk2)">与「怎么走到 l」无关</text>
  <text x="530" y="266" font-size="11" fill="#888" filter="url(#sk2)">（无后效性）</text>

  <g filter="url(#sk)">
    <rect x="520" y="286" width="206" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="530" y="310" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">dp[n] = 0（空串）</text>
  <text x="530" y="334" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">答案 = dp[0]</text>
  <text x="623" y="380" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk2)">状态数从 O(n²) 降到 O(n)</text>
</svg>
