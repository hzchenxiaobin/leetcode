<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">按位代价模型：最小化 XOR → 选恰好 c 个位</text>
  <path d="M 180 46 Q 380 54 580 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- ===== 左面板：按位独立代价 ===== -->
  <g filter="url(#sk2)">
    <rect x="20" y="66" width="340" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="190" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">每一位独立付代价</text>

  <g filter="url(#sk)">
    <rect x="36" y="100" width="308" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="46" y="120" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk2)">num1 的 1 位 → 负权 −2^i</text>
  <text x="46" y="140" font-size="12" fill="#333" filter="url(#sk2)">x 放 1：代价 0（匹配，省下 2^i）</text>
  <text x="46" y="158" font-size="12" fill="#333" filter="url(#sk2)">x 放 0：代价 2^i（失配）</text>

  <g filter="url(#sk)">
    <rect x="36" y="176" width="308" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="46" y="196" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">num1 的 0 位 → 正权 +2^i</text>
  <text x="46" y="216" font-size="12" fill="#333" filter="url(#sk2)">x 放 0：代价 0（匹配）</text>
  <text x="46" y="234" font-size="12" fill="#333" filter="url(#sk2)">x 放 1：代价 2^i（失配）</text>

  <g filter="url(#sk)">
    <rect x="36" y="252" width="308" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="190" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">cost(S) = num1 + Σ w_i</text>
  <text x="190" y="282" text-anchor="middle" font-size="10.5" font-style="italic" fill="#888" filter="url(#sk2)">选哪 c 个位，只看权重和</text>

  <!-- ===== 右面板：三种情况 ===== -->
  <g filter="url(#sk2)">
    <rect x="384" y="66" width="356" height="230" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="562" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk2)">三种情况（c ↔ k）</text>

  <!-- 情况一：c = k -->
  <text x="392" y="118" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk2)">① c = k：负权位全拿 → x = num1</text>
  <text x="400" y="148" font-size="9.5" fill="#888" filter="url(#sk2)">num1</text>
  <g filter="url(#sk)">
    <rect x="436" y="134" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="454" y="134" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="472" y="134" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="490" y="134" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
  </g>
  <text x="520" y="149" font-size="13" fill="#555" filter="url(#sk2)">→</text>
  <text x="536" y="148" font-size="9.5" fill="#888" filter="url(#sk2)">x</text>
  <g filter="url(#sk)">
    <rect x="548" y="134" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="566" y="134" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="584" y="134" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="602" y="134" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#sk2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="445" y="148">1</text><text x="463" y="148">0</text><text x="481" y="148">1</text><text x="499" y="148">0</text>
    <text x="557" y="148">1</text><text x="575" y="148">0</text><text x="593" y="148">1</text><text x="611" y="148">0</text>
  </g>
  <text x="632" y="144" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk2)">XOR = 0</text>
  <text x="632" y="158" font-size="10" fill="#888" filter="url(#sk2)">完美匹配</text>

  <!-- 情况二：c < k -->
  <text x="392" y="170" font-size="12" font-weight="bold" fill="#a07820" filter="url(#sk2)">② c ＜ k：负权拿不满，只能选 c 个</text>
  <text x="400" y="200" font-size="9.5" fill="#888" filter="url(#sk2)">num1</text>
  <g filter="url(#sk)">
    <rect x="436" y="186" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="454" y="186" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="472" y="186" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="490" y="186" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
  </g>
  <text x="520" y="201" font-size="13" fill="#555" filter="url(#sk2)">→</text>
  <text x="536" y="200" font-size="9.5" fill="#888" filter="url(#sk2)">x</text>
  <g filter="url(#sk)">
    <rect x="548" y="186" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="566" y="186" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="3"/>
    <rect x="584" y="186" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2" rx="3"/>
    <rect x="602" y="186" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#sk2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="445" y="200">1</text><text x="463" y="200">1</text><text x="481" y="200">1</text><text x="499" y="200">0</text>
    <text x="557" y="200">1</text><text x="575" y="200" fill="#b85450">0</text><text x="593" y="200" fill="#b85450">0</text><text x="611" y="200">0</text>
  </g>
  <text x="632" y="196" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#sk2)">清最低</text>
  <text x="632" y="210" font-size="10" fill="#888" filter="url(#sk2)">k−c 个 1</text>

  <!-- 情况三：c > k -->
  <text x="392" y="222" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">③ c ＞ k：负权全拿，还需补 c−k 个</text>
  <text x="400" y="252" font-size="9.5" fill="#888" filter="url(#sk2)">num1</text>
  <g filter="url(#sk)">
    <rect x="436" y="238" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="454" y="238" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="472" y="238" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="490" y="238" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <text x="520" y="253" font-size="13" fill="#555" filter="url(#sk2)">→</text>
  <text x="536" y="252" font-size="9.5" fill="#888" filter="url(#sk2)">x</text>
  <g filter="url(#sk)">
    <rect x="548" y="238" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="566" y="238" width="18" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="3"/>
    <rect x="584" y="238" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <rect x="602" y="238" width="18" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
  </g>
  <g filter="url(#sk2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="445" y="252">0</text><text x="463" y="252">0</text><text x="481" y="252">0</text><text x="499" y="252">1</text>
    <text x="557" y="252">0</text><text x="575" y="252">0</text><text x="593" y="252">1</text><text x="611" y="252">1</text>
  </g>
  <text x="632" y="248" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">补最低</text>
  <text x="632" y="262" font-size="10" fill="#888" filter="url(#sk2)">c−k 个 1</text>

  <text x="562" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk2)">蓝 = 保留匹配　绿 = 新补的 1　红 = 被清掉的 1</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk2)">
    <rect x="40" y="316" width="680" height="84" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="380" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">贪心口诀：删 1 删低位（保住高位的 1）· 补 1 补低位（新增代价最小）</text>
  <text x="380" y="366" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk2)">失配一位的代价恰是 2^i，位与位互不影响 → 先牺牲小位、保住大位，局部最优叠加成全局最优</text>
  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk2)">x 的大小无约束：c ＞ k 时 x 可以比 num1 大（示例 2 中 x = 3 ＞ num1 = 1）</text>
</svg>
