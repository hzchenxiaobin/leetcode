<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">判定流程：奇偶剪枝 + 一遍斐波那契扫描</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="56" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M260,74 L260,88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 奇偶判定 -->
  <polygon points="260,92 355,126 260,160 165,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">n 为奇数？</text>

  <path d="M355,126 L383,126" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="386" y="108" width="104" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="131" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <path d="M260,160 L260,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="172" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ② 初始化 -->
  <rect x="135" y="178" width="250" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">② m = n / 2</text>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a = 0, b = 1</text>
  <path d="M260,226 L260,240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 循环条件 -->
  <polygon points="260,244 345,277 260,310 175,277" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">a &lt; m ？</text>

  <path d="M175,277 L157,277" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="25" y="257" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(a, b) ← (b, a+b)</text>

  <path d="M90,257 L90,232 L260,232 L260,240" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="228" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">滚动到 a ≥ m 为止</text>

  <path d="M260,310 L260,324" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="322" font-size="12" fill="#8a6d1f" filter="url(#rough2)">否（a ≥ m）</text>

  <!-- ④ 判等 -->
  <polygon points="260,328 350,361 260,394 170,361" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">a == m ？</text>

  <path d="M350,361 L382,361" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="353" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="386" y="343" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="438" y="366" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>

  <path d="M170,361 L138,361" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="353" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="343" width="106" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="83" y="366" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <path d="M260,394 L260,408" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="260" cy="428" rx="42" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="433" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">结束</text>
</svg>
