<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 数轴视角：A = [16, 33]，B = [4, 18]，k = 15</text>

  <!-- 图例 -->
  <circle cx="96" cy="44" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="108" y="48" font-size="10" fill="#4a6a3e" filter="url(#rough2)">B：b="squirrel" 的匹配起点</text>
  <circle cx="308" cy="44" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="48" font-size="10" fill="#4a5f78" filter="url(#rough2)">A：a="my" 的匹配起点</text>

  <!-- 窗口带 -->
  <rect x="70" y="84" width="319" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="230" y="97" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">i = 16 的窗口 [1, 31]</text>

  <rect x="251" y="112" width="318" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="410" y="125" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">i = 33 的窗口 [18, 48]</text>

  <!-- 数轴 -->
  <path d="M 55 152 L 592 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 60 146 L 60 158 M 166 146 L 166 158 M 272 146 L 272 158 M 378 146 L 378 158 M 484 146 L 484 158 M 590 146 L 590 158" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="166" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="272" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">20</text>
  <text x="378" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">30</text>
  <text x="484" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">40</text>
  <text x="590" y="172" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">50</text>

  <!-- 窗口端点虚线 -->
  <path d="M 70 101 L 70 146" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 389 101 L 389 146" stroke="#d6a040" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 251 129 L 251 146" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 569 129 L 569 146" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- B 点 -->
  <circle cx="102" cy="152" r="7" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="102" y="156" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">b</text>
  <circle cx="251" cy="152" r="7" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="251" y="156" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">b</text>

  <!-- A 点 -->
  <circle cx="230" cy="152" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="230" y="156" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">a</text>
  <circle cx="410" cy="152" r="7" fill="#446688" filter="url(#rough2)"/>
  <text x="410" y="156" text-anchor="middle" font-size="8" fill="#ffffff" filter="url(#rough2)">a</text>

  <!-- 点标签 -->
  <text x="102" y="192" text-anchor="middle" font-size="10" fill="#4a6a3e" filter="url(#rough2)">B[0] = 4</text>
  <text x="230" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">i = 16</text>
  <text x="251" y="212" text-anchor="middle" font-size="10" fill="#4a6a3e" filter="url(#rough2)">B[1] = 18</text>
  <text x="410" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">i = 33</text>
  <path d="M 251 199 L 251 204" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <!-- 双指针走位 -->
  <rect x="46" y="228" width="528" height="72" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="250" font-size="10.5" fill="#333" filter="url(#rough2)">① i = 16：p = 0，B[0] = 4 已在窗 [1, 31] 内 → 4 ≤ 31 ✓ 收 16（p 不动）</text>
  <text x="62" y="270" font-size="10.5" fill="#333" filter="url(#rough2)">② i = 33：B[0] = 4 &lt; 18 出左窗 → p 前进到 1；B[1] = 18 ≤ 48 ✓ 收 33</text>
  <text x="62" y="290" font-size="10" fill="#666" filter="url(#rough2)">窗口左端 i −k 随 i 单调不减 → 出窗的 B[p] 永久出局，p 全程只前进了 1 步</text>

  <!-- 结果框 -->
  <rect x="46" y="312" width="528" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">ans = [16, 33] —— 与官方输出一致 ✓</text>
</svg>
