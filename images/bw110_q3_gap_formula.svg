<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">相邻出现的间隔 g：最坏位置在间隔正中，耗时 ⌊g/2⌋</text>

  <!-- 展开的环 -->
  <g filter="url(#rough2)">
    <text x="60" y="62" font-size="12.5" fill="#555">把环从值 v 的一个出现处剪开展平（示例：v 在位置 p 和 p+g）：</text>
    <g>
      <rect x="80" y="78" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="100" y="103" text-anchor="middle" font-size="13" fill="#b85450">v</text>
      <text x="100" y="134" text-anchor="middle" font-size="10" fill="#888">p</text>
      <rect x="120" y="78" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="140" y="103" text-anchor="middle" font-size="12" fill="#888">·</text>
      <rect x="160" y="78" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
      <text x="180" y="103" text-anchor="middle" font-size="13" fill="#1d5c1a">q*</text>
      <text x="180" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">中点</text>
      <rect x="200" y="78" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="220" y="103" text-anchor="middle" font-size="12" fill="#888">·</text>
      <rect x="240" y="78" width="40" height="40" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
      <text x="260" y="103" text-anchor="middle" font-size="12" fill="#888">·</text>
      <rect x="280" y="78" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="300" y="103" text-anchor="middle" font-size="13" fill="#b85450">v</text>
      <text x="300" y="134" text-anchor="middle" font-size="10" fill="#888">p+g</text>
    </g>
    <!-- 间隔标注 -->
    <path d="M 84 152 L 316 152" stroke="#446688" stroke-width="1.6"/>
    <path d="M 84 146 L 84 158 M 316 146 L 316 158" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="170" text-anchor="middle" font-size="12.5" fill="#446688">间隔 g（环上相邻两次出现之间的距离）</text>
    <!-- 中点距离 -->
    <path d="M 100 58 C 100 48, 180 44, 180 52" stroke="#4a7a3a" stroke-width="0" fill="none"/>
    <path d="M 104 158 C 130 182, 150 186, 172 186" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)"/>
    <text x="140" y="200" font-size="11.5" fill="#4a7a3a">⌈g/2⌉ ≈ ⌊g/2⌋</text>
    <text x="60" y="222" font-size="12" fill="#555">中点离两侧的 v 都是 ⌊g/2⌋ 格，是最后一个被“感染”的位置</text>
  </g>

  <!-- 公式面板 -->
  <g filter="url(#rough2)">
    <rect x="36" y="240" width="448" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="266" font-size="13" fill="#8a6d1f">设值 v 出现于 p₁ &lt; p₂ &lt; … &lt; p_k（含环绕间隔 p₁ + n − p_k）：</text>
    <text x="260" y="294" text-anchor="middle" font-size="14" fill="#333">time(v) = max over 相邻间隔 g 的 ⌊g/2⌋</text>
    <text x="260" y="324" text-anchor="middle" font-size="12.5" fill="#555">答案 = min over v 的 time(v)；只出现一次时 g = n（整圈）</text>
  </g>
</svg>
