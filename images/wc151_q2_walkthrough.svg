<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例 2 演算：queries = ["bbb","cc"]，words = ["a","aa","aaa","aaaa"]</text>

  <rect x="24" y="42" width="250" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="62" font-size="10.5" fill="#3a4a66" font-weight="bold">① 逐个词算 f(W)</text>

  <g filter="url(#rough2)" font-size="10" fill="#333">
    <text x="46" y="86">a</text>
    <text x="90" y="86">最小字母 'a'，出现 1 次</text>
    <text x="212" y="86" font-weight="bold">f = 1</text>

    <text x="46" y="112">aa</text>
    <text x="90" y="112">最小字母 'a'，出现 2 次</text>
    <text x="212" y="112" font-weight="bold">f = 2</text>

    <text x="46" y="138">aaa</text>
    <text x="90" y="138">最小字母 'a'，出现 3 次</text>
    <text x="212" y="138" font-weight="bold">f = 3</text>

    <text x="46" y="164">aaaa</text>
    <text x="90" y="164">最小字母 'a'，出现 4 次</text>
    <text x="212" y="164" font-weight="bold">f = 4</text>
  </g>
  <text x="40" y="184" font-size="9" fill="#667">四个词都是单字母串，f 就等于串长</text>

  <path d="M 278 118 L 302 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="42" width="286" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="326" y="62" font-size="10.5" fill="#3a5a30" font-weight="bold">② 排序得到 freq（m = 4）</text>

  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="356" y="84">0</text>
    <text x="412" y="84">1</text>
    <text x="468" y="84">2</text>
    <text x="524" y="84">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="90" width="52" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="386" y="90" width="52" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="442" y="90" width="52" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="498" y="90" width="52" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="356" y="113">1</text>
    <text x="412" y="113">2</text>
    <text x="468" y="113">3</text>
    <text x="524" y="113">4</text>
  </g>

  <text x="326" y="146" font-size="9.5" fill="#555">原本已是升序，排序后仍是 [1, 2, 3, 4]</text>
  <text x="326" y="164" font-size="9.5" fill="#555">m = 4：后面查表只需要这一个数组</text>
  <text x="326" y="182" font-size="9.5" fill="#555">pos = 4 时答案 0，pos = 0 时答案 4</text>

  <rect x="24" y="206" width="572" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="228" font-size="10.5" fill="#8a6a20" font-weight="bold">query "bbb"：f = 3（最小字母 'b' 出现 3 次）</text>
  <text x="40" y="248" font-size="10" fill="#555">第一个 &gt; 3 的元素是下标 3 的 4 → pos = 3，答案 = 4 − 3 = 1</text>

  <g filter="url(#rough2)">
    <rect x="408" y="224" width="27" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="437" y="224" width="27" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="466" y="224" width="27" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="495" y="224" width="27" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <path d="M 495 220 L 495 250" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#333" text-anchor="middle">
    <text x="421" y="239">1</text>
    <text x="450" y="239">2</text>
    <text x="479" y="239">3</text>
    <text x="508" y="239">4</text>
  </g>
  <text x="495" y="218" font-size="8.5" fill="#b85450" text-anchor="middle">pos=3</text>

  <rect x="24" y="276" width="572" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="298" font-size="10.5" fill="#3a4a66" font-weight="bold">query "cc"：f = 2（最小字母 'c' 出现 2 次）</text>
  <text x="40" y="318" font-size="10" fill="#555">第一个 &gt; 2 的元素是下标 2 的 3 → pos = 2，答案 = 4 − 2 = 2</text>

  <g filter="url(#rough2)">
    <rect x="408" y="294" width="27" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="437" y="294" width="27" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="466" y="294" width="27" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="495" y="294" width="27" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <path d="M 466 290 L 466 320" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 3" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#333" text-anchor="middle">
    <text x="421" y="309">1</text>
    <text x="450" y="309">2</text>
    <text x="479" y="309">3</text>
    <text x="508" y="309">4</text>
  </g>
  <text x="466" y="288" font-size="8.5" fill="#b85450" text-anchor="middle">pos=2</text>

  <rect x="24" y="346" width="572" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="366" font-size="10.5" fill="#3a5a30" font-weight="bold">answer = [1, 2]，与官方输出一致</text>
  <text x="40" y="382" font-size="9.5" fill="#555">注意 f = 3 与 freq 中的 3 相等时不算「严格大于」，所以 "aaa" 不被 "bbb" 计入</text>
</svg>
