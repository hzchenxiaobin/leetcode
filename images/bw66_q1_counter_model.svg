<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="105"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">双条件计数：在两个数组中都"恰好出现一次"</text>

  <!-- 两个数组 -->
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">words1 = [leetcode, is, amazing, as, is]</text>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">words2 = [amazing, leetcode, is]</text>

  <!-- 哈希表1 -->
  <text x="140" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">Counter(words1)</text>
  <g filter="url(#rough2)">
    <rect x="52" y="124" width="176" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="52" y="162" width="176" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="52" y="200" width="176" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="52" y="238" width="176" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="140" y="146" fill="#446688">leetcode → 1</text>
    <text x="140" y="184" fill="#446688">amazing → 1</text>
    <text x="140" y="222" fill="#b85450" font-weight="bold">is → 2</text>
    <text x="140" y="260" fill="#446688">as → 1</text>
  </g>

  <!-- 中间判定 -->
  <path d="M 232 179 Q 262 179 288 179" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两边都 =1 ?</text>

  <!-- 哈希表2 -->
  <text x="420" y="112" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">Counter(words2)</text>
  <g filter="url(#rough2)">
    <rect x="332" y="124" width="176" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="332" y="162" width="176" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="332" y="200" width="176" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="420" y="146" fill="#d6a040">leetcode → 1</text>
    <text x="420" y="184" fill="#d6a040">amazing → 1</text>
    <text x="420" y="222" fill="#d6a040">is → 1</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="52" y="288" width="228" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="288" width="228" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="166" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ leetcode、amazing 计入</text>
  <text x="414" y="310" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ is（words1 出现 2 次）、as（不在 words2）</text>
</svg>
