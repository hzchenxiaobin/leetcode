<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：s = "10009998"（示例 4）—— 首段 1 ✗ → 10 ✗ → 100 ✓</text>

  <!-- 图例 -->
  <rect x="92" y="40" width="11" height="11" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">首段</text>
  <rect x="146" y="40" width="11" height="11" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="162" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">匹配成功</text>
  <rect x="216" y="40" width="11" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="232" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">匹配但下层失败</text>
  <rect x="316" y="40" width="11" height="11" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="332" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">超期望剪枝</text>
  <rect x="396" y="40" width="11" height="11" rx="2" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="412" y="50" font-size="9.5" fill="#666" filter="url(#rough2)">未扫到</text>

  <!-- ===== 行 A：首段 "1" ===== -->
  <rect x="14" y="64" width="70" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="76" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">A 首段「1」</text>
  <text x="49" y="88" text-anchor="middle" font-size="9" fill="#2b4b6b" filter="url(#rough2)">v=1 expect=0</text>

  <rect x="92" y="64" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="129" y="64" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="166" y="64" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="203" y="64" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="64" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="277" y="64" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="314" y="64" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="351" y="64" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="109" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">1</text>
  <text x="146" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="183" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="220" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="257" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="294" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="331" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="368" y="84" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">8</text>

  <text x="146" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="183" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="220" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="257" y="106" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="238" y="122" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「0」「00」「000」都 = 0 = expect ✓，但下层 expect = −1 无解</text>
  <text x="238" y="138" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「0009」= 9 &gt; expect → break（单调剪枝）</text>

  <rect x="393" y="62" width="114" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 失败</text>
  <text x="450" y="90" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">expect=0 层无解</text>

  <path d="M 49 98 L 49 162" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="46" y="134" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">换首段</text>

  <!-- ===== 行 B：首段 "10" ===== -->
  <rect x="14" y="166" width="70" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="178" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">B 首段「10」</text>
  <text x="49" y="190" text-anchor="middle" font-size="9" fill="#2b4b6b" filter="url(#rough2)">v=10 expect=9</text>

  <rect x="92" y="166" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="129" y="166" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="166" y="166" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="203" y="166" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="166" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="277" y="166" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="314" y="166" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="351" y="166" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="109" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">1</text>
  <text x="146" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">0</text>
  <text x="183" y="186" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="220" y="186" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="257" y="186" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="294" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="331" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">9</text>
  <text x="368" y="186" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">8</text>

  <text x="183" y="208" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="220" y="208" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="257" y="208" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="294" y="208" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="238" y="224" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「009」= 9 = expect ✓ → 下层 expect = 8：「9」= 9 &gt; 8 ✗</text>
  <text x="238" y="240" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">回溯同层延长：「0099」= 99 &gt; 9 → break ✗</text>

  <rect x="393" y="164" width="114" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 失败</text>
  <text x="450" y="192" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">下层 9 ≠ 8</text>

  <path d="M 49 200 L 49 264" stroke="#888888" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="46" y="236" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">换首段</text>

  <!-- ===== 行 C：首段 "100" ===== -->
  <rect x="14" y="268" width="70" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="280" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">C 首段「100」</text>
  <text x="49" y="292" text-anchor="middle" font-size="9" fill="#2b4b6b" filter="url(#rough2)">v=100 expect=99</text>

  <rect x="92" y="268" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="129" y="268" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="166" y="268" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="203" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="277" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="351" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="109" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">1</text>
  <text x="146" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">0</text>
  <text x="183" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">0</text>
  <text x="220" y="288" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <text x="257" y="288" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="294" y="288" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="331" y="288" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">9</text>
  <text x="368" y="288" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">8</text>

  <text x="220" y="310" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="257" y="310" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>
  <text x="294" y="310" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">99</text>
  <text x="331" y="310" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>
  <text x="368" y="310" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">98</text>
  <text x="238" y="326" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「099」= 99 ✓ → 下层 expect = 98：「98」= 98 ✓ → 到串尾</text>
  <text x="238" y="342" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">整串恰好匹配完 → return true ✔</text>

  <rect x="393" y="266" width="114" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ true</text>
  <text x="450" y="294" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">[100, 99, 98]</text>

  <!-- 底部要点 -->
  <rect x="36" y="356" width="448" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b27a10" filter="url(#rough2)">回溯与剪枝的关键</text>
  <text x="260" y="394" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">val == expect 的终点可能不止一个（前导零）—— 一个失败要继续试更长终点</text>
  <text x="260" y="410" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">首段失败 → 回溯外层换终点；expect &lt; 0 或 val &gt; expect → 立即剪枝</text>
</svg>
