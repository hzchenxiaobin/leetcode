<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="408" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">每格维护「可达异或值集合」，从上、左两格合并</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid = [[1,2],[3,4]]；只有两条路径，答案 min(7,6) = 6</text>
  <rect x="150" y="78" width="92" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="196.0" y="104" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">grid = 1</text>
  <text x="196.0" y="126" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">{1}</text>
  <rect x="262" y="78" width="92" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="308.0" y="104" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">grid = 2</text>
  <text x="308.0" y="126" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">{3}</text>
  <rect x="150" y="174" width="92" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="196.0" y="200" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">grid = 3</text>
  <text x="196.0" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">{2}</text>
  <rect x="262" y="174" width="92" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="308.0" y="200" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">grid = 4</text>
  <text x="308.0" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">{7, 6}</text>
  <text x="196.0" y="74" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">起点</text>
  <path d="M 246 109 L 258 109" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="100" text-anchor="start" font-size="8.5" fill="#3a5a30" filter="url(#rough2)">1^2=3</text>
  <path d="M 196.0 144 L 196.0 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="202.0" y="162" text-anchor="start" font-size="8.5" fill="#3a5a30" filter="url(#rough2)">1^3=2</text>
  <path d="M 308.0 144 L 308.0 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="314.0" y="162" text-anchor="start" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">3^4=7</text>
  <path d="M 246 205 L 258 205" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="252" y="196" text-anchor="start" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">2^4=6</text>
  <rect x="36" y="268" width="488" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="288" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">状态转移</text>
  <text x="48" y="306" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">dp[i][j] = { x ^ grid[i][j] : x ∈ dp[i-1][j] ∪ dp[i][j-1] }</text>
  <text x="48" y="324" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">起点单独处理：dp[0][0] = { grid[0][0] }</text>
  <rect x="36" y="334" width="488" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="354" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="48" y="371" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">终点集合 {7, 6} 里的最小值 6 就是最小可能异或值</text>
  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">集合里可能的值不超过 2^10 = 1024 个（grid[i][j] ≤ 1023），所以状态量可控</text>
</svg>
