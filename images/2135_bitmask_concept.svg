<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：单词 ↔ 26 位掩码，一次转换 = 掩码恰多一个 1</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: word -> set -> bitmask ====== -->
  <text x="48" y="74" font-size="12.5" font-weight="bold" fill="#446688">① 编码：字母互异 ⇒ 单词 ↔ 字母集合 ↔ 26 位掩码（一一对应）</text>
  <g filter="url(#sk)">
    <rect x="48" y="84" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="74" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">act</text>
  <path d="M 104 101 L 128 101" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="134" y="84" width="86" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="177" y="106" text-anchor="middle" font-size="13" fill="#333">{a,c,t}</text>
  <path d="M 224 101 L 248 101" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <!-- 26 bit cells, 13px each -->
    <rect x="254" y="84" width="13" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="267" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="280" y="84" width="13" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="293" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="306" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="319" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="332" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="345" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="358" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="371" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="384" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="397" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="410" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="423" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="436" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="449" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="462" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="475" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="488" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="501" y="84" width="13" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="514" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="527" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="540" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="553" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="566" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <rect x="579" y="84" width="13" height="34" fill="#fff" stroke="#ccc" stroke-width="1"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="260.5" y="105">a</text>
    <text x="286.5" y="105">c</text>
    <text x="507.5" y="105">t</text>
  </g>
  <text x="258" y="132" font-size="9" fill="#999">bit 0</text>
  <text x="592" y="132" font-size="9" fill="#999" text-anchor="end">bit 25</text>
  <text x="423" y="152" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">mask = (1&lt;&lt;0) | (1&lt;&lt;2) | (1&lt;&lt;19)</text>

  <!-- ====== Section 2: transform in mask view ====== -->
  <text x="48" y="186" font-size="12.5" font-weight="bold" fill="#446688">② 一次转换的两步，在掩码层面只剩一件事：多一个 1</text>
  <g filter="url(#sk)">
    <rect x="70" y="200" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="270" y="200" width="62" height="36" rx="4" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="470" y="200" width="62" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="96" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">act</text>
  <text x="301" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">act<tspan fill="#d6a040">k</tspan></text>
  <text x="501" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">tack</text>
  <path d="M 126 218 L 264 218" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 336 218 L 464 218" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="195" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">追加 k（不在集合中）</text>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#555">任意重排</text>
  <text x="400" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">掩码不变</text>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="96" y="256">{a,c,t}</text>
    <text x="301" y="256">{a,c,t,k}</text>
    <text x="501" y="256">{a,c,t,k}</text>
  </g>
  <text x="560" y="256" font-size="10" fill="#d6a040" font-weight="bold">= 与 actk 相同！</text>

  <!-- ====== Section 3: decision box ====== -->
  <g filter="url(#sk)">
    <rect x="48" y="286" width="584" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="312" text-anchor="middle" font-size="12.5" fill="#333">判定：t 可由 s 转换 ⇔ mask(s) = mask(t) 去掉<b>恰好一个</b> 1 位</text>
  <text x="340" y="338" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">查询：枚举 mask(t) 的每个 1 位 b，看 mask(t) ^ (1&lt;&lt;b) 是否落在 start 掩码集合中</text>
  <text x="340" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a">长度恰差 1、「追加字母不在 s 中」这两个约束自动成立，无需显式检查</text>

  <!-- ====== callout ====== -->
  <g filter="url(#sk)">
    <rect x="55" y="382" width="570" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">互异字母是全部前提：它让「追加 + 重排」坍缩成「置一个位」</text>
  <text x="340" y="422" text-anchor="middle" font-size="11.5" fill="#444">重排被掩码吸收，每个 target 的判定只剩 ≤ 26 次整数哈希查询</text>
</svg>
