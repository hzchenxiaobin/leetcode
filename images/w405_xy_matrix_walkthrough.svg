<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="510" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：6 个候选右下角，3 个合法</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- original grid 2x3, origin (52,88), cell 52 -->
  <text x="52" y="70" font-size="13" font-weight="bold" fill="#2b2b2b">原矩阵（2×3）</text>
  <text x="78"  y="84" text-anchor="middle" font-size="10.5" fill="#999">j=0</text>
  <text x="130" y="84" text-anchor="middle" font-size="10.5" fill="#999">j=1</text>
  <text x="182" y="84" text-anchor="middle" font-size="10.5" fill="#999">j=2</text>
  <text x="46" y="120" text-anchor="end" font-size="10.5" fill="#999">i=0</text>
  <text x="46" y="172" text-anchor="end" font-size="10.5" fill="#999">i=1</text>

  <g filter="url(#sk)">
    <rect x="52"  y="88"  width="52" height="52" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="104" y="88"  width="52" height="52" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="156" y="88"  width="52" height="52" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1.2"/>
    <rect x="52"  y="140" width="52" height="52" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="104" y="140" width="52" height="52" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1.2"/>
    <rect x="156" y="140" width="52" height="52" rx="3" fill="#ffffff" stroke="#c9c4b8" stroke-width="1.2"/>
  </g>
  <text x="78"  y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b5a88">X</text>
  <text x="130" y="120" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="182" y="120" text-anchor="middle" font-size="18" fill="#999">.</text>
  <text x="78"  y="172" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="130" y="172" text-anchor="middle" font-size="18" fill="#999">.</text>
  <text x="182" y="172" text-anchor="middle" font-size="18" fill="#999">.</text>

  <!-- three valid candidates -->
  <text x="52" y="224" font-size="12.5" font-weight="bold" fill="#2e6e2e">三个合法候选：</text>

  <g filter="url(#sk)" fill="#f4f2ec" stroke="#d5d0c4" stroke-width="1">
    <rect x="52" y="232" width="27" height="27"/><rect x="79" y="232" width="27" height="27"/><rect x="106" y="232" width="27" height="27"/>
    <rect x="52" y="259" width="27" height="27"/><rect x="79" y="259" width="27" height="27"/><rect x="106" y="259" width="27" height="27"/>
  </g>
  <rect x="52" y="232" width="54" height="27" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="65" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">X</text>
  <text x="92" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="119" y="251" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="65" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="92" y="278" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="119" y="278" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="150" y="252" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 右下角 (0,1)：X=1, Y=1</text>

  <g filter="url(#sk)" fill="#f4f2ec" stroke="#d5d0c4" stroke-width="1">
    <rect x="52" y="304" width="27" height="27"/><rect x="79" y="304" width="27" height="27"/><rect x="106" y="304" width="27" height="27"/>
    <rect x="52" y="331" width="27" height="27"/><rect x="79" y="331" width="27" height="27"/><rect x="106" y="331" width="27" height="27"/>
  </g>
  <rect x="52" y="304" width="81" height="27" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="65" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">X</text>
  <text x="92" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="119" y="323" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="65" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="92" y="350" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="119" y="350" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="150" y="324" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 右下角 (0,2)：X=1, Y=1</text>

  <g filter="url(#sk)" fill="#f4f2ec" stroke="#d5d0c4" stroke-width="1">
    <rect x="52" y="376" width="27" height="27"/><rect x="79" y="376" width="27" height="27"/><rect x="106" y="376" width="27" height="27"/>
    <rect x="52" y="403" width="27" height="27"/><rect x="79" y="403" width="27" height="27"/><rect x="106" y="403" width="27" height="27"/>
  </g>
  <rect x="52" y="376" width="27" height="54" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="65" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">X</text>
  <text x="92" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="119" y="395" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="65" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Y</text>
  <text x="92" y="422" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="119" y="422" text-anchor="middle" font-size="13" fill="#aaa">.</text>
  <text x="150" y="396" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 右下角 (1,0)：X=1, Y=1</text>

  <!-- walk table -->
  <g filter="url(#sk)">
    <rect x="300" y="88" width="312" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="300" y="118" width="312" height="29" fill="#ffffff" stroke="#d8d3c8" stroke-width="1"/>
    <rect x="300" y="147" width="312" height="29" fill="#eef7ef" stroke="#d8d3c8" stroke-width="1"/>
    <rect x="300" y="176" width="312" height="29" fill="#eef7ef" stroke="#d8d3c8" stroke-width="1"/>
    <rect x="300" y="205" width="312" height="29" fill="#eef7ef" stroke="#d8d3c8" stroke-width="1"/>
    <rect x="300" y="234" width="312" height="29" fill="#ffffff" stroke="#d8d3c8" stroke-width="1"/>
    <rect x="300" y="263" width="312" height="29" fill="#ffffff" stroke="#d8d3c8" stroke-width="1"/>
    <line x1="384" y1="88" x2="384" y2="292" stroke="#d8d3c8" stroke-width="1"/>
    <line x1="436" y1="88" x2="436" y2="292" stroke="#d8d3c8" stroke-width="1"/>
    <line x1="488" y1="88" x2="488" y2="292" stroke="#d8d3c8" stroke-width="1"/>
  </g>
  <text x="342" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">右下角 (i,j)</text>
  <text x="410" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">X 数</text>
  <text x="462" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">Y 数</text>
  <text x="550" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">判定</text>

  <text x="342" y="137" text-anchor="middle" font-size="12.5" fill="#333">(0,0)</text>
  <text x="410" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="550" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038">✗</text>

  <text x="342" y="166" text-anchor="middle" font-size="12.5" fill="#333">(0,1)</text>
  <text x="410" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="550" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>

  <text x="342" y="195" text-anchor="middle" font-size="12.5" fill="#333">(0,2)</text>
  <text x="410" y="195" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="195" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="550" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>

  <text x="342" y="224" text-anchor="middle" font-size="12.5" fill="#333">(1,0)</text>
  <text x="410" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="550" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>

  <text x="342" y="253" text-anchor="middle" font-size="12.5" fill="#333">(1,1)</text>
  <text x="410" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="550" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038">✗</text>

  <text x="342" y="282" text-anchor="middle" font-size="12.5" fill="#333">(1,2)</text>
  <text x="410" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a88">1</text>
  <text x="462" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="550" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038">✗</text>

  <!-- failure notes -->
  <g filter="url(#sk)">
    <rect x="300" y="312" width="312" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="456" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06a10">败因盘点：</text>
  <text x="456" y="353" text-anchor="middle" font-size="11.5" fill="#8a6d2e">(0,0)：只有 X（1 ≠ 0）</text>
  <text x="456" y="371" text-anchor="middle" font-size="11.5" fill="#8a6d2e">(1,1)、(1,2)：第二行多一个 Y（1 ≠ 2）</text>
  <text x="456" y="389" text-anchor="middle" font-size="11.5" fill="#8a6d2e">若全 '.'：X=Y=0，但「至少一个 X」失败</text>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="170" y="440" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="469" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">答案 ans = 3，与示例输出一致 ✓</text>
</svg>
