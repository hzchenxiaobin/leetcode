<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举被移动的会议 i，O(1) 判定能否寄存</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 i 只产生一个候选值，取所有候选中最大的即可</text>

  <rect x="40" y="66" width="230" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="155" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 预处理空档与长度</text>
  <text x="155" y="103" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">gap[0..n]，len[i] = end − start</text>

  <path d="M 270 89 L 306 89" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="66" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 前后缀最大值</text>
  <text x="430" y="103" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">pre[i] = max gap[0..i]　suf[i] = max gap[i..n]</text>

  <path d="M 430 112 L 430 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="140" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">③ 枚举 i = 0 .. n−1</text>
  <text x="430" y="177" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">merged = gap[i] + len[i] + gap[i+1]</text>

  <path d="M 430 186 L 430 206" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="430,210 520,244 430,278 340,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="240" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">max(gap[j]),</text>
  <text x="430" y="256" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">j ∉ {i, i+1} ≥ len[i] ?</text>

  <path d="M 340 244 L 236 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="236" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="40" y="222" width="192" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="136" y="241" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">装不下 → 贴进合并段</text>
  <text x="136" y="258" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">cand = gap[i] + gap[i+1]</text>

  <path d="M 520 244 L 560 244 L 560 316 L 470 316" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="536" y="236" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="250" y="292" width="216" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="358" y="311" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">塞进空档 j → 合并段完整空出</text>
  <text x="358" y="328" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">cand = merged</text>

  <path d="M 358 336 L 358 352 L 300 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 136 266 L 136 352 L 230 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="360" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="379" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans = max(所有 cand)；O(n) 时间、O(n) 空间</text>

  <text x="300" y="58" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意：判断"装得下"时排除 merged 内部的两段空档；没有任何别的空档时视为 0</text>
</svg>
