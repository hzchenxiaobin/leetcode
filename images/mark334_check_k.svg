<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">check(k)：前 k 小 × 后 k 大按序配对</text>
  <text x="340" y="56" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">以示例 1 排序后 [2, 3, 4, 5]（n = 4）为例 —— 这正是二分答案的判定条件</text>

  <text x="105" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#444" filter="url(#rough2)">k = 1</text>
  <g filter="url(#rough2)">
    <rect x="140" y="108" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="202" y="108" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="264" y="108" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="326" y="108" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="166" y="130" font-weight="bold">2</text>
    <text x="228" y="130" fill="#999">3</text>
    <text x="290" y="130" fill="#999">4</text>
    <text x="352" y="130" font-weight="bold">5</text>
  </g>
  <path d="M 166 106 Q 259 76 350 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="259" y="96" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">2×2 = 4 ≤ 5 ✓</text>
  <text x="430" y="130" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">check(1) = true ✓</text>

  <text x="105" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#444" filter="url(#rough2)">k = 2</text>
  <g filter="url(#rough2)">
    <rect x="140" y="180" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="202" y="180" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="264" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="326" y="180" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="166" y="202" font-weight="bold">2</text>
    <text x="228" y="202" font-weight="bold">3</text>
    <text x="290" y="202" font-weight="bold">4</text>
    <text x="352" y="202" font-weight="bold">5</text>
  </g>
  <path d="M 166 178 Q 228 152 288 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="172" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">4 ≤ 4 ✓</text>
  <path d="M 228 176 Q 292 142 354 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">2×3 = 6 &gt; 5 ✗</text>
  <text x="430" y="202" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">check(2) = false ✗</text>

  <g filter="url(#rough2)">
    <rect x="90" y="240" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="220" y="240" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="350" y="240" width="110" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="145" y="264" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">k = 0 → ✓</text>
  <text x="275" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">k = 1 → ✓</text>
  <text x="405" y="264" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">k = 2 → ✗</text>
  <path d="M 462 259 L 490 259" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="496" y="240" width="160" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="576" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">最大 k* = 1</text>
  <text x="576" y="273" text-anchor="middle" font-size="12.5" fill="#2c4d70" filter="url(#rough2)">答案 2k* = 2</text>

  <g filter="url(#rough2)">
    <rect x="60" y="300" width="560" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6210" filter="url(#rough2)">单调性：k 对可行 ⇒ k−1 对也可行（丢掉最靠后的一对即可）</text>
  <text x="340" y="344" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">谓词随 k 呈 ✓✓…✓✗✗…✗ —— 可二分找最后一个 ✓；双指针则一趟直接求出最大 k</text>

  <g filter="url(#rough2)">
    <rect x="60" y="370" width="560" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">鸽穴核心（定理 1 的关键一步）</text>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">若某处 2·v_t &gt; v_{n−k+t}：后 k 大里最小的 t+1 个都 &lt; 2·v_t，只能配值 &lt; v_t 的小值</text>
  <text x="340" y="432" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">而值 &lt; v_t 的小值至多 t 个 —— t+1 个大值装不进 t 个小值，矛盾</text>
</svg>
