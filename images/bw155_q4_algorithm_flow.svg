<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="350" fill="#fafafa"/>
<text x="260" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">位掩码 DP 的枚举流程</text>
<rect x="130" y="48" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="260" y="73" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">mask 从 0 枚举到 2ⁿ−1</text>
<path d="M260,86 L260,110" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="130" y="110" width="260" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="260" y="135" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp[mask] 有效？无效则跳过</text>
<path d="M260,148 L260,172" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="130" y="172" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="260" y="197" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">pos = popcount(mask) + 1</text>
<path d="M260,210 L260,234" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="80" y="234" width="360" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="260" y="259" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">枚举 v ∉ mask 且 (pre[v] &amp; mask) == pre[v]</text>
<path d="M260,272 L260,296" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="60" y="296" width="400" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
<text x="260" y="321" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp[mask | 1&lt;&lt;v] = max(…, dp[mask] + score[v]·pos)</text>
</svg>
