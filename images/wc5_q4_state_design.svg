<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态 = (石子下标 i, 上一跳 k)：来路不同，去路就不同</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点记 (0, 0)：k−1 = −1 越界、k = 0 原地，只剩 k+1 = 1 ——「第一步必须跳 1」是转移规则的自然推论</text>

  <!-- 来路 A：石子 5，k = 2 -->
  <g filter="url(#rough2)">
    <rect x="48" y="88" width="144" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="120" y="108" text-anchor="middle" font-size="11" fill="#3a4a66">石子 5（i = 3）</text>
    <text x="120" y="125" text-anchor="middle" font-size="10.5" fill="#3a4a66">到达时 k = 2</text>
    <text x="120" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a">跳 1 格 → 石子 6</text>
  </g>

  <!-- 来路 B：石子 3，k = 2 -->
  <g filter="url(#rough2)">
    <rect x="48" y="278" width="144" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="120" y="298" text-anchor="middle" font-size="11" fill="#3a4a66">石子 3（i = 2）</text>
    <text x="120" y="315" text-anchor="middle" font-size="10.5" fill="#3a4a66">到达时 k = 2</text>
    <text x="120" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">跳 3 格 → 石子 6</text>
  </g>

  <!-- 汇合状态 -->
  <g filter="url(#rough2)">
    <rect x="250" y="186" width="124" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="312" y="208" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">石子 6（i = 4）</text>
    <text x="312" y="227" text-anchor="middle" font-size="11" fill="#8a6a20">k ∈ {1, 3}</text>
  </g>

  <!-- 去路：k = 1 出发 -->
  <g filter="url(#rough2)">
    <rect x="428" y="86" width="192" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="442" y="108" font-size="10.5" fill="#3a5a30" font-weight="bold">从 k = 1 出发</text>
    <text x="442" y="127" font-size="10" fill="#555">候选 0 / 1 / 2，0 非法 → {1, 2}</text>
    <text x="442" y="145" font-size="10" fill="#555">7 是水，8 是石子</text>
  </g>

  <!-- 去路：k = 3 出发 -->
  <g filter="url(#rough2)">
    <rect x="428" y="262" width="192" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="442" y="284" font-size="10.5" fill="#3a5a30" font-weight="bold">从 k = 3 出发</text>
    <text x="442" y="303" font-size="10" fill="#555">候选 {2, 3, 4}</text>
    <text x="442" y="321" font-size="10" fill="#555">8 是石子，9 / 10 是水</text>
  </g>

  <!-- 箭头 -->
  <path d="M 192 118 C 210 140 224 168 246 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 310 C 210 288 224 260 246 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 374 196 C 396 182 404 160 424 142" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 374 226 C 396 240 404 262 424 280" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">同一个位置，k = 1 只够到 7 / 8，k = 3 能到 8 / 9 / 10 —— 只记「站在哪」会丢掉这层信息</text>
</svg>
