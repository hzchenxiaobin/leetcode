<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">什么时候能提取一个工件？</text>
  <path d="M 160 44 Q 320 54 480 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#888">示例 1：n = 2，dig = [(0,0), (0,1)]，挖掘格标 D</text>

  <!-- 2x2 网格 -->
  <g filter="url(#sk)">
    <rect x="90" y="100" width="72" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="126" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">A</text>
  <text x="126" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038" filter="url(#sk)">D</text>

  <g filter="url(#sk)">
    <rect x="162" y="100" width="72" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="198" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#33475e" filter="url(#sk)">B</text>
  <text x="198" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">D</text>

  <g filter="url(#sk)">
    <rect x="90" y="172" width="72" height="72" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="126" y="212" text-anchor="middle" font-size="14" fill="#999" filter="url(#sk)">空</text>

  <g filter="url(#sk)">
    <rect x="162" y="172" width="72" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="198" y="192" text-anchor="middle" font-size="16" font-weight="bold" fill="#33475e" filter="url(#sk)">B</text>
  <text x="198" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">缺 D</text>

  <!-- 坐标标签 -->
  <text x="126" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">c=0</text>
  <text x="198" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">c=1</text>
  <text x="76" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">r=0</text>
  <text x="76" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">r=1</text>

  <!-- 工件判定结果 -->
  <g filter="url(#sk)">
    <rect x="56" y="292" width="210" height="44" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="161" y="311" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">工件 A：1/1 格被挖 ✓</text>
  <text x="161" y="328" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">全部裸露，可提取</text>

  <g filter="url(#sk)">
    <rect x="56" y="348" width="210" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="161" y="367" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">工件 B：1/2 格被挖 ✗</text>
  <text x="161" y="384" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">(1,1) 未挖，不可提取</text>

  <!-- 右侧核心结论 -->
  <g filter="url(#sk)">
    <rect x="310" y="104" width="290" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="455" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">提取条件（核心）</text>
  <text x="455" y="158" text-anchor="middle" font-size="12.5" fill="#556" filter="url(#sk)">工件可提取 ⟺ 覆盖的每个格子都被挖</text>
  <text x="455" y="182" text-anchor="middle" font-size="12.5" fill="#556" filter="url(#sk)">矩形 [r1..r2] × [c1..c2] 内不许有漏网之鱼</text>
  <text x="455" y="208" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">「至少挖到一格」是不够的！</text>

  <g filter="url(#sk)">
    <rect x="310" y="244" width="290" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="455" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">关键约束：每工件最多 4 格</text>
  <text x="455" y="294" text-anchor="middle" font-size="12.5" fill="#556" filter="url(#sk)">1×1、1×2、2×1、1×3、3×1、1×4、4×1、2×2</text>
  <text x="455" y="318" text-anchor="middle" font-size="12.5" fill="#556" filter="url(#sk)">⇒ 逐工件检查只要 O(4)，怎么查都不亏</text>

  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">示例 1 答案 = 1：只有红色工件 A 能提取</text>
</svg>
