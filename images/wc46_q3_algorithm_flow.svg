<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次后序遍历：自底向上收集子树和</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先算孩子、再合成自己，最后只做一次奇偶判断和一次查询</text>

  <rect x="70" y="64" width="420" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="88" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 后序 DFS 返回子树和：sum(v) = v.val + sum(L) + sum(R)</text>

  <path d="M 280 102 L 280 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="126" width="420" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="150" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">② 若 v 不是根，把 sum(v) 插入集合 seen</text>

  <path d="M 280 164 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="188" width="420" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="212" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ 取 S = sum(root)：S 为奇数则两半不可能相等 → false</text>

  <path d="M 280 226 L 280 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="250" width="420" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="86" y="274" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">④ 查询 seen 中是否存在 S / 2</text>

  <path d="M 280 288 L 280 306 L 175 306 L 175 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 288 L 280 306 L 385 306 L 385 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="326" width="170" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="175" y="348" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">命中 → true</text>
  <text x="175" y="364" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">存在 sum(v) = S/2</text>

  <rect x="300" y="326" width="170" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="385" y="348" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">否则 → false</text>
  <text x="385" y="364" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">没有可割的子树</text>

  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个节点只被访问一次 → 时间 O(n)，空间 O(n)（集合 + 递归栈 O(h)）</text>
</svg>
