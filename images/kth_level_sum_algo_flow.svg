<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：BFS 收集层和 → 判层数 → 降序取第 k</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="195" y="52" width="250" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">初始化：queue = [root]，sums = []</text>
  <path d="M 320 90 L 320 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <path d="M 320 110 L 402 148 L 320 186 L 238 148 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6512" filter="url(#sk)">队列空？</text>

  <!-- no branch to loop column -->
  <text x="228" y="140" text-anchor="end" font-size="12" font-weight="bold" fill="#7a7a7a" filter="url(#sk)">否</text>
  <path d="M 236 148 L 204 148" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop column -->
  <g filter="url(#sk)">
    <rect x="38" y="126" width="160" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="118" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">size = q.size()</text>
  <text x="118" y="161" text-anchor="middle" font-size="11" fill="#5a7a9e" filter="url(#sk)">本层节点数快照</text>
  <path d="M 118 170 L 118 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="32" y="190" width="172" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="118" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">for i &lt; size：</text>
  <text x="118" y="224" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">出队、levelSum += val</text>
  <text x="118" y="237" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">非空孩子入队</text>
  <path d="M 118 242 L 118 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="38" y="262" width="160" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="118" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">sums.append(levelSum)</text>

  <!-- return arrow back to diamond 1 -->
  <path d="M 202 281 C 268 281, 272 168, 240 152" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="278" y="228" text-anchor="start" font-size="10" fill="#b85450" font-style="italic" filter="url(#sk)">下一层</text>

  <!-- yes branch down -->
  <text x="328" y="202" text-anchor="start" font-size="12" font-weight="bold" fill="#7a7a7a" filter="url(#sk)">是</text>
  <path d="M 320 186 L 320 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <path d="M 320 212 L 408 244 L 320 276 L 232 244 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6512" filter="url(#sk)">len(sums) &lt; k ?</text>

  <!-- yes -> return -1 -->
  <text x="247" y="264" text-anchor="start" font-size="12" font-weight="bold" fill="#7a7a7a" filter="url(#sk)">是</text>
  <path d="M 232 248 C 226 272, 220 292, 212 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="105" y="316" width="190" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">return −1</text>
  <text x="200" y="355" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">层数不足 k</text>

  <!-- no -> sort and return -->
  <text x="433" y="260" text-anchor="start" font-size="12" font-weight="bold" fill="#7a7a7a" filter="url(#sk)">否</text>
  <path d="M 408 248 C 424 272, 440 292, 452 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="365" y="316" width="190" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="460" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">sums 降序排序</text>
  <text x="460" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">return sums[k−1]</text>

  <!-- footer notes -->
  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">BFS：每个节点恰好入队、出队各一次，O(n)；排序：O(L log L)，L 为层数</text>
  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">判层数 len(sums) &lt; k 必须在收集完全部层和之后、排序之前</text>
</svg>
