<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一次扫描，base 计数 + 无序对哈希计数</text>

  <!-- 开始框 -->
  <rect x="150" y="48" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">扫描相邻对 (a, b) = (nums[i], nums[i+1])</text>
  <text x="280" y="84" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i = 0 … n−2，共 n−1 对</text>
  <path d="M280,92 L280,108" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,112 390,158 280,204 170,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a == b ?</text>

  <!-- 是：base++ -->
  <text x="156" y="148" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M170,158 L150,158" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="138" width="128" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">base += 1</text>
  <text x="86" y="173" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">原有的相邻相等对</text>

  <!-- 否：无序对计数 -->
  <text x="396" y="148" font-size="12" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M390,158 L410,158" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="414" y="138" width="126" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="477" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pairCount[key]++</text>
  <text x="477" y="173" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">key = (min, max)</text>

  <!-- 回到扫描的循环箭头 -->
  <path d="M86,138 L86,69 L146,69" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="105" font-size="10" fill="#666" filter="url(#rough2)">继续</text>
  <path d="M477,138 L477,69 L414,69" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="105" font-size="10" fill="#666" filter="url(#rough2)">继续</text>

  <!-- 汇合到结果 -->
  <path d="M86,180 L86,232 L268,232" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M477,180 L477,232 L292,232" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,236 L280,256" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="115" y="260" width="330" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = base + max(pairCount 的值, 默认 0)</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">无正收益 ⇒ 不操作，答案至少为 base</text>

  <!-- 无序对关键说明 -->
  <rect x="70" y="330" width="420" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无序对 (min(a,b), max(a,b)) 与方向无关：</text>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">把 x 替换成 y 时，相邻的 (x,y) 和 (y,x) 都会变成 (y,y)</text>
</svg>
