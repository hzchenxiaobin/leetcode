<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="505" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一次扫描：base + 无序对哈希计数</text>

  <!-- 开始 -->
  <ellipse cx="300" cy="56" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M300,74 L300,88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 初始化 -->
  <rect x="170" y="92" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① base = 0，best = 0，空哈希表 pc</text>
  <path d="M300,136 L300,150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 取相邻对 -->
  <rect x="150" y="154" width="300" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 取相邻对 (nums[i], nums[i+1])</text>
  <text x="300" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i = 0 … n−2，自左向右共 n−1 对</text>
  <path d="M300,206 L300,220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：两数相等？ -->
  <polygon points="300,224 430,264 300,304 170,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="269" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">两数相等？</text>

  <!-- 否：哈希计数 -->
  <path d="M170,264 L152,264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="10" y="238" width="138" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="259" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">pc[(min,max)] += 1</text>
  <text x="79" y="279" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">best 取最大值</text>

  <!-- 是：base++ -->
  <path d="M430,264 L456,264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="443" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="460" y="238" width="146" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="533" y="269" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">base += 1</text>

  <!-- 汇合 -->
  <path d="M79,290 L79,322 L294,322" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M533,290 L533,322 L306,322" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="300" cy="322" r="3.5" fill="#666" filter="url(#rough2)"/>
  <path d="M300,326 L300,332" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：还有相邻对？ -->
  <polygon points="300,336 420,368 300,400 180,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="373" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">还有相邻对？</text>

  <!-- 是：回环 -->
  <path d="M420,368 L616,368 L616,180 L456,180" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="358" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="630" y="274" transform="rotate(-90 630 274)" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">取下一对</text>

  <!-- 否：返回 -->
  <path d="M300,400 L300,414" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="412" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="225" y="418" width="150" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="444" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">返回 base + best</text>
  <path d="M300,462 L300,472" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="300" cy="486" rx="42" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="491" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">结束</text>
</svg>
