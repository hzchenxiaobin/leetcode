<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="337" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/></marker>
  </defs>
  <rect width="660" height="480" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：x 从 0 起贪心扫描，余类耗尽即停</text>
  <path d="M 150 44 Q 330 52 508 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: build buckets -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="380" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="250" y="90" text-anchor="middle" font-size="12.5" fill="#2c4a6e">建桶：cnt[r] ← 统计每个元素的 r = x mod value</text>

  <path d="M 250 108 L 250 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: r = x mod value -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="380" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="250" y="158" text-anchor="middle" font-size="12.5" fill="#2c4a6e">r ← x mod value</text>

  <path d="M 250 174 L 250 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="250,198 355,248 250,298 145,248" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="250" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">该类还有余粮？</text>
  <text x="250" y="264" text-anchor="middle" font-size="12" fill="#2e5e2e">cnt[r] &gt; 0 ?</text>

  <!-- yes branch -->
  <path d="M 250 298 L 250 322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="314" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="60" y="326" width="380" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">cnt[r] −= 1：安排一个类 r 元素变成 x</text>
  <text x="250" y="366" text-anchor="middle" font-size="12" fill="#a07818">x += 1，回到「r ← x mod value」</text>

  <!-- loop back arrow -->
  <path d="M 58 351 L 32 351 L 32 153 L 56 153" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- no branch -->
  <path d="M 355 248 L 424 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="376" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">否（类空）</text>

  <g filter="url(#sk)">
    <rect x="428" y="218" width="192" height="60" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="524" y="242" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3a36">答案 = x</text>
  <text x="524" y="264" text-anchor="middle" font-size="10.5" fill="#b85450">x 是第一个无法覆盖的靶点</text>

  <!-- closed-form annotation box -->
  <g filter="url(#sk)">
    <rect x="428" y="300" width="192" height="100" rx="9" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.3"/>
  </g>
  <text x="524" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555550">等价闭式（§5 定理）</text>
  <text x="524" y="346" text-anchor="middle" font-size="11.5" fill="#555550">ans = min ( r + cnt[r]·value )</text>
  <text x="524" y="368" text-anchor="middle" font-size="10.5" fill="#8a8a84">r 取遍 0 .. value−1</text>
  <text x="524" y="388" text-anchor="middle" font-size="10.5" fill="#8a8a84">类 r 恰担任 r, r+v, … 前 cnt[r] 个</text>

  <!-- bottom note strip -->
  <g filter="url(#sk)">
    <rect x="40" y="420" width="580" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="330" y="440" text-anchor="middle" font-size="11.5" fill="#2c4a6e">每成功一步就消耗一个元素 ⟹ 循环至多 n + 1 步，答案 ≤ n（§5 引理 5）</text>
</svg>
