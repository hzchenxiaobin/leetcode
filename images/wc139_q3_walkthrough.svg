<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：[1,1,1,1,1] + [1,0,1]，即 11 + 5 = 16</text>
  <text x="310" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">结果 [1,0,0,0,0]</text>
  <text x="60" y="86" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">位权</text>
  <rect x="120" y="68" width="60" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" font-size="11" fill="#555555" text-anchor="middle" filter="url(#rough2)">16</text>
  <rect x="180" y="68" width="60" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="88" font-size="11" fill="#555555" text-anchor="middle" filter="url(#rough2)">−8</text>
  <rect x="240" y="68" width="60" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="88" font-size="11" fill="#555555" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="300" y="68" width="60" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="88" font-size="11" fill="#555555" text-anchor="middle" filter="url(#rough2)">−2</text>
  <rect x="360" y="68" width="60" height="32" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="88" font-size="11" fill="#555555" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="60" y="142" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">arr1</text>
  <rect x="120" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="144.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="144.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="240" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="144.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="300" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="144.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="360" y="124" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="144.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="60" y="186" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">arr2</text>
  <rect x="120" y="168" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="188.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="180" y="168" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="188.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="240" y="168" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="188.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="300" y="168" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="188.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="360" y="168" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="188.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="60" y="230" font-size="10.5" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">结果</text>
  <rect x="120" y="212" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="232.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="212" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="232.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="240" y="212" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="232.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="212" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="232.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="360" y="212" width="60" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="390" y="232.7" font-size="13" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="60" y="262" width="250" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="286.6" font-size="10" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">低位：1+1 = 2 → digit 0, carry −1</text>
  <text x="72" y="302.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">次低位：−1+1+0 = 0 → digit 0, carry 0</text>
  <rect x="330" y="262" width="250" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="342" y="286.6" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">中间两位：1+1 = 2 → digit 0, carry −1</text>
  <text x="342" y="302.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">最高位：−1+1+0 = 0 → digit 0, carry 0</text>
  <text x="310" y="344" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">校验：16 = (−2)⁴，正是 [1,0,0,0,0]</text>
</svg>
