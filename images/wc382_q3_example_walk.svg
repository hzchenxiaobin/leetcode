<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 3, m = 2（示例 1）</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#666">
    <text x="153" y="74">y=1</text>
    <text x="219" y="74">y=2</text>
  </g>
  <!-- row labels -->
  <g filter="url(#sk)" font-size="11" text-anchor="end" fill="#666">
    <text x="112" y="110">x=1</text>
    <text x="112" y="160">x=2</text>
    <text x="112" y="210">x=3</text>
  </g>

  <!-- grid: green = Alice wins -->
  <g filter="url(#sk)">
    <rect x="120" y="80"  width="66" height="50" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="186" y="80"  width="66" height="50" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="120" y="130" width="66" height="50" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="186" y="130" width="66" height="50" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="120" y="180" width="66" height="50" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="186" y="180" width="66" height="50" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="153" y="103" font-size="14" font-weight="bold" fill="#2b5d85">2</text>
    <text x="153" y="122" font-size="10" fill="#8899aa">(1,1)</text>
    <text x="219" y="103" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="219" y="122" font-size="10" fill="#2e6e2e" font-weight="bold">(1,2) ✓</text>
    <text x="153" y="153" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="153" y="172" font-size="10" fill="#2e6e2e" font-weight="bold">(2,1) ✓</text>
    <text x="219" y="153" font-size="14" font-weight="bold" fill="#2b5d85">4</text>
    <text x="219" y="172" font-size="10" fill="#8899aa">(2,2)</text>
    <text x="153" y="203" font-size="14" font-weight="bold" fill="#2b5d85">4</text>
    <text x="153" y="222" font-size="10" fill="#8899aa">(3,1)</text>
    <text x="219" y="203" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
    <text x="219" y="222" font-size="10" fill="#2e6e2e" font-weight="bold">(3,2) ✓</text>
  </g>
  <text x="186" y="252" text-anchor="middle" font-size="10.5" fill="#888">格内数字 = x + y</text>

  <!-- right panel -->
  <g filter="url(#sk)">
    <rect x="300" y="80" width="315" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="457" y="102" text-anchor="middle" font-size="11.5" fill="#2b5d85">n = 3：奇 x = ⌈3/2⌉ = 2 个（1、3）</text>
  <text x="457" y="122" text-anchor="middle" font-size="11.5" fill="#2b5d85">偶 x = ⌊3/2⌋ = 1 个（2）</text>

  <g filter="url(#sk)">
    <rect x="300" y="140" width="315" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="457" y="162" text-anchor="middle" font-size="11.5" fill="#2b5d85">m = 2：奇 y = ⌈2/2⌉ = 1 个（1）</text>
  <text x="457" y="182" text-anchor="middle" font-size="11.5" fill="#2b5d85">偶 y = ⌊2/2⌋ = 1 个（2）</text>

  <g filter="url(#sk)">
    <rect x="300" y="200" width="315" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="457" y="223" text-anchor="middle" font-size="11.5" fill="#2e6e2e">ans = 奇x × 偶y + 偶x × 奇y</text>
  <text x="457" y="247" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">= 2×1 + 1×1 = 3 ★</text>

  <g filter="url(#sk)">
    <rect x="300" y="268" width="315" height="44" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="457" y="286" text-anchor="middle" font-size="11" fill="#666">示例 2：n = m = 1</text>
  <text x="457" y="304" text-anchor="middle" font-size="11" fill="#666">ans = 1×0 + 0×1 = 0 ✓（(1,1) 总数 2，Bob 收官）</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="30" y="270" width="250" height="90" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="155" y="295" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">ans = 3：获胜对 (1,2)、(2,1)、(3,2)</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">x + y = 3、3、5，均为奇数</text>
  <text x="155" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a">与示例 1 解释完全一致 ✓</text>

  <text x="320" y="385" text-anchor="middle" font-size="11" fill="#888">闭式验证：⌊n·m/2⌋ = ⌊3×2/2⌋ = 3 ✓</text>
</svg>
