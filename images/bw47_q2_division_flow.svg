<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：反复除 3 逐位检查，余数只能是 0 或 1</text>

  <!-- 开始 -->
  <ellipse cx="90" cy="170" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="175" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">输入 n</text>

  <!-- 循环判定 -->
  <path d="M 136 170 L 172 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="230,128 344,170 230,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="238" y="168" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">n &gt; 0 ?</text>
  <text x="238" y="186" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(还有低位没检查)</text>

  <!-- 结束（所有位都过） -->
  <path d="M 230 128 Q 230 70 160 70" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="60" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="60" y="50" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="75" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- 取余 -->
  <path d="M 344 170 L 380 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="380" y="150" width="86" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="423" y="175" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">r = n % 3</text>

  <!-- 余数判定 -->
  <path d="M 466 170 L 496 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="496,150 546,170 496,190" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">r=2?</text>

  <!-- r=2 返回 false -->
  <path d="M 496 190 Q 470 250 380 250 L 300 250" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="240" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="196" y="230" width="104" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="248" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- r<=1 继续 -->
  <path d="M 496 150 Q 470 96 420 96 L 190 96 Q 150 96 130 120" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="106" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="60" y="120" width="112" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="116" y="143" text-anchor="middle" font-size="12" fill="#2f5226" filter="url(#rough2)">n = n / 3</text>
  <text x="116" y="170" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">（弃掉刚检查的低位）</text>
  <path d="M 60 140 Q 40 150 44 162" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="40" y="282" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">每次除 3 弃掉最低一位，相当于把检查过的幂「抹掉」，O(log₃n) 轮内出结果</text>
</svg>
