<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="452" fill="#fafafa"/>
  <text x="280" y="27" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：两重循环 + 区间钳位</text>
  <text x="280" y="47" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">每格只做 ≤ 9 次加法与 1 次整数除法，总复杂度 O(9mn) = O(mn)</text>
  <rect x="130.0" y="64" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="85.0" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">输入 img：m = 行数，n = 列数</text>
  <rect x="130.0" y="114" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="135.0" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">res 开成 m×n 的全 0 矩阵</text>
  <rect x="80.0" y="166" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="185" font-size="10.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">外层 i = 0 … m−1</text>
  <text x="280.0" y="203" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">rLo = max(0,i−1)，rHi = min(m−1,i+1)</text>
  <rect x="80.0" y="230" width="400" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="249" font-size="10.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">内层 j = 0 … n−1</text>
  <text x="280.0" y="267" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">cLo = max(0,j−1)，cHi = min(n−1,j+1)</text>
  <rect x="80.0" y="294" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="318.0" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">sum = 区间内全部 img[r][c]，最多 9 个格子</text>
  <rect x="80.0" y="352" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="371" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">res[i][j] = sum ÷ ((rHi−rLo+1) × (cHi−cLo+1))</text>
  <text x="280.0" y="389" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">非负数下整数除法即向下取整</text>
  <rect x="130.0" y="416" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="437.0" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">返回 res（与原图同尺寸）</text>
  <path d="M 280 99 L 280 111" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 149 L 280 163" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 213 L 280 227" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 277 L 280 291" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 335 L 280 349" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 399 L 280 413" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
