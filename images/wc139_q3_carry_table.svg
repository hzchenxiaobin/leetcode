<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="600" height="360" fill="#fafafa"/>
  <text x="300" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">逐位相加：total = digit + (−2) × carry</text>
  <text x="300" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">进位可以是负数，这是负二进制的全部特殊之处</text>
  <text x="60" y="84" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">total</text>
  <text x="180" y="84" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">digit = total &amp; 1</text>
  <text x="370" y="84" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">carry = −(total − digit)/2</text>
  <rect x="50" y="96" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="119" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">-1</text>
  <text x="230" y="119" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="410" y="119" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <rect x="50" y="140" width="500" height="36" fill="#f0f0f0" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="163" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <text x="230" y="163" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <text x="410" y="163" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <rect x="50" y="184" width="500" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="207" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="230" y="207" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="410" y="207" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <rect x="50" y="228" width="500" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="251" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">2</text>
  <text x="230" y="251" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">0</text>
  <text x="410" y="251" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">−1</text>
  <rect x="50" y="272" width="500" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="295" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="230" y="295" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">1</text>
  <text x="410" y="295" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">−1</text>
  <text x="60" y="336" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">校验：−1 = 1 + (−2)·1 ✓    2 = 0 + (−2)·(−1) ✓    3 = 1 + (−2)·(−1) ✓</text>
</svg>
