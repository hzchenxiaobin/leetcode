<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">固定和为 6：切得越不均等，乘积越小</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#888">（k = 5，每段长度不得超过 5）</text>

  <!-- 切法 1：1 + 5 -->
  <text x="105" y="84" text-anchor="end" font-size="12" fill="#555" font-weight="bold">切法 1</text>
  <g filter="url(#sk)">
    <rect x="150" y="62" width="65" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="215" y="62" width="325" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="182" y="85" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="377" y="85" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">5</text>
  <path d="M 215 58 l 4 9 l -6 9 l 5 9 l -3 9" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="632" y="78" text-anchor="end" font-size="14" font-weight="bold" fill="#2e6e2e">1 × 5 = 5</text>
  <text x="632" y="94" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold">✓ 最优</text>
  <text x="215" y="112" text-anchor="middle" font-size="10" fill="#b85450">小段 1 = x−k，已压到下限</text>

  <!-- 切法 2：2 + 4 -->
  <text x="105" y="164" text-anchor="end" font-size="12" fill="#555" font-weight="bold">切法 2</text>
  <g filter="url(#sk)">
    <rect x="150" y="142" width="130" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="280" y="142" width="260" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="215" y="165" text-anchor="middle" font-size="13" fill="#2b5a88" font-weight="bold">2</text>
  <text x="410" y="165" text-anchor="middle" font-size="13" fill="#2b5a88" font-weight="bold">4</text>
  <path d="M 280 138 l 4 9 l -6 9 l 5 9 l -3 9" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="632" y="158" text-anchor="end" font-size="14" font-weight="bold" fill="#2b5a88">2 × 4 = 8</text>
  <text x="632" y="174" text-anchor="end" font-size="11" fill="#555">次优</text>

  <!-- 切法 3：3 + 3 -->
  <text x="105" y="244" text-anchor="end" font-size="12" fill="#555" font-weight="bold">切法 3</text>
  <g filter="url(#sk)">
    <rect x="150" y="222" width="195" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="345" y="222" width="195" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="247" y="245" text-anchor="middle" font-size="13" fill="#a03a34" font-weight="bold">3</text>
  <text x="442" y="245" text-anchor="middle" font-size="13" fill="#a03a34" font-weight="bold">3</text>
  <path d="M 345 218 l 4 9 l -6 9 l 5 9 l -3 9" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="632" y="238" text-anchor="end" font-size="14" font-weight="bold" fill="#a03a34">3 × 3 = 9</text>
  <text x="632" y="254" text-anchor="end" font-size="11" fill="#a03a34">✗ 均分反而最大</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="55" y="288" width="530" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">每段 ≤ k ⇒ 小段最小取 x−k ⇒ 最小成本 = (x−k) × k</text>
  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#999">f(t) = t·(6−t) 是开口向下的抛物线：t ≤ 3（即 x/2）时递增 ⇒ t 越小乘积越小</text>
</svg>
