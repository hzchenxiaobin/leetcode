<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,1,2,2,1] → 答案 2</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: binary search trace ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="64" width="400" height="300" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="84" y="92" font-size="13" font-weight="bold" fill="#2b6e9e">① 二分轨迹（初始 lo=1, hi=n=5）</text>

  <!-- hand-drawn table -->
  <g filter="url(#sk)">
    <path d="M 84 106 L 436 106 M 84 140 L 436 140 M 84 174 L 436 174 M 84 208 L 436 208 M 84 242 L 436 242 M 84 276 L 436 276 M 84 322 L 436 322" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M 84 106 L 84 322 M 144 106 L 144 322 M 204 106 L 204 322 M 264 106 L 264 322 M 436 106 L 436 322" stroke="#446688" stroke-width="1" fill="none"/>
  </g>
  <g font-size="10.5" fill="#2b6e9e" font-weight="bold">
    <text x="114" y="127" text-anchor="middle">轮次</text>
    <text x="174" y="127" text-anchor="middle">lo</text>
    <text x="234" y="127" text-anchor="middle">hi</text>
    <text x="264" y="127"></text>
    <text x="350" y="127" text-anchor="middle">mid 与判定 → 动作</text>
  </g>
  <g font-size="10.5" fill="#333" font-family="monospace">
    <text x="114" y="161" text-anchor="middle">1</text>
    <text x="174" y="161" text-anchor="middle">1</text>
    <text x="234" y="161" text-anchor="middle">5</text>
    <text x="290" y="161">mid=3，true → hi=3</text>
    <text x="114" y="195" text-anchor="middle">2</text>
    <text x="174" y="195" text-anchor="middle">1</text>
    <text x="234" y="195" text-anchor="middle">3</text>
    <text x="290" y="195">mid=2，true → hi=2</text>
    <text x="114" y="229" text-anchor="middle">3</text>
    <text x="174" y="229" text-anchor="middle">1</text>
    <text x="234" y="229" text-anchor="middle">2</text>
    <text x="290" y="229">mid=1，false → lo=2</text>
  </g>
  <g filter="url(#sk)">
    <rect x="86" y="278" width="348" height="42" fill="#e6f4ea" opacity="0.85"/>
  </g>
  <text x="290" y="304" font-size="11" fill="#2e6e2e" font-weight="bold">lo = hi = 2 收敛 → 答案 = 2</text>
  <text x="84" y="348" font-size="10" fill="#888">三次 check 的明细见右侧与左下 ↘</text>

  <!-- ===== Panel B: check(1) ===== -->
  <g filter="url(#sk)">
    <rect x="490" y="64" width="390" height="300" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="510" y="92" font-size="13" font-weight="bold" fill="#7a2828">② check(L=1)：长度 1 有唯一吗？</text>

  <g font-size="12">
    <g filter="url(#sk)"><rect x="525" y="108" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="553" y="132" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="587" y="108" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="615" y="132" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="649" y="108" width="56" height="36" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="677" y="132" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="711" y="108" width="56" height="36" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="739" y="132" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="773" y="108" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="801" y="132" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="530" y="172" width="160" height="76" rx="8" fill="#fdfcf7" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="610" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">值 1</text>
  <text x="610" y="228" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">出现 3 次 ✗</text>

  <g filter="url(#sk)">
    <rect x="710" y="172" width="160" height="76" rx="8" fill="#fdfcf7" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="790" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">值 2</text>
  <text x="790" y="228" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">出现 2 次 ✗</text>

  <text x="685" y="290" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">没有出现次数 = 1 的 → false</text>
  <text x="685" y="316" text-anchor="middle" font-size="10" fill="#888">三个 [1] 互相重复、两个 [2] 互相重复</text>
  <text x="685" y="340" text-anchor="middle" font-size="10" fill="#888">另外：check(3) 的 [1,1,2]、[1,2,2]、[2,2,1] 也全唯一 → true</text>

  <!-- ===== Panel C: check(2) ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="396" width="400" height="280" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="84" y="424" font-size="13" font-weight="bold" fill="#2e6e2e">③ check(L=2)：长度 2 有唯一吗？</text>

  <g font-size="10.5" font-family="monospace">
    <g filter="url(#sk)"><rect x="84" y="440" width="352" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="100" y="460" fill="#444">[1,1]（位置 0）</text>
    <text x="400" y="460" text-anchor="end" fill="#2e6e2e" font-weight="bold">出现 1 次 ✓</text>
    <g filter="url(#sk)"><rect x="84" y="476" width="352" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="100" y="496" fill="#444">[1,2]（位置 1）</text>
    <text x="400" y="496" text-anchor="end" fill="#2e6e2e" font-weight="bold">出现 1 次 ✓</text>
    <g filter="url(#sk)"><rect x="84" y="512" width="352" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="100" y="532" fill="#444">[2,2]（位置 2）</text>
    <text x="400" y="532" text-anchor="end" fill="#2e6e2e" font-weight="bold">出现 1 次 ✓</text>
    <g filter="url(#sk)"><rect x="84" y="548" width="352" height="30" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="100" y="568" fill="#444">[2,1]（位置 3）</text>
    <text x="400" y="568" text-anchor="end" fill="#2e6e2e" font-weight="bold">出现 1 次 ✓</text>
  </g>
  <text x="260" y="606" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">存在 count = 1 → true</text>
  <text x="260" y="630" text-anchor="middle" font-size="10" fill="#666">四个窗口内容互不相同，每个都是唯一子数组</text>
  <text x="260" y="652" text-anchor="middle" font-size="10" fill="#666">双哈希提取指纹 + 哈希表计数，一轮 O(n)</text>

  <!-- ===== Panel D: conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="490" y="396" width="390" height="280" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="510" y="424" font-size="13" font-weight="bold" fill="#7a5415">④ 收敛与答案</text>
  <text x="685" y="472" text-anchor="middle" font-size="30" fill="#2e6e2e" font-weight="bold">答案 = 2</text>

  <g font-size="12">
    <g filter="url(#sk)"><rect x="525" y="500" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="553" y="524" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="587" y="500" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="615" y="524" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="649" y="500" width="56" height="36" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="677" y="524" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="711" y="500" width="56" height="36" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="739" y="524" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="773" y="500" width="56" height="36" fill="#fdfcf7" stroke="#446688" stroke-width="1.3"/></g>
    <text x="801" y="524" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="521" y="494" width="128" height="48" fill="none" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="685" y="566" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">最短唯一子数组如 [1,1]（长度 2）</text>
  <text x="685" y="594" text-anchor="middle" font-size="10" fill="#666">P(1)=false，P(2)=P(3)=P(4)=P(5)=true</text>
  <text x="685" y="616" text-anchor="middle" font-size="10" fill="#666">false…false true…true 的形态正是二分的前提</text>
  <text x="685" y="638" text-anchor="middle" font-size="10" fill="#888">（P(n) 恒为 true：整个数组只有一个）</text>
</svg>
