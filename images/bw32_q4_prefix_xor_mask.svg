<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">前缀异或掩码：mask[l−1] = mask[r] ⟺ 子串可重排回文</text>

  <!-- 10 位掩码 -->
  <text x="280" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">mask：10 个数字出现次数的奇偶（0..9 各一位）</text>
  <g filter="url(#rough2)">
    <rect x="130" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="74" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="250" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="74" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="340" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="74" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="145" y="94">0</text><text x="175" y="94">1</text><text x="205" y="94">2</text>
    <text x="235" y="94">3</text><text x="265" y="94">4</text><text x="295" y="94">5</text>
    <text x="325" y="94">6</text><text x="355" y="94">7</text><text x="385" y="94">8</text><text x="415" y="94">9</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="145" y="120">偶</text><text x="175" y="120">偶</text><text x="205" y="120">偶</text>
    <text x="235" y="120">奇!</text><text x="265" y="120">偶</text><text x="295" y="120">偶</text>
    <text x="325" y="120">奇!</text><text x="355" y="120">偶</text><text x="385" y="120">偶</text><text x="415" y="120">偶</text>
  </g>

  <!-- 前缀表：213123 -->
  <text x="280" y="152" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">s = 213123 的前缀 mask（⊕ 表示异或更新）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="164" width="72" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="96" y="184">pre−1: 0</text>
    <rect x="132" y="164" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="168" y="184">2</text>
    <rect x="204" y="164" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="240" y="184">0</text>
    <rect x="276" y="164" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="312" y="184">4</text>
    <rect x="348" y="164" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="384" y="184">0</text>
    <rect x="420" y="164" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="456" y="184">2</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="96" y="208">下标 −1</text><text x="168" y="208">i=0 ⊕2</text><text x="240" y="208">i=1 ⊕1</text>
    <text x="312" y="208">i=2 ⊕3</text><text x="384" y="208">i=3 ⊕1</text><text x="456" y="208">i=4 ⊕2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <text x="240" y="230">↑ 两处 mask=0 与下标 −1 配对：整段 213…奇偶全偶</text>
  </g>

  <!-- 查询规则 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="246" width="230" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="175" y="268">全偶回文：找相同 mask 的首次出现</text>
    <text x="175" y="288">i − first[mask]</text>
    <rect x="310" y="246" width="230" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="425" y="268">奇数长度回文：恰一位不同</text>
    <text x="425" y="288">i − first[mask ⊕ (1&lt;&lt;d)]</text>
  </g>
  <path d="M 290 274 L 308 274" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="318" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="344" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">first 数组只存「最早下标」⟹ 每个右端点 O(10) 查询，总 O(10n)</text>
</svg>
