<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次循环完成生成与归约</text>

  <rect x="180" y="52" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M280,97 L280,118" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,120 400,168 280,216 160,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M280,217 L280,244" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="236" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="180" y="246" width="200" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">ans ^= start + 2·i</text>

  <path d="M280,295 L280,320" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="322" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">i += 1</text>

  <path d="M179,344 L100,344 L100,168 L157,168" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="256" font-size="10" fill="#8899aa" filter="url(#rough2)">回到判断</text>

  <path d="M401,168 L476,168 L476,377" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="400" y="380" width="152" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="408" text-anchor="middle" font-size="13" fill="#8a3b38" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="30" y="404" font-size="10" fill="#999" filter="url(#rough2)">循环体只做两件事：算一项、异或进去</text>
</svg>
