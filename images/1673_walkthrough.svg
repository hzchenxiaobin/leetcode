<svg xmlns="http://www.w3.org/2000/svg" width="640" height="465" viewBox="0 0 640 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="465" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2,4,3,3,5,4,9,6]，k = 4 → [2,3,3,4]</text>
  <path d="M 120 34 Q 320 42 520 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="184" y="50" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="218" y="50" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="252" y="50" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="286" y="50" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="320" y="50" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="354" y="50" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="388" y="50" width="34" height="26" rx="4" fill="#f0f0f0" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="422" y="50" width="34" height="26" rx="4" fill="#f0f0f0" stroke="#a0a0a0" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="201" y="68" font-size="12.5" fill="#333">2</text>
    <text x="235" y="68" font-size="12.5" fill="#333">4</text>
    <text x="269" y="68" font-size="12.5" font-weight="bold" fill="#b85450">3</text>
    <text x="303" y="68" font-size="12.5" fill="#333">3</text>
    <text x="337" y="68" font-size="12.5" fill="#333">5</text>
    <text x="371" y="68" font-size="12.5" font-weight="bold" fill="#b85450">4</text>
    <text x="405" y="68" font-size="12.5" fill="#777">9</text>
    <text x="439" y="68" font-size="12.5" fill="#777">6</text>
    <text x="201" y="88" font-size="10" fill="#888">0</text>
    <text x="235" y="88" font-size="10" fill="#888">1</text>
    <text x="269" y="88" font-size="10" fill="#888">2</text>
    <text x="303" y="88" font-size="10" fill="#888">3</text>
    <text x="337" y="88" font-size="10" fill="#888">4</text>
    <text x="371" y="88" font-size="10" fill="#888">5</text>
    <text x="405" y="88" font-size="10" fill="#888">6</text>
    <text x="439" y="88" font-size="10" fill="#888">7</text>
  </g>
  <text x="482" y="58" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">k = 4，n = 8</text>
  <text x="482" y="74" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">粉 = 触发弹栈</text>
  <text x="482" y="88" text-anchor="start" font-size="10.5" fill="#888" filter="url(#sk)">灰 = 丢弃</text>

  <g filter="url(#sk)">
    <rect x="56" y="104" width="36" height="26" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="92" y="104" width="44" height="26" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="136" y="104" width="240" height="26" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="376" y="104" width="90" height="26" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
    <rect x="466" y="104" width="118" height="26" rx="3" fill="#eef1f5" stroke="#8a949e" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">
    <text x="74" y="121">i</text>
    <text x="114" y="121">x</text>
    <text x="256" y="121">弹栈检查：顶 &gt; x ? 弹后可补足 ?</text>
    <text x="421" y="121">动作</text>
    <text x="525" y="121">栈（底→顶）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="130" width="36" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="92" y="130" width="44" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="136" y="130" width="240" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="376" y="130" width="90" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="466" y="130" width="118" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="148">0</text>
    <text x="114" y="148">2</text>
    <text x="256" y="148">栈空，无栈顶可弹</text>
    <text x="421" y="148">入栈</text>
    <text x="525" y="148">[2]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="158" width="36" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="92" y="158" width="44" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="136" y="158" width="240" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="376" y="158" width="90" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="466" y="158" width="118" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="176">1</text>
    <text x="114" y="176">4</text>
    <text x="256" y="176">4 &gt; 2 ? 否</text>
    <text x="421" y="176">入栈</text>
    <text x="525" y="176">[2,4]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="186" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="92" y="186" width="44" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="136" y="186" width="240" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="376" y="186" width="90" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="466" y="186" width="118" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="204">2</text>
    <text x="114" y="204" font-weight="bold" fill="#b85450">3</text>
    <text x="256" y="204" font-weight="bold" fill="#b85450">4 &gt; 3 ✓ 且 (2−1)+(8−2) = 7 ≥ 4</text>
    <text x="421" y="204" font-weight="bold" fill="#b85450">弹 4，入 3</text>
    <text x="525" y="204" font-weight="bold">[2,3]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="214" width="36" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="92" y="214" width="44" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="136" y="214" width="240" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="376" y="214" width="90" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="466" y="214" width="118" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="232">3</text>
    <text x="114" y="232">3</text>
    <text x="256" y="232">3 &gt; 3 ? 否（相等不弹）</text>
    <text x="421" y="232">入栈</text>
    <text x="525" y="232">[2,3,3]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="242" width="36" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="92" y="242" width="44" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="136" y="242" width="240" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="376" y="242" width="90" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="466" y="242" width="118" height="28" rx="3" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="260">4</text>
    <text x="114" y="260">5</text>
    <text x="256" y="260">5 &gt; 3 ? 否</text>
    <text x="421" y="260">入栈</text>
    <text x="525" y="260">[2,3,3,5]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="270" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="92" y="270" width="44" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="136" y="270" width="240" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="376" y="270" width="90" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="466" y="270" width="118" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="288">5</text>
    <text x="114" y="288" font-weight="bold" fill="#b85450">4</text>
    <text x="256" y="288" font-weight="bold" fill="#b85450">5 &gt; 4 ✓ 且 (4−1)+(8−5) = 6 ≥ 4</text>
    <text x="421" y="288" font-weight="bold" fill="#b85450">弹 5，入 4</text>
    <text x="525" y="288" font-weight="bold">[2,3,3,4]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="298" width="36" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="92" y="298" width="44" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="136" y="298" width="240" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="376" y="298" width="90" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="466" y="298" width="118" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">
    <text x="74" y="316">6</text>
    <text x="114" y="316">9</text>
    <text x="256" y="316">9 &gt; 4 ? 否，且栈长 = k</text>
    <text x="421" y="316">丢弃 9</text>
    <text x="525" y="316">[2,3,3,4]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="326" width="36" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="92" y="326" width="44" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="136" y="326" width="240" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="376" y="326" width="90" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="466" y="326" width="118" height="28" rx="3" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">
    <text x="74" y="344">7</text>
    <text x="114" y="344">6</text>
    <text x="256" y="344">6 &gt; 4 ? 否，且栈长 = k</text>
    <text x="421" y="344">丢弃 6</text>
    <text x="525" y="344">[2,3,3,4]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="354" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="92" y="354" width="44" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="136" y="354" width="240" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="376" y="354" width="90" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="466" y="354" width="118" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">
    <text x="74" y="372" font-weight="bold">结束</text>
    <text x="114" y="372">—</text>
    <text x="256" y="372" font-weight="bold">栈长 = k = 4 ✓</text>
    <text x="421" y="372" font-weight="bold">返回栈</text>
    <text x="525" y="372" font-weight="bold" fill="#b85450">[2,3,3,4] ✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="56" y="396" width="528" height="50" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="415" font-size="11.5" fill="#333">i = 5 时栈已满（长 4）——满栈不豁免弹栈判断，「弹 5 压 4」就是换顶；</text>
    <text x="320" y="435" font-size="11.5" fill="#888">9、6 到来时不大于栈顶 4，既不弹也无位可入，直接丢弃。结束时栈长恰为 k。</text>
  </g>
</svg>
