<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：O(n²) 双重循环，公差偏移到非负下标</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">nums[i] ≤ 500 ⇒ d ∈ [-500,500] ⇒ 下标 d+500 ∈ [0,1000]</text>
  <rect x="140.0" y="64.0" width="280.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="86.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = 2；dp[n][1001] 全 0</text>
  <path d="M 280.0 102.0 L 280.0 120.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="120.0" width="320.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="145.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for i：for j &lt; i：d = nums[i]-nums[j]+500</text>
  <path d="M 280.0 164.0 L 280.0 182.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="182.0" width="320.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="207.4" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">len = dp[j][d] ? dp[j][d]+1 : 2</text>
  <path d="M 280.0 226.0 L 280.0 244.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="244.0" width="320.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="262.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[i][d] = max(dp[i][d], len)</text>
  <text x="280.0" y="276.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = max(ans, dp[i][d])</text>
  <text x="25.0" y="312.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">时间复杂度 O(n²)，n = 1500 时约 1.1e6 次转移。</text>
</svg>
