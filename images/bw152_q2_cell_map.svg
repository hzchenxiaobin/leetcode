<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">一个哈希表就是整张表：(列字母 + 行号) → 整数值</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">26 列 × rows 行，未 setCell 过的格子一律按 0 处理</text>
  <text x="70" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="126" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="182" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="238" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="294" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">E</text>
  <text x="350" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="406" y="70" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">G</text>
  <text x="462" y="70" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">…  Z</text>
  <text x="40" y="116" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="56" y="98" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="112" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="98" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="162" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="56" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="144" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="168" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="168" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="144" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="208" text-anchor="middle" font-size="11" fill="#555555" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="56" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="112" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="336" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="190" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <path d="M 104 140 L 214 230" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="220" y="214" width="200" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="236" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">unordered_map&lt;string,int&gt;</text>
  <text x="320" y="258" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">"A1" → 10    "B2" → 15</text>
  <text x="320" y="278" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">查不到 = 0（默认值）</text>
  <rect x="40" y="306" width="480" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">setCell：写入；resetCell：删除键（等价于置 0）；getValue：两次查表求和</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">rows 只影响合法性上界，实现里可以不保存</text>
  <text x="280.0" y="378" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">单元格引用只有 1 个大写字母，行号 ≤ 1000，用字符串键最省事</text>
</svg>
