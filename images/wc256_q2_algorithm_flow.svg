<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：比较器排序 → 取 nums[n−k]</text>
  <path d="M 150 42 Q 350 52 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start pill -->
  <g filter="url(#sk)">
    <rect x="250" y="64" width="200" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="350" y="87" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">开始：读入 nums, k</text>
  <path d="M 350 100 L 350 122" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="170" y="124" width="360" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="146" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">① 定义比较器 cmp(a, b)</text>
  <text x="350" y="166" text-anchor="middle" font-size="11.5" fill="#556" font-family="monospace">长度不同 → 位数多者大；等长 → 字典序</text>
  <g filter="url(#sk)">
    <rect x="548" y="137" width="132" height="26" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="614" y="154" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">等价键 (len, s)</text>
  <path d="M 350 176 L 350 198" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="170" y="200" width="360" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="222" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">② sort(nums, cmp) 升序排序</text>
  <text x="350" y="242" text-anchor="middle" font-size="11.5" fill="#556" font-family="monospace">重复元素保留，不去重</text>
  <g filter="url(#sk)">
    <rect x="548" y="213" width="132" height="26" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="614" y="230" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">O(n log n·L)</text>
  <path d="M 350 252 L 350 274" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="170" y="276" width="360" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="298" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">③ return nums[n − k]</text>
  <text x="350" y="318" text-anchor="middle" font-size="11.5" fill="#556" font-family="monospace">升序序列倒数第 k 个 = 第 k 大</text>
  <g filter="url(#sk)">
    <rect x="548" y="289" width="132" height="26" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="614" y="306" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">k=1→最大，k=n→最小</text>
  <path d="M 350 328 L 350 350" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- end pill -->
  <g filter="url(#sk)">
    <rect x="250" y="352" width="200" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="350" y="375" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">输出第 k 大的字符串</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="620" height="54" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="350" y="423" text-anchor="middle" font-size="11" fill="#888">备选：std::nth_element 平均 O(n·L) 只定位不排全序；小顶堆 O(n log k·L) 适合 k ≪ n</text>
  <text x="350" y="444" text-anchor="middle" font-size="11" fill="#888">n = 10⁴ 时全排序约 1.4×10⁷ 次字符比较，毫秒级 —— 赛场首选代码最短的排序法</text>
</svg>
