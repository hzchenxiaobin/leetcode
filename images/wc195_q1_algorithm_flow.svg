<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="520" height="620" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在线判重流程（起点先入集）</text>

  <g filter="url(#rough2)">
    <rect x="110" y="44" width="300" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="65" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">初始化：x = 0，y = 0</text>
    <text x="260" y="83" text-anchor="middle" font-size="11" fill="#446688">visited = {(0, 0)}（起点先入集）</text>

    <path d="M 260 92 L 260 112" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="130" y="116" width="260" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="138" text-anchor="middle" font-size="11.5" fill="#333">读取 path 的下一个方向字符 c</text>

    <path d="M 260 150 L 260 170" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <rect x="80" y="174" width="360" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333">按 c 更新坐标：N→y+1，S→y−1，E→x+1，W→x−1</text>

    <path d="M 260 208 L 260 228" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <polygon points="260,228 372,276 260,324 148,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20">(x, y) ∈ visited ?</text>
    <text x="260" y="290" text-anchor="middle" font-size="9.5" fill="#999">（先查后插）</text>

    <path d="M 372 276 L 394 276" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="383" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">是</text>

    <rect x="396" y="252" width="114" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="453" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">return true</text>
    <text x="453" y="291" text-anchor="middle" font-size="10" fill="#8a3a36">路径相交</text>

    <path d="M 260 324 L 260 350" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="268" y="342" font-size="11" font-weight="bold" fill="#4a7a3a">否</text>

    <rect x="160" y="354" width="200" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="376" text-anchor="middle" font-size="11.5" fill="#333">visited.add((x, y))</text>

    <path d="M 260 388 L 260 408" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <polygon points="260,408 368,456 260,504 152,456" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="461" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20">还有未处理的字符？</text>

    <path d="M 152 456 L 70 456 L 70 133 L 126 133" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="100" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">是</text>

    <path d="M 260 504 L 260 530" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="268" y="522" font-size="11" font-weight="bold" fill="#4a7a3a">否</text>

    <rect x="140" y="534" width="240" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="556" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">return false</text>
    <text x="260" y="574" text-anchor="middle" font-size="10" fill="#3a5a3a">全程无重访</text>
  </g>
</svg>
