<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三个官方示例：分组计数 → 取较小一侧</text>

  <rect x="36" y="54" width="568" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="36" y="98" width="568" height="48" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="36" y="146" width="568" height="48" rx="7" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="36" y="194" width="568" height="48" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <path d="M216,54 L216,242" stroke="#9bb4c9" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M356,54 L356,242" stroke="#9bb4c9" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M524,54 L524,242" stroke="#9bb4c9" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="50" y="82" font-size="12" fill="#2f4f66" filter="url(#rough2)">position 输入</text>
  <text x="286" y="82" text-anchor="middle" font-size="12" fill="#2f4f66" filter="url(#rough2)">奇数 / 偶数筹码数</text>
  <text x="440" y="82" text-anchor="middle" font-size="12" fill="#2f4f66" filter="url(#rough2)">最优目标奇偶性</text>
  <text x="564" y="82" text-anchor="middle" font-size="12" fill="#2f4f66" filter="url(#rough2)">答案</text>

  <text x="50" y="128" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 2, 3]</text>
  <text x="286" y="128" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 / 1</text>
  <text x="440" y="128" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">奇数位（1 或 3）</text>
  <text x="564" y="128" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="50" y="176" font-size="11.5" fill="#444" filter="url(#rough2)">[2, 2, 2, 3, 3]</text>
  <text x="286" y="176" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 / 3</text>
  <text x="440" y="176" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">偶数位（位置 2）</text>
  <text x="564" y="176" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>

  <text x="50" y="224" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 1000000000]</text>
  <text x="286" y="224" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1 / 1</text>
  <text x="440" y="224" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">任一侧（代价相同）</text>
  <text x="564" y="224" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M564,242 L564,266" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="268" width="508" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">目标取奇数位 → 代价 = 偶数位筹码数；目标取偶数位 → 代价 = 奇数位筹码数</text>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">答案 = 二者较小值，与筹码的具体坐标、距离大小完全无关</text>
</svg>
