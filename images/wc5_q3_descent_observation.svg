<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：删掉「第一个下降点」左侧的那一位</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">num = 1 4 3 2 2 1 9，k = 3：4 → 3 是第一个下降，删 4 优于删后面任何一位</text>

  <g filter="url(#rough2)">
    <rect x="89" y="64" width="46" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="145" y="64" width="46" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="201" y="64" width="46" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="257" y="64" width="46" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="313" y="64" width="46" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="369" y="64" width="46" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="425" y="64" width="46" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="112" y="95">1</text>
    <text x="168" y="95" fill="#8a3a36">4</text>
    <text x="224" y="95" fill="#3a5a30">3</text>
    <text x="280" y="95">2</text>
    <text x="336" y="95">2</text>
    <text x="392" y="95">1</text>
    <text x="448" y="95">9</text>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#aaa">
    <text x="112" y="124">0</text>
    <text x="168" y="124">1</text>
    <text x="224" y="124">2</text>
    <text x="280" y="124">3</text>
    <text x="336" y="124">4</text>
    <text x="392" y="124">5</text>
    <text x="448" y="124">6</text>
  </g>

  <text x="196" y="140" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">下降点</text>

  <rect x="44" y="152" width="230" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="174" font-size="11" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">删掉 4（下降点左侧）</text>
  <text x="58" y="202" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">1 3 2 2 1 9</text>
  <text x="58" y="226" font-size="9.5" fill="#555" filter="url(#rough2)">第 2 位是 3，比 4 小 → 胜出</text>

  <rect x="286" y="152" width="230" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="174" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">删掉 3（或其后任意一位）</text>
  <text x="300" y="202" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">1 4 2 2 1 9</text>
  <text x="300" y="226" font-size="9.5" fill="#555" filter="url(#rough2)">第 2 位仍是 4，比 3 大 → 输掉</text>

  <rect x="44" y="262" width="472" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="284" font-size="10.5" fill="#555" filter="url(#rough2)">两个结果长度相同、只差「删哪一位」：由引理 1，第一个不同位更小的整数更小。</text>
  <text x="58" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">删 4 后第 2 位是 3；改删 3/2/1/9 后第 2 位仍是 4 → 删 4 严格更优。</text>
  <text x="58" y="326" font-size="10.5" fill="#555" filter="url(#rough2)">若整串单调不降（无下降点），任何一位都不比后一位大 → 只能删末位。</text>
  <text x="58" y="348" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">→ 反复删「下降点左侧位」= 单调递增栈：遇到更小的 c 就挤掉更大的栈顶。</text>

  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">删 4 → 1 3 2 2 1 9，再删 3、2 得 1219（k = 3）</text>
</svg>
