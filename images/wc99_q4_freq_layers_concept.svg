<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：按「频率」分层，每层内部是一个栈</text>
  <rect x="70" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="140" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="210" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="280" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="350" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="420" y="58" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448.0" y="83.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <text x="474" y="84" text-anchor="start" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">← 入栈顺序</text>
  <text x="70" y="166" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold" font-style="" filter="url(#rough2)">freq = 3</text>
  <rect x="190" y="140" width="54" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217.0" y="164.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <text x="70" y="240" text-anchor="start" font-size="13" fill="#d6a040" font-weight="bold" font-style="" filter="url(#rough2)">freq = 2</text>
  <rect x="190" y="214" width="54" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217.0" y="238.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="252" y="214" width="54" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279.0" y="238.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <text x="70" y="314" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" font-style="" filter="url(#rough2)">freq = 1</text>
  <rect x="190" y="288" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217.0" y="312.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="252" y="288" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279.0" y="312.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="314" y="288" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341.0" y="312.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <text x="560" y="160" text-anchor="start" font-size="12" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)"><tspan x="560" dy="0">pop 总是取</tspan><tspan x="560" dy="15">最高频率层</tspan><tspan x="560" dy="15">最右边的元素</tspan></text>
  <text x="350" y="372" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">同一值每 push 一次就升一层：freq[v] 增加，进 group[f] 的栈顶</text>
</svg>
