<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：把每个词代进判据</text>
  <path d="M 130 42 Q 330 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="20" y="58" width="620" height="36" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">word</text>
  <text x="152" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n</text>
  <text x="237" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">u</text>
  <text x="335" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">首字母大写?</text>
  <text x="477" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">命中判据</text>
  <text x="602" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">结果</text>

  <!-- 第 1 行：USA -->
  <rect x="20" y="96" width="620" height="38" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">USA</text>
  <text x="152" y="121" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="237" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="335" y="121" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是</text>
  <text x="477" y="121" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">u = n → 全大写</text>
  <text x="602" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>

  <!-- 第 2 行：leetcode -->
  <rect x="20" y="134" width="620" height="38" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">leetcode</text>
  <text x="152" y="159" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="237" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="335" y="159" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">否</text>
  <text x="477" y="159" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">u = 0 → 全小写</text>
  <text x="602" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>

  <!-- 第 3 行：Google -->
  <rect x="20" y="172" width="620" height="38" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Google</text>
  <text x="152" y="197" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="237" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="335" y="197" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是</text>
  <text x="477" y="197" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">u = 1 且首字母大写</text>
  <text x="602" y="197" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>

  <!-- 第 4 行：FlaG -->
  <rect x="20" y="210" width="620" height="38" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">FlaG</text>
  <text x="152" y="235" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="237" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="335" y="235" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是</text>
  <text x="477" y="235" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0 &lt; u &lt; n 且 u ≠ 1</text>
  <text x="602" y="235" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false ✗</text>

  <!-- 第 5 行：aBC -->
  <rect x="20" y="248" width="620" height="38" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">aBC</text>
  <text x="152" y="273" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="237" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="335" y="273" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">否</text>
  <text x="477" y="273" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">首字母小写却含大写</text>
  <text x="602" y="273" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">false ✗</text>

  <!-- 第 6 行：Z -->
  <rect x="20" y="286" width="620" height="38" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Z</text>
  <text x="152" y="311" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="237" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="335" y="311" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是</text>
  <text x="477" y="311" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">u = 1 且首字母大写</text>
  <text x="602" y="311" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">true ✓</text>

  <text x="330" y="348" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">注：u 只数个数，位置信息由 word[0] 单独提供——"Google" 与 "aBC" 正好互为镜像</text>
  <text x="330" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">第 6 行 n = 1 时 u = 0 与 u = n 同时成立，任一分支返回 true 都不影响结论</text>
</svg>
