<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">可互换 = 宽高比相同（与尺寸无关）</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left caption -->
  <text x="165" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">同比例家族：宽 : 高 = 1 : 2</text>
  <!-- right caption -->
  <text x="518" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04040">比例互不相同</text>

  <!-- dashed enclosures -->
  <g filter="url(#sk)">
    <rect x="52" y="104" width="228" height="116" rx="9" fill="none" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="6 4"/>
    <rect x="452" y="178" width="104" height="42" rx="9" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>

  <!-- left rectangles, all ratio 1:2, scale x3, baseline y=212 -->
  <g filter="url(#sk)">
    <rect x="64" y="188" width="12" height="24" rx="2" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="110" y="194" width="9" height="18" rx="2" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="152" y="152" width="30" height="60" rx="2" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="222" y="122" width="45" height="90" rx="2" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#555" font-family="monospace" text-anchor="middle">
    <text x="70" y="228">4×8</text>
    <text x="115" y="228">3×6</text>
    <text x="167" y="228">10×20</text>
    <text x="245" y="228">15×30</text>
  </g>

  <!-- right rectangles -->
  <g filter="url(#sk)">
    <rect x="462" y="197" width="12" height="15" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="524" y="188" width="21" height="24" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="11" fill="#555" font-family="monospace" text-anchor="middle">
    <text x="468" y="232">4×5</text>
    <text x="535" y="232">7×8</text>
  </g>

  <!-- left arrows and boxes -->
  <path d="M 166 240 L 166 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="24" y="264" width="284" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="166" y="285" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">g = gcd(w,h) = 4, 3, 10, 15</text>
  <text x="166" y="303" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">键 (w/g, h/g) = (1, 2)</text>
  <path d="M 166 314 L 166 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="24" y="342" width="284" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="166" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">count[(1,2)] = 4 → C(4,2) = 6 对</text>

  <!-- right arrows and boxes -->
  <path d="M 518 240 L 518 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="396" y="264" width="244" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="518" y="285" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">g = 1，键为 (4,5) 与 (7,8)</text>
  <text x="518" y="303" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">两个互不相同的单例组</text>
  <path d="M 518 314 L 518 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="396" y="342" width="244" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="518" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040" font-family="monospace">C(1,2) + C(1,2) = 0 对</text>

  <!-- separator -->
  <path d="M 372 78 L 372 384" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="24" y="396" width="592" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="417" text-anchor="middle" font-size="11.5" fill="#7a5415">可互换 ⇔ 宽高比相同 ⇔ 最简分数相同；同组 k 个矩形贡献 C(k, 2) = k(k−1)/2 对</text>
</svg>
