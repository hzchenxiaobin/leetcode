<svg xmlns="http://www.w3.org/2000/svg" width="640" height="428" viewBox="0 0 640 428" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="428" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：构造 O(n)，单次查询 O(log n)</text>
  <path d="M 160 40 Q 320 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="168" y="64" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">构造 RangeFreqQuery(arr)</text>
  <text x="478" y="64" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">查询 query(left, right, value)</text>
  <path d="M 322 54 V 412" stroke="#d5d5d5" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#sk)"/>

  <!-- left lane: construction -->
  <g filter="url(#sk2)">
    <rect x="98" y="82" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="168" y="103" text-anchor="middle" font-size="12" fill="#333">开始：pos ← 空表</text>
  <path d="M 168 116 V 138" stroke="#2b6e9e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <g filter="url(#sk2)">
    <rect x="93" y="140" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="168" y="161" text-anchor="middle" font-size="12" fill="#333">for i = 0 … n−1</text>
  <path d="M 168 174 V 196" stroke="#2b6e9e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <g filter="url(#sk2)">
    <rect x="83" y="198" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="168" y="219" text-anchor="middle" font-size="12" fill="#333">pos[arr[i]].append(i)</text>
  <path d="M 253 215 H 283 V 157 H 249" stroke="#2b6e9e" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <text x="285" y="150" text-anchor="middle" font-size="10.5" fill="#666">i += 1</text>
  <path d="M 168 232 V 254" stroke="#2b6e9e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arB)"/>
  <g filter="url(#sk2)">
    <rect x="73" y="256" width="190" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="168" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">完成：各表天然升序</text>
  <text x="168" y="295" text-anchor="middle" font-size="11" fill="#4a7a3a">所有列表总长 = n，共 O(n)</text>
  <text x="168" y="330" text-anchor="middle" font-size="10.5" fill="#888">（哈希表，或值域 10001 的桶数组）</text>
  <g filter="url(#sk)">
    <rect x="48" y="366" width="240" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="168" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">总时间 O(n + q log n)</text>
  <text x="168" y="402" text-anchor="middle" font-size="11" fill="#7a5415">空间 O(n)（桶数组另加 O(V)）</text>

  <!-- right lane: query -->
  <g filter="url(#sk2)">
    <rect x="368" y="82" width="220" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="478" y="103" text-anchor="middle" font-size="12" fill="#333">开始 (left, right, value)</text>
  <path d="M 478 116 V 136" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <polygon points="478,140 566,172 478,204 390,172" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="478" y="176" text-anchor="middle" font-size="11.5" fill="#8a3a36">pos 含 value ?</text>
  <path d="M 566 172 H 574" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arR)"/>
  <text x="571" y="163" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
  <g filter="url(#sk2)">
    <rect x="578" y="155" width="54" height="34" rx="6" fill="#fdeeed" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="605" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 0</text>
  <path d="M 478 204 V 222" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <text x="488" y="218" text-anchor="middle" font-size="10.5" fill="#2e6e2e">是</text>
  <g filter="url(#sk2)">
    <rect x="373" y="224" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="478" y="245" text-anchor="middle" font-size="12" fill="#333">idx = pos[value]（升序）</text>
  <path d="M 478 258 V 276" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <g filter="url(#sk2)">
    <rect x="368" y="278" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="478" y="299" text-anchor="middle" font-size="12" fill="#333">lo = bisect_left(idx, left)</text>
  <path d="M 478 312 V 330" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <g filter="url(#sk2)">
    <rect x="366" y="332" width="224" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="478" y="353" text-anchor="middle" font-size="12" fill="#333">hi = bisect_right(idx, right)</text>
  <path d="M 478 366 V 384" stroke="#2e6e2e" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <g filter="url(#sk)">
    <rect x="393" y="386" width="170" height="34" rx="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="478" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">return hi − lo ✓</text>
</svg>
