<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="600" height="330" fill="#fafafa"/>
  <text x="300" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">一维子数组计数：前缀和 + 哈希表</text>
  <text x="300" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">pre[j] − pre[i] = target  ⟺  pre[i] = pre[j] − target</text>
  <text x="50" y="88" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">前缀和</text>
  <rect x="130" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="88.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="88.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="230" y="68" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="88.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="50" y="148" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">哈希表</text>
  <rect x="130" y="126" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="215" y="151.8" font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">{0:1, 1:1, 4:1, 5:1}</text>
  <text x="330" y="154" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">统计每个前缀和出现的次数</text>
  <rect x="50" y="196" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="213.6" font-size="10" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">扫到 pre[j] 时</text>
  <text x="62" y="229.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">答案 += cnt[pre[j] − target]</text>
  <text x="62" y="245.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">再把 cnt[pre[j]] 加一</text>
  <rect x="320" y="196" width="240" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="332" y="213.6" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">为什么先计数再加一？</text>
  <text x="332" y="229.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">子数组必须非空</text>
  <text x="332" y="245.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">顺序写反会把长度 0 的区间算进去</text>
  <text x="50" y="292" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">哈希表初始为 {0: 1}，表示空前缀，用来覆盖「从第 0 列开始」的子数组。</text>
</svg>
