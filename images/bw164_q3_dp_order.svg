<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">落点行列都严格更大 ⇒ 按行优先顺序做 DP</text>
  <rect x="80" y="110" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106.0" y="141.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="110" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158.0" y="141.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="110" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210.0" y="141.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="162" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106.0" y="193.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="162" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158.0" y="193.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="162" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210.0" y="193.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="214" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106.0" y="245.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="214" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158.0" y="245.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="214" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210.0" y="245.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="68" y="140" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="68" y="192" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="68" y="244" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="106" y="102" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="158" y="102" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="102" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="72" y="292" text-anchor="start" font-size="11" fill="#999" filter="url(#rough2)">1 = 镜子</text>
  <rect x="300" y="100" width="360" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="126" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">转移：dp[落点] += dp[当前]</text>
  <text x="480" y="152" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">两个落点 = h(右) 与 h(下)</text>
  <text x="480" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">出界的落点直接丢弃（路径无效）</text>
  <rect x="300" y="210" width="360" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="236" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">顺序正确性</text>
  <text x="480" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">落点 (r′, c′) 满足 r′ ≥ r 且 c′ ≥ c，</text>
  <text x="480" y="288" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">且不同时为等号 ⇒ 行优先遍历时已算好</text>
  <rect x="60" y="320" width="600" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">示例 1 的 5 条、示例 3 的 1 条，都可由这套转移数出来</text>
  <text x="360" y="364" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">总时间 O(m·n)（反射链做记忆化），m,n ≤ 500</text>
</svg>
