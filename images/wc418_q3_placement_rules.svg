<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察二：两条局部规则，把每个格子「钉死」</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">已放置的邻居把歧义全部吃掉，剩余候选永远唯一</text>

  <!-- 面板 A：整行剥落 -->
  <text x="135" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">规则一：整行已知 ⇒ 逐格剥落</text>

  <!-- 3x4 网格：行 0、1 已放置（示例 3 的前两行），行 2 未知 -->
  <rect x="48" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="148" width="34" height="34" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="82" y="148" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="148" width="34" height="34" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="148" width="34" height="34" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>

  <text x="65" y="101" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="99" y="101" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">0</text>
  <text x="133" y="101" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">5</text>
  <text x="167" y="101" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">3</text>
  <text x="65" y="135" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">7</text>
  <text x="99" y="135" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="133" y="135" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="167" y="135" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">9</text>
  <text x="99" y="170" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">?</text>

  <!-- 焦点 4 → 正下方目标：跨共享边的短箭头 -->
  <path d="M 108 141 L 108 159" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="135" y="204" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">(i−1,j) 的邻居：上方（若有）、左右——全都放置了</text>
  <text x="135" y="220" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">⇒ 唯一未放置的邻居 = 正下方 (i,j)</text>
  <text x="135" y="236" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">j=0 或 C−1 的边界格邻居更少，同样唯一</text>

  <!-- 面板 B：对角公共邻居 -->
  <text x="386" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">规则二：对角格 = 公共邻居</text>

  <!-- 2x2 块 -->
  <rect x="316" y="84" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="84" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="136" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="368" y="136" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5,3" rx="4" filter="url(#rough2)"/>

  <text x="342" y="115" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="394" y="115" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="342" y="167" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="394" y="167" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">d</text>

  <!-- b–d 与 c–d 相邻：共享边加粗 -->
  <path d="M 374 136 L 414 136" stroke="#446688" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <path d="M 368 142 L 368 182" stroke="#446688" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <text x="436" y="126" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">b–d 有边</text>
  <text x="436" y="140" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">c–d 有边</text>

  <text x="386" y="204" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b、c 的公共邻居只有 {a, d}，a 已放置</text>
  <text x="386" y="220" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">⇒ d 唯一，无需猜测</text>
  <text x="386" y="240" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">铺前两行时交替用两条规则：</text>
  <text x="386" y="254" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">(0,j) 用规则一、(1,j) 用规则二，同步前进</text>

  <!-- 底部结论 -->
  <rect x="20" y="286" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">两条规则都只是「数邻居」：度 ≤ 4 ⇒ 每步 O(1)，整个构造线性</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">唯一候选不存在 = 朝向猜错了的信号，换一个朝向重试即可</text>
</svg>
