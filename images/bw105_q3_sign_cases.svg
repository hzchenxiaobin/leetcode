<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">元素分桶：只有 |x| ≥ 2 的数决定乘积量级</text>

  <!-- 三个桶 -->
  <rect x="26" y="56" width="200" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="78" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">大元素：|x| ≥ 2</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="44" y="92" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="61" y="112" fill="#2f4a66">3</text>
    <rect x="84" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="101" y="112" fill="#8c3a36">−5</text>
    <rect x="124" y="92" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="141" y="112" fill="#2f4a66">2</text>
    <rect x="164" y="92" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="181" y="112" fill="#8c3a36">−9</text>
  </g>
  <text x="126" y="146" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">能选尽选：每个都让 |乘积| 至少翻倍</text>
  <text x="126" y="164" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">乘积 P 的符号看负数个数</text>

  <rect x="236" y="56" width="130" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="301" y="78" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">符号工具：−1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="284" y="92" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="301" y="112" fill="#7a5a10">−1</text>
  </g>
  <text x="301" y="146" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">|−1| = 1：乘进小组只翻符号</text>
  <text x="301" y="164" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">不损绝对值 —— 免费纠错！</text>

  <rect x="376" y="56" width="130" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="441" y="78" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">0 与 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="404" y="92" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="421" y="112" fill="#2f5527">0</text>
    <rect x="444" y="92" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="461" y="112" fill="#2f5527">1</text>
  </g>
  <text x="441" y="146" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">0 会把乘积清零 → 尽量不选</text>
  <text x="441" y="164" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">1 不改变乘积 → 需要非空时救命</text>

  <!-- 规则框 -->
  <rect x="26" y="196" width="480" height="140" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a10">
    <text x="46" y="220">① 把所有大元素相乘得 P（若一个都没有 → 只剩 −1/0/1 的小世界）</text>
    <text x="46" y="244">② P 的负号个数为偶数 → 直接取 |P|，正数号就是最大实力</text>
    <text x="46" y="268">③ 负号个数为奇数 → 借一个 −1 乘进去（免费翻正）；没有 −1 就</text>
    <text x="66" y="286">弃掉绝对值最小的那个负大数，让剩下的乘积变正</text>
    <text x="46" y="310">④ 唯一的大数是负数且无 −1 时：有 1 取 1，有 0 取 0，否则只有它自己</text>
    <text x="46" y="330" font-size="11" fill="#a08030">小组必须非空！全 0 数组答案是 0，单个 −9 的答案是 −9</text>
  </g>
</svg>
