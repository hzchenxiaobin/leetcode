<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="370" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：固定 j，最优的 i 是前缀最小值</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- prefix band -->
  <g filter="url(#sk)">
    <rect x="72" y="70" width="154" height="62" rx="8" fill="#e8f0fe" opacity="0.55"/>
  </g>
  <text x="149" y="62" text-anchor="middle" font-size="10.5" fill="#446688">前缀 [0 .. j−1]</text>

  <!-- array cells: 7 1 5 4 -->
  <g filter="url(#sk)">
    <rect x="78" y="76" width="72" height="46" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="114" y="105" text-anchor="middle" font-size="16" fill="#333">7</text>

  <g filter="url(#sk)">
    <rect x="150" y="76" width="72" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="186" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d25">1</text>

  <g filter="url(#sk)">
    <rect x="222" y="76" width="72" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="258" y="105" text-anchor="middle" font-size="16" fill="#333">5</text>

  <g filter="url(#sk)">
    <rect x="294" y="76" width="72" height="46" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="105" text-anchor="middle" font-size="16" fill="#333">4</text>

  <!-- indices -->
  <text x="114" y="140" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="186" y="140" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="258" y="140" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- pairing arcs from preMin cell to each j -->
  <path d="M 186 72 Q 258 18 330 68" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="26" text-anchor="middle" font-size="11.5" fill="#b85450">4 − 1 = 3</text>
  <path d="M 186 72 Q 222 44 256 70" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">5 − 1 = 4 ⭐</text>

  <text x="186" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">preMin = 1</text>
  <text x="258" y="160" text-anchor="middle" font-size="11" fill="#446688">j = 2</text>
  <text x="330" y="160" text-anchor="middle" font-size="11" fill="#446688">j = 3</text>

  <!-- why box -->
  <g filter="url(#sk)">
    <rect x="400" y="72" width="252" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="526" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">固定 j 之后：</text>
  <text x="526" y="118" text-anchor="middle" font-size="12" fill="#5c4512">nums[j] − nums[i] 最大</text>
  <text x="526" y="138" text-anchor="middle" font-size="12" fill="#5c4512">⟺ nums[i] 取前缀最小</text>
  <text x="526" y="160" text-anchor="middle" font-size="11.5" fill="#7a5415">最优 i = argmin nums[0..j−1]</text>
  <text x="526" y="180" text-anchor="middle" font-size="10.5" fill="#a08040">被减数固定，减数越小差越大</text>

  <!-- O(n) box -->
  <g filter="url(#sk)">
    <rect x="66" y="228" width="310" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="221" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">一次遍历维护 preMin</text>
  <text x="221" y="272" text-anchor="middle" font-size="11.5" fill="#4a7a3a">每轮一次比较即可延续最小值，总体 O(n)</text>
  <text x="221" y="288" text-anchor="middle" font-size="10.5" fill="#6b8f60">相等不算增量（判断用严格 &gt;）；i、j 距离不限</text>

  <!-- stock box -->
  <g filter="url(#sk)">
    <rect x="400" y="228" width="252" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="526" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">与 121. 买卖股票同构</text>
  <text x="526" y="271" text-anchor="middle" font-size="11" fill="#446688">nums[i] = 买入价，nums[j] = 卖出价</text>
  <text x="526" y="288" text-anchor="middle" font-size="11" fill="#446688">preMin = 到目前为止的最低买入价</text>

  <text x="340" y="336" text-anchor="middle" font-size="11" fill="#888">用 O(1) 增量更新代替 O(n) 重新扫描——前缀和、前缀最值、单调栈同属此家族</text>
</svg>
