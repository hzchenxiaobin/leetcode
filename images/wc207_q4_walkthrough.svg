<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：cost = [[1,3,5],[4,1,1],[1,5,3]] → 答案 4</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">cheap（列最小）= [1, 1, 1]，B、C 两列的最便宜来源都是点 2</text>

  <!-- ===== Left: cost matrix ===== -->
  <text x="140" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a66" filter="url(#r)">cost 矩阵与主连接选择</text>
  <g font-size="11" font-weight="bold" fill="#666" filter="url(#r)">
    <text x="99" y="86" text-anchor="middle">A</text>
    <text x="149" y="86" text-anchor="middle">B</text>
    <text x="199" y="86" text-anchor="middle">C</text>
    <text x="58" y="106" text-anchor="middle">1</text>
    <text x="58" y="140" text-anchor="middle">2</text>
    <text x="58" y="174" text-anchor="middle">3</text>
  </g>
  <g filter="url(#r)">
    <rect x="76" y="90" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="126" y="90" width="46" height="32" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1"/>
    <rect x="176" y="90" width="46" height="32" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1"/>
    <rect x="76" y="124" width="46" height="32" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1"/>
    <rect x="126" y="124" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="176" y="124" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="76" y="158" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="126" y="158" width="46" height="32" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1"/>
    <rect x="176" y="158" width="46" height="32" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1"/>
    <rect x="76" y="204" width="46" height="28" rx="4" fill="#fffdf0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="126" y="204" width="46" height="28" rx="4" fill="#fffdf0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="176" y="204" width="46" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="12" filter="url(#r)">
    <text x="99" y="111" text-anchor="middle" fill="#2c4a66" font-weight="bold">1</text>
    <text x="149" y="111" text-anchor="middle" fill="#999">3</text>
    <text x="199" y="111" text-anchor="middle" fill="#999">5</text>
    <text x="99" y="145" text-anchor="middle" fill="#999">4</text>
    <text x="149" y="145" text-anchor="middle" fill="#2c4a66" font-weight="bold">1</text>
    <text x="199" y="145" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <text x="99" y="179" text-anchor="middle" fill="#2c4a66" font-weight="bold">1</text>
    <text x="149" y="179" text-anchor="middle" fill="#999">5</text>
    <text x="199" y="179" text-anchor="middle" fill="#999">3</text>
    <text x="99" y="223" text-anchor="middle" fill="#8a6a30" font-size="10.5">1</text>
    <text x="149" y="223" text-anchor="middle" fill="#8a6a30" font-size="10.5">1</text>
    <text x="199" y="223" text-anchor="middle" fill="#7a5415" font-size="10.5" font-weight="bold">1</text>
    <text x="58" y="223" text-anchor="middle" fill="#8a6a30" font-size="10.5" font-weight="bold">cheap</text>
  </g>
  <text x="140" y="254" text-anchor="middle" font-size="10" fill="#777" filter="url(#r)">蓝格 = 主连接（1+1+1 = 3）；橙格 = 兜底来源</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c4a66" filter="url(#r)">mask = {A,B}，C 未覆盖 → +cheap[C] = 1</text>

  <!-- ===== Right: accounting table ===== -->
  <text x="428" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">阶段二汇总：dp[mask] + 兜底</text>
  <g filter="url(#r)">
    <rect x="280" y="82" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="82" width="52" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="404" y="82" width="64" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="472" y="82" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#2c4a66" filter="url(#r)">
    <text x="312" y="99" text-anchor="middle">mask</text>
    <text x="374" y="99" text-anchor="middle">dp</text>
    <text x="436" y="99" text-anchor="middle">兜底</text>
    <text x="500" y="99" text-anchor="middle">合计</text>
  </g>
  <g filter="url(#r)">
    <rect x="280" y="112" width="248" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="11" filter="url(#r)">
    <text x="312" y="128" text-anchor="middle" fill="#2f5d28" font-weight="bold">{A,B}</text>
    <text x="374" y="128" text-anchor="middle" fill="#2f5d28" font-weight="bold">3</text>
    <text x="436" y="128" text-anchor="middle" fill="#2f5d28" font-weight="bold">+1（C）</text>
    <text x="500" y="128" text-anchor="middle" fill="#2f5d28" font-weight="bold">4 ★</text>
    <text x="312" y="156" text-anchor="middle" fill="#666">{A,C}</text>
    <text x="374" y="156" text-anchor="middle" fill="#666">3</text>
    <text x="436" y="156" text-anchor="middle" fill="#666">+1（B）</text>
    <text x="500" y="156" text-anchor="middle" fill="#666">4</text>
    <text x="312" y="184" text-anchor="middle" fill="#666">{A,B,C}</text>
    <text x="374" y="184" text-anchor="middle" fill="#666">5</text>
    <text x="436" y="184" text-anchor="middle" fill="#666">0</text>
    <text x="500" y="184" text-anchor="middle" fill="#666">5</text>
    <text x="312" y="212" text-anchor="middle" fill="#999">{A}</text>
    <text x="374" y="212" text-anchor="middle" fill="#999">6</text>
    <text x="436" y="212" text-anchor="middle" fill="#999">+2</text>
    <text x="500" y="212" text-anchor="middle" fill="#999">8</text>
  </g>
  <text x="428" y="244" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">★ 4 = 3 + 1 —— 兜底比强制罩满（5）便宜</text>

  <!-- ===== Bottom: final bipartite form ===== -->
  <g filter="url(#r)">
    <rect x="36" y="296" width="548" height="186" rx="10" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="322" font-size="11.5" font-weight="bold" fill="#333" filter="url(#r)">最优形态：主连接 3 条（蓝实线）+ 兜底 1 条（橙虚线）</text>

  <g filter="url(#r)">
    <circle cx="130" cy="362" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="130" cy="410" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="130" cy="458" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="320" cy="362" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="410" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="458" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="12" font-weight="bold" filter="url(#r)">
    <text x="130" y="366" text-anchor="middle" fill="#2f5d28">1</text>
    <text x="130" y="414" text-anchor="middle" fill="#2f5d28">2</text>
    <text x="130" y="462" text-anchor="middle" fill="#2f5d28">3</text>
    <text x="320" y="366" text-anchor="middle" fill="#2c4a66">A</text>
    <text x="320" y="414" text-anchor="middle" fill="#2c4a66">B</text>
    <text x="320" y="462" text-anchor="middle" fill="#7a5415">C</text>
  </g>
  <g filter="url(#r)">
    <line x1="145" y1="362" x2="305" y2="362" stroke="#446688" stroke-width="2.4"/>
    <line x1="145" y1="410" x2="305" y2="410" stroke="#446688" stroke-width="2.4"/>
    <line x1="145" y1="452" x2="305" y2="372" stroke="#446688" stroke-width="2.4"/>
    <line x1="145" y1="416" x2="305" y2="452" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="6 4"/>
  </g>
  <g font-size="10" filter="url(#r)">
    <text x="225" y="354" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="225" y="402" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="248" y="428" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="180" y="444" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <text x="212" y="452" text-anchor="middle" fill="#b07818" font-size="8.5">兜底</text>
  </g>

  <g font-size="10.5" filter="url(#r)">
    <text x="380" y="360" font-size="12" font-weight="bold" fill="#2f5d28">总成本 = 1+1+1 + 1 = 4</text>
    <text x="380" y="388" fill="#555">强制主连接罩满：1–A、2–B、3–C = 1+1+3 = 5</text>
    <text x="380" y="410" fill="#555">让点 2 用兜底边捎上 C：3 + 1 = 4</text>
    <text x="380" y="438" fill="#7a2828">B、C 的最便宜来源都是点 2，但主连接名额只有一条</text>
    <text x="380" y="456" fill="#7a2828">——兜底不限量，恰好补位</text>
  </g>
</svg>
