<svg xmlns="http://www.w3.org/2000/svg" width="780" height="452" viewBox="0 0 780 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="452" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：解出人数最少的那道题决定答案</text>
  <path d="M 150 42 Q 390 49 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 具体例子说明 -->
  <text x="34" y="72" font-size="12.5" fill="#66788c" filter="url(#rough2)">例子：n = 6 名选手，三题解出人数 a = (4, 3, 2)；实心格 = 该选手解出了该题</text>

  <!-- 列号 -->
  <text x="118" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="174" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="230" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="286" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="342" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="398" y="98" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">6</text>
  <text x="90" y="98" text-anchor="end" font-size="10.5" fill="#66788c" filter="url(#rough2)">选手</text>

  <!-- 第 1 题：前 4 人解出 -->
  <text x="84" y="130" text-anchor="end" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 1 题 (a₁=4)</text>
  <rect x="90" y="108" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="133" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="146" y="108" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="133" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="202" y="108" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="133" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="258" y="108" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="133" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="314" y="108" width="56" height="38" rx="5" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="370" y="108" width="56" height="38" rx="5" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 第 2 题：前 3 人解出 -->
  <text x="84" y="174" text-anchor="end" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 2 题 (a₂=3)</text>
  <rect x="90" y="152" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="177" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="146" y="152" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="177" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="202" y="152" width="56" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="177" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">●</text>
  <rect x="258" y="152" width="56" height="38" rx="5" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="314" y="152" width="56" height="38" rx="5" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="370" y="152" width="56" height="38" rx="5" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 第 3 题：前 2 人解出（最小） -->
  <text x="84" y="212" text-anchor="end" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 3 题 (a₃=2)</text>
  <text x="84" y="228" text-anchor="end" font-size="10.5" fill="#8a6015" filter="url(#rough2)">人数最少</text>
  <rect x="90" y="196" width="56" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="118" y="221" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">●</text>
  <rect x="146" y="196" width="56" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="174" y="221" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">●</text>
  <rect x="202" y="196" width="56" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="258" y="196" width="56" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="314" y="196" width="56" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="370" y="196" width="56" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 红色括号标出必弱的人 -->
  <path d="M 206 240 L 206 248 M 206 244 L 424 244 M 424 244 L 424 240" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="315" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">这 4 人没解出第 3 题 ⇒ 必弱（n − a₃ = 6 − 2 = 4）</text>

  <!-- 右侧构造框 -->
  <rect x="452" y="104" width="308" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="606" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">构造：4 个弱恰好够用</text>
  <text x="466" y="152" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">① m = min(4,3,2) = 2，让选手 1、2 三题全解；</text>
  <text x="466" y="174" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">② 第 1 题还差 2 人（选手 3、4），第 2 题还差 1</text>
  <text x="466" y="192" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">　　人（选手 3），第 3 题不差人（a₃ = m）；</text>
  <text x="466" y="214" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">③ 选手 5、6 一题都不解。这 4 人全都没解第 3</text>
  <text x="466" y="232" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">　　题，必然弱，且满分人数恰为 2。</text>

  <!-- 结论条 -->
  <rect x="34" y="286" width="726" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="310" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">下界（任何记分板都成立）：最多 min(a₁,a₂,a₃) 个满分选手，故弱 ≥ n − min(a₁,a₂,a₃)。</text>
  <text x="46" y="332" font-size="12.5" fill="#8a6015" filter="url(#rough2)">上界（构造达到）：照上面三步摆，弱人数恰为 n − min(a₁,a₂,a₃)。两边夹住 ⇒ 答案就是这个式子。</text>
  <text x="390" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 = n − min(a₁, a₂, a₃) = 6 − 2 = 4</text>
  <path d="M 240 382 Q 390 389 540 382" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="410" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">注意：弱 ≠ 一题都没解出。少解一题就算弱，所以用「最少人解出的那题」去卡最省事。</text>
  <text x="390" y="434" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">三题的人数可以完全不同（4 / 3 / 2），但答案只由其中最小的那个数说话。</text>
</svg>
