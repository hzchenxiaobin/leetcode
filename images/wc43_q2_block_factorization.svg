<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">操作序列切段：每段 = 1 次 Copy All + k 次 Paste</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">段因子 f = k+1，整条序列就是一个满足 ∏f_i = n 的乘法分拆</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <rect x="46" y="66" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="96" y="66" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="146" y="66" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="66" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="246" y="66" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="296" y="66" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="346" y="66" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="67" y="91" fill="#3a4a66">C</text>
    <text x="117" y="91" fill="#3a4a66">P</text>
    <text x="167" y="91" fill="#3a5a30">C</text>
    <text x="217" y="91" fill="#3a5a30">P</text>
    <text x="267" y="91" fill="#8a6a20">C</text>
    <text x="317" y="91" fill="#8a6a20">P</text>
    <text x="367" y="91" fill="#8a6a20">P</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#999">
    <text x="67" y="119">1</text><text x="117" y="119">2</text><text x="167" y="119">3</text>
    <text x="217" y="119">4</text><text x="267" y="119">5</text><text x="317" y="119">6</text>
    <text x="367" y="119">7</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke-width="1.4">
    <path d="M 46 128 L 46 136 L 138 136 L 138 128" stroke="#446688"/>
    <path d="M 146 128 L 146 136 L 238 136 L 238 128" stroke="#4a7a3a"/>
    <path d="M 246 128 L 246 136 L 388 136 L 388 128" stroke="#d6a040"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="92" y="156" fill="#446688">段 1：f = 2</text>
    <text x="192" y="156" fill="#4a7a3a">段 2：f = 2</text>
    <text x="317" y="156" fill="#a07a20">段 3：f = 3</text>
  </g>

  <rect x="36" y="176" width="240" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="198" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">段内推导</text>
  <text x="48" y="220" font-size="10" fill="#555" filter="url(#rough2)">屏幕 s → s·(1+k)，每段乘上 f = k+1</text>
  <text x="48" y="242" font-size="10" fill="#555" filter="url(#rough2)">每段代价 = 1 + k = f</text>
  <text x="48" y="264" font-size="10" fill="#555" filter="url(#rough2)">n = f₁·f₂⋯f_m，代价 = Σf_i</text>

  <path d="M 278 232 L 290 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="292" y="176" width="232" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="304" y="198" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">目标</text>
  <text x="304" y="220" font-size="10" fill="#3a5a30" filter="url(#rough2)">min Σf_i　s.t. ∏f_i = n</text>
  <text x="304" y="242" font-size="10" fill="#555" filter="url(#rough2)">f_i 为 ≥ 2 的整数</text>
  <text x="304" y="264" font-size="10" fill="#555" filter="url(#rough2)">→ 乘法分拆的最小元素和</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">关键：f 还能拆成 a·b（a,b ≥ 2），而 a + b ≤ a·b，所以拆得越细总代价越小</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">一路拆到全是素数，最小值就是 n 的素因子之和（含重数）</text>
</svg>
