<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：G = 1—2—3，(1,1) → (3,3) 共 6 步</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「走路」只改第二坐标；「交换」把两个坐标互换，要求两者相邻</text>

  <rect x="36" y="58" width="548" height="26" fill="#eef2f7" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">步</text>
  <text x="188" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">状态</text>
  <text x="264" y="76" font-size="11" fill="#555" filter="url(#rough2)">动作</text>
  <text x="532" y="76" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">累计</text>

  <rect x="36" y="84" width="548" height="30" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="36" y="264" width="548" height="30" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <line x1="36" y1="114" x2="584" y2="114" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="144" x2="584" y2="144" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="174" x2="584" y2="174" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="204" x2="584" y2="204" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="234" x2="584" y2="234" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="264" x2="584" y2="264" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <line x1="36" y1="294" x2="584" y2="294" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="76" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="188" y="104" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">1_1</text>
  <text x="264" y="104" font-size="11" fill="#333" filter="url(#rough2)">起点（w=1，x=1）</text>
  <text x="532" y="104" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="76" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1_2</text>
  <text x="264" y="134" font-size="11" fill="#333" filter="url(#rough2)">走路 1→2（只改第二坐标）</text>
  <text x="532" y="134" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>

  <text x="76" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="188" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2_1</text>
  <text x="264" y="164" font-size="11" fill="#b8873a" filter="url(#rough2)">交换（1～2 相邻）</text>
  <text x="532" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="76" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="188" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2_2</text>
  <text x="264" y="194" font-size="11" fill="#333" filter="url(#rough2)">走路 1→2</text>
  <text x="532" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="76" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="188" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2_3</text>
  <text x="264" y="224" font-size="11" fill="#333" filter="url(#rough2)">走路 2→3</text>
  <text x="532" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <text x="76" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="188" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3_2</text>
  <text x="264" y="254" font-size="11" fill="#b8873a" filter="url(#rough2)">交换（2～3 相邻）</text>
  <text x="532" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <text x="76" y="284" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="188" y="284" text-anchor="middle" font-size="12" fill="#33591f" filter="url(#rough2)">3_3</text>
  <text x="264" y="284" font-size="11" fill="#33591f" filter="url(#rough2)">走路 2→3，到达终点</text>
  <text x="532" y="284" text-anchor="middle" font-size="11.5" fill="#33591f" filter="url(#rough2)">6</text>

  <rect x="28" y="304" width="564" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="327" text-anchor="middle" font-size="10.8" fill="#6b4e12" filter="url(#rough2)">分支①：w=1 ≠ y=3，不生效；　分支②：1 与 3 不相邻，不生效</text>
  <text x="310" y="350" text-anchor="middle" font-size="10.8" fill="#6b4e12" filter="url(#rough2)">分支③：N(w)=N(y)={2}，取 v=u=2，得 A[2]=d(x,2)=1</text>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#a05a10" filter="url(#rough2)">ans = A[2] + 4 + d(z,2) = 1 + 4 + 1 = 6 ✓</text>
</svg>
