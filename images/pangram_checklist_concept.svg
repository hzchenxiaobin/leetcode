<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：26 个字母的「打勾清单」</text>
  <path d="M 200 44 Q 360 52 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sentence -->
  <g filter="url(#sk)">
    <rect x="110" y="62" width="500" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="360" y="90" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">sentence = "thequickbrownfoxjumpsoverthelazydog"</text>

  <path d="M 360 108 L 360 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="124" font-size="11.5" fill="#666">逐个扫描，见到字母就打勾</text>

  <!-- checklist row 1: a..m -->
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3">
    <rect x="84" y="138" width="36" height="40" rx="4"/>
    <rect x="128" y="138" width="36" height="40" rx="4"/>
    <rect x="172" y="138" width="36" height="40" rx="4"/>
    <rect x="216" y="138" width="36" height="40" rx="4"/>
    <rect x="260" y="138" width="36" height="40" rx="4"/>
    <rect x="304" y="138" width="36" height="40" rx="4"/>
    <rect x="348" y="138" width="36" height="40" rx="4"/>
    <rect x="392" y="138" width="36" height="40" rx="4"/>
    <rect x="436" y="138" width="36" height="40" rx="4"/>
    <rect x="480" y="138" width="36" height="40" rx="4"/>
    <rect x="524" y="138" width="36" height="40" rx="4"/>
    <rect x="568" y="138" width="36" height="40" rx="4"/>
    <rect x="612" y="138" width="36" height="40" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="12.5" fill="#2b2b2b" text-anchor="middle">
    <text x="102" y="155">a</text><text x="146" y="155">b</text><text x="190" y="155">c</text>
    <text x="234" y="155">d</text><text x="278" y="155">e</text><text x="322" y="155">f</text>
    <text x="366" y="155">g</text><text x="410" y="155">h</text><text x="454" y="155">i</text>
    <text x="498" y="155">j</text><text x="542" y="155">k</text><text x="586" y="155">l</text>
    <text x="630" y="155">m</text>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="102" y="172">✓</text><text x="146" y="172">✓</text><text x="190" y="172">✓</text>
    <text x="234" y="172">✓</text><text x="278" y="172">✓</text><text x="322" y="172">✓</text>
    <text x="366" y="172">✓</text><text x="410" y="172">✓</text><text x="454" y="172">✓</text>
    <text x="498" y="172">✓</text><text x="542" y="172">✓</text><text x="586" y="172">✓</text>
    <text x="630" y="172">✓</text>
  </g>

  <!-- checklist row 2: n..z -->
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3">
    <rect x="84" y="190" width="36" height="40" rx="4"/>
    <rect x="128" y="190" width="36" height="40" rx="4"/>
    <rect x="172" y="190" width="36" height="40" rx="4"/>
    <rect x="216" y="190" width="36" height="40" rx="4"/>
    <rect x="260" y="190" width="36" height="40" rx="4"/>
    <rect x="304" y="190" width="36" height="40" rx="4"/>
    <rect x="348" y="190" width="36" height="40" rx="4"/>
    <rect x="392" y="190" width="36" height="40" rx="4"/>
    <rect x="436" y="190" width="36" height="40" rx="4"/>
    <rect x="480" y="190" width="36" height="40" rx="4"/>
    <rect x="524" y="190" width="36" height="40" rx="4"/>
    <rect x="568" y="190" width="36" height="40" rx="4"/>
    <rect x="612" y="190" width="36" height="40" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="12.5" fill="#2b2b2b" text-anchor="middle">
    <text x="102" y="207">n</text><text x="146" y="207">o</text><text x="190" y="207">p</text>
    <text x="234" y="207">q</text><text x="278" y="207">r</text><text x="322" y="207">s</text>
    <text x="366" y="207">t</text><text x="410" y="207">u</text><text x="454" y="207">v</text>
    <text x="498" y="207">w</text><text x="542" y="207">x</text><text x="586" y="207">y</text>
    <text x="630" y="207">z</text>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="102" y="224">✓</text><text x="146" y="224">✓</text><text x="190" y="224">✓</text>
    <text x="234" y="224">✓</text><text x="278" y="224">✓</text><text x="322" y="224">✓</text>
    <text x="366" y="224">✓</text><text x="410" y="224">✓</text><text x="454" y="224">✓</text>
    <text x="498" y="224">✓</text><text x="542" y="224">✓</text><text x="586" y="224">✓</text>
    <text x="630" y="224">✓</text>
  </g>

  <text x="360" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">扫完全串：26 个格子全有勾 → 勾数 = 26</text>

  <!-- implementation 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="278" width="300" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="210" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">实现一：布尔数组 seen[26]</text>
  <text x="210" y="322" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">seen[c-'a'] = true</text>
  <text x="210" y="338" text-anchor="middle" font-size="11" fill="#666">最后数勾：cnt == 26 ?</text>

  <!-- implementation 2 -->
  <g filter="url(#sk)">
    <rect x="360" y="278" width="300" height="70" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="510" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">实现二：26 位掩码 mask</text>
  <text x="510" y="322" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">mask |= 1 &lt;&lt; (c - 'a')</text>
  <text x="510" y="338" text-anchor="middle" font-size="11" fill="#666">最后判：mask == (1&lt;&lt;26)-1 ?</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="160" y="370" width="400" height="54" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="360" y="392" text-anchor="middle" font-size="13" fill="#7a5415">每个字母至少出现一次</text>
  <text x="360" y="413" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">是全字母句 → true ✓</text>
</svg>
