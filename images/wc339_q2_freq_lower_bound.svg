<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最少行数 = 元素的最大频次 maxFreq</text>

  <!-- input array: nums = [1,3,4,1,2,3,1], cells w=44 h=34, y=42 -->
  <text x="104" y="64" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="126" y="42" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="170" y="42" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="258" y="42" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="302" y="42" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="346" y="42" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="390" y="42" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="64" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <text x="280" y="98" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">值 1（红）出现 3 次：每行至多放 1 个「1」⇒ 3 份副本必须散进 3 个不同的行（鸽笼）</text>

  <path d="M 280 106 L 280 130" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left panel: frequency histogram, baseline y=310 -->
  <line x1="55" y1="310" x2="315" y2="310" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="216" text-anchor="end" font-size="11.5" fill="#777" filter="url(#rough2)">f(x)</text>
  <rect x="80" y="220" width="40" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="140" y="280" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="274" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="200" y="250" width="40" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="244" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="260" y="280" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="100" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">值1</text>
  <text x="160" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">值2</text>
  <text x="220" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">值3</text>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">值4</text>
  <line x1="55" y1="220" x2="316" y2="220" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="58" y="212" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">maxFreq = 3</text>
  <text x="185" y="352" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">左：频次直方图，f(1)=3 最大</text>

  <path d="M 322 265 L 338 265" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right panel: construction, k-th occurrence into row k -->
  <text x="448" y="185" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">构造：第 k 次出现放进第 k 行</text>
  <text x="352" y="232" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">第0行</text>
  <rect x="388" y="216" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="402" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="419" y="216" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="433" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="450" y="216" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="464" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="481" y="216" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="495" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="352" y="266" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">第1行</text>
  <rect x="388" y="250" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="402" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="419" y="250" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="433" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="352" y="300" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">第2行</text>
  <rect x="388" y="284" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="402" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="448" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每行各含一个 1，行数 = 3 = maxFreq ✓</text>

  <!-- bottom summary -->
  <rect x="70" y="364" width="420" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">下界 R ≥ maxFreq（鸽笼）+ 上界构造可行（右）⇒ 最少行数 = maxFreq</text>
</svg>
