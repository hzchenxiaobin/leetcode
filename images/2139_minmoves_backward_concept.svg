<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：反向倒推——用「偶数判定」代替「时机决策」</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: forward dilemma ====== -->
  <text x="48" y="66" font-size="12.5" font-weight="bold" fill="#446688">① 正向（1 → target）：每步「+1 还是 ×2」局部难判</text>
  <g filter="url(#sk)">
    <rect x="56" y="92" width="40" height="32" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="130" y="92" width="40" height="32" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="204" y="92" width="40" height="32" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="278" y="92" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="388" y="92" width="40" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="508" y="92" width="46" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="76" y="113">1</text><text x="150" y="113">2</text><text x="224" y="113">3</text>
    <text x="298" y="113">4</text><text x="408" y="113">9</text><text x="531" y="113" fill="#b85450">19</text>
  </g>
  <text x="348" y="114" text-anchor="middle" font-size="15" fill="#999">···</text>
  <text x="462" y="114" text-anchor="middle" font-size="15" fill="#999">···</text>
  <g filter="url(#sk)">
    <path d="M 96 108 L 127 108" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 170 108 L 201 108" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 244 108 L 275 108" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 428 108 L 505 108" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#777">
    <text x="112" y="100">+1</text><text x="186" y="100">+1</text><text x="260" y="100">+1</text><text x="468" y="100">+1 ×n</text>
  </g>
  <g filter="url(#sk)">
    <rect x="253" y="132" width="92" height="24" rx="9" fill="#fff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="352" y="132" width="122" height="24" rx="9" fill="#fff" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 299 132 L 298 126" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M 413 132 L 409 126" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)"/>
  </g>
  <text x="299" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">现在 ×2 ？</text>
  <text x="413" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">还是攒到 9 再 ×2 ？</text>
  <text x="618" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">局部难判 ✗</text>
  <text x="618" y="122" text-anchor="middle" font-size="10" fill="#b85450">（后效性）</text>

  <!-- ====== reverse arrow ====== -->
  <path d="M 600 178 Q 340 202 88 178" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">反向思考：从 target 倒推回 1</text>

  <!-- ====== Section 2: backward chain ====== -->
  <text x="48" y="208" font-size="12.5" font-weight="bold" fill="#446688">② 反向（target → 1）：判据唯一，每步确定</text>
  <g filter="url(#sk)">
    <rect x="56" y="222" width="42" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="134" y="222" width="42" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="212" y="222" width="42" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="290" y="222" width="42" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="368" y="222" width="42" height="34" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="560" y="222" width="42" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="77" y="240">19</text><text x="155" y="240">18</text><text x="233" y="240">9</text>
    <text x="311" y="240">8</text><text x="389" y="240">4</text><text x="581" y="240" fill="#2f5d24">1</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#999">
    <text x="77" y="252">d=2</text><text x="155" y="252">d=2</text><text x="233" y="252">d=1</text>
    <text x="311" y="252">d=1</text><text x="389" y="252">d=0</text><text x="581" y="252">终点</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 98 239 L 131 239" stroke="#d6a040" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 176 239 L 209 239" stroke="#4a7a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 254 239 L 287 239" stroke="#d6a040" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 332 239 L 365 239" stroke="#4a7a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 410 239 L 557 239" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <text x="115" y="231" fill="#d6a040">−1</text>
    <text x="193" y="231" fill="#4a7a3a">÷2</text>
    <text x="271" y="231" fill="#d6a040">−1</text>
    <text x="349" y="231" fill="#4a7a3a">÷2</text>
    <text x="484" y="231" fill="#b8860b">+3</text>
  </g>
  <text x="484" y="264" text-anchor="middle" font-size="10.5" fill="#b8860b">配额尽：剩余 4 − 1 = 3 步，一次算清</text>

  <!-- ====== rules ====== -->
  <g filter="url(#sk)">
    <rect x="56" y="284" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="356" y="284" width="268" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="196" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">x 为偶数 且 配额 &gt; 0 → ÷2</text>
  <text x="196" y="319" text-anchor="middle" font-size="10.5" fill="#555">一步把数减半，永不吃亏（§5 定理）</text>
  <text x="490" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">x 为奇数（或配额尽）→ −1</text>
  <text x="490" y="319" text-anchor="middle" font-size="10.5" fill="#555">唯一可行的逆操作</text>

  <!-- ====== callouts ====== -->
  <g filter="url(#sk)">
    <rect x="56" y="348" width="568" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="368" text-anchor="middle" font-size="12" fill="#333">翻倍的收益：在值 v 处 ×2 只花 1 步，纯 +1 走完需 v 步 → 净省 v − 1 步</text>
  <text x="340" y="386" text-anchor="middle" font-size="11" fill="#555">v 越大越划算——翻倍是稀缺配额，应当花在尽量大的数上</text>
  <g filter="url(#sk)">
    <rect x="56" y="402" width="568" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">反向 ÷2 天然从当前最大的数开始消耗配额</text>
  <text x="340" y="436" text-anchor="middle" font-size="11" fill="#444">逆看回去：翻倍恰好发生在正向链上最大的可翻倍位置 ✓</text>
</svg>
