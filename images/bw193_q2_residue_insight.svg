<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：有韧性 ⟺ 全部同余 + 长度整除条件</text>

  <!-- 子数组一行 -->
  <rect x="130" y="50" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a₁</text>
  <rect x="194" y="50" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a₂</text>
  <text x="268" y="71" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">⋯</text>
  <rect x="296" y="50" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">aₘ</text>
  <rect x="380" y="50" width="228" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="71" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">删除任意 aᵢ ⟹ 剩余和 S − aᵢ</text>
  <text x="250" y="110" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">总和 S = a₁ + a₂ + ⋯ + aₘ，子数组长度 m</text>

  <!-- 推导链 -->
  <rect x="40" y="130" width="178" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="152" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k 整除每个 S − aᵢ</text>
  <text x="129" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⟺ aᵢ ≡ S (mod k)，∀i</text>
  <path d="M222,158 L246,158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="130" width="172" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">所有 aᵢ 模 k 同余</text>
  <text x="338" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">公共余数 r，且 S ≡ r</text>
  <path d="M428,158 L452,158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="458" y="130" width="147" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="531" y="152" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">S ≡ m·r (mod k)</text>
  <text x="531" y="172" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">⟹ (m−1)·r ≡ 0 (mod k)</text>

  <!-- 结论框 -->
  <rect x="40" y="206" width="565" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="227" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有韧性 ⟺ ① 所有元素模 k 同余（公共余数 r）</text>
  <text x="322" y="247" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② (m−1)·r ≡ 0 (mod k)</text>

  <!-- gcd 化简 -->
  <rect x="40" y="274" width="565" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="294" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">令 d = k / gcd(r, k)，则 (m−1)·r ≡ 0 (mod k) ⟺ d 整除 (m−1)</text>
  <text x="322" y="314" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">合法长度：m = 1, 1+d, 1+2d, …（首项 1、公差 d 的等差数列）</text>

  <!-- 两个特例 -->
  <rect x="40" y="348" width="277" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="369" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">r = 0：元素全是 k 的倍数</text>
  <text x="178" y="389" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">gcd(0, k) = k ⟹ d = 1，任意长度合法</text>
  <rect x="333" y="348" width="272" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="469" y="369" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m = 1：单元素子数组</text>
  <text x="469" y="389" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">剩余和为 0，任何 k 都能整除</text>

  <text x="320" y="432" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">合法长度只取决于 (r, k)，与元素具体数值无关 —— 每个同余段一次除法即可定长</text>
</svg>
