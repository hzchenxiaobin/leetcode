<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">快慢指针：slow 每轮 1 步，fast 每轮 2 步，fast 到底时 slow 恰在中间</text>

  <!-- 奇数链表 -->
  <text x="30" y="72" font-size="12" fill="#446688" filter="url(#rough2)">奇数个结点 1→2→3→4→5</text>
  <g>
    <rect x="40" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="63" y="114" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">1</text>
    <rect x="106" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="129" y="114" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">2</text>
    <rect x="172" y="88" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="195" y="114" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">3</text>
    <rect x="238" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="261" y="114" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">4</text>
    <rect x="304" y="88" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="327" y="114" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">5</text>
  </g>
  <path d="M86 108 L106 108 M152 108 L172 108 M218 108 L238 108 M284 108 L304 108"
        stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="195" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 3（唯一的中间结点）</text>

  <!-- 偶数链表 -->
  <text x="30" y="196" font-size="12" fill="#b07d20" filter="url(#rough2)">偶数个结点 1→2→3→4→5→6</text>
  <g>
    <rect x="40" y="212" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="63" y="238" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">1</text>
    <rect x="106" y="212" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="129" y="238" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">2</text>
    <rect x="172" y="212" width="46" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="195" y="238" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">3</text>
    <rect x="238" y="212" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="261" y="238" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">4</text>
    <rect x="304" y="212" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="327" y="238" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">5</text>
    <rect x="370" y="212" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="393" y="238" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">6</text>
  </g>
  <path d="M86 232 L106 232 M152 232 L172 232 M218 232 L238 232 M284 232 L304 232 M350 232 L370 232"
        stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="261" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 4（第二个中间结点）</text>

  <!-- 关键代码片段 -->
  <rect x="440" y="60" width="196" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="538" y="84" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">循环条件</text>
  <text x="456" y="110" font-size="11" fill="#2c4a63" filter="url(#rough2)">while fast and fast.next:</text>
  <text x="456" y="134" font-size="11" fill="#2c4a63" filter="url(#rough2)">    slow = slow.next</text>
  <text x="456" y="158" font-size="11" fill="#2c4a63" filter="url(#rough2)">    fast = fast.next.next</text>

  <rect x="440" y="196" width="196" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="538" y="220" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">只写 fast 会空指针</text>
  <text x="456" y="246" font-size="11" fill="#8d3b37" filter="url(#rough2)">偶数长度时 fast 会走到 null</text>
  <text x="456" y="268" font-size="11" fill="#8d3b37" filter="url(#rough2)">必须先判 fast.next 是否存在</text>

  <text x="30" y="316" font-size="11" fill="#666" filter="url(#rough2)">「两个中间结点时返回第二个」正是 fast 走满 2 步、slow 只走 1 步的自然结果</text>
</svg>
