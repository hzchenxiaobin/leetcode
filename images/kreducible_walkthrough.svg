<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = "1000"（n = 8），k = 2</text>
  <text x="310" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">第一步造 steps 小表与判定集 A，第二步只在 '1' 位分岔计数</text>

  <!-- 左：steps 表 -->
  <rect x="25" y="62" width="280" height="152" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">steps 表（c 约简到 1 的步数）</text>
  <g filter="url(#rough2)">
    <rect x="41" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="71" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="101" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="131" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="161" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="191" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="221" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="251" y="94" width="28" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="41" y="118" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="71" y="118" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="101" y="118" width="28" height="22" rx="3" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="131" y="118" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="161" y="118" width="28" height="22" rx="3" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="191" y="118" width="28" height="22" rx="3" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="221" y="118" width="28" height="22" rx="3" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="251" y="118" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#333">
    <text x="55" y="109">1</text><text x="85" y="109">2</text><text x="115" y="109">3</text><text x="145" y="109">4</text>
    <text x="175" y="109">5</text><text x="205" y="109">6</text><text x="235" y="109">7</text><text x="265" y="109">8</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">
    <text x="55" y="133">0</text><text x="85" y="133">1</text><text x="115" y="133">2</text><text x="145" y="133">1</text>
    <text x="175" y="133">2</text><text x="205" y="133">2</text><text x="235" y="133">3</text><text x="265" y="133">1</text>
  </g>
  <text x="35" y="109" font-size="9.5" fill="#777" filter="url(#rough2)">c</text>
  <text x="25" y="133" font-size="8.5" fill="#777" filter="url(#rough2)">steps</text>
  <text x="165" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">A = { c : steps(c) ≤ 1 } = {1, 2, 4, 8}（2 的幂）</text>
  <text x="165" y="184" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">绿格 = A 成员；如 3 → 2 → 1 需 2 步，不在 A 中</text>
  <text x="165" y="202" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">递推：steps[c] = 1 + steps[pc(c)]</text>

  <!-- 右：分岔计数 -->
  <rect x="330" y="62" width="265" height="152" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="462" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">分岔计数（唯一 '1' 位 i = 0）</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#333">
    <text x="348" y="110">s = 1000：分歧位 i = 0</text>
    <text x="348" y="132">ones = 0，自由后缀 3 位</text>
    <text x="348" y="154">N(1) = C(3,1) = 3 → {1, 2, 4}</text>
    <text x="348" y="176">N(2) = C(3,2) = 3 → {3, 5, 6}</text>
    <text x="348" y="198">N(4) = C(3,4) = 0，N(8) = 0</text>
  </g>

  <!-- 结果 -->
  <rect x="120" y="228" width="380" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">ans = 3 + 3 = 6 ✓（x = 1, 2, 3, 4, 5, 6）</text>

  <!-- 验证 -->
  <rect x="40" y="290" width="540" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">逐个验证（k = 2）：</text>
  <text x="310" y="335" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1（0 步）、2=10₂→1（1 步）、3=11₂→2→1（2 步）、4=100₂→1（1 步）</text>
  <text x="310" y="355" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5=101₂→2→1（2 步）、6=110₂→2→1（2 步）—— 全部至多 2 步 ✓</text>
  <text x="310" y="373" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">7=111₂→3→2→1 需 3 步 &gt; 2，被排除 ✓</text>

  <text x="310" y="410" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">示例 1（s = "111", k = 1）：A = {1}，ans = C(2,1) + C(1,0) + C(0,−1) = 2 + 1 + 0 = 3 ✓</text>
</svg>
