<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">最小和分割：小的数位放到高位</text>

  <!-- 原数字 -->
  <text x="80" y="80" font-size="13" fill="#666" filter="url(#rough2)">num = 4325</text>
  <rect x="150" y="60" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="60" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="60" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="60" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="205" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="243" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="281" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 210 100 L 210 128" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="122" font-size="12" fill="#446688" filter="url(#rough2)">数位升序排序</text>

  <!-- 排序后的数位 -->
  <rect x="150" y="134" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="134" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="134" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="134" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="154" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="205" y="154" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="243" y="154" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="281" y="154" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- 轮流分配箭头 -->
  <path d="M 167 168 C 140 196 128 214 122 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 243 168 C 240 200 240 216 240 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 205 168 C 230 200 260 218 288 236" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 281 168 C 320 202 350 222 386 236" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="96" y="212" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 0、2 个 → num1</text>
  <text x="330" y="212" font-size="12" fill="#d6a040" filter="url(#rough2)">第 1、3 个 → num2</text>

  <!-- 两个结果 -->
  <rect x="96" y="240" width="52" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="122" y="261" text-anchor="middle" font-size="15" fill="#2f5527" filter="url(#rough2)">24</text>
  <rect x="360" y="240" width="52" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="261" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">35</text>

  <text x="212" y="262" font-size="16" fill="#333" filter="url(#rough2)">+</text>
  <path d="M 154 256 L 200 256" stroke="#b85450" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="196" y="288" width="140" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="266" y="313" text-anchor="middle" font-size="17" fill="#8c3a36" filter="url(#rough2)">24 + 35 = 59</text>
</svg>
