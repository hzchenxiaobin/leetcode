<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="366" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">每根钢筋三种去向，转移后仍用 (d, s) 表示</text>
  <rect x="190" y="60" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">当前 (d, s)，长度 x</text>
  <path d="M 260 106 L 120 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 106 L 280 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 106 L 440 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="170" width="180" height="56" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="192" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold" filter="url(#rough2)">不用这根</text>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">(d, s) 不变</text>
  <rect x="190" y="170" width="180" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">贴到 a 侧</text>
  <text x="280" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(d + x, min(a + x, b))</text>
  <rect x="380" y="170" width="180" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="192" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">贴到 b 侧</text>
  <text x="470" y="212" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(d - x, min(a, b + x))</text>
  <rect x="40" y="246" width="500" height="54" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[d] = 同差值下 min(a,b) 的【最大值】</text>
  <text x="290" y="288" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">同 d 时较矮一侧更高者必胜出（差值相同 ⇒ 后续同步增长）</text>
  <rect x="40" y="310" width="500" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="335" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">第 i 根只能选一种去向 ⇒ 先拷贝旧数组（0-1 背包写法）</text>
</svg>
