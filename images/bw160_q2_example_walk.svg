<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：m=2, n=2, waitCost=[[3,5],[2,4]]</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">答案 9</text>
  <rect x="40" y="66" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="84.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步骤</text>
  <rect x="130" y="66" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175.0" y="84.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">位置</text>
  <rect x="220" y="66" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="84.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">付费类型</text>
  <rect x="320" y="66" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="405.0" y="84.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">金额</text>
  <rect x="490" y="66" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="530.0" y="84.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">累计</text>
  <rect x="40" y="94" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="112.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">第 1 秒</text>
  <rect x="130" y="94" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175.0" y="112.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(0,0)</text>
  <rect x="220" y="94" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270.0" y="112.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">入场</text>
  <rect x="320" y="94" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405.0" y="112.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(0+1)(0+1) = 1</text>
  <rect x="490" y="94" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="112.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="122" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="140.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">第 1 秒</text>
  <rect x="130" y="122" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175.0" y="140.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(1,0)</text>
  <rect x="220" y="122" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270.0" y="140.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">入场</text>
  <rect x="320" y="122" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405.0" y="140.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(1+1)(0+1) = 2</text>
  <rect x="490" y="122" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="140.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="40" y="150" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="168.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">第 2 秒</text>
  <rect x="130" y="150" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175.0" y="168.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(1,0)</text>
  <rect x="220" y="150" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270.0" y="168.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">等待</text>
  <rect x="320" y="150" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405.0" y="168.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">waitCost[1][0] = 2</text>
  <rect x="490" y="150" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="168.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="40" y="178" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="196.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">第 3 秒</text>
  <rect x="130" y="178" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175.0" y="196.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(1,1)</text>
  <rect x="220" y="178" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="270.0" y="196.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">入场</text>
  <rect x="320" y="178" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="405.0" y="196.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">(1+1)(1+1) = 4</text>
  <rect x="490" y="178" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="196.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="40" y="210" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="232.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">若先右后下：1 + 2(入场 0,1) + 3(等待 0,0) + 4 = 10 &gt; 9</text>
  <text x="310.0" y="252.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">dp 在 (1,1) 处比较两条来路，选小的那条</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">起点 (0,0) 的 waitCost=3 不会被支付——这是最容易算多的地方</text>
</svg>
