<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双重循环枚举数对，先判定后更新</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="210" y="50" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#33507a" font-family="monospace" filter="url(#sk)">ans = 0（答案恒 ≥ 0）</text>
  <path d="M 320 80 L 320 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取数对 -->
  <g filter="url(#sk)"><rect x="180" y="92" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="108" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">取下一对 (i, j)，含自身对 i = j</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#33507a" font-family="monospace" filter="url(#sk)">0 ≤ i ≤ j ≤ n−1</text>
  <path d="M 320 130 L 320 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形①：强数对？ -->
  <g filter="url(#sk)"><polygon points="320,146 462,186 320,226 178,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">强数对？</text>
  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#7a5a10" font-family="monospace" filter="url(#sk)">max(x,y) ≤ 2×min(x,y)</text>

  <!-- 是 → 更新 -->
  <path d="M 462 186 L 496 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="478" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="494" y="168" width="136" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="562" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" font-family="monospace" filter="url(#sk)">ans = max(ans, x^y)</text>
  <path d="M 562 168 L 562 109 L 468 109" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="505" y="101" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">更新完 → 取下一对</text>

  <!-- 否 ↓ -->
  <path d="M 320 226 L 320 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="244" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- 菱形②：还有数对？ -->
  <g filter="url(#sk)"><polygon points="320,256 452,296 320,336 188,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#sk)">还有数对未枚举？</text>

  <!-- 是 → 左侧回环 -->
  <path d="M 188 296 L 96 296 L 96 109 L 174 109" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="168" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="106" y="205" font-size="10" fill="#666" filter="url(#sk)">继续枚举</text>

  <!-- 否 → 返回 -->
  <path d="M 452 296 L 486 296" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="488" y="278" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="554" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回 ans</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="60" y="352" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="340" y="374" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">① 先判定后更新：异或值再大、不是强数对也白搭 —— (2,5) 的 XOR = 7 因 5 &gt; 2×2 = 4 被拒</text>
  <text x="340" y="396" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">② (i, i) 恒为强数对且 XOR = 0：ans 从 0 起步天然安全，n = 1 时答案就是 0</text>
</svg>
