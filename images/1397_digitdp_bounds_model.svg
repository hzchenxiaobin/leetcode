<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：逐位构造 x ——「双贴界 + KMP 状态」同时锁住两个约束</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">s1 ≤ x ≤ s2 ⟺ 每位只在动态收窄的区间内选；不含 evil ⟺ 匹配状态 j 始终 &lt; m</text>

  <!-- 列标号 -->
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="262" y="72" filter="url(#r)">i = 0</text>
    <text x="382" y="72" filter="url(#r)">i = 1</text>
    <text x="502" y="72" filter="url(#r)">i = 2</text>
  </g>

  <!-- 竖直虚线引导（画在格子下层） -->
  <g filter="url(#r)">
    <path d="M 262 124 L 262 236" stroke="#c8c8b8" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
    <path d="M 382 124 L 382 236" stroke="#c8c8b8" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
    <path d="M 502 124 L 502 236" stroke="#c8c8b8" stroke-width="1.2" stroke-dasharray="5,4" fill="none"/>
  </g>

  <!-- 行标签 -->
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="105" y="105" fill="#33517a" filter="url(#r)">s2（上界）</text>
    <text x="105" y="185" fill="#555" filter="url(#r)">x（构造中）</text>
    <text x="105" y="265" fill="#33517a" filter="url(#r)">s1（下界）</text>
  </g>

  <!-- s2 行 -->
  <g filter="url(#r)">
    <rect x="230" y="78" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="350" y="78" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="470" y="78" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="262" y="106" filter="url(#r)">s</text>
    <text x="382" y="106" filter="url(#r)">k</text>
    <text x="502" y="106" filter="url(#r)">y</text>
  </g>

  <!-- x 行 -->
  <g filter="url(#r)">
    <rect x="230" y="158" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="350" y="158" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="470" y="158" width="64" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle">
    <text x="262" y="186" fill="#33517a" filter="url(#r)">s</text>
    <text x="382" y="186" fill="#b07818" filter="url(#r)">f</text>
    <text x="502" y="186" fill="#2e6e2e" filter="url(#r)">?</text>
  </g>

  <!-- s1 行 -->
  <g filter="url(#r)">
    <rect x="230" y="238" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="350" y="238" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="470" y="238" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="262" y="266" filter="url(#r)">s</text>
    <text x="382" y="266" filter="url(#r)">e</text>
    <text x="502" y="266" filter="url(#r)">a</text>
  </g>

  <!-- x 行下方小标签 -->
  <g text-anchor="middle" font-size="10.5" font-weight="bold">
    <text x="262" y="222" fill="#33517a" filter="url(#r)">贴住两界</text>
    <text x="382" y="222" fill="#b07818" filter="url(#r)">严格内部 → 脱离</text>
    <text x="502" y="222" fill="#2e6e2e" filter="url(#r)">完全自由</text>
  </g>

  <!-- 引导箭头 -->
  <g filter="url(#r)">
    <path d="M 262 228 L 262 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 382 228 L 382 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 502 228 L 502 282" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 列注释框 -->
  <g filter="url(#r)">
    <rect x="206" y="286" width="112" height="54" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.2"/>
    <rect x="326" y="286" width="112" height="54" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.2"/>
    <rect x="446" y="286" width="112" height="54" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#555">
    <text x="262" y="308" filter="url(#r)">第 0 位只能选 's'</text>
    <text x="262" y="328" filter="url(#r)">继续双贴界</text>
    <text x="382" y="308" filter="url(#r)">第 1 位 'e'…'k'</text>
    <text x="382" y="328" filter="url(#r)">选 'f' 即脱离</text>
    <text x="502" y="308" filter="url(#r)">脱离后 26 选 1</text>
    <text x="502" y="328" filter="url(#r)">只剩 evil 约束</text>
  </g>

  <!-- 底部 evil 跟踪面板 -->
  <g filter="url(#r)">
    <rect x="50" y="364" width="580" height="106" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="340" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#r)">evil 约束同步跟踪：每填一个字符 c，匹配长度 j ← δ(j, c)</text>

  <g filter="url(#r)">
    <rect x="118" y="408" width="56" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="408" width="44" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="312" y="408" width="44" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="450" y="408" width="160" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 176 423 L 214 423" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 268 423 L 306 423" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 360 423 L 398 423" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="146" y="428" fill="#33517a" filter="url(#r)">j = 0</text>
    <text x="242" y="428" fill="#33517a" filter="url(#r)">j₁</text>
    <text x="334" y="428" fill="#b07818" filter="url(#r)">j₂</text>
    <text x="418" y="429" fill="#888" font-size="14" filter="url(#r)">…</text>
    <text x="530" y="428" fill="#b85450" font-size="11.5" filter="url(#r)">j = m ⇒ 剪枝 ✂</text>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">
    <text x="195" y="414" filter="url(#r)">s</text>
    <text x="287" y="414" filter="url(#r)">f</text>
    <text x="379" y="414" filter="url(#r)">?</text>
  </g>
  <text x="340" y="458" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">j = m 意味着 evil 已完整出现：该分支之后无论怎么填都非法，整体丢弃</text>
</svg>
