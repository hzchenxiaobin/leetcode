<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单调队列：窗口内取 dp[j] − pref[j+1] 的最小</text>

<!-- 下标轴：j = 0..7 -->
  <g filter="url(#rough2)">
    <rect x="80" y="60" width="52" height="40" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="132" y="60" width="52" height="40" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="184" y="60" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="236" y="60" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="288" y="60" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="340" y="60" width="52" height="40" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="392" y="60" width="52" height="40" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
    <rect x="444" y="60" width="52" height="40" fill="#eee" stroke="#aaa" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555" text-anchor="middle">
    <text x="106" y="84">j=0</text><text x="158" y="84">j=1</text>
    <text x="210" y="84">j=2</text><text x="262" y="84">j=3</text>
    <text x="314" y="84">j=4</text><text x="366" y="84">j=5</text>
    <text x="418" y="84">j=6</text><text x="470" y="84">j=7</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="280" y="122">绿色 = 当前窗口 W(i)=[lo, i−1]，双约束同时满足</text>
  </g>

  <!-- 队列 -->
  <g filter="url(#rough2)">
    <rect x="100" y="160" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="200" y="160" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="300" y="160" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="145" y="180">队首 j=2</text><text x="145" y="194">键最小</text>
    <text x="245" y="180">j=4</text><text x="245" y="194">键更大</text>
    <text x="345" y="180">j=7</text><text x="345" y="194">键最大</text>
  </g>
  <text x="280" y="146" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">队列内键值 dp[j]−pref[j+1] 严格递增</text>
  <path d="M 210 132 C 180 142, 160 148, 148 156" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="222" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="280" y="244">dp[i] = dp[队首] − pref[队首+1] + pref[i] + 2</text>
    <text x="280" y="264">f(j) = dp[j] − pref[j+1]：j 只以这个组合出现</text>
  </g>

  <!-- 规则 -->
  <g filter="url(#rough2)">
    <rect x="60" y="288" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="313" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">入队弹队尾（更老且键更大者永不翻身）；出队弹队首（下标 &lt; lo 即过期）</text>
</svg>
