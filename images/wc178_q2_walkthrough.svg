<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：票数矩阵 → 逐级比较 → 输出 "ACB"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">votes = ["ABC","ACB","ABC","ACB","ACB"]</text>

  <!-- 左侧票数矩阵 -->
  <rect x="40" y="54" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">队伍</text>
  <rect x="100" y="54" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">第1位</text>
  <rect x="160" y="54" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">第2位</text>
  <rect x="220" y="54" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">第3位</text>

  <!-- A 行 -->
  <rect x="40" y="86" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">A</text>
  <rect x="100" y="86" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="130" y="107" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">5</text>
  <rect x="160" y="86" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="107" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="220" y="86" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="107" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>

  <!-- B 行 -->
  <rect x="40" y="120" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">B</text>
  <rect x="100" y="120" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="141" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="160" y="120" width="60" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6510" filter="url(#rough2)">2</text>
  <rect x="220" y="120" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="141" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">3</text>

  <!-- C 行 -->
  <rect x="40" y="154" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">C</text>
  <rect x="100" y="154" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="175" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="160" y="154" width="60" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6510" filter="url(#rough2)">3</text>
  <rect x="220" y="154" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="175" text-anchor="middle" font-size="12.5" fill="#2a4a66" filter="url(#rough2)">2</text>

  <text x="160" y="206" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每行 = 一支队的「票数向量」</text>

  <!-- 右侧：冠军判定 -->
  <path d="M282,102 C298,102 296,82 308,76" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="312" y="54" width="226" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">冠军判定</text>
  <text x="425" y="96" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">A 第 1 位 5 票，B、C 均为 0</text>

  <!-- 右侧：第 2 名对决 -->
  <path d="M282,150 C298,150 296,156 308,158" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="312" y="126" width="226" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">第 2 名判定：B vs C</text>
  <text x="425" y="168" text-anchor="middle" font-size="11" fill="#2a4a66" filter="url(#rough2)">第 1 位：0 = 0 → 平局</text>
  <text x="425" y="186" text-anchor="middle" font-size="11" fill="#2a4a66" filter="url(#rough2)">第 2 位：2 &lt; 3 → C 胜</text>
  <text x="425" y="210" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（第 3 位无需再看）</text>

  <!-- 右侧：最终排名 -->
  <path d="M425,231 C425,236 425,241 425,245" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="312" y="246" width="226" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6510" filter="url(#rough2)">名次：1.A   2.C   3.B</text>
  <text x="425" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6510" filter="url(#rough2)">输出 "ACB" ✓</text>

  <!-- 底部结论框 -->
  <rect x="40" y="336" width="480" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">关键规则：高位一票定生死，平局才下探低位</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">B、C 的胜负由第 2 位的 3 &gt; 2 决定，与第 3 位票数无关</text>
</svg>
