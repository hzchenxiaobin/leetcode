<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">计数 + 前缀和：一趟 O(n + 120) 走完</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把「每个 x 枚举每个 y」换成「每个年龄查一次区间」</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="150" y="60" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7"/>
    <text x="280" y="81" fill="#3a4a66">① 桶计数：freq[ages[i]] += 1</text>

    <rect x="150" y="104" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7"/>
    <text x="280" y="125" fill="#3a4a66">② 前缀和：pref[i] = pref[i−1] + freq[i]</text>

    <rect x="150" y="148" width="260" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7"/>
    <text x="280" y="169" fill="#8a6a20">③ 依次枚举 a = 1..120 且 freq[a] &gt; 0</text>
  </g>

  <path d="M 280 92 L 280 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 136 L 280 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 180 L 280 194" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,196 388,226 280,256 172,226" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="229" text-anchor="middle" font-size="10" fill="#8a3a36">lo = a/2 下取整 + 8 &gt; a ?</text>
  </g>

  <path d="M 388 226 L 446 226" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="219" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="450" y="213" width="94" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="7"/>
    <text x="497" y="231" text-anchor="middle" font-size="9.5" fill="#8a3a36">该年龄无人可发</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="150" y="272" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7"/>
    <text x="280" y="293" fill="#3a5a30">④ 区间人数 = pref[a] − pref[lo−1] − 1</text>

    <rect x="150" y="316" width="260" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7"/>
    <text x="280" y="337" fill="#3a5a30">⑤ ans += freq[a] × 区间人数</text>
  </g>

  <path d="M 280 256 L 280 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 304 L 280 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 348 L 280 360" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 150 332 L 110 332 L 110 164 L 144 164" stroke="#888" stroke-width="1.2" fill="none"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="252" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">循环 120 次</text>

  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(n + 120)，空间 O(120) —— 与人数无关</text>
</svg>
