<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：A = [16, 33]，B = [4, 18]，k = 15</text>
  <path d="M 170 38 Q 320 45 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: i = 16 -->
  <text x="70" y="70" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">第 1 步：i = 16，窗口 [1, 31]</text>
  <rect x="81" y="88" width="339" height="42" rx="6" fill="#fff8e1" fill-opacity="0.8" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="76" y="84" font-size="10" fill="#a07820" filter="url(#sk)">i−k=1</text>
  <text x="401" y="84" font-size="10" fill="#a07820" filter="url(#sk)">i+k=31</text>
  <path d="M 70 128 Q 340 132 612 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="9.5" fill="#9a9a9a" text-anchor="middle">
    <text x="70" y="143">0</text><text x="183" y="143">10</text><text x="296" y="143">20</text><text x="409" y="143">30</text><text x="522" y="143">40</text>
  </g>
  <path d="M 70 128 l 0 5 M 183 128 l 0 5 M 296 128 l 0 5 M 409 128 l 0 5 M 522 128 l 0 5" stroke="#9a9a9a" stroke-width="1" filter="url(#sk)"/>
  <circle cx="115" cy="128" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="115" y="117" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">j=4</text>
  <circle cx="273" cy="128" r="6.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="273" y="117" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">j=18</text>
  <path d="M 251 90 L 251 72" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <path d="M 251 72 l 12 5 l -12 5 z" fill="#446688" filter="url(#sk)"/>
  <text x="262" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">i=16</text>
  <text x="440" y="106" font-size="11" fill="#666" filter="url(#sk)">p = 0：B[0]=4 ≥ 1 → 不前进</text>
  <text x="440" y="124" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">B[0]=4 ≤ 31 ✓ 收 16</text>

  <!-- Step 2: i = 33 -->
  <text x="70" y="192" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">第 2 步：i = 33，窗口 [18, 48]</text>
  <rect x="273" y="210" width="339" height="42" rx="6" fill="#fff8e1" fill-opacity="0.8" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="268" y="206" text-anchor="end" font-size="10" fill="#a07820" filter="url(#sk)">i−k=18</text>
  <text x="592" y="206" font-size="10" fill="#a07820" filter="url(#sk)">i+k=48</text>
  <path d="M 70 250 Q 340 254 612 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g font-size="9.5" fill="#9a9a9a" text-anchor="middle">
    <text x="70" y="265">0</text><text x="183" y="265">10</text><text x="296" y="265">20</text><text x="409" y="265">30</text><text x="522" y="265">40</text>
  </g>
  <path d="M 70 250 l 0 5 M 183 250 l 0 5 M 296 250 l 0 5 M 409 250 l 0 5 M 522 250 l 0 5" stroke="#9a9a9a" stroke-width="1" filter="url(#sk)"/>
  <circle cx="115" cy="250" r="6.5" fill="#f5f5f5" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="115" y="239" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">j=4</text>
  <text x="115" y="279" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">B[0]=4 &lt; 18 ⇒ p 前进</text>
  <circle cx="273" cy="250" r="7" fill="#e6f4ea" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="273" y="239" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">j=18</text>
  <text x="273" y="279" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">恰在左边界！</text>
  <path d="M 443 212 L 443 194" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <path d="M 443 194 l 12 5 l -12 5 z" fill="#446688" filter="url(#sk)"/>
  <text x="454" y="190" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">i=33</text>
  <text x="330" y="34" font-size="1" fill="#fafafa"> </text>
  <text x="440" y="232" font-size="11" fill="#666" filter="url(#sk)">p：0 → 1，前进 1 步</text>
  <text x="440" y="250" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">B[1]=18 ≤ 48 ✓ 收 33</text>
  <text x="440" y="266" font-size="10.5" fill="#a07820" filter="url(#sk)">（|33−18| = 15 = k 边界命中）</text>

  <!-- Result -->
  <rect x="115" y="310" width="410" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="334" text-anchor="middle" font-size="14" fill="#2f5a25" font-weight="bold" filter="url(#sk)">ans = [16, 33] ✓</text>
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">双指针 p 全程只前进了 1 步 —— 判定阶段线性</text>
  <text x="320" y="392" text-anchor="middle" font-size="10.5" fill="#9a9a9a" filter="url(#sk)">（示例 2：s = "abcd", a = b = "a", k = 4 → A = B = [0]，下标 0 同时充当 i 和 j → ans = [0]）</text>
</svg>
