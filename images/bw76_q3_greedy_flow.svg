<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">贪心找零：从 500 往 20 逐面额取，凑不出即拒绝回滚</text>

  <!-- 流程：amount -->
  <rect x="150" y="52" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">withdraw(amount)，rest = amount</text>

  <path d="M 280 94 C 280 102, 280 106, 280 114" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 面额链 -->
  <g filter="url(#rough2)">
    <rect x="70" y="118" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="158" y="118" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="246" y="118" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="334" y="118" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="422" y="118" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="105" y="143">500</text><text x="193" y="143">200</text><text x="281" y="143">100</text>
    <text x="369" y="143">50</text><text x="457" y="143">20</text>
  </g>
  <path d="M 142 138 L 154 138" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 138 L 242 138" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 138 L 330 138" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 138 L 418 138" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每个面额：take = min(库存, rest / 面额)，rest −= take × 面额</text>

  <!-- 判定分支 -->
  <path d="M 280 178 C 280 190, 280 196, 280 204" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <polygon points="280,206 350,238 280,270 210,238" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="243" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">rest == 0 ?</text>

  <!-- 成功分支 -->
  <path d="M 350 238 C 390 238, 400 238, 420 238" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="218" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="236" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">扣减库存</text>
  <text x="484" y="252" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 take 数组</text>

  <!-- 拒绝分支 -->
  <path d="M 210 238 C 170 238, 160 238, 140 238" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="20" y="218" width="118" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="79" y="236" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">库存不动！</text>
  <text x="79" y="252" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [-1]</text>

  <!-- 为什么"先扣再验"也安全 -->
  <rect x="70" y="292" width="420" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">关键细节：先用临时数组 take 试算，验证 rest == 0 后才真正扣库存。</text>
  <text x="280" y="334" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">若一边取一边直接改 cnt，失败时还得手工「加回去」——</text>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">拒绝分支必须保证机器状态与调用前完全一致。</text>
</svg>
