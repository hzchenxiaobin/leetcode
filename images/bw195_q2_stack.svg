<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">栈中维护「同 (type,color) 的连续块」</text>
  <text x="56" y="82" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">推入 (0,5)</text>
  <text x="230" y="82" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">(0,5):1</text>
  <text x="56" y="126" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">推入 (1,3)</text>
  <text x="230" y="126" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">(0,5):1 | (1,3):1</text>
  <text x="56" y="170" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">(1,3) 计数=2 → 弹栈</text>
  <text x="230" y="170" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">(0,5):1</text>
  <text x="56" y="214" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">(0,5) 计数=2 → 弹栈</text>
  <text x="230" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">空 → true</text>
  <rect x="50" y="244" width="420" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="262" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么栈够用</text>
  <text x="62" y="278" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 只与栈顶比较：新元素要么并入栈顶块，要么自成新块；</text>
  <text x="62" y="293" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 一旦栈顶块计数达到 groupSize[type] 立即弹出；</text>
  <text x="62" y="308" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 弹出后不会出现「新栈顶与更早的块合并」的需求——</text>
  <text x="62" y="323" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  因为中间那一段是被整体删除的，两侧本来就不相邻。</text>
  <text x="62" y="338" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 最终栈空 ⇔ 可以全部删完。</text>
</svg>
