<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：先判后动，一圈 O(1)</text>

  <!-- 开始 -->
  <rect x="245" y="44" width="150" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="67" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">r=c=0，标记 (0,0)</text>

  <path d="M320,80 L320,100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算目标 -->
  <rect x="215" y="102" width="210" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d = grid[r][c]，算出 (nr,nc)</text>

  <path d="M320,140 L320,162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：出界？ -->
  <polygon points="320,164 416,210 320,256 224,210" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="215" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">(nr,nc) 出界？</text>

  <path d="M320,256 L320,278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="272" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 菱形 2：已访问？ -->
  <polygon points="320,280 416,326 320,372 224,326" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="331" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">visited[nr][nc]？</text>

  <path d="M320,372 L320,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="386" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 移动并标记 -->
  <rect x="205" y="394" width="230" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">r,c ← nr,nc；</text>
  <text x="320" y="428" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">标记 visited[r·n+c] = 1</text>

  <!-- 回边 -->
  <path d="M205,414 C160,414 160,121 215,121" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">回到读字符</text>

  <!-- 是分支：汇合到返回框 -->
  <path d="M416,210 L516,210 L516,238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="203" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M416,326 L516,326 L516,282" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="319" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 返回框 -->
  <rect x="452" y="240" width="128" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="516" y="265" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">返回 [r, c]</text>

  <text x="320" y="454" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">两个「是」分支都不移动，(r,c) 保持为最后访问格，直接返回</text>
</svg>
