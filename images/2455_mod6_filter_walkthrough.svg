<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 3, 6, 10, 12, 15]</text>
  <path d="M 180 38 Q 310 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="95" y="56" width="430" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="138" y="75">x</text>
    <text x="224" y="75">x % 6</text>
    <text x="310" y="75">命中</text>
    <text x="396" y="75">sum</text>
    <text x="482" y="75">cnt</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)">
    <rect x="95" y="84"  width="430" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="95" y="111" width="430" height="27" fill="#fdfdfd" stroke="#bbb" stroke-width="1"/>
    <rect x="95" y="138" width="430" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="95" y="165" width="430" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="95" y="192" width="430" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="95" y="219" width="430" height="27" fill="#fdfdfd" stroke="#bbb" stroke-width="1"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="#444">
    <text x="138" y="103">1</text><text x="224" y="103">1</text>
    <text x="310" y="103" fill="#b85450" font-weight="bold">✗</text>
    <text x="396" y="103">0</text><text x="482" y="103">0</text>

    <text x="138" y="130">3</text><text x="224" y="130">3</text>
    <text x="310" y="130" fill="#b85450" font-weight="bold">✗</text>
    <text x="396" y="130">0</text><text x="482" y="130">0</text>

    <text x="138" y="157" fill="#2e6e2e" font-weight="bold">6</text>
    <text x="224" y="157" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="310" y="157" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="396" y="157" fill="#2e6e2e" font-weight="bold">6</text>
    <text x="482" y="157" fill="#2e6e2e" font-weight="bold">1</text>

    <text x="138" y="184">10</text><text x="224" y="184">4</text>
    <text x="310" y="184" fill="#b85450" font-weight="bold">✗</text>
    <text x="396" y="184">6</text><text x="482" y="184">1</text>

    <text x="138" y="211" fill="#2e6e2e" font-weight="bold">12</text>
    <text x="224" y="211" fill="#2e6e2e" font-weight="bold">0</text>
    <text x="310" y="211" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="396" y="211" fill="#2e6e2e" font-weight="bold">18</text>
    <text x="482" y="211" fill="#2e6e2e" font-weight="bold">2</text>

    <text x="138" y="238">15</text><text x="224" y="238">3</text>
    <text x="310" y="238" fill="#b85450" font-weight="bold">✗</text>
    <text x="396" y="238">18</text><text x="482" y="238">2</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="140" y="262" width="340" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="310" y="284" text-anchor="middle" font-size="12.5" fill="#8a5f14" font-family="monospace">cnt = 2 ≠ 0 → ans = 18 / 2 =</text>
  <text x="310" y="304" text-anchor="middle" font-size="16" fill="#8a5f14" font-weight="bold">9 ✓</text>

  <!-- example 2 strip -->
  <g filter="url(#rough2)">
    <rect x="40" y="330" width="540" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="310" y="348" text-anchor="middle" font-size="11.5" fill="#8f3a35">示例 2：[1,2,4,7,10] → 余数依次 1,2,4,1,4，无一为 0</text>
  <text x="310" y="364" text-anchor="middle" font-size="11.5" fill="#8f3a35" font-weight="bold">cnt = 0 → 返回 0（除零兜底分支）</text>

  <text x="310" y="390" text-anchor="middle" font-size="10.5" fill="#888">一趟遍历，命中只做两件事：sum += x、cnt += 1</text>
</svg>
