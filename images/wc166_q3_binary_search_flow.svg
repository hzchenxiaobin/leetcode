<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#446688" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">二分答案流程：在 [1, max(nums)] 上找最左可行点</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮 O(n) 扫一遍算 S(mid)，共 O(log max(nums)) 轮</text>

  <!-- 初始化 -->
  <rect x="195" y="58" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">lo = 1，hi = max(nums)</text>

  <path d="M280,92 V111" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件 -->
  <polygon points="280,113 396,145 280,177 164,145" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">lo &lt; hi ?</text>

  <path d="M280,177 V194" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取中 -->
  <rect x="190" y="196" width="180" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">mid = (lo + hi) // 2</text>

  <path d="M280,226 V240" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和 -->
  <rect x="168" y="242" width="224" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">S = Σ ⌈nums[i] / mid⌉</text>

  <path d="M280,272 V288" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="280,290 392,320 280,350 168,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">S ≤ threshold ?</text>

  <!-- 是 → hi = mid -->
  <text x="134" y="313" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">是</text>
  <path d="M168,320 H106 V370" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="44" y="370" width="124" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="391" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">hi = mid</text>

  <!-- 否 → lo = mid + 1 -->
  <text x="420" y="313" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">否</text>
  <path d="M392,320 H446 V370" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="370" width="148" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="391" text-anchor="middle" font-size="12" fill="#8c3b36" filter="url(#rough2)">lo = mid + 1</text>

  <!-- 汇合到返回 -->
  <path d="M106,402 V420 H198" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M446,402 V420 H362" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="420" width="160" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">return lo</text>

  <!-- 回边 -->
  <path d="M44,386 H20 V145 H160" stroke="#777" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M520,386 H540 V145 H400" stroke="#777" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
