<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">不匹配位置只有两类，同类能一次两清</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s1 = x x y x y y ， s2 = y y x y x x （a = 3，b = 3）</text>

  <!-- 6 列格子：s1 行 y=64..100，s2 行 y=108..144 -->
  <!-- i=0 A 型 蓝 -->
  <g filter="url(#rough2)">
    <rect x="86" y="64" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="88" text-anchor="middle" font-size="15" fill="#2f4a66">x</text>
    <rect x="86" y="108" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="115" y="132" text-anchor="middle" font-size="15" fill="#2f4a66">y</text>
    <text x="115" y="164" text-anchor="middle" font-size="10" fill="#999">0</text>
  </g>
  <!-- i=1 A 型 蓝 -->
  <g filter="url(#rough2)">
    <rect x="152" y="64" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="181" y="88" text-anchor="middle" font-size="15" fill="#2f4a66">x</text>
    <rect x="152" y="108" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="181" y="132" text-anchor="middle" font-size="15" fill="#2f4a66">y</text>
    <text x="181" y="164" text-anchor="middle" font-size="10" fill="#999">1</text>
  </g>
  <!-- i=2 B 型 橙 -->
  <g filter="url(#rough2)">
    <rect x="218" y="64" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="247" y="88" text-anchor="middle" font-size="15" fill="#8a6a20">y</text>
    <rect x="218" y="108" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="247" y="132" text-anchor="middle" font-size="15" fill="#8a6a20">x</text>
    <text x="247" y="164" text-anchor="middle" font-size="10" fill="#999">2</text>
  </g>
  <!-- i=3 A 型 蓝 -->
  <g filter="url(#rough2)">
    <rect x="284" y="64" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="313" y="88" text-anchor="middle" font-size="15" fill="#2f4a66">x</text>
    <rect x="284" y="108" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="313" y="132" text-anchor="middle" font-size="15" fill="#2f4a66">y</text>
    <text x="313" y="164" text-anchor="middle" font-size="10" fill="#999">3</text>
  </g>
  <!-- i=4 B 型 橙 -->
  <g filter="url(#rough2)">
    <rect x="350" y="64" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="379" y="88" text-anchor="middle" font-size="15" fill="#8a6a20">y</text>
    <rect x="350" y="108" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="379" y="132" text-anchor="middle" font-size="15" fill="#8a6a20">x</text>
    <text x="379" y="164" text-anchor="middle" font-size="10" fill="#999">4</text>
  </g>
  <!-- i=5 B 型 橙 -->
  <g filter="url(#rough2)">
    <rect x="416" y="64" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="445" y="88" text-anchor="middle" font-size="15" fill="#8a6a20">y</text>
    <rect x="416" y="108" width="58" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="445" y="132" text-anchor="middle" font-size="15" fill="#8a6a20">x</text>
    <text x="445" y="164" text-anchor="middle" font-size="10" fill="#999">5</text>
  </g>

  <!-- 行标签 -->
  <text x="72" y="88" text-anchor="end" font-size="11" fill="#777" filter="url(#rough2)">s1</text>
  <text x="72" y="132" text-anchor="end" font-size="11" fill="#777" filter="url(#rough2)">s2</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="86" y="180" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="106" y="191" font-size="10.5" fill="#555">A 型：(x, y)，共 a = 3 个</text>
    <rect x="266" y="180" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="286" y="191" font-size="10.5" fill="#555">B 型：(y, x)，共 b = 3 个</text>
  </g>

  <!-- 规则框 -->
  <rect x="40" y="208" width="480" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="230" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">配对规则（已匹配位置一律不动）</text>
  <text x="58" y="254" font-size="10.5" fill="#555" filter="url(#rough2)">① 两个同型（A+A 或 B+B）：交换 s1[i] 与 s2[j]，1 次同时修好两处</text>
  <text x="58" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">② 剩下 1 个 A + 1 个 B：先把 A 型自交换翻成 B 型，再按 ① 配对</text>
  <text x="58" y="302" font-size="10.5" fill="#555" filter="url(#rough2)">③ a + b 为奇数（两串 x 总数是奇数）：无论怎么换都不可能相等</text>
  <text x="58" y="330" font-size="10.5" fill="#b85450" filter="url(#rough2)">所以答案只由 (a, b) 决定，与字符的具体位置完全无关</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">自交换不改变两串字符的多重集合，只是把 A 型位置翻成 B 型</text>
</svg>
