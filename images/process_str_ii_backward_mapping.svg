<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="530" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">倒序追踪：把下标 k 映射回上一个 result</text>
  <path d="M 180 40 Q 320 50 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: letter -->
  <g filter="url(#sk)">
    <rect x="25" y="68" width="110" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">字母 c</text>
  <text x="80" y="104" text-anchor="middle" font-size="10" fill="#2b6e9e">追加到末尾</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="155" y="78" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="171" y="101" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="191" y="78" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="207" y="101" text-anchor="middle" fill="#444">b</text>
    <path d="M 231 96 L 250 96" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="256" y="78" width="32" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
    <text x="272" y="101" text-anchor="middle" fill="#2b6e9e" font-weight="bold">c</text>
  </g>
  <text x="272" y="70" text-anchor="middle" font-size="9" fill="#888">下标 = L（新格子）</text>
  <text x="189" y="128" text-anchor="middle" font-size="9" fill="#888">原有 L 个格子</text>
  <g filter="url(#sk)">
    <rect x="435" y="72" width="180" height="46" rx="8" fill="#f2f7fd" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="525" y="90" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">k == L ⇒ 答案就是 c</text>
  <text x="525" y="107" text-anchor="middle" font-size="10.5" fill="#2b6e9e">k &lt; L ⇒ k 不变</text>

  <!-- Row 2: '*' -->
  <g filter="url(#sk)">
    <rect x="25" y="176" width="110" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="80" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">'*' 删除末尾</text>
  <text x="80" y="212" text-anchor="middle" font-size="10" fill="#a04040">（若非空）</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="155" y="186" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="171" y="209" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="191" y="186" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="207" y="209" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="227" y="186" width="32" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3"/></g>
    <text x="243" y="209" text-anchor="middle" fill="#c88884">c</text>
    <text x="243" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
    <path d="M 271 204 L 296 204" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="304" y="186" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="320" y="209" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="340" y="186" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="356" y="209" text-anchor="middle" fill="#444">b</text>
  </g>
  <text x="266" y="240" text-anchor="middle" font-size="9" fill="#888">只动最后一格，前面的下标原样保留</text>
  <g filter="url(#sk)">
    <rect x="435" y="180" width="180" height="46" rx="8" fill="#fdf3f4" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="525" y="198" text-anchor="middle" font-size="11" fill="#a04040" font-weight="bold">k 不变</text>
  <text x="525" y="215" text-anchor="middle" font-size="10.5" fill="#a04040">（k &lt; 删除后的长度即可）</text>

  <!-- Row 3: '#' -->
  <g filter="url(#sk)">
    <rect x="25" y="284" width="110" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">'#' 复制加倍</text>
  <text x="80" y="320" text-anchor="middle" font-size="10" fill="#2e6e2e">result += result</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="155" y="294" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="171" y="317" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="191" y="294" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="207" y="317" text-anchor="middle" fill="#444">b</text>
    <path d="M 233 312 L 258 312" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="266" y="294" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="282" y="317" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="302" y="294" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="318" y="317" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="338" y="294" width="32" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="354" y="317" text-anchor="middle" fill="#2e6e2e" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="374" y="294" width="32" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
    <text x="390" y="317" text-anchor="middle" fill="#2e6e2e" font-weight="bold">b</text>
  </g>
  <text x="352" y="288" text-anchor="middle" font-size="9" fill="#2e6e2e">后半 = 前半的副本</text>
  <path d="M 354 336 Q 322 354 292 338" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="325" y="362" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">落在后半 ⇒ k −= L</text>
  <g filter="url(#sk)">
    <rect x="435" y="288" width="180" height="46" rx="8" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="525" y="306" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">k ≥ L ⇒ k −= L</text>
  <text x="525" y="323" text-anchor="middle" font-size="10.5" fill="#2e6e2e">k &lt; L ⇒ k 不变</text>

  <!-- Row 4: '%' -->
  <g filter="url(#sk)">
    <rect x="25" y="392" width="110" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">'%' 反转</text>
  <text x="80" y="428" text-anchor="middle" font-size="10" fill="#7a5415">左右颠倒</text>
  <g font-size="13" font-family="monospace">
    <g filter="url(#sk)"><rect x="155" y="402" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="171" y="425" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="191" y="402" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="207" y="425" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="227" y="402" width="32" height="36" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="243" y="425" text-anchor="middle" fill="#444">c</text>
    <path d="M 271 420 L 296 420" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="304" y="402" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="320" y="425" text-anchor="middle" fill="#7a5415">c</text>
    <g filter="url(#sk)"><rect x="340" y="402" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="356" y="425" text-anchor="middle" fill="#7a5415">b</text>
    <g filter="url(#sk)"><rect x="376" y="402" width="32" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="392" y="425" text-anchor="middle" fill="#7a5415">a</text>
  </g>
  <path d="M 320 444 Q 284 460 250 446" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="285" y="468" text-anchor="middle" font-size="10.5" fill="#c98a2b" font-weight="bold">新第 0 位 ← 旧第 L−1 位</text>
  <g filter="url(#sk)">
    <rect x="435" y="396" width="180" height="46" rx="8" fill="#fdf8ef" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="525" y="414" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">k ← L−1−k</text>
  <text x="525" y="431" text-anchor="middle" font-size="10.5" fill="#7a5415">（关于中心对称互换）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="50" y="484" width="540" height="30" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="504" text-anchor="middle" font-size="11" fill="#888">L 取该操作之前 result 的长度——正向扫一遍 s、只累加长度，即可 O(n) 得到每一步的 L</text>
</svg>
