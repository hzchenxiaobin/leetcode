<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：[[2,1,1],[1,1,0],[0,1,1]] → 4 分钟</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">格内数字是该格变腐烂的分钟，空表示原本就是空格</text>

  <rect x="140" y="66" width="84" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="182" y="108" font-size="19" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="228" y="66" width="84" height="64" fill="#fff1e0" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="270" y="108" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="316" y="66" width="84" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="358" y="108" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="140" y="134" width="84" height="64" fill="#fff1e0" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="182" y="176" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="228" y="134" width="84" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="270" y="176" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="316" y="134" width="84" height="64" fill="#eceff1" stroke="#90a4ae" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="358" y="176" font-size="12" fill="#78909c" text-anchor="middle" filter="url(#rough2)">空</text>

  <rect x="140" y="202" width="84" height="64" fill="#eceff1" stroke="#90a4ae" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="182" y="244" font-size="12" fill="#78909c" text-anchor="middle" filter="url(#rough2)">空</text>
  <rect x="228" y="202" width="84" height="64" fill="#eef7e8" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="270" y="244" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="316" y="202" width="84" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="358" y="244" font-size="19" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="30" y="66" width="96" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="78" y="88" font-size="10.5" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">BFS 分层</text>
  <text x="78" y="112" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">t=1：2 个</text>
  <text x="78" y="132" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">t=2：2 个</text>
  <text x="78" y="152" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">t=3：1 个</text>
  <text x="78" y="172" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">t=4：1 个</text>
  <text x="78" y="200" font-size="10" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">共 4 层</text>
  <text x="78" y="224" font-size="9.5" fill="#666" text-anchor="middle" filter="url(#rough2)">空格的邻居</text>
  <text x="78" y="238" font-size="9.5" fill="#666" text-anchor="middle" filter="url(#rough2)">直接跳过</text>

  <text x="420" y="96" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">起点 (0,0) 是</text>
  <text x="420" y="112" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">唯一的腐烂源</text>
  <text x="420" y="164" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(2,1) 只能从</text>
  <text x="420" y="180" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(1,1) 传过来</text>
  <text x="420" y="232" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">(2,2) 是最后一格</text>

  <rect x="30" y="284" width="500" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="303" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">所有新鲜橘子都被覆盖，最大分钟数为 4。若把 (0,2) 改成空格，则 (2,2) 仍可达但时间可能变长——</text>
  <text x="42" y="319" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">所以答案必须由 BFS 实际算出，不能靠「最大距离」直接猜。</text>
</svg>
