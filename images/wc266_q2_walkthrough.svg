    <rect x="339" y="232" width="34" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="375" y="232" width="34" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="411" y="232" width="34" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="447" y="232" width="34" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="483" y="232" width="34" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="519" y="232" width="34" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="104" y="254" text-anchor="middle" font-size="13" fill="#b85450">n</text>
  <text x="140" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">o</text>
  <text x="176" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">o</text>
  <text x="212" y="254" text-anchor="middle" font-size="13" fill="#b85450">s</text>
  <text x="248" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">a</text>
  <text x="284" y="254" text-anchor="middle" font-size="13" fill="#b85450">b</text>
  <text x="320" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">a</text>
  <text x="356" y="254" text-anchor="middle" font-size="13" fill="#b85450">s</text>
  <text x="392" y="254" text-anchor="middle" font-size="13" fill="#b85450">b</text>
  <text x="428" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">o</text>
  <text x="464" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">o</text>
  <text x="500" y="254" text-anchor="middle" font-size="13" fill="#b85450">s</text>
  <text x="536" y="254" text-anchor="middle" font-size="13" fill="#2b6e9e">a</text>
  <text x="104" y="282" text-anchor="middle" font-size="8.5" fill="#999999">0</text>
  <text x="140" y="282" text-anchor="middle" font-size="8.5" fill="#999999">1</text>
