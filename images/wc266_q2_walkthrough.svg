  <text x="320" y="310" text-anchor="middle" font-size="12" fill="#444444">贡献依次：<tspan fill="#2b6e9e" font-weight="bold">24 + 33 + 45 + 49 + 40 + 33 + 13</tspan> = <tspan fill="#2e6e2e" font-weight="bold">237 ✓</tspan></text>
  <text x="320" y="334" text-anchor="middle" font-size="10.5" fill="#555555">7 个元音各按 (i+1)(n−i) 计——i 越居中贡献越大，首尾位置各只有 n</text>
</svg>
