    <rect x="184" y="76" width="64" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="248" y="76" width="150" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="398" y="76" width="76" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="70" y="102" width="44" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="114" y="102" width="70" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="184" y="102" width="64" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="248" y="102" width="150" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="398" y="102" width="76" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="70" y="128" width="44" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="114" y="128" width="70" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="184" y="128" width="64" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="248" y="128" width="150" height="26" rx="3" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
    <rect x="398" y="128" width="76" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="92" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="149" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">word[i]</text>
  <text x="216" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">元音?</text>
  <text x="323" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">贡献 (i+1)×(n−i)</text>
  <text x="436" y="67" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">ans</text>
  <text x="92" y="92" text-anchor="middle" font-size="11" fill="#444444">0</text>
  <text x="149" y="92" text-anchor="middle" font-size="11" fill="#444444">a</text>
  <text x="216" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="323" y="92" text-anchor="middle" font-size="11" fill="#444444">1 × 3 = 3</text>
  <text x="436" y="92" text-anchor="middle" font-size="11" fill="#444444">3</text>
  <text x="92" y="118" text-anchor="middle" font-size="11" fill="#444444">1</text>
  <text x="149" y="118" text-anchor="middle" font-size="11" fill="#444444">b</text>
  <text x="216" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="323" y="118" text-anchor="middle" font-size="10.5" fill="#999999">—（辅音跳过）</text>
  <text x="436" y="118" text-anchor="middle" font-size="11" fill="#444444">3</text>
  <text x="92" y="144" text-anchor="middle" font-size="11" fill="#444444">2</text>
  <text x="149" y="144" text-anchor="middle" font-size="11" fill="#444444">a</text>
  <text x="216" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="323" y="144" text-anchor="middle" font-size="11" fill="#444444">3 × 1 = 3</text>
  <text x="436" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">6</text>

  <g filter="url(#sk)">
    <rect x="70" y="168" width="404" height="28" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="272" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = 3 + 0 + 3 = 6 ✓（与示例 1 一致）</text>

  <text x="87" y="222" font-size="12.5" font-weight="bold" fill="#2b6e9e">自检：word = "noosabasboosa"（n = 13，示例 4）</text>

  <g filter="url(#sk)">
    <rect x="87" y="232" width="34" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="123" y="232" width="34" height="34" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
