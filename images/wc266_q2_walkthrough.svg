<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="352" fill="#fdfcf7"/>
  <text x="320" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：word = "aba"（n = 3）</text>

  <g filter="url(#sk)">
    <rect x="70" y="50" width="44" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="114" y="50" width="70" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="184" y="50" width="64" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
