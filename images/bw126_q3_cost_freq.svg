<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="428" fill="#fafafa"/>
<text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">分数与顺序无关，只由各字母频次决定</text>
<text x="46" y="74" text-anchor="start" font-size="13" fill="#666" font-weight="normal" filter="url(#roughs)">t = "aab"</text>
<rect x="46" y="84" width="50" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="71.0" y="112.0" text-anchor="middle" font-size="18" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<rect x="104" y="84" width="50" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="129.0" y="112.0" text-anchor="middle" font-size="18" fill="#333333" font-weight="normal" filter="url(#roughs)">a</text>
<rect x="162" y="84" width="50" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="187.0" y="112.0" text-anchor="middle" font-size="18" fill="#333333" font-weight="normal" filter="url(#roughs)">b</text>
<text x="240" y="100" text-anchor="start" font-size="11" fill="#d6a040" font-weight="normal" filter="url(#roughs)">位置 1 之前已有 1 个 a</text>
<text x="240" y="120" text-anchor="start" font-size="11" fill="#d6a040" font-weight="normal" filter="url(#roughs)">→ cost(1) = 1（一对相同字符贡献 1 分）</text>
<rect x="46" y="150" width="468" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="181" text-anchor="middle" font-size="14" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">score = Σ_c C(f_c, 2) = Σ_c f_c(f_c−1) / 2</text>
<rect x="46" y="214" width="468" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="243" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">再插入一个字母 c：分数增量恰为它当前的频次 f_c</text>
<rect x="70" y="288" width="52" height="60" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="96" y="366" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">a</text>
<text x="96" y="280" text-anchor="middle" font-size="10" fill="#b85450" font-weight="normal" filter="url(#roughs)">f=5</text>
<rect x="186" y="348" width="52" height="5" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="212" y="366" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">b</text>
<text x="212" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">f=0</text>
<rect x="296" y="348" width="52" height="5" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="322" y="366" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">c</text>
<text x="322" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">f=0</text>
<rect x="406" y="348" width="52" height="5" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="432" y="366" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">d</text>
<text x="432" y="340" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">f=0</text>
<text x="40" y="318" text-anchor="start" font-size="10" fill="#888" font-weight="normal" filter="url(#roughs)">频次</text>
<text x="280" y="394" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">往 a 上加：代价 5；往 b、c、d 上加：代价 0</text>
<text x="280" y="414" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">所以总是选频次最小的字母 → 注水法</text>
</svg>
