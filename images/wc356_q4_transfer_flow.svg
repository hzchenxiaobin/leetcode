<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">每一位的转移：dfs(i, prev, limit, num) 的分支与剪枝</text>

  <!-- 开始 -->
  <rect x="170" y="44" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">进入第 i 位（i, prev, limit, num）</text>

  <path d="M 280,80 L 280,100" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 i = n -->
  <polygon points="280,104 335,132 280,160 225,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = n ?</text>

  <path d="M 335,132 L 392,132" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="395" y="114" width="148" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="469" y="129" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 num ? 1 : 0</text>
  <text x="469" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">全跳过 = 空数 → 排除 0</text>

  <path d="M 280,160 L 280,182" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判断 num -->
  <polygon points="280,186 340,214 280,242 220,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num = false ?</text>

  <path d="M 220,214 L 198,214" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="18" y="190" width="178" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="107" y="210" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">跳过（此位空着）</text>
  <text x="107" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dfs(i+1, −1, false, false)</text>
  <text x="107" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">位数更短 ⇒ 必 &lt; s，limit 放开</text>

  <path d="M 280,242 L 280,264" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 枚举 d -->
  <rect x="130" y="268" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">对每个 d ∈ [lo, hi] 依次判断</text>
  <text x="280" y="299" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">lo = num ? 0 : 1；hi = limit ? s[i] : 9</text>

  <path d="M 280,306 L 280,326" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断步进约束 -->
  <polygon points="280,330 385,360 280,390 175,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">prev &lt; 0 或</text>
  <text x="280" y="373" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">|d − prev| = 1 ?</text>

  <path d="M 385,360 L 410,360" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="352" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="412" y="342" width="140" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="482" y="357" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">剪掉这个 d</text>
  <text x="482" y="374" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（如 prev=8, d=8）</text>

  <path d="M 280,390 L 280,412" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="406" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 判断是否继续贴界 -->
  <polygon points="280,416 355,444 280,472 205,444" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">limit 且</text>
  <text x="280" y="457" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d = hi ?</text>

  <path d="M 355,444 L 382,444" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="436" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="384" y="426" width="162" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="465" y="441" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">收紧：dfs(i+1, d, T, T)</text>
  <text x="465" y="458" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">继续贴界，limit 传递</text>

  <path d="M 205,444 L 178,444" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="436" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="18" y="426" width="158" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="97" y="441" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">自由：dfs(i+1, d, F, T)</text>
  <text x="97" y="458" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">剩余位与 s 无关</text>

  <!-- 记忆化要点 -->
  <rect x="30" y="496" width="500" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="518" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">为何记忆化有效（不重不漏）</text>
  <text x="280" y="538" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">· 同层各分支 d ∈ [lo, hi] 互斥且穷尽 ⇒ 求和即总数</text>
  <text x="280" y="556" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">· limit=false 的子树只依赖 (i, prev, num) ⇒ 同键命中缓存</text>
  <text x="280" y="574" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">· 贴界路径自顶向下唯一 ⇒ limit=true 的状态至多算一次</text>
</svg>
