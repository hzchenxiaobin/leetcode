<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一次扫描：每点算一个叉积，出现非零立刻否掉</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">方向向量只算一次，其余点各做一次乘减</text>

  <rect x="185" y="62" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="83" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">输入 coordinates（点数 n ≥ 2）</text>

  <rect x="120" y="112" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="131" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">P0 = coordinates[0]，P1 = coordinates[1]</text>
  <text x="310" y="147" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">dx = x1 − x0，dy = y1 − y0（恰好是方向向量）</text>

  <rect x="140" y="170" width="340" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">for i = 2 … n − 1：逐点检查</text>
  <text x="310" y="206" text-anchor="middle" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">循环走完 ⇒ 全部点合格 ⇒ 返回 true</text>

  <rect x="140" y="230" width="340" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="254" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">c = (xi − x0)·dy − (yi − y0)·dx</text>

  <polygon points="310,292 410,328 310,364 210,328" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="333" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">c == 0 ?</text>

  <rect x="452" y="304" width="150" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="527" y="325" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="527" y="341" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第 i 点偏离这条线</text>

  <rect x="235" y="388" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="310" y="409" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">i += 1</text>
  <text x="310" y="425" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">回到 for 循环</text>

  <g stroke="#666" stroke-width="1.5" fill="none">
    <path d="M 310 94 L 310 110" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 154 L 310 168" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 214 L 310 228" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 268 L 310 290" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 364 L 310 386" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 410 328 L 450 328" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 233 411 L 95 411 L 95 192 L 138 192" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <text x="318" y="382" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="420" y="320" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="70" y="446" width="480" height="56" fill="#f4f8fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="468" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">两个出口：中途发现偏离 → false；循环走完 → true</text>
  <text x="310" y="489" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">全程整数乘法与减法，没有除法，也没有浮点误差</text>
</svg>
