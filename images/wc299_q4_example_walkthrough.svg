<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：6 个断点对逐对打分，最优 (i=1, j=2) → 9</text>
  <path d="M 170 34 Q 360 42 550 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：带 xor 的树 -->
  <text x="140" y="60" text-anchor="middle" font-size="11" fill="#888">以 0 为根，圈中为节点号</text>
  <g filter="url(#sk)">
    <path d="M 140 92 L 140 162" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 140 162 L 85 242" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 140 162 L 195 242" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
    <path d="M 195 242 L 195 322" stroke="#7a8ba0" stroke-width="1.8" fill="none"/>
  </g>

  <!-- 最优断点的 ✗：父边 (0,1) 与 (1,2) -->
  <g filter="url(#sk)">
    <path d="M 133 120 L 147 134" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 147 120 L 133 134" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 105 195 L 119 209" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 119 195 L 105 209" stroke="#b85450" stroke-width="2.6" fill="none"/>
  </g>

  <g filter="url(#sk)"><circle cx="140" cy="92" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="140" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="163" y="98" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=14</text>

  <g filter="url(#sk)"><circle cx="140" cy="162" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="140" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="163" y="168" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=15</text>

  <g filter="url(#sk)"><circle cx="85" cy="242" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="85" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="85" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=5</text>

  <g filter="url(#sk)"><circle cx="195" cy="242" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="195" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="195" y="272" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=15</text>

  <g filter="url(#sk)"><circle cx="195" cy="322" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="195" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="195" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">xor=11</text>

  <text x="140" y="388" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04a48">最优断点 (i,j)=(1,2)</text>
  <text x="140" y="404" text-anchor="middle" font-size="10.5" fill="#a04a48">即删父边 (0,1) 与 (1,2)</text>
  <g filter="url(#sk)"><rect x="60" y="414" width="160" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="140" y="436" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#7a5415">total = xor[0] = 14</text>

  <!-- 右：点对枚举表 -->
  <g filter="url(#sk)"><rect x="275" y="62" width="430" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="307" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">点对</text>
  <text x="370" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">拓扑</text>
  <text x="428" y="79" text-anchor="middle" font-size="10" font-family="monospace" font-weight="bold" fill="#2b6e9e">xor[i]</text>
  <text x="478" y="79" text-anchor="middle" font-size="10" font-family="monospace" font-weight="bold" fill="#2b6e9e">xor[j]</text>
  <text x="563" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">三分量 XOR</text>
  <text x="663" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">分数</text>

  <!-- 行 1：最优，高亮 -->
  <g filter="url(#sk)"><rect x="275" y="88" width="430" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="307" y="111" text-anchor="middle" font-size="11" font-family="monospace" font-weight="bold" fill="#a04a48">(1,2)</text>
  <text x="370" y="111" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04a48">i⊃j</text>
  <text x="428" y="111" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#a04a48">15</text>
  <text x="478" y="111" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#a04a48">5</text>
  <text x="563" y="111" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="bold" fill="#a04a48">(5, 10, 1)</text>
  <text x="663" y="111" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">9 ✓</text>

  <g filter="url(#sk)"><rect x="275" y="126" width="430" height="38" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="307" y="149" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">(1,3)</text>
  <text x="370" y="149" text-anchor="middle" font-size="10.5" fill="#333">i⊃j</text>
  <text x="428" y="149" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">15</text>
  <text x="478" y="149" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">15</text>
  <text x="563" y="149" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">(15, 0, 1)</text>
  <text x="663" y="149" text-anchor="middle" font-size="11.5" fill="#333">15</text>

  <g filter="url(#sk)"><rect x="275" y="164" width="430" height="38" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="307" y="187" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">(1,4)</text>
  <text x="370" y="187" text-anchor="middle" font-size="10.5" fill="#333">i⊃j</text>
  <text x="428" y="187" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">15</text>
  <text x="478" y="187" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">11</text>
  <text x="563" y="187" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">(11, 4, 1)</text>
  <text x="663" y="187" text-anchor="middle" font-size="11.5" fill="#333">10</text>

  <g filter="url(#sk)"><rect x="275" y="202" width="430" height="38" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="307" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">(2,3)</text>
  <text x="370" y="225" text-anchor="middle" font-size="10.5" fill="#333">平行</text>
  <text x="428" y="225" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">5</text>
  <text x="478" y="225" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">15</text>
  <text x="563" y="225" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">(5, 15, 4)</text>
  <text x="663" y="225" text-anchor="middle" font-size="11.5" fill="#333">11</text>

  <g filter="url(#sk)"><rect x="275" y="240" width="430" height="38" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="307" y="263" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">(2,4)</text>
  <text x="370" y="263" text-anchor="middle" font-size="10.5" fill="#333">平行</text>
  <text x="428" y="263" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">5</text>
  <text x="478" y="263" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">11</text>
  <text x="563" y="263" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">(5, 11, 0)</text>
  <text x="663" y="263" text-anchor="middle" font-size="11.5" fill="#333">11</text>

  <g filter="url(#sk)"><rect x="275" y="278" width="430" height="38" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="307" y="301" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">(3,4)</text>
  <text x="370" y="301" text-anchor="middle" font-size="10.5" fill="#333">i⊃j</text>
  <text x="428" y="301" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">15</text>
  <text x="478" y="301" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">11</text>
  <text x="563" y="301" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#333">(11, 4, 1)</text>
  <text x="663" y="301" text-anchor="middle" font-size="11.5" fill="#333">10</text>

  <!-- 表底结论 -->
  <g filter="url(#sk)"><rect x="275" y="332" width="430" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="490" y="359" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">ans = 9 —— 分量 {2}=5、{1,3,4}=10、{0}=1</text>

  <g filter="url(#sk)"><rect x="275" y="388" width="430" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="490" y="410" text-anchor="middle" font-size="11" fill="#2b6e9e">示例 2：xor[2]=0、xor[3]=0、total=0，断点 (2,3) 平行</text>
  <text x="490" y="430" text-anchor="middle" font-size="11" fill="#2b6e9e">三分量 (0,0,0) → 分数 0 —— 分数非负，0 即理论下界</text>
</svg>
