<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="40" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">三类字符的移动自由度</text>

  <rect x="50" y="66" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="94" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">'L'：固定</text>

  <rect x="200" y="66" width="120" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="94" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">'R'：固定</text>

  <rect x="350" y="66" width="120" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="410" y="94" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">'_'：自由</text>

  <path d="M152,142 L88,142" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="168" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">必向左 −1</text>

  <path d="M222,142 L286,142" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="254" y="168" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">必向右 +1</text>

  <path d="M368,142 L452,142" stroke="#d6a040" stroke-width="2" fill="none" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">任选方向 ±1</text>

  <rect x="105" y="192" width="310" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="15" fill="#8a6d1f" filter="url(#rough2)">只有 '_' 的方向由你决定</text>

  <path d="M80,282 L440,282" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M80,276 L80,288" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M140,277 L140,287" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M200,277 L200,287" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M260,275 L260,289" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M320,277 L320,287" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M380,277 L380,287" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M440,276 L440,288" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">−3</text>
  <text x="140" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">−2</text>
  <text x="200" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">−1</text>
  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="380" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="440" y="308" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <ellipse cx="260" cy="282" rx="6" ry="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">从原点 0 出发走 n 步</text>
</svg>
