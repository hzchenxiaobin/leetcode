<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：只需和「第二大」比一次</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">max ≥ 2 × 第二大  ⇔  max ≥ 2 × 其余任意元素</text>

  <text x="80" y="70" font-size="10" fill="#666">把 nums = [3,6,1,0] 按大小排开，并标出每个格子的身份：</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="80" y="78" width="84" height="48" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="122" y="108" font-size="20" fill="#555">0</text>
    <rect x="172" y="78" width="84" height="48" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="214" y="108" font-size="20" fill="#555">1</text>
    <rect x="264" y="78" width="84" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="306" y="108" font-size="20" fill="#3a4a66">3</text>
    <rect x="356" y="78" width="84" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="398" y="108" font-size="20" fill="#8a6a20">6</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <text x="122" y="142" fill="#999">其他</text>
    <text x="214" y="142" fill="#999">其他</text>
    <text x="306" y="142" fill="#446688">第二大</text>
    <text x="398" y="142" fill="#b8830f">最大（唯一）</text>
  </g>

  <text x="150" y="168" font-size="9.5" fill="#999">这两个不必逐个检查</text>
  <path d="M 306 152 L 306 160" stroke="#8a6a20" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <path d="M 398 152 L 398 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="200" width="380" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">6 ≥ 2 × 3 = 6　✓ 通过</text>
  <text x="290" y="246" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">返回最大值 6 所在的下标 1</text>

  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">反例 [1,2,3,4]：4 &lt; 2 × 3 = 6，最大值不到第二大两倍 → 返回 −1</text>
</svg>
