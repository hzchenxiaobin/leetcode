<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">顺序无关性：局部合流 + 终止 ⟹ 唯一终态（Newman 引理）</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">当前数组 A —— 有两个可选合并对（红波浪线标记）</text>

  <!-- 顶：数组 [2, 6, 3] -->
  <rect x="240" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="286" y="58" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="332" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 242 96 Q 263 103 284 96" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 288 96 Q 309 103 330 96" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="114" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gcd(2,6)=2</text>
  <text x="330" y="114" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gcd(6,3)=3</text>

  <!-- 左右分叉箭头 -->
  <path d="M 275 120 Q 220 134 200 144" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="128" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">选中 (2,6)</text>
  <path d="M 335 120 Q 400 134 462 144" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="128" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">选中 (6,3)</text>

  <!-- 左分支：合并 (2,6) 得 [6, 3] -->
  <rect x="125" y="150" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="145" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="171" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="168" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gcd(6,3)=3&gt;1，仍可合并</text>

  <!-- 右分支：合并 (6,3) 得 [2, 6] -->
  <rect x="425" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="471" y="150" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="491" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="476" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">gcd(2,6)=2&gt;1，仍可合并</text>

  <!-- 汇合箭头 -->
  <path d="M 168 208 Q 240 250 316 264" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 476 208 Q 404 250 364 264" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇合点：[6] -->
  <rect x="318" y="270" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="292" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="340" y="326" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">引理 2：重叠合并对收敛到同一片段</text>
  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">殊途同归：lcm(2, 6, 3) = 6</text>

  <!-- 左下：引理 3 + 引理 4 -->
  <rect x="36" y="352" width="296" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="184" y="376" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">引理 3：不相交对天然可交换</text>
  <text x="184" y="398" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">两对合并触碰不相交的位置，</text>
  <text x="184" y="416" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">先后互换，数组逐字相同；</text>
  <text x="184" y="436" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">引理 4：每步长度 −1 ⟹ 必终止</text>

  <!-- 右下：Newman -->
  <rect x="348" y="352" width="296" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="496" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Newman 引理：终态唯一</text>
  <text x="496" y="398" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">终止 + 局部合流 ⟹ 全局合流，</text>
  <text x="496" y="416" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">任意操作序列收敛到同一终态</text>
  <text x="496" y="436" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—— 题目「任意顺序同果」的严格依据</text>
</svg>
