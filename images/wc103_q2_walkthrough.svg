<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="336" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例路径：4 次掷骰到达 36</text>
  <rect x="40" y="76" width="96" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88.0" y="104.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="76" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232.0" y="104.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="76" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376.0" y="104.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <rect x="472" y="76" width="96" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="104.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">17</text>
  <rect x="40" y="210" width="96" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88.0" y="238.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <rect x="184" y="210" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232.0" y="238.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <rect x="328" y="210" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376.0" y="238.04" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">35</text>
  <rect x="472" y="210" width="96" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="238.04" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">36</text>
  <path d="M 136,99 L 184,99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">掷 2</text>
  <path d="M 280,88 Q 304,60 328,88" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="304" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">梯子</text>
  <path d="M 424,99 L 472,99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">掷 2</text>
  <path d="M 520,122 Q 540,168 88,210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="556" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">蛇：17 → 13</text>
  <path d="M 232,233 L 328,233" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">梯子 14 → 35</text>
  <path d="M 424,233 L 472,233" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="256" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">掷 1</text>
  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意：2 → 15 这一跳只算「爬了一次梯子」，即便 15 处还有蛇梯也不再连锁</text>
</svg>
