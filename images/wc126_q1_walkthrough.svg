<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：三个串的频次表逐位取 min</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">words = ["bella", "label", "roller"]</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="34" y="74" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="82.0" y="95.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">bella</text>
  <rect x="140" y="74" width="176" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228.0" y="95.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1 1 2 1 1</text>
  <rect x="326" y="74" width="210" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="431.0" y="95.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">b e l l a</text>
  <rect x="34" y="118" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="82.0" y="139.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">label</text>
  <rect x="140" y="118" width="176" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228.0" y="139.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1 1 2 1 1</text>
  <rect x="326" y="118" width="210" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="431.0" y="139.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">l a b e l</text>
  <rect x="34" y="162" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="82.0" y="183.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">roller</text>
  <rect x="140" y="162" width="176" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="228.0" y="183.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">2 1 2 1 0</text>
  <rect x="326" y="162" width="210" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="431.0" y="183.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">r o l l e r</text>
  <path d="M 34.0 218.0 L 560.0 218.0" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="34.0" y="240.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">逐位取 min</text>
  <rect x="140" y="222" width="396" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="338.0" y="246.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e:1   l:2   a:0   b:0   r:0</text>
  <text x="140.0" y="284.0" font-size="13" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">输出：["e", "l", "l"]</text>
  <rect x="30" y="300" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="321.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">l 在三个串中的次数是 2/2/2，min = 2，因此输出两个 l 而不是一个</text>
  <text x="40.0" y="337.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">roll·er 里没有 a、b，cool 里没有 l、k —— 只要某串缺失，该字符整体淘汰</text>
</svg>
