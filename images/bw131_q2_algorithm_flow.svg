<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="35"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：预处理一次，查询逐条 O(1) 回答</text>

  <g filter="url(#rough2)">
    <rect x="60" y="66" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <rect x="60" y="176" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <rect x="60" y="286" width="480" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="300" y="92">① 一次扫描 nums</text>
    <text x="300" y="114" fill="#666">把所有等于 x 的下标按顺序放进列表 pos</text>
    <text x="300" y="202">② 逐条处理查询 q</text>
    <text x="300" y="224" fill="#666">q ≤ len(pos) 取 pos[q − 1]，否则记 −1</text>
    <text x="300" y="310">③ 返回长度等于 queries 的答案数组</text>
    <text x="300" y="330" fill="#666">顺序与 queries 一一对应</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 300 134 L 300 172" marker-end="url(#arr)"/>
    <path d="M 300 244 L 300 282" marker-end="url(#arr)"/>
  </g>
  <text x="300" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">整体 O(n + m)，只与输入长度有关，与值域上限无关</text>
</svg>
