<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">一次从左到右的扫描：先查询、再登记、最后累加</text>

  <rect x="130" y="40" width="300" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">best ← 空表，pref ← 0，ans ← −∞</text>
  <path d="M 280 72 L 280 88" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="90" width="280" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="111" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">j = 0 … n−1，取 v = nums[j]</text>
  <path d="M 280 122 L 280 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,140 410,168 280,196 150,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="166" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">best 里有 v + k 或 v − k ?</text>
  <text x="280" y="182" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">（0、1、2 个命中都可能）</text>

  <path d="M 410 168 L 446 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="448" y="140" width="96" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="160" text-anchor="middle" font-size="9.5" fill="#2f5226" filter="url(#rough2)">ans ← max(</text>
  <text x="496" y="175" text-anchor="middle" font-size="9.5" fill="#2f5226" filter="url(#rough2)">ans, pref + v</text>
  <text x="496" y="189" text-anchor="middle" font-size="9.5" fill="#2f5226" filter="url(#rough2)">− best[·])</text>

  <path d="M 280 196 L 280 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="214" width="300" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">best[v] ← min(best[v], pref)</text>
  <path d="M 280 246 L 280 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="264" width="300" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="285" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">pref ← pref + v（即 S[j+1]）</text>

  <path d="M 130 280 C 80 280, 80 106, 138 106" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 74 196)">下一个 j</text>

  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">顺序很重要：先查询再登记，避免把 j 自己当成左端点</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环结束后若 ans 仍是 −∞，说明没有好子数组，返回 0（示例 3 会返回负数，不能提前返回 0）</text>
</svg>
