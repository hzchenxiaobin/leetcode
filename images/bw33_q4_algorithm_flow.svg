<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    迭代式 DFS：每个连通块扫一遍
  </text>

  <g filter="url(#rough2)">
    <rect x="130" y="48" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="72" text-anchor="middle" font-size="13" fill="#446688">对每个未访问格子 s：vis[s]=1，压栈 (s, −1)</text>
  </g>
  <path d="M 260 88 L 260 106" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="110" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="260" y="134" text-anchor="middle" font-size="13" fill="#8a6a1a">弹出 (cur, par)：扫描 cur 的四个邻居 nb</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="76" y="166" width="140" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5" rx="8"/>
    <text x="146" y="188" text-anchor="middle" font-size="12" fill="#666">越界 / 字符不同？</text>
    <rect x="230" y="166" width="150" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5" rx="8"/>
    <text x="305" y="188" text-anchor="middle" font-size="12" fill="#666">nb == par（父格）？</text>
  </g>
  <path d="M 200 149 C 160 156, 152 160, 148 164" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 149 C 302 156, 304 160, 305 164" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="214" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="236" text-anchor="middle" font-size="13" fill="#2f5a24">vis[nb] 未访问？→ 标记并压栈 (nb, cur)</text>
  </g>
  <path d="M 400 183 C 420 190, 420 200, 400 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="204" font-size="11" fill="#2f5a24" filter="url(#rough2)">否 →</text>

  <g filter="url(#rough2)">
    <rect x="130" y="262" width="260" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="260" y="285" text-anchor="middle" font-size="13" fill="#b85450">vis[nb] 已访问（且非父）→ return true 有环</text>
  </g>
  <path d="M 230 200 C 210 228, 214 248, 230 260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 回环：继续弹栈 -->
  <path d="M 130 231 C 80 231, 72 130, 128 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="186" font-size="11" fill="#8a6a1a" filter="url(#rough2)">栈空 →</text>
  <text x="66" y="200" font-size="11" fill="#8a6a1a" filter="url(#rough2)">下一块</text>

  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    全部块扫完未触发 → false；时间 O(mn)，空间 O(mn)
  </text>
</svg>
