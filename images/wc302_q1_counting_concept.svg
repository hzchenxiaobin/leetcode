<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：配对只取决于每个值的出现次数，与顺序无关</text>

  <!-- nums cells: [1,3,2,1,3,2,2], w=46, x=119+46i, y=48 -->
  <rect x="119" y="48" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="165" y="48" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <rect x="211" y="48" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="234" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <rect x="257" y="48" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <rect x="303" y="48" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <rect x="349" y="48" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <rect x="395" y="48" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="108" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">nums = [1,3,2,1,3,2,2]</text>

  <!-- group arrows -->
  <path d="M 142 100 Q 120 128 106 148" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 100 Q 280 128 280 148" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 100 Q 430 128 452 148" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- buckets -->
  <rect x="42" y="156" width="128" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="106" y="180" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">值 1 × 2 个</text>
  <text x="106" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊2/2⌋ = 1 对</text>
  <text x="106" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩 2 mod 2 = 0</text>
  <text x="106" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(1,1) ✓</text>

  <rect x="216" y="156" width="128" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值 3 × 2 个</text>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊2/2⌋ = 1 对</text>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩 2 mod 2 = 0</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(3,3) ✓</text>

  <rect x="390" y="156" width="128" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="454" y="180" text-anchor="middle" font-size="12.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">值 2 × 3 个 ⭐</text>
  <text x="454" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊3/2⌋ = 1 对</text>
  <text x="454" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">剩 3 mod 2 = 1</text>
  <text x="454" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(2,2) ✓ + 孤儿 2</text>

  <!-- formula box -->
  <rect x="56" y="272" width="448" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">数对数 = Σ ⌊cnt(v) / 2⌋，剩余 = Σ (cnt(v) mod 2)</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#7a4040" filter="url(#rough2)">= 1 + 1 + 1 = 3 对</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#7a4040" filter="url(#rough2)">剩余 = 7 − 2×3 = 0 + 0 + 1 = 1</text>

  <!-- summary -->
  <rect x="140" y="380" width="280" height="32" rx="16" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="401" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">answer = [3, 1] ✓</text>
</svg>
