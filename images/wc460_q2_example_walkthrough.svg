<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "LCCT"</text>

  <!-- 左上：DP 计数表 -->
  <text x="40" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一趟扫描，数出原有 LCT 子序列数</text>

  <rect x="40" y="80" width="280" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">字符</text>
  <text x="145" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cL</text>
  <text x="205" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cLC</text>
  <text x="275" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cLCT</text>

  <line x1="40" y1="136" x2="320" y2="136" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="128" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">L</text>
  <text x="145" y="128" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="205" y="128" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="275" y="128" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <line x1="40" y1="164" x2="320" y2="164" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="156" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">C</text>
  <text x="145" y="156" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="205" y="156" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="275" y="156" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <line x1="40" y1="192" x2="320" y2="192" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">C</text>
  <text x="145" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="205" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="275" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <rect x="40" y="192" width="280" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="145" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="205" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="275" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="180" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">原有 LCT 子序列数 cLCT = 2</text>
  <text x="180" y="262" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（同一趟顺手数出：cLC = 2，cCT = 2）</text>

  <!-- 右上：三种增益 -->
  <text x="40" y="300" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">② 三种插入的增益</text>

  <rect x="40" y="314" width="160" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="338" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开头插 L</text>
  <text x="120" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+ CT 数 = 2</text>

  <rect x="215" y="314" width="160" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="338" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">中间插 C</text>
  <text x="295" y="362" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">+ max 前缀L×后缀T = 1</text>

  <rect x="390" y="314" width="150" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="338" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">末尾插 T</text>
  <text x="465" y="362" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+ LC 数 = 2</text>

  <!-- 底部结论 -->
  <rect x="40" y="400" width="500" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="420" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = 2 + max(2, 1, 2) = 4 ✓</text>
  <text x="290" y="440" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（对应示例 2：开头插 L 得 "LLCCT"，含 4 个 LCT 子序列）</text>
</svg>
