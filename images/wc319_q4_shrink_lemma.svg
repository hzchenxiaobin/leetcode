<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">裁剪引理：回文裁掉首尾仍是回文，长度每次 −2、奇偶性不变</text>
  <path d="M 250 40 Q 480 48 710 40" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左列：奇数链 7 → 5 → 3 ===== -->
  <text x="225" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">奇数链："abcdcba"（k = 3）</text>

  <rect x="60" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>
  <rect x="108" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="156" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="204" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">d</text>
  <rect x="252" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="300" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="348" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="369" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>

  <rect x="58" y="82" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="346" y="82" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="402" y="110" font-size="11.5" font-weight="bold" fill="#666" filter="url(#rough2)">长度 7</text>

  <path d="M 225 132 L 225 153" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="108" y="156" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="156" y="156" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="204" y="156" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">d</text>
  <rect x="252" y="156" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="300" y="156" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>

  <rect x="106" y="154" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="298" y="154" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="402" y="182" font-size="11.5" font-weight="bold" fill="#666" filter="url(#rough2)">长度 5</text>

  <path d="M 225 204 L 225 225" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="156" y="228" width="42" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="177" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">c</text>
  <rect x="204" y="228" width="42" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="225" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">d</text>
  <rect x="252" y="228" width="42" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="273" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">c</text>

  <text x="402" y="254" font-size="11.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">长度 3 = k ✓</text>
  <text x="225" y="296" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">每步裁掉首尾两个字符（红框），长度 −2</text>

  <!-- ===== 右列：偶数链 6 → 4 ===== -->
  <text x="681" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">偶数链："abccba"（k = 3）</text>

  <rect x="540" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="561" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>
  <rect x="588" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="609" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="636" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="657" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="684" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="705" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="732" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="753" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="780" y="84" width="42" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="801" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>

  <rect x="538" y="82" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="778" y="82" width="46" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="832" y="110" font-size="11.5" font-weight="bold" fill="#666" filter="url(#rough2)">长度 6</text>

  <path d="M 681 132 L 681 153" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="588" y="156" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="609" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5410" filter="url(#rough2)">b</text>
  <rect x="636" y="156" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="657" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5410" filter="url(#rough2)">c</text>
  <rect x="684" y="156" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="705" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5410" filter="url(#rough2)">c</text>
  <rect x="732" y="156" width="42" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="753" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5410" filter="url(#rough2)">b</text>

  <text x="832" y="182" font-size="11.5" font-weight="bold" fill="#7a5410" filter="url(#rough2)">长度 4</text>
  <text x="681" y="220" text-anchor="middle" font-size="10.5" fill="#7a5410" filter="url(#rough2)">再裁只剩 2 &lt; k，停在 k+1 = 4 ✓</text>

  <!-- ===== 中部解释框 ===== -->
  <rect x="60" y="320" width="840" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">为什么恰好是 k 与 k+1 两种长度？</text>
  <text x="480" y="366" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">同一中心每裁一步长度 −2，奇偶性永不变 —— 最短只能停在 k（与原长度同奇偶）；</text>
  <text x="480" y="386" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若原长度与 k 异奇偶，则停在 k+1。两种长度恰好把奇、偶两类全部覆盖。</text>

  <!-- ===== 底部结论框 ===== -->
  <rect x="60" y="416" width="840" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">规范化结论：存在最优解，其中每个回文的长度都恰为 k 或 k+1</text>
  <text x="480" y="464" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">任何长度 ≥ k 的回文都包含一个长度 k / k+1 的回文（同中心裁剪而得），</text>
  <text x="480" y="486" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">用它替换不破坏不重叠、也不减少数目 ⇒ 贪心每一步只需检查这两个长度。</text>
</svg>
