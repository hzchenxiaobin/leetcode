<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [1, 10, 3, 3, 3]，k = 3</text>
  <path d="M 120 40 Q 320 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="34" y="56" width="56" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="90" y="56" width="92" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="182" y="56" width="84" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="266" y="56" width="118" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="384" y="56" width="222" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>

    <rect x="34" y="86" width="56" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="90" y="86" width="92" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="182" y="86" width="84" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="266" y="86" width="118" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="384" y="86" width="222" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>

    <rect x="90" y="128" width="92" height="42" fill="#fce4ec" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="266" y="128" width="118" height="42" fill="#eaf6ee" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="34" y="128" width="56" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="182" y="128" width="84" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="384" y="128" width="222" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>

    <rect x="90" y="170" width="92" height="42" fill="#fce4ec" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="266" y="170" width="118" height="42" fill="#eaf6ee" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="34" y="170" width="56" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="182" y="170" width="84" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="384" y="170" width="222" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>

    <rect x="90" y="212" width="92" height="42" fill="#fce4ec" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="266" y="212" width="118" height="42" fill="#eaf6ee" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="34" y="212" width="56" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="182" y="212" width="84" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
    <rect x="384" y="212" width="222" height="42" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  </g>

  <text x="62" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">步</text>
  <text x="136" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">弹出 v</text>
  <text x="224" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">score</text>
  <text x="325" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">回写 ⌈v/3⌉</text>
  <text x="495" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">堆内剩余（降序）</text>

  <text x="62" y="112" text-anchor="middle" font-size="12" fill="#777777">初始</text>
  <text x="136" y="112" text-anchor="middle" font-size="12" fill="#777777">—</text>
  <text x="224" y="112" text-anchor="middle" font-size="12" fill="#777777">0</text>
  <text x="325" y="112" text-anchor="middle" font-size="12" fill="#777777">—</text>
  <text x="495" y="112" text-anchor="middle" font-size="12" fill="#2b2b2b">{10, 3, 3, 3, 1}</text>

  <text x="62" y="154" text-anchor="middle" font-size="12" fill="#777777">1</text>
  <text x="136" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">10</text>
  <text x="224" y="154" text-anchor="middle" font-size="12" fill="#2b2b2b">10</text>
  <text x="325" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="495" y="154" text-anchor="middle" font-size="12" fill="#2b2b2b">{4, 3, 3, 3, 1}</text>

  <text x="62" y="196" text-anchor="middle" font-size="12" fill="#777777">2</text>
  <text x="136" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4</text>
  <text x="224" y="196" text-anchor="middle" font-size="12" fill="#2b2b2b">14</text>
  <text x="325" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="495" y="196" text-anchor="middle" font-size="12" fill="#2b2b2b">{3, 3, 3, 2, 1}</text>

  <text x="62" y="238" text-anchor="middle" font-size="12" fill="#777777">3</text>
  <text x="136" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
  <text x="224" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">17</text>
  <text x="325" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="495" y="238" text-anchor="middle" font-size="12" fill="#2b2b2b">{3, 3, 2, 1, 1}</text>

  <g filter="url(#sk)">
    <rect x="40" y="280" width="560" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="301" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">score = 10 + 4 + 3 = 17 ✓　（红 = 弹出累加，绿 = 削弱回堆）</text>
  <text x="320" y="321" text-anchor="middle" font-size="11" fill="#555555">第 1 步回写的 4 大于 3，第 2 步堆自动改弹 4——「当前最大」始终由堆维护，无需手动判断</text>
</svg>
