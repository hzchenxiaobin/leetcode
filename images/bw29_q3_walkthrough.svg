<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    示例 2 走查：[0,1,1,1,0,1,1,0,1]
  </text>

  <!-- 状态行：right=3 窗口 [0..3] -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="46" y="54" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="80" y="54" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="114" y="54" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="148" y="54" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <text x="63" y="76" text-anchor="middle" fill="#446688">0</text>
    <text x="97" y="76" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="131" y="76" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="165" y="76" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="200" y="76" fill="#666">right=3，zeros=1，长度 4</text>
  </g>

  <!-- 状态行：right=4 收缩后 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="46" y="102" width="34" height="34" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <rect x="80" y="102" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="114" y="102" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="148" y="102" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="182" y="102" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="63" y="124" text-anchor="middle" fill="#999">0</text>
    <text x="97" y="124" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="131" y="124" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="165" y="124" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="199" y="124" text-anchor="middle" fill="#b85450">0</text>
    <text x="236" y="124" fill="#666">right=4：zeros=2 → left 右移，长度 4</text>
  </g>

  <!-- 状态行：right=6 最优窗口 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="80" y="150" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="114" y="150" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="148" y="150" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="182" y="150" width="34" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5"/>
    <rect x="216" y="150" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <rect x="250" y="150" width="34" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5"/>
    <text x="97" y="174" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="131" y="174" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="165" y="174" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="199" y="174" text-anchor="middle" fill="#8a6a1a">0</text>
    <text x="233" y="174" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="267" y="174" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="310" y="168" fill="#2f5a24">right=6：最优窗口</text>
    <text x="310" y="186" fill="#2f5a24">长度 6（含一个 0）</text>
  </g>

  <!-- 删 0 后 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="80" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="114" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="148" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="182" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="216" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="250" y="212" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="97" y="234" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="131" y="234" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="165" y="234" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="199" y="234" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="233" y="234" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="267" y="234" text-anchor="middle" fill="#2f5a24">1</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 199 190 L 199 206" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="310" y="228" fill="#666" font-size="13" filter="url(#rough2)">删掉窗口内的 0</text>
  <text x="310" y="246" fill="#2f5a24" font-size="13" filter="url(#rough2)">剩 6 − 1 = 5 个连续 1 ✓</text>

  <!-- 结论 -->
  <rect x="86" y="278" width="348" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    对照全 1 数组 [1,1,1]：窗口长度 3
  </text>
  <text x="260" y="328" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    同样减一 → 答案 2（必须删一个 1）
  </text>
</svg>
