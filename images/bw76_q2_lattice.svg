<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">「部分和」组合模型：p 支钢笔 + q 支铅笔</text>

  <!-- 坐标系 -->
  <path d="M 90 300 L 470 300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 90 300 L 90 80" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <path d="M 470 300 L 458 294 L 458 306 z" fill="#446688"/>
    <path d="M 90 80 L 84 92 L 96 92 z" fill="#446688"/>
  </g>
  <text x="486" y="305" font-size="12" fill="#446688" filter="url(#rough2)">p（钢笔）</text>
  <text x="76" y="70" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">q（铅笔）</text>

  <!-- 可行域：p·cost1 + q·cost2 ≤ total 的格点 -->
  <!-- 以 total=20, cost1=10, cost2=5 为例：p=0..2，q 上限 4,2,0 -->
  <g filter="url(#rough2)">
    <circle cx="130" cy="264" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="130" cy="234" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="130" cy="204" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="130" cy="174" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="130" cy="144" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>

    <circle cx="280" cy="204" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="280" cy="174" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="280" cy="144" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>

    <circle cx="430" cy="144" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <!-- 边界斜线 -->
  <path d="M 118 132 C 220 190, 320 240, 444 132" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="350" y="246" font-size="12" fill="#d6a040" filter="url(#rough2)">p·cost1 + q·cost2 = total</text>

  <!-- 轴刻度 -->
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="130" y="322">0</text><text x="280" y="322">1</text><text x="430" y="322">2</text>
    <text x="72" y="268">0</text><text x="72" y="238">1</text><text x="72" y="208">2</text>
    <text x="72" y="178">3</text><text x="72" y="148">4</text>
  </g>

  <!-- 注释 -->
  <rect x="100" y="330" width="400" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="300" y="347" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">每个 p 竖列的格点数 = ⌊(total − p·cost1)/cost2⌋ + 1，逐列求和</text>

  <text x="280" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">每列从下往上数：总格点 5 + 3 + 1 = 9 个方案 ✓</text>
</svg>
