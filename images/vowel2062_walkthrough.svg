  <text x="243" y="344" text-anchor="middle" font-size="13" fill="#aaaaaa">i</text>
  <text x="281" y="344" text-anchor="middle" font-size="13" fill="#8a6415">e</text>
  <text x="319" y="344" text-anchor="middle" font-size="13" fill="#666666">u</text>
