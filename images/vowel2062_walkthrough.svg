  <text x="451" y="96" text-anchor="middle" font-size="9" fill="#999999">8</text>
  <text x="489" y="96" text-anchor="middle" font-size="9" fill="#999999">9</text>

  <path d="M168,100 L168,108 M468,100 L468,108 M168,104 L468,104" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="318" y="122" text-anchor="middle" font-size="10.5" fill="#2e6e2e">唯一纯元音段 "uaieuoua"（下标 1–8）</text>

  <!-- legend -->
  <rect x="160" y="128" width="14" height="12" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
  <text x="180" y="138" font-size="10" fill="#555555">合法右端点（mask==31）</text>
  <rect x="330" y="128" width="14" height="12" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2" rx="2"/>
  <text x="350" y="138" font-size="10" fill="#555555">仍缺元音</text>
  <rect x="424" y="128" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
  <text x="444" y="138" font-size="10" fill="#555555">固定起点</text>

  <!-- row i=1 -->
  <text x="36" y="170" font-size="12" font-weight="bold" fill="#2b2b2b">起点 i=1（u）</text>
