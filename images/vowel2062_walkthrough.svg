<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：word = "cuaieuouac" → 输出 7</text>
  <text x="320" y="38" text-anchor="middle" font-size="11" fill="#666666">辅音墙 c…c 切出唯一纯元音段 "uaieuoua"，对每个起点看右端点何时凑齐 5 种</text>

  <!-- top string -->
  <g filter="url(#sk)">
    <rect x="130" y="50" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="168" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="206" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="244" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="282" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="358" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="396" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="434" y="50" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="472" y="50" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="147" y="72" text-anchor="middle" font-size="14" fill="#b85450">c</text>
  <text x="185" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">u</text>
  <text x="223" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <text x="261" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">i</text>
  <text x="299" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">e</text>
  <text x="337" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">u</text>
  <text x="375" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">o</text>
  <text x="413" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">u</text>
  <text x="451" y="72" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <text x="489" y="72" text-anchor="middle" font-size="14" fill="#b85450">c</text>
  <text x="147" y="96" text-anchor="middle" font-size="9" fill="#999999">0</text>
  <text x="185" y="96" text-anchor="middle" font-size="9" fill="#999999">1</text>
  <text x="223" y="96" text-anchor="middle" font-size="9" fill="#999999">2</text>
  <text x="261" y="96" text-anchor="middle" font-size="9" fill="#999999">3</text>
  <text x="299" y="96" text-anchor="middle" font-size="9" fill="#999999">4</text>
