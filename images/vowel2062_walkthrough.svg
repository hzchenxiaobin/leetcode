    <rect x="416" y="208" width="34" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="167" y="228" text-anchor="middle" font-size="13" fill="#aaaaaa">u</text>
  <text x="205" y="228" text-anchor="middle" font-size="13" fill="#8a6415">a</text>
  <text x="243" y="228" text-anchor="middle" font-size="13" fill="#666666">i</text>
  <text x="281" y="228" text-anchor="middle" font-size="13" fill="#666666">e</text>
  <text x="319" y="228" text-anchor="middle" font-size="13" fill="#666666">u</text>
  <text x="357" y="228" text-anchor="middle" font-size="13" fill="#2e6e2e">o</text>
  <text x="395" y="228" text-anchor="middle" font-size="13" fill="#2e6e2e">u</text>
  <text x="433" y="228" text-anchor="middle" font-size="13" fill="#2e6e2e">a</text>
  <text x="357" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="395" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="433" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="462" y="228" font-size="13" font-weight="bold" fill="#2e6e2e">3 个</text>

  <!-- row i=3 -->
  <text x="36" y="286" font-size="12" font-weight="bold" fill="#2b2b2b">起点 i=3（i）</text>
  <g filter="url(#sk)">
    <rect x="150" y="266" width="34" height="30" rx="4" fill="#f8f8f8" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3,2"/>
    <rect x="188" y="266" width="34" height="30" rx="4" fill="#f8f8f8" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3,2"/>
