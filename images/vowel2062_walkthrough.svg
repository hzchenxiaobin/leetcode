    <rect x="340" y="324" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="378" y="324" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="416" y="324" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
