  <text x="167" y="170" text-anchor="middle" font-size="13" fill="#8a6415">u</text>
  <text x="205" y="170" text-anchor="middle" font-size="13" fill="#666666">a</text>
  <text x="243" y="170" text-anchor="middle" font-size="13" fill="#666666">i</text>
  <text x="281" y="170" text-anchor="middle" font-size="13" fill="#666666">e</text>
  <text x="319" y="170" text-anchor="middle" font-size="13" fill="#666666">u</text>
  <text x="357" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e">o</text>
  <text x="395" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e">u</text>
  <text x="433" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e">a</text>
  <text x="357" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="395" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="433" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="462" y="170" font-size="13" font-weight="bold" fill="#2e6e2e">3 个</text>

