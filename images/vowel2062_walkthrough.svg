  <text x="350" y="368" text-anchor="middle" font-size="9.5" fill="#888888">最长窗口 "euoua" 仍缺 i → 全部非法</text>

  <!-- summary -->
  <text x="320" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">合计 3 + 3 + 1 + 0 = 7 ✓（与示例输出一致）</text>
  <text x="320" y="411" text-anchor="middle" font-size="10" fill="#888888">起点 i = 5…8 更靠右、窗口更短，均凑不齐 5 种 → 各 0 个</text>
