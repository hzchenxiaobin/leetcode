    <rect x="150" y="150" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="188" y="150" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="226" y="150" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="264" y="150" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="302" y="150" width="34" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2"/>
