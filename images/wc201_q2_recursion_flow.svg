<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：find(n, k) —— 每层三分支，n 严格减 1</text>

  <g filter="url(#rough2)">
    <rect x="252" y="42" width="136" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="320" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">find(n, k)</text>

    <path d="M 320 78 L 320 98" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="320,102 396,140 320,178 244,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="145" text-anchor="middle" font-size="12.5" fill="#b07818">n = 1 ？</text>

    <path d="M 396 140 L 456 140" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="426" y="132" text-anchor="middle" font-size="11" fill="#555">是</text>
    <rect x="460" y="122" width="152" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="536" y="145" text-anchor="middle" font-size="12.5" fill="#2e5e2e">return '0'</text>
    <text x="536" y="172" text-anchor="middle" font-size="9.5" fill="#888">S₁ = "0"</text>

    <path d="M 320 180 L 320 202" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="330" y="196" font-size="11" fill="#555">否</text>

    <polygon points="320,206 448,252 320,298 192,252" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="247" text-anchor="middle" font-size="12.5" fill="#2b4a66">k 与 mid = 2ⁿ⁻¹</text>
    <text x="320" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">比大小</text>

    <path d="M 448 252 L 464 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="455" y="241" text-anchor="middle" font-size="9.5" fill="#555">k = mid</text>
    <rect x="468" y="232" width="152" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="544" y="249" text-anchor="middle" font-size="12" fill="#b07818">return '1'</text>
    <text x="544" y="265" text-anchor="middle" font-size="9.5" fill="#b07818">（正中间，无需递归）</text>

    <path d="M 192 252 L 174 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="183" y="241" text-anchor="middle" font-size="9.5" fill="#555">k &lt; mid</text>
    <rect x="20" y="232" width="152" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="96" y="249" text-anchor="middle" font-size="11.5" fill="#2b4a66">find(n−1, k)</text>
    <text x="96" y="265" text-anchor="middle" font-size="9.5" fill="#555">进左半，原样递归</text>

    <path d="M 320 298 L 320 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="332" y="313" font-size="10" fill="#555">k &gt; mid</text>
    <rect x="180" y="322" width="280" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="320" y="341" text-anchor="middle" font-size="12" fill="#8a3a36">1 ⊕ find(n−1, 2ⁿ − k)</text>
    <text x="320" y="358" text-anchor="middle" font-size="9.5" fill="#8a3a36">进右半：先镜像 k ← 2ⁿ − k，返回值取反</text>

    <path d="M 95 230 C 95 150 150 70 248 60" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="128" y="146" text-anchor="middle" font-size="10" fill="#888">递归（n−1）</text>

    <path d="M 462 344 C 560 330 580 120 392 62" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="566" y="206" text-anchor="middle" font-size="10" fill="#888">递归（n−1）</text>

    <rect x="60" y="388" width="520" height="62" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="320" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a">每层 O(1) 判断，n 严格减 1 ⇒ 递归深度 ≤ 20，时间 O(n)</text>
    <text x="320" y="434" text-anchor="middle" font-size="10.5" fill="#666">迭代版：用 flipped 记录「进右半」次数，最后返回 '0' ⊕ flipped，省去递归栈</text>
  </g>
</svg>
