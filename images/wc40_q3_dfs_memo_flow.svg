<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="780" height="660" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：带记忆化的深度优先搜索（自顶向下 DP）</text>

  <!-- 入口 -->
  <g filter="url(#rough2)">
    <rect x="60" y="50" width="300" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="210" y="76" text-anchor="middle" font-size="12" fill="#335577" filter="url(#rough2)">dfs(r)：剩余需求 r 的最低花费</text>

  <!-- 判断 1 -->
  <g filter="url(#rough2)">
    <polygon points="210,124 350,163 210,202 70,163" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="210" y="168" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">r 已在 memo 中？</text>

  <line x1="210" y1="92" x2="210" y2="120" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="350" y1="163" x2="474" y2="163" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="155" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="478" y="140" width="240" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="598" y="168" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">直接返回 memo[r]（O(1) 剪掉）</text>

  <line x1="210" y1="202" x2="210" y2="234" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="222" font-size="10.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 基准方案 -->
  <g filter="url(#rough2)">
    <rect x="60" y="238" width="300" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="210" y="264" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">best ← Σ rᵢ · priceᵢ（全部单买）</text>

  <line x1="210" y1="280" x2="210" y2="336" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环容器 -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="430" height="252" rx="12" fill="#f7f7f2" stroke="#999999" stroke-width="1.2"
          stroke-dasharray="6 5"/>
  </g>
  <text x="60" y="322" font-size="11" font-weight="bold" fill="#555555" filter="url(#rough2)">对每个剪枝后的礼包 k 循环</text>

  <g filter="url(#rough2)">
    <polygon points="180,338 312,372 180,406 48,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="180" y="377" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">s_k ≤ r 逐维？</text>

  <line x1="312" y1="372" x2="326" y2="372" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="330" y="352" width="132" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="396" y="377" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">跳过，试下一个</text>

  <line x1="180" y1="406" x2="180" y2="428" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="422" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="48" y="432" width="264" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="452" text-anchor="middle" font-size="10.5" fill="#335577" filter="url(#rough2)">best ← min(best,</text>
  <text x="180" y="470" text-anchor="middle" font-size="10.5" fill="#335577" filter="url(#rough2)">c_k + dfs(r − s_k))</text>

  <text x="60" y="508" font-size="10.5" fill="#777777" filter="url(#rough2)">子问题整体再减一个礼包向量，规模严格变小</text>
  <text x="60" y="530" font-size="10.5" fill="#777777" filter="url(#rough2)">→ 递归深度 ≤ Σ needsᵢ ≤ 60，无环</text>

  <!-- 收尾 -->
  <line x1="180" y1="478" x2="180" y2="572" stroke="#888888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="556" font-size="10.5" fill="#446688" filter="url(#rough2)">循环结束后</text>

  <g filter="url(#rough2)">
    <rect x="48" y="576" width="300" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="198" y="603" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">memo[r] ← best，返回 best</text>

  <!-- 右侧状态转移方程 -->
  <g filter="url(#rough2)">
    <rect x="480" y="238" width="270" height="286" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="500" y="264" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">状态转移方程</text>
  <text x="500" y="294" font-size="11" fill="#444444" filter="url(#rough2)">f(r) = min( 先单买兜底,</text>
  <text x="500" y="316" font-size="11" fill="#444444" filter="url(#rough2)">           所有 s_k ≤ r 的</text>
  <text x="500" y="338" font-size="11" fill="#444444" filter="url(#rough2)">           c_k + f(r − s_k) )</text>
  <line x1="500" y1="352" x2="730" y2="352" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="376" font-size="10.5" fill="#666666" filter="url(#rough2)">边界：f(0) = 0</text>
  <text x="500" y="398" font-size="10.5" fill="#666666" filter="url(#rough2)">兜底：Σ rᵢ·priceᵢ 恒可行</text>
  <text x="500" y="420" font-size="10.5" fill="#666666" filter="url(#rough2)">答案：f(needs)</text>
  <line x1="500" y1="434" x2="730" y2="434" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="458" font-size="10.5" fill="#b85450" filter="url(#rough2)">剪枝条件（安全、无损）：</text>
  <text x="500" y="480" font-size="10.5" fill="#b85450" filter="url(#rough2)">c_k ≥ Σ s_{k,i}·priceᵢ</text>
  <text x="500" y="502" font-size="10.5" fill="#777777" filter="url(#rough2)">这样的礼包可用单买等价替换</text>
</svg>
