<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：n = 3（官方示例 1）与 n = 4（官方示例 2）</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">两表都是 h = 2、start = 10、total = 90；差别只在镜像长度 n − h：1 位 vs 2 位</text>

  <!-- table 1 label -->
  <text x="60" y="92" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">表① n = 3：half = 10 + (q−1)，镜像长度 = 1（去中点）</text>

  <!-- table 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="60" y="128" width="560" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="158" width="560" height="30" fill="#f8f8f2" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="188" width="560" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="218" width="560" height="30" fill="#f8f8f2" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="248" width="560" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 120 100 L 120 278 M 250 100 L 250 278 M 360 100 L 360 278 M 470 100 L 470 278" stroke="#999" stroke-width="1.1" fill="none"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#33475e" text-anchor="middle">
    <text x="90" y="118">q</text>
    <text x="185" y="118">half = 10+(q−1)</text>
    <text x="305" y="118">左半串 s</text>
    <text x="415" y="118">镜像 t = s[:1] 翻转</text>
    <text x="545" y="118">回文 answer</text>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="90" y="147">1</text>
    <text x="185" y="147">10</text>
    <text x="305" y="147">"10"</text>
    <text x="415" y="147">"1"</text>
    <text x="545" y="147" font-weight="bold">101</text>

    <text x="90" y="177">2</text>
    <text x="185" y="177">11</text>
    <text x="305" y="177">"11"</text>
    <text x="415" y="177">"1"</text>
    <text x="545" y="177" font-weight="bold">111</text>

    <text x="90" y="207">5</text>
    <text x="185" y="207">14</text>
    <text x="305" y="207">"14"</text>
    <text x="415" y="207">"1"</text>
    <text x="545" y="207" font-weight="bold">141</text>

    <text x="90" y="237">90</text>
    <text x="185" y="237">99</text>
    <text x="305" y="237">"99"</text>
    <text x="415" y="237">"9"</text>
    <text x="545" y="237" font-weight="bold">999</text>
  </g>
  <g font-size="11.5" fill="#999" text-anchor="middle">
    <text x="90" y="267">91</text>
  </g>
  <text x="310" y="267" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">91 &gt; 90 = total，越界</text>
  <text x="545" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">−1</text>

  <!-- table 2 label -->
  <text x="60" y="316" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">表② n = 4：half = 10 + (q−1)，镜像长度 = 2（整体翻转）</text>

  <!-- table 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="324" width="560" height="28" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="60" y="352" width="560" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="382" width="560" height="30" fill="#f8f8f2" stroke="#999" stroke-width="1.1"/>
    <rect x="60" y="412" width="560" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <path d="M 120 324 L 120 442 M 250 324 L 250 442 M 360 324 L 360 442 M 470 324 L 470 442" stroke="#999" stroke-width="1.1" fill="none"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="90" y="342">q</text>
    <text x="185" y="342">half = 10+(q−1)</text>
    <text x="305" y="342">左半串 s</text>
    <text x="415" y="342">镜像 t = s[:2] 翻转</text>
    <text x="545" y="342">回文 answer</text>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="90" y="371">2</text>
    <text x="185" y="371">11</text>
    <text x="305" y="371">"11"</text>
    <text x="415" y="371">"11"</text>
    <text x="545" y="371" font-weight="bold">1111</text>

    <text x="90" y="401">4</text>
    <text x="185" y="401">13</text>
    <text x="305" y="401">"13"</text>
    <text x="415" y="401">"31"</text>
    <text x="545" y="401" font-weight="bold">1331</text>

    <text x="90" y="431">6</text>
    <text x="185" y="431">15</text>
    <text x="305" y="431">"15"</text>
    <text x="415" y="431">"51"</text>
    <text x="545" y="431" font-weight="bold">1551</text>
  </g>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="70" y="462" width="540" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="484" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">[1,2,3,4,5,90] → [101,111,121,131,141,999] ✓</text>
  <text x="340" y="506" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">[2,4,6] → [1111,1331,1551] ✓（与官方输出一致）</text>

  <text x="340" y="542" text-anchor="middle" font-size="11" fill="#999">n = 15 时 total = 9×10^7 ≪ queries 上限 10^9：大长度下 −1 是常态输出</text>
</svg>
