<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">逐位累加：odd / even 两计数器一遍扫完</text>

  <!-- 流程 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="56" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="125" y="76">初始化</text>
    <text x="125" y="94">odd=0, even=1</text>
  </g>
  <path d="M 190 79 L 226 79" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="228" y="56" width="120" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="288" y="76">pre += arr[i]</text>
    <text x="288" y="94">（奇偶翻转与否）</text>
  </g>
  <path d="M 348 79 L 384 79" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <path d="M 420 56 L 486 56 L 504 79 L 486 102 L 420 102 L 438 79 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="462" y="85">pre 奇？</text>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="330" y="136" width="190" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="425" y="158">奇：ans += even</text>
    <text x="425" y="178">（找此前的偶前缀）</text>
  </g>
  <path d="M 462 102 C 462 118, 448 124, 436 134" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="124" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="136" width="190" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="185" y="158">偶：ans += odd</text>
    <text x="185" y="178">（找此前的奇前缀）</text>
  </g>
  <path d="M 420 79 C 380 79, 330 110, 280 134" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="96" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <path d="M 185 188 C 185 210, 288 210, 288 176 C 288 200, 425 208, 425 190" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="305" y="216" font-size="12" fill="#7a7a7a" filter="url(#rough2)" text-anchor="middle">各自更新 odd/even 计数，进入下一个元素</text>

  <!-- 演算表 -->
  <text x="280" y="252" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">演算：arr = [1, 3, 5]</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="90" y="264" width="76" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="166" y="264" width="76" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="242" y="264" width="76" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="318" y="264" width="76" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="394" y="264" width="76" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="128" y="284">i</text>
    <text x="204" y="284">arr[i]</text>
    <text x="280" y="284">pre</text>
    <text x="356" y="284">ans 累加</text>
    <text x="432" y="284">ans</text>

    <rect x="90" y="294" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="166" y="294" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="242" y="294" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="318" y="294" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="394" y="294" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="128" y="311">0</text><text x="204" y="311">1</text><text x="280" y="311">1 奇</text><text x="356" y="311">even=1</text><text x="432" y="311">1</text>

    <rect x="90" y="320" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="166" y="320" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="242" y="320" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="318" y="320" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <rect x="394" y="320" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="128" y="337">1</text><text x="204" y="337">3</text><text x="280" y="337">4 偶</text><text x="356" y="337">odd=1</text><text x="432" y="337">2</text>

    <rect x="90" y="346" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="166" y="346" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="242" y="346" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="318" y="346" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="394" y="346" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="128" y="363">2</text><text x="204" y="363">5</text><text x="280" y="363">9 奇</text><text x="356" y="363">even=2</text><text x="432" y="363">4</text>
  </g>
</svg>
