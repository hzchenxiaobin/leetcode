<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：req = [java, nodejs, reactjs]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">p0 = 001，p1 = 010，p2 = 110，目标 full = 111</text>

  <g filter="url(#rough2)">
    <rect x="50" y="58" width="460" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="120" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">mask</text>
    <text x="272" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">已覆盖技能</text>
    <text x="400" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">dp</text>
    <text x="462" y="77" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">由谁转移</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="88" width="460" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="120" y="106" fill="#444">000</text>
    <text x="272" y="106" fill="#777">（空）</text>
    <text x="400" y="106" fill="#444">0</text>
    <text x="462" y="106" fill="#777">初始</text>

    <rect x="50" y="118" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="120" y="136" fill="#3a5a30">001</text>
    <text x="272" y="136" fill="#3a5a30">java</text>
    <text x="400" y="136" fill="#3a5a30">1</text>
    <text x="462" y="136" fill="#3a5a30">000 + 0 号</text>

    <rect x="50" y="148" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="120" y="166" fill="#3a5a30">010</text>
    <text x="272" y="166" fill="#3a5a30">nodejs</text>
    <text x="400" y="166" fill="#3a5a30">1</text>
    <text x="462" y="166" fill="#3a5a30">000 + 1 号</text>

    <rect x="50" y="178" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="120" y="196" fill="#3a5a30">110</text>
    <text x="272" y="196" fill="#3a5a30">nodejs, reactjs</text>
    <text x="400" y="196" fill="#3a5a30">1</text>
    <text x="462" y="196" fill="#3a5a30">000 + 2 号</text>

    <rect x="50" y="208" width="460" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="120" y="226" fill="#444">011</text>
    <text x="272" y="226" fill="#555">java, nodejs</text>
    <text x="400" y="226" fill="#444">2</text>
    <text x="462" y="226" fill="#555">001 + 1 号</text>

    <rect x="50" y="238" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="120" y="257" fill="#8a6a20" font-weight="bold">111</text>
    <text x="272" y="257" fill="#8a6a20">java, nodejs, reactjs</text>
    <text x="400" y="257" fill="#8a6a20" font-weight="bold">2</text>
    <text x="462" y="257" fill="#8a6a20">001 + 2 号</text>
  </g>

  <path d="M 280 272 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="45" y="296" width="470" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
    <text x="60" y="316" font-size="10.5" fill="#8a3a36" font-weight="bold">结果：dp[111] = 2，回溯链 111 ← 001 ← 000</text>
    <text x="60" y="334" font-size="10" fill="#555">得到团队 [0, 2]：0 号补 java，2 号补 nodejs 与 reactjs，覆盖 111 且人数最少</text>
    <text x="60" y="347" font-size="10" fill="#555">从 110 再加 0 号也能到 111（dp 同样是 2），所以最优答案不唯一</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#777">dp 值只增不减：000 → 001/010/110（1 人）→ 011/111（2 人）</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999">注意 110 已覆盖 nodejs 与 reactjs：先选 2 号再补 0 号只需 2 人</text>
</svg>
