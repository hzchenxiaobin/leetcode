<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：stones = [2,7,4,1,8,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每行取当前最重的两块，结果写回数组末尾</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="56" y="76" text-anchor="start" font-weight="bold">轮次</text>
    <text x="140" y="76" text-anchor="middle" font-weight="bold">取 x, y</text>
    <text x="270" y="76" text-anchor="middle" font-weight="bold">操作</text>
    <text x="430" y="76" text-anchor="middle" font-weight="bold">剩余集合</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="40" y="86" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6"/>
    <text x="56" y="106" fill="#3a4a66">0</text>
    <text x="140" y="106" text-anchor="middle">—</text>
    <text x="270" y="106" text-anchor="middle">初始</text>
    <text x="430" y="106" text-anchor="middle">2,7,4,1,8,1</text>

    <rect x="40" y="122" width="480" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="56" y="142" fill="#3a4a66">1</text>
    <text x="140" y="142" text-anchor="middle">8, 7</text>
    <text x="270" y="142" text-anchor="middle">差 1 入堆</text>
    <text x="430" y="142" text-anchor="middle">2,4,1,1,1</text>

    <rect x="40" y="158" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6"/>
    <text x="56" y="178" fill="#3a4a66">2</text>
    <text x="140" y="178" text-anchor="middle">4, 2</text>
    <text x="270" y="178" text-anchor="middle">差 2 入堆</text>
    <text x="430" y="178" text-anchor="middle">2,1,1,1</text>

    <rect x="40" y="194" width="480" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6"/>
    <text x="56" y="214" fill="#3a4a66">3</text>
    <text x="140" y="214" text-anchor="middle">2, 1</text>
    <text x="270" y="214" text-anchor="middle">差 1 入堆</text>
    <text x="430" y="214" text-anchor="middle">1,1,1</text>

    <rect x="40" y="230" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6"/>
    <text x="56" y="250" fill="#8a3a36">4</text>
    <text x="140" y="250" text-anchor="middle">1, 1</text>
    <text x="270" y="250" text-anchor="middle">相等，都粉碎</text>
    <text x="430" y="250" text-anchor="middle">1</text>
  </g>

  <rect x="150" y="282" width="260" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">堆只剩 1 块 → 返回 1</text>
  <text x="280" y="320" text-anchor="middle" font-size="10" fill="#888">与示例输出一致</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999">注意：每次取的是「当前最重」而不是原数组顺序；第 2 轮取 4 与 2（不是 4 与 1）</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999">相等时两块都消失，所以堆大小可能一次减 2；这解释了为什么要判 x == y</text>
</svg>
