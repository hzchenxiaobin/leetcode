<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="344" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例：root = [1,2]，依次插入 3、4</text>
  <rect x="70" y="66" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="93.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="30" y="150" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="177.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="66" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285.0" y="93.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="150" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="177.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="150" width="100" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.0" y="177.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="390" y="66" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445.0" y="93.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="350" y="150" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400.0" y="177.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="480" y="150" width="100" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="177.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="350" y="234" width="100" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400.0" y="261.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <path d="M 260,110 L 230,150" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 440,110 L 400,150" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 460,110 L 530,150" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 400,194 L 400,234" stroke="#aaaaaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="125" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① 父节点 1</text>
  <text x="285" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">② 父节点 2</text>
  <rect x="20" y="286" width="640" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="311.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">插入位置由「层序第一个缺孩子的节点」决定：先补左、再补右</text>
</svg>
