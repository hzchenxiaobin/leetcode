<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="600" height="320" fill="#fafafa"/>
  <text x="300" y="30" text-anchor="middle" font-size="17" fill="#333">两个状态：下一步自由 g / 下一步必须上移 h</text>

  <rect x="60" y="60" width="180" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="14" fill="#446688">g[r][c]</text>
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#333">下一步自由：同行 / 上移 / 结束</text>

  <rect x="360" y="60" width="180" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="450" y="88" text-anchor="middle" font-size="14" fill="#b85450">h[r][c]</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#333">下一步必须上移（或已到顶行）</text>

  <path d="M150,130 Q150,180 300,186 Q430,190 450,134" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a">上移到 (r−1, c')：距离 sqrt(1+(c−c')²) ≤ d</text>

  <path d="M450,134 Q470,206 340,224" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="246" text-anchor="middle" font-size="12" fill="#b85450">同行到 (r, c')：|c−c'| ≤ d 且 c' ≠ c</text>

  <rect x="60" y="262" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="288" font-size="12" fill="#333">g = h + Σ 同行 h；h = Σ 上方 g。顶行 h = 1（到达即结束）</text>
</svg>
