<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">前缀和建模与「外部字符 → 端点界」的转化</text>

  <!-- 顶部公式框 -->
  <rect x="25" y="40" width="510" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">'1' 记 +1、'0' 记 −1：P[0] = 0，P[k+1] = P[k] ± 1，则 d(l,r) = P[r+1] − P[l]</text>
  <text x="280" y="87" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">可行窗口：d = 0（不交换）　或　d = ±2（一次跨窗口交换修复）</text>

  <!-- 卡片 TL：'0' 在右侧 -->
  <rect x="22" y="118" width="258" height="102" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">d=+2：'0' 在窗口右侧</text>
  <rect x="36" y="152" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="172" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋯</text>
  <rect x="100" y="152" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="172" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">窗口 [l,r]</text>
  <rect x="192" y="152" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="66" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &lt; l</text>
  <text x="222" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &gt; r</text>
  <text x="151" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⟺ r ≤ last0 − 1</text>

  <!-- 卡片 TR：'0' 在左侧 -->
  <rect x="280" y="118" width="258" height="102" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">d=+2：'0' 在窗口左侧</text>
  <rect x="294" y="152" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="358" y="152" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="172" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">窗口 [l,r]</text>
  <rect x="450" y="152" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="172" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="324" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &lt; l</text>
  <text x="480" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &gt; r</text>
  <text x="409" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⟺ l ≥ first0 + 1</text>

  <!-- 卡片 BL：'1' 在右侧 -->
  <rect x="22" y="228" width="258" height="102" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">d=−2：'1' 在窗口右侧</text>
  <rect x="36" y="262" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="282" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋯</text>
  <rect x="100" y="262" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="282" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">窗口 [l,r]</text>
  <rect x="192" y="262" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="66" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &lt; l</text>
  <text x="222" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &gt; r</text>
  <text x="151" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⟺ r ≤ last1 − 1</text>

  <!-- 卡片 BR：'1' 在左侧 -->
  <rect x="280" y="228" width="258" height="102" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">d=−2：'1' 在窗口左侧</text>
  <rect x="294" y="262" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="358" y="262" width="88" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="282" text-anchor="middle" font-size="12" fill="#8a6d1a" filter="url(#rough2)">窗口 [l,r]</text>
  <rect x="450" y="262" width="60" height="30" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="282" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="324" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &lt; l</text>
  <text x="480" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j &gt; r</text>
  <text x="409" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">⟺ l ≥ first1 + 1</text>

  <!-- 底部 solve 说明框 -->
  <rect x="25" y="342" width="510" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">solve(delta, lo, hi)：r 从 lo 扫到 hi，哈希表 occ 记每个前缀和值在 [lo, r] 的首次出现</text>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个 r 查 occ[P[r+1] − delta] 得最左 l，候选长度 r − l + 1</text>
  <text x="280" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">共 5 次调用：solve(0, 0, n−1) + 上面 4 个带界方向，整体 O(n)</text>
</svg>
