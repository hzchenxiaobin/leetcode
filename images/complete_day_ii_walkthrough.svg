<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="36" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例走查：hours = [12, 12, 30, 24, 24]</text>

  <!-- header row -->
  <rect x="25" y="62" width="530" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="45" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">j</text>
  <text x="105" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">hours[j]</text>
  <text x="185" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">r = h%24</text>
  <text x="290" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">查 cnt[(24−r)%24]</text>
  <text x="390" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">ans</text>
  <text x="490" y="84" text-anchor="middle" font-size="12.5" fill="#2f4358" filter="url(#rough2)">入桶后 cnt</text>

  <!-- row 0 -->
  <rect x="25" y="96" width="530" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="105" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="185" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="290" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[12] = 0 → +0</text>
  <text x="390" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="490" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12:1</text>

  <!-- row 1 (hit) -->
  <rect x="25" y="132" width="530" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="155" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="105" y="155" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="185" y="155" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="290" y="155" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">cnt[12] = 1 → +1 ★</text>
  <text x="390" y="155" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="490" y="155" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12:2</text>

  <!-- row 2 -->
  <rect x="25" y="168" width="530" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="105" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">30</text>
  <text x="185" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="290" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[18] = 0 → +0</text>
  <text x="390" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="490" y="191" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12:2, 6:1</text>

  <!-- row 3 -->
  <rect x="25" y="204" width="530" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="45" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="105" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="185" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[0] = 0 → +0</text>
  <text x="390" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="490" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12:2, 6:1, 0:1</text>

  <!-- row 4 (hit) -->
  <rect x="25" y="240" width="530" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="45" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="105" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">24</text>
  <text x="185" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="263" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">cnt[0] = 1 → +1 ★</text>
  <text x="390" y="263" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="490" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12:2, 6:1, 0:2</text>

  <!-- column separators -->
  <path d="M65,96 L65,276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M145,96 L145,276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M225,96 L225,276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M355,96 L355,276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M425,96 L425,276" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M25,96 L25,276" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M555,96 L555,276" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M25,276 L555,276" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="280" y="312" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">ans = 2 ✓ 对应 (0,1)：12+12=24，(3,4)：24+24=48</text>
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">两次命中都是"自配对"余数（12 与 0），统一公式无分支</text>
</svg>
