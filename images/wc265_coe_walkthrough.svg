<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 4 演算：s1 = "112s"，s2 = "g841" —— 原串 "g + a×12 + s"</text>
  <path d="M 120 38 Q 320 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- s1 tokens -->
  <g filter="url(#sk)">
    <rect x="70" y="44" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="160" y="44" width="92" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="312" y="44" width="26" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#2b4a6b" text-anchor="middle">
    <text x="83" y="59" filter="url(#sk)">1</text>
    <text x="206" y="59" filter="url(#sk)">12</text>
    <text x="325" y="59" filter="url(#sk)">s</text>
  </g>
  <text x="34" y="59" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">s1:</text>
  <path d="M 83 66 L 83 76" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 165 66 L 110 76" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 247 66 L 302 76" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 325 66 L 325 76" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>

  <!-- original bar -->
  <g filter="url(#sk)">
    <rect x="60" y="78" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="106" y="78" width="200" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="306" y="78" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle">
    <text x="83" y="99" font-size="13" fill="#333" filter="url(#sk)">g</text>
    <text x="206" y="99" font-size="13" fill="#8a6d20" filter="url(#sk)">a × 12</text>
    <text x="329" y="99" font-size="13" fill="#333" filter="url(#sk)">s</text>
  </g>

  <!-- s2 tokens -->
  <g filter="url(#sk)">
    <rect x="70" y="122" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="130" y="122" width="85" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="248" y="122" width="50" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="312" y="122" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#2e6e2e" text-anchor="middle">
    <text x="83" y="137" filter="url(#sk)">g</text>
    <text x="172" y="137" filter="url(#sk)">8</text>
    <text x="273" y="137" filter="url(#sk)">4</text>
    <text x="325" y="137" filter="url(#sk)">1</text>
  </g>
  <text x="34" y="137" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">s2:</text>
  <path d="M 83 112 L 83 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 135 112 L 112 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 212 112 L 234 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 253 112 L 243 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 293 112 L 302 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>
  <path d="M 325 112 L 325 120" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#sk)"/>

  <!-- right annotation -->
  <g filter="url(#sk)"><rect x="380" y="44" width="236" height="100" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g font-size="10.5" fill="#555">
    <text x="392" y="66" filter="url(#sk)">原串 T = "g a×12 s"，共 14 个字符</text>
    <text x="392" y="88" filter="url(#sk)">s1：[1][12][s] → 1+12+1 = 14 ✓</text>
    <text x="392" y="108" filter="url(#sk)">s2：[g][8][4][1] → 1+8+4+1 = 14 ✓</text>
    <text x="392" y="130" font-size="9.5" fill="#8a7a4a" filter="url(#sk)">虚线只表示消费区间的对齐，不代表字符内容</text>
  </g>

  <text x="320" y="164" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">下面沿一条可行路径走查状态（箭头旁标注每步所用的转移规则）：</text>

  <!-- state chain -->
  <g filter="url(#sk)"><rect x="52" y="176" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="112" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">(0, 0, 0)</text>
  <path d="M 112 208 L 112 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="216" font-size="10.5" fill="#555" filter="url(#sk)">k=0：s1 数字 "1"(v=1) 配 s2 字母 g → (i+1, j+1, v−1)</text>

  <g filter="url(#sk)"><rect x="52" y="234" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="112" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">(1, 1, 0)</text>
  <path d="M 112 266 L 112 288" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="274" font-size="10.5" fill="#555" filter="url(#sk)">k=0：双数字，s1 取 "12"(v=12)、s2 取 "8"(v=8) → k = 12−8 = 4</text>

  <g filter="url(#sk)"><rect x="52" y="292" width="120" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="112" y="313" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5f14" filter="url(#sk)">(3, 2, 4)</text>
  <path d="M 112 324 L 112 346" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="332" font-size="10.5" fill="#555" filter="url(#sk)">k=4&gt;0：s1 冻结，s2 独自追赶，取数字 "4"(v=4) → k = 4−4 = 0</text>

  <g filter="url(#sk)"><rect x="52" y="350" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="112" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">(3, 3, 0)</text>
  <path d="M 112 382 L 112 404" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="390" font-size="10.5" fill="#555" filter="url(#sk)">k=0：s1 字母 s 配 s2 数字 "1"(v=1) → k = 1−1 = 0</text>

  <g filter="url(#sk)"><rect x="52" y="408" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="112" y="429" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">(4, 4, 0)</text>
  <text x="190" y="420" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">i = n1 且 j = n2 且 k = 0 → 返回 true ★</text>
  <text x="190" y="438" font-size="9.5" fill="#66788a" filter="url(#sk)">（对应上方 token 对齐图中的那条编码方案）</text>
</svg>
