<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：定目标值 t → 左边清空、右边削平，拿出 = 总量 − 保留</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">排序后 beans = [1, 4, 5, 6]，total = 16；候选 t = 4 时，k = 3 个袋子 ≥ 4</text>

  <!-- target line t = 4 -->
  <path d="M 100 210 L 445 210" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="452" y="214" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">t = 4</text>

  <!-- baseline -->
  <path d="M 96 310 L 448 310" stroke="#555" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- bag 1: value 1, fully emptied (all taken out) -->
  <rect x="120" y="285" width="54" height="25" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- bag 2: value 4, kept as is -->
  <rect x="200" y="210" width="54" height="100" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- bag 3: value 5 = 4 kept + 1 taken out -->
  <rect x="280" y="210" width="54" height="100" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="280" y="185" width="54" height="25" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- bag 4: value 6 = 4 kept + 2 taken out -->
  <rect x="360" y="210" width="54" height="100" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="360" y="160" width="54" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- value labels -->
  <text x="147" y="278" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="227" y="203" text-anchor="middle" font-size="13.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="307" y="178" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="387" y="153" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- bag names -->
  <text x="147" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">袋 1</text>
  <text x="227" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">袋 2</text>
  <text x="307" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">袋 3</text>
  <text x="387" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">袋 4</text>

  <!-- operation labels -->
  <text x="147" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">清空 −1</text>
  <text x="227" y="350" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">保留 4</text>
  <text x="307" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">削平 −1</text>
  <text x="387" y="350" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">削平 −2</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="478" y="82" width="18" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="478" y="108" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <path d="M 478 143 L 496 143" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  </g>
  <text x="502" y="95" font-size="11" fill="#555" filter="url(#rough2)">拿出的豆子</text>
  <text x="502" y="121" font-size="11" fill="#555" filter="url(#rough2)">保留的豆子</text>
  <text x="502" y="147" font-size="11" fill="#555" filter="url(#rough2)">目标线 t</text>

  <!-- formula box -->
  <rect x="30" y="368" width="580" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">保留豆数 = t × k = 4 × 3 = 12；拿出 = total − 保留 = 16 − 12 = 4</text>
  <text x="320" y="410" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">拿出最少 ⟺ 保留最多 ⟺ 最大化 beans[i] × (n − i)</text>
</svg>
