<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">概念模型：格子三类型 + 花费维 DP 状态</text>

  <!-- 左列：三种格子 -->
  <text x="135" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">每个格子的（分数，花费）贡献</text>

  <rect x="30" y="68" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="40" y="78" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="95" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="78" y="87" font-size="12" fill="#333" filter="url(#rough2)">分数 +0，花费 +0</text>
  <text x="78" y="103" font-size="11" fill="#888" filter="url(#rough2)">免费通行，白走的路</text>

  <rect x="30" y="120" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="40" y="130" width="26" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="78" y="139" font-size="12" fill="#333" filter="url(#rough2)">分数 +1，花费 +1</text>
  <text x="78" y="155" font-size="11" fill="#888" filter="url(#rough2)">一分钱一分货</text>

  <rect x="30" y="172" width="210" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <rect x="40" y="182" width="26" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="53" y="199" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="78" y="191" font-size="12" fill="#333" filter="url(#rough2)">分数 +2，花费 +1</text>
  <text x="78" y="207" font-size="11" fill="#888" filter="url(#rough2)">性价比之王，见 2 必抢</text>

  <!-- 左下：观察框 -->
  <rect x="30" y="228" width="210" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="252" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">💡 观察：分数 − 花费</text>
  <text x="135" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 1 差 0，值 2 差 1，值 0 差 0</text>
  <text x="135" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ 路径分数 = 花费 +（2 的个数）</text>
  <text x="135" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">预算 k 逼你权衡：多花钱 or 多捡 2</text>

  <!-- 右列：转移示意 -->
  <text x="392" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">转移：来自「上」与「左」</text>

  <rect x="352" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="378" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(i−1,j)</text>

  <rect x="282" y="150" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(i,j−1)</text>

  <rect x="392" y="150" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(i,j)</text>

  <path d="M378 106 Q 378 138 404 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M334 168 L 384 168" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="200" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="382" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[i][j][c] = max( f[i−1][j][c−cost],</text>
  <text x="382" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[i][j−1][c−cost] ) + score</text>
  <text x="382" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">cost = (grid[i][j] &gt; 0)，score = grid[i][j]</text>

  <rect x="262" y="270" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="382" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f[i][j][c]：到 (i,j) 且花费恰好 c 的最大分数</text>
  <text x="382" y="312" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">答案 = max over 0 ≤ c ≤ k</text>
  <text x="382" y="330" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">「恰好」而非「至多」，最后统一取 max</text>
</svg>
