<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="445" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：可行性判定 + 中位数代价的完整走查</text>

  <!-- Example 1 -->
  <text x="52" y="48" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [1,4,7]，k = 3 —— 残差 1,1,1，d = [0,0,0]，全部可行</text>

  <!-- table 1 header -->
  <rect x="52" y="58" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">查询</text>
  <rect x="124" y="58" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">可行性</text>
  <rect x="242" y="58" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">p</text>
  <rect x="278" y="58" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">排序后</text>
  <rect x="388" y="58" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">中位数 m</text>
  <rect x="468" y="58" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ|xᵢ−m|</text>
  <rect x="572" y="58" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="75" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- table 1 row 1 -->
  <rect x="52" y="84" width="72" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,1]</text>
  <rect x="124" y="84" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="101" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d[1]−d[0]=0 ✓</text>
  <rect x="242" y="84" width="36" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="278" y="84" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="333" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,4]</text>
  <rect x="388" y="84" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="468" y="84" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="520" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0+3=3</text>
  <rect x="572" y="84" width="56" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="600" y="101" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <!-- table 1 row 2 (highlight) -->
  <rect x="52" y="110" width="72" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="127" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,2]</text>
  <rect x="124" y="110" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="127" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d[2]−d[0]=0 ✓</text>
  <rect x="242" y="110" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="278" y="110" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="127" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,4,7]</text>
  <rect x="388" y="110" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="127" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="468" y="110" width="104" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="127" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3+0+3=6</text>
  <rect x="572" y="110" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="52" y="158" font-size="10.5" fill="#666" filter="url(#rough2)">查询 [0,2]：m = 4，(4×2−5) + (12−5−4×1) = 3+3 = 6，ans = 6/3 = 2</text>

  <!-- Example 2 -->
  <text x="52" y="188" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 2：nums = [1,2,4]，k = 2 —— 残差 1,0,0，d = [0,1,1]，查询 [0,2] 不可行</text>

  <!-- table 2 header -->
  <rect x="52" y="198" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">查询</text>
  <rect x="124" y="198" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">可行性</text>
  <rect x="242" y="198" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">p</text>
  <rect x="278" y="198" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">排序后</text>
  <rect x="388" y="198" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">中位数 m</text>
  <rect x="468" y="198" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ|xᵢ−m|</text>
  <rect x="572" y="198" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="215" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- table 2 row 1: infeasible (highlight red) -->
  <rect x="52" y="224" width="72" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="241" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,2]</text>
  <rect x="124" y="224" width="118" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="241" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">d[2]−d[0]=1 ✗</text>
  <rect x="242" y="224" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="278" y="224" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="333" y="241" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="388" y="224" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="241" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="468" y="224" width="104" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="241" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="572" y="224" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- table 2 row 2 -->
  <rect x="52" y="250" width="72" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,0]</text>
  <rect x="124" y="250" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="267" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d[0]−d[0]=0 ✓</text>
  <rect x="242" y="250" width="36" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="278" y="250" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="333" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="388" y="250" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="468" y="250" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="520" y="267" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="572" y="250" width="56" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="600" y="267" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>

  <!-- table 2 row 3 -->
  <rect x="52" y="276" width="72" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="88" y="293" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <rect x="124" y="276" width="118" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="293" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d[2]−d[1]=0 ✓</text>
  <rect x="242" y="276" width="36" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="278" y="276" width="110" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="333" y="293" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,4]</text>
  <rect x="388" y="276" width="80" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="293" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="468" y="276" width="104" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="520" y="293" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0+2=2</text>
  <rect x="572" y="276" width="56" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="600" y="293" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <text x="52" y="324" font-size="10.5" fill="#666" filter="url(#rough2)">查询 [1,2]：m = 2，(2×1−2) + (6−2−2×1) = 0+2 = 2，ans = 2/2 = 1</text>

  <!-- bottom key points -->
  <rect x="40" y="348" width="560" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">要点：可行性 = 前缀一减 O(1)；统计 = 主席树版本差两次下行 O(log n)</text>
  <text x="320" y="393" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 = Σ|xᵢ − m| / k（m 为区间下中位数）；异余不可行返回 −1</text>
  <text x="320" y="415" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">单元素查询自动得 0；偶数长度区间取下中位数即可</text>
</svg>
