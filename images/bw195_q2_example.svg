<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：types=[0,1,1,0], colors=[5,3,3,5], groupSize=[2,2]</text>
  <text x="56" y="82" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">初始</text>
  <rect x="150" y="62" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179.0" y="82.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0/5</text>
  <rect x="212" y="62" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241.0" y="82.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1/3</text>
  <rect x="274" y="62" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303.0" y="82.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1/3</text>
  <rect x="336" y="62" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365.0" y="82.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0/5</text>
  <text x="150" y="112" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">四段：(0,5)(1,3)(1,3)(0,5)</text>
  <text x="56" y="166" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">删 (1,3)×2</text>
  <rect x="150" y="146" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179.0" y="166.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0/5</text>
  <rect x="212" y="146" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241.0" y="166.85" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0/5</text>
  <text x="150" y="196" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">类型1、颜色3 连续两个，恰为 groupSize[1]=2</text>
  <text x="56" y="250" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">删 (0,5)×2</text>
  <text x="150" y="252" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（空）</text>
  <text x="150" y="280" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">剩下的两个同类型同色，恰为 groupSize[0]=2</text>
  <rect x="50" y="300" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="318" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">两步清空</text>
  <text x="62" y="334" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">先删中间那对 (1,3) 之后，两个 (0,5) 立刻变得相邻，再删一次即可。</text>
  <text x="62" y="349" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">这正是「删完一侧、另一侧靠拢」的经典栈结构。</text>
</svg>
