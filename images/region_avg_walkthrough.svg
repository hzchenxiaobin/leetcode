<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：threshold = 12，avg = 25 与 30，重叠行取 ⌊27.5⌋ = 27</text>
  <path d="M 200 36 Q 380 44 560 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：image 与两个区域 ===== -->
  <text x="186" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">image</text>

  <text x="78" y="117" text-anchor="end" font-size="11" fill="#888888" filter="url(#rough2)">r0</text>
  <text x="78" y="163" text-anchor="end" font-size="11" fill="#888888" filter="url(#rough2)">r1</text>
  <text x="78" y="209" text-anchor="end" font-size="11" fill="#888888" filter="url(#rough2)">r2</text>
  <text x="78" y="255" text-anchor="end" font-size="11" fill="#888888" filter="url(#rough2)">r3</text>

  <!-- 区域②（行 1–3，先画在下层） -->
  <rect x="74" y="128" width="210" height="154" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="64" y="274" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">②</text>

  <!-- 区域①（行 0–2） -->
  <rect x="80" y="82" width="210" height="154" rx="6" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="70" y="100" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>

  <!-- image 单元格 -->
  <rect x="90" y="90" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="90" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="90" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="136" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="136" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="136" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="182" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="182" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="182" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="228" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="228" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="218" y="228" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <text x="122" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">10</text>
  <text x="186" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">20</text>
  <text x="250" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">30</text>
  <text x="122" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">15</text>
  <text x="186" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">25</text>
  <text x="250" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">35</text>
  <text x="122" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">20</text>
  <text x="186" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">30</text>
  <text x="250" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">40</text>
  <text x="122" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">25</text>
  <text x="186" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">35</text>
  <text x="250" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">45</text>

  <!-- 中间大箭头 -->
  <path d="M 300 182 L 450 182" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">两层取整</text>
  <text x="375" y="202" text-anchor="middle" font-size="10.5" fill="#8a6a30" filter="url(#rough2)">先 ⌊S/9⌋，再 ⌊Σ/cnt⌋</text>

  <!-- ===== 右：result ===== -->
  <text x="548" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">result</text>

  <rect x="470" y="90" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="90" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="574" y="90" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="470" y="136" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="136" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="574" y="136" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="470" y="182" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="182" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="574" y="182" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="470" y="228" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="228" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="574" y="228" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <text x="496" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">25</text>
  <text x="548" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">25</text>
  <text x="600" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">25</text>
  <text x="496" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="548" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="600" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="496" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="548" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="600" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">27</text>
  <text x="496" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">30</text>
  <text x="548" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">30</text>
  <text x="600" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">30</text>

  <text x="638" y="117" font-size="10.5" fill="#666666" filter="url(#rough2)">cnt=1</text>
  <text x="638" y="163" font-size="10.5" fill="#666666" filter="url(#rough2)">cnt=2</text>
  <text x="638" y="209" font-size="10.5" fill="#666666" filter="url(#rough2)">cnt=2</text>
  <text x="638" y="255" font-size="10.5" fill="#666666" filter="url(#rough2)">cnt=1</text>

  <!-- 底部说明 -->
  <rect x="70" y="310" width="620" height="92" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">区域①（行 0–2）S = 225 → 25；区域②（行 1–3）S = 270 → 30</text>
  <text x="380" y="357" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">行 0 仅① → 25；行 1、2 属 ①+② → ⌊(25+30)/2⌋ = 27；行 3 仅② → 30</text>
  <text x="380" y="380" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">先用取整后的 25、30 参与平均；未被覆盖的像素保留原值（本例无，见示例 3）</text>
</svg>
