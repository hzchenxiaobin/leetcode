<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">正向构造会爆炸 · 倒序追踪一个位置</text>
  <path d="M 210 40 Q 320 50 430 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel 1: forward explosion -->
  <text x="30" y="72" font-size="14" font-weight="bold" fill="#a04040">① 正向模拟：'#' 让长度指数增长</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="30" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="45" y="108" text-anchor="middle" fill="#444">a</text>
    <path d="M 68 103 L 94 103" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="81" y="97" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">#</text>
    <g filter="url(#sk)"><rect x="102" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="117" y="108" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="136" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="151" y="108" text-anchor="middle" fill="#444">a</text>
    <path d="M 174 103 L 200 103" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="187" y="97" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">#</text>
    <g filter="url(#sk)"><rect x="208" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="223" y="108" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="242" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="257" y="108" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="276" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="291" y="108" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="310" y="86" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="325" y="108" text-anchor="middle" fill="#444">a</text>
    <path d="M 348 103 L 374 103" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
    <text x="361" y="97" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">#</text>
    <g filter="url(#sk)">
      <rect x="382" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="399" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="416" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="433" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="450" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="467" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="484" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
      <rect x="501" y="86" width="15" height="34" rx="3" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1"/>
    </g>
    <text x="532" y="108" font-size="13" fill="#888">……</text>
  </g>
  <g filter="url(#sk)">
    <rect x="55" y="134" width="530" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="320" y="154" text-anchor="middle" font-size="11.5" fill="#a04040">长度一路 ×2，|result| 可达 10¹⁵ —— 显式构造必然 MLE / TLE　✗</text>

  <!-- Panel 2: backward tracing -->
  <text x="30" y="212" font-size="14" font-weight="bold" fill="#2e6e2e">② 倒序追踪：只关心第 k 位从哪里来　✓</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#sk)"><rect x="250" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="265" y="250" text-anchor="middle" fill="#444">a</text>
    <g filter="url(#sk)"><rect x="284" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="299" y="250" text-anchor="middle" fill="#444">b</text>
    <g filter="url(#sk)"><rect x="318" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="333" y="250" text-anchor="middle" fill="#444">c</text>
    <g filter="url(#sk)"><rect x="352" y="228" width="30" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="367" y="250" text-anchor="middle" fill="#7a5415" font-weight="bold">?</text>
    <g filter="url(#sk)"><rect x="386" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="401" y="250" text-anchor="middle" fill="#444">d</text>
    <g filter="url(#sk)"><rect x="420" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="435" y="250" text-anchor="middle" fill="#444">e</text>
    <g filter="url(#sk)"><rect x="454" y="228" width="30" height="34" rx="4" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2"/></g>
    <text x="469" y="250" text-anchor="middle" fill="#444">f</text>
  </g>
  <text x="500" y="242" font-size="11" fill="#888">最终 result</text>
  <text x="500" y="258" font-size="11" fill="#888">（长度只记数字 L）</text>
  <path d="M 367 284 L 367 268" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="367" y="298" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">k</text>
  <text x="300" y="304" text-anchor="middle" font-size="10" fill="#888">从最后一个操作开始，一步一步往回走 ↓</text>
  <path d="M 380 266 Q 408 292 426 306" stroke="#8a8a80" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#sk)"/>

  <!-- backward op chips -->
  <g filter="url(#sk)">
    <rect x="416" y="312" width="64" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="448" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">'%' 反转</text>
  <g filter="url(#sk)">
    <rect x="330" y="312" width="64" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="362" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">'#' 加倍</text>
  <g filter="url(#sk)">
    <rect x="244" y="312" width="64" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="276" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">'*' 删尾</text>
  <g filter="url(#sk)">
    <rect x="158" y="312" width="64" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="190" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">字母</text>
  <path d="M 412 331 L 400 331" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 326 331 L 314 331" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 240 331 L 228 331" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 154 331 L 142 331" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="26" y="306" width="112" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="82" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">k 命中字母 c</text>
  <text x="82" y="346" text-anchor="middle" font-size="11" fill="#2e6e2e">→ 它就是答案</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="50" y="382" width="540" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#888">正向构造 O(L)（L ≤ 10¹⁵，不可行）→ 倒序每步 O(1) 算术更新下标 k，总代价 O(n)</text>
</svg>
