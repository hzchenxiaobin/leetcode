<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">solve(l, r) 分治流程</text>

  <!-- root -->
  <rect x="180" y="48" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">solve(l, r)</text>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mid = (l + r) / 2</text>

  <!-- recurse -->
  <line x1="210" y1="92" x2="140" y2="140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="350" y1="92" x2="420" y2="140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="144" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">solve(l, mid)</text>
  <rect x="320" y="144" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="169" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">solve(mid+1, r)</text>

  <!-- cross counting -->
  <line x1="280" y1="92" x2="280" y2="204" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="208" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">统计跨越 mid 的对</text>
  <text x="280" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c[j] ≤ nums[i] &lt; nums[j] ≤ b[i]</text>

  <!-- sub-steps -->
  <rect x="50" y="280" width="220" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 有序集合算 b[i]、c[j]</text>
  <text x="160" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b[i] 自右向左，c[j] 自左向右</text>

  <rect x="290" y="280" width="220" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 树状数组数对</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">右端点按 y 降序 + BIT</text>

  <!-- return -->
  <rect x="180" y="356" width="200" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回三者之和</text>
  <line x1="160" y1="332" x2="220" y2="354" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="400" y1="332" x2="360" y2="354" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="254" x2="280" y2="354" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
