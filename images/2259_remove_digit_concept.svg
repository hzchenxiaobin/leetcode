<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：删 i 还是删 j？差异最早出现在位置 i</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- number row -->
  <text x="100" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">number =</text>
  <g filter="url(#sk)">
    <rect x="180" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="280" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="380" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="480" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="202" y="88">1</text>
    <text x="302" y="88">2</text>
    <text x="402" y="88">3</text>
    <text x="502" y="88">1</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="202" y="112">下标 0</text>
    <text x="302" y="112">下标 1</text>
    <text x="402" y="112">下标 2</text>
    <text x="502" y="112">下标 3</text>
  </g>
  <text x="545" y="88" font-size="13" font-weight="bold" fill="#9a6a15">digit = '1'</text>

  <!-- occurrence markers -->
  <g filter="url(#sk)">
    <ellipse cx="202" cy="132" rx="11" ry="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="202" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" font-style="italic">i</text>
  <g filter="url(#sk)">
    <ellipse cx="502" cy="132" rx="11" ry="11" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="502" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a15" font-style="italic">j</text>

  <path d="M 202 144 L 202 164" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 502 144 L 502 164" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- panel A: delete i -->
  <g filter="url(#sk)">
    <rect x="72" y="168" width="260" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="202" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">删位置 i = 0</text>
  <g filter="url(#sk)">
    <rect x="128" y="202" width="38" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="172" y="202" width="38" height="28" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="216" y="202" width="38" height="28" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="147" y="221">2</text>
    <text x="191" y="221">3</text>
    <text x="235" y="221">1</text>
  </g>
  <text x="272" y="221" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">= "231"</text>

  <!-- panel B: delete j -->
  <g filter="url(#sk)">
    <rect x="372" y="168" width="260" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="502" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038">删位置 j = 3</text>
  <g filter="url(#sk)">
    <rect x="428" y="202" width="38" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="472" y="202" width="38" height="28" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
    <rect x="516" y="202" width="38" height="28" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="447" y="221">1</text>
    <text x="491" y="221">2</text>
    <text x="535" y="221">3</text>
  </g>
  <text x="572" y="221" font-size="13" fill="#a04038" font-family="monospace" font-weight="bold">= "123"</text>

  <!-- comparison callout -->
  <g filter="url(#sk)">
    <rect x="140" y="268" width="400" height="32" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="289" text-anchor="middle" font-size="12.5" fill="#7a5415">下标 0 处首次分出胜负：'2' &gt; '1' → 删 i 的结果更大</text>

  <!-- rule box -->
  <g filter="url(#sk)">
    <rect x="40" y="316" width="600" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">贪心规则</text>
  <text x="340" y="358" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">number[i] == digit 且 number[i+1] &gt; digit → 立即删除位置 i</text>
  <text x="340" y="378" text-anchor="middle" font-size="11.5" fill="#666">全程未触发 → 删除最后一次出现的 digit（后继相等时删哪个结果都一样）</text>
</svg>
