<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：枚举 k → 反转 → 检验，命中即提前返回</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top-right annotation -->
  <g filter="url(#sk)"><rect x="468" y="52" width="196" height="56" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="482" y="74" font-size="11" fill="#555" filter="url(#sk)">时间 O(num·d)，d ≤ 6 → O(num)</text>
  <text x="482" y="94" font-size="11" fill="#555" filter="url(#sk)">空间 O(1)；存在性判定命中即停</text>

  <!-- step 1 -->
  <g filter="url(#sk)"><rect x="200" y="56" width="240" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="80" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">① 初始化 k = 0</text>
  <g filter="url(#sk)"><path d="M 320 94 L 320 118" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/></g>

  <!-- step 2: diamond k > num? -->
  <g filter="url(#sk)"><polygon points="320,120 448,162 320,204 192,162" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="167" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">② k &gt; num ？</text>
  <g filter="url(#sk)"><path d="M 448 162 L 538 162" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="490" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="540" y="140" width="132" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="606" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33a35" filter="url(#sk)">返回 false</text>
  <text x="606" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">扫完 [0,num] 无解 ✗</text>
  <g filter="url(#sk)"><path d="M 320 204 L 320 228" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="336" y="222" font-size="11" fill="#888" filter="url(#sk)">否</text>

  <!-- step 3: reverse -->
  <g filter="url(#sk)"><rect x="205" y="230" width="230" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">③ 数值反转 rev(k)</text>
  <text x="222" y="270" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">rev = 0; t = k</text>
  <text x="222" y="287" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">while t &gt; 0:</text>
  <text x="234" y="304" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">rev = rev*10 + t%10</text>
  <text x="234" y="321" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">t /= 10</text>
  <g filter="url(#sk)"><rect x="468" y="240" width="196" height="76" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="482" y="262" font-size="11" fill="#555" filter="url(#sk)">k ≤ num ≤ 10⁵：至多 6 位</text>
  <text x="482" y="282" font-size="11" fill="#555" filter="url(#sk)">rev(k) ≤ 99999</text>
  <text x="482" y="302" font-size="11" fill="#555" filter="url(#sk)">k + rev(k) ≤ 199998，int 足够</text>
  <g filter="url(#sk)"><path d="M 320 330 L 320 352" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/></g>

  <!-- step 4: diamond hit? -->
  <g filter="url(#sk)"><polygon points="320,354 470,398 320,442 170,398" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="403" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">④ k + rev(k) = num ？</text>
  <g filter="url(#sk)"><path d="M 470 398 L 548 398" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="504" y="390" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="550" y="376" width="130" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="615" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 true</text>
  <text x="615" y="412" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">k 即为所求 ✓</text>

  <!-- no branch: k++ loop back -->
  <g filter="url(#sk)"><path d="M 170 398 L 96 398 L 96 162 L 190 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="128" y="390" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否，k++ ↻</text>
  <text x="78" y="286" font-size="11" fill="#999" filter="url(#sk)">逐个检验</text>
</svg>
