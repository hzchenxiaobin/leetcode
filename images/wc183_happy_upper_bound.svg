<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">长度上界：R 个分隔字符最多撑起 R+1 组 "XX"</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">引理 1：快乐串中任一字符 X 的个数 ≤ 2 × (其余字符个数 + 1)</text>

  <!-- A: 分段图 -->
  <text x="320" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">把 X 的出现按极大连续段分组：每组 ≤ 2 个，相邻两组之间至少隔 1 个非 X</text>
  <g filter="url(#r)">
    <rect x="150" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="98" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="252" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="286" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="98" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="354" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="388" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="422" y="98" width="34" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="456" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="490" y="98" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="167" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="201" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="235" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">y</text>
  <text x="269" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="303" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="337" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">z</text>
  <text x="371" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="405" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="439" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">w</text>
  <text x="473" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="507" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">X</text>
  <text x="167" y="152" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#r)">第 1 组</text>
  <text x="269" y="152" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#r)">第 2 组</text>
  <text x="371" y="152" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#r)">第 3 组</text>
  <text x="473" y="152" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#r)">第 4 组</text>
  <path d="M 219 162 V 170 H 455 V 162" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#r)"/>
  <text x="337" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0761e" filter="url(#r)">R = 3 个分隔字符 → X 至多 R + 1 = 4 组</text>
  <text x="320" y="212" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">每组 ≤ 2 个 ⟹ X 的总个数 ≤ 2(R + 1)——与分隔字符怎么排无关</text>

  <!-- B: 两种情形 -->
  <g filter="url(#r)">
    <rect x="24" y="236" width="288" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="168" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">情形 A：M ≤ 2(R+1)</text>
  <text x="168" y="284" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">瓶颈字符塞得下 → 三个配额全放完</text>
  <text x="168" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最大长度 L* = S</text>
  <g filter="url(#r)">
    <rect x="328" y="236" width="288" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="472" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">情形 B：M &gt; 2(R+1)</text>
  <text x="472" y="282" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">X 超额 → 至多放 2(R+1) 个 X</text>
  <text x="472" y="300" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">再加上其余全部 R 个字符</text>
  <text x="472" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">最大长度 L* = 3R + 2</text>

  <!-- C: 公式 -->
  <g filter="url(#r)">
    <rect x="24" y="352" width="592" height="112" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#r)">maxLen = min(S, 3R + 2)</text>
  <text x="320" y="408" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#r)">其中 S = a + b + c，M = max(a, b, c)，R = S − M（其余配额之和）</text>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#r)">验证：(1,1,7) → R=2，min(9, 8) = 8 ✓ ；(7,1,0) → R=1，min(8, 5) = 5 ✓</text>
  <text x="320" y="456" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#r)">(2,2,1) → M=2 ≤ 2(R+1)=8，min(5, 11) = 5 ✓</text>
</svg>
