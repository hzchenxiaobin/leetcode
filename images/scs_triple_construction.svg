<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三段式构造：S = T 串 + topo(G−T) + T 串</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">例：words = ["ab","bc","ca"]，T = {a}，G−T 只剩边 b→c（DAG），topo = b,c</text>

  <!-- ===== the string with segments ===== -->
  <!-- segment brackets -->
  <path d="M 150 128 L 146 136 L 262 136 L 258 128" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="204" y="152" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">T 段（两次字母）</text>
  <path d="M 270 128 L 266 136 L 398 136 L 394 128" stroke="#4a8edb" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="332" y="152" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">topo 段（拓扑序）</text>
  <path d="M 406 128 L 402 136 L 518 136 L 514 128" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="460" y="152" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">T 段（再一遍）</text>

  <!-- cells: a | b c | a  (56px wide, x from 150) -->
  <g font-size="16">
    <g filter="url(#sk)"><rect x="150" y="76" width="56" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="178" y="104" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="206" y="76" width="56" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="234" y="104" text-anchor="middle" fill="#7a5415" font-weight="bold">（T 其他字母…）</text>
    <g filter="url(#sk)"><rect x="262" y="76" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="290" y="104" text-anchor="middle" fill="#2b4a6e" font-weight="bold">b</text>
    <g filter="url(#sk)"><rect x="318" y="76" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="346" y="104" text-anchor="middle" fill="#2b4a6e" font-weight="bold">c</text>
    <g filter="url(#sk)"><rect x="374" y="76" width="20" height="44" rx="6" fill="none"/></g>
    <g filter="url(#sk)"><rect x="394" y="76" width="56" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="422" y="104" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="450" y="76" width="56" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="478" y="104" text-anchor="middle" fill="#7a5415" font-weight="bold">（T 其他字母…）</text>
  </g>
  <text x="560" y="100" font-size="12" fill="#2e6e2e" font-weight="bold">⇒ 简单情形即 "abca"</text>

  <!-- position indices -->
  <text x="178" y="170" text-anchor="middle" font-size="10" fill="#888">p0</text>
  <text x="290" y="170" text-anchor="middle" font-size="10" fill="#888">p1</text>
  <text x="346" y="170" text-anchor="middle" font-size="10" fill="#888">p2</text>
  <text x="422" y="170" text-anchor="middle" font-size="10" fill="#888">p3</text>

  <!-- matching arcs -->
  <!-- a->b : p0 -> p1 (green) -->
  <path d="M 178 72 Q 234 8 286 66" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="232" y="14" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">边 a→b（x∈T, y∉T）</text>
  <!-- b->c : p1 -> p2 (green) -->
  <path d="M 292 72 Q 318 40 340 68" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="316" y="38" text-anchor="middle" font-size="9" fill="#2e6e2e" font-weight="bold">b→c</text>
  <!-- c->a : p2 -> p3 (green) -->
  <path d="M 348 72 Q 384 24 416 66" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="384" y="22" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">边 c→a（x∉T, y∈T）</text>

  <!-- ===== four cases box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="196" width="520" height="200" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="222" font-size="13" font-weight="bold" fill="#2e6e2e">四类约束边逐一验证（G−T 是 DAG 时全部成立）</text>
  <g font-size="11">
    <text x="80" y="250" fill="#444">① x→y 且 x,y ∉ T：topo 段本身是拓扑序，x 排在 y 前 ✓</text>
    <text x="80" y="278" fill="#444">② x→y 且 x∈T, y∉T：前 T 段的 x 一定在 topo 段的 y 前 ✓</text>
    <text x="80" y="306" fill="#444">③ x→y 且 x∉T, y∈T：topo 段的 x 一定在后 T 段的 y 前 ✓</text>
    <text x="80" y="334" fill="#444">④ x→y 且 x,y∈T：前 T 段的 x 在后 T 段的 y 前（顺序无关）✓</text>
    <text x="80" y="366" fill="#b03a3a" font-weight="bold">另外每个 "xx" 型词：x∈T 出现两次，天然满足 ✓</text>
  </g>

  <!-- length box -->
  <g filter="url(#sk)">
    <rect x="600" y="196" width="300" height="200" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="620" y="222" font-size="13" font-weight="bold" fill="#7a5415">构造串的长度</text>
  <text x="620" y="252" font-size="12" fill="#444" font-family="monospace">|S| = 2·|T| + (n − |T|)</text>
  <text x="620" y="284" font-size="14" fill="#b03a3a" font-weight="bold" font-family="monospace">|S| = n + |T|</text>
  <text x="620" y="312" font-size="11" fill="#666">n = 字母总数（每个至少 1 次）</text>
  <text x="620" y="334" font-size="11" fill="#666">|T| = 被提升到 2 次的字母数</text>
  <text x="620" y="366" font-size="11" fill="#7a5415" font-weight="bold">最短 ⇔ |T| 最小 ⇔ 最小反馈顶点集</text>

  <!-- ===== why removing cycle is necessary ===== -->
  <text x="470" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2828">反过来：若 G−T 里还有环，无论怎么排都排不出来</text>

  <g filter="url(#sk)">
    <rect x="60" y="448" width="840" height="120" rx="8" fill="#fdf3f4" stroke="#b03a3a" stroke-width="1.3"/>
  </g>
  <g font-size="11">
    <text x="84" y="476" fill="#444">环 v₁ → v₂ → ⋯ → v_k → v₁ 上的字母都不在 T 中 ⇒ 各只出现一次；</text>
    <text x="84" y="500" fill="#444">词 "v₁v₂" ⇒ p(v₁) &lt; p(v₂)，词 "v₂v₃" ⇒ p(v₂) &lt; p(v₃)，……，词 "v_kv₁" ⇒ p(v_k) &lt; p(v₁)</text>
    <text x="84" y="526" fill="#b03a3a" font-weight="bold">首尾相接：p(v₁) &lt; p(v₂) &lt; ⋯ &lt; p(v_k) &lt; p(v₁)，自相矛盾 ✗</text>
    <text x="84" y="552" fill="#7a2828" font-weight="bold">结论：T 可行 ⇔ T ⊇ R（"xx" 型字母）且 G−T 是 DAG</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="60" y="584" width="840" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="608" font-size="12" font-weight="bold" fill="#2b2b2b">算法骨架（n ≤ 16 个字母）</text>
  <text x="80" y="628" font-size="11" fill="#444">位运算预处理每个子集是否为 DAG → 枚举 T ⊇ R → 取最小 |T| = k → 所有大小为 k 的可行 T 各输出一个频率向量</text>
</svg>
