<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DP：dp[i][j] = 到达 (i,j) 的最小代价（含入场费）</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">转移时把「上一格的等待费」加进去</text>
  <rect x="40" y="58" width="520" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="85.0" font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">dp[i][j] = (i+1)(j+1) + min( g[i-1][j], g[i][j-1] )</text>
  <rect x="40" y="120" width="250" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="165.0" y="140.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">g[p] = dp[p] + waitCost[p]</text>
  <text x="165.0" y="162.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">（p 不是起点时）</text>
  <text x="165.0" y="184.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">g[起点] = dp[起点] = 1</text>
  <rect x="310" y="120" width="250" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="435.0" y="140.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">含义：在 p 处必须原地等一拍</text>
  <text x="435.0" y="162.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">才能继续移动</text>
  <text x="435.0" y="184.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">起点例外（第 1 秒就走）</text>
  <rect x="40" y="218" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="240.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">边界：dp[0][0] = 1；第一行/列只能从唯一方向转移过来</text>
  <text x="300.0" y="260.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">答案：dp[m-1][n-1]（终点不再等待）</text>
  <text x="40" y="306" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">m*n &lt;= 1e5，一维/二维 DP 都行；用 long long 存代价</text>
  <text x="40" y="330" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">注意 m 或 n 可以到 1e5，但 m*n 有限，按行滚动可以省空间</text>
</svg>
