<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：旋转只有 4 种状态，转满一圈回到自己</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 0° grid (original) -->
  <text x="116" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">0°（原样）</text>
  <g filter="url(#sk)">
    <rect x="80" y="90" width="36" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="116" y="90" width="36" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="80" y="126" width="36" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="116" y="126" width="36" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="98" y="113" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="134" y="113" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="98" y="149" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="134" y="149" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- 90° grid -->
  <text x="296" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">转 1 次（90°）</text>
  <g filter="url(#sk)">
    <rect x="260" y="90" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="296" y="90" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="260" y="126" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="296" y="126" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="278" y="113" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="314" y="113" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="278" y="149" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="314" y="149" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- 180° grid -->
  <text x="296" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">转 2 次（180°）</text>
  <g filter="url(#sk)">
    <rect x="260" y="246" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="296" y="246" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="260" y="282" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="296" y="282" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="278" y="269" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="314" y="269" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="278" y="305" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="314" y="305" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- 270° grid -->
  <text x="116" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">转 3 次（270°）</text>
  <g filter="url(#sk)">
    <rect x="80" y="246" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="116" y="246" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="80" y="282" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="116" y="282" width="36" height="36" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="98" y="269" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="134" y="269" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="98" y="305" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="134" y="305" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- cycle arrows -->
  <g filter="url(#sk)">
    <path d="M 158 118 Q 208 104 252 118" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 168 Q 314 206 300 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 252 304 Q 208 318 158 304" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 76 240 Q 62 206 76 168" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="205" y="99" text-anchor="middle" font-size="10" fill="#888">×90°</text>
  <text x="322" y="207" text-anchor="middle" font-size="10" fill="#888">×90°</text>
  <text x="205" y="322" text-anchor="middle" font-size="10" fill="#888">×90°</text>
  <text x="53" y="207" text-anchor="middle" font-size="10" fill="#888">×90°</text>
  <text x="188" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">连转 4 次</text>
  <text x="188" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">回到原样</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="380" y="330" width="252" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="506" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">new[i][j] = old[n−1−j][i]</text>
  <text x="506" y="371" text-anchor="middle" font-size="10.5" fill="#555">口诀：原第 j 列「站起来」变成新第 j 行</text>
  <text x="506" y="383" text-anchor="middle" font-size="10.5" fill="#555">该列最底部的元素排到最左边</text>

  <!-- observation boxes -->
  <g filter="url(#sk)">
    <rect x="388" y="66" width="244" height="80" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="510" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">观察① 周期 = 4</text>
  <text x="510" y="108" text-anchor="middle" font-size="11" fill="#444">连续转 4 次 90° = 转 360° = 复原</text>
  <text x="510" y="126" text-anchor="middle" font-size="11" fill="#444">⇒ 旋转能产生的状态至多 4 种</text>
  <text x="510" y="140" text-anchor="middle" font-size="10" fill="#888">枚举有尽头，循环不会无家可归</text>

  <g filter="url(#sk)">
    <rect x="388" y="158" width="244" height="80" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="510" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察② 逐一枚举比较</text>
  <text x="510" y="200" text-anchor="middle" font-size="11" fill="#444">0° / 90° / 180° / 270° 依次与</text>
  <text x="510" y="218" text-anchor="middle" font-size="11" fill="#444">target 逐元素比较，任一相等即 true</text>
  <text x="510" y="232" text-anchor="middle" font-size="10" fill="#888">4 种全不中才返回 false</text>

  <g filter="url(#sk)">
    <rect x="388" y="250" width="244" height="70" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="510" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">观察③ 计数不变（粗筛）</text>
  <text x="510" y="290" text-anchor="middle" font-size="11" fill="#444">旋转只搬位置、不改数值</text>
  <text x="510" y="308" text-anchor="middle" font-size="11" fill="#444">⇒ 1 的个数不同可直接 false</text>
</svg>
