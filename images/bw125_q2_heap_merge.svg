<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="336" fill="#fafafa"/>
<text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">每次弹出堆顶两个最小值 a ≤ b，合并成 2a + b 再压回</text>
<ellipse cx="150" cy="82" rx="24" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="150" y="87" text-anchor="middle" font-size="16" fill="#26343f" font-weight="normal" filter="url(#roughs)">2</text>
<ellipse cx="92" cy="168" rx="22" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="92" y="173" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">5</text>
<ellipse cx="214" cy="168" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="214" y="173" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">9</text>
<ellipse cx="52" cy="250" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="52" y="255" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">12</text>
<ellipse cx="134" cy="250" rx="20" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="134" y="255" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">20</text>
<path d="M140,100 L104,148" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M164,100 L202,148" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M84,186 L62,232" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M104,184 L126,232" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<text x="150" y="296" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">小根堆：堆顶就是当前最小值</text>
<text x="150" y="316" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="normal" filter="url(#roughs)">橙色的 2 与 5 被弹出</text>
<rect x="288" y="60" width="248" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="412" y="82" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">a ← 弹出堆顶（最小）</text>
<text x="412" y="102" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">b ← 再弹出一次（次小）</text>
<rect x="288" y="128" width="248" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="412" y="150" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">新值 = min·2 + max</text>
<text x="412" y="170" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">即 2a + b（因 a ≤ b）</text>
<rect x="288" y="196" width="248" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="412" y="218" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">2a + b &amp;gt; b ≥ a：合并不缩小</text>
<text x="412" y="238" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">压回堆，元素个数 −1</text>
<path d="M412,250 L412,274" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
<rect x="300" y="276" width="224" height="46" rx="9" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="412" y="304" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#roughs)">最多 n − 1 步（长度减到 1）</text>
</svg>
