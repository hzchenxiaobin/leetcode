<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：word = "abcdeafdef"</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">绿色 = 被收割的两个子串</text>
  <rect x="40" y="66" width="60" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70.0" y="83.5" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="100" y="66" width="110" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155.0" y="83.5" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">字符</text>
  <rect x="210" y="66" width="90" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255.0" y="83.5" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">first[c]</text>
  <rect x="300" y="66" width="120" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360.0" y="83.5" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="420" y="66" width="140" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490.0" y="83.5" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="40" y="93" width="60" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="110.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="100" y="93" width="110" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="110.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">a</text>
  <rect x="210" y="93" width="90" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255.0" y="110.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-</text>
  <rect x="300" y="93" width="120" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="110.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">首次出现</text>
  <rect x="420" y="93" width="140" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="110.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">first[a]=0</text>
  <rect x="40" y="120" width="60" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="137.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1..4</text>
  <rect x="100" y="120" width="110" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="137.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">b,c,d,e</text>
  <rect x="210" y="120" width="90" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255.0" y="137.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-</text>
  <rect x="300" y="120" width="120" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="137.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">首次出现</text>
  <rect x="420" y="120" width="140" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="137.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">记录 1,2,3,4</text>
  <rect x="40" y="147" width="60" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="164.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="100" y="147" width="110" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="164.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">a</text>
  <rect x="210" y="147" width="90" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255.0" y="164.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="147" width="120" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="164.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">5-0 = 5 ≥ 3</text>
  <rect x="420" y="147" width="140" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="164.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">ans=1，清空 first</text>
  <rect x="40" y="174" width="60" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="191.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">6,7,8</text>
  <rect x="100" y="174" width="110" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="191.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">f,d,e</text>
  <rect x="210" y="174" width="90" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255.0" y="191.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-</text>
  <rect x="300" y="174" width="120" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="191.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">首次出现</text>
  <rect x="420" y="174" width="140" height="27" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="191.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">记录 6,7,8</text>
  <rect x="40" y="201" width="60" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70.0" y="218.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="100" y="201" width="110" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="218.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">f</text>
  <rect x="210" y="201" width="90" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255.0" y="218.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="300" y="201" width="120" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="218.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">9-6 = 3 ≥ 3</text>
  <rect x="420" y="201" width="140" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="218.5" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">ans=2，清空 first</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">答案 2："abcdea" 与 "fdef"；示例 2 的 "bcdaaaab" 中 "aaaa" 只算 1 段</text>
</svg>
