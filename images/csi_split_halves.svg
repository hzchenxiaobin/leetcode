<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">对称整数 = 前半数字和 == 后半数字和（2n 位）</text>

  <!-- 1221 对称 -->
  <text x="60" y="72" font-size="12" fill="#4a7a3a" font-weight="bold">1221（4 位）✓</text>
  <rect x="60" y="84" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="77" y="106" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="94" y="84" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="111" y="106" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="140" y="84" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="157" y="106" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="174" y="84" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="191" y="106" text-anchor="middle" font-size="14" fill="#333">1</text>
  <path d="M 77 128 L 77 140" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 191 128 L 191 140" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="52" y="148" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="77" y="164" text-anchor="middle" font-size="12" fill="#333">1+2=3</text>
  <rect x="166" y="148" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="191" y="164" text-anchor="middle" font-size="12" fill="#333">2+1=3</text>
  <text x="134" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">=</text>

  <!-- 1200 不对称 -->
  <text x="60" y="216" font-size="12" fill="#b85450" font-weight="bold">1200（4 位）✗</text>
  <rect x="60" y="228" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="250" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="94" y="228" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="250" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="140" y="228" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="250" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="174" y="228" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="250" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="52" y="292" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="77" y="308" text-anchor="middle" font-size="12" fill="#333">1+2=3</text>
  <rect x="166" y="292" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="191" y="308" text-anchor="middle" font-size="12" fill="#333">0+0=0</text>
  <text x="134" y="308" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">≠</text>

  <!-- 右侧排除说明 -->
  <rect x="290" y="84" width="240" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="110" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">奇数位数 → 直接排除</text>
  <rect x="316" y="122" width="34" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="333" y="144" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="362" y="144" font-size="11" fill="#888">1 位 ✗</text>
  <rect x="420" y="122" width="86" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="463" y="144" text-anchor="middle" font-size="14" fill="#333">1 2 1</text>
  <text x="410" y="178" text-anchor="middle" font-size="11" fill="#888">3 位 ✗、10000（5 位）✗</text>

  <rect x="290" y="228" width="240" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="254" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10^4 内只需关心</text>
  <text x="410" y="276" text-anchor="middle" font-size="12" fill="#333">2 位：11, 22, …, 99（9 个）</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#333">4 位：如 1203, 1212, 1221, 1230</text>
</svg>
