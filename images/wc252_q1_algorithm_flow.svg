<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：两道关卡 —— 判完全平方 → 判根是质数</text>
  <path d="M 190 40 Q 370 50 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- gate labels -->
  <text x="320" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a14">第一关 · 完全平方</text>
  <text x="521" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">第二关 · 根是质数</text>

  <!-- main line -->
  <g filter="url(#sk)"><rect x="24" y="108" width="80" height="44" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="64" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">输入 n</text>
  <text x="64" y="143" text-anchor="middle" font-size="9.5" fill="#446688">1 ≤ n ≤ 10⁴</text>

  <path d="M 104 130 L 126 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="128" y="108" width="112" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="184" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">k = ⌊√n⌋</text>

  <path d="M 240 130 L 264 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="320,94 372,130 320,166 268,130" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="320" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">k² = n ?</text>
  <text x="320" y="143" text-anchor="middle" font-size="9.5" fill="#a06a14">(完全平方)</text>

  <path d="M 372 130 L 398 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="385" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <g filter="url(#sk)"><polygon points="454,94 506,130 454,166 402,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="454" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">k ≥ 2 ?</text>
  <text x="454" y="143" text-anchor="middle" font-size="9.5" fill="#4a7a3a">(n = 1 ?)</text>

  <path d="M 506 130 L 532 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="519" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <g filter="url(#sk)"><polygon points="588,94 640,130 588,166 536,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="588" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">∃ i | k ?</text>
  <text x="588" y="143" text-anchor="middle" font-size="9" fill="#4a7a3a">i ∈ [2, ⌊√k⌋]</text>

  <path d="M 640 130 L 662 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="651" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>

  <g filter="url(#sk)"><rect x="664" y="106" width="70" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="699" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">return</text>
  <text x="699" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">true</text>

  <!-- No branches -->
  <path d="M 320 166 L 320 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="232" text-anchor="start" font-size="11" fill="#b85450">否</text>

  <path d="M 454 166 L 454 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="464" y="232" text-anchor="start" font-size="11" fill="#b85450">否（n = 1）</text>

  <path d="M 588 166 L 588 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="598" y="232" text-anchor="start" font-size="11" fill="#b85450">是（合数）</text>

  <g filter="url(#sk)"><rect x="257" y="288" width="126" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">return false</text>
  <text x="320" y="330" text-anchor="middle" font-size="10" fill="#8a3a36">非平方 → 偶数个 ≠ 3</text>

  <g filter="url(#sk)"><rect x="391" y="288" width="126" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="454" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">return false</text>
  <text x="454" y="330" text-anchor="middle" font-size="10" fill="#8a3a36">n = 1：仅 1 个除数</text>

  <g filter="url(#sk)"><rect x="525" y="288" width="126" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="588" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">return false</text>
  <text x="588" y="330" text-anchor="middle" font-size="10" fill="#8a3a36">根合数 → ≥ 4 个</text>

  <!-- complexity strip -->
  <g filter="url(#sk)"><rect x="24" y="356" width="710" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="379" y="378" text-anchor="middle" font-size="11.5" fill="#2c4a6e">n ≤ 10⁴ ⟹ k ≤ 100 ⟹ 试除至多 9 次（i = 2…10）· 总复杂度 O(n^(1/4))</text>
</svg>
