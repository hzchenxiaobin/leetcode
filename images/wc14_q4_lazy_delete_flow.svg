<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滑动一步：插入 → 延迟删除 → 平衡 → 取中位数</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步只有常数次堆操作，单步均摊 O(log k)</text>

  <rect x="60" y="62" width="440" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="86" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 插入新元素：(nums[i], i) —— 不大于 max(low) 就进 low，否则进 high</text>

  <path d="M 280 100 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="118" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="142" font-size="11" fill="#8a3a36" filter="url(#rough2)">② 过期：若 i ≥ k，把下标 i−k 标记失效（alive[i−k] = false）</text>

  <path d="M 280 156 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="174" width="440" height="50" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="194" font-size="11" fill="#3a4a66" filter="url(#rough2)">③ clean：反复查看两个堆顶，谁是失效下标就弹出谁</text>
  <text x="76" y="212" font-size="10" fill="#777" filter="url(#rough2)">（失效元素可以先留在堆里，不影响有效元素的相对顺序）</text>

  <path d="M 280 224 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="242" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="262" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">④ 规模平衡：让 low 的有效元素数恒为 ⌈k/2⌉</text>
  <text x="76" y="282" font-size="10" fill="#666" filter="url(#rough2)">多了把 low 堆顶搬给 high；少了把 high 堆顶搬回 low（用有效计数 nl，不用物理大小）</text>

  <path d="M 280 294 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="312" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="338" font-size="11" fill="#3a5a30" filter="url(#rough2)">⑤ i ≥ k−1 时：k 奇数取 low 堆顶，k 偶数取两堆顶的平均值</text>

  <rect x="60" y="376" width="440" height="72" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="398" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么按「下标」而不是按「值」记录删除？</text>
  <text x="76" y="418" font-size="10" fill="#666" filter="url(#rough2)">窗口里可能有多个相同值。按值记录待删个数时，删除计数会被另一个堆里</text>
  <text x="76" y="434" font-size="10" fill="#666" filter="url(#rough2)">同值的副本「冒领」，真正失效的那份却留在堆里，之后被当成有效元素 → 答案错。</text>

  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">下标唯一标识一个元素，因此失效标记永不含糊</text>
</svg>
