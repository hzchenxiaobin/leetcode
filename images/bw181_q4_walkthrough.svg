<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：nums = [2,5,8]，三个查询</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">每个查询只关心子数组内的偶数，前缀和 + 二分各 O(log n)</text>
  <rect x="26" y="84" width="88" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70.0" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">query</text>
  <rect x="118" y="84" width="140" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="188.0" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">子数组</text>
  <rect x="262" y="84" width="120" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322.0" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">移除的偶数</text>
  <rect x="386" y="84" width="148" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460.0" y="105" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">剩余序列 / 答案</text>
  <rect x="26" y="118" width="88" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="140" text-anchor="middle" font-size="10.5" fill="#446688">[0,1,2]</text>
  <rect x="118" y="118" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="188.0" y="140" text-anchor="middle" font-size="10" fill="#446688">nums[0..1]=[2,5]</text>
  <rect x="262" y="118" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322.0" y="140" text-anchor="middle" font-size="10" fill="#446688">移除 {2}</text>
  <rect x="386" y="118" width="148" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="460.0" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">剩余 4,6,8,…</text>
  <text x="546" y="158" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="546" y="140" text-anchor="end" font-size="9" fill="#888">ans</text>
  <rect x="26" y="176" width="88" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="198" text-anchor="middle" font-size="10.5" fill="#446688">[1,2,1]</text>
  <rect x="118" y="176" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="188.0" y="198" text-anchor="middle" font-size="10" fill="#446688">nums[1..2]=[5,8]</text>
  <rect x="262" y="176" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322.0" y="198" text-anchor="middle" font-size="10" fill="#446688">移除 {8}</text>
  <rect x="386" y="176" width="148" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="460.0" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">剩余 2,4,6,…</text>
  <text x="546" y="216" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="546" y="198" text-anchor="end" font-size="9" fill="#888">ans</text>
  <rect x="26" y="234" width="88" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="256" text-anchor="middle" font-size="10.5" fill="#446688">[0,2,4]</text>
  <rect x="118" y="234" width="140" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="188.0" y="256" text-anchor="middle" font-size="10" fill="#446688">nums[0..2]=[2,5,8]</text>
  <rect x="262" y="234" width="120" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="322.0" y="256" text-anchor="middle" font-size="10" fill="#446688">移除 {2,8}</text>
  <rect x="386" y="234" width="148" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="460.0" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">剩余 4,6,10,12,…</text>
  <text x="546" y="274" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">12</text>
  <text x="546" y="256" text-anchor="end" font-size="9" fill="#888">ans</text>
  <rect x="26" y="306" width="508" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">k 很大时答案随之增大：k ≤ 1e9、子数组长度 ≤ 1e5 ⇒ 答案 ≤ 2·(1e9 + 1e5)</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">答案为 [6, 2, 12]，与题面一致；注意 k = 1 时也要跳过被移除的最小偶数</text>
</svg>
