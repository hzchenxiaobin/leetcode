<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 346" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="346" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">t = 1 时"两两不同"的容斥：先剔 u，再减同值对</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以"多出的 a 来自左半"为例，右半是 [3,3,4]，取 u = 3</text>

  <rect x="52" y="66" width="456" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">右半非 a 的元素共 ro = 3 个（值 3、3、4），要从中取 2 个</text>
  <text x="280" y="102" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">要求：两个值互不相同，且都不等于左半选出的 u</text>

  <path d="M 280 110 L 280 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="132" width="456" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第一步：剔除所有等于 u 的元素（R_u = 2 个），还剩 1 个</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">可选取法 C(ro − R_u, 2) = C(1, 2) = 0</text>

  <path d="M 280 176 L 280 194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="198" width="456" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第二步：减掉"两元素同值"的取法</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同值对总数 eqR 里，属于 a 的 C(ra,2)、属于 u 的 C(R_u,2) 都不在候选池中</text>

  <rect x="40" y="256" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">V(u) = C(ro − R_u, 2) − [ eqR − C(ra, 2) − C(R_u, 2) ]</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">即"固定 u 之后，右半可选的合法 2 元素方案数"</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：V(3) = 0 − [ 1 − 0 − 1 ] = 0，说明右取 {3,3} 确实不合法</text>
</svg>
