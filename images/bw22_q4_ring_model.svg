<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">关键转化：环上取走一块，相邻两块必被朋友拿走</text>

  <!-- 环示意: 6 块 -->
  <g filter="url(#rough2)">
    <ellipse cx="160" cy="180" rx="105" ry="95" fill="none" stroke="#ccc" stroke-width="1.4" stroke-dasharray="6 5"/>
    <ellipse cx="160" cy="85" rx="26" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <ellipse cx="62" cy="140" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="62" cy="222" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="160" cy="278" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="258" cy="222" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="258" cy="140" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="160" y="90" font-weight="bold" fill="#8a3833">你选的</text>
    <text x="62" y="145">Alice</text>
    <text x="258" y="145">Bob</text>
    <text x="62" y="227">4</text>
    <text x="160" y="283">5</text>
    <text x="258" y="227">6</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="160" y="106">逆时针邻居给 Alice</text>
    <text x="160" y="122">顺时针邻居给 Bob</text>
  </g>

  <!-- 右侧: 链 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="430" y="90" text-anchor="middle">等价链问题（3n 个数）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="340" y="104" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="388" y="104" width="44" height="40" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="436" y="104" width="44" height="40" fill="#eeeeee" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="484" y="104" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="362" y="129">选</text>
    <text x="410" y="129">✗</text>
    <text x="458" y="129">✗</text>
    <text x="506" y="129">选</text>
  </g>
  <text x="430" y="168" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">选中的块互不相邻</text>

  <g filter="url(#rough2)">
    <rect x="340" y="190" width="188" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="434" y="214" text-anchor="middle" font-weight="bold">你能拿到的恰好 n 块</text>
    <text x="434" y="236" text-anchor="middle">（每轮 3 块里你 1 块）</text>
    <text x="434" y="262" text-anchor="middle">且任意两块之间至少</text>
    <text x="434" y="280" text-anchor="middle">隔一个未选块</text>
  </g>

  <path d="M 300 180 C 320 180, 326 150, 336 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="306" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">环上「互不相邻地选 n 个」= 打家劫舍 II 的环处理：枚举首块取/不取</text>
</svg>
