<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：星号应删除左侧「最小字母的最右出现」</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="82" text-anchor="middle" font-size="13" fill="#555">s = "aaba*"：*(4) 左侧的最小字母是 a，下标 0 / 1 / 3 各有一个 —— 删哪一个？</text>

  <g filter="url(#sk)"><rect x="297" y="100" width="58" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="326" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="369" y="100" width="58" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="398" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="441" y="100" width="58" height="58" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="470" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="513" y="100" width="58" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="542" y="138" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="585" y="100" width="58" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="614" y="138" text-anchor="middle" font-size="24" font-weight="bold" fill="#a8781e">*</text>

  <text x="326" y="176" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="398" y="176" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="470" y="176" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="542" y="176" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="614" y="176" text-anchor="middle" font-size="11" fill="#999">4</text>

  <text x="326" y="198" text-anchor="middle" font-size="10.5" fill="#446688">候选</text>
  <text x="398" y="198" text-anchor="middle" font-size="10.5" fill="#446688">候选</text>
  <text x="542" y="198" text-anchor="middle" font-size="10.5" fill="#446688">候选</text>

  <path d="M 614 162 L 614 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="628" y="196" font-size="11.5" fill="#a8781e">必须删掉一个 a（字母没得选）</text>

  <g filter="url(#sk)"><rect x="70" y="228" width="380" height="172" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="260" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓ 贪心：删最右的 a（下标 3）</text>
  <g filter="url(#sk)"><rect x="182" y="276" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="204" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="238" y="276" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="260" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="294" y="276" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="316" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="204" y="332" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="316" y="332" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="260" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">结果 "aab"</text>

  <g filter="url(#sk)"><rect x="490" y="228" width="380" height="172" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="680" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✗ 删最左的 a（下标 0）</text>
  <g filter="url(#sk)"><rect x="602" y="276" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="624" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">b</text>
  <g filter="url(#sk)"><rect x="658" y="276" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="680" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e">a</text>
  <g filter="url(#sk)"><rect x="714" y="276" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="736" y="302" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b4a6e">a</text>
  <text x="624" y="332" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="680" y="332" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="736" y="332" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="680" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">结果 "aba"</text>

  <text x="470" y="434" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">"aab" &lt; "aba"（第 2 位：a &lt; b）—— 删最右的出现，结果字典序更小</text>

  <g filter="url(#sk)"><rect x="70" y="460" width="800" height="212" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/></g>
  <text x="470" y="490" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b4a6e">一般原理：保留靠前的 c 更优（mid 中的字符全部 ≥ c）</text>

  <g filter="url(#sk)"><rect x="110" y="506" width="48" height="40" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="134" y="532" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">c</text>
  <g filter="url(#sk)"><rect x="170" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="194" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <g filter="url(#sk)"><rect x="230" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="254" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <g filter="url(#sk)"><rect x="290" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="314" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <text x="352" y="532" font-size="18" fill="#999">⋯</text>
  <text x="240" y="570" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">c · mid：c 在前 —— 贪心的选择</text>

  <g filter="url(#sk)"><rect x="490" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="514" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <g filter="url(#sk)"><rect x="550" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="574" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <g filter="url(#sk)"><rect x="610" y="506" width="48" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/></g>
  <text x="634" y="531" text-anchor="middle" font-size="12" fill="#666">≥c</text>
  <text x="672" y="532" font-size="18" fill="#999">⋯</text>
  <g filter="url(#sk)"><rect x="722" y="506" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="746" y="532" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450">c</text>
  <text x="640" y="570" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">mid · c：c 在后 —— 保留靠后的 c</text>

  <text x="470" y="598" text-anchor="middle" font-size="11.5" fill="#555">比较 c·Y 与 Y·c：设 Y 中首个 &gt; c 的位置为 t，则前 t 位两边均为 c，第 t 位 c &lt; Y[t]</text>
  <text x="470" y="618" text-anchor="middle" font-size="11.5" fill="#555">（若 Y 全为 c 则两串相等）⟹ c · Y ≤ Y · c ∎</text>

  <g filter="url(#sk)"><rect x="170" y="630" width="600" height="32" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="470" y="651" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">结论：删靠后的 c、把靠前的 c 留给结果 —— 每一步都不亏，贪心成立</text>
</svg>
