<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：time = 2，阈值 time+1 = 3</text>

  <!-- 表头 -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="52">i=0</text><text x="176" y="52">i=1</text><text x="224" y="52">i=2</text>
    <text x="272" y="52">i=3</text><text x="320" y="52">i=4</text><text x="368" y="52">i=5</text><text x="416" y="52">i=6</text>
  </g>

  <!-- security 行 -->
  <text x="38" y="82" font-size="12" fill="#666" filter="url(#rough2)">security</text>
  <g filter="url(#rough2)">
    <rect x="105" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="153" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="201" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="249" y="64" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="297" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="345" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="393" y="64" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="84">5</text><text x="176" y="84">3</text><text x="224" y="84">3</text>
    <text x="272" y="84">3</text><text x="320" y="84">5</text><text x="368" y="84">6</text><text x="416" y="84">2</text>
  </g>

  <!-- left 行 -->
  <text x="48" y="126" font-size="12" fill="#446688" filter="url(#rough2)">left</text>
  <g font-size="13" text-anchor="middle" fill="#2b3d52" filter="url(#rough2)">
    <rect x="105" y="106" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="153" y="106" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="201" y="106" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="249" y="106" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="297" y="106" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="345" y="106" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="393" y="106" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="128" y="126">1</text><text x="176" y="126">2</text><text x="224" y="126">3</text>
    <text x="272" y="126">4</text><text x="320" y="126">1</text><text x="368" y="126">1</text><text x="416" y="126">2</text>
  </g>

  <!-- right 行 -->
  <text x="42" y="170" font-size="12" fill="#4a7a3a" filter="url(#rough2)">right</text>
  <g font-size="13" text-anchor="middle" fill="#2e4d24" filter="url(#rough2)">
    <rect x="105" y="150" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="153" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="201" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="249" y="150" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="297" y="150" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="345" y="150" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="393" y="150" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="128" y="170">1</text><text x="176" y="170">5</text><text x="224" y="170">4</text>
    <text x="272" y="170">3</text><text x="320" y="170">2</text><text x="368" y="170">1</text><text x="416" y="170">1</text>
  </g>

  <!-- 判定行 -->
  <text x="48" y="214" font-size="12" fill="#333" filter="url(#rough2)">合格？</text>
  <g font-size="15" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="214" fill="#b85450">✗</text>
    <text x="176" y="214" fill="#b85450">✗</text>
    <text x="224" y="214" fill="#4a7a3a">✓</text>
    <text x="272" y="214" fill="#4a7a3a">✓</text>
    <text x="320" y="214" fill="#b85450">✗</text>
    <text x="368" y="214" fill="#b85450">✗</text>
    <text x="416" y="214" fill="#b85450">✗</text>
  </g>

  <!-- 图例 -->
  <rect x="105" y="238" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="128" y="250" font-size="11.5" fill="#555" filter="url(#rough2)">≥ 阈值 3</text>
  <rect x="200" y="238" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="223" y="250" font-size="11.5" fill="#555" filter="url(#rough2)">&lt; 阈值 3</text>
  <rect x="295" y="238" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="318" y="250" font-size="11.5" fill="#555" filter="url(#rough2)">谷底区</text>

  <path d="M 224 222 C 224 262, 224 272, 224 284" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 222 C 272 262, 272 272, 272 284" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="290" width="270" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="255" y="312" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">left、right 双双达标的下标 2、3</text>
  <text x="255" y="330" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">即「适合野炊的日子」，答案 [2, 3]</text>
</svg>
