<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">乘法原理：每个"缝隙带"独立选择，方案数连乘</text>

  <!-- 通用带示意：上一段末座位 S ... k 个 P ... 下一段首座位 S -->
  <g filter="url(#rough2)" font-size="12.5" fill="#666">
    <text x="80" y="64">相邻两段交界处：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="76" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="152" y="76" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="194" y="76" width="40" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="268" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="83" y="102">S</text>
    <text x="130" y="102">P</text>
    <text x="172" y="102">P</text>
    <text x="214" y="102">P</text>
    <text x="291" y="102">S</text>
  </g>
  <!-- 可选缝隙 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 110 70 L 110 124" stroke-dasharray="4 3"/>
    <path d="M 152 70 L 152 124" stroke-dasharray="4 3"/>
    <path d="M 194 70 L 194 124" stroke-dasharray="4 3"/>
    <path d="M 236 70 L 236 124" stroke-dasharray="4 3"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <text x="110" y="140">①</text>
    <text x="152" y="140">②</text>
    <text x="194" y="140">③</text>
    <text x="236" y="140">④</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="166">k = 3 个植物 ⇒ k + 1 = 4 个候选缝隙，</text>
    <text x="80" y="186">必须恰好选 1 个放屏风</text>
  </g>

  <!-- 右侧公式 -->
  <g filter="url(#rough2)">
    <rect x="330" y="60" width="200" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="430" y="88">答案 = ∏ (Pₜ + 1)</text>
    <text x="430" y="112">Pₜ = 第 2t 与第 2t+1 个座位</text>
    <text x="430" y="132">之间的植物个数</text>
    <text x="430" y="160">对 10⁹ + 7 取模</text>
  </g>

  <!-- 为什么段内植物无所谓 -->
  <g filter="url(#rough2)">
    <rect x="40" y="210" width="480" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="236" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">为什么段内的植物不参与计数？</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="260">屏风只出现在"缝隙"里；段内部不放假想屏风，</text>
    <text x="280" y="280">否则该段被拆成两个各含 &lt; 2 座位的段，非法</text>
  </g>

  <!-- 为什么恰好一个 -->
  <g filter="url(#rough2)">
    <rect x="40" y="304" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="328">为什么两段之间必须恰放 1 个屏风？0 个 → 两段并成 4 座段 ✗；</text>
    <text x="280" y="348">2 个及以上 → 中间产生 0 座段 ✗（题目要求每段恰有 2 个座位）</text>
  </g>
</svg>
