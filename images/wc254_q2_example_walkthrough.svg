<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="920" height="700" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [6,2,0,9,7]</text>
  <path d="M 270 42 Q 460 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: sort ===== -->
  <text x="70" y="84" font-size="14" font-weight="bold" fill="#2b2b2b">Step 1 升序排序</text>
  <g filter="url(#sk)">
    <rect x="70" y="96" width="52" height="40" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
    <rect x="130" y="96" width="52" height="40" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
    <rect x="190" y="96" width="52" height="40" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
    <rect x="250" y="96" width="52" height="40" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
    <rect x="310" y="96" width="52" height="40" rx="5" fill="#f0f0f0" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="96" y="122" text-anchor="middle" font-size="15" fill="#555">6</text>
  <text x="156" y="122" text-anchor="middle" font-size="15" fill="#555">2</text>
  <text x="216" y="122" text-anchor="middle" font-size="15" fill="#555">0</text>
  <text x="276" y="122" text-anchor="middle" font-size="15" fill="#555">9</text>
  <text x="336" y="122" text-anchor="middle" font-size="15" fill="#555">7</text>

  <path d="M 390 116 L 430 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="104" text-anchor="middle" font-size="11" fill="#888">sort</text>

  <g filter="url(#sk)">
    <rect x="450" y="96" width="52" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="510" y="96" width="52" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="570" y="96" width="52" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="630" y="96" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="690" y="96" width="52" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="476" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">0</text>
  <text x="536" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">2</text>
  <text x="596" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">6</text>
  <text x="656" y="122" text-anchor="middle" font-size="15" fill="#2b6e9e">7</text>
  <text x="716" y="122" text-anchor="middle" font-size="15" fill="#2b6e9e">9</text>
  <path d="M 626 88 L 626 146" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="536" y="154" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">A = [0,2,6]</text>
  <text x="698" y="154" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">B = [7,9]</text>
  <text x="790" y="122" font-size="11" fill="#888">m = ⌈5/2⌉ = 3</text>

  <!-- ===== Step 2: interleave ===== -->
  <text x="70" y="206" font-size="14" font-weight="bold" fill="#2b2b2b">Step 2 奇偶交错填充：res[2k]=A[k]，res[2k+1]=B[k]</text>

  <path d="M 536 160 Q 400 200 226 246" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 596 160 Q 400 210 358 246" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 476 160 Q 340 210 210 246" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 656 160 Q 420 190 282 242" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 716 160 Q 440 175 414 238" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <path d="M 210 316 C 238 316 250 262 278 262 C 306 262 318 316 346 316 C 374 316 386 262 414 262 C 442 262 454 316 482 316"
        stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="182" y="296" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="250" y="242" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="318" y="296" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="386" y="242" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="454" y="296" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="210" y="322" text-anchor="middle" font-size="15" fill="#2e6e2e">0</text>
  <text x="278" y="268" text-anchor="middle" font-size="15" fill="#2b6e9e">7</text>
  <text x="346" y="322" text-anchor="middle" font-size="15" fill="#2e6e2e">2</text>
  <text x="414" y="268" text-anchor="middle" font-size="15" fill="#2b6e9e">9</text>
  <text x="482" y="322" text-anchor="middle" font-size="15" fill="#2e6e2e">6</text>
  <text x="210" y="352" text-anchor="middle" font-size="10" fill="#888">res[0]</text>
  <text x="278" y="352" text-anchor="middle" font-size="10" fill="#888">res[1]</text>
  <text x="346" y="352" text-anchor="middle" font-size="10" fill="#888">res[2]</text>
  <text x="414" y="352" text-anchor="middle" font-size="10" fill="#888">res[3]</text>
  <text x="482" y="352" text-anchor="middle" font-size="10" fill="#888">res[4]</text>
  <text x="560" y="268" font-size="12" fill="#2b6e9e" font-weight="bold">奇数位 ← B（大）</text>
  <text x="560" y="320" font-size="12" fill="#2e6e2e" font-weight="bold">偶数位 ← A（小）</text>

  <!-- ===== Step 3: verify ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="386" width="780" height="230" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="90" y="412" font-size="14" font-weight="bold" fill="#7a5415">Step 3 逐一验证（只需检查内部下标 i = 1, 2, 3）</text>
  <text x="90" y="440" font-size="13" fill="#444" font-family="monospace">i=1: (res[0]+res[2])/2 = (0+2)/2 = 1 ≠ res[1]=7</text>
  <text x="90" y="460" font-size="11" fill="#888">两侧邻居 0、2 都来自 A（小值）→ 均值被压低，远离 7</text>
  <text x="90" y="488" font-size="13" fill="#444" font-family="monospace">i=2: (res[1]+res[3])/2 = (7+9)/2 = 8 ≠ res[2]=2</text>
  <text x="90" y="508" font-size="11" fill="#888">两侧邻居 7、9 都来自 B（大值）→ 均值被抬高，远离 2</text>
  <text x="90" y="536" font-size="13" fill="#444" font-family="monospace">i=3: (res[2]+res[4])/2 = (2+6)/2 = 4 ≠ res[3]=9</text>
  <text x="90" y="556" font-size="11" fill="#888">两侧邻居 2、6 都来自 A（小值）→ 均值被压低，远离 9</text>
  <text x="90" y="590" font-size="13" fill="#2e6e2e" font-weight="bold">返回 [0,7,2,9,6] ✓（与示例输出不同但同样合法，special judge 判定）</text>

  <text x="460" y="656" text-anchor="middle" font-size="11" fill="#888">时间 O(n log n) | 空间 O(n)</text>
</svg>
