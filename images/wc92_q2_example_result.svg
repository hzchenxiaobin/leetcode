<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">示例：最深结点是 7 和 4，它们的最小公共祖先正是结点 2</text>

  <path d="M300,74 L180,144" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M300,74 L420,144" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M180,144 L110,214" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M180,144 L250,214" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M420,144 L380,214" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M420,144 L490,214" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M250,214 L215,284" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M250,214 L300,284" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <circle cx="300" cy="72" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="60" font-size="11" fill="#446688" filter="url(#rough2)">h = 4</text>

  <circle cx="180" cy="142" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="208" y="138" font-size="11" fill="#446688" filter="url(#rough2)">h = 3</text>

  <circle cx="420" cy="142" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="138" font-size="11" fill="#446688" filter="url(#rough2)">h = 2</text>

  <circle cx="110" cy="212" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <circle cx="250" cy="212" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="250" y="217" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="278" y="208" font-size="11" fill="#d6a040" filter="url(#rough2)">h = 2</text>
  <circle cx="380" cy="212" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="490" cy="212" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <circle cx="215" cy="284" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="215" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <circle cx="300" cy="284" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="300" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="240" y="318" font-size="11" fill="#b85450" filter="url(#rough2)">最深结点（深度 3）：7、4</text>

  <rect x="360" y="252" width="255" height="100" rx="9" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376" y="274" font-size="12" fill="#333" filter="url(#rough2)">5：hL = 1 &lt; hR = 2 ⇒ 取右边 (3, 2)</text>
  <text x="376" y="296" font-size="12" fill="#333" filter="url(#rough2)">1：左右都是 1 ⇒ 取自己 (2, 1)</text>
  <text x="376" y="318" font-size="12" fill="#333" filter="url(#rough2)">3：hL = 3 &gt; hR = 2 ⇒ (4, 2)</text>
  <text x="376" y="340" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回结点 2 ⇒ 序列化 [2, 7, 4]</text>

  <text x="24" y="364" font-size="11" fill="#666" filter="url(#rough2)">橙色 = 答案结点；它必须同时「包含所有最深结点」且「子树最小」。</text>
</svg>
