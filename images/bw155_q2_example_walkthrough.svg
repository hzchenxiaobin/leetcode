<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
<text x="260" y="28" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1：沿路径逐层相乘，每一步都取模</text>
<rect x="35" y="76" width="126" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="98" y="104" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0 号单位</text>
<text x="98" y="132" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = 1</text>
<rect x="198" y="76" width="126" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="261" y="104" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1 号单位</text>
<text x="261" y="132" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = 1×2 = 2</text>
<rect x="361" y="76" width="126" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="424" y="104" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2 号单位</text>
<text x="424" y="132" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = 2×3 = 6</text>
<path d="M163,114 L192,114" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="177" y="104" font-size="12" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">×2</text>
<path d="M326,114 L355,114" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="340" y="104" font-size="12" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">×3</text>
<rect x="35" y="178" width="452" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="261" y="200" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">取模法则：(a·b) mod M = ((a mod M)·(b mod M)) mod M</text>
<text x="261" y="220" font-size="12" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">所以边算边取模与先算大整数再取模等价</text>
<text x="260" y="260" font-size="12" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">因子可达 1e9、路径长 1e5，大整数会爆 → 必须取模</text>
<text x="260" y="285" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案是 [1, 2, 6]</text>
</svg>
