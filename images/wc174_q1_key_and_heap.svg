<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">弱序 = 键 (c_i, i) 的字典序；大根堆只留 k 个键最小的行</text>

  <rect x="24" y="46" width="326" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="38" y="70" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">行 i 的排序键：(c_i, i)</text>
  <text x="38" y="94" font-size="10.5" fill="#555" filter="url(#rough2)">c_i 小者更弱；c_i 相同时行号 i 小者更弱</text>
  <text x="38" y="118" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">按 (c_i, i) 升序排 = 从最弱排到最强</text>

  <path d="M 30 158 L 330 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">弱 → 强</text>

  <rect x="26" y="170" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54" y="189" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">(1,2)</text>
  <rect x="88" y="170" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="116" y="189" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(2,0)</text>
  <rect x="150" y="170" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="178" y="189" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(2,3)</text>
  <rect x="212" y="170" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="189" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">(4,1)</text>
  <rect x="274" y="170" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="302" y="189" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">(5,4)</text>

  <text x="54" y="214" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 2</text>
  <text x="116" y="214" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 0</text>
  <text x="178" y="214" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 3</text>
  <text x="240" y="214" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 1</text>
  <text x="302" y="214" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">行 4</text>

  <rect x="24" y="228" width="326" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="250" font-size="11" fill="#8a3a36" filter="url(#rough2)">示例 1 取前 k = 3 个：输出 [2, 0, 3]</text>

  <text x="483" y="60" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">大根堆（容量 k = 3）</text>

  <rect x="445" y="86" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="483" y="106" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(2,3)</text>
  <path d="M 470 116 L 432 156" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 496 116 L 534 156" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="386" y="158" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="424" y="178" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">(2,0)</text>
  <rect x="504" y="158" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="542" y="178" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">(1,2)</text>

  <text x="378" y="216" font-size="10" fill="#555" filter="url(#rough2)">堆顶 = 键最大 = 当前最强</text>
  <text x="378" y="238" font-size="10" fill="#555" filter="url(#rough2)">新行入堆后 size &gt; k 就弹堆顶</text>
  <text x="378" y="260" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留下的一定是键最小的 k 行</text>

  <text x="310" y="310" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">C++ 的 pair&lt;int,int&gt; 与 Python 的 -c、-i 都自带字典序，行号平票的规则免费拿到</text>
  <text x="310" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只用大小为 k 的堆，取前 k 小的代价是 O(m log k)，不必把 m 行全部排序</text>
  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k = m 时堆退化为存下所有行，此时直接排序常数更小</text>
</svg>
