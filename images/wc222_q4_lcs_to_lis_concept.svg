<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="500" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：插入万能 ⇒ 答案 = n − L；target 互异 ⇒ LCS 压成 LIS</text>
  <path d="M 160 34 Q 310 42 460 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- two key boxes -->
  <g filter="url(#r)"><rect x="20" y="46" width="285" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="32" y="66" font-size="12" font-weight="bold" fill="#5a4a1a" filter="url(#r)">转化：插入是万能修补</text>
  <text x="32" y="86" font-size="10.5" fill="#444" filter="url(#r)">插入任意值、任意位置 ⇒ 缺谁补谁、一次一个</text>
  <text x="32" y="104" font-size="10.5" fill="#444" filter="url(#r)">已按 target 顺序出现的元素全部免费保留</text>
  <text x="32" y="122" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">⇒ 最少操作 = n − L，L = LCS(target, arr)</text>

  <g filter="url(#r)"><rect x="315" y="46" width="285" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="327" y="66" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">提速：互异条件压掉一维</text>
  <text x="327" y="86" font-size="10.5" fill="#444" filter="url(#r)">target 互异 ⇒ 值 v ↔ 下标 pos[v] 一一对应</text>
  <text x="327" y="104" font-size="10.5" fill="#444" filter="url(#r)">arr 投影成下标序列 s（不在 target 的丢弃）</text>
  <text x="327" y="122" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#r)">公共子序列 ⇔ s 的严格上升子序列 ⇒ L = LIS(s)</text>

  <!-- example projection -->
  <text x="20" y="152" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">示例 2 的投影：target = [6,4,8,1,3,2]，arr = [4,7,6,2,3,8,6,1]</text>

  <!-- target row -->
  <g filter="url(#r)"><rect x="24" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="50" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">6</text>
  <g filter="url(#r)"><rect x="80" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="106" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="136" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="162" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">8</text>
  <g filter="url(#r)"><rect x="192" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="218" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">1</text>
  <g filter="url(#r)"><rect x="248" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="274" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">3</text>
  <g filter="url(#r)"><rect x="304" y="160" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="330" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2</text>
  <text x="372" y="172" font-size="10" fill="#999" filter="url(#r)">← target（互异，</text>
  <text x="372" y="188" font-size="10" fill="#999" filter="url(#r)">下标即 pos[v]）</text>
  <text x="50" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">0</text>
  <text x="106" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">1</text>
  <text x="162" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">2</text>
  <text x="218" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">3</text>
  <text x="274" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">4</text>
  <text x="330" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">5</text>

  <!-- arr row -->
  <g filter="url(#r)"><rect x="24" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="47" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="70" y="224" width="46" height="32" rx="4" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="93" y="245" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#r)">7</text>
  <g filter="url(#r)"><rect x="116" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="139" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">6</text>
  <g filter="url(#r)"><rect x="162" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="185" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="208" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="231" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">3</text>
  <g filter="url(#r)"><rect x="254" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="277" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">8</text>
  <g filter="url(#r)"><rect x="300" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="323" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">6</text>
  <g filter="url(#r)"><rect x="346" y="224" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="369" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">1</text>
  <text x="404" y="236" font-size="10" fill="#999" filter="url(#r)">← arr（可重复）</text>
  <text x="404" y="252" font-size="10" fill="#999" filter="url(#r)">7 不在 target → 丢弃</text>

  <!-- mapped indices -->
  <text x="47" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">1</text>
  <text x="93" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#r)">✗</text>
  <text x="139" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">0</text>
  <text x="185" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">5</text>
  <text x="231" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">4</text>
  <text x="277" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">2</text>
  <text x="323" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">0</text>
  <text x="369" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b0722a" filter="url(#r)">3</text>
  <text x="404" y="274" font-size="10" fill="#999" filter="url(#r)">映射成 pos 下标</text>

  <!-- arrows down to s -->
  <path d="M 47 279 L 47 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 139 279 L 139 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 185 279 L 185 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 231 279 L 231 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 277 279 L 277 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 323 279 L 323 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <path d="M 369 279 L 369 292" stroke="#b0722a" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>

  <!-- s row -->
  <g filter="url(#r)"><rect x="24" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="47" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>
  <g filter="url(#r)"><rect x="116" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="139" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="162" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="185" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">5</text>
  <g filter="url(#r)"><rect x="208" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="231" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">4</text>
  <g filter="url(#r)"><rect x="254" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="277" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">2</text>
  <g filter="url(#r)"><rect x="300" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="323" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">0</text>
  <g filter="url(#r)"><rect x="346" y="296" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="369" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
  <text x="24" y="352" font-size="11" fill="#4a7a3a" filter="url(#r)">s = [1, 0, 5, 4, 2, 0, 3]（重复的 6 → 0 出现两次，无妨）</text>
  <text x="404" y="311" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">LIS(s) = 3</text>
  <text x="404" y="327" font-size="10" fill="#4a7a3a" filter="url(#r)">（如 0, 2, 3）</text>

  <!-- insight box -->
  <g filter="url(#r)"><rect x="20" y="366" width="580" height="76" rx="8" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="36" y="388" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">两把钥匙：① 答案 = n − LCS；② 互异 ⇒ LCS = LIS(s)</text>
  <text x="36" y="410" font-size="11.5" fill="#444" filter="url(#r)">O(nm) 的二维匹配被压成 O(m log n) 的一维序关系，10⁵ 规模轻松通过</text>
  <text x="36" y="430" font-size="11" fill="#b85450" filter="url(#r)">⚠ 若 target 含重复元素，「值 ↔ 下标」不再是单射，归约失效</text>

  <!-- formula strip -->
  <g filter="url(#r)"><rect x="130" y="454" width="360" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="310" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">答案 = n − LIS(s)，示例 2：6 − 3 = 3</text>
</svg>
