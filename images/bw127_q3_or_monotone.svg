<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">或值的单调性：窗口收缩只会「清位」，数值不会变大</text>

  <g filter="url(#rough2)">
    <rect x="50" y="70" width="130" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="215" y="70" width="130" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="380" y="70" width="130" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="115" y="94">[2,1,8]</text><text x="115" y="112">1011 = 11</text>
    <text x="280" y="94">[1,8]</text><text x="280" y="112">1001 = 9</text>
    <text x="445" y="94">[8]</text><text x="445" y="112">1000 = 8</text>
  </g>
  <path d="M 184 96 L 207 96" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 349 96 L 372 96" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="86" font-size="10" fill="#8a2b26" text-anchor="middle" filter="url(#rough2)">移出 2</text>
  <text x="361" y="86" font-size="10" fill="#8a2b26" text-anchor="middle" filter="url(#rough2)">移出 1</text>

  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">11 ≥ 9 ≥ 8：左端点右移时，或值单调不增</text>

  <rect x="50" y="168" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">⇒「越短越小」有单调性，可以用双指针 + 每位出现次数维护窗口或值</text>

  <rect x="50" y="216" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">但双指针要维护 30 个位的计数；本文用「不同或值集合」更直接</text>

  <rect x="50" y="264" width="460" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">两种写法复杂度同为 O(n log V)，都能过 2 × 10⁵ 的数据</text>
</svg>
