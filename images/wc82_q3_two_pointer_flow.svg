<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次预处理 + 一趟双指针</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">瓶颈是两次排序；回答部分对每个工人均摊 O(1)</text>

  <rect x="22" y="64" width="270" height="300" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="157" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">预处理 O(n log n + m log m)</text>

  <rect x="38" y="96" width="238" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="157" y="117" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 工作按 difficulty 升序排序</text>
  <text x="157" y="133" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">排序后收益随难度不再是单调的</text>

  <path d="M 157 144 L 157 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="38" y="158" width="238" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="157" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 一趟扫描压出前缀最大收益</text>
  <text x="157" y="195" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">p[i] = max(p[i], p[i−1])</text>

  <path d="M 157 206 L 157 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="38" y="220" width="238" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="157" y="241" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 工人按能力 worker 升序排序</text>
  <text x="157" y="257" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">能力递增 ⇒ 解锁集合只增不减</text>

  <rect x="38" y="284" width="238" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="157" y="304" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">预处理后，台阶表已就绪：</text>
  <text x="157" y="321" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">best(difficulty[i]) 就是能力上限的答案</text>
  <text x="157" y="338" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">后面只需顺序扫描，不再回头</text>

  <path d="M 294 214 L 310 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="312" y="64" width="226" height="300" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="425" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">回答：逐工人累加</text>

  <rect x="326" y="96" width="198" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="425" y="119" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j = 0，best = 0</text>

  <path d="M 425 134 L 425 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="326" y="148" width="198" height="62" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="425" y="168" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">while j &lt; n 且 diff[j] ≤ w：</text>
  <text x="425" y="186" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">best = max(best, p[j])；j += 1</text>
  <text x="425" y="202" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">j 只前进，绝不回退</text>

  <path d="M 425 212 L 425 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="326" y="226" width="198" height="38" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="425" y="250" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += best</text>

  <path d="M 524 246 L 532 246 L 532 178 L 526 178" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="290" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">循环直到所有工人处理完</text>
  <text x="425" y="308" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">每人取当前 best，工作可重复做</text>

  <rect x="22" y="382" width="516" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="403" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">返回 ans：总时间 O(n log n + m log m)，额外空间 O(n)（存放排序后的工作对）</text>
  <text x="42" y="421" font-size="10.5" fill="#555" filter="url(#rough2)">替代实现：工人不排序，改为在难度数组上二分最后一个 ≤ w 的位置，O(m log n)</text>
</svg>
