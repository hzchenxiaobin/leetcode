<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：逐个数 → 逐个数位追加</text>

  <!-- nums 数组 -->
  <text x="120" y="68" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">nums</text>
  <g filter="url(#rough2)">
    <rect x="36" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="96" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="156" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#2d4a66" text-anchor="middle" font-weight="bold">
    <text x="66" y="106">13</text><text x="126" y="106">25</text>
    <text x="186" y="106">83</text><text x="246" y="106">77</text>
  </g>

  <!-- 循环框 -->
  <path d="M 276 100 C 320 100, 330 100, 366 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 74 C 360 56, 300 56, 276 74" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="6 4"/>
  <text x="330" y="48" font-size="12" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle">for x in nums（保持原顺序）</text>

  <!-- 字符串展开 -->
  <rect x="370" y="80" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="106" text-anchor="middle" font-size="14" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">to_string(x)</text>

  <!-- answer 拼接 -->
  <text x="120" y="188" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">answer（不断变长）</text>
  <g filter="url(#rough2)">
    <rect x="36" y="200" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="66" y="200" width="30" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="96" y="200" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="126" y="200" width="30" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="156" y="200" width="30" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="186" y="200" width="30" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="200" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="246" y="200" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="51" y="224">1</text><text x="81" y="224">3</text>
    <text x="111" y="224">2</text><text x="141" y="224">5</text>
    <text x="171" y="224">8</text><text x="201" y="224">3</text>
    <text x="231" y="224">7</text><text x="261" y="224">7</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="81" y="196">13</text><text x="141" y="196">25</text>
    <text x="201" y="196">83</text><text x="261" y="196">77</text>
  </g>

  <!-- 追加箭头 -->
  <path d="M 445 124 C 445 160, 300 170, 240 192" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="168" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">push_back(c − '0')</text>

  <!-- 提示框 -->
  <rect x="60" y="272" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">不要去重、不要排序——[7,7] 的两个 7 都要保留</text>

  <rect x="60" y="324" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案长度 = 各数位数之和，reserve(n×6) 一次够用</text>
</svg>
