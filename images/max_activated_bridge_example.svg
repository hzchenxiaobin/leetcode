<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 3：新点的 x 挂到块 A、y 挂到块 B</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="70" text-anchor="middle" font-size="12" fill="#666">points = [[2,3],[2,2],[1,1],[4,5]] → 三个连通块：A(2点)、B(1点)、C(1点)</text>

  <!-- ===== bipartite graph ===== -->
  <!-- X nodes -->
  <g filter="url(#sk)"><rect x="185" y="120" width="72" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="221" y="142" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">x=2</text>

  <g filter="url(#sk)"><rect x="185" y="290" width="72" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="221" y="312" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">x=1</text>

  <g filter="url(#sk)"><rect x="185" y="450" width="72" height="34" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="221" y="472" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">x=4</text>

  <!-- Y nodes -->
  <g filter="url(#sk)"><rect x="660" y="95" width="72" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="696" y="117" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">y=3</text>

  <g filter="url(#sk)"><rect x="660" y="175" width="72" height="34" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="696" y="197" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">y=2</text>

  <g filter="url(#sk)"><rect x="660" y="290" width="72" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="696" y="312" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">y=1</text>

  <g filter="url(#sk)"><rect x="660" y="450" width="72" height="34" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="696" y="472" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">y=5</text>

  <!-- edges: comp A blue -->
  <path d="M 257 140 Q 460 105 660 112" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="455" y="103" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">(2,3)</text>
  <path d="M 257 145 Q 460 175 660 190" stroke="#4a8edb" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="455" y="172" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">(2,2)</text>

  <!-- edge: comp B green -->
  <path d="M 257 308 Q 460 315 660 308" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="455" y="302" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">(1,1)</text>

  <!-- edge: comp C orange -->
  <path d="M 257 468 Q 460 470 660 468" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="455" y="462" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">(4,5)</text>

  <!-- new point -->
  <g filter="url(#sk)"><circle cx="330" cy="255" r="26" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
  <text x="330" y="252" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">新点</text>
  <text x="330" y="266" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">(2,1)</text>

  <!-- dashed red links: x → X=2, y → Y=1 -->
  <path d="M 310 235 Q 265 195 240 158" stroke="#b03a3a" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="272" y="196" font-size="10" fill="#b03a3a" font-weight="bold">x=2 接块 A</text>
  <path d="M 356 264 Q 520 285 655 303" stroke="#b03a3a" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="512" y="280" font-size="10" fill="#b03a3a" font-weight="bold">y=1 接块 B</text>

  <!-- comp labels -->
  <g filter="url(#sk)"><rect x="60" y="165" width="100" height="26" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="110" y="183" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">块 A：2 点</text>
  <g filter="url(#sk)"><rect x="60" y="330" width="100" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="110" y="348" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">块 B：1 点</text>
  <g filter="url(#sk)"><rect x="60" y="490" width="100" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="110" y="508" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">块 C：1 点</text>

  <!-- ===== Bottom: computation ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="540" width="500" height="80" rx="8" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="566" font-size="13" font-weight="bold" fill="#b03a3a">本例答案</text>
  <text x="80" y="590" font-size="13" fill="#444" font-weight="bold">块 A (2) + 块 B (1) + 新点 (1) = 4</text>
  <text x="80" y="608" font-size="10" fill="#888">块 C 被舍弃：新点只有 2 个坐标，至多桥接 2 个块</text>

  <g filter="url(#sk)">
    <rect x="590" y="540" width="290" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="610" y="566" font-size="13" font-weight="bold" fill="#2b6e9e">一般结论</text>
  <text x="610" y="590" font-size="13" fill="#444" font-weight="bold">答案 = top1 + top2 + 1</text>
  <text x="610" y="608" font-size="10" fill="#888">（仅 1 个连通块时 = n + 1）</text>
</svg>
