<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">可行项数是一段连续区间：[popcount(S), S]</text>
  <path d="M 160 44 Q 320 52 480 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="36" y="58" width="290" height="352" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="181" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">以 S = 9 = 1001<tspan dy="4" font-size="9">2</tspan><tspan dy="-4"> 为例</tspan></text>

  <g filter="url(#sk)">
    <rect x="56" y="98" width="250" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="181" y="122" text-anchor="middle" font-size="12.5" fill="#2b6e9e">8 + 1　（2 项 = popcount）</text>
  <path d="M 181 136 L 181 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="228" y="148" text-anchor="middle" font-size="11" fill="#8a6415">分裂 8</text>

  <g filter="url(#sk)">
    <rect x="56" y="156" width="250" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="181" y="180" text-anchor="middle" font-size="12.5" fill="#8a6415">4 + 4 + 1　（3 项）</text>
  <path d="M 181 194 L 181 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="228" y="206" text-anchor="middle" font-size="11" fill="#8a6415">分裂 4</text>

  <g filter="url(#sk)">
    <rect x="56" y="214" width="250" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="181" y="238" text-anchor="middle" font-size="12.5" fill="#8a6415">4 + 2 + 2 + 1　（4 项）</text>
  <path d="M 181 252 L 181 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="264" text-anchor="middle" font-size="11" fill="#8a6415">⋯ 继续分裂</text>

  <g filter="url(#sk)">
    <rect x="56" y="272" width="250" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="181" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">1 + 1 + … + 1　（9 项 = S）</text>

  <text x="181" y="330" text-anchor="middle" font-size="11" fill="#555555">每次分裂：2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> → 2</tspan><tspan dy="-5" font-size="9">i−1</tspan><tspan dy="5"> + 2</tspan><tspan dy="-5" font-size="9">i−1</tspan></text>
  <text x="181" y="348" text-anchor="middle" font-size="11" fill="#555555">项数 +1，总和不变，幂只减不增</text>
  <text x="181" y="366" text-anchor="middle" font-size="11" fill="#555555">→ 项数能取遍 2, 3, …, 9 每个整数</text>
  <text x="181" y="390" text-anchor="middle" font-size="10.5" fill="#b85450">少于 2 项不可能：进位只合并不拆分</text>

  <g filter="url(#sk)">
    <rect x="344" y="58" width="260" height="210" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="474" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">项数 c 的可行范围</text>

  <g filter="url(#sk)">
    <rect x="356" y="126" width="24" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="380" y="126" width="140" height="26" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="520" y="126" width="72" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="450" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">可行</text>

  <g filter="url(#sk)">
    <path d="M 391 152 L 391 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 408 152 L 408 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 425 152 L 425 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 443 152 L 443 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 460 152 L 460 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 478 152 L 478 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 495 152 L 495 158" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 513 152 L 513 158" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="368" y="172" text-anchor="middle" font-size="10" fill="#555555">1</text>
  <text x="391" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">2</text>
  <text x="408" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">3</text>
  <text x="425" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">4</text>
  <text x="443" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">5</text>
  <text x="460" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">6</text>
  <text x="478" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">7</text>
  <text x="495" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">8</text>
  <text x="513" y="172" text-anchor="middle" font-size="10" fill="#2e6e2e">9</text>
  <text x="556" y="172" text-anchor="middle" font-size="10" fill="#555555">10, 11, …</text>

  <text x="372" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">c &lt; 2：项太少</text>
  <text x="372" y="212" text-anchor="middle" font-size="10" fill="#b85450">置位不够分</text>
  <text x="556" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">c &gt; 9：项太多</text>
  <text x="556" y="212" text-anchor="middle" font-size="10" fill="#b85450">每项 ≥ 1，和 ≥ c</text>
  <text x="474" y="244" text-anchor="middle" font-size="11" fill="#555555">S 取其他值时同理：可行区间 [popcount(S), S]</text>

  <g filter="url(#sk)">
    <rect x="344" y="282" width="260" height="68" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="474" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">k 可行 ⇔</text>
  <text x="474" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">popcount(S) ≤ k ≤ S</text>
  <text x="474" y="346" text-anchor="middle" font-size="11" fill="#555555">其中 S = num1 − k · num2</text>

  <g filter="url(#sk)">
    <rect x="344" y="362" width="260" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="474" y="384" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">本题 k ≤ 64 时 S &lt; 2<tspan dy="-5" font-size="9">37</tspan></text>
  <text x="474" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">最高位 ≤ 36 &lt; 60：i 的上界碰不到</text>

  <g filter="url(#sk)">
    <rect x="344" y="432" width="260" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="474" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">于是「S = 恰好 k 个 2 的幂」</text>
  <text x="474" y="468" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">的判定只剩两个不等式</text>
</svg>
