<svg xmlns="http://www.w3.org/2000/svg" width="640" height="570" viewBox="0 0 640 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="570" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：从每个起点沿平方链走查</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="505" y="60" width="115" height="36" rx="18" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="562" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06b1a">return ans</text>

  <!-- A: count -->
  <g filter="url(#sk)">
    <rect x="170" y="48" width="300" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5d85">哈希表统计每个值 v 的次数 cnt[v]</text>
  <path d="M 320 82 L 320 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B: special case x = 1 -->
  <g filter="url(#sk)">
    <rect x="140" y="104" width="360" height="48" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="320" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4480">特判 x = 1：候选 = c₁（奇数个）或 c₁ − 1（偶数个）</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#5a4480">1 的平方还是 1（自环），走链会死循环，必须跳过</text>
  <path d="M 320 152 L 320 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C: more keys? -->
  <g filter="url(#sk)">
    <path d="M 320 172 L 430 208 L 320 244 L 210 208 Z" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">还有未走查的</text>
  <text x="320" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">键 x ≥ 2 ？</text>
  <path d="M 430 208 L 562 208 L 562 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="200" font-size="11" fill="#888">否</text>
  <path d="M 320 244 L 320 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="328" y="258" font-size="11" fill="#888">是</text>

  <!-- D: init -->
  <g filter="url(#sk)">
    <rect x="240" y="264" width="160" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5d85">len = 0；cur = x</text>
  <path d="M 320 294 L 320 312" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- E: cur in table? -->
  <g filter="url(#sk)">
    <path d="M 320 314 L 410 350 L 320 386 L 230 350 Z" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cur 在表中？</text>
  <path d="M 320 386 L 320 404" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="328" y="400" font-size="11" fill="#888">是</text>

  <!-- E-no: chain broken, red box left of E -->
  <g filter="url(#sk)">
    <rect x="25" y="314" width="160" height="76" rx="8" fill="#fce8ec" stroke="#b8546a" stroke-width="1.5"/>
  </g>
  <text x="105" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a5a">len −= 1（链断）</text>
  <text x="105" y="354" text-anchor="middle" font-size="11" fill="#a04a5a">上一元素刚才按</text>
  <text x="105" y="370" text-anchor="middle" font-size="11" fill="#a04a5a">2 份算，改作峰值</text>
  <text x="105" y="384" text-anchor="middle" font-size="11" fill="#a04a5a">计入 ans</text>
  <path d="M 230 350 L 185 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="208" y="342" font-size="11" fill="#888">否</text>
  <path d="M 105 314 L 105 208 L 206 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- F: cnt >= 2 ? -->
  <g filter="url(#sk)">
    <path d="M 320 406 L 415 442 L 320 478 L 225 442 Z" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="447" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt[cur] ≥ 2 ？</text>

  <!-- F-yes: extend, green box right -->
  <path d="M 415 442 L 456 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="434" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="459" y="414" width="156" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="537" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">len += 2</text>
  <text x="537" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cur = cur × cur</text>
  <text x="537" y="468" text-anchor="middle" font-size="10" fill="#4a7a3a">（值平方增长，链长 ≤ 5）</text>
  <path d="M 615 442 L 628 442 L 628 350 L 413 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- F-no: peak, orange box left -->
  <g filter="url(#sk)">
    <rect x="25" y="430" width="160" height="64" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="105" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06b1a">len += 1</text>
  <text x="105" y="470" text-anchor="middle" font-size="11" fill="#a06b1a">cnt = 1 只能当峰值</text>
  <text x="105" y="486" text-anchor="middle" font-size="11" fill="#a06b1a">计入 ans</text>
  <path d="M 225 442 L 185 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="205" y="434" font-size="11" fill="#c98a2b" font-weight="bold">否</text>
  <path d="M 25 462 L 12 462 L 12 188 L 262 188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- footer note -->
  <g filter="url(#sk)">
    <rect x="40" y="516" width="560" height="34" rx="8" fill="#fdf6e8" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="538" text-anchor="middle" font-size="11" fill="#8a6a1a">C++ 注意：cur × cur 最大 10¹⁸，必须用 long long；且只有 cur 在表中（≤ 10⁹）时才会平方</text>
</svg>
