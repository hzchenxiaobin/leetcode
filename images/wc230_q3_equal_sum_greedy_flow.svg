<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建桶 → 从 g=5 到 g=1 榨取</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="56" width="240" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">① 求和 s₁, s₂；若 s₁ &gt; s₂ 就交换</text>
  <text x="320" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">统一成 s₁ ≤ s₂（小的抬，大的压）</text>

  <path d="M 320 100 L 320 112" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 320 112 L 452 140 L 320 168 L 188 140 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">diff = s₂ − s₁ 等于 0 ？</text>

  <path d="M 452 140 L 492 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="466" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="492" y="126" width="120" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="552" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回 0</text>

  <path d="M 320 168 L 320 196" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="332" y="186" font-size="10" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="180" y="196" width="280" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">② 建桶：小和数组元素 x → cnt[6−x]++</text>
  <text x="320" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">大和数组元素 y → cnt[y−1]++</text>

  <path d="M 320 240 L 320 272" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="272" width="300" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">③ g 从 5 递减到 1：use = min(cnt[g], ⌈diff/g⌉)</text>
  <text x="320" y="309" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">ans += use；diff −= use × g</text>
  <path d="M 470 284 C 508 276 508 308 474 304" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="508" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">g−−</text>

  <text x="88" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">⌈ ⌉ 为上取整：</text>
  <text x="88" y="306" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">本档够用就不动更小的档</text>

  <path d="M 320 320 L 320 346" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 320 346 L 445 372 L 320 398 L 195 372 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="377" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">diff ≤ 0 ？</text>

  <path d="M 445 372 L 488 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="464" y="360" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">是（凑够了）</text>
  <g filter="url(#sk)">
    <rect x="488" y="358" width="116" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="546" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回 ans</text>

  <path d="M 195 372 L 152 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="172" y="360" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#sk)">否（榨干）</text>
  <g filter="url(#sk)">
    <rect x="36" y="358" width="116" height="28" rx="8" fill="#fdf2f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="94" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">返回 −1</text>

  <text x="552" y="212" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值域只有 1..6</text>
  <text x="552" y="228" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">→ O(n+m) 一遍建桶</text>
</svg>
