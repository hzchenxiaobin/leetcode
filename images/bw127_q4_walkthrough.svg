<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：[1,2,3,4]，k = 3 —— 两种视角对账</text>

  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">逐个枚举（4 个长度 3 的子序列）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="230" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="102" width="230" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="134" width="230" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="166" width="230" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="50" y="89">{1,2,3}：min(1, 2, 1) = 1</text>
    <text x="50" y="121">{1,2,4}：min(1, 3, 2) = 1</text>
    <text x="50" y="153">{1,3,4}：min(2, 3, 1) = 1</text>
    <text x="50" y="185">{2,3,4}：min(1, 2, 1) = 1</text>
  </g>

  <text x="300" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">按阈值汇总</text>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="300" y="70" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="370" y="70" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="440" y="70" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="335" y="88">d</text><text x="405" y="88">count ≥ d</text><text x="480" y="88">贡献</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="98" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="98" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="440" y="98" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="300" y="130" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="130" width="70" height="28" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="440" y="130" width="80" height="28" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="300" y="162" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="370" y="162" width="70" height="28" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
    <rect x="440" y="162" width="80" height="28" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="335" y="117">1</text><text x="405" y="117">4</text><text x="480" y="117">1 × 4</text>
    <text x="335" y="149">2</text><text x="405" y="149">0</text><text x="480" y="149">1 × 0</text>
    <text x="335" y="181">3</text><text x="405" y="181">0</text><text x="480" y="181">1 × 0</text>
  </g>
  <text x="300" y="208" font-size="11" fill="#888" filter="url(#rough2)">宽度一律为 d_t − d_(t−1) = 1</text>

  <rect x="40" y="222" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">4 + 0 + 0 = 4，与逐个枚举的 1 + 1 + 1 + 1 一致</text>
  <rect x="40" y="266" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">d = 2、3 的 count 为 0：任意 3 个数的差都凑不出 2（值域太密）</text>
  <rect x="40" y="310" width="480" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">因此实现里只需在「存在的差值」处求 count，不必扫全部 d</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">差值集合大小 ≤ n(n−1)/2 = 1225，逐阈值跑一遍 DP 足够快</text>
</svg>
