<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">流程：一条公式四项，全程 64 位整数</text>

  <rect x="40" y="60" width="480" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">ans = C2(n+2) − 3·C2(n−limit+1)</text>
  <text x="280" y="108" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">+ 3·C2(n−2·limit) − C2(n−3·limit−1)</text>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">C2(v) = v &lt; 2 ? 0 : v(v−1)/2</text>

  <path d="M 280 130 Q 280 150 280 166" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="168" width="380" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">四个下标逐项核对（t = limit+1）</text>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">n−t+2 / n−2t+2 / n−3t+2 的化简结果</text>

  <path d="M 280 224 Q 280 244 280 258" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="260" width="300" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">返回 ans（long long，无需取模）</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">上界 ≈ 5×10¹¹ &lt; 2⁶³，天然安全</text>
</svg>
