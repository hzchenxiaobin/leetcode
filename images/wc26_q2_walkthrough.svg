<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：谁被包含，谁就是「不特殊」的</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只要存在一个 j ≠ i 使 t ⊆ strs[j]，这个 t 就被覆盖</text>

  <text x="32" y="74" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① strs = ["aba", "cdc", "eae"]</text>

  <g filter="url(#rough2)">
    <rect x="32" y="82" width="536" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="62" y="97" text-anchor="middle" font-size="10" fill="#3a4a66">i</text>
    <text x="130" y="97" text-anchor="middle" font-size="10" fill="#3a4a66">t = strs[i]</text>
    <text x="330" y="97" text-anchor="middle" font-size="10" fill="#3a4a66">与其余串比较</text>
    <text x="452" y="97" text-anchor="middle" font-size="10" fill="#3a4a66">被包含？</text>
    <text x="536" y="97" text-anchor="middle" font-size="10" fill="#3a4a66">候选</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="104" width="536" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="123" text-anchor="middle" font-size="10" fill="#555">0</text>
    <text x="130" y="123" text-anchor="middle" font-size="10.5" fill="#333">"aba"</text>
    <text x="176" y="123" font-size="9.5" fill="#555">"cdc" ✗</text>
    <text x="256" y="123" font-size="9.5" fill="#555">"eae" ✗</text>
    <text x="452" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
    <text x="536" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="132" width="536" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="151" text-anchor="middle" font-size="10" fill="#555">1</text>
    <text x="130" y="151" text-anchor="middle" font-size="10.5" fill="#333">"cdc"</text>
    <text x="176" y="151" font-size="9.5" fill="#555">"aba" ✗</text>
    <text x="256" y="151" font-size="9.5" fill="#555">"eae" ✗</text>
    <text x="452" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
    <text x="536" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="160" width="536" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="179" text-anchor="middle" font-size="10" fill="#555">2</text>
    <text x="130" y="179" text-anchor="middle" font-size="10.5" fill="#333">"eae"</text>
    <text x="176" y="179" font-size="9.5" fill="#555">"aba" ✗</text>
    <text x="256" y="179" font-size="9.5" fill="#555">"cdc" ✗</text>
    <text x="452" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
    <text x="536" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  </g>

  <text x="32" y="207" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">三个串互不为子序列 → best = max(3, 3, 3) = 3</text>

  <text x="32" y="240" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② strs = ["aaa", "aaa", "aa"]</text>

  <g filter="url(#rough2)">
    <rect x="32" y="248" width="536" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="62" y="263" text-anchor="middle" font-size="10" fill="#8a3a36">i</text>
    <text x="130" y="263" text-anchor="middle" font-size="10" fill="#8a3a36">t = strs[i]</text>
    <text x="330" y="263" text-anchor="middle" font-size="10" fill="#8a3a36">与其余串比较</text>
    <text x="452" y="263" text-anchor="middle" font-size="10" fill="#8a3a36">被包含？</text>
    <text x="536" y="263" text-anchor="middle" font-size="10" fill="#8a3a36">候选</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="270" width="536" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="289" text-anchor="middle" font-size="10" fill="#555">0</text>
    <text x="130" y="289" text-anchor="middle" font-size="10.5" fill="#333">"aaa"</text>
    <text x="176" y="289" font-size="9.5" fill="#8a3a36">与 i=1 的 "aaa" 完全相同</text>
    <text x="452" y="289" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <text x="536" y="289" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="298" width="536" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="317" text-anchor="middle" font-size="10" fill="#555">1</text>
    <text x="130" y="317" text-anchor="middle" font-size="10.5" fill="#333">"aaa"</text>
    <text x="176" y="317" font-size="9.5" fill="#8a3a36">与 i=0 的 "aaa" 完全相同</text>
    <text x="452" y="317" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <text x="536" y="317" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="326" width="536" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="62" y="345" text-anchor="middle" font-size="10" fill="#555">2</text>
    <text x="130" y="345" text-anchor="middle" font-size="10.5" fill="#333">"aa"</text>
    <text x="176" y="345" font-size="9.5" fill="#8a3a36">"aaa" 删掉 1 个 a 就是 "aa"</text>
    <text x="452" y="345" text-anchor="middle" font-size="10" fill="#b85450">是</text>
    <text x="536" y="345" text-anchor="middle" font-size="11" fill="#b85450">—</text>
  </g>

  <text x="32" y="374" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">全部被覆盖 → 不存在特殊序列 → 返回 −1</text>

  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 i = j 时必须跳过自比较，否则任何串都会「包含自己」而全部被判否</text>
</svg>
