<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#446688"/>
    </marker>
    <marker id="ao" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#d6a040"/>
    </marker>
    <marker id="ar" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">贪心分段：全部历史被压缩成一个状态</text>
  <path d="M 150 42 Q 260 49 370 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="70" y="92" font-size="11" fill="#446688" filter="url(#sk)">当前段窗口</text>
  <rect x="140" y="66" width="44" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="184" y="66" width="44" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="228" y="66" width="44" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="272" y="66" width="44" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="316" y="66" width="44" height="40" rx="5" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#sk)"/>
  <text x="162" y="91" text-anchor="middle" font-size="15" fill="#33506e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="206" y="91" text-anchor="middle" font-size="15" fill="#33506e" font-weight="bold" filter="url(#sk)">c</text>
  <text x="250" y="91" text-anchor="middle" font-size="15" fill="#666" filter="url(#sk)">c</text>
  <text x="294" y="91" text-anchor="middle" font-size="15" fill="#666" filter="url(#sk)">c</text>
  <text x="338" y="91" text-anchor="middle" font-size="15" fill="#666" filter="url(#sk)">a</text>
  <text x="162" y="122" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">0</text>
  <text x="206" y="122" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">1</text>
  <text x="250" y="122" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">2</text>
  <text x="294" y="122" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">3</text>
  <text x="338" y="122" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">4</text>

  <rect x="132" y="58" width="100" height="56" rx="9" fill="none" stroke="#446688" stroke-width="2.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <path d="M 250 50 L 250 62" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="42" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">i</text>

  <path d="M 260 130 C 210 150 180 160 150 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 300 130 C 350 150 380 160 405 168" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <text x="70" y="182" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">mask：当前段已收集的字符</text>
  <rect x="90" y="196" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="118" y="196" width="24" height="24" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="146" y="196" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="174" y="196" width="24" height="24" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>
  <rect x="202" y="196" width="24" height="24" rx="4" fill="#f3f3f3" stroke="#bbb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="102" y="212" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="158" y="212" text-anchor="middle" font-size="11" fill="#33506e" font-weight="bold" filter="url(#sk)">c</text>
  <text x="238" y="212" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">…</text>
  <text x="90" y="244" font-size="10.5" fill="#666" filter="url(#sk)">26 个比特位，a、c 两位亮</text>
  <text x="90" y="262" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#sk)">⇒ |mask| = 2 = k，已满</text>

  <rect x="330" y="188" width="150" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="405" y="212" text-anchor="middle" font-size="12.5" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">修改权 ×1（未用）</text>
  <text x="405" y="232" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#sk)">用掉后 changed = 1</text>

  <rect x="55" y="300" width="410" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="260" y="326" text-anchor="middle" font-size="13" fill="#2f5a25" font-weight="bold" filter="url(#sk)">走到位置 i 时，影响未来的只有 (i, mask, changed)</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">段从哪里开始、之前切了几段、段内字符顺序 —— 统统无关</text>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">这就是记忆化搜索的状态设计依据</text>
</svg>
