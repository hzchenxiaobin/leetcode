<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 525"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="525" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">算法流程：一侧建结构，另一侧查询</text>
  <path d="M 210 42 Q 360 50 510 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Phase 1: build ===== -->
  <g filter="url(#rough2)">
    <rect x="70" y="58" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="190" y="80" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">阶段一 · 建表（arr1）</text>

  <g filter="url(#rough2)">
    <rect x="105" y="112" width="170" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="137" text-anchor="middle" font-size="13" fill="#333">对每个 x ∈ arr1</text>

  <g filter="url(#rough2)">
    <path d="M 190 152 L 190 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="75" y="172" width="230" height="78" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">while x ≠ 0:</text>
  <text x="190" y="218" text-anchor="middle" font-size="12" fill="#555">· 前缀 x 入集合 / Trie 插入</text>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#555">· x ← ⌊x / 10⌋</text>

  <g filter="url(#rough2)">
    <path d="M 190 250 L 190 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="85" y="270" width="210" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="190" y="294" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">⚠ 0 作终止哨兵：</text>
  <text x="190" y="314" text-anchor="middle" font-size="12" fill="#7a5415">不是前缀、不入结构</text>

  <g filter="url(#rough2)">
    <rect x="85" y="350" width="210" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="190" y="374" text-anchor="middle" font-size="12" fill="#446688">10⁸ 只有 9 位 →</text>
  <text x="190" y="394" text-anchor="middle" font-size="12" fill="#446688">每个数至多 9 个前缀</text>

  <!-- middle arrow -->
  <g filter="url(#rough2)">
    <path d="M 316 150 L 428 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="372" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">建表完成</text>

  <!-- ===== Phase 2: probe ===== -->
  <g filter="url(#rough2)">
    <rect x="420" y="58" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="540" y="80" text-anchor="middle" font-size="14" fill="#2e4a66" font-weight="bold">阶段二 · 探测（arr2）</text>

  <g filter="url(#rough2)">
    <rect x="455" y="112" width="170" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="540" y="137" text-anchor="middle" font-size="13" fill="#333">对每个 y ∈ arr2</text>

  <g filter="url(#rough2)">
    <path d="M 540 152 L 540 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="425" y="172" width="230" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="540" y="194" text-anchor="middle" font-size="12" fill="#333">从最长前缀（y 本身）开始</text>
  <text x="540" y="214" text-anchor="middle" font-size="12" fill="#333">逐个查集合</text>

  <g filter="url(#rough2)">
    <path d="M 540 224 L 540 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <polygon points="540,246 612,274 540,302 468,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="540" y="279" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">命中？</text>

  <!-- no branch: loop back -->
  <g filter="url(#rough2)">
    <path d="M 468 274 C 422 274, 422 205, 428 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)"/>
  </g>
  <text x="414" y="242" text-anchor="end" font-size="11" fill="#a05a20" font-weight="bold">否 · 去掉末位再查</text>
  <text x="414" y="260" text-anchor="end" font-size="11" fill="#a05a20">折到 0 仍无 → 贡献 0</text>

  <!-- yes branch -->
  <g filter="url(#rough2)">
    <path d="M 540 302 L 540 324" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  </g>
  <text x="556" y="317" font-size="12" fill="#4a7a3a" font-weight="bold">是 ✓</text>

  <g filter="url(#rough2)">
    <rect x="445" y="326" width="190" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="540" y="350" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">ans ← max(ans, 位数)</text>
  <text x="540" y="372" text-anchor="middle" font-size="12" fill="#2e5b22">立即换下一个 y</text>

  <g filter="url(#rough2)">
    <path d="M 540 384 L 540 404" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="435" y="406" width="210" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="540" y="429" text-anchor="middle" font-size="13" fill="#2e5b22" font-weight="bold">返回 ans（初值 0）</text>

  <!-- bottom tip -->
  <g filter="url(#rough2)">
    <rect x="60" y="458" width="600" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="360" y="480" text-anchor="middle" font-size="12" fill="#7a5415">💡 Trie 版：查询沿数字位下走，走不动即停——</text>
  <text x="360" y="500" text-anchor="middle" font-size="12" fill="#7a5415">停留深度就是最长命中，无需「从长到短枚举 + break」</text>
</svg>
