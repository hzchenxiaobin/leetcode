<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：窗口的 m 个数按值切成三段，mid 段增量维护和</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">示例 m＝9, k＝2：窗口升序排列后，删去最小 2 个与最大 2 个，只对中间 5 个求平均</text>

  <text x="103" y="86" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">lo：最小 k 个（删）</text>
  <text x="320" y="86" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">mid：保留 m−2k 个（求和目标）</text>
  <text x="534" y="86" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">hi：最大 k 个（删）</text>

  <g filter="url(#sk)">
    <rect x="44" y="94" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="106" y="94" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="168" y="94" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="230" y="94" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="292" y="94" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="354" y="94" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="416" y="94" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="478" y="94" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="540" y="94" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="72" y="115" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="134" y="115" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="196" y="115" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="258" y="115" text-anchor="middle" font-size="14" fill="#333">9</text>
  <text x="320" y="115" text-anchor="middle" font-size="14" fill="#333">12</text>
  <text x="382" y="115" text-anchor="middle" font-size="14" fill="#333">15</text>
  <text x="444" y="115" text-anchor="middle" font-size="14" fill="#333">20</text>
  <text x="506" y="115" text-anchor="middle" font-size="14" fill="#333">25</text>
  <text x="568" y="115" text-anchor="middle" font-size="14" fill="#333">30</text>

  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#666">三段各维护成一个有序多重集合（multiset / SortedList）：O(log m) 插入、删除、取端点</text>

  <g filter="url(#sk)">
    <rect x="36" y="166" width="168" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="238" y="166" width="164" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="436" y="166" width="168" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="120" y="188" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">lo（multiset）</text>
  <text x="120" y="210" text-anchor="middle" font-size="11.5" fill="#8f3830">大小至多 k（满窗后恒为 k）</text>
  <text x="120" y="228" text-anchor="middle" font-size="11.5" fill="#8f3830">只关心端点 max(lo)</text>
  <text x="120" y="246" text-anchor="middle" font-size="11.5" fill="#8f3830">预热期：优先无条件填它</text>
  <text x="320" y="188" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">mid（multiset）</text>
  <text x="320" y="210" text-anchor="middle" font-size="11.5" fill="#2e5a24">满窗后大小 m−2k</text>
  <text x="320" y="228" text-anchor="middle" font-size="11.5" fill="#2e5a24">插入/删除时同步 mid_sum</text>
  <text x="320" y="246" text-anchor="middle" font-size="11.5" fill="#2e5a24">＝ 查询的直接答案</text>
  <text x="520" y="188" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">hi（multiset）</text>
  <text x="520" y="210" text-anchor="middle" font-size="11.5" fill="#8a6415">大小至多 k（满窗后恒为 k）</text>
  <text x="520" y="228" text-anchor="middle" font-size="11.5" fill="#8a6415">只关心端点 min(hi)</text>
  <text x="520" y="246" text-anchor="middle" font-size="11.5" fill="#8a6415">预热期：无条件填充它</text>

  <path d="M 208 216 L 234 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 406 216 L 432 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="221" y="206" text-anchor="middle" font-size="11" fill="#666">≤</text>
  <text x="419" y="206" text-anchor="middle" font-size="11" fill="#666">≤</text>

  <g filter="url(#sk)">
    <rect x="20" y="278" width="600" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="295" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">不变量：max(lo) ≤ min(mid) ≤ max(mid) ≤ min(hi) —— 桶内各自有序，桶间值域不重叠</text>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#8a6415">mid 恰为「排序后删去两端 k 个」的中间段，无需每次重新排序</text>

  <g filter="url(#sk)">
    <rect x="20" y="330" width="600" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#33517a" font-weight="bold">队列 q 按到达顺序保存窗口：|q| ＞ m 时队首 old 出队，按值定位所在桶删除（必要时从 mid 借端点补回）</text>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#33517a">堆不支持 O(log m) 删除任意元素 → 必须用有序多重集合（而非对顶堆）</text>

  <g filter="url(#sk)">
    <rect x="20" y="382" width="600" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="400" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">查询 O(1)：⌊ mid_sum / (m − 2k) ⌋ ；插入/淘汰 O(log m)</text>
  <text x="320" y="416" text-anchor="middle" font-size="11.5" fill="#2e5a24">核心：把「每次查询重新排序 O(m log m)」均摊成「每次操作 O(log m) 的桶间搬运」</text>
</svg>
