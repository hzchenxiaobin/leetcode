<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：有合法分割取最小差，否则返回 −1</text>

  <!-- 左半：[1,3,2] -->
  <text x="170" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">nums = [1,3,2]（total = 6）</text>
  <rect x="76" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="128" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="152" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="180" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">2</text>

  <text x="60" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">i</text>
  <text x="110" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">left</text>
  <text x="175" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">right</text>
  <text x="240" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">有效？</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">|差|</text>
  <path d="M 40 142 L 322 142" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="110" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="175" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,2]</text>
  <text x="240" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="300" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <path d="M 40 174 L 322 174" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <rect x="42" y="176" width="280" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
  <text x="60" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="110" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="175" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="240" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="300" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M 40 200 L 322 200" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="170" y="224" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两个分割点均有效，|4 − 2| = 2 最小 → 答案 2</text>

  <!-- 分隔线 -->
  <path d="M 336 56 L 336 260" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 右半：[3,1,2] -->
  <text x="490" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">nums = [3,1,2]（total = 6）</text>
  <rect x="396" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="448" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="472" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="500" y="70" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="524" y="94" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">2</text>

  <text x="380" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">i</text>
  <text x="430" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">left</text>
  <text x="495" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">right</text>
  <text x="560" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">有效？</text>
  <path d="M 360 142 L 600 142" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <text x="380" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="495" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="560" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M 360 174 L 600 174" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="380" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,1]</text>
  <text x="495" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="560" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M 360 200 L 600 200" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="490" y="224" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i=0：1 &lt; 2，right 不严格递减</text>
  <text x="490" y="242" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i=1：3 &gt; 1，left 不严格递增</text>
  <text x="490" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">无合法分割 → 返回 −1</text>

  <!-- 底部要点框 -->
  <rect x="40" y="290" width="560" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">每个分割点的合法性与差值都能 O(1) 得到：</text>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">合法性 = incOK（前缀标记）且 dec[i+1]（后缀标记）</text>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">差值 = |leftSum − (total − leftSum)| = |2·leftSum − total|</text>
  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">枚举全部 n−1 个分割点，总计时间 O(n)</text>
</svg>
