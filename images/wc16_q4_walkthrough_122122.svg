<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：area = 122122</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">349² = 121801 &lt; 122122 &lt; 350² = 122500，故从 w = 349 开始向左扫</text>

  <text x="140" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="300" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">122122 mod w</text>
  <text x="440" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">是否整除</text>
  <path d="M 62 90 L 498 90" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="140" y="114" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">349</text>
  <text x="300" y="114" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">321</text>
  <text x="440" y="114" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">348</text>
  <text x="300" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">322</text>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">347</text>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">325</text>
  <text x="440" y="170" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <text x="140" y="200" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">⋮</text>
  <text x="300" y="200" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">⋮</text>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">一直否</text>

  <text x="140" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">287</text>
  <text x="300" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">147</text>
  <text x="440" y="230" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="60" y="243" width="440" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="262" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">286</text>
  <text x="300" y="262" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="440" y="262" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是 ← 命中</text>

  <path d="M 470 292 L 152 292" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="286" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">w 每次减 1，共检查 349 − 286 + 1 = 64 个候选</text>

  <rect x="100" y="308" width="360" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">W = 286 ⇒ L = 122122 / 286 = 427</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">返回 [427, 286]，差值 141，是所有合法方案中的最小值</text>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">122122 = 2 × 7 × 11 × 13 × 61，≤ √area 的最大约数正是 2 × 11 × 13 = 286</text>
</svg>
