<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="412" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：每步比较「整个剩余后缀」，后缀大者取首字符</text>

  <!-- 当前状态：两个剩余后缀 -->
  <text x="40" y="56" font-size="11" font-weight="bold" fill="#446688">A = word1[i:]</text>
  <g filter="url(#sk)">
    <rect x="40" y="62" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="63" y="62" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="86" y="62" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="109" y="62" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="62" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="50" y="79" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <text x="73" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="96" y="79" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <text x="119" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="142" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="218" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#666">vs</text>
  <text x="285" y="56" font-size="11" font-weight="bold" fill="#4a7a3a">B = word2[j:]</text>
  <g filter="url(#sk)">
    <rect x="285" y="62" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="308" y="62" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="331" y="62" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="354" y="62" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="377" y="62" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="295" y="79" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <text x="318" y="79" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <text x="341" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="364" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="387" y="79" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="425" y="68" font-size="10.5" fill="#555">后缀 = 从指针到串尾的全部字符</text>
  <text x="425" y="84" font-size="10.5" fill="#555">比较的是两个整串，不只是当前一位</text>

  <!-- 汇聚到判断 -->
  <g filter="url(#sk)">
    <path d="M 96 90 L 312 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 341 90 L 368 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <polygon points="340,116 404,142 340,168 276,142" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">A ≥ B ?</text>

  <g filter="url(#sk)">
    <path d="M 312 164 L 228 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 368 164 L 452 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <rect x="105" y="186" width="200" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="375" y="186" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="205" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">A ≥ B → 取 A 的首字符</text>
  <text x="475" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">A &lt; B → 取 B 的首字符</text>

  <!-- 三种命中情形 -->
  <g filter="url(#sk)">
    <rect x="30" y="244" width="200" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="244" width="200" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="450" y="244" width="200" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="130" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5e9e">① 首字符不等</text>
  <text x="130" y="290" text-anchor="middle" font-size="10.5" fill="#444">一位定胜负</text>
  <text x="130" y="308" text-anchor="middle" font-size="10.5" fill="#444">'c' &gt; 'b' → 取 'c'</text>
  <text x="130" y="326" text-anchor="middle" font-size="10.5" fill="#444">比较 1 步就结束</text>
  <text x="340" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">② 首字符相等</text>
  <text x="340" y="290" text-anchor="middle" font-size="10.5" fill="#444">必须比后继字符</text>
  <text x="340" y="308" text-anchor="middle" font-size="10.5" fill="#444">"aa" vs "ab"：比到第 2 位</text>
  <text x="340" y="326" text-anchor="middle" font-size="10.5" fill="#444">可能一路比到串尾</text>
  <text x="550" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">③ 一方先耗尽（真前缀）</text>
  <text x="550" y="290" text-anchor="middle" font-size="10.5" fill="#444">短的是真前缀 → 更小</text>
  <text x="550" y="308" text-anchor="middle" font-size="10.5" fill="#444">"aa" &lt; "aaa" → 取 B</text>
  <text x="550" y="326" text-anchor="middle" font-size="10.5" fill="#444">比较必须支持到耗尽</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="30" y="354" width="620" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="340" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">一句话策略：每步取 max(word1[i:], word2[j:]) 的首字符，相等任取</text>
  <text x="340" y="392" text-anchor="middle" font-size="10.5" fill="#555">三种命中统一为「后缀大者先出字符」——并列时后缀大的一方前景更好（证明见 §5）</text>
</svg>
