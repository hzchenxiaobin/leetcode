<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">余数类划分：按 (i mod s, j mod s) 涂色</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">示例：3×3 矩阵，s = 2，共 s² = 4 个余数类</text>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="76" y="72">j=0</text><text x="124" y="72">j=1</text><text x="172" y="72">j=2</text>
    <text x="52" y="102">i=0</text><text x="52" y="148">i=1</text><text x="52" y="194">i=2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="64" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="80" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="64" y="126" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="110" y="126" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="156" y="126" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="64" y="172" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="172" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="172" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold">
    <text x="86" y="106" fill="#3a4a66">(0,0)</text><text x="132" y="106" fill="#3a5a30">(0,1)</text><text x="178" y="106" fill="#3a4a66">(0,0)</text>
    <text x="86" y="152" fill="#8a6a20">(1,0)</text><text x="132" y="152" fill="#8a3a36">(1,1)</text><text x="178" y="152" fill="#8a6a20">(1,0)</text>
    <text x="86" y="198" fill="#3a4a66">(0,0)</text><text x="132" y="198" fill="#3a5a30">(0,1)</text><text x="178" y="198" fill="#3a4a66">(0,0)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 62 224 L 62 234 L 202 234 L 202 224" stroke="#446688" stroke-width="1.4" fill="none"/>
  </g>
  <text x="132" y="250" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4 个角同属类 (0,0) —— 「边角放 1」的周期网格</text>

  <rect x="250" y="80" width="286" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="393" y="102" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">类大小 = 行数 × 列数</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="393" y="124">R₀ = ⌈3/2⌉ = 2（行 0、2）　R₁ = 1（行 1）</text>
    <text x="393" y="142">C₀ = 2（列 0、2）　C₁ = 1（列 1）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="266" y="156" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="396" y="156" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="266" y="192" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="396" y="192" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="326" y="176" fill="#3a4a66">类 (0,0)：2×2 = 4</text>
    <text x="456" y="176" fill="#3a5a30">类 (0,1)：2×1 = 2</text>
    <text x="326" y="212" fill="#8a6a20">类 (1,0)：1×2 = 2</text>
    <text x="456" y="212" fill="#8a3a36">类 (1,1)：1×1 = 1</text>
  </g>

  <rect x="40" y="268" width="496" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="288" y="290" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">Rᵣ = ⌈(H−r)/s⌉，C_c = ⌈(W−c)/s⌉</text>
  <text x="288" y="308" text-anchor="middle" font-size="10.5" fill="#555">约束 s ≤ min(W,H) 保证每个 r、c 都至少对应一行 / 一列，无需特判</text>
  <text x="288" y="324" text-anchor="middle" font-size="10.5" fill="#555">「边角」余数（r、c 小）行 / 列更多，类更大 —— 贪心优先选它们</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999">s = 1 时只有 1 个类（大小 W×H）；maxOnes = s² 时全选，答案 = W×H</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999">maxOnes = 0 时一个类都不选，答案 = 0（矩阵全 0）</text>
</svg>
