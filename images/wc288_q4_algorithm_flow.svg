<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="690" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：枚举划分点 k（不完善花园数）</text>
  <path d="M 150 38 Q 320 48 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- B1 -->
  <g filter="url(#sk2)">
    <rect x="170" y="58" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-size="12" fill="#2b4a6e">① 封顶 min(v, target) → 排序 → 前缀和 pref</text>
  <path d="M 320 100 L 320 122" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B2 -->
  <g filter="url(#sk2)">
    <rect x="170" y="122" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#2b4a6e">② k = n，completeCost = 0，ans = 0</text>
  <path d="M 320 164 L 320 182" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1: k >= 0 ? -->
  <g filter="url(#sk2)">
    <polygon points="240,212 320,182 400,212 320,242" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">k ≥ 0 ?</text>
  <path d="M 400 212 L 476 212" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="204" font-size="11" fill="#888">否</text>
  <g filter="url(#sk2)">
    <rect x="476" y="192" width="112" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="532" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">返回 ans</text>

  <path d="M 320 242 L 320 266" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="260" font-size="11" fill="#888">是</text>

  <!-- D2: completeCost <= newFlowers ? -->
  <g filter="url(#sk2)">
    <polygon points="210,296 320,266 430,296 320,326" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="11.5" fill="#2b4a6e">completeCost</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#2b4a6e">≤ newFlowers ?</text>

  <!-- bypass (no-branch of D2) down right margin -->
  <path d="M 430 296 L 575 296 L 575 623 L 474 623" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="288" font-size="10.5" fill="#b85450">否：预算不够，跳过更新</text>

  <path d="M 320 326 L 320 352" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="344" font-size="11" fill="#888">是</text>

  <!-- D3: k == 0 ? -->
  <g filter="url(#sk2)">
    <polygon points="245,380 320,352 395,380 320,408" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">k = 0 ?</text>

  <!-- yes of D3 -> B4a (left) -->
  <path d="M 245 380 L 160 380 L 160 430" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="372" font-size="11" fill="#888">是</text>
  <g filter="url(#sk2)">
    <rect x="60" y="430" width="200" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="160" y="450" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5e2e">ans ← max(ans, n·full)</text>
  <text x="160" y="470" text-anchor="middle" font-size="10" fill="#4a7a3a">（全完善，partial 项为 0）</text>

  <path d="M 320 408 L 320 440" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="430" font-size="11" fill="#888">否</text>

  <!-- D4: flowers[k-1] < target ? -->
  <g filter="url(#sk2)">
    <polygon points="205,470 320,440 435,470 320,500" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="464" text-anchor="middle" font-size="11.5" fill="#2b4a6e">flowers[k−1]</text>
  <text x="320" y="482" text-anchor="middle" font-size="11.5" fill="#2b4a6e">&lt; target ?</text>

  <!-- no of D4 joins bypass -->
  <path d="M 435 470 L 568 470" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#sk)"/>
  <circle cx="575" cy="470" r="3.2" fill="#b85450"/>
  <text x="448" y="462" font-size="10.5" fill="#b85450">否：前缀混入已完善</text>

  <path d="M 320 500 L 320 522" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="516" font-size="11" fill="#888">是</text>

  <!-- B4b -->
  <g filter="url(#sk2)">
    <rect x="170" y="522" width="300" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="544" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">二分最大 m（cost(m) ≤ remain）</text>
  <text x="320" y="566" text-anchor="middle" font-size="11.5" fill="#7a5415">ans ← max(ans, (n−k)·full + m·partial)</text>

  <!-- B7 -->
  <g filter="url(#sk2)">
    <rect x="150" y="600" width="324" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="312" y="628" text-anchor="middle" font-size="12" fill="#2b4a6e">③ completeCost += target − flowers[k−1]；k−−</text>

  <!-- arrows into B7 -->
  <path d="M 160 480 L 160 600" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 578 L 320 600" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop back to D1 -->
  <path d="M 150 623 L 48 623 L 48 212 L 240 212" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="40" y="430" font-size="10.5" fill="#446688" transform="rotate(-90 40 430)">k−− 后回到 ③</text>

  <!-- bottom annotation -->
  <text x="320" y="678" text-anchor="middle" font-size="11" fill="#888">completeCost 随 k 递减单调不减 ⇒ 一旦超支，更小的 k 只会更贵，可提前 break（可选优化）</text>
</svg>
