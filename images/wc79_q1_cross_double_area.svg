<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：叉积的绝对值 = 三角形面积的两倍</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 AB、AC 为邻边补成平行四边形，对角线 BC 把它平分成两个全等三角形</text>

  <!-- 坐标轴 -->
  <path d="M 92 300 L 322 300" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 318 L 120 112" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 平行四边形 A B D C -->
  <path d="M 120 300 L 120 140 L 280 140 L 280 300 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- 三角形 ABC（下半） -->
  <path d="M 120 300 L 120 140 L 280 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- 三角形 BDC（上半） -->
  <path d="M 120 140 L 280 140 L 280 300 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 直角标记 -->
  <path d="M 120 288 L 132 288 L 132 300" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 顶点与标签 -->
  <circle cx="120" cy="300" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="120" cy="140" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="280" cy="300" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="280" cy="140" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="104" y="318" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">A(0,0)</text>
  <text x="106" y="136" text-anchor="end" font-size="11" fill="#8a3a36" filter="url(#rough2)">B(0,2)</text>
  <text x="288" y="318" text-anchor="start" font-size="11" fill="#3a5a30" filter="url(#rough2)">C(2,0)</text>
  <text x="288" y="136" text-anchor="start" font-size="11" fill="#3a5a30" filter="url(#rough2)">D(2,2)</text>

  <!-- 面积标注 -->
  <text x="166" y="256" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S = 2</text>
  <text x="234" y="200" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">S = 2</text>

  <!-- 右侧推导 -->
  <text x="352" y="140" font-size="11.5" fill="#555" filter="url(#rough2)">AB = (0, 2)</text>
  <text x="352" y="162" font-size="11.5" fill="#555" filter="url(#rough2)">AC = (2, 0)</text>
  <text x="352" y="192" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">AB × AC = 0·0 − 2·2 = −4</text>
  <text x="352" y="216" font-size="11" fill="#555" filter="url(#rough2)">|AB × AC| = 4</text>
  <text x="352" y="234" font-size="10.5" fill="#888" filter="url(#rough2)">= 平行四边形面积</text>
  <text x="352" y="262" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">S = 4 / 2 = 2.0</text>

  <!-- 底部提示 -->
  <rect x="52" y="330" width="456" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="68" y="354" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">整点 ⇒ 2S 必为整数：全程整数运算，最后一步才 / 2，零精度损失</text>
</svg>
