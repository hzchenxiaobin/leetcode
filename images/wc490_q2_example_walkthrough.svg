<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：n = 154 与 n = 10</text>
  <path d="M 160 40 Q 280 50 400 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: n = 154, true -->
  <rect x="24" y="54" width="512" height="158" rx="10" fill="#f6fbf7" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="42" y="78" font-size="12.5" font-weight="bold" fill="#2e6e2e">n = 154 —— 本身不是阶数数字，但可重排成 145</text>
  <rect x="466" y="62" width="54" height="26" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="493" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">true ✓</text>

  <g filter="url(#sk)">
    <rect x="44" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="88" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="104" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2b4a6e" text-anchor="middle">
    <text x="62" y="127">1</text>
    <text x="106" y="127">5</text>
    <text x="150" y="127">4</text>
  </g>
  <text x="106" y="156" text-anchor="middle" font-size="9.5" fill="#888">数字 {1, 5, 4}</text>

  <path d="M 178 122 L 204 122" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="210" y="98" width="168" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="294" y="117" text-anchor="middle" font-size="11" fill="#2b4a6e" font-family="monospace">S = 1! + 5! + 4!</text>
  <text x="294" y="137" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">= 1 + 120 + 24 = 145</text>

  <path d="M 384 122 L 408 122" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="414" y="98" width="112" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="470" y="114" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-family="monospace">sort(S) → 145</text>
  <text x="470" y="128" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-family="monospace">sort(n) → 145</text>
  <text x="470" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">多重集相同 ✓</text>

  <text x="280" y="176" text-anchor="middle" font-size="9.5" fill="#888">S(154) = 145 ≠ 154 本身 —— 但 145 恰是 154 的合法重排，故答案 true</text>

  <!-- Panel B: n = 10, false -->
  <rect x="24" y="232" width="512" height="158" rx="10" fill="#fdf6f6" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="42" y="256" font-size="12.5" font-weight="bold" fill="#a04a48">n = 10 —— 0! = 1 的坑；排列「01」以零开头无效</text>
  <rect x="460" y="240" width="60" height="26" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="490" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">false ✗</text>

  <g filter="url(#sk)">
    <rect x="44" y="282" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="88" y="282" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2b4a6e" text-anchor="middle">
    <text x="62" y="305">1</text>
    <text x="106" y="305">0</text>
  </g>
  <text x="106" y="334" text-anchor="middle" font-size="9.5" fill="#b85450">0 的阶乘是 1，不是 0！</text>

  <path d="M 134 300 L 164 300" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="172" y="276" width="168" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="256" y="295" text-anchor="middle" font-size="11" fill="#2b4a6e" font-family="monospace">S = 1! + 0! = 1 + 1</text>
  <text x="256" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">= 2</text>

  <path d="M 346 300 L 372 300" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="380" y="276" width="146" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="453" y="294" text-anchor="middle" font-size="9.5" fill="#a04a48" font-family="monospace">sort(S) → 2</text>
  <text x="453" y="308" text-anchor="middle" font-size="9.5" fill="#a04a48" font-family="monospace">sort(n) → 01</text>
  <text x="453" y="322" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">位数都不同 ✗</text>

  <text x="280" y="354" text-anchor="middle" font-size="9.5" fill="#888">S(10) = 2 只有 1 位，与 n 的 2 位数字无法匹配 —— false</text>

  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">再如 n = 999999999：S = 9 × 9! = 3265920，位数都不同 → false</text>
</svg>
