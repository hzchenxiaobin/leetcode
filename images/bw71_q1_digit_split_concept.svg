<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：最小两个数位放十位</text>

  <!-- num = 2932 -->
  <text x="70" y="72" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 2932</text>
  <g filter="url(#rough2)">
    <rect x="130" y="52" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="52" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="52" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="52" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="152" y="77">2</text><text x="202" y="77">9</text>
    <text x="252" y="77">3</text><text x="302" y="77">2</text>
  </g>
  <text x="360" y="77" font-size="13" fill="#666" filter="url(#rough2)">取出 4 个数位</text>

  <path d="M 227 96 C 227 116, 227 126, 227 138" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="122" font-size="12" fill="#446688" filter="url(#rough2)">排序</text>

  <!-- sorted digits -->
  <g filter="url(#rough2)">
    <rect x="130" y="142" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="180" y="142" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="230" y="142" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="280" y="142" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="152" y="167">2</text><text x="202" y="167">2</text>
    <text x="252" y="167">3</text><text x="302" y="167">9</text>
  </g>
  <text x="360" y="157" font-size="13" fill="#4a7a3a" filter="url(#rough2)">d₀ ≤ d₁：十位</text>
  <text x="360" y="177" font-size="13" fill="#d6a040" filter="url(#rough2)">d₂ ≤ d₃：个位</text>

  <!-- two new numbers -->
  <path d="M 152 184 C 130 206, 118 216, 112 228" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 184 C 324 206, 336 216, 342 228" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="88" y="234" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="136" y="234" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="322" y="234" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="370" y="234" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="110" y="260">2</text><text x="158" y="260">3</text>
    <text x="344" y="260">2</text><text x="392" y="260">9</text>
  </g>
  <text x="110" y="292" font-size="13" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">十位 = d₀</text>
  <text x="158" y="292" font-size="13" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">个位 = d₂</text>
  <text x="240" y="260" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">+</text>
  <text x="462" y="260" font-size="18" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 52</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="60" y="316" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="336" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">和 = 10×(十位数字之和) + (个位数字之和)</text>
  <text x="280" y="354" font-size="13" fill="#b85450" filter="url(#rough2)" text-anchor="middle">十位权重是 10 → 让最小的 d₀、d₁ 承担十位</text>
</svg>
