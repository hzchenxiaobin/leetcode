<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">驼峰拼接规则：首词全小写，其余词首字母大写</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">caption = “Leetcode daily streak achieved”</text>

  <text x="52" y="81" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">单词</text>
  <rect x="60" y="62" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">Leetcode</text>
  <rect x="162" y="62" width="62" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">daily</text>
  <rect x="238" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">streak</text>
  <rect x="322" y="62" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">achieved</text>

  <path d="M 104 96 L 104 120" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 193 96 L 193 120" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 273 96 L 273 120" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 366 96 L 366 120" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="145" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">驼峰</text>
  <rect x="60" y="126" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">leetcode</text>
  <rect x="162" y="126" width="62" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="146" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">D</tspan><tspan fill="#333">aily</tspan></text>
  <rect x="238" y="126" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="146" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">S</tspan><tspan fill="#333">treak</tspan></text>
  <rect x="322" y="126" width="88" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="146" text-anchor="middle" font-size="13" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">A</tspan><tspan fill="#333">chieved</tspan></text>

  <text x="104" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 整词转小写</text>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#a06a1a" font-weight="bold" filter="url(#rough2)">② 首字母大写，剩余字母强制小写</text>

  <text x="52" y="211" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">标签</text>
  <rect x="60" y="190" width="430" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" filter="url(#rough2)"><tspan fill="#b85450">#</tspan><tspan fill="#333">leetcode</tspan><tspan fill="#b85450">D</tspan><tspan fill="#333">aily</tspan><tspan fill="#b85450">S</tspan><tspan fill="#333">treak</tspan><tspan fill="#b85450">A</tspan><tspan fill="#333">chieved</tspan></text>

  <rect x="40" y="242" width="480" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="266" font-size="11.5" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">① 首词：</tspan>整词转小写（含首字母），“Leetcode” → “leetcode”</text>
  <text x="58" y="288" font-size="11.5" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">② 其余词：</tspan>首字母大写 + 剩余强制小写，“GOLD” → “Gold”</text>
  <text x="58" y="310" font-size="11.5" fill="#333" filter="url(#rough2)">单词内部的大写会被压平：示例 2 “can I Go There” → “#canIGoThere”</text>
  <text x="58" y="332" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">单字母单词：首词 “I” → “i”；非首词 “I” → “I”</text>
</svg>
