<svg xmlns="http://www.w3.org/2000/svg" width="680" height="468" viewBox="0 0 680 468" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="468" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：word1 = "cabaa" + word2 = "bcaaa" → "cbcabaaaaa"</text>

  <!-- 关键行底色 -->
  <g filter="url(#sk)">
    <rect x="25" y="131" width="630" height="29" fill="#fff8e1"/>
    <rect x="25" y="191" width="630" height="29" fill="#fff8e1"/>
    <rect x="25" y="221" width="630" height="29" fill="#f4f4ef"/>
    <rect x="25" y="281" width="630" height="29" fill="#f4f4ef"/>
    <rect x="25" y="341" width="630" height="29" fill="#e6f4ea"/>
  </g>

  <!-- 表格 -->
  <g filter="url(#sk)">
    <rect x="24" y="44" width="632" height="326" fill="none" stroke="#999" stroke-width="1.4"/>
    <rect x="24" y="44" width="632" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 58 44 L 58 370" stroke="#bbb" stroke-width="1"/>
    <path d="M 158 44 L 158 370" stroke="#bbb" stroke-width="1"/>
    <path d="M 258 44 L 258 370" stroke="#bbb" stroke-width="1"/>
    <path d="M 428 44 L 428 370" stroke="#bbb" stroke-width="1"/>
    <path d="M 478 44 L 478 370" stroke="#bbb" stroke-width="1"/>
    <path d="M 24 70 L 656 70" stroke="#bbb" stroke-width="1"/>
    <path d="M 24 100 L 656 100" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 130 L 656 130" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 160 L 656 160" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 190 L 656 190" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 220 L 656 220" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 250 L 656 250" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 280 L 656 280" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 310 L 656 310" stroke="#ddd" stroke-width="1"/>
    <path d="M 24 340 L 656 340" stroke="#ddd" stroke-width="1"/>
  </g>

  <!-- 表头 -->
  <text x="41" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">步</text>
  <text x="108" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">word1 剩余</text>
  <text x="208" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">word2 剩余</text>
  <text x="343" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">后缀比较</text>
  <text x="453" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">取</text>
  <text x="567" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5e9e">merge</text>

  <!-- 行 1 -->
  <text x="41" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">1</text>
  <text x="108" y="90" text-anchor="middle" font-size="11" fill="#446688">cabaa</text>
  <text x="208" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a">bcaaa</text>
  <text x="343" y="90" text-anchor="middle" font-size="11" fill="#444">'c' &gt; 'b'（一位定胜负）</text>
  <text x="453" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">w1</text>
  <text x="567" y="90" text-anchor="middle" font-size="11" fill="#2b2b2b">c</text>

  <!-- 行 2 -->
  <text x="41" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">2</text>
  <text x="108" y="120" text-anchor="middle" font-size="11" fill="#446688">abaa</text>
  <text x="208" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">bcaaa</text>
  <text x="343" y="120" text-anchor="middle" font-size="11" fill="#444">'a' &lt; 'b'</text>
  <text x="453" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">w2</text>
  <text x="567" y="120" text-anchor="middle" font-size="11" fill="#2b2b2b">cb</text>

  <!-- 行 3 -->
  <text x="41" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3</text>
  <text x="108" y="150" text-anchor="middle" font-size="11" fill="#446688">abaa</text>
  <text x="208" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">caaa</text>
  <text x="343" y="150" text-anchor="middle" font-size="11" fill="#444">'a' &lt; 'c'</text>
  <text x="453" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">w2</text>
  <text x="567" y="150" text-anchor="middle" font-size="11" fill="#2b2b2b">cbc</text>

  <!-- 行 4（关键） -->
  <text x="41" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10">4</text>
  <text x="108" y="180" text-anchor="middle" font-size="11" fill="#446688">abaa</text>
  <text x="208" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">aaa</text>
  <text x="343" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10">abaa &gt; aaa（第 2 位 'b'）</text>
  <text x="453" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">w1</text>
  <text x="567" y="180" text-anchor="middle" font-size="11" fill="#2b2b2b">cbca</text>

  <!-- 行 5 -->
  <text x="41" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">5</text>
  <text x="108" y="210" text-anchor="middle" font-size="11" fill="#446688">baa</text>
  <text x="208" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a">aaa</text>
  <text x="343" y="210" text-anchor="middle" font-size="11" fill="#444">'b' &gt; 'a'</text>
  <text x="453" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">w1</text>
  <text x="567" y="210" text-anchor="middle" font-size="11" fill="#2b2b2b">cbcab</text>

  <!-- 行 6（关键） -->
  <text x="41" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10">6</text>
  <text x="108" y="240" text-anchor="middle" font-size="11" fill="#446688">aa</text>
  <text x="208" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">aaa</text>
  <text x="343" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10">aa &lt; aaa（真前缀更小）</text>
  <text x="453" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">w2</text>
  <text x="567" y="240" text-anchor="middle" font-size="11" fill="#2b2b2b">cbcaba</text>

  <!-- 行 7 -->
  <text x="41" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">7</text>
  <text x="108" y="270" text-anchor="middle" font-size="11" fill="#446688">aa</text>
  <text x="208" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a">aa</text>
  <text x="343" y="270" text-anchor="middle" font-size="11" fill="#444">相等 → 任取一方</text>
  <text x="453" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">w1</text>
  <text x="567" y="270" text-anchor="middle" font-size="11" fill="#2b2b2b">cbcabaa</text>

  <!-- 行 8 -->
  <text x="41" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">8</text>
  <text x="108" y="300" text-anchor="middle" font-size="11" fill="#446688">a</text>
  <text x="208" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a">aa</text>
  <text x="343" y="300" text-anchor="middle" font-size="11" fill="#444">a &lt; aa（真前缀更小）</text>
  <text x="453" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">w2</text>
  <text x="567" y="300" text-anchor="middle" font-size="11" fill="#2b2b2b">cbcabaaa</text>

  <!-- 行 9 -->
  <text x="41" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">9</text>
  <text x="108" y="330" text-anchor="middle" font-size="11" fill="#446688">a</text>
  <text x="208" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a">a</text>
  <text x="343" y="330" text-anchor="middle" font-size="11" fill="#444">相等 → 任取一方</text>
  <text x="453" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">w1</text>
  <text x="567" y="330" text-anchor="middle" font-size="11" fill="#2b2b2b">cbcabaaaa</text>

  <!-- 行 10 -->
  <text x="41" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">10</text>
  <text x="108" y="360" text-anchor="middle" font-size="11" fill="#999">（空）</text>
  <text x="208" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a">a</text>
  <text x="343" y="360" text-anchor="middle" font-size="11" fill="#444">w1 已空 → 整段拼接</text>
  <text x="453" y="360" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="567" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">cbcabaaaaa ✓</text>

  <!-- 底部注解 -->
  <g filter="url(#sk)">
    <rect x="24" y="384" width="632" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="42" y="406" font-size="12" font-weight="bold" fill="#2b2b2b">关键步 4 与 6（橙底）：首字符都是 'a'，胜负由整个后缀决定</text>
  <text x="42" y="426" font-size="10.5" fill="#555">步 4："abaa" &gt; "aaa"（第 2 位 'b' &gt; 'a'）→ 取 word1，让 'b' 尽早出场</text>
  <text x="42" y="444" font-size="10.5" fill="#555">步 6："aa" 是 "aaa" 的真前缀 → "aa" &lt; "aaa" → 反取 word2；此后 4 个 'a' 无论怎么交错结果相同</text>
</svg>
