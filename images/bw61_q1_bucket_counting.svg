<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：值域计数桶，差为 k 的值对连线</text>

  <!-- 桶数组：v = 1..8，k = 3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="80" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="164" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="80" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="268" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="80" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="372" y="80" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="424" y="80" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="86" y="101">1</text><text x="138" y="101">2</text>
    <text x="190" y="101">3</text><text x="242" y="101">4</text>
    <text x="294" y="101">5</text><text x="346" y="101">6</text>
    <text x="398" y="101">7</text><text x="450" y="101">8</text>
  </g>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">cnt[v]（桶下标 = 值 v）</text>

  <!-- 配对弧线：(v, v+3) -->
  <path d="M 86 116 C 100 160, 280 160, 294 116" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 138 116 C 155 150, 330 150, 346 116" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 116 C 210 140, 375 140, 398 116" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 242 116 C 262 130, 405 130, 450 116" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v=1: cnt[1]·cnt[4]</text>
  <text x="242" y="155" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">v=2: cnt[2]·cnt[5]</text>
  <text x="294" y="143" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v=3: cnt[3]·cnt[6]</text>
  <text x="346" y="132" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">v=4: cnt[4]·cnt[7]…</text>

  <!-- 说明框 -->
  <rect x="60" y="210" width="440" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">k ≥ 1 ⇒ 两桶值不同，不会取到同一下标</text>
  <text x="280" y="262" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">ans = Σ cnt[v] × cnt[v+k]</text>

  <rect x="60" y="306" width="440" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">每个无序数对的较小值 v 唯一 ⇒ 分类不重不漏</text>
  <text x="280" y="356" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">v 只需枚举 1 … 100−k（较大值 v+k ≤ 100）</text>
</svg>
