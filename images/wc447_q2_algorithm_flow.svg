<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一遍染色 + O(1) 查询</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="56" width="300" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">输入：n、nums（非递减）、maxDiff、queries</text>

  <g filter="url(#sk)"><path d="M 320 92 L 320 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="95" y="112" width="450" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="133" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">① 染色（O(n)）：group[0] = 0，for i = 1 … n−1</text>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#444">逐个检查相邻差 nums[i] − nums[i−1]，断口数即段号</text>

  <g filter="url(#sk)"><path d="M 320 166 L 320 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="320,190 470,238 320,286 170,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">nums[i] − nums[i−1]</text>
  <text x="320" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">&gt; maxDiff？</text>

  <g filter="url(#sk)"><path d="M 470 238 L 498 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)"/></g>
  <text x="484" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">是</text>
  <g filter="url(#sk)"><rect x="502" y="214" width="126" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="565" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">断口：新开一段</text>
  <text x="565" y="253" text-anchor="middle" font-size="10" fill="#b03a3a">group[i] = group[i−1] + 1</text>

  <g filter="url(#sk)"><path d="M 170 238 L 142 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/></g>
  <text x="156" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">否</text>
  <g filter="url(#sk)"><rect x="12" y="214" width="126" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="75" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">同段延伸</text>
  <text x="75" y="253" text-anchor="middle" font-size="10" fill="#2e6e2e">group[i] = group[i−1]</text>

  <g filter="url(#sk)"><path d="M 565 264 Q 565 306 396 328" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/></g>
  <g filter="url(#sk)"><path d="M 75 264 Q 75 306 244 328" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/></g>
  <text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#888">i++，继续扫描至 n−1</text>

  <g filter="url(#sk)"><rect x="95" y="332" width="450" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="353" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">② 查询（O(q)）：对每个 queries[i] = [u, v]</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#444">answer[i] = (group[u] == group[v])；u = v 时段号必相同，自然为 true</text>

  <g filter="url(#sk)"><path d="M 320 386 L 320 402" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="210" y="406" width="220" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 返回 answer</text>

  <text x="320" y="472" text-anchor="middle" font-size="11" fill="#666">等价写法（并查集）：相邻差 ≤ maxDiff 时 union(i, i+1)，查询判 find(u) == find(v)</text>
  <text x="320" y="492" text-anchor="middle" font-size="11" fill="#666">时间 O(n + q)，空间 O(n)（group 数组，不计输出）</text>
</svg>
