<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：三类输入的两次反转全过程</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="52" width="110" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="52" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="52" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="450" y="52" width="160" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="95" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">num</text>
  <text x="225" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">第一次反转 R(num)</text>
  <text x="375" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">第二次反转 R(R(num))</text>
  <text x="530" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">判定</text>

  <g filter="url(#sk)">
    <rect x="40" y="84" width="110" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="150" y="84" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="300" y="84" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="450" y="84" width="160" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="95" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">526</text>
  <text x="95" y="126" text-anchor="middle" font-size="10" fill="#666">末位 6 ≠ 0</text>
  <text x="225" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">625</text>
  <text x="225" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">首位非零，无丢弃</text>
  <text x="375" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">526</text>
  <text x="375" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">= num</text>
  <text x="530" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">true</text>
  <text x="530" y="126" text-anchor="middle" font-size="10" fill="#666">信息无损</text>

  <g filter="url(#sk)">
    <rect x="40" y="132" width="110" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="150" y="132" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="300" y="132" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="450" y="132" width="160" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="95" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1800</text>
  <text x="95" y="174" text-anchor="middle" font-size="10" fill="#c09028">末位为 0</text>
  <text x="225" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">81</text>
  <text x="225" y="174" text-anchor="middle" font-size="10" fill="#b85450">0081 丢前导零</text>
  <text x="375" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">18</text>
  <text x="375" y="174" text-anchor="middle" font-size="10" fill="#b85450">≠ 1800</text>
  <text x="530" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">false</text>
  <text x="530" y="174" text-anchor="middle" font-size="10" fill="#666">零不可恢复</text>

  <g filter="url(#sk)">
    <rect x="40" y="180" width="110" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="150" y="180" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="300" y="180" width="150" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
    <rect x="450" y="180" width="160" height="48" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
  </g>
  <text x="95" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">0</text>
  <text x="95" y="222" text-anchor="middle" font-size="10" fill="#c09028">唯一特例</text>
  <text x="225" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="225" y="222" text-anchor="middle" font-size="10" fill="#666">仍是 0</text>
  <text x="375" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
  <text x="375" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">= num</text>
  <text x="530" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">true</text>
  <text x="530" y="222" text-anchor="middle" font-size="10" fill="#666">0 反转仍 0</text>

  <g filter="url(#sk)">
    <rect x="70" y="248" width="500" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">三个示例恰好覆盖全部三类情形：末位非零 / 末位为零 / num = 0</text>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#666">判定只与末位有关，与中间数位无关——这正是 O(1) 解法的来源</text>
</svg>
