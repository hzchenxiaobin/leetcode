<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="78"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">按符号分四段：每段一个单调双指针</text>

  <!-- 顶部：nums1 与 nums2 的分解 -->
  <text x="90" y="64" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1 分解</text>
  <g filter="url(#rough2)">
    <rect x="40" y="74" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="152" y="74" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="214" y="74" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="95" y="95" fill="#8a3a34">neg1（负，升序）</text>
    <text x="182" y="95" fill="#7a5c1e">z1 个零</text>
    <text x="269" y="95" fill="#2d5a22">pos1（正，升序）</text>
  </g>
  <text x="90" y="130" font-size="11" fill="#666" filter="url(#rough2)">|a| 降序 ←</text>
  <text x="269" y="130" font-size="11" fill="#666" filter="url(#rough2)">→ a 升序</text>

  <!-- 四象限 -->
  <g filter="url(#rough2)">
    <rect x="60" y="152" width="210" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <rect x="290" y="152" width="210" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <rect x="60" y="252" width="210" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <rect x="290" y="252" width="210" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="165" y="176" fill="#2d5a22" font-weight="bold">负 × 负 → 乘积 &gt; 0</text>
    <text x="165" y="196" fill="#2d5a22">|a|·|b| ≤ x</text>
    <text x="165" y="216" fill="#2d5a22">指针在 neg2 尾部（小 |b|）</text>
    <text x="165" y="234" fill="#2d5a22">尾段随阈值升而变长</text>

    <text x="395" y="176" fill="#2d5a22" font-weight="bold">正 × 正 → 乘积 &gt; 0</text>
    <text x="395" y="196" fill="#2d5a22">a·b ≤ x</text>
    <text x="395" y="216" fill="#2d5a22">指针在 pos2 头部</text>
    <text x="395" y="234" fill="#2d5a22">前缀随阈值升而变长</text>

    <text x="165" y="276" fill="#8a3a34" font-weight="bold">负 × 正 → 乘积 &lt; 0</text>
    <text x="165" y="296" fill="#8a3a34">|a|·b ≥ −x（need）</text>
    <text x="165" y="316" fill="#8a3a34">合法 = pos2 的后缀</text>
    <text x="165" y="334" fill="#8a3a34">非法前缀单调生长</text>

    <text x="395" y="276" fill="#8a3a34" font-weight="bold">正 × 负 → 乘积 &lt; 0</text>
    <text x="395" y="296" fill="#8a3a34">a·|b| ≥ −x（need）</text>
    <text x="395" y="316" fill="#8a3a34">合法 = neg2 的头部（大 |b|）</text>
    <text x="395" y="334" fill="#8a3a34">前缀随 a 升而变长</text>
  </g>

  <!-- 零因子说明 -->
  <rect x="60" y="352" width="440" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)" text-anchor="middle" font-weight="bold">含零因子：乘积恒为 0，x ≥ 0 时计入 z₁n₂ + z₂n₁ − z₁z₂ 对</text>
</svg>
