<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：数位和对拼接的加法性</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="34" y="76" font-size="14" fill="#444" font-family="monospace" font-weight="bold">s = "zbax"</text>

  <g font-size="17" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="190" y="92" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="212" y="119">z</text>
    <g filter="url(#sk)"><rect x="244" y="92" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="266" y="119">b</text>
    <g filter="url(#sk)"><rect x="298" y="92" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="320" y="119">a</text>
    <g filter="url(#sk)"><rect x="352" y="92" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="374" y="119">x</text>
  </g>

  <text x="440" y="70" font-size="11" fill="#888">val(c) = c − 'a' + 1</text>
  <path d="M 452 78 Q 400 92 376 90" stroke="#888" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g font-size="13" fill="#7a5415" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="194" y="140" width="36" height="24" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.1"/></g><text x="212" y="157">26</text>
    <g filter="url(#sk)"><rect x="248" y="140" width="36" height="24" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.1"/></g><text x="266" y="157">2</text>
    <g filter="url(#sk)"><rect x="302" y="140" width="36" height="24" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.1"/></g><text x="320" y="157">1</text>
    <g filter="url(#sk)"><rect x="356" y="140" width="36" height="24" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.1"/></g><text x="374" y="157">24</text>
  </g>
  <text x="440" y="157" font-size="11" fill="#888">每段数位和：</text>
  <text x="440" y="173" font-size="11" fill="#888" font-family="monospace">v/10 + v%10</text>

  <g font-size="14" fill="#3a6e3a" font-family="monospace" text-anchor="middle" font-weight="bold">
    <text x="212" y="188">8</text>
    <text x="266" y="188">2</text>
    <text x="320" y="188">1</text>
    <text x="374" y="188">6</text>
  </g>

  <path d="M 212 196 L 212 224" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <path d="M 374 196 L 374 224" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <path d="M 266 196 L 266 224" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>
  <path d="M 320 196 L 320 224" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)"/>

  <g filter="url(#sk)">
    <rect x="70" y="230" width="500" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="13.5" fill="#2f5d2f" font-family="monospace" font-weight="bold">digit_sum(A ⌢ B) = digit_sum(A) + digit_sum(B)</text>
  <text x="320" y="272" text-anchor="middle" font-size="11.5" fill="#4a8e4a">数位和只把每位数字加起来，与位权无关 —— 拼接只是把更多数字位排成一列</text>

  <g filter="url(#sk)">
    <rect x="70" y="300" width="500" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="12.5" fill="#8f3b37" font-family="monospace" font-weight="bold">⚠ 暴力路径：拼接 "26"+"2"+"1"+"24" = "262124" 再整体求数位和</text>
  <text x="320" y="342" text-anchor="middle" font-size="11.5" fill="#b85450">n ≤ 100 时拼接串可达 200 位，long long 只装得下 ~19 位 —— C++ 直接 stoi/stoll 必溢出</text>

  <path d="M 160 352 Q 160 376 200 380" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)"/>
  <path d="M 480 352 Q 480 376 440 380" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)"/>
  <text x="132" y="372" font-size="11" fill="#c98a2b" text-anchor="middle">构造大数</text>
  <text x="510" y="372" font-size="11" fill="#4a8e4a" text-anchor="middle">逐字母累加</text>

  <g filter="url(#sk)">
    <rect x="120" y="386" width="400" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="17" fill="#7a5415" font-family="monospace" font-weight="bold">R₁ = 8 + 2 + 1 + 6 = 17（两条路径殊途同归）</text>

  <g filter="url(#sk)">
    <rect x="30" y="444" width="580" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="459" text-anchor="middle" font-size="11" fill="#888">加法性路径全程不构造大数，R₁ ≤ 100 × 10 = 1000，一个 int 就够。</text>
</svg>
