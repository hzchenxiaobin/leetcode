<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：vals = [2,3]，par = [-1,0]</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">叶子先算，父亲再合并</text>
  <rect x="40" y="66" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">节点</text>
  <rect x="120" y="66" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子树</text>
  <rect x="210" y="66" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">f[u][mask]（非零项）</text>
  <rect x="510" y="66" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="540.0" y="87.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">max</text>
  <rect x="40" y="100" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="121.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1（叶）</text>
  <rect x="120" y="100" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165.0" y="121.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{3}</text>
  <rect x="210" y="100" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="121.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">f[0]=0, f[{3}]=3</text>
  <rect x="510" y="100" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="540.0" y="121.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="40" y="134" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="155.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0（根）</text>
  <rect x="120" y="134" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165.0" y="155.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">{2,3}</text>
  <rect x="210" y="134" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360.0" y="155.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">f[0]=0, f[{2}]=2, f[{3}]=3, f[{2,3}]=5</text>
  <rect x="510" y="134" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="540.0" y="155.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="40" y="180" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="202.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">maxScore = [5, 3]，总和 = 8，与示例 1 一致</text>
  <text x="300.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">示例 4 中 22 的掩码含两个 2，节点 1 自身非法，只能作为空集参与合并</text>
  <text x="40" y="272" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">空集 f[mask]=0 是合法状态（可以谁都不选）</text>
  <text x="40" y="296" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">答案要对 1e9+7 取模，中间和用 long long</text>
</svg>
