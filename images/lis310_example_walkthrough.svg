<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [4,2,1,4,3,4,5,8,15]，k = 3</text>

  <!-- 表格：列 x 边界 22 | 52 | 87 | 177 | 312 | 352 | 452 | 497 -->
  <!-- 表头 -->
  <rect x="22" y="40" width="475" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="37" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i</text>
  <text x="69" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x</text>
  <text x="132" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">窗口 [L, R]</text>
  <text x="244" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">best（来源）</text>
  <text x="332" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">cur</text>
  <text x="402" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">dp 更新</text>
  <text x="474" y="57" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行模板 y0 = 66 + r*27 -->
  <rect x="22" y="66" width="475" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="69" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="132" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 3]</text>
  <text x="244" y="84" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0（树空）</text>
  <text x="332" y="84" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="402" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[4]=1</text>
  <text x="474" y="84" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="22" y="93" width="475" height="27" fill="#f7f9f7" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="69" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="132" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 1]</text>
  <text x="244" y="111" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="332" y="111" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="402" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[2]=1</text>
  <text x="474" y="111" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="22" y="120" width="475" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="69" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="132" y="138" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[1, 0] 空</text>
  <text x="244" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="332" y="138" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="402" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[1]=1</text>
  <text x="474" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="22" y="147" width="475" height="27" fill="#f7f9f7" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="69" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="132" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 3]</text>
  <text x="244" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1（dp[1]=1）</text>
  <text x="332" y="165" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">2</text>
  <text x="402" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[4]: 1→2</text>
  <text x="474" y="165" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <rect x="22" y="174" width="475" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="69" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="132" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[1, 2]</text>
  <text x="244" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1（dp[1]=1）</text>
  <text x="332" y="192" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">2</text>
  <text x="402" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[3]=2</text>
  <text x="474" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>

  <!-- 高亮行 i=5 -->
  <rect x="22" y="201" width="475" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="37" y="219" text-anchor="middle" font-size="11" fill="#6b5320" filter="url(#rough2)">5</text>
  <text x="69" y="219" text-anchor="middle" font-size="11" fill="#6b5320" filter="url(#rough2)">4</text>
  <text x="132" y="219" text-anchor="middle" font-size="11" fill="#6b5320" filter="url(#rough2)">[1, 3]</text>
  <text x="244" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2（dp[3]=2）</text>
  <text x="332" y="219" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">3</text>
  <text x="402" y="219" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">dp[4]: 2→3 ↑</text>
  <text x="474" y="219" text-anchor="middle" font-size="11" fill="#6b5320" filter="url(#rough2)">3</text>

  <rect x="22" y="228" width="475" height="27" fill="#ffffff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="37" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="69" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="132" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2, 4]</text>
  <text x="244" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3（dp[4]=3）</text>
  <text x="332" y="246" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">4</text>
  <text x="402" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[5]=4</text>
  <text x="474" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>

  <!-- 高亮行 i=7（答案行） -->
  <rect x="22" y="255" width="475" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="37" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">7</text>
  <text x="69" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">8</text>
  <text x="132" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">[5, 7]</text>
  <text x="244" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4（dp[5]=4）</text>
  <text x="332" y="273" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">5</text>
  <text x="402" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">dp[8]=5 ★</text>
  <text x="474" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">5</text>

  <!-- 高亮行 i=8（窗口排除） -->
  <rect x="22" y="282" width="475" height="27" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="37" y="300" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">8</text>
  <text x="69" y="300" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">15</text>
  <text x="132" y="300" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">[12, 14]</text>
  <text x="244" y="300" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0（dp[8] 在窗外）</text>
  <text x="332" y="300" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="402" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp[15]=1</text>
  <text x="474" y="300" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">5</text>

  <!-- 底部说明 -->
  <rect x="22" y="322" width="475" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#6b5320" filter="url(#rough2)">dp[8] = 5 ↔ 子序列 [1,3,4,5,8]；第 5 步 dp[4] 从 2 升到 3 ——</text>
  <text x="260" y="364" text-anchor="middle" font-size="12" fill="#6b5320" filter="url(#rough2)">同一个值 4 第二次出现，接上了更长的前驱（3），单点更新取 max 保住强者；</text>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#6b5320" filter="url(#rough2)">第 8 步 15−8 = 7 &gt; k = 3，窗口 [12,14] 恰好把 dp[8] 挡在外面 → 15 自成一路</text>
</svg>
