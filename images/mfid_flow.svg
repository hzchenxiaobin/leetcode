<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">单步流程：更新 → 入堆 → 对账 → 取顶</text>

  <rect x="160" y="46" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">第 i 步：x = nums[i]</text>

  <path d="M 260 80 L 260 96" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="100" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[x] += freq[i]（真值更新）</text>

  <path d="M 260 134 L 260 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="160" y="154" width="200" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">push 新快照 (cnt[x], x)</text>

  <path d="M 260 188 L 260 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,212 372,250 260,288 148,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">堆顶频次 =</text>
  <text x="260" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt[堆顶 ID] ？</text>

  <rect x="392" y="232" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="447" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否：pop</text>
  <text x="447" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（过期快照）</text>

  <path d="M 374 250 L 388 250" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 447 230 Q 447 196 420 192 L 232 192 Q 200 192 200 202 L 200 208" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <path d="M 260 290 L 260 308" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="302" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="160" y="312" width="200" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans[i] = 堆顶频次</text>

  <rect x="30" y="356" width="460" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每步必 push → 堆必非空；对账必须 while（过期快照可能连续多个）</text>
</svg>
