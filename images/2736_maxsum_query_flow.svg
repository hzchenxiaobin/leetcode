<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="285" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">每个查询：两次二分夹出候选段，ST 表 O(1) 取最大</text>
  <path d="M 110 37 Q 285 45 460 37" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 查询输入 -->
  <rect x="105" y="46" width="200" height="30" rx="8" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.6" filter="url(#sk)"/>
  <text x="205" y="66" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">查询 (xi, yi)</text>
  <path d="M 205 76 L 205 88" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <!-- 二分 1 -->
  <rect x="75" y="92" width="260" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="205" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">二分①：L ← 第一个 x ≥ xi 的下标</text>
  <text x="205" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#sk)">（阶梯中 xs 严格递增 → lower_bound）</text>
  <path d="M 205 136 L 205 148" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <polygon points="205,150 315,196 205,242 95,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="205" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">L == m ?</text>
  <text x="205" y="210" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#sk)">（没有任何点的 x 够大）</text>

  <path d="M 315 196 L 391 196" stroke="#b85450" stroke-width="1.7" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="340" y="188" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">是</text>
  <rect x="395" y="179" width="110" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="201" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">answer ← −1</text>

  <path d="M 205 242 L 205 254" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="213" y="252" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">否</text>

  <!-- 二分 2 -->
  <rect x="75" y="258" width="260" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="205" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">二分②：R ← 最后一个 y ≥ yi 的下标</text>
  <text x="205" y="294" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#sk)">（[L, m) 内 ys 严格递减，取递减前缀的末端）</text>
  <path d="M 205 302 L 205 314" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>

  <polygon points="205,316 315,362 205,408 95,362" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="205" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">R &lt; L ?</text>
  <text x="205" y="376" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#sk)">（剩下的点 y 都不够大）</text>

  <path d="M 315 362 L 391 362" stroke="#b85450" stroke-width="1.7" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="340" y="354" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">是</text>
  <rect x="395" y="345" width="110" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="367" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">answer ← −1</text>

  <path d="M 205 408 L 205 420" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#sk)"/>
  <text x="213" y="418" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">否</text>

  <!-- ST 表 -->
  <rect x="75" y="424" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="205" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">answer ← ST 表 max(w[L..R])</text>

  <!-- 右侧说明框 A -->
  <rect x="520" y="92" width="112" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="576" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">候选为何连续？</text>
  <text x="576" y="134" text-anchor="middle" font-size="9.5" fill="#2b4a6e" filter="url(#sk)">阶梯上 x↑、y↓：</text>
  <text x="576" y="151" text-anchor="middle" font-size="9.5" fill="#2b4a6e" filter="url(#sk)">x ≥ xi 砍掉左端、</text>
  <text x="576" y="168" text-anchor="middle" font-size="9.5" fill="#2b4a6e" filter="url(#sk)">y ≥ yi 砍掉右端，</text>
  <text x="576" y="191" text-anchor="middle" font-size="9.5" fill="#2b4a6e" filter="url(#sk)">两边一夹，剩下</text>
  <text x="576" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">连续段 [L, R]</text>

  <!-- 右侧说明框 B -->
  <rect x="520" y="258" width="112" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="576" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">为何要 ST 表？</text>
  <text x="576" y="300" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">w = x + y 在阶梯上</text>
  <text x="576" y="317" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">并不单调！</text>
  <text x="576" y="339" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">(1,100) → 101</text>
  <text x="576" y="356" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">(50,99) → 149</text>
  <text x="576" y="373" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">(100,1) → 101</text>
  <text x="576" y="394" text-anchor="middle" font-size="9.5" fill="#a05a20" filter="url(#sk)">最大藏在中间</text>
</svg>
