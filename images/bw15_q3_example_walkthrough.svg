<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">全程演算：CombinationIterator("abc", 2) 的完整生命周期</text>

  <!-- 表头 -->
  <text x="90" y="66" font-size="13" fill="#888" filter="url(#rough2)">当前 idx</text>
  <text x="230" y="66" font-size="13" fill="#888" filter="url(#rough2)">next() 返回</text>
  <text x="420" y="66" font-size="13" fill="#888" filter="url(#rough2)">推进动作</text>
  <text x="580" y="66" font-size="13" fill="#888" filter="url(#rough2)">hasNext</text>

  <!-- 行 1 -->
  <rect x="60" y="80" width="120" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(0,1)</text>
  <line x1="180" y1="102" x2="206" y2="102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="80" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">"ab"</text>
  <line x1="310" y1="102" x2="336" y2="102" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="80" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p=1：1 &lt; 2 可增</text>
  <text x="450" y="116" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">idx[1]++ → (0,2)</text>
  <text x="596" y="107" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 行 2 -->
  <rect x="60" y="136" width="120" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(0,2)</text>
  <line x1="180" y1="158" x2="206" y2="158" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="136" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">"ac"</text>
  <line x1="310" y1="158" x2="336" y2="158" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="136" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p=1 顶满(2=2)；p=0：0 &lt; 1 可增</text>
  <text x="450" y="172" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">idx[0]++，回填 idx[1]=2 → (1,2)</text>
  <text x="596" y="163" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 行 3 -->
  <rect x="60" y="192" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="219" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(1,2)</text>
  <line x1="180" y1="214" x2="206" y2="214" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="192" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">"bc"</text>
  <line x1="310" y1="214" x2="336" y2="214" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="192" width="220" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p=1 顶满、p=0 顶满(1=1)</text>
  <text x="450" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">has_next = false（耗尽）</text>
  <text x="596" y="219" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- 底注 -->
  <rect x="60" y="256" width="560" height="56" rx="10" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">构造：idx = (0,1)（前 k 个字符，字典序最小）；输出序列 ab → ac → bc</text>
  <text x="340" y="300" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">最后的组合恰是 characters 的后 k 个字符（全部位置顶满）</text>
</svg>
