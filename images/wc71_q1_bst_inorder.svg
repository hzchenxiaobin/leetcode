<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BST 的中序遍历就是升序序列</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最小差值一定出现在升序序列的相邻两项之间</text>

  <!-- 左：示例 1 的二叉搜索树 -->
  <line x1="150" y1="113" x2="95" y2="147" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="113" x2="210" y2="147" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="95" y1="183" x2="60" y2="217" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="95" y1="183" x2="130" y2="217" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="150" cy="95" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="13" fill="#2f4a28" filter="url(#rough2)">4</text>
  <circle cx="95" cy="165" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="170" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">2</text>
  <circle cx="210" cy="165" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="170" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">6</text>
  <circle cx="60" cy="235" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">1</text>
  <circle cx="130" cy="235" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="240" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">3</text>

  <text x="150" y="278" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">示例 1：root = [4, 2, 6, 1, 3]</text>
  <text x="150" y="296" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">左 → 根 → 右 递归即可</text>

  <!-- 右：中序序列与相邻差 -->
  <text x="400" y="76" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">中序结果（升序）</text>

  <rect x="370" y="88" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">1</text>
  <path d="M 394 118 L 394 136" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="133" font-size="10" fill="#b85450" filter="url(#rough2)">差 1</text>

  <rect x="370" y="140" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">2</text>
  <path d="M 394 170 L 394 188" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="185" font-size="10" fill="#b85450" filter="url(#rough2)">差 1</text>

  <rect x="370" y="192" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="212" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">3</text>
  <path d="M 394 222 L 394 240" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="237" font-size="10" fill="#b85450" filter="url(#rough2)">差 1</text>

  <rect x="370" y="244" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">4</text>
  <path d="M 394 274 L 394 292" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="289" font-size="10" fill="#b85450" filter="url(#rough2)">差 2</text>

  <rect x="370" y="296" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="316" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">6</text>

  <rect x="60" y="334" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="354" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么只看相邻？</text>
  <text x="78" y="372" font-size="10" fill="#555" filter="url(#rough2)">对 i &lt; j−1 有 aⱼ − aᵢ ≥ aᵢ₊₁ − aᵢ，跨项差不可能比中间某个相邻差更小。</text>
</svg>
