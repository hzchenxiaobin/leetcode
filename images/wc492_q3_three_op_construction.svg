<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三步构造：首尾卡死 —— cba → abc</text>

  <rect x="24" y="36" width="296" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">唯一最大值 c 在首位 · 唯一最小值 a 在末位</text>
  <rect x="478" y="36" width="138" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="547" y="52" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标 t = abc</text>

  <!-- 行1：cba -->
  <text x="56" y="102" font-size="11" fill="#666" filter="url(#rough2)">s</text>
  <text x="138" y="71" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">max</text>
  <text x="262" y="71" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">min</text>
  <rect x="110" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="138" y="104" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="172" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="234" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="262" y="104" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>

  <path d="M200,126 L200,156" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="124" width="286" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="143" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">① 排 [0,1]：cb→bc，把唯一 max 挪进中间</text>

  <!-- 行2：bca -->
  <text x="48" y="190" font-size="11" fill="#666" filter="url(#rough2)">一步后</text>
  <rect x="110" y="164" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="192" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="172" y="164" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="192" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="234" y="164" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="192" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="306" y="190" font-size="10.5" fill="#b85450" filter="url(#rough2)">仍整串失配</text>

  <path d="M200,214 L200,244" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="212" width="286" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="231" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 排 [1,2]：ca→ac，右端 c 就位</text>

  <!-- 行3：bac -->
  <text x="48" y="278" font-size="11" fill="#666" filter="url(#rough2)">两步后</text>
  <rect x="110" y="252" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="138" y="280" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="172" y="252" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="234" y="252" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="280" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="306" y="278" font-size="10.5" fill="#d6a040" filter="url(#rough2)">失配 [0,1] 真子串</text>

  <path d="M200,302 L200,332" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="300" width="286" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="319" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ 排 [0,1]：ba→ab，收尾</text>

  <!-- 行4：abc -->
  <text x="48" y="366" font-size="11" fill="#666" filter="url(#rough2)">三步后</text>
  <rect x="110" y="340" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="368" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="172" y="340" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="234" y="340" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="368" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="306" y="366" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ = t</text>

  <rect x="24" y="392" width="592" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="414" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">为什么 2 步不行？—— 唯一 max 在首位、唯一 min 在末位：任何一次排序区间都无法让任一端点就位</text>
</svg>
