<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="344" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：不碰撞 ⟺ 全员同向 —— 混向环形必有一条「相向边」</text>

  <!-- ====== left: mixed directions, collision ====== -->
  <text x="145" y="48" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">混向（顺逆混杂）：必撞 ✗</text>

  <polygon points="145,100 195,129 195,187 145,216 95,187 95,129" fill="none"
           stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- vertices: V0,V1,V2 clockwise (green); V3,V4,V5 counter (orange) -->
  <circle cx="145" cy="100" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="104" text-anchor="middle" font-size="9" fill="#333">0</text>
  <circle cx="195" cy="129" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="133" text-anchor="middle" font-size="9" fill="#333">1</text>
  <circle cx="195" cy="187" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="191" text-anchor="middle" font-size="9" fill="#333">2</text>
  <circle cx="145" cy="216" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="220" text-anchor="middle" font-size="9" fill="#333">3</text>
  <circle cx="95" cy="187" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="191" text-anchor="middle" font-size="9" fill="#333">4</text>
  <circle cx="95" cy="129" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="133" text-anchor="middle" font-size="9" fill="#333">5</text>

  <!-- move arrows radiating from each vertex toward its target -->
  <path d="M 155.4 106 L 167.5 113" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 195 141 L 195 155" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 184.6 193 L 172.5 200" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 155.4 210 L 167.5 203" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 105.4 193 L 117.5 200" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 95 141 L 95 155" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- collision burst on edge (2,3) -->
  <text x="172" y="202" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✕</text>
  <rect x="42" y="228" width="206" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145" y="241" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1→0 转变处：猴 2 顺→3，猴 3 逆→2</text>
  <text x="145" y="255" text-anchor="middle" font-size="9.5" fill="#b85450">同一条边上相向而行，必相遇 ⚡</text>

  <!-- note on 0->1 transition edge (5,0) -->
  <path d="M 120 116 L 122 106" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="118" y="94" text-anchor="end" font-size="8.5" fill="#888">0→1 转变：背向离开，此边不撞</text>

  <!-- ====== right: all clockwise, safe ====== -->
  <text x="415" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">全员同向（全顺 / 全逆）：不碰撞 ✓</text>

  <polygon points="415,100 465,129 465,187 415,216 365,187 365,129" fill="none"
           stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="415" cy="100" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="104" text-anchor="middle" font-size="9" fill="#333">0</text>
  <circle cx="465" cy="129" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="133" text-anchor="middle" font-size="9" fill="#333">1</text>
  <circle cx="465" cy="187" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="191" text-anchor="middle" font-size="9" fill="#333">2</text>
  <circle cx="415" cy="216" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="220" text-anchor="middle" font-size="9" fill="#333">3</text>
  <circle cx="365" cy="187" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="191" text-anchor="middle" font-size="9" fill="#333">4</text>
  <circle cx="365" cy="129" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="133" text-anchor="middle" font-size="9" fill="#333">5</text>

  <path d="M 425.4 106 L 437.5 113" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 465 141 L 465 155" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 454.6 193 L 442.5 200" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 404.6 210 L 392.5 203" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 365 175 L 365 161" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 375.4 123 L 387.5 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="302" y="228" width="226" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="241" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">i → (i+1) mod n 是循环移位（双射）</text>
  <text x="415" y="255" text-anchor="middle" font-size="9.5" fill="#4a7a3a">每顶点恰收 1 只猴，每边单向单猴 ✓</text>

  <!-- ====== bottom: counting argument ====== -->
  <rect x="30" y="272" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="195" y="289" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">环形 0/1 串不全同 ⇒ 1→0 转变数 = 0→1 转变数 ≥ 1</text>
  <text x="195" y="304" text-anchor="middle" font-size="9.5" fill="#333">（若绕一圈没有 1→0 转变，1 一旦出现就传到底 ⇒ 全 1，矛盾）</text>
  <text x="195" y="318" text-anchor="middle" font-size="9.5" fill="#333">故：混向 ⇒ 存在相向边 ⇒ 必碰撞；逆否即「不碰撞 ⇒ 全员同向」</text>

  <rect x="374" y="272" width="156" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="292" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">碰撞方案 = 2ⁿ − 2</text>
  <text x="452" y="312" text-anchor="middle" font-size="9.5" fill="#b85450">不碰撞仅「全顺 / 全逆」2 种</text>
</svg>
