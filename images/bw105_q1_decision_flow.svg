<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一次遍历维护 (m₁, m₂)</text>

  <rect x="200" y="52" width="120" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">开始，m₁ = m₂ = 101</text>
  <path d="M260 86 L260 106" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="130" y="108" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2f4a66" text-anchor="middle">
    <text x="260" y="127">遍历每个价格 p：</text>
    <text x="260" y="145">p &lt; m₁ → m₂←m₁, m₁←p；否则 m₂←min(m₂, p)</text>
  </g>
  <path d="M260 154 L260 176" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="260,178 356,214 260,250 164,214" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">m₁ + m₂</text>
  <text x="260" y="228" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">≤ money ?</text>

  <path d="M164 214 L92 214 L92 258" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="118" y="204" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="22" y="260" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="278" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">买！</text>
  <text x="92" y="293" text-anchor="middle" font-size="11.5" fill="#2f5527" filter="url(#rough2)">返回 money − m₁ − m₂</text>

  <path d="M356 214 L428 214 L428 258" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="382" y="204" font-size="12.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="358" y="260" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="428" y="278" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">两块都买不起</text>
  <text x="428" y="293" text-anchor="middle" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">原封不动返回 money</text>

  <rect x="40" y="196" width="104" height="54" rx="8" fill="#eef0f2" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="92" y="215" text-anchor="middle">prices[i] ≤ 100，</text>
    <text x="92" y="230" text-anchor="middle">初值 101 = +∞</text>
    <text x="92" y="244" text-anchor="middle">不会误当成真价格</text>
  </g>
</svg>
