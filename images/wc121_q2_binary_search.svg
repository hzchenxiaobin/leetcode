<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">二分找右边界：pos 记录「最后一个 ≤ t」</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">pos = −1 表示没有可用记录，返回空串</text>
  <text x="30" y="76" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">桶内时间戳（升序）</text>
  <rect x="30" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="60.0" y="113.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="90" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="120.0" y="113.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="150" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="113.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="210" y="88" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="113.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="30" y="160" font-size="11.5" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">查询 t = 6：找最后一个 ≤ 6 的位置</text>
  <text x="30" y="200" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">lo=0, hi=3</text>
  <path d="M 60 148 L 60 132" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="188" y="148" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">mid</text>
  <path d="M 90 200 L 90 132" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="30" y="232" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">① mid=1 → t[1]=4 ≤ 6 → pos=1, lo=2</text>
  <text x="30" y="254" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">② mid=2 → t[2]=7 &gt; 6 → hi=1，结束</text>
  <text x="30" y="276" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">③ pos=1 → 返回 "bar"（t=6 时最近的历史是 4）</text>
  <rect x="380" y="88" width="150" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="390" y="108.5" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么不用 upper_bound</text><text x="390" y="123.725" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">手写「记录最后一个 ≤」</text><text x="390" y="138.95" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">更直观，也不易差一</text>
</svg>
