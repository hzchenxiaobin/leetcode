<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：从左到右扫描，命中即返回</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="66" rx="44" ry="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="71" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">开始</text>

  <path d="M 320 84 L 320 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i = 0 -->
  <g filter="url(#sk)">
    <rect x="268" y="106" width="104" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="127" text-anchor="middle" font-size="13" fill="#2b6e9e">令 i = 0</text>

  <path d="M 320 138 L 320 160" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="320,162 428,200 320,238 212,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="196" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">i mod 10</text>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">== nums[i] ?</text>

  <!-- yes: return i -->
  <path d="M 428 200 L 496 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="462" y="190" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="500" y="176" width="118" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="559" y="197" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">return i</text>
  <text x="559" y="215" text-anchor="middle" font-size="10" fill="#2e6e2e">首次命中即最小下标</text>

  <!-- no: i++ -->
  <path d="M 320 238 L 320 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="333" y="255" text-anchor="middle" font-size="12" fill="#a04040" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="276" y="264" width="88" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="285" text-anchor="middle" font-size="13" fill="#2b6e9e">i++</text>

  <path d="M 320 296 L 320 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="320,320 410,354 320,388 230,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="359" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">i &lt; n ?</text>

  <!-- loop back -->
  <path d="M 230 354 L 168 354 L 168 200 L 208 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="168" y="336" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">是</text>
  <text x="168" y="278" text-anchor="middle" font-size="10" fill="#889">继续扫描</text>

  <!-- no: return -1 -->
  <path d="M 320 388 L 320 406" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="402" text-anchor="middle" font-size="12" fill="#a04040" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="262" y="408" width="116" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="430" text-anchor="middle" font-size="13" fill="#a04040" font-weight="bold">return −1</text>
</svg>
