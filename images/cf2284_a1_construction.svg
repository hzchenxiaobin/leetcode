<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">构造：A 不动，B 沿 x 轴、C 沿 y 轴，恰好用满 n 步</text>

  <!-- 左侧坐标草图 -->
  <path d="M96,258 L286,258" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M96,258 L96,92" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="96,258 250,258 96,120" fill="#e8f0fe" stroke="#446688"
           stroke-width="2" filter="url(#rough2)"/>

  <circle cx="96" cy="258" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="250" cy="258" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="96" cy="120" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="80" y="277" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">A</text>
  <text x="262" y="278" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="74" y="112" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">C</text>

  <text x="118" y="252" font-size="12" fill="#446688" filter="url(#rough2)">(0,0)</text>
  <text x="192" y="244" font-size="12" fill="#446688" filter="url(#rough2)">(⌈n/2⌉,0)</text>
  <text x="106" y="140" font-size="12" fill="#446688" filter="url(#rough2)">(0,⌊n/2⌋)</text>

  <text x="173" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x 方向花 ⌈n/2⌉ 步</text>
  <text x="46" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">y 方向</text>
  <text x="46" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⌊n/2⌋ 步</text>

  <text x="180" y="327" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">S = ⌈n/2⌉ · ⌊n/2⌋ = ⌊n²/4⌋</text>

  <!-- 右侧流程 -->
  <rect x="360" y="60" width="238" height="44" rx="9" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 n（多测逐组处理）</text>

  <path d="M479,106 L479,140" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="360" y="144" width="238" height="62" rx="9" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B 的 x 加 1 重复 ⌈n/2⌉ 次</text>
  <text x="479" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C 的 y 加 1 重复 ⌊n/2⌋ 次</text>

  <path d="M479,208 L479,240" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="360" y="244" width="238" height="46" rx="9" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="479" y="273" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">输出 (n/2)·((n+1)/2)</text>

  <text x="479" y="322" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">⌈n/2⌉ + ⌊n/2⌋ = n，不多不少</text>
</svg>
