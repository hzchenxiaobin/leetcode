<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">一次扫描计数：先数 S ≢ 0 的子串，再扣交替串</text>

  <rect x="110" y="54" width="480" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="76" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">读入 n 与串 s，令 φ('0') = 1、φ('1') = 2</text>
  <text x="350" y="96" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">子串的 S 就是它的权值和 (mod 3)</text>

  <path d="M350,106 L350,120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="120" width="480" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="142" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">前缀和 P_i = φ(s_1) + … + φ(s_i) (mod 3)，含 P_0 = 0</text>
  <text x="350" y="162" text-anchor="middle" font-size="13" fill="#2b4a63" filter="url(#rough2)">一共 n + 1 个前缀点，区间 (l, r] 的 S = P_r − P_l</text>

  <path d="M350,172 L350,186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="186" width="480" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="208" text-anchor="middle" font-size="13" fill="#7d5a1c" filter="url(#rough2)">统计 cnt[0..2]：n + 1 个前缀点各残类出现几次</text>
  <text x="350" y="228" text-anchor="middle" font-size="13" fill="#7d5a1c" filter="url(#rough2)">S ≢ 0 ⟺ 两个前缀点残类不同</text>

  <path d="M350,238 L350,252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="252" width="480" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="274" text-anchor="middle" font-size="13" fill="#7d5a1c" filter="url(#rough2)">A = C(n + 1, 2) − Σ_k C(cnt[k], 2)</text>
  <text x="350" y="294" text-anchor="middle" font-size="13" fill="#7d5a1c" filter="url(#rough2)">所有前缀点对，减去落在同一残类的点对</text>

  <path d="M350,304 L350,318" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="318" width="480" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="340" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">在 s_i = s_{i+1} 处断开，得到极长交替块，块长 m</text>
  <text x="350" y="360" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">块内长度为 ℓ 的交替子串恰有 m − ℓ + 1 个</text>

  <path d="M350,370 L350,384" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="384" width="480" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="406" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">扣掉奇长 ≥ 3 的交替串：每个块减 q(m − q − 1)，q = ⌊(m − 1)/2⌋</text>
  <text x="350" y="428" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">答案 = A − Σ 块内扣减量；交替偶长 S ≡ 0，本来就不在 A 里</text>
</svg>
