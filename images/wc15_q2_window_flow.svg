<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L1,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：右指针扩张，0 超过 1 个就收缩左指针</text>

  <rect x="140" y="40" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化窗口</text>
  <text x="280" y="75" text-anchor="middle" font-size="11" fill="#555">left = 0, zeros = 0, ans = 0</text>

  <path d="M 280 84 L 280 100" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="140" y="100" width="280" height="38" fill="#f0f0f0" stroke="#888" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">right 从 0 遍历到 n-1</text>

  <path d="M 280 138 L 280 154" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="100" y="154" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="11.5" fill="#3a5a30">x = nums[right]（窗口右端纳入 x）</text>
  <text x="280" y="193" text-anchor="middle" font-size="11.5" fill="#3a5a30">若 x == 0 则 zeros += 1</text>

  <path d="M 280 206 L 280 222" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="100" y="222" width="360" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">while zeros &gt; 1：（内层收缩，可执行多次）</text>
  <text x="280" y="261" text-anchor="middle" font-size="11" fill="#8a6a20">若 nums[left] == 0 则 zeros -= 1，然后 left += 1</text>
  <text x="280" y="276" text-anchor="middle" font-size="9.5" fill="#b85450">必须先判断再右移，否则漏减计数</text>

  <path d="M 280 280 L 280 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="100" y="296" width="360" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">ans = max(ans, right - left + 1)</text>
  <text x="280" y="333" text-anchor="middle" font-size="10" fill="#8a3a36">此时窗口必然合法，长度可直接作为候选</text>

  <path d="M 280 346 L 280 362" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="190" y="362" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <path d="M 460 320 L 522 320 L 522 119 L 426 119" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="6,3" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="534" y="222" font-size="10" fill="#888" font-style="italic" transform="rotate(-90 534 222)">取下一个 right</text>
</svg>
