<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">有序集合的后继查询与环形回绕（k = 5）</text>

  <!-- 场景 A：直接命中 -->
  <text x="170" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">场景 A：free = {1, 3, 4}，i % k = 2</text>
  <g filter="url(#rough2)">
    <circle cx="60" cy="130" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="118" cy="130" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="176" cy="130" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="234" cy="130" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="292" cy="130" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="135">0</text>
    <text x="118" y="135">1</text>
    <text x="176" y="135" fill="#b85450">2</text>
    <text x="234" y="135" fill="#2d5a22">3</text>
    <text x="292" y="135">4</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="60" y="162" fill="#b85450">忙</text>
    <text x="118" y="162" fill="#4a7a3a">空闲</text>
    <text x="176" y="162" fill="#b85450">忙（i%k）</text>
    <text x="234" y="162" fill="#4a7a3a">空闲</text>
    <text x="292" y="162" fill="#4a7a3a">空闲</text>
  </g>
  <path d="M 193 130 L 213 130" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="176" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">从 2 顺时针找</text>
  <text x="176" y="192" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">lower_bound(2) = 3 → 分配服务器 3</text>

  <!-- 场景 B：回绕 -->
  <text x="440" y="66" text-anchor="middle" font-size="13" fill="#b8860b" font-weight="bold" filter="url(#rough2)">场景 B：free = {0, 2}，i % k = 3</text>
  <circle cx="445" cy="185" r="50" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="445" cy="135" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="493" cy="169" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="474" cy="226" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="416" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="397" cy="169" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="445" y="140" fill="#2d5a22">0</text>
    <text x="493" y="174">1</text>
    <text x="474" y="231" fill="#2d5a22">2</text>
    <text x="416" y="231" fill="#b85450">3</text>
    <text x="397" y="174">4</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="472" y="116">空闲</text>
    <text x="524" y="162">忙</text>
    <text x="474" y="252">空闲</text>
    <text x="404" y="252" fill="#b85450">忙（i%k）</text>
    <text x="368" y="160">忙</text>
  </g>
  <path d="M 400 216 C 372 200, 382 158, 421 143" fill="none" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="440" y="280" text-anchor="middle" font-size="11.5" fill="#b8860b" font-weight="bold" filter="url(#rough2)">lower_bound(3) 落空 → 回绕</text>
  <text x="440" y="298" text-anchor="middle" font-size="11.5" fill="#b8860b" font-weight="bold" filter="url(#rough2)">取 begin() = 0 → 分配服务器 0</text>

  <!-- 底部：规则对照 -->
  <g filter="url(#rough2)">
    <rect x="50" y="306" width="460" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="330">题面规则：优先 i%k；若忙，沿环顺时针找下一台空闲（可从 0 绕回）</text>
    <text x="280" y="354">有序集合实现：lower_bound(i%k) 给出「编号 ≥ i%k 的最小空闲」</text>
    <text x="280" y="378">end() 时取 begin() ⇔ 绕回编号最小的空闲服务器</text>
    <text x="280" y="398" font-weight="bold" fill="#b8860b">两种情况合并 = 环上顺时针第一台空闲，单次 O(log k)</text>
  </g>
</svg>
