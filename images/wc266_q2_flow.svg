<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="20" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，元音位置累加贡献</text>
  <text x="320" y="38" text-anchor="middle" font-size="11" fill="#666666">n = word.length；ans 必须 64 位：n = 10⁵ 全元音时 ≈ 1.67×10¹⁴</text>

  <g filter="url(#sk)">
    <rect x="46" y="56" width="150" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="121" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">ans = 0（long long）</text>
  <text x="121" y="90" text-anchor="middle" font-size="11" fill="#2b6e9e">i = 0</text>

  <path d="M196,78 L208,78" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="290,50 368,78 290,106 212,78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="290" y="74" text-anchor="middle" font-size="11" fill="#8a6415">word[i] 是元音？</text>
  <text x="290" y="88" text-anchor="middle" font-size="9" fill="#999999">∈ {a, e, i, o, u}</text>

  <path d="M368,78 L392,78" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="378" y="70" font-size="10" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="400" y="62" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="460" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">贡献 0，跳过</text>

  <path d="M290,106 L290,124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="298" y="118" font-size="10" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="214" y="128" width="152" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="290" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans += (long long)</text>
  <text x="290" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(i+1) × (n−i)</text>

  <path d="M290,176 L290,190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="234" y="194" width="112" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="290" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i++</text>

  <path d="M290,226 L290,238" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="290,242 358,270 290,298 222,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="290" y="274" text-anchor="middle" font-size="11.5" fill="#8a6415">i &lt; n ?</text>

  <path d="M222,270 L64,270 L64,78 L206,78" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="216" y="262" font-size="10" fill="#2e6e2e">是</text>
  <text x="130" y="262" font-size="10" fill="#888888">下一个 i</text>

  <path d="M358,270 L392,270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="262" font-size="10" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="396" y="252" width="130" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="461" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return ans</text>

  <path d="M460,94 L460,210 L352,210" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="150" font-size="9.5" fill="#888888">跳过后同样 i++</text>

  <g filter="url(#sk)">
    <rect x="36" y="318" width="568" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">时间 O(n)：每个位置一次 O(1) 元音判定 + 至多一次乘加；空间 O(1)</text>
  <text x="320" y="356" text-anchor="middle" font-size="10.5" fill="#555555">C++ 陷阱：(long long)(i+1) × (n−i) 先转型再乘——两个 int 直接相乘已经溢出</text>
</svg>
