<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="490" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：AND = x ⇒ 每个元素都是 x 的超集</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- x bit structure -->
  <text x="276" y="88" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">x = 4 =</text>
  <g filter="url(#sk)">
    <rect x="286" y="62" width="48" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="340" y="62" width="48" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="394" y="62" width="48" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <rect x="448" y="62" width="48" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
  </g>
  <text x="310" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">0</text>
  <text x="364" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="418" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">0</text>
  <text x="472" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">0</text>
  <text x="310" y="122" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="364" y="122" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="418" y="122" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="472" y="122" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="364" y="54" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">x 的 1 位 → 锁定</text>
  <text x="445" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">x 的 0 位 → 自由插槽（可 0 可 1）</text>
  <text x="540" y="90" text-anchor="middle" font-size="15" fill="#999">⋯</text>

  <!-- array [4,5,6] rows -->
  <text x="276" y="182" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">4 =</text>
  <g filter="url(#sk)">
    <rect x="286" y="160" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="340" y="160" width="48" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="394" y="160" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="160" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="310" y="185" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="364" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="418" y="185" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="472" y="185" text-anchor="middle" font-size="14" fill="#666">0</text>

  <text x="276" y="230" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">5 =</text>
  <g filter="url(#sk)">
    <rect x="286" y="208" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="340" y="208" width="48" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="394" y="208" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="208" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="310" y="233" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="364" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="418" y="233" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="472" y="233" text-anchor="middle" font-size="14" fill="#666">1</text>

  <text x="276" y="278" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">6 =</text>
  <g filter="url(#sk)">
    <rect x="286" y="256" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="340" y="256" width="48" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="394" y="256" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
    <rect x="448" y="256" width="48" height="40" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="310" y="281" text-anchor="middle" font-size="14" fill="#666">0</text>
  <text x="364" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="418" y="281" text-anchor="middle" font-size="14" fill="#666">1</text>
  <text x="472" y="281" text-anchor="middle" font-size="14" fill="#666">0</text>

  <!-- lock column bracket -->
  <g filter="url(#sk)">
    <path d="M 258 166 Q 250 216 258 292" stroke="#4a8edb" stroke-width="1.6" fill="none"/>
  </g>
  <text x="234" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">锁定位全为 1</text>

  <!-- AND row -->
  <text x="276" y="332" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450">AND =</text>
  <g filter="url(#sk)">
    <rect x="286" y="308" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="340" y="308" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="394" y="308" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="448" y="308" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="310" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>
  <text x="364" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>
  <text x="418" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>
  <text x="472" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">0</text>
  <text x="545" y="335" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">= x ✓</text>
  <text x="400" y="368" text-anchor="middle" font-size="11.5" fill="#666">自由位只要有一行是 0，AND 就归 0 —— 取 i=0 的元素（x 本身）即可全部归 0</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="56" y="384" width="528" height="96" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">x 的 1 位：每个元素都必须为 1 → AND 后仍是 1（元素 ⊇ x）</text>
  <text x="320" y="434" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">x 的 0 位：第 1 个元素取 x 本身 → 自由位全 0 → AND 归 0</text>
  <text x="320" y="464" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">⟹ 合法元素 ⟺ x 的超集；最小末元素 = x 的超集从小到大第 n 个</text>
</svg>
