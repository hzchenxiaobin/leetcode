<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：words 逐词判定（s = "abc"）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="70" y="52" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="52" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="52" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="426" y="52" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="115" y="73">words[i]</text>
    <text x="219" y="73">长度 ≤ 3？</text>
    <text x="350" y="73">与 s 前缀比对</text>
    <text x="466" y="73">是前缀？</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="70" y="94" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="94" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="94" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="94" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="115">"a"</text><text x="219" y="115">✓</text>
    <text x="350" y="115">"a" == "a"</text>
    <text x="466" y="115" fill="#2d5a22" font-weight="bold">✅ +1</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="70" y="132" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="132" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="132" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="132" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="153">"b"</text><text x="219" y="153">✓</text>
    <text x="350" y="153">"b" ≠ "a"</text>
    <text x="466" y="153" fill="#8a3a36">❌</text>
  </g>

  <!-- 行 3 -->
  <g filter="url(#rough2)">
    <rect x="70" y="170" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="170" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="170" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="170" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="191">"c"</text><text x="219" y="191">✓</text>
    <text x="350" y="191">"c" ≠ "a"</text>
    <text x="466" y="191" fill="#8a3a36">❌</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="70" y="208" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="208" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="208" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="208" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="229">"ab"</text><text x="219" y="229">✓</text>
    <text x="350" y="229">"ab" == "ab"</text>
    <text x="466" y="229" fill="#2d5a22" font-weight="bold">✅ +1</text>
  </g>

  <!-- 行 5 -->
  <g filter="url(#rough2)">
    <rect x="70" y="246" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="246" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="246" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="246" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="267">"bc"</text><text x="219" y="267">✓</text>
    <text x="350" y="267">"bc" ≠ "ab"</text>
    <text x="466" y="267" fill="#8a3a36">❌</text>
  </g>

  <!-- 行 6 -->
  <g filter="url(#rough2)">
    <rect x="70" y="284" width="90" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="164" y="284" width="110" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="280" y="284" width="140" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="426" y="284" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="115" y="305">"abc"</text><text x="219" y="305">✓</text>
    <text x="350" y="305">"abc" == "abc"</text>
    <text x="466" y="305" fill="#2d5a22" font-weight="bold">✅ +1</text>
  </g>

  <!-- 结论 -->
  <rect x="150" y="330" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">ans = 3 ✓（与官方输出一致）</text>
</svg>
