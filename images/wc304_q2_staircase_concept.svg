<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">人数严格递增 ⇒ k 组至少 1+2+3+…+k 人</text>

  <text x="96" y="74" font-size="12" fill="#b85450"
        filter="url(#rough2)">↗ 每组人数严格递增</text>

  <rect x="88" y="212" width="40" height="40" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="138" y="172" width="40" height="40" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="138" y="212" width="40" height="40" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="188" y="132" width="40" height="40" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="172" width="40" height="40" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="212" width="40" height="40" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="238" y="92" width="40" height="40" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="132" width="40" height="40" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="172" width="40" height="40" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="238" y="212" width="40" height="40" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 74 254 L 296 254" stroke="#888" stroke-width="1.5"
        stroke-linecap="round" filter="url(#rough2)"/>

  <text x="108" y="276" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">组1 · 1人</text>
  <text x="158" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">组2 · 2人</text>
  <text x="208" y="276" text-anchor="middle" font-size="12" fill="#a07820"
        filter="url(#rough2)">组3 · 3人</text>
  <text x="258" y="276" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">组4 · 4人</text>

  <text x="185" y="304" text-anchor="middle" font-size="13" fill="#446688"
        filter="url(#rough2)">1 + 2 + 3 + 4 = 10 人</text>
  <text x="185" y="322" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">（k = 4 组所需的最少总人数）</text>

  <rect x="318" y="96" width="182" height="118" rx="9" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="409" y="124" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#a07820" filter="url(#rough2)">三角数不等式</text>
  <text x="409" y="152" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">k(k+1)/2 ≤ n</text>
  <text x="409" y="178" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">k = ⌊(√(8n+1) − 1)/2⌋</text>
  <text x="409" y="202" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">答案只依赖人数 n</text>

  <text x="260" y="350" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">n = 10⁵ ⇒ k = 446（446×447÷2 = 99861 ≤ 10⁵）</text>
</svg>
