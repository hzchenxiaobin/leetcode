<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例单走查：arr = [6, 2, 4]，答案为 32</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行的「动作」就是一次弹栈结算；「栈」从底到顶书写</text>

  <g filter="url(#rough2)">
    <rect x="34" y="66" width="492" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="60" y="86" text-anchor="middle" font-size="10.5" fill="#3a5a30">步</text>
    <text x="110" y="86" text-anchor="middle" font-size="10.5" fill="#3a5a30">读入</text>
    <text x="248" y="86" text-anchor="middle" font-size="10.5" fill="#3a5a30">动作</text>
    <text x="396" y="86" text-anchor="middle" font-size="10.5" fill="#3a5a30">累计</text>
    <text x="480" y="86" text-anchor="middle" font-size="10.5" fill="#3a5a30">栈（底→顶）</text>

    <rect x="34" y="96" width="492" height="30" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/>
    <text x="60" y="116" text-anchor="middle" font-size="10.5" fill="#555">1</text>
    <text x="110" y="116" text-anchor="middle" font-size="10.5" fill="#555">6</text>
    <text x="162" y="116" font-size="10.5" fill="#555">栈顶 ∞ &gt; 6 → 直接压栈</text>
    <text x="396" y="116" text-anchor="middle" font-size="10.5" fill="#555">0</text>
    <text x="480" y="116" text-anchor="middle" font-size="10.5" fill="#555">∞  6</text>

    <rect x="34" y="126" width="492" height="30" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/>
    <text x="60" y="146" text-anchor="middle" font-size="10.5" fill="#555">2</text>
    <text x="110" y="146" text-anchor="middle" font-size="10.5" fill="#555">2</text>
    <text x="162" y="146" font-size="10.5" fill="#555">栈顶 6 &gt; 2 → 直接压栈</text>
    <text x="396" y="146" text-anchor="middle" font-size="10.5" fill="#555">0</text>
    <text x="480" y="146" text-anchor="middle" font-size="10.5" fill="#555">∞  6  2</text>

    <rect x="34" y="156" width="492" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="60" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">3</text>
    <text x="110" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">4</text>
    <text x="162" y="176" font-size="10.5" fill="#8a6a20">弹 2：2 × min(6, 4) = 8</text>
    <text x="396" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">8</text>
    <text x="480" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">∞  6  4</text>

    <rect x="34" y="186" width="492" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="60" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">4</text>
    <text x="110" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">收尾</text>
    <text x="162" y="206" font-size="10.5" fill="#8a6a20">弹 4：4 × 6 = 24</text>
    <text x="396" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">32</text>
    <text x="480" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">∞  6</text>

    <rect x="34" y="216" width="492" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="60" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30">5</text>
    <text x="110" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30">结束</text>
    <text x="162" y="236" font-size="10.5" fill="#3a5a30">栈只剩哨兵与最大值 6 → 返回 32</text>
    <text x="396" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30">32</text>
    <text x="480" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30">∞  6</text>

    <path d="M 78 66 L 78 246" stroke="#9aa8b8" stroke-width="1"/>
    <path d="M 142 66 L 142 246" stroke="#9aa8b8" stroke-width="1"/>
    <path d="M 368 66 L 368 246" stroke="#9aa8b8" stroke-width="1"/>
    <path d="M 424 66 L 424 246" stroke="#9aa8b8" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="34" y="266" width="492" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="48" y="288" font-size="10.5" fill="#3a4a66">第 3 步：2 的左右最近 ≥ 邻居是 6 与 4，取较小的 4 → 贡献 2 × 4 = 8</text>
    <text x="48" y="310" font-size="10.5" fill="#3a4a66">第 4 步：4 只有左侧邻居 6（右侧记为 ∞）→ 贡献 4 × 6 = 24</text>
    <text x="48" y="332" font-size="10.5" fill="#3a4a66">合计 8 + 24 = 32 = 方案 B 的代价，说明这两次合并正是最优树的两个内部节点</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">对照方案 A（先并 6,2）：12 + 24 = 36，比 32 贵 —— 因为让 2 去「吸收」更大的 6 反而更亏</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 2：arr = [4, 11] → 只有一次合并，4 × 11 = 44</text>
  <text x="280" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n = 40 时每个内部节点 ≤ 15 × 15，最多 39 个 → 答案 ≤ 8775（全 15 时取到）</text>
</svg>
