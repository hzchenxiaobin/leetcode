<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">优化：状态按「结尾值」压缩，每层只留最优与次优</text>

  <text x="40" y="66" font-size="12" fill="#333" filter="url(#rough2)">f[值][j]：以该值结尾的最长长度</text>
  <text x="424" y="66" font-size="12" fill="#333" filter="url(#rough2)">每层 top1 / top2</text>

  <!-- 左表 -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <rect x="40" y="80" width="360" height="128" rx="4"/>
    <path d="M 40 112 L 400 112"/>
    <path d="M 40 144 L 400 144"/>
    <path d="M 40 176 L 400 176"/>
    <path d="M 140 80 L 140 208"/>
    <path d="M 230 80 L 230 208"/>
    <path d="M 320 80 L 320 208"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="90" y="102">值</text>
    <text x="185" y="102">j = 0</text>
    <text x="275" y="102">j = 1</text>
    <text x="360" y="102">j = 2</text>
    <text x="90" y="134">1</text>
    <text x="185" y="134">3</text>
    <text x="275" y="134">3</text>
    <text x="360" y="134">4</text>
    <text x="90" y="166">2</text>
    <text x="185" y="166">1</text>
    <text x="275" y="166">2</text>
    <text x="360" y="166">2</text>
    <text x="90" y="198">3</text>
    <text x="185" y="198">1</text>
    <text x="275" y="198">4</text>
    <text x="360" y="198">4</text>
  </g>

  <!-- 右侧 top -->
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <text x="424" y="100">j = 1：top1 = 4（值 3）</text>
    <text x="424" y="124">　　　 top2 = 3（值 1）</text>
    <text x="424" y="156">j = 2：top1 = 4（值 1）</text>
    <text x="424" y="180">　　　 top2 = 4（值 3）</text>
  </g>

  <rect x="40" y="230" width="560" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="261" text-anchor="middle" font-size="12" fill="#a06c10" filter="url(#rough2)">f[x][j] = max( f[x][j] + 1,　topOther[j−1] + 1,　1 )</text>

  <rect x="40" y="294" width="560" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">topOther[j−1]：若 top1 所属值 ≠ x 就取 top1，</text>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#2d5a22" filter="url(#rough2)">否则退而取「来自其他值」的 top2 —— 这样 O(1) 就得到 max over y ≠ x</text>

  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">状态数 ≤ 不同值个数 × (k+1) ≤ n(k+1)，每次转移 O(1) → 总时间 O(nk)</text>
  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">n = 5000、k = 50 时约 2.6×10⁵ 次更新，远小于 O(n²k)</text>
</svg>
