<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="392" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 的 DFS 走查：每个节点算一次"以它为终点的最优特殊路径"</text>
  <text filter="url(#rough2)" x="290" y="44" text-anchor="middle" font-size="10.6" fill="#888">edges = [[0,1,2],[1,2,3],[1,3,5],[1,4,4],[2,5,6]]，nums = [2,1,2,1,3,1]</text>

  <g filter="url(#rough2)">
    <rect x="24" y="56" width="532" height="26" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="9.8" font-weight="bold" fill="#334">
    <text x="34" y="74">进入节点</text>
    <text x="108" y="74">深度 d / pref</text>
    <text x="212" y="74">low</text>
    <text x="252" y="74">区间最小 pref@d</text>
    <text x="368" y="74">长度</text>
    <text x="424" y="74">节点数</text>
    <text x="482" y="74">全局最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="84" width="532" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="116" width="532" height="30" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="148" width="532" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="180" width="532" height="30" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="212" width="532" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="24" y="244" width="532" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#333">
    <text x="34" y="103">0（值 2）</text>
    <text x="108" y="103">d=0　pref 0</text>
    <text x="212" y="103">−1</text>
    <text x="252" y="103">[0,0] → 0@0</text>
    <text x="368" y="103">0</text>
    <text x="424" y="103">1</text>
    <text x="482" y="103">[0, 1]</text>

    <text x="34" y="135">1（值 1）</text>
    <text x="108" y="135">d=1　pref 2</text>
    <text x="212" y="135">−1</text>
    <text x="252" y="135">[0,1] → 0@0</text>
    <text x="368" y="135">2</text>
    <text x="424" y="135">2</text>
    <text x="482" y="135">[2, 2]</text>

    <text x="34" y="167">2（值 2）</text>
    <text x="108" y="167">d=2　pref 5</text>
    <text x="212" y="167" fill="#b85450">0†</text>
    <text x="252" y="167">[1,2] → 2@1</text>
    <text x="368" y="167">3</text>
    <text x="424" y="167">2</text>
    <text x="482" y="167">[3, 2]</text>

    <text x="34" y="199">5（值 1）</text>
    <text x="108" y="199">d=3　pref 11</text>
    <text x="212" y="199" fill="#b85450">1†</text>
    <text x="252" y="199" fill="#3a5a30">[2,3] → 5@2</text>
    <text x="368" y="199" fill="#3a5a30" font-weight="bold">6</text>
    <text x="424" y="199" fill="#3a5a30" font-weight="bold">2</text>
    <text x="482" y="199" fill="#3a5a30" font-weight="bold">[6, 2]</text>

    <text x="34" y="231">3（值 1）</text>
    <text x="108" y="231">d=2　pref 7</text>
    <text x="212" y="231" fill="#b85450">1†</text>
    <text x="252" y="231">[2,2] → 7@2</text>
    <text x="368" y="231">0</text>
    <text x="424" y="231">1</text>
    <text x="482" y="231">[6, 2]</text>

    <text x="34" y="263">4（值 3）</text>
    <text x="108" y="263">d=2　pref 6</text>
    <text x="212" y="263">−1</text>
    <text x="252" y="263">[0,2] → 0@0</text>
    <text x="368" y="263">6</text>
    <text x="424" y="263">3</text>
    <text x="482" y="263">[6, 2]</text>
  </g>

  <text filter="url(#rough2)" x="34" y="290" font-size="9.8" fill="#666">查询区间是 [low+1, 当前深度]；† 表示该值已在本条根路径上出现，low 被抬高到它上次出现的深度。</text>
  <text filter="url(#rough2)" x="34" y="306" font-size="9.8" fill="#666">"区间最小 pref@d" 的第一个数是区间内最小 pref，第二个数 @d 是取到它的最右深度（节点数由此最小）。</text>

  <rect x="24" y="316" width="532" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="40" y="337" font-size="10.4" fill="#8a6a20">两条长度 6 的路径：2→5（2 个节点，值 2,1）与 0→1→4（3 个节点，值 2,1,3）⇒ 取节点数更少的 2</text>

  <rect x="24" y="356" width="532" height="30" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="40" y="376" font-size="10.4" fill="#444">节点 4 的 low 仍为 −1：回溯已把 last[2] 还原成 0，所以它能一路接回根节点。</text>
</svg>
