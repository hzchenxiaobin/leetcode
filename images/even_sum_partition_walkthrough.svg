<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [10,10,3,7,6]，S = 36（偶）→ 4 个切分全满足</text>
  <path d="M 240 46 Q 470 54 700 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 数组与切分点 ===== -->
  <g filter="url(#sk)">
    <rect x="323" y="80" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="383" y="80" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="443" y="80" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="503" y="80" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="563" y="80" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="350" y="105">10</text>
    <text x="410" y="105">10</text>
    <text x="470" y="105">3</text>
    <text x="530" y="105">7</text>
    <text x="590" y="105">6</text>
  </g>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="380.5" y1="74" x2="380.5" y2="126"/>
    <line x1="440.5" y1="74" x2="440.5" y2="126"/>
    <line x1="500.5" y1="74" x2="500.5" y2="126"/>
    <line x1="560.5" y1="74" x2="560.5" y2="126"/>
  </g>
  <text x="648" y="98" font-size="11" fill="#a04038">4 个切分点</text>
  <text x="648" y="116" font-size="11" fill="#a04038">i = 0, 1, 2, 3</text>

  <!-- ===== 演算表：表头 ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="150" width="110" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="150" width="250" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="450" y="150" width="250" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="700" y="150" width="150" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2f4f6f" text-anchor="middle">
    <text x="145" y="174">切分点 i</text>
    <text x="325" y="174">左 [0..i]（和 L）</text>
    <text x="575" y="174">右 [i+1..4]（和 R）</text>
    <text x="775" y="174">差 D = L−R</text>
  </g>

  <!-- 演算表：数据行 -->
  <g filter="url(#sk)">
    <rect x="90" y="196" width="110" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="196" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="450" y="196" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="700" y="196" width="150" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="145" y="224">i = 0</text>
    <text x="325" y="224">[10]（L = 10）</text>
    <text x="575" y="224">[10, 3, 7, 6]（R = 26）</text>
    <text x="775" y="224" font-weight="bold" fill="#2e5e2e">−16 ✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="90" y="248" width="110" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="248" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="450" y="248" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="700" y="248" width="150" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="145" y="276">i = 1</text>
    <text x="325" y="276">[10, 10]（L = 20）</text>
    <text x="575" y="276">[3, 7, 6]（R = 16）</text>
    <text x="775" y="276" font-weight="bold" fill="#2e5e2e">4 ✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="90" y="300" width="110" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="300" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="450" y="300" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="700" y="300" width="150" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="145" y="328">i = 2</text>
    <text x="325" y="328">[10, 10, 3]（L = 23）</text>
    <text x="575" y="328">[7, 6]（R = 13）</text>
    <text x="775" y="328" font-weight="bold" fill="#2e5e2e">10 ✓</text>
  </g>

  <g filter="url(#sk)">
    <rect x="90" y="352" width="110" height="46" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="352" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="450" y="352" width="250" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="700" y="352" width="150" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="145" y="380">i = 3</text>
    <text x="325" y="380">[10, 10, 3, 7]（L = 30）</text>
    <text x="575" y="380">[6]（R = 6）</text>
    <text x="775" y="380" font-weight="bold" fill="#2e5e2e">24 ✓</text>
  </g>

  <!-- ===== 结论框 ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="420" width="760" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="470" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">S = 36 为偶数 ⇒ 每个 D 都为偶数 ⇒ 答案 = n − 1 = 4</text>
  <text x="470" y="470" text-anchor="middle" font-size="11" fill="#2e5e2e">（n = 5，切分点 i ∈ {0,1,2,3}，两侧都非空）</text>

  <!-- ===== 示例 2 对照 ===== -->
  <g filter="url(#sk)">
    <rect x="90" y="506" width="760" height="104" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="110" y="532" font-size="13" font-weight="bold" fill="#a04038">示例 2：nums = [1, 2, 2]，S = 5（奇数）</text>
  <text x="110" y="558" font-size="12" fill="#a04038">i = 0：D = 1 − 4 = −3（奇）；i = 1：D = 3 − 2 = 1（奇）—— 全为奇数</text>
  <text x="110" y="586" font-size="12" font-weight="bold" fill="#a04038">没有任何切分满足 ⇒ 答案 = 0</text>
</svg>
