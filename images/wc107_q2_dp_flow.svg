<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="386" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">线性 DP：ones 与 flips 两个状态量</text>
  <rect x="230" y="54" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="76.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ones = 0, flips = 0</text>
  <polygon points="330 105.0 415.0 130 330 155.0 245.0 130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="134.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c == '1' ?</text>
  <rect x="40" y="182" width="170" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="207.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ones += 1</text>
  <polygon points="400 175.0 515.0 202 400 229.0 285.0 202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="206.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遇到 0：flips = min(flips+1, ones)</text>
  <rect x="240" y="274" width="180" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="296.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 flips</text>
  <path d="M 330 90 L 330 104" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 152 L 130 180" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 390 152 L 400 176" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 400 229 L 340 272" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="268" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <text x="430" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">ones 是「把左侧全变 0 的代价」，flips 是「已处理前缀的最小翻转数」</text>
  <text x="330" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两者取 min 即完成一次「把当前 0 留在右侧 / 把左侧 1 全翻掉」的抉择</text>
</svg>
