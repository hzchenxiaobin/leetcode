<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 316"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="316" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">X 是合法组大小 ⇔ X 整除每种牌的张数</text>
  <rect x="60" y="72" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="98.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">牌 1：2 张</text>
  <rect x="190" y="72" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="98.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">牌 2：2 张</text>
  <rect x="320" y="72" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375.0" y="98.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">牌 3：2 张</text>
  <rect x="450" y="72" width="110" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505.0" y="98.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">牌 4：2 张</text>
  <path d="M 180,116 L 240,168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300,116 L 300,168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400,116 L 360,168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="172" width="200" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="201.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">gcd(2,2,2,2) = 2</text>
  <path d="M 420,197 L 468,197" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="468" y="172" width="150" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543.0" y="201.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">X = 2，可行</text>
  <text x="330" y="262" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">反例：张数为 3 与 2 时 gcd = 1，任何 X ≥ 2 都不能整除两边 → 无解</text>
  <text x="330" y="296" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">因此只需判断所有频次的 gcd 是否 ≥ 2</text>
</svg>
