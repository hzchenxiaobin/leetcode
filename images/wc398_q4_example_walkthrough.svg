<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="490" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：k = 1 的四条方案，按 (x, y) 分解</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">同一 (x, y) 的多条方案，区别只在「D 插在哪个空档」——这正是 C(x+1, y) 所数的东西</text>

  <!-- x = 0 -->
  <rect x="40" y="58" width="480" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="54" y="82" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">x = 0：y = 2⁰ − 1 = 0</text>
  <text x="54" y="106" font-size="11" fill="#333" filter="url(#r)">空序列——0 次操作也是一条方案，起点 1 即终点</text>
  <rect x="408" y="76" width="100" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="458" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#r)">C(1,0) = 1</text>

  <!-- x = 1 -->
  <rect x="40" y="130" width="480" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="54" y="154" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">x = 1：y = 2¹ − 1 = 1 —— 2 个空档选 1 个放 D</text>
  <rect x="54" y="164" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="64" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D</text>
  <rect x="78" y="164" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="88" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">U</text>
  <text x="106" y="178" font-size="11" fill="#333" filter="url(#r)">1→0→1</text>
  <rect x="190" y="164" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="200" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">U</text>
  <rect x="214" y="164" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="224" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D</text>
  <text x="242" y="178" font-size="11" fill="#333" filter="url(#r)">1→2→1</text>
  <rect x="408" y="148" width="100" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="458" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#r)">C(2,1) = 2</text>

  <!-- x = 2 -->
  <rect x="40" y="210" width="480" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="54" y="234" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">x = 2：y = 2² − 1 = 3 —— 3 个空档全放 D</text>
  <rect x="54" y="244" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="64" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D</text>
  <rect x="78" y="244" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="88" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">U</text>
  <rect x="102" y="244" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="112" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D</text>
  <rect x="126" y="244" width="20" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="136" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">U</text>
  <rect x="150" y="244" width="20" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="160" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">D</text>
  <text x="182" y="258" font-size="11" fill="#333" filter="url(#r)">1→0→1→0→2→1</text>
  <rect x="408" y="228" width="100" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="458" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#r)">C(3,3) = 1</text>

  <!-- x = 3 -->
  <rect x="40" y="290" width="480" height="56" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#r)"/>
  <text x="54" y="312" font-size="12" font-weight="bold" fill="#999" filter="url(#r)">x = 3：y = 2³ − 1 = 7 &gt; x+1 = 4</text>
  <text x="54" y="334" font-size="11" fill="#888" filter="url(#r)">向下配额超出空档数，没有合法排布；更大的 x 同理，枚举自然终止</text>
  <rect x="408" y="304" width="100" height="28" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.2" filter="url(#r)"/>
  <text x="458" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999" filter="url(#r)">贡献 0</text>

  <!-- 求和 -->
  <rect x="40" y="356" width="480" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#r)">ans = 1 + 2 + 1 + 0 = 4 ✓</text>
  <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">顺手验证：k=0 → C(1,1)+C(2,2) = 1+1 = 2 ✓；k=2 → C(2,0)+C(3,2) = 1+3 = 4 ✓</text>

  <text x="280" y="436" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">x=1 的两条路径 = 「D 放空₀」（D,U）与「D 放空₁」（U,D）——空档选择与序列一一对应</text>
  <text x="280" y="456" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">口径自检：每条方案都以「位于 1」结尾；中途路过 1 只是中间态，离开再回来是更长序列、算新方案</text>
  <text x="280" y="478" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">U = 操作②（向上跳 2^jump），D = 操作①（向下走 1 级）</text>
</svg>
