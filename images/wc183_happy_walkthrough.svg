<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：a=1, b=1, c=7 → "ccaccbcc"（长度 8）</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">每步弹堆顶（剩余最多者）；c 被 "cc" 阻塞时，切换次顶 a / b 当分隔符</text>

  <!-- 表头 -->
  <text x="64" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">步</text>
  <text x="180" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">放前剩余 a/b/c</text>
  <text x="330" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">尾部两位</text>
  <text x="440" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">决策</text>
  <text x="548" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">结果</text>
  <path d="M 40 100 H 600" stroke="#c8c8c8" stroke-width="1.2" filter="url(#r)"/>

  <!-- 高亮行：第3、6步（切换），第9步（停机） -->
  <g filter="url(#r)">
    <rect x="40" y="130" width="560" height="30" rx="4" fill="#fff8e1"/>
    <rect x="40" y="232" width="560" height="30" rx="4" fill="#fff8e1"/>
    <rect x="40" y="368" width="560" height="30" rx="4" fill="#fce4ec"/>
  </g>

  <g font-size="12" fill="#333">
    <text x="64" y="150" text-anchor="middle" filter="url(#r)">1</text>
    <text x="180" y="150" text-anchor="middle" filter="url(#r)">1, 1, 7</text>
    <text x="330" y="150" text-anchor="middle" fill="#888" filter="url(#r)">—</text>
    <text x="440" y="150" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="150" filter="url(#r)">"c"</text>

    <text x="64" y="184" text-anchor="middle" filter="url(#r)">2</text>
    <text x="180" y="184" text-anchor="middle" filter="url(#r)">1, 1, 6</text>
    <text x="330" y="184" text-anchor="middle" filter="url(#r)">c</text>
    <text x="440" y="184" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="184" filter="url(#r)">"cc"</text>

    <text x="64" y="218" text-anchor="middle" font-weight="bold" filter="url(#r)">3</text>
    <text x="180" y="218" text-anchor="middle" filter="url(#r)">1, 1, 5</text>
    <text x="330" y="218" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#r)">cc</text>
    <text x="440" y="218" text-anchor="middle" font-weight="bold" fill="#a0761e" filter="url(#r)">c 阻塞 → 放 a</text>
    <text x="530" y="218" filter="url(#r)">"cca"</text>

    <text x="64" y="252" text-anchor="middle" filter="url(#r)">4</text>
    <text x="180" y="252" text-anchor="middle" filter="url(#r)">0, 1, 5</text>
    <text x="330" y="252" text-anchor="middle" filter="url(#r)">ca</text>
    <text x="440" y="252" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="252" filter="url(#r)">"ccac"</text>

    <text x="64" y="286" text-anchor="middle" filter="url(#r)">5</text>
    <text x="180" y="286" text-anchor="middle" filter="url(#r)">0, 1, 4</text>
    <text x="330" y="286" text-anchor="middle" filter="url(#r)">ac</text>
    <text x="440" y="286" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="286" filter="url(#r)">"ccacc"</text>

    <text x="64" y="320" text-anchor="middle" font-weight="bold" filter="url(#r)">6</text>
    <text x="180" y="320" text-anchor="middle" filter="url(#r)">0, 1, 3</text>
    <text x="330" y="320" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#r)">cc</text>
    <text x="440" y="320" text-anchor="middle" font-weight="bold" fill="#a0761e" filter="url(#r)">c 阻塞 → 放 b</text>
    <text x="530" y="320" filter="url(#r)">"ccaccb"</text>

    <text x="64" y="354" text-anchor="middle" filter="url(#r)">7</text>
    <text x="180" y="354" text-anchor="middle" filter="url(#r)">0, 0, 3</text>
    <text x="330" y="354" text-anchor="middle" filter="url(#r)">cb</text>
    <text x="440" y="354" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="354" filter="url(#r)">"ccaccbc"</text>

    <text x="64" y="388" text-anchor="middle" filter="url(#r)">8</text>
    <text x="180" y="388" text-anchor="middle" filter="url(#r)">0, 0, 2</text>
    <text x="330" y="388" text-anchor="middle" filter="url(#r)">bc</text>
    <text x="440" y="388" text-anchor="middle" filter="url(#r)">放 c</text>
    <text x="530" y="388" filter="url(#r)">"ccaccbcc"</text>

    <text x="64" y="422" text-anchor="middle" font-weight="bold" filter="url(#r)">9</text>
    <text x="180" y="422" text-anchor="middle" filter="url(#r)">0, 0, 1</text>
    <text x="330" y="422" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#r)">cc</text>
    <text x="440" y="422" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#r)">阻塞且堆空 → 停</text>
    <text x="530" y="422" fill="#888" filter="url(#r)">—</text>
  </g>

  <text x="320" y="452" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">第 3、6 步是关键：c 被 "cc" 卡死 → 及时切次顶作分隔；第 9 步仅剩 c 且尾部 "cc" → 停机</text>
  <text x="320" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">此时 R=2，上界 3R+2 = 8 已达到 ✓</text>
</svg>
