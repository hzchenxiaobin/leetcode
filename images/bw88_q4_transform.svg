<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">不等式变形：把「下标对」化成「值对」</text>

  <g filter="url(#rough2)">
    <rect x="66" y="52" width="428" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="80" text-anchor="middle" font-size="14" fill="#1a2b45" filter="url(#rough2)">nums1[i] − nums1[j] ≤ nums2[i] − nums2[j] + diff（i &lt; j）</text>

  <path d="M 280 102 L 280 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="296" y="118" font-size="11.5" fill="#446688" filter="url(#rough2)">把 j 的项挪到左边、i 的项挪到右边</text>

  <g filter="url(#rough2)">
    <rect x="66" y="128" width="428" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">nums1[i] − nums2[i] ≤ nums1[j] − nums2[j] + diff</text>

  <path d="M 280 178 L 280 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="194" font-size="11.5" fill="#b85450" filter="url(#rough2)">令 c[k] = nums1[k] − nums2[k]</text>

  <g filter="url(#rough2)">
    <rect x="66" y="204" width="428" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="232" text-anchor="middle" font-size="14" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">c[i] − c[j] ≤ diff（i &lt; j）—— 纯「值域」上的顺序对计数</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="286">变形后下标条件只剩 i &lt; j 一个，且只依赖各自的 c 值：</text>
    <text x="280" y="308">固定 j，数出「左边出现过的 c[i] 中，有多少个 ≤ c[j] + diff」</text>
    <text x="280" y="330">等价表述：c[j] ≥ c[i] − diff，即「右边的值不太小」</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="110" y="340" width="340" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="360" text-anchor="middle" font-size="12.5" fill="#1d3a17" filter="url(#rough2)">与 493. 翻转对 / 327. 区间和的个数 同款骨架：一边扫描一边统计</text>
</svg>
