<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">核心观察：余数以 2 为周期交替，枚举不变量 m 而非形态 (a,b)</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== strip 1: remainder compression ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a8edb" filter="url(#sk2)">第一步：余数压缩 —— 判定只读 (a + b) mod k，数值本身无关</text>
  <text x="86" y="108" text-anchor="end" font-size="12" fill="#888" filter="url(#sk2)">数值</text>
  <g font-size="13" fill="#444" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="96" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="119" y="107">7</text>
    <g filter="url(#sk2)"><rect x="150" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="173" y="107">13</text>
    <g filter="url(#sk2)"><rect x="204" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="227" y="107">4</text>
    <g filter="url(#sk2)"><rect x="258" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="281" y="107">11</text>
  </g>
  <g filter="url(#sk)"><path d="M 330 102 L 402 102" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="366" y="93" text-anchor="middle" font-size="11" fill="#8a8578" filter="url(#sk2)">x mod k</text>
  <text x="432" y="108" text-anchor="end" font-size="12" fill="#888" filter="url(#sk2)">余数</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="440" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="463" y="107" fill="#2b4a6e">2</text>
    <g filter="url(#sk2)"><rect x="494" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="517" y="107" fill="#2b4a6e">3</text>
    <g filter="url(#sk2)"><rect x="548" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="571" y="107" fill="#2b4a6e">4</text>
    <g filter="url(#sk2)"><rect x="602" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="625" y="107" fill="#2b4a6e">1</text>
  </g>
  <text x="668" y="107" font-size="11" fill="#999" filter="url(#sk2)">( k = 5 )</text>
  <text x="470" y="146" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk2)">值域 10⁷ 是烟雾弹：条件只读余数，先把每个数压成 x mod k</text>

  <!-- ===== panel left: observation 1 ===== -->
  <text x="262" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">观察 1：相邻等式相减 ⟹ 隔项同余</text>
  <g filter="url(#sk)"><rect x="62" y="208" width="400" height="100" rx="10" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
  <text x="86" y="236" font-size="12.5" fill="#444" filter="url(#sk2)">( sub[i] + sub[i+1] ) mod k = m</text>
  <text x="86" y="260" font-size="12.5" fill="#444" filter="url(#sk2)">( sub[i+1] + sub[i+2] ) mod k = m</text>
  <text x="86" y="290" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">⇒ 相减消去 sub[i+1]：sub[i] ≡ sub[i+2] (mod k)</text>
  <text x="262" y="330" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk2)">余数序列以 2 为周期：偶数位全是 a，奇数位全是 b（a 可以等于 b）</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><circle cx="110" cy="356" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="110" y="360" fill="#2d5a26">a</text>
    <g filter="url(#sk2)"><circle cx="166" cy="356" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="166" y="360" fill="#2b4a6e">b</text>
    <g filter="url(#sk2)"><circle cx="222" cy="356" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="222" y="360" fill="#2d5a26">a</text>
    <g filter="url(#sk2)"><circle cx="278" cy="356" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="278" y="360" fill="#2b4a6e">b</text>
    <g filter="url(#sk2)"><circle cx="334" cy="356" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="334" y="360" fill="#2d5a26">a</text>
  </g>
  <text x="382" y="360" font-size="14" fill="#888" filter="url(#sk2)">⋯</text>
  <g filter="url(#sk)"><rect x="62" y="386" width="400" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="82" y="408" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk2)">任意相邻对之和 ≡ a + b ≡ m (mod k)，条件自动成立</text>
  <text x="82" y="428" font-size="11.5" fill="#444" filter="url(#sk2)">a = b 时是同余数链 —— Q2「全奇 / 全偶」的一般化</text>

  <!-- divider -->
  <path d="M 470 168 L 470 438" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- ===== panel right: observation 2 ===== -->
  <text x="712" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk2)">观察 2：形态有 k² 个，不变量 m 只有 k 个</text>
  <text x="712" y="212" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk2)">以 k = 3 为例：余数对 (a, b) 按 m = (a+b) mod 3 染色</text>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="586" y="230" filter="url(#sk2)">b=0</text>
    <text x="638" y="230" filter="url(#sk2)">b=1</text>
    <text x="690" y="230" filter="url(#sk2)">b=2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="548" y="251" filter="url(#sk2)">a=0</text>
    <text x="548" y="293" filter="url(#sk2)">a=1</text>
    <text x="548" y="335" filter="url(#sk2)">a=2</text>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="560" y="236" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="586" y="262" fill="#2d5a26">0,0</text>
    <g filter="url(#sk2)"><rect x="612" y="236" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="638" y="262" fill="#2b4a6e">0,1</text>
    <g filter="url(#sk2)"><rect x="664" y="236" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="690" y="262" fill="#7a5415">0,2</text>
    <g filter="url(#sk2)"><rect x="560" y="278" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="586" y="304" fill="#2b4a6e">1,0</text>
    <g filter="url(#sk2)"><rect x="612" y="278" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="638" y="304" fill="#7a5415">1,1</text>
    <g filter="url(#sk2)"><rect x="664" y="278" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="690" y="304" fill="#2d5a26">1,2</text>
    <g filter="url(#sk2)"><rect x="560" y="320" width="52" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="586" y="346" fill="#7a5415">2,0</text>
    <g filter="url(#sk2)"><rect x="612" y="320" width="52" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
    <text x="638" y="346" fill="#2d5a26">2,1</text>
    <g filter="url(#sk2)"><rect x="664" y="320" width="52" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="690" y="346" fill="#2b4a6e">2,2</text>
  </g>
  <g font-size="10.5" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="556" y="374" width="62" height="20" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
    <text x="587" y="388" fill="#2d5a26">m = 0</text>
    <g filter="url(#sk2)"><rect x="630" y="374" width="62" height="20" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="661" y="388" fill="#2b4a6e">m = 1</text>
    <g filter="url(#sk2)"><rect x="704" y="374" width="62" height="20" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="735" y="388" fill="#7a5415">m = 2</text>
  </g>
  <text x="712" y="414" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">同 m 的 k 组 (a,b) 在同一轮扫描里全部覆盖</text>
  <text x="712" y="436" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">逐形态贪心 O(nk²) ≈ 10⁹ <tspan fill="#b03a3a" font-weight="bold">✗</tspan>　k 个 m 各扫一遍 O(nk) ≈ 10⁶ <tspan fill="#4a7a3a" font-weight="bold">✓</tspan></text>

  <!-- ===== bottom: the transition ===== -->
  <g filter="url(#sk)"><rect x="70" y="452" width="800" height="140" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="92" y="480" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">第二步：固定 m 后前驱被唯一确定 ⇒ 转移只剩一行</text>
  <text x="470" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">f[p] ← f[ (m − p) mod k ] + 1　（p = x mod k，元素 x 到来时）</text>
  <text x="92" y="542" font-size="12" fill="#444" filter="url(#sk2)">这正是 Q2「统一 DP」的直接推广：把 k ⊕ p 换成 (m − p) mod k，状态从 2 格扩到 k 格</text>
  <text x="92" y="568" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk2)">自环 q = p（即 2p ≡ m，同余数链 a = b）：f[p] ← f[p] + 1，右侧先求值，读旧写新，天然安全</text>
</svg>
