<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：把每个元素挪到目标残差的最小步数</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">nums = [1,4,2,8]，k = 3，(x,y) = (1,2)</text>
  <rect x="30" y="76" width="110" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="97" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">下标 / 值</text>
  <rect x="150" y="76" width="110" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205.0" y="97" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">当前残差</text>
  <rect x="268" y="76" width="110" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="97" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">目标残差</text>
  <rect x="386" y="76" width="140" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="456.0" y="97" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步数</text>
  <rect x="30" y="112" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="136" text-anchor="middle" font-size="10" fill="#446688">0 / 1</text>
  <rect x="150" y="112" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205.0" y="136" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <rect x="268" y="112" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="136" text-anchor="middle" font-size="10" fill="#446688">x = 1</text>
  <rect x="386" y="112" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="456.0" y="136" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <rect x="30" y="152" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="176" text-anchor="middle" font-size="10" fill="#446688">1 / 4</text>
  <rect x="150" y="152" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205.0" y="176" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <rect x="268" y="152" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="176" text-anchor="middle" font-size="10" fill="#446688">y = 2</text>
  <rect x="386" y="152" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="456.0" y="176" text-anchor="middle" font-size="10" fill="#d6a040">1</text>
  <rect x="30" y="192" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="216" text-anchor="middle" font-size="10" fill="#446688">2 / 2</text>
  <rect x="150" y="192" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205.0" y="216" text-anchor="middle" font-size="10" fill="#446688">2</text>
  <rect x="268" y="192" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="216" text-anchor="middle" font-size="10" fill="#446688">x = 1</text>
  <rect x="386" y="192" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="456.0" y="216" text-anchor="middle" font-size="10" fill="#d6a040">1</text>
  <rect x="30" y="232" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="256" text-anchor="middle" font-size="10" fill="#446688">3 / 8</text>
  <rect x="150" y="232" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="205.0" y="256" text-anchor="middle" font-size="10" fill="#446688">2</text>
  <rect x="268" y="232" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="256" text-anchor="middle" font-size="10" fill="#446688">y = 2</text>
  <rect x="386" y="232" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="456.0" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <rect x="30" y="292" width="496" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="278" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">总步数 = 0 + 1 + 1 + 0 = 2（把 4 加到 5、把 2 减到 1）</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">残差沿 k 循环，1 → 2 的环上距离是 1，2 → 1 也是 1（k = 3）</text>
</svg>
