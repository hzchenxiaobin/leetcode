<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="490" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：左半 ⇄ 回文一一对应，镜像补出右半</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">左半 = 前 h = ⌈n/2⌉ 位（首位≠0）；下表以 n = 3、h = 2 为例</text>

  <!-- column headers -->
  <text x="160" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">左半（h = 2 位整数）</text>
  <text x="470" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">回文（n = 3 位）</text>

  <!-- bijection rows -->
  <g filter="url(#sk)">
    <rect x="120" y="98" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="138" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="198" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="430" y="98" width="80" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="430" y="138" width="80" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
    <rect x="430" y="198" width="80" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="160" y="118">10</text>
    <text x="160" y="158">11</text>
    <text x="160" y="218">99</text>
    <text x="470" y="118">101</text>
    <text x="470" y="158">111</text>
    <text x="470" y="218">999</text>
  </g>
  <g font-size="16" fill="#999" text-anchor="middle">
    <text x="160" y="186">⋮</text>
    <text x="470" y="186">⋮</text>
  </g>
  <!-- double-headed arrows -->
  <g stroke="#8a8a8a" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M 212 113 L 418 113" marker-end="url(#ar)"/>
    <path d="M 418 113 L 212 113" marker-end="url(#ar)"/>
    <path d="M 212 153 L 418 153" marker-end="url(#ar)"/>
    <path d="M 418 153 L 212 153" marker-end="url(#ar)"/>
    <path d="M 212 213 L 418 213" marker-end="url(#ar)"/>
    <path d="M 418 213 L 212 213" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="252" y="164" width="126" height="26" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="315" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">双射 &amp; 保序</text>

  <!-- construction: even -->
  <g filter="url(#sk)">
    <rect x="30" y="248" width="300" height="118" rx="10" fill="#f8fbff" stroke="#446688" stroke-width="1.4"/>
    <rect x="350" y="248" width="300" height="118" rx="10" fill="#fffdf5" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="180" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">偶数长 n = 4：镜像 = 左半整体翻转</text>
  <g filter="url(#sk)">
    <rect x="60" y="282" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="100" y="282" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="282" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="200" y="282" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="80" y="304">1</text>
    <text x="120" y="304">2</text>
    <text x="180" y="304">2</text>
    <text x="220" y="304">1</text>
  </g>
  <text x="140" y="304" text-anchor="middle" font-size="16" font-weight="bold" fill="#999">|</text>
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#sk)">
    <path d="M 80 320 Q 130 344 200 320" marker-end="url(#ar)"/>
    <path d="M 120 320 Q 160 336 240 320" marker-end="url(#ar)"/>
  </g>
  <text x="180" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">左半 12 → 1221（镜像 2 位 = h）</text>

  <!-- construction: odd -->
  <text x="500" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">奇数长 n = 3：中点共用，只翻前 n−h 位</text>
  <g filter="url(#sk)">
    <rect x="392" y="282" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="432" y="282" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="472" y="282" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="412" y="304">1</text>
    <text x="452" y="304">2</text>
    <text x="492" y="304">1</text>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" filter="url(#sk)">
    <path d="M 412 320 Q 452 344 492 320" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">左半 12 → 121（镜像 1 位，2 是中点）</text>

  <!-- counting box -->
  <g filter="url(#sk)">
    <rect x="60" y="386" width="560" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="410" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">左半 ∈ [10^(h−1), 10^h − 1]，共 9 × 10^(h−1) 个 —— 这也是 n 位回文的总数</text>
  <text x="340" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">第 q 小左半 = 10^(h−1) + (q − 1)；q &gt; 9 × 10^(h−1) 时无解 → 返回 −1</text>
  <text x="340" y="452" text-anchor="middle" font-size="11" fill="#999">左半越小回文越小（保序），「第 q 小回文」=「第 q 小左半」的镜像</text>

  <text x="340" y="478" text-anchor="middle" font-size="11" fill="#999">排名 → 左半是连续区间上的直接寻址：无需枚举、无需排序，O(1) 定位</text>
</svg>
