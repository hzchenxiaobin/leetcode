<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="780" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：随机双哈希 + 滚动滑窗 + 逐路径集合求交</text>
  <path d="M 220 42 Q 450 52 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 主流程 ===== -->
  <text x="70" y="76" font-size="13.5" font-weight="bold" fill="#33517a">主流程</text>

  <g filter="url(#sk)">
    <rect x="60"  y="88" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="228" y="88" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="416" y="88" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="604" y="88" width="160" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="788" y="88" width="52"  height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="135" y="109" text-anchor="middle" font-size="11" fill="#33517a">paths 按 len 升序</text>
  <text x="135" y="127" text-anchor="middle" font-size="10.5" fill="#666">最短在前，minLen 上界</text>
  <text x="313" y="109" text-anchor="middle" font-size="11" fill="#33517a">随机取底数</text>
  <text x="313" y="127" text-anchor="middle" font-size="10.5" fill="#666">B₁∈[n+1,M₁), B₂∈[n+1,M₂)</text>
  <text x="501" y="109" text-anchor="middle" font-size="11" fill="#33517a">预处理幂表 B^k mod M</text>
  <text x="501" y="127" text-anchor="middle" font-size="10.5" fill="#666">k ≤ minLen</text>
  <text x="684" y="109" text-anchor="middle" font-size="11" fill="#8a6a1e">二分 mid=(lo+hi+1)/2</text>
  <text x="684" y="127" text-anchor="middle" font-size="10.5" fill="#666">调 check(mid) 定方向</text>
  <text x="814" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">返回</text>

  <g filter="url(#sk)">
    <path d="M 210 114 L 226 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 398 114 L 414 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 586 114 L 602 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 764 114 L 786 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 814 140 Q 814 168 684 168 Q 684 146 684 142" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="850" y="160" font-size="10" fill="#8a6a1e">lo/hi 收敛</text>

  <!-- ===== check(L) 内部 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="182" width="780" height="404" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="206" font-size="13.5" font-weight="bold" fill="#2e5e2e">check(L) 内部（单轮 O(S)）：逐路径滚动哈希 + 集合交</text>

  <g filter="url(#sk)">
    <rect x="200" y="222" width="360" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="240" text-anchor="middle" font-size="11" fill="#444">for 每条路径 p（长度升序）：</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#444">首窗口 O(L) 建哈希 h ← h·B + aₖ（双哈希并行）</text>

  <g filter="url(#sk)">
    <path d="M 380 262 L 380 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="380,282 470,316 380,350 290,316" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="380" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1e">i &lt; len(p) ?</text>

  <g filter="url(#sk)">
    <path d="M 380 350 L 380 368" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="396" y="364" font-size="11" font-weight="bold" fill="#2e5e2e">是</text>

  <g filter="url(#sk)">
    <rect x="195" y="372" width="370" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="380" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">滑窗 O(1)：去头 aᵢ₋L·B^(L−1)（负数 +M 修正）</text>
  <text x="380" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">→ ×B 移位 → + aᵢ 入尾 （mod M，两组各一遍）</text>
  <text x="380" y="426" text-anchor="middle" font-size="10" fill="#888">见底部公式面板</text>

  <g filter="url(#sk)">
    <path d="M 380 430 L 380 448" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="195" y="452" width="370" height="36" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="380" y="474" text-anchor="middle" font-size="11" fill="#444">cur.add( 指纹 (h₁,h₂) )：集合天然按路径去重</text>

  <g filter="url(#sk)">
    <path d="M 195 470 H 130 V 316 H 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="122" y="400" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 122 400)">窗口右移一格，回到判定</text>

  <g filter="url(#sk)">
    <path d="M 470 316 L 585 316" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="528" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">否·本路径扫完</text>

  <g filter="url(#sk)">
    <rect x="590" y="290" width="230" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="705" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a">common ← common ∩ cur</text>
  <text x="705" y="328" text-anchor="middle" font-size="10.5" fill="#666">首条路径直接 common = cur</text>

  <g filter="url(#sk)">
    <path d="M 705 342 L 705 360" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="705,362 785,392 705,422 625,392" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="705" y="397" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1e">common 空 ?</text>

  <g filter="url(#sk)">
    <path d="M 785 392 L 806 392" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="794" y="383" font-size="11" font-weight="bold" fill="#b85450">是</text>
  <text x="838" y="440" font-size="0" fill="#888"> </text>

  <g filter="url(#sk)">
    <rect x="612" y="440" width="186" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="705" y="458" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">return false</text>
  <text x="705" y="473" text-anchor="middle" font-size="10" fill="#888">提前剪枝，不再扫剩余路径</text>

  <g filter="url(#sk)">
    <path d="M 705 422 L 705 436" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <path d="M 625 392 Q 470 540 382 524" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="520" y="530" font-size="10.5" fill="#4a7a3a">否·下一条路径</text>

  <g filter="url(#sk)">
    <rect x="195" y="506" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <text x="285" y="524" text-anchor="middle" font-size="11" fill="#2e5e2e">处理完全部 m 条路径</text>
  <text x="285" y="539" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">→ return true</text>

  <text x="430" y="530" font-size="10.5" fill="#666">（交集非空 ⇒ 存在长度 L 的公共子路径）</text>
  <text x="80" y="566" font-size="11" fill="#444">单轮成本：每条路径 首窗 O(L) + 滑窗 O(len−L)，合计 O(S)；集合交期望 O(1) 每元素。</text>

  <!-- ===== 底部：滑窗公式与工程审计 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="600" width="780" height="160" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="624" font-size="13.5" font-weight="bold" fill="#8a6a1e">滑窗公式（引理 2）与工程审计</text>
  <text x="80" y="648" font-size="12" fill="#444">h(i) = aᵢ·B^(L−1) + aᵢ₊₁·B^(L−2) + … + aᵢ₊L₋₁   (mod M)</text>
  <text x="80" y="670" font-size="12" fill="#444">h(i+1) = ( h(i) − aᵢ·B^(L−1) ) · B + aᵢ₊L   (mod M)　—— 去头 · 移位 · 入尾，三步 O(1)</text>
  <text x="80" y="694" font-size="11.5" fill="#444">C++ 修负：((h − x) % M + M) % M；指纹 = (h₁ mod M₁, h₂ mod M₂)，C++ 拼 h₁·M₂ + h₂（单射，&lt; 10¹⁸）</text>
  <text x="80" y="716" font-size="11.5" fill="#444">溢出审计：h·B ≤ 10⁹×10⁹ = 10¹⁸ ； a·B^(L−1) ≤ 10⁵×10⁹ = 10¹⁴ ； 拼接指纹 &lt; 10¹⁸ —— 全部 &lt; 2⁶³−1 ✓</text>
  <text x="80" y="742" font-size="11.5" font-weight="bold" fill="#b85450">⚠️ 生死线：本题对抗数据卡固定参数单哈希——双哈希 + 随机底数缺一不可（§5 推论、§8 第 1 条）</text>
</svg>
