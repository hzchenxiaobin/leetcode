<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [2, −1, 2]，k = 3，答案是 3</text>

  <rect x="12" y="48" width="616" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="42" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j</text>
  <text x="100" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pre[j]</text>
  <text x="230" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pre[j] − pre[队首]</text>
  <text x="360" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">队尾弹出</text>
  <text x="470" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">队列（存下标）</text>
  <text x="580" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans</text>

  <rect x="12" y="80" width="616" height="30" rx="5" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">空队列，不判定</text>
  <text x="360" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="470" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0]</text>
  <text x="580" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <rect x="12" y="114" width="616" height="30" rx="5" fill="#f7f9fc" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 − 0 = 2 &lt; 3</text>
  <text x="360" y="134" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">无（2 &gt; 0）</text>
  <text x="470" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="580" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <rect x="12" y="148" width="616" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 − 0 = 1 &lt; 3</text>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">弹出下标 1</text>
  <text x="470" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0, 2]</text>
  <text x="580" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <rect x="12" y="182" width="616" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="42" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 − 0 = 3 ≥ 3 ✓</text>
  <text x="360" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">弹出队首 0</text>
  <text x="470" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 3]</text>
  <text x="580" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="24" y="246" font-size="12" fill="#333" filter="url(#rough2)">为什么弹出队首之后不用再看它：它的下标最小，以后再用它只会得到更长的子数组。</text>
  <text x="24" y="268" font-size="12" fill="#333" filter="url(#rough2)">为什么弹出队尾：pre 更小的 j 既能覆盖更宽的右端，又给出更长的可用区间，天然支配队尾。</text>
  <rect x="24" y="280" width="430" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最终 ans = 3，对应子数组 [2, −1, 2]</text>
</svg>
