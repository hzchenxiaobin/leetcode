<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按分母 d 的倍数分段：S(d) = Σₖ #\{nums ≥ k·d\}（以 d=2，nums=[2,5,9] 为例）</text>

  <!-- 数轴 -->
  <path d="M 60 210 L 500 210" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="10.5" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="60" y="232">1</text><text x="104" y="232">2</text><text x="148" y="232">3</text>
    <text x="192" y="232">4</text><text x="236" y="232">5</text><text x="280" y="232">6</text>
    <text x="324" y="232">7</text><text x="368" y="232">8</text><text x="412" y="232">9</text>
    <text x="456" y="232">10</text>
  </g>

  <!-- 倍数分隔线 -->
  <g stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)">
    <path d="M 104 168 L 104 224"/>
    <path d="M 192 168 L 192 224"/>
    <path d="M 280 168 L 280 224"/>
    <path d="M 368 168 L 368 224"/>
    <path d="M 456 168 L 456 224"/>
  </g>

  <!-- nums 元素 -->
  <g filter="url(#rough2)">
    <circle cx="104" cy="210" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="236" cy="210" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="412" cy="210" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="104" y="256">2</text><text x="236" y="256">5</text><text x="412" y="256">9</text>
  </g>

  <!-- 各段计数框 -->
  <g filter="url(#rough2)">
    <rect x="112" y="132" width="74" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="200" y="132" width="74" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="288" y="132" width="74" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <rect x="376" y="132" width="74" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2f5226" filter="url(#rough2)">
    <text x="149" y="146">k=1：≥2 有 3</text><text x="149" y="160">（2,5,9）</text>
    <text x="237" y="146">k=2：≥4 有 2</text><text x="237" y="160">（5,9）</text>
    <text x="325" y="146">k=3：≥6 有 1</text><text x="325" y="160">（9）</text>
    <text x="413" y="146">k=4：≥8 有 1</text><text x="413" y="160">（9）</text>
  </g>

  <!-- 求和 -->
  <rect x="60" y="272" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">S(2) = 3 + 2 + 1 + 1 = 7</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">恰好等于 floor(2/2) + floor(5/2) + floor(9/2) = 1 + 2 + 4</text>

  <rect x="60" y="326" width="440" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">"落在 [k·d, (k+1)·d) 内贡献 k"翻转成"≥ k·d 各计一次"；每段人数用前缀和 O(1) 查，免排序免二分</text>
</svg>
