<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">瓶颈在「查一次成员要多久」——数组 vs 哈希集合</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row A: brute force -->
  <g filter="url(#sk)">
    <rect x="40" y="52" width="560" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="64" y="82" font-size="13" font-weight="bold" fill="#b85450">暴力</text>
  <text x="64" y="100" font-size="11" fill="#b85450">逐个比对</text>
  <g filter="url(#sk)">
    <rect x="128" y="66" width="40" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="148" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
  <text x="148" y="118" text-anchor="middle" font-size="10" fill="#b85450">链表节点</text>
  <g filter="url(#sk)">
    <path d="M 174 83 L 206 83" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="190" y="72" text-anchor="middle" font-size="10" fill="#b85450">比对</text>
  <g filter="url(#sk)">
    <rect x="214" y="66" width="28" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="246" y="66" width="28" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="278" y="66" width="28" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <rect x="310" y="66" width="28" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="228" y="87" text-anchor="middle" font-size="13" fill="#b85450">1</text>
  <text x="260" y="87" text-anchor="middle" font-size="13" fill="#b85450">2</text>
  <text x="292" y="87" text-anchor="middle" font-size="13" fill="#b85450">3</text>
  <text x="324" y="87" text-anchor="middle" font-size="13" fill="#b85450">5</text>
  <text x="276" y="118" text-anchor="middle" font-size="10" fill="#b85450">nums（m ≤ 10<tspan dy="-4" font-size="8">5</tspan><tspan dy="4" font-size="10">）</tspan></text>
  <text x="368" y="84" font-size="13" font-weight="bold" fill="#b85450">每个节点线性扫一遍</text>
  <text x="368" y="106" font-size="12" fill="#b85450">O(n·m) ≈ 10<tspan dy="-5" font-size="9">10</tspan><tspan dy="5" font-size="12">，必超时</tspan></text>
  <g filter="url(#sk)">
    <circle cx="575" cy="96" r="16" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="575" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>

  <!-- Row B: hash set -->
  <g filter="url(#sk)">
    <rect x="40" y="156" width="560" height="102" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="64" y="188" font-size="13" font-weight="bold" fill="#2e6e2e">哈希集合</text>
  <text x="64" y="206" font-size="11" fill="#2e6e2e">一次定位</text>
  <g filter="url(#sk)">
    <rect x="128" y="172" width="24" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="156" y="172" width="24" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="184" y="172" width="24" height="26" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="140" y="191" text-anchor="middle" font-size="12" fill="#2e6e2e">1</text>
  <text x="168" y="191" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="196" y="191" text-anchor="middle" font-size="12" fill="#2e6e2e">3</text>
  <g filter="url(#sk)">
    <path d="M 214 185 L 240 185" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
  </g>
  <text x="227" y="174" text-anchor="middle" font-size="10" fill="#2e6e2e">倒入</text>
  <g filter="url(#sk)">
    <rect x="246" y="168" width="104" height="34" rx="8" fill="#4a8e4a" stroke="#357035" stroke-width="1.4"/>
  </g>
  <text x="298" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">S = {1,2,3}</text>
  <text x="298" y="222" text-anchor="middle" font-size="10" fill="#2e6e2e">O(m) 建一次，之后随便查</text>
  <g filter="url(#sk)">
    <rect x="380" y="172" width="40" height="34" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="400" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">4</text>
  <g filter="url(#sk)">
    <path d="M 378 189 L 356 189" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arg)"/>
  </g>
  <text x="367" y="180" text-anchor="middle" font-size="10" fill="#2e6e2e">∈ S ?</text>
  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#2e6e2e">节点</text>
  <text x="442" y="188" font-size="13" font-weight="bold" fill="#2e6e2e">判定不再是瓶颈</text>
  <text x="442" y="210" font-size="12" fill="#2e6e2e">总 O(n+m) ≈ 2×10<tspan dy="-5" font-size="9">5</tspan></text>
  <g filter="url(#sk)">
    <circle cx="575" cy="204" r="16" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="575" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- Bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="270" width="560" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="297" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">过滤型链表题 = 遍历 O(n) × 单次判定 O(1) —— 判定结构决定总复杂度</text>
</svg>
