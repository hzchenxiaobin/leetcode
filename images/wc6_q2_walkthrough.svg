<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个例子走一遍：每轮取最低 4 位，字符倒序拼回</text>
  <text x="300" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">低位先出、高位后出，所以收集到的字符序列要整体反转</text>

  <text x="46" y="68" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">num = 26（补码 0x1a，x 很快归零）</text>

  <rect x="44" y="76" width="514" height="100" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="44" y="76" width="514" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <line x1="44" y1="124" x2="558" y2="124" stroke="#cfd8e6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="44" y1="150" x2="558" y2="150" stroke="#cfd8e6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="114" y1="76" x2="114" y2="150" stroke="#e3e8f0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="310" y1="76" x2="310" y2="150" stroke="#e3e8f0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="410" y1="76" x2="410" y2="150" stroke="#e3e8f0" stroke-width="1.1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="79" y="91">轮次</text>
    <text x="212" y="91">x（十六进制）</text>
    <text x="360" y="91">x &amp; 15</text>
    <text x="484" y="91">输出字符</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#444">
    <text x="79" y="113">1</text>
    <text x="212" y="113">0x1a（26）</text>
    <text x="360" y="113">10</text>
    <text x="484" y="113">'a'</text>
    <text x="79" y="139">2</text>
    <text x="212" y="139">0x1（1）</text>
    <text x="360" y="139">1</text>
    <text x="484" y="139">'1'</text>
  </g>
  <text x="300" y="168" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x 归零 → 停止；反转 ['a','1'] 得 “1a”</text>

  <text x="46" y="200" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">num = −1（补码 0xffffffff，8 轮全出 'f'）</text>

  <rect x="44" y="212" width="514" height="122" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="44" y="212" width="514" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <line x1="44" y1="260" x2="558" y2="260" stroke="#edd6da" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="44" y1="286" x2="558" y2="286" stroke="#edd6da" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="44" y1="308" x2="558" y2="308" stroke="#edd6da" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="114" y1="212" x2="114" y2="334" stroke="#f0e0e4" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="310" y1="212" x2="310" y2="334" stroke="#f0e0e4" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="410" y1="212" x2="410" y2="334" stroke="#f0e0e4" stroke-width="1.1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#8a3a36" font-weight="bold">
    <text x="79" y="227">轮次</text>
    <text x="212" y="227">x（十六进制）</text>
    <text x="360" y="227">x &amp; 15</text>
    <text x="484" y="227">输出字符</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#444">
    <text x="79" y="249">1</text>
    <text x="212" y="249">0xffffffff</text>
    <text x="360" y="249">15</text>
    <text x="484" y="249">'f'</text>
    <text x="79" y="275">2</text>
    <text x="212" y="275">0x0fffffff</text>
    <text x="360" y="275">15</text>
    <text x="484" y="275">'f'</text>
    <text x="79" y="300">⋮</text>
    <text x="212" y="300">⋮</text>
    <text x="360" y="300">⋮</text>
    <text x="484" y="300">⋮</text>
    <text x="79" y="327">8</text>
    <text x="212" y="327">0x0000000f</text>
    <text x="360" y="327">15</text>
    <text x="484" y="327">'f'</text>
  </g>

  <text x="300" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">8 轮全出 'f'，反转后得 “ffffffff”；补码最高位为 1，所以负数的答案恒为 8 位</text>
  <text x="300" y="374" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">对照：num = 26 只跑 2 轮，因此不会出现 “0000001a” 这样的前导零</text>
</svg>
