<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：只需记住祖先链上的「减半次数」</text>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">收集自根向下 ⟹ 祖先先决策；u 的实际金币只取决于「选了方法②的祖先个数」j</text>

  <!-- ancestor chain -->
  <rect x="90" y="84" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">祖先 A · 选①</text>

  <path d="M 150 122 L 150 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="142" font-size="11" fill="#446688" filter="url(#rough2)">①：j 不变</text>
  <rect x="224" y="127" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="248" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">j=0</text>

  <rect x="90" y="160" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">祖先 B · 选②</text>

  <path d="M 150 198 L 150 230" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="218" font-size="11" fill="#99741c" filter="url(#rough2)">②：j+1</text>
  <rect x="224" y="203" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="248" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#99741c" filter="url(#rough2)">j=1</text>

  <rect x="90" y="236" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">祖先 C · 选①</text>

  <path d="M 150 274 L 150 306" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="294" font-size="11" fill="#446688" filter="url(#rough2)">①：j 不变</text>
  <rect x="224" y="279" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="248" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">j=1</text>

  <rect x="90" y="312" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">节点 u</text>

  <text x="150" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">实际金币 = coins[u] &gt;&gt; j</text>
  <text x="150" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">例：coins[u] = 13, j = 1 ⟹ 13 &gt;&gt; 1 = 6</text>

  <!-- right info panels -->
  <rect x="300" y="84" width="250" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="108" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">嵌套减半 = 一次右移</text>
  <text x="425" y="130" text-anchor="middle" font-size="12" fill="#557" filter="url(#rough2)">⌊⌊x/2⌋/2⌋ = ⌊x/2²⌋ = x &gt;&gt; 2（非负整数）</text>

  <rect x="300" y="160" width="250" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="425" y="184" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">j 的上界：14 次减半足矣</text>
  <text x="425" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">coins ≤ 10⁴ &lt; 2¹⁴ ⟹ j ≥ 14 时金币恒为 0</text>
  <text x="425" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j ∈ {0, 1, …, 14}，仅 15 个取值</text>

  <rect x="300" y="252" width="250" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="425" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">状态定义</text>
  <text x="425" y="298" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">dp[u][j]：祖先共选 j 次②时，子树 u 的最大积分</text>
  <text x="425" y="316" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">答案 = dp[0][0]（根无祖先）</text>

  <rect x="300" y="344" width="250" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="425" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">不必记住「哪些祖先」选了②</text>
  <text x="425" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">减半彼此可交换 ⟹ 只数个数就够</text>

  <text x="280" y="428" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">「影响整棵子树」的操作，沿根→u 的路径看只是一个可加计数器 —— 大范围影响 ≠ 高维状态</text>
</svg>
