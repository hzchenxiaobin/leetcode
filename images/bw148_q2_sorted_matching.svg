<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">重排后最优配对 = 排序配对：交叉一定比不交叉更差</text>
  <text filter="url(#rough2)" x="280" y="45" text-anchor="middle" font-size="11" fill="#888">核心不等式：若 a₁ ≤ a₂、b₁ ≤ b₂，则 |a₁−b₁| + |a₂−b₂| ≤ |a₁−b₂| + |a₂−b₁|</text>

  <line x1="60" y1="168" x2="500" y2="168" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="150" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="330" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="210" cy="216" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="420" cy="216" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="150" y="125" fill="#3a4a66">a₁</text>
    <text x="330" y="125" fill="#3a4a66">a₂</text>
    <text x="210" y="221" fill="#3a5a30">b₁</text>
    <text x="420" y="221" fill="#3a5a30">b₂</text>
  </g>
  <text filter="url(#rough2)" x="70" y="112" font-size="10" fill="#888">arr（已升序）</text>
  <text filter="url(#rough2)" x="70" y="236" font-size="10" fill="#888">brr（已升序）</text>

  <path d="M 152 137 L 206 199" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 332 137 L 416 199" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="446" y="150" font-size="10.4" fill="#4a7a3a" font-weight="bold">不交叉</text>
  <text filter="url(#rough2)" x="446" y="166" font-size="10" fill="#4a7a3a">更优</text>

  <path d="M 156 137 L 414 199" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 326 137 L 212 199" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="446" y="196" font-size="10.4" fill="#b85450" font-weight="bold">交叉</text>
  <text filter="url(#rough2)" x="446" y="212" font-size="10" fill="#b85450">不会更优</text>

  <rect x="26" y="250" width="508" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="270" font-size="10.8" fill="#8a6a20" font-weight="bold">为什么成立（区间视角）</text>
  <text filter="url(#rough2)" x="42" y="290" font-size="10.6" fill="#444">两区间若交叉，则"错位"的那部分距离被重复计算；同向配对不会重复。</text>

  <rect x="26" y="312" width="508" height="76" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="332" font-size="10.8" fill="#3a4a66" font-weight="bold">交换论证</text>
  <text filter="url(#rough2)" x="42" y="352" font-size="10.6" fill="#444">若配对里有"交叉"的两对 (a₁,b₂)、(a₂,b₁)，换成 (a₁,b₁)、(a₂,b₂) 后总代价不增；</text>
  <text filter="url(#rough2)" x="42" y="372" font-size="10.6" fill="#444">反复交换直到没有交叉，即得排序配对，故排序配对最优。</text>
</svg>
