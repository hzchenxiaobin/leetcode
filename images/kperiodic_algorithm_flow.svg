<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一遍扫描计数，顺手维护最大频率</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">计数与求 max 合并进同一趟循环，每个字符恰好读一次</text>

  <!-- box A -->
  <g filter="url(#rough2)">
    <rect x="28" y="76" width="128" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="92" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">初始化</text>
    <text x="92" y="118" text-anchor="middle" font-size="11" fill="#666">m ← n/k，best ← 0</text>
  </g>
  <path d="M156,104 L194,104" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box B -->
  <g filter="url(#rough2)">
    <rect x="196" y="76" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="261" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">取块 s ← word[i..i+k-1]</text>
    <text x="261" y="118" text-anchor="middle" font-size="11" fill="#666">i = 0, k, 2k, …</text>
  </g>
  <path d="M326,104 L364,104" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box C -->
  <g filter="url(#rough2)">
    <rect x="366" y="76" width="146" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="439" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">cnt[s] += 1</text>
    <text x="439" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">best ← max(best, cnt[s])</text>
  </g>
  <path d="M439,132 L439,166" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond D -->
  <g filter="url(#rough2)">
    <polygon points="439,168 517,206 439,244 361,206" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="439" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">扫完了？</text>

  <!-- loop back -->
  <path d="M361,206 L261,206 L261,136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="311" y="198" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否，下一块</text>

  <!-- yes -->
  <path d="M439,244 L439,280" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="266" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- box E -->
  <g filter="url(#rough2)">
    <rect x="344" y="284" width="190" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="439" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ans = m − best</text>

  <!-- note box -->
  <g filter="url(#rough2)">
    <rect x="28" y="348" width="484" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">构造操作序列（如需输出）：固定最大频率块 s* 的第一个出现位置 p 作母版</text>
  <text x="270" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 ≠ s* 的块执行一次 (i = 块起点, j = p)，母版全程不动</text>
</svg>
