<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">示例演算：")ebc#da@f(" 的两步</text>

  <rect x="36" y="50" width="490" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="11" fill="#446688">初始</text>
  <text x="130" y="78" font-size="14" fill="#333">) e b c # d a @ f (</text>
  <text x="400" y="72" font-size="10" fill="#666">字母 [e,b,c,d,a,f]</text>

  <rect x="36" y="108" width="490" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="130" font-size="11" fill="#4a7a3a">反转字母</text>
  <text x="130" y="136" font-size="14" fill="#333">) f a d # c b @ e (</text>
  <text x="400" y="130" font-size="10" fill="#666">字母变 [f,a,d,c,b,e]</text>

  <rect x="36" y="166" width="490" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="188" font-size="11" fill="#d6a040">反转特殊</text>
  <text x="130" y="194" font-size="14" fill="#333">( f a d @ c b # e )</text>
  <text x="400" y="188" font-size="10" fill="#666">特殊变 [(,@,#,)]</text>

  <rect x="36" y="228" width="490" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="250" font-size="12" fill="#333">答案："(fad@cb#e)"</text>
  <text x="50" y="268" font-size="10" fill="#666">两步作用的字符集合不同，顺序交换结果也一样</text>
</svg>
