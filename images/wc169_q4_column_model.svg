<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">竖式按列切分：列与列只靠一个进位耦合</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">SEND + MORE = MONEY，从个位（最右列）逐列向高位推进</text>
  <rect x="192" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="214" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">S</text>
  <rect x="236" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="258" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="280" y="84" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="302" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <rect x="324" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="6" filter="url(#rough2)"/>
  <text x="346" y="111" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">D</text>
  <rect x="192" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="214" y="159" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="236" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="258" y="159" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="280" y="132" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="302" y="159" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="324" y="132" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="6" filter="url(#rough2)"/>
  <text x="346" y="159" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="148" y="186" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="170" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="192" y="186" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="214" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="236" y="186" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="258" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <rect x="280" y="186" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="302" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="324" y="186" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="6" filter="url(#rough2)"/>
  <text x="346" y="213" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">Y</text>
  <text x="124" y="136" text-anchor="middle" font-size="20" fill="#666" font-weight="bold" filter="url(#rough2)">+</text>
  <path d="M 140 182 L 388 182" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 356 252 L 168 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="244" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">列号 c：0（个位）→ 1 → 2 → … 进位向左传</text>
  <text x="404" y="250" text-anchor="start" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">先算最右列</text>
  <rect x="40" y="272" width="482" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="293" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">列末校验：S(c) mod 10 必须等于 result 该列字符的数字，否则整枝剪掉</text>
  <rect x="40" y="314" width="482" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="335" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">进位：carry = S(c) // 10 传给左邻列；最高列走完 carry 必须为 0</text>
  <text x="280" y="370" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">全排列 10! = 3628800 种映射；按列判定把矛盾提前到列末</text>
</svg>
