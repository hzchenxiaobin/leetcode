<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 740" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="920" height="740" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：子序列的「身份」＝（长度奇偶 par，乘积 p，交错和 s）</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 面板 A：交错和 ===== -->
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#444" filter="url(#rough2)">① 交错和：符号只看元素在子序列里的位次，与原数组下标无关</text>
  <text x="60" y="100" font-size="11.5" fill="#888" filter="url(#rough2)">例：nums = [5, 2, 3, 1, 4]，选中子序列 [2, 3, 1]（原数组下标 1, 2, 3）</text>

  <ellipse cx="120" cy="152" rx="16" ry="16" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="120" y="157" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#rough2)">5</text>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#9e9e9e" filter="url(#rough2)">跳过</text>

  <ellipse cx="250" cy="152" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="250" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">2</text>
  <text x="250" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">+</text>

  <ellipse cx="380" cy="152" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="380" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="380" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">−</text>

  <ellipse cx="510" cy="152" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="510" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">1</text>
  <text x="510" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">+</text>

  <ellipse cx="640" cy="152" rx="16" ry="16" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="640" y="157" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#rough2)">4</text>
  <text x="640" y="120" text-anchor="middle" font-size="10.5" fill="#9e9e9e" filter="url(#rough2)">跳过</text>

  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="184">0</text>
    <text x="250" y="184">1</text>
    <text x="380" y="184">2</text>
    <text x="510" y="184">3</text>
    <text x="640" y="184">4</text>
  </g>

  <text x="250" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">第 1 个选中 → 偶位 (+)</text>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 2 个 → 奇位 (−)</text>
  <text x="510" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">第 3 个 → 偶位 (+)</text>
  <text x="460" y="238" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#444" filter="url(#rough2)">s = +2 − 3 + 1 = 0　（第一个选中的元素永远是 + 号）</text>

  <!-- ===== 面板 B：转移规则 ===== -->
  <text x="60" y="274" font-size="14" font-weight="bold" fill="#444" filter="url(#rough2)">② 追加元素 x：符号只看当前长度奇偶</text>

  <rect x="90" y="300" width="260" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">par = 0 · 长度为偶（含空）</text>
  <text x="220" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">新元素落偶下标 → s ← s + x</text>

  <rect x="570" y="300" width="260" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="700" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">par = 1 · 长度为奇</text>
  <text x="700" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">新元素落奇下标 → s ← s − x</text>

  <path d="M 270 298 Q 460 252 670 298" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#rough2)"/>
  <text x="460" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">par 0 → 1：s ← s + x</text>

  <path d="M 670 374 Q 460 420 270 374" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <text x="460" y="434" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">par 1 → 0：s ← s − x</text>

  <text x="460" y="330" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">每步奇偶翻转</text>
  <text x="460" y="352" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">乘积统一 p ← p · x</text>

  <!-- ===== 面板 C：值域 ===== -->
  <text x="60" y="498" font-size="14" font-weight="bold" fill="#444" filter="url(#rough2)">③ 约束把两个值域压窄 → 状态可枚举、可位集压缩</text>

  <rect x="60" y="522" width="250" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">交错和 s</text>
  <text x="185" y="566" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">|s| ≤ Σ ≤ 150×12 = 1800</text>

  <rect x="350" y="522" width="250" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">乘积 p</text>
  <text x="475" y="566" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">合法值 p ∈ [0, limit]，limit ≤ 5000</text>

  <rect x="640" y="522" width="220" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="750" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a2b" filter="url(#rough2)">长度奇偶 par</text>
  <text x="750" y="566" text-anchor="middle" font-size="12" fill="#a8842b" filter="url(#rough2)">只有 {0, 1} 两种</text>

  <rect x="50" y="606" width="820" height="116" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="70" y="634" font-size="13" fill="#444" filter="url(#rough2)">dp[par][p] = 3601 位位集：第 (s + Σ) 位为 1 ⇔ 存在子序列落在（奇偶 par，乘积 p，交错和 s）</text>
  <text x="70" y="660" font-size="12" fill="#555" filter="url(#rough2)">💡 转移＝位集整体左移 / 右移 x 位再「按位或」，一条机器指令批量更新 3601 个交错和</text>
  <text x="70" y="686" font-size="12" fill="#555" filter="url(#rough2)">不枚举 2¹⁵⁰ 个子序列，只维护 2×(limit+1) 个位集 —— 值域 DP 的典型形态</text>
</svg>
