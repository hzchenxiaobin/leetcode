<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：先算框架下界 L，再与 T 取 max</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">前三组是官方示例，最后一组是 T &gt; L 的情形</text>

  <g font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">
    <text x="52" y="82">输入 tasks 与 n</text>
    <text x="248" y="82" text-anchor="middle">f</text>
    <text x="302" y="82" text-anchor="middle">cnt</text>
    <text x="356" y="82" text-anchor="middle">T</text>
    <text x="410" y="82">L = (f−1)(n+1) + cnt</text>
    <text x="598" y="82" text-anchor="middle">答案</text>
  </g>

  <g filter="url(#rough2)" stroke="#c9c9c9" stroke-width="1">
    <line x1="40" y1="94" x2="620" y2="94"/>
    <line x1="40" y1="130" x2="620" y2="130"/>
    <line x1="40" y1="166" x2="620" y2="166"/>
    <line x1="40" y1="202" x2="620" y2="202"/>
    <line x1="40" y1="238" x2="620" y2="238"/>
  </g>

  <g font-size="11" fill="#3a4a66" filter="url(#rough2)">
    <text x="52" y="118">A A A B B B，n = 2</text>
    <text x="248" y="118" text-anchor="middle">3</text>
    <text x="302" y="118" text-anchor="middle">2</text>
    <text x="356" y="118" text-anchor="middle">6</text>
    <text x="410" y="118">2 × 3 + 2 = 8</text>
    <text x="598" y="118" text-anchor="middle" font-weight="bold" fill="#2f5a28">8</text>
  </g>

  <g font-size="11" fill="#3a4a66" filter="url(#rough2)">
    <text x="52" y="154">A C A B D B，n = 1</text>
    <text x="248" y="154" text-anchor="middle">2</text>
    <text x="302" y="154" text-anchor="middle">2</text>
    <text x="356" y="154" text-anchor="middle">6</text>
    <text x="410" y="154">1 × 2 + 2 = 4</text>
    <text x="598" y="154" text-anchor="middle" font-weight="bold" fill="#2f5a28">6</text>
  </g>

  <g font-size="11" fill="#3a4a66" filter="url(#rough2)">
    <text x="52" y="190">A A A B B B，n = 3</text>
    <text x="248" y="190" text-anchor="middle">3</text>
    <text x="302" y="190" text-anchor="middle">2</text>
    <text x="356" y="190" text-anchor="middle">6</text>
    <text x="410" y="190">2 × 4 + 2 = 10</text>
    <text x="598" y="190" text-anchor="middle" font-weight="bold" fill="#8a3a36">10</text>
  </g>

  <g font-size="11" fill="#3a4a66" filter="url(#rough2)">
    <text x="52" y="226">A A B B C，n = 1</text>
    <text x="248" y="226" text-anchor="middle">2</text>
    <text x="302" y="226" text-anchor="middle">2</text>
    <text x="356" y="226" text-anchor="middle">5</text>
    <text x="410" y="226">1 × 2 + 2 = 4</text>
    <text x="598" y="226" text-anchor="middle" font-weight="bold" fill="#2f5a28">5</text>
  </g>

  <text x="52" y="266" font-size="10.5" fill="#888" filter="url(#rough2)">第 2、4 行 T &gt; L：框架被填满还溢出，答案由任务总数决定；第 3 行 T &lt; L：中间 4 个空闲消不掉</text>

  <text x="60" y="292" font-size="10.5" fill="#666" filter="url(#rough2)">示例 3 的一条最优调度（· 表示空闲，共 10 个时刻）：</text>

  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <rect x="70" y="304" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="118" y="304" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="166" y="304" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="214" y="304" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="262" y="304" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="310" y="304" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="358" y="304" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="406" y="304" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" rx="4"/>
    <rect x="454" y="304" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="502" y="304" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="92" y="328" fill="#3a4a66">A</text>
    <text x="140" y="328" fill="#3a5a30">B</text>
    <text x="188" y="328" fill="#a08030">·</text>
    <text x="236" y="328" fill="#a08030">·</text>
    <text x="284" y="328" fill="#3a4a66">A</text>
    <text x="332" y="328" fill="#3a5a30">B</text>
    <text x="380" y="328" fill="#a08030">·</text>
    <text x="428" y="328" fill="#a08030">·</text>
    <text x="476" y="328" fill="#3a4a66">A</text>
    <text x="524" y="328" fill="#3a5a30">B</text>
  </g>

  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="92" y="354">1</text><text x="140" y="354">2</text><text x="188" y="354">3</text><text x="236" y="354">4</text>
    <text x="284" y="354">5</text><text x="332" y="354">6</text><text x="380" y="354">7</text><text x="428" y="354">8</text>
    <text x="476" y="354">9</text><text x="524" y="354">10</text>
  </g>

  <g font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="330" y="382">A 的相邻两次执行相隔 4 个时刻（n = 3 要求至少隔 3 个），中间两格只能空转</text>
    <text x="330" y="404">若把 n 改成 1，L 变成 2 × 2 + 2 = 6 = T，空闲消失，长度正好 6</text>
  </g>
</svg>
