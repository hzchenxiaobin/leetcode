<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只压低波谷，各波谷代价独立</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">波谷 j 必须严格小于左右邻居 → 只能降到 m − 1，其中 m = min(邻居值)</text>

  <rect x="66" y="80" width="96" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="114" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">邻居 L = 6</text>

  <rect x="232" y="80" width="96" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">波谷 v = 9</text>

  <rect x="398" y="80" width="96" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="110" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">邻居 R = 6</text>

  <path d="M 166 104 L 226 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 394 104 L 334 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">约束</text>
  <text x="364" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">约束</text>

  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">目标：v′ = m − 1 = 5</text>

  <rect x="66" y="166" width="428" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="188" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">成本 = max(0, nums[j] − (m − 1)) = max(0, 9 − 5) = 4</text>
  <text x="80" y="207" font-size="10" fill="#555" filter="url(#rough2)">邻居只统计实际存在的那些：端点处的波谷只有一个邻居（m 取那一个值）</text>

  <rect x="66" y="232" width="428" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="252" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么不顺手把波峰也降一点？</text>
  <text x="80" y="270" font-size="10" fill="#555" filter="url(#rough2)">波峰越大越容易满足「波谷 &lt; 波峰」；降低波峰只会让约束更紧、总成本更高，</text>
  <text x="80" y="285" font-size="10" fill="#555" filter="url(#rough2)">所以最优解里波峰一律保持原值，波谷之间也没有共享变量，可以逐项相加。</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两种模式各扫一遍 O(n)，总复杂度 O(n)、空间 O(1)</text>
</svg>
