<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)"> BST 子树的「身份四元组」：后序自底向上合成</text>

  <!-- 四元组 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="118" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="152" y="56" width="118" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="274" y="56" width="118" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="396" y="56" width="118" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="89" y="80">isBST</text>
    <text x="211" y="80">sum</text>
    <text x="333" y="80">min</text>
    <text x="455" y="80">max</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="89" y="100">是否合法 BST</text>
    <text x="211" y="100">子树键值和</text>
    <text x="333" y="100">子树最小键</text>
    <text x="455" y="100">子树最大键</text>
  </g>

  <!-- 合成条件 -->
  <rect x="30" y="136" width="484" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e">
    <text x="272" y="158" text-anchor="middle" font-weight="bold">node 是 BST 的充要条件：</text>
    <text x="272" y="178" text-anchor="middle">左子树是 BST 且 右子树是 BST 且 left.max &lt; node.val &lt; right.min</text>
  </g>

  <!-- 空树约定 -->
  <rect x="30" y="202" width="484" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="272" y="222" text-anchor="middle" font-weight="bold">空树返回 (true, 0, +∞, −∞)</text>
    <text x="272" y="240" text-anchor="middle">+∞ / −∞ 使任何 node.val 都能通过严格不等式检查</text>
  </g>

  <text x="280" y="274" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">合法即更新 ans = max(ans, sum)；非法只把 isBST = false 向上传，其余字段作废</text>
</svg>
