<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：word = "leetcode"（非标准布局）</text>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <line x1="50" y1="120" x2="530" y2="120" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="50" y="140">0</text><text x="124" y="140">4</text><text x="198" y="140">8</text>
    <text x="272" y="140">12</text><text x="346" y="140">16</text><text x="420" y="140">20</text>
    <text x="494" y="140">24</text>
    <g fill="#bbb">
      <circle cx="50" cy="120" r="3"/><circle cx="68" cy="120" r="2"/>
      <circle cx="87" cy="120" r="2"/><circle cx="105" cy="120" r="2"/>
      <circle cx="124" cy="120" r="3"/><circle cx="142" cy="120" r="2"/>
      <circle cx="161" cy="120" r="2"/><circle cx="179" cy="120" r="2"/>
      <circle cx="198" cy="120" r="3"/><circle cx="216" cy="120" r="2"/>
      <circle cx="235" cy="120" r="2"/><circle cx="253" cy="120" r="2"/>
      <circle cx="272" cy="120" r="3"/><circle cx="290" cy="120" r="2"/>
      <circle cx="309" cy="120" r="2"/><circle cx="327" cy="120" r="2"/>
      <circle cx="346" cy="120" r="3"/><circle cx="364" cy="120" r="2"/>
      <circle cx="383" cy="120" r="2"/><circle cx="401" cy="120" r="2"/>
      <circle cx="420" cy="120" r="3"/><circle cx="438" cy="120" r="2"/>
      <circle cx="457" cy="120" r="2"/><circle cx="475" cy="120" r="2"/>
      <circle cx="494" cy="120" r="3"/><circle cx="512" cy="120" r="2"/>
      <circle cx="530" cy="120" r="2"/>
    </g>
  </g>

  <!-- 轨迹节点: 0 -> 22 -> 15 -> 15 -> 4 -> 13 -> 25 -> 14 -> 15 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <circle cx="50"  cy="120" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="50" y="98" fill="#446688">start</text>
    <circle cx="420" cy="120" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="420" y="98" fill="#2d5a22">l=22</text>
    <circle cx="346" cy="120" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="346" y="166" fill="#2d5a22">e=15</text>
    <circle cx="124" cy="120" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="124" y="98" fill="#7a5c1e">t=4</text>
    <circle cx="272" cy="120" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="272" y="166" fill="#7a5c1e">c=13</text>
    <circle cx="494" cy="120" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="494" y="98" fill="#8c3a34">o=25</text>
    <circle cx="309" cy="120" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="309" y="166" fill="#7a5c1e">d=14</text>
  </g>

  <!-- 弧线轨迹 -->
  <g filter="url(#rough2)">
    <path d="M 60 112 C 180 50, 330 50, 412 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 412 112 C 400 74, 360 74, 352 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 338 114 C 250 60, 170 60, 132 112" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 134 126 C 170 176, 230 176, 264 126" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 282 112 C 350 52, 440 52, 486 110" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 486 126 C 440 190, 360 190, 317 128" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
    <path d="M 311 112 C 320 82, 334 82, 342 110" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrO)"/>
  </g>

  <!-- 步长标注 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#7a5c1e">
    <text x="236" y="66">22</text>
    <text x="392" y="86">7</text>
    <text x="236" y="132">11</text>
    <text x="200" y="196">9</text>
    <text x="392" y="66">12</text>
    <text x="400" y="196">11</text>
    <text x="328" y="92">1</text>
  </g>

  <!-- 汇总 -->
  <rect x="80" y="262" width="400" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">22 + 7 + 0 + 11 + 9 + 12 + 11 + 1</text>
  <text x="280" y="308" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">= 73 ✓（与官方答案一致）</text>
</svg>
