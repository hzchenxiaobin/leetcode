<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：简写通道值是 17 的倍数，且三通道互不耦合</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">"dd" 的数值 = 16d + d = 17d  ⇒  候选集 {0, 17, 34, …, 255}</text>

  <text x="232" y="82" text-anchor="end" font-size="16" fill="#555" filter="url(#rough2)">#</text>
  <rect x="240" y="62" width="44" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="81" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">09</text>
  <rect x="288" y="62" width="44" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="81" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">f1</text>
  <rect x="336" y="62" width="44" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="81" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">66</text>
  <text x="262" y="106" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">R</text>
  <text x="310" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">G</text>
  <text x="358" y="106" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">B</text>

  <text x="28" y="150" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">R: v = 9</text>
  <text x="170" y="129" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×0 = 0</text>
  <text x="500" y="129" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×1 = 17</text>
  <path d="M 170 140 L 500 140" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 170 135 L 170 145 M 500 135 L 500 145" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="500" cy="140" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 345 136 L 345 152" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <polygon points="345,126 350,136 340,136" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">v = 9</text>
  <text x="170" y="182" font-size="10" fill="#555" filter="url(#rough2)">到 0 的距离 9 &gt; 到 17 的距离 8  ⇒  取 17 = 0x11</text>
  <rect x="515" y="128" width="80" height="24" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="145" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">"11"</text>

  <text x="28" y="217" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">G: v = 241</text>
  <text x="170" y="196" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×14 = 238</text>
  <text x="500" y="196" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×15 = 255</text>
  <path d="M 170 207 L 500 207" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 170 202 L 170 212 M 500 202 L 500 212" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="170" cy="207" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 228 203 L 228 219" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <polygon points="228,193 233,203 223,203" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="233" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">v = 241</text>
  <text x="170" y="249" font-size="10" fill="#555" filter="url(#rough2)">到 238 的距离 3 &lt; 到 255 的距离 14  ⇒  取 238 = 0xee</text>
  <rect x="515" y="195" width="80" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="212" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">"ee"</text>

  <text x="28" y="284" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">B: v = 102 = 17×6</text>
  <text x="170" y="265" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×6 = 102</text>
  <text x="500" y="265" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">17×7 = 119</text>
  <path d="M 170 274 L 500 274" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 170 269 L 170 279 M 500 269 L 500 279" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="170" cy="274" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="170" cy="274" r="6" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="300" font-size="10" fill="#555" filter="url(#rough2)">v 恰好落在候选值上（红圈 = v，与绿点重合），距离 0  ⇒  取 0x66</text>
  <rect x="515" y="262" width="80" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="279" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">"66"</text>

  <rect x="40" y="322" width="540" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么能拆开算？</text>
  <text x="56" y="360" font-size="10" fill="#555" filter="url(#rough2)">F = (v_R−17d_R)² + (v_G−17d_G)² + (v_B−17d_B)²，每项只含各自的 d；约束也是逐通道的</text>
  <text x="56" y="374" font-size="10" fill="#555" filter="url(#rough2)">⇒ 联合最小 = 三个一维最近邻问题各自最小（可分离优化）</text>
</svg>
