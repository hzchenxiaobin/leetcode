<svg xmlns="http://www.w3.org/2000/svg" width="740" height="565" viewBox="0 0 740 565" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="79" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="740" height="565" fill="#fdfcf7"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,4,6]，k = 2 的回溯决策树</text>
  <path d="M 190 42 Q 370 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- level labels -->
  <text x="22" y="88" font-size="11" fill="#8a8a84" filter="url(#sk)">第 1 层</text>
  <text x="22" y="104" font-size="11" fill="#8a8a84" filter="url(#sk)">决定 2</text>
  <text x="22" y="208" font-size="11" fill="#8a8a84" filter="url(#sk)">第 2 层</text>
  <text x="22" y="224" font-size="11" fill="#8a8a84" filter="url(#sk)">决定 4</text>
  <text x="22" y="328" font-size="11" fill="#8a8a84" filter="url(#sk)">第 3 层</text>
  <text x="22" y="344" font-size="11" fill="#8a8a84" filter="url(#sk)">决定 6</text>
  <text x="22" y="448" font-size="11" fill="#8a8a84" filter="url(#sk)">叶子</text>

  <!-- root -->
  <g filter="url(#sk)">
    <rect x="337" y="61" width="66" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="370" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">∅</text>

  <!-- L2 nodes -->
  <g filter="url(#sk)">
    <rect x="152" y="181" width="66" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="185" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">∅</text>
  <g filter="url(#sk)">
    <rect x="527" y="181" width="66" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="560" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">{2}</text>

  <!-- L3 nodes -->
  <g filter="url(#sk)">
    <rect x="62" y="301" width="66" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="95" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">∅</text>
  <g filter="url(#sk)">
    <rect x="242" y="301" width="66" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="275" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">{4}</text>
  <g filter="url(#sk)">
    <rect x="447" y="301" width="66" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="480" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">{2}</text>

  <!-- pruned node F (选4 from {2}) -->
  <g filter="url(#sk)">
    <circle cx="655" cy="316" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="655" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">×</text>
  <text x="655" y="350" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">chosen[4−2]&gt;0</text>

  <!-- leaves -->
  <g filter="url(#sk)">
    <rect x="39" y="418" width="66" height="30" rx="8" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.6"/>
  </g>
  <text x="72" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a8a84">∅</text>
  <text x="72" y="472" text-anchor="middle" font-size="9.5" fill="#8a8a84" filter="url(#sk)">空集（最后扣除）</text>

  <g filter="url(#sk)">
    <rect x="129" y="418" width="66" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="162" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">{6}</text>

  <g filter="url(#sk)">
    <rect x="219" y="418" width="66" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="252" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">{4}</text>

  <g filter="url(#sk)">
    <circle cx="347" cy="433" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="347" y="439" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">×</text>
  <text x="347" y="468" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">chosen[6−2]&gt;0</text>

  <g filter="url(#sk)">
    <rect x="409" y="418" width="66" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="442" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">{2}</text>

  <g filter="url(#sk)">
    <rect x="499" y="418" width="76" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="537" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">{2,6}</text>

  <!-- edges level 1 -->
  <path d="M 348 91 Q 245 130 196 178" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="248" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">跳过 2</text>
  <path d="M 392 91 Q 495 130 546 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="488" y="122" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">选 2</text>

  <!-- edges level 2 -->
  <path d="M 162 211 Q 118 258 100 298" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="114" y="254" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">跳过 4</text>
  <path d="M 208 211 Q 252 258 268 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="266" y="254" text-anchor="middle" font-size="11" fill="#2e5e2e" filter="url(#sk)">选 4</text>
  <path d="M 532 211 Q 496 258 488 298" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="494" y="254" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">跳过 4</text>
  <path d="M 588 211 Q 632 258 651 296" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="638" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">选 4</text>

  <!-- edges level 3 -->
  <path d="M 78 331 Q 72 372 73 415" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="55" y="376" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">跳过 6</text>
  <path d="M 118 331 Q 146 372 155 415" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">选 6</text>
  <path d="M 248 331 Q 240 372 250 415" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="234" y="376" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">跳过 6</text>
  <path d="M 295 331 Q 325 372 342 412" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="327" y="374" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">选 6</text>
  <path d="M 455 331 Q 440 372 444 415" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="430" y="376" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">跳过 6</text>
  <path d="M 512 331 Q 528 372 531 415" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="534" y="376" text-anchor="middle" font-size="10.5" fill="#2e5e2e" filter="url(#sk)">选 6</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="160" y="494" width="420" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="370" y="516" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">2 处剪枝、5 片存活叶（含空集）</text>
  <text x="370" y="536" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">dfs(0) = 5 → 答案 = 5 − 1 = 4 ✓</text>
</svg>
