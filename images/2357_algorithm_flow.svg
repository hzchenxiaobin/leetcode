<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一次遍历，哈希去重计数</text>
  <path d="M 300 44 Q 470 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主流程 -->
  <g filter="url(#sk)"><ellipse cx="95" cy="120" rx="55" ry="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="95" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>

  <path d="M 152 120 L 196 120" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="202" y="92" width="150" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="277" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">遍历 nums</text>
  <text x="277" y="134" text-anchor="middle" font-size="11" fill="#444">取出元素 x</text>

  <path d="M 356 120 L 400 120" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="470,80 545,120 470,160 395,120" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="470" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">x ≠ 0 ?</text>

  <path d="M 545 120 L 592 120" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="568" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk)"><rect x="598" y="92" width="150" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="673" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">seen.add(x)</text>
  <text x="673" y="134" text-anchor="middle" font-size="11" fill="#444">值去重</text>

  <path d="M 752 120 L 796 120" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><ellipse cx="862" cy="120" rx="66" ry="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="862" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回</text>
  <text x="862" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">len(seen)</text>

  <!-- 否分支：跳过继续 -->
  <path d="M 470 162 Q 470 206 277 206 Q 205 206 262 152" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="470" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">否（0 不参与操作，跳过）</text>

  <!-- 实现变体 -->
  <text x="70" y="262" font-size="13" font-weight="bold" fill="#2b6e9e">三种等价实现</text>

  <g filter="url(#sk)"><rect x="70" y="278" width="250" height="108" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="90" y="304" font-size="12" font-weight="bold" fill="#2e6e2e">① 哈希表（推荐）</text>
  <text x="90" y="330" font-size="11" fill="#444" font-family="monospace">seen = {x for x in nums if x}</text>
  <text x="90" y="352" font-size="11" fill="#444">时间 O(n)，无需关心值域大小</text>
  <text x="90" y="374" font-size="11" fill="#888">元素可到 10⁹ 也一样快</text>

  <g filter="url(#sk)"><rect x="345" y="278" width="250" height="108" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="365" y="304" font-size="12" font-weight="bold" fill="#7a5415">② 排序数段</text>
  <text x="365" y="330" font-size="11" fill="#444" font-family="monospace">排序后数相邻不同段</text>
  <text x="365" y="352" font-size="11" fill="#444">时间 O(n log n)</text>
  <text x="365" y="374" font-size="11" fill="#888">首段若为 0 需跳过</text>

  <g filter="url(#sk)"><rect x="620" y="278" width="250" height="108" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="640" y="304" font-size="12" font-weight="bold" fill="#2b6e9e">③ 值域布尔数组</text>
  <text x="640" y="330" font-size="11" fill="#444" font-family="monospace">seen[101] 标记出现值</text>
  <text x="640" y="352" font-size="11" fill="#444">时间 O(n + V)，V = 101</text>
  <text x="640" y="374" font-size="11" fill="#888">值域小（≤100）时可用</text>
</svg>
