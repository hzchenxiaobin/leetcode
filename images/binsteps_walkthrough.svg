<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：s = "1101"（13）→ 6 步</text>

  <!-- ① 真实过程 -->
  <text x="60" y="60" text-anchor="start" font-size="12.5" font-weight="bold" fill="#555" filter="url(#r)">① 真实过程：每步由奇偶唯一决定</text>

  <g filter="url(#r)">
    <ellipse cx="88" cy="100" rx="20" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="168" cy="100" rx="20" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="248" cy="100" rx="20" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="328" cy="100" rx="20" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="408" cy="100" rx="20" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="488" cy="100" rx="20" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="568" cy="100" rx="20" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="88" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">13</text>
  <text x="168" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">14</text>
  <text x="248" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">7</text>
  <text x="328" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">8</text>
  <text x="408" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">4</text>
  <text x="488" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">2</text>
  <text x="568" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">1</text>

  <path d="M 110 100 L 144 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 190 100 L 224 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 270 100 L 304 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 350 100 L 384 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 430 100 L 464 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 510 100 L 544 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="128" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">+1</text>
  <text x="208" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">/2</text>
  <text x="288" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">+1</text>
  <text x="368" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">/2</text>
  <text x="448" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">/2</text>
  <text x="528" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">/2</text>

  <!-- ② 逐位扫描表 -->
  <text x="60" y="150" text-anchor="start" font-size="12.5" font-weight="bold" fill="#555" filter="url(#r)">② 逐位扫描：右→左一位一位数步数（奇偶只看 s[i]+carry）</text>

  <g filter="url(#r)" fill="#f5f5f0" stroke="#999" stroke-width="1">
    <rect x="100" y="160" width="90" height="32" rx="4"/>
    <rect x="190" y="160" width="90" height="32" rx="4"/>
    <rect x="280" y="160" width="90" height="32" rx="4"/>
    <rect x="370" y="160" width="90" height="32" rx="4"/>
    <rect x="460" y="160" width="90" height="32" rx="4"/>
    <rect x="100" y="192" width="90" height="32" rx="4"/>
    <rect x="190" y="192" width="90" height="32" rx="4"/>
    <rect x="280" y="192" width="90" height="32" rx="4"/>
    <rect x="370" y="192" width="90" height="32" rx="4"/>
    <rect x="460" y="192" width="90" height="32" rx="4"/>
    <rect x="100" y="224" width="90" height="32" rx="4"/>
    <rect x="190" y="224" width="90" height="32" rx="4"/>
    <rect x="280" y="224" width="90" height="32" rx="4"/>
    <rect x="370" y="224" width="90" height="32" rx="4"/>
    <rect x="460" y="224" width="90" height="32" rx="4"/>
    <rect x="100" y="256" width="90" height="32" rx="4"/>
    <rect x="190" y="256" width="90" height="32" rx="4"/>
    <rect x="280" y="256" width="90" height="32" rx="4"/>
    <rect x="460" y="256" width="90" height="32" rx="4"/>
    <rect x="100" y="288" width="90" height="32" rx="4"/>
    <rect x="190" y="288" width="90" height="32" rx="4"/>
    <rect x="280" y="288" width="90" height="32" rx="4"/>
    <rect x="460" y="288" width="90" height="32" rx="4"/>
    <rect x="100" y="320" width="90" height="32" rx="4"/>
    <rect x="190" y="320" width="90" height="32" rx="4"/>
    <rect x="280" y="320" width="90" height="32" rx="4"/>
    <rect x="460" y="320" width="90" height="32" rx="4"/>
  </g>
  <g filter="url(#r)">
    <rect x="370" y="256" width="90" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="460" y="288" width="90" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <text x="145" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">位序 i →</text>
  <text x="235" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">i = 3</text>
  <text x="325" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">i = 2</text>
  <text x="415" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">i = 1</text>
  <text x="505" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">i = 0 ★</text>

  <text x="145" y="212" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">s[i]</text>
  <text x="145" y="244" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">carry 入</text>
  <text x="145" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#r)">v = s[i]+carry</text>
  <text x="145" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">本位步数</text>
  <text x="145" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#r)">carry 出</text>

  <text x="235" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="325" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">0</text>
  <text x="415" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="505" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>

  <text x="235" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">0</text>
  <text x="325" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="415" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="505" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>

  <text x="235" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="325" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="415" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">2</text>
  <text x="505" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#r)">1+1=2</text>

  <text x="235" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#r)">2</text>
  <text x="325" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#r)">2</text>
  <text x="415" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">1</text>
  <text x="505" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+1</text>

  <text x="235" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>
  <text x="325" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>
  <text x="415" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>
  <text x="505" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#999" filter="url(#r)">—</text>

  <!-- 汇总 -->
  <g filter="url(#r)">
    <rect x="50" y="368" width="540" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">扫描累计 ans = 2 + 2 + 1 = 5，收尾 carry = 1 → 5 + 1 = 6 步</text>
  <text x="320" y="414" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">★ 最高位 i = 0 不进循环：实值 1 + carry = 2，即 "10"，由 ans + carry 补最后一步 /2</text>
  <text x="320" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">与 ① 真实过程的 6 步吻合 ✓</text>
</svg>
