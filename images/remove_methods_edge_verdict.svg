<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察二：三类边里，只有「圈外 → 圈内」能否决删除</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">S 可移除 ⇔ 不存在调用边 (a,b)：a 在 S 外 且 b 在 S 内</text>

  <!-- 面板 A：圈外→圈内 -->
  <text x="88" y="74" text-anchor="middle" font-size="11.5" fill="#7a3530" font-weight="bold" filter="url(#rough2)">圈外 → 圈内</text>
  <ellipse cx="88" cy="172" rx="60" ry="66" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 132 96 L 97 152" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="88" cy="172" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="177" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="138" cy="88" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="93" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="121" y="118" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">入侵!</text>
  <path d="M 26 96 L 44 114 M 44 96 L 26 114" stroke="#b85450" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="88" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 一票否决</text>
  <text x="88" y="272" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">外部还依赖 S，删了就悬空</text>

  <!-- 面板 B：圈内→圈外 -->
  <text x="262" y="74" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">圈内 → 圈外</text>
  <text x="262" y="88" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">（这类边其实不会出现）</text>
  <ellipse cx="240" cy="172" rx="60" ry="66" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 252 160 L 298 104" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="240" cy="172" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="177" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="308" cy="92" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <path d="M 198 100 L 214 116 M 214 100 L 198 116" stroke="#4a7a3a" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="262" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 无碍（且为空）</text>
  <text x="262" y="272" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">a∈S 且 a→b ⇒ b∈S</text>

  <!-- 面板 C：圈内→圈内（含环） -->
  <text x="434" y="74" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">圈内 → 圈内（含环）</text>
  <ellipse cx="434" cy="172" rx="62" ry="66" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 418 160 Q 448 146 452 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 450 178 Q 442 200 420 182" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="408" cy="154" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="408" y="159" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="458" cy="188" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="458" y="193" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">b</text>
  <path d="M 370 100 L 386 116 M 386 100 L 370 116" stroke="#4a7a3a" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#rough2)"/>
  <text x="434" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 放行</text>
  <text x="434" y="272" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">整组一起消失，组内调用随之蒸发</text>

  <!-- 底部结论 -->
  <rect x="20" y="286" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">判定 = 一趟线性扫边：发现一条「圈外→圈内」就立刻返回全体方法</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">结构性事实：S 对出边封闭，「圈内→圈外」根本不存在 —— 实际要盯的只有入侵边</text>
</svg>
