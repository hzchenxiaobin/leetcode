<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 走查：arr = [1,5,7,8,5,3,4,2,1]，difference = −2</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前驱是 a − difference = a + 2；9 次查表后 best = 4</text>

  <g filter="url(#rough2)">
    <rect x="50" y="70" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="50" y="100" width="500" height="270" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#2c4a6b" font-weight="bold">
    <text x="78" y="90">i</text>
    <text x="150" y="90">a</text>
    <text x="228" y="90">a + 2</text>
    <text x="322" y="90">dp[a + 2]</text>
    <text x="408" y="90">dp[a] ← </text>
    <text x="508" y="90">best</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="220" width="500" height="30" fill="#e6f4ea" opacity="0.75"/>
    <rect x="50" y="250" width="500" height="30" fill="#e6f4ea" opacity="0.75"/>
    <rect x="50" y="340" width="500" height="30" fill="#fce4ec" opacity="0.85"/>
    <rect x="288" y="341" width="68" height="28" fill="none" stroke="#d6a040" stroke-width="2" rx="5"/>
  </g>

  <g filter="url(#rough2)" stroke="#cccccc" stroke-width="1" fill="none">
    <path d="M 50 130 L 550 130"/>
    <path d="M 50 160 L 550 160"/>
    <path d="M 50 190 L 550 190"/>
    <path d="M 50 220 L 550 220"/>
    <path d="M 50 250 L 550 250"/>
    <path d="M 50 280 L 550 280"/>
    <path d="M 50 310 L 550 310"/>
    <path d="M 50 340 L 550 340"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#333">
    <text x="78" y="120">0</text><text x="150" y="120">1</text><text x="228" y="120">3</text><text x="322" y="120">0</text><text x="408" y="120">1</text><text x="508" y="120">1</text>

    <text x="78" y="150">1</text><text x="150" y="150">5</text><text x="228" y="150">7</text><text x="322" y="150">0</text><text x="408" y="150">1</text><text x="508" y="150">1</text>

    <text x="78" y="180">2</text><text x="150" y="180">7</text><text x="228" y="180">9</text><text x="322" y="180">0</text><text x="408" y="180">1</text><text x="508" y="180">1</text>

    <text x="78" y="210">3</text><text x="150" y="210">8</text><text x="228" y="210">10</text><text x="322" y="210">0</text><text x="408" y="210">1</text><text x="508" y="210">1</text>

    <text x="78" y="240">4</text><text x="150" y="240">5</text><text x="228" y="240">7</text><text x="322" y="240">1</text><text x="408" y="240">2</text><text x="508" y="240">2</text>

    <text x="78" y="270">5</text><text x="150" y="270">3</text><text x="228" y="270">5</text><text x="322" y="270">2</text><text x="408" y="270">3</text><text x="508" y="270">3</text>

    <text x="78" y="300">6</text><text x="150" y="300">4</text><text x="228" y="300">6</text><text x="322" y="300">0</text><text x="408" y="300">1</text><text x="508" y="300">3</text>

    <text x="78" y="330">7</text><text x="150" y="330">2</text><text x="228" y="330">4</text><text x="322" y="330">1</text><text x="408" y="330">2</text><text x="508" y="330">3</text>

    <text x="78" y="360">8</text><text x="150" y="360">1</text><text x="228" y="360">3</text><text x="322" y="360" font-weight="bold" fill="#d6a040">3</text><text x="408" y="360" font-weight="bold" fill="#8a3a36">4</text><text x="508" y="360" font-weight="bold" fill="#8a3a36">4</text>
  </g>

  <text x="60" y="394" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">第 4、5 行：5 接在 7 后面（dp 变 2），3 再接在 5 后面（dp 变 3），链沿数值轴 −2 前进</text>
  <text x="60" y="414" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">第 8 行：1 早先只值 1，这次被覆盖成 dp[3] + 1 = 4 —— 更大，覆盖是安全的</text>

  <text x="300" y="438" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">最优子序列 [7, 5, 3, 1]，长度 4</text>
</svg>
