<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：a = 12 = 1100₂，b = 5 = 0101₂，n = 4</text>
  <path d="M 240 40 Q 470 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">从 i = 3 到 i = 0 逐位决策：彩框 = 本步刚定的位，灰底 = 已定，白底 = 未定（仍是原值）</text>

  <!-- header row -->
  <text x="53" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">i</text>
  <text x="150" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">a_i / b_i</text>
  <text x="300" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">判定与动作</text>
  <text x="540" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">A（bit3 → bit0）</text>
  <text x="760" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">B（bit3 → bit0）</text>

  <!-- ===== row i=3 ===== -->
  <text x="53" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#sk)">i = 3</text>
  <text x="150" y="122" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1 / 0</text>
  <text x="150" y="142" text-anchor="middle" font-size="10.5" fill="#a3541c" font-weight="bold" filter="url(#sk)">异位</text>
  <text x="205" y="122" font-size="11" fill="#444" filter="url(#sk)">A = 12 &gt; B = 5</text>
  <text x="205" y="142" font-size="11" fill="#b03a3a" font-weight="bold" filter="url(#sk)">→ 2³ 补给 B（A 摘走 2³）</text>
  <!-- A bits: 0 1 0 0 (bit3 decided orange) -->
  <g filter="url(#sk)"><rect x="460" y="100" width="34" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
  <text x="477" y="122" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="502" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="519" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="544" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="561" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="586" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="603" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <text x="540" y="156" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">A = 0100₂ = 4</text>
  <!-- B bits: 1 1 0 1 (bit3 decided orange) -->
  <g filter="url(#sk)"><rect x="680" y="100" width="34" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
  <text x="697" y="122" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="722" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="739" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="764" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="781" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="806" y="100" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="823" y="122" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <text x="760" y="156" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">B = 1101₂ = 13</text>
  <path d="M 40 168 L 900 168" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- ===== row i=2 ===== -->
  <text x="53" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#sk)">i = 2</text>
  <text x="150" y="206" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1 / 1</text>
  <text x="150" y="226" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">同位</text>
  <text x="205" y="206" font-size="11" fill="#444" filter="url(#sk)">双双置 1</text>
  <text x="205" y="226" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">→ 两边本来就是 1，幂等不变</text>
  <!-- A bits: 0 1 0 0 (bit2 green) -->
  <g filter="url(#sk)"><rect x="460" y="184" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="477" y="206" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="502" y="184" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="519" y="206" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="544" y="184" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="561" y="206" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="586" y="184" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="603" y="206" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <text x="540" y="240" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">A = 0100₂ = 4</text>
  <!-- B bits: 1 1 0 1 (bit2 green) -->
  <g filter="url(#sk)"><rect x="680" y="184" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="697" y="206" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="722" y="184" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="739" y="206" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="764" y="184" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="781" y="206" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="806" y="184" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="823" y="206" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <text x="760" y="240" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">B = 1101₂ = 13</text>
  <path d="M 40 252 L 900 252" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- ===== row i=1 ===== -->
  <text x="53" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#sk)">i = 1</text>
  <text x="150" y="290" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">0 / 0</text>
  <text x="150" y="310" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">同位</text>
  <text x="205" y="290" font-size="11" fill="#444" filter="url(#sk)">双双置 1</text>
  <text x="205" y="310" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">→ A、B 各 +2¹，差不变</text>
  <!-- A bits: 0 1 1 0 (bit1 green) -->
  <g filter="url(#sk)"><rect x="460" y="268" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="477" y="290" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="502" y="268" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="519" y="290" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="544" y="268" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="561" y="290" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="586" y="268" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="603" y="290" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">0</text>
  <text x="540" y="324" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">A = 0110₂ = 6</text>
  <!-- B bits: 1 1 1 1 (bit1 green) -->
  <g filter="url(#sk)"><rect x="680" y="268" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="697" y="290" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="722" y="268" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="739" y="290" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="764" y="268" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="781" y="290" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="806" y="268" width="34" height="34" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" rx="4"/></g>
  <text x="823" y="290" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <text x="760" y="324" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">B = 1111₂ = 15</text>
  <path d="M 40 336 L 900 336" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- ===== row i=0 ===== -->
  <text x="53" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#sk)">i = 0</text>
  <text x="150" y="374" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">0 / 1</text>
  <text x="150" y="394" text-anchor="middle" font-size="10.5" fill="#a3541c" font-weight="bold" filter="url(#sk)">异位</text>
  <text x="205" y="374" font-size="11" fill="#444" filter="url(#sk)">A = 6 &lt; B = 15</text>
  <text x="205" y="394" font-size="11" fill="#b03a3a" font-weight="bold" filter="url(#sk)">→ 2⁰ 补给 A（B 摘走 2⁰）</text>
  <!-- A bits: 0 1 1 1 (bit0 orange) -->
  <g filter="url(#sk)"><rect x="460" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="477" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="502" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="519" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="544" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="561" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="586" y="352" width="34" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
  <text x="603" y="374" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="540" y="408" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">A = 0111₂ = 7</text>
  <!-- B bits: 1 1 1 0 (bit0 orange) -->
  <g filter="url(#sk)"><rect x="680" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="697" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="722" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="739" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="764" y="352" width="34" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" rx="4"/></g>
  <text x="781" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="806" y="352" width="34" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
  <text x="823" y="374" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">0</text>
  <text x="760" y="408" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">B = 1110₂ = 14</text>

  <!-- ===== final strip ===== -->
  <g filter="url(#sk)"><rect x="40" y="432" width="860" height="118" rx="8" fill="#f3eefa" stroke="#8a6eb8" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="470" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">最终 A = 7，B = 14 → 乘积 7 × 14 = 98 ✓（与示例输出一致）</text>
  <text x="470" y="482" text-anchor="middle" font-size="11" fill="#5a3a7a" filter="url(#sk)">反解 x = a ⊕ A = 1100₂ ⊕ 0111₂ = 1011₂ = 11；验证 12 ⊕ 11 = 7 ✓，5 ⊕ 11 = 14 ✓</text>
  <text x="470" y="504" text-anchor="middle" font-size="11" fill="#5a3a7a" filter="url(#sk)">另一个最优解 x = 2（对应 A = 14、B = 7）——两者恰是一对「镜像」，|A−B| 同为 7（引理 3）</text>
  <text x="470" y="530" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">旁证：示例 2 得 31 × 30 = 930 ✓；示例 3 依次补给 A、B、B 得 4 × 3 = 12 ✓</text>

  <!-- ===== lemma 4 note ===== -->
  <g filter="url(#sk)"><rect x="40" y="566" width="860" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/></g>
  <text x="470" y="588" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">注意：每步比较的 A、B 带着「未定低位」的原值</text>
  <text x="470" y="608" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">已定部分对差的贡献是 2^(i+1) 的倍数，而未定低位污染 &lt; 2^(i+1)，故比较结果仍由已定部分决定（引理 4）</text>
  <text x="470" y="628" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">如 i = 3 时 A、B 的低位仍是 1100 / 0101 原值——但这不影响判定方向</text>
</svg>
