<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="428" fill="#fafafa"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">分类讨论：三种奇偶分布都能构造</text>
  <path d="M 170 46 Q 320 54 470 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 判断框 -->
  <g filter="url(#rough2)">
    <rect x="210" y="58" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">nums1 的奇偶分布？</text>

  <!-- 三条分支箭头 -->
  <path d="M 300 102 Q 180 120 122 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 102 L 320 144" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 102 Q 460 120 512 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支一：全偶（绿） -->
  <g filter="url(#rough2)">
    <rect x="24" y="150" width="182" height="185" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="115" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">全偶</text>
  <text x="115" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所有元素都是偶数</text>
  <text x="115" y="214" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（n=1 且为偶也在此）</text>
  <path d="M 44 226 Q 115 232 186 226" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="115" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">策略：全部保留</text>
  <text x="115" y="268" text-anchor="middle" font-size="11" fill="#555" font-family="monospace" filter="url(#rough2)">nums2[i] = nums1[i]</text>
  <text x="115" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">→ 全偶 ✓</text>

  <!-- 分支二：全奇（蓝） -->
  <g filter="url(#rough2)">
    <rect x="229" y="150" width="182" height="185" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">全奇</text>
  <text x="320" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所有元素都是奇数</text>
  <text x="320" y="214" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（n=1 且为奇也在此）</text>
  <path d="M 249 226 Q 320 232 391 226" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">策略：全部保留</text>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#555" font-family="monospace" filter="url(#rough2)">nums2[i] = nums1[i]</text>
  <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">→ 全奇 ✓</text>

  <!-- 分支三：混合（橙，强调） -->
  <g filter="url(#rough2)">
    <rect x="434" y="150" width="182" height="185" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="525" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10" filter="url(#rough2)">混合</text>
  <text x="525" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">至少一个奇数</text>
  <text x="525" y="214" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">且至少一个偶数</text>
  <path d="M 454 226 Q 525 232 596 226" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="525" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">策略：奇数保留</text>
  <text x="525" y="264" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">偶数各减去任一奇数</text>
  <text x="525" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">偶 − 奇 = 奇</text>
  <text x="525" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 全奇 ✓</text>

  <!-- 结论框（红，强调） -->
  <g filter="url(#rough2)">
    <rect x="130" y="356" width="380" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="320" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">三种情况全部可行 —— 答案恒为 true</text>
  <text x="320" y="401" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" filter="url(#rough2)">return true</text>
</svg>
