<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：destination = [2,3]，k = 5</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">3 个 'H' + 2 个 'V' 共 C(5,2) = 10 条；每步比较 k 与 block = C(h+v−1, v)</text>

  <g filter="url(#sk)">
    <rect x="46" y="58" width="588" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 86 58 V 254 M 178 58 V 254 M 234 58 V 254 M 366 58 V 254 M 484 58 V 254" stroke="#9aa5b0" stroke-width="1" fill="none"/>
    <path d="M 46 84 H 634 M 46 118 H 634 M 46 152 H 634 M 46 186 H 634 M 46 220 H 634" stroke="#9aa5b0" stroke-width="1" fill="none"/>
    <rect x="46" y="58" width="588" height="196" rx="4" fill="none" stroke="#446688" stroke-width="1.6"/>
    <rect x="484" y="84" width="150" height="34" fill="#e6f4ea" stroke="#9aa5b0" stroke-width="1"/>
    <rect x="484" y="118" width="150" height="34" fill="#fff8e1" stroke="#9aa5b0" stroke-width="1"/>
    <rect x="484" y="152" width="150" height="34" fill="#e6f4ea" stroke="#9aa5b0" stroke-width="1"/>
    <rect x="484" y="186" width="150" height="34" fill="#fff8e1" stroke="#9aa5b0" stroke-width="1"/>
    <rect x="484" y="220" width="150" height="34" fill="#f0f0f0" stroke="#9aa5b0" stroke-width="1"/>
  </g>

  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">
    <text x="66" y="75">步</text>
    <text x="132" y="75">已定前缀</text>
    <text x="206" y="75">h, v</text>
    <text x="300" y="75">block</text>
    <text x="425" y="75">k vs block</text>
    <text x="559" y="75">动作</text>
  </g>

  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">
    <text x="66" y="106">①</text>
    <text x="66" y="140">②</text>
    <text x="66" y="174">③</text>
    <text x="66" y="208">④</text>
    <text x="66" y="242">⑤</text>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">
    <text x="132" y="106">（空）</text>
    <text x="132" y="140">H</text>
    <text x="132" y="174">HV</text>
    <text x="132" y="208">HVH</text>
    <text x="132" y="242">HVHV</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">
    <text x="206" y="106">3, 2</text>
    <text x="206" y="140">2, 2</text>
    <text x="206" y="174">2, 1</text>
    <text x="206" y="208">1, 1</text>
    <text x="206" y="242">1, 0</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">
    <text x="300" y="106">C(4,2) = 6</text>
    <text x="300" y="140">C(3,2) = 3</text>
    <text x="300" y="174">C(2,1) = 2</text>
    <text x="300" y="208">C(1,1) = 1</text>
    <text x="300" y="242" font-size="11" fill="#999">—（v = 0）</text>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" filter="url(#sk)">
    <text x="425" y="106" fill="#4a7a3a">5 ≤ 6 ✓</text>
    <text x="425" y="140" fill="#b85450">5 &gt; 3 ✗</text>
    <text x="425" y="174" fill="#4a7a3a">2 ≤ 2 ✓</text>
    <text x="425" y="208" fill="#b85450">2 &gt; 1 ✗</text>
    <text x="425" y="242" fill="#999">—</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#sk)">
    <text x="559" y="106">填 'H'，k 不变</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#sk)">
    <text x="559" y="140">k ← 5−3 = 2，填 'V'</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#sk)">
    <text x="559" y="174">填 'H'，k 不变</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#sk)">
    <text x="559" y="208">k ← 2−1 = 1，填 'V'</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">
    <text x="559" y="242">收尾：补 'H'</text>
  </g>

  <g filter="url(#sk)">
    <rect x="46" y="278" width="588" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="340" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">答案 = HVHVH</text>
  <text x="340" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">＝ 排序表第 5 条 ✓（第②④步共跳过 3 + 1 = 4 条，收尾落位第 1 条）</text>

  <g filter="url(#sk)">
    <rect x="46" y="348" width="286" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="189" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">对照全部 10 条（字典序）</text>
  <g filter="url(#sk)">
    <rect x="124" y="397" width="56" height="17" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="10.5" fill="#446688" filter="url(#sk)">
    <text x="64" y="392">1 HHHVV    2 HHVHV    3 HHVVH</text>
    <text x="64" y="410">4 HVHHV    5 HVHVH    6 HVVHH</text>
    <text x="64" y="428">7 VHHHV  8 VHHVH  9 VHVHH  10 VVHHH</text>
  </g>

  <g filter="url(#sk)">
    <rect x="348" y="348" width="286" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="491" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">跳块账本（康托式定位）</text>
  <g font-size="10.5" fill="#7a5a10" filter="url(#sk)">
    <text x="364" y="392">② 跳过 C(3,2) = 3 条：前缀 H 的 H 块</text>
    <text x="364" y="410">④ 跳过 C(1,1) = 1 条：前缀 HVH 的 H 块</text>
    <text x="364" y="428">共跳 4 条 + 收尾落位 1 → 第 5 条 ✓</text>
  </g>
</svg>
