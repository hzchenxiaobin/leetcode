<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算（示例 3）：n = 5，cost = [3,4,1,1,7]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">自底向上：节点 1 的两个孩子相等无缺口；节点 0 处节点 1 是缺口孩子 → 在节点 1 加价 +2</text>

  <!-- 树边 -->
  <path d="M 250 108 L 152 175" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 290 108 L 388 175" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 385 208 L 342 271" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 415 208 L 458 271" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 节点 0 -->
  <circle cx="270" cy="92" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="12" fill="#2a4666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="270" y="103" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3</text>
  <text x="302" y="96" text-anchor="start" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mx[0] = 10</text>

  <!-- 节点 4（叶） -->
  <circle cx="140" cy="190" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="188" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="140" y="200" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">7</text>
  <text x="140" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx = 7</text>

  <!-- 节点 1 -->
  <circle cx="400" cy="190" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#2a4666" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="200" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">4</text>
  <text x="400" y="232" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mx[1] = 5</text>

  <!-- 节点 2（叶） -->
  <circle cx="335" cy="288" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="286" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="298" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="335" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx = 1</text>

  <!-- 节点 3（叶） -->
  <circle cx="465" cy="288" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="286" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="465" y="298" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">1</text>
  <text x="465" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx = 1</text>

  <!-- 加价徽章 -->
  <g filter="url(#rough2)">
    <rect x="438" y="142" width="66" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="471" y="159" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold">加价 +2</text>
  </g>
  <path d="M 443 167 L 416 179" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 步骤 ① -->
  <g filter="url(#rough2)">
    <rect x="18" y="246" width="200" height="76" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="30" y="264" font-size="10" fill="#444" font-weight="bold">步骤 ①：处理节点 1</text>
    <text x="30" y="279" font-size="9.5" fill="#555">孩子 mx = 1、1 → 相等，无缺口</text>
    <text x="30" y="294" font-size="9.5" fill="#555">mx[1] = cost 4 + 1 = 5</text>
    <text x="30" y="309" font-size="9.5" fill="#4a7a3a" font-weight="bold">ans += 0</text>
  </g>

  <!-- 步骤 ② -->
  <g filter="url(#rough2)">
    <rect x="18" y="334" width="200" height="92" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="30" y="352" font-size="10" fill="#444" font-weight="bold">步骤 ②：处理节点 0</text>
    <text x="30" y="367" font-size="9.5" fill="#555">孩子 mx = 7（节点 4）、5（节点 1）</text>
    <text x="30" y="382" font-size="9.5" fill="#555">M = 7，节点 1 缺口 7 − 5 = 2</text>
    <text x="30" y="397" font-size="9.5" fill="#8a3a36" font-weight="bold">节点 1 计 1 个 → ans = 1</text>
    <text x="30" y="412" font-size="9.5" fill="#555">mx[0] = cost 3 + 7 = 10</text>
  </g>

  <!-- 结果框 -->
  <g filter="url(#rough2)">
    <rect x="240" y="334" width="262" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="252" y="352" font-size="10" fill="#2a5a2a" font-weight="bold">最终：所有路径得分 = 10</text>
    <text x="252" y="368" font-size="9.5" fill="#2a5a2a">0→4：3 + 7 = 10 ✓</text>
    <text x="252" y="383" font-size="9.5" fill="#2a5a2a">0→1→2：3 + (4+2) + 1 = 10 ✓</text>
    <text x="252" y="398" font-size="9.5" fill="#2a5a2a">0→1→3：3 + (4+2) + 1 = 10 ✓</text>
    <text x="252" y="416" font-size="10" fill="#2a5a2a" font-weight="bold">答案 ans = 1</text>
  </g>
</svg>
