<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 478"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="478" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：树上无环 ⟹「已访问邻居」= 唯一的父节点</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每步可选去向数 cnt = deg(u) − [u≠1]；概率沿路径连乘 1/cnt 一路衰减</text>

  <!-- 边（先画线，节点矩形盖住线头） -->
  <line x1="310" y1="112" x2="168" y2="202" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="310" y1="112" x2="310" y2="202" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="112" x2="452" y2="202" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="168" y1="202" x2="108" y2="296" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="168" y1="202" x2="228" y2="296" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="202" x2="310" y2="296" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 边标签：转移概率 -->
  <text x="222" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">×1/3</text>
  <text x="324" y="160" text-anchor="start" font-size="12" font-weight="bold" fill="#999" filter="url(#rough2)">×1/3</text>
  <text x="398" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#999" filter="url(#rough2)">×1/3</text>
  <text x="122" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">×1/2</text>
  <text x="208" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#999" filter="url(#rough2)">×1/2</text>
  <text x="324" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#999" filter="url(#rough2)">×1</text>

  <!-- 节点：框内上=顶点号，下=cnt 与 概率 -->
  <rect x="282" y="90" width="56" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=3  p=1</text>

  <rect x="140" y="180" width="56" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="168" y="216" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=2  p=1/3</text>

  <rect x="282" y="180" width="56" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="310" y="216" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=1  p=1/3</text>

  <rect x="424" y="180" width="56" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="452" y="216" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=0  p=1/3</text>

  <rect x="80" y="274" width="56" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="108" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="108" y="310" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">cnt=0  p=1/6</text>
  <text x="74" y="286" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">target</text>

  <rect x="200" y="274" width="56" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="228" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=0  p=1/6</text>

  <rect x="282" y="274" width="56" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="310" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">cnt=0  p=1/3</text>

  <!-- 7 号叶子注记 -->
  <text x="452" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt=0：叶子，被困原地</text>

  <!-- 概率账单 -->
  <rect x="55" y="352" width="510" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="372" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">概率账单：青蛙踩中 4 号的唯一路径 1 → 2 → 4</text>
  <text x="70" y="392" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">第 1 秒站在 1：去向 {2,3,7} 共 3 个 ⟹ 选中 2：×1/3</text>
  <text x="70" y="410" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">第 2 秒站在 2：去掉来路 1，剩 {4,6} 共 2 个 ⟹ 选中 4：×1/2</text>
  <text x="70" y="428" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">p(4) = 1 × 1/3 × 1/2 = 1/6 ✓（除的是「跳出节点」的 cnt）</text>
  <text x="70" y="444" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">4 自己的 cnt=0 只用于「早到判停留」，不参与除法！</text>

  <text x="55" y="470" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">无环还保证：跳进任何一棵子树就再也回不到来路 ——「不能回访」自动满足，全程无需记录历史</text>
</svg>
