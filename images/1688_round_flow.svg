<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：逐轮模拟（与 O(1) 公式殊途同归）</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="230" y="60" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="350" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">读入 n，ans = 0</text>
  <path d="M 350 94 L 350 110" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="350,112 430,152 350,192 270,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="158" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">n &gt; 1 ?</text>

  <!-- no branch -->
  <path d="M 430 152 L 462 152" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="447" y="142" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="466" y="128" width="144" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="538" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">返回 ans</text>
  <text x="538" y="168" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">恒等于 n − 1</text>

  <!-- yes branch -->
  <path d="M 350 192 L 350 212" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="363" y="207" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">是</text>

  <!-- box A -->
  <g filter="url(#sk)">
    <rect x="210" y="214" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="350" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">ans += ⌊n/2⌋</text>
  <text x="350" y="252" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">本轮配对场次（奇偶统一，无需 if）</text>
  <path d="M 350 258 L 350 274" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box B -->
  <g filter="url(#sk)">
    <rect x="210" y="276" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="350" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">n ← n − ⌊n/2⌋ = ⌈n/2⌉</text>
  <text x="350" y="314" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">晋级队伍数（轮空队自动保留）</text>

  <!-- loop back -->
  <path d="M 210 298 L 160 298 L 160 152 L 266 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">循环</text>

  <!-- O(1) shortcut -->
  <g filter="url(#sk)">
    <rect x="466" y="224" width="144" height="110" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="538" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">O(1) 捷径</text>
  <text x="538" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">return n − 1</text>
  <text x="538" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">每场恰淘汰 1 支</text>
  <text x="538" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">守恒，无需循环</text>
  <path d="M 538 222 L 538 180" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- caption -->
  <text x="320" y="372" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">每轮队伍数至少减半 ⇒ 循环至多 ⌈log₂ n⌉ 轮（n ≤ 200 时 ≤ 8 轮）</text>
</svg>
