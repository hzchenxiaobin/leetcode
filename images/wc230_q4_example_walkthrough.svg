<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="530" fill="#fdfcf7"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：cars = [[3,4],[5,4],[6,3],[9,1]]</text>
  <text x="340" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">从右向左四步；栈自下而上 = 从右到左（顶 = 距 i 最近的车），answer = [2, 1, 1.5, −1]</text>

  <!-- 列头 -->
  <text x="52" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">i（p, s）</text>
  <text x="170" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">栈（处理前）</text>
  <text x="330" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">判定与动作</text>
  <text x="607" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#666" filter="url(#sk)">res</text>
  <path d="M 24 154 L 656 154" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 24 242 L 656 242" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>
  <path d="M 24 330 L 656 330" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <!-- 行 1：i = 3 -->
  <g filter="url(#sk)"><ellipse cx="52" cy="106" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="52" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e" filter="url(#sk)">i=3</text>
  <text x="52" y="138" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#666" filter="url(#sk)">(9, 1)</text>
  <text x="170" y="110" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">（空）</text>
  <text x="250" y="96" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">栈空：无候选 → res[3] 保持哨兵 −1</text>
  <text x="250" y="112" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">push(3)：最右车入栈，成为栈底候选</text>
  <g filter="url(#sk)"><rect x="548" y="92" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="562" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="578" y="92" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="592" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="608" y="92" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="622" y="108" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="638" y="92" width="28" height="22" rx="3" fill="#f0f0f0" stroke="#bbb"/></g>
  <text x="652" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">−1</text>
  <text x="562" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">0</text>
  <text x="592" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">1</text>
  <text x="622" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">2</text>
  <text x="652" y="128" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">3</text>

  <!-- 行 2：i = 2 -->
  <g filter="url(#sk)"><ellipse cx="52" cy="194" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="52" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e" filter="url(#sk)">i=2</text>
  <text x="52" y="226" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#666" filter="url(#sk)">(6, 3)</text>
  <g filter="url(#sk)"><rect x="135" y="183" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="198" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">3 (9,1)</text>
  <text x="250" y="184" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">顶 j=3：s₂=3 &gt; s₃=1，t = (9−6)/(3−1) = 1.5</text>
  <text x="250" y="200" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">res[3] = −1（哨兵放行）→ 停栈：res[2] = 1.5</text>
  <text x="250" y="216" text-anchor="start" font-size="11" fill="#666" filter="url(#sk)">push(2)</text>
  <g filter="url(#sk)"><rect x="548" y="180" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="562" y="196" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="578" y="180" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="592" y="196" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="608" y="180" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="622" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1.5</text>
  <g filter="url(#sk)"><rect x="638" y="180" width="28" height="22" rx="3" fill="#f0f0f0" stroke="#bbb"/></g>
  <text x="652" y="196" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">−1</text>

  <!-- 行 3：i = 1 -->
  <g filter="url(#sk)"><ellipse cx="52" cy="282" rx="24" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="52" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e" filter="url(#sk)">i=1</text>
  <text x="52" y="314" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#666" filter="url(#sk)">(5, 4)</text>
  <g filter="url(#sk)"><rect x="135" y="274" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="289" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">3 (9,1)</text>
  <g filter="url(#sk)"><rect x="135" y="249" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="264" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">2 (6,3)</text>
  <text x="250" y="272" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">顶 j=2：t = (6−5)/(4−3) = 1 ≤ res[2] = 1.5</text>
  <text x="250" y="288" text-anchor="start" font-size="11" fill="#333" filter="url(#sk)">2 在被吸收前就撞上 → 停栈：res[1] = 1</text>
  <text x="250" y="304" text-anchor="start" font-size="11" fill="#666" filter="url(#sk)">push(1)</text>
  <g filter="url(#sk)"><rect x="548" y="268" width="28" height="22" rx="3" fill="#ffffff" stroke="#ccc"/></g>
  <text x="562" y="284" text-anchor="middle" font-size="10.5" fill="#bbb" filter="url(#sk)">−</text>
  <g filter="url(#sk)"><rect x="578" y="268" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="592" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="608" y="268" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="622" y="284" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">1.5</text>
  <g filter="url(#sk)"><rect x="638" y="268" width="28" height="22" rx="3" fill="#f0f0f0" stroke="#bbb"/></g>
  <text x="652" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">−1</text>

  <!-- 行 4：i = 0（高亮） -->
  <g filter="url(#sk)"><rect x="16" y="338" width="648" height="80" rx="8" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 4"/></g>
  <g filter="url(#sk)"><ellipse cx="52" cy="370" rx="24" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="52" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">i=0</text>
  <text x="52" y="402" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#666" filter="url(#sk)">(3, 4)</text>
  <g filter="url(#sk)"><rect x="135" y="390" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="405" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">3 (9,1)</text>
  <g filter="url(#sk)"><rect x="135" y="365" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="380" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">2 (6,3)</text>
  <g filter="url(#sk)"><rect x="135" y="340" width="70" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="170" y="355" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#33455e" filter="url(#sk)">1 (5,4)</text>
  <text x="213" y="355" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="213" y="380" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="213" y="405" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="250" y="354" text-anchor="start" font-size="10.5" fill="#a04a48" filter="url(#sk)">顶 j=1：s₀=4 ≤ s₁=4 → <tspan font-weight="bold">规则① 弹 1</tspan>（追不上，1 将并入前方慢车队）</text>
  <text x="250" y="370" text-anchor="start" font-size="10.5" fill="#a04a48" filter="url(#sk)">顶 j=2：t = (6−3)/(4−3) = 3 &gt; res[2]=1.5 → <tspan font-weight="bold">规则② 弹 2</tspan>（2 先被吸收）</text>
  <text x="250" y="386" text-anchor="start" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">顶 j=3：t = (9−3)/(4−1) = 2，res[3]=−1 放行 → <tspan font-weight="bold">res[0] = 2</tspan></text>
  <text x="250" y="402" text-anchor="start" font-size="10.5" fill="#666" filter="url(#sk)">push(0)（0 成为新栈底候选，栈变为 [3, 0]）</text>
  <g filter="url(#sk)"><rect x="548" y="352" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="562" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="578" y="352" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="592" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="608" y="352" width="28" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="622" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">1.5</text>
  <g filter="url(#sk)"><rect x="638" y="352" width="28" height="22" rx="3" fill="#f0f0f0" stroke="#bbb"/></g>
  <text x="652" y="368" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">−1</text>

  <!-- 物理时间线 -->
  <g filter="url(#sk)"><rect x="20" y="432" width="640" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e" filter="url(#sk)">物理时间线：res[0] = 2 —— 既非「追不上 car1」的 −1，也非「追 car2 原线」的 3</text>
  <g filter="url(#sk)"><rect x="40" y="462" width="170" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="125" y="478" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">t=1：car1 追上 car2</text>
  <text x="125" y="491" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#sk)">车队速降为 3</text>
  <path d="M 212 479 L 244 479" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="248" y="462" width="170" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="333" y="478" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">t=1.5：车队追上 car3</text>
  <text x="333" y="491" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#sk)">车队速降为 1</text>
  <path d="M 420 479 L 452 479" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="456" y="462" width="184" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="548" y="478" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">t=2：car0 追上车队{1,2,3}</text>
  <text x="548" y="491" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">res[0] = 2 ✓</text>
</svg>
