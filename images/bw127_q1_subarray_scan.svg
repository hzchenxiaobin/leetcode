<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">固定起点 i 向右延伸：或值只增不减，第一个 ≥ k 处即最短</text>

  <g filter="url(#rough2)">
    <rect x="70" y="52" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="136" y="52" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="202" y="52" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="100" y="79">1</text><text x="166" y="79">2</text><text x="232" y="79">3</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="100" y="106">i=0</text><text x="166" y="106">i=1</text><text x="232" y="106">i=2</text>
  </g>
  <text x="286" y="70" font-size="12" fill="#446688" filter="url(#rough2)">nums = [1, 2, 3]</text>
  <text x="286" y="90" font-size="12" fill="#b85450" filter="url(#rough2)">k = 2</text>

  <text x="44" y="150" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i=0</text>
  <rect x="80" y="130" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="151" font-size="12" fill="#8a2b26" text-anchor="middle" filter="url(#rough2)">OR 1 ✗</text>
  <path d="M 212 146 L 244 146" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="130" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="335" y="151" font-size="12" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">OR 1|2 = 3 ✓ len 2</text>

  <text x="44" y="206" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i=1</text>
  <rect x="80" y="186" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="207" font-size="12" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">OR 2 ✓ len 1</text>
  <text x="240" y="207" font-size="11" fill="#7a5c1e" filter="url(#rough2)">命中即 break，不必再看 j=2</text>

  <text x="44" y="262" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i=2</text>
  <rect x="80" y="242" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="145" y="263" font-size="12" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">OR 3 ✓ len 1</text>

  <rect x="60" y="300" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 ans = 1（取 [2] 或 [3] 都行）</text>
  <rect x="60" y="348" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">或运算只会置位：窗口变长 ⇒ 或值不减 ⇒ 可提前 break</text>
</svg>
