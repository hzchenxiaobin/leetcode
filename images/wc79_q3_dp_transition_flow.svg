<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移：枚举最后一刀 t</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最后一刀把前缀变成一个规模更小的同构子问题，于是可以记忆化</text>

  <text x="268" y="66" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">最后一刀 t = 4</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="15" font-weight="bold">
    <rect x="76" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="124" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="172" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="220" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="268" y="76" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="100" y="101" fill="#3a4a66">9</text>
    <text x="148" y="101" fill="#3a4a66">1</text>
    <text x="196" y="101" fill="#3a4a66">2</text>
    <text x="244" y="101" fill="#3a4a66">3</text>
    <text x="292" y="101" fill="#8a6a20">9</text>
  </g>

  <path d="M 268 72 L 268 122" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#9a9a9a">
    <text x="100" y="128">0</text>
    <text x="148" y="128">1</text>
    <text x="196" y="128">2</text>
    <text x="244" y="128">3</text>
    <text x="292" y="128">4</text>
  </g>
  <text x="324" y="101" font-size="11" fill="#b85450" filter="url(#rough2)">i = 5</text>

  <text x="290" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">蓝：前缀 nums[0..t−1] 切成 j−1 段，值取 dp[t][j−1]　　橙：尾段 nums[t..i−1] 取平均</text>
  <text x="290" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">t=4, i=5, j=3 时：dp[4][2] = 11，尾段均值 9/1 = 9 ⇒ 候选值 11 + 9 = 20</text>

  <rect x="60" y="188" width="460" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="206" font-size="10" fill="#8a6a20" filter="url(#rough2)">for j = 2 .. k　←　第 j 层只依赖第 j−1 层，可滚动成一维</text>

  <rect x="88" y="212" width="408" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="230" font-size="10" fill="#3a4a66" filter="url(#rough2)">for i = j .. n　←　i &lt; j 时切不出 j 段，这些格子不填</text>

  <rect x="116" y="238" width="360" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="128" y="256" font-size="10" fill="#3a5a30" filter="url(#rough2)">for t = j−1 .. i−1</text>
  <text x="128" y="276" font-size="10" fill="#3a5a30" filter="url(#rough2)">dp[i][j] = max( dp[t][j−1] + avg(nums[t..i−1]) )</text>
  <text x="128" y="290" font-size="9" fill="#79907a" filter="url(#rough2)">avg 用前缀和算：(pre[i] − pre[t]) / (i − t)</text>

  <text x="290" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案：dp[n][k]　（引理已保证「恰好 k 段」就是「至多 k 段」的最优）</text>
  <text x="290" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(k·n²)　空间 O(nk)，滚动数组后 O(n)</text>
</svg>
