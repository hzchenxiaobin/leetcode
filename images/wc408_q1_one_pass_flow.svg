<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟遍历、两个累加器、一次比较</text>
  <path d="M 200 40 Q 380 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== main flow column, center x = 290 ===== -->
  <g filter="url(#rough2)">
    <rect x="170" y="56" width="240" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="290" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">① single = 0，dbl = 0</text>
  <line x1="290" y1="94" x2="290" y2="110" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="114" width="240" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="290" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 取下一个元素 x</text>
  <line x1="290" y1="152" x2="290" y2="168" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: x < 10 ? -->
  <polygon points="290,168 400,204 290,240 180,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">x &lt; 10 ？</text>

  <line x1="180" y1="204" x2="156" y2="204" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="168" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="48" y="186" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="100" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">single += x</text>

  <line x1="400" y1="204" x2="424" y2="204" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="428" y="186" width="104" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="480" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">dbl += x</text>

  <!-- loop back to ② -->
  <path d="M 100 186 C 100 160, 130 142, 166 135" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="160" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">下一个 x</text>
  <path d="M 480 186 C 480 160, 450 142, 414 135" fill="none" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="160" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">下一个 x</text>

  <!-- merge bus down to compare -->
  <path d="M 100 222 V 256" fill="none" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 480 222 V 256" fill="none" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 100 256 H 480" fill="none" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 290 256 V 270" fill="none" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: single != dbl ? -->
  <polygon points="290,276 400,312 290,348 180,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">single ≠ dbl ？</text>
  <text x="290" y="328" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">（平局即失败）</text>

  <line x1="290" y1="348" x2="290" y2="364" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="304" y="360" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="210" y="368" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="290" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return true</text>

  <line x1="180" y1="312" x2="154" y2="312" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="166" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="22" y="293" width="132" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="88" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">return false</text>

  <!-- ===== right info panel ===== -->
  <g filter="url(#rough2)">
    <rect x="540" y="56" width="196" height="108" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="638" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">复杂度</text>
  <text x="638" y="102" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">时间 O(n)：一趟遍历</text>
  <text x="638" y="120" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">空间 O(1)：两个累加器</text>
  <text x="638" y="138" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">无排序 / 无哈希 / 无 DP</text>

  <g filter="url(#rough2)">
    <rect x="540" y="180" width="196" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="638" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">实现要点</text>
  <text x="638" y="226" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">分界 x &lt; 10（10 归两位）</text>
  <text x="638" y="244" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">总和 ≤ 100 × 99 = 9900</text>
  <text x="638" y="262" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">int 绰绰有余</text>
  <text x="638" y="280" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">判据 ≠：平局即 false</text>

  <g filter="url(#rough2)">
    <rect x="540" y="316" width="196" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="638" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">等价写法</text>
  <text x="638" y="362" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">只存 single 与 total：</text>
  <text x="638" y="380" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">2·single ≠ total</text>
  <text x="638" y="396" text-anchor="middle" font-size="10.5" fill="#444444" filter="url(#rough2)">少一变量，语义稍隐晦</text>
</svg>
