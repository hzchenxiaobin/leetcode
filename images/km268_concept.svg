<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="0 0 640 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b">核心观察：枚举十进制回文流，过滤出 k 进制回文</text>
  <path d="M 130 40 Q 320 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: decimal palindrome stream -->
  <text x="114" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">① 枚举：十进制回文（升序）</text>
  <g filter="url(#sk2)">
    <rect x="45" y="82" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="73" y="82" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="101" y="82" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="129" y="82" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="157" y="82" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="45" y="110" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="73" y="110" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="101" y="110" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="129" y="110" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="157" y="110" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="45" y="138" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="73" y="138" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="101" y="138" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="129" y="138" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="157" y="138" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="45" y="166" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="73" y="166" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="101" y="166" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="129" y="166" width="26" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="157" y="166" width="26" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="58" y="98">1</text>
    <text x="86" y="98">2</text>
    <text x="114" y="98">3</text>
    <text x="142" y="98">4</text>
    <text x="170" y="98">5</text>
    <text x="58" y="126">6</text>
    <text x="86" y="126">7</text>
    <text x="114" y="126">8</text>
    <text x="142" y="126">9</text>
    <text x="170" y="126">11</text>
    <text x="58" y="154">22</text>
    <text x="86" y="154">33</text>
    <text x="114" y="154">44</text>
    <text x="142" y="154">55</text>
    <text x="170" y="154">66</text>
    <text x="58" y="182">77</text>
    <text x="86" y="182">88</text>
    <text x="114" y="182">99</text>
    <text x="142" y="182">101</text>
    <text x="170" y="182">…</text>
  </g>
  <text x="114" y="212" text-anchor="middle" font-size="10.5" fill="#888">长度 L 的回文共 9·10^(⌈L/2⌉−1) 个</text>
  <text x="114" y="230" text-anchor="middle" font-size="10.5" fill="#888">数量级 √(10^L)：比同长整数少一半位数</text>

  <!-- arrow into filter -->
  <path d="M 198 142 L 240 142" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <text x="219" y="132" text-anchor="middle" font-size="10" fill="#8a6414">逐个送入</text>

  <!-- middle: filter -->
  <g filter="url(#sk)">
    <rect x="243" y="110" width="154" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4f6f">② 判定：k 进制回文</text>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="#666">每次 O(log k) 位</text>
  <g font-size="12.5" text-anchor="middle">
    <text x="320" y="200" fill="#2e6e2e">5 → 101 ✓</text>
    <text x="320" y="222" fill="#b85450">6 → 110 ✗</text>
    <text x="320" y="244" fill="#b85450">11 → 1011 ✗</text>
  </g>

  <!-- arrow out of filter -->
  <path d="M 402 142 L 444 142" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)" marker-end="url(#arG)"/>
  <text x="423" y="132" text-anchor="middle" font-size="10" fill="#2e6e2e">命中即收</text>

  <!-- right: collected k-mirror numbers -->
  <text x="525" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">③ 收集：k 镜像数</text>
  <g filter="url(#sk2)">
    <rect x="445" y="84" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="477" y="84" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="509" y="84" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="541" y="84" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="573" y="84" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2e5e2e" text-anchor="middle">
    <text x="460" y="102">1</text>
    <text x="492" y="102">3</text>
    <text x="524" y="102">5</text>
    <text x="556" y="102">7</text>
    <text x="588" y="102">9</text>
  </g>
  <text x="525" y="136" text-anchor="middle" font-size="11" fill="#666">cnt = 5 = n → 立即停止</text>
  <g filter="url(#sk)">
    <rect x="443" y="148" width="164" height="38" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="525" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6414">sum = 1+3+5+7+9 = 25</text>
  <text x="525" y="204" text-anchor="middle" font-size="10.5" fill="#888">升序 ⇒ 恰为最小的 n 个</text>

  <!-- key insight box -->
  <g filter="url(#sk)">
    <rect x="45" y="250" width="550" height="92" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">胜负手：为什么枚举十进制回文，而不是 k 进制回文？</text>
  <text x="320" y="298" text-anchor="middle" font-size="12" fill="#555">k 进制回文同样可由前半构造，但难以按十进制大小升序产出；</text>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#555">十进制回文流天然升序，契合「取最小 n 个」——凑够即停</text>

  <!-- stats boxes -->
  <g filter="url(#sk2)">
    <rect x="45" y="362" width="270" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="362" width="265" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="180" y="383" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4f6f">枚举量：O(P) → O(√P)</text>
  <text x="180" y="402" text-anchor="middle" font-size="10.5" fill="#666">候选坍缩：全部正整数 → 十进制回文</text>
  <text x="462" y="383" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">实测最坏 k=7：枚举 744,544 个</text>
  <text x="462" y="402" text-anchor="middle" font-size="10.5" fill="#666">n = 30，枚举到 L = 11 即凑够</text>
</svg>
