<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="444" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：一个闭式覆盖所有长度</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">n = 8q + r ⇒ ans = 8×(1+2+…+q) + r×(q+1) = (q+1)(4q+r)</text>

  <!-- panel 1: n = 5 -->
  <g filter="url(#sk)">
    <rect x="30" y="72" width="186" height="232" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="123" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">n = 5</text>
  <text x="123" y="114" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">"abcde"</text>
  <g filter="url(#sk)">
    <rect x="38"  y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="59.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="81"  y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="102.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="124" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="48" y="141">a</text><text x="69.5" y="141">b</text><text x="91" y="141">c</text><text x="112.5" y="141">d</text><text x="134" y="141">e</text>
  </g>
  <text x="123" y="170" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">5 个字母全落第 1 层</text>
  <text x="123" y="186" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">其余 3 键空着</text>
  <text x="123" y="252" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">q = 0，r = 5</text>
  <text x="123" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">ans = 5×1</text>
  <text x="123" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 5 ✓</text>

  <!-- panel 2: n = 10 -->
  <g filter="url(#sk)">
    <rect x="227" y="72" width="186" height="232" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="320" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">n = 10</text>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">"xycdefghij"</text>
  <g filter="url(#sk)">
    <rect x="235" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="256.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="278" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="299.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="321" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="342.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="364" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="385.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="245" y="141">x</text><text x="266.5" y="141">y</text><text x="288" y="141">c</text><text x="309.5" y="141">d</text>
    <text x="331" y="141">e</text><text x="352.5" y="141">f</text><text x="374" y="141">g</text><text x="395.5" y="141">h</text>
  </g>
  <g filter="url(#sk)">
    <rect x="235" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="256.5" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="245" y="167">i</text><text x="266.5" y="167">j</text>
  </g>
  <text x="320" y="196" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">前 8 个按 1 次</text>
  <text x="320" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">i、j 挤第 2 层各按 2 次</text>
  <text x="320" y="252" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">q = 1，r = 2</text>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">ans = 8×1 + 2×2</text>
  <text x="320" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 12 ✓</text>

  <!-- panel 3: n = 26 -->
  <g filter="url(#sk)">
    <rect x="424" y="72" width="186" height="232" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="517" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">n = 26（全字母）</text>
  <text x="517" y="114" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">"abcdefghijklmnopqrstuvwxyz"</text>
  <g filter="url(#sk)">
    <rect x="432" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="453.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="475" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="496.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="518" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="539.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="561" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="582.5" y="126" width="20" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="442" y="141">a</text><text x="463.5" y="141">b</text><text x="485" y="141">c</text><text x="506.5" y="141">d</text>
    <text x="528" y="141">e</text><text x="549.5" y="141">f</text><text x="571" y="141">g</text><text x="592.5" y="141">h</text>
  </g>
  <g filter="url(#sk)">
    <rect x="432" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="453.5" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="475" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="496.5" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="518" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="539.5" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="561" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="582.5" y="152" width="20" height="22" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="442" y="167">i</text><text x="463.5" y="167">j</text><text x="485" y="167">k</text><text x="506.5" y="167">l</text>
    <text x="528" y="167">m</text><text x="549.5" y="167">n</text><text x="571" y="167">o</text><text x="592.5" y="167">p</text>
  </g>
  <g filter="url(#sk)">
    <rect x="432" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="453.5" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="475" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="496.5" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="518" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="539.5" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="561" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="582.5" y="178" width="20" height="22" rx="3" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#a06b1a">
    <text x="442" y="193">q</text><text x="463.5" y="193">r</text><text x="485" y="193">s</text><text x="506.5" y="193">t</text>
    <text x="528" y="193">u</text><text x="549.5" y="193">v</text><text x="571" y="193">w</text><text x="592.5" y="193">x</text>
  </g>
  <g filter="url(#sk)">
    <rect x="432" y="204" width="20" height="22" rx="3" fill="#fce4ec" stroke="#b8546a" stroke-width="2"/>
    <rect x="453.5" y="204" width="20" height="22" rx="3" fill="#fce4ec" stroke="#b8546a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="12" font-weight="bold" text-anchor="middle" fill="#a04a5a">
    <text x="442" y="219">y</text><text x="463.5" y="219">z</text>
  </g>
  <text x="517" y="243" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">26 = 8+8+8+2，位次封顶 4</text>
  <text x="517" y="258" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">q = 3，r = 2</text>
  <text x="517" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">ans = 8×(1+2+3) + 2×4</text>
  <text x="517" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 56 ✓</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="30" y="318" width="580" height="52" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="58" y="330" width="13" height="13" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="196" y="330" width="13" height="13" rx="2" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="334" y="330" width="13" height="13" rx="2" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="472" y="330" width="13" height="13" rx="2" fill="#fce4ec" stroke="#b8546a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#4a4a4a">
    <text x="78" y="341">第1位·按1次</text>
    <text x="216" y="341">第2位·按2次</text>
    <text x="354" y="341">第3位·按3次</text>
    <text x="492" y="341">第4位·按4次</text>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#a06b1a" filter="url(#sk)">分层口诀：每 8 个字母一档，每深一档单价 +1</text>

  <!-- closed-form banner -->
  <g filter="url(#sk)">
    <rect x="30" y="384" width="580" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = (q + 1)(4q + r)，q = ⌊n/8⌋，r = n mod 8</text>
  <text x="320" y="423" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">n = 5 → 5　·　n = 10 → 12　·　n = 26 → 56 —— O(1) 直出</text>
</svg>
