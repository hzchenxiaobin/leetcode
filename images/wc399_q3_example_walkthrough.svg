<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例 2 演算：nums1 = [1,2,4,12]，nums2 = [2,4]，k = 3</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt2 = {2:1, 4:1}，nums1 无重复值（cnt1 中每个 c = 1）</text>

  <rect x="40" y="62" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">去重值 x</text>
  <rect x="110" y="62" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x mod k</text>
  <rect x="190" y="62" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">y = x/k</text>
  <rect x="260" y="62" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">约数 d → 查 cnt2</text>
  <rect x="420" y="62" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="81" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贡献</text>

  <rect x="40" y="90" width="70" height="32" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="90" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <rect x="190" y="90" width="330" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="355" y="111" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">k ∤ x → 整支剪掉，不必试除</text>

  <rect x="40" y="122" width="70" height="32" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="122" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="143" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2 ✗</text>
  <rect x="190" y="122" width="330" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="355" y="143" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">k ∤ x → 整支剪掉</text>

  <rect x="40" y="154" width="70" height="32" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="154" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <rect x="190" y="154" width="330" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="355" y="175" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">k ∤ x → 整支剪掉</text>

  <rect x="40" y="186" width="70" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="222" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="110" y="186" width="80" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <rect x="190" y="186" width="70" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="260" y="186" width="160" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="205" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d=1 → cnt2[1]=0 ✗</text>
  <text x="340" y="221" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d=2 → cnt2[2]=1 ✓（d²=y）</text>
  <text x="340" y="237" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">对称 y/d=4 → cnt2[4]=1 ✓</text>
  <rect x="420" y="186" width="100" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 × (0+1+1)</text>
  <text x="470" y="234" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 2</text>

  <text x="280" y="278" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2 —— 恰对应数对 (3,0) 与 (3,1)（12 ÷ 6 与 12 ÷ 12）</text>

  <rect x="70" y="294" width="420" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">再验示例 1（k=1，cnt2 = {1:1, 3:1, 4:1}）：</text>
  <text x="280" y="331" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">x=1 的约数{1}→1；x=3 的{1,3}→2；x=4 的{1,2,4}→2，合计 5 ✓</text>
</svg>
