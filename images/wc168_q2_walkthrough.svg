<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 312" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="312" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：同一个模板跑出 true 与 false</text>
  <text x="310" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每轮只做两件事：找当前最小值 x，然后把 x … x+k−1 各扣 cnt[x] 份</text>

  <rect x="22" y="58" width="276" height="196" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <rect x="322" y="58" width="276" height="196" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <text x="38" y="82" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">可行：nums = [1,2,3,3,4,4,5,6]，k = 4</text>
  <text x="338" y="82" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">不可行：nums = [1,2,3,3,4,4]，k = 3</text>

  <text x="38" y="106" font-size="9.5" fill="#666" filter="url(#rough2)">cnt：1×1  2×1  3×2  4×2  5×1  6×1</text>
  <text x="338" y="106" font-size="9.5" fill="#666" filter="url(#rough2)">cnt：1×1  2×1  3×2  4×2</text>

  <path d="M 38 114 L 282 114" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 338 114 L 582 114" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="38" y="136" font-size="10" fill="#333" filter="url(#rough2)">① x=1，c=1 → 取 {1,2,3,4}</text>
  <text x="38" y="154" font-size="9.5" fill="#666" filter="url(#rough2)">剩余 3×1  4×1  5×1  6×1</text>
  <text x="338" y="136" font-size="10" fill="#333" filter="url(#rough2)">① x=1，c=1 → 取 {1,2,3}</text>
  <text x="338" y="154" font-size="9.5" fill="#666" filter="url(#rough2)">剩余 3×1  4×2</text>

  <path d="M 38 164 L 282 164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 338 164 L 582 164" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="38" y="186" font-size="10" fill="#333" filter="url(#rough2)">② x=3，c=1 → 取 {3,4,5,6}</text>
  <text x="38" y="204" font-size="9.5" fill="#666" filter="url(#rough2)">剩余：全部为 0</text>
  <text x="338" y="186" font-size="10" fill="#333" filter="url(#rough2)">② x=3，c=1 → 需 {3,4,5}</text>
  <text x="338" y="204" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">但 5 的份数为 0 ⇒ 立刻失败</text>

  <path d="M 38 214 L 282 214" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 338 214 L 582 214" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="38" y="238" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">⇒ true（{1,2,3,4} 与 {3,4,5,6}）</text>
  <text x="338" y="238" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⇒ false（3 之后接不上 5）</text>

  <rect x="22" y="262" width="576" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="38" y="280" font-size="10" fill="#8a6a20" filter="url(#rough2)">关键：某个值的份数一旦不够就立刻 false，不需要回溯；</text>
  <text x="38" y="296" font-size="10" fill="#8a6a20" filter="url(#rough2)">可行时每轮至少消耗 k 个元素，所以外层循环不超过 n/k 轮。</text>
</svg>
