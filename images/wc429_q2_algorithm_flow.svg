<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贪心流程：排序 + 一趟扫描</text>

  <!-- ① 排序 -->
  <rect x="60" y="44" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="66" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 排序 nums（区间端点随之单调）</text>
  <path d="M170,78 L170,102" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="60" y="106" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② last = -∞，ans = 0</text>
  <path d="M170,140 L170,164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 取元素 -->
  <rect x="60" y="168" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="190" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 取下一个元素 x</text>
  <path d="M170,202 L170,232" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 计算 cur -->
  <rect x="60" y="236" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="258" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">④ cur = max(x-k, last+1)</text>
  <path d="M170,270 L170,300" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="170,304 290,346 170,388 50,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="351" text-anchor="middle" font-size="12.5" fill="#7a6020" filter="url(#rough2)">cur ≤ x+k ?</text>

  <!-- 是 → 放置 -->
  <path d="M290,346 L346,346" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="336" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="350" y="329" width="190" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="351" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">last = cur，ans++</text>

  <!-- 否 → 跳过 -->
  <path d="M170,388 L170,437 L346,437" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="412" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="350" y="420" width="190" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="442" text-anchor="middle" font-size="12.5" fill="#8a3a35" filter="url(#rough2)">跳过 x，last 不变</text>

  <!-- 回环：两个分支都回到 ③ -->
  <path d="M540,346 L570,346" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M540,437 L570,437" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M570,437 L570,185 L288,185" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="176" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">回到 ③ 取下一元素</text>

  <!-- 取尽 → 返回 -->
  <path d="M60,185 L30,185 L30,447 L54,447" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="300" font-size="11" fill="#888" filter="url(#rough2)">取</text>
  <text x="44" y="318" font-size="11" fill="#888" filter="url(#rough2)">尽</text>
  <rect x="60" y="430" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="452" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">⑤ 返回 ans</text>
</svg>
