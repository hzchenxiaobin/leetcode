<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa" />

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "owoztneoer"</text>
  <text x="310" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">字母频次 → 直接量 → 减法量 → 升序拼接，全程只碰一次字母表</text>

  <g filter="url(#rough2)">
    <rect x="16" y="64" width="270" height="224" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" />
  </g>
  <text x="32" y="88" font-size="11" fill="#2f4560" font-weight="bold" filter="url(#rough2)">① 只统计用得到的 10 个字母</text>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#33506a">
    <rect x="30" y="100" width="44" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="5" />
    <text x="52" y="117">z = 1</text>
    <rect x="80" y="100" width="44" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="5" />
    <text x="102" y="117">w = 1</text>
    <rect x="130" y="100" width="44" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="5" />
    <text x="152" y="117">u = 0</text>
    <rect x="180" y="100" width="44" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="5" />
    <text x="202" y="117">x = 0</text>
    <rect x="230" y="100" width="44" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="5" />
    <text x="252" y="117">g = 0</text>

    <rect x="30" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" />
    <text x="52" y="151">o = 3</text>
    <rect x="80" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" />
    <text x="102" y="151">h = 0</text>
    <rect x="130" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" />
    <text x="152" y="151">f = 0</text>
    <rect x="180" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" />
    <text x="202" y="151">s = 0</text>
    <rect x="230" y="134" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" />
    <text x="252" y="151">i = 0</text>
  </g>

  <text x="34" y="186" font-size="10" fill="#2f4560" filter="url(#rough2)">绿色行：专属字母，直接给出 c₀=1、c₂=1、c₄=c₆=c₈=0</text>
  <text x="34" y="210" font-size="10" fill="#555" filter="url(#rough2)">o = 3 → c₁ = 3 − c₀ − c₂ − c₄ = 1</text>
  <text x="34" y="232" font-size="10" fill="#555" filter="url(#rough2)">h = f = s = i = 0 → c₃ = c₅ = c₇ = c₉ = 0</text>
  <text x="34" y="254" font-size="10" fill="#888" filter="url(#rough2)">字母 t、n、e、r 只是陪衬，不参与任何判定</text>
  <text x="34" y="276" font-size="10" fill="#888" filter="url(#rough2)">长度校验：3+3+4 = 11 = |s|</text>

  <g filter="url(#rough2)">
    <rect x="298" y="64" width="306" height="224" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" />
  </g>
  <text x="314" y="88" font-size="11" fill="#2f4a24" font-weight="bold" filter="url(#rough2)">② 反推出的数字 0~9 个数</text>

  <g filter="url(#rough2)">
    <rect x="312" y="100" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="337" y="116" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">0</text>
    <text x="337" y="133" text-anchor="middle" font-size="14" fill="#2f4a24">1</text>

    <rect x="369" y="100" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="394" y="116" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">1</text>
    <text x="394" y="133" text-anchor="middle" font-size="14" fill="#2f4a24">1</text>

    <rect x="426" y="100" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="451" y="116" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">2</text>
    <text x="451" y="133" text-anchor="middle" font-size="14" fill="#2f4a24">1</text>

    <rect x="483" y="100" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="508" y="116" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">3</text>
    <text x="508" y="133" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="540" y="100" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="565" y="116" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">4</text>
    <text x="565" y="133" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="312" y="150" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="337" y="166" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">5</text>
    <text x="337" y="183" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="369" y="150" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="394" y="166" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">6</text>
    <text x="394" y="183" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="426" y="150" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="451" y="166" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">7</text>
    <text x="451" y="183" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="483" y="150" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="508" y="166" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">8</text>
    <text x="508" y="183" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>

    <rect x="540" y="150" width="50" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="5" />
    <text x="565" y="166" text-anchor="middle" font-size="10" fill="#33502a" font-weight="bold">9</text>
    <text x="565" y="183" text-anchor="middle" font-size="14" fill="#7a7a7a">0</text>
  </g>

  <text x="314" y="214" font-size="10" fill="#33502a" filter="url(#rough2)">③ 按 0 → 9 升序拼接（c₀、c₁、c₂ 各一个）</text>

  <g filter="url(#rough2)">
    <rect x="430" y="224" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" />
    <text x="490" y="252" text-anchor="middle" font-size="20" fill="#8a2f28" font-weight="bold">"012"</text>
  </g>

  <text x="310" y="312" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例 2 同理："fviefuro" 的 f=2、u=1、i=1 → c₄ = u = 1，c₅ = f − c₄ = 1，c₉ = i − c₅ − c₆ − c₈ = 0</text>
  <text x="310" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余字母 o=1 且零/二/四都已定量，得 c₁ = 1 − 0 − 0 − 1 = 0，于是按序拼出 "45"</text>
  <text x="310" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">走查要点：所有减法都在同一个「已知集合」里取值，不存在联立方程，也没有回溯</text>
</svg>