<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="28" font-size="15" fill="#444" font-weight="bold">示例 1 演算：dist[i][j] = i，答案 3</text>
    <text x="280" y="50" font-size="10.5" fill="#888">4×4 网格方向逐行交替，每向下跨一行都必须改一次方向</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#777" text-anchor="end">
    <text x="54" y="110">行 0</text>
    <text x="54" y="162">行 1</text>
    <text x="54" y="214">行 2</text>
    <text x="54" y="266">行 3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="62" y="78" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="114" y="78" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="166" y="78" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="218" y="78" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>

    <rect x="62" y="130" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="114" y="130" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="166" y="130" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="218" y="130" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>

    <rect x="62" y="182" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="114" y="182" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="166" y="182" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="218" y="182" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>

    <rect x="62" y="234" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="114" y="234" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="166" y="234" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="218" y="234" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">
    <text x="88" y="110">0</text>
    <text x="140" y="110">0</text>
    <text x="192" y="110">0</text>
    <text x="244" y="110">0</text>
    <text x="88" y="162">1</text>
    <text x="140" y="162">1</text>
    <text x="192" y="162">1</text>
    <text x="244" y="162">1</text>
    <text x="88" y="214">2</text>
    <text x="140" y="214">2</text>
    <text x="192" y="214">2</text>
    <text x="244" y="214">2</text>
    <text x="88" y="266">3</text>
    <text x="140" y="266">3</text>
    <text x="192" y="266">3</text>
    <text x="244" y="266">3</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10" fill="#777">
    <text x="88" y="124">→</text>
    <text x="140" y="124">→</text>
    <text x="192" y="124">→</text>
    <text x="244" y="124">→</text>
    <text x="88" y="176">←</text>
    <text x="140" y="176">←</text>
    <text x="192" y="176">←</text>
    <text x="244" y="176">←</text>
    <text x="88" y="228">→</text>
    <text x="140" y="228">→</text>
    <text x="192" y="228">→</text>
    <text x="244" y="228">→</text>
    <text x="88" y="280">←</text>
    <text x="140" y="280">←</text>
    <text x="192" y="280">←</text>
    <text x="244" y="280">←</text>
  </g>

  <text x="170" y="308" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">格子内大数字 = dist，角落小箭头 = 原方向</text>

  <g filter="url(#rough2)">
    <rect x="304" y="86" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="304" y="110" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="304" y="134" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="304" y="158" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="326" y="98">dist = 0（起点所在层）</text>
    <text x="326" y="122">dist = 1（改 1 次）</text>
    <text x="326" y="146">dist = 2（改 2 次）</text>
    <text x="326" y="170">dist = 3（改 3 次）</text>
  </g>

  <rect x="302" y="186" width="238" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <text x="316" y="206" font-weight="bold">真正需要改的 3 个格子</text>
    <text x="316" y="226">(0,3)：1 → 3（向下进第 1 行）</text>
    <text x="316" y="246">(1,0)：2 → 3（向下进第 2 行）</text>
    <text x="316" y="266">(2,3)：1 → 3（向下进第 3 行）</text>
  </g>

  <rect x="302" y="300" width="238" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#3a4a66">
    <text x="316" y="320">终点 (3,3) 的箭头是 2（向左），</text>
    <text x="316" y="338">但到达即结束，不必改 —— 所以是 3 不是 4。</text>
    <text x="316" y="354">dist 只统计「离开某格」的代价。</text>
  </g>

  <text x="280" y="392" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">路径：(0,0)→(0,3) ↓ (1,3)→(1,0) ↓ (2,0)→(2,3) ↓ (3,3)</text>
</svg>
