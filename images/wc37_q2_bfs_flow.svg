<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先特判 depth == 1，再 BFS 下潜</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按层推进：整层出队、非空孩子入队，循环 depth−2 次就停在 depth−1 层</text>

  <polygon points="280,65 412,95 280,125 148,95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">depth == 1 ?</text>

  <path d="M 148 95 L 92 95 L 92 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="18" y="142" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="93" y="163" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">新建根节点 v = val</text>
  <text x="93" y="181" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">v.left = root，返回 v</text>

  <path d="M 280 125 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="145" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="160" width="262" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="185" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">队列 q ← {root}，curDepth ← 1</text>

  <path d="M 281 200 L 281 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="136" y="230" width="290" height="62" fill="#ffffff" stroke="#888888" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="253" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">while curDepth &lt; depth−1：</text>
  <text x="281" y="274" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">整层出队 → 非空孩子入队 → curDepth++</text>

  <path d="M 430 246 C 490 240 490 286 432 282" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="264" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">重复</text>

  <path d="M 281 292 L 281 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="322" width="262" height="38" fill="#ffffff" stroke="#888888" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="346" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">q 中恰好是第 depth−1 层全部节点</text>

  <path d="M 281 360 L 281 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="96" y="390" width="368" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="411" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">每个 cur：newL = val 节点，newL.left ← cur.left</text>
  <text x="280" y="432" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">newR = val 节点，newR.right ← cur.right；再挂回 cur 两侧</text>

  <path d="M 281 448 L 281 472" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="474" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="281" y="496" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 root</text>

  <text x="280" y="526" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)：只访问 depth−1 层以上的节点；额外空间 O(最宽层)</text>
</svg>
