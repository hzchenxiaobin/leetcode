<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：floor = "10110101"，2 条毯、毯长 2</text>

  <!-- 砖块（8 块） -->
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="132" y="70" width="52" height="40" fill="#333" stroke="#111" stroke-width="1.5" rx="4"/>
    <rect x="184" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="236" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="288" y="70" width="52" height="40" fill="#333" stroke="#111" stroke-width="1.5" rx="4"/>
    <rect x="340" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="392" y="70" width="52" height="40" fill="#333" stroke="#111" stroke-width="1.5" rx="4"/>
    <rect x="444" y="70" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <text x="106" y="95" fill="#8a6a20">1</text>
    <text x="158" y="95" fill="#eee">0</text>
    <text x="210" y="95" fill="#8a6a20">1</text>
    <text x="262" y="95" fill="#8a6a20">1</text>
    <text x="314" y="95" fill="#eee">0</text>
    <text x="366" y="95" fill="#8a6a20">1</text>
    <text x="418" y="95" fill="#eee">0</text>
    <text x="470" y="95" fill="#8a6a20">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="106" y="122">0</text><text x="158" y="122">1</text><text x="210" y="122">2</text>
    <text x="262" y="122">3</text><text x="314" y="122">4</text><text x="366" y="122">5</text>
    <text x="418" y="122">6</text><text x="470" y="122">7</text>
  </g>

  <!-- 毯子 1：盖 [2,3] -->
  <g filter="url(#rough2)">
    <rect x="184" y="46" width="104" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6"/>
  </g>
  <text x="236" y="40" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">毯 1 → 盖住 2 块白砖</text>

  <!-- 毯子 2：盖 [5,6] -->
  <g filter="url(#rough2)">
    <rect x="340" y="28" width="104" height="18" fill="#8fb3d9" stroke="#446688" stroke-width="2.4" rx="6"/>
  </g>
  <text x="392" y="22" font-size="12.5" fill="#446688" filter="url(#rough2)" text-anchor="middle">毯 2 → 盖住 1 块白砖</text>
  <g filter="url(#rough2)">
    <path d="M 340 37 C 300 60, 250 60, 236 50" fill="none" stroke="#8fb3d9" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <!-- 露出标注 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450">
    <text x="106" y="146" text-anchor="middle">露出</text>
    <text x="470" y="146" text-anchor="middle">露出</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 106 130 L 106 138" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 470 130 L 470 138" stroke="#b85450" stroke-width="1.8" fill="none"/>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="180" width="440" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#5a4a20">
    <text x="78" y="210">pre（白砖前缀和）= [0,1,1,2,3,3,4,4,5]</text>
    <text x="78" y="234">盖住 [2,3] 的白砖数 = pre[4] − pre[2] = 3 − 1 = 2</text>
    <text x="78" y="258">dp 沿两条转移取 min，最终 dp[8][2] = 2</text>
    <text x="78" y="282">露出的白砖：下标 0 与 7，答案 2 ✓</text>
  </g>
</svg>
