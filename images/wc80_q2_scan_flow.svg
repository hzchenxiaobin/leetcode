<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 456" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="456" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一遍扫描：只看「当前节点 + 后继」</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">哈希集合 O(1) 判定，单向链表一次遍历</text>

  <rect x="100" y="60" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="83" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">S = set(nums)　建哈希集合</text>

  <path d="M 230 96 L 230 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="118" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="230" y="140" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">ans = 0　cur = head</text>

  <path d="M 230 152 L 230 165" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="230,169 380,205 230,241 80,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">cur.val ∈ S　且</text>
  <text x="230" y="215" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">（cur.next 为空 或 cur.next.val ∉ S）</text>

  <path d="M 150 222 L 150 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="239" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="80" y="252" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="275" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">ans += 1</text>

  <path d="M 320 219 L 320 250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="237" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="250" y="252" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="275" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">不计数</text>

  <g stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 150 288 L 150 300"/>
    <path d="M 320 288 L 320 300"/>
    <path d="M 150 300 L 320 300"/>
    <path d="M 235 300 L 235 312" marker-end="url(#arr)"/>
  </g>

  <rect x="150" y="314" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="235" y="336" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">cur = cur.next</text>

  <path d="M 150 331 L 60 331 L 60 205 L 76 205" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="352" font-size="9.5" fill="#888" filter="url(#rough2)">cur 非空 → 回到判定</text>

  <path d="M 235 348 L 235 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="360" font-size="9.5" fill="#888" filter="url(#rough2)">cur 为空</text>

  <rect x="130" y="368" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="235" y="390" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">返回 ans（组件个数）</text>

  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)：每个节点只被访问一次，集合查询 O(1)</text>
  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空间 O(n)：哈希集合存 nums 的至多 n 个值</text>
</svg>
