<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序后取连续段，目标值取中位数</text>
  <path d="M 130 40 Q 320 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#666">排序后 a = [ 1, 2, 3, 5, 6, 9, 12, 15 ]，选中段 = 蓝色格子，窗口外 = 灰色</text>

  <g filter="url(#sk)"><rect x="60" y="86" width="58" height="40" rx="5" fill="#eeeeea" stroke="#b8b6ae" stroke-width="1.2"/></g>
  <text x="89" y="111" text-anchor="middle" font-size="14" fill="#999">1</text>
  <g filter="url(#sk)"><rect x="126" y="86" width="58" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="155" y="111" text-anchor="middle" font-size="14" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="192" y="86" width="58" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="221" y="111" text-anchor="middle" font-size="14" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="258" y="86" width="58" height="40" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="287" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="324" y="86" width="58" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="353" y="111" text-anchor="middle" font-size="14" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="390" y="86" width="58" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="419" y="111" text-anchor="middle" font-size="14" fill="#2b6e9e">9</text>
  <g filter="url(#sk)"><rect x="456" y="86" width="58" height="40" rx="5" fill="#eeeeea" stroke="#b8b6ae" stroke-width="1.2"/></g>
  <text x="485" y="111" text-anchor="middle" font-size="14" fill="#999">12</text>
  <g filter="url(#sk)"><rect x="522" y="86" width="58" height="40" rx="5" fill="#eeeeea" stroke="#b8b6ae" stroke-width="1.2"/></g>
  <text x="551" y="111" text-anchor="middle" font-size="14" fill="#999">15</text>

  <text x="287" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">中位数 t</text>
  <path d="M 287 79 L 287 82" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>

  <path d="M 155 130 Q 220 158 283 130" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 221 130 Q 254 150 285 132" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 353 130 Q 320 152 290 132" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 419 130 Q 353 162 291 130" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="176" y="160" text-anchor="middle" font-size="11" fill="#2b6e9e">左半：各 −1 挪到 t</text>
  <text x="420" y="160" text-anchor="middle" font-size="11" fill="#2e6e2e">右半：各 +1 挪到 t</text>

  <g filter="url(#sk)"><rect x="60" y="182" width="252" height="72" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="186" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察 1：保留的元素 = 排序后连续段</text>
  <text x="186" y="228" text-anchor="middle" font-size="11.5" fill="#444">固定个数与目标值，按 |aᵢ − t| 就近挑选</text>
  <text x="186" y="246" text-anchor="middle" font-size="11.5" fill="#444">选出的必是围绕 t 的一段 —— 交换论证见证明</text>

  <g filter="url(#sk)"><rect x="328" y="182" width="252" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="454" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察 2：目标值 = 段内中位数</text>
  <text x="454" y="228" text-anchor="middle" font-size="11.5" fill="#444">代价 Σ|aᵢ − t| 是 t 的凸函数</text>
  <text x="454" y="246" text-anchor="middle" font-size="11.5" fill="#444">最小值恰在带权中位数（段内元素）处取到</text>

  <path d="M 186 256 L 186 278" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 454 256 L 454 278" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="282" width="520" height="52" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">问题坍缩成：找最长的连续段，使其「归拢到中位数」的代价 ≤ k</text>
  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#444">段的代价只与端点有关 ⇒ 前缀和 O(1) 算出 ⇒ 滑动窗口 O(n) 扫出最长段</text>

  <g filter="url(#sk)"><rect x="60" y="348" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="320" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">众数频率 = 段长 ⇒ 最大化频率 = 最大化可行窗口长度</text>
</svg>
