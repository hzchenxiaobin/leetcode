<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="490" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：先卡长度，再在双写串里找一次</text>

  <rect x="250" y="66" width="220" height="42" rx="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="13.5" fill="#2b4a6f" filter="url(#rough2)">rotateString(s, goal)</text>

  <path d="M 360 108 L 360 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,140 484,184 360,228 236,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="189" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">len(s) == len(goal) ?</text>

  <path d="M 484 184 L 534 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="538" y="164" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="613" y="189" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">返回 false</text>

  <path d="M 360 228 L 360 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="246" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="240" y="258" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="285" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">t = s + s（长度 2n）</text>

  <path d="M 360 302 L 360 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="330" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="357" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">pos = t.find(goal)</text>

  <path d="M 360 374 L 360 396" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,400 484,436 360,472 236,436" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="441" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">pos ≠ npos ?</text>

  <path d="M 236 436 L 186 436" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="428" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="416" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="441" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">返回 false</text>

  <path d="M 484 436 L 534 436" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="428" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="538" y="416" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="613" y="441" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">返回 true</text>
</svg>
