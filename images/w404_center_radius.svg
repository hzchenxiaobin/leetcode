<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#8a7a4e" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">中心：ecc(c) = ⌈d/2⌉，任何点都不可能更小</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- diameter path -->
  <g filter="url(#sk)">
    <path d="M 80 250 L 150 250 L 220 250 L 290 250 L 360 250 L 430 250 L 500 250" fill="none" stroke="#446688" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="80" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="150" cy="250" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="220" cy="250" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="290" cy="250" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="360" cy="250" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="430" cy="250" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="500" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="80" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88" filter="url(#sk)">a</text>
  <text x="290" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">c</text>
  <text x="500" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88" filter="url(#sk)">b</text>
  <text x="290" y="225" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04038" filter="url(#sk)">中心 = 直径路径中点</text>

  <!-- half brackets -->
  <g filter="url(#sk)">
    <path d="M 80 272 L 80 284 L 290 284 L 290 272" fill="none" stroke="#8a7a4e" stroke-width="1.4"/>
    <path d="M 290 272 L 290 284 L 500 284 L 500 272" fill="none" stroke="#8a7a4e" stroke-width="1.4"/>
  </g>
  <text x="185" y="302" text-anchor="middle" font-size="11.5" fill="#8a6d2e" filter="url(#sk)">⌊d/2⌋</text>
  <text x="395" y="302" text-anchor="middle" font-size="11.5" fill="#8a6d2e" filter="url(#sk)">⌈d/2⌉</text>

  <!-- node y above, projects onto right half -->
  <g filter="url(#sk)">
    <path d="M 430 162 L 430 238" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 430 150 Q 300 108 92 238" fill="none" stroke="#9db98d" stroke-width="1.3" stroke-dasharray="3 4"/>
    <circle cx="430" cy="150" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="430" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">y</text>
  <text x="452" y="204" font-size="11" fill="#4a7a3a" filter="url(#sk)">投影 h′</text>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">投影在右半段：dist(y,c) = dist(y,a) − ⌊d/2⌋ ≤ ⌈d/2⌉</text>

  <!-- node x below, projects onto left half -->
  <g filter="url(#sk)">
    <path d="M 150 348 L 150 262" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 150 360 Q 330 424 492 264" fill="none" stroke="#9db98d" stroke-width="1.3" stroke-dasharray="3 4"/>
    <circle cx="150" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="150" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x</text>
  <text x="126" y="308" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#sk)">投影 h</text>
  <text x="330" y="442" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">投影在左半段：dist(x,c) = dist(x,b) − ⌈d/2⌉ ≤ ⌊d/2⌋ ≤ ⌈d/2⌉</text>

  <!-- bottom band -->
  <g filter="url(#sk)">
    <rect x="36" y="456" width="568" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="474" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">下界（任意点）：dist(x,a) + dist(x,b) ≥ d ⟹ ecc(x) ≥ ⌈d/2⌉</text>
  <text x="320" y="491" text-anchor="middle" font-size="11" fill="#8a6d2e" filter="url(#sk)">半径 r = min ecc = ⌈d/2⌉；d 为奇数时中点在边上，相邻两端点 ecc 均为 ⌈d/2⌉</text>
</svg>
