<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">为什么不能用「分组压缩」以外的简单比较</text>
  <rect x="40" y="60" width="180" height="70" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130.0" y="98.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直接比较长度？</text>
  <rect x="240" y="60" width="180" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="93.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">比较字符集？</text>
  <rect x="440" y="60" width="180" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530.0" y="93.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐位比较？</text>
  <text x="130" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">aaleex 更长</text>
  <text x="330" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ssaaedd 含 d</text>
  <text x="530" y="148" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a vs a 相同、a vs a 相同…</text>
  <rect x="120" y="182" width="420" height="70" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="221.6" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">正确做法：双指针同时维护「name 走到哪」「typed 走到哪」</text>
  <text x="330" y="286" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">必要条件：typed 的长度 ≥ name 的长度（长按只会变长）</text>
  <text x="330" y="314" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">充分条件：两指针能同时走到末尾，且 typed 的多余字符全部是相邻重复</text>
  <text x="330" y="350" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">这两个条件合起来就是「typed 可能是 name 的长按结果」的完整刻画</text>
</svg>
