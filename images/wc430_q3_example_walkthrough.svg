<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：两轮即凑齐全部答案</text>
  <path d="M 150 36 Q 320 43 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组 -->
  <text x="320" y="54" text-anchor="middle" font-size="11" fill="#999">nums = [3, 4, 3, 4, 3, 4, 3, 4]（下标 0…7）</text>
  <g filter="url(#sk)">
    <rect x="160" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="200" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="240" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="280" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="320" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="360" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="400" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="440" y="60" width="40" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#555">
    <text x="180" y="82">3</text>
    <text x="220" y="82">4</text>
    <text x="260" y="82">3</text>
    <text x="300" y="82">4</text>
    <text x="340" y="82">3</text>
    <text x="380" y="82">4</text>
    <text x="420" y="82">3</text>
    <text x="460" y="82">4</text>
  </g>
  <g font-size="9" text-anchor="middle" fill="#aaa">
    <text x="180" y="102">0</text>
    <text x="220" y="102">1</text>
    <text x="260" y="102">2</text>
    <text x="300" y="102">3</text>
    <text x="340" y="102">4</text>
    <text x="380" y="102">5</text>
    <text x="420" y="102">6</text>
    <text x="460" y="102">7</text>
  </g>

  <!-- Panel 1: r = 4 -->
  <g filter="url(#sk)">
    <rect x="50" y="112" width="540" height="116" rx="10" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="66" y="146" width="228" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="312" y="146" width="264" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="66" y="134" font-size="13" font-weight="bold" fill="#2b6e9e">第 r = 4 轮</text>
  <text x="180" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">入表 q = r−2 = 2：</text>
  <text x="180" y="184" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">(p=0, q=2) → 3/3 → 1/1</text>
  <text x="180" y="205" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b6e9e">cnt = { 1/1 : 1 }</text>
  <text x="444" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">查询 s ≥ r+2 = 6：</text>
  <text x="444" y="184" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6e2e">s=6：3/3 = 1/1 → 命中 +1</text>
  <text x="444" y="205" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#999">s=7：4/3 → 未命中 +0</text>
  <text x="578" y="226" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">本轮 ans += 1</text>

  <!-- Panel 2: r = 5 -->
  <g filter="url(#sk)">
    <rect x="50" y="238" width="540" height="116" rx="10" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="66" y="272" width="228" height="70" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="312" y="272" width="264" height="70" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="66" y="260" font-size="13" font-weight="bold" fill="#7a5415">第 r = 5 轮</text>
  <text x="180" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">入表 q = r−2 = 3：</text>
  <text x="180" y="310" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">(0,3)→3/4；(1,3)→4/4→1/1</text>
  <text x="180" y="331" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b6e9e">cnt = { 1/1 : 2, 3/4 : 1 }</text>
  <text x="444" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">查询 s ≥ r+2 = 7：</text>
  <text x="444" y="310" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6e2e">s=7：4/4 = 1/1 → cnt[1/1] = 2</text>
  <text x="444" y="331" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6e2e">命中，+2</text>
  <text x="578" y="352" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">本轮 ans += 2</text>

  <!-- 底部结论条 -->
  <g filter="url(#sk)">
    <rect x="100" y="366" width="440" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans = 1 + 2 = 3 ✓（其余轮贡献为 0）</text>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#555">对应四元组 (0,2,4,6)、(1,3,5,7)、(0,2,5,7)</text>
</svg>
