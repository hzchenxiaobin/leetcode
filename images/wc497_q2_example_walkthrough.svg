<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：[3,4,5] 与 [2,4,2]</text>

  <!-- 左：示例 1 直角三角形 -->
  <text x="150" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：sides = [3, 4, 5]</text>

  <line x1="70" y1="250" x2="190" y2="250" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="70" y1="90" x2="70" y2="250" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="70" y1="90" x2="190" y2="250" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 角弧与直角标记 -->
  <path d="M 70,110 A 20 20 0 0 0 82,106" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 178,234 A 20 20 0 0 0 170,250" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 70,232 L 88,232 L 88,250" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="58" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">A</text>
  <text x="202" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="52" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <text x="130" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">a = 3</text>
  <text x="44" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b = 4</text>
  <text x="142" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">c = 5</text>
  <text x="102" y="78" font-size="11.5" fill="#b85450" filter="url(#rough2)">≈ 36.87°</text>
  <text x="168" y="228" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≈ 53.13°</text>
  <text x="96" y="242" font-size="11.5" fill="#446688" filter="url(#rough2)">90°</text>

  <!-- 右：三个角的计算 -->
  <rect x="285" y="74" width="263" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="94" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cos A = (4² + 5² − 3²) / (2·4·5) = 0.80</text>
  <text x="416" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">→ A = acos(0.8) ≈ 36.87°</text>

  <rect x="285" y="130" width="263" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cos B = (3² + 5² − 4²) / (2·3·5) = 0.60</text>
  <text x="416" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">→ B = acos(0.6) ≈ 53.13°</text>

  <rect x="285" y="186" width="263" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="206" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cos C = (3² + 4² − 5²) / (2·3·4) = 0.00</text>
  <text x="416" y="224" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">→ C = acos(0) = 90°</text>

  <rect x="285" y="242" width="263" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="265" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">36.87° + 53.13° + 90° = 180° ✓</text>

  <text x="416" y="304" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">返回 [36.86990, 53.13010, 90.00000]</text>

  <!-- 底部：示例 2 退化 -->
  <text x="160" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：sides = [2, 4, 2]，排序得 a=2, b=2, c=4</text>

  <line x1="70" y1="380" x2="190" y2="380" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <line x1="190" y1="380" x2="310" y2="380" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="70" cy="380" r="4.5" fill="#fafafa" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="190" cy="380" r="4.5" fill="#fafafa" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="310" cy="380" r="4.5" fill="#fafafa" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">B</text>
  <text x="190" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <text x="310" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <text x="130" y="400" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a = 2</text>
  <text x="250" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b = 2</text>
  <text x="190" y="420" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a + b = c = 4：三点共线，面积 0</text>

  <rect x="330" y="352" width="218" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a + b = 4 ≤ c = 4</text>
  <text x="439" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">不满足 &gt; ⇒ 返回 []</text>
</svg>
