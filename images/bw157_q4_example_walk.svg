<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：queries = [[1,4],[3,4],[2,5]]</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">边数 d -&gt; 答案</text>
  <rect x="40" y="66" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">查询</text>
  <rect x="140" y="66" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="180.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">lca</text>
  <rect x="220" y="66" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dep[u]+dep[v]-2dep[lca]</text>
  <rect x="440" y="66" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="40" y="94" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,4]</text>
  <rect x="140" y="94" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="220" y="94" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0 + 2 - 0 = 2</text>
  <rect x="440" y="94" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^1 = 2</text>
  <rect x="40" y="122" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[3,4]</text>
  <rect x="140" y="122" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="220" y="122" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 + 2 - 2 = 1</text>
  <rect x="440" y="122" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^0 = 1</text>
  <rect x="40" y="150" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,5]</text>
  <rect x="140" y="150" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="220" y="150" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 + 2 - 0 = 3</text>
  <rect x="440" y="150" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^2 = 4</text>
  <rect x="40" y="178" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,1]</text>
  <rect x="140" y="178" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="220" y="178" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="330.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="440" y="178" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="500.0" y="196.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0（无自环）</text>
  <text x="40" y="280" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">与官方输出 [2,1,4] 一致；II 版比 I 版多的就是这套 LCA + 2 的幂预处理</text>
</svg>
