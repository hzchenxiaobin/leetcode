<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="290" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：枚举区间内每个数，再逐个内部位判峰谷</text>

  <rect x="150" y="46" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0；x = num1</text>

  <path d="M260,82 L260,106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="140" y="110" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = 十进制串(x)；i = 1</text>

  <path d="M260,146 L260,170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <rect x="90" y="174" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">若 i+1 &lt; len 且 s[i] 严格大于两侧 或 严格小于两侧</text>
  <text x="260" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ ans += 1；i++</text>

  <path d="M260,218 L260,238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>

  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">x++；x ≤ num2 则重来</text>
  <text x="260" y="276" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <text x="430" y="190" font-size="11" fill="#999" filter="url(#rough2)">O(R·D)</text>
</svg>
