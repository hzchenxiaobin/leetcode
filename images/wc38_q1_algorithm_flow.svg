<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：算两个候选，取较大者</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">签到题的最短路径：排序 → 两个乘积 → max</text>

  <rect x="60" y="60" width="244" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="182" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 nums（3 ≤ n ≤ 10⁴）</text>

  <path d="M 182 96 L 182 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="118" width="244" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="182" y="136" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">升序排序 a[0] ≤ … ≤ a[n−1]</text>
  <text x="182" y="152" text-anchor="middle" font-size="10" fill="#7788aa" filter="url(#rough2)">时间 O(n log n)，空间 O(1)（原地）</text>

  <path d="M 182 160 L 182 176" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 120 176 L 244 176" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 120 176 L 120 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 244 176 L 244 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="54" y="194" width="132" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="214" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">候选 A</text>
  <text x="120" y="234" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">a[0]·a[1]·a[n−1]</text>

  <rect x="198" y="194" width="132" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="264" y="214" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">候选 B</text>
  <text x="264" y="234" text-anchor="middle" font-size="9.5" fill="#444" filter="url(#rough2)">a[n−3]·a[n−2]·a[n−1]</text>

  <path d="M 120 250 L 120 272" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 250 L 264 272" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="276" width="272" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="192" y="296" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 max(A, B)</text>
  <text x="192" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O(1) 次乘法，无循环</text>

  <rect x="348" y="60" width="176" height="260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="364" y="82" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">进阶：O(n) 一次遍历</text>
  <text x="364" y="102" font-size="10" fill="#555" filter="url(#rough2)">维护最大三个 max1..3</text>
  <text x="364" y="118" font-size="10" fill="#555" filter="url(#rough2)">与最小两个 min1、min2</text>
  <text x="364" y="140" font-size="10" fill="#555" filter="url(#rough2)">每读入一个 x：</text>
  <text x="364" y="158" font-size="10" fill="#555" filter="url(#rough2)">① 依次下移更新三者</text>
  <text x="364" y="176" font-size="10" fill="#555" filter="url(#rough2)">② 再更新最小两者</text>
  <text x="364" y="198" font-size="10" fill="#555" filter="url(#rough2)">最后输出</text>
  <text x="364" y="216" font-size="10" fill="#555" filter="url(#rough2)">max(min1·min2·max1,</text>
  <text x="364" y="232" font-size="10" fill="#555" filter="url(#rough2)">    max1·max2·max3)</text>
  <text x="364" y="256" font-size="10" fill="#8a6a20" filter="url(#rough2)">无需排序，也无需宽整数</text>
  <text x="364" y="274" font-size="10" fill="#8a6a20" filter="url(#rough2)">（|nums[i]| ≤ 1000，</text>
  <text x="364" y="290" font-size="10" fill="#8a6a20" filter="url(#rough2)"> 三数积 ≤ 10⁹ 仍在 32 位内）</text>
  <text x="364" y="310" font-size="10" fill="#999" filter="url(#rough2)">适合 n 很大且要求流式输入</text>

  <path d="M 348 250 C 330 258, 322 268, 320 292" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="192" y="348" font-size="10.5" fill="#666" filter="url(#rough2)">时间：排序 O(n log n)；空间：O(1) 额外</text>
  <text x="192" y="366" font-size="10" fill="#999" filter="url(#rough2)">n ≤ 10⁴，排序版足够；一次遍历版可消除排序开销</text>
</svg>
