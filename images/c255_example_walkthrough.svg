<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算:扫描定 mn / mx,辗转相除到 b = 0</text>

  <!-- 左列:示例 2 -->
  <text x="170" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2:nums = [7,5,6,8,3]</text>
  <rect x="79" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="116" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="153" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="190" y="72" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="207" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="227" y="72" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="244" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="163" y="122" text-anchor="middle" font-size="10.5" filter="url(#rough2)"><tspan font-weight="bold" fill="#4a7a3a">min = 3</tspan><tspan fill="#888"> , </tspan><tspan font-weight="bold" fill="#8a6420">max = 8</tspan></text>

  <rect x="40" y="140" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="160" font-size="10" fill="#333" filter="url(#rough2)">8 = 3×2 + 2 → gcd(8,3) → gcd(3,2)</text>
  <rect x="40" y="178" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="198" font-size="10" fill="#333" filter="url(#rough2)">3 = 2×1 + 1 → gcd(3,2) → gcd(2,1)</text>
  <rect x="40" y="216" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="236" font-size="10" fill="#333" filter="url(#rough2)">2 = 1×2 + 0 → gcd(2,1) → gcd(1,0)</text>
  <rect x="40" y="254" width="270" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b = 0,返回 a = 1 ✓</text>

  <!-- 右列:示例 1 -->
  <text x="470" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1:nums = [2,5,6,9,10]</text>
  <rect x="379" y="72" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="396" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="416" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="453" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="490" y="72" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="507" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="527" y="72" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="544" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="463" y="122" text-anchor="middle" font-size="10.5" filter="url(#rough2)"><tspan font-weight="bold" fill="#4a7a3a">min = 2</tspan><tspan fill="#888"> , </tspan><tspan font-weight="bold" fill="#8a6420">max = 10</tspan></text>

  <rect x="340" y="140" width="270" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="355" y="160" font-size="10" fill="#333" filter="url(#rough2)">10 = 2×5 + 0 → gcd(10,2) → gcd(2,0)</text>
  <rect x="340" y="178" width="270" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b = 0,返回 a = 2 ✓</text>

  <rect x="340" y="216" width="270" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355" y="236" font-size="10" fill="#333" filter="url(#rough2)">示例 3:[3,3] → min = max = 3,一轮整除得 3</text>

  <!-- 底部观察 -->
  <rect x="40" y="300" width="570" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="325" y="324" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每轮 b ← a mod b 严格变小:最坏情形是相邻斐波那契数(Lamé 定理)</text>
  <text x="325" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">本题 V ≤ 1000:辗转相除至多十余轮;min = 1 或 min = max 时一轮出解</text>
  <text x="325" y="364" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 2 走满 3 轮,示例 1 与示例 3 都是 1 轮整除的「顺路」情形</text>
</svg>
