<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：BFS 队列天然按层分段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">出队前先记 sz = len(q)，随后连续出队 sz 次，这一批恰好是同一层</text>

  <text x="58" y="97" font-size="11" fill="#3a4a66" filter="url(#rough2)">第 0 层</text>
  <rect x="140" y="78" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="98" text-anchor="middle" font-size="12" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="202" y="98" font-size="10.5" fill="#666" filter="url(#rough2)">sz = 1，max = 1</text>

  <text x="58" y="153" font-size="11" fill="#3a5a30" filter="url(#rough2)">第 1 层</text>
  <rect x="140" y="134" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="154" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">3</text>
  <rect x="200" y="134" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="154" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">2</text>
  <text x="262" y="154" font-size="10.5" fill="#666" filter="url(#rough2)">sz = 2，max = 3</text>

  <text x="58" y="209" font-size="11" fill="#8a6a20" filter="url(#rough2)">第 2 层</text>
  <rect x="140" y="190" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="166" y="210" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">5</text>
  <rect x="200" y="190" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="226" y="210" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">3</text>
  <rect x="260" y="190" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286" y="210" text-anchor="middle" font-size="12" fill="#7a5c18" filter="url(#rough2)">9</text>
  <text x="324" y="210" font-size="10.5" fill="#666" filter="url(#rough2)">sz = 3，max = 9</text>

  <text x="480" y="62" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每层写一个答案</text>
  <rect x="420" y="74" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="480" y="96" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">ans = [1]</text>
  <rect x="420" y="130" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="480" y="152" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">ans = [1, 3]</text>
  <rect x="420" y="186" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="480" y="208" text-anchor="middle" font-size="11" fill="#33502a" filter="url(#rough2)">ans = [1, 3, 9]</text>

  <rect x="50" y="252" width="460" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="68" y="274" font-size="10.5" fill="#7a5c18" font-weight="bold" filter="url(#rough2)">为什么用队列长度而不是「层标记」</text>
  <text x="68" y="296" font-size="10.5" fill="#555" filter="url(#rough2)">队列里最多同时存在两层：当前层与下一层，长度快照正好切出当前层；</text>
  <text x="68" y="316" font-size="10.5" fill="#555" filter="url(#rough2)">出队一个节点就把它的非空孩子压到队尾，这些孩子全部排在下一层；</text>
  <text x="68" y="336" font-size="10.5" fill="#555" filter="url(#rough2)">每层只维护一个 best，整层出队完毕再写入 ans，天然做到「一行一个最大值」。</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 root = [1,3,2,5,3,null,9] → 答案 [1,3,9]</text>
</svg>
