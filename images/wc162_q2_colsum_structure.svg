<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">列和锁死每列的形态：只有 colsum[i]=1 才有自由度</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">整道题唯一的决策：那个单独的 1 落在上行还是下行</text>

  <g filter="url(#rough2)">
    <rect x="24" y="66" width="160" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="104" y="88" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">colsum[i] = 0</text>
    <rect x="52" y="100" width="46" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="75" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="110" y="100" width="46" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="133" y="118" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="104" y="150" text-anchor="middle" font-size="10" fill="#555">第 0 行（upper）</text>
    <text x="104" y="166" text-anchor="middle" font-size="10" fill="#555">第 1 行（lower）</text>
    <text x="104" y="190" text-anchor="middle" font-size="10" fill="#3a4a66">两行都填 0，没有选择</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="200" y="66" width="160" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">colsum[i] = 2</text>
    <rect x="228" y="100" width="46" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="251" y="118" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="286" y="100" width="46" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="309" y="118" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="280" y="150" text-anchor="middle" font-size="10" fill="#555">第 0 行（upper）</text>
    <text x="280" y="166" text-anchor="middle" font-size="10" fill="#555">第 1 行（lower）</text>
    <text x="280" y="190" text-anchor="middle" font-size="10" fill="#3a5a30">两行都填 1，各扣 1 个额度</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="376" y="66" width="160" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="456" y="88" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">colsum[i] = 1</text>
    <rect x="404" y="100" width="46" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="427" y="118" text-anchor="middle" font-size="12" fill="#8a6a20">1 / 0</text>
    <rect x="462" y="100" width="46" height="26" fill="#fff" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="485" y="118" text-anchor="middle" font-size="12" fill="#8a6a20">0 / 1</text>
    <text x="456" y="150" text-anchor="middle" font-size="10" fill="#555">第 0 行（upper）</text>
    <text x="456" y="166" text-anchor="middle" font-size="10" fill="#555">第 1 行（lower）</text>
    <text x="456" y="190" text-anchor="middle" font-size="10" fill="#8a6a20">恰好一个 1：上行或下行</text>
  </g>

  <path d="M 284 210 L 284 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="236" width="480" height="62" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="56" y="256" font-size="11" fill="#8a3a36" font-weight="bold">守恒等式（唯一的可行性判据）</text>
    <text x="56" y="276" font-size="10.5" fill="#444">upper + lower = 2 × cnt2 + cnt1，且 upper ≥ cnt2，lower ≥ cnt2</text>
    <text x="56" y="292" font-size="10.5" fill="#444">等价于 (upper − cnt2) + (lower − cnt2) = cnt1：恰好把 cnt1 个 1 分给两行的剩余额度</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="312" width="480" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="56" y="332" font-size="11" fill="#3a5a30" font-weight="bold">于是构造策略：把 cnt1 个 1 先灌满上行，剩下的全给下行</text>
    <text x="56" y="352" font-size="10" fill="#555">上行额度 u = upper − cnt2 用完后，后面的 colsum=1 一律写进下行；</text>
    <text x="56" y="366" font-size="10" fill="#555">由守恒式，剩下的 cnt1 − u = l 个 1 恰好填满下行，两行同时收满。</text>
  </g>
</svg>
