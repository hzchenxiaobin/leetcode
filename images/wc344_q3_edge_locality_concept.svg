<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">单点改色：全局只有两条邻接边在变</text>
  <path d="M 160 40 Q 280 48 400 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 本次改色标注 -->
  <text x="232" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">本次改色 i = 2</text>
  <path d="M 232 60 Q 232 62 232 60" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 数组格子 -->
  <g filter="url(#sk)">
    <rect x="80" y="64" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="142" y="64" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="204" y="64" width="56" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="266" y="64" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="328" y="64" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="64" width="56" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="108" y="95" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="170" y="95" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="232" y="95" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1→2</text>
  <text x="294" y="95" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="356" y="95" text-anchor="middle" font-size="15" fill="#333">0</text>
  <text x="418" y="95" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="108" y="128" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="170" y="128" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="232" y="128" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="294" y="128" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="356" y="128" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="418" y="128" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- 邻接边状态 -->
  <g filter="url(#sk)">
    <rect x="117" y="150" width="44" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="179" y="150" width="44" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="241" y="150" width="44" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="303" y="150" width="44" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="365" y="150" width="44" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="139" y="169" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">2=2 ✓</text>
  <text x="201" y="169" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2≠1 ✗</text>
  <text x="263" y="169" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">1=1 ✓</text>
  <text x="325" y="169" text-anchor="middle" font-size="12" fill="#888">1,0 ✗</text>
  <text x="387" y="169" text-anchor="middle" font-size="12" fill="#888">0,2 ✗</text>
  <text x="201" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">✗→✓（+1）</text>
  <text x="263" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">✓→✗（−1）</text>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#888">其余 3 条边两端颜色未动 ⇒ 贡献冻结不变</text>

  <!-- 参数条 -->
  <g filter="url(#sk)">
    <rect x="62" y="238" width="64" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="146" y="238" width="64" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="230" y="238" width="64" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="314" y="238" width="64" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="94" y="258" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">old = 1</text>
  <text x="178" y="258" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">c = 2</text>
  <text x="262" y="258" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">L = 2</text>
  <text x="346" y="258" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">R = 1</text>
  <text x="394" y="250" font-size="10.5" fill="#888">L、R 为</text>
  <text x="394" y="264" font-size="10.5" fill="#888">左右邻居</text>

  <!-- 差量公式 -->
  <g filter="url(#sk)">
    <rect x="60" y="288" width="330" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="225" y="312" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">Δ = f(c,L) + f(c,R) − f(old,L) − f(old,R)</text>
  <text x="225" y="338" text-anchor="middle" font-size="13" fill="#2e5e24">= (1 + 0) − (0 + 1) = 0，ans 不变</text>
  <g filter="url(#sk)">
    <rect x="410" y="288" width="110" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="465" y="312" text-anchor="middle" font-size="11.5" fill="#7a5415">全局计数器</text>
  <text x="465" y="340" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">ans = 2</text>

  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">f(x, y) = [x≠0 且 x=y]：0 表示未染色，两条相邻的 0 不算同色对</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#888">至多两条受影响边各自独立重估，与全局其余部分无关</text>
</svg>
