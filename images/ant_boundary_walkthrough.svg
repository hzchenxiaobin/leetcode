<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：滚动 pos，停点为 0 才计数</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Row 1: [2,3,-5] -->
  <text x="70" y="68" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：nums = [2, 3, −5]</text>
  <rect x="70" y="80" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <rect x="111" y="80" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <rect x="152" y="80" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−5</text>
  <path d="M 200 96 L 226 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="232" y="80" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="253" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">2</text>
  <text x="282" y="101" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="290" y="80" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="311" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">5</text>
  <text x="340" y="101" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="348" y="80" width="42" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="369" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03028" filter="url(#rough2)">0</text>
  <text x="369" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✓ 计数</text>
  <rect x="560" y="82" width="100" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans = 1</text>

  <!-- Row 2: [3,2,-3,-4] -->
  <text x="70" y="172" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：nums = [3, 2, −3, −4]</text>
  <rect x="70" y="184" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <rect x="111" y="184" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <rect x="152" y="184" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−3</text>
  <rect x="193" y="184" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="211" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−4</text>
  <path d="M 240 200 L 266 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="272" y="184" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">3</text>
  <text x="322" y="205" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="330" y="184" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="351" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">5</text>
  <text x="380" y="205" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="388" y="184" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="409" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">2</text>
  <text x="438" y="205" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="446" y="184" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="467" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">−2</text>
  <path d="M 409 181 Q 438 158 467 181" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="438" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">跨过 0 ✗</text>
  <rect x="560" y="186" width="100" height="34" rx="8" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#rough2)">ans = 0</text>

  <!-- Row 3: [1,-1,1,-1] -->
  <text x="70" y="278" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 3：nums = [1, −1, 1, −1]（多次返回）</text>
  <rect x="70" y="290" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <rect x="111" y="290" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−1</text>
  <rect x="152" y="290" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <rect x="193" y="290" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="211" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">−1</text>
  <path d="M 240 306 L 266 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="272" y="290" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>
  <text x="322" y="311" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="330" y="290" width="42" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="351" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03028" filter="url(#rough2)">0</text>
  <text x="380" y="311" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="388" y="290" width="42" height="32" rx="4" fill="#f5f5f5" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="409" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>
  <text x="438" y="311" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">→</text>
  <rect x="446" y="290" width="42" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="467" y="311" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03028" filter="url(#rough2)">0</text>
  <text x="351" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✓ 计数</text>
  <text x="467" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✓ 计数</text>
  <rect x="560" y="292" width="100" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="610" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans = 2</text>

  <!-- bottom note -->
  <rect x="40" y="362" width="600" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="381" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">pos = 滚动前缀和：停点为 0 → ans + 1</text>
  <text x="340" y="399" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">起点、途中穿过都不计数；计数后继续。时间 O(n)，空间 O(1)</text>
</svg>
