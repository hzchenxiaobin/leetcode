<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="300" y="26" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold">示例演算：中心是 0，答案照样是 3 × 3 = 9</text>
  <text filter="url(#rough2)" x="300" y="46" text-anchor="middle" font-size="11" fill="#777">left 管左/右两条竖边，up 管上/下两条横边</text>

  <!-- 原网格 -->
  <text filter="url(#rough2)" x="60" y="74" font-size="11" fill="#3a4a66" font-weight="bold">grid</text>
  <g filter="url(#rough2)">
    <rect x="60"  y="80"  width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="114" y="80"  width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="80"  width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60"  y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="114" y="134" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="168" y="134" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60"  y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="114" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="188" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text filter="url(#rough2)" x="87"  y="115" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="141" y="115" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="195" y="115" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="87"  y="169" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="141" y="169" text-anchor="middle" font-size="16" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="195" y="169" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="87"  y="223" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="141" y="223" text-anchor="middle" font-size="16" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="195" y="223" text-anchor="middle" font-size="16" fill="#33506e">1</text>

  <!-- 边框高亮 -->
  <rect filter="url(#rough2)" x="60" y="80" width="162" height="162" fill="none" stroke="#4a7a3a" stroke-width="3"/>

  <path filter="url(#rough2)" d="M 232 130 L 258 130" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- left 表 -->
  <text filter="url(#rough2)" x="329" y="104" text-anchor="middle" font-size="10.8" fill="#446688" font-weight="bold">left：向左连续 1</text>
  <g filter="url(#rough2)">
    <rect x="272" y="112" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="112" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="112" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="150" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="150" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="348" y="150" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="272" y="188" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="188" width="38" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="188" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text filter="url(#rough2)" x="291" y="137" text-anchor="middle" font-size="13" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="329" y="137" text-anchor="middle" font-size="13" fill="#33506e">2</text>
  <text filter="url(#rough2)" x="367" y="137" text-anchor="middle" font-size="13" fill="#33506e">3</text>
  <text filter="url(#rough2)" x="291" y="175" text-anchor="middle" font-size="13" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="329" y="175" text-anchor="middle" font-size="13" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="367" y="175" text-anchor="middle" font-size="13" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="291" y="213" text-anchor="middle" font-size="13" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="329" y="213" text-anchor="middle" font-size="13" fill="#33506e">2</text>
  <text filter="url(#rough2)" x="367" y="213" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold">3</text>

  <!-- up 表 -->
  <text filter="url(#rough2)" x="495" y="104" text-anchor="middle" font-size="10.8" fill="#4a7a3a" font-weight="bold">up：向上连续 1</text>
  <g filter="url(#rough2)">
    <rect x="438" y="112" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="476" y="112" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="514" y="112" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="438" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="476" y="150" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="514" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="438" y="188" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="476" y="188" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="514" y="188" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text filter="url(#rough2)" x="457" y="137" text-anchor="middle" font-size="13" fill="#3a5a30">1</text>
  <text filter="url(#rough2)" x="495" y="137" text-anchor="middle" font-size="13" fill="#3a5a30">1</text>
  <text filter="url(#rough2)" x="533" y="137" text-anchor="middle" font-size="13" fill="#3a5a30">1</text>
  <text filter="url(#rough2)" x="457" y="175" text-anchor="middle" font-size="13" fill="#3a5a30">2</text>
  <text filter="url(#rough2)" x="495" y="175" text-anchor="middle" font-size="13" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="533" y="175" text-anchor="middle" font-size="13" fill="#3a5a30">2</text>
  <text filter="url(#rough2)" x="457" y="213" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold">3</text>
  <text filter="url(#rough2)" x="495" y="213" text-anchor="middle" font-size="13" fill="#3a5a30">1</text>
  <text filter="url(#rough2)" x="533" y="213" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold">3</text>

  <!-- 走查 -->
  <rect filter="url(#rough2)" x="60" y="256" width="480" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  <text filter="url(#rough2)" x="76" y="280" font-size="10.9" fill="#7a5a10">① 右下角 (2,2)：left = 3、up = 3，于是从 s = 3 开始试</text>
  <text filter="url(#rough2)" x="76" y="302" font-size="10.9" fill="#7a5a10">② 上边查 left[0][2] = 3 ≥ 3 ✓；左边查 up[2][0] = 3 ≥ 3 ✓</text>
  <text filter="url(#rough2)" x="76" y="324" font-size="10.9" fill="#7a5a10">③ 四条边全通 → best = 3，返回 3 × 3 = 9</text>
  <text filter="url(#rough2)" x="76" y="348" font-size="10.9" fill="#555">④ (1,1) 本身是 0，left = up = 0，s 起不来，直接跳过</text>
  <text filter="url(#rough2)" x="76" y="370" font-size="10.9" fill="#555">⑤ 内部不参与判定，所以中心是 0 也不影响 9 这个答案</text>
</svg>
