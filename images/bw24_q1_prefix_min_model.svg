<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">前缀和折线整体抬升：只看最低点</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="270" x2="520" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="70" y1="70" x2="70" y2="270" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">累计和</text>
  <text x="512" y="288" font-size="11.5" fill="#446688" filter="url(#rough2)">步数</text>
  <!-- 约束线：累计和 ≥ 1（高度 1） -->
  <line x1="70" y1="210" x2="520" y2="210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="480" y="204" font-size="11.5" fill="#b85450" filter="url(#rough2)">要求线：sv + P ≥ 1</text>

  <!-- 前缀和折线 P：-3,-1,-4,0,2（示例1） 映射：y = 210 - 30*P + 基线偏移 -->
  <path d="M 110 300 L 200 240 L 290 320 L 380 210 L 470 150"
        fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- 抬升后：+5 -->
  <path d="M 110 180 L 200 120 L 290 200 L 380 90 L 470 30"
        fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 最低点标记 -->
  <circle cx="290" cy="320" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">最低点 P = −4（第 3 步）</text>
  <!-- 抬升箭头 -->
  <path d="M 290 316 L 290 206" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="240" font-size="12" fill="#4a7a3a" filter="url(#rough2)">抬升 startValue = 5</text>
  <circle cx="290" cy="200" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">抬到线上：1 − (−4) = 5</text>

  <!-- 图例 -->
  <rect x="360" y="296" width="180" height="38" rx="8" fill="#fff" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="372" y1="310" x2="400" y2="310" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="406" y="314" font-size="11.5" fill="#333" filter="url(#rough2)">前缀和 P_i</text>
  <line x1="372" y1="326" x2="400" y2="326" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="406" y="330" font-size="11.5" fill="#333" filter="url(#rough2)">P_i + startValue</text>
</svg>
