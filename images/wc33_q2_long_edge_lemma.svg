<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">充分性证明的关键：两条长线段不可能共享端点</text>
  <text x="290" y="48" text-anchor="middle" font-size="10.5" fill="#888">若共享端点，就会同时要求「等边」与「直角」，两者无法共存</text>

  <path d="M 288 62 L 288 350" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="150" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">合法：长线段是两条对角线</text>

  <polygon points="70,290 190,290 190,170 70,170" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"
           filter="url(#rough2)"/>
  <path d="M 70 290 L 190 170" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190 290 L 70 170" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="304" text-anchor="end" font-size="11" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="200" y="304" font-size="11" fill="#3a4a66" filter="url(#rough2)">B</text>
  <text x="200" y="168" font-size="11" fill="#3a4a66" filter="url(#rough2)">C</text>
  <text x="60" y="168" text-anchor="end" font-size="11" fill="#3a4a66" filter="url(#rough2)">D</text>

  <text x="150" y="322" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4 条边 = a²，2 条对角线 = 2a²</text>
  <text x="150" y="340" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">两条 2s 互不相邻 ⇒ 可作对角线</text>

  <text x="430" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">反设：长线段 AC、AD 共享端点 A</text>

  <path d="M 292 240 L 516 240" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 400 120 L 400 240" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 240 L 500 240" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 240 L 300 240" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 120 L 500 240" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 120 L 300 240" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 226 L 414 226 L 414 240" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="400" y="112" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="400" y="264" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">B</text>
  <text x="510" y="246" font-size="11" fill="#3a4a66" filter="url(#rough2)">C</text>
  <text x="290" y="246" text-anchor="end" font-size="11" fill="#3a4a66" filter="url(#rough2)">D</text>
  <text x="452" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d</text>
  <text x="348" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d</text>
  <text x="462" y="176" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">√2·d</text>
  <text x="330" y="176" text-anchor="end" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">√2·d</text>

  <text x="430" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">BC = BD = d，AB = d ⇒ ∠ABC = ∠ABD = 90°</text>
  <text x="430" y="316" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⇒ C、B、D 共线 ⇒ |CD| = 2d（或 0）</text>
  <text x="430" y="338" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">而正三角形 BCD 要求 |CD| = d ⇒ 矛盾 ∎</text>
</svg>
