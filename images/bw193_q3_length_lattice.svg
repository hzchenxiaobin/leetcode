<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">合法长度是等差格点：合法性对长度不单调</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">段 (r=3, k=6)：d = 6 / gcd(3,6) = 2，合法长度 m ≡ 1 (mod 2)</text>

  <!-- 数轴 -->
  <path d="M50,150 L590,150" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 刻度与圆圈：m = 1..12 -->
  <path d="M55,144 L55,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="55" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="55" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>

  <path d="M103,144 L103,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="103" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="103" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="103" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>

  <path d="M151,144 L151,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="151" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="151" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="151" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <path d="M199,144 L199,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="199" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="199" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="199" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>

  <path d="M247,144 L247,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="247" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="247" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="247" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>

  <path d="M295,144 L295,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="295" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="295" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>

  <path d="M343,144 L343,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="343" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="343" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="343" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>

  <path d="M391,144 L391,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="391" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="391" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="391" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>

  <path d="M439,144 L439,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="439" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="439" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="439" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">9</text>

  <path d="M487,144 L487,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="487" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="487" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">10</text>

  <path d="M535,144 L535,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="535" cy="150" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="535" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="535" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">11</text>

  <path d="M583,144 L583,156" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="583" cy="150" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="583" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <text x="583" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">12</text>

  <!-- 数轴上方注释 -->
  <text x="55" y="108" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">m=1 永远合法</text>
  <path d="M60,114 L55,136" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="151" y="108" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">m=3 又合法了！</text>
  <path d="M151,114 L151,136" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="108" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">偶数长度全军覆没</text>
  <path d="M295,114 L295,136" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 警示框 -->
  <rect x="70" y="206" width="500" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">长度 1 ✓ → 长度 2 ✗ → 长度 3 ✓：合法性不随长度单调</text>
  <text x="320" y="250" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">双指针窗口无法安全收缩，二分答案也失去判定前提</text>

  <!-- 正确姿势框 -->
  <rect x="70" y="284" width="500" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正确姿势：极大同余段内一次除法直取最优</text>
  <text x="320" y="322" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">best = 1 + ⌊(L−1)/d⌋·d</text>
</svg>
