<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    差值 = 全局最大构造 − 全局最小构造
  </text>

  <!-- 最大化部分（左） -->
  <rect x="24" y="58" width="228" height="290" fill="none" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="138" y="84" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">
    最大化 a：首个非 9 位 → 9
  </text>

  <!-- 9288 数字格 -->
  <g filter="url(#rough2)" font-size="17">
    <rect x="44" y="100" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="84" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="124" y="100" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="164" y="100" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="64" y="126" text-anchor="middle" fill="#8a6a1a">9</text>
    <text x="104" y="126" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="144" y="126" text-anchor="middle" fill="#8a6a1a">8</text>
    <text x="184" y="126" text-anchor="middle" fill="#8a6a1a">8</text>
  </g>
  <text x="138" y="168" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    左边已是 9，2 是首个非 9 位
  </text>

  <path d="M 138 182 C 138 196, 138 202, 138 214" stroke="#d6a040" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="204" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">全部 2 换成 9</text>

  <g filter="url(#rough2)" font-size="17">
    <rect x="44" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="84" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="124" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="164" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="64" y="246" text-anchor="middle" fill="#2f5a24">9</text>
    <text x="104" y="246" text-anchor="middle" fill="#2f5a24" font-weight="bold">9</text>
    <text x="144" y="246" text-anchor="middle" fill="#2f5a24">8</text>
    <text x="184" y="246" text-anchor="middle" fill="#2f5a24">8</text>
  </g>
  <text x="138" y="292" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">a = 9988</text>

  <rect x="42" y="308" width="192" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"
        filter="url(#rough2)"/>
  <text x="138" y="328" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">
    最左可增大位决定一切：y 取 9
  </text>

  <!-- 中间减号 -->
  <text x="272" y="200" text-anchor="middle" font-size="34" fill="#b85450" filter="url(#rough2)">−</text>

  <!-- 最小化部分（右） -->
  <rect x="272" y="58" width="228" height="290" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="386" y="84" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">
    最小化 b：首位 9 → 1
  </text>

  <!-- 9288 数字格（右） -->
  <g filter="url(#rough2)" font-size="17">
    <rect x="292" y="100" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="332" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="372" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="412" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="312" y="126" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <text x="352" y="126" text-anchor="middle" fill="#446688">2</text>
    <text x="392" y="126" text-anchor="middle" fill="#446688">8</text>
    <text x="432" y="126" text-anchor="middle" fill="#446688">8</text>
  </g>
  <text x="386" y="168" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    首位 9 ≥ 2 且 ≠ 1，换成 1
  </text>

  <path d="M 386 182 C 386 196, 386 202, 386 214" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="204" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">全部 9 换成 1</text>

  <g filter="url(#rough2)" font-size="17">
    <rect x="292" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="332" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="372" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="412" y="220" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="312" y="246" text-anchor="middle" fill="#2f5a24" font-weight="bold">1</text>
    <text x="352" y="246" text-anchor="middle" fill="#2f5a24">2</text>
    <text x="392" y="246" text-anchor="middle" fill="#2f5a24">8</text>
    <text x="432" y="246" text-anchor="middle" fill="#2f5a24">8</text>
  </g>
  <text x="386" y="292" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">b = 1288</text>

  <rect x="290" y="308" width="192" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"
        filter="url(#rough2)"/>
  <text x="386" y="328" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    首位降到 1 支配一切后位操作
  </text>
</svg>
