<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">余数配对：r 只能与 (60−r) mod 60 组合</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两数之和被 60 整除 ⟺ 余数互补</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="30" y="74" width="78" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69.0" y="99.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="130" y="74" width="78" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="99.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 112.0 94.0 L 126.0 94.0" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="310" y="74" width="78" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="349.0" y="99.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="410" y="74" width="78" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="449.0" y="99.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">59</text>
  <path d="M 392.0 94.0 L 406.0 94.0" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="30" y="132" width="78" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="69.0" y="157.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <rect x="130" y="132" width="78" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="157.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">40</text>
  <path d="M 112.0 152.0 L 126.0 152.0" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="310" y="132" width="78" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="349.0" y="157.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">30</text>
  <rect x="410" y="132" width="78" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="449.0" y="157.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">30</text>
  <path d="M 392.0 152.0 L 406.0 152.0" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="30.0" y="66.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">r = 0 自配对</text>
  <text x="310.0" y="66.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">r = 1 配 59</text>
  <text x="30.0" y="124.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">r = 20 配 40</text>
  <text x="310.0" y="124.0" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">r = 30 自配对</text>
  <text x="30.0" y="200.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">r = 0 与 r = 30 是「自配对」：需要另一首同样余数的歌</text>
  <text x="30.0" y="222.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">统一写法 (60 − r) % 60 自动覆盖 0 和 30，不必特判</text>
  <rect x="30" y="240" width="250" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155.0" y="265.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans += cnt[(60 − r) % 60]</text>
  <rect x="300" y="240" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425.0" y="265.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cnt[r] += 1</text>
  <text x="30.0" y="302.0" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">先查后加：保证只统计 i &lt; j 的对，且不会把自己配进去</text>
  <rect x="30" y="316" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="337.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">固定余数 r 的计数一次扫描即可完成，O(n) 时间 + O(60) 空间</text>
</svg>
