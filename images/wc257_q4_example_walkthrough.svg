<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [10, 5, 9, 3, 15]</text>
  <path d="M 200 36 Q 320 44 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: factorize -->
  <rect x="16" y="46" width="608" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第一步：分解质因子（spf 逐个除尽）</text>

  <rect x="82" y="78" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="102" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="202" y="78" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="322" y="78" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="442" y="78" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="562" y="78" width="40" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="582" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <path d="M102,110 L102,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M222,110 L222,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M342,110 L342,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M462,110 L462,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M582,110 L582,124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="102" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">10 = 2×5</text>
  <text x="222" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">5 = 5</text>
  <text x="342" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">9 = 3×3</text>
  <text x="462" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">3 = 3</text>
  <text x="582" y="142" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">15 = 3×5</text>

  <!-- Panel 2: union sequence -->
  <rect x="16" y="170" width="608" height="142" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">第二步：union(x, 每个不同质因子 p)</text>

  <rect x="40" y="202" width="100" height="28" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">union(10,2)</text>
  <rect x="160" y="202" width="100" height="28" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">union(10,5)</text>
  <rect x="280" y="202" width="100" height="28" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">union(9,3)</text>
  <rect x="400" y="202" width="100" height="28" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">union(15,3)</text>
  <rect x="520" y="202" width="100" height="28" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="221" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">union(15,5)</text>

  <text x="320" y="254" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">集合演变：{10,2} → {10,2,5} ；{9,3} → {9,3,15}</text>
  <text x="320" y="276" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">union(15,5)：{10,2,5} ∪ {9,3,15} = {10,2,5,9,3,15} 全连通</text>
  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">15 同含 3、5，把 {10,2,5} 与 {9,3} 两团桥接成一个大分量！</text>

  <!-- Panel 3: verify per position -->
  <rect x="16" y="324" width="608" height="222" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">第三步：target = [3,5,9,10,15]，逐位验根</text>

  <!-- table: label col x=30..110, data cols w=104 -->
  <rect x="30" y="356" width="80" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">i</text>
  <rect x="110" y="356" width="104" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="162" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">0</text>
  <rect x="214" y="356" width="104" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">1</text>
  <rect x="318" y="356" width="104" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">2</text>
  <rect x="422" y="356" width="104" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="474" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">3</text>
  <rect x="526" y="356" width="80" height="28" fill="#f0f0f0" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="566" y="375" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">4</text>

  <rect x="30" y="384" width="80" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="403" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">nums[i]</text>
  <rect x="110" y="384" width="104" height="28" fill="#fff4f6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="403" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10</text>
  <rect x="214" y="384" width="104" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="403" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="318" y="384" width="104" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="403" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="422" y="384" width="104" height="28" fill="#fff4f6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="474" y="403" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="526" y="384" width="80" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="566" y="403" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>

  <rect x="30" y="412" width="80" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="431" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">target[i]</text>
  <rect x="110" y="412" width="104" height="28" fill="#fff4f6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="431" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="214" y="412" width="104" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="431" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="318" y="412" width="104" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="431" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="422" y="412" width="104" height="28" fill="#fff4f6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="474" y="431" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10</text>
  <rect x="526" y="412" width="80" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="566" y="431" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>

  <rect x="30" y="440" width="80" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="459" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">同根？</text>
  <text x="162" y="459" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="266" y="459" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="370" y="459" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="474" y="459" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="566" y="459" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="320" y="490" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">位置 1、2、4 本就在位；位置 0、3 需把 10 与 3 互换 —— 两者同根，可经分量内链式交换完成</text>
  <text x="320" y="516" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">注意：gcd(10, 3) = 1，不能直接换！路径 10 —5— 15 —3— 3 提供中转</text>
  <text x="320" y="538" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">全部同根 → 返回 true</text>
</svg>
