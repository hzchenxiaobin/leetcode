<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 + 哈希「余数 → 最近下标」</text>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="50" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="160" y="77" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">total = Σ nums；r = total mod p</text>
  <path d="M 160 94 L 160 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 r==0 -->
  <g filter="url(#rough2)">
    <polygon points="160,114 242,144 160,174 78,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <text x="160" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r == 0 ?</text>
  <path d="M 242 144 L 320 144" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="136" font-size="11.5" fill="#888" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="322" y="122" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="387" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0（移除空段）</text>
  <path d="M 160 174 L 160 196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="190" font-size="11.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="70" y="198" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="160" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">last = {0 : 0}；ans = n</text>
  <path d="M 160 242 L 160 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <g filter="url(#rough2)">
    <rect x="52" y="266" width="216" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="160" y="288" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">对 j = 1..n 循环</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="160" y="312">cur = (cur + nums[j−1]) mod p</text>
    <text x="160" y="334">want = (cur − r + p) mod p</text>
    <text x="160" y="356">want ∈ last ? ans = min(ans, j−last[want])</text>
    <text x="160" y="378">last[cur] = j（覆盖为更大下标）</text>
  </g>
  <path d="M 268 326 C 320 326, 320 236, 256 226" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="300" font-size="11.5" fill="#888" filter="url(#rough2)">j++</text>

  <!-- 终判 -->
  <g filter="url(#rough2)">
    <polygon points="160,398 216,398 244,414 216,414" fill="none" stroke="none"/>
  </g>
  <path d="M 160 386 L 160 388" fill="none" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 右侧结论 -->
  <g filter="url(#rough2)">
    <rect x="300" y="266" width="230" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="415" y="290" font-weight="bold" fill="#4a7a3a">循环结束</text>
    <text x="415" y="316">ans &lt; n → 返回 ans</text>
    <text x="415" y="338">ans == n → 只匹配到整段</text>
    <text x="415" y="360" fill="#b85450" font-weight="bold">→ 返回 −1</text>
  </g>
</svg>
