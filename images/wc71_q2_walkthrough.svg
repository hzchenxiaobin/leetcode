<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="386" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：逐桶算「组数 × 组容量」</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = ⌈c / g⌉，贡献 = k · g；不同回答值互不干扰</text>

  <text x="40" y="78" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：answers = [1, 1, 2]，答案为 5</text>

  <rect x="40" y="86" width="650" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="116" width="650" height="28" fill="#ffffff" stroke="#b8c4d8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="144" width="650" height="28" fill="#ffffff" stroke="#b8c4d8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="172" width="650" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <g stroke="#b8c4d8" stroke-width="1" filter="url(#rough2)">
    <path d="M 170 86 L 170 202" fill="none"/>
    <path d="M 300 86 L 300 202" fill="none"/>
    <path d="M 440 86 L 440 202" fill="none"/>
    <path d="M 570 86 L 570 202" fill="none"/>
  </g>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="106" fill="#3a4a66">回答 x</text>
    <text x="235" y="106" fill="#3a4a66">次数 c</text>
    <text x="370" y="106" fill="#3a4a66">组容量 g = x+1</text>
    <text x="505" y="106" fill="#3a4a66">组数 k</text>
    <text x="630" y="106" fill="#3a4a66">贡献 k·g</text>

    <text x="105" y="135" fill="#333">1</text>
    <text x="235" y="135" fill="#333">2</text>
    <text x="370" y="135" fill="#333">2</text>
    <text x="505" y="135" fill="#333">1</text>
    <text x="630" y="135" fill="#4a7a3a">2</text>

    <text x="105" y="163" fill="#333">2</text>
    <text x="235" y="163" fill="#333">1</text>
    <text x="370" y="163" fill="#333">3</text>
    <text x="505" y="163" fill="#333">1</text>
    <text x="630" y="163" fill="#4a7a3a">3</text>

    <text x="105" y="192" fill="#3a5a30">合计</text>
    <text x="630" y="192" fill="#3a5a30" font-weight="bold">5</text>
  </g>

  <text x="40" y="230" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2：answers = [10, 10, 10]，答案为 11</text>

  <rect x="40" y="238" width="650" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="268" width="650" height="28" fill="#ffffff" stroke="#b8c4d8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="296" width="650" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <g stroke="#b8c4d8" stroke-width="1" filter="url(#rough2)">
    <path d="M 170 238 L 170 326" fill="none"/>
    <path d="M 300 238 L 300 326" fill="none"/>
    <path d="M 440 238 L 440 326" fill="none"/>
    <path d="M 570 238 L 570 326" fill="none"/>
  </g>

  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="258" fill="#3a4a66">回答 x</text>
    <text x="235" y="258" fill="#3a4a66">次数 c</text>
    <text x="370" y="258" fill="#3a4a66">组容量 g = x+1</text>
    <text x="505" y="258" fill="#3a4a66">组数 k</text>
    <text x="630" y="258" fill="#3a4a66">贡献 k·g</text>

    <text x="105" y="287" fill="#333">10</text>
    <text x="235" y="287" fill="#333">3</text>
    <text x="370" y="287" fill="#333">11</text>
    <text x="505" y="287" fill="#333">1</text>
    <text x="630" y="287" fill="#4a7a3a">11</text>

    <text x="105" y="316" fill="#3a5a30">合计</text>
    <text x="630" y="316" fill="#3a5a30" font-weight="bold">11</text>
  </g>

  <rect x="40" y="340" width="650" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="365" y="362" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">注意 3 只回答 10 的兔子只占 1 组：另 8 只同色兔子没被问到，仍要计入总数 → 11</text>
</svg>
