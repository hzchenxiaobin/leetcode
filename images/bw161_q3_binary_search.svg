<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">二分「最小边成本阈值」：阈值越大，可用边越少</text>
  <line x1="70" y1="132" x2="610" y2="132" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="124" x2="90" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <line x1="230" y1="124" x2="230" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <line x1="330" y1="124" x2="330" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <line x1="430" y1="124" x2="430" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <line x1="566" y1="124" x2="566" y2="140" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="566" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <text x="340" y="78" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">答案一定是某条边的成本，只需在 [0, maxCost] 上二分</text>
  <rect x="70" y="178" width="260" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200.0" y="204.375" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">阈值 ≤ 3：可行</text>
  <rect x="350" y="178" width="260" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480.0" y="204.375" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">阈值 ≥ 4：无可行路径</text>
  <path d="M 340 200 L 344 200" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 200 150 L 120 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 150 L 480 176" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="240" width="540" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="266" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">check(x)：只保留 cost ≥ x 的边（且中间节点在线）</text>
  <text x="340" y="290" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">在 DAG 上按拓扑序 DP 求 0 → n−1 的最小总成本，判 ≤ k</text>
</svg>
