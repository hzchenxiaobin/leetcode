<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    两端同时擦除：总长每秒减少 2
  </text>

  <text x="132" y="64" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">
    Yura 从左端每秒擦 1 cm
  </text>
  <path d="M 150 80 L 462 80" stroke="#446688" stroke-width="2"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="430" y="96" width="38" height="38" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="169" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="209" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="249" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="289" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="329" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="369" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="409" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>
  <text x="449" y="122" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">#</text>

  <path d="M 470 150 L 158 150" stroke="#d6a040" stroke-width="2"
        fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">
    Iskander 从右端每秒擦 1 cm
  </text>

  <text x="478" y="120" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">
    L = 8 cm
  </text>

  <text x="310" y="196" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    结果：长度每 1 秒减少 2 cm
  </text>

  <rect x="47" y="212" width="62" height="44" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="147" y="212" width="62" height="44" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="247" y="212" width="62" height="44" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="347" y="212" width="62" height="44" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="447" y="212" width="62" height="44" rx="6" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="78" y="240" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="178" y="240" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="278" y="240" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="378" y="240" text-anchor="middle" font-size="15" fill="#b8860b" filter="url(#rough2)">2</text>
  <text x="478" y="240" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">消失</text>

  <path d="M 111 234 L 141 234" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 211 234 L 241 234" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 311 234 L 341 234" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 411 234 L 441 234" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="126" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1 秒</text>
  <text x="226" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2 秒</text>
  <text x="326" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3 秒</text>
  <text x="426" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4 秒</text>

  <text x="310" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    长度只剩 1 或 2 时，下一秒整条被擦干净（不再各擦 1 cm）
  </text>
  <text x="310" y="340" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    答案 = ceil(L / 2) = (L + 1) / 2（整数除法）
  </text>
  <text x="310" y="368" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    L = 2 只需 1 秒、L = 1 也只需 1 秒：所以不是 L/2 而是上取整
  </text>
</svg>
