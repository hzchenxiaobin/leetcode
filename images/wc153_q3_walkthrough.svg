<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [1, −2, 0, 3] 的逐位置更新表</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一行的「旧 keep」是本轮更新前的值，供 dele 的转移使用</text>

  <rect x="10" y="76" width="600" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <path d="M 10 76 L 10 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="102" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 70 76 L 70 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="105.0" y="102" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">x_i</text>
  <path d="M 140 76 L 140 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="197.5" y="102" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">旧 keep</text>
  <path d="M 255 76 L 255 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="345.0" y="102" text-anchor="middle" font-size="9" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">dele = max(dele+x, keep)</text>
  <path d="M 435 76 L 435 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="497.5" y="102" text-anchor="middle" font-size="9" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">keep = max(keep+x, x)</text>
  <path d="M 560 76 L 560 286" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="585.0" y="102" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="11" y="118" width="598" height="42" fill="#ffffff" stroke="#bba98c" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40.0" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="105.0" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="197.5" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="345.0" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">−∞</text>
  <text x="497.5" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="585.0" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="11" y="160" width="598" height="42" fill="#fbfbfb" stroke="#bba98c" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40.0" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="105.0" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">−2</text>
  <text x="197.5" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="345.0" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="497.5" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">−1</text>
  <text x="585.0" y="186" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="11" y="202" width="598" height="42" fill="#ffffff" stroke="#bba98c" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40.0" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="105.0" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="197.5" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">−1</text>
  <text x="345.0" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="497.5" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="585.0" y="228" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="11" y="244" width="598" height="42" fill="#fff8e1" stroke="#bba98c" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40.0" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="105.0" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="197.5" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="345.0" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="497.5" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="585.0" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">4</text>

  <path d="M 10 118 L 610 118" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 10 286 L 610 286" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="24" y="322" width="572" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="10.5" fill="#3a6a2c" font-weight="bold" filter="url(#rough2)">最后一行：dele = max(1 + 3, 0) = 4 —— 把留着洞的段扩上 3，或干脆把 3 也删掉</text>
  <text x="40" y="364" font-size="10.5" fill="#555" filter="url(#rough2)">4 出现在 dele 状态，说明「取 [1, −2, 0, 3] 并挖掉 −2」是最优方案，答案更新为 4</text>
  <text x="40" y="384" font-size="9.5" fill="#777" filter="url(#rough2)">第 0 行是初始化：此时还没有「已删」的方案，所以 dele 记为 −∞（不可达）</text>
</svg>
