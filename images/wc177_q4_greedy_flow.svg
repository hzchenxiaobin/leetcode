<svg xmlns="http://www.w3.org/2000/svg" width="660" height="660" viewBox="0 0 660 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="660" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：先算余数，再决定删谁</text>
    <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none"/>
  </g>

  <!-- 统计 -->
  <g filter="url(#sk2)">
    <rect x="90" y="46" width="290" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="235" y="71" text-anchor="middle" font-size="13" fill="#2b4a6e">统计 cnt[0..9]，求和 S = Σ digits</text>
    <path d="M 235 86 L 235 112" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形1 -->
  <g filter="url(#sk2)">
    <polygon points="235,115 390,163 235,211 80,163" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="235" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">r = S mod 3 = 0 ？</text>
    <path d="M 390 163 L 422 163" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="405" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">是</text>
    <rect x="426" y="142" width="200" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="526" y="168" text-anchor="middle" font-size="12.5" fill="#2e5e22">一个都不删，全部保留</text>
  </g>

  <g filter="url(#sk2)">
    <path d="M 235 211 L 235 233" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="247" y="227" font-size="12" font-weight="bold" fill="#b85450">否</text>
  </g>

  <!-- 删除规则 -->
  <g filter="url(#sk2)">
    <rect x="80" y="237" width="310" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="96" y="259" font-size="12" fill="#2b4a6e">r = 1：删最小 1 个 [1,4,7]；</text>
    <text x="96" y="279" font-size="12" fill="#2b4a6e">若没有，再删最小 2 个 [2,5,8]</text>
    <text x="96" y="301" font-size="12" fill="#2b4a6e">r = 2：删最小 1 个 [2,5,8]；</text>
    <text x="96" y="319" font-size="12" fill="#2b4a6e">若没有，再删最小 2 个 [1,4,7]</text>
    <path d="M 235 325 L 235 347" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形2 -->
  <g filter="url(#sk2)">
    <polygon points="235,349 390,397 235,445 80,397" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="235" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">剩余数字个数 = 0 ？</text>
    <path d="M 390 397 L 422 397" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)"/>
    <text x="405" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
    <rect x="426" y="376" width="200" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="526" y="402" text-anchor="middle" font-size="12.5" fill="#8a3a36">返回空串 ""</text>
  </g>

  <g filter="url(#sk2)">
    <path d="M 235 445 L 235 467" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="247" y="461" font-size="12" font-weight="bold" fill="#2e5e22">否</text>
  </g>

  <!-- 菱形3 -->
  <g filter="url(#sk2)">
    <polygon points="235,471 390,519 235,567 80,519" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="235" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">剩下的全是 0 ？</text>
    <path d="M 390 519 L 422 519" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="405" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">是</text>
    <rect x="426" y="498" width="200" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="526" y="524" text-anchor="middle" font-size="12.5" fill="#8a3a36">返回 "0"（只留一个零）</text>
  </g>

  <g filter="url(#sk2)">
    <path d="M 235 567 L 235 589" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <text x="247" y="583" font-size="12" font-weight="bold" fill="#2e5e22">否</text>
    <rect x="80" y="593" width="310" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="235" y="620" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">9 → 0 降序拼接，返回结果</text>
  </g>
</svg>
