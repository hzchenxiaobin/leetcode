    <rect x="256" y="80" width="24" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="280" y="80" width="24" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
