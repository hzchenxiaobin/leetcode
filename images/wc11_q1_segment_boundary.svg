    <text x="436" y="104">i</text>
    <text x="460" y="104">s</text>
    <text x="484" y="104" font-size="7.5" fill="#b08a30">空格</text>
    <text x="508" y="104">J</text>
    <text x="532" y="104">o</text>
    <text x="556" y="104">h</text>
    <text x="580" y="104">n</text>
