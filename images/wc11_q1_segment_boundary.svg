    <rect x="448" y="80" width="24" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="472" y="80" width="24" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="496" y="80" width="24" height="36" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="520" y="80" width="24" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="544" y="80" width="24" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="568" y="80" width="24" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="76" y="104">H</text>
    <text x="100" y="104">e</text>
    <text x="124" y="104">l</text>
    <text x="148" y="104">l</text>
    <text x="172" y="104">o</text>
    <text x="196" y="104">,</text>
    <text x="220" y="104" font-size="7.5" fill="#b08a30">空格</text>
    <text x="244" y="104">m</text>
    <text x="268" y="104">y</text>
    <text x="292" y="104" font-size="7.5" fill="#b08a30">空格</text>
    <text x="316" y="104">n</text>
