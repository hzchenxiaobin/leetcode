  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="76" y="132">0</text><text x="100" y="132">1</text><text x="124" y="132">2</text>
    <text x="148" y="132">3</text><text x="172" y="132">4</text><text x="196" y="132">5</text>
    <text x="220" y="132">6</text><text x="244" y="132">7</text><text x="268" y="132">8</text>
    <text x="292" y="132">9</text><text x="316" y="132">10</text><text x="340" y="132">11</text>
    <text x="364" y="132">12</text><text x="388" y="132">13</text><text x="412" y="132">14</text>
    <text x="436" y="132">15</text><text x="460" y="132">16</text><text x="484" y="132">17</text>
    <text x="508" y="132">18</text><text x="532" y="132">19</text><text x="556" y="132">20</text>
    <text x="580" y="132">21</text>
  </g>

  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 76 138 L 76 150" marker-end="url(#arrG)"/>
    <path d="M 244 138 L 244 150" marker-end="url(#arrG)"/>
    <path d="M 316 138 L 316 150" marker-end="url(#arrG)"/>
    <path d="M 436 138 L 436 150" marker-end="url(#arrG)"/>
    <path d="M 508 138 L 508 150" marker-end="url(#arrG)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="54" y="152" width="44" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="222" y="152" width="44" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="294" y="152" width="44" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="414" y="152" width="44" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="486" y="152" width="44" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="76" y="170" font-size="11" font-weight="bold" fill="#3a7a3a">+1</text>
    <text x="244" y="170" font-size="11" font-weight="bold" fill="#3a7a3a">+1</text>
    <text x="316" y="170" font-size="11" font-weight="bold" fill="#3a7a3a">+1</text>
    <text x="436" y="170" font-size="11" font-weight="bold" fill="#3a7a3a">+1</text>
    <text x="508" y="170" font-size="11" font-weight="bold" fill="#3a7a3a">+1</text>
    <text x="76" y="196" font-size="9.5" fill="#5a8a4a">cnt=1</text>
    <text x="244" y="196" font-size="9.5" fill="#5a8a4a">cnt=2</text>
    <text x="316" y="196" font-size="9.5" fill="#5a8a4a">cnt=3</text>
    <text x="436" y="196" font-size="9.5" fill="#5a8a4a">cnt=4</text>
    <text x="508" y="196" font-size="9.5" fill="#5a8a4a">cnt=5</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#666">
    <rect x="70" y="212" width="16" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="92" y="223">非空格字符</text>
    <rect x="196" y="212" width="16" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="218" y="223">空格（唯一分隔符）</text>
    <rect x="396" y="212" width="16" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="418" y="223" fill="#3a7a3a">单词左边界：计数 +1</text>
  </g>

  <rect x="56" y="240" width="528" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="262" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">计 数 条 件 ：s[i] ≠ ' '  且  (i = 0 或 s[i−1] = ' ')</text>
  <text x="72" y="282" font-size="10" fill="#a08040" filter="url(#rough2)">即「左邻是空格、或自己是串首」的非空格字符 —— 它一定是某个单词的第一个字符</text>

  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">连续空格、前导空格、尾随空格都不会让计数出错：判定只看 s[i] 与 s[i−1] 两个位置</text>
  <text x="320" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">反例：「空格数 + 1」在 "  a" 上给出 3、"a  b" 上给出 3，答案却是 1 和 2</text>
</svg>
