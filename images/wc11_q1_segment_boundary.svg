<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单词 = 极大非空格段，每个单词恰好有一个「左边界」</text>
  <text x="320" y="51" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "Hello, my name is John"：逐个看非空格字符的「左邻」是不是空格</text>

