<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三档判定：0 / 1 / 2 步</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">最大步数独立计算：内部空位总数 z − x − 2</text>

  <rect x="150" y="60" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">排序 → x &lt; y &lt; z</text>

  <path d="M 260 98 L 260 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 120 L 400 156 L 260 192 L 120 156 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">两个间隙都是 1 ？</text>
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#555">y−x=1 且 z−y=1</text>

  <path d="M 400 156 L 448 156 L 448 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="148" font-size="10" fill="#4a7a3a">是</text>
  <rect x="368" y="228" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="443" y="253" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">min = 0</text>

  <path d="M 260 192 L 260 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="208" font-size="10" fill="#888">否</text>

  <path d="M 260 214 L 380 250 L 260 286 L 140 250 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">min(y−x, z−y) ≤ 2 ？</text>
  <text x="260" y="264" text-anchor="middle" font-size="10" fill="#555">某侧只隔 0 或 1 个空位</text>

  <path d="M 140 250 L 76 250 L 76 320" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="242" font-size="10" fill="#4a7a3a">是</text>
  <rect x="20" y="322" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="85" y="347" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">min = 1</text>

  <path d="M 260 286 L 260 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="308" font-size="10" fill="#888">否</text>
  <rect x="185" y="324" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">min = 2</text>

  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#999">三条分支互斥且穷尽；max 与 min 互不影响，各算各的</text>
</svg>
