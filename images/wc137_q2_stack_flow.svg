<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">栈的「消消乐」：入栈前先看栈顶</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">相同就弹出（两字符一起消失），不同就压入——一遍扫完</text>

  <rect x="150" y="62" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66">读入字符 c</text>
  <text x="280" y="98" text-anchor="middle" font-size="10" fill="#888">栈内保存「已处理前缀消完后的结果」</text>

  <path d="M 280 104 L 280 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,128 386,168 280,208 174,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="10" fill="#8a6a20">栈非空且栈顶 == c ?</text>
  <text x="280" y="180" text-anchor="middle" font-size="9.5" fill="#888">（相邻且相同 → 该消掉）</text>

  <path d="M 174 168 L 100 168 L 100 220" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="160" font-size="10" fill="#8a3a36">是</text>
  <rect x="26" y="222" width="148" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="242" text-anchor="middle" font-size="10" fill="#8a3a36">pop()：弹出栈顶</text>
  <text x="100" y="258" text-anchor="middle" font-size="10" fill="#888">c 也不入栈</text>

  <path d="M 280 208 L 280 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="224" font-size="10" fill="#4a7a3a">否</text>
  <rect x="200" y="232" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#3a5a30">push(c)：压入当前字符</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#888">它与栈顶不同</text>

  <rect x="60" y="292" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="312" font-size="10.5" fill="#3a4a66" font-weight="bold">为什么一遍就够？</text>
  <text x="76" y="332" font-size="10" fill="#555">消去一对后，新栈顶与下一个字符可能又构成重复，而栈恰好把这个「回退位置」保存下来了</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999">时间 O(n)、空间 O(n)；答案唯一（题面已保证消去顺序不影响最终结果）</text>
</svg>
