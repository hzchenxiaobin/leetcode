<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：好节点 ⟺ 所有孩子的子树大小相等，而 size 一遍自底向上可求</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <circle cx="44" cy="46" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="59" y="50" font-size="10" fill="#555">好节点</text>
    <circle cx="116" cy="46" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="131" y="50" font-size="10" fill="#555">坏节点</text>
    <rect x="190" y="40" width="24" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="221" y="50" font-size="10" fill="#555">角标 = 子树大小 size</text>
  </g>

  <!-- edges -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5">
    <path d="M 185 64 L 75 148"/>
    <path d="M 185 64 L 205 148"/>
    <path d="M 185 64 L 330 148"/>
    <path d="M 75 148 L 30 232"/>
    <path d="M 75 148 L 78 232"/>
    <path d="M 75 148 L 126 232"/>
    <path d="M 205 148 L 205 232"/>
    <path d="M 330 148 L 300 232"/>
    <path d="M 330 148 L 360 232"/>
    <path d="M 205 232 L 205 312"/>
    <path d="M 205 312 L 205 388"/>
    <path d="M 300 232 L 300 312"/>
  </g>

  <!-- nodes: good -->
  <g filter="url(#rough2)">
    <circle cx="185" cy="64" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="185" y="68" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">0</text>
    <text x="209" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

    <circle cx="75" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="75" y="152" text-anchor="middle" font-size="11" fill="#2f5d24">1</text>
    <circle cx="205" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="152" text-anchor="middle" font-size="11" fill="#2f5d24">5</text>

    <!-- bad node 9 -->
    <circle cx="330" cy="148" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="330" y="152" text-anchor="middle" font-size="11" fill="#8a2f2a" font-weight="bold">9</text>
    <text x="352" y="140" font-size="12" fill="#b85450" font-weight="bold">✗</text>

    <circle cx="30" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="30" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">2</text>
    <circle cx="78" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="78" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">3</text>
    <circle cx="126" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="126" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">4</text>

    <circle cx="205" cy="232" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">6</text>

    <!-- children of 9: highlighted -->
    <circle cx="300" cy="232" r="14" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/>
    <text x="300" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">10</text>
    <circle cx="360" cy="232" r="14" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2"/>
    <text x="360" y="236" text-anchor="middle" font-size="10.5" fill="#2f5d24">12</text>

    <circle cx="205" cy="312" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24">7</text>
    <circle cx="300" cy="312" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="300" y="316" text-anchor="middle" font-size="10.5" fill="#2f5d24">11</text>
    <circle cx="205" cy="388" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="392" text-anchor="middle" font-size="10.5" fill="#2f5d24">8</text>
  </g>

  <!-- size badges -->
  <g filter="url(#rough2)">
    <rect x="172" y="83" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="185" y="94" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">13</text>
    <rect x="62" y="167" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="75" y="178" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">4</text>
    <rect x="192" y="167" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="205" y="178" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">4</text>
    <rect x="317" y="167" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="330" y="178" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">4</text>
    <rect x="17" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="30" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
    <rect x="65" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="78" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
    <rect x="113" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="126" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
    <rect x="192" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="205" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">3</text>
    <rect x="287" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="300" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">2</text>
    <rect x="347" y="251" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="360" y="262" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
    <rect x="192" y="331" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="205" y="342" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">2</text>
    <rect x="287" y="331" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="300" y="342" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
    <rect x="192" y="407" width="26" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="205" y="418" text-anchor="middle" font-size="9.5" fill="#8a6a1a" font-weight="bold">1</text>
  </g>

  <!-- side panel -->
  <g filter="url(#rough2)">
    <rect x="398" y="64" width="150" height="210" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="473" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">三个看点（示例 3）</text>
    <text x="473" y="110" text-anchor="middle" font-size="9.5" fill="#557">① 节点 0：孩子 size</text>
    <text x="473" y="124" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">{4, 4, 4} 全等 → 好 ✓</text>
    <text x="473" y="150" text-anchor="middle" font-size="9.5" fill="#557">② 节点 9：孩子 size</text>
    <text x="473" y="164" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">{2, 1} 不等 → 坏 ✗</text>
    <text x="473" y="190" text-anchor="middle" font-size="9.5" fill="#557">③ 叶子（如节点 2）：</text>
    <text x="473" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">无孩子 → 空真 → 好 ✓</text>
    <text x="473" y="230" text-anchor="middle" font-size="9" fill="#888">橙圈 = 节点 9 引发不等</text>
    <text x="473" y="244" text-anchor="middle" font-size="9" fill="#888">的那两个孩子 10、12</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="436" width="512" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="456" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">size[u] = 1 + Σ size[孩子]：后序一趟即可求出全部 size</text>
    <text x="280" y="476" text-anchor="middle" font-size="11" fill="#444">判好只需比较孩子的 size 是否全相等 —— DFS 的返回值顺手完成，无需第二趟</text>
  </g>
</svg>
