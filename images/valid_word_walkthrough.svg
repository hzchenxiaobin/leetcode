<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：一趟扫描的逐步走查</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">左："234Adas" 四关全过 → true；右："a3$e" 倒在非法字符 → false</text>

  <!-- left table: 234Adas -->
  <text x="164" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">word = "234Adas"</text>
  <g filter="url(#rough2)">
    <rect x="35" y="78" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="78" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="78" width="68" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="78" width="68" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="102" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="102" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="102" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="102" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="126" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="126" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="126" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="126" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="150" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="150" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="150" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="150" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="174" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="174" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="141" y="174" width="68" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="209" y="174" width="68" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="198" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
