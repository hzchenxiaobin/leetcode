    <rect x="209" y="198" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="35" y="222" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="222" width="70" height="24" fill="#fff8e1" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="222" width="68" height="24" fill="#fff8e1" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="222" width="68" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.2"/>
    <rect x="35" y="246" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="71" y="246" width="70" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.2"/>
    <rect x="141" y="246" width="68" height="24" fill="#fff8e1" stroke="#446688" stroke-width="1.2"/>
    <rect x="209" y="246" width="68" height="24" fill="#e6f4ea" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <text x="53" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">c</text>
    <text x="106" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">分类</text>
    <text x="175" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">hasVowel</text>
    <text x="243" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">hasCons</text>
    <text x="53" y="118" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="106" y="118" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="175" y="118" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="243" y="118" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="53" y="142" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="106" y="142" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="175" y="142" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="243" y="142" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="53" y="166" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="106" y="166" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="175" y="166" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="243" y="166" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="53" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">A</text>
    <text x="106" y="190" text-anchor="middle" font-size="11" fill="#d6a040">元音</text>
    <text x="175" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">✓</text>
    <text x="243" y="190" text-anchor="middle" font-size="11" fill="#888">✗</text>
    <text x="53" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">d</text>
    <text x="106" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">辅音</text>
    <text x="175" y="214" text-anchor="middle" font-size="11" fill="#d6a040">✓</text>
    <text x="243" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="53" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">a</text>
    <text x="106" y="238" text-anchor="middle" font-size="11" fill="#d6a040">元音</text>
    <text x="175" y="238" text-anchor="middle" font-size="11" fill="#d6a040">✓</text>
    <text x="243" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="53" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">s</text>
    <text x="106" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a">辅音</text>
    <text x="175" y="262" text-anchor="middle" font-size="11" fill="#d6a040">✓</text>
    <text x="243" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="35" y="282" width="242" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="156" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">两旗皆立 → return true ✓</text>

  <!-- right table: a3$e -->
  <text x="416" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">word = "a3$e"</text>
  <g filter="url(#rough2)">
    <rect x="320" y="78" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="356" y="78" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="426" y="78" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="320" y="102" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="356" y="102" width="70" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="426" y="102" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="320" y="126" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="356" y="126" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="426" y="126" width="100" height="24" fill="#fff8e1" stroke="#446688" stroke-width="1.2"/>
    <rect x="320" y="150" width="36" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2"/>
    <rect x="356" y="150" width="70" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="426" y="150" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <text x="338" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">c</text>
    <text x="391" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">分类</text>
    <text x="476" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">状态</text>
    <text x="338" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">a</text>
    <text x="391" y="118" text-anchor="middle" font-size="11" fill="#d6a040">元音</text>
    <text x="476" y="118" text-anchor="middle" font-size="11" fill="#d6a040">hasVowel ✓</text>
    <text x="338" y="142" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="391" y="142" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="476" y="142" text-anchor="middle" font-size="11" fill="#888">两旗不动</text>
    <text x="338" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">$</text>
    <text x="391" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">非法字符！</text>
    <text x="476" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">短路出局</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="320" y="184" width="206" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="423" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">含 '$' → return false ✗</text>
  <g filter="url(#rough2)">
    <rect x="320" y="230" width="206" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="423" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">假如把 '$' 换成合法字符呢？</text>
  <text x="423" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">剩下的只有元音 a、e 和数字</text>
  <text x="423" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">hasConsonant 永远不置位</text>
  <text x="423" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">→ 仍然是 false</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="35" y="330" width="490" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">短路设计：非法字符一票否决，无需扫完整串</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">元音 / 辅音标记「见过即置位、永不复位」，中途不会误清</text>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三个官方示例恰好对应三种死法：长度不足 / 非法字符 / 缺辅音</text>
</svg>
