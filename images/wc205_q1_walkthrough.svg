<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 670" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="670" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三个关键场景</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 场景① u?v?w -->
  <text x="30" y="76" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">① u?v?w —— 问号两侧都是字母</text>
  <g filter="url(#rough2)">
    <rect x="340" y="86" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="86" width="46" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="440" y="86" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="490" y="86" width="46" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="540" y="86" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="363" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">u</text>
    <text x="413" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818">?</text>
    <text x="463" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">v</text>
    <text x="513" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818">?</text>
    <text x="563" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">w</text>
    <path d="M 463 130 C 463 136 463 142 463 148" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="340" y="152" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="152" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="152" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="490" y="152" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="540" y="152" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="363" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">u</text>
    <text x="413" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a">a</text>
    <text x="463" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">v</text>
    <text x="513" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a">a</text>
    <text x="563" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">w</text>
    <text x="330" y="173" text-anchor="end" font-size="11" fill="#888">结果</text>
  </g>
  <text x="30" y="216" font-size="11.5" fill="#555" filter="url(#rough2)">i=1：禁 {u, v}，试 'a'：左 u ≠ a 且 右 v ≠ a ✓</text>
  <text x="30" y="236" font-size="11.5" fill="#555" filter="url(#rough2)">i=3：禁 {v, w}，试 'a'：左 v ≠ a 且 右 w ≠ a ✓</text>
  <path d="M 60 258 Q 320 266 580 258" stroke="#cccccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 场景② a?? -->
  <text x="30" y="286" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">② a?? —— 连续问号，右邻未填不构成禁令</text>
  <g filter="url(#rough2)">
    <rect x="340" y="296" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="296" width="46" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="440" y="296" width="46" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="363" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">a</text>
    <text x="413" y="323" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818">?</text>
    <text x="463" y="323" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818">?</text>
    <path d="M 415 340 C 415 346 415 352 415 358" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="340" y="362" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="362" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="362" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="363" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">a</text>
    <text x="413" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a">b</text>
    <text x="463" y="388" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a">a</text>
    <text x="330" y="383" text-anchor="end" font-size="11" fill="#888">结果</text>
  </g>
  <text x="30" y="426" font-size="11.5" fill="#555" filter="url(#rough2)">i=1：左 'a' 禁用 a；右 '?' 未填不禁 → 'a' ✗（撞左邻），换 'b' ✓</text>
  <text x="30" y="446" font-size="11.5" fill="#555" filter="url(#rough2)">i=2：左 'b'（刚填的）禁用 b；右不存在 → 'a' ✓</text>
  <path d="M 60 468 Q 320 476 580 468" stroke="#cccccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 场景③ ?a -->
  <text x="30" y="496" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ ?a —— 必须检查右邻居</text>
  <g filter="url(#rough2)">
    <rect x="340" y="506" width="46" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="390" y="506" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="363" y="533" text-anchor="middle" font-size="17" font-weight="bold" fill="#b07818">?</text>
    <text x="413" y="532" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">a</text>
    <path d="M 365 550 C 365 556 365 562 365 568" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="340" y="572" width="46" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="390" y="572" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="363" y="598" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a">b</text>
    <text x="413" y="598" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66">a</text>
    <text x="330" y="593" text-anchor="end" font-size="11" fill="#888">结果</text>
  </g>
  <text x="30" y="636" font-size="11.5" fill="#555" filter="url(#rough2)">i=0：无左邻；右 'a' 禁用 a → 'a' ✗，换 'b' ✓</text>
  <text x="30" y="656" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠ 若只查左邻（i=0 直接放行 'a'）会得 "aa" —— 非法！</text>
</svg>
