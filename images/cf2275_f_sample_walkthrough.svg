<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" />
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a" />
    </marker>
  </defs>
  <rect width="820" height="350" fill="#fafafa" filter="url(#rough2)" />

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：a = [2, 3, 6, 4]，freq 表给出每个 sf(a_i) 的出现次数</text>
  <text x="410" y="52" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">每扫过一个 j，就把 a_j 的奇次质因子在集合 S 里翻一次；S 为空表示 sf(P_j) = 1</text>

  <rect x="40" y="64" width="740" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
  <g font-size="12" font-weight="bold" fill="#2f4f70" text-anchor="middle">
    <text x="80" y="84" filter="url(#rough2)">j</text>
    <text x="170" y="84" filter="url(#rough2)">a_j</text>
    <text x="312" y="84" filter="url(#rough2)">S（奇次质因子集合）</text>
    <text x="462" y="84" filter="url(#rough2)">sf(P_j)</text>
    <text x="592" y="84" filter="url(#rough2)">freq[sf(P_j)]</text>
    <text x="722" y="84" filter="url(#rough2)">贡献</text>
  </g>

  <g font-size="12" fill="#3a3a3a" text-anchor="middle">
    <rect x="40" y="94" width="740" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)" />
    <text x="80" y="116" filter="url(#rough2)">1</text>
    <text x="170" y="116" filter="url(#rough2)">2</text>
    <text x="312" y="116" filter="url(#rough2)">{2}</text>
    <text x="462" y="116" filter="url(#rough2)">2</text>
    <text x="592" y="116" filter="url(#rough2)">1（来自 a_1）</text>
    <text x="722" y="116" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>

    <rect x="40" y="130" width="740" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)" />
    <text x="80" y="152" filter="url(#rough2)">2</text>
    <text x="170" y="152" filter="url(#rough2)">3</text>
    <text x="312" y="152" filter="url(#rough2)">{2, 3}</text>
    <text x="462" y="152" filter="url(#rough2)">6</text>
    <text x="592" y="152" filter="url(#rough2)">1（来自 a_3）</text>
    <text x="722" y="152" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>

    <rect x="40" y="166" width="740" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)" />
    <text x="80" y="188" filter="url(#rough2)">3</text>
    <text x="170" y="188" filter="url(#rough2)">6</text>
    <text x="312" y="188" filter="url(#rough2)">∅（2、3 同时被翻出）</text>
    <text x="462" y="188" filter="url(#rough2)">1</text>
    <text x="592" y="188" filter="url(#rough2)">1（来自 a_4）</text>
    <text x="722" y="188" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>

    <rect x="40" y="202" width="740" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)" />
    <text x="80" y="224" filter="url(#rough2)">4</text>
    <text x="170" y="224" filter="url(#rough2)">4</text>
    <text x="312" y="224" filter="url(#rough2)">∅（4 = 2² 不贡献质因子）</text>
    <text x="462" y="224" filter="url(#rough2)">1</text>
    <text x="592" y="224" filter="url(#rough2)">1（来自 a_4）</text>
    <text x="722" y="224" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+1</text>
  </g>

  <text x="410" y="262" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">freq 表：sf(a) = 2, 3, 6, 1 各出现 1 次（a_4 = 4 = 2² 的 sf 为 1）</text>
  <text x="410" y="286" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">j = 3 时 a_3 = 6 = 2·3 把两个质因子同时翻出 S，于是 sf(P_3) = 1，与 i = 4 配对</text>
  <text x="410" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">总计 1 + 1 + 1 + 1 = 4，与官方输出一致</text>
  <text x="410" y="336" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">注：表中「来自 a_k」只是说明该频次由哪个下标贡献，真正计数时只看 freq 的数值</text>
</svg>
