<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="26" y="36" font-size="17" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">行主序重建：为什么刚好 2^e 个合法矩阵</text>
  <rect x="56" y="54" width="448" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="78" font-size="14" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">① 约束条数</text>
  <text x="76" y="99" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">(n−r+1)(m−c+1) 条块 XOR=0</text>
  <rect x="56" y="128" width="448" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="152" font-size="14" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">② 行主序扫右下角 (i,j)</text>
  <text x="76" y="173" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">(i,j) 所在块的其余 rc−1 格均已确定</text>
  <rect x="56" y="202" width="448" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="226" font-size="14" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">③ 逐格赋值</text>
  <text x="76" y="247" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">a(i,j) = 其余 rc−1 格之异或，唯一</text>
  <rect x="56" y="276" width="448" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="300" font-size="14" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">④ 账本闭合</text>
  <text x="76" y="321" font-size="12.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">自由格 e = nm − (n−r+1)(m−c+1) → 答案 2^e</text>
  <path d="M280,112 L280,126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,186 L280,200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,260 L280,274" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="358" font-size="13" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">重建只是“证明工具”：程序里只算指数 e，再做快速幂</text>
  <text x="56" y="382" font-size="13" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">e 最大约 10^18，用 long long 存，二进制快速幂约 60 次循环</text>
</svg>
