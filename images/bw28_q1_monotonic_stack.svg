<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">折扣 = 右侧第一个「不大于自己」的价格 → 下一更小或相等元素</text>

  <!-- 价格数组 -->
  <text x="60" y="66" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">prices =</text>
  <g filter="url(#rough2)">
    <rect x="120" y="48" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="184" y="48" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="248" y="48" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="312" y="48" width="64" height="40" fill="#b85450" fill-opacity="0.15" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <rect x="376" y="48" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <text y="74" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="152">8</tspan><tspan x="216">4</tspan><tspan x="280">6</tspan><tspan x="344">2</tspan><tspan x="408">3</tspan></text>
  <text y="108" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)"><tspan x="152">i=0</tspan><tspan x="216">i=1</tspan><tspan x="280">i=2</tspan><tspan x="344">i=3</tspan><tspan x="408">i=4</tspan></text>

  <!-- 折扣箭头 -->
  <g filter="url(#rough2)">
    <path d="M 152 118 Q 152 150 216 156 Q 260 160 330 160" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <path d="M 216 118 Q 240 140 335 156" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <path d="M 280 118 Q 300 140 337 155" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  </g>
  <text x="152" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8、4、6 的折扣都来自 prices[3] = 2</text>

  <g filter="url(#rough2)">
    <path d="M 408 118 Q 430 130 400 138" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="452" y="132" font-size="11" fill="#888" filter="url(#rough2)">3 右侧没有更小的 → 无折扣</text>

  <!-- 单调栈过程 -->
  <text x="60" y="218" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">单调栈：栈里存「还在等折扣」的下标，价格自底向顶递增</text>
  <g filter="url(#rough2)">
    <rect x="80" y="232" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="136" y="232" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="192" y="232" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="248" y="232" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <rect x="304" y="232" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
  </g>
  <text y="254" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="106">栈:8</tspan><tspan x="162">栈:8,4</tspan><tspan x="218">8,6</tspan><tspan x="274">2</tspan><tspan x="330">2,3</tspan></text>
  <text x="106" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入 8</text>
  <text x="162" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入 4</text>
  <text x="218" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">弹 4 入 6</text>
  <text x="274" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">弹 6,8 入 2</text>
  <text x="330" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">入 3</text>

  <!-- 结算 -->
  <rect x="55" y="300" width="460" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="72" y="320" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">被弹出的瞬间结算：ans[j] = prices[j] − prices[i]（i 就是它的折扣来源）</text>
  <text x="72" y="338" font-size="11" fill="#555" filter="url(#rough2)">扫描结束仍在栈里的下标，右侧没人 ≤ 它 → 原价结算</text>
</svg>
