<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="105"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">以价值为键做权重累加，再按价值升序输出</text>

  <!-- items1 -->
  <g filter="url(#rough2)">
    <rect x="46" y="58" width="150" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="121" y="82" text-anchor="middle" font-size="13.5" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">items1</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="121" y="108">价值 1 → 重量 1</text>
    <text x="121" y="132">价值 3 → 重量 8</text>
    <text x="121" y="156">价值 4 → 重量 5</text>
  </g>

  <!-- items2 -->
  <g filter="url(#rough2)">
    <rect x="364" y="58" width="150" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="439" y="82" text-anchor="middle" font-size="13.5" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">items2</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="439" y="108">价值 1 → 重量 5</text>
    <text x="439" y="132">价值 3 → 重量 1</text>
  </g>

  <!-- 汇入中间哈希表 -->
  <g filter="url(#rough2)">
    <rect x="206" y="176" width="150" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="281" y="200" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">weight 字典</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="281" y="222">1 → 1+5 = 6</text>
    <text x="281" y="242">3 → 8+1 = 9</text>
    <text x="281" y="262">4 → 5</text>
  </g>
  <path d="M 170 160 L 218 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 390 160 L 344 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <path d="M 281 270 L 281 292" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="116" y="296" width="330" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="281" y="324" text-anchor="middle" font-size="14" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">ret = [[1,6], [3,9], [4,5]]（按价值升序）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">每个数组内部价值本就唯一，无需处理同数组重复；两数组价值交集任意。</text>
</svg>
