<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
<text x="280" y="26" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">状态：(奇偶 p, 到最近已反转祖先的距离 d，封顶 k)</text>
<ellipse cx="70" cy="130" rx="24" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
<text x="70" y="135" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<ellipse cx="170" cy="130" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="170" y="135" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<ellipse cx="270" cy="130" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="270" y="135" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<ellipse cx="370" cy="130" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="370" y="135" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<ellipse cx="470" cy="130" rx="24" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="470" y="135" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
<path d="M96,130 L144,130" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M196,130 L244,130" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M296,130 L344,130" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M396,130 L444,130" stroke="#556677" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
<text x="70" y="90" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">已反转</text>
<text x="70" y="184" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d = ∞</text>
<text x="170" y="184" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d = 1</text>
<text x="270" y="184" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d = 2</text>
<text x="370" y="184" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d = 2（封顶）</text>
<text x="470" y="184" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d = 2（封顶）</text>
<text x="280" y="214" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">k = 2 时：d ∈ {0,1,2}，d = 2 表示“至少 2”，因此可以反转</text>
<rect x="40" y="236" width="480" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="260" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">p 表示“根到该节点的已反转节点个数的奇偶”</text>
<text x="280" y="284" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">当前值 = nums[v] · (−1)^p</text>
<text x="280" y="330" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">只需记住“最近”的已反转祖先：更远的祖先距离更大，一定也 ≥ k</text>
<text x="280" y="360" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">不同分支（互不为祖先）之间没有任何约束 → 子树可独立最优</text>
<text x="280" y="388" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">所以 dp[v][p][d] 的定义与转移是完备的</text>
</svg>
