<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="424" fill="#fafafa"/>
  <text x="300" y="28" font-size="15.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">双指针：候选 i、挑战者 j 与已匹配长度 k</text>
  <text x="300" y="50" font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">把两条后缀按「偏移 k」对齐比较 s[i+k] 与 s[j+k]，失配即可整段淘汰</text>
  <text x="92" y="100" font-size="10.5" fill="#3a5a30" text-anchor="end" font-weight="bold" filter="url(#rough2)">后缀 i</text>
  <rect x="104" y="82" width="208" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="208.0" y="102" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">s[i .. i+k) 已经完全相同（k 个字符）</text>
  <rect x="312" y="82" width="58" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="5" filter="url(#rough2)"/>
  <text x="341.0" y="102" font-size="10.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s[i+k]</text>
  <text x="92" y="150" font-size="10.5" fill="#3a5a30" text-anchor="end" font-weight="bold" filter="url(#rough2)">后缀 j</text>
  <rect x="104" y="132" width="208" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="208.0" y="152" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">s[j .. j+k) 与上面逐字符相同</text>
  <rect x="312" y="132" width="58" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="5" filter="url(#rough2)"/>
  <text x="341.0" y="152" font-size="10.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s[j+k]</text>
  <path d="M 341.0 114 L 341.0 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="382" y="140" font-size="9.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">只比这一位</text>
  <text x="382" y="154" font-size="9.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">就能分胜负？</text>
  <text x="382" y="100" font-size="9.5" fill="#888" text-anchor="start" filter="url(#rough2)">第 k 位之前不必重比</text>
  <rect x="24" y="196" width="172" height="116" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="24" y="196" width="172" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="110.0" y="214" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s[i+k] == s[j+k]</text>
  <text x="110.0" y="244" font-size="10.5" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">k ← k + 1</text>
  <text x="110.0" y="268" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">两串仍在同一段公共</text>
  <text x="110.0" y="284" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">前缀里，继续往后对齐</text>
  <path d="M 198 254.0 L 211 254.0" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="214" y="196" width="172" height="116" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="214" y="196" width="172" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300.0" y="214" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s[i+k] &lt; s[j+k]</text>
  <text x="300.0" y="244" font-size="10.5" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i ← max(i+k+1, j)</text>
  <text x="300.0" y="262" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">j ← i + 1, k ← 0</text>
  <text x="300.0" y="288" font-size="9.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">s[i..i+k] 全被 s[j..j+k] 压制</text>
  <path d="M 388 254.0 L 401 254.0" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="196" width="172" height="116" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="404" y="196" width="172" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="490.0" y="214" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s[i+k] &gt; s[j+k]</text>
  <text x="490.0" y="244" font-size="10.5" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">j ← j + k + 1</text>
  <text x="490.0" y="268" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">k ← 0</text>
  <text x="490.0" y="292" font-size="9.5" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">s[j..j+k] 全部出局</text>
  <rect x="24" y="330" width="552" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="352" font-size="10.2" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">均摊 O(n)：每次失配都让 k+1 个起点永久出局，而前面 k 次相等比较正好由这次出局「付账」；</text>
  <text x="40" y="372" font-size="10.2" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">每个起点只出局一次，故总比较次数 O(n)，额外空间 O(1)。</text>
  <text x="300" y="408" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">循环条件 j + k &lt; n 保证 s[j+k] 不越界；i &lt; j 始终成立</text>
</svg>
