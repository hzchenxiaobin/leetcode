<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：逐窗口套公式（示例 1）</text>
  <path d="M 150 36 Q 340 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#666">nums ＝ [2,2,3]，target ＝ [2,2,3,2,1,3,2,2]，start ＝ [0,0,2,2,2,5,5,5]</text>

  <g filter="url(#sk)">
    <rect x="18" y="64" width="644" height="28" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
    <rect x="18" y="92" width="644" height="34" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="126" width="644" height="34" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="160" width="644" height="34" fill="#fce4ec" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="194" width="644" height="34" fill="#fce4ec" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="228" width="644" height="34" fill="#fce4ec" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="262" width="644" height="34" fill="#e6f4ea" stroke="#b8b0a0" stroke-width="0.8"/>
    <path d="M 58 64 L 58 296 M 122 64 L 122 296 M 258 64 L 258 296 M 386 64 L 386 296 M 486 64 L 486 296 M 590 64 L 590 296" stroke="#b8b0a0" stroke-width="0.8" fill="none"/>
    <rect x="18" y="64" width="644" height="232" fill="none" stroke="#9a8a5a" stroke-width="1.6"/>
  </g>

  <text x="38" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">k</text>
  <text x="90" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">窗口 W_k</text>
  <text x="190" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">m(k) → hi</text>
  <text x="322" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">s(k)</text>
  <text x="436" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">整窗多重集</text>
  <text x="538" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">区间计数</text>
  <text x="640" y="82" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">ans[k]</text>

  <text x="38" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="90" y="113" text-anchor="middle" font-size="12" fill="#333">[2,2,3]</text>
  <text x="190" y="113" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 → 2</text>
  <text x="322" y="113" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="436" y="113" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 相同</text>
  <text x="538" y="113" text-anchor="middle" font-size="12" fill="#2e6e2e">[2,2] → 1 个</text>
  <text x="640" y="113" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>

  <text x="38" y="147" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="90" y="147" text-anchor="middle" font-size="12" fill="#333">[2,3,2]</text>
  <text x="190" y="147" text-anchor="middle" font-size="12" fill="#333">1 → 1</text>
  <text x="322" y="147" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="436" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 相同</text>
  <text x="538" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">[1] → 1 个</text>
  <text x="640" y="147" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>

  <text x="38" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="90" y="181" text-anchor="middle" font-size="12" fill="#333">[3,2,1]</text>
  <text x="190" y="181" text-anchor="middle" font-size="12" fill="#333">0 → 0</text>
  <text x="322" y="181" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="436" y="181" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ {3,2,1}</text>
  <text x="538" y="181" text-anchor="middle" font-size="12" fill="#888">区间 [0,0] 非空</text>
  <text x="640" y="181" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <text x="38" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="90" y="215" text-anchor="middle" font-size="12" fill="#333">[2,1,3]</text>
  <text x="190" y="215" text-anchor="middle" font-size="12" fill="#333">1 → 1</text>
  <text x="322" y="215" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="436" y="215" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ {2,1,3}</text>
  <text x="538" y="215" text-anchor="middle" font-size="12" fill="#b85450">[2,1] 空</text>
  <text x="640" y="215" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <text x="38" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="90" y="249" text-anchor="middle" font-size="12" fill="#333">[1,3,2]</text>
  <text x="190" y="249" text-anchor="middle" font-size="12" fill="#333">0 → 0</text>
  <text x="322" y="249" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="436" y="249" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ {1,3,2}</text>
  <text x="538" y="249" text-anchor="middle" font-size="12" fill="#b85450">[1,0] 空</text>
  <text x="640" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <text x="38" y="283" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="90" y="283" text-anchor="middle" font-size="12" fill="#333">[3,2,2]</text>
  <text x="190" y="283" text-anchor="middle" font-size="12" fill="#333">0 → 0</text>
  <text x="322" y="283" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="436" y="283" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓ {3,2,2}</text>
  <text x="538" y="283" text-anchor="middle" font-size="12" fill="#2e6e2e">[0,0] → 1 个</text>
  <text x="640" y="283" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">1</text>

  <g filter="url(#sk)">
    <rect x="30" y="312" width="620" height="142" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="336" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">输出 ＝ [1,1,0,0,0,1]，与示例一致</text>
  <text x="340" y="360" text-anchor="middle" font-size="12" fill="#8a6415">k＝0：窗口恰与 nums 全等，m(k)＝n＝3 被 n−1＝2 截断 —— 忘截断会把不存在的 i＝3 计入</text>
  <text x="340" y="382" text-anchor="middle" font-size="12" fill="#8a6415">k＝2：区间 [s, hi] ＝ [0,0] 非空，但整窗多重集 {3,2,1} ≠ {2,2,3}，内容一票否决</text>
  <text x="340" y="404" text-anchor="middle" font-size="12" fill="#8a6415">k＝5：m(k)＝0（第一位就失配）仍有答案 —— i＝0 无前缀要求，只看 desc(nums) ＝ [3,2,2]</text>
  <text x="340" y="426" text-anchor="middle" font-size="12" fill="#8a6415">k＝3：双重否决（多重集不同 ∧ hi＜s），是「形状」「内容」同时失败的典型</text>
</svg>
