<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="600" height="350" fill="#fafafa"/>

  <text x="300.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">路径极值：固定 B，最优祖先必是路径的 min 或 max</text>
  <text x="300.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">只需携带 (mn, mx) 两个整数下行，无需记录整条路径</text>
  <path d="M 280.0 93.0 L 180.0 126.0" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280.0 93.0 L 400.0 126.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 180.0 165.0 L 120.0 198.0" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <path d="M 180.0 165.0 L 240.0 198.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 400.0 165.0 L 420.0 198.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 240.0 237.0 L 190.0 268.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 240.0 237.0 L 270.0 268.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 420.0 237.0 L 380.0 268.0" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="280.0" cy="74.0" r="19.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="78.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">8</text>
  <circle cx="180.0" cy="146.0" r="19.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180.0" y="150.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <circle cx="400.0" cy="146.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400.0" y="150.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">10</text>
  <circle cx="120.0" cy="218.0" r="19.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120.0" y="222.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="240.0" cy="218.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240.0" y="222.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <circle cx="420.0" cy="218.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420.0" y="222.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">14</text>
  <circle cx="190.0" cy="288.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190.0" y="292.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <circle cx="270.0" cy="288.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270.0" y="292.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <circle cx="380.0" cy="288.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380.0" y="292.3" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">13</text>
  <text x="60.0" y="208.0" font-size="10" fill="#446688" text-anchor="start" filter="url(#rough2)">进入 1 前：mn=3, mx=8</text>
  <rect x="360.0" y="60.0" width="220.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470.0" y="78.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">候选 = max(mx - v, v - mn)</text>
  <text x="470.0" y="92.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">     = max(8-1, 1-3) = 7</text>
  <text x="25.0" y="330.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">路径 8 → 3 → 1：极值把「整条祖先链」压缩成两个数。</text>
</svg>
