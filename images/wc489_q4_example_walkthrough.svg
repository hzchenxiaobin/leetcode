<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="350" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [5,4,5,6]，k = 2</text>
  <path d="M 100 38 Q 330 46 560 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="#e8f0fe">
    <rect x="30" y="50" width="38" height="32"/>
    <rect x="68" y="50" width="72" height="32"/>
    <rect x="140" y="50" width="65" height="32"/>
    <rect x="205" y="50" width="125" height="32"/>
    <rect x="330" y="50" width="82" height="32"/>
    <rect x="412" y="50" width="78" height="32"/>
    <rect x="490" y="50" width="58" height="32"/>
    <rect x="548" y="50" width="64" height="32"/>
  </g>
  <text x="49" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">r</text>
  <text x="104" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">窗口 [L,r]</text>
  <text x="172.5" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">极差</text>
  <text x="267.5" y="63" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">Trie 候选</text>
  <text x="267.5" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">pre[l]</text>
  <text x="371" y="63" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">查询</text>
  <text x="371" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">pre[r+1]</text>
  <text x="451" y="63" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">最优</text>
  <text x="451" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">pre[l]</text>
  <text x="519" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">XOR</text>
  <text x="580" y="70" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">ans</text>

  <!-- 行 1：r=0 -->
  <g filter="url(#rough2)" stroke="#b8b8b8" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="82" width="38" height="42"/>
    <rect x="68" y="82" width="72" height="42"/>
    <rect x="140" y="82" width="65" height="42"/>
    <rect x="205" y="82" width="125" height="42"/>
    <rect x="330" y="82" width="82" height="42"/>
    <rect x="412" y="82" width="78" height="42"/>
    <rect x="490" y="82" width="58" height="42"/>
    <rect x="548" y="82" width="64" height="42"/>
  </g>
  <text x="49" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="104" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[0,0]</text>
  <text x="172.5" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="267.5" y="107" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{0}</text>
  <text x="371" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="451" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="519" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="580" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行 2：r=1 -->
  <g filter="url(#rough2)" stroke="#b8b8b8" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="124" width="38" height="42"/>
    <rect x="68" y="124" width="72" height="42"/>
    <rect x="140" y="124" width="65" height="42"/>
    <rect x="205" y="124" width="125" height="42"/>
    <rect x="330" y="124" width="82" height="42"/>
    <rect x="412" y="124" width="78" height="42"/>
    <rect x="490" y="124" width="58" height="42"/>
    <rect x="548" y="124" width="64" height="42"/>
  </g>
  <text x="49" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="104" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[0,1]</text>
  <text x="172.5" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="267.5" y="149" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{0,5}</text>
  <text x="371" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="451" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="519" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="580" y="149" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行 3：r=2 -->
  <g filter="url(#rough2)" stroke="#b8b8b8" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="166" width="38" height="42"/>
    <rect x="68" y="166" width="72" height="42"/>
    <rect x="140" y="166" width="65" height="42"/>
    <rect x="205" y="166" width="125" height="42"/>
    <rect x="330" y="166" width="82" height="42"/>
    <rect x="412" y="166" width="78" height="42"/>
    <rect x="490" y="166" width="58" height="42"/>
    <rect x="548" y="166" width="64" height="42"/>
  </g>
  <text x="49" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="104" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[0,2]</text>
  <text x="172.5" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="267.5" y="191" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{0,1,5}</text>
  <text x="371" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="451" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="519" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="580" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行 4：r=3（最优行） -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="#e6f4ea">
    <rect x="30" y="208" width="38" height="42"/>
    <rect x="68" y="208" width="72" height="42"/>
    <rect x="140" y="208" width="65" height="42"/>
    <rect x="205" y="208" width="125" height="42"/>
    <rect x="330" y="208" width="82" height="42"/>
    <rect x="412" y="208" width="78" height="42"/>
    <rect x="490" y="208" width="58" height="42"/>
    <rect x="548" y="208" width="64" height="42"/>
  </g>
  <text x="49" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="104" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[0,3]</text>
  <text x="172.5" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="267.5" y="233" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">{0,1,4,5}</text>
  <text x="371" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="451" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="519" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="580" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- 说明框 -->
  <rect x="40" y="266" width="580" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="290" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">r=3：查询 pre[4]=2，候选中最优 pre[1]=5（l=1）→ 子数组 nums[1..3]={4,5,6}，值 = 4⊕5⊕6 = 7</text>
  <text x="330" y="314" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">各行最优对应的子数组：{5}、{4}、{5}、{4,5,6}；k=2 下极差最大为 2，窗口全程未收缩</text>
</svg>
