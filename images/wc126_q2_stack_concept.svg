<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">插入 abc 与删除 abc 互为逆操作</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">s 有效 ⟺ 能反复删掉子串 "abc" 直到空串</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <text x="30.0" y="78.0" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">生成方向：</text>
  <rect x="130" y="66" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="145.0" y="86.0" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">ε</text>
  <path d="M 162.0 82.0 L 196.0 82.0" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="66" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="241.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="211.0" y="87.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="241.0" y="87.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="271.0" y="87.0" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">c</text>
  <path d="M 288.0 82.0 L 322.0 82.0" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="326.0" y="87.0" font-size="12" fill="#333" text-anchor="start" filter="url(#rough2)">在中间插入一块 abc</text>
  <rect x="326" y="108" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="431.0" y="129.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a | abc | bc</text>
  <text x="326.0" y="162.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">= "aabcbc"</text>
  <text x="30.0" y="208.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">删除方向：</text>
  <rect x="130" y="194" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="205.0" y="215.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">aabcbc</text>
  <path d="M 282.0 211.0 L 316.0 211.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="316" y="194" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="376.0" y="215.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">abc（删掉）</text>
  <path d="M 438.0 211.0 L 472.0 211.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="472" y="194" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="512.0" y="215.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="30" y="254" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="275.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">两处可删的 abc 起点至少相差 3，删除区间互不重叠 → 删除顺序可交换</text>
  <text x="40.0" y="291.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">所以归约终态唯一（合流），从左到右见到 abc 就删是合法且充分的</text>
</svg>
