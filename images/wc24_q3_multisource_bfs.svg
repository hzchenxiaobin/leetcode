<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：把所有 0 当成源点，做一次多源 BFS</text>
  <text x="330" y="47" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">水波从每一处 0 同时向外扩散，第 k 层就是距离为 k 的格子</text>

  <rect x="72" y="112" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="146" font-size="18" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="132" y="112" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="146" font-size="18" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="192" y="112" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="146" font-size="18" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="72" y="172" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="206" font-size="18" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="132" y="172" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="206" font-size="18" fill="#3d5c33" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="192" y="172" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="206" font-size="18" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="72" y="232" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="266" font-size="18" fill="#3d5c33" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="232" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="266" font-size="18" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="192" y="232" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="220" y="266" font-size="18" fill="#3d5c33" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="160" y="310" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">颜色 = 距离层，数字 = 答案 dist（示例 2）</text>


  <rect x="290" y="98" width="342" height="222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306" y="124" font-size="11.5" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么「多源」就够了？</text>
  <text x="306" y="150" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">① 答案定义为「到最近的 0」，所有 0 都是距离 0 的源</text>
  <text x="306" y="174" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">② 一次性把全部 0 入队，同时向外扩散</text>
  <text x="306" y="198" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">③ BFS 按层推进，格子第一次被访问即最短</text>
  <text x="306" y="222" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">④ 每个格子最多入队一次 → 总时间 O(m·n)</text>
  <text x="306" y="252" font-size="10.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">暴力：每个格子各跑一次 BFS → O((m·n)²)</text>
  <text x="306" y="274" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">m·n 最大 10⁴，平方级会到 10⁸ 量级，明显偏慢</text>
  <text x="306" y="300" font-size="10" fill="#777" text-anchor="start" filter="url(#rough2)">多源 BFS 只跑一遍，是这道题的标准解</text>

  <rect x="80" y="330" width="22" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="343" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">层 0：0 本身</text>
  <rect x="200" y="330" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="230" y="343" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">层 1：距离 1</text>
  <rect x="330" y="330" width="22" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="360" y="343" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">层 2：距离 2</text>

  <rect x="80" y="366" width="500" height="44" fill="#ffffff" stroke="#9aa5b5" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="330" y="384" font-size="10.5" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">关键等价：所有源同时扩散 = 在「超级源点」上做单源 BFS</text>
  <text x="330" y="400" font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">超级源点到每个 0 的边权为 0，于是各源到格子的最短距离互不干扰，取 min 即可</text>
</svg>
