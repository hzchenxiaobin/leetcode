<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="880" height="512" fill="#fafafa"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [1, 2, 4, 6, 9, 13, 14, 15]（示例 1 的树），queries = [2, 5, 16]</text>
  <path d="M 220 38 Q 440 46 660 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Panel 1: q = 2 hit -->
  <rect x="50" y="52" width="800" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="74" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">q = 2 ｜ 恰好命中 a[1] = 2 → floor = ceiling = 命中值</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#rough2)"><rect x="70" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="88" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="110" y="94" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="128" y="115" text-anchor="middle" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="150" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="168" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="190" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="208" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="230" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="248" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">9</text>
    <g filter="url(#rough2)"><rect x="270" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="288" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><rect x="310" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="328" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="350" y="94" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="368" y="115" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
  </g>
  <text x="128" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">命中</text>
  <g font-size="9.5" fill="#aaa">
    <text x="88" y="140" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="128" y="140" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="168" y="140" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="208" y="140" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="248" y="140" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="288" y="140" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="328" y="140" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="368" y="140" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>
  <g font-size="12">
    <text x="430" y="86" fill="#444" filter="url(#rough2)">lo = lower_bound(2) = 1 → a[1] = 2</text>
    <text x="430" y="108" fill="#444" filter="url(#rough2)">hi = upper_bound(2) = 2 → mini = a[hi−1] = a[1] = 2</text>
    <text x="430" y="138" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">answer = [2, 2] ✓</text>
  </g>

  <!-- Panel 2: q = 5 gap -->
  <rect x="50" y="174" width="800" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="196" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">q = 5 ｜ 落在 4 与 6 之间的空隙 → lo = hi = 3</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#rough2)"><rect x="70" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="88" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="110" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="128" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="150" y="216" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="168" y="237" text-anchor="middle" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="190" y="216" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="208" y="237" text-anchor="middle" fill="#8a5f14" font-weight="bold" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="230" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="248" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">9</text>
    <g filter="url(#rough2)"><rect x="270" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="288" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><rect x="310" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="328" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="350" y="216" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="368" y="237" text-anchor="middle" fill="#333" filter="url(#rough2)">15</text>
  </g>
  <path d="M 188 208 L 188 254" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="196" y="228" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">q=5</text>
  <g font-size="9.5" fill="#aaa">
    <text x="88" y="262" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="128" y="262" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="168" y="262" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="208" y="262" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="248" y="262" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="288" y="262" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="328" y="262" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="368" y="262" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>
  <g font-size="12">
    <text x="430" y="208" fill="#444" filter="url(#rough2)">lo = lower_bound(5) = 3 → maxi = a[3] = 6</text>
    <text x="430" y="230" fill="#444" filter="url(#rough2)">hi = upper_bound(5) = 3 → mini = a[hi−1] = a[2] = 4</text>
    <text x="430" y="260" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">answer = [4, 6] ✓</text>
  </g>

  <!-- Panel 3: q = 16 above all -->
  <rect x="50" y="296" width="800" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="318" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">q = 16 ｜ 大于全体 → lower / upper 双双越右界</text>
  <g font-size="12" font-family="monospace">
    <g filter="url(#rough2)"><rect x="70" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="88" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="110" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="128" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="150" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="168" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="190" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="208" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="230" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="248" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">9</text>
    <g filter="url(#rough2)"><rect x="270" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="288" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><rect x="310" y="338" width="36" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/></g>
    <text x="328" y="359" text-anchor="middle" fill="#333" filter="url(#rough2)">14</text>
    <g filter="url(#rough2)"><rect x="350" y="338" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
    <text x="368" y="359" text-anchor="middle" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">15</text>
  </g>
  <path d="M 394 330 L 394 376" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="394" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">8 = n</text>
  <g font-size="9.5" fill="#aaa">
    <text x="88" y="384" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="128" y="384" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="168" y="384" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="208" y="384" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="248" y="384" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="288" y="384" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="328" y="384" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="368" y="384" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>
  <g font-size="12">
    <text x="430" y="330" fill="#444" filter="url(#rough2)">lo = lower_bound(16) = 8 = n → maxi = −1</text>
    <text x="430" y="352" fill="#444" filter="url(#rough2)">hi = upper_bound(16) = 8 → mini = a[hi−1] = a[7] = 15</text>
    <text x="430" y="382" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">answer = [15, −1] ✓</text>
  </g>

  <!-- note -->
  <rect x="50" y="420" width="800" height="82" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5f14" filter="url(#rough2)">两端越界相互独立：hi = 0 ⇔ q 小于全体 ⇒ mini = −1；lo = n ⇔ q 大于全体 ⇒ maxi = −1</text>
  <text x="440" y="470" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 2：a = [4, 9]，q = 3 → lo = 0（maxi = 4），hi = 0（mini = −1）→ answer = [−1, 4]</text>
  <text x="440" y="490" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">q 落在 [min(a), max(a)] 内时两者都非 −1；q 命中元素时 mini = maxi = q</text>
</svg>
