<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [4, 1, 3, 3]，答案是 5</text>

  <!-- 原数组与差值 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="140" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="380" y="56" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="83">4</text><text x="250" y="83">1</text><text x="330" y="83">3</text><text x="410" y="83">3</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#888" text-anchor="middle">
    <text x="170" y="114">i=0</text><text x="250" y="114">i=1</text><text x="330" y="114">i=2</text><text x="410" y="114">i=3</text>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#b85450" text-anchor="middle">
    <rect x="140" y="126" width="60" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="220" y="126" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="126" width="60" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="380" y="126" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="170" y="150">4</text><text x="250" y="150">0</text><text x="330" y="150">1</text><text x="410" y="150">0</text>
  </g>
  <text x="470" y="150" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">nums[i] − i</text>

  <!-- 分组 -->
  <text x="90" y="206" font-size="13.5" fill="#333" filter="url(#rough2)">按 key 分组计数：</text>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="240" y="182" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="285" y="204">4 → 1 个</text>
    <rect x="340" y="182" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="385" y="204">0 → 2 个</text>
    <rect x="240" y="222" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="285" y="244">1 → 1 个</text>
  </g>

  <!-- 计算 -->
  <g filter="url(#rough2)">
    <rect x="80" y="276" width="400" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="300">总对数 C(4,2) = 6</text>
    <text x="280" y="322">好对 = C(1,2) + C(2,2) + C(1,2) = 0 + 1 + 0 = 1</text>
    <text x="280" y="346" font-weight="bold" fill="#7a2f2b">坏对 = 6 − 1 = 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="366" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="385" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">唯一的好对是 (i=1, j=3)：j−i = 2 且 nums[3]−nums[1] = 3−1 = 2，两者相等。</text>
</svg>
