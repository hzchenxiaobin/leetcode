<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：数量最多 ⇒ 必是「最小的 k 个」</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 n = 15 为例，≤ 15 的质数升序排成一行：</text>

  <rect x="89" y="68" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="147" y="68" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="205" y="68" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="263" y="68" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="321" y="68" width="52" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="379" y="68" width="52" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="173" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="231" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="289" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="347" y="90" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">11</text>
  <text x="405" y="90" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">13</text>
  <text x="115" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₁</text>
  <text x="173" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₂</text>
  <text x="231" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₃</text>
  <text x="289" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₄</text>
  <text x="347" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₅</text>
  <text x="405" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p₆</text>
  <text x="89" y="140" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">选最小 k = 4 个：和 = 2+3+5+7 = 17 ← 任何 4 个里最省</text>

  <rect x="89" y="158" width="52" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="147" y="158" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="205" y="158" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="263" y="158" width="52" height="34" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="321" y="158" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="379" y="158" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="180" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <text x="173" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="231" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="289" y="180" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">7</text>
  <text x="347" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <text x="405" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <text x="89" y="212" text-anchor="start" font-size="12.5" fill="#d6a040" filter="url(#rough2)">换一组 4 个 {3, 5, 11, 13}：和 = 32 ≥ 17，更贵</text>

  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">任意 k 元子集 q₁ &lt; q₂ &lt; … &lt; qₖ 总满足 qᵢ ≥ pᵢ（第 i 小 ≥ 第 i 小）</text>

  <rect x="50" y="268" width="420" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">预算 s 装得下 k 个质数 ⟺ 装得下最小的 k 个</text>
  <text x="260" y="332" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">⇒ 从小到大逐个装、装不下即停，得到最大数量 k*</text>
</svg>
