<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,4,3]，left = 2，right = 3</text>
  <text x="280" y="41" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">count(x) 表：run = 以当前位结尾且全部 ≤ x 的子数组数，total 逐位累加</text>

  <text x="160" y="58" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">x = right = 3</text>
  <text x="420" y="58" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">x = left − 1 = 1</text>

  <rect x="40" y="70" width="240" height="120" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="40" y="70" width="240" height="24" fill="#eef2f8" rx="6" filter="url(#rough2)"/>
  <path d="M 40 94 L 280 94 M 40 118 L 280 118 M 40 142 L 280 142 M 40 166 L 280 166" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 96 70 L 96 190 M 156 70 L 156 190 M 206 70 L 206 190" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="68" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="126" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">v ≤ 3 ?</text>
  <text x="181" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">run</text>
  <text x="243" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">total</text>

  <text x="68" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="126" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="181" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="243" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <text x="68" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="126" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="181" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="243" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <text x="68" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="126" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="181" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="243" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <text x="68" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="126" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="181" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="243" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <rect x="300" y="70" width="240" height="120" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="300" y="70" width="240" height="24" fill="#eef2f8" rx="6" filter="url(#rough2)"/>
  <path d="M 300 94 L 540 94 M 300 118 L 540 118 M 300 142 L 540 142 M 300 166 L 540 166" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 356 70 L 356 190 M 416 70 L 416 190 M 466 70 L 466 190" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="328" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="386" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">v ≤ 1 ?</text>
  <text x="441" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">run</text>
  <text x="503" y="86" text-anchor="middle" font-size="9" fill="#555" font-weight="bold" filter="url(#rough2)">total</text>

  <text x="328" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="386" y="110" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="441" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="503" y="110" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <text x="328" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="386" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="441" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="503" y="134" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <text x="328" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="386" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="441" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="503" y="158" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <text x="328" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="386" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="441" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="503" y="182" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <rect x="110" y="204" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">count(3) − count(1) = 4 − 1 = 3</text>
  <text x="280" y="239" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">两个 total 直接相减，就是答案</text>

  <text x="280" y="266" text-anchor="middle" font-size="9.6" fill="#777" filter="url(#rough2)">答案正是这 3 个子数组（含 4 的不合格；只有 [1] 的 max = 1 &lt; left 也不合格）</text>

  <rect x="100" y="278" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="115" y="298" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="190" y="278" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="298" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="220" y="278" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="235" y="298" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="320" y="278" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="298" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3</text>

  <text x="115" y="324" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[2]</text>
  <text x="220" y="324" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[2, 1]</text>
  <text x="335" y="324" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[3]</text>

  <text x="280" y="356" text-anchor="middle" font-size="9.4" fill="#666" filter="url(#rough2)">x = 3：数组被 4 切成 [2,1] 与 [3] 两段，段长 2 贡献 3、段长 1 贡献 1 → 4</text>
  <text x="280" y="374" text-anchor="middle" font-size="9.4" fill="#666" filter="url(#rough2)">x = 1：被切成 [2] [1] [4] [3] 四段，只有单元素 [1] 合格 → 1</text>
  <text x="280" y="396" text-anchor="middle" font-size="9.2" fill="#999" filter="url(#rough2)">段长 L 的贡献为 L(L+1)/2：run 逐位 1+2+…+L 的累加结果</text>
  <text x="280" y="418" text-anchor="middle" font-size="9.2" fill="#aaa" filter="url(#rough2)">暴力枚举全部 10 个子数组逐一验 max：结果同样是 3</text>
</svg>
