<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：三角形 0-1-2 与四边形 3-4-5-6</text>

  <!-- 左：三角形，红色高亮 -->
  <g filter="url(#rough2)">
    <path d="M 110 90 L 205 90" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 110 90 C 95 160, 125 180, 158 178" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <path d="M 205 90 C 220 160, 190 180, 157 178" stroke="#b85450" stroke-width="2.6" fill="none"/>
    <ellipse cx="110" cy="90" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="110" y="96" text-anchor="middle" font-size="13" fill="#333">0</text>
    <ellipse cx="205" cy="90" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="205" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
    <ellipse cx="158" cy="178" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="158" y="184" text-anchor="middle" font-size="13" fill="#333">2</text>
  </g>
  <text x="158" y="228" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">枚举边 (0,1)：删边后 0→1 绕行 = 2</text>
  <text x="158" y="248" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">候选 2 + 1 = 3 ★ 答案</text>

  <!-- 右：四边形，蓝色 -->
  <g filter="url(#rough2)">
    <path d="M 355 90 L 450 90" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 355 90 C 340 160, 370 178, 403 176" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 450 90 C 465 160, 435 178, 405 176" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 404 176 C 404 178, 404 178, 404 178" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <ellipse cx="355" cy="90" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="355" y="96" text-anchor="middle" font-size="13" fill="#333">3</text>
    <ellipse cx="450" cy="90" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="450" y="96" text-anchor="middle" font-size="13" fill="#333">4</text>
    <ellipse cx="403" cy="176" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="403" y="182" text-anchor="middle" font-size="13" fill="#333">5</text>
    <ellipse cx="403" cy="40" rx="20" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="403" y="46" text-anchor="middle" font-size="13" fill="#333">6</text>
  </g>
  <text x="403" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">枚举边 (3,4)：删边后 3→4 绕行 = 3</text>
  <text x="403" y="248" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">候选 3 + 1 = 4</text>

  <!-- 底部结论 -->
  <rect x="150" y="264" width="260" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">全图最短环 = min(3, 4, …) = 3</text>
</svg>
