<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：一次操作 ±2，奇偶性永不变</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">回文数首位 = 末位，奇偶由首位决定 → 奇回文、偶回文都存在</text>

  <!-- 数轴 -->
  <path d="M 36 178 L 526 178" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <!-- 刻度线与数字 v=6..24, x = 50+(v-6)*26 -->
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <line x1="50" y1="178" x2="50" y2="186" stroke="#888"/><text x="50" y="202" text-anchor="middle">6</text>
    <line x1="76" y1="178" x2="76" y2="186" stroke="#888"/><text x="76" y="202" text-anchor="middle">7</text>
    <line x1="102" y1="178" x2="102" y2="186" stroke="#888"/><text x="102" y="202" text-anchor="middle">8</text>
    <line x1="128" y1="178" x2="128" y2="186" stroke="#888"/><text x="128" y="202" text-anchor="middle">9</text>
    <line x1="154" y1="178" x2="154" y2="186" stroke="#888"/><text x="154" y="202" text-anchor="middle">10</text>
    <line x1="180" y1="178" x2="180" y2="186" stroke="#888"/><text x="180" y="202" text-anchor="middle">11</text>
    <line x1="206" y1="178" x2="206" y2="186" stroke="#d6a040" stroke-width="2"/><text x="206" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">12</text>
    <line x1="232" y1="178" x2="232" y2="186" stroke="#d6a040" stroke-width="2"/><text x="232" y="202" text-anchor="middle" fill="#d6a040" font-weight="bold">13</text>
    <line x1="258" y1="178" x2="258" y2="186" stroke="#888"/><text x="258" y="202" text-anchor="middle">14</text>
    <line x1="284" y1="178" x2="284" y2="186" stroke="#888"/><text x="284" y="202" text-anchor="middle">15</text>
    <line x1="310" y1="178" x2="310" y2="186" stroke="#888"/><text x="310" y="202" text-anchor="middle">16</text>
    <line x1="336" y1="178" x2="336" y2="186" stroke="#888"/><text x="336" y="202" text-anchor="middle">17</text>
    <line x1="362" y1="178" x2="362" y2="186" stroke="#888"/><text x="362" y="202" text-anchor="middle">18</text>
    <line x1="388" y1="178" x2="388" y2="186" stroke="#888"/><text x="388" y="202" text-anchor="middle">19</text>
    <line x1="414" y1="178" x2="414" y2="186" stroke="#888"/><text x="414" y="202" text-anchor="middle">20</text>
    <line x1="440" y1="178" x2="440" y2="186" stroke="#888"/><text x="440" y="202" text-anchor="middle">21</text>
    <line x1="466" y1="178" x2="466" y2="186" stroke="#888"/><text x="466" y="202" text-anchor="middle">22</text>
    <line x1="492" y1="178" x2="492" y2="186" stroke="#888"/><text x="492" y="202" text-anchor="middle">23</text>
    <line x1="518" y1="178" x2="518" y2="186" stroke="#888"/><text x="518" y="202" text-anchor="middle">24</text>
  </g>

  <!-- 非回文灰点 -->
  <g fill="#aaa" filter="url(#rough2)">
    <circle cx="128" cy="225" r="3.5"/><circle cx="154" cy="225" r="3.5"/>
    <circle cx="206" cy="225" r="3.5"/><circle cx="232" cy="225" r="3.5"/>
    <circle cx="258" cy="225" r="3.5"/><circle cx="284" cy="225" r="3.5"/>
    <circle cx="310" cy="225" r="3.5"/><circle cx="336" cy="225" r="3.5"/>
    <circle cx="362" cy="225" r="3.5"/><circle cx="388" cy="225" r="3.5"/>
    <circle cx="414" cy="225" r="3.5"/><circle cx="440" cy="225" r="3.5"/>
    <circle cx="492" cy="225" r="3.5"/><circle cx="518" cy="225" r="3.5"/>
  </g>

  <!-- 奇回文绿格：7, 9, 11 -->
  <g filter="url(#rough2)">
    <rect x="66" y="214" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="118" y="214" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="170" y="214" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <!-- 偶回文蓝格：6, 8, 22 -->
  <g filter="url(#rough2)">
    <rect x="40" y="214" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="92" y="214" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="456" y="214" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <!-- 8 是 12 的最优目标，红框强调 -->
  <rect x="90" y="212" width="24" height="24" fill="none" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="250" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最近 ✓</text>

  <!-- 元素 x = 12 -->
  <circle cx="206" cy="118" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">12</text>
  <!-- 元素 x = 13 -->
  <circle cx="240" cy="82" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">13</text>

  <!-- 12 → 8 -->
  <path d="M 198 128 Q 146 158 108 210" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="112" y="162" font-size="11" fill="#b85450" filter="url(#rough2)">−2×2 = 2 步</text>
  <!-- 12 → 22 -->
  <path d="M 218 128 Q 360 152 458 210" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="330" y="146" font-size="11" fill="#b85450" filter="url(#rough2)">+2×5 = 5 步</text>
  <!-- 13 → 11 -->
  <path d="M 234 94 Q 208 152 184 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="164" y="136" font-size="11" fill="#4a7a3a" filter="url(#rough2)">−2×1 = 1 步</text>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="12" fill="#444">
    <rect x="58" y="264" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="86" y="279">奇回文</text>
    <rect x="150" y="264" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="178" y="279">偶回文</text>
    <circle cx="252" cy="274" r="3.5" fill="#aaa"/>
    <text x="264" y="279">非回文</text>
    <circle cx="332" cy="274" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="348" y="279">元素 x</text>
  </g>

  <!-- 结论框 -->
  <rect x="30" y="296" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">偶数 x 只能落在偶回文上，奇数 x 只能落在奇回文上（±2 跳不到对面）</text>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b5320" filter="url(#rough2)">单个元素最少操作数 = |t − x| ÷ 2，t 取与 x 同奇偶的最近回文数</text>
</svg>
