<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">按最低位 r 分三种情况，前缀和整体回落一层</text>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">solve(m) 返回 (a, b)：a + b = m，且 a、b 的十进制每一位都非零（0 表示该部分没有数字）</text>

  <!-- 入口 -->
  <g filter="url(#rough2)">
    <rect x="220" y="62" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="87" text-anchor="middle" font-size="13" fill="#2f4a66">solve(m)，m ≥ 2</text>
  </g>
  <path d="M300,100 L300,108" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <polygon points="300,112 420,148 300,184 180,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="144" text-anchor="middle" font-size="11" fill="#8a6a20">r = m % 10，q = m // 10</text>
    <text x="300" y="162" text-anchor="middle" font-size="10.5" fill="#8a6a20">r 落在哪一档？</text>
  </g>

  <!-- 三条分支 -->
  <g filter="url(#rough2)">
    <rect x="24" y="216" width="172" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="110" y="240" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold">r ≥ 2（不进位）</text>
    <text x="110" y="262" text-anchor="middle" font-size="10.5" fill="#3d6b2f">末位取 (x, y) = (1, r−1)</text>
    <text x="110" y="282" text-anchor="middle" font-size="10.5" fill="#3d6b2f">前缀和 = q</text>

    <rect x="214" y="216" width="172" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="300" y="240" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold">r = 1（必进位）</text>
    <text x="300" y="262" text-anchor="middle" font-size="10.5" fill="#2f4a66">末位取 (x, y) = (2, 9)</text>
    <text x="300" y="282" text-anchor="middle" font-size="10.5" fill="#2f4a66">前缀和 = q − 1</text>

    <rect x="404" y="216" width="172" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="490" y="240" text-anchor="middle" font-size="12" fill="#8c3b36" font-weight="bold">r = 0（必进位）</text>
    <text x="490" y="262" text-anchor="middle" font-size="10.5" fill="#8c3b36">末位取 (x, y) = (1, 9)</text>
    <text x="490" y="282" text-anchor="middle" font-size="10.5" fill="#8c3b36">前缀和 = q − 1</text>
  </g>

  <path d="M300,184 L118,212" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,184 L300,212" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,184 L482,212" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归 -->
  <path d="M110,294 L190,326" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,294 L300,326" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M490,294 L410,326" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="330" width="300" height="46" fill="#f3f0ff" stroke="#6b5b95" stroke-width="1.6" rx="10"/>
    <text x="300" y="352" text-anchor="middle" font-size="11.5" fill="#4e4470">递归 solve(前缀和) 得到 (a', b')</text>
    <text x="300" y="369" text-anchor="middle" font-size="10" fill="#4e4470">深度 = 十进制位数，最多 4 层</text>
  </g>

  <path d="M300,376 L300,394" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="398" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="300" y="426" text-anchor="middle" font-size="12.5" fill="#3d6b2f">返回 (10a' + x, 10b' + y)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="398" width="112" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="76" y="416" text-anchor="middle" font-size="10.5" fill="#8a6a20">终止：m ≤ 1</text>
    <text x="76" y="433" text-anchor="middle" font-size="10.5" fill="#8a6a20">返回 (m, 0)</text>
  </g>
</svg>
