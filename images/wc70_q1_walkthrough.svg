<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="404" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：n = 4，k = 5，答案是 1</text>
  <text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 4 行 = 01101001，自顶向下每层折半，最后把取反次数收回</text>
  <rect x="50" y="66" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">层 n</text>
  <text x="161.0" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">k</text>
  <text x="247.0" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">mid</text>
  <text x="367.0" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">k 与 mid</text>
  <text x="516.0" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">交给下一层</text>
  <rect x="50" y="96" width="540" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85.0" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">4</text>
  <text x="161.0" y="118" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">5</text>
  <text x="247.0" y="118" text-anchor="middle" font-size="11.5" fill="#5a6a80" filter="url(#rough2)">4</text>
  <text x="367.0" y="118" text-anchor="middle" font-size="10.5" fill="#4a5a72" filter="url(#rough2)">5 &gt; 4 → 右半</text>
  <text x="516.0" y="118" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1 - f(3, 1)</text>
  <rect x="50" y="130" width="540" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85.0" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">3</text>
  <text x="161.0" y="152" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="247.0" y="152" text-anchor="middle" font-size="11.5" fill="#5a6a80" filter="url(#rough2)">2</text>
  <text x="367.0" y="152" text-anchor="middle" font-size="10.5" fill="#4a5a72" filter="url(#rough2)">1 ≤ 2 → 左半</text>
  <text x="516.0" y="152" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">f(2, 1)</text>
  <rect x="50" y="164" width="540" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85.0" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">2</text>
  <text x="161.0" y="186" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="247.0" y="186" text-anchor="middle" font-size="11.5" fill="#5a6a80" filter="url(#rough2)">1</text>
  <text x="367.0" y="186" text-anchor="middle" font-size="10.5" fill="#4a5a72" filter="url(#rough2)">1 ≤ 1 → 左半</text>
  <text x="516.0" y="186" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">f(1, 1)</text>
  <rect x="50" y="198" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85.0" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="161.0" y="220" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <text x="247.0" y="220" text-anchor="middle" font-size="11.5" fill="#5a6a80" filter="url(#rough2)">—</text>
  <text x="367.0" y="220" text-anchor="middle" font-size="10.5" fill="#4a5a72" filter="url(#rough2)">递归终止</text>
  <text x="516.0" y="220" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">0</text>
  <path d="M 120 66 L 120 232 M 202 66 L 202 232 M 292 66 L 292 232 M 442 66 L 442 232" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="256" width="540" height="124" fill="#f5f7fb" stroke="#9aa7bb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3f4f66" filter="url(#rough2)">回溯：0 一路不动，只有第 4 层走右半 → 1 - 0 = 1</text>
  <text x="68" y="308" text-anchor="start" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">① 第 2、3 层都落在左半：结果照抄父层，符号不变</text>
  <text x="68" y="330" text-anchor="start" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">② 第 4 层落在右半：套一层取反，1 - f(3,1)</text>
  <text x="68" y="352" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">③ 位运算等价：popcount(5 - 1) = popcount(100₂) = 1（奇）→ 1</text>
  <text x="68" y="374" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">④ 再验一个 k = 6：popcount(101₂) = 2（偶）→ 0，第 4 行第 6 位正是 0</text>
</svg>
