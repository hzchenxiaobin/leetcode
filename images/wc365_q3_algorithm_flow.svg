<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 515" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="515" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先取模分解，再翻倍数组滑窗</text>

  <!-- step 1 -->
  <rect x="110" y="58" width="240" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="230" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">① 计算 S = Σ nums[i] 与 n</text>
  <text x="230" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">S ≤ 10⁵×10⁵ = 10¹⁰，C++ 必须 long long</text>
  <path d="M 230 112 L 230 130" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 2 -->
  <rect x="110" y="134" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="230" y="161" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">② 带余除法：k、r = target ÷ S</text>
  <path d="M 230 178 L 230 194" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- diamond r==0 -->
  <polygon points="230,198 334,232 230,266 126,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="230" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">r = 0 ?</text>
  <path d="M 334 232 L 420 232" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="368" y="222" text-anchor="middle" font-size="12" fill="#3a6a2a" filter="url(#sk)">是</text>
  <rect x="424" y="208" width="238" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="543" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">直接返回 k·n</text>
  <text x="543" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">k 份整抄首尾相接，环弧为空</text>
  <path d="M 230 266 L 230 286" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="244" y="282" font-size="12" fill="#a04a48" filter="url(#sk)">否</text>

  <!-- step 3 -->
  <rect x="110" y="290" width="240" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="230" y="312" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">③ 翻倍数组上滑窗找环弧</text>
  <text x="230" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">right 扫 2n 格（环形索引 right % n）</text>
  <text x="230" y="348" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">s 大于 r 就左缩；s = r 时记录 len</text>
  <path d="M 230 358 L 230 374" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- diamond found -->
  <polygon points="230,378 326,410 230,442 134,410" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="230" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">找到 len ?</text>
  <path d="M 326 410 L 420 410" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#3a6a2a" filter="url(#sk)">是</text>
  <rect x="424" y="386" width="238" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="543" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">返回 k·n + len</text>
  <text x="543" y="424" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">整份底座 + 最短环弧</text>
  <path d="M 230 442 L 230 452" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="244" y="452" font-size="12" fill="#a04a48" filter="url(#sk)">否</text>
  <rect x="110" y="456" width="240" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="230" y="481" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a48" filter="url(#sk)">返回 −1（和为 r 的环弧不存在）</text>

  <text x="340" y="504" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">时间 O(n)：right 扫 2n 格、left 只进不退；空间 O(1)：环形索引 i % n，免开翻倍数组</text>
</svg>
