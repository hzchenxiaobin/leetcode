<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：s = "letelt"，共 2 次交换</text>

  <!-- 第 1 步 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#446688">
    <text x="42" y="72">第 1 步：窗口 [0,5]，'l' ≠ 't'</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="42" y="82" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="94" y="82" width="52" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="146" y="82" width="52" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="198" y="82" width="52" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="250" y="82" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="302" y="82" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="68" y="107">l</text><text x="120" y="107">e</text><text x="172" y="107">t</text>
    <text x="224" y="107">e</text><text x="276" y="107">l</text><text x="328" y="107">t</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666">
    <text x="368" y="98">p = 4（'l' 最右）</text>
    <text x="368" y="114">q = 2（'t' 最左）</text>
    <text x="368" y="130">r−p = 1 ≤ q−l = 2 → 左路</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 286 108 C 300 108, 312 108, 324 108" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 中间箭头 -->
  <g filter="url(#rough2)">
    <path d="M 280 138 C 280 154, 280 158, 280 170" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)"/>
  </g>
  <text x="296" y="158" font-size="12.5" fill="#d6a040" filter="url(#rough2)">把 'l' 换到下标 5，ans = 1</text>

  <!-- 第 2 步 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#446688">
    <text x="42" y="204">第 2 步：窗口 [1,4]，'e' ≠ 't'</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="42" y="214" width="52" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="94" y="214" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="146" y="214" width="52" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="198" y="214" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="250" y="214" width="52" height="40" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="302" y="214" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="120" y="239">l</text><text x="172" y="239">e</text>
    <text x="224" y="239">e</text><text x="276" y="239">t</text><text x="328" y="239">l</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666">
    <text x="368" y="230">p = 3（'e' 最右）</text>
    <text x="368" y="246">q = 2（'t' 最左）</text>
    <text x="368" y="262">r−p = 1 ≤ q−l = 1 → 左路</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 234 240 C 246 240, 254 240, 264 240" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="42" y="290" width="312" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#2a4a22">
    <text x="58" y="315">窗口 [2,3]：'t' = 't' 收缩 → ans = 2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="368" y="290" width="152" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#5a4a20">
    <text x="444" y="307" text-anchor="middle">最终串 "lettel"</text>
    <text x="444" y="324" text-anchor="middle">返回 2 ✓</text>
  </g>
</svg>
