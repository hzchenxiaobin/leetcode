<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">无括号 + 乘除优先 ⟹ 表达式是若干 ±x^e 的和</text>
  <rect x="170" y="58" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#33475b" font-weight="bold" filter="url(#rough2)">3*3 + 3*3 + 3/3 = 19</text>
  <rect x="50" y="130" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="152" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">3*3 = 3²</text>
  <text x="120" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">代价 1</text>
  <rect x="210" y="130" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">3*3 = 3²</text>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">代价 1</text>
  <rect x="370" y="130" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">3/3 = 3⁰</text>
  <text x="440" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">代价 1</text>
  <text x="280" y="214" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">3 个单项式之间还需要 2 个加号</text>
  <rect x="60" y="232" width="440" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总代价 = Σ ops(eⱼ) + (m − 1)</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ops(0) = 1（x/x），ops(e ≥ 1) = e − 1（e 个 x 连乘）</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">本例：1 + 1 + 1 + 2 = 5 ✓</text>
</svg>
