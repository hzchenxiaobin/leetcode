<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：排序后切半 —— 小值池 × 大值池</text>
  <path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">一次操作消耗一个「小值 i」（被 ×2）和一个「大值 j」（作上界），并把两个都标记</text>

  <text x="200" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">小值池 = 左半（从小到大）</text>
  <text x="480" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6210" filter="url(#rough2)">大值池 = 顶半（从小到大）</text>

  <g filter="url(#rough2)">
    <rect x="178" y="110" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="178" y="160" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="178" y="210" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="454" y="110" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="454" y="160" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="454" y="210" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="202" y="132">3</text>
    <text x="202" y="182">5</text>
    <text x="202" y="232">8</text>
    <text x="478" y="132">10</text>
    <text x="478" y="182">12</text>
    <text x="478" y="232">13</text>
  </g>

  <path d="M 232 127 L 442 127" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="156" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">2×3 = 6 ≤ 10 → 配成一对 ✓</text>

  <path d="M 232 177 L 442 177" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="340" y="206" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">2×5 = 10 ≤ 12 → 配成一对 ✓</text>

  <path d="M 232 227 L 442 227" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="340" y="256" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">2×8 = 16 &gt; 13 ✗ 配不上 —— 小值 8 落选（此例 k = 2）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="272" width="560" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="340" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">配对数 k ≤ ⌊n/2⌋，标记数 = 2k（答案必为偶数）</text>
  <text x="340" y="317" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最优解中：小值恰好取最小的 k 个、大值恰好取最大的 k 个（交换论证，见 §5）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="342" width="560" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">贪心方向：小值从小到大，大值也从小到大</text>
  <text x="340" y="387" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">用「最小的够格大值」配「最小的未配小值」，把更大的大值留给后面更难配的小值</text>

  <text x="340" y="442" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">本例 n = 6，至多 ⌊6/2⌋ = 3 对；实际配成 2 对 → 标记 4 个下标</text>
</svg>
