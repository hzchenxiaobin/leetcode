<svg xmlns="http://www.w3.org/2000/svg" width="620" height="440" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一次遍历，滚动变量 dp，ans 逐位累加</text>
  <path d="M 120 42 Q 310 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="62" text-anchor="middle" font-size="11.5" fill="#888">dp 不用开数组 —— 只依赖 dp[i−1]，一个滚动变量即可，空间 O(1)</text>

  <!-- start pill -->
  <rect x="215" y="76" width="190" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="310" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">ans = 1，dp = 1（计入 i = 0）</text>
  <path d="M 310 112 L 310 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- diamond 1 -->
  <polygon points="310,130 380,168 310,206 240,168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="310" y="172" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">i ≤ n−1 ?</text>
  <text x="310" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是（i 从 1 开始）</text>

  <!-- return pill -->
  <path d="M 380 168 L 448 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="412" y="160" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">否</text>
  <rect x="452" y="150" width="140" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="522" y="173" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans（long long）</text>

  <path d="M 310 206 L 310 232" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <!-- diamond 2 -->
  <polygon points="310,234 402,272 310,310 218,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="310" y="268" text-anchor="middle" font-size="11.5" fill="#8c6a20" font-weight="bold">prices[i] ==</text>
  <text x="310" y="284" text-anchor="middle" font-size="11.5" fill="#8c6a20" font-weight="bold">prices[i−1] − 1 ?</text>

  <!-- yes branch (blue) -->
  <path d="M 218 272 L 190 272 L 190 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="186" y="264" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">是</text>
  <rect x="96" y="340" width="160" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="176" y="364" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp = dp + 1（续接）</text>
  <path d="M 96 359 L 60 359" stroke="#3a3a3a" stroke-width="0" fill="none"/>

  <!-- no branch (orange) -->
  <path d="M 402 272 L 430 272 L 430 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="434" y="264" text-anchor="start" font-size="10.5" fill="#d6a040" font-weight="bold">否</text>
  <rect x="364" y="340" width="160" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="444" y="358" text-anchor="middle" font-size="12" fill="#8c6a20" font-weight="bold">dp = 1（断链）</text>
  <text x="444" y="373" text-anchor="middle" font-size="10" fill="#8c6a20">只剩自己一个单日</text>

  <!-- converge to ans box -->
  <path d="M 176 378 L 176 398 L 268 398" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 444 378 L 444 398 L 352 398" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>

  <rect x="272" y="382" width="76" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="310" y="403" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold">ans += dp</text>

  <!-- loop back -->
  <path d="M 268 398 Q 200 424 150 398 Q 96 368 96 272 Q 96 168 236 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <rect x="112" y="150" width="44" height="24" rx="12" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="134" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++</text>
  <text x="150" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">回到外层判断</text>

  <!-- side warning box -->
  <rect x="390" y="52" width="216" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="498" y="72" text-anchor="middle" font-size="10.5" fill="#8c3a36" font-weight="bold">⚠️ 两个高频坑：</text>
  <text x="498" y="88" text-anchor="middle" font-size="10" fill="#8c3a36">① 最坏 n(n+1)/2 ≈ 5×10⁹，ans 必须 long long</text>
  <text x="498" y="102" text-anchor="middle" font-size="10" fill="#8c3a36">② 相等（差 0）不算「恰好少 1」，照样断链</text>
</svg>
