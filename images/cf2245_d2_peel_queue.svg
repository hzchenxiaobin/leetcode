<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">计数 + 队列：一次扫描剥完 O(n + m)</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">每个点只需知道「剩余 1 型边数」「剩余 2 型边数」</text>

  <rect x="100" y="58" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="10.5" fill="#3a4a66">读入 m 条边：cnt1[v]、cnt2[v] 加上对应类型的度数</text>

  <path d="M 280 90 L 280 110" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="112" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="10.5" fill="#8a6a20">初始化队列：所有 cnt1[v] == 0 或 cnt2[v] == 0 的点</text>

  <path d="M 280 144 L 280 164" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="166" width="360" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="10.5" fill="#3a5a30">弹出 v（已剥离则跳过），记下它的位置 k</text>
  <text x="280" y="203" text-anchor="middle" font-size="10.5" fill="#3a5a30">符号：cnt1[v] &gt; 0 → 正；cnt2[v] &gt; 0 → 负；皆 0 → 任取；模长 = n − k</text>

  <path d="M 280 212 L 280 232" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="234" width="360" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="10.5" fill="#8a3a36">遍历 v 的邻接边：这些边已定格，从邻居的计数里删掉</text>

  <path d="M 280 266 L 280 286" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="288" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="10.5" fill="#3a4a66">邻居变成可剥离且从未入队 → 压入队列（每点最多入队一次）</text>

  <path d="M 280 320 L 280 340" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="342" width="360" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="10.5" fill="#3a5a30">队列空：已剥离 n 个 → 输出 YES 与构造；否则 NO</text>

  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#444">复杂度：每条边被两端各访问一次、每个点入队一次 ⇒ 时间 O(n + m)，空间 O(n + m)</text>
</svg>
