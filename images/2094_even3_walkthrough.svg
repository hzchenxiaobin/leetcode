<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="490" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：digits = [2,1,3,0] 的频次验证走查</text>
  <path d="M 190 42 Q 360 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- freq table -->
  <text x="160" y="70" font-size="11" font-weight="bold" fill="#999" filter="url(#sk)">频次表</text>
  <g filter="url(#sk)">
    <rect x="200" y="58" width="340" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="9.5" fill="#8a8a8a" text-anchor="middle">
    <text x="217" y="70">0</text><text x="251" y="70">1</text><text x="285" y="70">2</text><text x="319" y="70">3</text><text x="353" y="70">4</text><text x="387" y="70">5</text><text x="421" y="70">6</text><text x="455" y="70">7</text><text x="489" y="70">8</text><text x="523" y="70">9</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b6e9e" text-anchor="middle" filter="url(#sk)">
    <text x="217" y="90">1</text><text x="251" y="90">1</text><text x="285" y="90">1</text><text x="319" y="90">1</text><text x="353" y="90">0</text><text x="387" y="90">0</text><text x="421" y="90">0</text><text x="455" y="90">0</text><text x="489" y="90">0</text><text x="523" y="90">0</text>
  </g>
  <g stroke="#4a8edb" stroke-width="1" opacity="0.5">
    <line x1="234" y1="60" x2="234" y2="96"/><line x1="268" y1="60" x2="268" y2="96"/><line x1="302" y1="60" x2="302" y2="96"/><line x1="336" y1="60" x2="336" y2="96"/><line x1="370" y1="60" x2="370" y2="96"/><line x1="404" y1="60" x2="404" y2="96"/><line x1="438" y1="60" x2="438" y2="96"/><line x1="472" y1="60" x2="472" y2="96"/><line x1="506" y1="60" x2="506" y2="96"/>
  </g>
  <text x="568" y="82" font-size="10.5" fill="#666" filter="url(#sk)">freq[0..9]</text>
  <path d="M 370 100 L 370 118" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- candidates table -->
  <g filter="url(#sk)">
    <rect x="60" y="124" width="600" height="26" rx="4" fill="#f2f2ee" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="141">候选 x</text>
    <text x="245" y="141">百 / 十 / 个</text>
    <text x="395" y="141">所需频次 need</text>
    <text x="545" y="141">freq 检查</text>
    <text x="625" y="141">结果</text>
  </g>

  <!-- row 1: 100 rejected -->
  <g filter="url(#sk)">
    <rect x="60" y="152" width="600" height="28" fill="#fce4ec" opacity="0.55"/>
    <rect x="60" y="152" width="600" height="28" fill="none" stroke="#d8a8a5" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="171" font-weight="bold" fill="#333">100</text>
    <text x="245" y="171" font-family="monospace" fill="#555">1 0 0</text>
    <text x="395" y="171" font-family="monospace" fill="#a04038">1×1, 0×2</text>
    <text x="545" y="171" fill="#a04038">freq[0]=1 &lt; 2</text>
    <text x="625" y="171" font-weight="bold" fill="#b85450">✗</text>
  </g>

  <!-- row 2: 102 accepted -->
  <g filter="url(#sk)">
    <rect x="60" y="182" width="600" height="28" fill="#eaf6ee" opacity="0.55"/>
    <rect x="60" y="182" width="600" height="28" fill="none" stroke="#a8cfa8" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="201" font-weight="bold" fill="#333">102</text>
    <text x="245" y="201" font-family="monospace" fill="#555">1 0 2</text>
    <text x="395" y="201" font-family="monospace" fill="#2e6e2e">1, 0, 2 各×1</text>
    <text x="545" y="201" fill="#2e6e2e">全部满足</text>
    <text x="625" y="201" font-weight="bold" fill="#4a8e4a">✓</text>
  </g>

  <!-- row 3: 132 accepted -->
  <g filter="url(#sk)">
    <rect x="60" y="212" width="600" height="28" fill="#eaf6ee" opacity="0.55"/>
    <rect x="60" y="212" width="600" height="28" fill="none" stroke="#a8cfa8" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="231" font-weight="bold" fill="#333">132</text>
    <text x="245" y="231" font-family="monospace" fill="#555">1 3 2</text>
    <text x="395" y="231" font-family="monospace" fill="#2e6e2e">1, 3, 2 各×1</text>
    <text x="545" y="231" fill="#2e6e2e">全部满足</text>
    <text x="625" y="231" font-weight="bold" fill="#4a8e4a">✓</text>
  </g>

  <!-- row 4: 200 rejected -->
  <g filter="url(#sk)">
    <rect x="60" y="242" width="600" height="28" fill="#fce4ec" opacity="0.55"/>
    <rect x="60" y="242" width="600" height="28" fill="none" stroke="#d8a8a5" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="261" font-weight="bold" fill="#333">200</text>
    <text x="245" y="261" font-family="monospace" fill="#555">2 0 0</text>
    <text x="395" y="261" font-family="monospace" fill="#a04038">2×1, 0×2</text>
    <text x="545" y="261" fill="#a04038">freq[0]=1 &lt; 2</text>
    <text x="625" y="261" font-weight="bold" fill="#b85450">✗</text>
  </g>

  <!-- row 5: 210 accepted -->
  <g filter="url(#sk)">
    <rect x="60" y="272" width="600" height="28" fill="#eaf6ee" opacity="0.55"/>
    <rect x="60" y="272" width="600" height="28" fill="none" stroke="#a8cfa8" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="120" y="291" font-weight="bold" fill="#333">210</text>
    <text x="245" y="291" font-family="monospace" fill="#555">2 1 0</text>
    <text x="395" y="291" font-family="monospace" fill="#2e6e2e">2, 1, 0 各×1</text>
    <text x="545" y="291" fill="#2e6e2e">全部满足</text>
    <text x="625" y="291" font-weight="bold" fill="#4a8e4a">✓</text>
  </g>

  <!-- row 6: dots -->
  <text x="360" y="321" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">…（120, 130, 230, 302, 310, 312, 320 同理命中）…</text>

  <!-- answer strip -->
  <path d="M 360 330 L 360 348" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="70" y="354" width="580" height="54" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="360" y="374" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">命中 10 个 —— 按枚举顺序收集，天然升序：</text>
  <text x="360" y="396" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">[102, 120, 130, 132, 210, 230, 302, 310, 312, 320]</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="90" y="424" width="540" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="443" text-anchor="middle" font-size="11.5" fill="#7a5415">拦截要点：含重复数位的候选（100、200 各需两个 0）被频次比较挡下</text>
  <text x="360" y="461" text-anchor="middle" font-size="10.5" fill="#999">若只判「每位是否在 digits 中出现」，100 会被错放行 —— 见「边界情况」</text>
</svg>
