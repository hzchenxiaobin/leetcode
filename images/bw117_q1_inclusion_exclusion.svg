<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">容斥原理：从「无上界」里抠掉「有人超限」</text>

  <!-- 全集 U：n 颗糖 + 2 块隔板 -->
  <rect x="40" y="60" width="480" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="86" font-size="13" fill="#446688" filter="url(#rough2)">全集 U：a+b+c = n 的全部解</text>
  <text x="70" y="108" font-size="13" fill="#446688" filter="url(#rough2)">隔板法 → C(n+2, 2)</text>

  <!-- 三个超限圆 -->
  <ellipse cx="150" cy="220" rx="86" ry="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)" opacity="0.85"/>
  <ellipse cx="290" cy="240" rx="86" ry="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)" opacity="0.85"/>
  <ellipse cx="420" cy="215" rx="86" ry="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)" opacity="0.85"/>
  <text x="150" y="204" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A₁：孩子1 &gt; limit</text>
  <text x="150" y="224" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">先发 (limit+1) 颗</text>
  <text x="150" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">C(n−limit+1, 2)</text>
  <text x="290" y="226" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A₂：孩子2 超限</text>
  <text x="290" y="246" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">同 A₁ 对称</text>
  <text x="420" y="199" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A₃：孩子3 超限</text>
  <text x="420" y="219" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">同 A₁ 对称</text>

  <!-- 交集标注 -->
  <text x="218" y="252" font-size="11" fill="#8a6d3b" filter="url(#rough2)">A₁∩A₂</text>
  <text x="352" y="256" font-size="11" fill="#8a6d3b" filter="url(#rough2)">A₂∩A₃</text>
  <text x="285" y="288" font-size="11" fill="#8a6d3b" filter="url(#rough2)">三重交叠 A₁∩A₂∩A₃</text>

  <!-- 容斥公式 -->
  <rect x="60" y="318" width="440" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">ans = C(n+2,2) − 3·C(n−limit+1,2)</text>
  <text x="280" y="366" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">+ 3·C(n−2·limit,2) − C(n−3·limit−1,2)</text>

  <!-- 箭头 -->
  <path d="M 280 124 Q 280 150 270 168" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 90 318 Q 90 300 120 288" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 318 Q 470 300 450 285" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
