<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="440" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：三步剥叶，最后只剩 0—2 一条边</text>
  <text x="470" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">coins = [0,0,0,1,1,0,0,1]，金币在 3、4、7；答案 = 2 × 剩余边数</text>
  <path d="M 220 60 Q 470 68 720 60" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="170" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">阶段①：删无币叶（级联）</text>
  <g filter="url(#sk)"><path d="M 170 118 L 106 176" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 170 118 L 234 176" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 106 176 L 72 234" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 106 176 L 138 234" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 234 176 L 234 234" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 234 234 L 200 292" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><path d="M 234 234 L 266 292" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="170" cy="118" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="170" y="123" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><circle cx="106" cy="176" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="106" y="181" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="234" cy="176" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="234" y="181" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="72" cy="234" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="72" y="239" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><circle cx="91" cy="224" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="138" cy="234" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="138" y="239" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><circle cx="157" cy="224" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="234" cy="234" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="234" y="239" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><circle cx="200" cy="292" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 194 286 L 206 298 M 194 298 L 206 286" stroke="#b85450" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="266" cy="292" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="266" y="297" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><circle cx="285" cy="282" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <text x="200" y="324" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">无币叶，删</text>
  <text x="170" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">剩余边数 7 − 1 = 6</text>

  <g filter="url(#sk)"><path d="M 292 200 L 366 200" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/></g>
  <text x="329" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">删 6</text>

  <text x="475" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b8860b" filter="url(#sk)">阶段② 第 1 轮：删全部带币叶</text>
  <g filter="url(#sk)"><path d="M 475 118 L 411 176" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 475 118 L 539 176" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 411 176 L 377 234" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><path d="M 411 176 L 443 234" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><path d="M 539 176 L 539 234" stroke="#3a3a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 539 234 L 571 292" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><circle cx="475" cy="118" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="475" y="123" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><circle cx="411" cy="176" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="411" y="181" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><circle cx="539" cy="176" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="539" y="181" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="377" cy="234" r="15" fill="#faf5ea" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 371 228 L 383 240 M 371 240 L 383 228" stroke="#d6a040" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="396" cy="224" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="443" cy="234" r="15" fill="#faf5ea" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 437 228 L 449 240 M 437 240 L 449 228" stroke="#d6a040" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="462" cy="224" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="539" cy="234" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="539" y="239" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><circle cx="571" cy="292" r="15" fill="#faf5ea" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 565 286 L 577 298 M 565 298 L 577 286" stroke="#d6a040" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="590" cy="282" r="4.5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <text x="475" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">剩余边数 6 − 3 = 3</text>

  <g filter="url(#sk)"><path d="M 594 200 L 668 200" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/></g>
  <text x="631" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">删 3、4、7</text>

  <text x="780" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">阶段② 第 2 轮：删新暴露的叶</text>
  <g filter="url(#sk)"><path d="M 780 118 L 716 176" stroke="#8a9a8a" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><path d="M 780 118 L 844 176" stroke="#446688" stroke-width="3.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 844 176 L 844 234" stroke="#8a9a8a" stroke-width="1.6" fill="none" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><circle cx="780" cy="118" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="780" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><circle cx="716" cy="176" r="15" fill="#f2f8f0" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 710 170 L 722 182 M 710 182 L 722 170" stroke="#4a7a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><circle cx="844" cy="176" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="844" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><circle cx="844" cy="234" r="15" fill="#f2f8f0" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 838 228 L 850 240 M 838 240 L 850 228" stroke="#4a7a3a" stroke-width="1.8" fill="none"/></g>
  <text x="716" y="216" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">新叶</text>
  <text x="878" y="216" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">新叶</text>
  <text x="780" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">剩余边数 3 − 2 = 1</text>

  <g filter="url(#sk)"><rect x="190" y="368" width="560" height="54" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="470" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">剩余核心 = {0, 2}，1 条边 ⇒ 答案 = 2 × 1 = 2</text>
  <text x="470" y="410" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">从 0 出发收 3、4（距离 2），走到 2 收 7（距离 2），再返回 0，恰好 2 条边</text>
</svg>
