<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="500" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">为什么不能贪心：反例 stoneValue = [−1, −1, −100]</text>
  <text x="350" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#r)">贪心：每轮拿「本轮得分最大」的堆数 k —— 只看眼前收益，完全忽略留给对手的局面</text>

  <!-- 左：贪心 -->
  <g filter="url(#r)">
    <rect x="16" y="58" width="330" height="318" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="181" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">贪心：拿 1 堆（s₁ = −1 最大）</text>

  <text x="32" y="108" font-size="11" fill="#333" filter="url(#r)">① Alice 拿 k=1</text>
  <g filter="url(#r)">
    <rect x="32" y="116" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="86" y="116" width="46" height="32" rx="4" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="116" width="46" height="32" rx="4" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="55" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−1</text>
  <text x="109" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−1</text>
  <text x="163" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−100</text>
  <text x="200" y="136" font-size="11" fill="#666" filter="url(#r)">本轮得 −1</text>

  <text x="32" y="170" font-size="11" fill="#333" filter="url(#r)">② Bob 拿 k=1</text>
  <g filter="url(#r)">
    <rect x="32" y="178" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="86" y="178" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="140" y="178" width="46" height="32" rx="4" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="109" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−1</text>
  <text x="163" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−100</text>
  <text x="200" y="198" font-size="11" fill="#666" filter="url(#r)">本轮得 −1</text>

  <text x="32" y="232" font-size="11" fill="#333" filter="url(#r)">③ Alice 必须拿（只剩 1 堆）</text>
  <g filter="url(#r)">
    <rect x="32" y="240" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="86" y="240" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="140" y="240" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="163" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−100</text>
  <text x="200" y="260" font-size="11" fill="#666" filter="url(#r)">被迫吞 −100</text>

  <text x="181" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">终局：Alice −101 : Bob −1</text>
  <text x="181" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">Alice 输 100 分 ✗</text>

  <!-- 右：最优 -->
  <g filter="url(#r)">
    <rect x="354" y="58" width="330" height="318" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="519" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最优（DP）：拿 2 堆（共 −2）</text>

  <text x="370" y="108" font-size="11" fill="#333" filter="url(#r)">① Alice 拿 k=2（吞小负、甩大负）</text>
  <g filter="url(#r)">
    <rect x="370" y="116" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="424" y="116" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="478" y="116" width="46" height="32" rx="4" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="393" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−1</text>
  <text x="447" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−1</text>
  <text x="501" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−100</text>
  <text x="538" y="136" font-size="11" fill="#666" filter="url(#r)">本轮得 −2</text>

  <text x="370" y="170" font-size="11" fill="#333" filter="url(#r)">② Bob 必须拿（只剩 1 堆）</text>
  <g filter="url(#r)">
    <rect x="370" y="178" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="424" y="178" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="478" y="178" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="501" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">−100</text>
  <text x="538" y="198" font-size="11" fill="#666" filter="url(#r)">被迫吞 −100</text>

  <text x="370" y="232" font-size="11" fill="#333" filter="url(#r)">③ 石子全部拿完</text>
  <g filter="url(#r)">
    <rect x="370" y="240" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="424" y="240" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
    <rect x="478" y="240" width="46" height="32" rx="4" fill="none" stroke="#ccc" stroke-width="1.3" stroke-dasharray="4,3"/>
  </g>
  <text x="538" y="260" font-size="11" fill="#666" filter="url(#r)">游戏结束</text>

  <text x="519" y="318" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">终局：Alice −2 : Bob −100</text>
  <text x="519" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">Alice 赢 98 分 ✓</text>

  <!-- 底部要点 -->
  <g filter="url(#r)">
    <rect x="16" y="390" width="668" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="350" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">拿 k 堆的真正收益 = s_k（本轮得分）− f[i+k]（留给对手的局面价值）</text>
  <text x="350" y="444" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">贪心只比较 s_k，就把 −100 留给自己吞；同一局面，贪心与最优相差 198 分</text>
  <text x="350" y="464" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">局部最优 ≠ 全局最优 —— 必须把「对手随后的最优反制」纳入决策（minimax）</text>
</svg>
