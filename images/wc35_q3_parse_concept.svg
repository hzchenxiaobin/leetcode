<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单条目录信息怎么拆：目录 + 若干「文件名(内容)」</text>
  <text x="300" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">用括号而不是空格给内容定界，是解析的关键</text>

  <rect x="60" y="58" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="84" text-anchor="middle" font-size="13.5" fill="#22324a" font-family="'Courier New', monospace" filter="url(#rough2)">root/a 1.txt(abcd) 2.txt(efgh)</text>

  <rect x="60" y="112" width="112" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="116" y="133" text-anchor="middle" font-size="12" fill="#3a5a30" font-family="'Courier New', monospace" filter="url(#rough2)">root/a</text>
  <path d="M 178 128 L 200 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="132" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">目录 dir：第 1 个空格之前的全部字符</text>

  <rect x="60" y="160" width="112" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="116" y="181" text-anchor="middle" font-size="12" fill="#22324a" font-family="'Courier New', monospace" filter="url(#rough2)">1.txt</text>
  <path d="M 178 176 L 200 176" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="180" font-size="11.5" fill="#446688" filter="url(#rough2)">文件名 name：空格之后、'(' 之前的字符</text>

  <rect x="60" y="208" width="112" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="116" y="229" text-anchor="middle" font-size="12" fill="#8a6a20" font-family="'Courier New', monospace" filter="url(#rough2)">abcd</text>
  <path d="M 178 224 L 200 224" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="228" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">内容 content：'(' 之后、')' 之前的字符</text>

  <rect x="60" y="262" width="480" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="284" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">拼路径：dir + '/' + name（dir 末尾没有斜杠，只加一个）</text>
  <text x="76" y="304" font-size="12" fill="#333" font-family="'Courier New', monospace" filter="url(#rough2)">root/a + / + 1.txt  =  root/a/1.txt</text>

  <text x="300" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同一条信息里的多个文件共享同一个目录，dir 只需切一次</text>
</svg>
