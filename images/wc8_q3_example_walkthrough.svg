<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Marker Felt', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="470" fill="#fafafa"/>

  <g filter="url(#rough2)"><text x="310" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：两个方向的可达集合取交集</text></g>
  <g filter="url(#rough2)"><text x="310" y="48" text-anchor="middle" font-size="11.5" fill="#777">格内数字为高度；蓝 = 只流入太平洋，绿 = 只流入大西洋，橙 = 两者皆可</text></g>

  <path d="M 104 62 L 104 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="124" y="64" font-size="11" fill="#446688">太平洋：从上边界、左边界反向爬升</text></g>
  <path d="M 268 350 L 268 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><text x="52" y="356" font-size="11" fill="#4a7a3a">大西洋：从下边界、右边界反向爬升</text></g>
  <g filter="url(#rough2)"><text x="76.0" y="78" text-anchor="middle" font-size="10" fill="#999">c=0</text></g>
  <g filter="url(#rough2)"><text x="124.0" y="78" text-anchor="middle" font-size="10" fill="#999">c=1</text></g>
  <g filter="url(#rough2)"><text x="172.0" y="78" text-anchor="middle" font-size="10" fill="#999">c=2</text></g>
  <g filter="url(#rough2)"><text x="220.0" y="78" text-anchor="middle" font-size="10" fill="#999">c=3</text></g>
  <g filter="url(#rough2)"><text x="268.0" y="78" text-anchor="middle" font-size="10" fill="#999">c=4</text></g>
  <g filter="url(#rough2)"><text x="42" y="112.0" text-anchor="end" font-size="10" fill="#999">r=0</text></g>
  <g filter="url(#rough2)"><text x="42" y="160.0" text-anchor="end" font-size="10" fill="#999">r=1</text></g>
  <g filter="url(#rough2)"><text x="42" y="208.0" text-anchor="end" font-size="10" fill="#999">r=2</text></g>
  <g filter="url(#rough2)"><text x="42" y="256.0" text-anchor="end" font-size="10" fill="#999">r=3</text></g>
  <g filter="url(#rough2)"><text x="42" y="304.0" text-anchor="end" font-size="10" fill="#999">r=4</text></g>
  <g filter="url(#rough2)"><rect x="52" y="84" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="76.0" y="114.0" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="100" y="84" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="124.0" y="114.0" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="148" y="84" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="172.0" y="114.0" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="196" y="84" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="220.0" y="114.0" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="244" y="84" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="268.0" y="114.0" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="52" y="132" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="76.0" y="162.0" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="100" y="132" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="124.0" y="162.0" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="148" y="132" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="172.0" y="162.0" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="196" y="132" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="220.0" y="162.0" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <g filter="url(#rough2)"><rect x="244" y="132" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="268.0" y="162.0" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <g filter="url(#rough2)"><rect x="52" y="180" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="76.0" y="210.0" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="100" y="180" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="124.0" y="210.0" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <g filter="url(#rough2)"><rect x="148" y="180" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="172.0" y="210.0" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="196" y="180" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="220.0" y="210.0" text-anchor="middle" font-size="15" fill="#333">3</text></g>
  <g filter="url(#rough2)"><rect x="244" y="180" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="268.0" y="210.0" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="52" y="228" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="76.0" y="258.0" text-anchor="middle" font-size="15" fill="#333">6</text></g>
  <g filter="url(#rough2)"><rect x="100" y="228" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="124.0" y="258.0" text-anchor="middle" font-size="15" fill="#333">7</text></g>
  <g filter="url(#rough2)"><rect x="148" y="228" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="172.0" y="258.0" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="196" y="228" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="220.0" y="258.0" text-anchor="middle" font-size="15" fill="#333">4</text></g>
  <g filter="url(#rough2)"><rect x="244" y="228" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="268.0" y="258.0" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="52" y="276" width="48" height="48" rx="4" fill="#ffe0b2" stroke="#d6a040" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><text x="76.0" y="306.0" text-anchor="middle" font-size="15" fill="#333">5</text></g>
  <g filter="url(#rough2)"><rect x="100" y="276" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="124.0" y="306.0" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="148" y="276" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="172.0" y="306.0" text-anchor="middle" font-size="15" fill="#333">1</text></g>
  <g filter="url(#rough2)"><rect x="196" y="276" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="220.0" y="306.0" text-anchor="middle" font-size="15" fill="#333">2</text></g>
  <g filter="url(#rough2)"><rect x="244" y="276" width="48" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><text x="268.0" y="306.0" text-anchor="middle" font-size="15" fill="#333">4</text></g>

  <g filter="url(#rough2)"><rect x="330" y="92" width="262" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><text x="346" y="113" font-size="11.5" font-weight="bold" fill="#2b4a6e">seenP：16 个格子（蓝 / 橙）</text></g>
  <g filter="url(#rough2)"><text x="346" y="133" font-size="10.5" fill="#3a5a80">第 0 行 + 第 0 列共 9 格天生可达；</text></g>
  <g filter="url(#rough2)"><text x="346" y="152" font-size="10.5" fill="#3a5a80">再向高处爬：(1,1)…(1,4)、(2,1)(2,2)、(3,1)</text></g>

  <g filter="url(#rough2)"><rect x="330" y="190" width="262" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><text x="346" y="211" font-size="11.5" font-weight="bold" fill="#2e5e22">seenA：16 个格子（绿 / 橙）</text></g>
  <g filter="url(#rough2)"><text x="346" y="231" font-size="10.5" fill="#3a5a30">第 4 行 + 第 4 列共 9 格天生可达；</text></g>
  <g filter="url(#rough2)"><text x="346" y="248" font-size="10.5" fill="#3a5a30">再向上爬出 (3,0)…(3,3)，由 (2,4)=1</text></g>
  <g filter="url(#rough2)"><text x="346" y="264" font-size="10.5" fill="#3a5a30">拉出 (2,3)、(2,2)=5，最后到 (1,3)</text></g>

  <g filter="url(#rough2)"><rect x="330" y="288" width="262" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#rough2)"><text x="346" y="309" font-size="11.5" font-weight="bold" fill="#8a6a20">交集 = 答案（7 个格子）</text></g>
  <g filter="url(#rough2)"><text x="346" y="329" font-size="10.5" fill="#555">[0,4] [1,3] [1,4] [2,2]</text></g>
  <g filter="url(#rough2)"><text x="346" y="347" font-size="10.5" fill="#555">[3,0] [3,1] [4,0]</text></g>
  <g filter="url(#rough2)"><text x="346" y="369" font-size="10.5" fill="#b85450">16 + 16 - 7 = 25：每个格子至少流向一个海</text></g>

  <g filter="url(#rough2)"><rect x="52" y="392" width="540" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><text x="68" y="413" font-size="11" fill="#8a3a36">为什么 (4,1)=1 不是答案：它贴着底边，水直接进大西洋；但 (4,0)=5、(3,1)=7</text></g>
  <g filter="url(#rough2)"><text x="68" y="432" font-size="11" fill="#8a3a36">都比它高，能去的只有 (4,2)=1 所在的洼地，那块洼地既不挨上边界也不挨左边界。</text></g>

</svg>
