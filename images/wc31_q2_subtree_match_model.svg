<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">子树匹配 = 外层枚举候选根 × 内层同构判定</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">isSubtree(u,t) = same(u,t) ∨ isSubtree(u.left,t) ∨ isSubtree(u.right,t)</text>

  <text x="170" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">root</text>

  <path d="M 170 96 L 124 146" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 170 96 L 216 146" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 120 168 L 99 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 120 168 L 141 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="90" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="95" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">3</text>
  <circle cx="120" cy="155" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">4</text>
  <circle cx="220" cy="155" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">5</text>
  <circle cx="95" cy="215" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="220" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <circle cx="145" cy="215" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="220" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>

  <ellipse cx="120" cy="158" rx="56" ry="92" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 306 155 L 352 155" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="329" y="145" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同构？</text>

  <text x="450" y="86" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">subRoot（模式）</text>

  <path d="M 450 106 L 412 156" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 106 L 488 156" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="450" cy="100" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="105" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4</text>
  <circle cx="405" cy="168" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="173" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <circle cx="495" cy="168" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="173" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>

  <rect x="40" y="252" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两层结构</text>
  <text x="56" y="290" font-size="10" fill="#555" filter="url(#rough2)">外层：先序遍历 root 的 n 个节点，把每个节点当作「候选根」（O(n) 次）</text>
  <text x="56" y="302" font-size="10" fill="#555" filter="url(#rough2)">内层：same(u, subRoot) 同时比对结构与值，命中即返回，全程不修改树</text>

  <rect x="120" y="322" width="340" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">最坏复杂度：n × m = 2000 × 1000 = 2×10⁶</text>
  <text x="290" y="360" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">值不同时 same() 第一层就返回，实际远快于上界</text>
</svg>
