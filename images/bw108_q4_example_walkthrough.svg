<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2：m=n=3，黑格 (0,0)、(1,1)、(0,2)</text>

  <!-- 网格 3×3，格 60px -->
  <g filter="url(#rough2)">
    <!-- 四个块的半透明底色 -->
    <rect x="150" y="70" width="120" height="120" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="270" y="70" width="120" height="120" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="150" y="190" width="120" height="120" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="270" y="190" width="120" height="120" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <!-- 网格线 -->
    <g stroke="#bbb" stroke-width="1.4">
      <path d="M 210 70 L 210 310 M 270 70 L 270 310 M 330 70 L 330 310"/>
      <path d="M 150 130 L 390 130 M 150 190 L 390 190 M 150 250 L 390 250"/>
    </g>
    <!-- 黑格 -->
    <rect x="152" y="72" width="56" height="56" fill="#333" stroke="#111" stroke-width="1.6"/>
    <rect x="272" y="192" width="56" height="56" fill="#333" stroke="#111" stroke-width="1.6"/>
    <rect x="332" y="72" width="56" height="56" fill="#333" stroke="#111" stroke-width="1.6"/>
    <!-- 块标签 -->
    <text x="190" y="64" text-anchor="middle" font-size="12" fill="#b85450">块 (0,0)：2 个黑格</text>
    <text x="330" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a">块 (0,1)：2 个黑格</text>
    <text x="140" y="252" text-anchor="middle" font-size="12" fill="#d6a040" transform="rotate(-90 140 252)">块 (1,0)：1</text>
    <text x="410" y="252" text-anchor="middle" font-size="12" fill="#446688" transform="rotate(90 410 252)">块 (1,1)：1</text>
    <!-- 坐标轴 -->
    <text x="180" y="106" text-anchor="middle" font-size="10.5" fill="#fff">(0,0)</text>
    <text x="300" y="226" text-anchor="middle" font-size="10.5" fill="#fff">(1,1)</text>
    <text x="360" y="106" text-anchor="middle" font-size="10.5" fill="#fff">(0,2)</text>
  </g>

  <!-- 右侧：计数与答案 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="510" y="86" text-anchor="middle" font-size="13" fill="#446688">cnt 哈希表</text>
    <rect x="430" y="96" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="510" y="116" text-anchor="middle">(0,0) → 2　[(0,0) + (1,1)]</text>
    <rect x="430" y="130" width="160" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="510" y="150" text-anchor="middle">(0,1) → 2　[(1,1) + (0,2)]</text>
    <rect x="430" y="164" width="160" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="510" y="184" text-anchor="middle">(1,0) → 1　[(1,1)]</text>
    <rect x="430" y="198" width="160" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="510" y="218" text-anchor="middle">(1,1) → 1　[(1,1)]</text>

    <text x="510" y="256" text-anchor="middle" font-size="12.5" fill="#555">黑格 (0,2) 贴右边界：</text>
    <text x="510" y="274" text-anchor="middle" font-size="12.5" fill="#555">候选 (0,2) 因 by ≥ n−1 被裁掉</text>

    <rect x="420" y="292" width="180" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="510" y="314" text-anchor="middle" font-size="13">arr[0] = 4 − 4 = 0</text>
    <text x="510" y="336" text-anchor="middle" font-size="13.5" fill="#b85450">arr = [0, 2, 2, 0, 0]</text>
  </g>

  <text x="210" y="344" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">被四个块的底色圈出的就是全部合法块：3×3 网格共 (3−1)×(3−1) = 4 个</text>
</svg>
