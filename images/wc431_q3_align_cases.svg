<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：最优窗口总能贴住某个区间端点</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">f(x) = 坐标 x 的袋子里硬币数；窗口 = 连续 k 个坐标 [s, s+k−1]</text>

  <!-- ===== 数轴 1：未对齐的悬空窗口 ===== -->
  <text x="60" y="74" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 悬空的窗口 —— 一定能平移到不劣且对齐</text>

  <!-- 数轴 -->
  <path d="M 55 128 L 585 128" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- 区间条 A [1,3] c=3 -->
  <g filter="url(#rough2)"><rect x="88" y="112" width="88" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="132" y="124.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">c=3</text>
  <text x="88" y="146" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">l₁</text>
  <text x="176" y="146" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">r₁</text>
  <!-- 区间条 B [6,8] c=5 -->
  <g filter="url(#rough2)"><rect x="290" y="112" width="88" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="334" y="124.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">c=5</text>
  <text x="290" y="146" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">l₂</text>
  <text x="378" y="146" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">r₂</text>
  <!-- 区间条 C [12,14] c=2 -->
  <g filter="url(#rough2)"><rect x="479" y="112" width="66" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="512" y="124.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">c=2</text>
  <text x="479" y="146" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">l₃</text>
  <text x="545" y="146" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">r₃</text>

  <!-- 悬空窗口 [4,7]：左端 4 在 A 内部、右端 7 在 B 内部 -->
  <g filter="url(#rough2)"><rect x="176" y="100" width="114" height="40" rx="5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/></g>
  <text x="176" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">s</text>
  <text x="290" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">t</text>

  <!-- 平移箭头 -->
  <path d="M 233 170 C 260 196 330 196 360 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="297" y="204" text-anchor="middle" font-size="10" fill="#2c5f2c" filter="url(#rough2)">右移一步：+f(t+1) − f(s)</text>
  <path d="M 233 170 C 210 192 150 192 126 172" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="170" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">左移一步：+f(s−1) − f(t)</text>

  <!-- 三情形说明 -->
  <g filter="url(#rough2)"><rect x="55" y="216" width="530" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="70" y="236" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">s 在间隙：右移 Δ = f(t+1) ≥ 0，不劣；Δ = 0 时右端还能变大</text>
  <text x="70" y="252" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">t 在间隙、s 在区间内：左移 Δ = c_a &gt; 0，严格变优 ✗</text>
  <text x="70" y="268" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">s、t 都在区间内：c_a ≠ c_b 时向小的一侧平移变优 ✗；相等则右移不变，右端变大 ✗</text>

  <!-- ===== 数轴 2：对齐后的 O(n) 个候选 ===== -->
  <text x="60" y="312" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 贴住端点 —— 候选从无穷多个降到 2n 个</text>

  <path d="M 55 366 L 585 366" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="88" y="350" width="88" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="290" y="350" width="88" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="479" y="350" width="66" height="16" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>

  <!-- 绿框：左端贴 l₂ -->
  <g filter="url(#rough2)"><rect x="290" y="338" width="114" height="40" rx="5" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="347" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">左端贴 l₂：[l₂, l₂+k−1]</text>

  <!-- 橙框：右端贴 r₃ -->
  <g filter="url(#rough2)"><rect x="479" y="386" width="66" height="30" rx="5" fill="#fff8e1" fill-opacity="0.65" stroke="#d6a040" stroke-width="2"/></g>
  <path d="M 512 386 L 512 372" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <text x="512" y="404" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">右端贴 r₃：[r₃−k+1, r₃]</text>

  <!-- ===== 结论框 ===== -->
  <g filter="url(#rough2)"><rect x="55" y="430" width="530" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="445" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">只需枚举 2n 个候选：[rᵢ−k+1, rᵢ] 与 [lᵢ, lᵢ+k−1]</text>
  <text x="320" y="461" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">n ≤ 10⁵ —— 坐标域 10⁹ 上的无穷窗口被压成 O(n) 个关键位置</text>
</svg>
