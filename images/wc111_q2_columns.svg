<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="320" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">按列检查：相邻两行必须非严格递增</text>
  <text x="147.0" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">列 0</text>
  <text x="201.0" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">列 1</text>
  <text x="255.0" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">列 2</text>
  <text x="98" y="96" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行0</text>
  <rect x="120" y="66" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147.0" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="174" y="66" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201.0" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="228" y="66" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255.0" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="98" y="142" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行1</text>
  <rect x="120" y="112" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147.0" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="174" y="112" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201.0" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="228" y="112" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255.0" y="142" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="98" y="188" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行2</text>
  <rect x="120" y="158" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147.0" y="188" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">g</text>
  <rect x="174" y="158" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201.0" y="188" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <rect x="228" y="158" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255.0" y="188" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">列 0: c<d<g ✓     列 1: b<a ✗     列 2: a<f<i ✓</text>
  <rect x="120" y="240" width="104" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">列 1 删除</text>
  <text x="172" y="284" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">b → a 下降</text>
  <rect x="240" y="240" width="160" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只需相邻行比较</text>
  <text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">不需要全序判断</text>
  <text x="470" y="268" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 3</text>
</svg>
