<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：[[6,2],[4,4],[2,6]] 排序后为 (2,6) (4,4) (6,2)</text>

  <rect x="20" y="38" width="520" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="112" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="188" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="248" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="344" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">y_j ≤ y_i 且 y_j &gt; mx ?</text>
  <text x="452" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">mx</text>
  <text x="514" y="57" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <g filter="url(#rough2)">
    <rect x="20" y="66" width="520" height="28" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="94" width="520" height="28" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="122" width="520" height="28" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="20" y="150" width="520" height="28" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
  </g>

  <g font-size="10.3" fill="#333" filter="url(#rough2)">
    <text x="52" y="84" text-anchor="middle">0</text><text x="112" y="84" text-anchor="middle">(2,6)</text>
    <text x="188" y="84" text-anchor="middle">1</text><text x="248" y="84" text-anchor="middle">(4,4)</text>
    <text x="344" y="84" text-anchor="middle">4 ≤ 6 ✓，4 &gt; −∞ ✓</text>
    <text x="452" y="84" text-anchor="middle">−∞ → 4</text><text x="514" y="84" text-anchor="middle" fill="#4a7a3a">1</text>

    <text x="52" y="112" text-anchor="middle">0</text><text x="112" y="112" text-anchor="middle">(2,6)</text>
    <text x="188" y="112" text-anchor="middle">2</text><text x="248" y="112" text-anchor="middle">(6,2)</text>
    <text x="344" y="112" text-anchor="middle">2 ≤ 6 ✓，2 &gt; 4 ✗</text>
    <text x="452" y="112" text-anchor="middle">4</text><text x="514" y="112" text-anchor="middle" fill="#4a7a3a">1</text>

    <text x="52" y="140" text-anchor="middle">1</text><text x="112" y="140" text-anchor="middle">(4,4)</text>
    <text x="188" y="140" text-anchor="middle">2</text><text x="248" y="140" text-anchor="middle">(6,2)</text>
    <text x="344" y="140" text-anchor="middle">2 ≤ 4 ✓，2 &gt; −∞ ✓</text>
    <text x="452" y="140" text-anchor="middle">−∞ → 2</text><text x="514" y="140" text-anchor="middle" fill="#4a7a3a">2</text>

    <text x="52" y="168" text-anchor="middle">2</text><text x="112" y="168" text-anchor="middle">(6,2)</text>
    <text x="188" y="168" text-anchor="middle">—</text><text x="248" y="168" text-anchor="middle">后面没人了</text>
    <text x="344" y="168" text-anchor="middle">循环不进入</text>
    <text x="452" y="168" text-anchor="middle">—</text><text x="514" y="168" text-anchor="middle" fill="#4a7a3a">2</text>
  </g>

  <text x="280" y="226" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i = 0 时 (6,2) 被 (4,4) 挡住（4 &gt; 2），所以 (2,6)→(6,2) 这对不计；最终答案 2</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两对合法答案分别是 (2,6)→(4,4) 与 (4,4)→(6,2)，都沿对角线排开</text>

  <rect x="40" y="264" width="480" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">每确定一个 A，mx 都重置为 −∞：不同 A 的「最高纪录」互不影响</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">三重循环里的第三层被 mx 这一趟扫描吸收了</text>
</svg>
