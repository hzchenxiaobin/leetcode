<svg xmlns="http://www.w3.org/2000/svg" width="640" height="432" viewBox="0 0 640 432" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="432" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">一趟扫描：每个字符只和栈顶比一次</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <rect x="56" y="54" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="116" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">开始（栈空）</text>
  <path d="M 176 69 H 230" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- read next char -->
  <rect x="234" y="54" width="172" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">读下一个字符 c</text>
  <path d="M 320 90 V 154" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- diamond -->
  <polygon points="320,158 474,214 320,270 166,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="208" text-anchor="middle" font-size="11.5" fill="#8a3a3a" filter="url(#sk)">栈非空 且</text>
  <text x="320" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">栈顶+c 是 AB / CD？</text>

  <!-- yes branch -->
  <text x="484" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 474 214 H 496" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <rect x="500" y="186" width="126" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="563" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">弹出栈顶</text>
  <text x="563" y="228" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">这对一起消失，</text>
  <text x="563" y="241" text-anchor="middle" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">c 不入栈</text>
  <path d="M 563 184 V 44 H 320 V 50" stroke="#b85450" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="444" y="38" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">↻ 还有字符就继续</text>

  <!-- no branch -->
  <text x="154" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">否</text>
  <path d="M 166 214 H 146" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="16" y="186" width="126" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="79" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">c 入栈</text>
  <text x="79" y="228" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">先存着，</text>
  <text x="79" y="241" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">等右半来配</text>
  <path d="M 79 184 V 106 H 290 V 92" stroke="#446688" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="170" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">↻ 下一个字符</text>

  <!-- exit when exhausted -->
  <rect x="196" y="352" width="248" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="320" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">扫描结束：返回 len(栈)</text>
  <text x="320" y="394" text-anchor="middle" font-size="10.5" fill="#4a6a3a" filter="url(#sk)">栈里剩的就是删不动的终态串</text>
  <path d="M 563 248 V 316 H 420 V 346" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6,5" marker-end="url(#arrG)" filter="url(#sk)"/>
  <path d="M 79 248 V 316 H 220 V 346" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6,5" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="320" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">字符取尽 → 两支在这里汇合</text>

  <!-- invariant caption -->
  <text x="320" y="422" text-anchor="middle" font-size="11.5" fill="#4a6a3a" filter="url(#sk)">不变式：任何时刻栈内都没有相邻可删对 —— 新字符只可能与栈顶成对，一趟扫描即终态</text>
</svg>
