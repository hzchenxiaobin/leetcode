<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">气泡视角：1 向左上浮穿 0，串行排队与并行穿行</text>

  <!-- 串 s = 0 1 1 0 1 0 1  标出每个 1 左侧的 0 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="100" y="48" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="144" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="188" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="232" y="48" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="320" y="48" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="364" y="48" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="122" y="70" fill="#1a2b45">0</text>
    <text x="166" y="70" fill="#1d3a17" font-weight="bold">1</text>
    <text x="210" y="70" fill="#1d3a17" font-weight="bold">1</text>
    <text x="254" y="70" fill="#1a2b45">0</text>
    <text x="298" y="70" fill="#1d3a17" font-weight="bold">1</text>
    <text x="342" y="70" fill="#1a2b45">0</text>
    <text x="386" y="70" fill="#1d3a17" font-weight="bold">1</text>
  </g>
  <!-- 每个 1 的 z 标注 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle">
    <text x="166" y="100">z=1</text>
    <text x="210" y="100">z=1</text>
    <text x="298" y="100">z=2</text>
    <text x="386" y="100">z=3</text>
  </g>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z = 该 1 左侧 0 的个数：它必须逐个穿过这些 0</text>

  <!-- 递推公式 -->
  <g filter="url(#rough2)">
    <rect x="95" y="140" width="370" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="162" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">f(第 i 个 1) = max( f(前一个 1) + 1 , z )</text>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">阻塞项：等前车挪窝才轮到我 | 独立项：自己要穿 z 个 0</text>

  <!-- 两项含义分列 -->
  <!-- 左：排队（单车道跟车） -->
  <g filter="url(#rough2)">
    <rect x="40" y="216" width="235" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="157" y="240" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">阻塞项 f(prev)+1（单车道跟车）</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <circle cx="110" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="145" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="180" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="110" y="277">1</text>
    <text x="145" y="277">1</text>
    <text x="180" y="277">1</text>
    <rect x="206" y="258" width="18" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="215" y="278" font-size="12">0</text>
  </g>
  <path d="M 96 272 L 62 272" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三个 1 排成一列依次穿同两个 0</text>
  <text x="157" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个 1 要等前一个穿完那个 0</text>

  <!-- 右：并行穿行 -->
  <g filter="url(#rough2)">
    <rect x="295" y="216" width="235" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <text x="412" y="240" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">独立项 z（自己的行程）</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="330" y="258" width="18" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="352" y="258" width="18" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <circle cx="404" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="404" y="277">1</text>
    <text x="339" y="278" font-size="12">0</text>
    <text x="361" y="278" font-size="12">0</text>
  </g>
  <path d="M 390 272 L 316 272" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="412" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">等待前车的每一秒里，</text>
  <text x="412" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本车可同步穿自己原生的 0</text>

  <!-- 底部：max 语义 -->
  <g filter="url(#rough2)">
    <rect x="70" y="360" width="420" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="384" text-anchor="middle" font-size="13.5" fill="#1a2b45" filter="url(#rough2)">两条时间线并行 → 取 max 而非求和（00111 答案是 4 不是 5）</text>
</svg>
