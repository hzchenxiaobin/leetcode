<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：数点、数边、比对公式</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">n = 6, edges = [[0,1],[0,2],[1,2],[3,4],[3,5]]</text>

  <!-- 左上：完全分量 {0,1,2} -->
  <text x="95" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">分量 {0,1,2}（根 0）</text>
  <line x1="95" y1="92" x2="57" y2="160" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="95" y1="92" x2="133" y2="160" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="57" y1="160" x2="133" y2="160" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="95" cy="92" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="57" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="57" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="133" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="133" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="95" y="198" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">v = 3，e = 3（3 条边全在此分量）</text>
  <text x="95" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">3 = 3×2/2 → 完全 ✓</text>

  <!-- 左下：非完全分量 {3,4,5} -->
  <text x="95" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">分量 {3,4,5}（根 3）</text>
  <line x1="95" y1="274" x2="57" y2="342" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="95" y1="274" x2="133" y2="342" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="57" y1="342" x2="133" y2="342" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="95" y="334" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缺失</text>
  <circle cx="95" cy="274" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="57" cy="342" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="57" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="133" cy="342" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="133" y="347" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="95" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">v = 3，e = 2 &lt; 3 ✗ 不完全</text>

  <!-- 右：判定表 -->
  <rect x="180" y="62" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">分量</text>
  <rect x="270" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">v</text>
  <rect x="310" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">e</text>
  <rect x="350" y="62" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="82" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v(v−1)/2</text>
  <rect x="426" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="461" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">完全?</text>

  <rect x="180" y="92" width="90" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0,1,2}</text>
  <rect x="270" y="92" width="40" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="92" width="40" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="350" y="92" width="76" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="426" y="92" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="461" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">✓</text>

  <rect x="180" y="128" width="90" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3,4,5}</text>
  <rect x="270" y="128" width="40" height="36" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="310" y="128" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2</text>
  <rect x="350" y="128" width="76" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="426" y="128" width="70" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="461" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗</text>

  <!-- 答案框 -->
  <rect x="180" y="178" width="316" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="338" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 = 1</text>
  <text x="338" y="220" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">只有 {0,1,2} 通过判定，{3,4,5} 缺 4–5 被拒</text>

  <!-- 按根统计说明 -->
  <rect x="180" y="240" width="316" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="338" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">按根统计</text>
  <text x="338" y="282" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">vcnt[根0] = 3，ecnt[根0] = 3（3 条边归它）</text>
  <text x="338" y="300" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">vcnt[根3] = 3，ecnt[根3] = 2（2 条边归它）</text>
  <text x="338" y="318" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">根 0：3 = 3×2/2 ✓ 根 3：2 ≠ 3 ✗</text>
</svg>
