<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="396" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "(*))" 的区间走查</text>
  <text x="350" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一行都是一次「更新两端 + 检查右端有没有被击穿」，走完只需判断 lo</text>

  <g filter="url(#rough2)">
    <rect x="36" y="58" width="628" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="66" y="76" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">步骤</text>
    <text x="121" y="76" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">字符</text>
    <text x="156" y="76" font-size="11" fill="#33507a" font-weight="bold">区间更新</text>
    <text x="461" y="76" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">lo</text>
    <text x="511" y="76" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold">hi</text>
    <text x="552" y="76" font-size="11" fill="#33507a" font-weight="bold">说明</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="84" width="628" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="3"/>
    <rect x="36" y="114" width="628" height="30" fill="#f7fbff" stroke="#cfcfcf" stroke-width="1.2" rx="3"/>
    <rect x="36" y="144" width="628" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="3"/>
    <rect x="36" y="174" width="628" height="30" fill="#f7fbff" stroke="#cfcfcf" stroke-width="1.2" rx="3"/>
    <rect x="36" y="204" width="628" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="3"/>

    <path d="M 96 58 L 96 234" stroke="#e0e0e0" stroke-width="1"/>
    <path d="M 146 58 L 146 234" stroke="#e0e0e0" stroke-width="1"/>
    <path d="M 436 58 L 436 234" stroke="#e0e0e0" stroke-width="1"/>
    <path d="M 486 58 L 486 234" stroke="#e0e0e0" stroke-width="1"/>
    <path d="M 536 58 L 536 234" stroke="#e0e0e0" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="66" y="103" text-anchor="middle">初始</text>
    <text x="121" y="103" text-anchor="middle" fill="#999">—</text>
    <text x="156" y="103">lo = hi = 0</text>
    <text x="461" y="103" text-anchor="middle" font-weight="bold" fill="#33507a">0</text>
    <text x="511" y="103" text-anchor="middle" font-weight="bold" fill="#33507a">0</text>
    <text x="552" y="103" font-size="9.5" fill="#777">空串只有余额 0</text>

    <text x="66" y="133" text-anchor="middle">i = 0</text>
    <text x="121" y="133" text-anchor="middle" font-weight="bold" fill="#33507a">(</text>
    <text x="156" y="133">lo+1，hi+1</text>
    <text x="461" y="133" text-anchor="middle" font-weight="bold" fill="#33507a">1</text>
    <text x="511" y="133" text-anchor="middle" font-weight="bold" fill="#33507a">1</text>
    <text x="552" y="133" font-size="9.5" fill="#777">区间整体右移</text>

    <text x="66" y="163" text-anchor="middle">i = 1</text>
    <text x="121" y="163" text-anchor="middle" font-weight="bold" fill="#8a6a20">*</text>
    <text x="156" y="163">lo=max(lo−1,0)，hi+1</text>
    <text x="461" y="163" text-anchor="middle" font-weight="bold" fill="#8a6a20">0</text>
    <text x="511" y="163" text-anchor="middle" font-weight="bold" fill="#8a6a20">2</text>
    <text x="552" y="163" font-size="9.5" fill="#777">向两侧各撑一格</text>

    <text x="66" y="193" text-anchor="middle">i = 2</text>
    <text x="121" y="193" text-anchor="middle" font-weight="bold" fill="#3a5a30">)</text>
    <text x="156" y="193">lo=max(lo−1,0)，hi−1</text>
    <text x="461" y="193" text-anchor="middle" font-weight="bold" fill="#3a5a30">0</text>
    <text x="511" y="193" text-anchor="middle" font-weight="bold" fill="#3a5a30">1</text>
    <text x="552" y="193" font-size="9.5" fill="#777">hi 降，lo 夹回 0</text>

    <text x="66" y="223" text-anchor="middle">i = 3</text>
    <text x="121" y="223" text-anchor="middle" font-weight="bold" fill="#3a5a30">)</text>
    <text x="156" y="223">lo=max(lo−1,0)，hi−1</text>
    <text x="461" y="223" text-anchor="middle" font-weight="bold" fill="#3a5a30">0</text>
    <text x="511" y="223" text-anchor="middle" font-weight="bold" fill="#3a5a30">0</text>
    <text x="552" y="223" font-size="9.5" fill="#777">hi 归 0，恰好收平</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="238" width="628" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="66" y="259" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">结束</text>
    <text x="156" y="259" font-size="10.5" fill="#3a5a30">lo == 0 ⇒ 0 ∈ [lo, hi]</text>
    <text x="461" y="259" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">0</text>
    <text x="511" y="259" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">0</text>
    <text x="552" y="259" font-size="10" fill="#3a5a30" font-weight="bold">返回 true</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="282" width="628" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="50" y="302" font-size="10.5" fill="#8a6a20" font-weight="bold">得到 true 的那一种解释（区间里存在 0，就一定能凑出一种）</text>
    <text x="50" y="324" font-size="10" fill="#555">把上图 i = 1 的 * 当作 '('，s 变成 "(() )" 即 "(())"：前缀余额 1, 2, 1, 0，全程 ≥ 0 且结尾归零。</text>
    <text x="50" y="348" font-size="10" fill="#b85450">反例 A：s = ")" → 第一步 hi = −1 &lt; 0，立刻 false（连「把所有 * 都当 (」也救不回来）。</text>
    <text x="50" y="372" font-size="10" fill="#b85450">反例 B：s = "*(" → 结束时 lo = 1 &gt; 0，余额永远回不到 0，返回 false（hi 全程没被击穿）。</text>
  </g>
</svg>
