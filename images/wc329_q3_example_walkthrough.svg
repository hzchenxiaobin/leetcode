<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：1010 经「全 1」枢纽中转到 0110</text>
  <path d="M 140 44 Q 340 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="30" y="72" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 扩散：拿 1 去感染 0，铺满全串</text>
  <text x="480" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07a15">全 1 · 枢纽</text>

  <!-- row 1 : state A 1010 -->
  <g filter="url(#sk)">
    <rect x="30" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="62" y="84" width="28" height="36" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="94" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="126" y="84" width="28" height="36" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="44" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="76" y="108" text-anchor="middle" font-size="15" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="108" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="140" y="108" text-anchor="middle" font-size="15" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="92" y="136" text-anchor="middle" font-size="10.5" fill="#777">起点 s</text>

  <g filter="url(#sk)">
    <path d="M 162 102 L 216 102" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="189" y="92" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">op(0,1)</text>
  <text x="189" y="119" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#888">(1,0)→(1,1)</text>

  <!-- row 1 : state B 1110 (bit1 infected) -->
  <g filter="url(#sk)">
    <rect x="224" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="256" y="84" width="28" height="36" rx="4" fill="#ffe9c8" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="288" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="84" width="28" height="36" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="238" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="270" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">1</text>
  <text x="302" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="334" y="108" text-anchor="middle" font-size="15" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="286" y="136" text-anchor="middle" font-size="10.5" fill="#777">位 1 被感染</text>

  <g filter="url(#sk)">
    <path d="M 356 102 L 410 102" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="383" y="92" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">op(0,3)</text>
  <text x="383" y="119" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#888">(1,0)→(1,1)</text>

  <!-- row 1 : state C 1111 (bit3 infected, hub) -->
  <g filter="url(#sk)">
    <rect x="418" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="450" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="482" y="84" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="514" y="84" width="28" height="36" rx="4" fill="#ffe9c8" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="432" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="464" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="496" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="528" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07a15" font-family="monospace">1</text>
  <text x="480" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07a15">到达枢纽</text>

  <text x="30" y="178" font-size="12.5" font-weight="bold" fill="#2e6e2e">② 收缩：保住一个 1，把多余的 1 逐位删 0</text>
  <text x="480" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">达成 target</text>

  <!-- row 2 : state C' 1111 (hub) -->
  <g filter="url(#sk)">
    <rect x="30" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="62" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="94" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="126" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="44" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="76" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="108" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="140" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="92" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07a15">枢纽</text>

  <g filter="url(#sk)">
    <path d="M 162 208 L 216 208" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="189" y="198" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">op(1,0)</text>
  <text x="189" y="225" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#888">(1,1)→(1,0)</text>

  <!-- row 2 : state D 0111 (bit0 killed) -->
  <g filter="url(#sk)">
    <rect x="224" y="190" width="28" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="256" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="288" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="238" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" font-family="monospace">0</text>
  <text x="270" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="302" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="334" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="286" y="242" text-anchor="middle" font-size="10.5" fill="#777">删掉位 0</text>

  <g filter="url(#sk)">
    <path d="M 356 208 L 410 208" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="383" y="198" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">op(1,3)</text>
  <text x="383" y="225" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#888">(1,1)→(1,0)</text>

  <!-- row 2 : state E 0110 (target) -->
  <g filter="url(#sk)">
    <rect x="412" y="184" width="136" height="48" rx="8" fill="#f3faf4" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="418" y="190" width="28" height="36" rx="4" fill="#ffffff" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="450" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="482" y="190" width="28" height="36" rx="4" fill="#dcedfb" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="514" y="190" width="28" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="432" y="214" text-anchor="middle" font-size="15" fill="#9aa4ae" font-family="monospace">0</text>
  <text x="464" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="496" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="528" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" font-family="monospace">0</text>
  <text x="480" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">target 达成</text>

  <!-- bottom left: counterexample -->
  <g filter="url(#sk)">
    <rect x="40" y="268" width="294" height="112" rx="8" fill="#fdf2f4" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="60" y="292" font-size="12" font-weight="bold" fill="#b85450">反例印证（示例 2）</text>
  <text x="60" y="318" font-size="12" font-family="monospace" fill="#555">s = 11 → target = 00</text>
  <text x="60" y="340" font-size="10.5" fill="#666">收缩最多把 1 的个数降到 1，</text>
  <text x="60" y="358" font-size="10.5" fill="#666">永远清不到 0</text>
  <text x="60" y="376" font-size="11" font-weight="bold" fill="#b85450">⇒ 返回 false</text>

  <!-- bottom right: edge cases -->
  <g filter="url(#sk)">
    <rect x="350" y="268" width="290" height="112" rx="8" fill="#f2f7f4" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="370" y="292" font-size="12" font-weight="bold" fill="#2e6e2e">边界一瞥</text>
  <text x="370" y="318" font-size="10.5" fill="#555">00 无法变成 01（造不出 1）</text>
  <text x="370" y="340" font-size="10.5" fill="#555">10 → 11 → 01（n = 2 也能换位）</text>
  <text x="370" y="362" font-size="10.5" fill="#555">00 → 00（0 次操作也算相等）</text>
</svg>
