<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="600" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：逐行更新高度 → 降序排序 → 扫描取最大</text>

  <!-- init -->
  <rect x="240" y="40" width="180" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">heights = [0,…,0]，ans = 0</text>
  <path d="M330,76 L330,88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row loop -->
  <rect x="185" y="92" width="290" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="112" text-anchor="middle" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">取下一行 i（以第 i 行为底）</text>
  <text x="330" y="133" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">i = 0, 1, …, m−1</text>
  <path d="M330,140 L330,152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: update heights -->
  <rect x="150" y="156" width="360" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="176" text-anchor="middle" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">① 更新高度（j = 0 … n−1）</text>
  <text x="330" y="197" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">matrix[i][j]=1 → heights[j]+=1；否则 heights[j]=0</text>
  <path d="M330,204 L330,216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: copy + sort -->
  <rect x="150" y="220" width="360" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="240" text-anchor="middle" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">② 拷贝 heights → 降序排序</text>
  <text x="330" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">sorted_h = sort(heights, reverse)</text>
  <path d="M330,264 L330,276" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- warning: no in-place sort -->
  <rect x="524" y="222" width="128" height="64" rx="6" fill="#fcfcfc" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="588" y="242" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">⚠ 不能就地排序</text>
  <text x="588" y="258" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">heights 要保留</text>
  <text x="588" y="274" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">原列序给下一行</text>

  <!-- step 3: scan -->
  <rect x="150" y="280" width="360" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="304" text-anchor="middle" font-size="12.5" fill="#2c4a6e" filter="url(#rough2)">③ 扫描位置 j = 0 … n−1，h = sorted_h[j]</text>
  <path d="M330,320 L330,332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: h == 0 ? -->
  <polygon points="330,334 455,376 330,418 205,376" fill="#fdf1f2" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="381" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">h = 0 ？</text>

  <!-- no: update ans -->
  <path d="M330,418 L330,434" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="341" y="432" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="205" y="438" width="250" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="465" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans = max(ans, h × (j+1))</text>

  <!-- j loop back -->
  <path d="M455,460 L519,460 L519,300 L514,300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="532" y="384" font-size="10.5" fill="#888" filter="url(#rough2)">j+1</text>

  <!-- yes: break -->
  <path d="M205,376 L140,376 L140,522 L203,522" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="368" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是：break</text>
  <text x="168" y="391" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">后面全 0</text>

  <!-- row done -->
  <path d="M330,482 L330,498" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="205" y="502" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="527" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">本行处理完毕</text>

  <!-- next row loop back -->
  <path d="M260,542 L260,560 L110,560 L110,116 L183,116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="556" font-size="10.5" fill="#888" filter="url(#rough2)">下一行 i+1</text>

  <!-- loop exit -->
  <path d="M455,522 L555,522 L555,548" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="514" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i = m：行用完</text>
  <rect x="480" y="552" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="555" y="570" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#rough2)">循环结束</text>
  <text x="555" y="587" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">返回 ans ✓</text>
</svg>
