<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：target = [1, 3]，n = 3</text>
  <text x="330" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">缺的是 2：先 Push 2 再 Pop 掉，然后才能 Push 3</text>

  <g filter="url(#sk)">
    <rect x="40" y="70" width="580" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="40" y="230" width="580" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="40" y="166" width="580" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" opacity="0.7"/>
  </g>

  <g filter="url(#sk)" font-size="12.5" fill="#2b4a6e" font-weight="bold">
    <text x="96" y="91" text-anchor="middle">步骤</text>
    <text x="196" y="91" text-anchor="middle">读入</text>
    <text x="316" y="91" text-anchor="middle">操作</text>
    <text x="404" y="91">栈（底 → 顶）</text>
  </g>

  <g filter="url(#sk)" font-size="12.5" fill="#333">
    <text x="96" y="123" text-anchor="middle">0</text>
    <text x="196" y="123" text-anchor="middle">—</text>
    <text x="316" y="123" text-anchor="middle">—</text>
    <text x="404" y="123">[ ]</text>

    <text x="96" y="155" text-anchor="middle">1</text>
    <text x="196" y="155" text-anchor="middle">1</text>
    <text x="316" y="155" text-anchor="middle">Push</text>
    <text x="404" y="155">[ 1 ]</text>

    <text x="96" y="187" text-anchor="middle">2</text>
    <text x="196" y="187" text-anchor="middle">2</text>
    <text x="316" y="187" text-anchor="middle">Push</text>
    <text x="404" y="187">[ 1, 2 ]</text>

    <text x="96" y="219" text-anchor="middle">3</text>
    <text x="196" y="219" text-anchor="middle">—</text>
    <text x="316" y="219" text-anchor="middle">Pop</text>
    <text x="404" y="219">[ 1 ]</text>

    <text x="96" y="251" text-anchor="middle">4</text>
    <text x="196" y="251" text-anchor="middle">3</text>
    <text x="316" y="251" text-anchor="middle">Push</text>
    <text x="404" y="251" fill="#2e5a24" font-weight="bold">[ 1, 3 ] = target ✓</text>
  </g>

  <g filter="url(#sk)" font-size="10.5" fill="#8f3830">
    <text x="512" y="187">2 不是 target 里的数</text>
    <text x="512" y="219">弹出后栈恢复为 [1]</text>
  </g>
  <path d="M 510 183 L 500 183" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 510 215 L 500 215" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>

  <path d="M 40 262 L 620 262" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="278" width="580" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="40" y="342" width="580" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="58" y="300" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#sk)">target = [2]，n = 3</text>
  <text x="58" y="320" font-size="11.5" fill="#8a6a20" filter="url(#sk)">流程：Push 1（缺 2，先丢弃）→ Pop → Push 2，输出 ["Push", "Pop", "Push"]</text>
  <text x="58" y="364" font-size="12" fill="#2e5a24" font-weight="bold" filter="url(#sk)">target = [1, 2]，n = 4</text>
  <text x="58" y="384" font-size="11.5" fill="#2e5a24" filter="url(#sk)">两次 Push 之后栈已等于 target，立即停止：不读 3、4，输出 ["Push", "Push"]</text>
</svg>
