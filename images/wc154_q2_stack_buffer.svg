<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280.0" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">等价写法：栈里放「字符缓冲区」</text>
  <text x="280.0" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">遇 ( 开一个新帧，遇 ) 把当前帧反转后接回上层帧</text>
  <rect x="26" y="70" width="164" height="228" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="10" filter="url(#rough2)"/>
  <text x="108" y="92" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">读到 love 时</text>
  <text x="46" y="126" font-size="9.5" fill="#777" filter="url(#rough2)">帧 2（内层）</text>
  <rect x="46" y="132" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58.0" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <text x="83.0" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="108.0" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v</text>
  <text x="133.0" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="46" y="206" font-size="9.5" fill="#777" filter="url(#rough2)">帧 1（外层）</text>
  <rect x="46" y="212" width="25" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="58.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <text x="108" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">栈深 2</text>
  <rect x="198" y="70" width="164" height="228" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="10" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">遇到 ) 时</text>
  <text x="210" y="206" font-size="9.5" fill="#777" filter="url(#rough2)">帧 1（外层）</text>
  <rect x="210" y="212" width="125" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="222.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <text x="247.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="272.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v</text>
  <text x="297.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="322.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <text x="280" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">弹出帧 2 → 反转 → 接回</text>
  <rect x="370" y="70" width="164" height="228" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="10" filter="url(#rough2)"/>
  <text x="452" y="92" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">再读 i 与最后的 )</text>
  <text x="382" y="206" font-size="9.5" fill="#777" filter="url(#rough2)">帧 0（结果）</text>
  <rect x="382" y="212" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="394.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <text x="419.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <text x="444.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <text x="469.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v</text>
  <text x="494.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <text x="519.0" y="231" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <text x="452" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">栈空 → 拼接完毕</text>
  <path d="M 190 196 L 208 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362 196 L 380 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="26" y="314" width="508" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="42" y="336" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">这个写法为什么慢一点？</text>
  <text x="42" y="356" font-size="10.5" fill="#6b5a30" filter="url(#rough2)">每层弹出都要整体反转一次，深嵌套时同一批字符被反复搬动，最坏 O(n · 深度)。</text>
  <text x="42" y="376" font-size="10.5" fill="#6b5a30" filter="url(#rough2)">本题 n ≤ 2000 完全够用；若要严格 O(n)，用上一页的「跳跃换向」走查。</text>
</svg>

