<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="219" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="500" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：两种视角逐人核对</text>
  <path d="M 180 36 Q 330 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- view 1 label -->
  <text x="40" y="56" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">视角一：排序 + 两次二分（starts = [1,3,4,9]，ends = [6,7,12,13]）</text>

  <!-- table 1 -->
  <g filter="url(#sk)">
    <rect x="41" y="142" width="578" height="28" fill="#fff8e1"/>
    <rect x="40" y="60" width="580" height="138" rx="4" fill="none" stroke="#446688" stroke-width="1.8"/>
    <rect x="40" y="60" width="580" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="100" y1="60" x2="100" y2="198" stroke="#446688" stroke-width="1"/>
    <line x1="290" y1="60" x2="290" y2="198" stroke="#446688" stroke-width="1"/>
    <line x1="340" y1="60" x2="340" y2="198" stroke="#446688" stroke-width="1"/>
    <line x1="520" y1="60" x2="520" y2="198" stroke="#446688" stroke-width="1"/>
    <line x1="565" y1="60" x2="565" y2="198" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="86" x2="620" y2="86" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="114" x2="620" y2="114" stroke="#446688" stroke-width="1"/>
    <line x1="40" y1="142" x2="620" y2="142" stroke="#d6a040" stroke-width="1.6"/>
    <line x1="40" y1="170" x2="620" y2="170" stroke="#446688" stroke-width="1"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#sk)">
    <text x="70" y="77">人 t</text>
    <text x="195" y="77">starts 中 ≤ t</text>
    <text x="315" y="77">a</text>
    <text x="430" y="77">ends 中 &lt; t</text>
    <text x="542" y="77">b</text>
    <text x="592" y="77">ans</text>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="70" y="102">2</text><text x="195" y="102">{1}</text><text x="315" y="102">1</text><text x="430" y="102">{}</text><text x="542" y="102">0</text><text x="592" y="102" font-weight="bold">1</text>
    <text x="70" y="130">3</text><text x="195" y="130">{1,3}</text><text x="315" y="130">2</text><text x="430" y="130">{}</text><text x="542" y="130">0</text><text x="592" y="130" font-weight="bold">2</text>
    <text x="70" y="158" font-weight="bold" fill="#8a6415">7 ★</text><text x="195" y="158" font-weight="bold" fill="#8a6415">{1,3,4}</text><text x="315" y="158" font-weight="bold" fill="#8a6415">3</text><text x="430" y="158" font-weight="bold" fill="#8a6415">{6}</text><text x="542" y="158" font-weight="bold" fill="#8a6415">1</text><text x="592" y="158" font-weight="bold" fill="#b85450">2</text>
    <text x="70" y="186">11</text><text x="195" y="186">{1,3,4,9}</text><text x="315" y="186">4</text><text x="430" y="186">{6,7}</text><text x="542" y="186">2</text><text x="592" y="186" font-weight="bold">2</text>
  </g>

  <!-- view 2 label -->
  <text x="40" y="232" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">视角二：事件扫描（+1 @ 1,3,4,9；−1 @ 7,8,13,14 → 前缀和）</text>

  <!-- xs array -->
  <text x="142" y="262" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">xs =</text>
  <g filter="url(#sk)">
    <rect x="150" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="218" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="252" y="246" width="32" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="286" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="320" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="354" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="388" y="246" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="166" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">1</text>
    <text x="200" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">3</text>
    <text x="234" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">4</text>
    <text x="268" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">7</text>
    <text x="302" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">8</text>
    <text x="336" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">9</text>
    <text x="370" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">13</text>
    <text x="404" y="262" text-anchor="middle" font-size="12" fill="#2e5e2e">14</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="166" y="284">k=0</text><text x="200" y="284">1</text><text x="234" y="284">2</text>
    <text x="268" y="284" fill="#8a6415" font-weight="bold">3</text><text x="302" y="284">4</text>
    <text x="336" y="284">5</text><text x="370" y="284">6</text><text x="404" y="284">7</text>
  </g>

  <!-- prefix array -->
  <text x="142" y="322" text-anchor="end" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">prefix =</text>
  <g filter="url(#sk)">
    <rect x="150" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="184" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="218" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="252" y="306" width="32" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="286" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="320" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="354" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="388" y="306" width="32" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="166" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">1</text>
    <text x="200" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">2</text>
    <text x="234" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">3</text>
    <text x="268" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">2</text>
    <text x="302" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">1</text>
    <text x="336" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">2</text>
    <text x="370" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">1</text>
    <text x="404" y="322" text-anchor="middle" font-size="12" fill="#2e5e2e">0</text>
  </g>

  <!-- queries -->
  <g font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="150" y="356">t=2：k=0 → prefix[0] = 1</text>
    <text x="150" y="378">t=3：k=1 → prefix[1] = 2</text>
    <text x="150" y="400" font-weight="bold" fill="#8a6415">t=7：k=3 → prefix[3] = 2（≤ 7 的最后事件恰是 7 本身）</text>
    <text x="150" y="422">t=11：k=5 → prefix[5] = 2</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="580" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="330" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a35" filter="url(#sk)">t=7 双视角一致：{1,3,4} − {6} = 2 = prefix[3] ✓（ends 里的 7 不算已谢，[3,7] 当天仍盛开）</text>

  <!-- verdict -->
  <g filter="url(#sk)">
    <rect x="180" y="472" width="300" height="26" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="330" y="490" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">answer = [1, 2, 2, 2] ✓</text>
</svg>
