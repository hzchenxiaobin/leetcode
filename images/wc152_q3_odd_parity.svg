<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只看计数奇偶，一次替换消掉一对奇数</text>
  <text x="280" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">重排不改变每个字母的出现次数，所以「能不能成回文」只由奇偶性决定</text>

  <rect x="30" y="64" width="240" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="88" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">① 回文的充要条件</text>
  <text x="46" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">重排后可成回文 ⟺ 至多一个字母</text>
  <text x="46" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">出现奇数次（odd ≤ 1）</text>
  <text x="46" y="144" font-size="10.5" fill="#777" filter="url(#rough2)">如 aabbc → abcba，可行</text>

  <rect x="290" y="64" width="240" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="306" y="88" font-size="12" fill="#3a6a2c" font-weight="bold" filter="url(#rough2)">② 一次替换做什么</text>
  <text x="306" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">把 x 换成 y：x 计数 −1，y 计数 +1</text>
  <text x="306" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">取两个奇数字母各一个，互改</text>
  <text x="306" y="144" font-size="10.5" fill="#777" filter="url(#rough2)">两者同时变偶 → odd 恰好 −2</text>

  <path d="M 150 164 L 150 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 164 L 410 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="194" width="240" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="218" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">例：s = "abcd"，odd = 4</text>
  <text x="46" y="240" font-size="10.5" fill="#555" filter="url(#rough2)">a b c d 各 1 次，四个奇数</text>
  <text x="46" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">c→a、d→b 得到 "abba"</text>
  <text x="46" y="284" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">需要 4 / 2 = 2 次替换</text>
  <text x="46" y="302" font-size="10" fill="#888" filter="url(#rough2)">k = 1 时无解，k = 2 可行</text>

  <rect x="290" y="194" width="240" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="306" y="218" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">例：s = "abcda"，odd = 3</text>
  <text x="306" y="240" font-size="10.5" fill="#555" filter="url(#rough2)">a×2（偶），b c d 各 1（奇）</text>
  <text x="306" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">把 c 改成 d 得到 "abdba"</text>
  <text x="306" y="284" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">需要 (3−1) / 2 = 1 次替换</text>
  <text x="306" y="302" font-size="10" fill="#888" filter="url(#rough2)">落单的那个奇数放在中点</text>

  <path d="M 150 312 L 150 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 312 L 410 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="338" width="440" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">判定式：odd ≤ 2k + 1 ⟺ odd // 2 ≤ k</text>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">odd 与子串长度同奇偶，所以不必再单独判断长度是奇是偶</text>
</svg>
