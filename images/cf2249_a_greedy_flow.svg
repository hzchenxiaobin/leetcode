<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fafafa"/>
  <text x="380.0" y="32.0" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">对每个 m 做一次双指针贪心：m 从 n 递减，第一个可行者就是答案</text>
  <text x="380.0" y="58.0" text-anchor="middle" font-size="12.0" fill="#66788c" filter="url(#rough2)">核心：位置 j 只需要「最小的可用下标」，指针 p 只增不减 ⇒ 单次 check O(n)</text>
  <rect x="64.0" y="84.0" width="320.0" height="46.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224.0" y="111.7" text-anchor="middle" font-size="13.0" fill="#33506b" filter="url(#rough2)">m = n, n−1, …, 1（枚举长度）</text>
  <rect x="64.0" y="148.0" width="320.0" height="46.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224.0" y="175.7" text-anchor="middle" font-size="13.0" fill="#33506b" filter="url(#rough2)">p = 1（下标指针），j = 1</text>
  <rect x="64.0" y="212.0" width="320.0" height="58.0" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224.0" y="236.0" text-anchor="middle" font-size="13.0" fill="#8a6320" filter="url(#rough2)">k = m+1−j</text>
  <text x="224.0" y="258.0" text-anchor="middle" font-size="12.0" fill="#8a6320" filter="url(#rough2)">把 p 右推到第一个「在 (j,k) 可用」的元素</text>
  <rect x="64.0" y="290.0" width="320.0" height="46.0" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224.0" y="317.7" text-anchor="middle" font-size="13.0" fill="#33506b" filter="url(#rough2)">p 超过 n 了？</text>
  <rect x="440.0" y="290.0" width="250.0" height="54.0" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565.0" y="312.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">是：这个 m 不可行</text>
  <text x="565.0" y="332.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">m ← m−1，回到顶部</text>
  <rect x="64.0" y="356.0" width="320.0" height="46.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224.0" y="378.0" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">否：放上元素 p，p+1，j+1</text>
  <text x="224.0" y="396.0" text-anchor="middle" font-size="10.5" fill="#37662c" filter="url(#rough2)">（j 还没到 m 就回到上面继续）</text>
  <rect x="440.0" y="356.0" width="250.0" height="54.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="565.0" y="378.0" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">j 走完 m 个位置</text>
  <text x="565.0" y="398.0" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">→ 输出 m，结束</text>
  <path d="M 224 130 L 224 148" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 194 L 224 212" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 270 L 224 290" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 384 313 L 440 313" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 336 L 224 356" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 384 379 L 440 379" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408.0" y="306.0" text-anchor="middle" font-size="11.0" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="232.0" y="350.0" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="408.0" y="372.0" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">j = m</text>
  <path d="M 690 290 L 690 107 L 388 107" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="676.0" y="200.0" text-anchor="end" font-size="10.5" fill="#b85450" transform="rotate(-90 676.0 200.0)" filter="url(#rough2)">换下一个 m</text>
  <path d="M 64 379 L 32 379 L 32 241 L 60 241" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="17.0" y="310.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 17.0 310.0)" filter="url(#rough2)">下一个 j</text>
  <text x="380.0" y="436.0" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">为什么贪心对：位置 j 能用更小的下标，就绝不用更大的 —— 后面可选的元素集合只会更大（交换论证）</text>
  <text x="380.0" y="458.0" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">为什么总代价 O(n²)：被跳过的元素在位置 j+1 也回不来，p 单调右移；单次 check 至多 n 次推进</text>
</svg>
