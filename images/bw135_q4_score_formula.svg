<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">单列贡献：只被「更高的那个邻居」限制</text>

  <!-- 三列 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="80" y="52" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="92" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="132" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="172" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="212" width="60" height="40" fill="#f4f7fb" stroke="#446688" stroke-width="1.3"/>
    <text x="110" y="272" text-anchor="middle" fill="#446688">h&#8345;&#8331;&#8321; = 4</text>
    <text x="110" y="290" text-anchor="middle" fill="#777">左邻居</text>

    <rect x="170" y="52" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="170" y="92" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="170" y="132" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="170" y="172" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="170" y="212" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="272" text-anchor="middle" fill="#a06c10">h&#8345; = 1</text>
    <text x="200" y="290" text-anchor="middle" fill="#a06c10">当前列（被打分）</text>

    <rect x="260" y="52" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="260" y="92" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="260" y="132" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="260" y="172" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <rect x="260" y="212" width="60" height="40" fill="#5a6b7d" stroke="#446688" stroke-width="1.3"/>
    <text x="290" y="272" text-anchor="middle" fill="#446688">h&#8345;&#8330;&#8321; = 5</text>
    <text x="290" y="290" text-anchor="middle" fill="#777">右邻居</text>
  </g>

  <!-- 括号标注 -->
  <g filter="url(#rough2)" font-size="12">
    <path d="M 156 92 L 166 92" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 252 92 L 242 92" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="342" y="72" font-size="12" fill="#333">行 0：当前列黑格，不计分</text>
    <text x="342" y="96" font-size="12" fill="#a06c10">行 1..4：白格，左邻居黑 → 全部计分</text>
    <text x="342" y="120" font-size="12" fill="#666">行 &gt; max(h&#8345;&#8331;&#8321;, h&#8345;&#8330;&#8321;) 时两侧皆白</text>
    <text x="342" y="144" font-size="12" fill="#666">⇒ 一旦超过，再多的白格也不计分</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="52" y="310" width="498" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="68" y="332" fill="#333">f[j] = P[j](max(h[j−1], h[j+1])) − P[j](h[j])</text>
    <text x="68" y="354" fill="#666">P[j](t) = 第 j 列前 t 行之和；结果小于 0 时按 0 计</text>
    <rect x="52" y="372" width="498" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="68" y="394" fill="#2d5a22">记 g[j](x) = max(0, P[j](x) − P[j](h[j]))</text>
    <text x="68" y="416" fill="#2d5a22">则 f[j] = g[j](max(h[j−1], h[j+1]))，只依赖三个高度</text>
  </g>
</svg>
