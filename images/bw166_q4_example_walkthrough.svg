<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个示例的分量贡献</text>
  <rect x="24" y="62" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：[1,2,3]，swaps = [[0,2],[1,2]]</text>
  <rect x="310" y="62" width="266" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="82" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2：[1,2,3]，swaps = [[1,2]]</text>
  <rect x="24" y="100" width="270" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="124" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">一个分量 {0,1,2}，偶位 E = 2</text>
  <text x="40" y="148" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">元素降序 3,2,1 → topE = 5</text>
  <text x="40" y="170" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">sumAll = 6</text>
  <text x="40" y="196" text-anchor="start" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">贡献 = 2×5 − 6 = 4</text>
  <text x="40" y="218" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 4</text>
  <rect x="310" y="100" width="266" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="326" y="124" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">分量 {0}：E=1, topE=1, sum=1 → 1</text>
  <text x="326" y="148" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">分量 {1,2}：偶位只有 2，E=1</text>
  <text x="326" y="170" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">元素 {2,3} → topE=3, sum=5 → 6−5=1</text>
  <text x="326" y="196" text-anchor="start" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">合计 1 + 1 = 2</text>
  <text x="326" y="218" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 2</text>
  <rect x="24" y="244" width="552" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="268" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">每个分量独立决策：不同分量之间的元素不能交换，交替和可加</text>
  <text x="42" y="292" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">故全局最优 = 各分量最优贡献之和</text>
</svg>
