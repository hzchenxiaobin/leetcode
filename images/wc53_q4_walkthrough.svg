<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="30" y="34" font-size="16" fill="#333" filter="url(#rough2)">走查：stickers = [with, example, science]，target = "thehat"</text>

  <!-- 表头 -->
  <rect x="24" y="52" width="70" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="59" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步数</text>
  <rect x="94" y="52" width="120" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本步贴纸</text>
  <rect x="214" y="52" width="170" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">剩余 (t,h,e,a)</text>
  <rect x="384" y="52" width="152" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">说明</text>

  <!-- 第 0 行 -->
  <rect x="24" y="90" width="70" height="40" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="59" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="94" y="90" width="120" height="40" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="154" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">—</text>
  <rect x="214" y="90" width="170" height="40" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="299" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2, 2, 1, 1)</text>
  <rect x="384" y="90" width="152" height="40" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="460" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始需求</text>

  <!-- 第 1 行 -->
  <rect x="24" y="130" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="94" y="130" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">with</text>
  <rect x="214" y="130" width="170" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1, 1, 1, 1)</text>
  <rect x="384" y="130" width="152" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t、h 各减 1</text>

  <!-- 第 2 行 -->
  <rect x="24" y="170" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="170" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">with</text>
  <rect x="214" y="170" width="170" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0, 0, 1, 1)</text>
  <rect x="384" y="170" width="152" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t、h 用尽</text>

  <!-- 第 3 行 -->
  <rect x="24" y="210" width="70" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="59" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="94" y="210" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">example</text>
  <rect x="214" y="210" width="170" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="299" y="235" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0, 0, 0, 0) ✓</text>
  <rect x="384" y="210" width="152" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e、a 补齐</text>

  <!-- 演算箭头 -->
  <path d="M59,252 L59,272" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="72" y="288" font-size="12" fill="#b85450" filter="url(#rough2)">最优 3 张，记入 memo[(2,2,1,1)] = 3</text>

  <!-- 支配说明 -->
  <rect x="24" y="300" width="512" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="324" font-size="12" fill="#333" filter="url(#rough2)">「science」只提供 e，被「example」= e1 a1 支配：替换后不会更差</text>
  <text x="42" y="346" font-size="12" fill="#333" filter="url(#rough2)">⇒ 剪掉后只剩 {with, example}，分支从 3 降到 2，答案不变</text>
</svg>
