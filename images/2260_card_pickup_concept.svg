<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：最短匹配段恰好由某对「相邻同值」夹成</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- cards row: same-value cells share color -->
  <text x="70" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">cards =</text>
  <g filter="url(#sk)">
    <rect x="140" y="64" width="44" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="210" y="64" width="44" height="36" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="280" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="350" y="64" width="44" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="420" y="64" width="44" height="36" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="490" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="162" y="88">3</text>
    <text x="232" y="88">4</text>
    <text x="302" y="88">2</text>
    <text x="372" y="88">3</text>
    <text x="442" y="88">4</text>
    <text x="512" y="88">7</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="162" y="112">下标 0</text>
    <text x="232" y="112">下标 1</text>
    <text x="302" y="112">下标 2</text>
    <text x="372" y="112">下标 3</text>
    <text x="442" y="112">下标 4</text>
    <text x="512" y="112">下标 5</text>
  </g>

  <!-- brackets: each same-value pair spans a legal segment -->
  <path d="M 140 124 L 140 138 L 394 138 L 394 124" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="267" y="158" text-anchor="middle" font-size="11.5" fill="#2b6e9e">3 这对（下标 0, 3）夹出 [3,4,2,3]，长度 = 3−0+1 = 4</text>
  <path d="M 210 166 L 210 180 L 464 180 L 464 166" stroke="#c98a2b" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="337" y="200" text-anchor="middle" font-size="11.5" fill="#9a6a15">4 这对（下标 1, 4）夹出 [4,2,3,4]，长度 = 4−1+1 = 4</text>

  <!-- dominance: non-adjacent pair is always dominated -->
  <text x="340" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">为何只需相邻对？设值 v 依次出现在 p₁ &lt; p₂ &lt; p₃</text>
  <path d="M 130 280 L 510 280" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="170" cy="280" r="5" fill="#2b2b2b"/>
    <circle cx="310" cy="280" r="5" fill="#2b2b2b"/>
    <circle cx="450" cy="280" r="5" fill="#2b2b2b"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-style="italic">
    <text x="170" y="300">p₁</text>
    <text x="310" y="300">p₂</text>
    <text x="450" y="300">p₃</text>
  </g>
  <path d="M 170 272 Q 310 244 450 272" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="310" y="242" text-anchor="middle" font-size="11" fill="#a04038">非相邻对 p₃−p₁（更长，必然被支配）</text>
  <path d="M 170 288 Q 240 306 310 288" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 310 288 Q 380 306 450 288" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <g font-size="10.5" fill="#2e6e2e" text-anchor="middle">
    <text x="240" y="320">相邻对 p₂−p₁</text>
    <text x="380" y="320">相邻对 p₃−p₂</text>
  </g>
  <text x="340" y="340" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">p₃ − p₁ = (p₃ − p₂) + (p₂ − p₁) ≥ max(p₃ − p₂, p₂ − p₁)</text>

  <!-- rule box -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="600" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">结论：一趟线性扫描即可</text>
  <text x="340" y="398" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">ans = min over 所有值的相邻出现对 (p_k, p_{k+1}) of ( p_{k+1} − p_k + 1 )</text>
  <text x="340" y="418" text-anchor="middle" font-size="11.5" fill="#666">哈希表 last[v] 存最近下标，扫描命中时算 dist = i − last[v] + 1 取 min；全程未命中返回 −1</text>
</svg>
