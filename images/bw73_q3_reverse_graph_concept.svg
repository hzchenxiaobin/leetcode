<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">把边全部反向：祖先 = 反图中可达的点</text>

  <!-- 左：原图 -->
  <text x="140" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">原图</text>
  <g filter="url(#rough2)">
    <circle cx="90" cy="110" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="190" cy="110" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="140" cy="170" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="100" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="190" cy="240" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="115">0</text><text x="190" y="115">1</text>
    <text x="140" y="175">3</text>
    <text x="100" y="245">5</text><text x="190" y="245">6</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 104 122 L 126 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 176 122 L 154 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 126 186 L 110 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M 154 186 L 176 222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="52" y="290">0 → 3、1 → 3、3 → 5、3 → 6</text>
  </g>

  <!-- 中间大箭头 -->
  <g filter="url(#rough2)">
    <path d="M 236 170 C 256 170, 264 170, 284 170" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#arrB)"/>
  </g>
  <text x="260" y="150" font-size="13" fill="#333" filter="url(#rough2)" text-anchor="middle">反向</text>
  <text x="260" y="196" font-size="12" fill="#999" filter="url(#rough2)" text-anchor="middle">路径倒转</text>

  <!-- 右：反图 -->
  <text x="424" y="64" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">反图（radj）</text>
  <g filter="url(#rough2)">
    <circle cx="374" cy="110" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="474" cy="110" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="424" cy="170" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="384" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="474" cy="240" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="374" y="115">0</text><text x="474" y="115">1</text>
    <text x="424" y="175">3</text>
    <text x="384" y="245">5</text><text x="474" y="245">6</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 126 158 L 104 122" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" transform="translate(284,0)"/>
    <path d="M 154 158 L 176 122" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" transform="translate(284,0)"/>
    <path d="M 110 222 L 126 186" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" transform="translate(284,0)"/>
    <path d="M 176 222 L 154 186" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" transform="translate(284,0)"/>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="330" y="278" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2a4a22">
    <text x="435" y="297" text-anchor="middle">从 5 出发在反图走：</text>
    <text x="435" y="314" text-anchor="middle">5 → 3 → 0、1，祖先 = {0,1,3}</text>
  </g>
</svg>
