<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：四步得到闭式答案</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不模拟时间轴，只统计频次</text>

  <rect x="150" y="64" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="91" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 统计 26 个字母的频次 c[i]</text>

  <path d="M 290 108 L 290 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="132" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="152" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② f = max c[i]，cnt = 频次等于 f 的类型数</text>
  <text x="290" y="169" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">即“最频繁任务出现几次”与“有几个这样的任务”</text>

  <path d="M 290 178 L 290 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="202" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="222" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">③ L = (f − 1) × (n + 1) + cnt</text>
  <text x="290" y="239" text-anchor="middle" font-size="9.5" fill="#a08030" filter="url(#rough2)">框架下界：主任务的间隔段 + 收尾</text>

  <path d="M 290 248 L 290 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="290,274 380,310 290,346 200,310" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="290" y="315" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">T ≥ L ?</text>
  </g>

  <path d="M 200 310 L 152 372" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="336" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 380 310 L 428 372" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="336" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="376" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="396" text-anchor="middle" font-size="12" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">ans = T</text>
  <text x="150" y="415" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">任务够多，可排满且没有空闲</text>

  <rect x="320" y="376" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="396" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans = L</text>
  <text x="430" y="415" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">任务太少，框架里的空闲消不掉</text>
</svg>
