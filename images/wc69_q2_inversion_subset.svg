<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">局部倒置一定也是全局倒置</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一对相邻逆序 (i, i+1) 都满足 i &lt; j 且 nums[i] &gt; nums[j]，所以「局部」是「全局」的子集</text>

  <rect x="55" y="78" width="530" height="200" rx="18" fill="#f7f9fc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">全局倒置：i &lt; j 且 nums[i] &gt; nums[j]</text>

  <rect x="85" y="126" width="212" height="124" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="191" y="154" text-anchor="middle" font-size="13.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">局部倒置</text>
  <text x="191" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">j = i + 1，相邻逆序</text>
  <text x="191" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">如 [1,2,0] 中的 (1,2)</text>
  <text x="191" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">数量 = 局部倒置数</text>

  <line x1="322" y1="126" x2="322" y2="250" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <text x="462" y="154" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">跨距 ≥ 2 的逆序对</text>
  <text x="462" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">j ≥ i + 2，如 (0,2)：1 &gt; 0</text>
  <text x="462" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">它们「不是」局部倒置</text>
  <text x="462" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">正是它们让全局数量变大</text>

  <text x="320" y="306" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">全局数量 = 局部数量 + 跨距 ≥ 2 的逆序对数量</text>
  <text x="320" y="332" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">所以两者相等 ⟺ 右侧区域为空 ⟺ 不存在 j − i ≥ 2 且 nums[i] &gt; nums[j]</text>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对 [0, n−1] 的排列，这又等价于：每个元素只在原位或相邻位，即 |nums[i] − i| ≤ 1</text>
</svg>
