<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：[1, 6000]，limit = 4，s = 124</text>
  <rect x="50" y="50" width="460" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">位数 3：只有 124 本身（1 个）</text>
  <text x="280" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">位数 4：1 位自由前缀 + 后缀 124，且整体 ≤ 6000</text>
  <rect x="120" y="132" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="150" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">124</text>
  <text x="268" y="150" text-anchor="start" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">首位  ≤ limit = 4 ✓</text>
  <rect x="120" y="164" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="182" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">1124</text>
  <text x="268" y="182" text-anchor="start" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">首位 1 ≤ limit = 4 ✓</text>
  <rect x="120" y="196" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="214" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">2124</text>
  <text x="268" y="214" text-anchor="start" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">首位 2 ≤ limit = 4 ✓</text>
  <rect x="120" y="228" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="246" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">3124</text>
  <text x="268" y="246" text-anchor="start" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">首位 3 ≤ limit = 4 ✓</text>
  <rect x="120" y="260" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="278" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">4124</text>
  <text x="268" y="278" text-anchor="start" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">首位 4 ≤ limit = 4 ✓</text>
  <rect x="120" y="292" width="130" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="310" text-anchor="middle" font-size="12.5" fill="#7a3030" filter="url(#rough2)">5124</text>
  <text x="268" y="310" text-anchor="start" font-size="10.5" fill="#7a3030" filter="url(#rough2)">首位 5 > limit = 4 ✗</text>
  <rect x="400" y="132" width="130" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="156" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">合计 1 + 4 = 5</text>
  <text x="465" y="178" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">与输出一致</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 5124 只差在首位超限：limit 限制的是每一位，不是「数值 ≤ limit」</text>
</svg>
