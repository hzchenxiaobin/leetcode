<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 左面板标题 -->
  <text x="150" y="46" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">条件：每个环的边权和为偶</text>

  <!-- 左面板：4-环 -->
  <line x1="162" y1="122" x2="213" y2="173" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="213" y1="197" x2="162" y2="248" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="138" y1="248" x2="87"  y2="197" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="87"  y1="173" x2="138" y2="122" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="188" y="128" width="22" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="199" y="141" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="187" y="232" width="22" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="245" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="91"  y="232" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="245" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="90"  y="128" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <circle cx="150" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="225" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="150" cy="260" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="75"  cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75"  y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">环和 = 1+1+0+0 = 2（偶）</text>

  <!-- 分隔线 -->
  <line x1="280" y1="60" x2="280" y2="330" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 右面板标题 -->
  <text x="420" y="46" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">等价：存在点势 p，w = p(u) ⊕ p(v)</text>

  <!-- 右面板：同一图按 p 染色 -->
  <line x1="432" y1="122" x2="483" y2="173" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="483" y1="197" x2="432" y2="248" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="408" y1="248" x2="357" y2="197" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="357" y1="173" x2="408" y2="122" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="458" y="128" width="22" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="469" y="141" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="457" y="232" width="22" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="245" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>
  <rect x="361" y="232" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="245" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="360" y="128" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <circle cx="420" cy="110" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="86"  text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 0</text>
  <circle cx="495" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="495" y="216" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p = 1</text>
  <circle cx="420" cy="260" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 0</text>
  <circle cx="345" cy="185" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="345" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 0</text>

  <!-- 图例 -->
  <circle cx="316" cy="322" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="326" font-size="11" fill="#333" filter="url(#rough2)">p = 0</text>
  <circle cx="378" cy="322" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="326" font-size="11" fill="#333" filter="url(#rough2)">p = 1</text>
  <rect x="438" y="313" width="20" height="17" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="326" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="462" y="326" font-size="11" fill="#333" filter="url(#rough2)">跨色边</text>
  <rect x="508" y="313" width="20" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="518" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="532" y="326" font-size="11" fill="#333" filter="url(#rough2)">同色边</text>

  <!-- 底部结论框 -->
  <rect x="30" y="346" width="500" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">沿环逐边异或：w(v0,v1) ⊕ w(v1,v2) ⊕ … 每项展开为 p(vi) ⊕ p(vi+1)，</text>
  <text x="280" y="381" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每个 p(v) 恰出现两次互相抵消 → 环和 ≡ 0 (mod 2)，任何环都自动为偶。</text>
</svg>
