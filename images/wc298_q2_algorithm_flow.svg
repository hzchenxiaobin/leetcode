<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：特判 num = 0 → 升序枚举 c = 1..10，两条件把关</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第一行：特判 -->
  <g filter="url(#sk)"><ellipse cx="80" cy="78" rx="30" ry="16" fill="#f3efe6" stroke="#8a7a55" stroke-width="1.5"/></g>
  <text x="80" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5c3c">开始</text>
  <path d="M 112 78 H 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="185,78 245,50 305,78 245,106" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="245" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">num == 0 ?</text>
  <path d="M 305 78 H 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="362" y="61" width="176" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="450" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">返回 0（空多重集）</text>
  <path d="M 245 106 V 126" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="253" y="122" text-anchor="start" font-size="11" font-weight="bold" fill="#a06a20">否</text>

  <!-- 第二行：枚举上界 -->
  <g filter="url(#sk)"><rect x="180" y="132" width="130" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="245" y="152" text-anchor="middle" font-size="12.5" fill="#2b6e9e">c ← 1</text>
  <path d="M 245 164 V 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="190,208 245,184 300,208 245,232" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="245" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">c ≤ 10 ?</text>
  <path d="M 300 208 H 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="326" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">否</text>
  <g filter="url(#sk)"><rect x="362" y="192" width="176" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="450" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">返回 −1（同余不可达）</text>
  <path d="M 245 232 V 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="253" y="248" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 第三行：个位对齐判定 -->
  <g filter="url(#sk)"><polygon points="135,290 245,260 355,290 245,320" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="245" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">(c·k) % 10</text>
  <text x="245" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">== num % 10 ?</text>
  <path d="M 355 290 H 398" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="374" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">否</text>
  <g filter="url(#sk)"><rect x="404" y="274" width="104" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="456" y="294" text-anchor="middle" font-size="12" fill="#2b6e9e">c ← c + 1</text>
  <path d="M 456 272 V 236 H 338 V 208 H 306" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="397" y="230" text-anchor="middle" font-size="10.5" fill="#888">继续枚举</text>
  <path d="M 245 320 V 344" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="253" y="338" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 第四行：透支判定 -->
  <g filter="url(#sk)"><polygon points="180,376 245,352 310,376 245,400" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="245" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">c·k ≤ num ?</text>
  <path d="M 310 376 H 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="368" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="362" y="359" width="190" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="457" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">返回 c —— 最小大小</text>
  <path d="M 245 400 V 426" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="253" y="418" text-anchor="start" font-size="11" font-weight="bold" fill="#a06a20">否</text>
  <text x="290" y="420" text-anchor="start" font-size="10" fill="#888">同类更大的 c 只会更透支</text>
  <g filter="url(#sk)"><rect x="150" y="430" width="190" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="245" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">返回 −1（透支无解）</text>

  <text x="320" y="488" text-anchor="middle" font-size="11.5" fill="#888">个位 (c·k) mod 10 随 c 的周期 = 10/gcd(k,10) ≤ 10 —— 至多 10 轮定胜负，O(1) 与 num 规模无关</text>
</svg>
