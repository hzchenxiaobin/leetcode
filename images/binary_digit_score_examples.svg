<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：三个分支各走一遍</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Table background -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="570" height="276" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4"/>
  </g>

  <!-- Header band -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="570" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b6e9e">
    <text x="92" y="83" text-anchor="middle">(a, b)</text>
    <text x="210" y="83" text-anchor="middle">二进制</text>
    <text x="318" y="83" text-anchor="middle">s₁ / s₂</text>
    <text x="435" y="83" text-anchor="middle">分支判断</text>
    <text x="555" y="83" text-anchor="middle">得分</text>
  </g>

  <!-- Column separators -->
  <g stroke="#c8d2dc" stroke-width="1" filter="url(#sk)">
    <line x1="145" y1="94" x2="145" y2="338"/>
    <line x1="275" y1="94" x2="275" y2="338"/>
    <line x1="365" y1="94" x2="365" y2="338"/>
    <line x1="500" y1="94" x2="500" y2="338"/>
  </g>

  <!-- Row separators -->
  <g stroke="#c8d2dc" stroke-width="1" filter="url(#sk)">
    <line x1="40" y1="152" x2="610" y2="152"/>
    <line x1="40" y1="210" x2="610" y2="210"/>
    <line x1="40" y1="268" x2="610" y2="268"/>
  </g>

  <!-- Trap row background -->
  <g filter="url(#sk)">
    <rect x="41" y="268" width="568" height="69" fill="#fce4ec" opacity="0.55"/>
  </g>

  <!-- Row 1: 14, 6 (multiply) -->
  <g font-size="13" fill="#333">
    <text x="92" y="128" text-anchor="middle" font-weight="bold">14, 6</text>
    <text x="210" y="128" text-anchor="middle" font-family="monospace">1110 / 110</text>
    <text x="318" y="128" text-anchor="middle" font-family="monospace">3 / 2</text>
    <text x="435" y="128" text-anchor="middle" fill="#2e6e2e">3 ≥ 2 → 乘</text>
    <text x="555" y="128" text-anchor="middle" fill="#2e6e2e" font-weight="bold" font-family="monospace">3×2 = 6</text>
  </g>

  <!-- Row 2: 5, 15 (divide) -->
  <g font-size="13" fill="#333">
    <text x="92" y="186" text-anchor="middle" font-weight="bold">5, 15</text>
    <text x="210" y="186" text-anchor="middle" font-family="monospace">101 / 1111</text>
    <text x="318" y="186" text-anchor="middle" font-family="monospace">2 / 4</text>
    <text x="435" y="186" text-anchor="middle" fill="#b8761a">2 &lt; 4 → 除</text>
    <text x="555" y="186" text-anchor="middle" fill="#b8761a" font-weight="bold" font-family="monospace">4÷2 = 2</text>
  </g>

  <!-- Row 3: 10, 12 (equal, multiply) -->
  <g font-size="13" fill="#333">
    <text x="92" y="244" text-anchor="middle" font-weight="bold">10, 12</text>
    <text x="210" y="244" text-anchor="middle" font-family="monospace">1010 / 1100</text>
    <text x="318" y="244" text-anchor="middle" font-family="monospace">2 / 2</text>
    <text x="435" y="244" text-anchor="middle" fill="#2e6e2e">2 = 2 → 乘</text>
    <text x="555" y="244" text-anchor="middle" fill="#2e6e2e" font-weight="bold" font-family="monospace">2×2 = 4</text>
  </g>

  <!-- Row 4: 6, 14 (trap) -->
  <g font-size="13" fill="#333">
    <text x="92" y="302" text-anchor="middle" font-weight="bold" fill="#b85450">6, 14</text>
    <text x="210" y="302" text-anchor="middle" font-family="monospace">110 / 1110</text>
    <text x="318" y="302" text-anchor="middle" font-family="monospace">2 / 3</text>
    <text x="435" y="302" text-anchor="middle" fill="#b85450">2 &lt; 3 → 除</text>
    <text x="555" y="302" text-anchor="middle" fill="#b85450" font-weight="bold" font-family="monospace">3÷2 = 1</text>
  </g>
  <text x="470" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">← 交换陷阱！</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="570" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第 4 行是第 1 行交换 a、b 后的结果：同一对数，得分从 6 变成 1（整除向零取整）。</text>
</svg>
