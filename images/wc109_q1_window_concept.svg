<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">滑动窗口：只保留最近 3000 毫秒内的请求</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">请求时刻队列入队（t 严格递增）</text>
  <rect x="60" y="82" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98.0" y="104.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="82" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198.0" y="104.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">100</text>
  <rect x="260" y="82" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298.0" y="104.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3001</text>
  <rect x="360" y="82" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398.0" y="104.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3002</text>
  <rect x="460" y="82" width="76" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498.0" y="104.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4000</text>
  <text x="330" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">窗口 [t-3000, t] 随 t 增大而右移，左侧过期元素不断出队</text>
  <rect x="60" y="168" width="250" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="194.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">剔除 q.front() &lt; t - 3000</text>
  <path d="M 185 216 L 185 240" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="60" y="242" width="250" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="268.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = 队列长度</text>
  <text x="380" y="190" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">为什么均摊 O(1)：</text>
  <text x="380" y="216" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">每个时刻最多入队 1 次、</text>
  <text x="380" y="240" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">最多出队 1 次，总代价 O(n)</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">端点包含：q.front() == t - 3000 时仍在窗口内（用 &lt; 而不是 &lt;=）</text>
</svg>
