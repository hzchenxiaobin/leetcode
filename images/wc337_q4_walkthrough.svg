<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="461" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,−10,7,13,6,8]，value = 5 → MEX = 4</text>
  <path d="M 150 41 Q 330 48 508 41" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- section 1: buckets -->
  <text x="60" y="72" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">① 分桶（按 x mod 5）：</text>

  <g filter="url(#sk)">
    <rect x="40" y="82" width="112" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="96" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">r = 0</text>
  <text x="96" y="121" text-anchor="middle" font-size="11.5" fill="#446688">−10</text>
  <text x="96" y="138" text-anchor="middle" font-size="10" fill="#8a8a84">cnt = 1</text>

  <g filter="url(#sk)">
    <rect x="160" y="82" width="112" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="216" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">r = 1</text>
  <text x="216" y="121" text-anchor="middle" font-size="11.5" fill="#446688">1, 6</text>
  <text x="216" y="138" text-anchor="middle" font-size="10" fill="#8a8a84">cnt = 2</text>

  <g filter="url(#sk)">
    <rect x="280" y="82" width="112" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="336" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">r = 2</text>
  <text x="336" y="121" text-anchor="middle" font-size="11.5" fill="#446688">7</text>
  <text x="336" y="138" text-anchor="middle" font-size="10" fill="#8a8a84">cnt = 1</text>

  <g filter="url(#sk)">
    <rect x="400" y="82" width="112" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="456" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a6e">r = 3</text>
  <text x="456" y="121" text-anchor="middle" font-size="11.5" fill="#446688">13, 8</text>
  <text x="456" y="138" text-anchor="middle" font-size="10" fill="#8a8a84">cnt = 2</text>

  <g filter="url(#sk)">
    <rect x="520" y="82" width="112" height="62" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="576" y="101" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a36">r = 4</text>
  <text x="576" y="121" text-anchor="middle" font-size="11.5" fill="#b85450">（空）</text>
  <text x="576" y="138" text-anchor="middle" font-size="10" fill="#b85450">cnt = 0</text>

  <!-- section 2: candidates -->
  <text x="60" y="176" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">② 逐类候选 r + cnt[r]·value：</text>

  <g filter="url(#sk)">
    <rect x="40" y="186" width="112" height="46" rx="7" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="96" y="214" text-anchor="middle" font-size="12" fill="#555550">0+1×5 = 5</text>

  <g filter="url(#sk)">
    <rect x="160" y="186" width="112" height="46" rx="7" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="216" y="214" text-anchor="middle" font-size="12" fill="#555550">1+2×5 = 11</text>

  <g filter="url(#sk)">
    <rect x="280" y="186" width="112" height="46" rx="7" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="336" y="214" text-anchor="middle" font-size="12" fill="#555550">2+1×5 = 7</text>

  <g filter="url(#sk)">
    <rect x="400" y="186" width="112" height="46" rx="7" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="456" y="214" text-anchor="middle" font-size="12" fill="#555550">3+2×5 = 13</text>

  <g filter="url(#sk)">
    <rect x="520" y="186" width="112" height="46" rx="7" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="576" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36">4+0×5 = 4</text>

  <path d="M 576 244 Q 500 262 448 274" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="470" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">全组最小 → ans = 4</text>

  <!-- section 3: scan strip -->
  <text x="60" y="292" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">③ 从 x = 0 起扫描（✓ = 覆盖，✗ = 空洞）：</text>

  <g filter="url(#sk)">
    <rect x="64" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="90" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="90" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="90" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">−10→0</text>

  <g filter="url(#sk)">
    <rect x="124" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="150" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">1</text>
  <text x="150" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="150" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">1 原地</text>

  <g filter="url(#sk)">
    <rect x="184" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="210" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">2</text>
  <text x="210" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="210" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">7→2</text>

  <g filter="url(#sk)">
    <rect x="244" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="270" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="270" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">13→3</text>

  <g filter="url(#sk)">
    <rect x="304" y="302" width="52" height="58" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="330" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">4</text>
  <text x="330" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">✗</text>
  <text x="330" y="354" text-anchor="middle" font-size="8.5" fill="#b85450">类 4 空</text>

  <g filter="url(#sk)">
    <rect x="364" y="302" width="52" height="58" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="390" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a8a84">5</text>
  <text x="390" y="338" text-anchor="middle" font-size="12" fill="#8a8a84">✗</text>
  <text x="390" y="354" text-anchor="middle" font-size="8.5" fill="#8a8a84">类 0 用尽</text>

  <g filter="url(#sk)">
    <rect x="424" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">6</text>
  <text x="450" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="450" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">6 原地</text>

  <g filter="url(#sk)">
    <rect x="484" y="302" width="52" height="58" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1.2"/>
  </g>
  <text x="510" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a8a84">7</text>
  <text x="510" y="338" text-anchor="middle" font-size="12" fill="#8a8a84">✗</text>
  <text x="510" y="354" text-anchor="middle" font-size="8.5" fill="#8a8a84">类 2 用尽</text>

  <g filter="url(#sk)">
    <rect x="544" y="302" width="52" height="58" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="570" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">8</text>
  <text x="570" y="338" text-anchor="middle" font-size="12" fill="#2e5e2e">✓</text>
  <text x="570" y="354" text-anchor="middle" font-size="8.5" fill="#4a7a3a">8 原地</text>

  <path d="M 330 376 L 330 366" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#sk)">第一个空洞 ⟹ MEX = 4</text>

  <!-- bottom takeaway strip -->
  <g filter="url(#sk)">
    <rect x="40" y="406" width="580" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">最终数组正是官方解释的 [1, 0, 2, 3, 6, 8]：6、8 保持原值即可</text>
  <text x="330" y="447" text-anchor="middle" font-size="11" fill="#a07818">余 4 的元素一个也没有，4 无从补起；其后 5、7 也缺，但 MEX 只由第一个空洞决定</text>
</svg>
