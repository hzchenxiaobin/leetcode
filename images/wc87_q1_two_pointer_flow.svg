<svg xmlns="http://www.w3.org/2000/svg" width="660" height="480" viewBox="0 0 660 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="480" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：两侧各自从右往左跳过被删字符，再逐字符比对</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="85.0" y="53.0" width="330" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="80.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">i = |s|-1，j = |t|-1，skipS = skipT = 0</text>
  <g filter="url(#sk2)"><rect x="85.0" y="113.0" width="330" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="140.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">while i ≥ 0 或 j ≥ 0</text>
  <g filter="url(#sk2)"><rect x="85.0" y="175.0" width="330" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="194.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">s 侧：遇 '#' → skipS++</text>
  <text x="250" y="209.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">遇普通字符且 skipS&gt;0 → skipS-- 并跳过</text>
  <g filter="url(#sk2)"><rect x="85.0" y="235.0" width="330" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="254.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">t 侧：遇 '#' → skipT++</text>
  <text x="250" y="269.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">遇普通字符且 skipT&gt;0 → skipT-- 并跳过</text>
  <g filter="url(#sk2)"><rect x="85.0" y="297.0" width="330" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="316.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">一方有效、另一方已耗尽？</text>
  <text x="250" y="331.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（长度不同）</text>
  <g filter="url(#sk2)"><rect x="85.0" y="357.0" width="330" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="376.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">s[i] == t[j] ？</text>
  <text x="250" y="391.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（比较最终文本的当前末字符）</text>
  <g filter="url(#sk2)"><rect x="85.0" y="417.0" width="330" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="444.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">i--，j--，进入下一轮</text>
  <path d="M 250 100 L 250 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 160 L 250 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 222 L 250 234" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 282 L 250 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 344 L 250 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 404 L 250 416" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 85 440 L 62 440 L 62 136 L 82 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="56" y="300" text-anchor="end" font-size="10" fill="#446688">下一轮</text>
  <path d="M 416 320 L 486 320" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 416 380 L 486 380" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="494.0" y="300.0" width="148" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="568" y="324.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">返回 false</text>
  <g filter="url(#sk2)"><rect x="494.0" y="360.0" width="148" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="568" y="384.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">返回 false</text>
  <path d="M 416 136 L 486 136" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="451" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">两侧都耗尽</text>
  <g filter="url(#sk2)"><rect x="494.0" y="115.0" width="148" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="568" y="140.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">返回 true</text>
</svg>
