<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "Myself2 Me1 I4 and3" → "Me Myself and I"</text>

  <!-- 桶行（已填充） -->
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="100" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="180" y="62" width="100" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="300" y="62" width="100" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="420" y="62" width="100" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="84">Me</text><text x="230" y="84">Myself</text>
    <text x="350" y="84">and</text><text x="470" y="84">I</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="110" y="102">← 词尾 1</text><text x="230" y="102">← 词尾 2</text>
    <text x="350" y="102">← 词尾 3</text><text x="470" y="102">← 词尾 4</text>
  </g>

  <!-- 拼接箭头 -->
  <g filter="url(#rough2)">
    <path d="M 110 118 C 110 150, 180 162, 218 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 230 118 C 230 148, 240 158, 262 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 350 118 C 350 148, 330 158, 306 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 470 118 C 470 150, 380 162, 348 176" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 结果 -->
  <rect x="80" y="182" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="16" fill="#2f5226" font-weight="bold" filter="url(#rough2)">" ".join(slot) → Me Myself and I</text>

  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">split 按单个空格切分（题目保证无多余空格）；join 时用单个空格还原</text>

  <rect x="40" y="288" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">易错点：数字只会出现在每个单词的末尾一位；int(w[-1]) − 1 是 0 起始的桶下标，别把 '1' 直接当数组下标</text>
</svg>
