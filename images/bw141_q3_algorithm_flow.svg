<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次扫描 + 长度 m+1 的滚动数组</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888">时间 O(n·m)，空间 O(m)，m = pattern.length ≤ n ≤ 3000</text>

  <rect x="152" y="60" width="256" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">预处理 isTarget[0..n-1]</text>
  <text x="280" y="95" text-anchor="middle" font-size="10" fill="#555">把 targetIndices 标记为可删位置（O(n)）</text>

  <path d="M 280 102 L 280 118" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="122" width="256" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">初始化 dp[0] = 0，其余 dp[j] = -1</text>
  <text x="280" y="157" text-anchor="middle" font-size="10" fill="#555">-1 代表「pattern 前 j 位还保不住」的非法态</text>

  <path d="M 280 164 L 280 180" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="184" width="320" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">for i = 0 … n-1（source 的每个字符）</text>
  <text x="280" y="219" text-anchor="middle" font-size="10" fill="#555">ndp 整体重置为 -1，再对每个 j 尝试三条转移</text>

  <path d="M 280 226 L 280 244" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="248" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">三条转移（仅当 dp[j] ≥ 0 时展开）</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#555">ndp[j] ← dp[j]　|　ndp[j+1] ← dp[j]（source[i]==pattern[j]）　|　ndp[j] ← dp[j]+1（可删）</text>
  <text x="280" y="300" text-anchor="middle" font-size="9.5" fill="#888">三者互不排斥，取 max 保留最优</text>

  <path d="M 280 306 L 280 322" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="326" width="256" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">dp ← ndp，进入下一位 i</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#555">循环结束返回 dp[m]</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">输入保证 pattern 是 source 的子序列，所以 dp[m] 一定 ≥ 0，不会返回 -1</text>
</svg>
