<svg xmlns="http://www.w3.org/2000/svg" width="640" height="526" viewBox="0 0 640 526" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="526" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：判 S ≥ 2k → 0-1 背包数坏分区 → 容斥相减</text>

  <!-- step 1 -->
  <g filter="url(#sk)"><rect x="170" y="46" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="69" text-anchor="middle" font-size="12" fill="#2b4a66">① 求总和 S = Σ nums[i]（用 long long，S ≤ 10¹²）</text>
  <path d="M 320 82 L 320 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- diamond: S >= 2k? -->
  <g filter="url(#sk)"><polygon points="320,106 410,150 320,194 230,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">S ≥ 2k ?</text>
  <path d="M 410 150 L 464 150" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="437" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="466" y="122" width="164" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="548" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a">return 0</text>
  <text x="548" y="161" text-anchor="middle" font-size="10" fill="#b85450">两组和相加 = S &lt; 2k</text>
  <text x="548" y="173" text-anchor="middle" font-size="10" fill="#b85450">不可能都 ≥ k</text>
  <path d="M 320 194 L 320 218" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="334" y="210" text-anchor="start" font-size="11" fill="#888">是</text>

  <!-- step 2: knapsack group -->
  <g filter="url(#sk)"><rect x="70" y="222" width="500" height="128" rx="10" fill="#fffdf2" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5"/></g>
  <text x="320" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">② 0-1 背包计数：统计「和 &lt; k」的子集个数 bad</text>
  <text x="320" y="270" text-anchor="middle" font-size="11.5" fill="#8a6a2a">dp[0] = 1；dp[j] = 和恰好为 j 的子集数（j ≤ k−1）</text>
  <text x="320" y="292" text-anchor="middle" font-size="11.5" fill="#8a6a2a">对每个 x ∈ nums：若 x ≥ k 直接跳过（大元素进不了「和 &lt; k」的组）</text>
  <text x="320" y="314" text-anchor="middle" font-size="11.5" fill="#8a6a2a">否则 j 从 k−1 倒序到 x：dp[j] = (dp[j] + dp[j−x]) mod p</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#a08040">倒序 ⟹ dp[j−x] 还是上一轮的值，每个元素至多选一次</text>
  <path d="M 320 350 L 320 374" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)"><rect x="170" y="378" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="401" text-anchor="middle" font-size="12" fill="#2b4a66">③ bad = dp[0] + dp[1] + … + dp[k−1] (mod p)</text>
  <path d="M 320 414 L 320 438" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- step 4 -->
  <g filter="url(#sk)"><rect x="130" y="442" width="380" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="466" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e">④ 返回 (2ⁿ − 2·bad + p) mod p</text>
  <text x="320" y="488" text-anchor="middle" font-size="10.5" fill="#4a7a3a">2ⁿ 边乘边取模（或快速幂）；先 + p 防负数</text>
</svg>
