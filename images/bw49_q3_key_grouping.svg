<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">关键变形：等式 ⟺ x − rev(x) 相等，按指纹归组</text>

  <!-- 原等式 -->
  <rect x="60" y="46" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">nums[i] + rev(nums[j]) = nums[j] + rev(nums[i])   ⟺   指纹 f(x) = x − rev(x) 相等</text>

  <!-- 四个数 -->
  <g filter="url(#rough2)">
    <rect x="52" y="108" width="86" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="152" y="108" width="86" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="252" y="108" width="86" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <rect x="352" y="108" width="86" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="95" y="132">42</text>
    <text x="195" y="132">11</text>
    <text x="295" y="132">1</text>
    <text x="395" y="132">97</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="95" y="150">rev=24</text>
    <text x="195" y="150">rev=11</text>
    <text x="295" y="150">rev=1</text>
    <text x="395" y="150">rev=79</text>
  </g>

  <!-- 指纹箭头 -->
  <path d="M 95 164 C 95 190, 200 190, 214 206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 395 164 C 395 192, 250 192, 246 206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 195 164 C 195 196, 380 198, 406 206" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 295 164 C 295 196, 420 199, 436 206" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="140" y="200" fill="#2d5a22">42−24 = 18</text>
    <text x="320" y="202" fill="#8a3a34">11−11 = 0</text>
    <text x="436" y="188" fill="#8a3a34">1−1 = 0</text>
    <text x="270" y="188" fill="#2d5a22">97−79 = 18</text>
  </g>

  <!-- 两个指纹桶 -->
  <g filter="url(#rough2)">
    <rect x="150" y="212" width="220" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <rect x="240" y="278" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="260" y="243">桶 18：{ 42, 97 }（2 个）</text>
    <text x="350" y="309">桶 0：{ 11, 1 }（2 个）</text>
  </g>

  <!-- 计数 -->
  <path d="M 150 238 C 90 238, 60 262, 60 290 C 60 322, 110 336, 236 336" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 304 C 350 330, 320 336, 240 338" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="336" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = Σ C(桶大小, 2) = C(2,2) + C(2,2) = 1 + 1 = 2 ✓</text>
</svg>
