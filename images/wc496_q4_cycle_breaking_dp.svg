<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">断环成链：按下标 0「选 / 不选」拆成两种情形（打家劫舍 II 套路）</text>

  <!-- ===================== 左列：情形 A ===================== -->
  <text x="170" y="56" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">情形 A：0 不选 → 链 1..n−1 恰选 k 个</text>

  <!-- 环（画成一行 + 环绕弧线），n=7 -->
  <path d="M 286,76 C 272,56 38,56 24,76" fill="none" stroke="#999" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="24" y="76" width="34" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="41" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="62" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="100" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="138" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="214" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="252" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="41" y="118">0</text><text x="79" y="118">1</text><text x="117" y="118">2</text>
    <text x="155" y="118">3</text><text x="193" y="118">4</text><text x="231" y="118">5</text><text x="269" y="118">6</text>
  </g>
  <path d="M 155,128 L 155,146" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 链 1..6 -->
  <rect x="43" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="81" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="119" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="157" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="195" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="233" y="152" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="194">1</text><text x="98" y="194">2</text><text x="136" y="194">3</text>
    <text x="174" y="194">4</text><text x="212" y="194">5</text><text x="250" y="194">6</text>
  </g>
  <text x="155" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0 不选、也未被抬高 ⟹ 环绕边 (n−1, 0) 自动失效</text>
  <text x="155" y="234" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">在链 1..n−1 上恰好选 k 个（普通独立集 DP）</text>

  <!-- ===================== 右列：情形 B ===================== -->
  <text x="490" y="56" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">情形 B：0 选 → 链 2..n−2 恰选 k−1 个</text>

  <path d="M 606,76 C 592,56 358,56 344,76" fill="none" stroke="#999" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="344" y="76" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <rect x="382" y="76" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="399" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <rect x="420" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="496" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="534" y="76" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="572" y="76" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="589" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <g font-size="9.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="361" y="118">0</text><text x="399" y="118">1</text><text x="437" y="118">2</text>
    <text x="475" y="118">3</text><text x="513" y="118">4</text><text x="551" y="118">5</text><text x="589" y="118">6</text>
  </g>
  <g font-size="9.5" text-anchor="middle" filter="url(#rough2)">
    <text x="361" y="133" fill="#4a7a3a">选，付 cost[0]</text>
    <text x="399" y="133" fill="#b85450">禁选</text>
    <text x="589" y="133" fill="#b85450">禁选</text>
  </g>
  <path d="M 475,140 L 475,160" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 链 2..5 -->
  <rect x="401" y="166" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="439" y="166" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="477" y="166" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="515" y="166" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="418" y="208">2</text><text x="456" y="208">3</text><text x="494" y="208">4</text><text x="532" y="208">5</text>
  </g>
  <text x="475" y="230" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 与 n−1 是 0 的两个环邻居，双双被禁选</text>
  <text x="475" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">在链 2..n−2 上恰好再选 k−1 个（0 已贡献 1 个）</text>

  <!-- ===================== 底部：链上 DP ===================== -->
  <rect x="40" y="258" width="580" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">链上 DP：滚动数组 g / h，时间 O(nk)</text>
  <text x="330" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">g[j]：处理到当前位、末位「不选」、恰选 j 个的最小代价　　h[j]：末位「选」</text>
  <text x="330" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">转移：g′[j] = min(g[j], h[j])　　h′[j] = g[j−1] + cost[i]（选 i 则 i−1 必不选）</text>
  <text x="330" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">终态取 min(g[m], h[m])，其中 m = k（情形 A）或 k−1（情形 B）</text>
  <text x="330" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">环上答案 = min( dpA , cost[0] + dpB )：两情形恰好覆盖「0 选 / 0 不选」的全部方案</text>
</svg>
