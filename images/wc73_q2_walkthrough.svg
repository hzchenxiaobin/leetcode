<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个官方示例走查：只比一个数</text>
  <text x="350" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">T 是你的最短步数，d_i 是阻碍者 i 的最短步数；判据为「所有 d_i &gt; T」</text>

  <rect x="24" y="60" width="652" height="34" fill="#eef1f5" stroke="#9aa4b2" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="44" y="82" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例</text>
  <text x="126" y="82" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">T</text>
  <text x="190" y="82" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">阻碍者 → d_i</text>
  <text x="440" y="82" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">关键比较</text>
  <text x="588" y="82" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="24" y="100" width="652" height="48" fill="#f4f8ff" stroke="#c3d4ea" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="130" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">示例 1</text>
  <text x="126" y="130" font-size="11" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="190" y="130" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">(1,0)→2　(0,3)→2</text>
  <text x="440" y="130" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">2 &gt; 1，2 &gt; 1</text>
  <rect x="580" y="111" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="610" y="129" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">true</text>

  <rect x="24" y="156" width="652" height="48" fill="#fff7f8" stroke="#e6b8bc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="186" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">示例 2</text>
  <text x="126" y="186" font-size="11" fill="#8a3b38" filter="url(#rough2)">2</text>
  <text x="190" y="186" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">(1,0)→1</text>
  <text x="440" y="186" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">1 ≤ 2</text>
  <rect x="580" y="167" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="610" y="185" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">false</text>

  <rect x="24" y="212" width="652" height="48" fill="#fffdf5" stroke="#e8d3a0" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="44" y="242" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">示例 3</text>
  <text x="126" y="242" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="190" y="242" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(2,0)→1</text>
  <text x="440" y="242" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1 ≤ 1（同时到达）</text>
  <rect x="580" y="223" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="610" y="241" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">false</text>

  <text x="44" y="288" font-size="10" fill="#999" filter="url(#rough2)">↑ 示例 1 中你一步就到 (0,1)：两个阻碍者都要 2 步，谁都拦不住</text>
  <text x="44" y="308" font-size="10" fill="#999" filter="url(#rough2)">↑ 示例 2 中阻碍者在 (1,0)，正好卡在你与 (2,0) 之间，d = 1 &lt; T = 2</text>
  <text x="44" y="328" font-size="10" fill="#b85450" filter="url(#rough2)">↑ 示例 3 是临界情形：d = T，双方同时踩到 (1,0)，题目规定同时到达不算逃脱</text>

  <rect x="24" y="344" width="652" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="371" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">判定只需 O(n) 次曼哈顿距离计算；本例数值：T(示例1) = |0| + |1| = 1，故两个 2 都严格大于 1</text>
</svg>
