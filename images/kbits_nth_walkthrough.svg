<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="920" height="400" fill="#fafafa"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">示例走查：n = 4，k = 2 → 答案 9</text>
  <path d="M 300 42 Q 460 50 620 42" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- table header -->
  <rect x="42" y="64" width="580" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">b</text>
  <text x="113" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">rem</text>
  <text x="162" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">r</text>
  <text x="226" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">C(b,rem)</text>
  <text x="300" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">r &gt; C ?</text>
  <text x="417" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">动作</text>
  <text x="562" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">ans（二进制）</text>

  <!-- row separators -->
  <path d="M 42 94 L 622 94" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 42 148 L 622 148" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 42 202 L 622 202" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 42 256 L 622 256" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row b=3 (orange tint) -->
  <rect x="42" y="94" width="580" height="54" rx="3" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <text x="64" y="126" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="113" y="126" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="162" y="126" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="226" y="126" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="300" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">是</text>
  <text x="417" y="120" text-anchor="middle" font-size="11.5" fill="#333">填 1：r = 4−3 = 1，rem = 1</text>
  <text x="417" y="138" text-anchor="middle" font-size="10" fill="#888">跳过 0011/0101/0110 共 3 个</text>
  <text x="562" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">1000</text>

  <!-- row b=2 -->
  <text x="64" y="180" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="113" y="180" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="162" y="180" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="226" y="180" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="300" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">否</text>
  <text x="417" y="180" text-anchor="middle" font-size="11.5" fill="#333">填 0（1 ≤ 2，目标在 0 分支）</text>
  <text x="562" y="180" text-anchor="middle" font-size="12.5" fill="#333">1000</text>

  <!-- row b=1 -->
  <text x="64" y="234" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="113" y="234" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="162" y="234" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="226" y="234" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="300" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">否</text>
  <text x="417" y="234" text-anchor="middle" font-size="11.5" fill="#333">填 0（1 ≤ 1，恰好是最后一个）</text>
  <text x="562" y="234" text-anchor="middle" font-size="12.5" fill="#333">1000</text>

  <!-- row b=0 (orange tint) -->
  <rect x="42" y="256" width="580" height="54" rx="3" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <text x="64" y="288" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="113" y="288" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="162" y="288" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="226" y="288" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="300" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040">是</text>
  <text x="417" y="288" text-anchor="middle" font-size="11.5" fill="#333">填 1：rem = 0（低位放不下，强制）</text>
  <text x="562" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1001</text>

  <path d="M 42 310 L 622 310" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- right panel: candidates -->
  <rect x="650" y="64" width="240" height="234" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="770" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">4 位视图下的候选</text>

  <text x="672" y="118" font-size="12" fill="#999">0011 = 3</text>
  <text x="672" y="144" font-size="12" fill="#999">0101 = 5</text>
  <text x="672" y="170" font-size="12" fill="#999">0110 = 6</text>
  <path d="M 776 104 L 782 104 L 782 174 L 776 174" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="790" y="132" font-size="10.5" fill="#888">b=3 填 1</text>
  <text x="790" y="148" font-size="10.5" fill="#888">一步跳过</text>
  <text x="790" y="164" font-size="10.5" fill="#888">这 3 个</text>

  <text x="672" y="200" font-size="13" font-weight="bold" fill="#b85450">1001 = 9</text>
  <text x="786" y="200" font-size="11" font-weight="bold" fill="#b85450">◀ 答案</text>
  <text x="672" y="228" font-size="12" fill="#bbb">1010 = 10</text>
  <text x="672" y="254" font-size="12" fill="#bbb">1100 = 12</text>
  <text x="770" y="282" text-anchor="middle" font-size="10" fill="#888">（排在答案之后，无需考察）</text>

  <!-- result banner -->
  <rect x="650" y="314" width="240" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="770" y="343" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">ans = 1001₂ = 9 ✓</text>

  <!-- bottom note -->
  <text x="332" y="336" text-anchor="middle" font-size="11.5" fill="#666">循环结束时 r = 1、rem = 0：50 位前缀被唯一确定，</text>
  <text x="332" y="356" text-anchor="middle" font-size="11.5" fill="#666">且恰好放了 k = 2 个 1，即为第 n 小的数</text>
</svg>
