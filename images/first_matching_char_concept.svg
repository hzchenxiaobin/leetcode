<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/></marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a8edb"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：对撞双指针逐层向内</text>
  <path d="M 180 42 Q 320 52 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#r)"/>

  <!-- string boxes: a b c a c b d, indices 0..6 -->
  <g font-size="15" font-family="monospace" text-anchor="middle">
    <g filter="url(#r)"><rect x="150" y="66" width="48" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="174" y="94" fill="#2b4a6e" font-weight="bold">a</text>
    <g filter="url(#r)"><rect x="198" y="66" width="48" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
    <text x="222" y="94" fill="#2e6e2e" font-weight="bold">b</text>
    <g filter="url(#r)"><rect x="246" y="66" width="48" height="44" rx="6" fill="#fdfdfd" stroke="#999" stroke-width="1.2"/></g>
    <text x="270" y="94" fill="#777">c</text>
    <g filter="url(#r)"><rect x="294" y="66" width="48" height="44" rx="6" fill="#fdfdfd" stroke="#999" stroke-width="1.2"/></g>
    <text x="318" y="94" fill="#777">a</text>
    <g filter="url(#r)"><rect x="342" y="66" width="48" height="44" rx="6" fill="#fdfdfd" stroke="#999" stroke-width="1.2"/></g>
    <text x="366" y="94" fill="#777">c</text>
    <g filter="url(#r)"><rect x="390" y="66" width="48" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g>
    <text x="414" y="94" fill="#2e6e2e" font-weight="bold">b</text>
    <g filter="url(#r)"><rect x="438" y="66" width="48" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="462" y="94" fill="#2b4a6e" font-weight="bold">d</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" font-family="monospace">
    <text x="174" y="122">0</text><text x="222" y="122">1</text><text x="270" y="122">2</text>
    <text x="318" y="122">3</text><text x="366" y="122">4</text><text x="414" y="122">5</text><text x="462" y="122">6</text>
  </g>

  <!-- step 1: pointers at both ends, mismatch -->
  <g filter="url(#r)">
    <path d="M 120 150 Q 140 130 166 116" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 492 150 Q 472 130 446 116" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="174" y="156" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#r)">i=0: a ≠ d ✗</text>
  <text x="456" y="156" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" filter="url(#r)">同步内移一步 →</text>

  <!-- step 2: match at i=1, n-1-i=5 -->
  <g filter="url(#r)">
    <path d="M 200 176 Q 210 160 216 130" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <path d="M 414 176 Q 410 160 418 130" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <rect x="180" y="182" width="262" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#r)"/>
  <text x="311" y="202" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" filter="url(#r)">i=1: s[1]='b' == s[5]='b' ✓</text>
  <text x="311" y="220" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#r)">首次相等 → 返回 i = 1（最小下标）</text>

  <!-- middle self-match note -->
  <rect x="40" y="248" width="560" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="272" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#r)">奇数长度：i 走到中点时 i == n-1-i，字符必自匹配</text>
  <text x="320" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">例：&quot;abc&quot; → i=0: a≠c；i=1（中点）: b==b → 答案 1</text>

  <!-- summary -->
  <rect x="40" y="316" width="560" height="34" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1" filter="url(#r)"/>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#r)">只需检查前半段 i ∈ [0, ⌊n/2⌋]，时间 O(n)，空间 O(1)</text>
</svg>
