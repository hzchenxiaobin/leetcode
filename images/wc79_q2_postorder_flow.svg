<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">后序 DFS：先递归左右孩子，再决定要不要删</text>

  <!-- 主流程 -->
  <rect x="40" y="48" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="70" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">dfs(u)：子树里有没有 1？</text>

  <path d="M 155 82 L 155 106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="155,110 247,140 155,170 63,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="145" text-anchor="middle" font-size="12" fill="#a9761f" filter="url(#rough2)">u == null ?</text>
  <text x="262" y="132" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>
  <text x="167" y="184" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <path d="M 247 140 L 328 140" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="122" width="170" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="415" y="145" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <path d="M 155 170 L 155 192" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="192" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="214" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">l = dfs(u.left)</text>

  <path d="M 155 226 L 155 248" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="248" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="270" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">r = dfs(u.right)</text>

  <path d="M 155 282 L 155 304" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="304" width="230" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="326" text-anchor="middle" font-size="11.5" fill="#33604a" filter="url(#rough2)">if !l:  u.left = null</text>
  <text x="155" y="348" text-anchor="middle" font-size="11.5" fill="#33604a" filter="url(#rough2)">if !r:  u.right = null</text>

  <path d="M 155 362 L 155 384" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="384" width="230" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="407" text-anchor="middle" font-size="11.5" fill="#2b4a6f" filter="url(#rough2)">return u.val==1 || l || r</text>

  <path d="M 155 420 L 155 442" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="442" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="462" text-anchor="middle" font-size="11.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">pruneTree 入口</text>
  <text x="155" y="482" text-anchor="middle" font-size="11.5" fill="#a9761f" filter="url(#rough2)">return dfs(root) ? root : null</text>

  <!-- 右侧说明 -->
  <rect x="306" y="196" width="204" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="220" font-size="11.5" fill="#33604a" font-weight="bold" filter="url(#rough2)">为什么必须是后序？</text>
  <text x="316" y="244" font-size="11.5" fill="#333" filter="url(#rough2)">父节点的去留依赖孩子</text>
  <text x="316" y="266" font-size="11.5" fill="#333" filter="url(#rough2)">的结果，先序拿不到</text>
  <text x="316" y="288" font-size="10.5" fill="#666" filter="url(#rough2)">硬要反悔重扫 → O(n²)</text>
</svg>
