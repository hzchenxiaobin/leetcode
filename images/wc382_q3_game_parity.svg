<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：游戏长度恒为 x + y，胜负只看奇偶</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Alice stick figure -->
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.6" fill="none">
    <circle cx="55" cy="84" r="9"/>
    <line x1="55" y1="93" x2="55" y2="118"/>
    <line x1="42" y1="102" x2="68" y2="102"/>
    <line x1="55" y1="118" x2="45" y2="135"/>
    <line x1="55" y1="118" x2="65" y2="135"/>
  </g>
  <text x="55" y="155" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">Alice（先手）</text>

  <!-- Bob stick figure -->
  <g filter="url(#sk)" stroke="#c98a2b" stroke-width="1.6" fill="none">
    <circle cx="308" cy="84" r="9"/>
    <line x1="308" y1="93" x2="308" y2="118"/>
    <line x1="295" y1="102" x2="321" y2="102"/>
    <line x1="308" y1="118" x2="298" y2="135"/>
    <line x1="308" y1="118" x2="318" y2="135"/>
  </g>
  <text x="308" y="155" text-anchor="middle" font-size="12" fill="#c98a2b" font-weight="bold">Bob</text>

  <!-- row 1: x = 3 flowers -->
  <text x="180" y="68" text-anchor="middle" font-size="11" fill="#888">第一排 x = 3 朵</text>
  <g transform="translate(130,95)" filter="url(#sk)">
    <circle cx="0" cy="-7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="-7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="0" cy="7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle r="3.5" fill="#f6c85f" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <g transform="translate(180,95)" filter="url(#sk)">
    <circle cx="0" cy="-7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="-7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="0" cy="7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle r="3.5" fill="#f6c85f" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <g transform="translate(230,95)" filter="url(#sk)">
    <circle cx="0" cy="-7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="-7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="0" cy="7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle r="3.5" fill="#f6c85f" stroke="#c98a2b" stroke-width="1.2"/>
  </g>

  <!-- row 2: y = 2 flowers -->
  <text x="180" y="127" text-anchor="middle" font-size="11" fill="#888">第二排 y = 2 朵</text>
  <g transform="translate(155,150)" filter="url(#sk)">
    <circle cx="0" cy="-7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="-7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="0" cy="7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle r="3.5" fill="#f6c85f" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <g transform="translate(205,150)" filter="url(#sk)">
    <circle cx="0" cy="-7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="-7" cy="0" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle cx="0" cy="7" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <circle r="3.5" fill="#f6c85f" stroke="#c98a2b" stroke-width="1.2"/>
  </g>

  <!-- right annotation box -->
  <g filter="url(#sk)">
    <rect x="350" y="58" width="262" height="112" rx="10" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.5"/>
  </g>
  <text x="481" y="82" text-anchor="middle" font-size="12" fill="#5a4480">每次行动必须摘、且只能摘 1 朵</text>
  <text x="481" y="104" text-anchor="middle" font-size="12" fill="#5a4480">→ 总花数每步恰好 −1，游戏必然在</text>
  <text x="481" y="126" text-anchor="middle" font-size="12" fill="#5a4480">第 x + y 步结束，双方无计可施</text>
  <text x="481" y="154" text-anchor="middle" font-size="12.5" fill="#5a4480" font-weight="bold">胜者 = 摘走最后一朵花的玩家</text>

  <!-- move timeline -->
  <text x="52" y="192" font-size="12" fill="#666" font-weight="bold">行动序列（本例 x + y = 5）：</text>

  <g filter="url(#sk)">
    <rect x="52" y="205" width="88" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="96" y="224" text-anchor="middle" font-size="11" fill="#2b5d85">第 1 步</text>
  <text x="96" y="241" text-anchor="middle" font-size="12" fill="#2b5d85" font-weight="bold">Alice</text>

  <path d="M 142 227 L 160 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="164" y="205" width="88" height="44" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="208" y="224" text-anchor="middle" font-size="11" fill="#a06b1a">第 2 步</text>
  <text x="208" y="241" text-anchor="middle" font-size="12" fill="#a06b1a" font-weight="bold">Bob</text>

  <path d="M 254 227 L 272 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="276" y="205" width="88" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="224" text-anchor="middle" font-size="11" fill="#2b5d85">第 3 步</text>
  <text x="320" y="241" text-anchor="middle" font-size="12" fill="#2b5d85" font-weight="bold">Alice</text>

  <path d="M 366 227 L 384 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="388" y="205" width="88" height="44" rx="6" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="432" y="224" text-anchor="middle" font-size="11" fill="#a06b1a">第 4 步</text>
  <text x="432" y="241" text-anchor="middle" font-size="12" fill="#a06b1a" font-weight="bold">Bob</text>

  <path d="M 478 227 L 496 227" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="500" y="205" width="88" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="544" y="224" text-anchor="middle" font-size="11" fill="#2e6e2e">第 5 步</text>
  <text x="544" y="241" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">Alice ★</text>

  <text x="320" y="275" text-anchor="middle" font-size="11.5" fill="#888">共 x + y = 5 步 —— 步数与双方的任何选择无关</text>
  <text x="544" y="275" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">摘最后一朵 → 获胜！</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="30" y="300" width="580" height="98" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="328" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">Alice 行动所有奇数步（第 1、3、5、… 步）</text>
  <text x="320" y="354" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">Alice 获胜 ⟺ 第 x+y 步轮到 Alice ⟺ x + y 为奇数</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a">于是问题化归为：统计 [1,n]×[1,m] 中 x + y 为奇数的数对个数</text>
</svg>
