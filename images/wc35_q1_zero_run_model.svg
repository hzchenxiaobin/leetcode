<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="800" height="580" fill="#fafafa"/>

  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把花坛切成零段，每段容量 = ⌈(L−b)/2⌉</text>
  <path d="M 150 46 Q 400 54 650 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ================= 行 A：内部零段 ================= -->
  <text x="56" y="76" font-size="12.5" fill="#555" filter="url(#rough2)">① 内部零段：两端都是花，b = 2</text>

  <g filter="url(#rough2)">
    <rect x="56"  y="88" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="108" y="88" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="88" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="88" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="264" y="88" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="78"  y="117" text-anchor="middle" fill="#b85450">1</text>
    <text x="130" y="117" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="182" y="117" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="234" y="117" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="286" y="117" text-anchor="middle" fill="#b85450">1</text>
  </g>

  <!-- 零段下划线 -->
  <path d="M 110 140 L 254 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 110 140 L 110 134 M 254 140 L 254 134" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="182" y="160" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L = 3 个空格</text>

  <text x="330" y="105" font-size="12" fill="#444" filter="url(#rough2)">左邻 1 封死第 1 格，右邻 1 封死第 3 格</text>
  <text x="330" y="128" font-size="12" fill="#444" filter="url(#rough2)">只剩中间那格可种 → 容量 ⌈(3−2)/2⌉ = 1</text>

  <g filter="url(#rough2)">
    <rect x="640" y="90" width="118" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="699" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">最多 1 朵</text>

  <!-- ================= 行 B：边界零段 ================= -->
  <text x="56" y="196" font-size="12.5" fill="#555" filter="url(#rough2)">② 边界零段：只有一端有花，b = 1</text>

  <path d="M 48 208 L 48 252" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="22" y="278" font-size="11" fill="#d6a040" filter="url(#rough2)">边界</text>

  <g filter="url(#rough2)">
    <rect x="56"  y="208" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="208" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="208" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="15" font-weight="bold" filter="url(#rough2)">
    <text x="78"  y="237" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="130" y="237" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="182" y="237" text-anchor="middle" fill="#b85450">1</text>
  </g>

  <path d="M 58 260 L 152 260" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 58 260 L 58 254 M 152 260 L 152 254" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="105" y="280" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L = 2</text>

  <text x="330" y="225" font-size="12" fill="#444" filter="url(#rough2)">左端是数组边界 → 不算被封；右端被 1 封死</text>
  <text x="330" y="248" font-size="12" fill="#444" filter="url(#rough2)">第 2 格空了也没用（贴着花）→ 容量 ⌈(2−1)/2⌉ = 1</text>

  <g filter="url(#rough2)">
    <rect x="640" y="210" width="118" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="699" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">最多 1 朵</text>

  <!-- ================= 行 C：全零数组 ================= -->
  <text x="56" y="316" font-size="12.5" fill="#555" filter="url(#rough2)">③ 整体全零：两端都是边界，b = 0</text>

  <path d="M 48 328 L 48 372" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 208 328 L 208 372" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56"  y="328" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="108" y="328" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="328" width="44" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">
    <text x="78"  y="357" text-anchor="middle">0</text>
    <text x="130" y="357" text-anchor="middle">0</text>
    <text x="182" y="357" text-anchor="middle">0</text>
  </g>

  <!-- 可行的种植位置：0 和 2 -->
  <path d="M 78 320 L 78 384" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <path d="M 182 320 L 182 384" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="130" y="398" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">种在第 1、3 格（隔一格种一朵）</text>

  <text x="330" y="345" font-size="12" fill="#444" filter="url(#rough2)">没有花封路 → 隔一格种一朵最优</text>
  <text x="330" y="368" font-size="12" fill="#444" filter="url(#rough2)">容量 ⌈3/2⌉ = 2，正是 ⌈(3−0)/2⌉</text>

  <g filter="url(#rough2)">
    <rect x="640" y="330" width="118" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="699" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">最多 2 朵</text>

  <!-- ================= 公式框 ================= -->
  <g filter="url(#rough2)">
    <rect x="40" y="430" width="720" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 3"/>
  </g>
  <text x="60" y="458" font-size="13" font-weight="bold" fill="#8a5a10" filter="url(#rough2)">零段容量：cap(L, b) = ⌈(L − b) / 2⌉　（整数写法 (L − b + 1) // 2）</text>
  <text x="60" y="484" font-size="12" fill="#444" filter="url(#rough2)">L：这一段连续 0 的长度；b：该段两端中「紧挨着已种花」的端数，取 0 / 1 / 2。</text>
  <text x="60" y="508" font-size="12" fill="#444" filter="url(#rough2)">答案 = 所有零段容量之和 ≥ n ⇔ 能种满 n 朵：段与段之间恰好隔一朵花，互不干扰。</text>
  <text x="60" y="532" font-size="12" fill="#8f3a36" filter="url(#rough2)">⚠️ 贪心「能种就种、种后跳 2 格」得到的总数，恰好等于这个求和值。</text>
</svg>
