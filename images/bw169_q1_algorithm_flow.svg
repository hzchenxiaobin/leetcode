<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，一次减出答案</text>

  <rect x="150" y="52" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 nums（n 个元素）</text>

  <path d="M260,94 L260,124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="120" y="128" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">mx = max(nums)</text>
  <text x="260" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s = sum(nums)</text>

  <path d="M260,176 L260,206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="130" y="210" width="260" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = n * mx - s</text>

  <path d="M260,252 L260,278" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <text x="260" y="298" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <text x="110" y="140" font-size="11" fill="#999" filter="url(#rough2)">O(n)</text>
  <text x="110" y="226" font-size="11" fill="#999" filter="url(#rough2)">O(1)</text>
</svg>
