<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：count = 2 拒绝大矩形，count = 1 接受矮矩形</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: example 2 -->
  <text x="175" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">示例 2：候选被内部点击沉</text>
  <g filter="url(#sk)">
    <path d="M 60 320 L 60 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
    <path d="M 55 315 L 275 315" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
    <rect x="80" y="140" width="160" height="160" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="80" y="333">1</text>
    <text x="160" y="333">2</text>
    <text x="240" y="333">3</text>
    <text x="50" y="304" text-anchor="end">1</text>
    <text x="50" y="224" text-anchor="end">2</text>
    <text x="50" y="144" text-anchor="end">3</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="80" cy="300" r="6" fill="#555"/>
    <circle cx="240" cy="300" r="6" fill="#555"/>
    <circle cx="80" cy="140" r="6" fill="#555"/>
    <circle cx="240" cy="140" r="6" fill="#555"/>
    <circle cx="160" cy="220" r="7" fill="#b85450"/>
    <path d="M 153 213 L 167 227 M 167 213 L 153 227" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <text x="160" y="245" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">(2,2) 在区域内</text>
  <g filter="url(#sk)">
    <rect x="40" y="345" width="280" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="180" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">cnt = 5−2−2+1 = 2 ≠ 1 ✗</text>
  <text x="180" y="385" text-anchor="middle" font-size="11" fill="#333">唯一候选 [1,3]×[1,3] 被拒，返回 −1</text>

  <!-- right panel: example 3 -->
  <text x="505" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">示例 3：矮矩形通过（面积 2）</text>
  <g filter="url(#sk)">
    <path d="M 390 320 L 390 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
    <path d="M 385 315 L 605 315" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ax)"/>
    <rect x="410" y="220" width="160" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="410" y="140" width="160" height="80" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="6,5"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="410" y="333">1</text>
    <text x="490" y="333">2</text>
    <text x="570" y="333">3</text>
    <text x="380" y="304" text-anchor="end">1</text>
    <text x="380" y="224" text-anchor="end">2</text>
    <text x="380" y="144" text-anchor="end">3</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="410" cy="300" r="6" fill="#b85450"/>
    <circle cx="570" cy="300" r="6" fill="#555"/>
    <circle cx="410" cy="140" r="6" fill="#555"/>
    <circle cx="570" cy="140" r="6" fill="#555"/>
    <circle cx="410" cy="220" r="6" fill="#555"/>
    <circle cx="570" cy="220" r="7" fill="#446688"/>
  </g>
  <text x="582" y="215" font-size="11.5" fill="#446688" font-weight="bold">(3,2) = (x₂,y₂)</text>
  <text x="400" y="304" text-anchor="end" font-size="11.5" fill="#b85450" font-weight="bold">(1,1)</text>
  <g filter="url(#sk)">
    <rect x="380" y="345" width="280" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="520" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt = 4−2−2+1 = 1 ✓ 面积 2</text>
  <text x="520" y="385" text-anchor="middle" font-size="11" fill="#333">候选 [1,3]×[1,2]；[1,3]×[2,3]（虚线）对称合法</text>
</svg>
