<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="117" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：ans &gt; 1 的节点只在 node1 → 根 路径上</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- edges -->
  <g filter="url(#sk)">
    <line x1="288" y1="106" x2="185" y2="164" stroke="#999" stroke-width="1.4"/>
    <line x1="332" y1="106" x2="415" y2="164" stroke="#d6a040" stroke-width="2.6"/>
    <line x1="168" y1="204" x2="168" y2="250" stroke="#999" stroke-width="1.4"/>
    <line x1="415" y1="200" x2="355" y2="252" stroke="#d6a040" stroke-width="2.6"/>
    <line x1="449" y1="200" x2="497" y2="252" stroke="#999" stroke-width="1.4"/>
  </g>

  <!-- side-subtree dashed box around nodes 1,2 -->
  <g filter="url(#sk)">
    <rect x="126" y="152" width="84" height="142" rx="10" fill="none" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5 4"/>
  </g>
  <text x="168" y="318" text-anchor="middle" font-size="10.5" fill="#888">路径外：子树不含 1</text>
  <text x="168" y="332" text-anchor="middle" font-size="10.5" fill="#888">→ ans = 1（无需访问）</text>

  <!-- path-up arrows -->
  <path d="M 372 258 Q 405 230 443 204" stroke="#b8862b" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 455 164 Q 418 118 340 98" stroke="#b8862b" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="492" y="128" text-anchor="middle" font-size="10.5" fill="#8a5a10">沿路径向上：</text>
  <text x="492" y="142" text-anchor="middle" font-size="10.5" fill="#8a5a10">子树只增不减</text>

  <!-- nodes -->
  <g filter="url(#sk)">
    <ellipse cx="310" cy="92" rx="24" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <ellipse cx="168" cy="182" rx="24" ry="22" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
    <ellipse cx="432" cy="182" rx="24" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <ellipse cx="168" cy="272" rx="24" ry="22" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
    <ellipse cx="345" cy="272" rx="24" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="515" cy="272" rx="24" ry="22" fill="#f7f7f7" stroke="#999" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="310" y="89" font-size="14" font-weight="bold" fill="#2b5b8a">0</text>
    <text x="310" y="104" font-size="10" fill="#666">(5)</text>
    <text x="168" y="179" font-size="14" font-weight="bold" fill="#777">1</text>
    <text x="168" y="194" font-size="10" fill="#999">(4)</text>
    <text x="432" y="179" font-size="14" font-weight="bold" fill="#2b5b8a">3</text>
    <text x="432" y="194" font-size="10" fill="#666">(2)</text>
    <text x="168" y="269" font-size="14" font-weight="bold" fill="#777">2</text>
    <text x="168" y="284" font-size="10" fill="#999">(6)</text>
    <text x="345" y="269" font-size="14" font-weight="bold" fill="#a03a36">4</text>
    <text x="345" y="284" font-size="10" font-weight="bold" fill="#b85450">(1)</text>
    <text x="515" y="269" font-size="14" font-weight="bold" fill="#777">5</text>
    <text x="515" y="284" font-size="10" fill="#999">(3)</text>
  </g>
  <text x="345" y="240" text-anchor="middle" font-size="10.5" fill="#b85450">node1：值 1 唯一所在</text>

  <!-- ans chips -->
  <g filter="url(#sk)">
    <rect x="368" y="70" width="66" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="474" y="170" width="66" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="384" y="302" width="66" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="486" y="302" width="66" height="24" rx="6" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="401" y="87" fill="#2e6e2e">ans = 7</text>
    <text x="507" y="187" fill="#2e6e2e">ans = 4</text>
    <text x="417" y="319" fill="#2e6e2e">ans = 2</text>
    <text x="519" y="319" fill="#999">ans = 1</text>
  </g>

  <!-- observation cards -->
  <g filter="url(#sk)">
    <rect x="48" y="346" width="544" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b8a">观察① 值 1 全树唯一（互不相同）⟹ 子树含 1 ⟺ 在 node1→根 路径上</text>
  <text x="320" y="380" text-anchor="middle" font-size="10.5" fill="#4a6a8a">路径之外的所有节点 ans = 1 —— 全树只剩一条路径需要真正计算</text>
  <g filter="url(#sk)">
    <rect x="48" y="398" width="544" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">观察② 沿路径向上子树只增不减 ⟹ mex 单调不减</text>
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#4a7a3a">值域双指针 j 全程只前进、不回退，总推进 ≤ n+1</text>
  <g filter="url(#sk)">
    <rect x="48" y="450" width="544" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a10">观察③ 值 j 在子树(u) ⟺ tin[u] ≤ tin[pos[j]] ≤ tout[u]</text>
  <text x="320" y="484" text-anchor="middle" font-size="10.5" fill="#87663a">子树成员判定 = 两次时间戳比较，O(1) —— 无需维护任何集合</text>
</svg>
