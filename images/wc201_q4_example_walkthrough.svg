<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 7, cuts = [1, 3, 4, 5] → 16</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">加哨兵并排序得 c = [0, 1, 3, 4, 5, 7]，按区间长度 L = j − i 从小到大填表</text>

  <g filter="url(#rough2)">
    <text x="152" y="96" text-anchor="end" font-size="11" fill="#777">i ＼ j</text>
    <text x="192" y="96" text-anchor="middle" font-size="12" fill="#777">j=1</text>
    <text x="256" y="96" text-anchor="middle" font-size="12" fill="#777">j=2</text>
    <text x="320" y="96" text-anchor="middle" font-size="12" fill="#777">j=3</text>
    <text x="384" y="96" text-anchor="middle" font-size="12" fill="#777">j=4</text>
    <text x="448" y="96" text-anchor="middle" font-size="12" fill="#777">j=5</text>

    <text x="152" y="125" text-anchor="end" font-size="11" fill="#777">i=0</text>
    <rect x="162" y="106" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="192" y="127" text-anchor="middle" font-size="13" fill="#777">0</text>
    <rect x="226" y="106" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="256" y="127" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="290" y="106" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="320" y="127" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="354" y="106" width="60" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="384" y="127" text-anchor="middle" font-size="13" fill="#333">10</text>
    <rect x="418" y="106" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="448" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">16</text>

    <text x="152" y="161" text-anchor="end" font-size="11" fill="#777">i=1</text>
    <rect x="226" y="142" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="256" y="163" text-anchor="middle" font-size="13" fill="#777">0</text>
    <rect x="290" y="142" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="163" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="354" y="142" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="384" y="163" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="418" y="142" width="60" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="448" y="163" text-anchor="middle" font-size="13" fill="#333">12</text>

    <text x="152" y="197" text-anchor="end" font-size="11" fill="#777">i=2</text>
    <rect x="290" y="178" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="320" y="199" text-anchor="middle" font-size="13" fill="#777">0</text>
    <rect x="354" y="178" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="384" y="199" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="418" y="178" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="448" y="199" text-anchor="middle" font-size="13" fill="#333">6</text>

    <text x="152" y="233" text-anchor="end" font-size="11" fill="#777">i=3</text>
    <rect x="354" y="214" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="384" y="235" text-anchor="middle" font-size="13" fill="#777">0</text>
    <rect x="418" y="214" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="448" y="235" text-anchor="middle" font-size="13" fill="#333">3</text>

    <text x="152" y="269" text-anchor="end" font-size="11" fill="#777">i=4</text>
    <rect x="418" y="250" width="60" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="448" y="271" text-anchor="middle" font-size="13" fill="#777">0</text>

    <text x="506" y="112" font-size="12" font-weight="bold" fill="#555">颜色 = 长度 L</text>
    <rect x="502" y="126" width="14" height="14" rx="3" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    <text x="522" y="138" font-size="10.5" fill="#666">L=1：0（边界）</text>
    <rect x="502" y="150" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="522" y="162" font-size="10.5" fill="#666">L=2：3、3、2、3</text>
    <rect x="502" y="174" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="522" y="186" font-size="10.5" fill="#666">L=3：7、6、6</text>
    <rect x="502" y="198" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="522" y="210" font-size="10.5" fill="#666">L=4：10、12</text>
    <rect x="502" y="222" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="522" y="234" font-size="10.5" font-weight="bold" fill="#b85450">L=5：16 ← 答案</text>
    <text x="506" y="262" font-size="10.5" fill="#888">先算短区间，</text>
    <text x="506" y="280" font-size="10.5" fill="#888">长区间转移时</text>
    <text x="506" y="298" font-size="10.5" fill="#888">直接查表。</text>

    <rect x="40" y="300" width="600" height="96" rx="8" fill="#fff" stroke="#888" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="320" y="326" text-anchor="middle" font-size="12.5" fill="#333">dp[0][5] = 7 + min { dp[0][1]+dp[1][5], dp[0][2]+dp[2][5], dp[0][3]+dp[3][5], dp[0][4]+dp[4][5] }</text>
    <text x="320" y="352" text-anchor="middle" font-size="12.5" fill="#333">= 7 + min { 0+12, 3+6, 7+3, 10+0 } = 7 + <tspan fill="#b85450" font-weight="bold">9</tspan> = 16</text>
    <text x="320" y="378" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">最小值在 k = 2 取得 → 第一刀切在 c[2] = 3</text>

    <text x="40" y="428" font-size="12.5" font-weight="bold" fill="#446688">由 dp 回溯最优切割顺序：</text>

    <rect x="40" y="444" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">第 1 刀在 3 处</text>
    <text x="100" y="475" text-anchor="middle" font-size="11" fill="#b85450">花 7</text>
    <path d="M 164 462 C 172 462 178 462 184 462" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="190" y="444" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">第 2 刀在 5 处</text>
    <text x="250" y="475" text-anchor="middle" font-size="11" fill="#b85450">花 4</text>
    <path d="M 314 462 C 322 462 328 462 334 462" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="340" y="444" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="400" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">第 3 刀在 1 处</text>
    <text x="400" y="475" text-anchor="middle" font-size="11" fill="#b85450">花 3</text>
    <path d="M 464 462 C 472 462 478 462 484 462" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="490" y="444" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="550" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">第 4 刀在 4 处</text>
    <text x="550" y="475" text-anchor="middle" font-size="11" fill="#b85450">花 2</text>

    <text x="320" y="514" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d28">总成本 = 7 + 4 + 3 + 2 = 16</text>
    <text x="320" y="540" text-anchor="middle" font-size="11" fill="#888">逐级回溯：dp[0][5] 选 k=2（切 3），dp[2][5] 选 k=4（切 5），dp[0][2] 选 k=1（切 1），dp[2][4] 选 k=3（切 4）；等价顺序 [3, 1, 5, 4] 同样最优</text>
  </g>
</svg>
