<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：left = 6，right = 10</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数置位 → 查 20 位掩码 → 第 c 位是 1 才让 ans 加一</text>

  <g filter="url(#rough2)">
    <rect x="60" y="76" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="140" y="76" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="290" y="76" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="360" y="76" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="480" y="76" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>

    <text x="100" y="95" text-anchor="middle" font-size="11" fill="#2f3f5c">x</text>
    <text x="215" y="95" text-anchor="middle" font-size="11" fill="#2f3f5c">二进制</text>
    <text x="325" y="95" text-anchor="middle" font-size="11" fill="#2f3f5c">c</text>
    <text x="420" y="95" text-anchor="middle" font-size="11" fill="#2f3f5c">c 是质数？</text>
    <text x="510" y="95" text-anchor="middle" font-size="11" fill="#2f3f5c">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="104" width="480" height="34" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="138" width="480" height="34" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="172" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="60" y="206" width="480" height="34" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="240" width="480" height="34" fill="#f4faf5" stroke="#4a7a3a" stroke-width="1.2"/>

    <text x="100" y="126" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="215" y="126" text-anchor="middle" font-size="11.5" fill="#333">110</text>
    <text x="325" y="126" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="420" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a">是 ✓</text>
    <text x="510" y="126" text-anchor="middle" font-size="11.5" fill="#333">1</text>

    <text x="100" y="160" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="215" y="160" text-anchor="middle" font-size="11.5" fill="#333">111</text>
    <text x="325" y="160" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <text x="420" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a">是 ✓</text>
    <text x="510" y="160" text-anchor="middle" font-size="11.5" fill="#333">2</text>

    <text x="100" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">8</text>
    <text x="215" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">1000</text>
    <text x="325" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">1</text>
    <text x="420" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">否 ✗</text>
    <text x="510" y="194" text-anchor="middle" font-size="11.5" fill="#8a3a36">2</text>

    <text x="100" y="228" text-anchor="middle" font-size="11.5" fill="#333">9</text>
    <text x="215" y="228" text-anchor="middle" font-size="11.5" fill="#333">1001</text>
    <text x="325" y="228" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="420" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a">是 ✓</text>
    <text x="510" y="228" text-anchor="middle" font-size="11.5" fill="#333">3</text>

    <text x="100" y="262" text-anchor="middle" font-size="11.5" fill="#333">10</text>
    <text x="215" y="262" text-anchor="middle" font-size="11.5" fill="#333">1010</text>
    <text x="325" y="262" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="420" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a">是 ✓</text>
    <text x="510" y="262" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  </g>

  <path d="M 545 189 L 560 189" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="292" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="312" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">8 = 1000₂ 只有 1 个置位，而 1 不是质数 → 跳过，ans 停在 2</text>
  <text x="76" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">若把 1 当成质数，示例 1 会输出 5 —— 这是本题最常见的错因</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">换成 [10, 15]：1010 / 1011 / 1100 / 1101 / 1110 的 c ∈ {2, 3} 全命中，1111 的 c = 4 → 答案 5</text>
</svg>
