<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">余数序列：0 即答案，重复即死循环</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">R_L = (10·R_{L−1} + 1) mod k</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <text x="30.0" y="74.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 3： 1 → 2 → 0（3 步归零）</text>
  <rect x="60" y="88" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="113.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 134.0 108.0 L 176.0 108.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="88" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225.0" y="113.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 264.0 108.0 L 306.0 108.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="88" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="355.0" y="113.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="30.0" y="168.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">k = 2： 1 → 1 → 1 …（余数不变，永不归零）</text>
  <rect x="60" y="182" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="207.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 134.0 202.0 L 200.0 202.0 L 200.0 182.0 L 140.0 182.0" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="210.0" y="206.0" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">自环：R 恒为 1</text>
  <text x="30.0" y="252.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">余数只有 k 种 → 最多试 k 次就能判定</text>
  <rect x="30" y="270" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="291.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">k 是 2 或 5 的倍数 → 全 1 数为奇数且 ≡1 (mod 5)，必无解，可 O(1) 否决</text>
  <text x="40.0" y="307.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">k 与 10 互素 → 由欧拉定理必有解，迭代 k 次必遇 0</text>
  <text x="40.0" y="323.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">关键：只保留余数，不构造大整数（长度可达 10^5 位）</text>
</svg>
