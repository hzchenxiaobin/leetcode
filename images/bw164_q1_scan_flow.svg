<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">流程：逐位取模统计 → 线性扫描 10 个数字</text>
  <rect x="40" y="72" width="130" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="99.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n 逐位 % 10</text>
  <rect x="206" y="72" width="150" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="281.0" y="99.375" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cnt[d] += 1</text>
  <rect x="392" y="72" width="130" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457.0" y="99.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n /= 10</text>
  <rect x="556" y="72" width="110" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="611.0" y="99.375" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">n &gt; 0 ?</text>
  <path d="M 170 95 L 204 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 356 95 L 390 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 522 95 L 554 95" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 611 118 L 611 148 L 105 148 L 105 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">是 → 继续；否 → 进入挑选</text>
  <path d="M 611 148 L 611 196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="200" width="230" height="50" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545.0" y="229.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按 (cnt[d], d) 字典序取最小</text>
  <rect x="40" y="200" width="350" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 也要计入（n = 0 时输出 0）</text>
  <rect x="40" y="272" width="620" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">时间 O(log n)，空间 O(1)（10 个计数桶）</text>
</svg>
