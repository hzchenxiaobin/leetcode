<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [2, 0, 1, 3, 2]（答案 3）</text>

  <!-- ① 筛候选 -->
  <text x="40" y="52" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 筛候选（nums[i] ≤ i）</text>
  <rect x="40" y="62" width="320" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="108" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="195" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="305" y="79" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(v, u)</text>

  <rect x="40" y="86" width="320" height="24" fill="#fce4ec" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="110" width="320" height="24" fill="none" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="134" width="320" height="24" fill="none" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="158" width="320" height="24" fill="none" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="182" width="320" height="24" fill="none" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <path d="M76,62 L76,206" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <path d="M140,62 L140,206" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>
  <path d="M250,62 L250,206" stroke="#b8c4d6" stroke-width="1" filter="url(#rough2)"/>

  <text x="58" y="103" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="108" y="103" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="195" y="103" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2 &gt; 0 ✗</text>
  <text x="305" y="103" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">—（淘汰）</text>
  <text x="58" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="108" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="195" y="127" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ≤ 1 ✓</text>
  <text x="305" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="58" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="108" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="151" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 2 ✓</text>
  <text x="305" y="151" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="58" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="108" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="195" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3 ≤ 3 ✓</text>
  <text x="305" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 0)</text>
  <text x="58" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="108" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="199" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 ≤ 4 ✓</text>
  <text x="305" y="199" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 2)</text>

  <!-- ② 排序 -->
  <text x="400" y="52" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 排序：v ↑，同 v 按 u ↓</text>
  <rect x="400" y="62" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="464" y="62" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="528" y="62" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="592" y="62" width="56" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="83" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">(0,1)</text>
  <text x="492" y="83" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">(1,1)</text>
  <text x="556" y="83" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">(2,2)</text>
  <text x="620" y="83" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">(3,0)</text>
  <text x="510" y="118" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">u 序列 = [ 1, 1, 2, 0 ]</text>

  <!-- ③ tails 演变 -->
  <text x="400" y="150" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 最长不下降子序列（tails 演变）</text>
  <text x="400" y="174" font-size="11.5" fill="#333" filter="url(#rough2)">u=1 → tails = [1]（追加）</text>
  <text x="400" y="198" font-size="11.5" fill="#333" filter="url(#rough2)">u=1 → tails = [1, 1]（相等可接，追加）</text>
  <text x="400" y="222" font-size="11.5" fill="#333" filter="url(#rough2)">u=2 → tails = [1, 1, 2]（追加）</text>
  <text x="400" y="246" font-size="11.5" fill="#333" filter="url(#rough2)">u=0 → tails = [0, 1, 2]（替换首位，更优）</text>
  <rect x="400" y="262" width="248" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="524" y="284" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">长度 = 3 ⇒ 答案 3</text>

  <!-- ④ 还原方案 -->
  <text x="40" y="240" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 还原删除方案</text>
  <text x="40" y="264" font-size="12" fill="#333" filter="url(#rough2)">固定点链：(i=1, v=0) → (i=2, v=1) → (i=4, v=2)</text>

  <rect x="40" y="280" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="106" y="280" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="172" y="280" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="280" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="304" y="280" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="134" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="200" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="266" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="332" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <path d="M48,286 L88,312" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M88,286 L48,312" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M246,286 L286,312" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M286,286 L246,312" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="68" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="134" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="200" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="266" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="332" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=4</text>

  <path d="M200,344 L200,378" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="366" font-size="11.5" fill="#666" filter="url(#rough2)">删除 i=0、i=3，其余左移重排</text>

  <rect x="106" y="392" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="172" y="392" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="238" y="392" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="417" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="200" y="417" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="266" y="417" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="134" y="444" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">新下标 0</text>
  <text x="200" y="444" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">新下标 1</text>
  <text x="266" y="444" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">新下标 2</text>
  <text x="360" y="415" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部固定点 ✓</text>
</svg>
