<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：被删字符必然落在第一个失配对上</text>
  <text x="320" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">以 s = "abca"、奇中心 c = 1 为例</text>

  <!-- 字符串格子 -->
  <rect x="187" y="62" width="62" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="255" y="62" width="62" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="323" y="62" width="62" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="391" y="62" width="62" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="286" y="86" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="354" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">c</text>
  <text x="422" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="218" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="286" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="354" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="422" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>

  <!-- 失配对：红圈 + 双向箭头 + ≠ -->
  <ellipse cx="218" cy="80" rx="35" ry="25" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="354" cy="80" rx="35" ry="25" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M253,54 L279,54" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M319,54 L293,54" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="286" y="59" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="286" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第一个失配对 (l, r) = (0, 2)</text>

  <!-- 中心标记 -->
  <path d="M286,102 L286,124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="140" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">奇中心 c = 1，从 (1,1) 向外纯扩展</text>

  <!-- 观察三说明框 -->
  <rect x="70" y="152" width="500" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">k 若在失配对更外侧 → s[l]、s[r] 都保留在回文 p 中且互为对称对 → 必相等，矛盾；</text>
  <text x="320" y="184" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k 若在更内侧 → 扩展时早已跳过。⇒ k 必为 l 或 r：每个中心只需两个分支！</text>

  <!-- 分叉箭头 -->
  <path d="M320,192 Q210,206 170,210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,192 Q430,206 470,210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 删左分支 -->
  <rect x="36" y="214" width="270" height="180" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="236" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删左分支：k = l = 0</text>
  <rect x="66" y="248" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="112" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="158" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="204" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="268" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="132" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="178" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="224" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <line x1="70" y1="263" x2="102" y2="263" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="86" y="243" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删</text>
  <text x="171" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">跳过 s[0]，改比较 (−1, 2)</text>
  <text x="171" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">l = −1 越界 → 停止</text>
  <text x="171" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">候选 t = [0, 1]，长度 2</text>
  <text x="171" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（"ab" 删 a → "b" ✓，但不是最优）</text>

  <!-- 删右分支 -->
  <rect x="334" y="214" width="270" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="469" y="236" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">删右分支：k = r = 2 ✓</text>
  <rect x="364" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="410" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="456" y="248" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="502" y="248" width="40" height="30" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="430" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="476" y="268" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">c</text>
  <text x="522" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <line x1="460" y1="263" x2="492" y2="263" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="476" y="243" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删</text>
  <text x="469" y="300" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">跳过 s[2]，改比较 (0, 3)：a = a ✓</text>
  <text x="469" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">继续外扩 (−1, 4) 越界 → 停止</text>
  <text x="469" y="342" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">候选 t = [0, 3] = "abca"，长度 4</text>
  <text x="469" y="370" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">（删 c → "aba" 回文 ✓，即为答案）</text>

  <!-- 底部结论 -->
  <rect x="60" y="406" width="520" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="425" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">✓ 每个中心 = 一次纯扩展 + 失配处两个容错分支，O(n) 覆盖该中心全部准回文</text>
  <text x="320" y="445" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">✓ 纯回文本身也是候选：长度 ≥ 2 的回文删掉一个"靠中心"的字符仍是回文（引理 1）</text>
</svg>
