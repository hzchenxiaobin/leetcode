<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="415" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [5, 5, 4, 8]，k = 4</text>

  <!-- 数值行 -->
  <text x="62" y="73" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="100" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="170" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="310" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- 余数行 -->
  <text x="62" y="125" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">mod 4</text>
  <rect x="100" y="104" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="125" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="170" y="104" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="125" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="240" y="104" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="266" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="310" y="104" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 段括号 -->
  <path d="M100,146 C130,160 190,160 222,146" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="161" y="177" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段A：r = 1，L = 2</text>
  <path d="M240,146 C270,160 330,160 362,146" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="301" y="177" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">段B：r = 0，L = 2</text>

  <!-- 段A 结算 -->
  <rect x="428" y="52" width="190" height="94" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="523" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">段A 结算</text>
  <text x="523" y="90" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">d = 4 / gcd(1, 4) = 4</text>
  <text x="523" y="108" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">合法长度：1, 5, 9, …</text>
  <text x="523" y="130" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">段内最长 = 1</text>

  <!-- 段B 结算 -->
  <rect x="428" y="156" width="190" height="94" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="523" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段B 结算</text>
  <text x="523" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">d = 4 / gcd(0, 4) = 1</text>
  <text x="523" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">合法长度：1, 2, 3, …</text>
  <text x="523" y="234" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">段内最长 = 2</text>

  <!-- 验证 -->
  <rect x="40" y="264" width="280" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="284" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">[5, 5] ✗ 不是有韧性的</text>
  <text x="180" y="302" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">删除任意一个 5，剩下 5</text>
  <text x="180" y="320" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">5 mod 4 = 1 ≠ 0</text>
  <rect x="340" y="264" width="280" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[4, 8] ✓ 有韧性</text>
  <text x="480" y="302" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">删 4 剩 8，删 8 剩 4</text>
  <text x="480" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">8 mod 4 = 0，4 mod 4 = 0</text>

  <!-- 答案 -->
  <rect x="40" y="348" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="367" text-anchor="middle" font-size="13.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = max(1, 2) = 2</text>
  <text x="330" y="386" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">最长有韧性子数组为 [4, 8]</text>
</svg>
