<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：并查集分组 → 组内排序 → 顺序回填</text>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">回填的「下标升序」与排序的「字符升序」同向，才拿得到字典序最小</text>

  <rect x="92" y="76" width="278" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="231" y="107" text-anchor="middle" font-size="10.5" fill="#243b53" filter="url(#rough2)">1. 并查集：把每个 pairs[i] 当边做 union</text>
  <text x="392" y="107" font-size="9.5" fill="#446688" filter="url(#rough2)">O(m α(n))</text>

  <rect x="92" y="150" width="278" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="231" y="181" text-anchor="middle" font-size="10.5" fill="#274d22" filter="url(#rough2)">2. 分组：把 s[i] 塞进该分量的字符袋</text>
  <text x="392" y="181" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">O(n)</text>

  <rect x="92" y="224" width="278" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="231" y="255" text-anchor="middle" font-size="10.5" fill="#6b4e12" filter="url(#rough2)">3. 组内排序：每个字符袋升序排列</text>
  <text x="392" y="255" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">O(Σ k log k)</text>

  <rect x="92" y="298" width="278" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="231" y="329" text-anchor="middle" font-size="10.5" fill="#7a2f2b" filter="url(#rough2)">4. 回填：i 升序，取该袋的下一个字符</text>
  <text x="392" y="329" font-size="9.5" fill="#b85450" filter="url(#rough2)">O(n)</text>

  <path d="M 231 128 L 231 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 231 202 L 231 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 231 276 L 231 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="366" width="440" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">总时间 O(n log n + m α(n))，空间 O(n)</text>
  <text x="280" y="407" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">只有 26 种字母时，排序可换成计数，降到 O(n + 26·组数)</text>
</svg>
