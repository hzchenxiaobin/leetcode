<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 3 演算：全局计数器 + 隔位跳过</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">grid = [[1,2,3],[4,5,6],[7,8,9]]，n = 3（奇数）—— 取/跳跨行连续的陷阱在这一行暴露</text>

  <!-- column labels -->
  <text x="126" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="248" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="370" y="74" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">j=2</text>
  <!-- row labels -->
  <text x="44" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="44" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="44" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- ===== row 0: values 1(k0,keep) 2(k1,skip) 3(k2,keep) ===== -->
  <g filter="url(#rough2)"><rect x="70" y="80" width="112" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="126" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="140" y="85" width="36" height="17" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="158" y="97" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=0</text>

  <g filter="url(#rough2)"><rect x="192" y="80" width="112" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="248" y="124" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="262" y="85" width="36" height="17" rx="3" fill="#fafafa" stroke="#b85450" stroke-width="1"/></g>
  <text x="280" y="97" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">k=1</text>
  <path d="M 204 88 L 220 104 M 220 88 L 204 104" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="314" y="80" width="112" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="370" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="384" y="85" width="36" height="17" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="402" y="97" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=2</text>

  <!-- ===== row 1 (向左): 4(k5,skip) 5(k4,keep) 6(k3,skip) ===== -->
  <g filter="url(#rough2)"><rect x="70" y="152" width="112" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="126" y="196" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="140" y="157" width="36" height="17" rx="3" fill="#fafafa" stroke="#b85450" stroke-width="1"/></g>
  <text x="158" y="169" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">k=5</text>
  <path d="M 82 160 L 98 176 M 98 160 L 82 176" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="192" y="152" width="112" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="248" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="262" y="157" width="36" height="17" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="280" y="169" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=4</text>

  <g filter="url(#rough2)"><rect x="314" y="152" width="112" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="370" y="196" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="384" y="157" width="36" height="17" rx="3" fill="#fafafa" stroke="#b85450" stroke-width="1"/></g>
  <text x="402" y="169" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">k=3</text>
  <path d="M 326 160 L 342 176 M 342 160 L 326 176" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <!-- ===== row 2: 7(k6,keep) 8(k7,skip) 9(k8,keep) ===== -->
  <g filter="url(#rough2)"><rect x="70" y="224" width="112" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="126" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="140" y="229" width="36" height="17" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="158" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=6</text>

  <g filter="url(#rough2)"><rect x="192" y="224" width="112" height="62" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="248" y="268" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="262" y="229" width="36" height="17" rx="3" fill="#fafafa" stroke="#b85450" stroke-width="1"/></g>
  <text x="280" y="241" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">k=7</text>
  <path d="M 204 232 L 220 248 M 220 232 L 204 248" stroke="#b85450" stroke-width="2.2" stroke-linecap="round" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="314" y="224" width="112" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="370" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="384" y="229" width="36" height="17" rx="3" fill="#fafafa" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="402" y="241" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">k=8</text>

  <!-- ===== snake arrows ===== -->
  <path d="M 74 104 L 404 104" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 421 110 Q 428 140 421 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 414 176 L 82 176" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 79 184 Q 71 214 79 246" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 74 252 L 404 252" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== counter rule box ===== -->
  <g filter="url(#rough2)"><rect x="60" y="306" width="296" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="76" y="328" font-size="12" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">全局计数器 cnt</text>
  <text x="76" y="346" font-size="10.5" fill="#444" filter="url(#rough2)">每走一格 cnt+1——被跳过的格子也要 +1</text>
  <text x="76" y="363" font-size="10.5" fill="#444" filter="url(#rough2)">cnt 为偶 → 收集（绿）；cnt 为奇 → 跳过（粉）</text>
  <text x="76" y="378" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt 跨行连续，绝不随行重置！</text>

  <!-- ===== trap box ===== -->
  <g filter="url(#rough2)"><rect x="368" y="306" width="186" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="382" y="328" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">陷阱：n 为奇数时暴露</text>
  <text x="382" y="345" font-size="9.5" fill="#444" filter="url(#rough2)">行 1 从右端进来：6@k=3（跳）</text>
  <text x="382" y="361" font-size="9.5" fill="#444" filter="url(#rough2)">5@k=4（收）、4@k=5（跳）</text>
  <text x="382" y="377" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">按行重置会错收 6、4！</text>

  <!-- ===== result strip ===== -->
  <text x="70" y="424" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">result =</text>
  <g filter="url(#rough2)"><rect x="150" y="404" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="170" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="196" y="404" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="216" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="242" y="404" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="262" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="288" y="404" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="308" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="334" y="404" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="354" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">9</text>
  <text x="392" y="424" font-size="10" fill="#888" filter="url(#rough2)">长度 = ⌈mn/2⌉ = 5</text>
</svg>
