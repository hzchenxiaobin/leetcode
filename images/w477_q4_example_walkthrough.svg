<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [7, 4, 6]，S = 111₂，k = 3</text>

  <text x="24" y="56" font-size="11.5" fill="#555" filter="url(#rough2)">① 签名压缩（值 ⊆ S，按 b₄b₂b₁ 重编号）：</text>

  <rect x="44" y="66" width="106" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="97" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7 → 111</text>
  <rect x="170" y="66" width="106" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="223" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 → 100</text>
  <rect x="296" y="66" width="106" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="349" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 → 110</text>
  <text x="418" y="91" font-size="10" fill="#888" filter="url(#rough2)">桶计数</text>

  <text x="24" y="134" font-size="11.5" fill="#555" filter="url(#rough2)">② SOS 三轮逐位前缀和后，f[U] = #{sig ⊆ U}：</text>

  <rect x="52" y="144" width="50" height="40" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="77" y="161" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">000</text>
  <text x="77" y="177" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="108" y="144" width="50" height="40" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="161" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">001</text>
  <text x="133" y="177" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="164" y="144" width="50" height="40" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="189" y="161" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">010</text>
  <text x="189" y="177" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="220" y="144" width="50" height="40" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="161" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">011</text>
  <text x="245" y="177" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>
  <rect x="276" y="144" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="301" y="161" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">100</text>
  <text x="301" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="332" y="144" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="357" y="161" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">101</text>
  <text x="357" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="388" y="144" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="161" text-anchor="middle" font-size="9.5" fill="#8a6a30" filter="url(#rough2)">110</text>
  <text x="413" y="177" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="444" y="144" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="469" y="161" text-anchor="middle" font-size="9.5" fill="#8a6a30" filter="url(#rough2)">111</text>
  <text x="469" y="177" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">3</text>

  <text x="24" y="212" font-size="11.5" fill="#555" filter="url(#rough2)">③ 容斥展开（T = 要杀死的位列集合，f[T̄] = 不必删的自由元素数）：</text>

  <rect x="36" y="222" width="448" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">T（杀掉的列）</text>
  <text x="246" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">D_T（必删载体）</text>
  <text x="366" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f[T̄] 自由</text>
  <text x="446" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献</text>

  <rect x="36" y="248" width="448" height="24" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="265" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₁}</text>
  <text x="246" y="265" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7}</text>
  <text x="366" y="265" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="446" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+4</text>

  <rect x="36" y="272" width="448" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₂}</text>
  <text x="246" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 6}</text>
  <text x="366" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="446" y="289" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+2</text>

  <rect x="36" y="296" width="448" height="24" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₄}</text>
  <text x="246" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 4, 6}</text>
  <text x="366" y="313" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="36" y="320" width="448" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="337" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₁, b₂}</text>
  <text x="246" y="337" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 6}</text>
  <text x="366" y="337" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="446" y="337" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−2</text>

  <rect x="36" y="344" width="448" height="24" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="361" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₁, b₄}</text>
  <text x="246" y="361" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 4, 6}</text>
  <text x="366" y="361" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="361" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <rect x="36" y="368" width="448" height="24" fill="#f7f7f7" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="385" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₂, b₄}</text>
  <text x="246" y="385" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 4, 6}</text>
  <text x="366" y="385" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="385" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">−1</text>

  <rect x="36" y="392" width="448" height="24" fill="#ffffff" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="96" y="409" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{b₁, b₂, b₄}</text>
  <text x="246" y="409" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{7, 4, 6}</text>
  <text x="366" y="409" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="446" y="409" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="36" y="424" width="448" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="444" text-anchor="middle" font-size="12.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">合计 = 4 + 2 + 1 − 2 − 1 − 1 + 1 = 4 ✓ 与官方列举一一对应</text>
</svg>
