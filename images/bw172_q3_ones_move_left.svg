<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="290" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">交换条件 s[i]='0'、s[i+1]='1' ⇒ 1 只能向左走一格</text>

  <!-- 交换前 -->
  <text x="50" y="66" font-size="11" fill="#999" filter="url(#rough2)">交换前</text>
  <rect x="130" y="50" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="188" y="50" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="213" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="155" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i</text>
  <text x="213" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i+1</text>

  <!-- 箭头 -->
  <path d="M213,120 L160,120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="124" font-size="10" fill="#b85450" filter="url(#rough2)">1 左移</text>

  <!-- 交换后 -->
  <text x="50" y="160" font-size="11" fill="#999" filter="url(#rough2)">交换后</text>
  <rect x="130" y="144" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="155" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="188" y="144" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="213" y="171" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <!-- 可达性 -->
  <rect x="60" y="204" width="400" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">可达 ⟺ 第 j 个 1 的终位 p[j] ≤ 它的原位置 o[j]</text>
  <text x="260" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⟺ 每个前缀内「选中的位置数 ≥ 初始 1 的个数」</text>
  <text x="260" y="266" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1 之间不能互相越过，所以顺序永远保持</text>
</svg>
