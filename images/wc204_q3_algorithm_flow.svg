<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先验 0 天，再逐格验 1 天，其余必为 2 天</text>
  <path d="M 150 34 Q 280 40 410 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="190" y="42" width="180" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="61" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">flood fill 统计岛屿数 cnt</text>

  <path d="M 280 72 L 280 84" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><polygon points="195,116 280,86 365,116 280,146" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="280" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">cnt ≠ 1 ?</text>

  <path d="M 365 116 L 396 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="378" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)"><rect x="398" y="100" width="115" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="455" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 0</text>
  <text x="455" y="92" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">已 ≥ 2 座岛或全水</text>

  <path d="M 280 146 L 280 164" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="160" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)"><rect x="115" y="166" width="330" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="187" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">枚举每块陆地 v：临时置水，重新计数</text>

  <path d="M 280 200 L 280 216" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><polygon points="183,248 280,218 377,248 280,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="280" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">存在 v 使 cnt ≠ 1 ?</text>

  <path d="M 377 248 L 396 248" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="386" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)"><rect x="398" y="232" width="115" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="455" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">返回 1</text>
  <text x="455" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">v 是分裂点（割点）</text>

  <path d="M 280 278 L 280 296" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="292" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)"><rect x="90" y="298" width="380" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="280" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">返回 2 —— 上界引理保证 2 天必然足够</text>

  <g filter="url(#rough2)"><rect x="20" y="348" width="520" height="50" rx="8" fill="#fffdf3" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">复杂度：至多 mn 次单格尝试 × 每次 flood fill O(mn) → 总 O((mn)²)</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">m, n ≤ 30 时约 8.1 × 10⁵ 次格子访问，瞬间完成</text>
</svg>
