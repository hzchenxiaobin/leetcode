<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 496" width="840" height="496"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="496" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分块：每个 1 把前缀序列切成一段「常数块」</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">块的值由 1 的位置奇偶决定：偶数位 +1，奇数位 −1（模 3）</text>

  <!-- 上：k=2 的示意 -->
  <rect x="26" y="68" width="788" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="44" y="92" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两个 1 都放在偶数位 ⇒ 步长都是 +1 ⇒ 三块的值为 0、1、2，互不相同</text>

  <rect x="64" y="106" width="96" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="126" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">L₀ 个 · 值 0</text>
  <rect x="160" y="106" width="20" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="180" y="106" width="96" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="126" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">L₁ 个 · 值 1</text>
  <rect x="276" y="106" width="20" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="286" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="296" y="106" width="96" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="126" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">L₂ 个 · 值 2</text>

  <text x="410" y="126" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">⇒ 计数 (c₀,c₁,c₂) = (L₀, L₁, L₂)，L₀+L₁+L₂ = n+1</text>
  <text x="410" y="150" font-size="11.2" fill="#777" filter="url(#rough2)">三块三色 ⇒ L₀ 与 L₁ 都是偶数位 ⇒ 只能取偶数长度</text>

  <!-- 表头 -->
  <text x="40" y="190" font-size="12.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个 1 时的奇偶组合（p₁,p₂,p₃）</text>
  <text x="286" y="190" font-size="12.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">值走势</text>
  <text x="420" y="190" font-size="12.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同值合并</text>
  <text x="580" y="190" font-size="12.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三色计数</text>
  <text x="740" y="190" font-size="12.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可用？</text>

  <!-- 行 1 -->
  <rect x="26" y="198" width="788" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">偶偶偶 / 奇奇奇（全同）</text>
  <text x="286" y="222" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">0 → v → ~v → 0</text>
  <text x="420" y="222" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">{L₀,L₃},{L₁},{L₂}</text>
  <text x="580" y="222" font-size="11.6" fill="#2f4a66" filter="url(#rough2)">(L₀+L₃, L₁, L₂)</text>
  <text x="740" y="222" font-size="11.6" fill="#33582a" filter="url(#rough2)">可用</text>
  <text x="40" y="240" font-size="10.6" fill="#777" filter="url(#rough2)">v ≠ 0 且 v+1 ≠ 0，四块落在 0、v、~v、0</text>

  <!-- 行 2 -->
  <rect x="26" y="256" width="788" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="280" font-size="11.6" fill="#33582a" filter="url(#rough2)">偶偶奇 / 奇奇偶</text>
  <text x="286" y="280" font-size="11.6" fill="#33582a" filter="url(#rough2)">0 → v → ~v → v</text>
  <text x="420" y="280" font-size="11.6" fill="#33582a" filter="url(#rough2)">{L₀},{L₁,L₃},{L₂}</text>
  <text x="580" y="280" font-size="11.6" fill="#33582a" filter="url(#rough2)">(L₀, L₁+L₃, L₂)</text>
  <text x="740" y="280" font-size="11.6" fill="#33582a" filter="url(#rough2)">可用</text>
  <text x="40" y="298" font-size="10.6" fill="#777" filter="url(#rough2)">末步回退到第三块的值，L₁ 与 L₃ 合并</text>

  <!-- 行 3 -->
  <rect x="26" y="314" width="788" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="338" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">偶奇偶 / 奇偶奇</text>
  <text x="286" y="338" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">0 → v → 0 → v</text>
  <text x="420" y="338" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">{L₀,L₂},{L₁,L₃}</text>
  <text x="580" y="338" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">(L₀+L₂, L₁+L₃)</text>
  <text x="740" y="338" font-size="11.6" font-weight="bold" fill="#b85450" filter="url(#rough2)">只有两类 ✗</text>
  <text x="40" y="356" font-size="10.6" fill="#777" filter="url(#rough2)">来回摆动只用到两种颜色，第三类为空，浪费一类 ⇒ 弃</text>

  <!-- 行 4 -->
  <rect x="26" y="372" width="788" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="396" font-size="11.6" fill="#8a6015" filter="url(#rough2)">偶奇奇 / 奇偶偶</text>
  <text x="286" y="396" font-size="11.6" fill="#8a6015" filter="url(#rough2)">0 → v → 0 → ~v</text>
  <text x="420" y="396" font-size="11.6" fill="#8a6015" filter="url(#rough2)">{L₀,L₂},{L₁},{L₃}</text>
  <text x="580" y="396" font-size="11.6" fill="#8a6015" filter="url(#rough2)">(L₀+L₂, L₁, L₃)</text>
  <text x="740" y="396" font-size="11.6" fill="#33582a" filter="url(#rough2)">可用</text>
  <text x="40" y="414" font-size="10.6" fill="#777" filter="url(#rough2)">前三块回到 0，第四块停在新颜色：L₀ 与 L₂ 合并</text>

  <!-- 底部结论 -->
  <rect x="26" y="432" width="788" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="456" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块长 ↔ 位置：p₁ = L₀，p₂ = L₀+L₁，p₃ = L₀+L₁+L₂；这同时钉死了每步的方向</text>
  <text x="46" y="476" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">于是「构造」＝「选一个形状 + 选一组满足奇偶的块长」，让三类计数落进 {q, q+1}。</text>
</svg>
