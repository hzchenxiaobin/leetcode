<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：与 start 距离为 d 的下标只有 start−d 和 start+d</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按 d 从小到大逐层扩散，首达 target 即最小距离（nums=[1,2,3,4,5], target=5, start=3）</text>

  <!-- d=0 层说明 -->
  <rect x="234" y="56" width="148" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="71" text-anchor="middle" font-size="11" fill="#b27a10" filter="url(#rough2)">d=0：nums[3] = 4 ✗</text>
  <path d="M 308 146 L 308 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- d=1 双向扩散弧 -->
  <path d="M 302 144 Q 274 104 248 144" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 314 144 Q 342 104 368 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="308" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d=1</text>

  <!-- 数组格子 -->
  <rect x="100" y="150" width="56" height="44" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="150" width="56" height="44" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="150" width="56" height="44" rx="4" fill="#fdfdfd" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="150" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="340" y="150" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="248" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="308" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="368" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>

  <!-- 下标行 -->
  <text x="128" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下标 0</text>
  <text x="188" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="248" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="308" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="368" y="212" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <!-- start / 命中标注 -->
  <text x="308" y="228" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">↑ start</text>
  <text x="368" y="228" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">↑ 命中</text>

  <!-- 右侧结果框 -->
  <rect x="404" y="150" width="108" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ nums[4] = 5</text>
  <text x="458" y="186" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">答案 |4−3| = 1</text>

  <!-- 底部说明框 -->
  <rect x="40" y="252" width="440" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">为什么首达即最近？—— 与 BFS 按层扩展同构</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按 d 递增逐层检查，距离 &lt; d 的下标已全部排除，首次命中必在最小层</text>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[start] = target 时 d=0 即 O(1) 返回；线性扫描则必须扫完整个数组</text>
</svg>
