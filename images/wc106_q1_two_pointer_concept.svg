<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="336" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">错位互换：一次 swap 同时修好两个下标</text>
  <text x="60" y="66" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">nums = [4, 2, 5, 7]，下标 0..3</text>
  <rect x="120" y="84" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="152" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0</text>
  <rect x="210" y="84" width="64" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="242" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下标 1</text>
  <rect x="300" y="84" width="64" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="332" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下标 2</text>
  <rect x="390" y="84" width="64" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422.0" y="108.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <text x="422" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 3</text>
  <text x="330" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">i 扫偶数下标，发现 nums[2] = 5（奇）→ 位置错</text>
  <text x="330" y="212" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">j 扫奇数下标，发现 nums[1] = 2（偶）→ 位置错</text>
  <path d="M 404 122 Q 330 66 236 122" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="250" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">swap(nums[2], nums[1])：两处错位一起消失</text>
  <text x="330" y="282" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">→ [4, 5, 2, 7]：偶数在偶数位、奇数在奇数位</text>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">题目保证「一半偶数、一半奇数」，所以错位的偶/奇位置数量必然相等，总能两两配对</text>
</svg>
