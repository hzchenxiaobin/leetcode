<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">停机规则：前后缀长度可以不相等！</text>

  <!-- 左半：aaa → 0 -->
  <text x="130" y="66" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">s = "aaa"</text>
  <g>
    <rect x="70" y="80" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="106" y="80" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="142" y="80" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="88" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="124" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="160" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  </g>
  <text x="130" y="140" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">取前缀 "aa"（下标 0,1）</text>
  <text x="130" y="158" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">取后缀 "a"（下标 2），不相交</text>
  <path d="M124,168 Q124,190 124,206" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="80" y="212" width="90" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 0</text>
  <rect x="42" y="272" width="180" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="132" y="296" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">整段同字符（无论奇偶长度）</text>
  <text x="132" y="318" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">左右两刀可直接删光 → 0</text>

  <line x1="260" y1="60" x2="260" y2="330" stroke="#ddd" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 右半：aba → 1 -->
  <text x="390" y="66" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">s = "aba"</text>
  <g>
    <rect x="330" y="80" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="366" y="80" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="402" y="80" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="348" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
    <text x="384" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
    <text x="420" y="104" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  </g>
  <text x="390" y="140" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">剥掉两端的 a 后</text>
  <text x="390" y="158" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">只剩孤零零的 "b"</text>
  <path d="M384,168 Q384,190 384,206" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="212" width="90" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 1</text>
  <rect x="298" y="272" width="184" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="296" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">单字符：前缀后缀必相交，</text>
  <text x="390" y="318" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">删不动 → 剩 1 个</text>
</svg>
