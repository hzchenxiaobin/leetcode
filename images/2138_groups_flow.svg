<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：步长 k 切片 + 末组按需填充</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="250" y="58" width="180" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">i = 0, res = [ ]</text>
  <path d="M 340 92 L 340 110" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="340,112 428,148 340,184 252,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="monospace">i &lt; n ?</text>
  <text x="446" y="140" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 428 148 L 500 148" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="504" y="130" width="120" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="564" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 res</text>
  <text x="348" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 340 184 L 340 204" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- slice box -->
  <g filter="url(#sk)">
    <rect x="205" y="208" width="270" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="231" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">g = s[ i : i+k ]（越界自动截断）</text>
  <path d="M 340 244 L 340 262" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="340,264 436,300 340,336 244,300" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" font-family="monospace">len(g) &lt; k ?</text>
  <text x="452" y="292" font-size="11" fill="#b85450" font-weight="bold">是（末组）</text>
  <path d="M 436 300 L 486 300" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="490" y="282" width="176" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="578" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" font-family="monospace">g += fill × (k−len)</text>
  <path d="M 578 318 Q 578 362 462 366" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="350" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M 340 336 L 340 356" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- append box -->
  <g filter="url(#sk)">
    <rect x="222" y="360" width="240" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="342" y="383" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">res.append(g)；i += k</text>

  <!-- loop back -->
  <path d="M 222 378 Q 130 378 128 240 Q 126 160 244 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="112" y="268" font-size="10.5" fill="#888" text-anchor="middle">步长 +k</text>
  <text x="112" y="282" font-size="10.5" fill="#888" text-anchor="middle">回到判定</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="48" y="412" width="584" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">预补齐版：先 s += fill × (−n mod k) 一次补成 k 的整倍数，循环内零分支</text>
  <text x="340" y="447" text-anchor="middle" font-size="11" fill="#444">Python 最短版：[ s[i:i+k].ljust(k, fill) for i in range(0, n, k) ]</text>
</svg>
