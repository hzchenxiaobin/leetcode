<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="18" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按对角线编号 d 逐条输出</text>

  <rect x="150" y="32" width="240" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="56" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">mat：m 行 n 列</text>

  <path d="M 270 70 V 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="94" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">for d = 0 … m + n − 2</text>

  <path d="M 270 132 V 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="156" width="276" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">lo = max(0, d − (n − 1))</text>
  <text x="270" y="200" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">hi = min(m − 1, d)</text>

  <path d="M 270 212 V 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,230 352,264 270,298 188,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="11" fill="#8a5a20" filter="url(#rough2)">d 是偶数？</text>

  <path d="M 188 264 H 110 V 318" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 352 264 H 430 V 318" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="168" y="256" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="372" y="256" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="20" y="320" width="200" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="344" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i = hi, hi − 1, …, lo</text>
  <text x="120" y="366" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">ans.push(mat[i][d − i])</text>

  <rect x="320" y="320" width="200" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="344" text-anchor="middle" font-size="10.5" fill="#8a4040" filter="url(#rough2)">i = lo, lo + 1, …, hi</text>
  <text x="420" y="366" text-anchor="middle" font-size="10.5" fill="#8a4040" filter="url(#rough2)">ans.push(mat[i][d − i])</text>

  <path d="M 120 384 V 404 H 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 384 V 404 H 278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 404 V 420" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="186" y="422" width="168" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="446" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="112" y="424" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">时间 O(m·n)</text>
  <text x="112" y="442" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">额外空间 O(1)</text>
  <text x="270" y="474" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">每格只被 push 一次；循环体内无重复扫描</text>
</svg>
