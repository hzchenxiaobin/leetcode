<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">贪心：x 从 n 递减，能取就取（n=3, D=3）</text>

  <!-- 三个待选格 -->
  <text x="72" y="70" font-size="11" fill="#999" filter="url(#rough2)">候选 x</text>
  <rect x="60" y="80" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="132" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="162" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="204" y="80" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="234" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <text x="90" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 ≤ 3 取</text>
  <text x="162" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2 ≤ 0 跳过</text>
  <text x="234" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1 ≤ 0 跳过</text>

  <!-- D 变化 -->
  <rect x="300" y="72" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="385" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">D: 3 → 0</text>
  <text x="385" y="114" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">恰好归零</text>

  <!-- 结论 -->
  <rect x="60" y="164" width="410" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="265" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取负集合 N = {3}，和 = 3 = D ✓</text>
  <text x="265" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">连续整数面额保证「不会凑不出」，D 必归零</text>

  <!-- 占位不变式 -->
  <rect x="60" y="224" width="410" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="265" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不变式：处理 x 时 0 ≤ D ≤ x(x+1)/2，取完 x 后 D ≤ x(x−1)/2</text>

  <path d="M265,268 L265,288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrE)" filter="url(#rough2)"/>
  <text x="265" y="308" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">为什么从大往小？→ 让最大的负数尽量大 ⇒ 字典序最小</text>
</svg>
