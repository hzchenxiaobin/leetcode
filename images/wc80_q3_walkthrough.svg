<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">演算：s = "(0123)"，t = "0123"</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 个切点 × 两侧形态的笛卡尔积</text>

  <rect x="47" y="64" width="466" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">切点 i</text>
  <text x="169" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">左段 → 形态</text>
  <text x="333" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">右段 → 形态</text>
  <text x="454" y="84" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">条数</text>

  <rect x="47" y="94" width="466" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="169" y="130" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"0" → {0}</text>
  <text x="333" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"123" →</text>
  <text x="333" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{123, 1.23, 12.3}</text>
  <text x="454" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3</text>

  <rect x="47" y="156" width="466" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="169" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"01" → {0.1}</text>
  <text x="333" y="184" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"23" →</text>
  <text x="333" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{23, 2.3}</text>
  <text x="454" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="47" y="218" width="466" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="169" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"012" → {0.12}</text>
  <text x="333" y="246" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"3" →</text>
  <text x="333" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="454" y="254" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="47" y="292" width="466" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="63" y="314" font-size="10" fill="#8a3a36" filter="url(#rough2)">"01"：整数形式因首位 '0' 被否，k = 1 的 "0.1" 末位非零 ⇒ 只剩 1 种</text>
  <text x="63" y="336" font-size="10" fill="#8a3a36" filter="url(#rough2)">"012"：k = 2 时整数部 "01" 前导零 ⇒ 只剩 k = 1 的 "0.12"</text>

  <rect x="47" y="360" width="466" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="63" y="382" font-size="10.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">共 3 + 2 + 1 = 6 个：</text>
  <text x="200" y="382" font-size="10" fill="#333" filter="url(#rough2)">(0, 123) (0, 1.23) (0, 12.3) (0.1, 23) (0.1, 2.3) (0.12, 3)</text>
  <text x="63" y="402" font-size="9.5" fill="#777" filter="url(#rough2)">与官方 6 个输出完全一致（顺序任意）</text>
</svg>
