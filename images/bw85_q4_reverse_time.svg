<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="27" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">时间倒流：删除序列逆转成“点亮”，段只合不分</text>

  <!-- 正向时间轴 -->
  <text x="70" y="66" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">正向时间：删除（段会分裂，难维护）</text>
  <path d="M 90 96 L 470 96" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#b85450" text-anchor="middle">
    <circle cx="130" cy="96" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="130" y="120">删 q₀</text>
    <circle cx="230" cy="96" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="230" y="120">删 q₁</text>
    <circle cx="330" cy="96" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="330" y="120">删 q₂</text>
    <circle cx="430" cy="96" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="430" y="120">删 qₙ₋₁</text>
  </g>
  <!-- 分裂示意 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="140" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="150" y="140" width="12" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="2"/>
    <rect x="276" y="140" width="34" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="2"/>
    <text x="240" y="158" fill="#1a2b45">一个整段</text>
    <path d="M 318 153 L 358 153" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="362" y="140" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="434" y="140" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="392" y="158" fill="#1a2b45">左段</text>
    <text x="464" y="158" fill="#1a2b45">右段</text>
  </g>
  <text x="310" y="188" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">一次删除可能把一段劈成两半：分裂方向不定、最大值会“消失”</text>

  <!-- 分隔 -->
  <path d="M 90 210 L 470 210" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 逆向时间轴 -->
  <text x="70" y="240" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">逆向时间：添加（段只合并，并查集主场）</text>
  <path d="M 470 270 L 90 270" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <circle cx="430" cy="270" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="430" y="294">点亮 qₙ₋₁</text>
    <circle cx="330" cy="270" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="330" y="294">点亮 qₙ₋₂</text>
    <circle cx="230" cy="270" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="230" y="294">点亮 q₂</text>
    <circle cx="130" cy="270" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="130" y="294">点亮 q₁、q₀</text>
  </g>

  <!-- 合并示意 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="316" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="316" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="258" y="316" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="180" y="334" fill="#1a2b45">左段</text>
    <text x="234" y="334" fill="#1d3a17" font-weight="bold">p</text>
    <text x="288" y="334" fill="#1a2b45">右段</text>
    <path d="M 340 329 L 380 329" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
    <rect x="384" y="316" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="439" y="334" fill="#1d3a17">新段 = 三合一</text>
  </g>
  <text x="310" y="364" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">激活 p 时只看 p−1、p+1 是否已存活：至多两次 union，新段和 = 三段相加</text>

  <!-- 关键结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="376" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="394" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">红利：段和被合并结果覆盖、best 单调不减 → 一个变量即可维护最大值</text>
</svg>
