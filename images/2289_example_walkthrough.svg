<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="680" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：三轮删除 与 每元素被删轮次 r[i]</text>
  <path d="M 200 42 Q 440 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 上半：逐轮模拟 ===== -->
  <text x="80" y="78" font-size="13" font-weight="bold" fill="#2b2b2b">逐轮模拟（红色 = 本轮被删，判定基于本轮开始时的快照）：</text>

  <!-- 第 1 轮 原数组 11 个 -->
  <text x="80" y="112" font-size="12.5" fill="#666">第 1 轮</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="140" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="163" y="114" fill="#2e6e2e">5</text>
    <rect x="190" y="92" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="213" y="114" fill="#8c3a36">3</text>
    <rect x="240" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="263" y="114" fill="#2e6e2e">4</text>
    <rect x="290" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="313" y="114" fill="#2e6e2e">4</text>
    <rect x="340" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="363" y="114" fill="#2e6e2e">7</text>
    <rect x="390" y="92" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="413" y="114" fill="#8c3a36">3</text>
    <rect x="440" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="463" y="114" fill="#2e6e2e">6</text>
    <rect x="490" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="513" y="114" fill="#2e6e2e">11</text>
    <rect x="540" y="92" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="563" y="114" fill="#8c3a36">8</text>
    <rect x="590" y="92" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="613" y="114" fill="#8c3a36">5</text>
    <rect x="640" y="92" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="663" y="114" fill="#2e6e2e">11</text>
  </g>
  <text x="716" y="114" font-size="12" fill="#888">→</text>
  <text x="740" y="114" font-size="12" fill="#666">删 4 个</text>

  <path d="M 440 134 Q 446 142 452 134" stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 第 2 轮 7 个 -->
  <text x="80" y="172" font-size="12.5" fill="#666">第 2 轮</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="140" y="152" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="163" y="174" fill="#2e6e2e">5</text>
    <rect x="190" y="152" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="213" y="174" fill="#8c3a36">4</text>
    <rect x="240" y="152" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="263" y="174" fill="#2e6e2e">4</text>
    <rect x="290" y="152" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="313" y="174" fill="#2e6e2e">7</text>
    <rect x="340" y="152" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="363" y="174" fill="#8c3a36">6</text>
    <rect x="390" y="152" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="413" y="174" fill="#2e6e2e">11</text>
    <rect x="440" y="152" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="463" y="174" fill="#2e6e2e">11</text>
  </g>
  <text x="516" y="174" font-size="12" fill="#888">→</text>
  <text x="540" y="174" font-size="12" fill="#666">删 2 个</text>

  <!-- 第 3 轮 5 个 -->
  <text x="80" y="232" font-size="12.5" fill="#666">第 3 轮</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="140" y="212" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="163" y="234" fill="#2e6e2e">5</text>
    <rect x="190" y="212" width="46" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/><text x="213" y="234" fill="#8c3a36">4</text>
    <rect x="240" y="212" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="263" y="234" fill="#2e6e2e">7</text>
    <rect x="290" y="212" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="313" y="234" fill="#2e6e2e">11</text>
    <rect x="340" y="212" width="46" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="363" y="234" fill="#2e6e2e">11</text>
  </g>
  <text x="416" y="234" font-size="12" fill="#888">→</text>
  <text x="440" y="234" font-size="12" fill="#666">删 1 个</text>

  <!-- 终态 -->
  <text x="80" y="292" font-size="12.5" fill="#666">终态</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="140" y="272" width="46" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/><text x="163" y="294" fill="#2b6e9e">5</text>
    <rect x="190" y="272" width="46" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/><text x="213" y="294" fill="#2b6e9e">7</text>
    <rect x="240" y="272" width="46" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/><text x="263" y="294" fill="#2b6e9e">11</text>
    <rect x="290" y="272" width="46" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/><text x="313" y="294" fill="#2b6e9e">11</text>
  </g>
  <text x="360" y="294" font-size="12" fill="#2e6e2e">✓ 非递减，共 3 轮</text>

  <!-- 分隔 -->
  <path d="M 80 330 Q 440 338 800 330" stroke="#c9c4b8" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- ===== 下半：r 值 ===== -->
  <text x="80" y="362" font-size="13" font-weight="bold" fill="#2b2b2b">单调栈一趟算出的被删轮次 r[i]（0 = 永不删，颜色越深轮次越晚）：</text>

  <!-- 值行 -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="163" y="392" fill="#333">5</text><text x="213" y="392" fill="#333">3</text><text x="263" y="392" fill="#333">4</text>
    <text x="313" y="392" fill="#333">4</text><text x="363" y="392" fill="#333">7</text><text x="413" y="392" fill="#333">3</text>
    <text x="463" y="392" fill="#333">6</text><text x="513" y="392" fill="#333">11</text><text x="563" y="392" fill="#333">8</text>
    <text x="613" y="392" fill="#333">5</text><text x="663" y="392" fill="#333">11</text>
  </g>
  <text x="80" y="392" font-size="11.5" fill="#888">nums[i]</text>

  <!-- r 行（颜色按轮次分层：0 绿、1 浅蓝、2 中蓝、3 红） -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="140" y="404" width="46" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="163" y="430" fill="#2e6e2e">0</text>
    <rect x="190" y="404" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/><text x="213" y="430" fill="#2b6e9e">1</text>
    <rect x="240" y="404" width="46" height="40" rx="5" fill="#cfe3f8" stroke="#3a78c4" stroke-width="1.6" filter="url(#sk)"/><text x="263" y="430" fill="#1d5a9e">2</text>
    <rect x="290" y="404" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/><text x="313" y="430" fill="#8c3a36">3</text>
    <rect x="340" y="404" width="46" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="363" y="430" fill="#2e6e2e">0</text>
    <rect x="390" y="404" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/><text x="413" y="430" fill="#2b6e9e">1</text>
    <rect x="440" y="404" width="46" height="40" rx="5" fill="#cfe3f8" stroke="#3a78c4" stroke-width="1.6" filter="url(#sk)"/><text x="463" y="430" fill="#1d5a9e">2</text>
    <rect x="490" y="404" width="46" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="513" y="430" fill="#2e6e2e">0</text>
    <rect x="540" y="404" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/><text x="563" y="430" fill="#2b6e9e">1</text>
    <rect x="590" y="404" width="46" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/><text x="613" y="430" fill="#2b6e9e">1</text>
    <rect x="640" y="404" width="46" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/><text x="663" y="430" fill="#2e6e2e">0</text>
  </g>
  <text x="80" y="430" font-size="11.5" fill="#888">r[i]</text>

  <!-- max 框 -->
  <path d="M 313 444 L 313 470" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <rect x="220" y="474" width="200" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="320" y="494" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a36">答案 = max r[i] = 3</text>
  <text x="320" y="511" text-anchor="middle" font-size="10.5" fill="#888">下标 3 的第二个 4 最晚被删</text>

  <!-- 对照说明 -->
  <rect x="480" y="466" width="320" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="640" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">逐行对照模拟：</text>
  <text x="640" y="514" text-anchor="middle" font-size="12" fill="#333">r=1 的 {3,3,8,5} 恰在第 1 轮被删</text>
  <text x="640" y="534" text-anchor="middle" font-size="12" fill="#333">r=2 的 {4,6} 在第 2 轮、r=3 的 {4} 在第 3 轮</text>
  <text x="640" y="554" text-anchor="middle" font-size="12" fill="#333">r=0 的 {5,7,11,11} 正是终态存活者</text>
  <text x="640" y="574" text-anchor="middle" font-size="11.5" fill="#888">每轮删的就是 r 等于该轮号的那一批</text>

  <!-- 底部结论 -->
  <rect x="80" y="600" width="720" height="60" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="626" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">一轮 = 删掉一批 r 值相同的元素，总轮数 = r 的最大值</text>
  <text x="440" y="648" text-anchor="middle" font-size="12" fill="#333">于是「求操作数」⟶「求每个元素的被删轮次再取 max」—— 单调栈一趟完成</text>
</svg>
