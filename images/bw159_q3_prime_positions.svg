  <text x="195.0" y="243.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="240" y="226" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275.0" y="243.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">✓</text>
  <rect x="310" y="226" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="243.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">首尾恰为这两个质数的子数组：1 个</text>
  <rect x="40" y="252" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="269.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">[3,5]</text>
  <rect x="150" y="252" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195.0" y="269.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="240" y="252" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275.0" y="269.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">✓</text>
  <rect x="310" y="252" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="269.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1 个</text>
  <rect x="40" y="278" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="295.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,3,5]</text>
  <rect x="150" y="278" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195.0" y="295.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="240" y="278" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275.0" y="295.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">✓</text>
  <rect x="310" y="278" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="295.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1 个</text>
  <rect x="40" y="304" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="95.0" y="321.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,7]</text>
  <rect x="150" y="304" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195.0" y="321.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="240" y="304" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275.0" y="321.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">✓</text>
  <rect x="310" y="304" width="250" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="321.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">1 个</text>
  <text x="40" y="350" font-size="10" fill="#999" text-anchor="start" filter="url(#rough2)">质数窗口的「首尾」决定左右端点的可选范围（见下一张图）</text>
</svg>
