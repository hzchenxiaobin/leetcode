  <text x="300.0" y="166.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">质数序列：pos = [0,1,2,3]，val = [2,3,5,7]（本例所有元素都是质数）</text>
  <rect x="40" y="200" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95.0" y="217.0" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">质数窗口</text>
  <rect x="150" y="200" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="195.0" y="217.0" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">max-min</text>
  <rect x="240" y="200" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275.0" y="217.0" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">&lt;= k?</text>
