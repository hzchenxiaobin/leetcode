<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一次扫描，两条判定</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <rect x="170" y="54" width="300" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="81" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">① 遍历 word，统计大写字母个数 u</text>

  <path d="M 320 98 L 320 124" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 第一个判断 -->
  <polygon points="320,128 430,168 320,208 210,168" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">u == 0</text>
  <text x="320" y="181" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">或 u == n ?</text>

  <path d="M 210 168 L 174 168" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="30" y="146" width="140" height="44" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="168" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">返回 true</text>
  <text x="100" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全大写 / 全小写</text>

  <path d="M 320 208 L 320 234" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="332" y="226" font-size="11" fill="#3a3a3a" filter="url(#rough2)">否</text>

  <!-- 第二个判断 -->
  <polygon points="320,238 430,276 320,314 210,276" fill="#e8f0fe"
           stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="271" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">u == 1 且</text>
  <text x="320" y="289" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">首字母大写 ?</text>

  <path d="M 210 276 L 174 276" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="30" y="254" width="140" height="44" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="276" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">返回 true</text>
  <text x="100" y="291" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首字母大写型</text>

  <path d="M 430 276 L 466 276" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="446" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="470" y="254" width="150" height="44" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="276" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">返回 false</text>
  <text x="545" y="291" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">混排，非法</text>

  <!-- 结论 -->
  <rect x="60" y="336" width="520" height="72" rx="10" fill="#ffffff"
        stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="358" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">两条判定互斥且完备：先排除 u 的两个极端值，再处理唯一的混合合法形态</text>
  <text x="320" y="379" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">扫描时顺手记下 word[0] 是否大写即可，不需要回看原串</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">时间 O(n)，额外空间 O(1)</text>
</svg>
