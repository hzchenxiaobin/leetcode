<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0-1 背包求「恰好装满」的最大件数：dp[s] = 和恰为 s 的最长长度，−1 表不可达</text>

  <!-- 背包图 -->
  <g filter="url(#rough2)">
    <text x="90" y="60" font-size="13" fill="#446688">每件物品：选或不选（各 1 次）</text>
    <rect x="62" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="82" y="94" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="110" y="74" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="130" y="94" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="158" y="74" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="178" y="94" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="206" y="74" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="226" y="94" text-anchor="middle" font-size="13" fill="#333">4</text>
    <rect x="254" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="274" y="94" text-anchor="middle" font-size="13" fill="#333">5</text>

    <text x="160" y="132" text-anchor="middle" font-size="12.5" fill="#555">target = 9：选中 1 + 3 + 5（3 件，最长）</text>
    <rect x="86" y="106" width="40" height="30" rx="4" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="182" y="106" width="40" height="30" rx="4" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="278" y="106" width="40" height="30" rx="4" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M 106 70 C 130 52, 200 52, 224 68" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 202 70 C 226 50, 258 50, 276 68" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- 转移 -->
  <g filter="url(#rough2)">
    <rect x="330" y="60" width="164" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="412" y="86" text-anchor="middle" font-size="13" fill="#446688">转移（倒序枚举 s）</text>
    <text x="346" y="112" font-size="12.5" fill="#555">dp[s] ← max(dp[s],</text>
    <text x="346" y="132" font-size="12.5" fill="#555">　dp[s−x] + 1)</text>
    <text x="346" y="158" font-size="12" fill="#888">dp[s−x] = −1 时跳过</text>
    <text x="346" y="176" font-size="12" fill="#888">（不可达不能续接）</text>
  </g>

  <!-- dp 表 -->
  <g filter="url(#rough2)">
    <text x="60" y="184" font-size="12.5" fill="#446688">dp 演化（s = 0..9）：</text>

    <text x="60" y="208" font-size="11.5" fill="#555">初始</text>
    <g font-size="11" fill="#333" text-anchor="middle">
      <rect x="130" y="196" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="145" y="210">0</text>
      <rect x="160" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="175" y="210">−1</text>
      <rect x="190" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="205" y="210">−1</text>
      <rect x="220" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="235" y="210">−1</text>
      <rect x="250" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="265" y="210">−1</text>
      <rect x="280" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="295" y="210">−1</text>
      <rect x="310" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="325" y="210">−1</text>
      <rect x="340" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="355" y="210">−1</text>
      <rect x="370" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="385" y="210">−1</text>
      <rect x="400" y="196" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="415" y="210">−1</text>
    </g>

    <text x="60" y="238" font-size="11.5" fill="#555">+1</text>
    <g font-size="11" fill="#333" text-anchor="middle">
      <rect x="130" y="226" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="145" y="240">0</text>
      <rect x="160" y="226" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="175" y="240">1</text>
      <rect x="190" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="205" y="240">−1</text>
      <rect x="220" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="235" y="240">−1</text>
      <rect x="250" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="265" y="240">−1</text>
      <rect x="280" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="295" y="240">−1</text>
      <rect x="310" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="325" y="240">−1</text>
      <rect x="340" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="355" y="240">−1</text>
      <rect x="370" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="385" y="240">−1</text>
      <rect x="400" y="226" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="415" y="240">−1</text>
    </g>

    <text x="60" y="268" font-size="11.5" fill="#555">+2</text>
    <g font-size="11" fill="#333" text-anchor="middle">
      <rect x="130" y="256" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="145" y="270">0</text>
      <rect x="160" y="256" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="175" y="270">1</text>
      <rect x="190" y="256" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="205" y="270">1</text>
      <rect x="220" y="256" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="235" y="270">2</text>
      <rect x="250" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="265" y="270">−1</text>
      <rect x="280" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="295" y="270">−1</text>
      <rect x="310" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="325" y="270">−1</text>
      <rect x="340" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="355" y="270">−1</text>
      <rect x="370" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="385" y="270">−1</text>
      <rect x="400" y="256" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="415" y="270">−1</text>
    </g>

    <text x="60" y="298" font-size="11.5" fill="#555">+3</text>
    <g font-size="11" fill="#333" text-anchor="middle">
      <rect x="130" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="145" y="300">0</text>
      <rect x="160" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="175" y="300">1</text>
      <rect x="190" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="205" y="300">1</text>
      <rect x="220" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="235" y="300">2</text>
      <rect x="250" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="265" y="300">2</text>
      <rect x="280" y="286" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="295" y="300">2</text>
      <rect x="310" y="286" width="30" height="20" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/><text x="325" y="300">3</text>
      <rect x="340" y="286" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="355" y="300">−1</text>
      <rect x="370" y="286" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="385" y="300">−1</text>
      <rect x="400" y="286" width="30" height="20" rx="3" fill="#ffffff" stroke="#bbb"/><text x="415" y="300">−1</text>
    </g>

    <text x="60" y="328" font-size="11.5" fill="#555">+4,+5</text>
    <g font-size="11" fill="#333" text-anchor="middle">
      <rect x="130" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="145" y="330">0</text>
      <rect x="160" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="175" y="330">1</text>
      <rect x="190" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="205" y="330">1</text>
      <rect x="220" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="235" y="330">2</text>
      <rect x="250" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="265" y="330">2</text>
      <rect x="280" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="295" y="330">2</text>
      <rect x="310" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="325" y="330">3</text>
      <rect x="340" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="355" y="330">3</text>
      <rect x="370" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="385" y="330">3</text>
      <rect x="400" y="316" width="30" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/><text x="415" y="330">3</text>
    </g>

    <text x="446" y="300" font-size="11" fill="#d6a040">s=6 处出现 3</text>
    <text x="446" y="330" font-size="11" fill="#4a7a3a">dp[9] = 3 ✓</text>
  </g>
</svg>
