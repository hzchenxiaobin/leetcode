<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#fdfcf7"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">增删操作：cnt 变一格，freq 搬一次桶</text>
  <path d="M 240 42 Q 380 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：add ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="64" width="320" height="396" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="210" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">add(number)</text>

  <!-- old 桶 -->
  <g filter="url(#sk)">
    <rect x="90" y="120" width="80" height="60" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="230" y="120" width="80" height="60" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="130" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">freq 桶</text>
  <text x="130" y="166" text-anchor="middle" font-size="12" fill="#7a5415">old</text>
  <text x="270" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">freq 桶</text>
  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#2e6e2e">old+1</text>
  <!-- 搬移箭头 -->
  <path d="M 174 150 Q 200 128 224 148" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="199" y="120" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">搬移</text>

  <text x="90" y="206" font-size="11" fill="#444" font-family="monospace">① old = cnt[number]</text>
  <text x="90" y="226" font-size="11" fill="#444" font-family="monospace">② cnt[number] = old + 1</text>
  <text x="90" y="246" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">③ freq[old] -= 1  （离旧桶）</text>
  <text x="90" y="266" font-size="11" fill="#2e6e2e" font-family="monospace" font-weight="bold">④ freq[old+1] += 1 （入新桶）</text>

  <!-- 小例 -->
  <g filter="url(#sk)">
    <rect x="80" y="288" width="262" height="80" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="94" y="310" font-size="11" font-weight="bold" fill="#2b2b2b">例：add(3)，old = 2</text>
  <text x="94" y="330" font-size="10" fill="#444" font-family="monospace">freq[2]-- → 桶2 失去 3</text>
  <text x="94" y="348" font-size="10" fill="#444" font-family="monospace">freq[3]++ → 桶3 得到 3</text>
  <text x="94" y="364" font-size="10" fill="#888">此后 hasFrequency(3) 为 true</text>

  <text x="90" y="400" font-size="10" fill="#888">old=0（新数字）时动的是 freq[0]，永不被查询</text>
  <text x="90" y="416" font-size="10" fill="#888">——代码对称，省去 if 分支</text>
  <text x="210" y="446" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">均摊 O(1)</text>

  <!-- ===== 右：deleteOne ===== -->
  <g filter="url(#sk)">
    <rect x="396" y="64" width="320" height="396" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="556" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a3430">deleteOne(number)</text>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="556,108 636,146 556,184 476,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="556" y="142" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">old == 0 ?</text>
  <text x="556" y="158" text-anchor="middle" font-size="10" fill="#7a5415">（数字不存在）</text>
  <text x="648" y="150" font-size="11" fill="#b85450" font-weight="bold">是 → 直接 return</text>
  <text x="648" y="166" font-size="10" fill="#888">不删任何内容</text>
  <path d="M 556 184 L 556 202" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="196" font-size="10" fill="#888">否</text>

  <!-- old 桶 -->
  <g filter="url(#sk)">
    <rect x="436" y="212" width="80" height="60" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="576" y="212" width="80" height="60" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="476" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">freq 桶</text>
  <text x="476" y="258" text-anchor="middle" font-size="12" fill="#7a3430">old</text>
  <text x="616" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">freq 桶</text>
  <text x="616" y="258" text-anchor="middle" font-size="12" fill="#2e6e2e">old−1</text>
  <!-- 搬移箭头（反向） -->
  <path d="M 520 242 Q 556 220 570 236" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="549" y="214" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold">反向搬移</text>

  <text x="436" y="298" font-size="11" fill="#444" font-family="monospace">① cnt[number] = old − 1</text>
  <text x="436" y="318" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">② freq[old] -= 1  （离旧桶）</text>
  <text x="436" y="338" font-size="11" fill="#2e6e2e" font-family="monospace" font-weight="bold">③ freq[old−1] += 1 （入新桶）</text>

  <!-- 小例 -->
  <g filter="url(#sk)">
    <rect x="426" y="360" width="262" height="80" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="440" y="382" font-size="11" font-weight="bold" fill="#2b2b2b">例：deleteOne(3)，old = 2</text>
  <text x="440" y="402" font-size="10" fill="#444" font-family="monospace">freq[2]-- → 桶2 失去 3</text>
  <text x="440" y="420" font-size="10" fill="#444" font-family="monospace">freq[1]++ → 桶1 得到 3</text>
  <text x="440" y="436" font-size="10" fill="#888">old−1=0 时加 freq[0]，不被查询</text>

  <text x="556" y="446" text-anchor="middle" font-size="11" fill="#7a3430" font-weight="bold">均摊 O(1)（守卫防 cnt 变负）</text>
</svg>
