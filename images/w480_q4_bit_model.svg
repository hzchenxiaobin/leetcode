<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">维护方案：边界标记 d + 树状数组</text>

  <text x="110" y="70" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="120" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="312" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">A</text>
  <text x="190" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">B</text>
  <text x="238" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">B</text>
  <text x="286" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">A</text>
  <text x="334" y="70" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">B</text>
  <text x="142" y="96" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="190" y="96" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="238" y="96" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="286" y="96" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="334" y="96" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <text x="112" y="118" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">d[i] = 1</text>
  <text x="112" y="132" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">即 s[i]≠s[i−1]</text>
  <circle cx="166" cy="124" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="214" cy="124" r="13" fill="#f0f0f0" stroke="#999999" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="262" cy="124" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="310" cy="124" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="214" y="129" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="262" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="166" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">d[1]</text>
  <text x="214" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">d[2]</text>
  <text x="262" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">d[3]</text>
  <text x="310" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">d[4]</text>

  <rect x="36" y="172" width="204" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">操作 [1, j]：翻转 s[j]</text>
  <text x="138" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">只波及 d[j] 与 d[j+1]，二元下必取反</text>
  <path d="M150,168 C164,158 184,148 202,142" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M172,168 C198,158 232,150 252,142" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="292" y="172" width="192" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">操作 [2, l, r]：查区间和</text>
  <text x="388" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">P(r) − P(l) = Σ d[l+1..r]</text>

  <path d="M388,224 L388,238" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="240" width="400" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">树状数组：点加 ±1、前缀和，均 O(log n)</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">初始化 O(n) 建好 d；此后每次操作只碰 O(log n) 个节点</text>

  <path d="M260,296 L260,310" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="312" width="400" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">块数 B = 1 + P(r) − P(l)</text>
  <text x="260" y="354" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = (r−l+1) − B</text>
</svg>
