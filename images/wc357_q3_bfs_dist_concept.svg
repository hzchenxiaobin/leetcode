<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：多源 BFS 一趟求出每格到最近小偷的曼哈顿距离</text>
  <path d="M 110 38 Q 280 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="146" y="58" text-anchor="middle" font-size="11" fill="#4a4a4a">grid：× 为小偷（示例 3）</text>
  <text x="414" y="58" text-anchor="middle" font-size="11" fill="#4a4a4a">dist[r][c]：到最近小偷的距离</text>

  <!-- left grid: 4x4, origin (62,66), cell 42 -->
  <g filter="url(#sk)">
    <rect x="62" y="66" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="66" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="146" y="66" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="188" y="66" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="62" y="108" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="108" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="146" y="108" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="188" y="108" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="62" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="104" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="146" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="188" y="150" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="62" y="192" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="104" y="192" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="146" y="192" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
    <rect x="188" y="192" width="42" height="42" rx="4" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1.2"/>
  </g>
  <text x="209" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">×</text>
  <text x="83" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">×</text>

  <!-- arrow between grids -->
  <path d="M 242 150 L 322 150" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="282" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a3a3a">多源 BFS</text>
  <text x="282" y="170" text-anchor="middle" font-size="10.5" fill="#7a7a7a">O(n²)</text>

  <!-- right grid: dist values, origin (330,66), cell 42 -->
  <g filter="url(#sk)">
    <rect x="330" y="66" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="372" y="66" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="414" y="66" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="456" y="66" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="330" y="108" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="372" y="108" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="414" y="108" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="108" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="330" y="150" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="372" y="150" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="414" y="150" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="456" y="150" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="192" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="372" y="192" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="414" y="192" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="192" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="351" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="393" y="92" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="435" y="92" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="477" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="351" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="393" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="435" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="477" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="351" y="176" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="393" y="176" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="435" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="477" y="176" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="351" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="393" y="218" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="435" y="218" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="477" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">3</text>

  <!-- ripple rings around the two thieves -->
  <ellipse cx="477" cy="87" rx="33" ry="27" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#sk)"/>
  <ellipse cx="351" cy="213" rx="33" ry="27" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="477" y="248" text-anchor="middle" font-size="9.5" fill="#b85450">波纹同时扩散</text>

  <!-- legend -->
  <rect x="66" y="256" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="86" y="268" font-size="10.5" fill="#4a4a4a">dist=0 小偷</text>
  <rect x="172" y="256" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="192" y="268" font-size="10.5" fill="#4a4a4a">dist=1</text>
  <rect x="252" y="256" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="272" y="268" font-size="10.5" fill="#4a4a4a">dist=2</text>
  <rect x="332" y="256" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="352" y="268" font-size="10.5" fill="#4a4a4a">dist=3（最安全）</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="30" y="286" width="500" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#2b5a1e">每步恰好改变一个坐标 ±1，且网格无障碍 → 两格的四连通最短步数 = 曼哈顿距离 |Δr| + |Δc|；</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#2b5a1e">所有小偷同时入队（超级源点思想）→ 一趟多源 BFS 得 dist[r][c] = 到最近小偷的曼哈顿距离，O(n²)；</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#2b5a1e">预处理后问题变成瓶颈连通：只走 dist ≥ s 的格子，(0,0) 能否连到 (n−1, n−1)——对 s 二分（见 §3.3）。</text>

  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#7a7a7a">一条路径的安全系数 = 路径上所有格子 dist 的最小值（瓶颈）；dist 越大离小偷越远越安全。</text>
</svg>
