<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="430" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：死胡同上的最小边，靠「折返」进路径</text>
  <path d="M 240 40 Q 430 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：图 -->
  <rect x="36" y="54" width="400" height="270" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="236" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">n=5, roads=[[1,2,10],[2,5,20],[5,3,1]]</text>

  <!-- 边 -->
  <line x1="127" y1="140" x2="226" y2="195" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="150" font-size="13" fill="#555" filter="url(#rough2)">10</text>
  <line x1="260" y1="195" x2="359" y2="140" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="150" font-size="13" fill="#555" filter="url(#rough2)">20</text>
  <line x1="376" y1="152" x2="376" y2="236" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="406" y="182" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="404" y="222" font-size="9.5" fill="#b85450" filter="url(#rough2)">块内最小</text>

  <!-- 路径箭头 ①②③④ -->
  <path d="M 130,150 Q 172,186 216,190" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="140" y="182" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">①</text>
  <path d="M 265,187 Q 312,170 346,146" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="302" y="176" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">②</text>
  <path d="M 388,158 Q 404,196 388,230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="414" y="200" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">③</text>
  <path d="M 364,230 Q 350,196 364,158" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="200" font-size="11" font-weight="bold" fill="#b07818" filter="url(#rough2)">④</text>

  <!-- 节点 -->
  <circle cx="110" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <circle cx="243" cy="205" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <circle cx="376" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="376" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>
  <text x="376" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818" filter="url(#rough2)">n = 5</text>
  <circle cx="376" cy="258" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="376" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>

  <text x="236" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">路径 1→2→5→3→5：末尾折返，把死胡同边 (5,3)=1 塞进路径</text>

  <!-- 右面板：BFS 扫边表 -->
  <rect x="456" y="54" width="368" height="270" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="640" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">BFS 扫边：ans 跟着每条扫到的边更新</text>

  <rect x="470" y="92" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="505" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">出队 u</text>
  <rect x="540" y="92" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="630" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">扫到的边 (v, w)</text>
  <rect x="720" y="92" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="765" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">ans</text>

  <rect x="470" y="122" width="70" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="540" y="122" width="180" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="720" y="122" width="90" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="630" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 10)</text>
  <text x="765" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <rect x="470" y="160" width="70" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="540" y="160" width="180" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="720" y="160" width="90" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="630" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 10), (5, 20)</text>
  <text x="765" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <rect x="470" y="198" width="70" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="540" y="198" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="720" y="198" width="90" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="505" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3030" filter="url(#rough2)">5</text>
  <text x="630" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3030" filter="url(#rough2)">(2, 20), (3, 1)</text>
  <text x="765" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="470" y="236" width="70" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="540" y="236" width="180" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="720" y="236" width="90" height="38" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="505" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="630" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 1)</text>
  <text x="765" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="640" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">队列空 → 返回 ans = 1；n=5 与 1 同块（题目保证），无需再查 n</text>

  <!-- 底部结论 -->
  <rect x="36" y="346" width="788" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">score = min(10, 20, 1, 1) = 1 —— 与 1 同块的每条边都有效，哪怕在死胡同里</text>
  <text x="430" y="394" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r2 的 (1,10)、r4 的 (5,1) 面对的都是已访问点，仍参与更新 —— 防漏边的关键</text>
</svg>
