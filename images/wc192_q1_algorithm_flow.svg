<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，每轮成对写入</text>
  <text x="260" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下标公式 res[2i] = nums[i]、res[2i+1] = nums[n+i] 直接落地</text>
  <rect x="135" y="60" width="250" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260.0" y="81.0" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入：nums（长度 2n）与 n</text>
  <path d="M 260 94 L 260 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="135" y="116" width="250" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260.0" y="137.0" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">res ← 新开长度 2n 的数组</text>
  <path d="M 260 150 L 260 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="135" y="172" width="250" height="34" rx="8" fill="#eef2f7" stroke="#667788" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260.0" y="193.0" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">for i = 0 … n−1</text>
  <path d="M 260 206 L 260 220 L 137 220 L 137 236" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 220 L 383 220 L 383 236" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="238" width="210" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137.0" y="263.0" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">res[2i] ← nums[i]</text>
  <rect x="278" y="238" width="210" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383.0" y="263.0" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">res[2i+1] ← nums[n+i]</text>
  <path d="M 137 280 L 137 290 L 260 290 L 260 292" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 383 280 L 383 290 L 260 290" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <polygon points="260,292 370,314 260,336 150,314" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">i 走完 n 轮？</text>
  <path d="M 260 336 L 260 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="352" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="150" y="356" width="220" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260.0" y="376.0" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 res</text>
  <path d="M 370 314 L 500 314 L 500 189 L 388 189" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="308" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="494" y="181" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">否：i ← i+1，回到循环</text>
</svg>
