<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 368"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="368" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">三段二进制值相等 ⇔ 1 的个数均分 + 逐位一致</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">arr = [1,0,1,0,1]，1 的总数 = 3 → 每段 1 个</text>
  <rect x="60" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="74" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="180" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="240" y="74" width="50" height="34" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="300" y="74" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325.0" y="96.2" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="146" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">每段的「第一个 1」位置：</text>
  <rect x="60" y="160" width="160" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="183.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">first = 0</text>
  <rect x="240" y="160" width="160" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="183.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">second = 2</text>
  <rect x="420" y="160" width="160" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="183.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">third = 4</text>
  <text x="60" y="230" text-anchor="start" font-size="12" fill="#d6a040" filter="url(#rough2)">第三段必然拖到数组末尾，长度固定 len = n - third = 1</text>
  <text x="60" y="258" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">于是只需验证：arr[first..first+len) == arr[third..n) 且 arr[second..second+len) == arr[third..n)</text>
  <text x="60" y="300" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">通过 → 返回 [first+len-1, second+len]；否则 [-1,-1]</text>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">前导零被允许，但「第三段到末尾」的长度是唯一确定的，所以不能任意切</text>
</svg>
