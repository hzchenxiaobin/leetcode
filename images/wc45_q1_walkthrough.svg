<svg xmlns="http://www.w3.org/2000/svg" width="640" height="462" viewBox="0 0 640 462" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="462" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：moves = "RLUURDDDLU"</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">第 2 步曾短暂回到原点，但终点才决定答案</text>

  <!-- 表头 -->
  <g filter="url(#r)">
    <rect x="150" y="68" width="340" height="27" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#a0761e">
    <text x="192" y="86" filter="url(#r)">步 i</text>
    <text x="277" y="86" filter="url(#r)">字符</text>
    <text x="362" y="86" filter="url(#r)">x</text>
    <text x="447" y="86" filter="url(#r)">y</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#r)">
    <rect x="150" y="99" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="126" width="340" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="150" y="153" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="180" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="207" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="234" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="261" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="288" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="315" width="340" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1.1"/>
    <rect x="150" y="342" width="340" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <g font-size="13" text-anchor="middle" fill="#3a3a3a">
    <text x="192" y="117" filter="url(#r)">1</text><text x="277" y="117" fill="#33517a" font-weight="bold" filter="url(#r)">R</text><text x="362" y="117" filter="url(#r)">1</text><text x="447" y="117" filter="url(#r)">0</text>
    <text x="192" y="144" filter="url(#r)">2</text><text x="277" y="144" fill="#a0761e" font-weight="bold" filter="url(#r)">L</text><text x="362" y="144" filter="url(#r)">0</text><text x="447" y="144" filter="url(#r)">0</text>
    <text x="192" y="171" filter="url(#r)">3</text><text x="277" y="171" fill="#2e6e2e" font-weight="bold" filter="url(#r)">U</text><text x="362" y="171" filter="url(#r)">0</text><text x="447" y="171" filter="url(#r)">1</text>
    <text x="192" y="198" filter="url(#r)">4</text><text x="277" y="198" fill="#2e6e2e" font-weight="bold" filter="url(#r)">U</text><text x="362" y="198" filter="url(#r)">0</text><text x="447" y="198" filter="url(#r)">2</text>
    <text x="192" y="225" filter="url(#r)">5</text><text x="277" y="225" fill="#33517a" font-weight="bold" filter="url(#r)">R</text><text x="362" y="225" filter="url(#r)">1</text><text x="447" y="225" filter="url(#r)">2</text>
    <text x="192" y="252" filter="url(#r)">6</text><text x="277" y="252" fill="#b85450" font-weight="bold" filter="url(#r)">D</text><text x="362" y="252" filter="url(#r)">1</text><text x="447" y="252" filter="url(#r)">1</text>
    <text x="192" y="279" filter="url(#r)">7</text><text x="277" y="279" fill="#b85450" font-weight="bold" filter="url(#r)">D</text><text x="362" y="279" filter="url(#r)">1</text><text x="447" y="279" filter="url(#r)">0</text>
    <text x="192" y="306" filter="url(#r)">8</text><text x="277" y="306" fill="#b85450" font-weight="bold" filter="url(#r)">D</text><text x="362" y="306" filter="url(#r)">1</text><text x="447" y="306" filter="url(#r)">−1</text>
    <text x="192" y="333" filter="url(#r)">9</text><text x="277" y="333" fill="#33517a" font-weight="bold" filter="url(#r)">L</text><text x="362" y="333" filter="url(#r)">0</text><text x="447" y="333" filter="url(#r)">−1</text>
    <text x="192" y="360" filter="url(#r)">10</text><text x="277" y="360" fill="#2e6e2e" font-weight="bold" filter="url(#r)">U</text><text x="362" y="360" font-weight="bold" filter="url(#r)">0</text><text x="447" y="360" font-weight="bold" filter="url(#r)">0</text>
  </g>

  <!-- 标注：第 2 步路过原点 -->
  <g filter="url(#r)">
    <path d="M492,139 L536,139" stroke="#d6a040" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>
  <text x="540" y="143" font-size="11.5" fill="#a0761e" filter="url(#r)">只是路过</text>
  <text x="540" y="160" font-size="11.5" fill="#a0761e" filter="url(#r)">不算答案</text>

  <!-- 结论框 -->
  <g filter="url(#r)">
    <rect x="118" y="380" width="404" height="60" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="13.5" fill="#8a3f3a" filter="url(#r)">#R = 2 = #L ⟹ x = 0 ； #U = 3 = #D ⟹ y = 0</text>
  <text x="320" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#r)">两轴同时归零 ⟹ 返回 true</text>
</svg>
