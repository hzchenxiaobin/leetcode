<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [3, 6, 5, 8] → [8, 3, 6, 5]</text>

  <!-- Left table: reflections -->
  <rect x="30" y="56" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="30" y="56" width="210" height="160" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 100 56 L 100 216" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 185 56 L 185 216" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 88 L 240 88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 120 L 240 120" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 152 L 240 152" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 184 L 240 184" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">原数</text>
  <text x="142" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">二进制</text>
  <text x="212" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">反射值</text>
  <text x="65" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="142" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="212" y="109" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="65" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="142" y="141" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">110</text>
  <text x="212" y="141" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="65" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="142" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>
  <text x="212" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="65" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="142" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1000</text>
  <text x="212" y="205" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="135" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① 逐个求反射值（O(log V)）</text>

  <!-- Middle arrow -->
  <text x="270" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 按 (反射值, 原值)</text>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">字典序排序</text>
  <path d="M 246 140 L 292 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: sorted keys -->
  <rect x="300" y="70" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(反射 1, 原值 8)</text>
  <rect x="300" y="112" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(反射 3, 原值 3)</text>
  <rect x="300" y="154" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(反射 3, 原值 6)</text>
  <rect x="300" y="196" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(反射 5, 原值 5)</text>
  <path d="M 484 118 C 496 135, 496 160, 484 178" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <path d="M 390 230 C 390 244, 382 248, 372 254" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom: result -->
  <text x="140" y="281" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 输出</text>
  <path d="M 152 276 L 164 276" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="258" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="224" y="258" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="278" y="258" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="332" y="258" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="216" y="250" width="114" height="52" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 与 6 的反射值同为 3 ⇒ 原值小者在前</text>
</svg>
