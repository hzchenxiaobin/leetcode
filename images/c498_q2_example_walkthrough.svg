<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [5, 0, 1, 4]，k = 3</text>

  <g filter="url(#rough2)" font-size="12">
    <text x="96" y="66" text-anchor="end" font-size="11" fill="#888">i</text>
    <rect x="110" y="50" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="200" y="50" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="290" y="50" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="380" y="50" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="69" font-size="12" fill="#555">0</text>
    <text x="240" y="69" font-size="12" fill="#555">1</text>
    <text x="330" y="69" font-size="12" fill="#555">2</text>
    <text x="420" y="69" font-size="12" fill="#555">3</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <text x="96" y="106" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">preMax</text>
    <rect x="110" y="90" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="200" y="90" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="90" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="380" y="90" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="109" font-size="12" fill="#2f5a24" font-weight="bold">5</text>
    <text x="240" y="109" font-size="12" fill="#2f5a24" font-weight="bold">5</text>
    <text x="330" y="109" font-size="12" fill="#2f5a24" font-weight="bold">5</text>
    <text x="420" y="109" font-size="12" fill="#2f5a24" font-weight="bold">5</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <text x="96" y="146" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">sufMin</text>
    <rect x="110" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="200" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="380" y="130" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="149" font-size="12" fill="#2f5a24" font-weight="bold">0</text>
    <text x="240" y="149" font-size="12" fill="#2f5a24" font-weight="bold">0</text>
    <text x="330" y="149" font-size="12" fill="#2f5a24" font-weight="bold">1</text>
    <text x="420" y="149" font-size="12" fill="#2f5a24" font-weight="bold">4</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <text x="96" y="186" text-anchor="end" font-size="11" fill="#7a5a10" font-weight="bold">不稳定值</text>
    <rect x="110" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="200" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="290" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="380" y="170" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="189" font-size="12" fill="#7a5a10" font-weight="bold">5</text>
    <text x="240" y="189" font-size="12" fill="#7a5a10" font-weight="bold">5</text>
    <text x="330" y="189" font-size="12" fill="#7a5a10" font-weight="bold">4</text>
    <text x="420" y="189" font-size="12" fill="#b85450" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <text x="96" y="226" text-anchor="end" font-size="11" fill="#888">判定</text>
    <rect x="110" y="210" width="80" height="28" fill="none" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="200" y="210" width="80" height="28" fill="none" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="290" y="210" width="80" height="28" fill="none" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <rect x="380" y="210" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="229" font-size="12" fill="#b85450">✗ &gt; 3</text>
    <text x="240" y="229" font-size="12" fill="#b85450">✗ &gt; 3</text>
    <text x="330" y="229" font-size="12" fill="#b85450">✗ &gt; 3</text>
    <text x="420" y="229" font-size="12" fill="#2f5a24" font-weight="bold">✓ 返回</text>
  </g>

  <rect x="80" y="272" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">第一遍（右→左）：sufMin = [0, 0, 1, 4]</text>
  <text x="280" y="318" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">第二遍（左→右）：i = 3 首次满足 5 − 4 = 1 ≤ 3</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不稳定值 5 → 5 → 4 → 1：本例恰好单调下降，但一般情况不保证（见上图反例）</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所以扫描必须从 i = 0 开始，命中立即返回</text>
</svg>
