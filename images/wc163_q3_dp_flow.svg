<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" fill="#2b2b2b" filter="url(#rough2)">算法流程：外层扫元素，内层只跑三个余数</text>
  <text x="360" y="52" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">每个元素两种命运：不选（继承旧值）／选（余数平移后加上 v）</text>

  <rect x="175" y="66" width="320" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="91" text-anchor="middle" font-size="14" fill="#6b4c10" filter="url(#rough2)">dp = (0, −∞, −∞)　对应空集</text>

  <rect x="100" y="124" width="470" height="256" rx="10" fill="#f7faff" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="118" y="146" font-size="13" fill="#446688" filter="url(#rough2)">对每个 v ∈ nums 重复 n 次</text>

  <rect x="130" y="152" width="410" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="184" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">ndp = dp 的副本（先表示「不选 v」）</text>

  <path d="M335,204 L335,224" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="226" width="410" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="250" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">对 r = 0, 1, 2：若 dp[r] 可达，则</text>
  <text x="335" y="274" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">ndp[(r+v) mod 3] ← max(ndp[(r+v) mod 3], dp[r] + v)</text>

  <path d="M335,290 L335,314" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="316" width="410" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="345" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">dp ← ndp，接着处理下一个元素</text>

  <path d="M335,362 L335,390" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="235" y="392" width="200" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="419" text-anchor="middle" font-size="14" fill="#8a2f2b" filter="url(#rough2)">返回 dp[0]</text>

  <path d="M130,339 C72,339 72,178 128,178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="259" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">下一轮 v</text>
</svg>
