<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="91" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="720" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：每步只动一个格子，索引一删一增</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== section 1 : example 1 ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">示例 1：nums = [1,2,4,6]，operations = [[1,3],[4,7],[6,1]]</text>

  <!-- header row -->
  <text x="150" y="112" text-anchor="end" font-size="12" fill="#888">步骤</text>
  <text x="250" y="112" text-anchor="middle" font-size="11" fill="#888">下标 0</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="390" y="112" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="460" y="112" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="520" y="112" font-size="12" fill="#888">pos 同步</text>

  <!-- row 0 : initial -->
  <text x="150" y="145" text-anchor="end" font-size="12" fill="#555" font-weight="bold">初始</text>
  <g filter="url(#sk)">
    <rect x="222" y="124" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="292" y="124" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="362" y="124" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="432" y="124" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="250" y="145" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="320" y="145" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="390" y="145" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="460" y="145" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="520" y="145" font-size="12" fill="#444">{1:0, 2:1, 4:2, 6:3}</text>

  <!-- row 1 : op [1,3] -->
  <text x="150" y="183" text-anchor="end" font-size="12" fill="#555" font-weight="bold">① [1,3]</text>
  <g filter="url(#sk)">
    <rect x="222" y="162" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="292" y="162" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="362" y="162" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="432" y="162" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="250" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">3</text>
  <text x="320" y="183" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="390" y="183" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="460" y="183" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="520" y="183" font-size="12" fill="#444">删 1→0，加 3→0</text>

  <!-- row 2 : op [4,7] -->
  <text x="150" y="221" text-anchor="end" font-size="12" fill="#555" font-weight="bold">② [4,7]</text>
  <g filter="url(#sk)">
    <rect x="222" y="200" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="292" y="200" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="362" y="200" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="432" y="200" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
  </g>
  <text x="250" y="221" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="320" y="221" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="390" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">7</text>
  <text x="460" y="221" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="520" y="221" font-size="12" fill="#444">删 4→2，加 7→2</text>

  <!-- row 3 : op [6,1] -->
  <text x="150" y="259" text-anchor="end" font-size="12" fill="#555" font-weight="bold">③ [6,1]</text>
  <g filter="url(#sk)">
    <rect x="222" y="238" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="292" y="238" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="362" y="238" width="56" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="432" y="238" width="56" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="250" y="259" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="320" y="259" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="390" y="259" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="460" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="520" y="259" font-size="12" fill="#444">删 6→3，加 1→3</text>

  <!-- answer strip -->
  <g filter="url(#sk)">
    <rect x="350" y="284" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="470" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">返回 [3, 2, 7, 1] ✓</text>

  <!-- ===== divider ===== -->
  <path d="M 100 348 Q 470 356 840 348" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="7 5" filter="url(#sk)"/>

  <!-- ===== section 2 : example 2 chains ===== -->
  <text x="470" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">示例 2：值的一生——删而复生、新生早逝（nums = [1,2]）</text>

  <!-- chain 1 : slot 0 -->
  <text x="150" y="446" text-anchor="end" font-size="13" font-weight="bold" fill="#555">槽位 0</text>
  <g filter="url(#sk)">
    <circle cx="250" cy="440" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="500" cy="440" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="750" cy="440" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="250" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>
  <text x="500" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a3030">3</text>
  <text x="750" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">2</text>
  <path d="M 280 440 L 470 440" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 530 440 L 720 440" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="375" y="424" text-anchor="middle" font-size="12" fill="#777">op① [1,3]</text>
  <text x="625" y="424" text-anchor="middle" font-size="12" fill="#777">op③ [3,2]</text>
  <text x="250" y="484" text-anchor="middle" font-size="10" fill="#888">初始值</text>
  <text x="500" y="484" text-anchor="middle" font-size="10" fill="#b85450">op① 新生</text>
  <text x="750" y="484" text-anchor="middle" font-size="10" fill="#888">最终归宿</text>

  <!-- chain 2 : slot 1 -->
  <text x="150" y="548" text-anchor="end" font-size="13" font-weight="bold" fill="#555">槽位 1</text>
  <g filter="url(#sk)">
    <circle cx="330" cy="542" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="580" cy="542" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="330" y="548" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">2</text>
  <text x="580" y="548" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">1</text>
  <path d="M 360 542 L 550 542" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="455" y="526" text-anchor="middle" font-size="12" fill="#777">op② [2,1]</text>
  <text x="580" y="586" text-anchor="middle" font-size="10" fill="#888">值 1 在 op① 被删、op② 复活——挂到新下标</text>

  <!-- ===== annotation box ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="606" width="800" height="94" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="92" y="632" font-size="12" fill="#444">① 值 1 被 op① 删除、又被 op② 复活（指向新下标 1）；值 3 由 op① 新生、又被 op③ 替换——「新生早逝」</text>
  <text x="92" y="656" font-size="12" fill="#444">② 两个槽位的链：1→3→2 与 2→1，返回 [2,1] ✓；m 次操作 = 给链接上 m 条新边</text>
  <text x="92" y="682" font-size="12" fill="#b85450" font-weight="bold">③ 替换沿链传播，索引必须逐步同步——任何「一次预处理、事后套用」的静态做法都会翻车</text>
</svg>
