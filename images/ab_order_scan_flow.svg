<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="520" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">单遍扫描：一旦见过 b，后面不许再出现 a</text>
  <path d="M 150 40 Q 350 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="350" cy="70" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">开始</text>
  <path d="M 350 88 L 350 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="270" y="104" width="160" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="126" text-anchor="middle" font-size="12.5" fill="#333">i = 0，seenB = 假</text>
  <path d="M 350 138 L 350 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 A：i < n ? -->
  <g filter="url(#sk)">
    <polygon points="350,156 402,186 350,216 298,186" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">i &lt; n ?</text>
  <path d="M 402 186 L 536 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="178" font-size="12" fill="#555">否</text>
  <g filter="url(#sk)">
    <rect x="540" y="168" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="595" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 true ✓</text>
  <path d="M 350 216 L 350 230" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="228" font-size="12" fill="#555">是</text>

  <!-- 菱形 B：s[i] 是 'a' ? -->
  <g filter="url(#sk)">
    <polygon points="350,234 402,264 350,294 298,264" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="350" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">s[i] 是 'a' ?</text>
  <path d="M 402 264 L 462 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="256" font-size="12" fill="#555">否（是 b）</text>
  <g filter="url(#sk)">
    <rect x="466" y="247" width="110" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="521" y="269" text-anchor="middle" font-size="12.5" fill="#333">seenB = 真</text>
  <path d="M 350 294 L 350 308" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="306" font-size="12" fill="#555">是</text>

  <!-- 菱形 C：seenB 已为真 ? -->
  <g filter="url(#sk)">
    <polygon points="350,312 405,344 350,376 295,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">seenB 已为真 ?</text>
  <path d="M 295 344 L 165 344" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="278" y="336" font-size="12" fill="#555">是</text>
  <g filter="url(#sk)">
    <rect x="45" y="325" width="118" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="104" y="349" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false ✗</text>
  <path d="M 350 376 L 350 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="398" font-size="12" fill="#555">否</text>

  <!-- seenB = 真 分支下行汇合到 i++ -->
  <path d="M 521 281 L 521 414 L 392 414 L 392 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i++ -->
  <g filter="url(#sk)">
    <rect x="280" y="434" width="140" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="350" y="456" text-anchor="middle" font-size="12.5" fill="#333">i++，看下一字符</text>

  <!-- 回边 -->
  <path d="M 280 451 L 40 451 L 40 186 L 292 186" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="52" y="316" font-size="11.5" fill="#8a8a8a" transform="rotate(-90 52 316)">回到循环开头</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="484" width="580" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="350" y="503" text-anchor="middle" font-size="12" fill="#8a6415">违规只在「b 之后又见 a」这一种情形发生 —— 对任意两类字符的有序出现都通用</text>
</svg>
