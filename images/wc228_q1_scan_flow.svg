<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="223" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描统计 diffA，返回 min(diffA, n − diffA)</text>
  <path d="M 200 36 Q 340 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="58" rx="40" ry="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">开始</text>
  <path d="M 300 74 L 300 86" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="225" y="88" width="150" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="108" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">diff = 0, i = 0</text>
  <path d="M 300 118 L 300 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形1：循环条件 -->
  <g filter="url(#sk)">
    <polygon points="300,134 425,180 300,226 175,180" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="185" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">i &lt; n ?</text>

  <!-- 否分支：返回 -->
  <path d="M 425 180 L 494 180" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="455" y="172" text-anchor="middle" font-size="12" fill="#a04348" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="498" y="160" width="176" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="586" y="181" text-anchor="middle" font-size="11.5" fill="#a04348" font-family="monospace" font-weight="bold">return min(diff, n−diff)</text>
  <path d="M 586 194 L 586 211" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="586" cy="229" rx="38" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="586" y="234" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">结束</text>

  <!-- 是分支向下 -->
  <path d="M 300 226 L 300 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="240" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 菱形2：与期望字符比较 -->
  <g filter="url(#sk)">
    <polygon points="300,248 430,298 300,348 170,298" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="300" y="296" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">s[i] ≠ 期望字符 ?</text>
  <text x="300" y="314" text-anchor="middle" font-size="11" fill="#a07830">（期望 = '0' 当 i 偶，'1' 当 i 奇）</text>

  <!-- 右侧说明框 -->
  <g filter="url(#sk)">
    <rect x="462" y="262" width="200" height="72" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="562" y="282" text-anchor="middle" font-size="11.5" fill="#7a5415">期望字符即目标 A 的对应位：</text>
  <text x="562" y="300" text-anchor="middle" font-size="11.5" fill="#7a5415">偶数位 '0'，奇数位 '1'</text>
  <text x="562" y="318" text-anchor="middle" font-size="11.5" fill="#7a5415">（B 逐位相反，用 n − diff 代）</text>

  <!-- 是（不匹配）：diff += 1 -->
  <path d="M 300 348 L 300 356" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="308" y="355" font-size="11.5" fill="#2e6e2e" font-weight="bold">是（不匹配）</text>
  <g filter="url(#sk)">
    <rect x="215" y="358" width="170" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="300" y="379" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">diff += 1</text>
  <path d="M 300 390 L 300 400" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否（匹配）：绕行直达 i += 1 -->
  <path d="M 170 298 L 110 298 L 110 417 L 213 417" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="290" text-anchor="middle" font-size="11.5" fill="#a04348" font-weight="bold">否（匹配）</text>

  <!-- i += 1 -->
  <g filter="url(#sk)">
    <rect x="215" y="402" width="170" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="300" y="422" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace">i += 1</text>

  <!-- 回路：回到循环条件 -->
  <path d="M 385 417 L 668 417 L 668 203 L 372 203" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="526" y="409" text-anchor="middle" font-size="11.5" fill="#666">回到循环条件</text>
</svg>
