<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：text = "Keep calm and code on"</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888">每个词记录 (长度, 原下标)，再按长度放进对应的桶</text>

  <g filter="url(#rough2)">
    <rect x="40" y="64" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="66" y="84">单词</text>
    <text x="236" y="84">长度</text>
    <text x="346" y="84">原下标</text>
    <text x="470" y="84">落入的桶</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="66" y="118">Keep</text>
    <text x="236" y="118">4</text>
    <text x="346" y="118">0</text>
    <text x="470" y="118">buckets[4]</text>

    <text x="66" y="150">calm</text>
    <text x="236" y="150">4</text>
    <text x="346" y="150">1</text>
    <text x="470" y="150">buckets[4]</text>

    <text x="66" y="182">and</text>
    <text x="236" y="182">3</text>
    <text x="346" y="182">2</text>
    <text x="470" y="182">buckets[3]</text>

    <text x="66" y="214">code</text>
    <text x="236" y="214">4</text>
    <text x="346" y="214">3</text>
    <text x="470" y="214">buckets[4]</text>

    <text x="66" y="246">on</text>
    <text x="236" y="246">2</text>
    <text x="346" y="246">4</text>
    <text x="470" y="246">buckets[2]</text>
  </g>

  <g filter="url(#rough2)" stroke="#c9d6e8" stroke-width="1">
    <path d="M 40 128 L 600 128" fill="none"/>
    <path d="M 40 160 L 600 160" fill="none"/>
    <path d="M 40 192 L 600 192" fill="none"/>
    <path d="M 40 224 L 600 224" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="262" width="170" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9"/>
    <rect x="226" y="262" width="170" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9"/>
    <rect x="412" y="262" width="188" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="125" y="284" font-size="10.5" fill="#3a5a30" font-weight="bold">桶 2</text>
    <text x="125" y="306" font-size="11" fill="#333">on</text>

    <text x="311" y="284" font-size="10.5" fill="#3a5a30" font-weight="bold">桶 3</text>
    <text x="311" y="306" font-size="11" fill="#333">and</text>

    <text x="506" y="284" font-size="10.5" fill="#3a5a30" font-weight="bold">桶 4（按原序，稳定）</text>
    <text x="506" y="306" font-size="11" fill="#333">keep  calm  code</text>
  </g>

  <path d="M 320 326 L 320 348" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="352" width="264" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="9"/>
    <rect x="322" y="352" width="278" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="9"/>
  </g>
  <text x="56" y="372" font-size="9.5" fill="#8a6a20" font-weight="bold">升序拼接（Keep 已小写化）</text>
  <text x="56" y="392" font-size="10" fill="#333">"on and keep calm code"</text>
  <text x="338" y="372" font-size="9.5" fill="#8a3a36" font-weight="bold">首字符大写后返回</text>
  <text x="338" y="392" font-size="10" fill="#333">"On and keep calm code"</text>
</svg>
