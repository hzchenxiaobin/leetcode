<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerHeight="8" markerWidth="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="356" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">构造：把 x = M ⊕ y 拆成三段异或，n ≥ 3 时全部可达</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">nums 是 1…n 的排列，元素集合恰是 {1, 2, …, n}，与顺序无关</text>

  <rect x="40" y="62" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">已知：M ≤ n、1 ∈ nums、2 ∈ nums、3 ∈ nums（因为 n ≥ 3 且 M = 2^b ≤ n）</text>

  <rect x="40" y="112" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="133" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">y = 0</text>
  <text x="115" y="151" text-anchor="middle" font-size="10" fill="#666">x = M</text>
  <path d="M 194 136 L 226 136" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="112" width="310" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="133" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">x = M ⊕ 1 ⊕ 1（用两次 1 抵消）</text>
  <text x="385" y="151" text-anchor="middle" font-size="10" fill="#666">M ∈ nums，1 ∈ nums</text>

  <rect x="40" y="168" width="150" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="189" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">y = 1</text>
  <text x="115" y="207" text-anchor="middle" font-size="10" fill="#666">x = M ⊕ 1</text>
  <path d="M 194 192 L 226 192" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="168" width="310" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="189" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">x = M ⊕ 2 ⊕ 3（因为 2 ⊕ 3 = 1）</text>
  <text x="385" y="207" text-anchor="middle" font-size="10" fill="#666">2, 3 都在 nums 里（n ≥ 3）</text>

  <rect x="40" y="224" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="246" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">y ≥ 2</text>
  <text x="115" y="264" text-anchor="middle" font-size="10" fill="#666">1 ≤ y ≤ M−1</text>
  <path d="M 194 255 L 226 255" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="224" width="310" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="245" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">x = M ⊕ 1 ⊕ (y ⊕ 1)（因为 1 ⊕ (y⊕1) = y）</text>
  <text x="385" y="263" text-anchor="middle" font-size="10" fill="#666">y⊕1 一定是 [1, M−1] 内的整数（M−1 是奇数）</text>
  <text x="385" y="279" text-anchor="middle" font-size="10" fill="#666">故 y⊕1 ≤ M−1 &lt; M ≤ n，仍在 nums 中</text>

  <rect x="60" y="298" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170" y="318" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">下标只是「多重集」</text>
  <text x="170" y="335" text-anchor="middle" font-size="10" fill="#666">i ≤ j ≤ k 不限制取值顺序</text>

  <rect x="300" y="298" width="220" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="318" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">y = 0 / 1 是两支特判</text>
  <text x="410" y="335" text-anchor="middle" font-size="10" fill="#666">恰好落在 1 与 3 两个边界上</text>
</svg>
