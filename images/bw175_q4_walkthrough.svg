<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="310" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333">演算：nums = [5,1,2,1]，k = 2，pre = [0,5,6,8,9]</text>

  <text x="40" y="60" font-size="11" fill="#666">t \ i</text>
  <text x="130" y="60" font-size="11" fill="#666">0</text>
  <text x="200" y="60" font-size="11" fill="#666">1</text>
  <text x="270" y="60" font-size="11" fill="#666">2</text>
  <text x="340" y="60" font-size="11" fill="#666">3</text>
  <text x="410" y="60" font-size="11" fill="#666">4</text>

  <text x="40" y="92" font-size="11" fill="#666">0</text>
  <text x="130" y="92" font-size="12" fill="#333">0</text>
  <text x="200" y="92" font-size="12" fill="#bbb">∞</text>
  <text x="270" y="92" font-size="12" fill="#bbb">∞</text>
  <text x="340" y="92" font-size="12" fill="#bbb">∞</text>
  <text x="410" y="92" font-size="12" fill="#bbb">∞</text>

  <text x="40" y="124" font-size="11" fill="#666">1</text>
  <text x="130" y="124" font-size="12" fill="#bbb">∞</text>
  <text x="200" y="124" font-size="12" fill="#333">15</text>
  <text x="270" y="124" font-size="12" fill="#333">21</text>
  <text x="340" y="124" font-size="12" fill="#333">36</text>
  <text x="410" y="124" font-size="12" fill="#333">45</text>

  <text x="40" y="156" font-size="11" fill="#666">2</text>
  <text x="130" y="156" font-size="12" fill="#bbb">∞</text>
  <text x="200" y="156" font-size="12" fill="#bbb">∞</text>
  <text x="270" y="156" font-size="12" fill="#333">21</text>
  <text x="340" y="156" font-size="12" fill="#333">24</text>
  <text x="410" y="156" font-size="13" fill="#b85450">25</text>

  <rect x="40" y="180" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="202" font-size="11" fill="#333">dp[2][4] 候选：j=1 → 15 + 10 = 25；j=2 → 21 + 6 = 27；j=3 → 36 + 1 = 37</text>
  <text x="54" y="220" font-size="11" fill="#b85450">最优 j = 1，分割 [5] | [1,2,1]，分数 25</text>

  <rect x="40" y="238" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="54" y="256" font-size="11" fill="#333">最优决策随 i 单调：i=2 → 1；i=3 → 1；i=4 → 1（不左移，符合决策单调性）</text>

  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#666">每层只算 i ≥ t，决策 j ∈ [t−1, i−1]</text>
</svg>
