<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="177"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：全 1 的 4×4 网格的 f 值（正金字塔部分）</text>

  <!-- f 表 -->
  <text x="310" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">grid 全为 1，自下而上递推 f[i][j] = 1 + min(左下、正下、右下)，越界取 0</text>
  <g filter="url(#rough2)">
    <rect x="170" y="74" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="74" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="74" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="74" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="118" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="118" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="118" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="118" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="162" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="162" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="162" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="380" y="162" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="170" y="206" width="70" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="240" y="206" width="70" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="310" y="206" width="70" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="380" y="206" width="70" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="16" font-weight="bold" filter="url(#rough2)">
    <text x="205" y="102" fill="#446688">1</text>
    <text x="275" y="102" fill="#d6a040">2</text>
    <text x="345" y="102" fill="#d6a040">2</text>
    <text x="415" y="102" fill="#446688">1</text>
    <text x="205" y="146" fill="#446688">1</text>
    <text x="275" y="146" fill="#d6a040">2</text>
    <text x="345" y="146" fill="#d6a040">2</text>
    <text x="415" y="146" fill="#446688">1</text>
    <text x="205" y="190" fill="#446688">1</text>
    <text x="275" y="190" fill="#d6a040">2</text>
    <text x="345" y="190" fill="#d6a040">2</text>
    <text x="415" y="190" fill="#446688">1</text>
    <text x="205" y="234" fill="#4a7a3a">1</text>
    <text x="275" y="234" fill="#4a7a3a">1</text>
    <text x="345" y="234" fill="#4a7a3a">1</text>
    <text x="415" y="234" fill="#4a7a3a">1</text>
  </g>
  <text x="130" y="102" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="130" y="146" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="130" y="190" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="130" y="234" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 说明 -->
  <rect x="50" y="270" width="520" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="296" text-anchor="middle" font-size="13.5" fill="#d6a040" filter="url(#rough2)">正金字塔数 = Σ (f[i][j] − 1) = (0+1+1+0) × 3 行 + 0 = 6</text>
  <text x="310" y="322" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">f=2 的六个格各贡献一个高度 2 的金字塔；最后一行 f=1 不贡献；</text>
  <text x="310" y="346" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">高度 3 的金字塔底边宽 5，n=4 放不下，故不存在 f=3 的格</text>
  <text x="310" y="374" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">倒金字塔按对称方式从第 0 行向下推，本例同样得 6，总数 6 + 6 = 12</text>
</svg>
