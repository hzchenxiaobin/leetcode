<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5, 4, 2, 4]</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <text x="92" y="82" font-size="12" font-weight="bold" fill="#555">r</text>
  <text x="146" y="82" font-size="12" font-weight="bold" fill="#555">窗口 [l, r]</text>
  <text x="510" y="82" font-size="12" font-weight="bold" fill="#555">max−min / 贡献</text>

  <!-- row r=0 -->
  <text x="92" y="112" font-size="13" font-weight="bold" fill="#33507a">0</text>
  <g filter="url(#sk)">
    <rect x="130" y="94" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="186" y="94" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
    <rect x="242" y="94" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
    <rect x="298" y="94" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  </g>
  <text x="156" y="113" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="212" y="113" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <text x="268" y="113" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="324" y="113" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <text x="510" y="113" font-size="12" fill="#555">0 / 1</text>

  <!-- row r=1 -->
  <text x="92" y="162" font-size="13" font-weight="bold" fill="#33507a">1</text>
  <g filter="url(#sk)">
    <rect x="130" y="144" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="186" y="144" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="242" y="144" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
    <rect x="298" y="144" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  </g>
  <text x="156" y="163" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="212" y="163" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="268" y="163" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <text x="324" y="163" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <text x="510" y="163" font-size="12" fill="#555">1 / 2</text>

  <!-- row r=2 (shrink) -->
  <text x="92" y="212" font-size="13" font-weight="bold" fill="#8a3a36">2</text>
  <g filter="url(#sk)">
    <rect x="130" y="194" width="52" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3"/>
    <rect x="186" y="194" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="242" y="194" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="298" y="194" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  </g>
  <text x="156" y="213" text-anchor="middle" font-size="13" fill="#b85450">5</text>
  <text x="212" y="213" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="268" y="213" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="324" y="213" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <text x="500" y="207" font-size="11.5" fill="#8a3a36">先算 [0,2]：5−2 = 3 &gt; 2 ✗</text>
  <text x="500" y="226" font-size="12" font-weight="bold" fill="#2e6e2e">收缩后 2 / 2</text>

  <!-- row r=3 -->
  <text x="92" y="262" font-size="13" font-weight="bold" fill="#33507a">3</text>
  <g filter="url(#sk)">
    <rect x="130" y="244" width="52" height="28" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
    <rect x="186" y="244" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="242" y="244" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="298" y="244" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="156" y="263" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="212" y="263" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="268" y="263" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="324" y="263" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="510" y="263" font-size="12" fill="#555">2 / 3</text>

  <!-- shrink annotation -->
  <path d="M 156 224 Q 156 234 156 242" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="196" y="238" font-size="11" fill="#8a3a36">5 滑出窗口，l: 0 → 1</text>

  <!-- total box -->
  <g filter="url(#sk)">
    <rect x="130" y="300" width="300" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">ans = 1 + 2 + 2 + 3</text>
  <text x="280" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">= 8 ✓</text>

  <!-- window growth note -->
  <g filter="url(#sk)">
    <rect x="70" y="372" width="560" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="350" y="396" text-anchor="middle" font-size="12.5" fill="#2e6e2e">以每个 r 为右端点：合法左端点连成一段 (l*, r]，贡献 r − l* + 1；</text>
  <text x="350" y="417" text-anchor="middle" font-size="12.5" fill="#2e6e2e">l* 只增不减 —— 四步循环：入队 → 查差收缩 → 计数 → r 右移</text>
</svg>
