<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：source = "abbaa"，pattern = "aba"，targetIndices = [0,1,2]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">逐行推进 dp[j]（"-" 表示该状态不可达），m = 3</text>

  <rect x="34" y="62" width="492" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="76" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">i</text>
  <text x="146" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">字符</text>
  <text x="222" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">可删？</text>
  <text x="300" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">dp[0]</text>
  <text x="366" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">dp[1]</text>
  <text x="432" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">dp[2]</text>
  <text x="498" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">dp[3]</text>

  <rect x="34" y="98" width="492" height="28" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="117" text-anchor="middle" font-size="10.5" fill="#555">起点</text>
  <text x="146" y="117" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="222" y="117" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="300" y="117" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="366" y="117" text-anchor="middle" font-size="10.5" fill="#888">-</text>
  <text x="432" y="117" text-anchor="middle" font-size="10.5" fill="#888">-</text>
  <text x="498" y="117" text-anchor="middle" font-size="10.5" fill="#888">-</text>

  <rect x="34" y="130" width="492" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="149" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="146" y="149" text-anchor="middle" font-size="10.5" fill="#555">a</text>
  <text x="222" y="149" text-anchor="middle" font-size="10.5" fill="#8a6a20">是</text>
  <text x="300" y="149" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="366" y="149" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="432" y="149" text-anchor="middle" font-size="10.5" fill="#888">-</text>
  <text x="498" y="149" text-anchor="middle" font-size="10.5" fill="#888">-</text>

  <rect x="34" y="162" width="492" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="181" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <text x="146" y="181" text-anchor="middle" font-size="10.5" fill="#555">b</text>
  <text x="222" y="181" text-anchor="middle" font-size="10.5" fill="#8a6a20">是</text>
  <text x="300" y="181" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="366" y="181" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="432" y="181" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="498" y="181" text-anchor="middle" font-size="10.5" fill="#888">-</text>

  <rect x="34" y="194" width="492" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="213" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <text x="146" y="213" text-anchor="middle" font-size="10.5" fill="#555">b</text>
  <text x="222" y="213" text-anchor="middle" font-size="10.5" fill="#8a6a20">是</text>
  <text x="300" y="213" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="366" y="213" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="432" y="213" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="498" y="213" text-anchor="middle" font-size="10.5" fill="#888">-</text>

  <rect x="34" y="226" width="492" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="245" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <text x="146" y="245" text-anchor="middle" font-size="10.5" fill="#555">a</text>
  <text x="222" y="245" text-anchor="middle" font-size="10.5" fill="#4a7a3a">否</text>
  <text x="300" y="245" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="366" y="245" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="432" y="245" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="498" y="245" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">1</text>

  <rect x="34" y="258" width="492" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="76" y="277" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <text x="146" y="277" text-anchor="middle" font-size="10.5" fill="#555">a</text>
  <text x="222" y="277" text-anchor="middle" font-size="10.5" fill="#4a7a3a">否</text>
  <text x="300" y="277" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="366" y="277" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="432" y="277" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="498" y="277" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">1</text>

  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#8a3a36">答案 = dp[3] = 1：只能删 source[1] 或 source[2] 中的一个</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">删 1、2 后只剩 "aaa"；删 0 则 pattern 的首字母 a 无处安放，故上限就是 1</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#888">dp[j] 只在「pattern 前 j 位已被保住」的前提下累计删除数，非法路径自然被淘汰</text>
</svg>
