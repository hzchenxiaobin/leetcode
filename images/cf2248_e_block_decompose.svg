<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="736" height="416" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块分解：计数器数到 n 归零，遇到 0 也归零</text>
  <path d="M 92 42 Q 360 50 628 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 位号 -->
  <text x="139" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">1</text>
  <text x="173" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">2</text>
  <text x="207" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">3</text>
  <text x="241" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">4</text>
  <text x="275" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">5</text>
  <text x="309" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">6</text>
  <text x="343" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">7</text>
  <text x="377" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">8</text>
  <text x="411" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">9</text>
  <text x="445" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">10</text>
  <text x="479" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">11</text>
  <text x="513" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">12</text>
  <text x="547" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">13</text>
  <text x="581" y="72" text-anchor="middle" font-size="10" fill="#7a7a7a" filter="url(#rough2)">14</text>

  <!-- 14 个格子：7 个 1、0、4 个 1、0、1 -->
  <rect x="122" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="292" y="82" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="326" y="82" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="82" width="34" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="394" y="82" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="428" y="82" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="462" y="82" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="496" y="82" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="530" y="82" width="34" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="564" y="82" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="139" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="173" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="207" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="241" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="275" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="309" y="107" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="343" y="107" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="377" y="107" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="411" y="107" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="445" y="107" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="479" y="107" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="513" y="107" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="547" y="107" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="581" y="107" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- 块框 -->
  <rect x="118" y="78" width="212" height="46" rx="8" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="322" y="78" width="42" height="46" rx="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="390" y="78" width="142" height="46" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="560" y="78" width="42" height="46" rx="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 块说明 -->
  <path d="M 224 126 L 178 158" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 343 126 L 330 158" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 461 126 L 470 158" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 581 126 L 606 158" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="84" y="160" width="164" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="185" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">整块 ℓ = n，得 G</text>
  <rect x="256" y="160" width="150" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="331" y="185" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">余数块 1，得 g(1)</text>
  <rect x="414" y="160" width="150" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="489" y="185" text-anchor="middle" font-size="13" fill="#3a5f2c" filter="url(#rough2)">余数块 4，得 g(4)</text>
  <rect x="572" y="160" width="142" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="643" y="185" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">余数块 1</text>

  <!-- 说明面板 -->
  <rect x="40" y="222" width="640" height="152" rx="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="250" font-size="13" fill="#2b2b2b" filter="url(#rough2)">块（长度 ℓ）的得分：g(ℓ) = d·ℓ + R(ℓ)，R(ℓ) = 所有 p_j ≤ ℓ 的 r_j 之和</text>
  <text x="62" y="278" font-size="13" fill="#2b2b2b" filter="url(#rough2)">整块：g(n) = G = n·d + T（T = 全部 r_j 之和）；0 只是边界，本身不得分</text>
  <text x="62" y="306" font-size="13" fill="#2b2b2b" filter="url(#rough2)">带 k 个余数块的数组：长度 = Σ(ℓ_i + 1) − 1（每个块要一个前置 0，最后一个不用）</text>
  <text x="62" y="334" font-size="13" fill="#b85450" filter="url(#rough2)">全 1 串按 n, n, …, (L mod n) 切；两种切法逐块比较，整块对整块全部相消</text>
  <text x="62" y="360" font-size="13" fill="#b85450" filter="url(#rough2)">⇒ 胜负只由「余数块」决定：这是整道题的支点</text>
</svg>
