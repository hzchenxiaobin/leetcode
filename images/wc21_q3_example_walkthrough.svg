<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abpcplea"，按 key 排序后逐个判定</text>

  <text x="50" y="58" font-size="11" fill="#666" filter="url(#rough2)">s 的下标 0 … 7，字母依次为 a b p c p l e a</text>

  <rect x="50" y="80" width="510" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">候选词（按 key 排序）</text>
  <text x="200" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">长度</text>
  <text x="335" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">双指针命中下标</text>
  <text x="495" y="102" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定结果</text>

  <rect x="50" y="114" width="510" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="139" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">monkey</text>
  <text x="200" y="139" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
  <text x="335" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">—（s 中没有 m）</text>
  <text x="495" y="139" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">失败</text>

  <rect x="50" y="154" width="510" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="179" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">apple</text>
  <text x="200" y="179" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="335" y="179" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">0 → 2 → 4 → 5 → 6</text>
  <text x="495" y="179" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">命中，返回答案</text>

  <rect x="50" y="194" width="510" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="219" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">plea</text>
  <text x="200" y="219" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="335" y="219" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2 → 5 → 6 → 7</text>
  <text x="495" y="219" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">已返回，不再判定</text>

  <rect x="50" y="234" width="510" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">ale</text>
  <text x="200" y="259" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="335" y="259" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0 → 5 → 6</text>
  <text x="495" y="259" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">已返回，不再判定</text>

  <rect x="50" y="292" width="510" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="312" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">monkey 长度 6 最长，但 s 中根本没有 m，第一个候选就失败；</text>
  <text x="66" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">apple 长度 5 且命中 → 立即返回，plea / ale 连扫描都省了。</text>

  <rect x="50" y="352" width="510" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="372" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">示例 2：词表 [a, b, c] 长度同为 1，排序后 a 先命中 → 返回 "a"，</text>
  <text x="66" y="390" font-size="10.5" fill="#555" filter="url(#rough2)">体现「长度并列时取字典序最小」。</text>
</svg>
