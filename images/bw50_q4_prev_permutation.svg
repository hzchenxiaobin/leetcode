<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">一次操作 = 移到多重集排列的「上一个」：aabaa → aaaba</text>

  <!-- 步骤 1 -->
  <text x="60" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 找最大 i 使 s[i] &lt; s[i−1]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="108" y="74" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="156" y="74" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="204" y="74" width="44" height="40" fill="#fff8e1" stroke="#d6a040" rx="6"/>
    <rect x="252" y="74" width="44" height="40" fill="#fff8e1" stroke="#d6a040" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="82" y="100">a</text><text x="130" y="100">a</text><text x="178" y="100">b</text><text x="226" y="100">a</text><text x="274" y="100">a</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="82" y="128">0</text><text x="130" y="128">1</text><text x="178" y="128">2 ← s[i−1]</text><text x="226" y="128">3 ← i</text><text x="274" y="128">4</text>
  </g>
  <text x="330" y="100" font-size="12" fill="#8a3a34" filter="url(#rough2)">i = 3，v = 'b'；</text>
  <text x="330" y="118" font-size="12" fill="#8a3a34" filter="url(#rough2)">后缀 s[3..] = "aa" 非降</text>

  <!-- 步骤 2 -->
  <text x="60" y="162" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 找最大 j：s[i..j] 全 &lt; v</text>
  <g filter="url(#rough2)">
    <rect x="60" y="174" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="108" y="174" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="156" y="174" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="204" y="174" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="252" y="174" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="82" y="200">a</text><text x="130" y="200">a</text><text x="178" y="200">b</text><text x="226" y="200">a</text><text x="274" y="200">a</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="226" y="228">i = 3</text><text x="274" y="228">j = 4</text>
  </g>
  <text x="330" y="196" font-size="12" fill="#2d5a22" filter="url(#rough2)">j = 4：s[j] = 'a'</text>
  <text x="330" y="214" font-size="12" fill="#2d5a22" filter="url(#rough2)">是后缀中小于 v 的</text>
  <text x="330" y="232" font-size="12" fill="#2d5a22" filter="url(#rough2)">最大字符（最右出现）</text>

  <!-- 步骤 3 -->
  <text x="60" y="266" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 交换 s[i−1] 与 s[j]</text>
  <g filter="url(#rough2)">
    <rect x="60" y="278" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="108" y="278" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="156" y="278" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <rect x="204" y="278" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="252" y="278" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="82" y="304">a</text><text x="130" y="304">a</text><text x="178" y="304">a</text><text x="226" y="304">a</text><text x="274" y="304">b</text>
  </g>
  <text x="330" y="304" font-size="12" fill="#666" filter="url(#rough2)">"aaaab"，后缀仍非降</text>

  <!-- 步骤 4 -->
  <text x="60" y="342" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 反转下标 i 起的后缀</text>
  <g filter="url(#rough2)">
    <rect x="60" y="350" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="108" y="350" width="44" height="40" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="156" y="350" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <rect x="204" y="350" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="252" y="350" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="82" y="376">a</text><text x="130" y="376">a</text><text x="178" y="376">a</text><text x="226" y="376">b</text><text x="274" y="376">a</text>
  </g>
  <text x="330" y="376" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">"aaaba" ✓ 上一个排列</text>
</svg>
