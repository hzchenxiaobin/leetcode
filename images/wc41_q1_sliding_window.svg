<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：定长窗口滑动，只换两个端点</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1, 12, −5, −6, 50, 3]，k = 4，共 n − k + 1 = 3 个窗口</text>

  <text x="256" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 A：下标 [0, 3]，和 S₀ = 2</text>
  <path d="M 132 92 L 380 92" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 132 92 L 132 100" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 92 L 380 100" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="132" y="104" width="56" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <rect x="196" y="104" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="260" y="104" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="324" y="104" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <rect x="388" y="104" width="56" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
    <rect x="452" y="104" width="56" height="52" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" rx="5"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="160" y="138">1</text>
    <text x="224" y="138">12</text>
    <text x="288" y="138">−5</text>
    <text x="352" y="138">−6</text>
    <text x="416" y="138">50</text>
    <text x="480" y="138">3</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="160" y="172">0</text>
    <text x="224" y="172">1</text>
    <text x="288" y="172">2</text>
    <text x="352" y="172">3</text>
    <text x="416" y="172">4</text>
    <text x="480" y="172">5</text>
  </g>

  <text x="320" y="204" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold" filter="url(#rough2)">窗口 B：下标 [1, 4]，和 S₁ = 51（右移一格）</text>
  <path d="M 196 190 L 444 190" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 196 190 L 196 182" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 444 190 L 444 182" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="20" y="222" width="190" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="225" y="222" width="190" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="430" y="222" width="190" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="115" y="246" text-anchor="middle" font-size="12.5" fill="#2e4f70" font-weight="bold" filter="url(#rough2)">A 独有：左端要移出</text>
  <text x="115" y="268" text-anchor="middle" font-size="12" fill="#2e4f70" filter="url(#rough2)">nums[0] = 1</text>
  <text x="115" y="286" text-anchor="middle" font-size="11" fill="#2e4f70" filter="url(#rough2)">和减少 1</text>
  <text x="320" y="246" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">共享 k − 1 = 3 个</text>
  <text x="320" y="268" text-anchor="middle" font-size="12" fill="#2e5a24" filter="url(#rough2)">12，−5，−6 原地不动</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">重叠部分不参与重算</text>
  <text x="525" y="246" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold" filter="url(#rough2)">B 独有：右端要加入</text>
  <text x="525" y="268" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#rough2)">nums[4] = 50</text>
  <text x="525" y="286" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#rough2)">和增加 50</text>

  <g filter="url(#rough2)">
    <rect x="20" y="310" width="600" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="13.5" fill="#8f3830" font-weight="bold" filter="url(#rough2)">S₁ = S₀ − nums[0] + nums[4] = 2 − 1 + 50 = 51</text>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#8f3830" filter="url(#rough2)">每次滑动 O(1) 加法，枚举 n − k + 1 个窗口共 O(n)，无需重复求和</text>
</svg>
