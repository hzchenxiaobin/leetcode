  <path d="M540 132 L540 170" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="68" y="170" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="156" y="170" width="64" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="244" y="170" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="332" y="170" width="64" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="420" y="170" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="508" y="170" width="64" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="100" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="188" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="276" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="364" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="452" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="540" y="193" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <text x="116" y="226" font-size="11" fill="#888" filter="url(#rough2)">偶</text>
  <text x="204" y="226" font-size="11" fill="#888" filter="url(#rough2)">奇</text>
  <text x="292" y="226" font-size="11" fill="#888" filter="url(#rough2)">偶</text>
  <text x="380" y="226" font-size="11" fill="#888" filter="url(#rough2)">奇</text>
  <text x="468" y="226" font-size="11" fill="#888" filter="url(#rough2)">偶</text>
  <text x="556" y="226" font-size="11" fill="#888" filter="url(#rough2)">奇</text>

  <path d="M100 206 L100 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M188 206 L188 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M276 206 L276 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M364 206 L364 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M452 206 L452 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M540 206 L540 244" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="68" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="156" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="244" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="332" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="420" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="508" y="244" width="64" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="100" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="188" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="276" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="364" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="452" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">30</text>
  <text x="540" y="267" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">30</text>

  <rect x="58" y="310" width="524" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="13.5" fill="#2b3f5c" filter="url(#rough2)">每对里恰有一个偶数因子 → 该对的两个乘积都是偶数</text>
  <text x="320" y="358" text-anchor="middle" font-size="13.5" fill="#2b3f5c" filter="url(#rough2)">所有项偶数 → 任意加减的结果仍是偶数 → 永远不是 1（奇数）</text>
</svg>
