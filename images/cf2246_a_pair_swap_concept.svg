<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">相邻对交换：让每个 i·p_i 都含因子 2</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">n = 6 的例子，p = [2, 1, 4, 3, 6, 5]</text>

  <text x="142" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">对 1（i = 1,2）</text>
  <text x="318" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">对 2（i = 3,4）</text>
  <text x="494" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">对 3（i = 5,6）</text>

  <rect x="58" y="88" width="172" height="198" rx="10" fill="#e8f0fe" fill-opacity="0.35"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <rect x="234" y="88" width="172" height="198" rx="10" fill="#e8f0fe" fill-opacity="0.35"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <rect x="410" y="88" width="172" height="198" rx="10" fill="#e8f0fe" fill-opacity="0.35"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <text x="34" y="119" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">i</text>
  <text x="34" y="193" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">p_i</text>
  <text x="34" y="267" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">i·p_i</text>

  <rect x="68" y="96" width="64" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="156" y="96" width="64" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="244" y="96" width="64" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="332" y="96" width="64" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="420" y="96" width="64" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="508" y="96" width="64" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="100" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="188" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="276" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="364" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="452" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="540" y="119" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <text x="116" y="147" font-size="11" fill="#888" filter="url(#rough2)">奇</text>
  <text x="204" y="147" font-size="11" fill="#888" filter="url(#rough2)">偶</text>
  <text x="292" y="147" font-size="11" fill="#888" filter="url(#rough2)">奇</text>
  <text x="380" y="147" font-size="11" fill="#888" filter="url(#rough2)">偶</text>
  <text x="468" y="147" font-size="11" fill="#888" filter="url(#rough2)">奇</text>
  <text x="556" y="147" font-size="11" fill="#888" filter="url(#rough2)">偶</text>

  <path d="M100 132 L100 170" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M188 132 L188 170" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M276 132 L276 170" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M364 132 L364 170" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
