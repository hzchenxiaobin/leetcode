<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">置换环：排序 = 把每个错位值送回自己的下标</text>
  <path d="M 240 42 Q 450 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <text x="28" y="120" font-size="14" font-weight="bold" fill="#2b2b2b">nums</text>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#888">下标 0</text>
  <text x="204" y="78" text-anchor="middle" font-size="11" fill="#888">下标 1</text>
  <text x="298" y="78" text-anchor="middle" font-size="11" fill="#888">下标 2</text>
  <text x="392" y="78" text-anchor="middle" font-size="11" fill="#888">下标 3</text>
  <g filter="url(#sk)">
    <rect x="70" y="86" width="80" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="164" y="86" width="80" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="258" y="86" width="80" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="352" y="86" width="80" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="110" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">0</text>
  <text x="204" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">3</text>
  <text x="298" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">2</text>
  <text x="392" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">1</text>
  <text x="110" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">固定点 ✓</text>
  <text x="204" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8860b">错位</text>
  <text x="298" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">固定点 ✓</text>
  <text x="392" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8860b">错位</text>

  <!-- cycle arcs -->
  <path d="M 204 172 Q 298 262 392 172" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 386 178 Q 298 218 210 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="350" y="252" text-anchor="start" font-size="11" font-weight="bold" fill="#b8860b" stroke="#fafafa" stroke-width="4" style="paint-order:stroke">值 3 回下标 3</text>
  <text x="246" y="198" text-anchor="end" font-size="11" font-weight="bold" fill="#b8860b" stroke="#fafafa" stroke-width="4" style="paint-order:stroke">值 1 回下标 1</text>
  <text x="251" y="298" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">环 (1 3)：3 和 1 互相占位，必须靠交换归位</text>
  <text x="251" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a">固定点 0 和 2 不需要移动</text>

  <!-- right observation box -->
  <g filter="url(#sk)">
    <rect x="456" y="60" width="414" height="252" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="478" y="90" font-size="15" font-weight="bold" fill="#2b4a6e">关键观察：交换条件只看「值」</text>
  <text x="478" y="118" font-size="11.5" fill="#444">· 值的位置在变，值集合 {0..n-1} 不变</text>
  <text x="478" y="140" font-size="11.5" fill="#444">· 错位值 v 至少参与一次交换（位置要变）</text>
  <text x="478" y="162" font-size="11.5" fill="#444">· 设那一刻与 v 交换的值是 w：v AND w == k</text>
  <g filter="url(#sk)">
    <rect x="476" y="176" width="374" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="663" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">⟹ k 的每一位都在 v 里（k ⊆ v）</text>
  <text x="478" y="238" font-size="11.5" fill="#444">· 对所有错位值取交：k ⊆ M := 错位值的按位与</text>
  <text x="478" y="262" font-size="12" font-weight="bold" fill="#2e6e2e">M 就是答案的上界 —— k = M 恰好可行</text>
  <text x="478" y="288" font-size="10.5" fill="#888">（可行性：星形交换图，见下一张图）</text>

  <!-- bottom conclusion strip -->
  <g filter="url(#sk)">
    <rect x="60" y="336" width="810" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="362" font-size="12.5" font-weight="bold" fill="#2e6e2e">上界：k 可行 ⟹ k 是每个错位值的子掩码 ⟹ k ⊆ M（所有错位值的 AND）</text>
  <text x="80" y="386" font-size="11.5" fill="#555">本例（示例 1）：错位值 {3, 1}，M = 3 AND 1 = 1 → 答案不会超过 1，且 k=1 确实可行</text>
</svg>
