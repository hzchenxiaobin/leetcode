<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[9,9,9] —— 999 × 2 = 1998</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- reversed list -->
  <text x="40" y="80" font-size="12" font-weight="bold" fill="#b07818">反转后：</text>
  <g filter="url(#sk)">
    <rect x="100" y="56" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="180" y="56" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="260" y="56" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="128" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <text x="208" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <text x="288" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">9</text>
  <path d="M 156 74 L 176 74" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 236 74 L 256 74" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="128" y="110" text-anchor="middle" font-size="10.5" fill="#b07818">个位</text>
  <text x="208" y="110" text-anchor="middle" font-size="10.5" fill="#b07818">十位</text>
  <text x="288" y="110" text-anchor="middle" font-size="10.5" fill="#b07818">最高位</text>
  <text x="372" y="70" font-size="11" fill="#555">回文链表，反转后仍是 [9,9,9]，</text>
  <text x="372" y="88" font-size="11" fill="#555">但「头」的语义变了：从个位开始算</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="80" y="132" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="132" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="210" y="132" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="280" y="132" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="420" y="132" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="480" y="132" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="115" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">步骤</text>
  <text x="180" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">位值</text>
  <text x="245" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">carry 入</text>
  <text x="350" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">v = 位×2 + carry</text>
  <text x="450" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">写值</text>
  <text x="520" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">carry 出</text>

  <g filter="url(#sk)">
    <rect x="80" y="164" width="480" height="32" fill="#ffffff" stroke="#aaa" stroke-width="0.8"/>
    <rect x="80" y="196" width="480" height="32" fill="#f7f6f0" stroke="#aaa" stroke-width="0.8"/>
    <rect x="80" y="228" width="480" height="32" fill="#ffffff" stroke="#aaa" stroke-width="0.8"/>
    <rect x="80" y="260" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g stroke="#aaa" stroke-width="0.8">
    <line x1="150" y1="164" x2="150" y2="292"/>
    <line x1="210" y1="164" x2="210" y2="292"/>
    <line x1="280" y1="164" x2="280" y2="292"/>
    <line x1="420" y1="164" x2="420" y2="292"/>
    <line x1="480" y1="164" x2="480" y2="292"/>
  </g>
  <text x="115" y="184" text-anchor="middle" font-size="11.5" fill="#333">① 个位</text>
  <text x="180" y="184" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <text x="245" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">0</text>
  <text x="350" y="184" text-anchor="middle" font-size="11.5" fill="#333">9×2+0 = 18</text>
  <text x="450" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="520" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>

  <text x="115" y="216" text-anchor="middle" font-size="11.5" fill="#333">② 十位</text>
  <text x="180" y="216" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <text x="245" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>
  <text x="350" y="216" text-anchor="middle" font-size="11.5" fill="#333">9×2+1 = 19</text>
  <text x="450" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="520" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>

  <text x="115" y="248" text-anchor="middle" font-size="11.5" fill="#333">③ 最高位</text>
  <text x="180" y="248" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <text x="245" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>
  <text x="350" y="248" text-anchor="middle" font-size="11.5" fill="#333">9×2+1 = 19</text>
  <text x="450" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="520" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>

  <text x="115" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">收尾</text>
  <text x="180" y="280" text-anchor="middle" font-size="11.5" fill="#888">—</text>
  <text x="245" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">1</text>
  <text x="350" y="280" text-anchor="middle" font-size="11.5" fill="#555">无更高位可写</text>
  <text x="450" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">前插 1</text>
  <text x="520" y="280" text-anchor="middle" font-size="11.5" fill="#888">—</text>

  <!-- bottom strip -->
  <text x="122" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">翻倍后（反转表）</text>
  <g filter="url(#sk)">
    <rect x="62" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="106" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="82" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">8</text>
  <text x="126" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">9</text>
  <text x="170" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">9</text>
  <text x="122" y="392" text-anchor="middle" font-size="10" fill="#666">值已是翻倍结果</text>
  <path d="M 200 352 L 236 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <text x="287" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">反转回来</text>
  <g filter="url(#sk)">
    <rect x="246" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="290" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="334" y="336" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="266" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">9</text>
  <text x="310" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">9</text>
  <text x="354" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">8</text>
  <text x="287" y="392" text-anchor="middle" font-size="10" fill="#666">恢复正序</text>
  <path d="M 386 352 L 422 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <text x="491" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">前插进位 1</text>
  <g filter="url(#sk)">
    <rect x="428" y="336" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="472" y="336" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="516" y="336" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="560" y="336" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="448" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="492" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="536" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="580" y="357" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="491" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">= 1998 ✓</text>

  <!-- takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="414" width="560" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="435" text-anchor="middle" font-size="11.5" fill="#7a5415">每一位都产生进位 1：进位链贯穿全表</text>
  <text x="320" y="455" text-anchor="middle" font-size="11.5" fill="#7a5415">收尾 carry = 1 必须前插节点 1 —— 漏掉它，1998 就变成 998</text>
</svg>
