<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="490" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：root = [1,0,48,null,null,12,49]</text>
  <path d="M 165 36 Q 330 44 495 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== small BST ===== -->
  <g filter="url(#r)" stroke="#7a8a9a" stroke-width="1.5" fill="none">
    <line x1="105" y1="100" x2="62" y2="158"/>
    <line x1="105" y1="100" x2="176" y2="158"/>
    <line x1="188" y1="180" x2="148" y2="232"/>
    <line x1="198" y1="180" x2="238" y2="232"/>
  </g>
  <g filter="url(#r)">
    <circle cx="105" cy="88" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="55" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="190" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="140" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="248" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="105" y="93" fill="#8a6a1a">1</text>
    <text x="55" y="173" fill="#2b4a6e">0</text>
    <text x="190" y="173" fill="#2b4a6e">48</text>
    <text x="140" y="245" fill="#2e6e2e">12</text>
    <text x="248" y="245" fill="#2e6e2e">49</text>
  </g>

  <!-- ===== inorder arrow strip ===== -->
  <g filter="url(#r)">
    <rect x="300" y="76" width="330" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="465" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">中序遍历 → 严格递增序列</text>
  <g filter="url(#r)" font-size="13.5" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="328" y="134">0</text><text x="372" y="134">1</text><text x="414" y="134">12</text>
    <text x="460" y="134">48</text><text x="504" y="134">49</text>
  </g>
  <g filter="url(#r)" font-size="11" fill="#777" text-anchor="middle">
    <text x="350" y="134">→</text><text x="393" y="134">→</text><text x="437" y="134">→</text>
    <text x="482" y="134">→</text>
  </g>
  <g filter="url(#r)" font-size="11" font-weight="bold" fill="#b85450" text-anchor="middle">
    <text x="350" y="160">1</text><text x="393" y="160">11</text>
    <text x="437" y="160">36</text><text x="482" y="160">1</text>
  </g>
  <text x="465" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#r)">相邻间隙 = 1, 11, 36, 1，最小值 1 ⇒ 答案 1</text>

  <!-- ===== walkthrough table ===== -->
  <g filter="url(#r)">
    <rect x="40" y="270" width="580" height="180" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4"/>
    <rect x="40" y="270" width="580" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#r)" font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="78" y="290">出栈序</text>
    <text x="178" y="290">cur.val</text>
    <text x="286" y="290">prev</text>
    <text x="398" y="290">cur − prev</text>
    <text x="502" y="290">ans</text>
    <text x="584" y="290">说明</text>
  </g>
  <g filter="url(#r)" stroke="#c8d2dc" stroke-width="1">
    <line x1="120" y1="300" x2="120" y2="450"/>
    <line x1="226" y1="300" x2="226" y2="450"/>
    <line x1="340" y1="300" x2="340" y2="450"/>
    <line x1="452" y1="300" x2="452" y2="450"/>
    <line x1="548" y1="300" x2="548" y2="450"/>
    <line x1="40" y1="330" x2="620" y2="330"/>
    <line x1="40" y1="360" x2="620" y2="360"/>
    <line x1="40" y1="390" x2="620" y2="390"/>
    <line x1="40" y1="420" x2="620" y2="420"/>
  </g>
  <!-- highlight the two rows that refresh ans -->
  <g filter="url(#r)" opacity="0.5">
    <rect x="42" y="331" width="576" height="28" fill="#fce4ec"/>
    <rect x="42" y="421" width="576" height="28" fill="#fce4ec"/>
  </g>
  <g filter="url(#r)" font-size="12" fill="#333" text-anchor="middle">
    <text x="78" y="320">1</text><text x="178" y="320">0</text><text x="286" y="320">—</text>
    <text x="398" y="320">—</text><text x="502" y="320" fill="#999">∞</text>
    <text x="584" y="320" font-size="10.5" fill="#666">首个节点</text>

    <text x="78" y="350">2</text><text x="178" y="350" font-weight="bold">1</text><text x="286" y="350">0</text>
    <text x="398" y="350" font-weight="bold" fill="#b85450">1</text>
    <text x="502" y="350" font-weight="bold" fill="#b85450">1</text>
    <text x="584" y="350" font-size="10.5" fill="#b85450">刷新 ans</text>

    <text x="78" y="380">3</text><text x="178" y="380" font-weight="bold">12</text><text x="286" y="380">1</text>
    <text x="398" y="380">11</text><text x="502" y="380">1</text>
    <text x="584" y="380" font-size="10.5" fill="#666">不更优</text>

    <text x="78" y="410">4</text><text x="178" y="410" font-weight="bold">48</text><text x="286" y="410">12</text>
    <text x="398" y="410">36</text><text x="502" y="410">1</text>
    <text x="584" y="410" font-size="10.5" fill="#666">不更优</text>

    <text x="78" y="440">5</text><text x="178" y="440" font-weight="bold">49</text><text x="286" y="440">48</text>
    <text x="398" y="440" font-weight="bold" fill="#b85450">1</text>
    <text x="502" y="440" font-weight="bold" fill="#b85450">1</text>
    <text x="584" y="440" font-size="10.5" fill="#b85450">再刷到 1</text>
  </g>
  <text x="330" y="472" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#r)">prev 恒等于「中序前一个节点的值」，于是每步比较的正好是一对相邻项。</text>
</svg>
