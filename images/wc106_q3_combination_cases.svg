<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="348" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">四类组合：按值重复情况套不同组合数</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">值关系</text>
  <text x="200" y="62" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">组合数公式</text>
  <text x="430" y="62" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例贡献</text>
  <rect x="60" y="76" width="130" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="100.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a = b = c</text>
  <rect x="200" y="76" width="220" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="100.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(cnt[a], 3)</text>
  <rect x="430" y="76" width="180" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="99.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">（本例无）</text>
  <rect x="60" y="116" width="130" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="140.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a = b ≠ c</text>
  <rect x="200" y="116" width="220" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="140.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C(cnt[a],2) × cnt[c]</text>
  <rect x="430" y="116" width="180" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="139.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2,4) → 1×2 = 2</text>
  <rect x="60" y="156" width="130" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="180.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a ≠ b = c</text>
  <rect x="200" y="156" width="220" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="180.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[a] × C(cnt[b],2)</text>
  <rect x="430" y="156" width="180" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="179.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,3,3) → 2×1 = 2</text>
  <rect x="60" y="196" width="130" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="220.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a ≠ b ≠ c</text>
  <rect x="200" y="196" width="220" height="40" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="220.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[a] × cnt[b] × cnt[c]</text>
  <rect x="430" y="196" width="180" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520.0" y="219.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2,5) → 2·2·2 = 8</text>
  <text x="330" y="300" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 1 合计：8 + 8 + 2 + 2 = 20，与官方输出一致</text>
  <text x="330" y="328" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">所有乘法用 64 位累加、每步取模；C(k,3) 的整数除法在 k&lt;3 时自然为 0</text>
</svg>
