<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">取绝对值、排序，再用双指针数「比值 ≤ 2」的数对</text>
  <text x="70" y="128" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">abs</text>
  <rect x="96" y="96" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122.0" y="127.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="122.0" y="166" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="158" y="96" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184.0" y="127.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="184.0" y="166" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="220" y="96" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="246.0" y="127.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="246.0" y="166" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="282" y="96" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="308.0" y="127.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="308.0" y="166" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <rect x="153" y="89" width="52" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="277" y="89" width="52" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i</text>
  <text x="308" y="78" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">r 最远可达</text>
  <text x="296" y="218" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">a[r] ≤ 2·a[i]：r 单调不减（2·a[i] 随 i 增大）</text>
  <rect x="50" y="240" width="600" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">对每个 i：把 r 推到最远，累加 r − i（这些都是以 i 为「较小端」的完美对）</text>
  <text x="350" y="290" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每个数对只被计一次，且 i 与 r 都只前进</text>
  <rect x="50" y="314" width="600" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="340" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">示例 2：abs = [1,2,3,4] → 对数为 1+2+1+0 = 4</text>
  <text x="350" y="362" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">总时间 O(n log n)（排序），扫描 O(n)</text>
</svg>
