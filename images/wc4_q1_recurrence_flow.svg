<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 滚动递推</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先算 S 与 F(0)，再沿旋转方向 O(1) 推 n−1 次</text>

  <rect x="110" y="64" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="126" y="86" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① S = Σnums[i]，F(0) = Σ i·nums[i]</text>
  <text x="126" y="106" font-size="10" fill="#555" filter="url(#rough2)">一次遍历同时求出两者，令 cur = F(0)，best = F(0)</text>

  <path d="M 280 120 L 280 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="142" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="169" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">for k = 1 … n − 1</text>

  <rect x="70" y="204" width="420" height="120" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="84" y="222" font-size="9.5" fill="#888" filter="url(#rough2)">循环体（n−1 轮）</text>

  <rect x="92" y="232" width="376" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="108" y="254" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">x = nums[n − k]　（上一轮的末尾元素）</text>
  <text x="108" y="276" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cur = cur + S − n·x　（O(1) 转移）</text>
  <text x="108" y="298" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">best = max(best, cur)</text>

  <path d="M 280 324 L 280 354" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="358" width="340" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 返回 best = max F(k)</text>

  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">尾元素权重 n−1 → 0，其余元素权重各 +1，净增量恰好是 S − n·x</text>
</svg>
