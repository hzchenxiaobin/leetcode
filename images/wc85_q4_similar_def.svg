<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">相似 = 差异位置数为 0，或恰为 2 且两处字母互换</text>

  <!-- tars vs rats -->
  <g filter="url(#rough2)">
    <text x="40" y="72" font-size="13" fill="#2f5527">tars</text>
    <rect x="120" y="54" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="137" y="75" text-anchor="middle" font-size="14" fill="#8a3020">t</text>
    <rect x="160" y="54" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="177" y="75" text-anchor="middle" font-size="14" fill="#2f5527">a</text>
    <rect x="200" y="54" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="217" y="75" text-anchor="middle" font-size="14" fill="#8a3020">r</text>
    <rect x="240" y="54" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="257" y="75" text-anchor="middle" font-size="14" fill="#2f5527">s</text>

    <text x="40" y="118" font-size="13" fill="#2f5527">rats</text>
    <rect x="120" y="100" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="137" y="121" text-anchor="middle" font-size="14" fill="#8a3020">r</text>
    <rect x="160" y="100" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="177" y="121" text-anchor="middle" font-size="14" fill="#2f5527">a</text>
    <rect x="200" y="100" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="217" y="121" text-anchor="middle" font-size="14" fill="#8a3020">t</text>
    <rect x="240" y="100" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="257" y="121" text-anchor="middle" font-size="14" fill="#2f5527">s</text>

    <path d="M137,86 L137,98" stroke="#b85450" stroke-width="1.5"/>
    <path d="M217,86 L217,98" stroke="#b85450" stroke-width="1.5"/>
    <text x="300" y="98" font-size="12" fill="#8a3020">差异 2 处：t↔r 互换</text>
    <text x="300" y="118" font-size="12" fill="#4a7a3a">相似 ✓</text>
  </g>

  <!-- tars vs star -->
  <g filter="url(#rough2)">
    <text x="40" y="184" font-size="13" fill="#2f5527">tars</text>
    <rect x="120" y="166" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="137" y="187" text-anchor="middle" font-size="14" fill="#8a3020">t</text>
    <rect x="160" y="166" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="177" y="187" text-anchor="middle" font-size="14" fill="#8a3020">a</text>
    <rect x="200" y="166" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="217" y="187" text-anchor="middle" font-size="14" fill="#8a3020">r</text>
    <rect x="240" y="166" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="257" y="187" text-anchor="middle" font-size="14" fill="#8a3020">s</text>

    <text x="40" y="230" font-size="13" fill="#2f5527">star</text>
    <rect x="120" y="212" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="137" y="233" text-anchor="middle" font-size="14" fill="#8a3020">s</text>
    <rect x="160" y="212" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="177" y="233" text-anchor="middle" font-size="14" fill="#8a3020">t</text>
    <rect x="200" y="212" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="217" y="233" text-anchor="middle" font-size="14" fill="#8a3020">a</text>
    <rect x="240" y="212" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="257" y="233" text-anchor="middle" font-size="14" fill="#8a3020">r</text>

    <text x="300" y="212" font-size="12" fill="#8a3020">差异 4 处 → 一次交换救不了</text>
    <text x="300" y="232" font-size="12" fill="#b85450">不相似 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="268" width="400" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="292" text-anchor="middle" font-size="12" fill="#7a5a10">实现：从左到右数差异，第 3 处即 return false</text>
    <text x="260" y="312" text-anchor="middle" font-size="12" fill="#7a5a10">差异 2 处时再验 a[d1]==b[d2] 且 a[d2]==b[d1]</text>
    <text x="260" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a">相似关系对称、自反，但不传递 → 只能用连通分量</text>
  </g>
</svg>
