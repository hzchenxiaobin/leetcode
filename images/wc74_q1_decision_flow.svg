<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="28" font-size="13.5" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">判定流程：数子 → 查 8 条线 → 核对终局归属</text>
  <text x="280" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">三步都是对最终棋盘的一次性检查，与落子顺序无关</text>
  <rect x="36" y="64" width="344" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="84" font-size="11" fill="#2f3f5c" text-anchor="start" font-weight="bold" filter="url(#rough2)">① 统计 cX, cO</text>
  <text x="50" y="100" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">遍历 9 格，分别数 'X' 与 'O' 的个数</text>
  <path d="M 208.0 110 L 208.0 126" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="126" width="344" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="146" font-size="11" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">② cX == cO 或 cX == cO + 1 ？</text>
  <text x="50" y="163" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">不满足 ⇒ 回合数对不上（X 先手、交替落子）</text>
  <path d="M 208.0 174 L 208.0 194" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="194" width="344" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="214" font-size="11" fill="#2f3f5c" text-anchor="start" font-weight="bold" filter="url(#rough2)">③ 扫 8 条线 → WX, WO</text>
  <text x="50" y="230" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">行 3 + 列 3 + 对角线 2，各自是否被占满</text>
  <path d="M 208.0 240 L 208.0 258" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="258" width="344" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="278" font-size="11" fill="#8a3a36" text-anchor="start" font-weight="bold" filter="url(#rough2)">④ 三条结论必须同时成立</text>
  <text x="60" y="297" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">• WX 且 WO 同时成立 → 不可能</text>
  <text x="60" y="315" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">• WX 且 cX ≠ cO+1 → 非法（X 必须刚下完）</text>
  <text x="60" y="333" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">• WO 且 cX ≠ cO  → 非法（O 必须刚下完）</text>
  <path d="M 208.0 352 L 208.0 372" stroke="#666" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="372" width="344" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="391" font-size="11" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">⑤ 全部通过 → return true</text>
  <text x="50" y="407" font-size="9.8" fill="#555" text-anchor="start" filter="url(#rough2)">合法局面，存在一条落子序列到达它</text>
  <rect x="404" y="126" width="126" height="226" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="467" y="152" font-size="10.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">任一条件</text>
  <text x="467" y="168" font-size="10.5" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">不满足</text>
  <path d="M 467 180 L 467 240" stroke="#b85450" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="425" y="244" width="84" height="36" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="467" y="267" font-size="12" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="467" y="300" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">提前返回</text>
  <text x="467" y="318" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">顺序无关</text>
  <text x="467" y="336" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">全部为「与」</text>
  <path d="M 380 150 L 404 150" stroke="#b85450" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 305 L 404 305" stroke="#b85450" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="440" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">总操作 ≤ 33 次：时间 O(1)，空间 O(1)</text>
</svg>
