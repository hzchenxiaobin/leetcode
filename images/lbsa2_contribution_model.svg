<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察①：「不同值计数」拆成每个位置的 ±1 区间贡献</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row, aligned to r-grid: columns edge at 130+84k -->
  <g filter="url(#sk)">
    <rect x="144" y="56" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="228" y="56" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="312" y="56" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="396" y="56" width="56" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="480" y="56" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="172" y="79">3</text>
    <text x="256" y="79">2</text>
    <text x="340" y="79">2</text>
    <text x="424" y="79">5</text>
    <text x="508" y="79">4</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#777">
    <text x="172" y="106">奇 p=1</text>
    <text x="256" y="106">偶 p=2</text>
    <text x="340" y="106">偶 p=3</text>
    <text x="424" y="106">奇 p=4</text>
    <text x="508" y="106">偶 p=5</text>
  </g>
  <text x="128" y="79" text-anchor="end" font-size="13" fill="#2b2b2b">nums =</text>

  <!-- r axis header -->
  <text x="118" y="136" text-anchor="end" font-size="11" fill="#888">贡献区间 →</text>
  <g font-size="11" text-anchor="middle" fill="#666">
    <text x="172" y="136">r=1</text>
    <text x="256" y="136">r=2</text>
    <text x="340" y="136">r=3</text>
    <text x="424" y="136">r=4</text>
    <text x="508" y="136">r=5</text>
  </g>

  <!-- contribution bars; column edges: 130,214,298,382,466,550 -->
  <!-- p=1 odd: [1,5] -->
  <g filter="url(#sk)">
    <rect x="130" y="146" width="420" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="124" y="164" text-anchor="end" font-size="11" fill="#b85450">p=1 (3)</text>
  <text x="340" y="164" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold">−1 盖住 [1, nxt−1] = [1,5]</text>

  <!-- p=2 even: [2,2] -->
  <g filter="url(#sk)">
    <rect x="214" y="180" width="84" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="124" y="198" text-anchor="end" font-size="11" fill="#446688">p=2 (2)</text>
  <text x="256" y="198" text-anchor="middle" font-size="12" fill="#2f4a6b" font-weight="bold">+1</text>

  <!-- p=3 even: [3,5] -->
  <g filter="url(#sk)">
    <rect x="298" y="214" width="252" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="124" y="232" text-anchor="end" font-size="11" fill="#446688">p=3 (2)</text>
  <text x="424" y="232" text-anchor="middle" font-size="12" fill="#2f4a6b" font-weight="bold">+1 接管 [3,5]</text>

  <!-- p=4 odd: [4,5] -->
  <g filter="url(#sk)">
    <rect x="382" y="248" width="168" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="124" y="266" text-anchor="end" font-size="11" fill="#b85450">p=4 (5)</text>
  <text x="466" y="266" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold">−1</text>

  <!-- p=5 even: [5,5] -->
  <g filter="url(#sk)">
    <rect x="466" y="282" width="84" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="124" y="300" text-anchor="end" font-size="11" fill="#446688">p=5 (4)</text>
  <text x="508" y="300" text-anchor="middle" font-size="12" fill="#2f4a6b" font-weight="bold">+1</text>

  <!-- truncation annotation at x=298 -->
  <path d="M 298 176 Q 298 172 298 146" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="304" y="186" font-size="10.5" fill="#b85450">同值 2 再现于 p=3，</text>
  <text x="304" y="199" font-size="10.5" fill="#b85450">p=2 的贡献被截断在 r=2</text>

  <!-- D row -->
  <text x="124" y="343" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold">D(r) =</text>
  <g font-size="14" text-anchor="middle">
    <text x="172" y="340" fill="#8f3a36" font-weight="bold">−1</text>
    <text x="256" y="340" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="340" y="340" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="424" y="340" fill="#8f3a36" font-weight="bold">−1</text>
    <text x="508" y="340" fill="#4a7a3a" font-weight="bold">0</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="2">
    <ellipse cx="256" cy="336" rx="14" ry="12"/>
    <ellipse cx="340" cy="336" rx="14" ry="12"/>
    <ellipse cx="508" cy="336" rx="14" ry="12"/>
  </g>
  <text x="570" y="343" font-size="10.5" fill="#4a7a3a">覆盖 r 的</text>
  <text x="570" y="356" font-size="10.5" fill="#4a7a3a">±1 之和</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="70" y="376" width="500" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">值 v 在窗口 [l, r] 中被计数 ⟺ r 落在 v 的「最后出现 p」的区间 [p, nxt[p]−1]</text>
  <text x="320" y="420" text-anchor="middle" font-size="12.5" fill="#7a5415">l 每左移一格：只有新位置 l 的 ±1 出现 —— 盖到 [l, nxt[l]−1]，一次区间加</text>
  <text x="320" y="440" text-anchor="middle" font-size="12.5" fill="#7a5415">D_l(r) = 0 ⟺ 窗口 [l, r] 平衡（不同偶数个数 = 不同奇数个数）</text>
</svg>
