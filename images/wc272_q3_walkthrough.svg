<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：dp 与 ans 逐步推进（两个官方示例）</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">每行只做一次 O(1) 递推 + 一次累加；断链行 dp 归 1，续接行 dp 在前值上加一</text>

  <!-- ===== table 1: example 1 ===== -->
  <text x="40" y="92" font-size="13" fill="#446688" font-weight="bold">示例 1：prices = [3, 2, 1, 4]</text>

  <rect x="40" y="102" width="40" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="60" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="80" y="102" width="72" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="116" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">prices[i]</text>
  <rect x="152" y="102" width="72" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="188" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">相邻差</text>
  <rect x="224" y="102" width="48" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="248" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">dp</text>
  <rect x="272" y="102" width="48" height="30" rx="4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="296" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <rect x="40" y="132" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="60" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="132" width="72" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="116" y="152" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="152" y="132" width="72" height="30" rx="4" fill="#f0f0ec" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>
  <text x="188" y="152" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="224" y="132" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="248" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="132" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="296" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="40" y="162" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="60" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="162" width="72" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="116" y="182" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="152" y="162" width="72" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="188" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
  <rect x="224" y="162" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="248" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="272" y="162" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="296" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="40" y="192" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="60" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="192" width="72" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="116" y="212" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="152" y="192" width="72" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="188" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
  <rect x="224" y="192" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="248" y="212" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="272" y="192" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="296" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="336" y="212" font-size="10" fill="#446688" font-weight="bold">← 段尾：1+2+3 = 6</text>

  <rect x="40" y="222" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="60" y="242" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="80" y="222" width="72" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="116" y="242" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="152" y="222" width="72" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="188" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+3 ✗</text>
  <rect x="224" y="222" width="48" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="248" y="242" text-anchor="middle" font-size="11" fill="#8c6a20" font-weight="bold">1</text>
  <rect x="272" y="222" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="296" y="242" text-anchor="middle" font-size="11" fill="#2e5e2e" font-weight="bold">7</text>
  <text x="336" y="242" font-size="10" fill="#2e5e2e" font-weight="bold">← 断链归 1</text>

  <!-- ===== table 2: example 2 ===== -->
  <text x="400" y="92" font-size="13" fill="#d6a040" font-weight="bold">示例 2：prices = [8, 6, 7, 7]</text>

  <rect x="400" y="102" width="40" height="30" rx="4" fill="#8c6a20" stroke="#8c6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="420" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <rect x="440" y="102" width="60" height="30" rx="4" fill="#8c6a20" stroke="#8c6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="470" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">prices[i]</text>
  <rect x="500" y="102" width="60" height="30" rx="4" fill="#8c6a20" stroke="#8c6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="530" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">相邻差</text>
  <rect x="560" y="102" width="36" height="30" rx="4" fill="#8c6a20" stroke="#8c6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">dp</text>
  <rect x="596" y="102" width="40" height="30" rx="4" fill="#8c6a20" stroke="#8c6a20" stroke-width="1.2" filter="url(#sk)"/>
  <text x="616" y="122" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <rect x="400" y="132" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="440" y="132" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="470" y="152" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="500" y="132" width="60" height="30" rx="4" fill="#f0f0ec" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>
  <text x="530" y="152" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="560" y="132" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="596" y="132" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="616" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="400" y="162" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="420" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="440" y="162" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="470" y="182" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="500" y="162" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="530" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−2 ✗</text>
  <rect x="560" y="162" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="182" text-anchor="middle" font-size="11" fill="#8c6a20" font-weight="bold">1</text>
  <rect x="596" y="162" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="616" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <rect x="400" y="192" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="420" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="440" y="192" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="470" y="212" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="500" y="192" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#sk)"/>
  <text x="530" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1 ✗</text>
  <rect x="560" y="192" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="212" text-anchor="middle" font-size="11" fill="#8c6a20" font-weight="bold">1</text>
  <rect x="596" y="192" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="616" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="400" y="222" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="420" y="242" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="440" y="222" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="500" y="222" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="530" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0 ✗</text>
  <rect x="560" y="222" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="578" y="242" text-anchor="middle" font-size="11" fill="#8c6a20" font-weight="bold">1</text>
  <rect x="596" y="222" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="616" y="242" text-anchor="middle" font-size="11" fill="#2e5e2e" font-weight="bold">4</text>
  <text x="530" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 相等也断链：「恰好少 1」不含差 0</text>

  <!-- ===== the 7 subarrays of example 1 ===== -->
  <text x="40" y="304" font-size="12.5" fill="#444" font-weight="bold">示例 1 的 7 个平滑段（按右端点分组）：</text>

  <rect x="40" y="316" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="100" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i=0: [3]</text>
  <rect x="168" y="316" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="228" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i=1: [2], [3,2]</text>
  <rect x="296" y="316" width="140" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="366" y="336" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i=2: [1], [2,1], [3,2,1]</text>
  <rect x="444" y="316" width="120" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="504" y="336" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">i=3: [4]</text>

  <text x="40" y="372" font-size="11" fill="#666">每个子数组恰被它的右端点统计一次 —— 1 + 2 + 3 + 1 = 7，与段视角 3×4/2 + 1×2/2 = 7 完全一致。</text>

  <!-- ===== bottom banner ===== -->
  <rect x="40" y="392" width="600" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="340" y="414" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">示例 1：段 [3,2,1] 贡献 1+2+3 = 6，段 [4] 贡献 1，合计 7</text>
  <text x="340" y="434" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">示例 2：全程断链（−2、+1、0 都 ≠ −1），4 个单日阶段，合计 4</text>
</svg>
