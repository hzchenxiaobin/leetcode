<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">判定流程：哪些锁必须解，一遍扫描定死</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="54" width="240" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">扫描每个 locked[p] = 1 的下标 p</text>
  <text x="320" y="90" text-anchor="middle" font-size="11" fill="#2b6e9e">边扫边维护 pre = max(nums[0..p−1])</text>
  <path d="M 320 98 L 320 112" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,112 452,146 320,180 188,146" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="151" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">nums[p] = p+1 ？</text>
  <path d="M 188 146 L 130 146" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="158" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="24" y="128" width="170" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="109" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">值卡死 → forced+1</text>
  <path d="M 320 180 L 320 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="192" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <polygon points="320,200 452,234 320,268 188,234" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="232" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">p = 0 或 pre = p ？</text>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#8a6415">（前缀恰为 {1,…,p}）</text>
  <path d="M 188 234 L 130 234" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="158" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="24" y="216" width="170" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="109" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">大值要穿墙 → forced+1</text>
  <path d="M 320 268 L 320 288" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="200" y="292" width="240" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="314" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">「好墙」：保留，零成本</text>

  <path d="M 109 164 Q 96 250 100 344" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 109 252 Q 109 300 116 344" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 328 L 320 344" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="64" rx="10" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.6"/>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">forced = 两个红框的计数之和；若 forced &gt; k → 直接返回 −1</text>
  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#6a5a2a">否则 答案 = forced + 全局逆序对数 inv(nums)</text>
</svg>
