<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">「每秒强制取最大并改写」→ 大顶堆四步循环</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: plain array -->
  <text x="135" y="68" text-anchor="middle" font-size="12" fill="#666666">gifts（普通数组，找最大要 O(n)）</text>
  <g filter="url(#sk)">
    <rect x="22" y="78" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="66" y="78" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="110" y="78" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="154" y="78" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="198" y="78" width="40" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="42" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b">25</text>
  <text x="86" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b">64</text>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b">9</text>
  <text x="174" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b">4</text>
  <text x="218" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b">100</text>

  <!-- arrow array -> heap -->
  <path d="M 248 95 Q 295 88 342 94" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="295" y="82" text-anchor="middle" font-size="11" fill="#555555">heapify 建堆 O(n)</text>

  <!-- right: max-heap sketch -->
  <g filter="url(#sk)">
    <line x1="452" y1="100" x2="416" y2="142" stroke="#8899aa" stroke-width="1.2"/>
    <line x1="452" y1="100" x2="488" y2="142" stroke="#8899aa" stroke-width="1.2"/>
    <line x1="416" y1="152" x2="386" y2="196" stroke="#8899aa" stroke-width="1.2"/>
    <line x1="416" y1="152" x2="446" y2="196" stroke="#8899aa" stroke-width="1.2"/>
    <circle cx="452" cy="90" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="416" cy="147" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="488" cy="147" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="386" cy="202" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="446" cy="202" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="452" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">100</text>
  <text x="416" y="152" text-anchor="middle" font-size="11" fill="#2b6e9e">64</text>
  <text x="488" y="152" text-anchor="middle" font-size="11" fill="#2b6e9e">25</text>
  <text x="386" y="207" text-anchor="middle" font-size="11" fill="#2b6e9e">9</text>
  <text x="446" y="207" text-anchor="middle" font-size="11" fill="#2b6e9e">4</text>
  <text x="452" y="238" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">大顶堆：堆顶恒为全局最大，取 max 只要 O(log n)</text>

  <!-- four-step cycle -->
  <g filter="url(#sk)">
    <rect x="40" y="254" width="240" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="360" y="254" width="240" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="360" y="334" width="240" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="40" y="334" width="240" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="160" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① pop 堆顶 v</text>
  <text x="160" y="295" text-anchor="middle" font-size="11" fill="#2b6e9e">（当前最大，并列任选）</text>
  <text x="480" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">② s = ⌊√v⌋</text>
  <text x="480" y="295" text-anchor="middle" font-size="11" fill="#8a6415">（开方，向下取整）</text>
  <text x="480" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ push s 回堆</text>
  <text x="480" y="375" text-anchor="middle" font-size="11" fill="#2e6e2e">（堆自动重排）</text>
  <text x="160" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">④ sum -= v - s</text>
  <text x="160" y="375" text-anchor="middle" font-size="11" fill="#2e6e2e">（滚动累减移走量）</text>

  <path d="M 284 280 Q 322 272 356 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 310 Q 488 322 480 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 356 360 Q 318 368 284 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 160 330 Q 152 322 160 310" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555">重复 k 次</text>

  <!-- overflow warning -->
  <g filter="url(#sk)">
    <rect x="40" y="408" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 剩余总量最坏 10³ × 10⁹ = 10¹²，超出 32 位 int 上界 → 累加必须用 long long</text>
  <text x="320" y="441" text-anchor="middle" font-size="11" fill="#b85450">返回类型 long long；Python 整数任意精度，无此忧</text>
</svg>
