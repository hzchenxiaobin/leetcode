<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,2,3,4]（排序后不变）</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">外层 k 从 3 递减到 2，内层 i、j 相向移动，命中就批量计数</text>

  <rect x="20" y="62" width="600" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="119" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">k（c）</text>
  <text x="191" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="229" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="332" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">a + b 与 c 比较</text>
  <text x="484" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="586" y="80" text-anchor="middle" font-size="10" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="20" y="90" width="600" height="28" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="108" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">①</text>
  <text x="119" y="108" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=3, c=4</text>
  <text x="191" y="108" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="229" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="332" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 + 3 = 5 &gt; 4 ✓</text>
  <text x="484" y="108" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans += 2，j→1</text>
  <text x="586" y="108" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="20" y="118" width="600" height="28" fill="#f7f9fb" stroke="#c9d3dd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="136" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">②</text>
  <text x="119" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=3, c=4</text>
  <text x="191" y="136" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="229" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="332" y="136" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">2 + 2 = 4 ≤ 4 ✗</text>
  <text x="484" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">i→1，i=j 结束</text>
  <text x="586" y="136" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="20" y="146" width="600" height="28" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="164" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③</text>
  <text x="119" y="164" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=2, c=3</text>
  <text x="191" y="164" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="229" y="164" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="332" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 + 2 = 4 &gt; 3 ✓</text>
  <text x="484" y="164" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ans += 1，j→0</text>
  <text x="586" y="164" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="20" y="174" width="600" height="28" fill="#f7f9fb" stroke="#c9d3dd" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">④</text>
  <text x="119" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k=1 &lt; 2</text>
  <text x="191" y="192" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="229" y="192" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="332" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">外层条件失效</text>
  <text x="484" y="192" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">返回 ans</text>
  <text x="586" y="192" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="320" y="226" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">被计入的三个三元组（下标 0 与 1 是两个不同的 2，各算一次）</text>

  <rect x="52" y="238" width="172" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="138" y="259" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">{2,3,4} 用第 1 个 2</text>
  <rect x="234" y="238" width="172" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="259" text-anchor="middle" font-size="10" fill="#33502a" filter="url(#rough2)">{2,3,4} 用第 2 个 2</text>
  <rect x="416" y="238" width="148" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="259" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">{2,2,3} 来自 k=2</text>

  <rect x="52" y="288" width="512" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="308" y="306" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">步骤①里 j − i = 2 − 0 = 2：a 取下标 0 或 1，b 固定为下标 2 的 3，两者都满足 2+3 &gt; 4</text>
  <text x="308" y="323" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">这正是「一次加一批」的意义：不必再枚举 a，直接算出它有多少种取法</text>

  <text x="320" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 2：nums = [4,2,3,4] 排序为 [2,3,4,4]，同样流程得到 4</text>
  <text x="320" y="376" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（{2,3,4} 两两各配一个 4，再加 {3,4,4} 与 {2,4,4}）</text>
</svg>
