<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：N = 2 的递归展开与拼接</text>
  <path d="M 200 40 Q 320 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="82" font-size="12" fill="#555">fill(0, 0, 2, 0) 的递归展开（block = 4）：</text>

  <!-- ===== 左侧：递归调用表 ===== -->
  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="40" y="96" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="230" y="96" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="320" y="96" width="85" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="135" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">递归调用</text>
  <text x="275" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">值域</text>
  <text x="362" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4b66">落点</text>

  <!-- 行 0：根调用 -->
  <g filter="url(#sk)"><rect x="40" y="126" width="190" height="32" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="126" width="90" height="32" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="126" width="85" height="32" fill="#ffffff" stroke="#9ab0c4" stroke-width="1.2"/></g>
  <text x="135" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">fill(0, 0, 2, 0)</text>
  <text x="275" y="146" text-anchor="middle" font-size="11.5" fill="#333">[0, 16)</text>
  <text x="362" y="146" text-anchor="middle" font-size="11.5" fill="#333">4×4 全图</text>

  <!-- 行 1：① 右上 -->
  <g filter="url(#sk)"><rect x="40" y="158" width="190" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="158" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="158" width="85" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="135" y="178" text-anchor="middle" font-size="11.5" fill="#2e6e2e">① fill(0, 2, 1, 0)</text>
  <text x="275" y="178" text-anchor="middle" font-size="11.5" fill="#2e6e2e">[0, 4)</text>
  <text x="362" y="178" text-anchor="middle" font-size="11.5" fill="#2e6e2e">右上 2×2</text>

  <!-- 行 2：② 右下 -->
  <g filter="url(#sk)"><rect x="40" y="190" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="190" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="190" width="85" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="135" y="210" text-anchor="middle" font-size="11.5" fill="#2b4b66">② fill(2, 2, 1, 4)</text>
  <text x="275" y="210" text-anchor="middle" font-size="11.5" fill="#2b4b66">[4, 8)</text>
  <text x="362" y="210" text-anchor="middle" font-size="11.5" fill="#2b4b66">右下 2×2</text>

  <!-- 行 3：③ 左下 -->
  <g filter="url(#sk)"><rect x="40" y="222" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="222" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="222" width="85" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="135" y="242" text-anchor="middle" font-size="11.5" fill="#7a5415">③ fill(2, 0, 1, 8)</text>
  <text x="275" y="242" text-anchor="middle" font-size="11.5" fill="#7a5415">[8, 12)</text>
  <text x="362" y="242" text-anchor="middle" font-size="11.5" fill="#7a5415">左下 2×2</text>

  <!-- 行 4：④ 左上 -->
  <g filter="url(#sk)"><rect x="40" y="254" width="190" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="230" y="254" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="254" width="85" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="135" y="274" text-anchor="middle" font-size="11.5" fill="#b03a3a">④ fill(0, 0, 1, 12)</text>
  <text x="275" y="274" text-anchor="middle" font-size="11.5" fill="#b03a3a">[12, 16)</text>
  <text x="362" y="274" text-anchor="middle" font-size="11.5" fill="#b03a3a">左上 2×2</text>

  <!-- ===== 右侧：拼接结果 4×4 ===== -->
  <g filter="url(#sk)"><rect x="440" y="100" width="80" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="520" y="100" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="440" y="180" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="520" y="180" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="440" y="100" width="160" height="160" fill="none" stroke="#2b2b2b" stroke-width="2"/></g>
  <path d="M 480 100 L 480 180 M 560 100 L 560 180 M 480 180 L 480 260 M 560 180 L 560 260" stroke="#aaa" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 440 140 L 520 140 M 440 220 L 520 220 M 520 140 L 600 140 M 520 220 L 600 220" stroke="#aaa" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="460" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">15</text>
  <text x="500" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">12</text>
  <text x="460" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">14</text>
  <text x="500" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">13</text>
  <text x="540" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="580" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="540" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="580" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="460" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">11</text>
  <text x="500" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">8</text>
  <text x="460" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">10</text>
  <text x="500" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">9</text>
  <text x="540" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4b66">7</text>
  <text x="580" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4b66">4</text>
  <text x="540" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4b66">6</text>
  <text x="580" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4b66">5</text>
  <text x="520" y="286" text-anchor="middle" font-size="11" fill="#555">四块拼成最终答案</text>

  <!-- ===== 底部：要点 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="316" width="560" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">自相似：每个 2×2 象限内部的排布 = N = 1 的答案 [[3,0],[2,1]]</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#444">哨兵自检：右上角 (0, 3) = 0；左上角 (0, 0) = 4^N − 1 = 15</text>

  <g filter="url(#sk)">
    <rect x="40" y="398" width="560" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">输出 = [[15,12,3,0],[14,13,2,1],[11,8,7,4],[10,9,6,5]]</text>
</svg>
