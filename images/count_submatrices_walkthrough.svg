<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：逐行扫描与阶梯形合格区域</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">grid = [[7,2,9],[1,5,0],[2,6,6]]，k = 20</text>

  <!-- 列/行标签 -->
  <text x="89" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="139" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="189" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="56" y="106" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="56" y="150" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="56" y="194" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>

  <!-- 阶梯形合格区域外框 -->
  <path d="M 62 82 L 216 82 L 216 128 L 166 128 L 166 172 L 116 172 L 116 216 L 62 216 Z" fill="none" stroke="#2e6e2e" stroke-width="2.8" filter="url(#rough2)"/>

  <!-- 第 0 行：全绿 -->
  <g filter="url(#rough2)">
    <rect x="64" y="84" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="89" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="111" y="122" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=7</text>
  <g filter="url(#rough2)">
    <rect x="114" y="84" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="139" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="161" y="122" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=9</text>
  <g filter="url(#rough2)">
    <rect x="164" y="84" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="189" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="211" y="122" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=18</text>

  <!-- 第 1 行：两绿一红 -->
  <g filter="url(#rough2)">
    <rect x="64" y="128" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="89" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="111" y="166" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=8</text>
  <g filter="url(#rough2)">
    <rect x="114" y="128" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="139" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="161" y="166" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=15</text>
  <g filter="url(#rough2)">
    <rect x="164" y="128" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="189" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="211" y="166" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">s=24✗</text>

  <!-- 第 2 行：一绿一红一灰 -->
  <g filter="url(#rough2)">
    <rect x="64" y="172" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="89" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="111" y="210" text-anchor="end" font-size="9" fill="#4a7a3a" filter="url(#rough2)">s=10</text>
  <g filter="url(#rough2)">
    <rect x="114" y="172" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="139" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="161" y="210" text-anchor="end" font-size="9" fill="#b85450" filter="url(#rough2)">s=21✗</text>
  <g filter="url(#rough2)">
    <rect x="164" y="172" width="50" height="44" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="189" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#aaa" filter="url(#rough2)">6</text>
  <text x="189" y="210" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">未访问</text>

  <text x="139" y="234" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">绿色＝计入，粉色＝触发 break，灰色＝剪枝跳过</text>

  <!-- 行 → 卡片 箭头 -->
  <path d="M 222 106 Q 252 108 276 110" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 150 Q 256 160 276 176" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 222 194 Q 260 218 276 244" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧逐行卡片 -->
  <g filter="url(#rough2)">
    <rect x="280" y="84" width="340" height="56" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="298" y="106" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">i=0：col → [7, 2, 9]</text>
  <text x="298" y="126" font-size="11.5" fill="#333" filter="url(#rough2)">s：7 ✓ → 9 ✓ → 18 ✓　（本行 +3）</text>

  <g filter="url(#rough2)">
    <rect x="280" y="156" width="340" height="56" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="298" y="178" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">i=1：col → [8, 7, 9]</text>
  <text x="298" y="198" font-size="11.5" fill="#333" filter="url(#rough2)">s：8 ✓ → 15 ✓ → 24 ✗ break（本行 +2）</text>

  <g filter="url(#rough2)">
    <rect x="280" y="228" width="340" height="56" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="298" y="250" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#rough2)">i=2：col → [10, 13, 15]</text>
  <text x="298" y="270" font-size="11.5" fill="#333" filter="url(#rough2)">s：10 ✓ → 21 ✗ break（本行 +1，第 3 格未访问）</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="304" width="560" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="330" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans = 3 + 2 + 1 = 6 ✓</text>
  <text x="340" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">行越深、合格前缀越短：P[i][j] ≥ P[i-1][j]，break 位置单调左移（阶梯形）</text>
</svg>
