<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">日期转序号：月前缀天数表 + 一年时间轴</text>

  <!-- 月天数表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="480" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="74" text-anchor="middle" font-size="13" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">非闰年 12 个月的天数与逐月前缀和</text>
  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="70" y="98">1月</text><text x="110" y="98">2月</text><text x="150" y="98">3月</text>
    <text x="190" y="98">4月</text><text x="230" y="98">5月</text><text x="270" y="98">6月</text>
    <text x="310" y="98">7月</text><text x="350" y="98">8月</text><text x="390" y="98">9月</text>
    <text x="430" y="98">10月</text><text x="470" y="98">11月</text><text x="505" y="98">12月</text>
    <text x="70" y="116">31</text><text x="110" y="116">28</text><text x="150" y="116">31</text>
    <text x="190" y="116">30</text><text x="230" y="116">31</text><text x="270" y="116">30</text>
    <text x="310" y="116">31</text><text x="350" y="116">31</text><text x="390" y="116">30</text>
    <text x="430" y="116">31</text><text x="470" y="116">30</text><text x="505" y="116">31</text>
    <text x="70" y="134" fill="#446688">0</text><text x="110" y="134" fill="#446688">31</text>
    <text x="150" y="134" fill="#446688">59</text><text x="190" y="134" fill="#446688">90</text>
    <text x="230" y="134" fill="#446688">120</text><text x="270" y="134" fill="#446688">151</text>
    <text x="310" y="134" fill="#446688">181</text><text x="350" y="134" fill="#446688">212</text>
    <text x="390" y="134" fill="#446688">243</text><text x="430" y="134" fill="#446688">273</text>
    <text x="470" y="134" fill="#446688">304</text><text x="505" y="134" fill="#446688">334</text>
  </g>
  <text x="330" y="152" font-size="11" fill="#888" filter="url(#rough2)">第三行 = 该月之前累计天数</text>

  <!-- 解析示例 -->
  <g filter="url(#rough2)">
    <rect x="60" y="172" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="160" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"08-15" → mm=8, dd=15</text>
  <text x="160" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">天数 = 前7月累计 212 + 15 = 227</text>
  <path d="M 262 200 L 296 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="300" y="172" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#1d3a17" filter="url(#rough2)">所有日期都变成 1~365</text>
  <text x="400" y="214" text-anchor="middle" font-size="13" fill="#1d3a17" filter="url(#rough2)">里的一个整数序号</text>

  <!-- 时间轴 -->
  <text x="280" y="262" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">同一条时间轴上，两人各自的居住区间</text>
  <path d="M 60 330 L 500 330" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 324 L 60 336" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="11" fill="#888" filter="url(#rough2)">1月1日(=1)</text>
  <text x="486" y="352" font-size="11" fill="#888" filter="url(#rough2)">12月31日</text>

  <g filter="url(#rough2)">
    <rect x="200" y="286" width="120" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <text x="150" y="298" font-size="12" fill="#446688" filter="url(#rough2)">Alice：</text>
  <g filter="url(#rough2)">
    <rect x="238" y="344" width="150" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <text x="196" y="356" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Bob：</text>
  <text x="392" y="298" font-size="12" fill="#446688" filter="url(#rough2)">[到达, 离开]</text>
  <text x="392" y="356" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[到达, 离开]</text>
  <text x="280" y="384" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">答案 = 两条线段的公共长度（闭区间交）</text>
</svg>
