<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：k=3, c=4，跨堆并列靠下标裁决，总代价 11</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array strip with hire marks -->
  <g filter="url(#sk)">
    <rect x="102" y="52" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="156" y="52" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="210" y="52" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="264" y="52" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="318" y="52" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="372" y="52" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="426" y="52" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="480" y="52" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="534" y="52" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="124" y="73" fill="#333" filter="url(#sk)">17</text>
    <text x="178" y="73" fill="#333" filter="url(#sk)">12</text>
    <text x="232" y="73" fill="#333" filter="url(#sk)">10</text>
    <text x="286" y="73" fill="#b03a3a" filter="url(#sk)">2</text>
    <text x="340" y="73" fill="#b03a3a" filter="url(#sk)">7</text>
    <text x="394" y="73" fill="#b03a3a" filter="url(#sk)">2</text>
    <text x="448" y="73" fill="#8a5f14" filter="url(#sk)">11</text>
    <text x="502" y="73" fill="#8a5f14" filter="url(#sk)">20</text>
    <text x="556" y="73" fill="#8a5f14" filter="url(#sk)">8</text>
  </g>
  <g font-size="10" text-anchor="middle" font-weight="bold" fill="#b85450">
    <text x="286" y="46" filter="url(#sk)">①</text>
    <text x="394" y="46" filter="url(#sk)">②</text>
    <text x="340" y="46" filter="url(#sk)">③</text>
  </g>
  <text x="124" y="97" font-size="9.5" fill="#999">（①②③ = 雇佣次序；红格 = 被雇走）</text>

  <!-- round 1 -->
  <g filter="url(#sk)"><rect x="40" y="112" width="300" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="55" y="131" font-size="11.5" font-weight="bold" fill="#8a5f14">第 1 轮：front 堆顶 (2,3) vs back 堆顶 (2,5)</text>
  <text x="55" y="150" font-size="10.5" font-weight="bold" fill="#b03a3a">并列！元组比较：(2,3) ≤ (2,5) → 弹 front</text>
  <text x="55" y="168" font-size="10" fill="#555">雇佣 idx3（代价 2）；中间区还剩 idx4</text>
  <text x="55" y="186" font-size="10" fill="#2e6e2e">补员：front ← (7,4)，left: 4→5（此后 left &gt; right）</text>
  <g filter="url(#sk)"><rect x="360" y="112" width="120" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="420" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = 2</text>
  <text x="420" y="170" text-anchor="middle" font-size="10" fill="#555">2 + 0</text>
  <path d="M 340 155 L 356 155" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- round 2 -->
  <g filter="url(#sk)"><rect x="40" y="212" width="300" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="55" y="231" font-size="11.5" font-weight="bold" fill="#8a5f14">第 2 轮：front 堆顶 (7,4) vs back 堆顶 (2,5)</text>
  <text x="55" y="250" font-size="10.5" font-weight="bold" fill="#8a5f14">(7,4) &gt; (2,5) → 弹 back</text>
  <text x="55" y="268" font-size="10" fill="#555">雇佣 idx5（代价 2）；此轮下标 4 也进入前窗∪后窗</text>
  <text x="55" y="286" font-size="10" fill="#b03a3a">中间区已空（left &gt; right）→ 不补员</text>
  <g filter="url(#sk)"><rect x="360" y="212" width="120" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="420" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14">ans = 4</text>
  <text x="420" y="270" text-anchor="middle" font-size="10" fill="#555">2 + 2</text>
  <path d="M 340 255 L 356 255" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- round 3 -->
  <g filter="url(#sk)"><rect x="40" y="312" width="300" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="55" y="331" font-size="11.5" font-weight="bold" fill="#8a5f14">第 3 轮：front 堆顶 (7,4) vs back 堆顶 (8,8)</text>
  <text x="55" y="350" font-size="10.5" font-weight="bold" fill="#2e6e2e">(7,4) &lt; (8,8) → 弹 front</text>
  <text x="55" y="368" font-size="10" fill="#555">雇佣 idx4（代价 7）——它在第 1 轮才被吞入前窗</text>
  <text x="55" y="386" font-size="10" fill="#b03a3a">不补员；k 轮结束</text>
  <g filter="url(#sk)"><rect x="360" y="312" width="120" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="420" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">ans = 11</text>
  <text x="420" y="370" text-anchor="middle" font-size="10" fill="#555">4 + 7 ✓</text>
  <path d="M 340 355 L 356 355" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- right summary -->
  <g filter="url(#sk)"><rect x="500" y="112" width="160" height="286" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="580" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5a94">看懂三件事</text>
  <text x="514" y="162" font-size="9.8" fill="#555">1. 跨堆并列（第1轮）：</text>
  <text x="522" y="178" font-size="9.8" fill="#555">靠「front 下标恒小」</text>
  <text x="522" y="194" font-size="9.8" fill="#555">的元组比较直接裁决</text>
  <text x="514" y="222" font-size="9.8" fill="#555">2. 中间区（idx4）只在</text>
  <text x="522" y="238" font-size="9.8" fill="#555">第1轮弹 front 后补入，</text>
  <text x="522" y="254" font-size="9.8" fill="#555">第3轮才轮到它被雇</text>
  <text x="514" y="282" font-size="9.8" fill="#555">3. 排空阶段（第2轮起）</text>
  <text x="522" y="298" font-size="9.8" fill="#555">两堆只弹不补，哪端堆</text>
  <text x="522" y="314" font-size="9.8" fill="#555">顶小弹哪端，一端先</text>
  <text x="522" y="330" font-size="9.8" fill="#555">空也无妨（判空分支）</text>
  <text x="514" y="362" font-size="10" font-weight="bold" fill="#2b5a94">总代价 = 2+2+7 = 11</text>
  <text x="514" y="384" font-size="9.5" fill="#555">与官方解释逐轮一致 ✓</text>
</svg>
