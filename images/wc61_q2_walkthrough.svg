<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">走查：借位 → 左移跨过相同数字 → 低位全 9</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">p 是「被减 1」的那一位，p 之后的数字一律变成 9</text>

  <rect x="30" y="64" width="560" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="100" y="86">n</text>
    <text x="260" y="86">第一处下降</text>
    <text x="415" y="86">收缩后的 p</text>
    <text x="535" y="86">答案</text>
  </g>
  <path d="M 170 64 L 170 290" stroke="#c8d4e8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 350 64 L 350 290" stroke="#c8d4e8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 480 64 L 480 290" stroke="#c8d4e8" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="98" width="560" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="100" y="127" font-size="13" font-weight="bold" fill="#8a6a20">332</text>
    <text x="260" y="127">3 &gt; 2（下标 1→2）</text>
    <text x="415" y="127">1 → 0（d[0]==d[1]）</text>
    <text x="535" y="127" font-size="13" font-weight="bold" fill="#b85450">299</text>
  </g>

  <rect x="30" y="146" width="560" height="48" rx="6" fill="#f5f9ff" stroke="#9fb4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="100" y="175" font-size="13" font-weight="bold" fill="#446688">1130</text>
    <text x="260" y="175">3 &gt; 0（下标 2→3）</text>
    <text x="415" y="175">p = 2（d[1] &lt; d[2]）</text>
    <text x="535" y="175" font-size="13" font-weight="bold" fill="#b85450">1129</text>
  </g>

  <rect x="30" y="194" width="560" height="48" rx="6" fill="#f5f9ff" stroke="#9fb4cc" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="100" y="223" font-size="13" font-weight="bold" fill="#446688">10</text>
    <text x="260" y="223">1 &gt; 0（下标 0→1）</text>
    <text x="415" y="223">p = 0（最高位借位）</text>
    <text x="535" y="223" font-size="13" font-weight="bold" fill="#b85450">9（"09"）</text>
  </g>

  <rect x="30" y="242" width="560" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="100" y="271" font-size="13" font-weight="bold" fill="#3a5a30">1234</text>
    <text x="260" y="271">无下降</text>
    <text x="415" y="271">不进入修改分支</text>
    <text x="535" y="271" font-size="13" font-weight="bold" fill="#4a7a3a">1234</text>
  </g>

  <text x="310" y="316" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">332 的坑：只把下标 1 的 3 减 1 得到 322，仍然 3 &gt; 2，必须一路左移到下标 0 才得到 299</text>
  <text x="310" y="338" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">10 的坑：借位后得到 "09"，前导零要丢掉，转成整数自然得到 9</text>
  <text x="310" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1234 的坑：本身已单调时不能做任何借位，否则答案会无谓地变小</text>
</svg>
