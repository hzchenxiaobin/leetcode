<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="342" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">x OR (x + 1) 的两条性质</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">Q1 中 nums[i] ≤ 1000，直接枚举候选 x 就够了，两条性质用来剪枝与定位</text>

  <rect x="32" y="62" width="236" height="122" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="84" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">性质一 · 结果必为奇数</text>
  <text x="150" y="106" text-anchor="middle" font-size="10.5" fill="#555">x 为偶数：x | (x+1) = x+1，为奇数</text>
  <text x="150" y="126" text-anchor="middle" font-size="10.5" fill="#555">x 为奇数：x 的 bit0 为 1，或完还是奇数</text>
  <text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#8a3a36">故 nums[i] 为偶数时必然无解 → -1</text>
  <text x="150" y="172" text-anchor="middle" font-size="9.5" fill="#888">质数里只有 2 是偶数，正好对应示例里唯一的 -1</text>

  <rect x="292" y="62" width="236" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="84" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">性质二 · 末尾连续 1 的个数 t</text>
  <text x="410" y="106" text-anchor="middle" font-size="10.5" fill="#555">x = 3 = 011₂，末尾 2 个 1，t = 2</text>
  <text x="410" y="126" text-anchor="middle" font-size="10.5" fill="#555">3 | 4 = 011₂ | 100₂ = 111₂ = 7</text>
  <text x="410" y="152" text-anchor="middle" font-size="10.5" fill="#8a6a20">即 x | (x+1) = x + 2^t</text>
  <text x="410" y="172" text-anchor="middle" font-size="9.5" fill="#888">x+1 把低 t 位清零、第 t 位置 1，或运算再补回低位 1</text>

  <path d="M 280 184 L 280 202" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="206" width="496" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">候选枚举范围：x ∈ [0, nums[i])</text>
  <text x="280" y="250" text-anchor="middle" font-size="10.5" fill="#555">因为 x | (x+1) ≥ x + 1 &gt; x，所以满足等式的 x 一定严格小于 nums[i]，无需扫更大</text>

  <rect x="32" y="282" width="496" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="10.5" fill="#8a3a36">示例：nums[i] = 5 → x = 4 命中（4 | 5 = 5）；nums[i] = 7 → x = 3 命中（3 | 4 = 7）</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#8a3a36">nums[i] = 2 → 扫 x = 0, 1 都不成立，ans[i] = -1</text>
</svg>
