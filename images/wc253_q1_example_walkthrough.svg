<svg xmlns="http://www.w3.org/2000/svg" width="680" height="434" viewBox="0 0 680 434" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="434" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：一次扫描的三个出口</text>
  <path d="M 160 36 Q 340 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: hit at word end -->
  <g filter="url(#sk)"><rect x="36" y="48" width="608" height="116" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="52" y="72" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">① 词末命中 → true：s = "iloveleetcode"，words = ["i","love","leetcode","apples"]</text>

  <g filter="url(#sk)"><rect x="52" y="80" width="104" height="21" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="104" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">第1词 "i"</text>
  <text x="176" y="95" font-size="11.5" fill="#555" filter="url(#sk)">游标 i：0 → 1</text>
  <text x="310" y="95" font-size="11.5" fill="#555" filter="url(#sk)">词末检查：1 ≠ 13，继续</text>

  <g filter="url(#sk)"><rect x="52" y="104" width="104" height="21" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="104" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">第2词 "love"</text>
  <text x="176" y="119" font-size="11.5" fill="#555" filter="url(#sk)">游标 i：1 → 5</text>
  <text x="310" y="119" font-size="11.5" fill="#555" filter="url(#sk)">词末检查：5 ≠ 13，继续</text>

  <g filter="url(#sk)"><rect x="52" y="128" width="104" height="21" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="104" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25" filter="url(#sk)">第3词 "leetcode"</text>
  <text x="176" y="143" font-size="11.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">游标 i：5 → 13</text>
  <text x="310" y="143" font-size="11.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">词末检查：13 = 13 ✓ 命中！</text>

  <text x="598" y="118" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5d25" filter="url(#sk)">true ✓</text>

  <!-- Panel B: mismatch at first char -->
  <g filter="url(#sk)"><rect x="36" y="176" width="608" height="108" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="52" y="200" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">② 首字失配 → false：words = ["apples","i","love","leetcode"]</text>

  <g filter="url(#sk)"><rect x="52" y="212" width="25" height="27" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="64.5" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="77" y="212" width="25" height="27" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="89.5" y="231" text-anchor="middle" font-size="12" fill="#8a8f98" filter="url(#sk)">p</text>
  <g filter="url(#sk)"><rect x="102" y="212" width="25" height="27" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="114.5" y="231" text-anchor="middle" font-size="12" fill="#8a8f98" filter="url(#sk)">p</text>
  <g filter="url(#sk)"><rect x="127" y="212" width="25" height="27" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="139.5" y="231" text-anchor="middle" font-size="12" fill="#8a8f98" filter="url(#sk)">l</text>
  <g filter="url(#sk)"><rect x="152" y="212" width="25" height="27" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="164.5" y="231" text-anchor="middle" font-size="12" fill="#8a8f98" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="177" y="212" width="25" height="27" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="189.5" y="231" text-anchor="middle" font-size="12" fill="#8a8f98" filter="url(#sk)">s</text>

  <text x="230" y="234" font-size="20" font-weight="bold" fill="#b85450" filter="url(#sk)">≠</text>

  <g filter="url(#sk)"><rect x="268" y="212" width="25" height="27" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="280.5" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">i</text>
  <text x="280.5" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">s[0]</text>

  <text x="322" y="226" font-size="11.5" fill="#b85450" filter="url(#sk)">第 1 词首字符 'a' ≠ s[0] 'i'</text>
  <text x="322" y="248" font-size="11.5" fill="#b85450" filter="url(#sk)">一次比较即淘汰，后续词无需再看</text>
  <text x="322" y="270" font-size="10.5" fill="#a08040" filter="url(#sk)">（剩余 "i"、"love"、"leetcode" 全部跳过）</text>

  <text x="598" y="240" text-anchor="middle" font-size="19" font-weight="bold" fill="#b85450" filter="url(#sk)">false ✗</text>

  <!-- Panel C: exhausted mid-word -->
  <g filter="url(#sk)"><rect x="36" y="292" width="608" height="112" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="52" y="316" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">③ 词中间耗尽 → false：s = "ilo"（n = 3），words = ["ilove"]</text>

  <g filter="url(#sk)"><rect x="52" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="67" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">i</text>
  <g filter="url(#sk)"><rect x="82" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="97" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">l</text>
  <g filter="url(#sk)"><rect x="112" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="127" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">o</text>
  <g filter="url(#sk)"><rect x="142" y="328" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="157" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">v</text>
  <g filter="url(#sk)"><rect x="172" y="328" width="30" height="30" rx="4" fill="#f4f6f8" stroke="#b0b8c4" stroke-width="1.2"/></g>
  <text x="187" y="348" text-anchor="middle" font-size="13" fill="#8a8f98" filter="url(#sk)">e</text>

  <text x="67" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">i→1</text>
  <text x="97" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">i→2</text>
  <text x="127" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">i→3</text>
  <text x="157" y="378" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">i ≥ n！</text>
  <text x="187" y="378" text-anchor="middle" font-size="10" fill="#8a8f98" filter="url(#sk)">跳过</text>

  <text x="240" y="340" font-size="11.5" fill="#7a5415" filter="url(#sk)">i、l、o 逐一通过，游标推进到 3 = n</text>
  <text x="240" y="362" font-size="11.5" fill="#7a5415" filter="url(#sk)">比对 'v' 时 i = 3 ≥ n：拼接长于 s</text>
  <text x="240" y="384" font-size="11.5" fill="#7a5415" filter="url(#sk)">n = 3 不是任何词末长度 → return false</text>

  <text x="598" y="355" text-anchor="middle" font-size="19" font-weight="bold" fill="#b85450" filter="url(#sk)">false ✗</text>

  <text x="340" y="424" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">出口 4（图外）：words 全部拼完游标 i 仍小于 n —— s 比全部拼接还长 → false</text>
</svg>
