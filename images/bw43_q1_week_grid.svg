<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">存钱日历：每周一首日比上周一多 1，周内每天比前一天多 1</text>

  <!-- 星期表头 -->
  <text x="78" y="58" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">周一</text>
  <text x="134" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周二</text>
  <text x="190" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周三</text>
  <text x="246" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周四</text>
  <text x="302" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周五</text>
  <text x="358" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周六</text>
  <text x="414" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">周日</text>

  <!-- 第 1 周 -->
  <text x="44" y="88" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第1周</text>
  <rect x="50" y="66" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="90" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <rect x="106" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="162" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="218" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="274" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="330" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="386" y="66" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="90" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>

  <!-- 第 2 周 -->
  <text x="44" y="132" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第2周</text>
  <rect x="50" y="110" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="134" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <rect x="106" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="162" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="218" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="274" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="330" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="386" y="110" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="134" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">8</text>

  <!-- 第 3 周 -->
  <text x="44" y="176" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第3周</text>
  <rect x="50" y="154" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="178" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">3</text>
  <rect x="106" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="162" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="218" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="274" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="330" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="386" y="154" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="178" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">9</text>

  <!-- 第 4 周 -->
  <text x="44" y="220" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第4周</text>
  <rect x="50" y="198" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="222" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <rect x="106" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="162" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="218" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="274" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="330" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">9</text>
  <rect x="386" y="198" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="222" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">10</text>

  <!-- 周一列标注 -->
  <path d="M46,60 Q40,152 46,242" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="30" y="256" text-anchor="start" font-size="13" fill="#8a6d3b" filter="url(#rough2)">周一列 1→2→3→4 逐周 +1</text>

  <text x="260" y="278" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">第 w 周（w 从 0 数）存入：w+1, w+2, …, w+7</text>
  <text x="260" y="306" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">整周和 = 7w + 28，是 w 的等差数列</text>
  <path d="M120,258 Q260,264 400,258" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">把 n 天切成「整周 + 余日」两段，分别求和即可</text>
</svg>
