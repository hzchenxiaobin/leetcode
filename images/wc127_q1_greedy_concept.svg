<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">取反的净收益：只看被翻奇数次的集合 S</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">sum' = sum − 2·Σ_{i∈S} a_i，翻两次等于不翻</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="40" y="74" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="101.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−4</text>
  <path d="M 154.0 96.0 L 210.0 96.0" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="214" y="74" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="269.0" y="101.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="334.0" y="92.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">翻负数：和增加 2|x| = +8</text>
  <rect x="40" y="140" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="167.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 154.0 162.0 L 210.0 162.0" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="214" y="140" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="269.0" y="167.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="334.0" y="158.0" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">翻正数：和减少 2|x| = −6</text>
  <rect x="40" y="206" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="233.0" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x</text>
  <path d="M 154.0 228.0 L 210.0 228.0" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="214" y="206" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="269.0" y="232.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">x（不变）</text>
  <text x="334.0" y="226.0" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">翻偶数次：完全抵消，等于白翻</text>
  <rect x="30" y="272" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="293.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">所以先贪心翻负数（越负越先翻），翻完负数后剩下的次数只影响奇偶</text>
  <text x="40.0" y="309.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">剩余奇数次 → 必须多翻一次，选绝对值最小的元素，代价 2·min|a| 最小</text>
  <text x="40.0" y="325.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">剩余偶数次 → 两两抵消，随便翻，不改变和</text>
</svg>
