<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">划分型 DP：每趟运一段连续箱子</text>

  <!-- 箱子序列 -->
  <g filter="url(#rough2)">
    <rect x="70" y="60" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="60" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="60" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="220" y="60" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="270" y="60" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="320" y="60" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="370" y="60" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555" text-anchor="middle">
    <text x="145" y="84">第 1 趟</text>
    <text x="235" y="84">第 2 趟</text>
    <text x="295" y="84">3</text>
    <text x="345" y="84">4</text>
    <text x="395" y="84">5</text>
  </g>
  <text x="70" y="52" font-size="12" fill="#888" filter="url(#rough2)">n 个箱子 → 划成若干连续段，每段一趟</text>

  <!-- dp 定义 -->
  <g filter="url(#rough2)">
    <rect x="60" y="124" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="149" font-size="14" fill="#446688" text-anchor="middle" filter="url(#rough2)">dp[i] = 运完前 i 个箱子并回到仓库的最少行程数</text>

  <!-- 转移 -->
  <path d="M 280 164 C 280 190, 280 200, 280 214" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="218" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2d5a22" text-anchor="middle">
    <text x="280" y="240">dp[i] = min{ dp[j] + trips(j..i−1) }</text>
    <text x="280" y="262">trips(l..r) = 2 + pref[r+1] − pref[l+1]</text>
  </g>

  <!-- 双约束窗口 -->
  <g filter="url(#rough2)">
    <rect x="60" y="288" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="313" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">j 的约束：i−j ≤ maxBoxes 且 w[i]−w[j] ≤ maxWeight（都是 j 的下界）</text>
</svg>
