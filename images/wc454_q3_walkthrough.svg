<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [1, 3, −5, 5, 6, −4]，m = 3</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每轮先纳入 nums[j−m+1] 扩前缀，再算两候选，ans 取最大（首区间 [0, j−2]）</text>

  <rect x="40" y="62" width="490" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="105" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">尾 nums[j]</text>
  <text x="195" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">纳入 nums[j−m+1]</text>
  <text x="283" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">preMax</text>
  <text x="341" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">preMin</text>
  <text x="425" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两候选乘积</text>
  <text x="505" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="40" y="92" width="490" height="36" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="40" y="128" width="490" height="36" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="40" y="164" width="490" height="36" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="40" y="200" width="490" height="36" fill="#fff8e1" filter="url(#rough2)"/>

  <path d="M 74 62 L 74 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 136 62 L 136 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 254 62 L 254 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 312 62 L 312 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 370 62 L 370 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 480 62 L 480 236" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <path d="M 40 92 L 530 92" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 128 L 530 128" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 164 L 530 164" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 40 200 L 530 200" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="62" width="490" height="174" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="57" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="105" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−5</text>
  <text x="195" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1（i = 0）</text>
  <text x="283" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="341" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−5、−5</text>
  <text x="505" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−5</text>

  <text x="57" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="105" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="195" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3（i = 1）</text>
  <text x="283" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="341" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="425" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">15</tspan>、5</text>
  <text x="505" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>

  <text x="57" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="105" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="195" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−5（i = 2）</text>
  <text x="283" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="341" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−5</text>
  <text x="425" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">18</tspan>、−30</text>
  <text x="505" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>

  <text x="57" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="105" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="195" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5（i = 3）</text>
  <text x="283" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="341" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="425" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−20、<tspan fill="#b85450" font-weight="bold">20</tspan></text>
  <text x="505" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">20</text>

  <rect x="40" y="258" width="490" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">尾 −4 &lt; 0 → preMin 分支翻正：(−4) × (−5) = 20，反超一切「正配正」</text>
  <text x="285" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对应子序列 [−5, 6, −4]（中间下标 4 任填 6）→ 答案 20 ✓</text>
</svg>
