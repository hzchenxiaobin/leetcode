<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#556"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">低 4 位取字符、整体右移 4 位，出栈顺序正好相反</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环条件只看 x 是否归零，所以结果天然没有前导零（num = 0 单独返回 “0”）</text>

  <rect x="180" y="52" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17" filter="url(#rough2)"/>
  <text x="250" y="74" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 num</text>

  <path d="M 250 86 L 250 100" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,102 342,136 250,170 158,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">num == 0 ?</text>

  <path d="M 342 136 L 362 136" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="128" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="362" y="118" width="158" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="441" y="141" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">直接返回 “0”</text>

  <path d="M 250 170 L 250 182" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="180" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="140" y="184" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="208" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">x = num &amp; 0xFFFFFFFF</text>

  <path d="M 250 222 L 250 234" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,236 342,270 250,304 158,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="274" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">x &gt; 0 ?</text>

  <path d="M 342 270 L 362 270" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="262" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="362" y="252" width="170" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="447" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">反转后返回</text>

  <path d="M 250 304 L 250 318" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="317" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="140" y="320" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="342" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">d = x &amp; 15，查表取字符并追加</text>

  <path d="M 250 354 L 250 366" stroke="#556" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="368" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="389" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">x &gt;&gt;= 4（丢掉最低 4 位）</text>

  <path d="M 140 384 L 86 384 L 86 270 L 152 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">x &lt; 2³²，循环最多 8 轮；x 归零即结束，因此不会输出多余的前导零</text>
</svg>
