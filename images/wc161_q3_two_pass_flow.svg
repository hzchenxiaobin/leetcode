<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#667"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两趟相向扫描：先删坏 ')'，再删最右的 B 个 '('</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一趟得到 B = 多余左括号数，第二趟只需回删 B 个，方向相反</text>

  <rect x="56" y="62" width="448" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="82" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 左 → 右：balance = 0；遇 '(' 则 +1 并保留；遇 ')' 且 balance &gt; 0</text>
  <text x="72" y="98" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">则 −1 并保留；遇 ')' 且 balance = 0 → 丢弃（坏右括号）</text>

  <path d="M 280 108 L 280 126" stroke="#667" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="128" width="448" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="153" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">② 扫完：balance = B ≥ 0，即剩余串里还多 B 个 '(' 没有配对</text>

  <path d="M 280 170 L 280 188" stroke="#667" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="190" width="448" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="210" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ 右 → 左：excess = B；遇 '(' 且 excess &gt; 0 则丢弃并 excess−−，</text>
  <text x="72" y="226" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">其余（含所有 ')' 与字母）一律保留</text>

  <path d="M 280 236 L 280 254" stroke="#667" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="256" width="448" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="72" y="281" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 反转拼接 → 合法串，删除数 = r + B（已达下界，最小）</text>

  <rect x="56" y="310" width="448" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="331" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么删「最右」的 B 个 '(' 是安全的？</text>
  <text x="72" y="350" font-size="10" fill="#555" filter="url(#rough2)">从右删，受影响的前缀最少、且这些前缀的平衡值最大，故不会变负</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 ")(a(b)c("：r = 1、B = 2，删 3 个 → "a(bc)"</text>
</svg>
