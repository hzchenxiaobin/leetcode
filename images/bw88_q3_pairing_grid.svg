<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">m×n 配对矩阵：每个数到底出现几次</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="54">nums1 = [2,1,3]（m=3 行），nums2 = [10,2,5,0]（n=4 列）</text>
  </g>

  <!-- 表头行 -->
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <text x="200" y="92">10</text><text x="248" y="92">2</text>
    <text x="296" y="92">5</text><text x="344" y="92">0</text>
  </g>
  <!-- 表头列 -->
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="168" y="126">2</text><text x="168" y="164">1</text><text x="168" y="202">3</text>
  </g>

  <!-- 矩阵格子 -->
  <g filter="url(#rough2)">
    <rect x="182" y="108" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="230" y="108" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="278" y="108" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="326" y="108" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="182" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="230" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="278" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="326" y="146" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="182" y="184" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="230" y="184" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="278" y="184" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="326" y="184" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>

  <!-- 行出现次数标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="380" y="128">← 2 出现 4 次（= n）</text>
    <text x="380" y="166">← 1 出现 4 次（= n）</text>
    <text x="380" y="204">← 3 出现 4 次（= n）</text>
  </g>
  <!-- 列出现次数标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="272" y="240">每个 nums2[j] 在整张矩阵里出现 m = 3 次</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="272" width="420" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="296">把矩阵逐行摊平成 nums3：nums1[i] 连续出现 n 次，</text>
    <text x="280" y="318">nums2[j] 每隔 m 个出现一次、共出现 m 次</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="348" width="420" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="370">于是答案只取决于「出现次数的奇偶」：</text>
    <text x="280" y="390">n 为奇数才保留 XOR(nums1)，m 为奇数才保留 XOR(nums2)</text>
  </g>
</svg>
