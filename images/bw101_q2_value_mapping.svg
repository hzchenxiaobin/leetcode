<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">第一步：字符 → 价值表（26 个槽位）</text>

  <rect x="60" y="58" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">默认：val['a'..'z'] = 1..26（字母表位置）</text>
  <rect x="92" y="112" width="376" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="137" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">再用 chars / vals 覆盖：chars = "d", vals = [-1000] → val['d'] = -1000</text>

  <text x="280" y="192" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">第二步：s = "adaa" 翻译成价值数组 v</text>

  <g filter="url(#rough2)">
    <rect x="150" y="208" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="176" y="236" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="202" y="208" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="228" y="236" text-anchor="middle" font-size="14" fill="#333">d</text>
    <rect x="254" y="208" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="236" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="306" y="208" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="332" y="236" text-anchor="middle" font-size="14" fill="#333">a</text>
  </g>
  <path d="M 176 256 C 176 276, 176 276, 176 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 228 256 C 228 276, 228 276, 228 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 256 C 280 276, 280 276, 280 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 256 C 332 276, 332 276, 332 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="290" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="176" y="311" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="202" y="290" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="228" y="311" text-anchor="middle" font-size="12.5" fill="#b85450">-1000</text>
    <rect x="254" y="290" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="311" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="306" y="290" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="332" y="311" text-anchor="middle" font-size="14" fill="#333">1</text>
  </g>
</svg>
