<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只检查相邻的 1，间隙 = 下标差 − 1</text>
  <path d="M 96 40 Q 340 48 584 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数组格子：1,0,0,0,1,0,0,1 -->
  <g>
    <rect x="48" y="58" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <rect x="98" y="58" width="46" height="44" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="148" y="58" width="46" height="44" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="198" y="58" width="46" height="44" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="248" y="58" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <rect x="298" y="58" width="46" height="44" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="348" y="58" width="46" height="44" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="398" y="58" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  </g>
  <text x="71" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#8f3830" filter="url(#rough2)">1</text>
  <text x="121" y="87" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">0</text>
  <text x="171" y="87" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">0</text>
  <text x="221" y="87" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">0</text>
  <text x="271" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#8f3830" filter="url(#rough2)">1</text>
  <text x="321" y="87" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">0</text>
  <text x="371" y="87" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">0</text>
  <text x="421" y="87" text-anchor="middle" font-size="17" font-weight="bold" fill="#8f3830" filter="url(#rough2)">1</text>
  <text x="71" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="121" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="171" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="221" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="271" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="321" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="371" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="421" y="116" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <!-- 第一段间隙 -->
  <path d="M 73 128 L 73 142 L 269 142" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 269 128 L 269 142" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="171" y="164" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">间隙 = 4 − 0 − 1 = 3 ≥ k = 2 ✓</text>

  <!-- 第二段间隙 -->
  <path d="M 271 174 L 271 188 L 419 188" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 419 174 L 419 188" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">间隙 = 7 − 4 − 1 = 2 ≥ k = 2 ✓</text>

  <!-- 结论条 -->
  <g>
    <rect x="44" y="228" width="592" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <text x="60" y="252" font-size="12" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">相邻对全部通过 ⇒ 非相邻对必然通过</text>
  <text x="60" y="276" font-size="11.5" fill="#444" filter="url(#rough2)">因为在 p_i 与 p_j 之间，除了各段间隙，还额外夹着 (j − i − 1) 个 1 的占位，距离只会更大。</text>

  <!-- 左下：语义定义 -->
  <g>
    <rect x="44" y="306" width="288" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <text x="60" y="330" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#rough2)">「相隔 k 个元素」的精确含义</text>
  <text x="60" y="354" font-size="11" fill="#444" filter="url(#rough2)">两个 1 位于下标 i &lt; j，中间元素是 i+1 … j−1：</text>
  <text x="60" y="376" font-size="11" fill="#444" filter="url(#rough2)">个数 = j − i − 1（不含两端的 1）</text>
  <text x="60" y="398" font-size="11" fill="#444" filter="url(#rough2)">要求 j − i − 1 ≥ k，等价于 j ≥ i + k + 1</text>
  <text x="60" y="420" font-size="10.5" fill="#8f3830" filter="url(#rough2)">⚠ 写成 j − i ≥ k 会少减 1，判定偏松</text>

  <!-- 右下：快速对照 -->
  <g>
    <rect x="348" y="306" width="288" height="122" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <text x="364" y="330" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">两个 1 构成的快速对照</text>
  <text x="364" y="354" font-size="11" fill="#444" filter="url(#rough2)">nums = [1,0,1]，间隔 1 个元素</text>
  <text x="364" y="376" font-size="11" fill="#444" filter="url(#rough2)">k = 1 → 1 ≥ 1 → true ✓</text>
  <text x="364" y="398" font-size="11" fill="#444" filter="url(#rough2)">k = 2 → 1 &lt; 2 → false ✗</text>
  <text x="364" y="420" font-size="10.5" fill="#8f3830" filter="url(#rough2)">⚠ 若用 j − i = 2 ≥ 2 会误判成 true</text>

  <text x="340" y="454" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿色格子是 1 的位置；两段间隙分别由相邻的 1 计算，k = 2</text>
</svg>
