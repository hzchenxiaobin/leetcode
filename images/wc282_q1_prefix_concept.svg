<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：前缀判定 = 长度守卫 + 首 m 位逐一相等（失配即止）</text>

  <!-- ===== Panel A: full match ===== -->
  <text x="30" y="58" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">情形 1：首 m 位逐一相等 → 是前缀 ✓</text>
  <text x="30" y="92" font-size="10.5" fill="#666" filter="url(#rough2)">pref =</text>
  <rect x="66" y="76" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="76" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="13" fill="#2e5b2e" filter="url(#rough2)">a</text>
  <text x="112" y="98" text-anchor="middle" font-size="13" fill="#2e5b2e" filter="url(#rough2)">t</text>
  <text x="170" y="96" font-size="10" fill="#888" filter="url(#rough2)">m = 2</text>

  <text x="30" y="142" font-size="10.5" fill="#666" filter="url(#rough2)">w =</text>
  <rect x="66" y="126" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="126" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="194" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="126" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="13" text-anchor="middle">
    <text x="80" y="148" fill="#2e5b2e" filter="url(#rough2)">a</text>
    <text x="112" y="148" fill="#2e5b2e" filter="url(#rough2)">t</text>
    <text x="144" y="148" fill="#33506b" filter="url(#rough2)">t</text>
    <text x="176" y="148" fill="#33506b" filter="url(#rough2)">e</text>
    <text x="208" y="148" fill="#33506b" filter="url(#rough2)">n</text>
    <text x="240" y="148" fill="#33506b" filter="url(#rough2)">t</text>
    <text x="272" y="148" fill="#33506b" filter="url(#rough2)">i</text>
    <text x="304" y="148" fill="#33506b" filter="url(#rough2)">o</text>
  </g>
  <g font-size="11" font-weight="bold">
    <text x="80" y="120" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">✓</text>
    <text x="112" y="120" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  </g>
  <text x="30" y="196" font-size="10.5" fill="#555" filter="url(#rough2)">前 2 位 a、t 逐一相等 → "at" 是 "attention" 的前缀</text>

  <!-- ===== Panel B: first-char mismatch ===== -->
  <text x="390" y="58" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">情形 2：首位失配 → 1 次比较即拒绝 ✗</text>
  <text x="390" y="92" font-size="10.5" fill="#666" filter="url(#rough2)">pref =</text>
  <rect x="426" y="76" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="76" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="98" text-anchor="middle" font-size="13" fill="#2e5b2e" filter="url(#rough2)">a</text>
  <text x="472" y="98" text-anchor="middle" font-size="13" fill="#2e5b2e" filter="url(#rough2)">t</text>

  <text x="390" y="142" font-size="10.5" fill="#666" filter="url(#rough2)">w =</text>
  <rect x="426" y="126" width="28" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="458" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="490" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="522" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="554" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="586" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="618" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="650" y="126" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <g font-size="13" text-anchor="middle">
    <text x="440" y="148" fill="#b85450" filter="url(#rough2)">p</text>
    <text x="472" y="148" fill="#888" filter="url(#rough2)">r</text>
    <text x="504" y="148" fill="#888" filter="url(#rough2)">a</text>
    <text x="536" y="148" fill="#888" filter="url(#rough2)">c</text>
    <text x="568" y="148" fill="#888" filter="url(#rough2)">t</text>
    <text x="600" y="148" fill="#888" filter="url(#rough2)">i</text>
    <text x="632" y="148" fill="#888" filter="url(#rough2)">c</text>
    <text x="664" y="148" fill="#888" filter="url(#rough2)">e</text>
  </g>
  <text x="440" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="560" y="120" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（后续 6 位：未比较）</text>
  <text x="390" y="196" font-size="10.5" fill="#555" filter="url(#rough2)">p ≠ a：后 7 位无需比较，判定不是前缀</text>

  <!-- ===== Panel C: length guard ===== -->
  <text x="30" y="238" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">情形 3：长度不足 → 0 次比较直接淘汰</text>
  <text x="30" y="272" font-size="10.5" fill="#666" filter="url(#rough2)">pref =</text>
  <rect x="66" y="256" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="256" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="256" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="256" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="13" text-anchor="middle" fill="#33506b">
    <text x="80" y="278" filter="url(#rough2)">c</text>
    <text x="112" y="278" filter="url(#rough2)">o</text>
    <text x="144" y="278" filter="url(#rough2)">d</text>
    <text x="176" y="278" filter="url(#rough2)">e</text>
  </g>
  <text x="230" y="276" font-size="10" fill="#888" filter="url(#rough2)">m = 4</text>

  <text x="30" y="322" font-size="10.5" fill="#666" filter="url(#rough2)">w =</text>
  <rect x="66" y="306" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="98" y="306" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="306" width="28" height="34" fill="#f5f5f5" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="306" width="28" height="34" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <g font-size="13" text-anchor="middle" fill="#888">
    <text x="80" y="328" filter="url(#rough2)">w</text>
    <text x="112" y="328" filter="url(#rough2)">i</text>
    <text x="144" y="328" filter="url(#rough2)">n</text>
  </g>
  <text x="176" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">?</text>
  <text x="230" y="326" font-size="10.5" fill="#b85450" filter="url(#rough2)">|w| = 3 &lt; m = 4</text>
  <text x="30" y="376" font-size="10.5" fill="#555" filter="url(#rough2)">长度是硬前提：|w| &lt; m 时 pref 不可能是 w 的前缀</text>
  <text x="30" y="394" font-size="10" fill="#888" filter="url(#rough2)">（对应示例 2 中的 "win"，无需任何字符比较）</text>

  <!-- ===== Panel D: lemma note ===== -->
  <rect x="390" y="228" width="300" height="176" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">前缀的逐位刻画（引理）</text>
  <g font-size="10.5" fill="#555">
    <text x="406" y="274" filter="url(#rough2)">pref 是 w 的前缀</text>
    <text x="406" y="291" filter="url(#rough2)">⇔ |w| ≥ m 且 w 前 m 位与 pref 逐位相等</text>
    <text x="406" y="313" filter="url(#rough2)">• 长度不足 → O(1) 拒绝，一个字符都不碰</text>
    <text x="406" y="330" filter="url(#rough2)">• 首位失配 → 1 次比较即拒绝</text>
    <text x="406" y="347" filter="url(#rough2)">• |w| = m 且全等 → w = pref，也算前缀</text>
    <text x="406" y="369" font-weight="bold" fill="#7a5415" filter="url(#rough2)">逐位判定零副本、O(1) 额外空间</text>
    <text x="406" y="390" font-size="9.5" fill="#a8781f" filter="url(#rough2)">（对比：substr / 切片先拷贝 m 个字符再比较）</text>
  </g>
</svg>
