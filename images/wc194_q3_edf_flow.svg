<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：最早截止期优先（EDF）+ 小顶堆</text>
  <text x="320" y="44" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">nxt[i] = 第 i 天之后同湖下一次下雨的下标（没有则记 n），它同时就是第 i 天这次降雨的截止期</text>

  <rect x="190" y="58" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">i 从 0 到 n−1 遍历 rains</text>
  <path d="M 320 93 L 320 108" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,112 432,146 320,180 208,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">rains[i] == 0 ?</text>
  <text x="320" y="160" text-anchor="middle" font-size="9" fill="#b09050" filter="url(#rough2)">今天不下雨？</text>

  <path d="M 208 146 L 150 146 L 150 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 432 146 L 490 146 L 490 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="26" y="200" width="248" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="222" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">零天：抽干一个湖</text>
  <text x="40" y="243" font-size="9.3" fill="#444" filter="url(#rough2)">① 堆非空 → pop 截止期最小的湖 L</text>
  <text x="40" y="261" font-size="9.3" fill="#444" filter="url(#rough2)">　　　ans[i] = L，从满湖集合删 L</text>
  <text x="40" y="279" font-size="9.3" fill="#444" filter="url(#rough2)">② 堆空 → ans[i] = 1</text>
  <text x="40" y="297" font-size="9.3" fill="#888" filter="url(#rough2)">　　　（抽空湖无事发生，不会更差）</text>

  <rect x="366" y="200" width="248" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="222" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">雨天：湖 x 蓄水</text>
  <text x="380" y="243" font-size="9.3" fill="#444" filter="url(#rough2)">① x 在满湖集合 → return []</text>
  <text x="380" y="261" font-size="9.3" fill="#b85450" filter="url(#rough2)">　　　（截止期已到，洪水不可避免）</text>
  <text x="380" y="279" font-size="9.3" fill="#444" filter="url(#rough2)">② 否则 deadline[x] = nxt[i]，把</text>
  <text x="380" y="297" font-size="9.3" fill="#444" filter="url(#rough2)">　　　(nxt[i], x) 压入小顶堆，ans[i] = −1</text>

  <path d="M 150 306 L 150 359 L 186 359" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 306 L 490 359 L 454 359" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="340" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">i += 1，回到循环开头</text>

  <path d="M 320 378 L 320 396" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="398" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="10.5" fill="#8a4a48" filter="url(#rough2)">循环正常结束 → 返回 ans</text>

  <text x="320" y="456" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(n log n)：每个湖最多进堆、出堆各一次；空间 O(n)</text>
</svg>
