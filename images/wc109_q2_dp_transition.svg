<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="396" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">状态转移：按「结尾数字」聚合，而非枚举号码</text>
  <rect x="200" y="56" width="260" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="79.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[d] = 长度 L 且以 d 结尾的号码数</text>
  <path d="M 330 100 L 330 126" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="128" width="260" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ndp[v] += dp[d]，对所有 v ∈ nxt[d]</text>
  <path d="M 330 172 L 330 198" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="200" width="260" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="223.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L += 1，dp = ndp</text>
  <text x="60" y="138" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">从「以 d 结尾」</text>
  <text x="60" y="162" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">跳到 v</text>
  <text x="60" y="214" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">长度加 1</text>
  <rect x="60" y="268" width="540" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="293.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案 = Σ dp[d]（长度 n 时所有结尾都合法，包括 5）</text>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">状态数只有 10，转移边 20 条 → 每层 O(1)，总 O(n)</text>
  <text x="330" y="376" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">取模 10^9+7，n ≤ 5000 时答案可达 10^5000 量级，必须边加边模</text>
</svg>
