<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="920" height="580" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：建行索引 → 逐列查询（示例 2，n = 4）</text>
  <path d="M 260 42 Q 460 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 列标签 -->
  <text x="121" y="88" text-anchor="middle" font-size="11.5" fill="#666">C0</text>
  <text x="163" y="88" text-anchor="middle" font-size="11.5" fill="#666">C1</text>
  <text x="205" y="88" text-anchor="middle" font-size="11.5" fill="#666">C2</text>
  <text x="247" y="88" text-anchor="middle" font-size="11.5" fill="#666">C3</text>
  <!-- 行标签 -->
  <text x="88" y="118" text-anchor="end" font-size="11.5" fill="#666">R0</text>
  <text x="88" y="154" text-anchor="end" font-size="11.5" fill="#666">R1</text>
  <text x="88" y="190" text-anchor="end" font-size="11.5" fill="#666">R2</text>
  <text x="88" y="226" text-anchor="end" font-size="11.5" fill="#666">R3</text>

  <!-- 4x4 网格（灰底） -->
  <rect x="100" y="96" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="142" y="96" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="184" y="96" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="226" y="96" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="100" y="132" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="142" y="132" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="184" y="132" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="226" y="132" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="100" y="168" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="142" y="168" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="184" y="168" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="226" y="168" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="100" y="204" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="142" y="204" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="184" y="204" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="226" y="204" width="42" height="36" rx="3" fill="#f7f6f1" stroke="#9a9a92" stroke-width="1.2" filter="url(#sk)"/>

  <!-- 数值 -->
  <text x="121" y="118" text-anchor="middle" font-size="13" fill="#444">3</text>
  <text x="163" y="118" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="205" y="118" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="247" y="118" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="121" y="154" text-anchor="middle" font-size="13" fill="#444">1</text>
  <text x="163" y="154" text-anchor="middle" font-size="13" fill="#444">4</text>
  <text x="205" y="154" text-anchor="middle" font-size="13" fill="#444">4</text>
  <text x="247" y="154" text-anchor="middle" font-size="13" fill="#444">5</text>
  <text x="121" y="190" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="163" y="190" text-anchor="middle" font-size="13" fill="#444">4</text>
  <text x="205" y="190" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="247" y="190" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="121" y="226" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="163" y="226" text-anchor="middle" font-size="13" fill="#444">4</text>
  <text x="205" y="226" text-anchor="middle" font-size="13" fill="#444">2</text>
  <text x="247" y="226" text-anchor="middle" font-size="13" fill="#444">2</text>

  <!-- 匹配行外框（R0、R2、R3） -->
  <rect x="97" y="93" width="174" height="42" rx="6" fill="none" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <rect x="97" y="165" width="174" height="42" rx="6" fill="none" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <rect x="97" y="201" width="174" height="42" rx="6" fill="none" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <!-- 匹配列外框（C0、C2） -->
  <rect x="97" y="93" width="48" height="150" rx="6" fill="none" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <rect x="181" y="93" width="48" height="150" rx="6" fill="none" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <!-- 交汇单元格（配对发生处） -->
  <rect x="100" y="96" width="42" height="36" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <rect x="184" y="168" width="42" height="36" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <rect x="184" y="204" width="42" height="36" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>

  <text x="184" y="262" text-anchor="middle" font-size="11.5" fill="#555">3 对：(R0,C0)、(R2,C2)、(R3,C2)</text>

  <!-- 图例 -->
  <rect x="64" y="278" width="14" height="14" rx="3" fill="none" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="84" y="289" font-size="11" fill="#555">匹配行</text>
  <rect x="140" y="278" width="14" height="14" rx="3" fill="none" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="160" y="289" font-size="11" fill="#555">匹配列</text>
  <rect x="216" y="278" width="14" height="14" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
  <text x="236" y="289" font-size="11" fill="#555">交汇 = 一对</text>

  <!-- 箭头①：网格 → 行索引表 -->
  <path d="M 276 166 C 296 160, 310 158, 326 156" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="302" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">① 每行序列化计数</text>

  <!-- 行索引表 -->
  <text x="465" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">rowCnt（行索引）</text>
  <rect x="330" y="108" width="270" height="30" rx="4" fill="#fdfcf7" stroke="#9a9a92" stroke-width="1.3" filter="url(#sk)"/>
  <text x="348" y="128" font-size="12" fill="#555">"3#1#2#2#"</text>
  <text x="582" y="128" text-anchor="end" font-size="12" fill="#555">→ 1</text>
  <rect x="330" y="142" width="270" height="30" rx="4" fill="#fdfcf7" stroke="#9a9a92" stroke-width="1.3" filter="url(#sk)"/>
  <text x="348" y="162" font-size="12" fill="#555">"1#4#4#5#"</text>
  <text x="582" y="162" text-anchor="end" font-size="12" fill="#555">→ 1</text>
  <rect x="330" y="176" width="270" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="348" y="196" font-size="12" font-weight="bold" fill="#8c3a36">"2#4#2#2#"</text>
  <text x="582" y="196" text-anchor="end" font-size="12" font-weight="bold" fill="#8c3a36">→ 2 ★</text>
  <text x="336" y="230" font-size="11" fill="#b85450">R2 = R3 = [2,4,2,2]，同键 → 计数为 2</text>

  <!-- 箭头②：行索引表 → 查询表 -->
  <path d="M 465 240 L 465 292" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>
  <text x="480" y="272" font-size="11.5" font-weight="bold" fill="#2e6e2e">② 每列序列化查询</text>

  <!-- 查询表 -->
  <text x="600" y="312" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">逐列查询（ans 累加）</text>
  <rect x="330" y="322" width="540" height="140" rx="6" fill="#fdfcf7" stroke="#9a9a92" stroke-width="1.3" filter="url(#sk)"/>
  <text x="370" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">列</text>
  <text x="520" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">序列化键</text>
  <text x="700" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">rowCnt</text>
  <text x="820" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">ans</text>
  <path d="M 334 352 L 866 352" stroke="#ccc" stroke-width="1" filter="url(#sk)"/>

  <text x="370" y="374" text-anchor="middle" font-size="11.5" fill="#444">C0</text>
  <text x="520" y="374" text-anchor="middle" font-size="11.5" fill="#444">"3#1#2#2#"</text>
  <text x="700" y="374" text-anchor="middle" font-size="11.5" fill="#444">1</text>
  <text x="820" y="374" text-anchor="middle" font-size="11.5" fill="#444">0→1</text>
  <path d="M 334 382 L 866 382" stroke="#e5e5e5" stroke-width="1" filter="url(#sk)"/>

  <text x="370" y="402" text-anchor="middle" font-size="11.5" fill="#444">C1</text>
  <text x="520" y="402" text-anchor="middle" font-size="11.5" fill="#444">"1#4#4#4#"</text>
  <text x="700" y="402" text-anchor="middle" font-size="11.5" fill="#444">0</text>
  <text x="820" y="402" text-anchor="middle" font-size="11.5" fill="#444">1</text>
  <path d="M 334 410 L 866 410" stroke="#e5e5e5" stroke-width="1" filter="url(#sk)"/>

  <rect x="333" y="412" width="534" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="370" y="429" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">C2</text>
  <text x="520" y="429" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">"2#4#2#2#"</text>
  <text x="700" y="429" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">2 ★</text>
  <text x="820" y="429" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">1→3</text>

  <text x="370" y="456" text-anchor="middle" font-size="11.5" fill="#444">C3</text>
  <text x="520" y="456" text-anchor="middle" font-size="11.5" fill="#444">"2#5#2#2#"</text>
  <text x="700" y="456" text-anchor="middle" font-size="11.5" fill="#444">0</text>
  <text x="820" y="456" text-anchor="middle" font-size="11.5" fill="#444">3</text>

  <!-- 结果框 -->
  <rect x="60" y="310" width="240" height="152" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="180" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">ans = 3</text>
  <text x="180" y="372" text-anchor="middle" font-size="11.5" fill="#444">(R0, C0) 配成一对</text>
  <text x="180" y="396" text-anchor="middle" font-size="11.5" fill="#444">(R2, C2) 配成一对</text>
  <text x="180" y="420" text-anchor="middle" font-size="11.5" fill="#444">(R3, C2) 配成一对</text>
  <text x="180" y="446" text-anchor="middle" font-size="11" fill="#b85450">重复行各计一次 → C2 贡献 2</text>

  <!-- 底部小结 -->
  <rect x="60" y="490" width="810" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="465" y="516" text-anchor="middle" font-size="12.5" fill="#333">关键：rowCnt 是「计数」而不是「去重」——重复行 R2、R3 与同一列 C2 各配一对</text>
  <text x="465" y="542" text-anchor="middle" font-size="12.5" fill="#333">若误用集合去重，会丢掉 (R3, C2)，错答 2（正确为 3）</text>
</svg>
