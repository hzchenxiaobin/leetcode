<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：回文 = 关于中心对称</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- racecar symmetric pairs -->
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">"racecar"：对称字符对全部相等 → 回文</text>
  <g filter="url(#sk)">
    <rect x="175" y="82" width="42" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="221" y="82" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="267" y="82" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="313" y="82" width="42" height="34" rx="5" fill="#f3eee7" stroke="#9a8a76" stroke-width="1.5"/>
    <rect x="359" y="82" width="42" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="405" y="82" width="42" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="451" y="82" width="42" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="196" y="104">r</text>
    <text x="242" y="104">a</text>
    <text x="288" y="104">c</text>
    <text x="334" y="104">e</text>
    <text x="380" y="104">c</text>
    <text x="426" y="104">a</text>
    <text x="472" y="104">r</text>
  </g>
  <!-- pair arcs -->
  <path d="M 196 120 Q 334 148 472 120" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <path d="M 242 124 Q 334 146 426 124" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <path d="M 288 126 Q 334 142 380 126" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="540" y="140" font-size="11" fill="#888" text-anchor="middle">中间字符</text>
  <text x="540" y="154" font-size="11" fill="#888" text-anchor="middle">无需比较</text>

  <!-- two pointers -->
  <text x="320" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">双指针对撞：从两端向中间收拢</text>
  <g filter="url(#sk)">
    <rect x="150" y="200" width="360" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="330" y="224" text-anchor="middle" font-size="15" fill="#333" font-family="monospace" font-weight="bold">l = 0  →        ←  r = m−1</text>
  <path d="M 205 250 Q 240 264 275 252" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 455 250 Q 420 264 385 252" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#555">s[l] ≠ s[r] → 立即否定；否则 l++、r−−</text>

  <!-- first-pair reject -->
  <g filter="url(#sk)">
    <rect x="60" y="288" width="280" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="200" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038">"abc"：首对 a ≠ c</text>
  <text x="200" y="328" text-anchor="middle" font-size="12" fill="#a04038">1 次比较即否定 ✓ 提前终止</text>

  <!-- empty return -->
  <g filter="url(#sk)">
    <rect x="360" y="288" width="240" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="480" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20">全部非回文？</text>
  <text x="480" y="328" text-anchor="middle" font-size="12" fill="#8a6a20">返回空串 ""</text>
  <path d="M 342 315 Q 351 315 358 315" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arr)"/>
</svg>
