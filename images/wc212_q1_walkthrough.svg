<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：releaseTimes = [9,29,49,50]，keysPressed = "cbcd"</text>
  <path d="M 130 38 Q 330 46 530 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- key strip -->
  <g filter="url(#r)">
    <rect x="40" y="54" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="84" y="54" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="128" y="54" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="172" y="54" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g filter="url(#r)" font-size="14" text-anchor="middle">
    <text x="62" y="76" font-weight="bold" fill="#2b4a6e">c</text>
    <text x="106" y="76" font-weight="bold" fill="#8a6a1a">b</text>
    <text x="150" y="76" font-weight="bold" fill="#8a6a1a">c</text>
    <text x="194" y="76" fill="#2e6e2e">d</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="62" y="100">松开 t=9</text><text x="106" y="100">松开 t=29</text>
    <text x="150" y="100">松开 t=49</text><text x="194" y="100">松开 t=50</text>
  </g>

  <!-- init annotation -->
  <g filter="url(#r)">
    <rect x="330" y="54" width="290" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="475" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">初值：第 0 键的持续时间就是 releaseTimes[0]</text>
  <text x="475" y="90" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">best = (9, 'c')</text>

  <!-- walkthrough table -->
  <g filter="url(#r)">
    <rect x="40" y="118" width="580" height="240" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4"/>
    <rect x="40" y="118" width="580" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="70" y="138">i</text>
    <text x="122" y="138">key</text>
    <text x="207" y="138">d（时长）</text>
    <text x="380" y="138">判定</text>
    <text x="555" y="138">best</text>
  </g>
  <g filter="url(#r)" stroke="#c8d2dc" stroke-width="1">
    <line x1="100" y1="148" x2="100" y2="358"/>
    <line x1="145" y1="148" x2="145" y2="358"/>
    <line x1="270" y1="148" x2="270" y2="358"/>
    <line x1="490" y1="148" x2="490" y2="358"/>
    <line x1="40" y1="190" x2="620" y2="190"/>
    <line x1="40" y1="232" x2="620" y2="232"/>
    <line x1="40" y1="274" x2="620" y2="274"/>
    <line x1="40" y1="316" x2="620" y2="316"/>
  </g>
  <g filter="url(#r)">
    <rect x="41" y="316" width="578" height="42" fill="#e6f4ea" opacity="0.6"/>
  </g>

  <g filter="url(#r)" font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="172" font-weight="bold">0</text>
    <text x="122" y="172" font-weight="bold">c</text>
    <text x="207" y="172">9（初值）</text>
    <text x="380" y="172">第 0 键直接作初值</text>
    <text x="555" y="172">(9, 'c')</text>

    <text x="70" y="214" font-weight="bold">1</text>
    <text x="122" y="214" font-weight="bold">b</text>
    <text x="207" y="214">29 − 9 = 20</text>
    <text x="380" y="214" fill="#2b4a6e">20 &gt; 9：更长 → 覆盖</text>
    <text x="555" y="214">(20, 'b')</text>

    <text x="70" y="256" font-weight="bold">2</text>
    <text x="122" y="256" font-weight="bold">c</text>
    <text x="207" y="256">49 − 29 = 20</text>
    <text x="380" y="256" fill="#b85450" font-weight="bold">并列 20，'c' &gt; 'b' → 换键</text>
    <text x="555" y="256">(20, 'c')</text>

    <text x="70" y="298" font-weight="bold">3</text>
    <text x="122" y="298" font-weight="bold">d</text>
    <text x="207" y="298">50 − 49 = 1</text>
    <text x="380" y="298">1 &lt; 20：跳过</text>
    <text x="555" y="298">(20, 'c')</text>

    <text x="330" y="342" font-size="12.5" font-weight="bold" fill="#2e6e2e">扫描结束 → 返回 bestKey = 'c' ✓</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="374" width="580" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="330" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">经典 WA：漏掉 i = 2 这一行的「并列换键」分支 → 错返 'b'</text>
  <text x="330" y="410" text-anchor="middle" font-size="11" fill="#444" filter="url(#r)">反向提醒：单条件 d ≥ bestDur 会错拿“最后按的键”——并列时必须比较字母</text>
</svg>
