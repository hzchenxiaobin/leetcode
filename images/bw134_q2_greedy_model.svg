<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">排序后：最弱的敌人当「能量兑换机」</text>

  <rect x="167" y="48" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="233" y="48" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="299" y="48" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="71" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">a0</text>
  <text x="260" y="71" text-anchor="middle" font-size="14" fill="#2b4a66" filter="url(#rough2)">…</text>
  <text x="326" y="71" text-anchor="middle" font-size="14" fill="#2b4a66" filter="url(#rough2)">…</text>
  <text x="194" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最弱</text>
  <text x="326" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全部标记换能量</text>

  <path d="M 260 106 L 260 122" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="112" y="126" width="296" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#rough2)">① 先打最弱者 1 次：得 1 分，energy −= a0</text>

  <path d="M 260 168 L 260 184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="112" y="188" width="296" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">② 标记其余全部敌人：energy += (sum − a0)</text>

  <path d="M 260 230 L 260 246" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="112" y="250" width="296" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">③ 之后反复打最弱者：每 a0 点能量换 1 分</text>

  <path d="M 260 292 L 260 306" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="86" y="310" width="348" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">ans = (energy + sum − a0) ÷ a0</text>

  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">门槛：energy &lt; a0 时连第 ① 步都做不了 → 直接返回 0</text>
</svg>
