<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：「全体互相熟识」⟺ 朋友图连通 ⟺ 连通分量数 = 1</text>
  <text x="310" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">人 = 节点；logs[i] = [t, a, b] = 时刻 t 加入的无向边；熟识（传递闭包）= 连通</text>

  <g filter="url(#rough2)">
    <line x1="85" y1="150" x2="155" y2="100" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="190" y1="210" x2="100" y2="225" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="235" y1="145" x2="190" y2="210" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="155" y1="100" x2="275" y2="215" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="235" y1="145" x2="100" y2="225" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="85" y1="150" x2="190" y2="210" stroke="#d6a040" stroke-width="2.5"/>
  </g>

  <g filter="url(#rough2)" font-size="8.5">
    <text x="128" y="124" fill="#4a7a3a">20190101</text>
    <text x="118" y="248" fill="#4a7a3a">20190104</text>
    <text x="222" y="188" fill="#4a7a3a">20190107</text>
    <text x="248" y="148" fill="#4a7a3a">20190211</text>
    <text x="152" y="196" fill="#999">20190224（无效）</text>
    <text x="118" y="172" fill="#8a6a20" font-weight="bold">20190301 ★答案边</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="85" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="155" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="235" cy="145" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="190" cy="210" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="100" cy="225" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="275" cy="215" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="85" y="155">0</text><text x="155" y="105">1</text><text x="235" y="150">2</text>
    <text x="190" y="215">3</text><text x="100" y="230">4</text><text x="275" y="220">5</text>
  </g>

  <text x="170" y="270" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5 条绿边 = 真合并（分量数 6→1）；灰虚线及未画出的</text>
  <text x="170" y="286" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">20190312、20190322 都是无效边，无需逐条处理到底</text>

  <rect x="355" y="70" width="235" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="472" y="94" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">并查集：只回答一个问题</text>
  <text x="472" y="116" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">find(a) 与 find(b) 是否同根？</text>
  <text x="472" y="136" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同根 → 无效边，comps 不变</text>
  <text x="472" y="156" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">异根 → 真合并，comps −−</text>

  <rect x="355" y="204" width="235" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="472" y="228" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">用计数代替全图检查</text>
  <text x="472" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">维护 comps，初值为 n</text>
  <text x="472" y="268" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每条边 O(α(n)) 更新，无需每次 BFS</text>
  <text x="472" y="288" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">comps == 1 即全体熟识</text>

  <rect x="40" y="306" width="550" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="315" y="330" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">关键前提：按时间戳升序处理（logs 乱序给出，必须先排序）</text>
  <text x="315" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最早时刻 = 使 comps 首次降为 1 的那条日志的时间戳；日志用尽仍 &gt; 1 → 返回 −1</text>

  <text x="310" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⚠ 「熟识」的递归定义正是朋友关系的传递闭包——连通分量把人划分成若干「朋友圈」</text>
</svg>
