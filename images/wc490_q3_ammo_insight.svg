<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：重排坍缩成计数，对位弹药才产出 1</text>
  <path d="M 150 40 Q 280 50 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- t box -->
  <rect x="195" y="56" width="170" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="280" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#a87b20">t = "1110"</text>
  <text x="375" y="81" text-anchor="start" font-size="10" fill="#999">可任意重排</text>

  <!-- arrows t -> pools -->
  <path d="M 225 94 Q 195 106 186 118" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 335 94 Q 365 106 374 118" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="280" y="112" text-anchor="middle" font-size="10" fill="#888">重排 ⇒ 顺序信息作废，只剩库存</text>

  <!-- ammo pools -->
  <rect x="95" y="122" width="175" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="182" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">'1' 弹药 × 3</text>
  <text x="182" y="161" text-anchor="middle" font-size="9.5" fill="#7a8aa0">（t 中 '1' 的个数）</text>

  <rect x="290" y="122" width="175" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="377" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">'0' 弹药 × 1</text>
  <text x="377" y="161" text-anchor="middle" font-size="9.5" fill="#7aa08a">（t 中 '0' 的个数）</text>

  <!-- arrows pools -> s cells -->
  <path d="M 160 170 Q 170 195 192 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 240 170 Q 300 200 348 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 340 170 Q 290 195 250 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 390 170 Q 345 195 302 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- s cells -->
  <text x="164" y="240" text-anchor="end" font-size="11" fill="#555">s[i] =</text>
  <g filter="url(#sk)">
    <rect x="172" y="214" width="46" height="44" rx="4" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.6"/>
    <rect x="224" y="214" width="46" height="44" rx="4" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.6"/>
    <rect x="276" y="214" width="46" height="44" rx="4" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.6"/>
    <rect x="328" y="214" width="46" height="44" rx="4" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.6"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="195" y="242">0</text>
    <text x="247" y="242">1</text>
    <text x="299" y="242">1</text>
    <text x="351" y="242">0</text>
  </g>
  <text x="400" y="242" text-anchor="start" font-size="9.5" fill="#999">s 固定不动</text>

  <!-- result marks -->
  <text x="164" y="273" text-anchor="end" font-size="10" fill="#555">ans[i] =</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="195" y="274" fill="#2e6e2e">✓ 1</text>
    <text x="247" y="274" fill="#2e6e2e">✓ 1</text>
    <text x="299" y="274" fill="#b85450">✗ 0</text>
    <text x="351" y="274" fill="#2e6e2e">✓ 1</text>
  </g>
  <text x="299" y="290" text-anchor="middle" font-size="8.5" fill="#b85450">'0' 打光，垫同位 '1'</text>

  <!-- callout -->
  <rect x="24" y="302" width="512" height="110" rx="10" fill="#f4f0fa" stroke="#7a5aa0" stroke-width="1.6" filter="url(#sk)"/>
  <text x="280" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a80">只有「相反」的比特对才产出 1：'1' 专打 s 的 0 位、'0' 专打 s 的 1 位，互不通用</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#4a4a4a">同位比特只能垫位（产出 0）；弹药总量 = 格子总数，怎么放都不空仓</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#4a4a4a">高位独裁：位 i 权重 2^(n−1−i) 大于其后全部之和 ⇒ 从左到右，能 1 则 1</text>
  <text x="280" y="398" text-anchor="middle" font-size="9.5" fill="#888">例：位置 2 想要 '0' 但 zero 已花在位置 1，只好垫 '1' 产出 0</text>
</svg>
