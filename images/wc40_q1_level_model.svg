<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：队列天然按层分段，每层只要「和」与「个数」</text>
  <text x="380" y="48" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">同一层节点值做一次平均，与树的形状、左右顺序都无关</text>

  <!-- ===== 第 0 层 ===== -->
  <g filter="url(#rough2)">
    <rect x="56" y="64" width="648" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="74" y="99" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 0 层</text>
  <text x="74" y="114" font-size="10" fill="#888888" filter="url(#rough2)">cnt = 1</text>
  <circle cx="380" cy="93" r="21" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="686" y="99" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">avg = 3 ÷ 1 = 3.00</text>

  <!-- ===== 第 1 层 ===== -->
  <g filter="url(#rough2)">
    <rect x="56" y="140" width="648" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="74" y="175" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">第 1 层</text>
  <text x="74" y="190" font-size="10" fill="#888888" filter="url(#rough2)">cnt = 2</text>
  <line x1="380" y1="114" x2="302" y2="147" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="380" y1="114" x2="458" y2="147" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="300" cy="169" r="21" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <circle cx="460" cy="169" r="21" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">20</text>
  <text x="686" y="175" text-anchor="end" font-size="12" fill="#2e6e2e" filter="url(#rough2)">avg = 29 ÷ 2 = 14.50</text>

  <!-- ===== 第 2 层 ===== -->
  <g filter="url(#rough2)">
    <rect x="56" y="216" width="648" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="74" y="251" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">第 2 层</text>
  <text x="74" y="266" font-size="10" fill="#888888" filter="url(#rough2)">cnt = 2</text>
  <line x1="300" y1="190" x2="252" y2="223" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="300" y1="190" x2="348" y2="223" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="250" cy="245" r="21" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">15</text>
  <circle cx="350" cy="245" r="21" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="686" y="251" text-anchor="end" font-size="12" fill="#a07820" filter="url(#rough2)">avg = 22 ÷ 2 = 11.00</text>

  <!-- ===== 说明框 ===== -->
  <g filter="url(#rough2)">
    <rect x="56" y="292" width="648" height="86" rx="10" fill="#f7f7f2" stroke="#999999" stroke-width="1.3"/>
  </g>
  <text x="380" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">分母是本层节点数 cnt，不是整棵树的 n —— 全树平均是另一个数（30 ÷ 5 = 6）</text>
  <text x="380" y="338" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">BFS 里 cnt 恰好等于「本轮开始时的队列长度 size」，所以层宽不必预先知道</text>
  <text x="380" y="362" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">avg = 该层节点值之和 ÷ 该层节点数，与其他任何层的节点都无关</text>
</svg>
