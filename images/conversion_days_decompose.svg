<svg xmlns="http://www.w3.org/2000/svg" width="940" height="450" viewBox="0 0 940 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arB" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="450" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：策略 = 选一个"过夜货币" c</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Day 1 panel ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="66" width="396" height="184" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="234" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">第 1 天 · 兑换图 G₁（rates₁）</text>

  <g filter="url(#sk)">
    <ellipse cx="110" cy="152" rx="42" ry="21" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="110" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">初始货币</text>
  <text x="110" y="163" text-anchor="middle" font-size="9" fill="#a08040">start = 1.0</text>

  <g filter="url(#sk)">
    <ellipse cx="234" cy="152" rx="28" ry="17" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="234" y="157" text-anchor="middle" font-size="13" fill="#999">…</text>

  <g filter="url(#sk)">
    <ellipse cx="360" cy="152" rx="32" ry="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="360" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>

  <path d="M 156 146 L 202 146" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 202 160 L 156 160" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="179" y="138" text-anchor="middle" font-size="10.5" fill="#2b6e9e" font-weight="bold">×r</text>

  <path d="M 266 146 L 324 146" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 324 160 L 266 160" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="295" y="138" text-anchor="middle" font-size="10.5" fill="#2b6e9e" font-weight="bold">×r</text>

  <text x="234" y="206" text-anchor="middle" font-size="10" fill="#888">边均可双向走（反向汇率 ×1/r）</text>
  <text x="234" y="230" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">d₁(c)：1.0 初始货币 → 最多换到多少 c</text>

  <!-- ===== Overnight connector ===== -->
  <path d="M 440 152 L 500 152" stroke="#c98a2b" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="470" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">过夜</text>
  <text x="470" y="174" text-anchor="middle" font-size="9.5" fill="#7a5415">持有 d₁(c)·c</text>

  <!-- ===== Day 2 panel ===== -->
  <g filter="url(#sk)">
    <rect x="508" y="66" width="396" height="184" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="706" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">第 2 天 · 兑换图 G₂（rates₂，独立！）</text>

  <g filter="url(#sk)">
    <ellipse cx="584" cy="152" rx="32" ry="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="584" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">c</text>

  <g filter="url(#sk)">
    <ellipse cx="708" cy="152" rx="28" ry="17" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <text x="708" y="157" text-anchor="middle" font-size="13" fill="#999">…</text>

  <g filter="url(#sk)">
    <ellipse cx="834" cy="152" rx="42" ry="21" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="834" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">初始货币</text>
  <text x="834" y="163" text-anchor="middle" font-size="9" fill="#a08040">终点</text>

  <path d="M 620 146 L 676 146" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 676 160 L 620 160" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="648" y="138" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">×r</text>

  <path d="M 740 146 L 788 146" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 788 160 L 740 160" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="764" y="138" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">×r</text>

  <text x="706" y="206" text-anchor="middle" font-size="10" fill="#888">与第 1 天的汇率完全无关</text>
  <text x="706" y="230" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">f₂(c)：1.0 单位 c → 最多换回多少初始货币</text>

  <!-- ===== Formula box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="276" width="820" height="84" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="308" font-size="15" font-weight="bold" fill="#2b2b2b">最终拥有 = d₁(c) × f₂(c)</text>
  <text x="90" y="340" font-size="12" fill="#444">答案 = max { d₁(c) · f₂(c) ：c 在两天图中均可达 }；取 c = 初始货币 时值恰为 1.0（保底：什么都不换）</text>

  <!-- ===== Bottom notes ===== -->
  <text x="470" y="392" text-anchor="middle" font-size="11" fill="#666">两天汇率相互独立，跨越两天的状态只有「第 1 天结束时持有哪种货币、多少单位」；</text>
  <text x="470" y="414" text-anchor="middle" font-size="11" fill="#666">兑换按单位线性缩放 ⇒ 第 2 天的结果 = 数量 × 单位回报，与数量大小无关 → 可对两天分别最大化再相乘。</text>
</svg>
