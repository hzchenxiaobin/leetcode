<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="900" height="570" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序切半 + 奇偶交错 → 锯齿形排列</text>
  <path d="M 240 44 Q 450 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 1: sorted array, split into halves ===== -->
  <text x="90" y="82" font-size="14" font-weight="bold" fill="#2b2b2b">① 排序后从中间切开（元素互不相同 ⇒ max(A) &lt; min(B)）</text>

  <g filter="url(#sk)">
    <rect x="150" y="96" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="216" y="96" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="282" y="96" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="348" y="96" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="414" y="96" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="178" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">1</text>
  <text x="244" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">2</text>
  <text x="310" y="122" text-anchor="middle" font-size="15" fill="#2e6e2e">3</text>
  <text x="376" y="122" text-anchor="middle" font-size="15" fill="#2b6e9e">4</text>
  <text x="442" y="122" text-anchor="middle" font-size="15" fill="#2b6e9e">5</text>
  <path d="M 343 88 L 343 150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="244" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">A = 较小一半（m = ⌈n/2⌉ = 3 个）</text>
  <text x="397" y="158" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">B = 较大一半</text>
  <text x="244" y="176" text-anchor="middle" font-size="11" fill="#888">max(A) = 3 &lt; min(B) = 4</text>

  <!-- ===== interleave arrows ===== -->
  <path d="M 178 144 Q 178 230 178 302" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 244 144 Q 272 230 308 302" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 310 144 Q 382 220 440 302" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 376 144 Q 302 198 246 248" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 442 144 Q 404 198 378 248" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- ===== Section 2: zigzag result ===== -->
  <text x="90" y="228" font-size="14" font-weight="bold" fill="#2b2b2b">② 奇偶交错填充：ans[2k] = A[k]，ans[2k+1] = B[k]</text>

  <path d="M 178 330 C 205 330 217 276 244 276 C 271 276 283 330 310 330 C 337 330 349 276 376 276 C 403 276 415 330 442 330"
        stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="150" y="310" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="216" y="256" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="282" y="310" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="348" y="256" width="56" height="40" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="414" y="310" width="56" height="40" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="178" y="336" text-anchor="middle" font-size="15" fill="#2e6e2e">1</text>
  <text x="244" y="282" text-anchor="middle" font-size="15" fill="#2b6e9e">4</text>
  <text x="310" y="336" text-anchor="middle" font-size="15" fill="#2e6e2e">2</text>
  <text x="376" y="282" text-anchor="middle" font-size="15" fill="#2b6e9e">5</text>
  <text x="442" y="336" text-anchor="middle" font-size="15" fill="#2e6e2e">3</text>
  <text x="486" y="272" font-size="12" fill="#b85450" font-weight="bold">峰 = B（大值）</text>
  <text x="486" y="334" font-size="12" fill="#b85450" font-weight="bold">谷 = A（小值）</text>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#666">整体呈「小-大-小-大-小」的锯齿（波浪）形</text>

  <!-- ===== Section 3: why it works ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="396" width="740" height="76" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="100" y="420" font-size="13" font-weight="bold" fill="#7a5415">③ 为什么成立：任意中间下标 i 的两侧邻居都与 ans[i] 来自不同的半</text>
  <text x="100" y="442" font-size="12" fill="#444">偶数位（谷，小值）：两侧邻居全在 B → 邻居均值 &gt; ans[i]；</text>
  <text x="100" y="460" font-size="12" fill="#444">奇数位（峰，大值）：两侧邻居全在 A → 邻居均值 &lt; ans[i]</text>

  <g filter="url(#sk)">
    <rect x="80" y="490" width="740" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="514" font-size="13" font-weight="bold" fill="#2e6e2e">结论：邻居均值严格偏向一侧，恒有 (ans[i-1]+ans[i+1])/2 ≠ ans[i] ✓</text>
  <text x="100" y="534" font-size="11" fill="#888">「互不相同」是关键前提；special judge 判定，任一合法解均可</text>
</svg>
