<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa" filter="url(#rough2)"/>

  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：只有 t 里「多出来的字母」必须被改写</text>
  <text x="380" y="52" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">字母异位词只关心每个字母出现几次，与位置无关</text>

  <text x="40" y="116" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">t =</text>
  <text x="40" y="280" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">s =</text>

  <rect x="96" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="114" text-anchor="middle" font-size="17" fill="#2f5a26" filter="url(#rough2)">a</text>
  <rect x="148" y="86" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="114" text-anchor="middle" font-size="17" fill="#2f5a26" filter="url(#rough2)">b</text>
  <rect x="200" y="86" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="222" y="114" text-anchor="middle" font-size="17" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="252" y="86" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="274" y="114" text-anchor="middle" font-size="17" fill="#8a3a36" filter="url(#rough2)">d</text>

  <rect x="96" y="250" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="278" text-anchor="middle" font-size="17" fill="#2f5a26" filter="url(#rough2)">a</text>
  <rect x="148" y="250" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="278" text-anchor="middle" font-size="17" fill="#2f4560" filter="url(#rough2)">a</text>
  <rect x="200" y="250" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="278" text-anchor="middle" font-size="17" fill="#2f5a26" filter="url(#rough2)">b</text>
  <rect x="252" y="250" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="274" y="278" text-anchor="middle" font-size="17" fill="#2f4560" filter="url(#rough2)">c</text>

  <path d="M 210 134 C 196 178, 172 196, 171 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 274 134 L 274 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">改写</text>
  <text x="296" y="196" font-size="9.5" fill="#b85450" filter="url(#rough2)">改写</text>

  <rect x="330" y="76" width="404" height="118" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="348" y="99" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">三类字符</text>
  <rect x="350" y="110" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="122" font-size="10" fill="#333" filter="url(#rough2)">已对上：两边都有，直接保留</text>
  <rect x="350" y="134" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="146" font-size="10" fill="#333" filter="url(#rough2)">t 多出来：必须改写成别的字母</text>
  <rect x="350" y="158" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="170" font-size="10" fill="#333" filter="url(#rough2)">t 缺少：正是上面那些字母的目标</text>

  <rect x="330" y="206" width="404" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="348" y="230" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 盈余字符总数</text>
  <text x="348" y="252" font-size="10" fill="#7a6020" filter="url(#rough2)">两串长度相同 ⇒ 盈余总数 = 缺口总数</text>
  <text x="348" y="280" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans = Σ max(0, cntT[c] − cntS[c])</text>
  <text x="348" y="306" font-size="10" fill="#7a6020" filter="url(#rough2)">本例：盈余 {b, d} 共 2 个 ⇒ ans = 2</text>
  <text x="348" y="326" font-size="9.5" fill="#9a7a30" filter="url(#rough2)">等价写法：ans = ½ Σ |cntT[c] − cntS[c]|</text>

  <rect x="40" y="348" width="330" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="11" fill="#2f4560" font-weight="bold" filter="url(#rough2)">为什么不逐位比较？</text>
  <text x="56" y="394" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">异位词是多重集相等，位置无关。</text>
  <text x="56" y="414" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">s = anagram, t = mangaar 有 5 位不同，</text>
  <text x="56" y="434" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">但答案是 0。</text>

  <rect x="390" y="348" width="344" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="372" font-size="11" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">为什么只数一侧？</text>
  <text x="406" y="394" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">每步改掉一个盈余字母，恰好补一个缺口，</text>
  <text x="406" y="414" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">故步数 = 盈余数，而不是 Σ|d|。</text>
  <text x="406" y="434" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">盈余字母与缺口字母必不相同 ⇒ 替换合法。</text>
</svg>
