<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：分块扫描统计不相等对</text>

  <rect x="40" y="56" width="180" height="36" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="79" text-anchor="middle" font-size="13" fill="#2b3a4e" filter="url(#rough2)">初始化：changes = 0</text>

  <path d="M 220 74 L 254 74" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,50 400,74 310,98 220,74" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#6b5416" filter="url(#rough2)">2i+1 &lt; n ？</text>

  <path d="M 400 74 L 436 74" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="64" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <polygon points="480,50 560,74 480,98 400,74" fill="#fce4ec"
           stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" transform="translate(-24,0)"/>
  <text x="456" y="78" text-anchor="middle" font-size="11" fill="#7a3230" filter="url(#rough2)">s[2i] == s[2i+1] ?</text>

  <path d="M 456 98 L 456 126" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="118" font-size="11" fill="#b85450" filter="url(#rough2)">相等</text>
  <rect x="396" y="128" width="120" height="32" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="149" text-anchor="middle" font-size="12" fill="#7a3230" filter="url(#rough2)">changes++（改其一）</text>
  <path d="M 396 144 L 340 144 L 340 120" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" fill="none"/>

  <path d="M 310 98 L 310 190" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">不相等（免费）</text>
  <text x="326" y="182" font-size="11" fill="#446688" filter="url(#rough2)">i++</text>

  <rect x="230" y="192" width="160" height="32" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="213" text-anchor="middle" font-size="12" fill="#2b3a4e" filter="url(#rough2)">回到判定（下一对）</text>
  <path d="M 230 208 L 130 208 L 130 96" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <rect x="200" y="240" width="220" height="34" rx="16" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="13" fill="#2e4d26" filter="url(#rough2)">扫描结束：返回 changes</text>
  <path d="M 310 224 L 310 240" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇偶分块后各对独立：每对恰贡献 0 或 1 次修改，求和即可</text>
</svg>
