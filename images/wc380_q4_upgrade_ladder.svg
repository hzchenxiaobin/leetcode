<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q2 → Q4：题意一字不改，只有「收集匹配」这一格需要换件</text>

  <!-- Row 1: Q2 做法 -->
  <text x="70" y="62" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">Q2 做法（#3006，|a|,|b| ≤ 10，n ≤ 10⁵）</text>

  <rect x="70" y="72" width="215" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="177" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33333" filter="url(#rough2)">收集匹配：逐位比较</text>
  <text x="177" y="110" text-anchor="middle" font-size="10.5" fill="#7a3a37" filter="url(#rough2)">O(n · L)，L = |a| + |b|</text>

  <path d="M 285 96 L 325 96" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="335" y="72" width="215" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">窗口判定：双指针归并</text>
  <text x="442" y="110" text-anchor="middle" font-size="10.5" fill="#4a5f78" filter="url(#rough2)">O(|A| + |B|)</text>

  <!-- 升级箭头：只针对收集格 -->
  <path d="M 177 120 L 177 188" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="188" y="146" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">|s|、|a|、|b| ≤ 5 × 10⁵</text>
  <text x="188" y="162" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">n·L 最高 2.5 × 10¹¹ → 必须换件</text>

  <!-- 判定格：原样搬运 -->
  <path d="M 442 120 L 442 188" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="146" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">原样搬运</text>
  <text x="452" y="162" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">一行不改</text>

  <!-- Row 2: Q4 做法 -->
  <text x="70" y="210" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Q4 做法（#3008，|s|、|a|、|b| ≤ 5 × 10⁵）</text>

  <rect x="70" y="220" width="215" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="177" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">收集匹配：KMP / Z 函数</text>
  <text x="177" y="258" text-anchor="middle" font-size="10.5" fill="#4a6a3e" filter="url(#rough2)">O(|s| + |a| + |b|)，重叠出现不漏</text>

  <path d="M 285 244 L 325 244" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="335" y="220" width="215" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">窗口判定：双指针归并</text>
  <text x="442" y="258" text-anchor="middle" font-size="10.5" fill="#4a5f78" filter="url(#rough2)">O(|A| + |B|)，与 Q2 完全相同</text>

  <!-- 警示框 -->
  <rect x="50" y="288" width="520" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">⚠️ 别赌语言内置 find：C++ 的 find 是朴素 O(n·m)，卡满用例（s = aⁿ，p = aᵐb）是现成的</text>
  <text x="310" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">Q2 的判定代码与证明原封不动 —— 本题全部新意只在「线性收集全部出现」这一件事</text>
</svg>
