<svg xmlns="http://www.w3.org/2000/svg" width="680" height="575" viewBox="0 0 680 575" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="575" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，先算分、后更新、维护 argmax</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="302" y="58" width="76" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 340 92 L 340 108" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="215" y="112" width="250" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">leftZeros ← 0，rightOnes ← Σnums</text>
  <text x="340" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">best ← −1，ans ← []，i ← 0</text>
  <path d="M 340 170 L 340 188" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop diamond -->
  <g filter="url(#sk)">
    <polygon points="340,192 456,228 340,264 224,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i ≤ n ?</text>

  <!-- no branch -->
  <text x="472" y="220" font-size="12" font-weight="bold" fill="#a04038">否</text>
  <path d="M 456 228 L 498 228" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="500" y="206" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="570" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <path d="M 570 250 L 570 268" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="532" y="270" width="76" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="570" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">结束</text>

  <!-- yes branch -->
  <text x="350" y="280" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 340 264 L 340 286" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="225" y="290" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">score ← leftZeros + rightOnes</text>
  <path d="M 340 332 L 340 350" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- argmax box -->
  <g filter="url(#sk)">
    <rect x="195" y="354" width="290" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">维护 argmax：</text>
  <text x="340" y="390" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">score &gt; best → best←score，ans←[i]</text>
  <text x="340" y="406" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">score = best → ans 追加 i</text>
  <path d="M 340 412 L 340 430" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- update box -->
  <g filter="url(#sk)">
    <rect x="185" y="434" width="310" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">若 i &lt; n：nums[i]=0 → leftZeros＋1</text>
  <text x="340" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">nums[i]=1 → rightOnes−1；i←i＋1</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 185 462 L 120 462 L 120 228 L 218 228" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="150" y="455" text-anchor="middle" font-size="10.5" fill="#666">i←i＋1</text>
  <text x="108" y="345" text-anchor="middle" font-size="11" fill="#666" transform="rotate(-90 108 345)">回到判断</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="60" y="506" width="560" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">关键顺序：先算分（当前切点的两侧归属），再更新（为下一格准备）</text>
  <text x="340" y="547" text-anchor="middle" font-size="12" fill="#444">best 初值 −1 保证首切点必刷新；ans 天然升序，无需排序</text>
</svg>
