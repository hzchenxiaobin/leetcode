<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心模型：b 相同 ⟺ a 相同；每组的 b 就是「更小元素之和」</text>

  <!-- 原下标顺序的 b 数组（样例 2） -->
  <text x="34" y="60" font-size="13" fill="#666" filter="url(#rough2)">b（原顺序）</text>
  <rect x="130" y="46" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="163" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="204" y="46" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="237" y="71" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="278" y="46" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="311" y="71" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="352" y="46" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="71" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="426" y="46" width="66" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="459" y="71" text-anchor="middle" font-size="14" fill="#c08820" filter="url(#rough2)">14</text>
  <text x="163" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="237" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="311" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="385" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="459" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i=5</text>

  <!-- 分组箭头 -->
  <path d="M330,106 L330,132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">排序 + 按相同 b 分组</text>

  <!-- 三组 -->
  <rect x="40" y="140" width="176" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">组 0：b = s₀，人数 c₀</text>
  <text x="128" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部取 v₀（最小正值）</text>

  <rect x="242" y="140" width="176" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="164" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">组 1：b = s₁，人数 c₁</text>
  <text x="330" y="186" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">全部取 v₁，且 v₁ &gt; v₀</text>

  <rect x="444" y="140" width="176" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="532" y="164" text-anchor="middle" font-size="13" fill="#c08820" filter="url(#rough2)">组 k−1：b = s_{k−1}</text>
  <text x="532" y="186" text-anchor="middle" font-size="12" fill="#c08820" filter="url(#rough2)">最大的一组，人数 c_{k−1}</text>

  <!-- 前缀和关系 -->
  <rect x="40" y="222" width="580" height="52" rx="8" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">组 i 的 shadow = 所有比它小的 a 之和 = s_i = c₀v₀ + c₁v₁ + … + c_{i−1}v_{i−1}</text>
  <text x="330" y="265" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">左边只含已知量：s_i 来自输入，c_j、v_j 已在前面算出</text>

  <!-- 闭式 -->
  <rect x="40" y="292" width="580" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="315" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">v_i = (s_{i+1} − s_i) / c_i　（i &lt; k−1，需整除且 v_i &gt; v_{i−1}）</text>
  <text x="330" y="338" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">最后一组 v_{k−1} = v_{k−2} + 1（没有更大元素约束，取最小）</text>
  <text x="330" y="357" text-anchor="middle" font-size="12" fill="#8a4a48" filter="url(#rough2)">每组取值被等式唯一确定，只有最后一组有 1 个自由度</text>

  <text x="330" y="392" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">因此「字典序最小」= 每组都取到合法下界 v_i，再按原下标写回</text>
  <text x="330" y="412" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">原下标只决定「谁拿哪个值」，不改变每组的值本身</text>
</svg>
