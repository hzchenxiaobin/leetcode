<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先求 max，再数「最长连续段」，两趟 O(n)</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="290" y="58" width="100" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="77" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">开始</text>
  <g filter="url(#sk)"><path d="M 340 88 L 340 108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="230" y="112" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">第一趟：mx = max(nums)</text>
  <text x="340" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">同时确定 k = mx（引理 1、2）</text>
  <g filter="url(#sk)"><path d="M 340 152 L 340 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="218" y="176" width="244" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="199" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">第二趟：cur = 0，ans = 0，逐个看 x = nums[i]</text>

  <g filter="url(#sk)"><path d="M 340 212 L 340 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 270 244 L 410 244 L 440 278 L 340 312 L 240 278 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">x == mx ?</text>
  <text x="340" y="290" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">（是否延续连续段）</text>

  <g filter="url(#sk)"><path d="M 240 278 L 160 278 L 160 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/></g>
  <text x="192" y="270" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="82" y="304" width="156" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="160" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">cur += 1</text>
  <text x="160" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5c24" filter="url(#sk)">ans = max(ans, cur)</text>

  <g filter="url(#sk)"><path d="M 440 278 L 520 278 L 520 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/></g>
  <text x="478" y="270" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="442" y="304" width="156" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="520" y="324" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">cur = 0</text>
  <text x="520" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">段被打断，从头再数</text>

  <g filter="url(#sk)"><path d="M 160 356 L 160 380 L 330 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/></g>
  <g filter="url(#sk)"><path d="M 520 356 L 520 380 L 350 380" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/></g>

  <g filter="url(#sk)"><rect x="336" y="366" width="8" height="0" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 340 380 L 340 402" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 278 408 L 402 408 L 424 432 L 340 456 L 256 432 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">还有元素？</text>

  <g filter="url(#sk)"><path d="M 256 432 L 120 432 L 120 194 L 214 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/></g>
  <text x="128" y="424" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">是，继续</text>

  <g filter="url(#sk)"><path d="M 340 456 L 340 474" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="356" y="470" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="386" y="466" width="120" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="446" y="485" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">返回 ans</text>

  <g filter="url(#sk)"><rect x="452" y="100" width="204" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="554" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不变式（处理完 x 后）</text>
  <text x="554" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">cur = 以当前元素结尾、全等于 mx</text>
  <text x="554" y="152" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">的连续段长度；ans 为历史最大</text>

  <g filter="url(#sk)"><rect x="452" y="176" width="204" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="554" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">单趟写法：x &gt; mx 时须同时</text>
  <text x="554" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">重置 cur = 1 与 ans = 1（见 §8）</text>
</svg>
