<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：中间元素无关，前缀双极值配对</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [1, 3, −5, 5, 6, −4]，m = 3；枚举尾下标 j = 5（尾元素 −4）</text>

  <rect x="82" y="57" width="242" height="62" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>

  <rect x="88" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="64" width="50" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="64" width="50" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="328" y="64" width="50" height="42" fill="#f0f0f0" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="388" y="64" width="50" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <text x="113" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="173" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="233" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−5</text>
  <text x="293" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="353" y="91" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">6</text>
  <text x="413" y="91" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">−4</text>

  <text x="113" y="121" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="173" y="121" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="233" y="121" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="293" y="121" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="353" y="121" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="413" y="121" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="203" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法首区间 [0, j−m+1] = [0, 3]</text>
  <text x="353" y="140" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">中间任填</text>
  <text x="413" y="140" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">尾元素 j</text>

  <path d="M 203 146 L 203 172" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="176" width="488" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">前缀 [0, 3] = {1, 3, −5, 5}：增量维护双极值，每步 O(1)</text>
  <text x="280" y="218" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">preMax = 5（下标 3）　preMin = −5（下标 2）</text>

  <path d="M 154 230 L 154 252" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 406 230 L 406 252" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="256" width="236" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="154" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">候选一：nums[j] × preMax</text>
  <text x="154" y="300" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">−4 × 5 = −20（尾为负，不占优）</text>

  <rect x="288" y="256" width="236" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="406" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">候选二：nums[j] × preMin</text>
  <text x="406" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−4 × (−5) = +20 ← 负负得正</text>

  <path d="M 154 320 Q 154 336 210 342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 406 320 Q 406 336 350 342" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="346" width="340" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">ans = max(−20, +20) = 20 ✓</text>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">两候选恒算恒比，不按尾的符号写分支</text>
</svg>
