<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：长度前置 → 逐字符分类 → 收尾查两旗</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="215" y="40" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="310" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">开始：isValid(word)</text>
  <path d="M310 74 L310 90" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- D0: length -->
  <g filter="url(#rough2)">
    <polygon points="310,90 415,126 310,162 205,126" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="310" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">len(word) ≥ 3 ?</text>
  <path d="M415 126 L466 126" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="438" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="468" y="110" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="528" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
  <path d="M310 162 L310 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="322" y="174" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- loop header -->
  <g filter="url(#rough2)">
    <rect x="215" y="178" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="310" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">for c in word</text>
  <path d="M310 210 L310 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- D1: alnum? -->
  <g filter="url(#rough2)">
    <polygon points="310,226 420,264 310,302 200,264" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="310" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c 是字母或数字 ?</text>
  <path d="M420 264 L466 264" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="440" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="468" y="248" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="528" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
  <text x="528" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(只能是 '@' '#' '$')</text>
  <path d="M310 302 L310 318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="322" y="314" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D2: letter? -->
  <g filter="url(#rough2)">
    <polygon points="310,318 410,356 310,394 210,356" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="310" y="361" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c 是字母 ?</text>
  <path d="M210 356 L154 356" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="184" y="348" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="30" y="340" width="122" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="91" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">数字：跳过</text>
  <text x="91" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↻ 下一个字符</text>
  <path d="M310 394 L310 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="322" y="406" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D3: vowel? -->
  <g filter="url(#rough2)">
    <polygon points="310,410 425,448 310,486 195,448" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c ∈ aeiouAEIOU ?</text>
  <path d="M425 448 L486 448" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="452" y="440" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="488" y="432" width="128" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="552" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">hasVowel = true</text>
  <text x="552" y="482" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↻ 下一个字符</text>
  <path d="M195 448 L152 448" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="176" y="440" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="24" y="432" width="126" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="87" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">hasConsonant = true</text>
  <text x="87" y="482" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↻ 下一个字符</text>

  <!-- loop exit -->
  <path d="M310 486 L310 502" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="330" y="498" font-size="10" fill="#888" filter="url(#rough2)">字符耗尽</text>
  <g filter="url(#rough2)">
    <rect x="185" y="502" width="250" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="310" y="523" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return hasVowel &amp;&amp; hasConsonant</text>
</svg>
