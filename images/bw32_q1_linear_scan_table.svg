<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">线性扫描：每个数组元素把答案顶高一位</text>

  <!-- 流程 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="70" y="60" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="145" y="80">ans = k（初始）</text>
    <text x="145" y="98">逐个看 arr[i]</text>
  </g>
  <path d="M 220 83 L 260 83" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <path d="M 262 60 L 344 60 L 364 83 L 344 106 L 262 106 L 282 83 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="313" y="89">arr[i] ≤ ans ?</text>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="420" y="60" width="110" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="475" y="80">ans++</text>
    <text x="475" y="98">（往后顶一位）</text>
  </g>
  <path d="M 364 83 C 388 83, 396 83, 418 83" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="74" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="420" y="130" width="110" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="475" y="155">停止：后面更大</text>
  </g>
  <path d="M 313 106 C 313 122, 350 140, 418 150" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="126" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 演算 -->
  <text x="280" y="212" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">演算：arr = [2,3,4,7,11]，k = 5</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="80" y="226" width="90" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="125" y="245">arr[i]</text>
    <rect x="170" y="226" width="120" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="230" y="245">与当前 ans 比</text>
    <rect x="290" y="226" width="90" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="335" y="245">动作</text>
    <rect x="380" y="226" width="100" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="430" y="245">ans</text>

    <rect x="80" y="254" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="170" y="254" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="254" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="254" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="125" y="271">2</text><text x="230" y="271">2 ≤ 5</text><text x="335" y="271">ans++</text><text x="430" y="271">6</text>

    <rect x="80" y="280" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="170" y="280" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="280" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="280" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="125" y="297">3</text><text x="230" y="297">3 ≤ 6</text><text x="335" y="297">ans++</text><text x="430" y="297">7</text>

    <rect x="80" y="306" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="170" y="306" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="306" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="306" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="125" y="323">4</text><text x="230" y="323">4 ≤ 7</text><text x="335" y="323">ans++</text><text x="430" y="323">8</text>

    <rect x="80" y="332" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="170" y="332" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="332" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="332" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="125" y="349">7</text><text x="230" y="349">7 ≤ 8</text><text x="335" y="349">ans++</text><text x="430" y="349">9</text>

    <rect x="80" y="358" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="170" y="358" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="358" width="90" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="380" y="358" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="125" y="372">11</text><text x="230" y="372">11 &gt; 9</text><text x="335" y="372">停止</text><text x="430" y="372">9 ✓</text>
  </g>
</svg>
