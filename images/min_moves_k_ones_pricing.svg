<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三种拾起方式的「定价」</text>
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,1,0,0,0,1,1,0,0,1]，Alice 站在 z = 1</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="62"  y="76" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="100" y="76" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="138" y="76" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>
    <rect x="176" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="214" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="252" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="290" y="76" width="38" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="328" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="366" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="404" y="76" width="38" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="81"  y="98">1</text>
    <text x="119" y="98">1</text>
    <text x="157" y="98" fill="#d6a040">1?</text>
    <text x="309" y="98">1</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#777" text-anchor="middle">
    <text x="81"  y="124">0</text>
    <text x="119" y="124">1</text>
    <text x="157" y="124">2</text>
    <text x="195" y="124">3</text>
    <text x="233" y="124">4</text>
    <text x="271" y="124">5</text>
    <text x="309" y="124">6</text>
    <text x="347" y="124">7</text>
    <text x="385" y="124">8</text>
    <text x="423" y="124">9</text>
  </g>

  <!-- Alice 标记 -->
  <g filter="url(#rough2)">
    <circle cx="119" cy="140" r="7" fill="#4a7a3a"/>
    <path d="M 113 146 L 125 146" stroke="#4a7a3a" stroke-width="2"/>
    <text x="119" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">Alice 站 z</text>
  </g>

  <!-- 免费：z 上的 1 -->
  <path d="M 119 68 C 130 44, 150 40, 168 46" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="172" y="42" font-size="11" fill="#4a7a3a" filter="url(#rough2)">初始就有 1：白拿，0 次</text>

  <!-- 改写：z+1 造 1 -->
  <path d="M 157 70 C 152 56, 140 52, 128 56" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="212" font-size="11" fill="#d6a040" filter="url(#rough2)">操作① 在 z±1 造 1（1 次）+ 操作② 换入 z（1 次）</text>
  <text x="236" y="228" font-size="11" fill="#d6a040" filter="url(#rough2)">= 恒定 2 次 / 个，至多 maxChanges 个</text>

  <!-- 移动：z-1 的 1 -->
  <path d="M 88 72 C 96 58, 108 56, 116 62" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="186" font-size="11" fill="#446688" filter="url(#rough2)">邻居距离 1：</text>
  <text x="40" y="202" font-size="11" fill="#446688" filter="url(#rough2)">1 次换入</text>

  <!-- 移动：远处的 1 -->
  <path d="M 309 66 C 280 30, 180 26, 130 58" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="20" font-size="11" fill="#b85450" filter="url(#rough2)">远处 p 的 1 一步步挪：恰好 |p − z| = 5 次</text>

  <!-- 价签区 -->
  <g filter="url(#rough2)">
    <rect x="40" y="252" width="150" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="205" y="252" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <rect x="370" y="252" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="115" y="274" fill="#4a7a3a">免费白拿</text>
    <text x="115" y="292" fill="#4a7a3a">0 次 / 个</text>
    <text x="115" y="306" font-size="10" fill="#777">至多 1 个（初始站位）</text>
    <text x="280" y="274" fill="#d6a040">改写贴脸</text>
    <text x="280" y="292" fill="#d6a040">2 次 / 个</text>
    <text x="280" y="306" font-size="10" fill="#777">至多 maxChanges 个</text>
    <text x="445" y="274" fill="#446688">移动过来</text>
    <text x="445" y="292" fill="#446688">|p − z| 次 / 个</text>
    <text x="445" y="306" font-size="10" fill="#777">数量不限</text>
  </g>

  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">距离 = 1 的邻居，移动（1 次）比改写（2 次）划算；</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">距离 ≥ 2 时改写更划算——除非改写名额用光，被迫移动最近的。</text>
</svg>
