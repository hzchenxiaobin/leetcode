<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">滑动窗口：并入后 cnt ≥ k 就收缩 left，每轮累加 ans += left</text>
  <path d="M 150 34 Q 320 43 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="185" y="44" width="280" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="325" y="67" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">mx ← max(nums)；left = cnt = ans = 0</text>

  <path d="M 325 82 L 325 100" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形A -->
  <g filter="url(#sk)"><polygon points="325,102 440,140 325,178 210,140" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="325" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">right &lt; n ?</text>

  <path d="M 440 140 L 464 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="466" y="118" width="152" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="542" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">返回 ans</text>

  <path d="M 325 178 L 325 196" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="192" font-size="11" fill="#2e6e2e" filter="url(#sk)">是</text>

  <!-- 并入 -->
  <g filter="url(#sk)"><rect x="185" y="198" width="280" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="325" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">并入 nums[right]</text>
  <text x="325" y="237" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">（若 == mx 则 cnt++）</text>

  <path d="M 325 240 L 325 258" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形B -->
  <g filter="url(#sk)"><polygon points="325,258 445,300 325,342 205,300" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="325" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">cnt ≥ k ?</text>

  <path d="M 445 300 L 460 300" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="451" y="292" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="462" y="278" width="172" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="548" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">若 nums[left] == mx：cnt--</text>
  <text x="548" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">left++</text>

  <path d="M 548 278 C 548 252 420 240 372 262" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 325 342 L 325 360" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="338" y="356" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <!-- 累加 -->
  <g filter="url(#sk)"><rect x="185" y="362" width="280" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="325" y="381" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += left</text>
  <text x="325" y="397" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">（以 right 结尾恰 left 个合法左端点）</text>

  <path d="M 185 383 C 120 383 118 140 208 140" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="250" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">right++</text>
  <text x="96" y="266" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">回到判定</text>

  <!-- 不变式 -->
  <g filter="url(#sk)"><rect x="36" y="428" width="568" height="60" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">不变式：收缩结束时 [left, right] 内恰有 k−1 个 mx，且 nums[left−1] = mx（若 left &gt; 0）</text>
  <text x="320" y="472" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">⇒ 以 right 结尾的合法左端点恰为 l ∈ [0, left−1]；left、right 各至多前进 n 次 ⇒ O(n)</text>
</svg>
