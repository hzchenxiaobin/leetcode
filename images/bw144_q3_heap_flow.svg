<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">扫描每个位置：先回收过期查询，再按需取"右端点最远"的候选</text>

  <rect x="150" y="46" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">按左端点分组：byL[l] = 所有右端点</text>

  <path d="M 280 86 L 280 108" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="110" width="200" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">active 弹出 r &lt; i 的查询，cur−−</text>

  <rect x="300" y="110" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">byL[i] 全部压入 avail 大根堆</text>

  <path d="M 160 154 L 160 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 154 L 400 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,178 392,208 280,238 168,208" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">need = nums[i] − cur</text>
  <text x="280" y="224" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">need &gt; 0 ?</text>

  <!-- 是 -->
  <path d="M 392 208 L 430 208" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="434" y="184" width="112" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取堆顶 r</text>
  <text x="490" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur++，used++</text>

  <!-- 否 -->
  <path d="M 280 238 L 280 258" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="252" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="176" y="260" width="208" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++ （扫描下一个位置）</text>

  <!-- 失败 -->
  <rect x="56" y="260" width="108" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">堆空 → -1</text>

  <rect x="120" y="312" width="320" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = m − used（已选数最少 ⇒ 删除最多）</text>
</svg>
