<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">演算：n = 3，presses = 2 ⇒ 答案是 7</text>
  <text x="330" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">可行的按下集合有 7 个：空集，以及全部 6 个二元子集</text>

  <!-- 表头 -->
  <rect x="40" y="66" width="580" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">按下集合 S</text>
  <text x="230" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">(α, β, γ)</text>
  <text x="355" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">翻转位</text>
  <text x="510" y="86" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">灯 1..3 状态</text>

  <!-- 第 1 行：空集 -->
  <rect x="40" y="100" width="580" height="32" rx="6" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="121" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">{ } 按两次同一开关</text>
  <text x="230" y="121" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(0, 0, 0)</text>
  <text x="355" y="121" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">000</text>
  <text x="510" y="121" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">开 开 开</text>

  <!-- 第 2 行 -->
  <rect x="40" y="136" width="580" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="157" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">{1, 2}</text>
  <text x="230" y="157" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">(0, 1, 0)</text>
  <text x="355" y="157" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">101</text>
  <text x="510" y="157" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">关 开 关</text>

  <!-- 第 3 行 -->
  <rect x="40" y="172" width="580" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">{1, 3}</text>
  <text x="230" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">(1, 1, 0)</text>
  <text x="355" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">010</text>
  <text x="510" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">开 关 开</text>

  <!-- 第 4 行 -->
  <rect x="40" y="208" width="580" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="229" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">{2, 3}</text>
  <text x="230" y="229" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">(1, 0, 0)</text>
  <text x="355" y="229" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">111</text>
  <text x="510" y="229" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">关 关 关</text>

  <!-- 第 5 行 -->
  <rect x="40" y="244" width="580" height="32" rx="6" fill="#f5f0ff" stroke="#7a5ea8" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="265" text-anchor="middle" font-size="11.5" fill="#4a3670" filter="url(#rough2)">{1, 4}</text>
  <text x="230" y="265" text-anchor="middle" font-size="11.5" fill="#4a3670" filter="url(#rough2)">(1, 0, 1)</text>
  <text x="355" y="265" text-anchor="middle" font-size="11.5" fill="#4a3670" filter="url(#rough2)">011</text>
  <text x="510" y="265" text-anchor="middle" font-size="11.5" fill="#4a3670" filter="url(#rough2)">开 关 关</text>

  <!-- 第 6 行 -->
  <rect x="40" y="280" width="580" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="301" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">{2, 4}</text>
  <text x="230" y="301" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">(1, 1, 1)</text>
  <text x="355" y="301" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">110</text>
  <text x="510" y="301" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">关 关 开</text>

  <!-- 第 7 行 -->
  <rect x="40" y="316" width="580" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="337" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">{3, 4}</text>
  <text x="230" y="337" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">(0, 1, 1)</text>
  <text x="355" y="337" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">001</text>
  <text x="510" y="337" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">开 开 关</text>

  <!-- 结论 -->
  <path d="M330,352 L330,380" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="384" width="580" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="408" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7 个可行子集恰好给出 7 个互不相同的状态，答案 = 7</text>
  <text x="330" y="432" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#rough2)">8 种状态里唯独「关 开 开」（翻转位 100）在两次按压下到不了，它要按 1 次或 3 次才行</text>
</svg>
