<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：只删后缀 ⇒ 目标必是公共前缀</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板① 左对齐看三个串 -->
  <g filter="url(#sk)"><rect x="36" y="54" width="316" height="232" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="52" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 左对齐看三个串（示例 1）</text>

  <!-- 行标签 -->
  <text x="70" y="119" text-anchor="middle" font-size="13" fill="#444">s₁</text>
  <text x="70" y="173" text-anchor="middle" font-size="13" fill="#444">s₂</text>
  <text x="70" y="227" text-anchor="middle" font-size="13" fill="#444">s₃</text>

  <!-- s1 = abc -->
  <g filter="url(#sk)"><rect x="100" y="96" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="118" y="119" text-anchor="middle" font-size="14" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="140" y="96" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="158" y="119" text-anchor="middle" font-size="14" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="180" y="96" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="198" y="119" text-anchor="middle" font-size="14" fill="#8a3a36">c</text>
  <path d="M 184 102 L 212 126 M 212 102 L 184 126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- s2 = abb -->
  <g filter="url(#sk)"><rect x="100" y="150" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="118" y="173" text-anchor="middle" font-size="14" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="140" y="150" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="158" y="173" text-anchor="middle" font-size="14" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="180" y="150" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="198" y="173" text-anchor="middle" font-size="14" fill="#8a3a36">b</text>
  <path d="M 184 156 L 212 180 M 212 156 L 184 180" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- s3 = ab -->
  <g filter="url(#sk)"><rect x="100" y="204" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="118" y="227" text-anchor="middle" font-size="14" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="140" y="204" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="158" y="227" text-anchor="middle" font-size="14" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="180" y="204" width="36" height="36" rx="4" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3"/></g>
  <text x="198" y="227" text-anchor="middle" font-size="12" fill="#999">∅</text>

  <!-- 删除标签 -->
  <text x="230" y="112" font-size="11" fill="#b85450">删</text>
  <text x="230" y="166" font-size="11" fill="#b85450">删</text>
  <text x="230" y="224" font-size="10.5" fill="#888">已到末尾</text>

  <!-- L 边界 -->
  <path d="M 178 88 L 178 246" stroke="#7a5415" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="178" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">L = 2</text>
  <text x="194" y="280" text-anchor="middle" font-size="10.5" fill="#666">公共前缀（绿）保留 · 尾巴（红）削掉</text>

  <!-- 面板② 三条推理链 -->
  <g filter="url(#sk)"><rect x="372" y="54" width="232" height="232" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="388" y="78" font-size="13" font-weight="bold" fill="#7a5415">② 三条推理链</text>
  <text x="388" y="104" font-size="11" fill="#444">① 只删最右字符 ⇒ 任意时刻</text>
  <text x="396" y="121" font-size="11" fill="#444">每个 sᵢ 都是原串的前缀</text>
  <text x="388" y="148" font-size="11" fill="#444">② 长度 ≥ 2 才能删 ⇒ 长度 1</text>
  <text x="396" y="165" font-size="11" fill="#444">的串卡死，空串不可达</text>
  <text x="388" y="192" font-size="11" fill="#444">③ 目标 = 公共前缀，代价</text>
  <text x="396" y="209" font-size="11" fill="#444">Σlen − 3k 随 k 单调递减</text>
  <g filter="url(#sk)"><rect x="384" y="224" width="208" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="488" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">首字符不全相等 ⇒ 直接 −1</text>

  <!-- 汇合箭头 -->
  <path d="M 194 288 Q 240 300 300 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 488 288 Q 440 300 380 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="60" y="310" width="520" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">ans = len₁ + len₂ + len₃ − 3L（L 为 LCP 长度）</text>
  <text x="320" y="356" text-anchor="middle" font-size="11.5" fill="#555">L = 0 ⇒ 无解返回 −1：三串首字符对不齐，前缀永远无法汇合</text>

  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#888">把「怎么删」读成「公共前缀有多长」—— 状态空间坍缩成一个数</text>
</svg>
