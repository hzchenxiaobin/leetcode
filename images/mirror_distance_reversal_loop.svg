<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：n = 1050 的算术反转逐步走查</text>

  <!-- Table header -->
  <g filter="url(#r)">
    <rect x="40" y="48" width="60" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="100" y="48" width="90" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="190" y="48" width="70" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="260" y="48" width="190" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="450" y="48" width="80" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="70" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#r)">轮次</text>
  <text x="145" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#r)">x</text>
  <text x="225" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#r)">x%10</text>
  <text x="355" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#r)">rev=rev×10+x%10</text>
  <text x="490" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace" filter="url(#r)">x/=10</text>

  <!-- Row 0: init -->
  <g filter="url(#r)">
    <rect x="40" y="80" width="60" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="80" width="90" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="190" y="80" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="260" y="80" width="190" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="450" y="80" width="80" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">初始</text>
  <text x="145" y="99" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">1050</text>
  <text x="225" y="99" text-anchor="middle" font-size="11" fill="#999" font-family="monospace" filter="url(#r)">—</text>
  <text x="355" y="99" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">0</text>
  <text x="490" y="99" text-anchor="middle" font-size="11" fill="#999" font-family="monospace" filter="url(#r)">—</text>

  <!-- Row 1 -->
  <g filter="url(#r)">
    <rect x="40" y="110" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="100" y="110" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="190" y="110" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="110" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="450" y="110" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="70" y="129" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">1</text>
  <text x="145" y="129" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">1050</text>
  <text x="225" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#r)">0</text>
  <text x="355" y="129" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">0×10+0 = 0</text>
  <text x="490" y="129" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">105</text>

  <!-- Row 2 -->
  <g filter="url(#r)">
    <rect x="40" y="140" width="60" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="140" width="90" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="190" y="140" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="260" y="140" width="190" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="450" y="140" width="80" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="70" y="159" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">2</text>
  <text x="145" y="159" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">105</text>
  <text x="225" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#r)">5</text>
  <text x="355" y="159" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">0×10+5 = 5</text>
  <text x="490" y="159" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">10</text>

  <!-- Row 3 -->
  <g filter="url(#r)">
    <rect x="40" y="170" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="100" y="170" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="190" y="170" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="260" y="170" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="450" y="170" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="70" y="189" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">3</text>
  <text x="145" y="189" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">10</text>
  <text x="225" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#r)">0</text>
  <text x="355" y="189" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">5×10+0 = 50</text>
  <text x="490" y="189" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">1</text>

  <!-- Row 4 -->
  <g filter="url(#r)">
    <rect x="40" y="200" width="60" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="100" y="200" width="90" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="190" y="200" width="70" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="260" y="200" width="190" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    <rect x="450" y="200" width="80" height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="70" y="219" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">4</text>
  <text x="145" y="219" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">1</text>
  <text x="225" y="219" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#r)">1</text>
  <text x="355" y="219" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">50×10+1 = 501</text>
  <text x="490" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" font-family="monospace" filter="url(#r)">0 ✓</text>

  <!-- Loop end note -->
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#888" font-family="monospace" filter="url(#r)">x = 0，循环结束，rev = 501</text>

  <!-- Result -->
  <g filter="url(#r)">
    <path d="M 280 252 L 280 268" stroke="#b85450" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#r)">
    <rect x="130" y="274" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="300" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#r)">|1050 − 501| = 549 ✓</text>

  <!-- Note -->
  <g filter="url(#r)">
    <rect x="60" y="326" width="440" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">尾随零 → 前导零：数字串 "0501" 的整数值即 501，自动消失</text>
</svg>
