<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="392" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：示例 1 全合规 ✓ · 示例 2 首违例即短路 ✗</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左面板：示例1 -->
  <g filter="url(#sk)"><rect x="36" y="48" width="288" height="300" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="180" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">示例 1（n = 4）：合法 X 矩阵</text>

  <g filter="url(#sk)"><rect x="84" y="88" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="102" y="111" text-anchor="middle" font-size="13" fill="#2e5e2e">2</text>
  <g filter="url(#sk)"><rect x="120" y="88" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="138" y="111" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="156" y="88" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="174" y="111" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="192" y="88" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="111" text-anchor="middle" font-size="13" fill="#2e5e2e">1</text>

  <g filter="url(#sk)"><rect x="84" y="124" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="102" y="147" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="120" y="124" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="138" y="147" text-anchor="middle" font-size="13" fill="#2e5e2e">3</text>
  <g filter="url(#sk)"><rect x="156" y="124" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="174" y="147" text-anchor="middle" font-size="13" fill="#2e5e2e">1</text>
  <g filter="url(#sk)"><rect x="192" y="124" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="210" y="147" text-anchor="middle" font-size="13" fill="#a04a48">0</text>

  <g filter="url(#sk)"><rect x="84" y="160" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="102" y="183" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="120" y="160" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="138" y="183" text-anchor="middle" font-size="13" fill="#2e5e2e">5</text>
  <g filter="url(#sk)"><rect x="156" y="160" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="174" y="183" text-anchor="middle" font-size="13" fill="#2e5e2e">2</text>
  <g filter="url(#sk)"><rect x="192" y="160" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="210" y="183" text-anchor="middle" font-size="13" fill="#a04a48">0</text>

  <g filter="url(#sk)"><rect x="84" y="196" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="102" y="219" text-anchor="middle" font-size="13" fill="#2e5e2e">4</text>
  <g filter="url(#sk)"><rect x="120" y="196" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="138" y="219" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="156" y="196" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="174" y="219" text-anchor="middle" font-size="13" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="192" y="196" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="219" text-anchor="middle" font-size="13" fill="#2e5e2e">2</text>

  <text x="180" y="262" text-anchor="middle" font-size="11" fill="#555">主对角 2,3,2,2 · 副对角 1,1,5,4 均非 0，其余全 0</text>
  <text x="180" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">16 / 16 格全合规 → return true</text>
  <text x="180" y="316" text-anchor="middle" font-size="10.5" fill="#888">合法矩阵是 worst case：必须扫满 n² 格才能确认</text>
  <text x="180" y="338" text-anchor="middle" font-size="10.5" fill="#888">（短路只在非法输入上生效）</text>

  <!-- 右面板：示例2 -->
  <g filter="url(#sk)"><rect x="332" y="48" width="272" height="300" rx="10" fill="#fdf0f0" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="468" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">示例 2（n = 3）：第 2 格即短路</text>

  <g filter="url(#sk)"><rect x="414" y="88" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="432" y="111" text-anchor="middle" font-size="14" fill="#2e5e2e">5</text>
  <g filter="url(#sk)"><circle cx="424" cy="100" r="8" fill="#4a8e4a"/></g>
  <text x="424" y="104" text-anchor="middle" font-size="10" fill="#ffffff">1</text>
  <text x="447" y="102" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <g filter="url(#sk)"><rect x="450" y="88" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="468" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">7</text>
  <g filter="url(#sk)"><circle cx="460" cy="100" r="8" fill="#b85450"/></g>
  <text x="460" y="104" text-anchor="middle" font-size="10" fill="#ffffff">2</text>
  <text x="481" y="102" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <path d="M 433 100 L 449 100" stroke="#3a3a3a" stroke-width="1.3" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)" opacity="0.45"><rect x="486" y="88" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="504" y="111" text-anchor="middle" font-size="13" fill="#2e5e2e">0</text></g>

  <g filter="url(#sk)" opacity="0.45"><rect x="414" y="124" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="432" y="147" text-anchor="middle" font-size="13" fill="#a04a48">0</text></g>
  <g filter="url(#sk)" opacity="0.45"><rect x="450" y="124" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="468" y="147" text-anchor="middle" font-size="13" fill="#2e5e2e">3</text></g>
  <g filter="url(#sk)" opacity="0.45"><rect x="486" y="124" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="504" y="147" text-anchor="middle" font-size="13" fill="#2e5e2e">1</text></g>

  <g filter="url(#sk)" opacity="0.45"><rect x="414" y="160" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="432" y="183" text-anchor="middle" font-size="13" fill="#2e5e2e">0</text></g>
  <g filter="url(#sk)" opacity="0.45"><rect x="450" y="160" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="468" y="183" text-anchor="middle" font-size="13" fill="#a04a48">5</text></g>
  <g filter="url(#sk)" opacity="0.45"><rect x="486" y="160" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g opacity="0.45"><text x="504" y="183" text-anchor="middle" font-size="13" fill="#2e5e2e">0</text></g>

  <text x="468" y="232" text-anchor="middle" font-size="11.5" fill="#555">① (0,0)=5：主对角线，≠ 0 ✓</text>
  <text x="468" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">② (0,1)=7：非对角线，却 ≠ 0 ✗</text>
  <text x="468" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">→ 立即 return false</text>
  <text x="468" y="312" text-anchor="middle" font-size="10.5" fill="#888">实际共 6 格违例，短路后只验了 2 格</text>
  <text x="468" y="334" text-anchor="middle" font-size="10.5" fill="#888">（其余 7 格不再检查）</text>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="96" y="360" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="116" y="372" font-size="11" fill="#555">对角线（须 ≠ 0）</text>
  <g filter="url(#sk)"><rect x="256" y="360" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="276" y="372" font-size="11" fill="#555">非对角（须 = 0）</text>
  <g filter="url(#sk)"><rect x="420" y="360" width="14" height="14" rx="3" fill="#d9d9d9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="440" y="372" font-size="11" fill="#555">淡化 = 短路后未检查</text>
</svg>
