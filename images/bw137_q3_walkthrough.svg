<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：board = [[1,2,3],[4,5,6],[7,8,9]]</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 3，每行的前 3 大就是整行，27 种取法里筛出列不重复的 6 种</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60" y="70" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="124" y="70" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="188" y="70" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>

    <rect x="60" y="120" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="124" y="120" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="188" y="120" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>

    <rect x="60" y="170" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="124" y="170" width="60" height="46" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="188" y="170" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="90" y="100" fill="#8a6a20">1</text>
    <text x="154" y="100" fill="#999">2</text>
    <text x="218" y="100" fill="#999">3</text>
    <text x="90" y="150" fill="#999">4</text>
    <text x="154" y="150" fill="#8a6a20">5</text>
    <text x="218" y="150" fill="#999">6</text>
    <text x="90" y="200" fill="#999">7</text>
    <text x="154" y="200" fill="#999">8</text>
    <text x="218" y="200" fill="#8a6a20">9</text>
  </g>

  <text x="280" y="98" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">选中的三个格子</text>
  <text x="280" y="120" font-size="11" fill="#3a4a66" filter="url(#rough2)">(0,0) → 1</text>
  <text x="280" y="140" font-size="11" fill="#3a4a66" filter="url(#rough2)">(1,1) → 5</text>
  <text x="280" y="160" font-size="11" fill="#3a4a66" filter="url(#rough2)">(2,2) → 9</text>
  <text x="280" y="184" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">和 = 15</text>

  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="44" y="252" font-weight="bold" fill="#444">可行取法（列号互异）</text>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="60" y="276" fill="#555">(0,0) (1,1) (2,2) → 1 + 5 + 9 = 15</text>
    <text x="60" y="298" fill="#555">(0,2) (1,1) (2,0) → 3 + 5 + 7 = 15</text>
    <text x="60" y="320" fill="#555">(0,0) (1,2) (2,1) → 1 + 6 + 8 = 15</text>
  </g>

  <rect x="44" y="336" width="472" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="356" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = 15（三条"广义对角"取法同分，取其一即可）</text>
  <text x="58" y="375" font-size="10.5" fill="#555" filter="url(#rough2)">27 种取法里，列号两两不同的恰好是 3! = 6 种（另有 3 种是反向对角）</text>
</svg>
