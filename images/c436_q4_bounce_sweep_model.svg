<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8aa4c8"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#fafafa"/>
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描 + 右弹跳：一次弹跳 2 步，i 与 i+1 各 +1 次访问</text>
  <path d="M 180 38 Q 440 46 700 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ghost cell -1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="170" width="54" height="44" rx="4" fill="#f4f2ec" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="51" y="188" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">起点</text>
  <text x="51" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#999" filter="url(#rough2)">−1</text>

  <!-- first forced move -->
  <path d="M 78 178 L 112 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">被迫</text>

  <!-- index cells 0..4 -->
  <g font-size="12">
    <g filter="url(#rough2)">
      <rect x="116" y="170" width="72" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
      <rect x="208" y="170" width="72" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
      <rect x="300" y="170" width="72" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <rect x="392" y="170" width="72" height="44" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
      <rect x="484" y="170" width="72" height="44" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2"/>
    </g>
    <text x="152" y="188" text-anchor="middle" font-weight="bold" fill="#33507a" filter="url(#rough2)">0</text>
    <text x="244" y="188" text-anchor="middle" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">i</text>
    <text x="336" y="188" text-anchor="middle" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">i+1</text>
    <text x="428" y="188" text-anchor="middle" fill="#999" filter="url(#rough2)">i+2</text>
    <text x="520" y="188" text-anchor="middle" fill="#999" filter="url(#rough2)">…</text>
    <text x="152" y="204" text-anchor="middle" font-size="10" fill="#8aa" filter="url(#rough2)">已完成 ✓</text>
    <text x="244" y="204" text-anchor="middle" font-size="10" fill="#a06a1a" filter="url(#rough2)">当前位</text>
    <text x="336" y="204" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">收溢出</text>
  </g>

  <!-- arrival arrow into i -->
  <path d="M 188 160 Q 198 148 208 154" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="244" y="140" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">到达：+1 次访问（1 步）</text>

  <!-- two right-bounce arcs above between i and i+1 -->
  <path d="M 244 164 Q 290 108 336 164" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 236 164 Q 290 88 344 164" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">右弹 d 次（补缺口 d）</text>
  <text x="375" y="122" font-size="9.5" fill="#8a6a2a" filter="url(#rough2)">每次 i→i+1→i 共 2 步</text>

  <!-- spill bucket under i+1 -->
  <path d="M 336 214 Q 336 232 330 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="288" y="244" width="96" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="336" y="262" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">溢出 spill = d</text>
  <text x="336" y="277" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i+1 白得 d 次访问</text>

  <!-- left bounce contrast (below) -->
  <path d="M 226 216 Q 170 268 160 218" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="106" y="262" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="181" y="280" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040" filter="url(#rough2)">向左弹 ✗ 溢出全浪费</text>
  <text x="181" y="295" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（落在已完工的 i−1 上）</text>

  <!-- right side rules -->
  <g filter="url(#rough2)">
    <rect x="580" y="60" width="280" height="224" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="600" y="86" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">扫描判定（spill 只传一格）</text>
  <text x="600" y="110" font-size="10.5" fill="#444" filter="url(#rough2)">① 进入 i：已有 1 + spill 次访问</text>
  <text x="600" y="134" font-size="10.5" fill="#444" filter="url(#rough2)">② 缺 d = need − 1 − spill：</text>
  <text x="614" y="152" font-size="10.5" fill="#a06a1a" font-weight="bold" filter="url(#rough2)">右弹 d 次 → ops += 2d</text>
  <text x="614" y="170" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">spill ← d（传给 i+1）</text>
  <text x="600" y="194" font-size="10.5" fill="#444" filter="url(#rough2)">③ 1 + spill ≥ need：富余不结转</text>
  <text x="614" y="212" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">spill ← 0</text>
  <text x="600" y="236" font-size="10.5" fill="#444" filter="url(#rough2)">④ 尾部 k = need[n−1] − spill：</text>
  <text x="614" y="254" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">k ≤ 0 → 停在 n−2（省 1 步）</text>
  <text x="614" y="272" font-size="10.5" fill="#a06a1a" font-weight="bold" filter="url(#rough2)">k &gt; 0 → 到达 + (k−1) 弹 = 2k−1</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="50" y="316" width="810" height="66" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="340" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么弹跳必须「成对」计价？</text>
  <text x="70" y="362" font-size="11" fill="#444" filter="url(#rough2)">同一下标不能连续两次落点（每步必须 ±1）→ 给 i 加 1 次访问必然伴随 1 次邻居落点 → 交错结构迫使「缺口 × 2」步</text>

  <!-- bottom mini example -->
  <g filter="url(#rough2)">
    <rect x="50" y="400" width="810" height="80" rx="8" fill="#f7f4ec" stroke="#ccc" stroke-width="1.1"/>
  </g>
  <text x="70" y="424" font-size="11" font-weight="bold" fill="#33507a" filter="url(#rough2)">mini 例：need = [3, 1]（n = 2，x 与 points 自定）</text>
  <text x="70" y="446" font-size="10.5" fill="#444" filter="url(#rough2)">i=0：到达 1 次，缺 d=2 → 右弹 2 次（4 步），spill=2 传给下标 1</text>
  <text x="70" y="466" font-size="10.5" fill="#444" filter="url(#rough2)">末位：k = 1 − 2 ≤ 0 → 停在下标 0，总步数 = 1 + 4 = 5，走法 −1→0→1→0→1→0</text>
</svg>
