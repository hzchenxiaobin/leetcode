<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：4 × 陆地格数 − 2 × 相邻陆地对数</text>
  <text x="70" y="66" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">先把每个陆地格子看成独立的 4 条边</text>

  <rect x="70" y="100" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="138" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="100" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="138" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="164" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="202" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="164" width="64" height="64" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="166" y="202" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>

  <line x1="134" y1="100" x2="134" y2="164" stroke="#b85450" stroke-width="3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="70" y1="164" x2="134" y2="164" stroke="#b85450" stroke-width="3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">共享边</text>
  <text x="34" y="158" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">共享边</text>

  <text x="70" y="256" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">独立计数：4 × 3 = 12 条边</text>
  <text x="70" y="280" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">扣掉共享边：2 × 2 = 4 条</text>
  <text x="70" y="304" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">周长 = 12 − 4 = 8</text>

  <rect x="340" y="92" width="296" height="196" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="120" text-anchor="start" font-size="13" fill="#b8860b" font-weight="bold" filter="url(#rough2)">为什么是减 2，而不是减 1？</text>
  <text x="360" y="150" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">一对相邻陆地只有 1 条共享边，</text>
  <text x="360" y="174" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">但左边格子数了它 1 次、</text>
  <text x="360" y="198" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">右边格子又数了它 1 次 ——</text>
  <text x="360" y="222" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">累计被数 2 次，实际贡献却是 0。</text>
  <text x="360" y="250" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所以每一对相邻都要扣掉 2。</text>
  <text x="470" y="324" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">实现上只检查「下方」与「右方」，保证每对相邻只统计一次</text>
</svg>
