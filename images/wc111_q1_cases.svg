<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">四类输入对照：什么才算山脉</text>
  <rect x="24" y="58" width="150" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="86" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">[0,3,2,1]</text>
  <rect x="186" y="58" width="190" height="44" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="86" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">上 3 步 → 下 3 步</text>
  <rect x="388" y="58" width="148" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="86" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <rect x="24" y="116" width="150" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="144" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">[3,5,5]</text>
  <rect x="186" y="116" width="190" height="44" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5 与 5 相等，非严格</text>
  <rect x="388" y="116" width="148" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="24" y="174" width="150" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="202" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">[0,1,2,3]</text>
  <rect x="186" y="174" width="190" height="44" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="202" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">一直上升，没有山顶</text>
  <rect x="388" y="174" width="148" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="202" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="24" y="232" width="150" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="260" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">[3,2,1]</text>
  <rect x="186" y="232" width="190" height="44" rx="6" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="260" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">没有上坡段（i = 0）</text>
  <rect x="388" y="232" width="148" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="280" y="306" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">n < 3 直接 false：山脉至少要一个端点、一个山顶、一个下降点</text>
</svg>
