<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">隔项异或的「望远镜」：偶数下标异或 = perm[0..n−2] 的异或（n 为奇数）</text>

  <!-- encoded 数组 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="60" y="50" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="86" y="70">e[0]</text>
    <text x="86" y="86" font-size="11" fill="#8a6d3b">p0⊕p1</text>
    <rect x="118" y="50" width="52" height="38" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4"/>
    <text x="144" y="70">e[1]</text>
    <text x="144" y="86" font-size="11" fill="#999">p1⊕p2</text>
    <rect x="176" y="50" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="202" y="70">e[2]</text>
    <text x="202" y="86" font-size="11" fill="#8a6d3b">p2⊕p3</text>
    <rect x="234" y="50" width="52" height="38" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4"/>
    <text x="260" y="70">e[3]</text>
    <text x="260" y="86" font-size="11" fill="#999">p3⊕p4</text>
    <rect x="292" y="50" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="318" y="70">…</text>
    <text x="318" y="86" font-size="11" fill="#8a6d3b">p(n−4)⊕p(n−3)</text>
    <rect x="408" y="50" width="52" height="38" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.4"/>
    <text x="434" y="70">e[n−2]</text>
    <text x="434" y="86" font-size="11" fill="#999">p(n−2)⊕p(n−1)</text>
  </g>
  <text x="86" y="112" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">偶数下标</text>
  <text x="434" y="112" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">奇数下标不参与</text>

  <!-- 望远镜抵消 -->
  <text x="40" y="150" font-size="14" fill="#333" filter="url(#rough2)">e[0] ⊕ e[2] ⊕ … ⊕ e[n−3] = (p0⊕p1) ⊕ (p2⊕p3) ⊕ … ⊕ (p(n−3)⊕p(n−2))</text>
  <text x="260" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">= p0 ⊕ p1 ⊕ … ⊕ p(n−2)   ← 恰好少一个 p(n−1)！</text>

  <rect x="90" y="196" width="340" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">perm[n−1] = total ⊕ evenXor</text>
  <text x="260" y="240" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">total = 1 ⊕ 2 ⊕ … ⊕ n（perm 是 1..n 的排列，全体异或已知）</text>

  <!-- 为什么必须奇数 -->
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <rect x="30" y="278" width="220" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="140" y="300" fill="#4a7a3a">n 奇数（如 n = 5）</text>
    <text x="140" y="322" fill="#555">e[0]⊕e[2] = p0⊕p1⊕p2⊕p3</text>
    <text x="140" y="344" fill="#4a7a3a">p4 落单 → 可解出 ✓</text>
    <text x="140" y="364" fill="#777" font-size="11.5">长度 n−1 = 4，偶数下标 0,2</text>

    <rect x="270" y="278" width="220" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="380" y="300" fill="#b85450">n 偶数（假设 n = 4）</text>
    <text x="380" y="322" fill="#555">e[0]⊕e[2] = p0⊕p1⊕p2⊕p3</text>
    <text x="380" y="344" fill="#b85450">= 全体，谁也分不出来 ✗</text>
    <text x="380" y="364" fill="#777" font-size="11.5">所以题目限定 n 为奇数</text>
  </g>
</svg>
