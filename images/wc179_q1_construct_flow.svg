<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一次奇偶判断，两个分支各一步构造</text>

  <!-- 开始框 -->
  <rect x="205" y="46" width="150" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">输入 n（1 ≤ n ≤ 500）</text>
  <path d="M280,80 L280,98" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,102 358,142 280,182 202,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n 是奇数？</text>

  <!-- 左分支：是 -->
  <text x="192" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M202,142 L182,142" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="114" width="154" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">返回 'a' × n</text>
  <text x="105" y="157" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">count('a') = n（奇）✓</text>

  <!-- 右分支：否 -->
  <text x="368" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M358,142 L378,142" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="378" y="114" width="154" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">返回 'a'×(n−1) + 'b'</text>
  <text x="455" y="157" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">a: n−1（奇）✓ b: 1（奇）✓</text>

  <!-- 汇聚箭头 -->
  <path d="M105,170 C 105,220 145,245 195,258" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M455,170 C 455,220 415,245 365,258" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果框 -->
  <rect x="180" y="242" width="200" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">长度恰为 n 的合法串</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">频次全为奇数 ✓</text>

  <!-- 底部要点框 -->
  <rect x="60" y="322" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">一次 if-else + 一次 O(n) 构造 —— 无枚举、无搜索</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">时间 O(n) 已是输出规模下界，额外空间 O(1)</text>
</svg>
