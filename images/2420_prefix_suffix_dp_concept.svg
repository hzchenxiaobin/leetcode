<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：好下标 i ⟺ inc[i−1] ≥ k 且 dec[i+1] ≥ k</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="42" y="74" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 好下标 i = 3（示例 1，k = 2）</text>

  <g filter="url(#sk)"><rect x="56" y="86" width="46" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="79" y="109" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="102" y="86" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="125" y="109" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="148" y="86" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="171" y="109" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="194" y="86" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="217" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="240" y="86" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="263" y="109" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="286" y="86" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="309" y="109" text-anchor="middle" font-size="13" fill="#2e5c24" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="332" y="86" width="46" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="355" y="109" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>

  <text x="79" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="125" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="171" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="217" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#sk)">3</text>
  <text x="263" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="309" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>
  <text x="355" y="134" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">6</text>
  <text x="217" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">i = 3</text>

  <g filter="url(#sk)"><path d="M 102 158 Q 148 170 194 158" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <text x="148" y="186" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">前 k = 2 格非递增</text>
  <g filter="url(#sk)"><path d="M 240 158 Q 286 170 332 158" stroke="#4a7a3a" stroke-width="1.6" fill="none"/></g>
  <text x="286" y="186" text-anchor="middle" font-size="11.5" fill="#2e5c24" filter="url(#sk)">后 k = 2 格非递减</text>

  <g filter="url(#sk)"><rect x="56" y="204" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="131" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">inc[2] = 3 ≥ k ✓</text>
  <g filter="url(#sk)"><rect x="216" y="204" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="291" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">dec[4] = 2 ≥ k ✓</text>
  <text x="384" y="225" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">好下标 ✓</text>

  <text x="42" y="266" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">② 反例 i = 4：后 k 格拖后腿</text>

  <g filter="url(#sk)"><rect x="56" y="278" width="46" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="79" y="301" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="102" y="278" width="46" height="36" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/></g>
  <text x="125" y="301" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="148" y="278" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="171" y="301" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="194" y="278" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="217" y="301" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="240" y="278" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="263" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="286" y="278" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="309" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="332" y="278" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="355" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">1</text>

  <text x="79" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="125" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="171" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="217" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="263" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
  <text x="309" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>
  <text x="355" y="326" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">6</text>
  <text x="263" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">i = 4</text>

  <g filter="url(#sk)"><path d="M 148 350 Q 194 362 240 350" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <text x="194" y="378" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">前 k 格非递增 ✓</text>
  <g filter="url(#sk)"><path d="M 286 350 Q 332 362 378 350" stroke="#b85450" stroke-width="1.6" fill="none"/></g>
  <text x="332" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">后 k 格：4 ≤ 1 ✗</text>

  <g filter="url(#sk)"><rect x="56" y="396" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="131" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">inc[3] = 4 ≥ k ✓</text>
  <g filter="url(#sk)"><rect x="216" y="396" width="150" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="291" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">dec[5] = 1 &lt; k ✗</text>
  <text x="384" y="417" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">淘汰 ✗</text>

  <g filter="url(#sk)"><rect x="460" y="70" width="200" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="560" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#sk)">inc[i]：以 i 结尾的</text>
  <text x="560" y="116" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">非递增段长（正向一趟）</text>
  <g filter="url(#sk)"><rect x="460" y="142" width="200" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="560" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">dec[i]：以 i 开头的</text>
  <text x="560" y="188" text-anchor="middle" font-size="11.5" fill="#2e5c24" filter="url(#sk)">非递减段长（反向一趟）</text>

  <g filter="url(#sk)"><path d="M 560 206 L 560 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="460" y="230" width="200" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="560" y="253" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">预处理一遍，每个候选</text>
  <text x="560" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">O(1) 查表</text>

  <g filter="url(#sk)"><path d="M 560 288 L 560 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="460" y="312" width="200" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="560" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">O(n·k) → 三趟 O(n)</text>
  <text x="560" y="362" text-anchor="middle" font-size="11" fill="#a03a3a" filter="url(#sk)">最坏 5×10⁹ → 3×10⁵ 步</text>

  <g filter="url(#sk)"><rect x="460" y="394" width="200" height="88" rx="10" fill="#f5f0fa" stroke="#8468a8" stroke-width="1.4"/></g>
  <text x="560" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#5d4780" filter="url(#sk)">赛场信号</text>
  <text x="560" y="439" text-anchor="middle" font-size="10.5" fill="#4a4a4a" filter="url(#sk)">每个位置左右各判一段单调</text>
  <text x="560" y="457" text-anchor="middle" font-size="10.5" fill="#4a4a4a" filter="url(#sk)">相邻候选窗口重叠 k−1 格</text>
  <text x="560" y="475" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5d4780" filter="url(#sk)">⟹ 双趟预处理 DP</text>
</svg>
