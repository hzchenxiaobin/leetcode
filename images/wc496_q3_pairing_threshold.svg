<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">m = n−2 为偶数时的结构：配对后「每对恰选一个」，选择序列非降</text>
  <text x="330" y="46" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">以 m = 8（t = 4 对）为例，阈值 θ = 2：前 2 对选左（奇数位），后 2 对选右（偶数位）→ 选 {1,3,6,8}</text>

  <!-- 配对框 -->
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5,3">
    <rect x="84" y="62" width="112" height="50" rx="10" filter="url(#rough2)"/>
    <rect x="196" y="62" width="112" height="50" rx="10" filter="url(#rough2)"/>
    <rect x="308" y="62" width="112" height="50" rx="10" filter="url(#rough2)"/>
    <rect x="420" y="62" width="112" height="50" rx="10" filter="url(#rough2)"/>
  </g>

  <!-- 候选位置格子（θ=2 选 1,3,6,8） -->
  <rect x="90" y="70" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="146" y="70" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="202" y="70" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="258" y="70" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="314" y="70" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="370" y="70" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="426" y="70" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="482" y="70" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="112" y="92" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="168" y="92" fill="#888">2</text>
    <text x="224" y="92" font-weight="bold" fill="#4a7a3a">3</text>
    <text x="280" y="92" fill="#888">4</text>
    <text x="336" y="92" fill="#888">5</text>
    <text x="392" y="92" font-weight="bold" fill="#4a7a3a">6</text>
    <text x="448" y="92" fill="#888">7</text>
    <text x="504" y="92" font-weight="bold" fill="#4a7a3a">8</text>
  </g>

  <g font-size="10.5" fill="#8a7a50" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="132">第1对</text><text x="252" y="132">第2对</text>
    <text x="364" y="132">第3对</text><text x="476" y="132">第4对</text>
  </g>

  <!-- 图例 -->
  <rect x="548" y="76" width="13" height="13" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="566" y="87" font-size="10" fill="#4a7a3a" filter="url(#rough2)">选为峰</text>
  <rect x="548" y="98" width="13" height="13" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="566" y="109" font-size="10" fill="#888" filter="url(#rough2)">不选</text>

  <!-- 禁止：2j 与 2j+1 相邻 -->
  <path d="M280,110 Q308,170 336,110" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="308" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="352" y="152" font-size="10.5" fill="#b85450" filter="url(#rough2)">选了右（2j）就不能选下一对的左（2j+1）</text>

  <!-- 公式框 -->
  <rect x="55" y="196" width="550" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">单个峰的代价：cost[k] = max(0, max(nums[k−1], nums[k+1]) + 1 − nums[k])</text>
  <text x="330" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">方案代价：cost(θ) = Σ cost[2j−1] (j ≤ θ) + Σ cost[2j] (j &gt; θ) = A[θ] + B[θ]</text>
  <text x="330" y="276" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">A 为奇数位前缀和、B 为偶数位后缀和 → 每个 θ O(1) 评估，答案 = min(A[θ]+B[θ])，θ = 0..t</text>

  <!-- m 奇数框 -->
  <rect x="55" y="316" width="550" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m 为奇数（m = 2t+1）时：大小 t+1 的独立集唯一 —— {1, 3, 5, …, m}</text>
  <text x="330" y="370" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">把 {1}, {2,3}, {4,5}, …, {m−1, m} 配成 t+1 组，每组恰选一个：</text>
  <text x="330" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1 必选 → 2 被禁 → 3 被迫 → 4 被禁 → 5 被迫 → … 全部锁死</text>
</svg>
