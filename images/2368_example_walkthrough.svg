<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n=7，edges=[[0,1],[1,2],[3,1],[4,0],[0,5],[5,6]]</text>
  <path d="M 130 40 Q 340 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">restricted = {4,5}，从节点 0 出发 BFS</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="60" y="80" width="45" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="105" y="80" width="70" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="175" y="80" width="280" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="455" y="80" width="90" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="545" y="80" width="75" height="40" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="82" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">步</text>
  <text x="140" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">出队 u</text>
  <text x="315" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">检查 u 的邻居</text>
  <text x="500" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">新入队</text>
  <text x="582" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">ans</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="120" width="45" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="105" y="120" width="70" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="175" y="120" width="280" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="455" y="120" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="545" y="120" width="75" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="82" y="145" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">1</text>
  <text x="140" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0</text>
  <text x="315" y="145" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1 <tspan fill="#2e6e2e" font-weight="bold">✓</tspan> / 4 <tspan fill="#b85450" font-weight="bold">✗受限</tspan> / 5 <tspan fill="#b85450" font-weight="bold">✗受限</tspan></text>
  <text x="500" y="145" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="582" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="160" width="45" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="105" y="160" width="70" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="175" y="160" width="280" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="455" y="160" width="90" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="545" y="160" width="75" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="82" y="185" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">2</text>
  <text x="140" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="315" y="185" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">0（已访）/ 2 <tspan fill="#2e6e2e" font-weight="bold">✓</tspan> / 3 <tspan fill="#2e6e2e" font-weight="bold">✓</tspan></text>
  <text x="500" y="185" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">2, 3</text>
  <text x="582" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="200" width="45" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="105" y="200" width="70" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="175" y="200" width="280" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="455" y="200" width="90" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="545" y="200" width="75" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="82" y="225" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">3</text>
  <text x="140" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="315" y="225" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1（已访）</text>
  <text x="500" y="225" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">—</text>
  <text x="582" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="60" y="240" width="45" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="105" y="240" width="70" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="175" y="240" width="280" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="455" y="240" width="90" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
    <rect x="545" y="240" width="75" height="40" fill="#f5f5f0" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="82" y="265" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">4</text>
  <text x="140" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="315" y="265" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1（已访）</text>
  <text x="500" y="265" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">—</text>
  <text x="582" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>

  <!-- row 5: queue empty -->
  <g filter="url(#sk)">
    <rect x="60" y="280" width="45" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="105" y="280" width="70" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="175" y="280" width="280" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="455" y="280" width="90" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="545" y="280" width="75" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="82" y="305" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">—</text>
  <text x="140" y="305" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">队空</text>
  <text x="315" y="305" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">BFS 结束</text>
  <text x="500" y="305" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">—</text>
  <text x="582" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4 ✓</text>

  <!-- annotations -->
  <text x="340" y="356" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">✗ = 受限跳过（不入队、不计数）✓ = 入队。受限点 5 一旦跳过，身后的 6 自动失联。</text>
  <g filter="url(#sk)">
    <rect x="110" y="378" width="460" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#sk)">每个节点恰好入队、出队各一次 → ans 不重不漏，O(n) 收尾</text>
</svg>
