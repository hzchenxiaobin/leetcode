<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：只看奇偶，有效子序列只有三种形态</text>
  <path d="M 230 44 Q 470 52 710 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== strip 1: parity compression ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a8edb">第一步：奇偶压缩 —— (a+b) mod 2 只看奇偶，每个数只剩 1 比特</text>
  <text x="86" y="108" text-anchor="end" font-size="12" fill="#888">数值</text>
  <g font-size="13" fill="#444" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="96" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="119" y="107">3</text>
    <g filter="url(#sk2)"><rect x="150" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="173" y="107">8</text>
    <g filter="url(#sk2)"><rect x="204" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="227" y="107">5</text>
    <g filter="url(#sk2)"><rect x="258" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="281" y="107">2</text>
    <g filter="url(#sk2)"><rect x="312" y="86" width="46" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="335" y="107">6</text>
  </g>
  <g filter="url(#sk)"><path d="M 378 102 L 448 102" stroke="#8a8578" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="413" y="94" text-anchor="middle" font-size="11" fill="#8a8578">x &amp; 1</text>
  <text x="568" y="108" text-anchor="end" font-size="12" fill="#888">奇偶</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="578" y="86" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="601" y="107" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="632" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="655" y="107" fill="#2b4a6e">0</text>
    <g filter="url(#sk2)"><rect x="686" y="86" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="709" y="107" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="740" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="763" y="107" fill="#2b4a6e">0</text>
    <g filter="url(#sk2)"><rect x="794" y="86" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="817" y="107" fill="#2b4a6e">0</text>
  </g>
  <text x="470" y="146" text-anchor="middle" font-size="11" fill="#999">值域 10⁷ 是烟雾弹：数值大小完全无关，条件只读奇偶这一比特</text>

  <!-- ===== panel left: k=0 ===== -->
  <text x="262" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">k = 0：相邻和全为偶数</text>
  <text x="262" y="200" text-anchor="middle" font-size="12" fill="#444">相邻同奇偶 → 沿子序列传导 → 全体同奇偶</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><circle cx="118" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="118" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="172" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="172" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="226" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="226" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="280" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="280" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="334" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="334" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="388" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="388" y="246" fill="#2d5a26">奇</text>
  </g>
  <text x="262" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">候选①：全奇 = 奇数个数</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><circle cx="146" cy="322" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="146" y="326" fill="#2b4a6e">偶</text>
    <g filter="url(#sk2)"><circle cx="200" cy="322" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="200" y="326" fill="#2b4a6e">偶</text>
    <g filter="url(#sk2)"><circle cx="254" cy="322" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="254" y="326" fill="#2b4a6e">偶</text>
    <g filter="url(#sk2)"><circle cx="308" cy="322" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="308" y="326" fill="#2b4a6e">偶</text>
  </g>
  <text x="262" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">候选②：全偶 = 偶数个数</text>
  <text x="262" y="388" text-anchor="middle" font-size="11" fill="#999">奇+奇 = 偶，偶+偶 = 偶，怎么排都合法</text>

  <!-- divider -->
  <path d="M 470 168 L 470 408" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#sk)"/>

  <!-- ===== panel right: k=1 ===== -->
  <text x="712" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">k = 1：相邻和全为奇数</text>
  <text x="712" y="200" text-anchor="middle" font-size="12" fill="#444">相邻异奇偶 → 奇偶交替（奇/偶开头都归它）</text>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><circle cx="560" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="560" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="614" cy="242" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="614" y="246" fill="#2b4a6e">偶</text>
    <g filter="url(#sk2)"><circle cx="668" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="668" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="722" cy="242" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="722" y="246" fill="#2b4a6e">偶</text>
    <g filter="url(#sk2)"><circle cx="776" cy="242" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="776" y="246" fill="#2d5a26">奇</text>
    <g filter="url(#sk2)"><circle cx="830" cy="242" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="830" y="246" fill="#2b4a6e">偶</text>
  </g>
  <text x="712" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">候选③：最长交替 = 极大同奇偶段数 R</text>
  <g filter="url(#sk)">
    <rect x="510" y="304" width="404" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="532" y="330" font-size="13" font-weight="bold" fill="#2d5a26">双向夹逼：为什么「最长交替 = 段数」？</text>
  <text x="532" y="354" font-size="12" fill="#444">每段取一个 → 相邻段奇偶互异，保序交替，长度 = R ✓</text>
  <text x="532" y="378" font-size="12" fill="#444">同段取两个 → 中间元素全同奇偶，交替性必坏 ✗ → 每段至多一个</text>

  <!-- ===== bottom: three-way max ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="440" width="800" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="468" font-size="13" font-weight="bold" fill="#7a5415">第二步：三个候选三选一，一趟计数全部拿到</text>
  <text x="92" y="492" font-size="12" fill="#444">ans = max( 全奇个数 odd , 全偶个数 even , 段数 R ) ，每个候选都是一个真实存在的有效子序列</text>
  <text x="92" y="516" font-size="11" fill="#b03a3a" font-weight="bold">三个都漏不得：[1,3] 靠全奇撑住答案 2，[1,2] 靠交替撑住答案 2，[1,2,3,4] 靠段数拿到 4</text>
</svg>
