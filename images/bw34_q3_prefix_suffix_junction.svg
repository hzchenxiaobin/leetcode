<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    剩余 = 有序前缀 + 有序后缝，只看一条接缝
  </text>

  <!-- 数组：1 2 3 | 10 4 2 | 3 5 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="16">
    <rect x="30"  y="70" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="76"  y="70" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="122" y="70" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="168" y="70" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="4"/>
    <rect x="214" y="70" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="4"/>
    <rect x="260" y="70" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="4"/>
    <rect x="306" y="70" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="352" y="70" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="53"  y="99" fill="#446688">1</text>
    <text x="99"  y="99" fill="#446688">2</text>
    <text x="145" y="99" fill="#446688">3</text>
    <text x="191" y="99" fill="#b85450">10</text>
    <text x="237" y="99" fill="#b85450">4</text>
    <text x="283" y="99" fill="#b85450">2</text>
    <text x="329" y="99" fill="#2f5a24">3</text>
    <text x="375" y="99" fill="#2f5a24">5</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5">
    <text x="99" y="132" fill="#446688">前缀 arr[0..l−1]（l ≤ left+1）</text>
    <text x="237" y="132" fill="#b85450">删除段 arr[l..r−1]</text>
    <text x="352" y="132" fill="#2f5a24">后缀 arr[r..n−1]（r ≥ right）</text>
  </g>

  <!-- 接缝条件 -->
  <path d="M 148 156 C 180 176, 300 176, 324 156" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="166" font-size="12" fill="#446688" filter="url(#rough2)">接缝条件</text>
  <rect x="150" y="184" width="230" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="265" y="207" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">arr[l−1] ≤ arr[r]（3 ≤ 3 ✓）</text>

  <!-- 左右端点 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="12.5">
    <rect x="60" y="240" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="150" y="257" fill="#446688">left = 3（最长有序前缀终点）</text>
    <text x="150" y="273" font-size="11" fill="#446688">arr[0..3] = 1,2,3,10</text>
    <rect x="280" y="240" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="370" y="257" fill="#2f5a24">right = 5（最长有序后缀起点）</text>
    <text x="370" y="273" font-size="11" fill="#2f5a24">arr[5..7] = 2,3,5</text>
  </g>

  <rect x="120" y="302" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">
    本例最优：l=3, r=6 → 删 [10,4,2]，长度 3
  </text>
</svg>
