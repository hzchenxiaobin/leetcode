<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [4,8,12,16]，p = 2，n = 4</text>
  <path d="M 270 42 Q 470 52 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: initial ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="66" width="120" height="110" rx="10" fill="#f0ede4" stroke="#bbb" stroke-width="1.3"/>
  </g>
  <text x="100" y="106" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">初始</text>
  <text x="100" y="130" text-anchor="middle" font-size="10" fill="#999">（无需判定）</text>

  <g font-size="13">
    <text x="196" y="100" font-size="10" fill="#888" font-weight="bold">nums</text>
    <g filter="url(#sk)"><rect x="180" y="106" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="202" y="125" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="228" y="106" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="250" y="125" text-anchor="middle" fill="#2e6e2e" font-weight="bold">8</text>
    <g filter="url(#sk)"><rect x="276" y="106" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="298" y="125" text-anchor="middle" fill="#2e6e2e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="324" y="106" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="346" y="125" text-anchor="middle" fill="#2e6e2e" font-weight="bold">16</text>

    <text x="196" y="156" font-size="10" fill="#888" font-weight="bold">b = nums/2</text>
    <g filter="url(#sk)"><rect x="180" y="162" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="202" y="181" text-anchor="middle" fill="#5a3a7a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="228" y="162" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="250" y="181" text-anchor="middle" fill="#5a3a7a" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="276" y="162" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="298" y="181" text-anchor="middle" fill="#5a3a7a" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="324" y="162" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="346" y="181" text-anchor="middle" fill="#5a3a7a" font-weight="bold">8</text>
  </g>

  <!-- root badge row1 -->
  <g filter="url(#sk)">
    <rect x="420" y="106" width="200" height="56" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="520" y="130" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">根节点 gcd(b_S)</text>
  <text x="520" y="152" text-anchor="middle" font-size="14" fill="#2b6e9e" font-family="monospace" font-weight="bold">= gcd(2,4,6,8) = 2</text>

  <!-- ===== Row 2: query [0,3] ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="206" width="120" height="110" rx="10" fill="#f7ecec" stroke="#b03a3a" stroke-width="1.4"/>
  </g>
  <text x="100" y="240" text-anchor="middle" font-size="12" fill="#7a4040" font-weight="bold">查询 [0, 3]</text>
  <text x="100" y="260" text-anchor="middle" font-size="10" fill="#999">nums[0] ← 3</text>

  <g font-size="13">
    <text x="196" y="240" font-size="10" fill="#888" font-weight="bold">nums</text>
    <g filter="url(#sk)"><rect x="180" y="246" width="44" height="28" fill="#f7ecec" stroke="#b03a3a" stroke-width="1.6"/></g>
    <text x="202" y="265" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="228" y="246" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="250" y="265" text-anchor="middle" fill="#2e6e2e" font-weight="bold">8</text>
    <g filter="url(#sk)"><rect x="276" y="246" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="298" y="265" text-anchor="middle" fill="#2e6e2e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="324" y="246" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="346" y="265" text-anchor="middle" fill="#2e6e2e" font-weight="bold">16</text>

    <text x="196" y="296" font-size="10" fill="#888" font-weight="bold">b = nums/2</text>
    <g filter="url(#sk)"><rect x="180" y="302" width="44" height="28" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/></g>
    <text x="202" y="321" text-anchor="middle" fill="#999" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="228" y="302" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="250" y="321" text-anchor="middle" fill="#5a3a7a" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="276" y="302" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="298" y="321" text-anchor="middle" fill="#5a3a7a" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="324" y="302" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="346" y="321" text-anchor="middle" fill="#5a3a7a" font-weight="bold">8</text>
  </g>

  <g filter="url(#sk)">
    <rect x="420" y="246" width="200" height="56" rx="10" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="520" y="270" text-anchor="middle" font-size="12" fill="#7a4040" font-weight="bold">根节点 gcd(b_S)</text>
  <text x="520" y="292" text-anchor="middle" font-size="14" fill="#b03a3a" font-family="monospace" font-weight="bold">= gcd(4,6,8) = 2 ≠ 1</text>

  <!-- No stamp -->
  <g filter="url(#sk)">
    <rect x="680" y="236" width="220" height="76" rx="12" fill="#fdeaea" stroke="#b03a3a" stroke-width="2.4"/>
  </g>
  <text x="790" y="272" text-anchor="middle" font-size="22" fill="#b03a3a" font-weight="bold">✗ No</text>
  <text x="790" y="296" text-anchor="middle" font-size="10" fill="#7a4040">候选 {8,12,16} 的 gcd = 4 ≠ 2</text>

  <!-- ===== Row 3: query [2,6] ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="346" width="120" height="110" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="100" y="380" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">查询 [2, 6]</text>
  <text x="100" y="400" text-anchor="middle" font-size="10" fill="#999">nums[2] ← 6</text>

  <g font-size="13">
    <text x="196" y="380" font-size="10" fill="#888" font-weight="bold">nums</text>
    <g filter="url(#sk)"><rect x="180" y="386" width="44" height="28" fill="#f7ecec" stroke="#b03a3a" stroke-width="1.4"/></g>
    <text x="202" y="405" text-anchor="middle" fill="#b03a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="228" y="386" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="250" y="405" text-anchor="middle" fill="#2e6e2e" font-weight="bold">8</text>
    <g filter="url(#sk)"><rect x="276" y="386" width="44" height="28" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="298" y="405" text-anchor="middle" fill="#8a6a3a" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="324" y="386" width="44" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
    <text x="346" y="405" text-anchor="middle" fill="#2e6e2e" font-weight="bold">16</text>

    <text x="196" y="436" font-size="10" fill="#888" font-weight="bold">b = nums/2</text>
    <g filter="url(#sk)"><rect x="180" y="442" width="44" height="28" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/></g>
    <text x="202" y="461" text-anchor="middle" fill="#999" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="228" y="442" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="250" y="461" text-anchor="middle" fill="#5a3a7a" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="276" y="442" width="44" height="28" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/></g>
    <text x="298" y="461" text-anchor="middle" fill="#8a6a3a" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="324" y="442" width="44" height="28" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.4"/></g>
    <text x="346" y="461" text-anchor="middle" fill="#5a3a7a" font-weight="bold">8</text>
  </g>

  <g filter="url(#sk)">
    <rect x="420" y="386" width="200" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="520" y="410" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">根节点 gcd(b_S)</text>
  <text x="520" y="432" text-anchor="middle" font-size="14" fill="#2e6e2e" font-family="monospace" font-weight="bold">= gcd(4,3,8) = 1 ✓</text>

  <!-- Yes stamp -->
  <g filter="url(#sk)">
    <rect x="680" y="376" width="220" height="76" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="790" y="412" text-anchor="middle" font-size="22" fill="#2e6e2e" font-weight="bold">✓ Yes</text>
  <text x="790" y="436" text-anchor="middle" font-size="10" fill="#557a55">|S| = 3 &lt; n = 4，T = {8,6,16}，gcd = 2 = p</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="500" width="840" height="76" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="526" font-size="12" font-weight="bold" fill="#2b2b2b">要点回顾</text>
  <text x="80" y="548" font-size="11" fill="#444">① 0 是 gcd 的幺元：非 p 倍数元素放 0，gcd(x, 0) = x，不干扰整体判定；② n = 4 ≤ 16 且此处 |S| = 3 &lt; n，</text>
  <text x="80" y="566" font-size="11" fill="#444">g = 1 即判「是」；只有当 |S| = n（全员都是 p 的倍数）时才需要删一判定，而 n ≥ 17 时它恒通过。</text>
</svg>
