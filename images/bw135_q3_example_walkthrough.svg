<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,0,1,2,4,3]，k = 4</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="34" y="44" width="158" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="113" y="64" fill="#446688">配对 (1, 3)</text>
    <text x="113" y="84" fill="#666">d = 2，T = 3</text>
    <text x="113" y="104" fill="#666">0 次改动：X = 2</text>

    <rect x="206" y="44" width="158" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="285" y="64" fill="#446688">配对 (0, 4)</text>
    <text x="285" y="84" fill="#666">d = 4，T = 4</text>
    <text x="285" y="104" fill="#666">0 次改动：X = 4</text>

    <rect x="378" y="44" width="168" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="462" y="64" fill="#446688">配对 (1, 2)</text>
    <text x="462" y="84" fill="#666">d = 1，T = 3</text>
    <text x="462" y="104" fill="#666">0 次改动：X = 1</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="34" y="134" width="512" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="80" y="154" fill="#2d5a22">X</text>
    <text x="200" y="154" fill="#2d5a22">one[X]（T ≥ X）</text>
    <text x="350" y="154" fill="#2d5a22">zero[X]</text>
    <text x="470" y="154" fill="#2d5a22">cost = 6 − one − zero</text>

    <rect x="34" y="166" width="512" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="80" y="183">0</text><text x="200" y="183">3</text><text x="350" y="183">0</text><text x="470" y="183">3</text>

    <rect x="34" y="192" width="512" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="80" y="209">1</text><text x="200" y="209">3</text><text x="350" y="209">1</text>
    <text x="470" y="209" fill="#4a7a3a" font-weight="bold">2</text>

    <rect x="34" y="218" width="512" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="80" y="235">2</text><text x="200" y="235">3</text><text x="350" y="235">1</text>
    <text x="470" y="235" fill="#2d5a22" font-weight="bold">2</text>

    <rect x="34" y="244" width="512" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="80" y="261">3</text><text x="200" y="261">3</text><text x="350" y="261">0</text><text x="470" y="261">3</text>

    <rect x="34" y="270" width="512" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="80" y="287">4</text><text x="200" y="287">1</text><text x="350" y="287">1</text><text x="470" y="287">4</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="34" y="310" width="512" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="50" y="334" fill="#a06c10">one[X] 随 X 单调不增（后缀和），zero[X] 只在 X = 1、2、4 处非零</text>
    <text x="50" y="358" fill="#a06c10">最小代价 2，对应 X = 1 或 X = 2：只改 nums[1] 与 nums[3] 两格</text>
  </g>
</svg>
