<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">新边补出一个环：删环上边仍连通，删环外边丢一棵子树</text>
  <path d="M 148 40 Q 400 47 652 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 红圈：被孤立的子树 {4,7} -->
  <ellipse cx="165" cy="300" rx="58" ry="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"
           stroke-dasharray="6 4" filter="url(#rough3)"/>

  <!-- 环外的两条灰边 -->
  <line x1="255" y1="175" x2="165" y2="258" stroke="#7a7a7a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="165" y1="258" x2="165" y2="342" stroke="#7a7a7a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 环上的四条蓝边 -->
  <line x1="320" y1="258" x2="255" y2="175" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="255" y1="175" x2="390" y2="92" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="390" y1="92" x2="525" y2="175" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="525" y1="175" x2="525" y2="258" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>

  <!-- 新修的路 (5,6) -->
  <path d="M 320 258 C 380 322 465 322 525 258" stroke="#d6a040" stroke-width="2.6" fill="none"
        stroke-dasharray="8 5" filter="url(#rough2)"/>

  <!-- 封闭标记：环外的 (2,4) -->
  <line x1="199" y1="206" x2="221" y2="228" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="221" y1="206" x2="199" y2="228" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="390" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="390" y="66" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">首都</text>

  <circle cx="255" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <circle cx="525" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="525" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>

  <circle cx="165" cy="258" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>

  <circle cx="320" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>

  <circle cx="525" cy="258" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="525" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>

  <circle cx="165" cy="342" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <!-- 注释 -->
  <path d="M 186 196 L 206 213" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="60" y="180" font-size="11.5" fill="#b85450" filter="url(#rough2)">封闭环外的 (2,4)</text>
  <text x="60" y="198" font-size="11" fill="#8a5a58" filter="url(#rough2)">⇒ 子树 {4,7} 失联</text>

  <text x="292" y="330" font-size="11.5" fill="#a14340" filter="url(#rough2)">整棵子树 {4,7} 断掉，n = 7 时只剩 5 个可达</text>
  <text x="196" y="300" font-size="11" fill="#a14340" filter="url(#rough2)">sz=2</text>

  <text x="548" y="304" font-size="11.5" fill="#8a6015" filter="url(#rough2)">新修的路 (5,6)</text>
  <text x="548" y="322" font-size="11" fill="#8a6015" filter="url(#rough2)">把 5–2–1–3–6 补成环</text>

  <text x="560" y="106" font-size="11.5" fill="#446688" filter="url(#rough2)">环上的边（蓝）</text>
  <text x="560" y="124" font-size="11" fill="#446688" filter="url(#rough2)">删任一条 → 仍全连通</text>

  <!-- 结论 -->
  <rect x="40" y="386" width="720" height="44" rx="9" fill="#f2f7fd" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400" y="406" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">最坏情况 = n − max{ sz[x] : x ≠ 1 且 x 的父边不在环上 }</text>
  <text x="400" y="423" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">sz[x] = 以 x 为根的子树点数；删掉父边后，root 在外侧，整棵子树全部不可达</text>
</svg>
