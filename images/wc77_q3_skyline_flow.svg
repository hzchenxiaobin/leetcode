<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：两趟扫描，O(n²) 时间 / O(n) 空间</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先把两套天际线冻结成数组，再逐格顶到上界</text>
  <rect x="120" y="78" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="310" y="105" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">1  读入 n × n 矩阵 grid</text>
  <path d="M 310 124 L 310 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="142" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="310" y="169" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">2  一趟扫描同时维护 R[r] 与 C[c]</text>
  <path d="M 310 188 L 310 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="206" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="310" y="233" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">3  冻结 R、C：之后不再改动 grid</text>
  <path d="M 310 252 L 310 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="270" width="380" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="310" y="297" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">4  逐格累加 min(R[r], C[c]) − grid[r][c]</text>
  <path d="M 310 316 L 310 332" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="334" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="9" filter="url(#rough2)"/>
  <text x="310" y="361" text-anchor="middle" font-size="12.5" fill="#8a3a3a" filter="url(#rough2)">5  返回 total（int 足够）</text>
  <text x="18" y="112" font-size="10" fill="#999" filter="url(#rough2)">n ≤ 50</text>
  <text x="510" y="112" font-size="10" fill="#888" filter="url(#rough2)">R[r] = max</text>
  <text x="510" y="126" font-size="10" fill="#888" filter="url(#rough2)">      行内</text>
  <text x="18" y="176" font-size="10" fill="#888" filter="url(#rough2)">同一趟里</text>
  <text x="18" y="190" font-size="10" fill="#888" filter="url(#rough2)">两者都能算</text>
  <text x="510" y="190" font-size="10" fill="#888" filter="url(#rough2)">C[c] = max</text>
  <text x="510" y="204" font-size="10" fill="#888" filter="url(#rough2)">      列内</text>
  <text x="18" y="240" font-size="10" fill="#b85450" filter="url(#rough2)">别边改边算</text>
  <text x="18" y="254" font-size="10" fill="#b85450" filter="url(#rough2)">天际线会漂移</text>
  <text x="510" y="306" font-size="10" fill="#888" filter="url(#rough2)">增量恒 ≥ 0</text>
  <text x="310" y="404" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">第 2 步的 R、C 必须来自原矩阵；第 4 步只读不写，因此两趟扫描即可收工</text>
</svg>
