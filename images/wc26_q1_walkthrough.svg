<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：只查「是否完全相同」与「谁更长」</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三组官方示例 + 一组自造的长度不等情形</text>

  <g filter="url(#rough2)">
    <rect x="30" y="62" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="70" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">示例</text>
    <text x="160" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">a</text>
    <text x="250" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">b</text>
    <text x="322" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">|a|</text>
    <text x="377" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">|b|</text>
    <text x="442" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">a == b</text>
    <text x="530" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">返回</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="30" y="94" width="560" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="70" y="115" fill="#555">1</text>
    <text x="160" y="115" fill="#333">"aba"</text>
    <text x="250" y="115" fill="#333">"cdc"</text>
    <text x="322" y="115" fill="#555">3</text>
    <text x="377" y="115" fill="#555">3</text>
    <text x="442" y="115" fill="#4a7a3a">否</text>
    <text x="530" y="115" fill="#4a7a3a" font-weight="bold">3</text>

    <rect x="30" y="130" width="560" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="70" y="151" fill="#555">2</text>
    <text x="160" y="151" fill="#333">"aaa"</text>
    <text x="250" y="151" fill="#333">"bbb"</text>
    <text x="322" y="151" fill="#555">3</text>
    <text x="377" y="151" fill="#555">3</text>
    <text x="442" y="151" fill="#4a7a3a">否</text>
    <text x="530" y="151" fill="#4a7a3a" font-weight="bold">3</text>

    <rect x="30" y="166" width="560" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="70" y="187" fill="#555">3</text>
    <text x="160" y="187" fill="#333">"aaa"</text>
    <text x="250" y="187" fill="#333">"aaa"</text>
    <text x="322" y="187" fill="#555">3</text>
    <text x="377" y="187" fill="#555">3</text>
    <text x="442" y="187" fill="#b85450" font-weight="bold">是</text>
    <text x="530" y="187" fill="#b85450" font-weight="bold">−1</text>

    <rect x="30" y="202" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="70" y="223" fill="#555">自造</text>
    <text x="160" y="223" fill="#333">"abc"</text>
    <text x="250" y="223" fill="#333">"ab"</text>
    <text x="322" y="223" fill="#555">3</text>
    <text x="377" y="223" fill="#555">2</text>
    <text x="442" y="223" fill="#4a7a3a">否</text>
    <text x="530" y="223" fill="#4a7a3a" font-weight="bold">3</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="40" y="256" width="540" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="56" y="276" fill="#8a6a20" font-weight="bold">逐行解读</text>
    <text x="56" y="295" fill="#555">示例 1：等长但内容不同 ⇒ 两者互不为对方子序列，答案 = 3 = max(3, 3)</text>
    <text x="56" y="312" fill="#555">示例 2：字符集合都不相交 ⇒ 同理返回 3</text>
    <text x="56" y="329" fill="#8a3a36">示例 3：逐字符完全相同 ⇒ 差集为空，返回 −1（唯一可能为 −1 的情形）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="346" width="540" height="34" fill="#f0f4ff" stroke="#446688" stroke-width="1.3" rx="8"/>
    <text x="56" y="368" font-size="10.5" fill="#3a4a66">自造例说明：|a| ≠ |b| 时也只看 max，"abc" 不是 "ab" 的子序列 ⇒ 答案 3</text>
  </g>
</svg>
