<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="920" height="720" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：交替 = 「升 / 降」两态轮转，前驱只看「方向 + 值」</text>
  <path d="M 300 42 Q 460 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 面板 A：锯齿走位 ===== -->
  <text x="60" y="78" font-size="14" font-weight="bold" fill="#444">① 交替的本质：每一步方向翻转，选中元素在「顶 / 底」之间摆动</text>

  <!-- 未选中的下标 2 -->
  <ellipse cx="360" cy="158" rx="13" ry="13" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="360" y="163" text-anchor="middle" font-size="13" fill="#9e9e9e" filter="url(#sk)">4</text>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="#9e9e9e" filter="url(#sk)">（未选中）</text>

  <!-- 选中元素 -->
  <ellipse cx="140" cy="190" rx="13" ry="13" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" filter="url(#sk)"/>
  <text x="140" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5416" filter="url(#sk)">3</text>
  <ellipse cx="250" cy="130" rx="13" ry="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4" filter="url(#sk)"/>
  <text x="250" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a92" filter="url(#sk)">5</text>
  <ellipse cx="470" cy="216" rx="13" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="470" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <ellipse cx="580" cy="158" rx="13" ry="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4" filter="url(#sk)"/>
  <text x="580" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a92" filter="url(#sk)">4</text>

  <!-- 选中段：升 / 降 / 升 -->
  <path d="M 156 182 Q 200 146 236 136" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="196" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">升 ↗</text>
  <path d="M 266 138 Q 362 196 454 210" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="336" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">降 ↘</text>
  <path d="M 486 208 Q 532 174 566 164" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="528" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">升 ↗</text>

  <!-- 状态标注 -->
  <text x="250" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">U 态 · 顶</text>
  <text x="470" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">D 态 · 底</text>
  <text x="580" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">U 态 · 顶</text>
  <text x="60" y="238" font-size="12" font-weight="bold" fill="#c98a2b" filter="url(#sk)">起点 · 单元素</text>
  <text x="60" y="256" font-size="11" fill="#8a6a2b" filter="url(#sk)">（两态兼容）</text>

  <!-- 下标轴 -->
  <path d="M 120 282 Q 360 287 610 282" stroke="#777" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="140" y="300">0</text>
    <text x="250" y="300">1</text>
    <text x="360" y="300">2</text>
    <text x="470" y="300">3</text>
    <text x="580" y="300">4</text>
  </g>
  <path d="M 250 314 Q 360 326 470 314" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">相邻选中下标距离 j − i ≥ k（约束只作用在相邻对！）</text>

  <!-- ===== 面板 B：状态机 ===== -->
  <text x="60" y="380" font-size="14" font-weight="bold" fill="#444">② 状态转移：能否接上 j，只看「i 的末步方向 × 值的大小」</text>

  <g filter="url(#sk)">
    <rect x="150" y="404" width="240" height="64" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="270" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a92" filter="url(#sk)">U[i]：末步「升」或单元素</text>
  <text x="270" y="452" text-anchor="middle" font-size="12" fill="#4a6a8a" filter="url(#sk)">i 在顶 → 下一个必须更小</text>

  <g filter="url(#sk)">
    <rect x="530" y="404" width="240" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="650" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">D[i]：末步「降」或单元素</text>
  <text x="650" y="452" text-anchor="middle" font-size="12" fill="#4a6a4a" filter="url(#sk)">i 在底 → 下一个必须更大</text>

  <path d="M 395 414 Q 460 366 525 414" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="460" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a8edb" filter="url(#sk)">nums[j] &lt; nums[i]，且 j − i ≥ k</text>
  <path d="M 525 458 Q 460 506 395 458" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="460" y="522" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">nums[j] &gt; nums[i]，且 j − i ≥ k</text>
  <text x="460" y="444" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">方向每步翻转</text>
  <text x="460" y="545" text-anchor="middle" font-size="11.5" fill="#7a5416" filter="url(#sk)">单元素兼容双向：U[i] ≥ nums[i]，D[i] ≥ nums[i] —— 两棵转移的公共起点</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="572" width="820" height="126" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="600" font-size="13" fill="#444" filter="url(#sk)">💡 马尔可夫性：以 i 结尾的子序列能否接上 j，只取决于 i 的末步方向和 nums[i]、nums[j] 的大小——</text>
  <text x="70" y="622" font-size="12" fill="#555" filter="url(#sk)">与更早选了什么无关。所以每个下标只需维护两个数：U[i]（顶）与 D[i]（底）。</text>
  <text x="70" y="646" font-size="12" fill="#555" filter="url(#sk)">距离条件（管下标）与大小条件（管值）互相独立：一个交给「插入时机」，一个交给「值域线段树」。</text>
  <text x="70" y="670" font-size="12" fill="#555" filter="url(#sk)">转移于是变成两个「前缀 / 后缀最大值」查询 → 时间 O(n log V)，V = max(nums)。</text>
  <text x="70" y="690" font-size="11" fill="#7a7a7a" filter="url(#sk)">（图中数据即示例 2：nums = [3,5,4,2,4]，k = 1，选中下标 0,1,3,4）</text>
</svg>
