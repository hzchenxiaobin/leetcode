    <text x="152" y="74" fill="#b85450" font-weight="bold">5</text>
    <text x="188" y="74" fill="#333">20</text>
    <text x="224" y="74" fill="#b85450" font-weight="bold">3</text>
  </g>
  <g filter="url(#sk)">
