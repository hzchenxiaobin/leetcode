  </g>
  <text x="267" y="50" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">奇数 ×2</text>

  <g filter="url(#sk)">
    <rect x="292" y="56" width="32" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="328" y="56" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
