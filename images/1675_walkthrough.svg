    <rect x="500" y="240" width="124" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="87" y="259">4</text>
    <text x="206" y="259">5, 5, 4, 3, 2</text>
    <text x="322" y="259" fill="#b85450" font-weight="bold">5✦</text>
    <text x="375" y="259">2</text>
    <text x="425" y="259" fill="#b85450" font-weight="bold">3</text>
    <text x="475" y="259" fill="#b85450" font-weight="bold">3 ★</text>
