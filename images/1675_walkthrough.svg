  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [4,1,5,20,3]，答案 = 3</text>
  <path d="M 185 34 Q 320 42 455 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="64" y="56" width="32" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
