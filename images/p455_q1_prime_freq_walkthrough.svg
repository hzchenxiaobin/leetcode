<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：命中短路（true）vs 全军覆没（false）</text>

  <!-- ============ Panel A: 示例 3 → true ============ -->
  <g filter="url(#rough2)">
    <rect x="26" y="38" width="468" height="176" fill="#f3f9f3" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="46" y="60" font-size="11" fill="#2a5a2a" font-weight="bold">示例 3 · nums = [2,2,2,4,4]</text>

    <rect x="150" y="48" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="48" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="48" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="48" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="318" y="48" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="167" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="209" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="251" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="293" y="66" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">4</text>
    <text x="335" y="66" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">4</text>

    <path d="M 260 76 L 260 94" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="150" y="116" font-size="10" fill="#555" font-weight="bold">cnt[2] = 3</text>
    <text x="290" y="116" font-size="10" fill="#555" font-weight="bold">cnt[4] = 2</text>

    <rect x="120" y="128" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="185" y="143" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold">f = 3：试 d=2 不整除</text>
    <text x="185" y="156" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold">√3 内无因数 → 质数 ✓</text>

    <rect x="280" y="128" width="130" height="34" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="345" y="150" text-anchor="middle" font-size="9.5" fill="#999">f = 2：已短路，不再检查</text>

    <rect x="120" y="170" width="290" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <text x="265" y="191" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">第一个频次 3 就是质数 → return true</text>
  </g>

  <!-- ============ Panel B: 示例 2 → false ============ -->
  <g filter="url(#rough2)">
    <rect x="26" y="226" width="468" height="150" fill="#fdf3f4" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="46" y="248" font-size="11" fill="#8a3a36" font-weight="bold">示例 2 · nums = [1,2,3,4,5]</text>

    <rect x="170" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="296" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="338" y="236" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="187" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="229" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="271" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="313" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <text x="355" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

    <path d="M 260 264 L 260 282" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="120" y="288" width="290" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="265" y="308" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold">五个频次全是 1：1 &lt; 2，一票否决，连试除都不用进</text>

    <rect x="120" y="326" width="290" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="265" y="347" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">频次用尽仍无质数 → return false</text>
  </g>

  <!-- ============ 底部备注 ============ -->
  <g filter="url(#rough2)">
    <text x="260" y="402" text-anchor="middle" font-size="9.5" fill="#666">所有频次之和 = n（示例 3：3 + 2 = 5 = n）；判定的对象是「频次」而非元素值——别看见质数就想去判 nums[i]</text>
    <text x="260" y="418" text-anchor="middle" font-size="9.5" fill="#666">f = 0（未出现的桶）与 f = 1 一样被「f &lt; 2」自动排除，无需单独特判</text>
  </g>
</svg>
