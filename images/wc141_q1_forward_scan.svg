<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="336" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">正向扫描：先数清「哪些原元素还留得下」</text>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#888">每个 0 占 2 个位置、非 0 占 1 个；容量累加第一次 ≥ n 就必须停</text>

  <!-- 下标 -->
  <text x="72" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="134" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="196" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="258" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="320" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="382" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="444" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="506" y="88" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 格子：非 0 蓝、0 橙 -->
  <rect x="44" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="124" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="106" y="96" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="124" text-anchor="middle" font-size="16" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="168" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="124" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="230" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="124" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="292" y="96" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="16" fill="#8a6a20" filter="url(#rough2)">0</text>
  <rect x="354" y="96" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="382" y="124" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="416" y="96" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="444" y="124" text-anchor="middle" font-size="15" fill="#b08a88" filter="url(#rough2)">5</text>
  <rect x="478" y="96" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="506" y="124" text-anchor="middle" font-size="15" fill="#b08a88" filter="url(#rough2)">0</text>

  <!-- 每格权重 -->
  <text x="72" y="160" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">+1</text>
  <text x="134" y="160" text-anchor="middle" font-size="9.5" fill="#b8862b" filter="url(#rough2)">+2</text>
  <text x="196" y="160" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">+1</text>
  <text x="258" y="160" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">+1</text>
  <text x="320" y="160" text-anchor="middle" font-size="9.5" fill="#b8862b" filter="url(#rough2)">+2</text>
  <text x="382" y="160" text-anchor="middle" font-size="9.5" fill="#7a8aa0" filter="url(#rough2)">+1</text>
  <text x="444" y="160" text-anchor="middle" font-size="9.5" fill="#c9a0a0" filter="url(#rough2)">写不下</text>
  <text x="506" y="160" text-anchor="middle" font-size="9.5" fill="#c9a0a0" filter="url(#rough2)">写不下</text>

  <!-- 容量累计 -->
  <text x="72" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="134" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="196" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <text x="258" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="320" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7</text>
  <text x="382" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>

  <!-- 截断线 -->
  <path d="M 411 92 L 411 192" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 415 206 L 580 206" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="202" font-size="10" fill="#4a7a3a" filter="url(#rough2)">arr[6]、arr[7] 被挤出</text>

  <rect x="44" y="222" width="532" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="244" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 停在 arr[5] 时 cnt = 8 = n，i = 6：只有 arr[0..5] 能在结果里出现。</text>
  <text x="60" y="266" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">② 若刚好卡在 0 上使 cnt = n+1，则该 0 的第二份放不下，只写一份。</text>

  <text x="300" y="306" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">于是「写」也放在右端做：j = n−1 与 k = i−1 一起往左走</text>
  <text x="300" y="324" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">正扫只决定「边界在哪」，逆扫负责「真正落笔」</text>
</svg>
