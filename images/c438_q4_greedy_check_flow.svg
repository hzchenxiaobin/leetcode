<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="270" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：二分答案 + 环形贪心 check(x)</text>
  <path d="M 120 40 Q 270 48 420 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="56" width="360" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="270" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 二分 x ∈ [1, ⌊4s/k⌋]（k ≥ 4 ⟹ 上界 ≤ s）</text>
  <path d="M270,94 L270,110" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="114" width="360" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="270" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② 周长坐标排序 → 双倍数组 p₂[j+n] = p₂[j] + 4s</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#333">两指针求 next[j]：第一个满足 p₂ ≥ p₂[j] + x 的下标</text>
  <path d="M270,158 L270,172" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="176" width="360" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="270" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">③ 枚举起点 i：cur = i，cnt = 1，cap = p₂[i] + 4s − x</text>
  <text x="270" y="214" text-anchor="middle" font-size="11" fill="#333">反复跳 cur = next[cur]；断链或 p₂[cur] &gt; cap → 换下一个起点</text>
  <path d="M90,216 C70,216 70,190 86,193" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <text x="70" y="180" text-anchor="middle" font-size="9" fill="#7a5415">cnt &lt; k</text>
  <path d="M270,224 L270,240" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="270,240 415,272 270,304 125,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="270" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">某个起点数满</text>
  <text x="270" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">cnt ≥ k ？</text>
  <path d="M125,272 Q95,300 155,326" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="105" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M415,272 Q445,300 385,326" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="447" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="60" y="330" width="190" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="155" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">可行：lo = mid</text>
  <text x="155" y="366" text-anchor="middle" font-size="10" fill="#333">k 个点、环间隙全 ≥ x</text>

  <g filter="url(#sk)">
    <rect x="290" y="330" width="190" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="385" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">不可行：hi = mid − 1</text>
  <text x="385" y="366" text-anchor="middle" font-size="10" fill="#333">所有起点都凑不满 k 个</text>

  <path d="M155,374 Q200,390 236,390" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M385,374 Q340,390 304,390" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="390" width="240" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="270" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">lo == hi → 返回 lo（最大可行 x）</text>

  <g filter="url(#sk)">
    <rect x="470" y="112" width="200" height="122" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="570" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">为何要枚举全部 n 个起点？</text>
  <text x="570" y="148" text-anchor="middle" font-size="9.5" fill="#333">反例：周长 100，候选点</text>
  <text x="570" y="163" text-anchor="middle" font-size="9.5" fill="#333">{0, 20, 45, 70, 95}，x = 24，k = 4</text>
  <text x="570" y="178" text-anchor="middle" font-size="9.5" fill="#333">从 0 出发：0→45→70，</text>
  <text x="570" y="193" text-anchor="middle" font-size="9.5" fill="#333">95 超出 cap = 76，只有 3 个 ✗</text>
  <text x="570" y="208" text-anchor="middle" font-size="9.5" fill="#333">从 20 出发：20→45→70→95，</text>
  <text x="570" y="226" text-anchor="middle" font-size="9.5" fill="#333">闭合 25 ≥ 24 ✓ —— 换起点即活</text>

  <g filter="url(#sk)">
    <rect x="470" y="250" width="200" height="88" rx="6" fill="#fcfcfa" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="570" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">cap 的含义</text>
  <text x="570" y="284" text-anchor="middle" font-size="9.5" fill="#333">最后一点 ≤ p₂[i] + 4s − x</text>
  <text x="570" y="300" text-anchor="middle" font-size="9.5" fill="#333">⟺ 闭合间隙（尾 → 首）≥ x</text>
  <text x="570" y="316" text-anchor="middle" font-size="9.5" fill="#333">环上 k 段间隙，一段都不能少</text>

  <text x="270" y="442" text-anchor="middle" font-size="10.5" fill="#888">单次 check：两指针 O(n) + n 个起点 × (k−1) 跳 = O(nk)；总计 O(nk·log 4s) ≈ 1.2×10⁷</text>
</svg>
