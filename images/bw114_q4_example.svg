<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：k = 3，割 2 条边得 3 块</text>

  <!-- 根 0 -->
  <ellipse cx="260" cy="66" rx="42" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 (3) Σ=18</text>

  <!-- 1 和 2 -->
  <ellipse cx="150" cy="140" rx="42" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 (0) Σ=6</text>
  <ellipse cx="380" cy="140" rx="42" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 (6) Σ=9</text>

  <!-- 叶子 3,4,5,6 -->
  <ellipse cx="80" cy="216" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 (1) Σ=1</text>
  <ellipse cx="212" cy="216" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 (5) Σ=5</text>
  <ellipse cx="318" cy="216" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 (2) Σ=2</text>
  <ellipse cx="446" cy="216" rx="40" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 (1) Σ=1</text>

  <!-- 边：0-1、0-2 均割 -->
  <path d="M 226 82 C 200 100, 176 116, 160 126" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 294 82 C 320 100, 344 116, 360 126" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 132 160 C 112 176, 96 192, 86 198" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 168 160 C 188 176, 202 190, 210 198" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 362 160 C 344 176, 330 190, 322 198" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 398 160 C 416 176, 432 190, 440 198" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="150" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6 mod 3 = 0 ✂</text>
  <text x="382" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">9 mod 3 = 0 ✂</text>

  <!-- 三个连通块图例 -->
  <rect x="36" y="258" width="448" height="76" rx="10" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="110" cy="296" rx="14" ry="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="292" font-size="12" fill="#333" filter="url(#rough2)">{0}：3 ✓</text>
  <ellipse cx="240" cy="296" rx="14" ry="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="292" font-size="12" fill="#333" filter="url(#rough2)">{1,3,4}：6 ✓</text>
  <ellipse cx="370" cy="296" rx="14" ry="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="292" font-size="12" fill="#333" filter="url(#rough2)">{2,5,6}：9 ✓</text>
  <text x="260" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">叶子 Σ 非 0 → 上交；答案 = 3 ✓</text>
</svg>
