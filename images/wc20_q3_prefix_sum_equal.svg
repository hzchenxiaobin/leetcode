<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <g>
    <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：把 0 记作 −1，区间和 = 0 ⟺ 0 与 1 数量相同</text>
    <text x="310" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">令 S_i = 前 i 项之和，则 S_j = S_i ⟺ nums[i..j−1] 是平衡子数组（长度 j − i）</text>
  </g>
  <g>
    <text x="70" y="100" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">nums</text>
    <rect x="170" y="78" width="52" height="42" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="196.0" y="105" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">0</text>
    <rect x="232" y="78" width="52" height="42" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="258.0" y="105" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
    <rect x="294" y="78" width="52" height="42" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="320.0" y="105" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
    <rect x="356" y="78" width="52" height="42" fill="#e6f4ea" stroke="#3f7a46" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="382.0" y="105" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">0</text>
    <rect x="418" y="78" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="444.0" y="105" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
  </g>
  <g>
    <text x="196.0" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
    <text x="258.0" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
    <text x="320.0" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
    <text x="382.0" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
    <text x="444.0" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  </g>
  <g>
    <path d="M 182.0 142 L 182.0 176" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
    <text x="190.0" y="160" font-size="10" fill="#b8860b" filter="url(#rough2)">0 → −1，1 → +1</text>
  </g>
  <g>
    <text x="70" y="214" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">前缀和</text>
    <rect x="108" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="134.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">0</text>
    <text x="134.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S0</text>
    <rect x="170" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="196.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">−1</text>
    <text x="196.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S1</text>
    <rect x="232" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="258.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">0</text>
    <text x="258.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S2</text>
    <rect x="294" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="320.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="320.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S3</text>
    <rect x="356" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="382.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">0</text>
    <text x="382.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S4</text>
    <rect x="418" y="190" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="444.0" y="217" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="444.0" y="180" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">S5</text>
  </g>
  <g>
    <rect x="104" y="186" width="60" height="50" fill="none" stroke="#3f7a46" stroke-width="2.4" rx="7" filter="url(#rough2)"/>
    <rect x="352" y="186" width="60" height="50" fill="none" stroke="#3f7a46" stroke-width="2.4" rx="7" filter="url(#rough2)"/>
    <rect x="290" y="186" width="60" height="50" fill="none" stroke="#d6a040" stroke-width="2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
    <rect x="414" y="186" width="60" height="50" fill="none" stroke="#d6a040" stroke-width="2" rx="7" stroke-dasharray="7 4" filter="url(#rough2)"/>
  </g>
  <g>
    <path d="M 168 250 L 168 262 L 410 262 L 410 250" stroke="#3f7a46" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
    <text x="282" y="290" text-anchor="middle" font-size="12" fill="#3f7a46" filter="url(#rough2)">S0 = S4 = 0 → 长度 4（最优）</text>
    <text x="424.2" y="316" text-anchor="middle" font-size="10.5" fill="#b8860b" filter="url(#rough2)">S3 = S5 = 1 → 长度 2</text>
  </g>
  <g>
    <rect x="40" y="332" width="540" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
    <text x="310" y="354" text-anchor="middle" font-size="11.5" fill="#7a5c10" filter="url(#rough2)">同值前缀和「只记最早下标」：j 处长度 j − i 最大；否则记 first[S] = j</text>
    <text x="310" y="372" text-anchor="middle" font-size="11.5" fill="#7a5c10" filter="url(#rough2)">一次线性扫描 O(n)，哈希表 O(n) 空间</text>
  </g>
</svg>
