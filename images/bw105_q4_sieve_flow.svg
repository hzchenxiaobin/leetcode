<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：SPF 筛 + 并查集</text>

  <rect x="130" y="46" width="260" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">特判：n = 1 → true；含 1 且 n ≥ 2 → false</text>
  <path d="M260 82 L260 100" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="96" y="102" width="328" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2f4a66" text-anchor="middle">
    <text x="260" y="124">对值域 V 建“最小质因数”表 spf[]：</text>
    <text x="260" y="146">i 从 2 到 V，i 未被标记 → i 是质数，</text>
    <text x="260" y="164" font-size="11">把 i 的未标记倍数 j 都记 spf[j] = i</text>
  </g>
  <path d="M260 160 L260 184" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="76" y="186" width="368" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a10" text-anchor="middle">
    <text x="260" y="208">对每个 x = nums[i] 反复取 p = spf[x]：</text>
    <text x="260" y="230">union(x, p)，再把 x 中的 p 除干净，直到 x = 1</text>
  </g>
  <path d="M260 244 L260 266" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="96" y="268" width="328" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">判 find(nums[0]) == find(nums[i]) 对所有 i 成立？</text>
  <path d="M260 308 L260 326" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="170" y="328" width="180" height="0" rx="8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="444" y="124">值域 V ≤ 10⁵，</text>
    <text x="444" y="140">筛表 O(V log log V)</text>
    <text x="444" y="158">每个数分解 O(log x)</text>
    <text x="444" y="176">（每除一次至少减半）</text>
    <text x="444" y="210">并查集路径压缩后</text>
    <text x="444" y="226">单次合并近似 O(1)</text>
  </g>
</svg>
