<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">特殊路径 = 根路径的一段后缀，且这段上的"值"互不相同</text>
  <text filter="url(#rough2)" x="290" y="45" text-anchor="middle" font-size="11" fill="#888">DFS 时维护每个值在当前根路径上最后一次出现的深度下标 last[v]</text>

  <path d="M 92 78 L 250 132" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 232 148 L 138 208" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 268 148 L 268 232" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 286 148 L 388 208" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 124 232 L 96 300" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="88" cy="70" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="254" cy="140" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="124" cy="226" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <circle cx="268" cy="246" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="402" cy="214" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="88" cy="310" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold" fill="#334">
    <text x="88" y="66">0</text>
    <text x="254" y="136">1</text>
    <text x="124" y="222">2</text>
    <text x="268" y="242">3</text>
    <text x="402" y="210">4</text>
    <text x="88" y="306">5</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#666">
    <text x="88" y="78">值 2</text>
    <text x="254" y="148">值 1</text>
    <text x="124" y="234">值 2</text>
    <text x="268" y="254">值 1</text>
    <text x="402" y="222">值 3</text>
    <text x="88" y="318">值 1</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#446688">
    <text x="168" y="96">2</text>
    <text x="172" y="188">3</text>
    <text x="262" y="192">5</text>
    <text x="352" y="174">4</text>
    <text x="96" y="268">6</text>
  </g>

  <text filter="url(#rough2)" x="470" y="120" font-size="10.4" fill="#3a4a66" font-weight="bold">根路径 0→1→2→5</text>
  <text filter="url(#rough2)" x="470" y="138" font-size="10" fill="#666">深度下标 0,1,2,3</text>
  <text filter="url(#rough2)" x="470" y="156" font-size="10" fill="#666">值 2,1,2,1</text>
  <text filter="url(#rough2)" x="470" y="178" font-size="10" fill="#b85450">值 2 冲突于 0 与 2</text>
  <text filter="url(#rough2)" x="470" y="196" font-size="10" fill="#b85450">值 1 冲突于 1 与 3</text>
  <text filter="url(#rough2)" x="470" y="216" font-size="10" fill="#3a5a30" font-weight="bold">low = 1 ⇒ 起点 ≥ 2</text>
  <text filter="url(#rough2)" x="470" y="234" font-size="10" fill="#3a5a30">取 2→5，长度 5+6−5 = 6</text>

  <rect x="26" y="336" width="528" height="56" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="356" font-size="10.8" fill="#444">low = max(父的 low, last[nums[v]])：起点必须晚于所有"重复出现"的位置。</text>
  <text filter="url(#rough2)" x="42" y="376" font-size="10.8" fill="#444">回溯时必须恢复 last[nums[v]]，否则兄弟分支会看到别人的痕迹（本题最易错点）。</text>

  <text filter="url(#rough2)" x="180" y="60" font-size="10" fill="#999">红色边 = 路径 2→5 用的那条</text>
</svg>
