<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：统计票数 → 比较器排序 → 拼接输出</text>

  <!-- 主流程：四个步骤 -->
  <rect x="8" y="48" width="118" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="67" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">① 统计票数</text>
  <text x="67" y="84" text-anchor="middle" font-size="10" fill="#2d5a2d" filter="url(#rough2)">cnt[字母][排位]++</text>
  <text x="67" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">O(n·m)</text>

  <path d="M126,75 C133,75 139,75 146,75" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="48" width="118" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="209" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">② 取队伍集合</text>
  <text x="209" y="84" text-anchor="middle" font-size="10" fill="#2a4a66" filter="url(#rough2)">votes[0] 的字母</text>
  <text x="209" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每票都是全体排列</text>

  <path d="M268,75 C275,75 281,75 288,75" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="292" y="48" width="118" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="351" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6510" filter="url(#rough2)">③ 比较器排序</text>
  <text x="351" y="84" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">O(m log m) 次比较</text>
  <text x="351" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每次比较 O(m)</text>

  <path d="M410,75 C417,75 423,75 430,75" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="434" y="48" width="118" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="493" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">④ 按序拼接</text>
  <text x="493" y="84" text-anchor="middle" font-size="10" fill="#2d5a2d" filter="url(#rough2)">返回名次串</text>
  <text x="493" y="97" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">共 m 个字母</text>

  <!-- 比较器细则：入口 -->
  <rect x="200" y="126" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">比较器：逐位找不同</text>

  <path d="M280,156 C280,161 280,165 280,168" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,170 352,198 280,226 208,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">第 p 位票数相同？</text>

  <!-- 是：回环 -->
  <path d="M352,198 C398,196 402,150 372,141" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="168" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是：p 前进一位</text>
  <text x="404" y="184" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续比下一位</text>

  <!-- 否：决出 -->
  <path d="M280,226 C280,234 280,241 280,248" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="242" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="200" y="248" width="160" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">此位票多者在前</text>

  <!-- 全同兜底说明 -->
  <rect x="20" y="172" width="160" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">若 m 位全部相同</text>
  <text x="100" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 字母升序兜底</text>
  <text x="100" y="230" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（任意两队必分胜负）</text>
  <path d="M208,198 C200,198 194,197 184,196" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 复杂度结论框 -->
  <rect x="40" y="330" width="480" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">总时间 O(n·m + m²·log m)，n=1000、m=26 时约 2.9×10⁴ 步</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">空间 O(26·m)：一张票数矩阵 + 一个队伍串 O(m)</text>
</svg>
