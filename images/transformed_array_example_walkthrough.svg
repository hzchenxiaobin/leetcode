<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, −2, 1, 1]，n = 4</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="100" y="60" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="190" y="60" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="290" y="60" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="60" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#7a5415" font-weight="bold">
    <text x="70" y="81">i</text>
    <text x="145" y="81">nums[i]</text>
    <text x="240" y="81">移动</text>
    <text x="385" y="81">j = (i+v) mod 4</text>
    <text x="540" y="81">result[i]</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="60" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="100" y="94" width="90" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="190" y="94" width="100" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="290" y="94" width="190" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="480" y="94" width="120" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="70" y="121">0</text>
    <text x="145" y="121">+3</text>
    <text x="240" y="121">右 3 步</text>
    <text x="385" y="121" font-family="monospace">(0+3) mod 4 = 3</text>
    <text x="540" y="121">nums[3] = 1</text>
  </g>

  <!-- row 1 (highlight) -->
  <g filter="url(#sk)">
    <rect x="40" y="138" width="60" height="44" fill="#fff3e8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="100" y="138" width="90" height="44" fill="#fff3e8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="190" y="138" width="100" height="44" fill="#fff3e8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="290" y="138" width="190" height="44" fill="#fff3e8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="138" width="120" height="44" fill="#fff3e8" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="70" y="165">1</text>
    <text x="145" y="165">−2</text>
    <text x="240" y="165">左 2 步</text>
    <text x="385" y="165" font-family="monospace" fill="#b85450" font-weight="bold">(1−2) = −1 → +4 → 3</text>
    <text x="540" y="165">nums[3] = 1</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="182" width="60" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="100" y="182" width="90" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="190" y="182" width="100" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="290" y="182" width="190" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="480" y="182" width="120" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="70" y="209">2</text>
    <text x="145" y="209">+1</text>
    <text x="240" y="209">右 1 步</text>
    <text x="385" y="209" font-family="monospace">(2+1) mod 4 = 3</text>
    <text x="540" y="209">nums[3] = 1</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="226" width="60" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="100" y="226" width="90" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="190" y="226" width="100" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="290" y="226" width="190" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
    <rect x="480" y="226" width="120" height="44" fill="#f4f8fd" stroke="#9ab4cc" stroke-width="1"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333">
    <text x="70" y="253">3</text>
    <text x="145" y="253">+1</text>
    <text x="240" y="253">右 1 步</text>
    <text x="385" y="253" font-family="monospace">(3+1) mod 4 = 0</text>
    <text x="540" y="253">nums[0] = 3</text>
  </g>

  <!-- warning note -->
  <g filter="url(#sk)">
    <rect x="60" y="286" width="520" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-size="12" fill="#b85450">⚠ 负数取模：C++/Java 中 (−1) % 4 = −1，需 +4 再 % 4；Python 的 % 天然非负</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="160" y="332" width="320" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="19" fill="#2e6e2e" font-weight="bold" font-family="monospace">result = [1, 1, 1, 3] ✓</text>
</svg>
