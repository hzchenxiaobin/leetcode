<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 15, 6, 3] 双累加器走查</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="66" width="540" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <line x1="160" y1="66" x2="160" y2="100" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>
  <line x1="250" y1="66" x2="250" y2="100" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>
  <line x1="340" y1="66" x2="340" y2="100" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>
  <line x1="430" y1="66" x2="430" y2="100" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>
  <line x1="530" y1="66" x2="530" y2="100" stroke="#4a8edb" stroke-width="1" filter="url(#sk)"/>
  <text x="115" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">num</text>
  <text x="205" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">拆位</text>
  <text x="295" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">s(num)</text>
  <text x="385" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">x−s(x)</text>
  <text x="480" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">累计元素和</text>
  <text x="570" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">累计数字和</text>

  <!-- row 1: num=1 -->
  <g filter="url(#sk)">
    <rect x="70" y="102" width="540" height="32" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="115" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="205" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="295" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="385" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">0</text>
  <text x="480" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>
  <text x="570" y="123" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">1</text>

  <!-- row 2: num=15 highlighted -->
  <g filter="url(#sk)">
    <rect x="70" y="136" width="540" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="115" y="157" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" font-weight="bold">15</text>
  <text x="205" y="157" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">1, 5</text>
  <text x="295" y="157" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">6</text>
  <text x="385" y="157" text-anchor="middle" font-size="14" fill="#b85450" font-family="monospace" font-weight="bold">9</text>
  <text x="480" y="157" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">16</text>
  <text x="570" y="157" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">7</text>

  <!-- row 3: num=6 -->
  <g filter="url(#sk)">
    <rect x="70" y="170" width="540" height="32" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="115" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">6</text>
  <text x="205" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">6</text>
  <text x="295" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">6</text>
  <text x="385" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">0</text>
  <text x="480" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">22</text>
  <text x="570" y="191" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">13</text>

  <!-- row 4: num=3 -->
  <g filter="url(#sk)">
    <rect x="70" y="204" width="540" height="32" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="115" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">3</text>
  <text x="205" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">3</text>
  <text x="295" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">3</text>
  <text x="385" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">0</text>
  <text x="480" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">25</text>
  <text x="570" y="225" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">16</text>

  <!-- total row -->
  <g filter="url(#sk)">
    <rect x="70" y="238" width="540" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="115" y="260" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">合计</text>
  <text x="205" y="260" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">—</text>
  <text x="295" y="260" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">16</text>
  <text x="385" y="260" text-anchor="middle" font-size="13" fill="#b85450" font-family="monospace" font-weight="bold">9</text>
  <text x="480" y="260" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">25</text>
  <text x="570" y="260" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">16</text>

  <!-- arrow to answer -->
  <g filter="url(#sk)">
    <path d="M 340 274 Q 340 288 340 298" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="200" y="302" width="280" height="40" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="340" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">答案 = |25 − 16| = 9 ✓</text>

  <!-- annotations -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="560" height="38" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="76" y="368" font-size="11" fill="#a03030" font-weight="bold">唯一贡献差的是两位数 15（15 − 6 = 9）</text>
  <text x="76" y="384" font-size="10" fill="#a03030">一位数的 x−s(x)=0；自检：答案必须是 9 的倍数（含 0）</text>
</svg>
