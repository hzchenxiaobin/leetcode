<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：排序后 [1,3,3,3,4]，k = 6</text>

  <!-- 步 1：L=0, R=4, sum=5 < 6 -->
  <text x="26" y="82" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">步 1</text>
  <rect x="70" y="62" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="134" y="62" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="198" y="62" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="62" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="326" y="62" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <path d="M96,118 L96,98" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <path d="M352,118 L352,98" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">R</text>
  <text x="398" y="76" font-size="11.5" fill="#333" filter="url(#rough2)">sum = 1+4 = 5 &lt; 6</text>
  <text x="398" y="95" font-size="11.5" fill="#d6a040" filter="url(#rough2)">左端 1 太小 → left++</text>

  <!-- 步 2：L=1, R=4, sum=7 > 6 -->
  <text x="26" y="172" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">步 2</text>
  <rect x="70" y="152" width="52" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="173" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">1</text>
  <rect x="134" y="152" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="198" y="152" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="152" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="326" y="152" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <path d="M160,208 L160,188" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <path d="M352,208 L352,188" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">R</text>
  <text x="398" y="166" font-size="11.5" fill="#333" filter="url(#rough2)">sum = 3+4 = 7 &gt; 6</text>
  <text x="398" y="185" font-size="11.5" fill="#b85450" filter="url(#rough2)">右端 4 太大 → right−−</text>

  <!-- 步 3：L=1, R=3, sum=6 命中 -->
  <text x="26" y="262" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">步 3</text>
  <rect x="70" y="242" width="52" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="263" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">1</text>
  <rect x="134" y="242" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="198" y="242" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="242" width="52" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="326" y="242" width="52" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="263" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">4</text>
  <path d="M160,298 L160,278" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <path d="M288,298 L288,278" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">R</text>
  <text x="398" y="256" font-size="11.5" fill="#333" filter="url(#rough2)">sum = 3+3 = 6 ✓ 命中</text>
  <text x="398" y="275" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans = 1，left++ 且 right−−</text>

  <!-- 步 4：L=R=2 相遇结束 -->
  <text x="26" y="352" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">步 4</text>
  <rect x="70" y="332" width="52" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="353" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">1</text>
  <rect x="134" y="332" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="353" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 ✓</text>
  <rect x="198" y="332" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="353" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="332" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="353" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 ✓</text>
  <rect x="326" y="332" width="52" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="353" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">4</text>
  <path d="M212,388 L212,368" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">L</text>
  <path d="M236,388 L236,368" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">R</text>
  <text x="398" y="346" font-size="11.5" fill="#333" filter="url(#rough2)">left ≥ right，窗口耗尽</text>
  <text x="398" y="365" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">结束，ans = 1</text>
  <text x="398" y="384" font-size="11" fill="#999" filter="url(#rough2)">（剩下的 3 落单）</text>

  <text x="280" y="432" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">三个分支各走一遍：太小左移、太大右移、命中双移——每个元素至多被丢弃或配对一次</text>
</svg>
