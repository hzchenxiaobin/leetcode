<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：startAt=1, moveCost=2, pushCost=1, target=600</text>

  <!-- scheme 1: 1000 -->
  <g filter="url(#rough2)">
    <rect x="40" y="54" width="480" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="60" y="78" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">方案 A：10:00 → 按键串「1000」</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="60" y="102">1（在 1 上，直接按，+1）→ 移到 0（+2）→ 按 0（+1）</text>
    <text x="60" y="120">→ 按 0（+1）→ 按 0（+1）</text>
    <text x="60" y="138" fill="#b85450" font-weight="bold">总代价 = 1 + 2 + 1 + 1 + 1 = 6 ✓ 最优</text>
  </g>

  <!-- scheme 2: 960 -->
  <g filter="url(#rough2)">
    <rect x="40" y="160" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="60" y="184" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">方案 B：09:60 → 按键串「960」（3 位，省一次按键）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="60" y="208">移到 9（+2）→ 按 9（+1）→ 移到 6（+2）→ 按 6（+1）</text>
    <text x="60" y="226">→ 移到 0（+2）→ 按 0（+1）</text>
    <text x="60" y="244" fill="#b85450" font-weight="bold">总代价 = 2+1+2+1+2+1 = 9（少按 1 次但多移 3 次）</text>
  </g>

  <!-- scheme 3: 0960 -->
  <g filter="url(#rough2)">
    <rect x="40" y="266" width="480" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="60" y="290" font-size="14" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">方案 C：09:60 → 按键串「0960」（4 位全按）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="60" y="314">移到 0（+2）→ 按 0（+1）→ 移到 9（+2）→ 按 9（+1）</text>
    <text x="60" y="332">→ 移到 6（+2）→ 按 6（+1）→ 移到 0（+2）→ 按 0（+1）</text>
    <text x="60" y="350" fill="#b85450" font-weight="bold">总代价 = 12（前导 0 白按一次，还多一次移指）</text>
  </g>
</svg>
