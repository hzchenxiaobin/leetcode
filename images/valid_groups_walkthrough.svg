<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="88" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：balls = [3,2,3,2,3]</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">频率 {3: 3, 2: 2}，minFreq = 2，只需检查 x = 1 和 x = 2</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="44"  y="66" width="46"  height="32" rx="4" fill="#f0ede4" stroke="#8a8578" stroke-width="1.2"/>
    <rect x="90"  y="66" width="66"  height="32" rx="4" fill="#f0ede4" stroke="#8a8578" stroke-width="1.2"/>
    <rect x="156" y="66" width="180" height="32" rx="4" fill="#f0ede4" stroke="#8a8578" stroke-width="1.2"/>
    <rect x="336" y="66" width="164" height="32" rx="4" fill="#f0ede4" stroke="#8a8578" stroke-width="1.2"/>
    <rect x="500" y="66" width="96"  height="32" rx="4" fill="#f0ede4" stroke="#8a8578" stroke-width="1.2"/>

    <rect x="44"  y="98" width="46"  height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="90"  y="98" width="66"  height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="156" y="98" width="180" height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="336" y="98" width="164" height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="500" y="98" width="96"  height="60" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.2"/>

    <rect x="44"  y="158" width="46"  height="60" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="90"  y="158" width="66"  height="60" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="156" y="158" width="180" height="60" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="336" y="158" width="164" height="60" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="500" y="158" width="96"  height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="67"  y="86"  filter="url(#sk)">x</text>
    <text x="123" y="86"  filter="url(#sk)">盒大小</text>
    <text x="246" y="86"  filter="url(#sk)">f = 3（编号 3）</text>
    <text x="418" y="86"  filter="url(#sk)">f = 2（编号 2）</text>
    <text x="548" y="86"  filter="url(#sk)">total</text>
  </g>
  <g font-size="11.5" fill="#2b6e9e">
    <text x="67"  y="132" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="123" y="132" text-anchor="middle" filter="url(#sk)">{1,2}</text>
    <text x="246" y="124" text-anchor="middle" filter="url(#sk)">g = ⌈3/2⌉ = 2，2×1 ≤ 3 ✓</text>
    <text x="246" y="146" text-anchor="middle" filter="url(#sk)">装法 1+2</text>
    <text x="418" y="124" text-anchor="middle" filter="url(#sk)">g = ⌈2/2⌉ = 1，1 ≤ 2 ✓</text>
    <text x="418" y="146" text-anchor="middle" filter="url(#sk)">装法 2</text>
    <text x="548" y="136" text-anchor="middle" font-weight="bold" filter="url(#sk)">3</text>
  </g>
  <g font-size="11.5" fill="#2e6e2e">
    <text x="67"  y="192" text-anchor="middle" filter="url(#sk)">2</text>
    <text x="123" y="192" text-anchor="middle" filter="url(#sk)">{2,3}</text>
    <text x="246" y="184" text-anchor="middle" filter="url(#sk)">g = ⌈3/3⌉ = 1，2×1 ≤ 3 ✓</text>
    <text x="246" y="206" text-anchor="middle" filter="url(#sk)">装法 3</text>
    <text x="418" y="184" text-anchor="middle" filter="url(#sk)">g = ⌈2/3⌉ = 1，2 ≤ 2 ✓</text>
    <text x="418" y="206" text-anchor="middle" filter="url(#sk)">装法 2</text>
  </g>
  <text x="548" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">2 ✓</text>

  <!-- winning grouping -->
  <text x="150" y="248" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">最优分组（x = 2，两盒大小差恰为 1）：</text>
  <g filter="url(#sk)">
    <rect x="252" y="232" width="106" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="372" y="232" width="82"  height="32" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="305" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">3 3 3</text>
  <text x="413" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2 2</text>
  <text x="486" y="253" font-size="11.5" fill="#555" filter="url(#sk)">← 答案 2</text>

  <!-- hole warning -->
  <g filter="url(#sk)">
    <rect x="44" y="286" width="552" height="128" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#sk)">⚠ 可行集关于 x 有洞：单一频率 f = 7 时，可行的 x 只有 {1, 2, 3, 6, 7}</text>
  <path d="M 128 350 L 512 350" stroke="#8a3a36" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="11.5" text-anchor="middle">
    <text x="128" y="336" fill="#8a3a36" filter="url(#sk)">x=1</text>
    <text x="194" y="336" fill="#8a3a36" filter="url(#sk)">x=2</text>
    <text x="260" y="336" fill="#8a3a36" filter="url(#sk)">x=3</text>
    <text x="326" y="336" fill="#8a3a36" filter="url(#sk)">x=4</text>
    <text x="392" y="336" fill="#8a3a36" filter="url(#sk)">x=5</text>
    <text x="458" y="336" fill="#8a3a36" filter="url(#sk)">x=6</text>
    <text x="512" y="336" fill="#8a3a36" filter="url(#sk)">x=7</text>
    <text x="128" y="372" fill="#2e6e2e" filter="url(#sk)">✓</text>
    <text x="194" y="372" fill="#2e6e2e" filter="url(#sk)">✓</text>
    <text x="260" y="372" fill="#2e6e2e" filter="url(#sk)">✓</text>
    <text x="326" y="372" fill="#b85450" font-weight="bold" filter="url(#sk)">✗</text>
    <text x="392" y="372" fill="#b85450" font-weight="bold" filter="url(#sk)">✗</text>
    <text x="458" y="372" fill="#2e6e2e" filter="url(#sk)">✓</text>
    <text x="512" y="372" fill="#2e6e2e" filter="url(#sk)">✓</text>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#sk)">4、5 两档不可行但 6、7 可行 ⇒ 可行性不单调，不能对 x 二分，只能老老实实枚举</text>
</svg>
