<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：同一套规则跑两遍</text>

  <text x="70" y="58" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">text = "aaabbaaa"，8 个字符，cnt[a] = 6、cnt[b] = 2</text>

  <rect x="70" y="68" width="136" height="50" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <rect x="208" y="68" width="90" height="50" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <rect x="300" y="68" width="136" height="50" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>

  <rect x="70" y="72" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="92" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="116" y="72" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="138" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="162" y="72" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="208" y="72" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="99" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="254" y="72" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="276" y="99" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="300" y="72" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="99" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="346" y="72" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="368" y="99" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="392" y="72" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="414" y="99" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>

  <text x="138" y="134" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">a × 3（段1）</text>
  <text x="253" y="134" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">b × 2</text>
  <text x="368" y="134" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">a × 3（段3）</text>

  <text x="470" y="86" font-size="10" fill="#888" filter="url(#rough2)">候选逐个算：</text>
  <text x="470" y="108" font-size="10" fill="#3a4a66" filter="url(#rough2)">① 段1：min(3 + 1, 6) = 4</text>
  <text x="470" y="130" font-size="10" fill="#8a6a20" filter="url(#rough2)">② 段2：min(2 + 1, 2) = 2</text>
  <text x="470" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">③ 段1+段3：中间隔 b×2 → 不能拼</text>
  <text x="470" y="176" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 4</text>

  <text x="70" y="206" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">text = "aaabaaa"，7 个字符，cnt[a] = 6、cnt[b] = 1</text>

  <rect x="70" y="216" width="136" height="50" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <rect x="208" y="216" width="44" height="50" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <rect x="254" y="216" width="136" height="50" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>

  <rect x="70" y="220" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="92" y="247" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="116" y="220" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="138" y="247" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="162" y="220" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="247" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">a</text>
  <rect x="208" y="220" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="247" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">b</text>
  <rect x="254" y="220" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="276" y="247" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="300" y="220" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="322" y="247" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>
  <rect x="346" y="220" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="368" y="247" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">a</text>

  <text x="138" y="282" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">a × 3（段1）</text>
  <text x="230" y="282" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">b × 1</text>
  <text x="322" y="282" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">a × 3（段3）</text>

  <text x="470" y="234" font-size="10" fill="#888" filter="url(#rough2)">候选逐个算：</text>
  <text x="470" y="256" font-size="10" fill="#3a4a66" filter="url(#rough2)">① 段1：min(3 + 1, 6) = 4</text>
  <text x="470" y="278" font-size="10" fill="#b85450" filter="url(#rough2)">② 段1+段3：min(3 + 3 + 1, 6) = 6</text>
  <text x="470" y="300" font-size="10" fill="#888" filter="url(#rough2)">（间隔恰为 1，可以拼上）</text>
  <text x="470" y="326" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 6</text>

  <text x="70" y="356" font-size="10" fill="#888" filter="url(#rough2)">对比可见：能不能合并只看「同类两段之间的间隔段长是否为 1」，长度 2 就彻底拼不上。</text>
</svg>
