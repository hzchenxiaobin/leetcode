<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 376"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="16"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="620" height="376" fill="#fafafa"/>
  <text x="310.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">固定右端点 i=8，j 从 7 往前扫，随时维护频次</text>
  <text x="70.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">j</text>
  <text x="130.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">s[j..7]</text>
  <text x="300.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">distinct</text>
  <text x="396.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">mx</text>
  <text x="470.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">len</text>
  <text x="556.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">平衡?</text>
  <text x="70.0" y="116.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">7</text>
  <text x="130.0" y="116.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">g</text>
  <text x="300.0" y="116.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">1</text>
  <text x="396.0" y="116.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">1</text>
  <text x="470.0" y="116.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">1</text>
  <text x="556.0" y="116.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="70.0" y="146.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">6</text>
  <text x="130.0" y="146.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">dg</text>
  <text x="300.0" y="146.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="396.0" y="146.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">1</text>
  <text x="470.0" y="146.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="556.0" y="146.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="70.0" y="176.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">5</text>
  <text x="130.0" y="176.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">ddg</text>
  <text x="300.0" y="176.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="396.0" y="176.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="470.0" y="176.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">3</text>
  <text x="556.0" y="176.0" text-anchor="middle" font-size="12" fill="#aaaaaa" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="70.0" y="206.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">4</text>
  <text x="130.0" y="206.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">cddg</text>
  <text x="300.0" y="206.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">3</text>
  <text x="396.0" y="206.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="470.0" y="206.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">4</text>
  <text x="556.0" y="206.0" text-anchor="middle" font-size="12" fill="#aaaaaa" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="70.0" y="236.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="130.0" y="236.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">bccddg</text>
  <text x="300.0" y="236.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">4</text>
  <text x="396.0" y="236.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="470.0" y="236.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">6</text>
  <text x="556.0" y="236.0" text-anchor="middle" font-size="12" fill="#aaaaaa" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="70.0" y="266.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">0</text>
  <text x="130.0" y="266.0" text-anchor="start" font-size="11" fill="#444444" filter="url(#rough2)">fabccddg</text>
  <text x="300.0" y="266.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">6</text>
  <text x="396.0" y="266.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">2</text>
  <text x="470.0" y="266.0" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">8</text>
  <text x="556.0" y="266.0" text-anchor="middle" font-size="12" fill="#aaaaaa" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M 40.0 286.0 L 580.0 286.0" stroke="#dddddd" stroke-width="1.0" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <rect x="30.0" y="292.4" width="269.6" height="74.9" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="316.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">判据：len % distinct == 0</text>
  <text x="165.0" y="333.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">且 mx == len // distinct</text>
  <text x="165.0" y="350.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">两个条件同时成立才平衡</text>
  <rect x="319.5" y="292.1" width="269.7" height="74.8" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455.0" y="316.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">所以 dp[8] = 1 + min(dp[7], dp[6])</text>
  <text x="455.0" y="333.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">整串 s 的答案最终是 3</text>
  <text x="455.0" y="350.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">（fabc | cd | dg）</text>
</svg>
