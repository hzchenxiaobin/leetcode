<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">为什么升序排列最优：相邻逆序交换不会变差</text>

  <!-- 错误示范：大值在前 -->
  <text x="44" y="66" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">排列 [100, 1]（大值在前）：</text>
  <g filter="url(#rough2)">
    <rect x="250" y="46" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="316" y="46" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="250" y="104" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="316" y="104" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="280" y="71">100</text><text x="346" y="71">1</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    <text x="280" y="126">cur=1</text><text x="346" y="126">cur=1</text>
  </g>
  <text x="44" y="126" font-size="10.5" fill="#b85450" filter="url(#rough2)">min(1,100)=1</text>
  <text x="44" y="140" font-size="10.5" fill="#b85450" filter="url(#rough2)">min(2,1)=1</text>
  <text x="404" y="126" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大值 = 1 ✗</text>

  <path d="M 280 158 L 280 178" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="172" font-size="10.5" fill="#888" filter="url(#rough2)">100 被迫削成 1，还只给下一位留了 +1 的空间</text>

  <!-- 正确：升序 -->
  <text x="44" y="212" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排列 [1, 100]（升序）：</text>
  <g filter="url(#rough2)">
    <rect x="250" y="192" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="316" y="192" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="250" y="250" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="316" y="250" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="280" y="217">1</text><text x="346" y="217">100</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="280" y="272">cur=1</text><text x="346" y="272">cur=2</text>
  </g>
  <text x="44" y="272" font-size="10.5" fill="#2f5226" filter="url(#rough2)">min(1,1)=1</text>
  <text x="44" y="286" font-size="10.5" fill="#2f5226" filter="url(#rough2)">min(2,100)=2</text>
  <text x="404" y="272" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">最大值 = 2 ✓</text>

  <rect x="40" y="296" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">交换论证：若最优排列中相邻 a ≥ b（前大后小），交换成 (…,b,a,…) 后每个位置的 cur 都不减小</text>
</svg>
