<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#3d3d3d" font-weight="bold" filter="url(#rough2)">bitset 0/1 背包：dp[k] 的第 s 位 = 存在 k 元子集和为 s</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一个大整数的二进制位代替布尔数组，整行一次平移 + 或运算就完成转移</text>

  <rect x="22" y="70" width="304" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="38" y="94" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">转移：加入元素 v</text>
  <text x="38" y="120" font-size="11" fill="#3d3d3d" filter="url(#rough2)">dp[0] = 1　　　（只有空集和为 0）</text>
  <text x="38" y="146" font-size="11" fill="#3d3d3d" filter="url(#rough2)">for v in nums:</text>
  <text x="52" y="168" font-size="11" fill="#3d3d3d" filter="url(#rough2)">for k = half … 1:　　（倒序）</text>
  <text x="66" y="190" font-size="11" fill="#3d3d3d" filter="url(#rough2)">dp[k] |= dp[k-1] &lt;&lt; v</text>
  <text x="38" y="216" font-size="10" fill="#8a6a20" filter="url(#rough2)">倒序 k：保证同一个元素最多被选一次</text>
  <text x="38" y="236" font-size="10" fill="#888" filter="url(#rough2)">复杂度 O(n·k·S / w)，w = 机器字长</text>

  <path d="M 334 158 L 356 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="70" width="276" height="176" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="378" y="94" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">查询：逐个 k 试目标</text>
  <text x="378" y="120" font-size="11" fill="#3d3d3d" filter="url(#rough2)">for k in 1 … n/2:</text>
  <text x="392" y="142" font-size="11" fill="#3d3d3d" filter="url(#rough2)">if S·k % n != 0: continue</text>
  <text x="392" y="164" font-size="11" fill="#3d3d3d" filter="url(#rough2)">t = S·k / n</text>
  <text x="392" y="186" font-size="11" fill="#3d3d3d" filter="url(#rough2)">if (dp[k] &gt;&gt; t) &amp; 1: return true</text>
  <text x="378" y="212" font-size="11" fill="#3a5a30" filter="url(#rough2)">return false</text>
  <text x="378" y="234" font-size="10" fill="#888" filter="url(#rough2)">取位 O(1)，二分？不需要——k 只有 15 个</text>

  <text x="22" y="276" font-size="11" fill="#555" filter="url(#rough2)">以 nums = [1,2,3,4,5,6,7,8] 为例，处理完全部元素后 dp[2] 的置位情况：</text>

  <g filter="url(#rough2)">
    <rect x="30" y="288" width="600" height="30" fill="#f2f5fb" stroke="#8a9bb8" stroke-width="1.2" rx="4"/>
    <rect x="126" y="288" width="408" height="30" fill="#d6e4ff" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="315" y="285" width="30" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#666">
    <text x="45" y="336">0</text><text x="75" y="336">1</text><text x="105" y="336">2</text>
    <text x="135" y="336">3</text><text x="165" y="336">4</text><text x="195" y="336">5</text>
    <text x="225" y="336">6</text><text x="255" y="336">7</text><text x="285" y="336">8</text>
    <text x="315" y="336">9</text><text x="345" y="336">10</text><text x="375" y="336">11</text>
    <text x="405" y="336">12</text><text x="435" y="336">13</text><text x="465" y="336">14</text>
    <text x="495" y="336">15</text><text x="525" y="336">16</text><text x="555" y="336">17</text>
    <text x="585" y="336">18</text>
  </g>

  <text x="330" y="358" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">蓝色段 = 位置 3 … 15 全部置位（任意两个不同元素之和），红色一格是 target = 9</text>
  <text x="330" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k = 2 时 S·k/n = 36·2/8 = 9，第 9 位为 1 ⟹ 存在 {1,8}、{2,7} 等，直接返回 true</text>
  <text x="330" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位宽只需 S+1 = 300001；C++ 用 std::bitset，Python 直接用 int 的 &lt;&lt; 与 |=</text>
  <text x="330" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">dp[k] 只依赖 dp[k-1]，一维滚动即可，不必存 16 × 300001 的二维表</text>
</svg>
