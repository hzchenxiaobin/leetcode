<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 一趟滑窗 → 取最小差值</text>
  <path d="M 190 42 Q 350 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start pill -->
  <g filter="url(#sk)">
    <rect x="250" y="64" width="200" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="350" y="87" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">开始：读入 nums, k</text>
  <path d="M 350 100 L 350 124" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 1: sort -->
  <g filter="url(#sk)">
    <rect x="210" y="126" width="280" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="150" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">① 升序排序 sort(nums)</text>
  <g filter="url(#sk)">
    <rect x="520" y="133" width="150" height="26" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="595" y="150" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace">O(n log n)</text>
  <path d="M 350 166 L 350 190" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 2: init -->
  <g filter="url(#sk)">
    <rect x="210" y="192" width="280" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="216" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">② ans = +∞，i = 0</text>
  <path d="M 350 232 L 350 256" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="350,255 445,300 350,345 255,300" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="350" y="305" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" font-weight="bold">i ≤ n − k ?</text>

  <!-- yes branch -->
  <path d="M 350 345 L 350 369" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="362" y="362" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- loop body -->
  <g filter="url(#sk)">
    <rect x="180" y="371" width="340" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="392" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" font-weight="bold">③ diff = nums[i+k−1] − nums[i]</text>
  <text x="350" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = min(ans, diff)；i++</text>

  <!-- loop-back arrow -->
  <path d="M 180 397 L 126 397 L 126 300 L 253 300" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#arO)" stroke-dasharray="5 3"/>
  <text x="148" y="388" text-anchor="middle" font-size="10" fill="#c98a2b" font-weight="bold">下一窗口</text>

  <!-- per-window cost chip -->
  <g filter="url(#sk)">
    <rect x="540" y="384" width="130" height="26" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="605" y="401" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace">每窗 O(1)</text>

  <!-- no branch -->
  <path d="M 445 300 L 516 300" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="470" y="290" font-size="11" fill="#b03a3a" font-weight="bold">否</text>

  <!-- end pill -->
  <g filter="url(#sk)">
    <rect x="520" y="282" width="160" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="600" y="304" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">④ 返回 ans</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="620" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="350" y="453" text-anchor="middle" font-size="11" fill="#888">有序数组中窗口 max = 右端、min = 左端，端点相减即差值，窗口内部无需遍历。</text>
</svg>
