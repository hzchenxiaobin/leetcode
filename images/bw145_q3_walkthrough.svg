<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：10 → 20 → 21 → 22 → 12，代价 85</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步只改一位，且落点都不能是质数</text>

  <rect x="34" y="96" width="76" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="72" y="122" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="72" y="84" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">起点</text>

  <rect x="146" y="96" width="76" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="184" y="122" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">20</text>

  <rect x="258" y="96" width="76" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="296" y="122" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">21</text>

  <rect x="370" y="96" width="76" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408" y="122" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">22</text>

  <rect x="482" y="96" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="520" y="122" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="520" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">终点</text>

  <path d="M 110 116 L 142 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">十位+1</text>

  <path d="M 222 116 L 254 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">个位+1</text>

  <path d="M 334 116 L 366 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">个位+1</text>

  <path d="M 446 116 L 478 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">十位−1</text>

  <text x="72" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 10</text>
  <text x="184" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 30</text>
  <text x="296" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 51</text>
  <text x="408" y="160" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">累计 73</text>
  <text x="520" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">累计 85</text>

  <text x="72" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 × 5</text>
  <text x="184" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 × 2 × 5</text>
  <text x="296" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3 × 7</text>
  <text x="408" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 × 11</text>
  <text x="520" y="182" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 × 2 × 3</text>

  <rect x="96" y="206" width="368" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">代价 = 10 + 20 + 21 + 22 + 12 = 85</text>
  <text x="280" y="245" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">所有中间值都是合数，路径合法</text>

  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">更好的路径若存在，Dijkstra 会先弹出更小的累计值</text>
</svg>
