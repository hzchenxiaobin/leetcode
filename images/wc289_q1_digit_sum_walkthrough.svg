<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：长度骤缩 与 总数字和递减 两种收敛机制</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1 -->
  <text x="60" y="70" font-size="14" font-weight="bold" fill="#2b4a6e">例 1：s = "11111222223", k = 3</text>
  <g filter="url(#sk2)">
    <rect x="430" y="56" width="186" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="523" y="72" text-anchor="middle" font-size="11" fill="#2b4a6e">S 轨迹：18 → 18 → 9</text>

  <!-- round 1 of example 1 -->
  <text x="60" y="102" font-size="12" fill="#7a5415" font-weight="bold">轮 1（所有段和一位数 → 长度骤缩）</text>
  <g filter="url(#sk2)">
    <rect x="60" y="112" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="146" y="112" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="112" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="318" y="112" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="98" y="132" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">111</text>
  <text x="184" y="132" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">112</text>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">222</text>
  <text x="346" y="132" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">23</text>
  <text x="410" y="132" font-size="13" fill="#3a3a3a" font-family="monospace">→ 3, 4, 6, 5 →</text>
  <g filter="url(#sk2)">
    <rect x="520" y="112" width="86" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="563" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" font-family="monospace">"3465"</text>
  <text x="410" y="158" font-size="11" fill="#b85450">len 11 → 4，S 保持 18</text>

  <!-- round 2 of example 1 -->
  <text x="60" y="188" font-size="12" fill="#7a5415" font-weight="bold">轮 2（出现两位段和 → S 严格递减）</text>
  <g filter="url(#sk2)">
    <rect x="60" y="198" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="146" y="198" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="98" y="218" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">346</text>
  <text x="169" y="218" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="230" y="218" font-size="13" fill="#3a3a3a" font-family="monospace">→ 13, 5 →</text>
  <g filter="url(#sk2)">
    <rect x="340" y="198" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="378" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" font-family="monospace">"135"</text>
  <g filter="url(#sk2)">
    <rect x="440" y="196" width="166" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="523" y="210" text-anchor="middle" font-size="11" fill="#8a3a36">len = 3 ≤ k = 3</text>
  <text x="523" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">停止，答案 "135" ✓</text>
  <text x="378" y="244" font-size="11" fill="#b85450">S 递减到 9，len 4 → 3</text>

  <!-- divider -->
  <path d="M 70 264 Q 320 272 570 264" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>

  <!-- Example 2 -->
  <text x="60" y="294" font-size="14" font-weight="bold" fill="#2b4a6e">补充：s = "9999", k = 2（长度一度不缩！）</text>
  <g filter="url(#sk2)">
    <rect x="430" y="280" width="186" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="523" y="296" text-anchor="middle" font-size="11" fill="#2b4a6e">S 轨迹：36 → 18 → 18</text>

  <!-- round 1 of example 2 -->
  <text x="60" y="326" font-size="12" fill="#7a5415" font-weight="bold">轮 1（段和 18 ≥ 10 → 长度不变，靠 S 递减）</text>
  <g filter="url(#sk2)">
    <rect x="60" y="336" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="146" y="336" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="98" y="356" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">99</text>
  <text x="184" y="356" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">99</text>
  <text x="250" y="356" font-size="13" fill="#3a3a3a" font-family="monospace">→ 18, 18 →</text>
  <g filter="url(#sk2)">
    <rect x="370" y="336" width="86" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="413" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a" font-family="monospace">"1818"</text>
  <text x="480" y="345" font-size="11" fill="#b85450" font-weight="bold">len 4 → 4 不缩</text>
  <text x="480" y="360" font-size="11" fill="#b85450">但 S：36 → 18</text>

  <!-- round 2 of example 2 -->
  <text x="60" y="392" font-size="12" fill="#7a5415" font-weight="bold">轮 2（段和 9 &lt; 10 → 骤缩到 ⌈4/2⌉ = 2）</text>
  <g filter="url(#sk2)">
    <rect x="60" y="402" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="146" y="402" width="76" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="98" y="422" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">18</text>
  <text x="184" y="422" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">18</text>
  <text x="250" y="422" font-size="13" fill="#3a3a3a" font-family="monospace">→ 9, 9 →</text>
  <g filter="url(#sk2)">
    <rect x="340" y="402" width="66" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="373" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" font-family="monospace">"99"</text>
  <g filter="url(#sk2)">
    <rect x="440" y="400" width="176" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="528" y="414" text-anchor="middle" font-size="11" fill="#8a3a36">len = 2 ≤ k = 2</text>
  <text x="528" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">停止，答案 "99" ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="40" y="444" width="580" height="20" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="458" text-anchor="middle" font-size="11" fill="#7a5415">每轮要么 S 严格递减、要么长度骤缩，二者必居其一 → 不存在"原地踏步"的无限循环。</text>
</svg>
