<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="720" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">逐位贪心（高位 → 低位）：能清则清，答案 = full &amp; ~cleared</text>
  <path d="M 190 42 Q 450 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left flow column ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="300" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="210" y="85" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">full = nums 全体 OR；cleared = 0</text>

  <path d="M 210 98 L 210 116" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="118" width="300" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="210" y="141" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">循环 b = 29 … 0（full 中为 1 的位）</text>

  <path d="M 210 154 L 210 172" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="174" width="300" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="210" y="191" text-anchor="middle" font-size="11" fill="#2b5d85" filter="url(#sk)">mask = cleared | (1 &lt;&lt; b)</text>
  <text x="210" y="204" text-anchor="middle" font-size="10" fill="#7a94b5" filter="url(#sk)">在已确认清零的位上叠加试探位 b</text>

  <path d="M 210 210 L 210 228" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- scan container -->
  <g filter="url(#sk)">
    <rect x="40" y="230" width="340" height="188" rx="10" fill="#fdfcf7" stroke="#888" stroke-width="1.3" stroke-dasharray="7 4"/>
  </g>
  <text x="210" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">一趟扫描求最少操作数 cnt</text>
  <text x="210" y="276" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">cur = −1（全 1），cnt = 0；对每个 x：cur &amp;= x</text>

  <g filter="url(#sk)">
    <polygon points="210,290 276,326 210,362 144,326" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="210" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a" filter="url(#sk)">cur &amp; mask = 0 ?</text>

  <path d="M 144 326 L 108 326 L 108 356" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="126" y="318" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="108" y="376" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">切段：cur ← −1</text>
  <text x="108" y="392" text-anchor="middle" font-size="9.5" fill="#7aa87a" filter="url(#sk)">段在此收尾，0 次操作</text>

  <path d="M 276 326 L 312 326 L 312 356" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="284" y="318" font-size="10.5" font-weight="bold" fill="#a06b1a" filter="url(#sk)">否</text>
  <text x="312" y="376" text-anchor="middle" font-size="10.5" fill="#a06b1a" filter="url(#sk)">cnt += 1</text>
  <text x="312" y="392" text-anchor="middle" font-size="9.5" fill="#b58a4a" filter="url(#sk)">必须并入下一位</text>

  <text x="210" y="412" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">（cnt &gt; k 时可提前退出）</text>

  <path d="M 210 418 L 210 442" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="210,444 288,482 210,520 132,482" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="210" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">cnt ≤ k ?</text>

  <path d="M 288 482 L 330 482" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="473" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="334" y="458" width="226" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="447" y="478" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cleared = mask</text>
  <text x="447" y="496" text-anchor="middle" font-size="10.5" fill="#4a8e4a" filter="url(#sk)">✓ 位 b 确认清零（含此前已确认的位）</text>

  <path d="M 210 520 L 210 560" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="222" y="545" font-size="11" font-weight="bold" fill="#a06b1a" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="60" y="562" width="300" height="44" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="210" y="580" text-anchor="middle" font-size="11.5" fill="#a06b1a" filter="url(#sk)">位 b 保留在答案中（cleared 不动）</text>
  <text x="210" y="597" text-anchor="middle" font-size="10" fill="#b58a4a" filter="url(#sk)">它自动留在 full &amp; ~cleared 里</text>

  <!-- loop-back channel (shared, right side) -->
  <g filter="url(#sk)" stroke="#888" stroke-width="1.3" fill="none">
    <path d="M 560 482 L 612 482"/>
    <path d="M 360 584 L 612 584"/>
    <path d="M 612 584 L 612 136"/>
    <path d="M 612 136 L 366 136" marker-end="url(#ar)"/>
  </g>
  <circle cx="612" cy="482" r="3.5" fill="#888" filter="url(#sk)"/>
  <text x="630" y="350" font-size="9.5" fill="#888" filter="url(#sk)" transform="rotate(-90 630 350)">处理下一位 b</text>

  <!-- final box -->
  <g filter="url(#sk)">
    <rect x="60" y="636" width="300" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="210" y="654" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">所有位试完</text>
  <text x="210" y="672" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 full &amp; ~cleared</text>
  <path d="M 60 136 L 22 136 L 22 658 L 55 658" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="36" y="420" font-size="9.5" fill="#999" filter="url(#sk)" transform="rotate(-90 36 420)">b &lt; 0</text>

  <!-- ===== right notes column ===== -->
  <g filter="url(#sk)">
    <rect x="660" y="62" width="220" height="84" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="770" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b5d85" filter="url(#sk)">检查什么？</text>
  <g filter="url(#sk)" font-size="9.8" fill="#444" text-anchor="middle">
    <text x="770" y="104">每个剩余元素 &amp; mask = 0</text>
    <text x="770" y="120">⟺ 全体 OR &amp; mask = 0，</text>
    <text x="770" y="138">逐元素判定融入一趟扫描</text>
  </g>

  <g filter="url(#sk)">
    <rect x="660" y="158" width="220" height="92" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="770" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">尾段不合法？</text>
  <g filter="url(#sk)" font-size="9.8" fill="#444" text-anchor="middle">
    <text x="770" y="200">并入上一段：并段 AND 只会</text>
    <text x="770" y="216">更瘦，自动合法；代价恰被</text>
    <text x="770" y="232">尾段最后一个元素的 cnt 覆盖，</text>
    <text x="770" y="246">无需特判</text>
  </g>

  <g filter="url(#sk)">
    <rect x="660" y="262" width="220" height="84" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="770" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a" filter="url(#sk)">位与位独立？</text>
  <g filter="url(#sk)" font-size="9.8" fill="#444" text-anchor="middle">
    <text x="770" y="304">试探集合 = 已确认位 ∪ {b}；</text>
    <text x="770" y="320">未决策的低位「允许留下」，</text>
    <text x="770" y="338">每位检查互不干扰</text>
  </g>

  <g filter="url(#sk)">
    <rect x="660" y="358" width="220" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="770" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">⚠️ 易错</text>
  <g filter="url(#sk)" font-size="9.8" fill="#444" text-anchor="middle">
    <text x="770" y="400">C++ 必须返回 full &amp; ~cleared；</text>
    <text x="770" y="416">~cleared 高位含 1，</text>
    <text x="770" y="430">单独返回是负数</text>
  </g>

  <g filter="url(#sk)">
    <rect x="660" y="444" width="220" height="74" rx="8" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="770" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">复杂度</text>
  <g filter="url(#sk)" font-size="9.8" fill="#666" text-anchor="middle">
    <text x="770" y="486">外层 30 位 × 每位一趟 O(n)</text>
    <text x="770" y="504">= O(30n)，n = 10⁵ 时约</text>
    <text x="770" y="518">3 × 10⁶ 次位运算</text>
  </g>
</svg>
