<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 552"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="552" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：两遍计数 + 一趟原序扫描</text>

  <!-- 开始 -->
  <rect x="270" y="40" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="57" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,66 L320,80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop 1 -->
  <rect x="170" y="84" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="101" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">① 遍历 nums 中每个元素 v</text>
  <path d="M320,110 L320,124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="128" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#446688" font-family="monospace" filter="url(#rough2)">cnt[v] ← cnt[v] + 1</text>

  <!-- 回边 1 -->
  <path d="M185,144 L150,144 L150,97 L166,97" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="125" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个 v</text>

  <path d="M320,160 L320,174" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="172" font-size="10" fill="#888" filter="url(#rough2)">遍历完</text>

  <!-- Loop 2 -->
  <rect x="170" y="178" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">② 遍历每个出现过的值 v</text>
  <path d="M320,204 L320,218" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="222" width="270" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="242" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">freqCnt[ cnt[v] ] += 1</text>

  <!-- 回边 2 -->
  <path d="M185,238 L150,238 L150,191 L166,191" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="219" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个值</text>

  <path d="M320,254 L320,268" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="266" font-size="10" fill="#888" filter="url(#rough2)">统计完</text>

  <!-- Loop 3 -->
  <rect x="170" y="272" width="300" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="289" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">③ 从左到右扫 nums：v = nums[i]</text>
  <path d="M320,298 L320,312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,312 480,352 320,392 160,352" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-family="monospace" filter="url(#rough2)">freqCnt[cnt[v]] == 1 ?</text>
  <text x="320" y="364" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（v 的频率被独占？）</text>

  <!-- 是分支 -->
  <text x="146" y="344" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M160,352 L128,352" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="12" y="334" width="114" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="69" y="356" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">return v</text>
  <path d="M69,370 L69,483 L281,483" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="69" y="440" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">立即结束</text>

  <!-- 否分支 -->
  <text x="332" y="408" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M320,392 L320,414" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="418" width="270" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="438" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i ← i + 1，继续向右</text>

  <!-- 回边 3 -->
  <path d="M185,434 L138,434 L138,285 L166,285" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="312" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">下一个 i</text>

  <!-- 扫完 → -1 -->
  <path d="M470,285 L561,285 L561,314" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="516" y="278" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i = n</text>
  <rect x="488" y="316" width="146" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="561" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">扫完仍无命中</text>
  <text x="561" y="352" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">判定始终为否</text>
  <text x="561" y="368" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（i 走到 n）</text>
  <text x="561" y="384" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" filter="url(#rough2)">→ 返回 −1</text>
  <path d="M561,394 L561,483 L357,483" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="285" y="470" width="70" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="487" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 底部要点 -->
  <rect x="60" y="510" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="524" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 第三趟必须按 nums 原序从左到右扫，命中立即返回</text>
  <text x="320" y="538" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">返回的是元素值本身（不是下标、不是频率），无命中返回 −1</text>
</svg>
