<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1：3×4 网格里两个 3×3 窗口，只有一个合格</text>

  <!-- 网格 -->
  <g filter="url(#rough2)">
    <rect x="50" y="56" width="160" height="120" rx="4" fill="#f2f6fc" stroke="#446688" stroke-width="1.4"/>
    <path d="M90,56 L90,176 M130,56 L130,176 M170,56 L170,176 M50,96 L210,96 M50,136 L210,136"
          stroke="#446688" stroke-width="1.1"/>
    <text x="70" y="80" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <text x="110" y="80" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <text x="150" y="80" text-anchor="middle" font-size="12" fill="#2f4a66">8</text>
    <text x="190" y="80" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <text x="70" y="120" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
    <text x="110" y="120" text-anchor="middle" font-size="12" fill="#2f4a66">5</text>
    <text x="150" y="120" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
    <text x="190" y="120" text-anchor="middle" font-size="12" fill="#2f4a66">9</text>
    <text x="70" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <text x="110" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">7</text>
    <text x="150" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">6</text>
    <text x="190" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>

    <rect x="50" y="56" width="120" height="120" fill="none" stroke="#4a7a3a" stroke-width="3"/>
    <rect x="90" y="56" width="120" height="120" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4"/>
    <text x="110" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a">窗口 1（列 0-2）</text>
    <text x="170" y="214" text-anchor="middle" font-size="11" fill="#b85450">窗口 2（列 1-3）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="240" y="52" width="256" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="368" y="76" text-anchor="middle" font-size="12" fill="#2f5527">窗口 1：4 3 8 / 9 5 1 / 2 7 6</text>
    <text x="368" y="96" text-anchor="middle" font-size="12" fill="#2f5527">恰为 1..9，中心 5，八线和均 15</text>
    <text x="368" y="116" text-anchor="middle" font-size="13" fill="#4a7a3a">✓ 计入答案</text>

    <rect x="240" y="140" width="256" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="368" y="164" text-anchor="middle" font-size="12" fill="#8a3020">窗口 2：3 8 4 / 5 1 9 / 7 6 2</text>
    <text x="368" y="184" text-anchor="middle" font-size="12" fill="#8a3020">中心为 1（不是 5），且 3+1+2 = 6 ≠ 15</text>
    <text x="368" y="204" text-anchor="middle" font-size="13" fill="#b85450">✗ 不计入</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="252" width="380" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="276" text-anchor="middle" font-size="12" fill="#7a5a10">答案 = 1：窗口 1 合格，窗口 2 因中心不为 5、对角线不为 15 被否</text>
    <text x="260" y="298" text-anchor="middle" font-size="12" fill="#7a5a10">注意 grid 允许出现 0..15，但窗口内必须恰为 1..9 且中心为 5</text>
  </g>
</svg>
