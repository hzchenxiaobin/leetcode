<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">反向 BFS：从终局倒推每个状态的结果</text>
  <rect x="150" y="56" width="340" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="81.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">终局入队：m=0 → 鼠胜；m=c → 猫胜</text>
  <rect x="150" y="118" width="340" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="143.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">建反向边：每条「一步转移」p → s 都登记 p</text>
  <rect x="150" y="180" width="340" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="210.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取队首 s：对每个前驱 p——若走子方与胜者一致，p 也胜</text>
  <rect x="150" y="250" width="340" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="280.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">否则 p 的「未定走法数」减一；减到 0 说明必败</text>
  <rect x="150" y="320" width="340" height="42" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="345.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">始终未定的状态即平局（返回 0）</text>
  <path d="M 320,98 L 320,118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,160 L 320,180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,234 L 320,250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 320,304 L 320,320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
