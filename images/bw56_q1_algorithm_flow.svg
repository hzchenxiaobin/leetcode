<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双重枚举 + 整数平方根判定</text>

  <g filter="url(#rough2)">
    <rect x="180" y="52" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="75" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">ans = 0</text>
  <path d="M 280 90 L 280 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="108" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="131" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">外层 a：从 1 到 n</text>
  <path d="M 280 146 L 280 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="164" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="187" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">内层 b：从 1 到 n</text>
  <path d="M 280 202 L 280 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="220" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="243" text-anchor="middle" font-size="12.5" fill="#8a6a1a" filter="url(#rough2)">s = a² + b²；c = isqrt(s)</text>
  <path d="M 280 258 L 280 272" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,278 370,308 280,338 190,308" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">c·c == s 且 c ≤ n？</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">（回代验证防浮点差一）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="292" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="110" y="313" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">ans++</text>
  <path d="M 190 308 L 164 308" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="298" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 110 326 C 40 348 60 186 144 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 366 300 C 470 250 450 190 414 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="430" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 → 下一个 b</text>

  <g filter="url(#rough2)">
    <rect x="150" y="356" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="379" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">循环结束 → 返回 ans</text>
  <path d="M 256 338 C 240 346 250 352 262 356" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="379" font-size="11.5" fill="#888" filter="url(#rough2)">O(n²)，n ≤ 250</text>
  <text x="470" y="395" font-size="11.5" fill="#888" filter="url(#rough2)">约 6 万对</text>
</svg>
