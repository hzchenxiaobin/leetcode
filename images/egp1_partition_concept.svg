<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：两侧和相等 ⇔ 某一侧前缀和 = S/2</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left panel: horizontal cut ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="66" width="400" height="240" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="250" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">水平分割 → 看行前缀和</text>

  <!-- 2x2 grid [[1,4],[2,3]], cell 56, origin (120,110) -->
  <g filter="url(#sk)"><rect x="120" y="110" width="56" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="176" y="110" width="56" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="120" y="166" width="56" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="176" y="166" width="56" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4"/></g>
  <text x="148" y="145" text-anchor="middle" font-size="17" fill="#333">1</text>
  <text x="204" y="145" text-anchor="middle" font-size="17" fill="#333">4</text>
  <text x="148" y="201" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="204" y="201" text-anchor="middle" font-size="17" fill="#333">3</text>

  <!-- horizontal dashed cut -->
  <path d="M 96 166 L 260 166" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="250" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">上半 = 1+4 = 5</text>
  <text x="250" y="222" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">下半 = 2+3 = 5</text>
  <text x="106" y="100" font-size="11" fill="#888">R₀ = 5</text>
  <text x="106" y="244" font-size="11" fill="#888">R₁ = 5</text>
  <text x="250" y="270" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">切点 i：上半 = R₀+…+R_{i-1} = target ✓</text>
  <text x="250" y="292" text-anchor="middle" font-size="11" fill="#666">切点范围 i ∈ [1, m-1]，保证两部分非空</text>

  <!-- ===== Right panel: vertical cut ===== -->
  <g filter="url(#sk)">
    <rect x="490" y="66" width="400" height="240" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="690" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">垂直分割 → 看列前缀和</text>

  <!-- 2x2 grid [[3,2],[2,3]], cell 56, origin (570,110) -->
  <g filter="url(#sk)"><rect x="570" y="110" width="56" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="626" y="110" width="56" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="570" y="166" width="56" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <g filter="url(#sk)"><rect x="626" y="166" width="56" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4"/></g>
  <text x="598" y="145" text-anchor="middle" font-size="17" fill="#333">3</text>
  <text x="654" y="145" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="598" y="201" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="654" y="201" text-anchor="middle" font-size="17" fill="#333">3</text>

  <!-- vertical dashed cut -->
  <path d="M 626 86 L 626 250" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="560" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">左半 = 3+2 = 5</text>
  <text x="700" y="270" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">右半 = 2+3 = 5</text>
  <text x="556" y="102" font-size="11" fill="#888">C₀ = 5</text>
  <text x="688" y="102" font-size="11" fill="#888">C₁ = 5</text>
  <text x="690" y="292" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">切点 j：左半 = C₀+…+C_{j-1} = target ✓</text>

  <!-- ===== Bottom: total / parity / monotonicity ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="326" width="840" height="120" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="76" y="352" font-size="13" font-weight="bold" fill="#7a5415">总和与奇偶：</text>
  <text x="180" y="352" font-size="12" fill="#444">S = 全部元素之和。两侧相等 ⇒ 各为 S/2 ⇒ S 必须是偶数，否则直接返回 false</text>
  <text x="76" y="380" font-size="12" fill="#444">示例中 S = 10（偶数），target = S/2 = 5，上面两个矩阵都恰好能在某方向切出 5</text>
  <text x="76" y="410" font-size="13" font-weight="bold" fill="#7a5415">单调性（加速）：</text>
  <text x="180" y="410" font-size="12" fill="#444">元素全为正 ⇒ 行/列前缀和随切点严格递增 ⇒ 每个方向至多 1 个可行切点</text>
  <text x="180" y="432" font-size="12" fill="#444">扫描中一旦前缀超过 target，后面的切点只会更大，可立即终止该方向</text>
</svg>
