<svg xmlns="http://www.w3.org/2000/svg" width="660" height="410" viewBox="0 0 660 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="519" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="660" height="410" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：分桶 → 后缀归并 → 单点二分</text>
  <path d="M 180 40 Q 330 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="60" width="300" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="60" y="84" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#sk)">① 按 hᵢ 分桶</text>
  <text x="60" y="106" font-size="12" fill="#333" filter="url(#sk)">equal[h] ← { lᵢ : hᵢ = h }，共 100 个桶</text>
  <line x1="190" y1="122" x2="190" y2="142" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="146" width="300" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="60" y="170" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">② 后缀归并（h 从 100 到 1）</text>
  <text x="60" y="192" font-size="12" fill="#333" filter="url(#sk)">buckets[h] ← merge(equal[h], buckets[h+1])</text>
  <line x1="190" y1="208" x2="190" y2="228" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="232" width="300" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="60" y="256" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">③ 二分查询（核心步骤）</text>
  <text x="60" y="278" font-size="12" fill="#333" filter="url(#sk)">ans[j] = len(buckets[yⱼ]) − bisect_left(buckets[yⱼ], xⱼ)</text>
  <line x1="190" y1="294" x2="190" y2="312" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="110" y="316" width="160" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="190" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a35" filter="url(#sk)">④ 返回 count</text>

  <g filter="url(#sk)">
    <rect x="370" y="60" width="258" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="386" y="84" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#sk)">为什么要后缀归并？</text>
  <g font-size="11.5" fill="#333">
    <text x="386" y="106" filter="url(#sk)">hᵢ ≥ y 的矩形散落在 equal[y..100]</text>
    <text x="386" y="126" filter="url(#sk)">逐桶二分 = 每次查询要做 100 回二分</text>
    <text x="386" y="146" filter="url(#sk)">归并成后缀桶 buckets[y] 后</text>
    <text x="386" y="166" font-weight="bold" fill="#446688" filter="url(#sk)">→ 一次二分出答案</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="194" width="258" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="386" y="218" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">为什么用 bisect_left？</text>
  <g font-size="11.5" fill="#333">
    <text x="386" y="240" filter="url(#sk)">要数「lᵢ ≥ x」的个数（下界）</text>
    <text x="386" y="260" filter="url(#sk)">lᵢ = x：点在矩形的右边上，也算包含</text>
    <text x="386" y="280" filter="url(#sk)">误用 bisect_right 会把 lᵢ = x 漏掉</text>
    <text x="386" y="300" font-weight="bold" fill="#b85450" filter="url(#sk)">→ 边界点必错，见 §8</text>
  </g>

  <g filter="url(#sk)">
    <rect x="20" y="366" width="620" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">时间 O(100·n + q·log n)，空间 O(100·n) —— n = 5×10⁴，至多约 5×10⁶ 个整数</text>
</svg>
