<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1：星形树（中心 2）——15 个非空子集的完整归类</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ left: star tree ============ -->
  <g filter="url(#sk)">
    <path d="M 75 100 L 150 165" stroke="#3a3a3a" stroke-width="1.6" fill="none"/>
    <path d="M 225 100 L 150 165" stroke="#3a3a3a" stroke-width="1.6" fill="none"/>
    <path d="M 150 165 L 150 245" stroke="#3a3a3a" stroke-width="1.6" fill="none"/>
    <circle cx="75" cy="100" r="16" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="225" cy="100" r="16" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="150" cy="165" r="16" fill="#4a8edb" stroke="#33669c" stroke-width="1.6"/>
    <circle cx="150" cy="245" r="16" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="75" y="105" text-anchor="middle" font-size="13" fill="#333333">1</text>
  <text x="225" y="105" text-anchor="middle" font-size="13" fill="#333333">3</text>
  <text x="150" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="150" y="250" text-anchor="middle" font-size="13" fill="#333333">4</text>
  <text x="160" y="276" text-anchor="middle" font-size="11.5" fill="#666666">中心 2 是枢纽：不含 2 的多点子集必不连通</text>

  <!-- ============ left: dist matrix ============ -->
  <text x="160" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">dist 矩阵（预计算一次）</text>
  <g filter="url(#sk)">
    <rect x="100" y="312" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="124" y="312" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="148" y="312" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="172" y="312" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="196" y="312" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="112" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">dist</text>
  <text x="136" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="160" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="184" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="208" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">4</text>

  <g filter="url(#sk)">
    <rect x="100" y="333" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="100" y="354" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="100" y="375" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="100" y="396" width="24" height="21" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="112" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="112" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="112" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="112" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">4</text>

  <!-- value cells, 4x4 -->
  <g filter="url(#sk)">
    <rect x="124" y="333" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="148" y="333" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="172" y="333" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="196" y="333" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="124" y="354" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="148" y="354" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="172" y="354" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="196" y="354" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="124" y="375" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="148" y="375" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="172" y="375" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="196" y="375" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="124" y="396" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="148" y="396" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="172" y="396" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <rect x="196" y="396" width="24" height="21" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="136" y="348" text-anchor="middle" font-size="11" fill="#999999">0</text>
  <text x="160" y="348" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="184" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="208" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="136" y="369" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="160" y="369" text-anchor="middle" font-size="11" fill="#999999">0</text>
  <text x="184" y="369" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="208" y="369" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="136" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="160" y="390" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="184" y="390" text-anchor="middle" font-size="11" fill="#999999">0</text>
  <text x="208" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="136" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="160" y="411" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="184" y="411" text-anchor="middle" font-size="11" font-weight="bold" fill="#b08020">2</text>
  <text x="208" y="411" text-anchor="middle" font-size="11" fill="#999999">0</text>

  <!-- ============ right: classification table ============ -->
  <text x="355" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">归类</text>
  <text x="472" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">子集（城市集合）</text>
  <text x="585" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">直径 / 去向</text>
  <path d="M 315 90 Q 467 96 620 90" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="310" y="98" width="315" height="48" rx="6" fill="#f2f2f2" stroke="#cccccc" stroke-width="1.2"/>
  </g>
  <text x="355" y="126" text-anchor="middle" font-size="11.5" fill="#555555">单点 ×4</text>
  <text x="472" y="126" text-anchor="middle" font-size="11.5" fill="#555555">{1} {2} {3} {4}</text>
  <text x="585" y="126" text-anchor="middle" font-size="11.5" fill="#555555">直径 0 → 不计</text>

  <g filter="url(#sk)">
    <rect x="310" y="152" width="315" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="355" y="174" text-anchor="middle" font-size="11.5" fill="#b85450">不连通 ×4</text>
  <text x="472" y="174" text-anchor="middle" font-size="11.5" fill="#333333">{1,3} {1,4} {3,4}</text>
  <text x="472" y="194" text-anchor="middle" font-size="11.5" fill="#333333">{1,3,4}</text>
  <text x="585" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">跳过</text>

  <g filter="url(#sk)">
    <rect x="310" y="214" width="315" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="355" y="242" text-anchor="middle" font-size="11.5" fill="#2e6e2e">子树 ×3</text>
  <text x="472" y="242" text-anchor="middle" font-size="11.5" fill="#333333">{1,2} {2,3} {2,4}</text>
  <text x="585" y="234" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">d = 1</text>
  <text x="585" y="252" text-anchor="middle" font-size="11.5" fill="#2e6e2e">→ ans[0]</text>

  <g filter="url(#sk)">
    <rect x="310" y="268" width="315" height="56" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="355" y="296" text-anchor="middle" font-size="11.5" fill="#2b6e9e">子树 ×4</text>
  <text x="472" y="296" text-anchor="middle" font-size="11.5" fill="#333333">{1,2,3} {1,2,4}</text>
  <text x="472" y="316" text-anchor="middle" font-size="11.5" fill="#333333">{2,3,4} {1,2,3,4}</text>
  <text x="585" y="298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">d = 2</text>
  <text x="585" y="316" text-anchor="middle" font-size="11.5" fill="#2b6e9e">→ ans[1]</text>

  <g filter="url(#sk)">
    <rect x="310" y="330" width="315" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4"/>
  </g>
  <text x="355" y="356" text-anchor="middle" font-size="11.5" fill="#8a6415">子树 ×0</text>
  <text x="472" y="356" text-anchor="middle" font-size="11.5" fill="#999999">（不存在）</text>
  <text x="585" y="356" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">ans[2] = 0</text>

  <!-- ============ bottom band ============ -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="560" height="34" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
  </g>
  <text x="320" y="443" text-anchor="middle" font-size="11.5" fill="#333333">对账：4（单点）+ 4（不连通）+ 3 + 4（子树）= 15 个非空子集</text>
  <text x="320" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = [3, 4, 0]，其中 ans[d − 1] = 直径为 d 的子树数 ✓</text>
</svg>
