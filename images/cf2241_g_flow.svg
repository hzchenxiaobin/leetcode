<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：每个左端点 l 只做一次二分</text>

  <rect x="245" y="50" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" fill="#22335a" filter="url(#rough2)">对每个左端点 l</text>

  <path d="M320,90 L320,120" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"
        fill="none" filter="url(#rough2)"/>

  <rect x="190" y="122" width="300" height="52" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="154" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">gcd(a[l+1..n−1]) mod a_l == 0 ?</text>

  <path d="M190,148 L140,148" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"
        fill="none" filter="url(#rough2)"/>
  <text x="165" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="18" y="124" width="118" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="77" y="146" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">该 l 恒为 0</text>
  <text x="77" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（跳到下个 l）</text>

  <path d="M340,174 L340,210" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"
        fill="none" filter="url(#rough2)"/>
  <text x="352" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="212" width="330" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="235" text-anchor="middle" font-size="12.5" fill="#2f5424" filter="url(#rough2)">二分最小的 j：gcd(a[l+1..j]) 不是</text>
  <text x="315" y="252" text-anchor="middle" font-size="12.5" fill="#2f5424" filter="url(#rough2)">a_l 的倍数（即 a_l ∤ a_j）</text>

  <path d="M315,262 L315,296" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"
        fill="none" filter="url(#rough2)"/>

  <rect x="170" y="298" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="327" text-anchor="middle" font-size="12.5" fill="#22335a" filter="url(#rough2)">r = a_j mod a_l ，d = min(r, a_l − r)</text>

  <path d="M320,344 L320,378" stroke="#666" stroke-width="1.5" marker-end="url(#arr3)"
        fill="none" filter="url(#rough2)"/>

  <rect x="170" y="380" width="300" height="46" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="409" text-anchor="middle" font-size="13" fill="#7a2a26" filter="url(#rough2)">ans += d × (n − j + 1)</text>

  <text x="320" y="454" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">稀疏表 O(1) 求区间 gcd ⇒ 总体 O(n log n)</text>
</svg>
