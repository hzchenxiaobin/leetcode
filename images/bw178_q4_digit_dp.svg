<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="424" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">数位 DP：按「第一个小于 N 的位」把 [0, N] 切块</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">N = 12340 为例，每块 = 固定前缀 + 当前位取小 + 剩余位任意</text>
  <rect x="150" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172.0" y="84.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="172" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第0位</text>
  <rect x="202" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224.0" y="84.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="224" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第1位</text>
  <rect x="254" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276.0" y="84.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="276" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第2位</text>
  <rect x="306" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328.0" y="84.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="328" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第3位</text>
  <rect x="358" y="62" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380.0" y="84.5" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="380" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">第4位</text>
  <text x="120" y="86" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">N =</text>
  <rect x="36" y="140" width="488" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="160" text-anchor="start" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 0 位取 0</text>
  <text x="50" y="178" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">前缀「空」+ 0，后 4 位任意  →  代表 0～999 这些更短的数字</text>
  <rect x="36" y="198" width="488" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="218" text-anchor="start" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 0 位 = 1，第 1 位 &lt; 2</text>
  <text x="50" y="236" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">前缀「1」+ 0/1，后 3 位任意  →  代表 10000～11999</text>
  <rect x="36" y="256" width="488" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="276" text-anchor="start" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">前缀「12」，第 2 位 &lt; 3</text>
  <text x="50" y="294" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">12 + 0/1/2，后 2 位任意  →  代表 12000～12299</text>
  <rect x="36" y="314" width="488" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="334" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">每一块的计数方式</text>
  <text x="48" y="352" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">若剩余位数为 m、还差数位和 s，则块内数量 = ways[m][s]</text>
  <text x="48" y="370" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">ways[m][s] = 用 m 个 0–9 的数位凑出和 s 的方案数（可重复、可前导零）</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">块的求和再按 good_sums 过滤 → 得到 ≤ N 的「数位和好数」个数</text>
</svg>
