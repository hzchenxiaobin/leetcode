<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：预计算行/列和 + 逐格三条件判定</text>

  <!-- start -->
  <rect x="150" y="44" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：读入 mat（m × n）</text>

  <path d="M 260 78 L 260 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- pass 1 -->
  <rect x="140" y="94" width="240" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 一趟遍历矩阵</text>
  <text x="260" y="131" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">同步累加 rowSum、colSum</text>

  <path d="M 260 140 L 260 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop start -->
  <rect x="170" y="158" width="180" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 取下一个格子 (i, j)</text>

  <path d="M 260 190 L 260 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="260,208 434,252 260,296 86,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">mat[i][j] == 1 且</text>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">rowSum[i] == 1 且 colSum[j] == 1 ?</text>

  <!-- yes branch -->
  <path d="M 260 296 L 260 312" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="308" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="180" y="314" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += 1</text>

  <!-- no branch -->
  <path d="M 434 252 L 456 252" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="444" y="242" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- no path merges into done box -->
  <path d="M 456 252 L 456 382 L 354 382" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ans++ to done -->
  <path d="M 260 348 L 260 362" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- done? box -->
  <rect x="170" y="364" width="180" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">格子全检查完了？</text>

  <!-- loop back -->
  <path d="M 170 380 L 48 380 L 48 174 L 166 174" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="54" y="340" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否，下一格</text>

  <path d="M 260 396 L 260 412" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="408" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- return -->
  <rect x="170" y="414" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="48" y="460" width="424" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="479" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(m·n)：两趟扫描；额外空间 O(m+n)：行和、列和数组</text>
</svg>
