<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">平局规则（下标最小者赢）→ 左右边界不对称</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: left tie ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="420" height="380" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="250" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">场景 A：左侧出现并列</text>

  <g filter="url(#sk)"><rect x="120" y="122" width="80" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="160" y="151" text-anchor="middle" font-size="14" fill="#333">ps=5</text>
  <g filter="url(#sk)"><rect x="250" y="122" width="80" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="290" y="151" text-anchor="middle" font-size="14" fill="#2e6e2e">ps=5</text>
  <text x="160" y="182" text-anchor="middle" font-size="10.5" fill="#a5741a" font-weight="bold">j（下标小）</text>
  <text x="290" y="182" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">i（下标大）</text>

  <path d="M 115 188 L 112 196 L 338 196 L 335 188" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="225" y="216" text-anchor="middle" font-size="11" fill="#666">子数组同时包含并列的 j 和 i</text>

  <g filter="url(#sk)"><rect x="80" y="230" width="340" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="250" y="257" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">并列 → 取下标最小 → j 赢，i 输</text>

  <text x="250" y="302" text-anchor="middle" font-size="12" fill="#444">i 的左边界必须停在 j 之前：</text>
  <text x="250" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">L[i] = 左侧最近的 ps[j] ≥ ps[i]</text>

  <g filter="url(#sk)"><rect x="70" y="350" width="360" height="80" rx="8" fill="#f6f8fa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="86" y="374" font-size="11.5" fill="#333" font-family="monospace">while (!st.empty() &amp;&amp;</text>
  <text x="102" y="392" font-size="11.5" fill="#333" font-family="monospace">ps[st.top()] &lt; ps[i]) st.pop();</text>
  <text x="86" y="416" font-size="10.5" fill="#a5741a">// 严格小的才弹；相等者留下当左边界</text>

  <!-- ===== Panel B: right tie ===== -->
  <g filter="url(#sk)">
    <rect x="480" y="70" width="420" height="380" rx="10" fill="#eef7ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="690" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">场景 B：右侧出现并列</text>

  <g filter="url(#sk)"><rect x="560" y="122" width="80" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="600" y="151" text-anchor="middle" font-size="14" fill="#2e6e2e">ps=5</text>
  <g filter="url(#sk)"><rect x="690" y="122" width="80" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="730" y="151" text-anchor="middle" font-size="14" fill="#333">ps=5</text>
  <text x="600" y="182" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">i（下标小）</text>
  <text x="730" y="182" text-anchor="middle" font-size="10.5" fill="#a5741a" font-weight="bold">j（下标大）</text>

  <path d="M 555 188 L 552 196 L 778 196 L 775 188" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="665" y="216" text-anchor="middle" font-size="11" fill="#666">子数组同时包含并列的 i 和 j</text>

  <g filter="url(#sk)"><rect x="520" y="230" width="340" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="690" y="257" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">并列 → 取下标最小 → i 赢，j 输</text>

  <text x="690" y="302" text-anchor="middle" font-size="12" fill="#444">i 的右边界可以越过 j 继续延伸：</text>
  <text x="690" y="330" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">R[i] = 右侧最近的 ps[j] &gt; ps[i]</text>

  <g filter="url(#sk)"><rect x="510" y="350" width="360" height="80" rx="8" fill="#f6f8fa" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="526" y="374" font-size="11.5" fill="#333" font-family="monospace">while (!st.empty() &amp;&amp;</text>
  <text x="542" y="392" font-size="11.5" fill="#333" font-family="monospace">ps[st.top()] &lt;= ps[i]) st.pop();</text>
  <text x="526" y="416" font-size="10.5" fill="#2e6e2e">// 相等也弹；只有严格更大者才拦住</text>

  <!-- ===== Bottom: self-check ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="476" width="860" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="60" y="502" font-size="12.5" font-weight="bold" fill="#2b2b2b">⚠ 自检恒等式：Σ cnt[i] = n(n+1)/2</text>
  <text x="60" y="526" font-size="11.5" fill="#444">两侧符号若写成同一个（都取 ≥ 或都取 &gt;）→ 并列子数组会被 2 个或 0 个元素同时认领，恒等式破坏。</text>
  <text x="60" y="548" font-size="11.5" fill="#444">验证示例：nums = [8,3,9,3,8]（ps 全为 1，全并列）→ L=[-1,0,1,2,3]，R=[5,5,5,5,5]</text>
  <text x="60" y="570" font-size="11.5" fill="#2e6e2e" font-weight="bold">→ cnt = [5,4,3,2,1]，Σ = 15 = 5×6/2 ✓</text>
</svg>
