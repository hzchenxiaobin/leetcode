<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：逐字符扫描，首次唯一即落刀</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: example string and cuts ===== -->
  <text x="60" y="70" font-size="13" font-weight="bold" fill="#2b6e9e">① 示例：s = "abbccccd"（彩色条 = 切出的段，红色虚线 = 落刀处）</text>

  <!-- char boxes -->
  <g font-size="13">
    <g filter="url(#sk)"><rect x="112" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="139" y="107" text-anchor="middle" fill="#333">a</text>
    <g filter="url(#sk)"><rect x="166" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="193" y="107" text-anchor="middle" fill="#333">b</text>
    <g filter="url(#sk)"><rect x="220" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="247" y="107" text-anchor="middle" fill="#333">b</text>
    <g filter="url(#sk)"><rect x="274" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="301" y="107" text-anchor="middle" fill="#333">c</text>
    <g filter="url(#sk)"><rect x="328" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="355" y="107" text-anchor="middle" fill="#333">c</text>
    <g filter="url(#sk)"><rect x="382" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="409" y="107" text-anchor="middle" fill="#333">c</text>
    <g filter="url(#sk)"><rect x="436" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="463" y="107" text-anchor="middle" fill="#333">c</text>
    <g filter="url(#sk)"><rect x="490" y="84" width="54" height="36" fill="#f7f5ee" stroke="#999" stroke-width="1.1"/></g>
    <text x="517" y="107" text-anchor="middle" fill="#333">d</text>
  </g>

  <!-- cut marks -->
  <g stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)">
    <path d="M 166 80 L 166 124"/>
    <path d="M 220 80 L 220 124"/>
    <path d="M 328 80 L 328 124"/>
    <path d="M 382 80 L 382 124"/>
    <path d="M 490 80 L 490 124"/>
  </g>

  <!-- segment strips -->
  <g filter="url(#sk)"><rect x="112" y="126" width="54" height="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="166" y="126" width="54" height="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="220" y="126" width="108" height="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="328" y="126" width="54" height="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="382" y="126" width="108" height="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="490" y="126" width="54" height="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>

  <!-- segment names -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="139" y="156" fill="#2b6e9e">"a"</text>
    <text x="193" y="156" fill="#2e6e2e">"b"</text>
    <text x="274" y="156" fill="#7a5415">"bc"</text>
    <text x="355" y="156" fill="#2b6e9e">"c"</text>
    <text x="436" y="156" fill="#2e6e2e">"cc"</text>
    <text x="517" y="156" fill="#7a5415">"d"</text>
  </g>
  <text x="300" y="156" text-anchor="middle" font-size="10" fill="#888">← b 重复，吸收 c 才变唯一</text>
  <text x="472" y="156" text-anchor="middle" font-size="10" fill="#888">← c 重复 → "cc"</text>

  <!-- seen set box -->
  <path d="M 556 131 L 596 131" stroke="#888" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="600" y="84" width="300" height="100" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="620" y="108" font-size="12" font-weight="bold" fill="#7a5415">seen：已切出的段（互不相同）</text>
  <text x="620" y="134" font-size="12" fill="#444" font-family="monospace">{ "a", "b", "bc", "c", "cc", "d" }</text>
  <text x="620" y="160" font-size="10" fill="#888">哈希集合：单次查询 O(1) 次比较</text>

  <!-- ===== Panel 2: the one question ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="210" width="820" height="118" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="234" font-size="13" font-weight="bold" fill="#2b6e9e">② 每读一个字符，只问一个问题：cur ∈ seen ?</text>
  <g filter="url(#sk)">
    <rect x="90" y="250" width="350" height="60" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="110" y="274" font-size="12" font-weight="bold" fill="#b03a3a">是（重复）</text>
  <text x="110" y="296" font-size="11" fill="#444">不切分：cur 继续吸收下一字符，段向右生长</text>
  <g filter="url(#sk)">
    <rect x="500" y="250" width="350" height="60" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="520" y="274" font-size="12" font-weight="bold" fill="#2e6e2e">否（首次唯一）</text>
  <text x="520" y="296" font-size="11" fill="#444">立即落刀：ans ← cur，seen ← cur，cur 清空</text>

  <!-- ===== Panel 3: length bound ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="348" width="820" height="150" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="372" font-size="13" font-weight="bold" fill="#2e6e2e">③ 为什么不会超时？—— 段长上界 O(√n)</text>
  <text x="80" y="398" font-size="11" fill="#444">长为 L 的段在定稿前，其长度 1..L−1 的每个前缀都已是更早切出的段（前缀封闭性）</text>
  <text x="80" y="424" font-size="11" fill="#444">这些前缀两两不同，且所有段互不重叠 → 1 + 2 + … + (L−1) ≤ n → L = O(√n)</text>
  <text x="80" y="450" font-size="11" fill="#444">哈希查找共 n 次、每次 O(√n) → 时间 O(n·√n)，n = 10⁵ 全同字符最坏 ≈ 3×10⁷ 字符操作</text>
  <text x="80" y="478" font-size="10" fill="#888">★ 想严格线性：把 seen 换成 Trie（节点不存在或未标终点 = 首次唯一），每字符 O(1)</text>

  <!-- ===== insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="520" width="820" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="546" font-size="12" font-weight="bold" fill="#2b2b2b">关键洞察</text>
  <text x="80" y="570" font-size="11" fill="#444">过程完全确定：每一步只有一个分叉「cur 是否出现过」→ 无需搜索 / DP，单趟模拟即是正解</text>
  <text x="80" y="592" font-size="11" fill="#2e6e2e" font-weight="bold">模板：哈希集合当「已出现字典」，见到新词就落刀</text>
</svg>
