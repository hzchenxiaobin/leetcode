<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：值域 ≤ 10⁵ → 直接寻址；升序扫描白嫖「并列取最小」</text>
  <path d="M 110 44 Q 340 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="90" y="58" width="500" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#sk)">0 ≤ nums[i] ≤ 10⁵ ⟹ cnt[100001] 直接当哈希表</text>
  <text x="340" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">cnt[x]++ 一步聚合频次：无哈希函数、无冲突、缓存友好</text>

  <g filter="url(#sk)"><path d="M 200 128 L 200 152" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 480 128 L 480 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="42" y="158" width="292" height="172" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="188" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">升序扫描偶下标 v = 0, 2, 4, …</text>
  <text x="188" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">(v=0, c=1)：1 &gt; 0 ✓ ⟹ ans = 0</text>
  <text x="188" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">(v=2, c=2)：2 &gt; 1 ✓ ⟹ ans = 2</text>
  <text x="188" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">(v=4, c=2)：2 &gt; 2 ✗ 不覆盖</text>
  <text x="188" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">并列时后到者（更大值）过不了严格 &gt;</text>
  <text x="188" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">先到的更小值白嫖胜出</text>

  <g filter="url(#sk)"><rect x="346" y="158" width="292" height="172" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="492" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">双键 (频次最大, 值最小) 的两种付法</text>
  <text x="492" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">哈希版：显式双键分支</text>
  <text x="492" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">c &gt; best ∨ (c = best ∧ v &lt; ans)</text>
  <text x="492" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">值域版：扫描顺序本身就是副键</text>
  <text x="492" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">副键比较被「按下标升序」取代</text>
  <text x="492" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">一个 if 只比频次，值序免费</text>

  <g filter="url(#sk)"><rect x="42" y="348" width="292" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="188" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">best = 0, ans = -1 兜底</text>
  <text x="188" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">全奇数时偶下标 cnt 全为 0</text>
  <text x="188" y="422" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0 &gt; 0 恒假，循环空转</text>
  <text x="188" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">⟹ 天然返回 -1，零特判</text>

  <g filter="url(#sk)"><rect x="346" y="348" width="292" height="110" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="492" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">易错：0 与 10⁵ 都是偶数！</text>
  <text x="492" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">0 mod 2 = 0，参与计数与竞选</text>
  <text x="492" y="422" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">值域上界 10⁵ 也是偶数</text>
  <text x="492" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">⟹ 数组必须开 100001 个格子</text>
</svg>
