<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">不足节点：只看“经过它的路径和”的最大值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">node 不足 ⟺ 经过 node 的每条根-叶路径和都 &lt; limit ⟺ 这些路径和的最大值 &lt; limit</text>

  <g stroke="#446688" stroke-width="1.5" fill="none">
    <path filter="url(#rough2)" d="M 280 88 L 155 148"/>
    <path filter="url(#rough2)" d="M 280 88 L 405 148"/>
    <path filter="url(#rough2)" d="M 155 168 L 90 230"/>
    <path filter="url(#rough2)" d="M 405 168 L 350 228"/>
    <path filter="url(#rough2)" d="M 405 168 L 468 228"/>
    <path filter="url(#rough2)" d="M 90 250 L 52 306"/>
    <path filter="url(#rough2)" d="M 90 250 L 136 306"/>
    <path filter="url(#rough2)" d="M 468 250 L 430 306"/>
    <path filter="url(#rough2)" d="M 468 250 L 503 306"/>
  </g>

  <g text-anchor="middle" font-size="12" font-weight="bold">
    <circle filter="url(#rough2)" cx="280" cy="72" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="280" y="77" fill="#3a4a66">5</text>

    <circle filter="url(#rough2)" cx="150" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="150" y="163" fill="#3a4a66">4</text>

    <circle filter="url(#rough2)" cx="410" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="410" y="163" fill="#3a4a66">8</text>

    <circle filter="url(#rough2)" cx="85" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="85" y="245" fill="#3a4a66">11</text>

    <circle filter="url(#rough2)" cx="350" cy="240" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="350" y="245" fill="#3a5a30">17</text>

    <circle filter="url(#rough2)" cx="470" cy="240" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="470" y="245" fill="#3a4a66">4</text>

    <circle filter="url(#rough2)" cx="45" cy="316" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="45" y="321" fill="#3a5a30">7</text>

    <circle filter="url(#rough2)" cx="143" cy="316" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <text filter="url(#rough2)" x="143" y="321" fill="#a04040">1</text>

    <circle filter="url(#rough2)" cx="425" cy="316" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="425" y="321" fill="#3a5a30">5</text>

    <circle filter="url(#rough2)" cx="508" cy="316" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <text filter="url(#rough2)" x="508" y="321" fill="#a04040">3</text>
  </g>

  <g font-size="11" text-anchor="middle" font-weight="bold">
    <text filter="url(#rough2)" x="45" y="349" fill="#4a7a3a">27</text>
    <text filter="url(#rough2)" x="143" y="349" fill="#b85450">21 ✗</text>
    <text filter="url(#rough2)" x="350" y="272" fill="#4a7a3a">30</text>
    <text filter="url(#rough2)" x="425" y="349" fill="#4a7a3a">22</text>
    <text filter="url(#rough2)" x="508" y="349" fill="#b85450">20 ✗</text>
  </g>

  <rect x="24" y="358" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">叶旁数字 = 根到该叶的路径和（limit = 22）：21、20 两条路径不足 ⇒ 删叶 1 与 3</text>
</svg>
