<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">从 d1 半径到 startLen / endLen：桶 + 传播</text>

  <!-- 字符串格子 -->
  <text x="60" y="58" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s = "ababbb"：d1 = [1,2,2,1,2,1]，中心 1 → "aba"[0,2]，中心 4 → "bbb"[3,5]</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="70" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="130" y="70" width="40" height="36" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="170" y="70" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="210" y="70" width="40" height="36" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="250" y="70" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="290" y="70" width="40" height="36" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="110" y="94">a</text><text x="150" y="94">b</text><text x="190" y="94">a</text>
    <text x="230" y="94">b</text><text x="270" y="94">b</text><text x="310" y="94">b</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="110" y="120">0</text><text x="150" y="120">1</text><text x="190" y="120">2</text>
    <text x="230" y="120">3</text><text x="270" y="120">4</text><text x="310" y="120">5</text>
  </g>

  <!-- 左端点桶 -->
  <text x="60" y="156" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">bucket[lo] ← max(中心 c)：lo = c − d1[c] + 1</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="166" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="130" y="166" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="170" y="166" width="40" height="30" fill="#fff" stroke="#ccc" stroke-width="1.1" rx="4"/>
    <rect x="210" y="166" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="250" y="166" width="40" height="30" fill="#fff" stroke="#ccc" stroke-width="1.1" rx="4"/>
    <rect x="290" y="166" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8a6a1f" filter="url(#rough2)">
    <text x="110" y="186">1</text><text x="150" y="186">2</text><text x="190" y="186">−</text>
    <text x="230" y="186">4</text><text x="270" y="186">−</text><text x="310" y="186">5</text>
  </g>
  <text x="366" y="186" font-size="10.5" fill="#888" filter="url(#rough2)">bucket[0]=1（中心1 lo=0）</text>

  <!-- 传播 -->
  <path d="M 90 206 L 330 206" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">从左到右传播 max → best[i]（恒 ≥ i）</text>

  <!-- startLen -->
  <text x="60" y="252" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">startLen[i] = 2·(best[i] − i) + 1（以 i 开头的最长奇回文）</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="130" y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="170" y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="210" y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="250" y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="290" y="262" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2f5226" filter="url(#rough2)">
    <text x="110" y="282">3</text><text x="150" y="282">3</text><text x="190" y="282">1</text>
    <text x="230" y="282">3</text><text x="270" y="282">1</text><text x="310" y="282">1</text>
  </g>
  <text x="366" y="272" font-size="10.5" fill="#888" filter="url(#rough2)">i=0 开头 "aba"（中心1）</text>
  <text x="366" y="288" font-size="10.5" fill="#888" filter="url(#rough2)">i=1 开头 "bab"（中心2）</text>
  <text x="366" y="304" font-size="10.5" fill="#888" filter="url(#rough2)">i=3 开头 "bbb"（中心4）</text>

  <!-- 底部说明 -->
  <rect x="40" y="316" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">关键：若中心 c 的回文从 lo(c) ≤ i 开头，则以 i 开头、c 为中心</text>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">的子串 s[i..2c−i] 仍是回文（长 2(c−i)+1）——所以取最大中心即可</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">endLen 对称：bucket2[hi] ← min(中心)，从右到左传播</text>
</svg>
