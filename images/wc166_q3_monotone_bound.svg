<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">除数越大，每项向上取整后越小 —— 总和单调不增</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">答案 = 第一个使 S(d) ≤ threshold 的 d，即绿色可行区的最左端</text>

  <!-- 区域着色 -->
  <rect x="60" y="88" width="182" height="164" fill="#fce4ec" fill-opacity="0.45" stroke="none" filter="url(#rough2)"/>
  <rect x="242" y="88" width="258" height="164" fill="#e6f4ea" fill-opacity="0.7" stroke="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M60,252 H500" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M60,252 V88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶梯曲线 S(d)：17,10,7,7,5,5,5,5,4 -->
  <path d="M60,97 H112 V160 H164 V187 H268 V205 H476 V214 H500"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- 阈值线 -->
  <path d="M60,196 H500" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="498" y="190" text-anchor="end" font-size="11" fill="#8a6a20" filter="url(#rough2)">threshold = 6</text>

  <!-- 答案分界线 -->
  <path d="M242,88 V252" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="248" y="80" text-anchor="start" font-size="11.5" fill="#8c3b36" filter="url(#rough2)">← 答案 d = 5（最左可行点）</text>

  <!-- d 轴刻度 -->
  <g fill="#666" font-size="10.5" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="268">1</text>
    <text x="112" y="268">2</text>
    <text x="164" y="268">3</text>
    <text x="216" y="268">4</text>
    <text x="268" y="268">5</text>
    <text x="320" y="268">6</text>
    <text x="372" y="268">7</text>
    <text x="424" y="268">8</text>
    <text x="476" y="268">9</text>
  </g>

  <!-- 两个关键值标注 -->
  <text x="170" y="178" text-anchor="start" font-size="11" fill="#8c3b36" filter="url(#rough2)">S = 7</text>
  <text x="276" y="224" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">S(5) = 5</text>

  <!-- 说明框 -->
  <rect x="64" y="286" width="196" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="307" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">d = 4：1+1+2+3 = 7 &gt; 6</text>

  <rect x="300" y="286" width="196" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="307" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">d = 5：1+1+1+2 = 5 ≤ 6</text>

  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">单调不增 ⇒ 可行解构成后缀，二分下界找第一个可行 d</text>
</svg>
