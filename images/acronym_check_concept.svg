<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按序抽取首字符，与 s 逐位对齐</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula -->
  <g filter="url(#sk)">
    <rect x="90" y="56" width="460" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">s 是缩略词 ⇔ |words| = |s| 且每个 words[i][0] = s[i]</text>

  <!-- Column headers -->
  <text x="143" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">words（首字符标红）</text>
  <text x="377" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">s = "ngguoy"</text>

  <!-- Row 0: never -> n -->
  <g filter="url(#sk)">
    <rect x="58" y="132" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="132" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">n</text>
  <text x="143" y="150" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"never"</text>
  <path d="M 205 145 Q 280 140 355 145" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="132" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">n</text>
  <text x="405" y="151" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Row 1: gonna -> g -->
  <g filter="url(#sk)">
    <rect x="58" y="166" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="166" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">g</text>
  <text x="143" y="184" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"gonna"</text>
  <path d="M 205 179 Q 280 174 355 179" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="166" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">g</text>
  <text x="405" y="185" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Row 2: give -> g -->
  <g filter="url(#sk)">
    <rect x="58" y="200" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="200" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">g</text>
  <text x="143" y="218" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"give"</text>
  <path d="M 205 213 Q 280 208 355 213" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="200" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">g</text>
  <text x="405" y="219" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Row 3: up -> u -->
  <g filter="url(#sk)">
    <rect x="58" y="234" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="234" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">u</text>
  <text x="143" y="252" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"up"</text>
  <path d="M 205 247 Q 280 242 355 247" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="234" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">u</text>
  <text x="405" y="253" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Row 4: on -> o -->
  <g filter="url(#sk)">
    <rect x="58" y="268" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="268" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">o</text>
  <text x="143" y="286" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"on"</text>
  <path d="M 205 281 Q 280 276 355 281" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="268" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">o</text>
  <text x="405" y="287" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Row 5: you -> y -->
  <g filter="url(#sk)">
    <rect x="58" y="302" width="24" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="88" y="302" width="110" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">y</text>
  <text x="143" y="320" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">"you"</text>
  <path d="M 205 315 Q 280 310 355 315" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="365" y="302" width="24" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="377" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">y</text>
  <text x="405" y="321" font-size="14" font-weight="bold" fill="#4a7a3a">✓</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="345" width="560" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#7a5415">顺序敏感：["bear","aardvark"] 只能拼出 "ba"，拼不出 "ab"</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#7a5415">长度是必要条件：|words| ≠ |s| 时一位都不用比，直接 false</text>
</svg>
