<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">差值配平：正差（缺口）与负差（盈余）</text>

  <!-- 中轴线 -->
  <line x1="120" y1="170" x2="520" y2="170" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="175" font-size="12" fill="#666" filter="url(#rough2)">0 线</text>

  <!-- 位置标签与柱 -->
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="170" y="196">i=0</text><text x="260" y="196">i=1</text>
    <text x="350" y="196">i=2</text><text x="440" y="196">i=3</text>
  </g>
  <!-- 正差柱（向上，缺口） -->
  <g filter="url(#rough2)">
    <rect x="150" y="170" width="40" height="0" fill="none"/>
    <rect x="330" y="106" width="40" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="350" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">d₂ = +6</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#8a4a47" filter="url(#rough2)">缺 2 步</text>
  <!-- 负差柱（向下，盈余） -->
  <g filter="url(#rough2)">
    <rect x="150" y="170" width="40" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="420" y="170" width="40" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="170" y="252" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d₀ = −3（富余 1 步）</text>
  <text x="440" y="252" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d₃ = −3（富余 1 步）</text>

  <!-- 搬运箭头 -->
  <path d="M 440 236 C 400 300, 260 300, 202 240" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 236 C 220 290, 300 288, 338 244" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">每步操作 = 从一个盈余位搬 k=3 给一个缺口位</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="336" width="180" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <rect x="320" y="336" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="150" y="356" fill="#7a5c1e">可行：k | 每个差值，且</text>
    <text x="150" y="374" fill="#7a5c1e">Σd = 0（守恒）</text>
    <text x="410" y="356" fill="#b85450">答案 = Σ正差 / k</text>
    <text x="410" y="374" fill="#b85450">本例 = 6 / 3 = 2</text>
  </g>
</svg>
