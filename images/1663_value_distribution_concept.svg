<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：数值往后挤，前缀全是 a</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="20" y="92" width="142" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="91" y="115" text-anchor="middle" font-size="12" fill="#3a5a3a" filter="url(#sk)">字典序看最左位：</text>
  <text x="91" y="133" text-anchor="middle" font-size="12" fill="#3a5a3a" filter="url(#sk)">前面能小则小</text>
  <text x="91" y="151" text-anchor="middle" font-size="12.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">→ 尽量放 a</text>
  <g filter="url(#sk)">
    <path d="M 162 126 C 170 122 174 118 180 113" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="518" y="92" width="142" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="589" y="115" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">后面的位置：</text>
  <text x="589" y="133" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">位次低、专门扛数值</text>
  <text x="589" y="151" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">→ 尽量放 z</text>
  <g filter="url(#sk)">
    <path d="M 518 126 C 510 122 506 118 500 113" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="184" y="100" width="56" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="256" y="100" width="56" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="328" y="100" width="56" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="400" y="100" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="472" y="100" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="24" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="212" y="135" fill="#3a5a3a">a</text>
    <text x="284" y="135" fill="#3a5a3a">a</text>
    <text x="356" y="135" fill="#b07818">s</text>
    <text x="428" y="135" fill="#2b4a66">z</text>
    <text x="500" y="135" fill="#2b4a66">z</text>
  </g>

  <text x="158" y="177" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">每位数值</text>
  <g font-size="13" text-anchor="middle" font-weight="bold" font-family="monospace" filter="url(#sk)">
    <text x="212" y="177" fill="#3a5a3a">1</text>
    <text x="284" y="177" fill="#3a5a3a">1</text>
    <text x="356" y="177" fill="#b07818">19</text>
    <text x="428" y="177" fill="#2b4a66">26</text>
    <text x="500" y="177" fill="#2b4a66">26</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 184 186 L 184 194 Q 248 201 312 194 L 312 186" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 328 186 L 328 194 Q 356 201 384 194 L 384 186" stroke="#d6a040" stroke-width="1.6" fill="none"/>
    <path d="M 400 186 L 400 194 Q 464 201 528 194 L 528 186" stroke="#446688" stroke-width="1.6" fill="none"/>
  </g>
  <text x="248" y="216" text-anchor="middle" font-size="11.5" fill="#3a5a3a" filter="url(#sk)">前导 a 块（每位只花 1 点）</text>
  <text x="356" y="216" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">过渡字符（扛剩余超额）</text>
  <text x="464" y="216" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">z 后缀（每位扛满 26 点）</text>

  <g filter="url(#sk)">
    <rect x="100" y="236" width="480" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="256" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#sk)">可行性判定：m 个字符凑出数值 k  ⟺  m ≤ k ≤ 26m</text>
  <text x="340" y="274" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#sk)">（下界 = 全 a，上界 = 全 z，中间任何 k 都能凑出来）</text>

  <g filter="url(#sk)">
    <rect x="70" y="300" width="540" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="340" y="324" text-anchor="middle" font-size="14.5" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">结论：字典序最小的答案形如  a⋯a ＋ 至多一个过渡字符 ＋ z⋯z</text>
  <text x="340" y="347" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#sk)">「前导 a 尽量多」与「后缀 z 尽量多」两个方向夹逼，只在中间碰头一次</text>

  <text x="340" y="392" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（图示取 n = 5, k = 73 的答案 "aaszz"）</text>
</svg>
