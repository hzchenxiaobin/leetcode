<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：逐句数空格 +1 取最大</text>

  <rect x="130" y="58" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="83" text-anchor="middle" font-size="13.5" fill="#2b3d52" filter="url(#rough2)">best = 0</text>
  <path d="M 260 102 L 260 120" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="124" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="149" text-anchor="middle" font-size="13.5" fill="#6b5215" filter="url(#rough2)">取下一个句子 s ∈ sentences</text>
  <path d="M 260 168 L 260 186" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="190" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="13.5" fill="#2e4d24" filter="url(#rough2)">数空格：c = count(s, ' ')</text>
  <path d="M 260 234 L 260 252" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="256" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13.5" fill="#2b3d52" filter="url(#rough2)">best = max(best, c + 1)</text>

  <!-- 回环 -->
  <path d="M 394 206 C 440 206, 448 150, 444 146" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 444 146 C 440 142, 438 143, 396 143" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="180" font-size="11" fill="#888" filter="url(#rough2)" transform="rotate(90 458 180)">还有句子？</text>

  <rect x="130" y="312" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13.5" fill="#7a3b37" filter="url(#rough2)">返回 best，时间 O(L)、空间 O(1)</text>

  <text x="52" y="215" font-size="11.5" fill="#888" filter="url(#rough2)">Python 一行：</text>
  <text x="52" y="233" font-size="11" fill="#888" filter="url(#rough2)">max(s.count(' ')</text>
  <text x="52" y="248" font-size="11" fill="#888" filter="url(#rough2)">  for s in sentences)+1</text>
</svg>
