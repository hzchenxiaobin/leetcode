<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">τ(n) = 4 只有两种质因数形态</text>
  <path d="M 165 36 Q 320 46 475 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <rect x="150" y="54" width="340" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">n = p₁^e₁ p₂^e₂ ⋯ ，τ(n) = ∏(eᵢ + 1)</text>
  <text x="320" y="99" text-anchor="middle" font-size="11" fill="#2c4258" filter="url(#rough2)">4 的乘法拆法只有 4 与 2×2 两种</text>

  <path d="M 292 112 L 190 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="144" text-anchor="middle" font-size="11.5" fill="#3a6a2a" filter="url(#rough2)">4 = 4</text>

  <path d="M 348 112 L 450 174" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="420" y="144" text-anchor="middle" font-size="11.5" fill="#a07828" filter="url(#rough2)">4 = 2 × 2</text>

  <rect x="30" y="180" width="272" height="162" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">n = p³（单个质因子，指数 3）</text>
  <text x="166" y="232" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">例：8 = 2³ → 因数 1, 2, 4, 8</text>
  <text x="166" y="258" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">σ = 1 + p + p² + p³ = 15</text>
  <path d="M 52 272 Q 166 280 280 272" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="4 4" filter="url(#rough)"/>
  <text x="166" y="296" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">指数向量 (3)：τ = 3 + 1 = 4</text>
  <text x="166" y="320" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">同形态：27, 125, 343, 29791</text>

  <rect x="338" y="180" width="272" height="162" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="474" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4a20" filter="url(#rough2)">n = p·q（两个不同质因子）</text>
  <text x="474" y="232" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">例：21 = 3·7 → 因数 1, 3, 7, 21</text>
  <text x="474" y="258" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">σ = (1+p)(1+q) = 4×8 = 32</text>
  <path d="M 360 272 Q 474 280 588 272" stroke="#d6a040" stroke-width="1" fill="none" stroke-dasharray="4 4" filter="url(#rough)"/>
  <text x="474" y="296" text-anchor="middle" font-size="11" fill="#a07828" filter="url(#rough2)">指数向量 (1,1)：τ = 2 × 2 = 4</text>
  <text x="474" y="320" text-anchor="middle" font-size="11" fill="#a07828" filter="url(#rough2)">同形态：6, 10, 14, 15, 99998</text>

  <rect x="30" y="358" width="580" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">其余形态都不是 4 个因数：1→1，p→2，p²→3，p⁴→5</text>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">p²q→6，p²q²→9，p³q→8。τ 完全由指数向量决定，不看数值大小</text>
</svg>
