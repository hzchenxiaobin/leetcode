<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一个数的字符串长度 = 数位 + 负号</text>

  <!-- 三个例子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="84" text-anchor="middle" font-size="15" fill="#333">-15</text>
    <text x="120" y="104" text-anchor="middle" font-size="12" fill="#b85450">2 位数字 + 负号 = 3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="220" y="62" width="120" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="84" text-anchor="middle" font-size="15" fill="#333">12</text>
    <text x="280" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a">2 位数字 = 2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="62" width="120" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="440" y="84" text-anchor="middle" font-size="15" fill="#333">0</text>
    <text x="440" y="104" text-anchor="middle" font-size="12" fill="#d6a040">0 也是 1 位 = 1</text>
  </g>

  <!-- 矩阵列宽演示 -->
  <text x="280" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">逐列取最大：grid = [[-15, 1, 3], [15, 7, 12], [5, 6, -2]]</text>

  <g filter="url(#rough2)">
    <rect x="130" y="176" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="175" y="199" text-anchor="middle" font-size="13" fill="#333">-15</text>
    <rect x="220" y="176" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="265" y="199" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="310" y="176" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="355" y="199" text-anchor="middle" font-size="13" fill="#333">3</text>

    <rect x="130" y="212" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="235" text-anchor="middle" font-size="13" fill="#333">15</text>
    <rect x="220" y="212" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="265" y="235" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="310" y="212" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="355" y="235" text-anchor="middle" font-size="13" fill="#333">12</text>

    <rect x="130" y="248" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="175" y="271" text-anchor="middle" font-size="13" fill="#333">5</text>
    <rect x="220" y="248" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="265" y="271" text-anchor="middle" font-size="13" fill="#333">6</text>
    <rect x="310" y="248" width="90" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="355" y="271" text-anchor="middle" font-size="13" fill="#333">-2</text>
  </g>

  <!-- 列宽标注 -->
  <g filter="url(#rough2)" font-size="13" fill="#b85450">
    <ellipse cx="175" cy="300" rx="34" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="175" y="305" text-anchor="middle">3</text>
    <ellipse cx="265" cy="300" rx="34" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="265" y="305" text-anchor="middle">1</text>
    <ellipse cx="355" cy="300" rx="34" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="355" y="305" text-anchor="middle">2</text>
  </g>
  <path d="M 175 286 C 175 294, 175 292, 175 284" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 265 286 C 265 294, 265 292, 265 284" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 286 C 355 294, 355 292, 355 284" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="480" y="240" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">ans = [3, 1, 2]</text>
</svg>
