<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">同一个 x 只保留最大的 y，再取前三名</text>
  <text x="290" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">x = [1,2,1,3,2]，y = [5,3,4,6,2]</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">x =</text>
  <rect x="80" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="126" y="62" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="172" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="218" y="62" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240.0" y="88.0" font-size="14" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="264" y="62" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="40" y="148" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">y =</text>
  <rect x="80" y="126" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102.0" y="152.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="126" y="126" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="152.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="172" y="126" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194.0" y="152.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="218" y="126" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240.0" y="152.0" font-size="14" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="264" y="126" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="286.0" y="152.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="330" y="100" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">同一个 x 的两组</text>
  <text x="330" y="118" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">只留较大的 y</text>
  <path d="M 104 152 L 150 190" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 236 152 L 250 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 152 L 350 190" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="194" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125.0" y="218.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">x=1 -&gt; max y = 5</text>
  <text x="125.0" y="234.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">（丢弃 y=4）</text>
  <rect x="212" y="194" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="277.0" y="218.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">x=2 -&gt; max y = 3</text>
  <text x="277.0" y="234.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">（丢弃 y=3 重复）</text>
  <rect x="364" y="194" width="130" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="429.0" y="226.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">x=3 -&gt; max y = 6</text>
  <rect x="60" y="272" width="434" height="50" fill="#f1f3f4" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="277.0" y="301.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">降序：6, 5, 3 -&gt; 前三名之和 = 14（不同 x 只有 3 个，正好全取）</text>
  <text x="40" y="344" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">若不同 x 不足 3 个（如 x=[1,2,1,2]），直接返回 -1</text>
</svg>
