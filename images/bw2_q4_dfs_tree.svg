<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">数位 DFS 树（N = 20）：候选 + 剪枝 + 判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只在 {0,1,6,8,9} 上扩展；节点标注 (v → rot(v))，rot ≠ v 计 1 个</text>

  <ellipse cx="280" cy="72" rx="20" ry="16" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">∅</text>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 262 84 L 138 128" marker-end="url(#arr)"/>
    <path d="M 270 86 L 244 128" marker-end="url(#arr)"/>
    <path d="M 290 86 L 316 128" marker-end="url(#arr)"/>
    <path d="M 298 84 L 422 128" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#888">
    <text x="180" y="104">+1</text>
    <text x="248" y="102">+6</text>
    <text x="312" y="102">+8</text>
    <text x="378" y="104">+9</text>
  </g>

  <ellipse cx="130" cy="142" rx="20" ry="16" fill="#f4f4f4" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="254" cy="142" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="326" cy="142" rx="20" ry="16" fill="#f4f4f4" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="450" cy="142" rx="20" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="130" y="147" fill="#666">1</text>
    <text x="254" y="147" fill="#2a5a20">6</text>
    <text x="326" y="147" fill="#666">8</text>
    <text x="450" y="147" fill="#2a5a20">9</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="130" y="166" fill="#999">rot=1 ✗ 相同</text>
    <text x="254" y="166" fill="#2a5a20" font-weight="bold">rot=9 ✓ 计 1</text>
    <text x="326" y="166" fill="#999">rot=8 ✗ 相同</text>
    <text x="450" y="166" fill="#2a5a20" font-weight="bold">rot=6 ✓ 计 1</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.2" fill="none">
    <path d="M 122 160 L 52 208" marker-end="url(#arr)"/>
    <path d="M 126 160 L 96 208" marker-end="url(#arr)"/>
    <path d="M 132 160 L 142 208" marker-end="url(#arr)"/>
    <path d="M 136 160 L 188 208" marker-end="url(#arr)"/>
    <path d="M 138 162 L 232 208" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="8" text-anchor="middle" fill="#888">
    <text x="70" y="192">+0</text>
    <text x="106" y="192">+1</text>
    <text x="140" y="192">+6</text>
    <text x="172" y="192">+8</text>
    <text x="204" y="192">+9</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="34" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="80" y="212" width="40" height="26" fill="#f4f4f4" stroke="#888" stroke-width="1.5" rx="6"/>
    <rect x="126" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="172" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="218" y="212" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" font-weight="bold">
    <text x="54" y="229" fill="#2a5a20">10</text>
    <text x="100" y="229" fill="#666">11</text>
    <text x="146" y="229" fill="#2a5a20">16</text>
    <text x="192" y="229" fill="#2a5a20">18</text>
    <text x="238" y="229" fill="#2a5a20">19</text>
  </g>
  <g filter="url(#rough2)" font-size="8" text-anchor="middle">
    <text x="54" y="252" fill="#2a5a20" font-weight="bold">rot=1 ✓</text>
    <text x="100" y="252" fill="#999">rot=11 ✗</text>
    <text x="146" y="252" fill="#2a5a20" font-weight="bold">rot=91 ✓</text>
    <text x="192" y="252" fill="#2a5a20" font-weight="bold">rot=81 ✓</text>
    <text x="238" y="252" fill="#2a5a20" font-weight="bold">rot=61 ✓</text>
  </g>

  <rect x="278" y="212" width="110" height="26" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="333" y="229" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">60, 61, 66 … ✂</text>
  <rect x="398" y="212" width="52" height="26" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="424" y="229" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">80… ✂</text>
  <rect x="462" y="212" width="52" height="26" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="488" y="229" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">90… ✂</text>
  <text x="380" y="252" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">子节点 10v+d ≥ 60 &gt; N=20，整棵子树剪掉</text>

  <rect x="60" y="278" width="76" height="24" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="98" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">100… ✂</text>
  <text x="200" y="294" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">同理 11/16/18/19 的子树全部剪掉</text>

  <rect x="40" y="318" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">剪枝原理：v &gt; N 时，任何后代 10v+d &gt; v &gt; N，直接 return（连循环都不进）</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">更强的形式：v·10 &gt; N ⇒ 所有子节点超界 ⇒ 展开前就停</text>

  <rect x="120" y="392" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">N = 20 的答案：{6, 9, 10, 16, 18, 19}，共 6 个</text>
  <text x="280" y="428" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">DFS 只访问了 9 个候选（1,6,8,9,10,11,16,18,19），而不是 20 个数</text>
</svg>
