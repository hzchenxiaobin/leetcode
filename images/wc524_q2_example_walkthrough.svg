<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：撞自己 与 出边界 两种终局</text>

  <!-- Panel A: 例1 2x2 -->
  <text x="155" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：2×2 完美环 → 撞自己</text>

  <polyline points="122,110 190,110 190,178 122,178" fill="none" stroke="#4a7a3a" stroke-width="6" stroke-opacity="0.28"
            stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>

  <rect x="88" y="76" width="68" height="68" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="116" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <text x="94" y="88" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="156" y="76" width="68" height="68" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="116" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">D</text>
  <text x="162" y="88" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="88" y="144" width="68" height="68" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="122" y="184" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">U</text>
  <text x="94" y="156" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">4</text>

  <rect x="156" y="144" width="68" height="68" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">L</text>
  <text x="162" y="156" font-size="8.5" fill="#888" filter="url(#rough2)">3</text>

  <path d="M122,170 L122,120" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="122" y="146" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="155" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">在 (1,0) 沿 U 要回 (0,0)，已访问 → 停</text>
  <text x="155" y="256" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 [1,0]</text>
  <text x="155" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不记 visited 的话，R→D→L→U 会无限绕圈！</text>

  <!-- Panel B: 例2 1x3 -->
  <text x="478" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：1×3 直行 → 出边界</text>

  <polyline points="410,110 478,110 546,110" fill="none" stroke="#4a7a3a" stroke-width="6" stroke-opacity="0.28"
            stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>

  <rect x="376" y="76" width="68" height="68" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="116" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <text x="382" y="88" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="444" y="76" width="68" height="68" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="116" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">R</text>
  <text x="450" y="88" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="512" y="76" width="68" height="68" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="546" y="116" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="518" y="88" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <path d="M556,110 L594,110" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="576" y="96" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="576" y="138" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">网格外</text>

  <text x="478" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">在 (0,2) 沿 R 要走出网格 → 停</text>
  <text x="478" y="256" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 [0,2]</text>
  <text x="478" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全程 3 格，没撞自己、直接冲出边界</text>

  <!-- 补充边界示例 -->
  <rect x="60" y="300" width="520" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">补充：起点即终点</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">grid = [["L","R"],["U","D"]]：在 (0,0) 沿 L 直接出界，一步未走</text>
  <text x="320" y="357" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">→ 答案 [0,0]；1×1 网格同理，任何方向都出界</text>
</svg>
