<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="144"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">固定右端点 j：最靠左的可行起点由「三者最小」决定</text>

  <!-- 字符串格子 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="60" y="60" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="60" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="160" y="60" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="210" y="60" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="60" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="310" y="60" width="50" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="85" y="84">a</text><text x="135" y="84">b</text><text x="185" y="84">c</text>
    <text x="235" y="84">a</text><text x="285" y="84">b</text><text x="335" y="84">c</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a5c1e" text-anchor="middle">
    <text x="85" y="112">0</text><text x="135" y="112">1</text><text x="185" y="112">2</text>
    <text x="235" y="112">3</text><text x="285" y="112">4</text><text x="335" y="112">5</text>
  </g>

  <!-- 右端点 j=4 -->
  <rect x="256" y="52" width="58" height="54" fill="none" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="44" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">右端点 j = 4</text>

  <!-- last 标注 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="235" y="134" fill="#446688">last[a]=3</text>
    <text x="285" y="152" fill="#4a7a3a">last[b]=4</text>
    <text x="185" y="134" fill="#b85450">last[c]=2</text>
  </g>
  <path d="M 235 122 L 235 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 285 140 L 285 100" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 185 122 L 185 100" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- min = 2 决定起点 -->
  <rect x="156" y="172" width="208" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">min(last) = 2 → 起点 i ≤ 2 都可行</text>

  <!-- 三个子串 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="60" y="222" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="210" y="242">子串 [0, 4] = "abcab"　贡献 1</text>
    <rect x="60" y="258" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="185" y="278">子串 [1, 4] = "bcab"　贡献 1</text>
    <rect x="60" y="294" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="160" y="314">子串 [2, 4] = "cab"　贡献 1</text>
  </g>
  <path d="M 160 210 C 150 218, 150 222, 158 228" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧说明 -->
  <rect x="390" y="222" width="140" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="460" y="244" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">以 j 结尾的</text>
  <text x="460" y="262" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">合法子串数</text>
  <text x="460" y="286" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">= min(last)+1</text>
  <text x="460" y="308" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">= 2 + 1 = 3</text>

  <rect x="60" y="338" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="358" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">j 右移一格只会让 last 变大 → 无需回退左端点，总贡献 O(n) 累加完</text>
</svg>
