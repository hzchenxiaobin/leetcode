<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">算法流程：一次计数，一次拼接</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">两步操作可以合并，不需要真的调用 sort</text>
  <rect x="96" y="64" width="268" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">扫描 nums，统计偶数个数 cnt</text>
  <text x="230" y="102" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">x % 2 == 0 → cnt++</text>
  <path d="M 230 114 L 230 136" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="96" y="140" width="268" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="160" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">构造长度 n 的答案数组</text>
  <text x="230" y="179" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">前 cnt 个填 0，后 n − cnt 个填 1</text>
  <path d="M 230 192 L 230 214" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="96" y="218" width="268" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="238" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回答案（天然非递减）</text>
  <text x="230" y="256" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">正确性不依赖任何排序过程</text>
  <rect x="390" y="140" width="150" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="402" y="164" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">计数排序的思想</text>
  <text x="402" y="186" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">值只有 0 和 1，</text>
  <text x="402" y="208" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">所以直接按个数铺开</text>
  <text x="402" y="230" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">时间 O(n)</text>
  <text x="402" y="252" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">空间 O(n)</text>
  <text x="280.0" y="318" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">小数据范围下，直接 sort 也能过；但计数写法是本题想考的最短路径</text>
</svg>
