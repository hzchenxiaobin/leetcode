<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">交替子数组 = 在 v 与 v+1 之间来回跳动</text>

  <!-- 两条水平参考线 v / v+1 -->
  <path d="M 70 110 L 380 110" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="58" y="114" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v+1</text>
  <path d="M 70 180 L 380 180" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="58" y="184" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">v</text>

  <!-- 折线：v, v+1, v, v+1, v, v+1 -->
  <g filter="url(#rough2)">
    <path d="M 90 180 L 90 110 L 150 180 L 210 110 L 270 180 L 330 110" stroke="#d6a040" stroke-width="2.4" fill="none"/>
    <ellipse cx="90" cy="180" rx="7" ry="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="90" cy="110" rx="7" ry="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="150" cy="180" rx="7" ry="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="210" cy="110" rx="7" ry="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="270" cy="180" rx="7" ry="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="330" cy="110" rx="7" ry="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#b85450">
    <text x="120" y="138" text-anchor="middle">+1</text>
    <text x="180" y="152" text-anchor="middle">−1</text>
    <text x="240" y="138" text-anchor="middle">+1</text>
    <text x="300" y="152" text-anchor="middle">−1</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="90" y="204" text-anchor="middle">v</text>
    <text x="150" y="204" text-anchor="middle">v+1</text>
    <text x="210" y="204" text-anchor="middle">v</text>
    <text x="270" y="204" text-anchor="middle">v+1</text>
    <text x="330" y="204" text-anchor="middle">v</text>
  </g>

  <!-- 期望值公式 -->
  <g filter="url(#rough2)">
    <rect x="420" y="90" width="190" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="515" y="116" text-anchor="middle" font-size="13" fill="#333">位置 j 的期望值：</text>
    <text x="515" y="142" text-anchor="middle" font-size="13.5" fill="#b85450">nums[i] + ((j−i) mod 2)</text>
    <text x="515" y="168" text-anchor="middle" font-size="11.5" fill="#555">偶数偏移 → v，奇数偏移 → v+1</text>
    <text x="515" y="188" text-anchor="middle" font-size="11.5" fill="#555">首步必须满足 nums[i+1]=nums[i]+1</text>
  </g>

  <!-- 失败示例 -->
  <g filter="url(#rough2)">
    <text x="320" y="240" text-anchor="middle" font-size="13" fill="#333">失败的延伸：nums = [2, 3, 4, …] 从 i=0（v=2）出发</text>
    <rect x="120" y="256" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="278" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="180" y="256" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="210" y="278" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="240" y="256" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="270" y="278" text-anchor="middle" font-size="14" fill="#b85450">4</text>
    <path d="M 330 273 C 360 273, 368 273, 384 273" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
    <text x="420" y="268" text-anchor="middle" font-size="12.5" fill="#b85450">期望 2，实际 4 ✗</text>
    <text x="420" y="286" text-anchor="middle" font-size="12" fill="#888">长度停在 2，下一个起点从 i=1 重新开始</text>
  </g>

  <text x="320" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">注意：模式必须「+1 开头」，[v+1, v, v+1, v] 这种先降后升的锯齿不算</text>
</svg>
