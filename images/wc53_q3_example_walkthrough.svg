<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 走查：四个岛 → 三个不同的键</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">每座岛先取行优先扫到的第一个 1 作锚点，再写出所有格子的相对偏移</text>

  <text x="40" y="92" font-size="11" fill="#555" filter="url(#rough2)">grid（r↓ c→）</text>

  <!-- 底网格 -->
  <g filter="url(#rough2)" stroke="#d8d8d8" stroke-width="1">
    <rect x="40" y="100" width="40" height="40" fill="#ffffff"/><rect x="80" y="100" width="40" height="40" fill="#ffffff"/>
    <rect x="120" y="100" width="40" height="40" fill="#ffffff"/><rect x="160" y="100" width="40" height="40" fill="#ffffff"/>
    <rect x="200" y="100" width="40" height="40" fill="#ffffff"/>
    <rect x="40" y="140" width="40" height="40" fill="#ffffff"/><rect x="80" y="140" width="40" height="40" fill="#ffffff"/>
    <rect x="120" y="140" width="40" height="40" fill="#ffffff"/><rect x="160" y="140" width="40" height="40" fill="#ffffff"/>
    <rect x="200" y="140" width="40" height="40" fill="#ffffff"/>
    <rect x="40" y="180" width="40" height="40" fill="#ffffff"/><rect x="80" y="180" width="40" height="40" fill="#ffffff"/>
    <rect x="120" y="180" width="40" height="40" fill="#ffffff"/><rect x="160" y="180" width="40" height="40" fill="#ffffff"/>
    <rect x="200" y="180" width="40" height="40" fill="#ffffff"/>
    <rect x="40" y="220" width="40" height="40" fill="#ffffff"/><rect x="80" y="220" width="40" height="40" fill="#ffffff"/>
    <rect x="120" y="220" width="40" height="40" fill="#ffffff"/><rect x="160" y="220" width="40" height="40" fill="#ffffff"/>
    <rect x="200" y="220" width="40" height="40" fill="#ffffff"/>
  </g>

  <!-- 0 标注 -->
  <g font-size="9.5" fill="#c9c9c9" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="125">0</text>
    <text x="100" y="165">0</text><text x="140" y="165">0</text><text x="180" y="165">0</text><text x="220" y="165">0</text>
    <text x="60" y="205">0</text><text x="100" y="205">0</text><text x="140" y="205">0</text><text x="180" y="205">0</text>
    <text x="140" y="245">0</text>
  </g>

  <!-- A: (0,0)(0,1)(1,0) -->
  <rect x="40" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="80" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="140" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="100" width="40" height="40" fill="#446688" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="126" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">锚</text>
  <text x="100" y="126" text-anchor="middle" font-size="11" fill="#33445f" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="60" y="166" text-anchor="middle" font-size="11" fill="#33445f" font-weight="bold" filter="url(#rough2)">A</text>

  <!-- B: (0,3)(0,4) -->
  <rect x="160" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="100" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="160" y="100" width="40" height="40" fill="#4a7a3a" stroke="#33552a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="126" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">锚</text>
  <text x="220" y="126" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">B</text>

  <!-- C: (2,4)(3,3)(3,4) -->
  <rect x="200" y="180" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="160" y="220" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="220" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="180" width="40" height="40" fill="#d6a040" stroke="#a87c22" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="206" text-anchor="middle" font-size="10" fill="#5a4210" filter="url(#rough2)">锚</text>
  <text x="180" y="246" text-anchor="middle" font-size="11" fill="#7a5a14" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- D: (3,0)(3,1) -->
  <rect x="40" y="220" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="80" y="220" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="40" y="220" width="40" height="40" fill="#b85450" stroke="#8f3f3c" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">锚</text>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#8f3f3c" font-weight="bold" filter="url(#rough2)">D</text>

  <!-- 右侧键表 -->
  <text x="268" y="86" font-size="11" fill="#555" filter="url(#rough2)">锚点 + 相对偏移 = 键（排序后）</text>
  <path d="M 262 96 L 618 96" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="268" y="122" font-size="10.5" fill="#33445f" filter="url(#rough2)">A：{(0,0), (0,1), (1,0)}</text>
  <text x="268" y="160" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">B：{(0,0), (0,1)}</text>
  <text x="268" y="198" font-size="10.5" fill="#7a5a14" filter="url(#rough2)">C：{(0,0), (1,-1), (1,0)}</text>
  <text x="268" y="236" font-size="10.5" fill="#8f3f3c" filter="url(#rough2)">D：{(0,0), (0,1)}  ← 与 B 同键</text>

  <path d="M 262 136 L 618 136" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 262 174 L 618 174" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 262 212 L 618 212" stroke="#e2e2e2" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="286" font-size="10.5" fill="#666" filter="url(#rough2)">深色格 = 锚点；0 是海水，不进入任何键</text>
  <text x="40" y="306" font-size="10.5" fill="#666" filter="url(#rough2)">C 的偏移含负数 (1,-1)</text>
  <text x="40" y="326" font-size="10.5" fill="#666" filter="url(#rough2)">列差可为负，不必翻转</text>

  <rect x="262" y="266" width="356" height="40" fill="#f2f7ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="291" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">去重后只剩 A、B、C 三个键 → 返回 3</text>

  <rect x="36" y="344" width="568" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="367" text-anchor="middle" font-size="10.5" fill="#7a5a14" filter="url(#rough2)">A 与 C 互为镜像 → 形状不同 → 键不同</text>
  <text x="320" y="388" text-anchor="middle" font-size="10.5" fill="#7a5a14" filter="url(#rough2)">B 与 D 都是同一行相邻两格 → 键相同 → 只算一种</text>
</svg>
