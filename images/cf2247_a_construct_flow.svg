<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    s mod 4 = 0 时，显式构造出一串合法操作
  </text>

  <polygon points="310,62 432,100 310,138 188,100" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="105" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    s mod 4 == 0 ?
  </text>

  <path d="M432,100 L488,100" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="490" y="78" width="96" height="44" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538" y="97" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="538" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出 NO</text>

  <path d="M310,138 L310,170" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="162" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="108" y="172" width="404" height="50" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    ① 取 k = |s| / 2 个与 s 同号的元素（k 必为偶数）
  </text>
  <text x="310" y="212" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    s &gt; 0 取 +1，s &lt; 0 取 -1；够取是因为 k ≤ 该符号的个数
  </text>

  <path d="M310,222 L310,254" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="256" width="380" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    ② 按下标排序后两两配对：(p₁,p₂), (p₃,p₄), …
  </text>

  <path d="M310,302 L310,334" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="336" width="444" height="50" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="357" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    ③ 对每对 (p,q)：依次翻转 (p,p+1), (p+1,p+2), …, (q-1,q)
  </text>
  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    中间位置被翻两次还原，只有 p、q 真正取反
  </text>

  <text x="310" y="414" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">
    恰好 k 个元素取反 ⇒ s 变成 s - 2k = 0，输出 YES
  </text>
</svg>
