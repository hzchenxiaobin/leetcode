<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：搜索树上的每条「根→终点」链 = 一条路径</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">DAG 没有环 ⇒ 递归天然终止，不需要 visited 也不会绕圈</text>

  <!-- 左侧：示例 1 的 DAG -->
  <circle cx="72" cy="172" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="177" text-anchor="middle" font-size="12" fill="#28425e" filter="url(#rough2)">0</text>
  <circle cx="196" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="105" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <circle cx="196" cy="244" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="249" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>
  <circle cx="318" cy="172" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="318" y="177" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">3</text>

  <path d="M 87 163 L 180 109" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 87 181 L 180 235" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 109 L 303 163" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 235 L 303 181" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="72" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">源点</text>
  <text x="318" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">终点</text>
  <text x="195" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 1 的 DAG（n = 4，graph = [[1,2],[3],[3],[]]）</text>

  <!-- 右侧：DFS 搜索树 -->
  <circle cx="470" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="470" y="105" text-anchor="middle" font-size="11.5" fill="#28425e" filter="url(#rough2)">0</text>
  <circle cx="432" cy="168" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="432" y="173" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <circle cx="544" cy="168" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="544" y="173" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">2</text>
  <circle cx="432" cy="236" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="432" y="241" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">3</text>
  <circle cx="544" cy="236" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="544" y="241" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">3</text>

  <path d="M 461 114 L 441 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 479 114 L 535 155" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 183 L 432 221" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 544 183 L 544 221" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="432" y="266" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">[0,1,3]</text>
  <text x="544" y="266" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">[0,2,3]</text>
  <text x="488" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">搜索树的两条「根到 3」的链 = 两条答案</text>

  <!-- 底部性质 -->
  <rect x="40" y="304" width="600" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="328" font-size="10.5" fill="#7a5f1a" filter="url(#rough2)">① 无环 ⇒ 路径长度 ≤ n − 1 = 14，递归最深 15 层，不需要显式 visited</text>
  <text x="58" y="350" font-size="10.5" fill="#7a5f1a" filter="url(#rough2)">② 路径条数上界 2^(n−2)（完全 DAG），n = 15 时最多 8192 条</text>
  <text x="58" y="372" font-size="10.5" fill="#7a5f1a" filter="url(#rough2)">③ 代价由答案规模决定：时间 O(路径数 × 路径长)，空间 O(n) 栈 + 答案</text>
</svg>
