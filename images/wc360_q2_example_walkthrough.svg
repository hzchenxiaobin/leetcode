<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 3, target = 3（half = 1）</text>

  <text x="119" y="52" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 + 2 = 3 ✗</text>
  <path d="M 145,80 Q 119,60 93,80" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="70" y="84" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="122" y="84" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="174" y="84" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="226" y="84" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="278" y="84" width="46" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M 126,88 L 164,116" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="93" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="197" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="249" y="108" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="301" y="108" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">5</text>

  <text x="93" y="142" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">✓ 选</text>
  <text x="145" y="142" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">✗ 跳过</text>
  <text x="197" y="142" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="249" y="142" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="301" y="142" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">备用</text>

  <text x="145" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">伙伴 = 1 已选</text>
  <text x="223" y="182" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">≥ target：从后备池接着拿</text>

  <rect x="45" y="204" width="430" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">选出 nums = {1, 3, 4}，最小和 = 8 ✓</text>
  <text x="260" y="250" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">公式：half(half+1)/2 + k·target + k(k−1)/2 = 1 + 6 + 1 = 8</text>

  <rect x="45" y="278" width="430" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">n = 2（示例 1）：取 {1, 3}，和 = 1 + 1×3 = 4 ✓</text>

  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">n = 1, target = 1：half = 0，k = 1，取 {1}，和 = 1</text>
</svg>
