<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定流程：一趟扫描，一个整数不等式</text>

  <g filter="url(#rough2)">
    <rect x="150" y="56" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">一趟扫描统计：</text>
  <text x="280" y="92" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">d = 左数字和 − 右数字和，q = 左?数 − 右?数</text>
  <path d="M 280 102 L 280 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,122 400,158 280,194 160,158" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="280" y="154" text-anchor="middle" font-size="14" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">2d + 9q ≠ 0 ？</text>
  <text x="280" y="174" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">（等价于 Φ₀ ≠ 0，纯整数无浮点）</text>

  <!-- ≠ 0：Alice -->
  <g filter="url(#rough2)">
    <rect x="40" y="226" width="220" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10"/>
  </g>
  <text x="150" y="250" text-anchor="middle" font-size="13.5" fill="#a0392f" font-weight="bold" filter="url(#rough2)">返回 true：Alice 必胜</text>
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#a0392f" filter="url(#rough2)">q 奇 → 9q 为奇数，恒 ≠ 0；</text>
  <text x="150" y="284" text-anchor="middle" font-size="11" fill="#a0392f" filter="url(#rough2)">q 偶但 Φ₀ ≠ 0 → Alice 破防</text>
  <path d="M 218 184 L 168 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="206" y="200" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠ 0</text>

  <!-- = 0：Bob -->
  <g filter="url(#rough2)">
    <rect x="320" y="226" width="220" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10"/>
  </g>
  <text x="430" y="250" text-anchor="middle" font-size="13.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">返回 false：Bob 必胜</text>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">仅当 q 为偶数（此时 Φ₀ = 0）；</text>
  <text x="430" y="284" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">Bob 守恒策略把每步拨回 0</text>
  <path d="M 342 184 L 392 224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="200" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 0</text>

  <!-- 三个示例的取值 -->
  <g filter="url(#rough2)">
    <rect x="40" y="316" width="500" height="68" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="10"/>
  </g>
  <text x="290" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"5023"：2·0 + 9·0 = 0 → false ｜ "25??"：2·7 + 9·(−2) = −4 → true</text>
  <text x="290" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"?3295???"：2·9 + 9·(1−3) = 18 − 18 = 0 → false（官方示例 3）</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">复杂度 O(n)：一趟扫描 + 一次乘加比较，O(1) 额外空间。</text>
</svg>
