<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：两行公式拆位，快速幂兜底</text>
  <path d="M 250 42 Q 450 52 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 主流程 ===== -->
  <text x="80" y="76" font-size="13.5" font-weight="bold" fill="#33517a">主流程（三行代码）</text>

  <g filter="url(#sk)">
    <rect x="60"  y="88" width="140" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="215" y="88" width="140" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="370" y="88" width="140" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="525" y="88" width="140" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="680" y="88" width="160" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="130" y="110" text-anchor="middle" font-size="11.5" fill="#33517a">输入 n</text>
  <text x="130" y="128" text-anchor="middle" font-size="10.5" fill="#666">≤ 10^15，long long</text>
  <text x="285" y="110" text-anchor="middle" font-size="11.5" fill="#33517a">e = (n+1)/2</text>
  <text x="285" y="128" text-anchor="middle" font-size="11.5" fill="#33517a">o = n/2</text>
  <text x="440" y="110" text-anchor="middle" font-size="11.5" fill="#2e5e2e">quickPow(5, e)</text>
  <text x="440" y="128" text-anchor="middle" font-size="10.5" fill="#666">mod 10^9+7</text>
  <text x="595" y="110" text-anchor="middle" font-size="11.5" fill="#2e5e2e">quickPow(4, o)</text>
  <text x="595" y="128" text-anchor="middle" font-size="10.5" fill="#666">mod 10^9+7</text>
  <text x="760" y="110" text-anchor="middle" font-size="11.5" fill="#8a6a1e">两积再 % MOD</text>
  <text x="760" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1e">→ 返回答案</text>

  <g filter="url(#sk)">
    <path d="M 200 114 L 213 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 355 114 L 368 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 510 114 L 523 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 665 114 L 678 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- ===== 快速幂循环 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="158" width="780" height="322" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="182" font-size="13.5" font-weight="bold" fill="#2e5e2e">quickPow(base, exp) 循环细节（迭代版）</text>

  <g filter="url(#sk)">
    <rect x="330" y="196" width="240" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="221" text-anchor="middle" font-size="11.5" fill="#444">result = 1；base = b mod p；exp = e</text>

  <g filter="url(#sk)">
    <path d="M 450 236 L 450 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形1：exp > 0 ? -->
  <g filter="url(#sk)">
    <polygon points="450,254 545,291 450,328 355,291" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="450" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1e">exp &gt; 0 ?</text>

  <g filter="url(#sk)">
    <path d="M 545 291 L 588 291" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="560" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="592" y="271" width="230" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="707" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">返回 result</text>
  <text x="707" y="305" text-anchor="middle" font-size="10" fill="#888">此时 result = b^e mod p</text>

  <g filter="url(#sk)">
    <path d="M 450 328 L 450 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="466" y="342" font-size="11" font-weight="bold" fill="#2e5e2e">是</text>

  <!-- 菱形2：exp 奇数 ? -->
  <g filter="url(#sk)">
    <polygon points="450,346 548,383 450,420 352,383" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="450" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1e">exp 最低位是 1 ?</text>

  <g filter="url(#sk)">
    <path d="M 548 383 L 588 383" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="562" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">是</text>
  <g filter="url(#sk)">
    <rect x="592" y="363" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="707" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#33517a">result = result×base mod p</text>

  <!-- 是路径回流 + 否路径直落 -->
  <g filter="url(#sk)">
    <path d="M 707 403 Q 707 430 590 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 450 420 L 450 436" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  </g>
  <text x="432" y="433" text-anchor="end" font-size="11" font-weight="bold" fill="#888">否·跳过</text>

  <g filter="url(#sk)">
    <rect x="330" y="440" width="240" height="34" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="462" text-anchor="middle" font-size="11" fill="#444">base = base×base mod p；exp &gt;&gt;= 1</text>

  <!-- 回环箭头 -->
  <g filter="url(#sk)">
    <path d="M 330 457 H 180 V 291 H 351" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="188" y="388" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 188 388)">每轮 exp 至少折半，回到判定</text>

  <!-- ===== 底部：二进制拆解 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="498" width="780" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="522" font-size="13.5" font-weight="bold" fill="#8a6a1e">指数二进制拆解：13 = 1101₂ = 8 + 4 + 1 ⇒ 5^13 = 5^8 · 5^4 · 5^1</text>
  <text x="80" y="548" font-size="11.5" fill="#444">base 每轮自平方预备 x^(2^i)：5 → 25 → 625 → 390625 → …；只在指数为 1 的二进制位把当前 base 收进 result。</text>
  <text x="80" y="572" font-size="11.5" fill="#444">exp ≤ 5×10^14 &lt; 2^50 ⇒ 每次快速幂至多 50 轮、约 100 次模乘；两次幂合计 ~200 次。</text>
  <text x="80" y="598" font-size="11.5" font-weight="bold" fill="#b85450">对照：朴素连乘要 e + o ≈ 10^15 次乘法——按每秒 10^9 次也要 11 天，快速幂 50 轮瞬间完成。</text>
</svg>
