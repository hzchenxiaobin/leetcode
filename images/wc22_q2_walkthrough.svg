  <!-- ===== 结论 ===== -->
  <rect x="40" y="230" width="480" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">示例 1：rowCnt = [1,1,1]，colCnt = [1,1,1]</text>
  <text x="56" y="272" font-size="10.5" fill="#555" filter="url(#rough2)">三个 B 的行、列都只有自己，第 2 遍全部通过 → 答案 3。</text>
  <text x="56" y="294" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">示例 2：rowCnt = [3,2,3]，colCnt = [3,3,2]</text>
  <text x="56" y="314" font-size="10.5" fill="#555" filter="url(#rough2)">每行都有 ≥2 个 B，行计数一筛就把所有候选否决 → 答案 0（列计数都用不上）。</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">走查要点：列计数只在「行已唯一」时才有决定权</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">反例：示例 1 若省掉黑格判断，白格 (0,0) 会因 rowCnt[0]=1 且 colCnt[0]=1 被误算</text>
