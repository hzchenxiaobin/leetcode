<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="517" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：x 递增 + 单调指针 + 枚举倍数</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="90" y="58" width="380" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">排序 nums；位集 dp = {0}；指针 p = 0</text>

  <path d="M 280 96 L 280 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="116" width="260" height="34" rx="17" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="280" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">for x = 1 … n</text>

  <path d="M 280 152 L 280 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="172" width="440" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="280" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">while a[p] &lt; x：dp |= dp &lt;&lt; a[p]，p++</text>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#2e6e2e">值 &lt; x 的元素「解封」，进 0/1 背包（每个元素只进一次）</text>

  <path d="M 280 224 L 280 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="244" width="440" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="280" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">c = n − p（被封顶为 x 的副本个数）</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#2b6e9e">检查目标：k − j·x 是否 ∈ dp，j = 0 … min(⌊k/x⌋, c)</text>

  <path d="M 280 294 L 280 310" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="314" width="440" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">for j = 0 … min(⌊k/x⌋, c)：</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">若 dp 中第 k − j·x 位为 1 ⇒ answer[x−1] = true</text>

  <path d="M 540 133 Q 585 133 585 190 Q 585 250 530 250" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="195" font-size="10.5" fill="#999">x++</text>

  <g filter="url(#sk)">
    <rect x="510" y="58" width="118" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="569" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">返回 answer</text>
  <text x="569" y="98" text-anchor="middle" font-size="10.5" fill="#8a3a36">（大小为 n）</text>

  <g filter="url(#sk)">
    <rect x="60" y="378" width="568" height="42" rx="8" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.3"/>
  </g>
  <text x="344" y="396" text-anchor="middle" font-size="11.5" fill="#555">为什么快：n 次位集转移 O(nk/64)；倍数检查 Σₓ ⌊k/x⌋ = O(k log n)</text>
  <text x="344" y="413" text-anchor="middle" font-size="11.5" fill="#555">n = k = 4000 时：约 25 万次字操作 + 约 4 万次查询，实测 &lt; 1 ms</text>
</svg>
