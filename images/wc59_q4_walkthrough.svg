<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">官方示例走查：6 次 book 调用的状态演化</text>
  <text x="360" y="46" text-anchor="middle" font-size="10" fill="#888">初态 singles = ∅，doubles = ∅</text>

  <rect x="30" y="62" width="660" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="50" y="84" text-anchor="middle">#</text>
    <text x="140" y="84" text-anchor="middle">请求 I</text>
    <text x="220" y="84">与 doubles 是否相交</text>
    <text x="510" y="84" text-anchor="middle">新增 doubles</text>
    <text x="645" y="84" text-anchor="middle">返回</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="96" width="660" height="46" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/>
    <rect x="30" y="142" width="660" height="46" fill="#f7f9fc" stroke="#ccd4e0" stroke-width="1"/>
    <rect x="30" y="188" width="660" height="46" fill="#ffffff" stroke="#ccd4e0" stroke-width="1"/>
    <rect x="30" y="234" width="660" height="46" fill="#fce4ec" stroke="#ccd4e0" stroke-width="1"/>
    <rect x="30" y="280" width="660" height="46" fill="#f7f9fc" stroke="#ccd4e0" stroke-width="1"/>
    <rect x="30" y="326" width="660" height="46" fill="#eef7ef" stroke="#ccd4e0" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="50" y="123" text-anchor="middle">1</text>
    <text x="140" y="123" text-anchor="middle">[10,20)</text>
    <text x="220" y="123">无（doubles 为空）</text>
    <text x="510" y="123" text-anchor="middle">—</text>
    <text x="645" y="123" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>

    <text x="50" y="169" text-anchor="middle">2</text>
    <text x="140" y="169" text-anchor="middle">[50,60)</text>
    <text x="220" y="169">无（与 [10,20) 不相交）</text>
    <text x="510" y="169" text-anchor="middle">—</text>
    <text x="645" y="169" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>

    <text x="50" y="215" text-anchor="middle">3</text>
    <text x="140" y="215" text-anchor="middle">[10,40)</text>
    <text x="220" y="215">无</text>
    <text x="510" y="215" text-anchor="middle">[10,20)</text>
    <text x="645" y="215" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>

    <text x="50" y="261" text-anchor="middle">4</text>
    <text x="140" y="261" text-anchor="middle">[5,15)</text>
    <text x="220" y="261" fill="#8a3a36">交于 [10,15) → 三重</text>
    <text x="510" y="261" text-anchor="middle" fill="#8a3a36">不变更</text>
    <text x="645" y="261" text-anchor="middle" fill="#b85450" font-weight="bold">false</text>

    <text x="50" y="307" text-anchor="middle">5</text>
    <text x="140" y="307" text-anchor="middle">[5,10)</text>
    <text x="220" y="307">无（端点 10 相接不算交）</text>
    <text x="510" y="307" text-anchor="middle">—</text>
    <text x="645" y="307" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>

    <text x="50" y="353" text-anchor="middle">6</text>
    <text x="140" y="353" text-anchor="middle">[25,55)</text>
    <text x="220" y="353">无</text>
    <text x="510" y="353" text-anchor="middle">[25,40) 与 [50,55)</text>
    <text x="645" y="353" text-anchor="middle" fill="#4a7a3a" font-weight="bold">true</text>
  </g>

  <text x="360" y="392" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">第 4 行被拒后状态完全不变，所以第 5 行 [5,10) 只需避开 [10,20) 的左端点即可通过。</text>
  <text x="360" y="408" text-anchor="middle" font-size="9.2" fill="#999" filter="url(#rough2)">输出序列：true, true, true, false, true, true —— 与官方一致</text>
</svg>
