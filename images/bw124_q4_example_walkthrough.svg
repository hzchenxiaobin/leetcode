<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：nums = [2,1,5,1,1]，排序后 [1,1,1,2,5]</text>

  <rect x="16" y="38" width="528" height="28" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="120" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[x]（旧）</text>
  <text x="208" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[x−1]</text>
  <text x="318" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">写 dp[x+1] = dp[x]+1</text>
  <text x="436" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">写 dp[x] = dp[x−1]+1</text>
  <text x="514" y="57" text-anchor="middle" font-size="10.3" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <g filter="url(#rough2)">
    <rect x="16" y="66" width="528" height="28" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="16" y="94" width="528" height="28" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="16" y="122" width="528" height="28" fill="#fff" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="16" y="150" width="528" height="28" fill="#e6f4ea" stroke="#e2e2e2" stroke-width="1"/>
    <rect x="16" y="178" width="528" height="28" fill="#f4f4f4" stroke="#e2e2e2" stroke-width="1"/>
  </g>

  <g font-size="10.2" fill="#333" filter="url(#rough2)">
    <text x="44" y="85" text-anchor="middle">1</text>
    <text x="120" y="85" text-anchor="middle">0</text><text x="208" y="85" text-anchor="middle">0</text>
    <text x="318" y="85" text-anchor="middle">dp[2] = 0+1 = 1</text>
    <text x="436" y="85" text-anchor="middle">dp[1] = 0+1 = 1</text>
    <text x="514" y="85" text-anchor="middle" fill="#4a7a3a">1</text>

    <text x="44" y="113" text-anchor="middle">1</text>
    <text x="120" y="113" text-anchor="middle">1</text><text x="208" y="113" text-anchor="middle">0</text>
    <text x="318" y="113" text-anchor="middle">dp[2] = 1+1 = 2</text>
    <text x="436" y="113" text-anchor="middle">dp[1] = 0+1 = 1</text>
    <text x="514" y="113" text-anchor="middle" fill="#4a7a3a">2</text>

    <text x="44" y="141" text-anchor="middle">1</text>
    <text x="120" y="141" text-anchor="middle">1</text><text x="208" y="141" text-anchor="middle">0</text>
    <text x="318" y="141" text-anchor="middle">dp[2] = 1+1 = 2</text>
    <text x="436" y="141" text-anchor="middle">dp[1] = 0+1 = 1</text>
    <text x="514" y="141" text-anchor="middle" fill="#4a7a3a">2</text>

    <text x="44" y="169" text-anchor="middle">2</text>
    <text x="120" y="169" text-anchor="middle">2</text><text x="208" y="169" text-anchor="middle">1</text>
    <text x="318" y="169" text-anchor="middle">dp[3] = 2+1 = 3</text>
    <text x="436" y="169" text-anchor="middle">dp[2] = 1+1 = 2</text>
    <text x="514" y="169" text-anchor="middle" fill="#4a7a3a">3</text>

    <text x="44" y="197" text-anchor="middle">5</text>
    <text x="120" y="197" text-anchor="middle">0</text><text x="208" y="197" text-anchor="middle">0</text>
    <text x="318" y="197" text-anchor="middle">dp[6] = 0+1 = 1</text>
    <text x="436" y="197" text-anchor="middle">dp[5] = 0+1 = 1</text>
    <text x="514" y="197" text-anchor="middle" fill="#4a7a3a">3</text>
  </g>

  <text x="280" y="226" text-anchor="middle" font-size="10.3" fill="#666" filter="url(#rough2)">前两个 1 把 dp[2] 顶到 2；轮到 2 时借 dp[2] = 2 造出 dp[3] = 3，链是 1 → 2 → 3</text>
  <text x="280" y="246" text-anchor="middle" font-size="10.3" fill="#888" filter="url(#rough2)">第三个 1 想再撑一格也不行：dp[1] 仍是 1，dp[2] 仍停在 2；5 与前面断档，只能自成一条长度 1 的链</text>

  <rect x="40" y="260" width="480" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">选出的元素是 1、1（各 +1 一次）、2（+1），排序后正好是 1,2,3</text>
  <text x="280" y="295" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">最终 dp 里最大值是 3，即答案</text>
</svg>
