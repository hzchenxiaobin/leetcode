<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3 走查：num = [2,1,5]，k = 806</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每一步同时读取 num 的一位、k 的最低位，并带上上一列的进位</text>

  <rect x="18" y="62" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="53" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="92" y="62" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">num 位</text>
  <rect x="182" y="62" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="225" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">k 个位</text>
  <rect x="272" y="62" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">进位入</text>
  <rect x="362" y="62" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="407" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">和 / 写入</text>
  <rect x="456" y="62" width="86" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="499" y="81" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">进位出</text>

  <rect x="18" y="94" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="53" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="92" y="94" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="135" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="182" y="94" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="225" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="272" y="94" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="315" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="362" y="94" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="407" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">11 → 写 1</text>
  <rect x="456" y="94" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="499" y="114" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="18" y="128" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="53" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="92" y="128" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="135" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="182" y="128" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="225" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="272" y="128" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="315" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="362" y="128" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="407" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2 → 写 2</text>
  <rect x="456" y="128" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="499" y="148" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>

  <rect x="18" y="162" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="53" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="92" y="162" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="135" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="182" y="162" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="225" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">8</text>
  <rect x="272" y="162" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="315" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="362" y="162" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="407" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">10 → 写 0</text>
  <rect x="456" y="162" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="499" y="182" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <rect x="18" y="196" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="53" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="92" y="196" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="135" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="182" y="196" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="225" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="272" y="196" width="86" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="315" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="362" y="196" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/><text x="407" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1 → 写 1</text>
  <rect x="456" y="196" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="499" y="216" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>

  <text x="18" y="252" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">结果数组是低位在前逐位 push 出来的：1、2、0、1，最后整体反转得到 [1,0,2,1]。</text>
  <text x="18" y="272" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">第 4 步 num 与 k 都耗尽了，但还有进位 1，循环条件里的 carry 让这一位没被丢掉。</text>
  <text x="18" y="292" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">若不反转而直接前插，也能得到正序，但每次插入都是 O(n)，退化成 O(n²)。</text>
</svg>
