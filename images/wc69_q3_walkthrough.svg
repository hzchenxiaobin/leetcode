  <text x="60" y="222" font-size="11" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">逐步看 0 与谁交换（下标为 2x3 行主序扁平化后的位置）</text>
  <text x="60" y="246" font-size="10" fill="#4a5a72" filter="url(#rough2)">第 1 步：0 与 5 交换（下标 4 ↔ 3），dist 5 → 4</text>
  <text x="60" y="266" font-size="10" fill="#4a5a72" filter="url(#rough2)">第 2 步：0 与 4 交换（下标 3 ↔ 0），dist 4 → 3</text>
  <text x="60" y="286" font-size="10" fill="#4a5a72" filter="url(#rough2)">第 3 步：0 与 1 交换（下标 0 ↔ 1），dist 3 → 2</text>
  <text x="60" y="306" font-size="10" fill="#4a5a72" filter="url(#rough2)">第 4 步：0 与 2 交换（下标 1 ↔ 2），dist 2 → 1</text>
  <text x="60" y="326" font-size="10" fill="#4a5a72" filter="url(#rough2)">第 5 步：0 与 3 交换（下标 2 ↔ 5），dist 1 → 0，解开</text>

  <rect x="40" y="346" width="640" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="10" fill="#33552a" filter="url(#rough2)">扁平序列 (4,1,2,5,0,3) 一步步变成 (1,2,3,4,5,0)；去掉 0 后 1..5 的逆序数始终是偶数</text>
  <text x="60" y="388" font-size="10" fill="#33552a" filter="url(#rough2)">每步距离恰好减 1，说明这条路径沿着 BFS 层下降，5 步不可能更少</text>
