<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [4, 1, 4, 0, 3, 5]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">排序后 [0, 1, 3, 4, 4, 5]，三轮配对得到平均值 {2.5, 3.5}</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="480" height="262" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8"/>
  </g>

  <line x1="40" y1="100" x2="520" y2="100" stroke="#ddd" stroke-width="1"/>
  <text x="70" y="90" font-size="11" fill="#666" font-weight="bold">轮次</text>
  <text x="160" y="90" font-size="11" fill="#666" font-weight="bold">剩余数组（排序视角）</text>
  <text x="330" y="90" font-size="11" fill="#666" font-weight="bold">删除 min / max</text>
  <text x="440" y="90" font-size="11" fill="#666" font-weight="bold">平均值</text>

  <text x="70" y="124" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="160" y="124" font-size="12" fill="#555">[0, 1, 3, 4, 4, 5]</text>
  <text x="330" y="124" font-size="12" fill="#b85450">0 与 5</text>
  <text x="440" y="124" font-size="12" fill="#4a7a3a" font-weight="bold">2.5</text>

  <line x1="56" y1="136" x2="504" y2="136" stroke="#eee" stroke-width="1"/>

  <text x="70" y="160" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="160" y="160" font-size="12" fill="#555">[1, 3, 4, 4]</text>
  <text x="330" y="160" font-size="12" fill="#b85450">1 与 4</text>
  <text x="440" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">2.5</text>

  <line x1="56" y1="172" x2="504" y2="172" stroke="#eee" stroke-width="1"/>

  <text x="70" y="196" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="160" y="196" font-size="12" fill="#555">[3, 4]</text>
  <text x="330" y="196" font-size="12" fill="#b85450">3 与 4</text>
  <text x="440" y="196" font-size="12" fill="#4a7a3a" font-weight="bold">3.5</text>

  <rect x="56" y="212" width="448" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">用「和」记录：seen[0+5]=seen[5+1]=T，seen[3+4]=T</text>
  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#3a4a66">不同和只有 {5, 7} 两个 ⟹ 不同平均值 = 2 个</text>

  <rect x="56" y="270" width="210" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="161" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">浮点做法（不推荐）</text>
  <text x="161" y="304" text-anchor="middle" font-size="10" fill="#555">(a+b)/2.0 存 set，也能过但怕精度</text>

  <rect x="294" y="270" width="210" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="399" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">整数做法（推荐）</text>
  <text x="399" y="304" text-anchor="middle" font-size="10" fill="#555">seen[a+b] 布尔数组，0..200</text>

  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">对照：nums = [1, 100] 只有一轮 (1, 100) → 和 101 → 答案 1</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">注意第 2 轮里两个 4：删哪个 4 都不影响配对值，无需特判</text>
</svg>
