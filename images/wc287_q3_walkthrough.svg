<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：candies = [5, 8, 6]，k = 3（hi = max = 8）</text>
  <path d="M 130 36 Q 330 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="56" text-anchor="middle" font-size="11.5" fill="#888">验证函数 f(m) = ⌊5/m⌋ + ⌊8/m⌋ + ⌊6/m⌋（每份 m 颗时最多能分给几个小孩）</text>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="28" y="66" width="48" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="52" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">轮次</text>
  <g filter="url(#sk)">
    <rect x="76" y="66" width="100" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="126" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">区间 [lo,hi]</text>
  <g filter="url(#sk)">
    <rect x="176" y="66" width="52" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="202" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">mid</text>
  <g filter="url(#sk)">
    <rect x="228" y="66" width="172" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="314" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">f(mid)</text>
  <g filter="url(#sk)">
    <rect x="400" y="66" width="116" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="458" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">判定</text>
  <g filter="url(#sk)">
    <rect x="516" y="66" width="116" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="574" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">动作</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="28" y="98" width="48" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="52" y="122" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)">
    <rect x="76" y="98" width="100" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="126" y="122" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[1, 8]</text>
  <g filter="url(#sk)">
    <rect x="176" y="98" width="52" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="202" y="122" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">4</text>
  <g filter="url(#sk)">
    <rect x="228" y="98" width="172" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="314" y="122" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1 + 2 + 1 = 4</text>
  <g filter="url(#sk)">
    <rect x="400" y="98" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="458" y="122" text-anchor="middle" font-size="11.5" fill="#2e6e2e">4 ≥ 3 ✓ 可行</text>
  <g filter="url(#sk)">
    <rect x="516" y="98" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="574" y="122" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">ans=4, lo=5</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="28" y="138" width="48" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="52" y="162" text-anchor="middle" font-size="12" fill="#444">2</text>
  <g filter="url(#sk)">
    <rect x="76" y="138" width="100" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="126" y="162" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[5, 8]</text>
  <g filter="url(#sk)">
    <rect x="176" y="138" width="52" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="202" y="162" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">6</text>
  <g filter="url(#sk)">
    <rect x="228" y="138" width="172" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="314" y="162" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">0 + 1 + 1 = 2</text>
  <g filter="url(#sk)">
    <rect x="400" y="138" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="458" y="162" text-anchor="middle" font-size="11.5" fill="#a03a36">2 &lt; 3 ✗ 不够</text>
  <g filter="url(#sk)">
    <rect x="516" y="138" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="574" y="162" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">hi = 5</text>

  <!-- row 3: answer -->
  <g filter="url(#sk)">
    <rect x="28" y="178" width="48" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="52" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)">
    <rect x="76" y="178" width="100" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="126" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">[5, 5]</text>
  <g filter="url(#sk)">
    <rect x="176" y="178" width="52" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="202" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">5</text>
  <g filter="url(#sk)">
    <rect x="228" y="178" width="172" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="314" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">1 + 1 + 1 = 3</text>
  <g filter="url(#sk)">
    <rect x="400" y="178" width="116" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="458" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">3 ≥ 3 ✓ 可行</text>
  <g filter="url(#sk)">
    <rect x="516" y="178" width="116" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="574" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans=5, lo=6</text>

  <!-- row 4: terminate -->
  <g filter="url(#sk)">
    <rect x="28" y="218" width="48" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="52" y="242" text-anchor="middle" font-size="12" fill="#888">—</text>
  <g filter="url(#sk)">
    <rect x="76" y="218" width="100" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="126" y="242" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">lo=6 &gt; hi=5</text>
  <g filter="url(#sk)">
    <rect x="176" y="218" width="52" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="202" y="242" text-anchor="middle" font-size="12" fill="#888">—</text>
  <g filter="url(#sk)">
    <rect x="228" y="218" width="172" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="314" y="242" text-anchor="middle" font-size="12" fill="#888">—</text>
  <g filter="url(#sk)">
    <rect x="400" y="218" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="458" y="242" text-anchor="middle" font-size="11" fill="#888">区间为空，结束</text>
  <g filter="url(#sk)">
    <rect x="516" y="218" width="116" height="40" fill="#fffdf3" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="574" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">返回 ans = 5</text>

  <!-- example 2 -->
  <g filter="url(#sk)">
    <rect x="28" y="278" width="604" height="48" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">示例 2：candies = [2, 5]，k = 11</text>
  <text x="330" y="316" text-anchor="middle" font-size="11" fill="#888">f(1) = 2 + 5 = 7 &lt; 11 → 连 m = 1 都不可行，二分全程走「否」分支，ans 保持初值 0 → 返回 0</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="28" y="342" width="604" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="330" y="363" text-anchor="middle" font-size="11.5" fill="#888">为什么第 1 轮可行还要继续？—— 求的是「最大」可行值，可行后必须继续往右试探更大的 m</text>
</svg>
