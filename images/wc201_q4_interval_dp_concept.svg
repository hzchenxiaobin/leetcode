<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每一刀的成本 = 所在木棍段的原坐标长度</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 n = 7, cuts = [1, 3, 4, 5] 为例，按 [3, 5, 1, 4] 的顺序切割</text>

  <g filter="url(#rough2)">
    <rect x="60" y="64" width="500" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 60 70 L 60 82" stroke="#446688" stroke-width="1.2"/>
    <path d="M 131 70 L 131 82" stroke="#446688" stroke-width="1.2"/>
    <path d="M 274 70 L 274 82" stroke="#446688" stroke-width="1.2"/>
    <path d="M 346 70 L 346 82" stroke="#446688" stroke-width="1.2"/>
    <path d="M 417 70 L 417 82" stroke="#446688" stroke-width="1.2"/>
    <path d="M 560 70 L 560 82" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="106" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="131" y="106" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="274" y="106" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="346" y="106" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="417" y="106" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="560" y="106" text-anchor="middle" font-size="11" fill="#555">7</text>
    <path d="M 274 52 L 274 94" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="320" y="128" text-anchor="middle" font-size="12.5" fill="#333">第 1 刀在 3 处：成本 <tspan fill="#b85450" font-weight="bold">= 7 − 0 = 7</tspan>（整根还没被切过）</text>

    <path d="M 320 136 C 320 141 320 146 320 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="158" width="214" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="274" y="158" width="286" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 60 164 L 60 176" stroke="#446688" stroke-width="1.2"/>
    <path d="M 131 164 L 131 176" stroke="#446688" stroke-width="1.2"/>
    <path d="M 274 164 L 274 176" stroke="#446688" stroke-width="1.2"/>
    <path d="M 346 164 L 346 176" stroke="#446688" stroke-width="1.2"/>
    <path d="M 417 164 L 417 176" stroke="#446688" stroke-width="1.2"/>
    <path d="M 560 164 L 560 176" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="200" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="131" y="200" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="274" y="200" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="346" y="200" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="417" y="200" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="560" y="200" text-anchor="middle" font-size="11" fill="#555">7</text>
    <path d="M 417 146 L 417 188" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="320" y="222" text-anchor="middle" font-size="12.5" fill="#333">第 2 刀在 5 处：成本 <tspan fill="#b85450" font-weight="bold">= 7 − 3 = 4</tspan>（只算这一段，不是整根！）</text>

    <path d="M 320 230 C 320 235 320 240 320 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="252" width="214" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="274" y="252" width="143" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="417" y="252" width="143" height="24" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 60 258 L 60 270" stroke="#446688" stroke-width="1.2"/>
    <path d="M 131 258 L 131 270" stroke="#446688" stroke-width="1.2"/>
    <path d="M 274 258 L 274 270" stroke="#446688" stroke-width="1.2"/>
    <path d="M 346 258 L 346 270" stroke="#446688" stroke-width="1.2"/>
    <path d="M 417 258 L 417 270" stroke="#446688" stroke-width="1.2"/>
    <path d="M 560 258 L 560 270" stroke="#446688" stroke-width="1.2"/>
    <text x="60" y="294" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="131" y="294" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="274" y="294" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="346" y="294" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="417" y="294" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="560" y="294" text-anchor="middle" font-size="11" fill="#555">7</text>
    <path d="M 131 240 L 131 282" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <path d="M 346 240 L 346 282" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="320" y="316" text-anchor="middle" font-size="12.5" fill="#333">第 3 刀在 1 处：成本 <tspan fill="#b85450" font-weight="bold">= 3 − 0 = 3</tspan>　　第 4 刀在 4 处：成本 <tspan fill="#b85450" font-weight="bold">= 5 − 3 = 2</tspan></text>

    <path d="M 320 324 C 320 329 320 334 320 338" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="346" width="71" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="131" y="346" width="143" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="274" y="346" width="72" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="346" y="346" width="71" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="417" y="346" width="143" height="24" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="60" y="388" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="131" y="388" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="274" y="388" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="346" y="388" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="417" y="388" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="560" y="388" text-anchor="middle" font-size="11" fill="#555">7</text>
    <text x="320" y="412" text-anchor="middle" font-size="11.5" fill="#4a7a3a">切割点全部用完，木棍分成 5 段（每段内不再有切割点）</text>

    <rect x="40" y="430" width="230" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="155" y="452" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d28">总成本 = 7 + 4 + 3 + 2 = 16</text>
    <text x="155" y="472" text-anchor="middle" font-size="11.5" fill="#4a7a3a">= 本题最优解</text>

    <rect x="294" y="430" width="336" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="306" y="452" font-size="12.5" font-weight="bold" fill="#b07818">关键洞察</text>
    <text x="306" y="474" font-size="11.5" fill="#555">每刀成本 = 所在段的右端点 − 左端点（原坐标不变）</text>
    <text x="306" y="494" font-size="11.5" fill="#555">段的端点 ∈ {0, n} ∪ cuts → 「段」就是「区间」</text>
    <text x="306" y="514" font-size="11.5" fill="#555">一刀两段，此后互不相干 → 子问题独立</text>
    <text x="306" y="540" font-size="12" font-weight="bold" fill="#b07818">→ 在区间上做 DP：区间 DP</text>
  </g>
</svg>
