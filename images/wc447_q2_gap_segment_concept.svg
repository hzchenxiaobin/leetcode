<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">有序数组：断口（相邻差 &gt; maxDiff）切分连通分量</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#555">以示例 2 为例：nums = [2, 5, 6, 8]，maxDiff = 2，节点编号 0 ~ 3</text>

  <g filter="url(#sk)"><path d="M 92 136 L 606 136" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrg)"/></g>
  <text x="612" y="128" text-anchor="end" font-size="9.5" fill="#999">值轴（非递减）</text>

  <g filter="url(#sk)"><rect x="97" y="118" width="46" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="120" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5b84">2</text>
  <text x="120" y="172" text-anchor="middle" font-size="10.5" fill="#2b5b84">节点 0</text>

  <g filter="url(#sk)"><rect x="287" y="118" width="46" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="310" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e">节点 1</text>

  <g filter="url(#sk)"><rect x="401" y="118" width="46" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="424" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="424" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e">节点 2</text>

  <g filter="url(#sk)"><rect x="553" y="118" width="46" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="576" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="576" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e">节点 3</text>

  <text x="215" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">差 3 &gt; maxDiff → 断口</text>
  <g filter="url(#sk)"><path d="M 148 136 L 200 136" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 232 136 L 282 136" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 206 147 L 215 130 L 210 142 L 226 126 L 215 149" stroke="#b85450" stroke-width="2.2" fill="none"/></g>

  <text x="367" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">差 1 ≤ maxDiff → 有边</text>
  <g filter="url(#sk)"><path d="M 336 131 L 398 131" stroke="#4a7a3a" stroke-width="2.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 336 142 L 398 142" stroke="#4a7a3a" stroke-width="2.2" fill="none"/></g>

  <text x="499" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">差 2 ≤ maxDiff → 有边</text>
  <g filter="url(#sk)"><path d="M 450 131 L 548 131" stroke="#4a7a3a" stroke-width="2.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 450 142 L 548 142" stroke="#4a7a3a" stroke-width="2.2" fill="none"/></g>

  <g filter="url(#sk)"><rect x="84" y="196" width="72" height="46" rx="9" fill="#e8f0fe" opacity="0.6" stroke="#446688" stroke-width="1.6"/></g>
  <text x="120" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5b84">段 0</text>
  <text x="120" y="233" text-anchor="middle" font-size="10" fill="#444">= {节点 0}</text>

  <g filter="url(#sk)"><rect x="272" y="196" width="344" height="46" rx="9" fill="#e6f4ea" opacity="0.65" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="444" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">段 1 = {节点 1, 2, 3}：相邻有边，连成一条链</text>
  <text x="444" y="233" text-anchor="middle" font-size="10" fill="#444">1 → 2 → 3，段内任意两点互通</text>

  <text x="320" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">断口 k 两侧完全隔离：对任意左点 i ≤ k、右点 j ≥ k+1，</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">nums[j] − nums[i] ≥ nums[k+1] − nums[k] &gt; maxDiff —— 没有任何边能跨过断口</text>

  <g filter="url(#sk)">
    <rect x="40" y="304" width="560" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">查询 ⇔ 比段号：answer[i] = (group[u] == group[v])</text>
  <text x="320" y="356" text-anchor="middle" font-size="10.5" fill="#444">段号 = 左侧断口数：group[i] = group[i−1] + (nums[i] − nums[i−1] &gt; maxDiff)</text>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#444">非相邻点对之间的边只是「捷径」，不改变连通性 —— 连通性由相邻边完全决定</text>
</svg>
