<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">p 恰好两个 '*' ⇒ 切成三段 A、B、C，子串形状固定</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个 '*' 各匹配“任意长（可为空）”的一段，于是匹配的子串必是 A + X + B + Y + C</text>

  <g filter="url(#rough2)">
    <rect x="60" y="72" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="158" y="72" width="34" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="200" y="72" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="298" y="72" width="34" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="340" y="72" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="105" y="98" fill="#3a4a66" filter="url(#rough2)">A</text>
    <text x="175" y="98" fill="#8a6a20" filter="url(#rough2)">*</text>
    <text x="245" y="98" fill="#3a5a30" filter="url(#rough2)">B</text>
    <text x="315" y="98" fill="#8a6a20" filter="url(#rough2)">*</text>
    <text x="385" y="98" fill="#8a3a36" filter="url(#rough2)">C</text>
  </g>
  <text x="450" y="98" font-size="10.5" fill="#666" filter="url(#rough2)">（A、B、C 各自可为空串）</text>

  <path d="M 320 116 L 320 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="162" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">匹配的子串 t（在 s 中连续）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="172" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="158" y="172" width="100" height="40" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" rx="6"/>
    <rect x="266" y="172" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="364" y="172" width="100" height="40" fill="#fafafa" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" rx="6"/>
    <rect x="472" y="172" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="105" y="197" fill="#3a4a66" filter="url(#rough2)">A</text>
    <text x="208" y="197" fill="#999" filter="url(#rough2)">X（任意）</text>
    <text x="311" y="197" fill="#3a5a30" filter="url(#rough2)">B</text>
    <text x="414" y="197" fill="#999" filter="url(#rough2)">Y（任意）</text>
    <text x="517" y="197" fill="#8a3a36" filter="url(#rough2)">C</text>
  </g>

  <rect x="60" y="230" width="510" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="252" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">长度 = |A| + |B| + |C| + |X| + |Y|　⇒ 要最短，只需让 X、Y 尽量短（中间的空隙尽量小）</text>

  <rect x="60" y="278" width="250" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="74" y="298" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">形式化：选三个位置</text>
  <text x="74" y="316" font-size="10" fill="#555" filter="url(#rough2)">i：A 的起点（须 s[i..i+|A|) = A）</text>
  <text x="74" y="334" font-size="10" fill="#555" filter="url(#rough2)">j ≥ i+|A|：B 的起点</text>
  <text x="74" y="352" font-size="10" fill="#555" filter="url(#rough2)">k ≥ j+|B|：C 的起点</text>
  <text x="74" y="364" font-size="10" fill="#555" filter="url(#rough2)">长度 = k + |C| − i，最小化它</text>

  <rect x="330" y="278" width="240" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="344" y="298" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">反向思考：从右往左预处理</text>
  <text x="344" y="316" font-size="10" fill="#555" filter="url(#rough2)">minC[x]：C 的起点 ≥ x 时的最小起点</text>
  <text x="344" y="334" font-size="10" fill="#555" filter="url(#rough2)">h[e]：从 e 起完成“B…C”的最小右端</text>
  <text x="344" y="352" font-size="10" fill="#555" filter="url(#rough2)">两者都是“后缀取最小”，可 O(n) 递推</text>
  <text x="344" y="364" font-size="10" fill="#555" filter="url(#rough2)">最后扫 A 的每个出现位置即可</text>

  <text x="320" y="384" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">匹配要求 A、B、C 按顺序出现且不重叠（X、Y 只负责填空隙）</text>
</svg>
