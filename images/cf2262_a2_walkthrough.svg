<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：n = 6，a = (0, 3, 2, 2, 2, 1)</text>
  <text x="360" y="49" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">k=1 的禁块 I₁=[0,0] 剔除 0，故 U={1,2,3,4,5}；need[r] = 右端为 r 的必中块里「块内最小可用值」的最大值</text>

  <!-- 表头 -->
  <rect x="44" y="64" width="632" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="76" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="146" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">p ∈ U ?</text>
  <text x="216" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[p]</text>
  <text x="306" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">total（翻倍后）</text>
  <text x="404" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">need[p]</text>
  <text x="492" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">被剪掉的键</text>
  <text x="618" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">total（剪枝后）</text>

  <!-- 行 0 -->
  <rect x="44" y="94" width="632" height="32" fill="#fce4ec" fill-opacity="0.35" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="146" y="115" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 禁用</text>
  <text x="216" y="115" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">–</text>
  <text x="306" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="404" y="115" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="492" y="115" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">–</text>
  <text x="618" y="115" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 1 -->
  <rect x="44" y="126" width="632" height="32" fill="#e6f4ea" fill-opacity="0.5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="146" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="216" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="404" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="492" y="147" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">空状态</text>
  <text x="618" y="147" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="44" y="158" width="632" height="32" fill="#e6f4ea" fill-opacity="0.5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="216" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="404" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="492" y="179" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">–</text>
  <text x="618" y="179" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="44" y="190" width="632" height="32" fill="#fff8e1" fill-opacity="0.6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="216" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="404" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="492" y="211" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">dp[1] = 1</text>
  <text x="618" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <rect x="44" y="222" width="632" height="32" fill="#e6f4ea" fill-opacity="0.5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="146" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="216" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="306" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="404" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="492" y="243" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">–</text>
  <text x="618" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 5 -->
  <rect x="44" y="254" width="632" height="32" fill="#fce4ec" fill-opacity="0.35" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="146" y="275" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="216" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="306" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="404" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="492" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">dp[2],dp[3],dp[4]</text>
  <text x="618" y="275" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 结论 -->
  <rect x="44" y="298" width="632" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">答案 total = 6（p=5 时 total 从 12 剪到 6）</text>
  <text x="60" y="338" font-size="10" fill="#444" filter="url(#rough2)">6 个集合：{1,2,5} {1,3,5} {1,2,3,5} {1,2,4,5} {1,3,4,5} {1,2,3,4,5}</text>
  <text x="60" y="356" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">need[5]=5 来自 k=5 的块 [5,9]（裁成 {5}）：位置 5 被迫选入，故 max 必须 ≥ 5</text>
  <text x="60" y="374" font-size="9.5" fill="#555" filter="url(#rough2)">p=3 时 need[3]=2 来自 k=2 的块 [2,3]：max=1 的状态（只含 1）从此再无救，被永久剪掉</text>
</svg>
