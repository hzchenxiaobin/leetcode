<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="58"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">分组背包转移：按「值」逐个入包，f[S] 滚动更新</text>

  <!-- 转移图 -->
  <text x="280" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">处理值 v（掩码 m，出现 cnt[v] 次）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="84" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="300" y="84" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="160" y="108" font-size="13" fill="#33506e" text-anchor="middle" filter="url(#rough2)" font-weight="bold">已有集合 S（S ∩ m = ∅）</text>
  <text x="160" y="128" font-size="11.5" fill="#33506e" text-anchor="middle" filter="url(#rough2)">f[S] 份方案</text>
  <text x="400" y="108" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">新集合 S ∪ m</text>
  <text x="400" y="128" font-size="11.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">f[S ∪ m] += f[S] × cnt[v]</text>
  <path d="M 262 112 C 278 112, 282 112, 296 112" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="98" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">拼入 v</text>

  <!-- 为什么乘 cnt -->
  <rect x="60" y="160" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="280" y="184" text-anchor="middle" font-weight="bold">为什么乘 cnt[v] 而不是 cnt[v] 选 k 个的组合数？</text>
    <text x="280" y="208" text-anchor="middle">同值多次选用同值不同下标实现：每份 f[S] 对每个下标各延一步（可重复）</text>
  </g>

  <!-- 逆序原因 -->
  <rect x="60" y="240" width="440" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a3a34">
    <text x="280" y="264" text-anchor="middle" font-weight="bold">为什么 S 要倒序枚举（从大到小）？</text>
    <text x="280" y="288" text-anchor="middle">同一值 v 的两份拷贝会冲突（掩码 AND 非空）→ 每个 v 至多选一次</text>
  </g>

  <!-- 收尾 -->
  <rect x="60" y="320" width="440" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22">
    <text x="280" y="344" text-anchor="middle" font-weight="bold">收尾两步</text>
    <text x="280" y="366" text-anchor="middle">答案 = ( Σ f[S]，S ≠ ∅ ) × 2^cnt[1] mod (10⁹+7)</text>
    <text x="280" y="390" text-anchor="middle">空集 S=∅ 不算好子集（乘积 1 不是质数之积），必须排除</text>
  </g>
</svg>
