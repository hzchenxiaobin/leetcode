<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：叶子被「钉死」—— 叶子的颜色由邻居唯一确定</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">合法 = 每个点都有异色邻居；叶子只连一条边，这条边必须异色</text>

  <g filter="url(#rough2)" stroke-width="1.8">
    <path d="M 250 140 L 152 222" stroke="#8a8a8a" fill="none"/>
    <path d="M 250 140 L 250 240" stroke="#8a8a8a" fill="none"/>
    <path d="M 250 140 L 348 222" stroke="#8a8a8a" fill="none"/>
    <path d="M 250 140 L 420 110" stroke="#8a8a8a" fill="none"/>
    <path d="M 420 110 L 486 190" stroke="#8a8a8a" fill="none"/>

    <circle cx="250" cy="140" r="21" fill="#fce4ec" stroke="#b85450"/>
    <text x="250" y="145" text-anchor="middle" font-size="12" fill="#8a3a36">红</text>

    <circle cx="152" cy="222" r="18" fill="#e8f0fe" stroke="#446688"/>
    <text x="152" y="227" text-anchor="middle" font-size="11" fill="#3a4a66">蓝</text>
    <circle cx="250" cy="240" r="18" fill="#e8f0fe" stroke="#446688"/>
    <text x="250" y="245" text-anchor="middle" font-size="11" fill="#3a4a66">蓝</text>
    <circle cx="348" cy="222" r="18" fill="#e8f0fe" stroke="#446688"/>
    <text x="348" y="227" text-anchor="middle" font-size="11" fill="#3a4a66">蓝</text>

    <circle cx="420" cy="110" r="19" fill="#e6f4ea" stroke="#4a7a3a"/>
    <text x="420" y="115" text-anchor="middle" font-size="11" fill="#3a5a30">蓝</text>
    <circle cx="486" cy="190" r="18" fill="#fce4ec" stroke="#b85450"/>
    <text x="486" y="195" text-anchor="middle" font-size="11" fill="#8a3a36">红</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#777">
    <text x="118" y="272">叶子</text>
    <text x="118" y="286">(deg = 1)</text>
    <text x="238" y="282">叶子</text>
    <text x="336" y="272">叶子</text>
    <text x="404" y="78">非叶子 · 颜色自由</text>
    <path d="M 300 132 L 392 92" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="300" width="560" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="46" y="322" font-size="11" fill="#8a6a20" font-weight="bold">把叶子剥掉，只给「核心点」染色</text>
    <text x="46" y="344" font-size="10.5" fill="#555">C = 所有非叶子点；B = { v ∈ C : v 的邻居全在 C 中 }（没有任何叶子邻居的点）</text>
    <text x="46" y="364" font-size="10.5" fill="#555">C 一旦染好，每片叶子的颜色随之唯一确定（取邻居的反色），叶子必然满足条件</text>
    <text x="46" y="384" font-size="10.5" fill="#555">故合法染色数 = 「C 的染色中，每个 b ∈ B 都有异色邻居」的染色数</text>
    <text x="46" y="402" font-size="10" fill="#9a7a30">注：C \ B 中的点因为身边挂着叶子，天然就有一个异色邻居，不需要额外约束</text>
  </g>
</svg>
