<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [12, 6, 1, 2, 7]</text>
  <path d="M 185 42 Q 320 50 455 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: array with optimal triplet -->
  <text x="320" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">① 原数组与最优三元组</text>
  <g filter="url(#sk)">
    <rect x="152" y="76" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="222" y="76" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="292" y="76" width="56" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="362" y="76" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="432" y="76" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="180" y="100" fill="#3a6a2a">12</text>
    <text x="250" y="100" fill="#777">6</text>
    <text x="320" y="100" fill="#8a6520">1</text>
    <text x="390" y="100" fill="#777">2</text>
    <text x="460" y="100" fill="#446688">7</text>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <text x="180" y="128" fill="#4a7a3a">i = 0</text>
    <text x="320" y="128" fill="#b8862a">j = 2</text>
    <text x="460" y="128" fill="#446688">k = 4</text>
  </g>
  <path d="M 320 138 L 320 160" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: scan table -->
  <text x="320" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">② 枚举中间 j：preMax 从左扫，sufMax 预处理</text>
  <g filter="url(#sk)">
    <rect x="120" y="192" width="400" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" fill="#446688">
    <text x="140" y="209">j</text>
    <text x="195" y="209">preMax</text>
    <text x="270" y="209">nums[j]</text>
    <text x="340" y="209">差值</text>
    <text x="405" y="209">sufMax</text>
    <text x="480" y="209">候选值</text>
  </g>
  <g filter="url(#sk)">
    <rect x="120" y="218" width="400" height="26" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1"/>
    <rect x="120" y="244" width="400" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="120" y="270" width="400" height="26" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#555">
    <text x="140" y="235">1</text>
    <text x="195" y="235">12</text>
    <text x="270" y="235">6</text>
    <text x="340" y="235">6</text>
    <text x="405" y="235">7</text>
    <text x="480" y="235">42</text>
    <text x="140" y="261" font-weight="bold" fill="#3a6a2a">2</text>
    <text x="195" y="261" font-weight="bold" fill="#3a6a2a">12</text>
    <text x="270" y="261" font-weight="bold" fill="#3a6a2a">1</text>
    <text x="340" y="261" font-weight="bold" fill="#3a6a2a">11</text>
    <text x="405" y="261" font-weight="bold" fill="#3a6a2a">7</text>
    <text x="480" y="261" font-weight="bold" fill="#a04a48" font-size="14">77</text>
    <text x="140" y="287">3</text>
    <text x="195" y="287">12</text>
    <text x="270" y="287">2</text>
    <text x="340" y="287">10</text>
    <text x="405" y="287">7</text>
    <text x="480" y="287">70</text>
  </g>
  <g stroke="#c9c5b8" stroke-width="1" filter="url(#sk)">
    <path d="M 160 194 L 160 294" fill="none"/>
    <path d="M 230 194 L 230 294" fill="none"/>
    <path d="M 310 194 L 310 294" fill="none"/>
    <path d="M 370 194 L 370 294" fill="none"/>
    <path d="M 440 194 L 440 294" fill="none"/>
  </g>

  <!-- step 3: result -->
  <text x="320" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">③ 取最大候选</text>
  <g filter="url(#sk)">
    <rect x="100" y="330" width="440" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">(12 − 1) × 7 = 77 ✓</text>
  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#8a6520">对应三元组 (i, j, k) = (0, 2, 4)，即 (nums[0] − nums[2]) × nums[4]</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="100" y="408" width="440" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="429" text-anchor="middle" font-size="12" fill="#446688">本例 sufMax 恒为 7（结尾的大数）；差值最大的 j = 2（nums[j] = 1 最小）</text>
  <text x="320" y="449" text-anchor="middle" font-size="12" fill="#446688">若所有候选 ≤ 0（如示例 3 [1,2,3]），ans 初值 0 直接兜底</text>
</svg>
