<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="336" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    只需检查相邻的两个已选元素
  </text>

  <!-- 数轴上的 7 个位置，白色 = 未选，橙色 = 已选 -->
  <g>
    <rect x="70" y="56" width="56" height="46" rx="5" fill="#fff8e1" stroke="#d6a040"
          stroke-width="2.2" filter="url(#rough2)"/>
    <text x="98" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">4</text>

    <rect x="130" y="56" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="158" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

    <rect x="190" y="56" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="218" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">5</text>

    <rect x="250" y="56" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="278" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

    <rect x="310" y="56" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="338" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>

    <rect x="370" y="56" width="56" height="46" rx="5" fill="#fff8e1" stroke="#d6a040"
          stroke-width="2.2" filter="url(#rough2)"/>
    <text x="398" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">4</text>

    <rect x="430" y="56" width="56" height="46" rx="5" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="458" y="85" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  </g>

  <!-- 下标 1..7 -->
  <text x="98" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="158" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="218" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="278" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="338" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="398" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="458" y="120" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>

  <!-- 间距标注：位置 1 与位置 6，距离 5 -->
  <path d="M 98 142 L 98 160 L 398 160 L 398 142" stroke="#b85450" stroke-width="1.8"
        fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    距离 5 &gt; max(4, 4) = 4，合法
  </text>

  <rect x="40" y="200" width="480" height="44" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    相邻两两合法 ⇒ 任意两个都合法：中间隔的段数越多，距离越大
  </text>
  <text x="280" y="237" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    d(p, q) ≥ d(p, p+1) &gt; a_p 且 d(p, q) ≥ d(q-1, q) &gt; a_q
  </text>

  <rect x="40" y="256" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    于是 dp 只需要关心「上一个被选的元素 j」，不必回头看更早的元素
  </text>
  <text x="280" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    转移：dp[i] = a_i + max{ dp[j] : 两元素相邻且 j 与 i 互相放得下 }
  </text>

  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    示例为官方第 3 组数据 4 1 5 1 1 4 1，最优选下标 1 与 6，总重 8
  </text>
</svg>
