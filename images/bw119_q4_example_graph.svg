<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：n = 3，maxDistance = 5，共 5 个可行关闭集合</text>

  <!-- 图 -->
  <g filter="url(#rough2)">
    <path d="M155,105 L345,105" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="250" y="96" text-anchor="middle" font-size="13" fill="#1c3a1c">2 ✓</text>
    <path d="M370,130 C420,180 340,240 305,255" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="432" y="205" font-size="13" fill="#7a3030">10 ✗</text>
    <path d="M135,130 C60,180 175,245 215,257" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="75" y="205" font-size="13" fill="#7a3030">10 ✗</text>
    <circle cx="130" cy="90" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="370" cy="90" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="260" cy="275" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="130" y="96" text-anchor="middle" font-size="15" fill="#28415e">0</text>
    <text x="370" y="96" text-anchor="middle" font-size="15" fill="#28415e">1</text>
    <text x="260" y="281" text-anchor="middle" font-size="15" fill="#28415e">2</text>
  </g>
  <text x="240" y="330" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">全开时 0↔2 最短路 = 10 &gt; 5 → 不合法</text>

  <!-- 关闭集合清单 -->
  <rect x="440" y="45" width="108" height="270" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">关闭集合</text>
  <g font-size="13" filter="url(#rough2)">
    <text x="460" y="92" fill="#333">{ }</text><text x="530" y="92" text-anchor="middle" fill="#b85450">✗</text>
    <text x="460" y="120" fill="#333">{0}</text><text x="530" y="120" text-anchor="middle" fill="#b85450">✗</text>
    <text x="460" y="148" fill="#333">{1}</text><text x="530" y="148" text-anchor="middle" fill="#b85450">✗</text>
    <text x="460" y="176" fill="#1c3a1c" font-weight="bold">{2}</text><text x="530" y="176" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="460" y="204" fill="#1c3a1c" font-weight="bold">{0,1}</text><text x="530" y="204" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="460" y="232" fill="#1c3a1c" font-weight="bold">{1,2}</text><text x="530" y="232" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="460" y="260" fill="#1c3a1c" font-weight="bold">{0,2}</text><text x="530" y="260" text-anchor="middle" fill="#4a7a3a">✓</text>
    <text x="460" y="288" fill="#1c3a1c" font-weight="bold">{0,1,2}</text><text x="530" y="288" text-anchor="middle" fill="#4a7a3a">✓</text>
  </g>
  <rect x="430" y="318" width="128" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="340" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">共 5 个 ✓</text>
</svg>
