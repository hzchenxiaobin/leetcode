<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">演算：前缀最大值逐位累加</text>

  <text x="76" y="60" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [1, 3, 1, 5]</text>

  <rect x="408" y="44" width="136" height="48" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="476" y="63" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">灰色格 = 下标 n−1</text>
  <text x="476" y="81" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">只作落点，不参与求和</text>

  <text x="64" y="91" font-size="12" fill="#555" filter="url(#rough2)">值 nums[i]</text>
  <text x="64" y="127" font-size="12" fill="#555" filter="url(#rough2)">前缀最大 mx</text>
  <text x="64" y="163" font-size="12" fill="#555" filter="url(#rough2)">累加 ans</text>

  <rect x="136" y="70" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="70" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="70" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="70" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="216" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="272" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="328" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <rect x="136" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="248" y="106" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="106" width="48" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="127" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="216" y="127" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="272" y="127" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="328" y="127" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">3</text>

  <rect x="136" y="142" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="142" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="142" width="48" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="304" y="142" width="48" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="216" y="163" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="272" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="328" y="163" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">7</text>

  <text x="232" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">只累加前 n−1 项：1 + 3 + 3 = 7 ✓</text>

  <text x="76" y="234" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：nums = [4, 3, 1, 3, 2]</text>

  <text x="64" y="265" font-size="12" fill="#555" filter="url(#rough2)">值 nums[i]</text>
  <text x="64" y="301" font-size="12" fill="#555" filter="url(#rough2)">前缀最大 mx</text>
  <text x="64" y="337" font-size="12" fill="#555" filter="url(#rough2)">累加 ans</text>

  <rect x="136" y="244" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="244" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="244" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="244" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="244" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="216" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="272" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="328" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="384" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="136" y="280" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="192" y="280" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="280" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="280" width="48" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="280" width="48" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="301" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="216" y="301" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="272" y="301" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="328" y="301" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="384" y="301" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">4</text>

  <rect x="136" y="316" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="316" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="316" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="316" width="48" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="316" width="48" height="32" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="216" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="272" y="337" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="328" y="337" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">16</text>
  <text x="384" y="337" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">16</text>

  <text x="260" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4 + 4 + 4 + 4 = 16 ✓（全程不换脚，一跳到底）</text>
</svg>
