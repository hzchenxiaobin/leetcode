<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="344" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">按 pushed 顺序压栈，能弹就弹</text>
  <text x="24" y="70" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">pushed</text>
  <rect x="24" y="78" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="101" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="78" y="78" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="101" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="132" y="78" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="101" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="186" y="78" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="101" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="240" y="78" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="101" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">5</text>
  <text x="24" y="146" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">popped</text>
  <rect x="24" y="154" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="177" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="78" y="154" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="177" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">5</text>
  <rect x="132" y="154" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="177" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="186" y="154" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="177" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="240" y="154" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="177" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="360" y="240" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="360" y="204" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="226" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="360" y="168" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="190" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="360" y="132" width="90" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="154" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">4</text>
  <text x="405" y="60" text-anchor="middle" font-size="12" fill="#a9761f" font-weight="bold" filter="url(#rough2)">栈</text>
  <text x="405" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">栈顶 = 4 = popped[0]</text>
  <path d="M 300 170 L 356 250" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500" y="74" width="96" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j = 1</text>
  <text x="548" y="116" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">已匹配 1 个</text>
  <text x="310" y="306" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">压一个就尽量弹到底：栈顶等于 popped[j] 时一直弹</text>
  <text x="310" y="328" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">全部弹出（j == n）才返回 true</text>
</svg>
