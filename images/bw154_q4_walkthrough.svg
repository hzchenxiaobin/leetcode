<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="356" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 3 演算：n = 4 的链 1—2—3—4（权重 2, 1, 5）</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">初始 dist = [0, 2, 3, 8]，Euler 序 tin = [1, 2, 3, 4]</text>

  <rect x="30" y="62" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">查询 / 操作</text>
  <rect x="150" y="62" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">发生了什么</text>
  <rect x="350" y="62" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="83" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">答案</text>

  <rect x="30" y="98" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="123" text-anchor="middle" font-size="10.5" fill="#333">[2, 4]</text>
  <rect x="150" y="98" width="200" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="123" text-anchor="middle" font-size="10" fill="#666">dist[4] = 2 + 1 + 5</text>
  <rect x="350" y="98" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="123" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">8</text>

  <rect x="30" y="142" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="167" text-anchor="middle" font-size="10.5" fill="#333">[2, 3]</text>
  <rect x="150" y="142" width="200" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="167" text-anchor="middle" font-size="10" fill="#666">dist[3] = 2 + 1</text>
  <rect x="350" y="142" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="167" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">3</text>

  <rect x="30" y="186" width="120" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="209" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">[1, 2, 3, 3]</text>
  <text x="90" y="226" text-anchor="middle" font-size="9.5" fill="#888">边权 1 → 3</text>
  <rect x="150" y="186" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="205" text-anchor="middle" font-size="10" fill="#8a6a20">child = 3，delta = 3 − 1 = 2</text>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#8a6a20">子树 3 = {3, 4} 整体 +2</text>
  <text x="250" y="236" text-anchor="middle" font-size="9.5" fill="#999">即对 [tin=3, tout=4] 区间加 2</text>
  <rect x="350" y="186" width="200" height="52" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="209" text-anchor="middle" font-size="10" fill="#666">dist 变为 [0, 2, 5, 10]</text>
  <text x="450" y="226" text-anchor="middle" font-size="9.5" fill="#999">节点 1、2 不变</text>

  <rect x="30" y="242" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="267" text-anchor="middle" font-size="10.5" fill="#333">[2, 2]</text>
  <rect x="150" y="242" width="200" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="267" text-anchor="middle" font-size="10" fill="#666">dist[2] 未被 delta 影响</text>
  <rect x="350" y="242" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="450" y="267" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">2</text>

  <rect x="30" y="286" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="311" text-anchor="middle" font-size="10.5" fill="#333">[2, 3]</text>
  <rect x="150" y="286" width="200" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="311" text-anchor="middle" font-size="10" fill="#666">2 + 3 = 5（吃到 delta）</text>
  <rect x="350" y="286" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="311" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">5</text>

  <text x="290" y="346" text-anchor="middle" font-size="10" fill="#999">输出 [8, 3, 2, 5] 与题面示例 3 一致；同一条边只影响它下面的子树</text>
</svg>
