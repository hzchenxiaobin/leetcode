<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：排序后一刀切</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(n log n)，n 为人数</text>
  <rect x="150.0" y="70.0" width="260.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="93.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按 (aCost - bCost) 升序排序</text>
  <path d="M 280.0 110.0 L 280.0 128.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="128.0" width="260.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="151.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n = len(costs) / 2</text>
  <path d="M 280.0 168.0 L 280.0 186.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90.0" y="186.0" width="170.0" height="48.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="175.0" y="206.2" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前 n 人</text>
  <text x="175.0" y="221.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">累加 aCost</text>
  <rect x="300.0" y="186.0" width="170.0" height="48.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="385.0" y="206.2" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">后 n 人</text>
  <text x="385.0" y="221.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">累加 bCost</text>
  <path d="M 410.0 234.0 L 410.0 254.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="250.0" y="254.0" width="250.0" height="36.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="375.0" y="275.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两者相加即为最小总费用</text>
</svg>
