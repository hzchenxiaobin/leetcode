<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描建「双形态」数组 → 倒序找首个双真槽</text>
  <path d="M 150 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 第一行：扫描 -->
  <g filter="url(#sk)"><ellipse cx="90" cy="70" rx="32" ry="17" fill="#f3efe6" stroke="#8a7a55" stroke-width="1.5"/></g>
  <text x="90" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5c3c">开始</text>

  <g filter="url(#sk)"><rect x="160" y="52" width="130" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="225" y="74" text-anchor="middle" font-size="12.5" fill="#2b6e9e">逐字符取 c ∈ s</text>

  <g filter="url(#sk)"><polygon points="310,70 370,44 430,70 370,96" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="370" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">c 为小写？</text>

  <g filter="url(#sk)"><rect x="470" y="32" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="545" y="52" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-family="monospace">lower[c−'a'] ← true</text>

  <g filter="url(#sk)"><rect x="470" y="86" width="150" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="545" y="106" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace">upper[c−'A'] ← true</text>

  <path d="M 122 70 H 156" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 290 70 H 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 70 Q 452 62 466 50" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 430 70 Q 452 80 466 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">否</text>

  <!-- 扫描回环 -->
  <path d="M 545 118 V 148 H 225 V 92" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="142" text-anchor="middle" font-size="10.5" fill="#888">取下一字符</text>
  <path d="M 380 148 V 160 H 225 V 168" stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="156" text-anchor="middle" font-size="10.5" fill="#888">扫描结束（不再折返）</text>

  <!-- 第二行：倒序判定 -->
  <g filter="url(#sk)"><rect x="160" y="172" width="130" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="225" y="194" text-anchor="middle" font-size="12" fill="#2b6e9e">扫描结束，i ← 25</text>

  <g filter="url(#sk)"><polygon points="310,190 370,164 430,190 370,216" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="370" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" font-family="monospace">lower[i] 且</text>
  <text x="370" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" font-family="monospace">upper[i] ?</text>

  <g filter="url(#sk)"><rect x="470" y="174" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="545" y="194" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" font-family="monospace">返回 'A'+i（大写）</text>

  <path d="M 290 190 H 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 430 190 H 466" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="448" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 370 216 V 236" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="379" y="230" text-anchor="start" font-size="11" font-weight="bold" fill="#a06a20">否</text>

  <g filter="url(#sk)"><polygon points="322,262 370,238 418,262 370,286" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="370" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">i &gt; 0 ?</text>

  <g filter="url(#sk)"><rect x="160" y="244" width="130" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="225" y="266" text-anchor="middle" font-size="12" fill="#2b6e9e">i ← i−1，继续倒序</text>

  <g filter="url(#sk)"><rect x="470" y="246" width="150" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="545" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48" font-family="monospace">返回 ""（无兼具字母）</text>

  <path d="M 322 262 H 294" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="307" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 418 262 H 466" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="441" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a20">否</text>
  <path d="M 225 242 V 212" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="320" y="390" text-anchor="middle" font-size="11.5" fill="#888">一趟 O(n) 扫描 + 至多 26 步倒序 —— 签到题目标：3 分钟内一次写对、不返工</text>
</svg>
