<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="460" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：word = "abcacb" → 断点 D = 2，组数 G = 3，答案 3</text>
  <path d="M 230 40 Q 470 48 710 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== word 字符与断点 ===== -->
  <text x="233" y="52" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">✂ 断点 1</text>
  <text x="337" y="52" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">✂ 断点 2</text>
  <g filter="url(#sk)"><rect x="80" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="103" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="132" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="155" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="184" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="207" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="236" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="259" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="288" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="311" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">c</text>
  <g filter="url(#sk)"><rect x="340" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="363" y="90" text-anchor="middle" font-size="15" fill="#2b6e9e" font-weight="bold">b</text>
  <text x="103" y="124" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="155" y="124" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="207" y="124" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="259" y="124" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="311" y="124" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="363" y="124" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- 段下划线 -->
  <path d="M 80 134 L 230 134" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 236 134 L 334 134" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 340 134 L 386 134" stroke="#4a8e4a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="155" y="156" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 1：abc</text>
  <text x="285" y="156" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 2：ac</text>
  <text x="363" y="156" text-anchor="middle" font-size="10.5" fill="#2e6e2e">段 3：b</text>
  <text x="40" y="176" font-size="11" fill="#2e6e2e" font-weight="bold">每段严格递增 ⇒ 都是 "abc" 的子序列 ⇒ 一段恰好装一组 ✓</text>

  <!-- ===== 左侧走查表 ===== -->
  <g filter="url(#sk)"><rect x="60" y="196" width="436" height="26" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="78" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">i</text>
  <text x="131" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">word[i−1]</text>
  <text x="201" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">word[i]</text>
  <text x="284" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">比较</text>
  <text x="384" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">断点？</text>
  <text x="466" y="214" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">累计 G</text>

  <g filter="url(#sk)"><rect x="60" y="222" width="436" height="26" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
  <text x="78" y="240" text-anchor="middle" font-size="11.5" fill="#444">1</text>
  <text x="131" y="240" text-anchor="middle" font-size="11.5" fill="#444">a</text>
  <text x="201" y="240" text-anchor="middle" font-size="11.5" fill="#444">b</text>
  <text x="284" y="240" text-anchor="middle" font-size="11.5" fill="#444">b &gt; a</text>
  <text x="384" y="240" text-anchor="middle" font-size="11.5" fill="#999">否</text>
  <text x="466" y="240" text-anchor="middle" font-size="11.5" fill="#444">1</text>

  <g filter="url(#sk)"><rect x="60" y="248" width="436" height="26" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
  <text x="78" y="266" text-anchor="middle" font-size="11.5" fill="#444">2</text>
  <text x="131" y="266" text-anchor="middle" font-size="11.5" fill="#444">b</text>
  <text x="201" y="266" text-anchor="middle" font-size="11.5" fill="#444">c</text>
  <text x="284" y="266" text-anchor="middle" font-size="11.5" fill="#444">c &gt; b</text>
  <text x="384" y="266" text-anchor="middle" font-size="11.5" fill="#999">否</text>
  <text x="466" y="266" text-anchor="middle" font-size="11.5" fill="#444">1</text>

  <g filter="url(#sk)"><rect x="60" y="274" width="436" height="26" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="331" y="274" width="105" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="78" y="292" text-anchor="middle" font-size="11.5" fill="#444">3</text>
  <text x="131" y="292" text-anchor="middle" font-size="11.5" fill="#444">c</text>
  <text x="201" y="292" text-anchor="middle" font-size="11.5" fill="#444">a</text>
  <text x="284" y="292" text-anchor="middle" font-size="11.5" fill="#444">a ≤ c</text>
  <text x="384" y="292" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold">是 ✂</text>
  <text x="466" y="292" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">2</text>

  <g filter="url(#sk)"><rect x="60" y="300" width="436" height="26" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
  <text x="78" y="318" text-anchor="middle" font-size="11.5" fill="#444">4</text>
  <text x="131" y="318" text-anchor="middle" font-size="11.5" fill="#444">a</text>
  <text x="201" y="318" text-anchor="middle" font-size="11.5" fill="#444">c</text>
  <text x="284" y="318" text-anchor="middle" font-size="11.5" fill="#444">c &gt; a</text>
  <text x="384" y="318" text-anchor="middle" font-size="11.5" fill="#999">否</text>
  <text x="466" y="318" text-anchor="middle" font-size="11.5" fill="#444">2</text>

  <g filter="url(#sk)"><rect x="60" y="326" width="436" height="26" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="331" y="326" width="105" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="78" y="344" text-anchor="middle" font-size="11.5" fill="#444">5</text>
  <text x="131" y="344" text-anchor="middle" font-size="11.5" fill="#444">c</text>
  <text x="201" y="344" text-anchor="middle" font-size="11.5" fill="#444">b</text>
  <text x="284" y="344" text-anchor="middle" font-size="11.5" fill="#444">b ≤ c</text>
  <text x="384" y="344" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold">是 ✂</text>
  <text x="466" y="344" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">3</text>

  <!-- ===== 右侧装组示意 ===== -->
  <text x="540" y="206" font-size="12" fill="#7a5415" font-weight="bold">3 段 → 3 组：插入 0 + 1 + 2 = 3 个字符</text>
  <text x="540" y="243" font-size="11.5" fill="#444">段 1 → 组 1：</text>
  <g filter="url(#sk)"><rect x="660" y="222" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="677" y="244" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="700" y="222" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="717" y="244" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="740" y="222" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="757" y="244" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="800" y="244" font-size="11" fill="#2e6e2e" font-weight="bold">插 0</text>

  <text x="540" y="291" font-size="11.5" fill="#444">段 2 → 组 2：</text>
  <g filter="url(#sk)"><rect x="660" y="270" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="677" y="292" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="700" y="270" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="717" y="292" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="740" y="270" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="757" y="292" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="800" y="292" font-size="11" fill="#7a5415" font-weight="bold">插 1（b）</text>

  <text x="540" y="339" font-size="11.5" fill="#444">段 3 → 组 3：</text>
  <g filter="url(#sk)"><rect x="660" y="318" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="677" y="340" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">a</text>
  <g filter="url(#sk)"><rect x="700" y="318" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="717" y="340" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">b</text>
  <g filter="url(#sk)"><rect x="740" y="318" width="34" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="757" y="340" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">c</text>
  <text x="800" y="340" font-size="11" fill="#7a5415" font-weight="bold">插 2（a、c）</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)"><rect x="40" y="392" width="860" height="52" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="62" y="418" font-size="12.5" fill="#7a5415" font-weight="bold">答案 = 3G − n = 3 × 3 − 6 = 3，目标串 "abcabcabc"</text>
  <text x="62" y="438" font-size="10.5" fill="#666">交叉验证："b"→G=1→2 ✓　　"aaa"→G=3→6 ✓　　"abc"→G=1→0 ✓</text>
</svg>
