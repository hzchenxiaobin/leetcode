<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：每个数组只留首尾，答案 = maxVal[j] − minVal[i]（i ≠ j）</text>
  <path d="M 160 38 Q 360 46 560 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 数组 0 -->
  <text x="58" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">arr0</text>
    <rect x="90" y="58" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="144" y="58" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="198" y="58" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="117" y="82" text-anchor="middle" font-size="14" fill="#3d6b2f" filter="url(#rough2)">1</text>
  <text x="171" y="82" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <text x="225" y="82" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="262" y="72" font-size="12" fill="#4a7a3a" filter="url(#rough2)">首元素 = minVal</text>
  <text x="262" y="90" font-size="12" fill="#8a6d1f" filter="url(#rough2)">末元素 = maxVal</text>

  <!-- 数组 1 -->
  <text x="58" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">arr1</text>
    <rect x="90" y="116" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="144" y="116" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="117" y="140" text-anchor="middle" font-size="14" fill="#3d6b2f" filter="url(#rough2)">4</text>
  <text x="171" y="140" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="262" y="140" font-size="12" fill="#666" filter="url(#rough2)">长度 1 时首尾重合</text>

  <!-- 数组 2 -->
  <text x="58" y="192" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">arr2</text>
    <rect x="90" y="174" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="144" y="174" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="198" y="174" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="117" y="198" text-anchor="middle" font-size="14" fill="#3d6b2f" filter="url(#rough2)">1</text>
  <text x="171" y="198" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <text x="225" y="198" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <!-- 结论：只留首尾 -->
    <rect x="400" y="56" width="290" height="156" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="80" text-anchor="middle" font-size="13" fill="#2b5a88" font-weight="bold" filter="url(#rough2)">升序 ⇒ 中间元素是"废票"</text>
  <text x="545" y="104" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">对 arr0 中任意 a：1 ≤ a ≤ 3</text>
  <text x="545" y="126" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">|a − 5| ≤ max(5−1, 5−3) = 4</text>
  <text x="545" y="148" text-anchor="middle" font-size="11.5" fill="#2b5a88" filter="url(#rough2)">中间元素 2 只拿到 |2−5| = 3 &lt; 4</text>
  <text x="545" y="176" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每个数组压缩成一个区间 [mn, mx]</text>
  <text x="545" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">规模从 total 个数降到 m 个区间</text>

  <!-- 同数组陷阱 -->
    <rect x="60" y="228" width="640" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="250" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">陷阱：全局最小与全局最大可能落在同一个数组里，不许直接相减</text>
  <text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">arrays = [[0,9],[3,4]]：全局 min 0、max 9 都在 arr0，9 − 0 非法</text>
  <text x="380" y="292" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">合法最优只能跨数组：max(|0−4|, |9−3|) = 6 ✓</text>

  <!-- 公式 -->
    <rect x="60" y="316" width="640" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="340" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">答案 = max{ maxVal[j] − minVal[i] : i ≠ j }（有序对全取一遍）</text>
  <text x="380" y="362" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">任意 a ∈ arr_i、b ∈ arr_j 都有 |a−b| ≤ max(maxVal[j]−minVal[i], maxVal[i]−minVal[j])</text>
  <text x="380" y="380" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">两端的界都能被首尾元素取到 ⇒ 只需枚举"谁出最小、谁出最大"</text>

  <text x="360" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">于是问题从"选两个数"变成"选两个数组 + 各自的首/尾"</text>
</svg>
