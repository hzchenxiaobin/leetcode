<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="580" height="330" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333">路径掩码 = W[u] ⊕ W[v] ⊕ mask[lca]</text>

  <circle cx="80" cy="70" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="76" text-anchor="middle" font-size="11">0</text>
  <circle cx="170" cy="70" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="11">1</text>
  <circle cx="260" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11">3</text>
  <circle cx="170" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="196" text-anchor="middle" font-size="11">4</text>
  <circle cx="330" cy="70" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="76" text-anchor="middle" font-size="11">2</text>
  <circle cx="330" cy="190" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="196" text-anchor="middle" font-size="11">7</text>

  <path d="M100,70 L146,70" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M190,82 L248,118" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M190,70 L306,70" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M182,184 L254,140" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M330,90 L330,166" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="132" font-size="10" fill="#b85450">u=2, v=7</text>

  <rect x="40" y="222" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="11" fill="#333">W[u] ⊕ W[v]：根到 lca(2,7)=1 的部分被算了两次而抵消</text>
  <text x="56" y="260" font-size="11" fill="#333">再异或 mask[1] 把 lca 本身补回来 → 正好是路径 2-1-7</text>

  <rect x="40" y="276" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="11" fill="#333">点更新 x：子树的全部 W 都异或 δ = old ⊕ new（欧拉序上是连续区间）</text>
</svg>
