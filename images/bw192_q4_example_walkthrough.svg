<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [4, 1, 2]，k = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">P = [0, 4, 5, 7] → c = [0, 1, 2, 1]；w = [2·4, 2·1, 2·2] mod 3 = [2, 2, 1]</text>

  <text x="75" y="78" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">c[p] →</text>
  <rect x="110" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="156" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="202" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="58" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="269" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="131" y="102" text-anchor="middle" font-size="9" fill="#999">p=0</text>
  <text x="177" y="102" text-anchor="middle" font-size="9" fill="#999">p=1</text>
  <text x="223" y="102" text-anchor="middle" font-size="9" fill="#999">p=2</text>
  <text x="269" y="102" text-anchor="middle" font-size="9" fill="#999">p=3</text>

  <text x="75" y="152" text-anchor="end" font-size="11" fill="#8a6d1a" font-weight="bold">w[t] →</text>
  <rect x="110" y="132" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="156" y="132" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="202" y="132" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="131" y="176" text-anchor="middle" font-size="9" fill="#999">t=0</text>
  <text x="177" y="176" text-anchor="middle" font-size="9" fill="#999">t=1</text>
  <text x="223" y="176" text-anchor="middle" font-size="9" fill="#999">t=2</text>

  <rect x="330" y="52" width="200" height="140" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="345" y="74" font-size="10.5" fill="#446688" font-weight="bold">first = {0:0, 1:1, 2:2}</text>
  <text x="345" y="94" font-size="10.5" fill="#446688" font-weight="bold">last = {0:0, 1:3, 2:2}</text>
  <text x="345" y="114" font-size="10.5" fill="#8a6d1a" font-weight="bold">occ[1] = [2]（w=1 仅 t=2）</text>
  <text x="345" y="134" font-size="10.5" fill="#8a6d1a" font-weight="bold">occ[2] = [0, 1]（w=2 的位置）</text>
  <text x="345" y="160" font-size="10" fill="#b85450" font-weight="bold">零取反：last[1] − first[1] = 2</text>
  <text x="345" y="178" font-size="9.5" fill="#999">（余数 1 出现在 p=1 和 p=3）</text>

  <rect x="50" y="198" width="460" height="24" fill="#e8f0fe" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(a, δ)</text>
  <text x="160" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">first[a]</text>
  <text x="224" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">t* 后继</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">b</text>
  <text x="359" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">last[b] &gt; t* ?</text>
  <text x="462" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">长度</text>

  <rect x="50" y="222" width="460" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="89" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">(0, 1)</text>
  <text x="160" y="238" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="224" y="238" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="280" y="238" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="359" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 &gt; 2 ✓</text>
  <text x="462" y="238" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 − 0 = 3</text>

  <rect x="50" y="246" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="89" y="262" text-anchor="middle" font-size="10.5" fill="#333">(0, 2)</text>
  <text x="160" y="262" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="224" y="262" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="359" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2 &gt; 0 ✓</text>
  <text x="462" y="262" text-anchor="middle" font-size="10.5" fill="#333">2 − 0 = 2</text>

  <rect x="50" y="270" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="89" y="286" text-anchor="middle" font-size="10.5" fill="#333">(1, 1)</text>
  <text x="160" y="286" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="224" y="286" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="280" y="286" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="359" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2 ≤ 2 ✗</text>
  <text x="462" y="286" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <rect x="50" y="294" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="89" y="310" text-anchor="middle" font-size="10.5" fill="#333">(1, 2)</text>
  <text x="160" y="310" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="224" y="310" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="359" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">0 ≤ 1 ✗</text>
  <text x="462" y="310" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <rect x="50" y="318" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="89" y="334" text-anchor="middle" font-size="10.5" fill="#333">(2, δ)</text>
  <text x="160" y="334" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="224" y="334" text-anchor="middle" font-size="10.5" fill="#999">无后继</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="359" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <text x="462" y="334" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <rect x="50" y="342" width="460" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="89" y="358" text-anchor="middle" font-size="10.5" fill="#333">(3, δ)</text>
  <text x="160" y="358" text-anchor="middle" font-size="10.5" fill="#999">不存在</text>
  <text x="224" y="358" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#999">—</text>
  <text x="359" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>
  <text x="462" y="358" text-anchor="middle" font-size="10.5" fill="#999">—</text>

  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">最优：a=0, δ=1 → 取反 t=2，右端 s=last[1]=3 → 长度 3（取反 nums[2]=2 后和为 4+1−2=3）✓</text>
</svg>
