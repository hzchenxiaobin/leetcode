<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：状态图不是一张网，而是一条链（3 位共 8 个状态）</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">操作 2 需低 i 位恰为 10…0₂（前提互斥）→ 每点至多 2 种操作；8 个状态蛇形排成一条链，格内 i 为链上位置</text>

  <!-- 第一行：000 → 001 → 011 → 010 -->
  <g filter="url(#r)"><rect x="84" y="64" width="52" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="110" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">000</text>
  <text x="110" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=0</text>
  <text x="110" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#r)">★目标 0</text>

  <g filter="url(#r)"><rect x="224" y="64" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="250" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">001</text>
  <text x="250" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=1</text>

  <g filter="url(#r)"><rect x="364" y="64" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="390" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">011</text>
  <text x="390" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=2</text>

  <g filter="url(#r)"><rect x="504" y="64" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="530" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">010</text>
  <text x="530" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=3</text>

  <g filter="url(#r)"><line x1="140" y1="88" x2="218" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="179" y="58" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作1·翻bit0</text>
  <g filter="url(#r)"><line x1="280" y1="88" x2="358" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="319" y="58" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作2·翻bit1</text>
  <g filter="url(#r)"><line x1="420" y1="88" x2="498" y2="88" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="459" y="58" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作1·翻bit0</text>

  <!-- 竖直连接：010 → 110 -->
  <g filter="url(#r)"><line x1="530" y1="116" x2="530" y2="162" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="542" y="134" font-size="9" fill="#666" filter="url(#r)">操作2·翻bit2</text>
  <text x="542" y="150" font-size="8.5" fill="#888" filter="url(#r)">(低位=10₂ ✓)</text>

  <!-- 第二行：110 ← 111 ← 101 ← 100（链从右往左走） -->
  <g filter="url(#r)"><rect x="504" y="168" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="530" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">110</text>
  <text x="530" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=4</text>

  <g filter="url(#r)"><rect x="364" y="168" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="390" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">111</text>
  <text x="390" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=5</text>

  <g filter="url(#r)"><rect x="224" y="168" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="250" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">101</text>
  <text x="250" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=6</text>

  <g filter="url(#r)"><rect x="84" y="168" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="110" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">100</text>
  <text x="110" y="206" text-anchor="middle" font-size="9" fill="#888" filter="url(#r)">i=7</text>

  <g filter="url(#r)"><line x1="500" y1="192" x2="420" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="460" y="232" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作1·翻bit0</text>
  <g filter="url(#r)"><line x1="360" y1="192" x2="280" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="320" y="232" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作2·翻bit1</text>
  <g filter="url(#r)"><line x1="220" y1="192" x2="140" y2="192" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/></g>
  <text x="180" y="232" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#r)">操作1·翻bit0</text>

  <!-- 100 之后链继续向高位延伸（虚线） -->
  <g filter="url(#r)"><line x1="82" y1="192" x2="48" y2="192" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/></g>
  <text x="64" y="212" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#r)">链继续</text>
  <text x="64" y="226" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#r)">1100₂ ⋯</text>

  <text x="530" y="244" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">n=6 → 位置 4 = 答案 4</text>

  <!-- 观察框 1 -->
  <g filter="url(#r)"><rect x="42" y="258" width="270" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="177" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">为什么恰好是一条链？</text>
  <text x="56" y="300" font-size="9.5" fill="#555" filter="url(#r)">操作 1 恒可用 → +1 条边</text>
  <text x="56" y="316" font-size="9.5" fill="#555" filter="url(#r)">操作 2 前提互斥 → 至多 +1 条边</text>
  <text x="56" y="332" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#r)">→ 每点度恰 2；仅 0 度 = 1（唯一端点）</text>

  <!-- 观察框 2 -->
  <g filter="url(#r)"><rect x="308" y="258" width="270" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="443" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">答案 = n 在 Gray 链上的位置</text>
  <text x="322" y="300" font-size="9.5" fill="#555" filter="url(#r)">gray(i) = i⊕(i≫1)，相邻转移全合法</text>
  <text x="322" y="316" font-size="9.5" fill="#555" filter="url(#r)">整图 = 这条链，再无捷径（§5 定理）</text>
  <text x="322" y="332" font-size="9.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">f(6)：110₂ 在 i=4 → 答案 4 ✓</text>
</svg>
