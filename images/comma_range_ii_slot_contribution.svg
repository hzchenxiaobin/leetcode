<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">贡献法：逐「逗号槽位」独立计数</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- big number with highlighted commas -->
  <text x="320" y="94" text-anchor="middle" font-size="27" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">1<tspan fill="#b85450">,</tspan>234<tspan fill="#b85450">,</tspan>567<tspan fill="#b85450">,</tspan>890</text>

  <!-- slot labels with arrows pointing at commas -->
  <path d="M 250 134 Q 250 118 251 106" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 308 134 Q 308 118 308 106" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <path d="M 366 134 Q 366 118 365 106" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">槽位 3</text>
  <text x="308" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">槽位 2</text>
  <text x="366" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">槽位 1</text>

  <!-- equivalence box -->
  <g filter="url(#sk)">
    <rect x="55" y="168" width="530" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">槽位 j（第 3j 位与第 3j+1 位之间）出现逗号</text>
  <text x="320" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">⟺ 该数 ≥ 10^(3j)，即至少有 3j+1 位</text>

  <!-- three example boxes -->
  <g filter="url(#sk2)">
    <rect x="45" y="250" width="170" height="66" rx="8" fill="#ffffff" stroke="#9db8cc" stroke-width="1.2"/>
  </g>
  <text x="130" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">987</text>
  <text x="130" y="300" text-anchor="middle" font-size="11.5" fill="#666">3 位 &lt; 4 位，无槽位</text>

  <g filter="url(#sk2)">
    <rect x="235" y="250" width="170" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">12,345</text>
  <text x="320" y="300" text-anchor="middle" font-size="11.5" fill="#2b6e9e">≥ 10³ → 只有槽位 1</text>

  <g filter="url(#sk2)">
    <rect x="425" y="250" width="170" height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="510" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">1,234,567</text>
  <text x="510" y="300" text-anchor="middle" font-size="11.5" fill="#7a5415">≥ 10³、10⁶ → 槽位 1、2</text>

  <!-- bottom formula -->
  <g filter="url(#sk)">
    <rect x="70" y="338" width="500" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">ans = Σ(j≥1) max(0, n − 10^(3j) + 1)</text>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#8a3a36">槽位 j 的贡献 = [1, n] 中 ≥ 10^(3j) 的整数个数</text>
  <text x="320" y="411" text-anchor="middle" font-size="11" fill="#999">n ≤ 10^15 → 至多 5 项（j = 1..5）</text>
</svg>
