<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 走查：6 条边里只有 4 条要留下</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">红点 = 有苹果，绿边 = 子树含苹果因此必须往返</text>

  <path d="M 187 92 L 123 148" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 214 92 L 287 148" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 102 176 L 70 234" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 118 176 L 144 234" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 291 176 L 260 234" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 309 176 L 341 234" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="200" cy="80" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="110" cy="160" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="300" cy="160" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="62" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="152" cy="250" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="252" cy="250" r="18" fill="#eef0f2" stroke="#8a8a8a" stroke-width="1.6"/>
    <circle cx="350" cy="250" r="18" fill="#eef0f2" stroke="#8a8a8a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="200" y="85" fill="#2e5a24">0</text>
    <text x="110" y="165" fill="#2e5a24">1</text>
    <text x="300" y="165" fill="#8f3830">2</text>
    <text x="62" y="255" fill="#8f3830">4</text>
    <text x="152" y="255" fill="#8f3830">5</text>
    <text x="252" y="255" fill="#555">3</text>
    <text x="350" y="255" fill="#555">6</text>
  </g>

  <text x="300" y="216" font-size="11" fill="#777" filter="url(#sk)">剪掉</text>

  <g filter="url(#sk)">
    <rect x="380" y="66" width="238" height="234" rx="10" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
    <path d="M 380 98 L 618 98" stroke="#c8c8c8" stroke-width="1.2"/>
    <path d="M 380 128 L 618 128" stroke="#eeeeee" stroke-width="1"/>
    <path d="M 380 156 L 618 156" stroke="#eeeeee" stroke-width="1"/>
    <path d="M 380 184 L 618 184" stroke="#eeeeee" stroke-width="1"/>
    <path d="M 380 212 L 618 212" stroke="#eeeeee" stroke-width="1"/>
    <path d="M 380 240 L 618 240" stroke="#eeeeee" stroke-width="1"/>
    <path d="M 380 268 L 618 268" stroke="#eeeeee" stroke-width="1"/>
  </g>
  <g filter="url(#sk)" font-size="11.5" fill="#444">
    <text x="394" y="88" font-weight="bold">边</text>
    <text x="458" y="88" font-weight="bold">子树含苹果</text>
    <text x="568" y="88" font-weight="bold">秒数</text>

    <text x="394" y="120">(0,1)</text>
    <text x="458" y="120">是（4,5）</text>
    <text x="568" y="120" fill="#2e5a24" font-weight="bold">2</text>

    <text x="394" y="148">(0,2)</text>
    <text x="458" y="148">是（2）</text>
    <text x="568" y="148" fill="#2e5a24" font-weight="bold">2</text>

    <text x="394" y="176">(1,4)</text>
    <text x="458" y="176">是（4）</text>
    <text x="568" y="176" fill="#2e5a24" font-weight="bold">2</text>

    <text x="394" y="204">(1,5)</text>
    <text x="458" y="204">是（5）</text>
    <text x="568" y="204" fill="#2e5a24" font-weight="bold">2</text>

    <text x="394" y="232">(2,3)</text>
    <text x="458" y="232" fill="#777">否</text>
    <text x="568" y="232" fill="#777">0</text>

    <text x="394" y="260">(2,6)</text>
    <text x="458" y="260" fill="#777">否</text>
    <text x="568" y="260" fill="#777">0</text>

    <text x="394" y="288" font-weight="bold" fill="#8f3830">合计 4 条边，×2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="322" width="552" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" font-size="12">
    <text x="58" y="346" fill="#8f3830" font-weight="bold">自底向上标记 need：2、4、5 自带苹果，1 收到 4/5，0 收到 1/2</text>
    <text x="58" y="368" fill="#8f3830">于是 need = {0,1,2,4,5}，非根且 need 为真的点恰好 4 个</text>
    <text x="58" y="388" fill="#8f3830" font-weight="bold">答案 = 2 × 4 = 8 秒（示例 1 的官方输出）</text>
  </g>
</svg>
