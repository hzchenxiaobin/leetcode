<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="310" y="27" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 走查：阶梯 = [(1,9),(2,5),(3,4),(4,2)]，三个查询各命中一段</text>
  <path d="M 120 37 Q 310 45 500 37" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 阶梯表格 -->
  <g filter="url(#sk)">
    <rect x="95" y="52" width="64" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="159" y="52" width="104" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="263" y="52" width="104" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="367" y="52" width="104" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="471" y="52" width="104" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>

    <rect x="95" y="88" width="64" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="159" y="88" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="263" y="88" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="367" y="88" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="471" y="88" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>

    <rect x="95" y="124" width="64" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="159" y="124" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="263" y="124" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="367" y="124" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="471" y="124" width="104" height="36" fill="#ffffff" stroke="#8a8a80" stroke-width="1.4"/>

    <rect x="95" y="160" width="64" height="36" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.4"/>
    <rect x="159" y="160" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="263" y="160" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="367" y="160" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="471" y="160" width="104" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>

  <text x="127" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">下标 i</text>
  <text x="211" y="75" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="315" y="75" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="419" y="75" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="523" y="75" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3</text>

  <text x="127" y="111" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">x</text>
  <text x="211" y="111" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="315" y="111" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">2</text>
  <text x="419" y="111" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3</text>
  <text x="523" y="111" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">4</text>

  <text x="127" y="147" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">y</text>
  <text x="211" y="147" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">9</text>
  <text x="315" y="147" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">5</text>
  <text x="419" y="147" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">4</text>
  <text x="523" y="147" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">2</text>

  <text x="127" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">w=x+y</text>
  <text x="211" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">10</text>
  <text x="315" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">7</text>
  <text x="419" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">7</text>
  <text x="523" y="183" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">6</text>

  <!-- 表格右侧形态标注 -->
  <text x="592" y="106" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">严格递增</text>
  <text x="592" y="120" font-size="10" fill="#4a7a3a" filter="url(#sk)">→ ↑</text>
  <text x="592" y="142" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#sk)">严格递减</text>
  <text x="592" y="156" font-size="10" fill="#446688" filter="url(#sk)">→ ↓</text>
  <text x="592" y="178" font-size="10.5" fill="#a05a20" font-weight="bold" filter="url(#sk)">不单调！</text>
  <text x="592" y="192" font-size="10" fill="#a05a20" filter="url(#sk)">需区间最值</text>

  <!-- 查询 1 -->
  <rect x="95" y="238" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="147" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">查询 (4,1)</text>
  <g filter="url(#sk)">
    <rect x="210" y="238" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
    <rect x="262" y="238" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
    <rect x="314" y="238" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
    <rect x="366" y="238" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="236" y="261" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">10</text>
  <text x="288" y="261" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">7</text>
  <text x="340" y="261" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">7</text>
  <text x="392" y="261" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">6</text>
  <text x="436" y="253" font-size="10.5" fill="#2b2b2b" filter="url(#sk)">L=3（x≥4），R=3（y≥1）</text>
  <text x="436" y="270" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">答案 = max(w[3..3]) = 6</text>

  <!-- 查询 2 -->
  <rect x="95" y="310" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="147" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">查询 (1,3)</text>
  <g filter="url(#sk)">
    <rect x="210" y="310" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="262" y="310" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="314" y="310" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="366" y="310" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
  </g>
  <text x="236" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">10</text>
  <text x="288" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">7</text>
  <text x="340" y="333" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">7</text>
  <text x="392" y="333" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">6</text>
  <text x="436" y="325" font-size="10.5" fill="#2b2b2b" filter="url(#sk)">L=0，y≥3 止于 R=2（y=4≥3, 2&lt;3）</text>
  <text x="436" y="342" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">答案 = max(w[0..2]) = 10</text>

  <!-- 查询 3 -->
  <rect x="95" y="382" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="147" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">查询 (2,5)</text>
  <g filter="url(#sk)">
    <rect x="210" y="382" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
    <rect x="262" y="382" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="314" y="382" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
    <rect x="366" y="382" width="52" height="36" fill="#f2f2ee" stroke="#b8b8b0" stroke-width="1.2"/>
  </g>
  <text x="236" y="405" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">10</text>
  <text x="288" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415" filter="url(#sk)">7</text>
  <text x="340" y="405" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">7</text>
  <text x="392" y="405" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">6</text>
  <text x="436" y="397" font-size="10.5" fill="#2b2b2b" filter="url(#sk)">L=1（x≥2），R=1（y=5≥5, 4&lt;5）</text>
  <text x="436" y="414" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">答案 = max(w[1..1]) = 7</text>

  <!-- 底注 -->
  <text x="310" y="452" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">三段分别命中 [3,3]、[0,2]、[1,1] → 答案 [6, 10, 7]；每查询 2 次二分 + 1 次 ST 表 O(1) 区间最大</text>
</svg>
