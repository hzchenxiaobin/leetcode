<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：换成「值视角」逐个数判定</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">fronts = [1, 2, 4, 4, 7]　　backs = [1, 3, 4, 1, 3]</text>

  <rect x="50" y="64" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#33507a" font-weight="bold" text-anchor="middle">
    <text x="92" y="83">值 v</text>
    <text x="252" y="83">出现位置</text>
    <text x="437" y="83">在封锁集合 S 中？</text>
    <text x="552" y="83">候选？</text>
  </g>

  <!-- v = 1 -->
  <rect x="50" y="96" width="540" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="92" y="116" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="252" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">卡 0 正/背（同数）、卡 3 背面</text>
  <text x="437" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是（卡 0 两面都是 1）</text>
  <text x="552" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- v = 2 答案行 -->
  <rect x="50" y="128" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="92" y="148" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="252" y="148" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">卡 1 正面</text>
  <text x="437" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="552" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- v = 3 -->
  <rect x="50" y="160" width="540" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="92" y="180" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="252" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">卡 1 背面、卡 4 背面</text>
  <text x="437" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="552" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- v = 4 -->
  <rect x="50" y="192" width="540" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="92" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="252" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">卡 2 正/背（同数）、卡 3 正面</text>
  <text x="437" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是（卡 2 两面都是 4）</text>
  <text x="552" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- v = 7 -->
  <rect x="50" y="224" width="540" height="30" fill="#f6f8fb" stroke="#c8d2e0" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="92" y="244" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="252" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">卡 4 正面</text>
  <text x="437" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="552" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="310" y="274" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只需检查「出现过的数」：没出现过的数印不在任何卡片上，谈不上朝下</text>

  <rect x="50" y="290" width="540" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="68" y="312" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">候选集合 = {2, 3, 7}　→　答案 = min = 2</text>
  <text x="68" y="331" font-size="10" fill="#555" filter="url(#rough2)">3 与 7 也能做成好数字，但不够小；1 与 4 被「两面同数」封锁，直接出局。</text>

  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">取哪张卡当「被选中的卡」并不重要：拦住 x 的永远是「x 朝上的卡」而非选卡方式</text>
</svg>
