<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：beans = [4,1,6,5] → 排序 [1,4,5,6]，total = 16</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- table outer frame -->
  <rect x="60" y="60" width="540" height="216" rx="6" fill="#ffffff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="60" y="60" width="540" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="175" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">t = beans[i]</text>
  <text x="275" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">k = n − i</text>
  <text x="400" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">保留 = t·k</text>
  <text x="535" y="83" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">拿出 = 16 − t·k</text>

  <!-- row separators and column separators -->
  <g filter="url(#rough2)">
    <path d="M 60 144 L 600 144 M 60 188 L 600 188 M 60 232 L 600 232" stroke="#999" stroke-width="1.1" fill="none"/>
    <path d="M 130 60 L 130 276 M 220 60 L 220 276 M 330 60 L 330 276 M 470 60 L 470 276" stroke="#bbb" stroke-width="1" fill="none"/>
  </g>

  <!-- row 0 -->
  <text x="95" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="175" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="275" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="400" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="535" y="128" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>

  <!-- row 1 (highlight) -->
  <rect x="61" y="144" width="538" height="44" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="95" y="172" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="172" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="275" y="172" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="400" y="172" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="535" y="172" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 ←</text>

  <!-- row 2 -->
  <text x="95" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="275" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="535" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- row 3 -->
  <text x="95" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="275" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="400" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="535" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>

  <!-- conclusion box 1 -->
  <rect x="30" y="298" width="580" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="319" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">最优 i = 1（t = 4）：保留 4 × 3 = 12 颗 → 拿出 16 − 12 = 4 ✓</text>
  <text x="320" y="340" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对应操作：袋子 1 清空，袋子 5、6 各削到 4</text>

  <!-- conclusion box 2 -->
  <rect x="30" y="362" width="580" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="383" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">示例 2 [2,10,3,2] → 排序 [2,2,3,10]，total = 17</text>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 3 时 10 × 1 = 10 最大 → 拿出 17 − 10 = 7 ✓</text>
</svg>
