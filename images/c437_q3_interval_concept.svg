<svg xmlns="http://www.w3.org/2000/svg" width="680" height="596" viewBox="0 0 680 596" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="596" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：特殊子串 ⟺ 包住内部每个字母的全部出现</text>
  <path d="M 90 42 Q 340 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="30" y="72" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 每个字母的全部出现构成区间 [first, last]（以 s = "cdefdc" 为例）</text>

  <g filter="url(#rough2)">
    <rect x="190" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="240" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="290" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="340" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="390" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="440" y="86" width="50" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="215" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <text x="265" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <text x="315" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">e</text>
  <text x="365" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">f</text>
  <text x="415" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">d</text>
  <text x="465" y="111" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <text x="215" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="265" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="315" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="365" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="415" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="465" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <g filter="url(#rough2)">
    <rect x="190" y="158" width="300" height="11" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="182" width="200" height="11" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="290" y="206" width="50" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="230" width="50" height="11" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="500" y="169" font-size="11" fill="#446688" filter="url(#rough2)">c → [0,5]</text>
  <text x="500" y="193" font-size="11" fill="#4a7a3a" filter="url(#rough2)">d → [1,4]</text>
  <text x="500" y="217" font-size="11" fill="#a06a1a" filter="url(#rough2)">e → [2,2]</text>
  <text x="500" y="241" font-size="11" fill="#a06a1a" filter="url(#rough2)">f → [3,3]</text>

  <text x="30" y="274" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 从 l = first[c] 出发向右吸收 → 每个起点只有一个最短候选</text>

  <text x="160" y="300" text-anchor="end" font-size="11.5" fill="#444" filter="url(#rough2)">起点 e（l=2）</text>
  <path d="M 166 296 H 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="194" y="284" width="400" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="300" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">内部只有 e，立即稳定 → [2,2] ✓</text>

  <text x="160" y="330" text-anchor="end" font-size="11.5" fill="#444" filter="url(#rough2)">起点 d（l=1）</text>
  <path d="M 166 326 H 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="194" y="314" width="400" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="330" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">顺路包住 e、f 的全部出现 → [1,4] ✓</text>

  <text x="160" y="360" text-anchor="end" font-size="11.5" fill="#444" filter="url(#rough2)">起点 c（l=0）</text>
  <path d="M 166 356 H 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="194" y="344" width="400" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="394" y="360" text-anchor="middle" font-size="11.5" fill="#b03a3a" filter="url(#rough2)">包住全部字母 → [0,5] = 整串 ✗ 丢弃</text>

  <text x="30" y="394" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">③ 候选可能嵌套：交给「按右端点排序」的区间贪心，勿手动取舍</text>

  <g filter="url(#rough2)">
    <rect x="100" y="412" width="270" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="140" y="444" width="80" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="250" y="444" width="80" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="420" y="412" width="230" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 3"/>
  </g>
  <text x="235" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">d：[1,4]</text>
  <text x="180" y="472" text-anchor="middle" font-size="12" fill="#a06a1a" filter="url(#rough2)">e [2,2]</text>
  <text x="290" y="472" text-anchor="middle" font-size="12" fill="#a06a1a" filter="url(#rough2)">f [3,3]</text>
  <text x="535" y="450" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#rough2)">c 扩展成 [0,5] = 整串</text>
  <text x="535" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">✗ 直接排除，不算候选</text>

  <text x="340" y="524" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">贪心按右端点升序先选 e（pre=2）、再选 f（3 &gt; 2），d 因左端 1 ≤ 3 落选 → 本串最多 2 个</text>

  <rect x="30" y="542" width="620" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="567" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">左端点钉死在字母的 first 上 → 候选区间至多 26 个 → 剩下是经典区间调度问题</text>
</svg>
