<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">先看奇偶个数，再决定目标位置集合</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">偶数放 0,2,4,... 或奇数放 0,2,4,...，两种图案各自算代价</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">nums =</text>
  <rect x="110" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="132.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="156" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="178.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="202" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="224.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="248" y="62" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="88.0" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="270.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="294" y="62" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="316.0" y="88.0" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="316.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="40" y="140" width="250" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="165.0" y="165.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶数位置 [0,1,2]（3 个）</text>
  <text x="165.0" y="185.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">奇数位置 [3,4]（2 个）</text>
  <rect x="310" y="140" width="250" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="435.0" y="165.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">|3 - 2| = 1 &lt;= 1 -&gt; 可行</text>
  <text x="435.0" y="185.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">只能是「偶数打头」这一种图案</text>
  <rect x="40" y="218" width="250" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="165.0" y="243.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">图案 A（偶数打头）</text>
  <text x="165.0" y="263.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">偶数目标位 0,2,4；奇数目标位 1,3</text>
  <rect x="310" y="218" width="250" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="435.0" y="243.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">图案 B（奇数打头）</text>
  <text x="435.0" y="263.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">需要 3 个奇数，但只有 2 个 -&gt; 非法</text>
  <rect x="40" y="296" width="520" height="46" fill="#f1f3f4" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="323.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">数量差 &gt; 1 直接返回 -1；数量相等时两种图案都试，取较小代价</text>
</svg>
