<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#fafafa"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选栈：处理新元素 x = 2 的三段式</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">栈按（值 × 个数）分块，值从栈底到栈顶严格递增；本例栈为 [1×3, 2×1, 4×2]，total = 6</text>

  <!-- ============ the stack ============ -->
  <!-- top block: 4x2 (red, popped) -->
  <rect x="120" y="150" width="160" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3030" filter="url(#rough2)">4 × 2</text>
  <!-- middle block: 2x1 (orange, equal) -->
  <rect x="120" y="200" width="160" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">2 × 1</text>
  <!-- bottom block: 1x3 (green, counted) -->
  <rect x="120" y="250" width="160" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1 × 3</text>

  <text x="96" y="180" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">栈顶</text>
  <text x="96" y="280" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">栈底</text>
  <path d="M 104 174 L 116 174" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 104 274 L 116 274" stroke="#999" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- incoming x -->
  <rect x="330" y="150" width="130" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="174" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">新元素</text>
  <text x="395" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">x = 2</text>
  <path d="M 330 175 L 292 175" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ zone annotations (right) ============ -->
  <!-- pop annotation -->
  <path d="M 280 165 Q 330 118 420 108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="430" y="86" width="440" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3030" filter="url(#rough2)">① 值 &gt; x 的块：弹出，被 x 永久阻挡</text>
  <text x="650" y="128" text-anchor="middle" font-size="11" fill="#8a3030" filter="url(#rough2)">（此后任何 j' &gt; j 都会被 k = j 挡住）</text>

  <!-- equal annotation -->
  <path d="M 280 225 Q 330 210 420 196" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="430" y="168" width="440" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">② 值 = x 的块：保留但本步不计入</text>
  <text x="650" y="210" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">（相等不阻挡、也不配对；入栈时合并 → 2×2）</text>

  <!-- count annotation -->
  <path d="M 280 270 Q 330 282 420 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="262" width="440" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="650" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">③ 值 &lt; x 的元素全部配对：增量 = total − 栈顶块个数</text>
  <text x="650" y="308" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">= 4 − 1 = 3 个（弹出 4×2 后 total = 4，栈顶 2×1 不计）</text>

  <!-- ============ result ============ -->
  <rect x="430" y="346" width="440" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">④ 压入 x：值 = 栈顶则个数 +1，否则新块入栈</text>
  <text x="650" y="388" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（栈内值恢复严格递增：[1×3, 2×2]，total = 5）</text>

  <rect x="110" y="440" width="720" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">以 j 为右端点的影子对数 = 弹出后栈中「值 &lt; nums[j]」的候选个数</text>
</svg>
