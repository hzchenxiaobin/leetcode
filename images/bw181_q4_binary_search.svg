<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二分答案：count(m) 是 m 的单调不减函数</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">count(m) = m/2 −（nums[l..r] 中值 ≤ m 的偶数个数）</text>
  <rect x="36" y="76" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">count(m) = m/2 − removed_le(m)</text>
  <text x="280" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">removed_le(m) 用 upper_bound + 偶数前缀和一次求得</text>
  <path d="M 50 258 L 500 258" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 50 190 L 50 258" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="48" y="234" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="9" fill="#888">2</text>
  <rect x="108" y="210" width="24" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="9" fill="#888">4</text>
  <rect x="168" y="210" width="24" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="9" fill="#888">6</text>
  <rect x="228" y="186" width="24" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="9" fill="#888">8</text>
  <rect x="288" y="162" width="24" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="9" fill="#888">10</text>
  <rect x="348" y="162" width="24" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="272" text-anchor="middle" font-size="9" fill="#888">12</text>
  <rect x="408" y="138" width="24" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="9" fill="#888">14</text>
  <rect x="468" y="114" width="24" height="144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="9" fill="#888">16</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#888">m（候选偶数）</text>
  <text x="38" y="186" text-anchor="middle" font-size="9.5" fill="#888">count</text>
  <path d="M 50 186 L 500 186" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="392" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k = 3 → 最小 m = 6</text>
  <rect x="36" y="318" width="488" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">在 m ∈ [2k, 2(k + len)] 上二分：len 是被移除数量的上界，右端点一定可行</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">单调性：m 增大时 m/2 增长不比 removed_le 慢，count(m) 只增不减</text>
</svg>
