<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">加入 [0,1,1]、[1,2,1] 之后的带权并查集（根为 0）</text>

  <!-- 并查集树 -->
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">根，p = 0</text>
  <circle cx="280" cy="95" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 267 106 L 193 183" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 293 106 L 367 183" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="172" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">par[1] = 1</text>
  <text x="388" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">par[2] = 0</text>

  <circle cx="180" cy="195" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p = 1</text>

  <circle cx="380" cy="195" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p = 0</text>

  <rect x="180" y="252" width="200" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d[0] = 0，d[1] = 1，d[2] = 0</text>

  <!-- 示例 1 -->
  <rect x="25" y="300" width="245" height="125" rx="10" fill="#fafafa" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="147" y="324" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 1：第三边 (0, 2, 1)</text>
  <text x="147" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d[0] ⊕ d[2] = 0 ≠ 1</text>
  <text x="147" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">环 0-1-2-0 和 = 1+1+1 = 3（奇）</text>
  <text x="147" y="402" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">→ 拒绝，答案 = 2</text>

  <!-- 示例 2 -->
  <rect x="290" y="300" width="245" height="125" rx="10" fill="#fafafa" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="324" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：第三边 (0, 2, 0)</text>
  <text x="412" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d[0] ⊕ d[2] = 0 == 0</text>
  <text x="412" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">环 0-1-2-0 和 = 1+1+0 = 2（偶）</text>
  <text x="412" y="402" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">→ 加入，答案 = 3</text>
</svg>
