<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 468"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="468" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算（示例 2）：n=3, k=2, m=3, time=[2,5,8], mul=[1.0, 1.5, 0.75]</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">阶段取值：0(×1.00)、1(×1.50)、2(×0.75)；起点 mask={0,1,2}，stage=0</text>

  <!-- 第 1 步 -->
  <rect x="24" y="66" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="84" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">① 渡河</text>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">{0, 2}</text>
  <text x="128" y="76" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">max(2, 8) × mul[0]</text>
  <text x="128" y="92" text-anchor="start" font-size="10.5" fill="#2a4666" font-weight="bold" filter="url(#rough2)">= 8 × 1.00 = 8.00 分钟</text>
  <circle cx="268" cy="86" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="90" text-anchor="middle" font-size="9" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="300" cy="86" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <circle cx="332" cy="86" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="90" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 281 86 H 317" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">阶段 0→2</text>
  <rect x="356" y="60" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="80" text-anchor="middle" font-size="9.5" fill="#2a4666" filter="url(#rough2)">营地：{1}</text>
  <rect x="356" y="96" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="116" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">对岸：{0, 2}</text>
  <text x="504" y="74" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">累计</text>
  <text x="504" y="92" text-anchor="end" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8.00</text>

  <!-- 第 2 步 -->
  <rect x="24" y="166" width="92" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 返回</text>
  <text x="70" y="199" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">人 0</text>
  <text x="128" y="176" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">2 × mul[2]</text>
  <text x="128" y="192" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">= 2 × 0.75 = 1.50 分钟</text>
  <circle cx="268" cy="186" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="190" text-anchor="middle" font-size="9" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="300" cy="186" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <circle cx="332" cy="186" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="190" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 319 186 H 283" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">阶段 2→0</text>
  <rect x="356" y="160" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="180" text-anchor="middle" font-size="9.5" fill="#2a4666" filter="url(#rough2)">营地：{0, 1}</text>
  <rect x="356" y="196" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="216" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">对岸：{2}</text>
  <text x="504" y="174" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">累计</text>
  <text x="504" y="192" text-anchor="end" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9.50</text>
  <text x="200" y="212" text-anchor="start" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✦ ⌊1.5⌋=1，恰好把阶段拨回 0（×1.00）！</text>

  <!-- 第 3 步 -->
  <rect x="24" y="266" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="284" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">③ 渡河</text>
  <text x="70" y="299" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold" filter="url(#rough2)">{0, 1}</text>
  <text x="128" y="276" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">max(2, 5) × mul[0]</text>
  <text x="128" y="292" text-anchor="start" font-size="10.5" fill="#2a4666" font-weight="bold" filter="url(#rough2)">= 5 × 1.00 = 5.00 分钟</text>
  <circle cx="268" cy="286" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="290" text-anchor="middle" font-size="9" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="300" cy="286" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1</text>
  <circle cx="332" cy="286" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="332" y="290" text-anchor="middle" font-size="9" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 281 286 H 317" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="310" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">阶段 0→2</text>
  <rect x="356" y="260" width="140" height="32" fill="#fafafa" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="426" y="280" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">营地：∅ ✓</text>
  <rect x="356" y="296" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="426" y="316" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">对岸：{0, 1, 2}</text>
  <text x="504" y="274" text-anchor="end" font-size="8" fill="#999" filter="url(#rough2)">累计</text>
  <text x="504" y="292" text-anchor="end" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">14.50</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="100" y="348" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10"/>
    <text x="260" y="369" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">✓ 全员到达：8.00 + 1.50 + 5.00 = 14.50</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="24" y="396" width="472" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="416" text-anchor="middle" font-size="10" fill="#8a6a20">关键：第 ② 步人 0 从阶段 2 出发返回，⌊1.5⌋ = 1 步把时钟拨回阶段 0，</text>
    <text x="260" y="433" text-anchor="middle" font-size="10" fill="#8a6a20">第 ③ 步才能以全场最低倍率 1.00 渡河 —— 阶段时钟的走向本身就是决策的一部分，</text>
    <text x="260" y="447" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">这正是任何「每步取局部最优」的贪心都会翻车的原因。</text>
  </g>
</svg>
