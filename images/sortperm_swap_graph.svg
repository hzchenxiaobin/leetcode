<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="500" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">交换图 G_k：k 的全部超集构成一个星形连通块（k = 1，n = 8）</text>
  <path d="M 230 40 Q 450 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- star component container -->
  <g filter="url(#sk)">
    <rect x="50" y="62" width="520" height="356" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.6" stroke-dasharray="8 5"/>
  </g>
  <text x="74" y="92" font-size="14" font-weight="bold" fill="#2b4a6e">星形连通块 S_k = { v : k ⊆ v }</text>

  <!-- star edges (hub to supersets) -->
  <path d="M 261 226 Q 212 204 178 174" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 339 226 Q 388 204 422 174" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 300 296 Q 296 320 300 341" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="312" y="322" text-anchor="start" font-size="10.5" fill="#667">k AND v = k（只要 k ⊆ v）</text>

  <!-- bonus edge 3--5 -->
  <path d="M 183 148 Q 300 126 417 148" stroke="#8ea8c8" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="300" y="120" text-anchor="middle" font-size="10.5" fill="#667">3 AND 5 = 001 = k，也是合法边</text>

  <!-- hub node -->
  <g filter="url(#sk)">
    <circle cx="300" cy="250" r="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <text x="300" y="246" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">k = 1</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#7a5415">0b001</text>

  <!-- superset nodes -->
  <g filter="url(#sk)">
    <circle cx="152" cy="158" r="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="448" cy="158" r="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="300" cy="372" r="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="152" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">3</text>
  <text x="152" y="174" text-anchor="middle" font-size="10" fill="#446688">0b011</text>
  <text x="448" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">5</text>
  <text x="448" y="174" text-anchor="middle" font-size="10" fill="#446688">0b101</text>
  <text x="300" y="369" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">7</text>
  <text x="300" y="388" text-anchor="middle" font-size="10" fill="#446688">0b111</text>

  <!-- isolated nodes -->
  <text x="735" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">k ⊄ v ⟹ 孤立点</text>
  <g filter="url(#sk)">
    <circle cx="668" cy="170" r="27" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="812" cy="170" r="27" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="668" cy="286" r="27" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="812" cy="286" r="27" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="668" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">0</text>
  <text x="812" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">2</text>
  <text x="668" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">4</text>
  <text x="812" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">6</text>
  <text x="740" y="344" text-anchor="middle" font-size="11" fill="#888">缺了 k = 1 的最低位，</text>
  <text x="740" y="362" text-anchor="middle" font-size="11" fill="#888">与任何值 AND 都 ≠ 1，一条边都没有</text>

  <!-- bottom conclusion bar -->
  <g filter="url(#sk)">
    <rect x="50" y="434" width="800" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="70" y="456" font-size="12.5" font-weight="bold" fill="#7a5415">判定：k 可行 ⟺ 每个错位值 v 都满足 k ⊆ v（全部挂进同一个星形块）</text>
  <text x="70" y="478" font-size="11.5" fill="#555">k = M 是每个错位值的子掩码 → 可行；结合上界 k ≤ M ⟹ 答案 = M</text>
</svg>
