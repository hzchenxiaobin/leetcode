<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">换个视角：行-列二部图，服务器就是一条边</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888">同一个行节点 / 列节点上的两条边，正好对应「能通信」</text>

  <text x="110" y="82" text-anchor="middle" font-size="10.5" fill="#446688">行节点</text>
  <text x="390" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a">列节点</text>

  <!-- 边 -->
  <g filter="url(#rough2)">
    <line x1="128" y1="106" x2="372" y2="106" stroke="#8aa8c8" stroke-width="1.6"/>
    <line x1="128" y1="106" x2="372" y2="156" stroke="#8aa8c8" stroke-width="1.6"/>
    <line x1="128" y1="156" x2="372" y2="206" stroke="#8aa8c8" stroke-width="1.6"/>
    <line x1="128" y1="206" x2="372" y2="206" stroke="#8aa8c8" stroke-width="1.6"/>
    <line x1="128" y1="256" x2="372" y2="256" stroke="#b85450" stroke-width="2.4"/>
  </g>

  <!-- 行节点 -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="106" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="110" text-anchor="middle" font-size="10" fill="#3a4a66">R0</text>
    <circle cx="110" cy="156" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="160" text-anchor="middle" font-size="10" fill="#3a4a66">R1</text>
    <circle cx="110" cy="206" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="210" text-anchor="middle" font-size="10" fill="#3a4a66">R2</text>
    <circle cx="110" cy="256" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="110" y="260" text-anchor="middle" font-size="10" fill="#8a3a36">R3</text>
  </g>

  <!-- 列节点 -->
  <g filter="url(#rough2)">
    <circle cx="390" cy="106" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="110" text-anchor="middle" font-size="10" fill="#3a5a30">C0</text>
    <circle cx="390" cy="156" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="160" text-anchor="middle" font-size="10" fill="#3a5a30">C1</text>
    <circle cx="390" cy="206" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="210" text-anchor="middle" font-size="10" fill="#3a5a30">C2</text>
    <circle cx="390" cy="256" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="390" y="260" text-anchor="middle" font-size="10" fill="#8a3a36">C3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="292" width="440" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="312" text-anchor="middle" font-size="10" fill="#8a6a20">R0 上挂着 2 条边 → 两台服务器同行；C2 上挂着 2 条边 → 两台服务器同列</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="440" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="260" y="350" text-anchor="middle" font-size="10" fill="#8a3a36">红色边 R3–C3 只有自己（两端度数都是 1）→ 孤岛服务器，不计入答案</text>
  </g>
</svg>
