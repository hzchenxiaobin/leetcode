<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="580" fill="#fafafa" filter="url(#rough2)"/>

  <rect x="60" y="46" width="600" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="14" fill="#6b4a12" filter="url(#rough2)">第 d 天直接开除 s：整棵 subtree(s) 当天清空</text>

  <path d="M360,98 L360,120" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="122" width="600" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="154" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">之后每天往下恢复一层 ⇒ 第 n 天结束时恢复 2<tspan baseline-shift="super" font-size="10">n−d</tspan> − 1 个节点</text>

  <path d="M360,174 L360,196" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="198" width="600" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="230" text-anchor="middle" font-size="14" fill="#2f4f2a" filter="url(#rough2)">最终人数 k = m + Σ (2<tspan baseline-shift="super" font-size="10">n−d</tspan> − 1)，m = |R|，直接开除总数 t = m + 1</text>

  <path d="M360,250 L360,272" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="274" width="600" height="52" rx="9" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="306" text-anchor="middle" font-size="14" fill="#444" filter="url(#rough2)">记 j = n − d ∈ [0, n−1] ⇒ Σ 2<tspan baseline-shift="super" font-size="10">j</tspan> = k + 1 = N（只与指数集合有关）</text>

  <path d="M360,326 L360,348" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="350" width="600" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="382" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">最少项数：t = q + popcount(r)，q = ⌊N / 2<tspan baseline-shift="super" font-size="10">n−1</tspan>⌋，r = N mod 2<tspan baseline-shift="super" font-size="10">n−1</tspan></text>

  <path d="M360,402 L360,424" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="426" width="600" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="458" text-anchor="middle" font-size="14" fill="#6b4a12" filter="url(#rough2)">取到最小 t 时多重集唯一：q 个 2<tspan baseline-shift="super" font-size="10">n−1</tspan>，加上 r 的每个二进制位各一个</text>

  <path d="M360,478 L360,500" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="502" width="600" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="536" text-anchor="middle" font-size="15" fill="#2f4f2a" filter="url(#rough2)">答案 = Catalan(m) · t! / q!（m = t − 1）；N 为 2 的幂时从 t = 2 起步</text>
</svg>
