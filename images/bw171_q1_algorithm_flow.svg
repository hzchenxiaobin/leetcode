<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：枚举 k，前后缀各判一次质数</text>

  <rect x="150" y="46" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = 十进制串；k = 1</text>

  <path d="M260,82 L260,106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrH)" filter="url(#rough2)"/>

  <rect x="110" y="110" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre = int(s[0..k−1])</text>
  <text x="260" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">suf = int(s[L−k..L−1])</text>

  <path d="M260,154 L260,178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrH)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,182 380,222 260,262 140,222" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre 与 suf</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">都是质数？</text>

  <!-- 否 -->
  <text x="96" y="216" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="20" y="228" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 false</text>

  <!-- 是 -->
  <text x="404" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="390" y="228" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k++，k ≤ L 继续</text>

  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k 超过 L 仍未失败 → 返回 true</text>
</svg>
