<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">共线点是否返回，取决于它是否真的落在凸包边上</text>

  <rect x="18" y="50" width="270" height="250" rx="10" fill="#e6f4ea" fill-opacity="0.8"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="153" y="78" text-anchor="middle" font-size="13" fill="#3c6330" filter="url(#rough2)">示例 2：三点共线</text>

  <path d="M 55,200 L 245,200" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <circle cx="55" cy="200" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="200" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="245" cy="200" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e6f4ea" stroke-width="3" stroke-linejoin="round">(1,2)</text>
  <text x="150" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e6f4ea" stroke-width="3" stroke-linejoin="round">(2,2)</text>
  <text x="245" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e6f4ea" stroke-width="3" stroke-linejoin="round">(4,2)</text>

  <text x="153" y="256" text-anchor="middle" font-size="11" fill="#3c6330" filter="url(#rough2)">绳子正好压过 (2,2)</text>
  <text x="153" y="276" text-anchor="middle" font-size="11" fill="#3c6330" filter="url(#rough2)">→ 三个点都要返回</text>

  <rect x="332" y="50" width="270" height="250" rx="10" fill="#e8f0fe" fill-opacity="0.85"
        stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="467" y="78" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">再加两棵树后，(2,2) 变内部点</text>

  <polygon points="360,192 410,230 510,192 410,154" fill="#e8f0fe" fill-opacity="0.95"
           stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="360" cy="192" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="510" cy="192" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="410" cy="154" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="410" cy="230" r="5.5" fill="#d6a040" stroke="#8a6520" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="410" cy="192" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
          stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="336" y="214" font-size="11" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e8f0fe" stroke-width="3" stroke-linejoin="round">(1,2)</text>
  <text x="520" y="188" font-size="11" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e8f0fe" stroke-width="3" stroke-linejoin="round">(4,2)</text>
  <text x="420" y="146" font-size="11" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e8f0fe" stroke-width="3" stroke-linejoin="round">(2,3)</text>
  <text x="420" y="250" font-size="11" fill="#333" filter="url(#rough2)" paint-order="stroke" stroke="#e8f0fe" stroke-width="3" stroke-linejoin="round">(2,1)</text>
  <text x="420" y="200" font-size="11" fill="#b85450" filter="url(#rough2)" paint-order="stroke" stroke="#e8f0fe" stroke-width="3" stroke-linejoin="round">(2,2) 内部</text>

  <text x="467" y="274" text-anchor="middle" font-size="11" fill="#2f4f6f" filter="url(#rough2)">四棵顶点树把它围在中间 → 弹出</text>

  <text x="310" y="326" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">判据：共线且在线段上 ⇒ 保留；落在凸包内部 ⇒ 弹出</text>
</svg>
