<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最优解 = 一段连续区间挖掉至多一个元素</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">删除是可选的，所以「不挖洞」始终也是一个合法候选</text>

  <rect x="24" y="62" width="572" height="134" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">① 最优解的形状</text>

  <rect x="36" y="92" width="264" height="56" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5" rx="8" filter="url(#rough2)"/>

  <rect x="44" y="100" width="62" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="106" y="100" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="168" y="100" width="62" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="100" width="62" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <path d="M 108 102 L 166 138" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <text x="75" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="137" y="126" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">−2</text>
  <text x="199" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="261" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="137" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">挖掉这一个</text>

  <text x="324" y="114" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">挖掉 −2 ⇒ 1 + 0 + 3 = 4</text>
  <text x="324" y="136" font-size="10.5" fill="#666" filter="url(#rough2)">一个都不挖 ⇒ 1 + (−2) + 0 + 3 = 2</text>
  <text x="324" y="158" font-size="10.5" fill="#b85450" filter="url(#rough2)">取较大者 ⇒ 答案 4</text>
  <text x="40" y="182" font-size="9.5" fill="#777" filter="url(#rough2)">洞可以在区间内部，也可以在端点；不挖洞就退化成普通子数组求和</text>

  <text x="40" y="220" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">② 从左到右扫一遍，只需要两个状态</text>

  <rect x="56" y="236" width="210" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="74" y="260" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">状态 0 · 未删</text>
  <text x="74" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">keep：以 i 结尾、</text>
  <text x="74" y="300" font-size="10.5" fill="#555" filter="url(#rough2)">一次都没删的最大和</text>
  <text x="74" y="320" font-size="9.5" fill="#7a93ad" filter="url(#rough2)">就是普通 Kadane</text>

  <rect x="354" y="236" width="210" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="372" y="260" font-size="12" fill="#3a6a2c" font-weight="bold" filter="url(#rough2)">状态 1 · 已删一次</text>
  <text x="372" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">dele：以 i 结尾、</text>
  <text x="372" y="300" font-size="10.5" fill="#555" filter="url(#rough2)">恰好删掉一个元素</text>
  <text x="372" y="320" font-size="9.5" fill="#6b8f5c" filter="url(#rough2)">区间里留着一个洞</text>

  <path d="M 268 283 L 346 283" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="307" y="275" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">删掉 x_i</text>

  <path d="M 76 330 C 76 358, 246 358, 246 330" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="161" y="374" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">接上 x_i ⇒ 段变长</text>

  <path d="M 374 330 C 374 358, 544 358, 544 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="459" y="374" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">接上 x_i ⇒ 洞还在</text>

  <rect x="90" y="396" width="440" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="420" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = max{ keep_i , dele_i }，i 取遍所有位置</text>
  <text x="310" y="440" text-anchor="middle" font-size="9.5" fill="#8a7a58" filter="url(#rough2)">每个位置两种状态都要参与取最大，不能只看最后一个位置</text>
</svg>
