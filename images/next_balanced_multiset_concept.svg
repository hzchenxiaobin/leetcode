<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="620" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：平衡数完全由「数字集合」决定</text>
  <path d="M 280 46 Q 470 54 660 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 定义行 -->
  <text x="60" y="82" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">定义：数字 d 一旦出现，就必须恰好出现 d 次</text>

  <!-- 正反例 chips -->
  <g filter="url(#rough2)">
    <rect x="60" y="96" width="62" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="134" y="96" width="80" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="226" y="96" width="118" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="368" y="96" width="62" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="442" y="96" width="76" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="91" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">22</text>
  <text x="174" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1333</text>
  <text x="285" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1224444</text>
  <text x="399" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">123</text>
  <text x="480" y="122" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1022</text>
  <text x="91" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 出现 2 次 ✓</text>
  <text x="174" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1×1 + 3×3 ✓</text>
  <text x="285" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1×1 + 2×2 + 4×4 ✓</text>
  <text x="399" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2 只出现 1 次 ✗</text>
  <text x="480" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">0 出现 2 次 ✗</text>

  <!-- 右侧伏笔 -->
  <text x="620" y="108" font-size="12" fill="#444" filter="url(#rough2)">数字 0 若出现，须出现 0 次 → 矛盾</text>
  <text x="620" y="128" font-size="12" fill="#444" filter="url(#rough2)">所以平衡数只由 1–9 组成（观察一）</text>
  <text x="620" y="148" font-size="12" fill="#888" filter="url(#rough2)">1022 中 0 出现 2 次 ≠ 0，整段作废</text>

  <!-- 三张观察卡 -->
  <g filter="url(#rough2)">
    <rect x="60" y="176" width="820" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="82" y="200" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">观察一：平衡数不含 0</text>
  <text x="82" y="222" font-size="12" fill="#444" filter="url(#rough2)">数字 0 若出现就须出现 0 次，自相矛盾 → 平衡数只能由 1–9 组成，且天然无前导 0 问题</text>
  <text x="82" y="240" font-size="11" fill="#888" filter="url(#rough2)">例：1333 合法（1×1、3×3）；1022 非法（0 的次数对不上）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="256" width="820" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="82" y="280" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">观察二：数字集合 S 决定多重集</text>
  <text x="82" y="302" font-size="12" fill="#444" filter="url(#rough2)">选定 S ⊆ {1,…,9}，d ∈ S 就贡献 d 个 d，总位数 L = Σ d —— 集合与多重集一一对应</text>
  <text x="82" y="320" font-size="11" fill="#888" filter="url(#rough2)">例：S = {1,3} → 一个 1 加三个 3 → 4 位数；S = {1,2,4} → 1×1 + 2×2 + 4×4 → 7 位数</text>

  <g filter="url(#rough2)">
    <rect x="60" y="336" width="820" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="360" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">观察三：候选一共只有 278 个</text>
  <text x="82" y="382" font-size="12" fill="#444" filter="url(#rough2)">n ≤ 10^6，而 1224444 是平衡数且 &gt; 10^6 → 答案 ≤ 1224444（7 位）→ 只需 L ≤ 7 的子集</text>
  <text x="82" y="400" font-size="11" fill="#888" filter="url(#rough2)">满足 Σ d ≤ 7 的子集共 18 个，全部互异排列合计 278 个 —— 这就是全部候选</text>

  <!-- S={1,3} 流水线 -->
  <text x="60" y="436" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">以 S = {1,3} 为例走一遍：</text>

  <g filter="url(#rough2)">
    <rect x="60" y="452" width="130" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="125" y="474" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子集 S</text>
  <text x="125" y="504" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">{1, 3}</text>
  <path d="M 190 485 L 224 485" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="230" y="452" width="190" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="325" y="474" text-anchor="middle" font-size="11" fill="#a67c1e" filter="url(#rough2)">多重集（d 个 d）</text>
  <g filter="url(#rough2)">
    <rect x="252" y="482" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="288" y="482" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="324" y="482" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="360" y="482" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="267" y="501" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="303" y="501" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="339" y="501" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="375" y="501" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 420 485 L 454 485" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="460" y="452" width="260" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="590" y="474" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">互异全排列 4!/3! = 4 个</text>
  <text x="590" y="504" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1333 · 3133 · 3313 · 3331</text>
  <path d="M 720 485 L 754 485" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="760" y="452" width="120" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="820" y="474" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">18 个子集同样处理</text>
  <text x="820" y="498" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">共 278 个候选</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="540" width="820" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="82" y="562" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">思路反转：与其在数轴上从 n+1 逐个试，不如把全部 278 个平衡数一次造好、排序成表</text>
  <text x="82" y="584" font-size="12" fill="#444" filter="url(#rough2)">任何查询都变成表上二分：找第一个严格大于 n 的候选，O(log 278) 即刻命中</text>
</svg>
