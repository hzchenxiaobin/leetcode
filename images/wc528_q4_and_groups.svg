<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：固定右端点，起点被切成 ≤ 21 段</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [5, 3, 1, 2]，右端点 j = 3；每段内所有起点的子数组 AND 相同</text>

  <g filter="url(#rough2)">
    <rect x="224" y="70" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="294" y="70" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="364" y="70" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="434" y="70" width="62" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="255" y="100" text-anchor="middle" font-size="16" fill="#2f4f6f" filter="url(#rough2)">5</text>
  <text x="325" y="100" text-anchor="middle" font-size="16" fill="#2f4f6f" filter="url(#rough2)">3</text>
  <text x="395" y="100" text-anchor="middle" font-size="16" fill="#2f4f6f" filter="url(#rough2)">1</text>
  <text x="465" y="100" text-anchor="middle" font-size="16" fill="#2e5a24" filter="url(#rough2)">2</text>
  <text x="255" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="325" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="395" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="465" y="132" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>

  <g filter="url(#rough2)">
    <rect x="224" y="146" width="202" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="434" y="146" width="62" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="325" y="168" text-anchor="middle" font-size="11" fill="#2f4f6f" filter="url(#rough2)">起点 0..2：AND = 0</text>
  <text x="508" y="168" text-anchor="start" font-size="11" fill="#2e5a24" filter="url(#rough2)">起点 3：AND = 2</text>

  <g filter="url(#rough2)">
    <rect x="50" y="200" width="620" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="360" y="226" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">AND 只会清除比特 ⇒ 子数组 AND ≤ 该子数组的最小值</text>
  <text x="360" y="248" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#rough2)">但不一定相等：[6, 3] 的 AND = 2，最小值却是 3 ⇒ 需要额外判断</text>

  <g filter="url(#rough2)">
    <rect x="50" y="280" width="620" height="66" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="1.7"/>
  </g>
  <text x="360" y="306" text-anchor="middle" font-size="12.5" fill="#37474f" filter="url(#rough2)">起点每左移一位，AND 只会丢比特；每次严格变化至少清掉一个 1</text>
  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#546e7a" filter="url(#rough2)">nums[i] ≤ 10^6 &lt; 2^20 ⇒ 最多变化 20 次 ⇒ 每个 j 至多 21 段</text>

  <g filter="url(#rough2)">
    <rect x="110" y="360" width="500" height="32" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="360" y="381" text-anchor="middle" font-size="12.5" fill="#8f3830" filter="url(#rough2)">于是每个 j 只需处理 ≤ 21 段 ⇒ 总时间 O(20n)</text>
</svg>
