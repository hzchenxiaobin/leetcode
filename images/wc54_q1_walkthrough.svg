<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [1, 2, 2, 3, 1] 的逐位置更新</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每读入一个 x：先更新 cnt / first / last，再用 span 与 degree 决定 ans 是否变化</text>

  <g filter="url(#rough2)">
    <rect x="60" y="70" width="520" height="38" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5"/>
    <rect x="60" y="108" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="60" y="148" width="520" height="40" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="60" y="188" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="60" y="228" width="520" height="40" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="60" y="268" width="520" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)">
    <path d="M 104 70 L 104 308"/>
    <path d="M 154 70 L 154 308"/>
    <path d="M 220 70 L 220 308"/>
    <path d="M 294 70 L 294 308"/>
    <path d="M 364 70 L 364 308"/>
    <path d="M 440 70 L 440 308"/>
    <path d="M 520 70 L 520 308"/>
  </g>

  <g font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="82" y="94">i</text>
    <text x="129" y="94">x</text>
    <text x="187" y="94">cnt[x]</text>
    <text x="257" y="94">first[x]</text>
    <text x="329" y="94">last[x]</text>
    <text x="402" y="94">跨度</text>
    <text x="480" y="94">degree</text>
    <text x="550" y="94">ans</text>
  </g>

  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="134">0</text>
    <text x="129" y="134">1</text>
    <text x="187" y="134">1</text>
    <text x="257" y="134">0</text>
    <text x="329" y="134">0</text>
    <text x="402" y="134">1</text>
    <text x="480" y="134" fill="#8f3830" font-weight="bold">1</text>
    <text x="550" y="134" fill="#8f3830" font-weight="bold">1</text>

    <text x="82" y="174">1</text>
    <text x="129" y="174">2</text>
    <text x="187" y="174">1</text>
    <text x="257" y="174">1</text>
    <text x="329" y="174">1</text>
    <text x="402" y="174">1</text>
    <text x="480" y="174">1</text>
    <text x="550" y="174">1</text>

    <text x="82" y="214">2</text>
    <text x="129" y="214">2</text>
    <text x="187" y="214" font-weight="bold">2</text>
    <text x="257" y="214">1</text>
    <text x="329" y="214">2</text>
    <text x="402" y="214" font-weight="bold">2</text>
    <text x="480" y="214" fill="#8f3830" font-weight="bold">2</text>
    <text x="550" y="214" fill="#8f3830" font-weight="bold">2</text>

    <text x="82" y="254">3</text>
    <text x="129" y="254">3</text>
    <text x="187" y="254">1</text>
    <text x="257" y="254">3</text>
    <text x="329" y="254">3</text>
    <text x="402" y="254">1</text>
    <text x="480" y="254">2</text>
    <text x="550" y="254">2</text>

    <text x="82" y="294">4</text>
    <text x="129" y="294">1</text>
    <text x="187" y="294" font-weight="bold">2</text>
    <text x="257" y="294">0</text>
    <text x="329" y="294">4</text>
    <text x="402" y="294" font-weight="bold">5</text>
    <text x="480" y="294">2</text>
    <text x="550" y="294">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="320" width="520" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="60" y="392" width="520" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
    <rect x="60" y="466" width="520" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">第 3 行：2 的第二次出现，cnt[2] = 2 &gt; degree，degree ← 2 且 ans ← span = 2</text>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#rough2)">第 5 行：1 的第二次出现，cnt[1] = 2 = degree，但 span = 5 &gt; ans，故 ans 不变</text>

  <text x="320" y="418" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold" filter="url(#rough2)">答案 ans = 2 ⟶ 子数组 [2, 2]（下标 1..2）</text>
  <text x="320" y="442" text-anchor="middle" font-size="11.5" fill="#8f3830" filter="url(#rough2)">两个度元素比跨度：min(元素 1 的 5，元素 2 的 2) = 2</text>

  <text x="320" y="498" text-anchor="middle" font-size="12" fill="#2e4f70" filter="url(#rough2)">整程只扫一遍：建表与比较同步完成，不需要第二遍枚举候选元素</text>
</svg>
