<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：全局异或 X 一锤定音</text>
  <text x="320" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">X = nums[0] ⊕ nums[1] ⊕ ⋯ ⊕ nums[n−1]，最长长度只由 X 与「是否存在非零元素」决定</text>

  <!-- 情形一 -->
  <rect x="50" y="66" width="540" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="92" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">情形一：X ≠ 0</text>
  <text x="70" y="114" font-size="12.5" fill="#333" filter="url(#rough2)">整个数组本身就是异或非零的子序列，一个都不用删 → 答案 = n</text>
  <text x="70" y="138" font-size="12" fill="#4a7a3a" filter="url(#rough2)">例：[2, 3, 4]，2 ⊕ 3 ⊕ 4 = 5 ≠ 0 → 答案 3</text>

  <!-- 情形二 -->
  <rect x="50" y="166" width="540" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="192" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">情形二：X = 0，且存在非零元素 e</text>
  <text x="70" y="214" font-size="12.5" fill="#333" filter="url(#rough2)">全保留异或为 0 不合法；删掉一个非零 e，剩余异或 = X ⊕ e = e ≠ 0</text>
  <text x="70" y="236" font-size="12.5" fill="#333" filter="url(#rough2)">→ 答案 = n − 1（长度 n 的子序列只有整个数组，删更多只会更短）</text>
  <text x="70" y="258" font-size="12" fill="#8a6d1f" filter="url(#rough2)">例：[1, 2, 3]，X = 0，删 1 → [2, 3]，2 ⊕ 3 = 1 ≠ 0 → 答案 2</text>

  <!-- 情形三 -->
  <rect x="50" y="284" width="540" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="310" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">情形三：X = 0，且所有元素都是 0</text>
  <text x="70" y="332" font-size="12.5" fill="#333" filter="url(#rough2)">任意非空子序列全由 0 组成，异或恒为 0，不存在合法子序列</text>
  <text x="70" y="352" font-size="12" fill="#b85450" filter="url(#rough2)">例：[0, 0, 0] → 答案 0</text>

  <!-- 关键性质 -->
  <rect x="50" y="378" width="540" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="399" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">关键性质：删除元素 e 后，剩余异或 = X ⊕ e（异或的自逆性）</text>
  <text x="320" y="419" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0 对异或无贡献——删 0 毫无作用，想翻转结果只能删非零元素</text>
</svg>
