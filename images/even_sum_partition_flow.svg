<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一次求和 + 一次奇偶分支，O(n) 时间 / O(1) 空间</text>
  <path d="M 220 46 Q 440 54 660 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起始框 -->
  <g filter="url(#sk)">
    <rect x="300" y="78" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="440" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f6f">遍历 nums，累加总和 S</text>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#2f4f6f">（只关心 S 的奇偶性）</text>

  <path d="M 440 134 L 440 176" stroke="#2b2b2b" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>

  <!-- 判定菱形 -->
  <g filter="url(#sk)">
    <polygon points="290,258 440,180 590,258 440,336" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="440" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6515">S 是偶数？</text>
  <text x="440" y="274" text-anchor="middle" font-size="11" fill="#8a6515">（S mod 2 == 0）</text>

  <!-- 是 -->
  <path d="M 590 258 L 606 258" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>
  <text x="598" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">是</text>
  <g filter="url(#sk)">
    <rect x="612" y="230" width="228" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="726" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">返回 n − 1</text>
  <text x="726" y="274" text-anchor="middle" font-size="11" fill="#2e5e2e">全部 n−1 个切分都满足</text>

  <!-- 否 -->
  <path d="M 440 336 L 440 380" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>
  <text x="460" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">否</text>
  <g filter="url(#sk)">
    <rect x="300" y="386" width="280" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="440" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038">返回 0</text>
  <text x="440" y="430" text-anchor="middle" font-size="11" fill="#a04038">没有任何切分满足</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="90" y="476" width="700" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="110" y="502" font-size="12" fill="#2f4f6f">无需枚举切分点、无需前缀和数组：判定与 i 无关，一行分支足矣</text>
  <text x="110" y="526" font-size="12" fill="#2f4f6f">暴力逐点判定（滚动维护 L，O(n)）当然也能过，但那就浪费了这个观察</text>
</svg>
