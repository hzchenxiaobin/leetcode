<svg xmlns="http://www.w3.org/2000/svg" width="560" height="410" viewBox="0 0 560 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="410" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：左下角唯一确定候选矩形</text>
  <path d="M 150 40 Q 280 48 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- candidate rectangle -->
  <g filter="url(#sk)">
    <rect x="170" y="118" width="140" height="140" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- row / column guide lines -->
  <path d="M 176 258 L 474 258" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5,5" fill="none" filter="url(#sk)"/>
  <path d="M 170 252 L 170 84" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5,5" fill="none" filter="url(#sk)"/>

  <!-- nearest-neighbor arrows along bottom / left edge -->
  <path d="M 182 258 L 296 258" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 170 246 L 170 132" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最近右邻 → 定宽</text>
  <text x="186" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" transform="rotate(-90 186 190)">最近上邻 → 定高</text>

  <!-- points -->
  <g filter="url(#sk)">
    <circle cx="170" cy="258" r="7" fill="#b85450"/>
    <circle cx="310" cy="258" r="7" fill="#4a7a3a"/>
    <circle cx="170" cy="118" r="7" fill="#4a7a3a"/>
    <circle cx="310" cy="118" r="7" fill="#446688"/>
    <circle cx="480" cy="258" r="6" fill="#999"/>
    <circle cx="170" cy="78" r="6" fill="#999"/>
  </g>

  <!-- cross marks on farther points -->
  <g stroke="#b85450" stroke-width="2" filter="url(#sk)">
    <path d="M 474 252 L 486 264 M 486 252 L 474 264" fill="none"/>
    <path d="M 164 72 L 176 84 M 176 72 L 164 84" fill="none"/>
  </g>

  <!-- labels -->
  <g font-size="12">
    <text x="158" y="281" text-anchor="end" fill="#b85450" font-weight="bold">左下角 (x₁,y₁)</text>
    <text x="310" y="281" text-anchor="middle" fill="#2e6e2e" font-weight="bold">(x₂,y₁) 最近右邻</text>
    <text x="160" y="106" text-anchor="end" fill="#2e6e2e" font-weight="bold">(x₁,y₂) 最近上邻</text>
    <text x="322" y="106" fill="#446688" font-weight="bold">(x₂,y₂)：查存在 + 区域数点</text>
    <text x="480" y="281" text-anchor="middle" fill="#777">更远的行内点</text>
    <text x="480" y="296" text-anchor="middle" font-size="11" fill="#b85450">选它当角 → 绿点踩底边 ✗</text>
    <text x="183" y="74" fill="#777">更远的列内点</text>
    <text x="183" y="89" font-size="11" fill="#b85450">选它当角 → 绿点踩左边 ✗</text>
  </g>

  <!-- bottom boxes -->
  <g filter="url(#sk)">
    <rect x="30" y="322" width="270" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="312" y="322" width="218" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="30" y="382" width="500" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12">
    <text x="165" y="343" text-anchor="middle" fill="#2b6e9e" font-weight="bold">底边不能有点 → x₂ = 行内最近右邻</text>
    <text x="165" y="362" text-anchor="middle" fill="#2b6e9e">左边不能有点 → y₂ = 列内最近上邻</text>
    <text x="421" y="343" text-anchor="middle" fill="#2e6e2e" font-weight="bold">每个点至多派生 1 个候选</text>
    <text x="421" y="362" text-anchor="middle" fill="#2e6e2e">候选总数 ≤ n = 2×10⁵</text>
    <text x="280" y="399" text-anchor="middle" font-size="11" fill="#b85450">行最右 / 列最顶的点无最近邻 → 不派生候选（跳过）</text>
  </g>
</svg>
