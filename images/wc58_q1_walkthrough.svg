<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：nums = [1, 7, 3, 6, 5, 6]，total = 28</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每行只做一次加法与一次比较，i = 3 时首次命中，直接返回</text>

  <g filter="url(#rough2)">
    <rect x="24" y="74" width="512" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="62" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">i</text>
    <text x="146" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">nums[i]</text>
    <text x="262" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">left（进入前）</text>
    <text x="380" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">2·left + nums[i]</text>
    <text x="478" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">与 28 比较</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="24" y="104" width="512" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="62" y="124" fill="#666">0</text>
    <text x="146" y="124" fill="#333" font-weight="bold">1</text>
    <text x="262" y="124" fill="#666">0</text>
    <text x="380" y="124" fill="#333">2·0 + 1 = 1</text>
    <text x="478" y="124" fill="#b85450">1 ≠ 28，继续</text>

    <rect x="24" y="134" width="512" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="62" y="154" fill="#666">1</text>
    <text x="146" y="154" fill="#333" font-weight="bold">7</text>
    <text x="262" y="154" fill="#666">1</text>
    <text x="380" y="154" fill="#333">2·1 + 7 = 9</text>
    <text x="478" y="154" fill="#b85450">9 ≠ 28，继续</text>

    <rect x="24" y="164" width="512" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="62" y="184" fill="#666">2</text>
    <text x="146" y="184" fill="#333" font-weight="bold">3</text>
    <text x="262" y="184" fill="#666">8</text>
    <text x="380" y="184" fill="#333">2·8 + 3 = 19</text>
    <text x="478" y="184" fill="#b85450">19 ≠ 28，继续</text>

    <rect x="24" y="194" width="512" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="62" y="214" fill="#3a5a30" font-weight="bold">3</text>
    <text x="146" y="214" fill="#3a5a30" font-weight="bold">6</text>
    <text x="262" y="214" fill="#3a5a30" font-weight="bold">11</text>
    <text x="380" y="214" fill="#3a5a30" font-weight="bold">2·11 + 6 = 28</text>
    <text x="478" y="214" fill="#4a7a3a" font-weight="bold">✓ 命中，返回 3</text>

    <rect x="24" y="224" width="512" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="62" y="244" fill="#999">4</text>
    <text x="146" y="244" fill="#999">5</text>
    <text x="262" y="244" fill="#999">—</text>
    <text x="380" y="244" fill="#999">已返回，不再扫描</text>
    <text x="478" y="244" fill="#999">—</text>

    <rect x="24" y="254" width="512" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="62" y="274" fill="#999">5</text>
    <text x="146" y="274" fill="#999">6</text>
    <text x="262" y="274" fill="#999">—</text>
    <text x="380" y="274" fill="#999">已返回，不再扫描</text>
    <text x="478" y="274" fill="#999">—</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="300" width="512" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="280" y="322" text-anchor="middle" font-size="11" fill="#8a6a20">命中时 left = 1 + 7 + 3 = 11，右侧 5 + 6 = 11，两侧确实相等</text>
  </g>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">扫描顺序天然保证：下标 0 先被检查，因此返回的必定是最左的中心下标</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若某步 left 越滚越大也不必担心，判定式只用 total 与当前 left，无需保存右侧和</text>
  <text x="280" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">对照示例 2：total = 6，各步判定值 1、4、9 均 ≠ 6，返回 -1</text>
</svg>
