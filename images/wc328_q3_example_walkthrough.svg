<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3,1,4,3,2,2,4]，k = 2 → ans = 4</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top array -->
  <g filter="url(#sk)"><rect x="124" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="151" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="182" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="209" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="240" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="267" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="298" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="325" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="356" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="383" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="414" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="441" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="472" y="52" width="54" height="40" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="499" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
  <text x="151" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="209" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="267" y="106" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="325" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="383" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="441" y="106" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="499" y="106" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- panel: right = 5 -->
  <text x="62" y="152" font-size="13" font-weight="bold" fill="#2b2b2b">right = 5</text>

  <g filter="url(#sk)"><rect x="140" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="157" y="159" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="177" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="194" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="214" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="231" y="159" text-anchor="middle" font-size="12" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="251" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="268" y="159" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="288" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="305" y="159" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="325" y="140" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="342" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2</text>
  <g filter="url(#sk)"><rect x="362" y="140" width="34" height="28" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="379" y="159" text-anchor="middle" font-size="12" fill="#bbb">4</text>
  <text x="415" y="150" font-size="11" fill="#444">加入第二个 2：pairs = 1 + cnt[2] = 2 ≥ k</text>
  <text x="415" y="166" font-size="11" fill="#444">窗口 [0,5]，触发收缩</text>

  <g filter="url(#sk)"><path d="M 157 172 V 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="168" y="192" font-size="10.5" fill="#b85450">移走 nums[0]=3：cnt[3] 2→1，pairs −= 1 → 1</text>

  <g filter="url(#sk)"><rect x="140" y="212" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="157" y="231" text-anchor="middle" font-size="12" fill="#999">3</text>
  <g filter="url(#sk)"><path d="M 144 216 L 170 236" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="177" y="212" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="194" y="231" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="214" y="212" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="231" y="231" text-anchor="middle" font-size="12" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="251" y="212" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="268" y="231" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="288" y="212" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="305" y="231" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="325" y="212" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="342" y="231" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="362" y="212" width="34" height="28" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="379" y="231" text-anchor="middle" font-size="12" fill="#bbb">4</text>
  <text x="415" y="222" font-size="11" fill="#444">窗口 [1,5]，pairs = 1 &lt; k，停止收缩</text>
  <text x="415" y="238" font-size="11" font-weight="bold" fill="#446688">ans += left = 1 → ans = 1</text>

  <g filter="url(#sk)"><path d="M 80 262 H 600" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 5"/></g>

  <!-- panel: right = 6 -->
  <text x="62" y="288" font-size="13" font-weight="bold" fill="#2b2b2b">right = 6</text>

  <g filter="url(#sk)"><rect x="140" y="276" width="34" height="28" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1"/></g>
  <text x="157" y="295" text-anchor="middle" font-size="12" fill="#bbb">3</text>
  <g filter="url(#sk)"><rect x="177" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="194" y="295" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="214" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="231" y="295" text-anchor="middle" font-size="12" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="251" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="268" y="295" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="288" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="305" y="295" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="325" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="342" y="295" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="362" y="276" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="379" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <text x="415" y="286" font-size="11" fill="#444">加入第二个 4：pairs = 1 + cnt[4] = 2 ≥ k</text>
  <text x="415" y="302" font-size="11" fill="#444">窗口 [1,6]，触发收缩</text>

  <g filter="url(#sk)"><path d="M 194 308 V 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="205" y="328" font-size="10.5" fill="#b85450">连移两步：先移 1（pairs 不变，仍 ≥ k！）再移 4（−1）</text>

  <g filter="url(#sk)"><rect x="140" y="348" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="157" y="367" text-anchor="middle" font-size="12" fill="#999">3</text>
  <g filter="url(#sk)"><path d="M 144 352 L 170 372" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="177" y="348" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="194" y="367" text-anchor="middle" font-size="12" fill="#999">1</text>
  <g filter="url(#sk)"><path d="M 181 352 L 207 372" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="214" y="348" width="34" height="28" rx="4" fill="#f0f0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="231" y="367" text-anchor="middle" font-size="12" fill="#999">4</text>
  <g filter="url(#sk)"><path d="M 218 352 L 244 372" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="251" y="348" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="268" y="367" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="288" y="348" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="305" y="367" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="325" y="348" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="342" y="367" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="362" y="348" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="379" y="367" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="415" y="358" font-size="11" fill="#444">窗口 [3,6]，pairs = 1 &lt; k</text>
  <text x="415" y="374" font-size="11" font-weight="bold" fill="#446688">ans += left = 3 → ans = 4</text>

  <!-- summary strip -->
  <text x="95" y="438" font-size="11.5" fill="#555">ans 增量：</text>
  <g filter="url(#sk)"><rect x="170" y="420" width="34" height="30" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="187" y="440" text-anchor="middle" font-size="12" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="207" y="420" width="34" height="30" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="224" y="440" text-anchor="middle" font-size="12" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="244" y="420" width="34" height="30" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="261" y="440" text-anchor="middle" font-size="12" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="281" y="420" width="34" height="30" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="298" y="440" text-anchor="middle" font-size="12" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="318" y="420" width="34" height="30" rx="4" fill="#ffffff" stroke="#c4c4bc" stroke-width="1.2"/></g>
  <text x="335" y="440" text-anchor="middle" font-size="12" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="355" y="420" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="372" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <g filter="url(#sk)"><rect x="392" y="420" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="409" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
  <text x="445" y="440" font-size="13" font-weight="bold" fill="#4a7a3a">合计 = 4 ✓</text>
  <text x="170" y="468" font-size="10" fill="#999">只有 right = 5、6 两步发生收缩并贡献答案</text>
</svg>
