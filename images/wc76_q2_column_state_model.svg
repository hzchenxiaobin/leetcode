<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：第 i 列换不换，只牵动这一列的两个值</text>

  <text x="152" y="86" text-anchor="middle" font-size="11" fill="#889" filter="url(#rough2)">0</text>
  <text x="224" y="86" text-anchor="middle" font-size="11" fill="#889" filter="url(#rough2)">1</text>
  <text x="296" y="86" text-anchor="middle" font-size="11" fill="#889" filter="url(#rough2)">2</text>
  <text x="368" y="86" text-anchor="middle" font-size="11" fill="#889" filter="url(#rough2)">3</text>
  <text x="440" y="86" text-anchor="middle" font-size="11" fill="#889" filter="url(#rough2)">4</text>

  <text x="110" y="122" text-anchor="end" font-size="13" fill="#2b4a6f" filter="url(#rough2)">nums1</text>
  <text x="110" y="178" text-anchor="end" font-size="13" fill="#2b4a6f" filter="url(#rough2)">nums2</text>
  <text x="110" y="262" text-anchor="end" font-size="13" fill="#8a6a20" filter="url(#rough2)">决策 d</text>

  <rect x="120" y="96" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="122" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">0</text>
  <rect x="192" y="96" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="122" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="264" y="96" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="122" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">5</text>
  <rect x="336" y="96" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="122" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">8</text>
  <rect x="408" y="96" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">9</text>

  <rect x="120" y="152" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="178" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">2</text>
  <rect x="192" y="152" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="178" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="264" y="152" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296" y="178" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">4</text>
  <rect x="336" y="152" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="368" y="178" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">6</text>
  <rect x="408" y="152" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="178" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">9</text>

  <rect x="186" y="88" width="76" height="112" rx="8" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="224" y="148" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">⇅</text>

  <path d="M152 236 L152 192" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M224 236 L224 200" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M296 236 L296 192" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M368 236 L368 192" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M440 236 L440 192" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="120" y="236" width="64" height="40" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="152" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <rect x="192" y="236" width="64" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="262" text-anchor="middle" font-size="14" fill="#8f3b38" filter="url(#rough2)">1</text>
  <rect x="264" y="236" width="64" height="40" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <rect x="336" y="236" width="64" height="40" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="368" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <rect x="408" y="236" width="64" height="40" rx="6" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="262" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>

  <rect x="496" y="88" width="200" height="192" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="596" y="116" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">一列 = 一个决策变量</text>
  <text x="596" y="142" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">d[i] ∈ {0, 1}</text>
  <text x="596" y="168" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0 = 不换，1 = 交换</text>
  <text x="596" y="196" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">交换只在这两个值之间</text>
  <text x="596" y="222" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">相邻列的值原封不动</text>
  <text x="596" y="250" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">⇒ 无后效性：前缀状态</text>
  <text x="596" y="270" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">只需记住上一列换没换</text>

  <text x="360" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">目标：两行都严格递增，且 Σ d[i] 最小；决策之间只通过相邻两列耦合</text>
  <text x="360" y="342" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">耦合形式：nums1[i-1] 与 nums1[i]、nums2[i] 的大小关系（共 4 个值参与）</text>
  <text x="360" y="368" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">于是把「2^n 种全局方案」压成「逐列推进的 2 状态自动机」</text>
</svg>
