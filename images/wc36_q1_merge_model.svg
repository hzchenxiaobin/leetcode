<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">叠加模型：位置相同的节点才相加</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">位置由「从根出发的路径」唯一确定：根 / L / R / LL / LR / RR / …</text>

  <text x="100" y="76" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">root1 = [1,3,2,5]</text>
  <text x="460" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">root2 = [2,1,3,null,4,null,7]</text>

  <g stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 100 120 L 62 152"/>
    <path d="M 100 120 L 138 152"/>
    <path d="M 58 183 L 36 216"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="100" cy="105" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="100" y="110" text-anchor="middle" font-size="12" fill="#2f3f5c">1</text>
    <circle cx="58" cy="168" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="58" y="173" text-anchor="middle" font-size="12" fill="#2f3f5c">3</text>
    <circle cx="142" cy="168" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="142" y="173" text-anchor="middle" font-size="12" fill="#2f3f5c">2</text>
    <circle cx="30" cy="231" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="30" y="236" text-anchor="middle" font-size="12" fill="#2f3f5c">5</text>
    <text x="58" y="258" text-anchor="middle" font-size="9.5" fill="#8a9ab5">是 3 的左孩子</text>
  </g>

  <g stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 460 120 L 422 152"/>
    <path d="M 460 120 L 498 152"/>
    <path d="M 418 183 L 396 216"/>
    <path d="M 502 183 L 520 216"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="460" cy="105" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="460" y="110" text-anchor="middle" font-size="12" fill="#33502a">2</text>
    <circle cx="418" cy="168" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="418" y="173" text-anchor="middle" font-size="12" fill="#33502a">1</text>
    <circle cx="502" cy="168" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="502" y="173" text-anchor="middle" font-size="12" fill="#33502a">3</text>
    <circle cx="390" cy="231" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="236" text-anchor="middle" font-size="12" fill="#33502a">4</text>
    <circle cx="520" cy="231" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="520" y="236" text-anchor="middle" font-size="12" fill="#33502a">7</text>
    <text x="518" y="258" text-anchor="middle" font-size="9" fill="#7d9a70">是 3 的右孩子</text>
  </g>

  <text x="280" y="150" text-anchor="middle" font-size="24" fill="#d6a040" filter="url(#rough2)">⊕</text>
  <path d="M 246 108 Q 280 128 246 148" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 314 108 Q 280 128 314 148" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="276" width="212" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66" y="296" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两侧同位置都有节点</text>
  <text x="66" y="312" font-size="10" fill="#555" filter="url(#rough2)">新值 = 两值相加，继续向下递归</text>

  <rect x="296" y="276" width="212" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="296" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">只有一侧有节点</text>
  <text x="310" y="312" font-size="10" fill="#555" filter="url(#rough2)">整棵子树原样挂上，不再递归</text>

  <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">根 1+2=3；L 3+1=4；R 2+3=5；LL 5（对面空）；LR 空+4=4；RR 空+7=7</text>
  <text x="280" y="366" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 合并结果 [3,4,5,5,4,null,7]，与示例 1 一致</text>
</svg>
