  <text x="448" y="98" font-size="10" fill="#3a5f2e" filter="url(#rough2)">1、8 → h=1，各记 1</text>
  <text x="448" y="116" font-size="10" fill="#3a5f2e" filter="url(#rough2)">5 (3 的左子) → h=2，记 3</text>
  <text x="448" y="134" font-size="10" fill="#3a5f2e" filter="url(#rough2)">2 → h=1，记 1</text>
  <text x="448" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">3 → hL=2 ≠ hR=1 → −1</text>
  <text x="448" y="170" font-size="10" fill="#3a5f2e" filter="url(#rough2)">6、8 → h=1，各记 1</text>
  <text x="448" y="188" font-size="10" fill="#3a5f2e" filter="url(#rough2)">5 (6 的左子) → h=2，记 3</text>
  <text x="448" y="206" font-size="10" fill="#3a5f2e" filter="url(#rough2)">7 → h=1，记 1</text>
  <text x="448" y="224" font-size="10" fill="#b85450" filter="url(#rough2)">6 → hL=2 ≠ hR=1 → −1</text>
  <text x="448" y="242" font-size="10" fill="#b85450" filter="url(#rough2)">根 5 → 左已 −1 → −1</text>

  <path d="M 448 254 L 608 254" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="528" y="270" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">父判 −1 不回滚：</text>
  <text x="528" y="284" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">孩子已入列的记录全部有效</text>

