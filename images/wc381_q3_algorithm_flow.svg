<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：计数 → 降序排序 → 分层求和</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="140" y="58" width="340" height="40" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="310" y="83" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">① 统计频率：freq[26] ← 一遍扫描 word</text>
  <path d="M 310 98 L 310 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="140" y="122" width="340" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="147" text-anchor="middle" font-size="13" fill="#2b5d85" filter="url(#sk)">② 频率降序排序（0 频率自然沉底）</text>
  <path d="M 310 162 L 310 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="140" y="186" width="340" height="48" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="310" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06b1a" filter="url(#sk)">③ 分层求和（i 从 0 起，共 26 格）</text>
  <text x="310" y="226" text-anchor="middle" font-size="12.5" fill="#a06b1a" filter="url(#sk)">ans += freq[i] × ( ⌊i / 8⌋ + 1 )</text>
  <path d="M 310 234 L 310 254" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="140" y="258" width="340" height="38" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="310" y="282" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">返回 ans —— 不必构造任何键盘方案</text>

  <!-- complexity labels -->
  <g filter="url(#sk)" font-size="11.5" font-weight="bold" fill="#4a8edb">
    <text x="500" y="112">O(n)</text>
    <text x="500" y="176">O(26 log 26)</text>
    <text x="500" y="248">O(26)</text>
  </g>

  <!-- side callout -->
  <g filter="url(#sk)">
    <rect x="497" y="58" width="128" height="72" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <text x="561" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4480" filter="url(#sk)">无回溯无搜索</text>
  <text x="561" y="105" text-anchor="middle" font-size="11" fill="#5a4480" filter="url(#sk)">只排 26 个数</text>
  <text x="561" y="122" text-anchor="middle" font-size="11" fill="#5a4480" filter="url(#sk)">答案只依赖频率</text>
  <path d="M 497 120 L 484 120" stroke="#8a6db5" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
</svg>
