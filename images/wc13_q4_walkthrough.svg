<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：w = "catsdogcats"，dp 记"最少段数"</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">此时树中已有 cat / dog / rat / cats；两块彩色框就是最终切分 cats | dog | cats</text>

  <!-- 字符条 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="75" y="72">0</text><text x="107" y="72">1</text><text x="139" y="72">2</text>
    <text x="171" y="72">3</text><text x="203" y="72">4</text><text x="235" y="72">5</text>
    <text x="267" y="72">6</text><text x="299" y="72">7</text><text x="331" y="72">8</text>
    <text x="363" y="72">9</text><text x="395" y="72">10</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <rect x="60" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="92" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="124" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="188" y="78" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="78" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="78" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="284" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="316" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="348" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="78" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="75" y="101">c</text><text x="107" y="101">a</text><text x="139" y="101">t</text>
    <text x="171" y="101">s</text><text x="203" y="101">d</text><text x="235" y="101">o</text>
    <text x="267" y="101">g</text><text x="299" y="101">c</text><text x="331" y="101">a</text>
    <text x="363" y="101">t</text><text x="395" y="101">s</text>
  </g>

  <!-- dp 条（按"边界"对齐） -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="46" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="61" y="142" fill="#8a6a20">0</text>
    <rect x="78" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="93" y="142" fill="#aaa">∞</text>
    <rect x="110" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="125" y="142" fill="#aaa">∞</text>
    <rect x="142" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="157" y="142" fill="#8a6a20">1</text>
    <rect x="174" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="189" y="142" fill="#8a6a20">1</text>
    <rect x="206" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="221" y="142" fill="#aaa">∞</text>
    <rect x="238" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="253" y="142" fill="#aaa">∞</text>
    <rect x="270" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="285" y="142" fill="#8a6a20">2</text>
    <rect x="302" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="317" y="142" fill="#aaa">∞</text>
    <rect x="334" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="349" y="142" fill="#aaa">∞</text>
    <rect x="366" y="122" width="30" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="381" y="142" fill="#aaa">∞</text>
    <rect x="398" y="122" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="413" y="142" fill="#8a3a38" font-weight="bold">3</text>
  </g>
  <text x="46" y="168" font-size="9" fill="#999" filter="url(#rough2)">dp 数组（下标 0..11，贴着字符边界）</text>

  <!-- 切分框 -->
  <rect x="58" y="176" width="132" height="28" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="195" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">cats</text>
  <rect x="188" y="176" width="94" height="28" fill="none" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="195" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dog</text>
  <rect x="282" y="176" width="130" height="28" fill="none" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="347" y="195" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">cats</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#d6a040">
    <text x="189" y="218">dp[4] = 1</text>
    <text x="285" y="218">dp[7] = 2</text>
    <text x="413" y="218">dp[11] = 3</text>
  </g>

  <!-- 图例 -->
  <rect x="432" y="78" width="188" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#3f5a36">
    <text x="444" y="99">树中：cat dog rat cats</text>
    <text x="444" y="119">dp[j] = 前 j 个字符的最少段数</text>
    <text x="444" y="139">∞ = 拼不出（前缀断了）</text>
    <text x="444" y="157">橙色 = 可达，红色 = 终点</text>
  </g>
  <text x="432" y="178" font-size="10" fill="#888" filter="url(#rough2)">第 1、3 段都是 cats</text>
  <text x="432" y="194" font-size="10" fill="#888" filter="url(#rough2)">同一单词可重复使用</text>

  <!-- 表 -->
  <rect x="30" y="230" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" font-weight="bold">
    <text x="44" y="249">起点 i</text>
    <text x="140" y="249">dp[i]</text>
    <text x="212" y="249">沿 Trie 匹配</text>
    <text x="430" y="249">松弛结果</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="48" y="279">0</text>
    <text x="144" y="279">0</text>
    <text x="212" y="279">cat→3、cats→4</text>
    <text x="430" y="279">dp[3]=1、dp[4]=1</text>

    <text x="48" y="309">3</text>
    <text x="144" y="309">1</text>
    <text x="212" y="309">s 起头，无单词</text>
    <text x="430" y="309">—</text>

    <text x="48" y="339">4</text>
    <text x="144" y="339">1</text>
    <text x="212" y="339">dog→7</text>
    <text x="430" y="339">dp[7]=2</text>

    <text x="48" y="369">7</text>
    <text x="144" y="369">2</text>
    <text x="212" y="369">cats→11</text>
    <text x="430" y="369">dp[11]=3 ✓</text>
  </g>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1" fill="none">
    <path d="M 30 288 L 610 288"/>
    <path d="M 30 318 L 610 318"/>
    <path d="M 30 348 L 610 348"/>
  </g>

  <text x="320" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">dp[11] = 3 ≥ 2 ⇒ 是连接词；对照 "hippopotamuses" 的 'h' 不在树中，dp = ∞</text>
</svg>
