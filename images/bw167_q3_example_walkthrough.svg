  <text x="337" y="227" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">[l,r)=[0,1) → 98-0</text>
  <rect x="440" y="206" width="156" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="518" y="227" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">98</text>
  <rect x="24" y="242" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="263" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">totalScore(1,5)</text>
  <rect x="242" y="242" width="190" height="32" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="337" y="263" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">[l,r)=[0,2) → 197-0</text>
  <rect x="440" y="242" width="156" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="518" y="263" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">197</text>
