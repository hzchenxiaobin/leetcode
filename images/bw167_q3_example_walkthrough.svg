<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 的调用过程：每次查询一次减法</text>
  <rect x="24" y="60" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="129" y="80" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="242" y="60" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="337" y="80" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">times / pref 状态</text>
  <rect x="440" y="60" width="156" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="518" y="80" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回</text>
  <rect x="24" y="98" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="119" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">record(1,98)</text>
  <rect x="242" y="98" width="190" height="32" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="337" y="119" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">times=[1] pref=[0,98]</text>
  <rect x="440" y="98" width="156" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="518" y="119" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">null</text>
  <rect x="24" y="134" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="155" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">totalScore(1,1)</text>
