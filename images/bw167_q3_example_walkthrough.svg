  <text x="518" y="299" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="24" y="314" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="129" y="335" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">totalScore(2,5)</text>
