  <text x="518" y="335" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">99</text>
  <text x="310" y="368" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">与题面输出 [null,null,98,null,98,197,0,99] 完全一致</text>
