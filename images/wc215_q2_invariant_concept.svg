<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="452" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">两种操作都动不了『字符集合』，只在场内搬运『频次』</text>
  <text x="360" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">操作 1 重排位置、频次不动；操作 2 互换两个在场字符的整段频次</text>

  <!-- ============ ① 操作 1：位置对换 ============ -->
  <text x="40" y="78" font-size="12.5" fill="#333" filter="url(#rough2)">① 操作 1：交换任意两个现有字符的位置</text>

  <rect x="40" y="88" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="110" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="80" y="88" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="98" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="120" y="88" width="36" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="160" y="88" width="36" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="178" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="200" y="88" width="36" height="36" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="218" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>

  <path d="M98,128 C130,140 186,140 214,148" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M218,128 C186,140 130,140 98,150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="158" y="142" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">b 与 e 换位</text>

  <rect x="40" y="152" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="174" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="80" y="152" width="36" height="36" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="98" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <rect x="120" y="152" width="36" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="160" y="152" width="36" height="36" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="178" y="174" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="200" y="152" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="218" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b</text>

  <text x="272" y="100" font-size="11" fill="#333" filter="url(#rough2)">频次向量逐项不动：</text>
  <text x="272" y="118" font-size="11.5" fill="#333" filter="url(#rough2)">a:1 b:1 c:1 d:1 e:1</text>
  <text x="272" y="136" font-size="10.5" fill="#666" filter="url(#rough2)">顺序毫无意义，可先忽略</text>

  <text x="40" y="212" font-size="11" fill="#666" filter="url(#rough2)">→ 只动位置：频次计数与字符集合完全不变</text>

  <!-- ============ ② 操作 2：频次互换 ============ -->
  <text x="40" y="240" font-size="12.5" fill="#333" filter="url(#rough2)">② 操作 2：两个在场字符 x ↔ y，频次整体互换</text>

  <rect x="40" y="250" width="46" height="22" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="265" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">字符</text>
  <rect x="90" y="250" width="48" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="265" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="138" y="250" width="48" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="265" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="186" y="250" width="48" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="265" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">c</text>

  <rect x="40" y="272" width="46" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="289" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">频次</text>
  <rect x="90" y="272" width="48" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="114" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="272" width="48" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="162" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="186" y="272" width="48" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="289" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M162,302 L162,322" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="176" y="316" font-size="11" fill="#8a6d1f" filter="url(#rough2)">操作 2：b ↔ c（整段互换）</text>

  <rect x="40" y="330" width="46" height="22" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="345" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">字符</text>
  <rect x="90" y="330" width="48" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="345" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="138" y="330" width="48" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="345" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="186" y="330" width="48" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="345" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">c</text>

  <rect x="40" y="352" width="46" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="369" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">频次</text>
  <rect x="90" y="352" width="48" height="24" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="114" y="369" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="352" width="48" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="369" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="186" y="352" width="48" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="369" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <text x="40" y="402" font-size="11" fill="#666" filter="url(#rough2)">→ 字符集合不变；正频次多重集 {1,2,3} 不变（3 与 1 互换了位置）</text>

  <!-- ============ 右侧要点面板 ============ -->
  <rect x="452" y="70" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="92" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">不变量 ①：在场字符集合</text>
  <text x="572" y="110" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">哪些字母在场——操作动不了</text>

  <rect x="452" y="142" width="240" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不变量 ②：正频次多重集</text>
  <text x="572" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">{2,3,1} 换来换去还是 {1,2,3}</text>

  <rect x="452" y="214" width="240" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="572" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">接近 ⟺</text>
  <text x="572" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">集合相同 且 频次多重集相同</text>
  <text x="572" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（长度相同蕴含于频次总和）</text>

  <rect x="452" y="316" width="240" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="572" y="338" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">判定心法</text>
  <text x="572" y="354" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">别问「能变成什么」</text>
  <text x="572" y="370" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">问「什么永远变不了」</text>
</svg>
