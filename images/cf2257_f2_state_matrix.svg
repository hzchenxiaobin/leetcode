<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="700" height="372" fill="#fafafa"/>
  <text x="350" y="27" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">状态只留最后 x 个 DP 值：一个平台 = 一个 x×x 的 (min,+) 矩阵</text>
  <text x="350" y="50" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" filter="url(#rough2)">x = 3，D = 5；src 是距平台左端的回退格数，dst 是距右端的回退格数</text>
  <rect x="40" y="98" width="34" height="34" rx="4" fill="#f1f1f1" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="57" y="120" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#rough2)">s2</text>
  <rect x="74" y="98" width="34" height="34" rx="4" fill="#f1f1f1" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="120" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#rough2)">s1</text>
  <rect x="108" y="98" width="34" height="34" rx="4" fill="#f1f1f1" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="120" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#rough2)">s0</text>
  <rect x="150" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="184" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="218" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="235" y="128" text-anchor="middle" font-size="8" fill="#446688" font-weight="normal" filter="url(#rough2)">d2</text>
  <rect x="252" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="269" y="128" text-anchor="middle" font-size="8" fill="#446688" font-weight="normal" filter="url(#rough2)">d1</text>
  <rect x="286" y="98" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="116" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="303" y="128" text-anchor="middle" font-size="8" fill="#446688" font-weight="normal" filter="url(#rough2)">d0</text>
  <rect x="330" y="98" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="364" y="98" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">…</text>
  <path d="M 125 96 Q 180 70 235 96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="normal" filter="url(#rough2)">红线：跨平台边界的一跳 → 0 分</text>
  <text x="200" y="170" text-anchor="middle" font-size="10" fill="#446688" font-weight="normal" filter="url(#rough2)">蓝框内部：每跳罚 s 分，尽量跳远</text>
  <text x="544" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="normal" filter="url(#rough2)">T[dst][src]（单位 s，D = 5, x = 3）</text>
  <text x="488" y="109" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">src=0</text>
  <text x="544" y="109" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">src=1</text>
  <text x="600" y="109" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">src=2</text>
  <text x="452" y="140" text-anchor="end" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">dst=0</text>
  <text x="452" y="174" text-anchor="end" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">dst=1</text>
  <text x="452" y="208" text-anchor="end" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">dst=2</text>
  <rect x="460" y="118" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488" y="140" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="516" y="118" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="544" y="140" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="572" y="118" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">2s</text>
  <rect x="460" y="152" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488" y="174" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="516" y="152" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="544" y="174" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="572" y="152" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="174" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="460" y="186" width="56" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488" y="208" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="516" y="186" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="544" y="208" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="572" y="186" width="56" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="208" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="350" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" filter="url(#rough2)">T[dst][src] = s · max(0, ⌊(D + src − dst − 1) / x⌋)</text>
  <text x="350" y="288" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" filter="url(#rough2)">dst ≥ D（目标格落在平台左侧）时改为纯平移：T[dst][dst − D] = 0</text>
  <text x="350" y="312" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" filter="url(#rough2)">组合就是 (min,+) 矩阵乘法，满足结合律</text>
  <text x="350" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="normal" filter="url(#rough2)">答案 = (T_r ⊗ ⋯ ⊗ T_{l+1} ⊗ P_l) 的第 0 个分量</text>
</svg>
