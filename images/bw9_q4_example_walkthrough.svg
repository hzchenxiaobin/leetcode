<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 3（blocks=[1,2,3]，split=1）的合并与时间线</text>

  <!-- 合并序列表 -->
  <rect x="40" y="52" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="71" font-size="11.5" fill="#3a4a66" font-weight="bold">步骤</text>
  <text x="130" y="71" font-size="11.5" fill="#3a4a66" font-weight="bold">堆内容</text>
  <text x="290" y="71" font-size="11.5" fill="#3a4a66" font-weight="bold">动作</text>
  <text x="470" y="71" font-size="11.5" fill="#3a4a66" font-weight="bold">新权值</text>

  <rect x="40" y="82" width="480" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="101" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="101" font-size="11.5" fill="#333" filter="url(#rough2)">{1, 2, 3}</text>
  <text x="290" y="101" font-size="11.5" fill="#555" filter="url(#rough2)">初始：三个独立叶子</text>
  <text x="470" y="101" font-size="11.5" fill="#bbb" filter="url(#rough2)">—</text>

  <rect x="40" y="112" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="131" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="131" font-size="11.5" fill="#333" filter="url(#rough2)">{3, 3}</text>
  <text x="290" y="131" font-size="11.5" fill="#555" filter="url(#rough2)">弹出 1、2 合并</text>
  <text x="470" y="131" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1+2=3</text>

  <rect x="40" y="142" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="161" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="161" font-size="11.5" fill="#333" filter="url(#rough2)">{4}</text>
  <text x="290" y="161" font-size="11.5" fill="#555" filter="url(#rough2)">弹出 3、3 合并</text>
  <text x="470" y="161" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1+3=4</text>

  <rect x="40" y="172" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="191" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="130" y="191" font-size="11.5" fill="#333" filter="url(#rough2)">{4}</text>
  <text x="290" y="191" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">只剩一个 → 返回 4 ✓</text>
  <text x="470" y="191" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 4</text>

  <!-- 时间线甘特图 -->
  <text x="40" y="238" font-size="12.5" fill="#333" font-weight="bold">对应的实际时间线：</text>

  <line x1="120" y1="252" x2="520" y2="252" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="246" font-size="10" fill="#888" filter="url(#rough2)">t=0</text>
  <text x="245" y="246" font-size="10" fill="#888" filter="url(#rough2)">t=1</text>
  <text x="370" y="246" font-size="10" fill="#888" filter="url(#rough2)">t=2</text>
  <text x="495" y="246" font-size="10" fill="#888" filter="url(#rough2)">t=3</text>

  <rect x="120" y="262" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="277" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">唯一的工人分裂 [0,1)</text>

  <rect x="145" y="294" width="75" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="309" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工人 A 建街区 3 [1,4)，耗时 3</text>

  <rect x="145" y="326" width="25" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="341" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">工人 B 再分裂 [1,2)</text>

  <rect x="170" y="358" width="25" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="373" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工人 C 建街区 1 [2,3)，耗时 1</text>

  <rect x="170" y="390" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="405" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">工人 D 建街区 2 [2,4)，耗时 2 → 4 时刻全部完工</text>

  <text x="520" y="290" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max = 4</text>
</svg>
