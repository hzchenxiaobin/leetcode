<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察一：初始 sick 把健康小朋友切成独立段</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">示例：n = 10，sick = [2, 5, 8]（红格 = 初始感冒者）</text>

  <text x="117" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">段A（左开放）</text>
  <text x="267" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">段B（中间）</text>
  <text x="417" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">段C（中间）</text>
  <text x="542" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">段D（右开放）</text>

  <g filter="url(#sk)"><rect x="62" y="96" width="110" height="60" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="96" width="110" height="60" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="362" y="96" width="110" height="60" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="512" y="96" width="60" height="60" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>

  <g filter="url(#sk)"><rect x="70" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="92" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="120" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="142" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="170" y="104" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="192" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">2</text>
  <g filter="url(#sk)"><rect x="220" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="242" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="270" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="292" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="320" y="104" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="342" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">5</text>
  <g filter="url(#sk)"><rect x="370" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="392" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">6</text>
  <g filter="url(#sk)"><rect x="420" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="442" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">7</text>
  <g filter="url(#sk)"><rect x="470" y="104" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="492" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">8</text>
  <g filter="url(#sk)"><rect x="520" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="542" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">9</text>

  <text x="117" y="178" text-anchor="middle" font-size="11" fill="#555">顺序被迫：先 1 后 0</text>
  <text x="267" y="178" text-anchor="middle" font-size="11" fill="#555">先 3 或先 4 均可</text>
  <text x="417" y="178" text-anchor="middle" font-size="11" fill="#555">先 6 或先 7 均可</text>
  <text x="542" y="178" text-anchor="middle" font-size="11" fill="#555">只能先 9</text>

  <g filter="url(#sk)"><rect x="55" y="196" width="260" height="100" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="185" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开放段：仅一端挨着 sick</text>
  <text x="185" y="242" text-anchor="middle" font-size="12" fill="#444">感染只能由 sick 那端单侧推进</text>
  <text x="185" y="260" text-anchor="middle" font-size="12" fill="#444">段A：1 先、0 后，别无选择</text>
  <text x="185" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">内部顺序唯一（1 种）</text>

  <g filter="url(#sk)"><rect x="325" y="196" width="260" height="100" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="455" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">中间段：两端都挨着 sick</text>
  <text x="455" y="242" text-anchor="middle" font-size="12" fill="#444">两端都可发起感染，向内推进</text>
  <text x="455" y="260" text-anchor="middle" font-size="12" fill="#444">段B：先 3 或先 4，往后仍有选择</text>
  <text x="455" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">内部顺序 2^(m−1) 种 → 观察二</text>

  <g filter="url(#sk)"><rect x="55" y="312" width="530" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b1e">段与段互不干扰（独立性）</text>
  <text x="320" y="356" text-anchor="middle" font-size="12" fill="#444">健康小朋友的邻居 = 同段邻居 ＋ 段边界的 sick</text>
  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#444">任何一段的传染进度，都不改变其它段「下一个可被传染者」</text>
  <text x="320" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">全局感冒序列 = 各段内部序列的穿插 → 观察三</text>

  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#666">左、右开放段至多各 1 个；各段长度之和 = 健康总人数 M = n − |sick|</text>
</svg>
