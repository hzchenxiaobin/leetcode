<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：差距 |goal − S| 是坑深，每块新元素最多「填」limit</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以示例 1 为例：nums=[1,−1,1], limit=3, goal=−4 —— 不必纠结添加哪些数，只需数「补齐差距要几块砖」</text>

  <!-- Row 1: nums -> S -> goal -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="56" y="60" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="78" y="81" fill="#333">1</text>
    <rect x="102" y="60" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="124" y="81" fill="#333">−1</text>
    <rect x="148" y="60" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="170" y="81" fill="#333">1</text>
  </g>
  <text x="211" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">Σ</text>
  <path d="M 196 81 L 226 81" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="230" y="60" width="86" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="273" y="81" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">S = 1</text>
  <path d="M 320 76 L 350 76" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="354" y="60" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="406" y="81" text-anchor="middle" font-size="13" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">goal = −4</text>
  <path d="M 273 98 L 273 106 L 406 106 L 406 98" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="124" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">差距 |diff| = |goal − S| = |−4 − 1| = 5</text>

  <!-- Pit -->
  <text x="165" y="152" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">当前总和层 S = 1</text>
  <path d="M 58 168 L 282 168" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 100 168 L 100 268 L 240 268 L 240 168" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <path d="M 84 168 L 84 268" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">坑深 5</text>
  <rect x="104" y="208" width="132" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="243" text-anchor="middle" font-size="12" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">−3 整砖</text>
  <rect x="104" y="168" width="132" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">−2 余数砖</text>
  <text x="165" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">目标层 goal = −4</text>

  <!-- Right column -->
  <rect x="300" y="150" width="244" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每块新元素 |x| ≤ limit = 3</text>
  <path d="M 246 218 L 296 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="300" y="196" width="244" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贪心铺砖：k−1 块整砖 ±3</text>
  <text x="422" y="231" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">再补 1 块余数砖填零头</text>
  <rect x="300" y="248" width="244" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="273" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">两块 −3、−2 恰好填平 ⇒ ans = 2</text>

  <!-- Formula -->
  <rect x="44" y="306" width="472" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">ans = ⌈ |goal − S| / limit ⌉ = ( |goal − S| + limit − 1 ) // limit</text>

  <!-- Insight -->
  <rect x="44" y="354" width="472" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下界：k 块砖总贡献 ≤ k·limit ⇒ k ≥ ⌈|diff| / limit⌉</text>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">构造：k−1 块整砖 + 1 块余数砖（厚度 ∈ (0, limit]）⇒ 下界可达，两者重合即最优</text>
</svg>
