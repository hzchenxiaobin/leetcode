<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：二分每份数 m，求最大可行值</text>
  <path d="M 170 36 Q 330 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="225" y="48" width="210" height="34" rx="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="330" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">lo=1, hi=max(candies), ans=0</text>

  <path d="M 330 82 L 330 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <g filter="url(#sk)">
    <polygon points="330,102 430,140 330,178 230,140" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="330" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">lo ≤ hi ?</text>
  <text x="330" y="156" text-anchor="middle" font-size="10.5" fill="#888">（还有候选区间）</text>

  <!-- no -> return -->
  <path d="M 430 140 L 476 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a36">否</text>
  <g filter="url(#sk)">
    <ellipse cx="530" cy="140" rx="50" ry="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="530" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <text x="530" y="153" text-anchor="middle" font-size="10" fill="#2e6e2e">（可为 0）</text>

  <!-- yes -> compute -->
  <path d="M 330 178 L 330 196" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="344" y="192" text-anchor="start" font-size="11" font-weight="bold" fill="#4a8e4a">是</text>

  <g filter="url(#sk)">
    <rect x="210" y="198" width="240" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="220" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">mid = (lo + hi) / 2</text>
  <text x="330" y="240" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-family="monospace">cnt = Σ⌊candies[i] / mid⌋</text>
  <text x="330" y="256" text-anchor="middle" font-size="10" fill="#888">（mid 每份数时能分给几个小孩）</text>

  <path d="M 330 260 L 330 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 2 -->
  <g filter="url(#sk)">
    <polygon points="330,316 445,354 330,392 215,354" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="330" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cnt ≥ k ?</text>
  <text x="330" y="370" text-anchor="middle" font-size="10.5" fill="#888">（够 k 个小孩分吗）</text>

  <!-- yes -> record & go right -->
  <path d="M 215 354 L 186 354" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="200" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8e4a">是（够分）</text>
  <g filter="url(#sk)">
    <rect x="20" y="332" width="162" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="101" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = mid; lo = mid+1</text>
  <text x="101" y="369" text-anchor="middle" font-size="10.5" fill="#2e6e2e">记录答案，往右找更大</text>

  <!-- no -> shrink left -->
  <path d="M 445 354 L 474 354" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="460" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">否（不够）</text>
  <g filter="url(#sk)">
    <rect x="478" y="332" width="162" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="559" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">hi = mid − 1</text>
  <text x="559" y="369" text-anchor="middle" font-size="10.5" fill="#a03a36">每份太大，往左缩</text>

  <!-- loop rail back to decision 1 -->
  <path d="M 101 378 L 101 406" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" fill="none" filter="url(#sk)"/>
  <path d="M 559 378 L 559 406 L 101 406" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" fill="none" filter="url(#sk)"/>
  <path d="M 101 406 L 12 406 L 12 140 L 226 140" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="424" text-anchor="middle" font-size="10.5" fill="#888">两分支收缩后回到「lo ≤ hi ?」继续，直到区间为空</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="580" height="32" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="457" text-anchor="middle" font-size="11.5" fill="#888">求最大可行：可行时先记 ans = mid 再右缩；求最小可行（875 型）收缩方向相反</text>
</svg>
