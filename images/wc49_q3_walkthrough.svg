<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：(0,0) 出发，按 2 → 3 → 4 → 5 → 6 → 7 共 6 步</text>

  <!-- 第一行 -->
  <rect x="40" y="70" width="56" height="56" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="124" y="70" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="208" y="70" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 第二行 -->
  <rect x="40" y="154" width="56" height="56" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="124" y="154" width="56" height="56" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="154" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 第三行 -->
  <rect x="40" y="238" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="124" y="238" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="208" y="238" width="56" height="56" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 格子数值 -->
  <text x="68" y="110" text-anchor="middle" font-size="17" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="152" y="110" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">2</text>
  <text x="236" y="110" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">3</text>
  <text x="68" y="194" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">0</text>
  <text x="152" y="194" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">0</text>
  <text x="236" y="194" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">4</text>
  <text x="68" y="278" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">7</text>
  <text x="152" y="278" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">6</text>
  <text x="236" y="278" text-anchor="middle" font-size="17" fill="#33602a" filter="url(#rough2)">5</text>

  <!-- 步序箭头 -->
  <path d="M98,98 L122,98" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M182,98 L206,98" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M236,128 L236,152" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M236,212 L236,236" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M206,266 L182,266" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M122,266 L98,266" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步数徽标 -->
  <circle cx="48" cy="78" r="9" fill="#d6a040" stroke="#8a6d1f" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">0</text>

  <circle cx="132" cy="78" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="132" y="82" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">1</text>

  <circle cx="216" cy="78" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="216" y="82" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">2</text>

  <circle cx="216" cy="162" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="216" y="166" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">3</text>

  <circle cx="216" cy="246" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="216" y="250" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">4</text>

  <circle cx="132" cy="246" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="132" y="250" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">5</text>

  <circle cx="48" cy="246" r="9" fill="#4a7a3a" stroke="#33602a" stroke-width="1"
          filter="url(#rough2)"/>
  <text x="48" y="250" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">6</text>

  <!-- 右侧说明 -->
  <text x="300" y="88" font-size="13" fill="#333" filter="url(#rough2)">砍伐顺序（高度升序）</text>
  <text x="300" y="116" font-size="13" fill="#33602a" filter="url(#rough2)">2 → 3 → 4 → 5 → 6 → 7</text>
  <text x="300" y="146" font-size="12" fill="#555" filter="url(#rough2)">每段最短路均 = 1 步</text>
  <text x="300" y="174" font-size="14" fill="#b85450" filter="url(#rough2)">总步数 = 1 × 6 = 6</text>

  <rect x="296" y="196" width="250" height="66" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="220" font-size="11" fill="#2c4a63" filter="url(#rough2)">0 = 障碍，不可通行</text>
  <text x="312" y="244" font-size="11" fill="#2c4a63" filter="url(#rough2)">树格始终可走，砍后值变 1</text>

  <text x="300" y="290" font-size="11" fill="#555" filter="url(#rough2)">起点是地面 1，第 1 棵树在 1 步之外</text>

  <text x="40" y="322" font-size="11" fill="#777" filter="url(#rough2)">小圆点 = 走到该格的累计步数</text>
</svg>
