<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">水位 = 所有「逃到边界」路径上最高格的最小值</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">水只能沿四联通慢慢漫出去，挡住它的是路径上最矮的那道「山脊」</text>

  <!-- 3x3 高度图 -->
  <rect x="44" y="74" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="74" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="74" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="44" y="126" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="126" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="126" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="44" y="178" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="178" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="178" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <text x="70" y="105" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="122" y="105" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="174" y="105" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="70" y="157" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="122" y="157" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="174" y="157" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="70" y="209" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="122" y="209" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="174" y="209" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">2</text>

  <text x="122" y="250" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3 x 3 高度图：绿格都在边界，橙色中心格高 1</text>
  <text x="122" y="266" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">边界格水位 = 自身高度，永远存不住水</text>

  <!-- 右侧推导面板 -->
  <rect x="224" y="64" width="312" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="238" y="83" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">四条一步到边的路线，各自的瓶颈</text>
  <text x="238" y="101" font-size="10" fill="#444" filter="url(#rough2)">↑ 上：经过 (0,1)=3 &#8594; 瓶颈 3</text>
  <text x="238" y="118" font-size="10" fill="#444" filter="url(#rough2)">← 左：经过 (1,0)=4 &#8594; 瓶颈 4</text>
  <text x="238" y="135" font-size="10" fill="#444" filter="url(#rough2)">→ 右：经过 (1,2)=3 &#8594; 瓶颈 3</text>
  <text x="238" y="152" font-size="10" fill="#444" filter="url(#rough2)">↓ 下：经过 (2,1)=5 &#8594; 瓶颈 5</text>

  <rect x="224" y="172" width="312" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="380" y="199" text-anchor="middle" font-size="12" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">水位 = min{3, 4, 3, 5} = 3</text>

  <rect x="224" y="230" width="312" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="380" y="249" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">积水 = max(0, 水位 - 高度) = 3 - 1 = 2</text>
  <text x="380" y="265" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">水位低于格高时一滴也存不下，故要取 max(0, ·)</text>

  <text x="280" y="304" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">一般化：路径可以拐弯，水位 = 对所有边界路径 P 取「P 上最高格」的最小值</text>
  <text x="280" y="324" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">这是「最小瓶颈路」——每条边的权是端点较高者的高度，最短路用优先队列求</text>
</svg>
