<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：成本 = 1 份基料 + 每种配料 0/1/2 份</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="36" y="56" width="300" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="186" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">基料区：必选恰好 1 种</text>
  <g filter="url(#sk)">
    <rect x="56" y="92" width="110" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="186" y="92" width="110" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="111" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">基料① ¥1</text>
  <text x="241" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">基料② ¥7</text>

  <text x="186" y="164" text-anchor="middle" font-size="20" font-weight="bold" fill="#666" filter="url(#sk)">+</text>

  <g filter="url(#sk)">
    <rect x="36" y="170" width="300" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="186" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">配料区：每种 0 / 1 / 2 份</text>
  <text x="52" y="232" font-size="11.5" fill="#8a6a1c" filter="url(#sk)">配料A ¥3</text>
  <g filter="url(#sk)">
    <rect x="150" y="216" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="214" y="216" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="278" y="216" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="178" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×0</text>
  <text x="242" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×1</text>
  <text x="306" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×2</text>
  <text x="52" y="278" font-size="11.5" fill="#8a6a1c" filter="url(#sk)">配料B ¥4</text>
  <g filter="url(#sk)">
    <rect x="150" y="262" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="214" y="262" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="278" y="262" width="56" height="26" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="178" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×0</text>
  <text x="242" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×1</text>
  <text x="306" y="279" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">×2</text>

  <g filter="url(#sk)">
    <rect x="36" y="306" width="300" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="186" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">成本 c = b + k1·t1 + … + km·tm</text>
  <text x="186" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">ki ∈ {0, 1, 2} → 全组合 n × 3^m</text>
  <text x="186" y="372" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">n, m ≤ 10 时至多 ≈ 5.9 × 10⁵ 个</text>

  <g filter="url(#sk)">
    <rect x="356" y="56" width="256" height="104" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="484" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4440" filter="url(#sk)">观察 A · 单调剪枝</text>
  <text x="484" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">单价全为正，部分和只增不减</text>
  <text x="484" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">cur ≥ target 后再买只会更远</text>
  <text x="484" y="140" text-anchor="middle" font-size="11" fill="#8a4440" filter="url(#sk)">→ 记录候选，整棵子树剪掉</text>

  <g filter="url(#sk)">
    <rect x="356" y="172" width="256" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="484" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">观察 B · 可达和集合</text>
  <text x="484" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">配料加价和 = 多重背包可行性</text>
  <text x="484" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">集合 {0} 起逐轮扩张 O(m·U)</text>
  <text x="484" y="254" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">U = 2Σt ≤ 2×10⁵</text>

  <g filter="url(#sk)">
    <rect x="356" y="288" width="256" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="484" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">选优：双关键字</text>
  <text x="484" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">对 ( |c − target| , c ) 取最小</text>
  <text x="484" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">→ 距离最近；并列取更低成本</text>
  <text x="484" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">两条路线共用这一个比较器</text>
</svg>
