<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：15 分钟网格 —— 进入上取整、退出下取整</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- session labels -->
  <text x="78" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">进入 12:01</text>
  <text x="422" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">退出 12:44</text>

  <!-- timeline cells -->
  <g filter="url(#sk)">
    <rect x="70" y="100" width="120" height="50" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="190" y="100" width="120" height="50" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="310" y="100" width="120" height="50" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="430" y="100" width="120" height="50" rx="4" fill="#f7f7f5" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="130" y="131" text-anchor="middle" font-size="14" fill="#b03a3a">✗</text>
  <text x="250" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="250" y="144" text-anchor="middle" font-size="9.5" fill="#2e6e2e">完整对局</text>
  <text x="370" y="131" text-anchor="middle" font-size="14" fill="#b03a3a">✗</text>

  <!-- session markers -->
  <g filter="url(#sk)">
    <line x1="78" y1="88" x2="78" y2="158" stroke="#b85450" stroke-width="2.2"/>
    <line x1="422" y1="88" x2="422" y2="158" stroke="#4a8edb" stroke-width="2.2"/>
  </g>

  <!-- ticks -->
  <g filter="url(#sk)">
    <line x1="70" y1="150" x2="70" y2="156" stroke="#888" stroke-width="1.2"/>
    <line x1="190" y1="150" x2="190" y2="156" stroke="#888" stroke-width="1.2"/>
    <line x1="310" y1="150" x2="310" y2="156" stroke="#888" stroke-width="1.2"/>
    <line x1="430" y1="150" x2="430" y2="156" stroke="#888" stroke-width="1.2"/>
    <line x1="550" y1="150" x2="550" y2="156" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="70" y="171" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">12:00</text>
  <text x="190" y="171" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">12:15</text>
  <text x="310" y="171" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">12:30</text>
  <text x="430" y="171" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">12:45</text>
  <text x="550" y="171" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">13:00</text>

  <!-- rounding arrows -->
  <g filter="url(#sk)">
    <line x1="78" y1="158" x2="78" y2="190" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="422" y1="158" x2="422" y2="190" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 84 192 L 182 192" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 416 192 L 318 192" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="133" y="211" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">⌈s/15⌉ = 49 → 12:15</text>
  <text x="367" y="211" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">⌊f/15⌋ = 50 → 12:30</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="100" y="232" width="480" height="56" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="256" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">完整对局数 = max(0, ⌊f/15⌋ − ⌈s/15⌉)</text>
  <text x="340" y="277" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">= max(0, 50 − 49) = 1 局（仅 12:15→12:30 这局）</text>

  <!-- explanation boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="306" width="292" height="82" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="186" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">进入上取整 ⌈s/15⌉</text>
  <text x="186" y="350" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">12:01 迟到 → [12:00,12:15] 作废 ✗</text>
  <text x="186" y="368" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">向右吸附到下一格左端 12:15</text>
  <g filter="url(#sk)">
    <rect x="348" y="306" width="292" height="82" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="494" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">退出下取整 ⌊f/15⌋</text>
  <text x="494" y="350" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">12:44 早退 → [12:30,12:45] 作废 ✗</text>
  <text x="494" y="368" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">向左吸附到上一格右端 12:30</text>
</svg>
