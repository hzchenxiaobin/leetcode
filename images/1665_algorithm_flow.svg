<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：按 d 降序排序，一遍扫描补水位</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="262" cy="64" rx="46" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 262 81 L 262 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="157" y="94" width="210" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 262 124 L 262 142" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="182" y="142" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 262 172 L 262 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="262" y="69" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#sk)">开始</text>
  <text x="262" y="113" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">按 m − a 从大到小排序</text>
  <text x="262" y="161" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">cur = 0，ans = 0</text>

  <g filter="url(#sk)">
    <rect x="52" y="192" width="416" height="176" rx="12" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="8 5"/>
    <polygon points="190,240 260,212 330,240 260,268" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <path d="M 190 240 L 128 240 L 128 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="62" y="262" width="178" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 260 268 L 260 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="196" y="306" width="134" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 151 306 L 151 322 L 196 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 263 338 L 263 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">对排序后的每个任务 [a, m]</text>
  <text x="260" y="245" text-anchor="middle" font-size="12.5" fill="#8a6510" filter="url(#sk)">cur ≥ m ?</text>
  <text x="172" y="233" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">否</text>
  <text x="270" y="292" text-anchor="middle" font-size="11.5" fill="#3a5a3a" filter="url(#sk)">是</text>
  <text x="151" y="279" text-anchor="middle" font-size="11.5" fill="#7a4440" filter="url(#sk)">ans += m − cur</text>
  <text x="151" y="297" text-anchor="middle" font-size="11.5" fill="#7a4440" filter="url(#sk)">cur = m</text>
  <text x="263" y="326" text-anchor="middle" font-size="12" fill="#3a5a3a" filter="url(#sk)">cur −= a</text>

  <g filter="url(#sk)">
    <ellipse cx="263" cy="392" rx="52" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="263" y="397" text-anchor="middle" font-size="12.5" fill="#3a5a3a" filter="url(#sk)">返回 ans</text>

  <g filter="url(#sk)">
    <rect x="490" y="216" width="154" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="490" y="300" width="154" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="567" y="238" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">ans 即</text>
  <text x="567" y="256" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">max_k(S_(k−1) + m_k)</text>
  <text x="567" y="274" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">（见证明）</text>
  <text x="567" y="320" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">每轮先把水位补到 m，</text>
  <text x="567" y="338" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">再扣掉 a；</text>
  <text x="567" y="356" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#sk)">cur 始终 ≥ 0</text>

  <g filter="url(#sk)">
    <rect x="52" y="428" width="592" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="348" y="448" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">时间 O(n log n)（排序）+ O(n)（扫描）；额外空间 O(1)</text>
</svg>
