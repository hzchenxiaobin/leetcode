<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">commands = [4, −1, 4, −2, 4]，障碍物 (2, 4)</text>

  <!-- 坐标系 -->
  <path d="M90 340 L340 340 M90 340 L90 50" stroke="#9aa4b0" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="346" y="344" font-size="11" fill="#666" filter="url(#rough2)">+x 东</text>
  <text x="66" y="46" font-size="11" fill="#666" filter="url(#rough2)">+y 北</text>

  <!-- 起点 -->
  <circle cx="90" cy="340" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="10" fill="#446688" filter="url(#rough2)">(0,0)</text>

  <!-- 路径：北 4 到 (0,4) -->
  <path d="M90 340 L90 170" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <circle cx="90" cy="170" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="34" y="166" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(0,4)</text>

  <!-- 东 4 但被 (2,4) 挡：停在 (1,4) -->
  <path d="M90 170 L126 170" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <circle cx="126" cy="170" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="108" y="150" font-size="10" fill="#b07d20" filter="url(#rough2)">(1,4)</text>

  <!-- 障碍 (2,4) -->
  <rect x="144" y="152" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="162" y="175" text-anchor="middle" font-size="10" fill="#8d3b37" filter="url(#rough2)">障碍</text>
  <text x="186" y="146" font-size="10" fill="#b85450" filter="url(#rough2)">(2,4) 挡住</text>

  <!-- 左转后向北 4 到 (1,8) -->
  <path d="M126 170 L126 90" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <circle cx="126" cy="90" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="100" y="86" font-size="10" fill="#446688" filter="url(#rough2)">(1,8)</text>

  <!-- 坐标刻度 -->
  <text x="140" y="356" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="180" y="356" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="80" y="196" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="80" y="116" font-size="10" fill="#999" filter="url(#rough2)">8</text>

  <!-- 说明 -->
  <rect x="360" y="60" width="238" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="479" y="84" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">关键规则</text>
  <text x="376" y="108" font-size="11" fill="#2c4a63" filter="url(#rough2)">· 撞到障碍：停在障碍前一格</text>
  <text x="376" y="130" font-size="11" fill="#2c4a63" filter="url(#rough2)">· 剩余步数不会「穿过」障碍</text>
  <text x="376" y="152" font-size="11" fill="#2c4a63" filter="url(#rough2)">· 然后继续执行下一条命令</text>
  <text x="376" y="172" font-size="11" fill="#2c4a63" filter="url(#rough2)">· 每条移动指令后都更新最远距离</text>

  <rect x="360" y="200" width="238" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="479" y="224" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">答案不是最后一格</text>
  <text x="376" y="248" font-size="11" fill="#8a6410" filter="url(#rough2)">(1,4) → 17， (1,8) → 65</text>
  <text x="376" y="270" font-size="11" fill="#8a6410" filter="url(#rough2)">取史上最大值 65，而非终点 (1,8)</text>
  <text x="376" y="288" font-size="11" fill="#8a6410" filter="url(#rough2)">若路径「先远后近」必须取 max</text>

  <rect x="360" y="316" width="238" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="479" y="340" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">示例 3 中回到原点，但答案仍是</text>
  <text x="479" y="358" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">曾经到过的 6² = 36</text>
</svg>
