<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">答案的三种形态：原样 / 同长度（最长前缀 + 更大数位 + 最小后缀）/ 变长</text>

  <!-- 形态 1 -->
  <text x="26" y="72" font-size="12" fill="#446688" filter="url(#rough2)">① 原样</text>
  <g filter="url(#rough2)">
    <rect x="120" y="52" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="184" y="52" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="248" y="52" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="312" y="52" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="75">1</text>
    <text x="214" y="75">2</text>
    <text x="278" y="75">3</text>
    <text x="342" y="75">5</text>
  </g>
  <text x="384" y="75" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">无零且达标 → 直接返回</text>

  <!-- 形态 2 -->
  <text x="26" y="142" font-size="12" fill="#446688" filter="url(#rough2)">② 同长度</text>
  <g filter="url(#rough2)">
    <rect x="120" y="122" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="184" y="122" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <rect x="248" y="122" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="312" y="122" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="145">前缀</text>
    <text x="214" y="145" font-weight="bold">dg</text>
    <text x="278" y="145">1</text>
    <text x="342" y="145">覆盖</text>
  </g>
  <g font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="176">num 前缀</text>
    <text x="214" y="176">dg&gt;num[p]</text>
    <text x="278" y="176">补 1 个</text>
    <text x="342" y="176">覆盖数位</text>
  </g>
  <text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（补 1 不改变乘积，只把长度凑到 k 位；覆盖数位按升序排列）</text>

  <!-- 形态 3 -->
  <text x="26" y="228" font-size="12" fill="#446688" filter="url(#rough2)">③ 变长</text>
  <g filter="url(#rough2)">
    <rect x="120" y="208" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="184" y="208" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="248" y="208" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="312" y="208" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="231">1</text>
    <text x="214" y="231">1</text>
    <text x="278" y="231">覆盖</text>
    <text x="342" y="231">覆盖</text>
  </g>
  <text x="410" y="231" font-size="12" fill="#446688" filter="url(#rough2)">长度 L = max(n+1, mm)</text>

  <rect x="56" y="266" width="448" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举顺序：p 从大到小（前缀越长越好），dg 从小到大（数位越小越好）</text>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">因此第一个可行的组合就是同长度里的最小值；同长度无解才进入 ③</text>

  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">后缀固定长度时，"1 的个数越多"字典序越小 ⇒ 用最少覆盖数位即可</text>
</svg>
