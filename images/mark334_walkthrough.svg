<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="560" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：双指针逐步推进</text>
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">蓝格 = 当前小值（i 所指）；橙格 = 当前大值（j 所指）；灰虚格 = 已配对</text>

  <text x="340" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">示例 2：nums = [9,2,5,4] → 排序 [2, 4, 5, 9]，n = 4，j 从 n − ⌊n/2⌋ = 2 起</text>

  <g filter="url(#rough2)">
    <rect x="140" y="116" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="202" y="116" width="52" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="264" y="116" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="326" y="116" width="52" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="166" y="138" font-weight="bold">2</text>
    <text x="228" y="138">4</text>
    <text x="290" y="138" font-weight="bold">5</text>
    <text x="352" y="138">9</text>
  </g>
  <path d="M 285 106 L 295 106 L 290 114 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="290" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">j</text>
  <path d="M 161 152 L 171 152 L 166 144 z" fill="#446688" filter="url(#rough2)"/>
  <text x="166" y="168" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">i</text>
  <text x="410" y="132" font-size="12.5" fill="#333" filter="url(#rough2)">2×nums[0] = 4 ≤ nums[2] = 5 ✓</text>
  <text x="410" y="150" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">配对 (2,5)！i→1，j→3</text>

  <g filter="url(#rough2)">
    <rect x="140" y="196" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="202" y="196" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="264" y="196" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="326" y="196" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="166" y="218" fill="#999">2</text>
    <text x="228" y="218" font-weight="bold" fill="#333">4</text>
    <text x="290" y="218" fill="#999">5</text>
    <text x="352" y="218" font-weight="bold" fill="#333">9</text>
  </g>
  <path d="M 347 186 L 357 186 L 352 194 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="352" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">j</text>
  <path d="M 223 232 L 233 232 L 228 224 z" fill="#446688" filter="url(#rough2)"/>
  <text x="228" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">i</text>
  <text x="410" y="212" font-size="12.5" fill="#333" filter="url(#rough2)">2×nums[1] = 8 ≤ nums[3] = 9 ✓</text>
  <text x="410" y="230" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">配对 (4,9)！i→2，j→4 出界</text>

  <g filter="url(#rough2)">
    <rect x="140" y="258" width="440" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">j 扫完 → 返回 2 × i = 4：四个下标全部标记</text>

  <text x="340" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">示例 1：nums = [3,5,2,4] → 排序 [2, 3, 4, 5]，n = 4，j 从 2 起</text>

  <g filter="url(#rough2)">
    <rect x="140" y="356" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="202" y="356" width="52" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="264" y="356" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="326" y="356" width="52" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="166" y="378" font-weight="bold">2</text>
    <text x="228" y="378">3</text>
    <text x="290" y="378" font-weight="bold">4</text>
    <text x="352" y="378">5</text>
  </g>
  <path d="M 285 346 L 295 346 L 290 354 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="290" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">j</text>
  <path d="M 161 392 L 171 392 L 166 384 z" fill="#446688" filter="url(#rough2)"/>
  <text x="166" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">i</text>
  <text x="410" y="372" font-size="12.5" fill="#333" filter="url(#rough2)">2×nums[0] = 4 ≤ nums[2] = 4 ✓</text>
  <text x="410" y="390" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">配对 (2,4)！i→1，j→3</text>

  <g filter="url(#rough2)">
    <rect x="140" y="412" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="202" y="412" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="264" y="412" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="326" y="412" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="166" y="434" fill="#999">2</text>
    <text x="228" y="434" font-weight="bold" fill="#333">3</text>
    <text x="290" y="434" fill="#999">4</text>
    <text x="352" y="434" font-weight="bold" fill="#333">5</text>
  </g>
  <path d="M 347 402 L 357 402 L 352 410 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="352" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">j</text>
  <path d="M 223 448 L 233 448 L 228 440 z" fill="#446688" filter="url(#rough2)"/>
  <text x="228" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">i</text>
  <text x="410" y="428" font-size="12.5" fill="#333" filter="url(#rough2)">2×nums[1] = 6 &gt; nums[3] = 5 ✗</text>
  <text x="410" y="446" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">配不动，j→4 出界，扫描结束</text>

  <g filter="url(#rough2)">
    <rect x="140" y="478" width="440" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="501" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6210" filter="url(#rough2)">返回 2 × i = 2：只配成 1 对，标记 2 个下标</text>

  <text x="340" y="542" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 3 [7,6,8] → [6,7,8]：2×6 = 12 &gt; 8，一对都配不成 → 返回 0</text>
</svg>
