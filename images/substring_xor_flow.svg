<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：预处理 30n 个候选入哈希，查询 O(1) 应答</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="217" y="58" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b">预处理（一次 O(30n)）</text>
  <text x="516" y="58" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6b">查询（每组 O(1)）</text>
  <path d="M 397 48 L 397 592" stroke="#d8d8d8" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>

  <!-- left: start -->
  <g filter="url(#sk)">
    <ellipse cx="170" cy="84" rx="60" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="89" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a22">i = 0，扫描起点</text>
  <path d="M 170 101 L 170 112" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond A -->
  <g filter="url(#sk)">
    <polygon points="170,116 244,146 170,176 96,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="170" y="151" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">s[i] == '1' ?</text>
  <path d="M 244 146 L 296 146" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="250" y="138" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="302" y="130" width="92" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="348" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3430">i += 1</text>
  <path d="M 348 130 L 348 84 L 236 84" stroke="#7a7a7a" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>

  <path d="M 170 176 L 170 192" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="178" y="190" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- init val, L -->
  <g filter="url(#sk)">
    <rect x="78" y="196" width="184" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">val = 0，L = 1</text>
  <path d="M 170 226 L 170 238" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond C -->
  <g filter="url(#sk)">
    <polygon points="170,242 250,272 170,302 90,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="170" y="277" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">L ≤ min(30, n−i) ?</text>
  <path d="M 250 272 L 348 272 L 348 166" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="258" y="264" font-size="9.5" font-weight="bold" fill="#b85450">否：该起点耗尽</text>

  <path d="M 170 302 L 170 316" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="178" y="314" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- incremental value -->
  <g filter="url(#sk)">
    <rect x="54" y="320" width="232" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b">val = (val &lt;&lt; 1) | s[i+L−1]</text>
  <path d="M 170 352 L 170 362" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond E -->
  <g filter="url(#sk)">
    <polygon points="170,366 242,398 170,430 98,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="170" y="403" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">val ∈ pos ?</text>
  <path d="M 242 398 L 296 398" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="246" y="390" font-size="10" font-weight="bold" fill="#b85450">已存在</text>
  <g filter="url(#sk)">
    <rect x="302" y="384" width="92" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="348" y="404" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3430">跳过（保最左）</text>

  <path d="M 170 430 L 170 446" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="177" y="444" font-size="10.5" font-weight="bold" fill="#4a7a3a">首见</text>

  <!-- insert -->
  <g filter="url(#sk)">
    <rect x="54" y="452" width="232" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a22">pos[val] = (i, i+L−1)</text>

  <!-- L advance -->
  <path d="M 170 484 L 170 494" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="120" y="498" width="100" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="516" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">L += 1</text>
  <path d="M 348 416 L 348 512 L 226 512" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M 120 512 L 40 512 L 40 272 L 84 272" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="48" y="504" font-size="9.5" fill="#888">延伸下一位</text>

  <!-- footnote: register 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="544" width="330" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="205" y="562" text-anchor="middle" font-size="10.5" fill="#8a6415">i 扫描结束后：若 s 含 '0'，</text>
  <text x="205" y="580" text-anchor="middle" font-size="10.5" fill="#8a6415">登记 pos[0] = (最左 '0' 下标, 同)</text>

  <!-- right: query flow -->
  <g filter="url(#sk)">
    <rect x="415" y="84" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="505" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">取查询 [first, second]</text>
  <path d="M 505 116 L 505 126" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="415" y="132" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="505" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">target = first ⊕ second</text>
  <path d="M 505 164 L 505 174" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="505,180 585,212 505,244 425,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="505" y="217" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">target ∈ pos ?</text>

  <path d="M 505 244 L 505 268" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="513" y="262" font-size="10.5" font-weight="bold" fill="#4a7a3a">命中</text>
  <g filter="url(#sk)">
    <ellipse cx="505" cy="292" rx="92" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="505" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a22">输出 pos[target] = [l, r]</text>

  <path d="M 585 212 L 618 212 L 618 348 L 599 348" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="614" y="204" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b85450">未命中</text>
  <g filter="url(#sk)">
    <ellipse cx="505" cy="348" rx="90" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="505" y="353" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3430">输出 [-1, -1]</text>

  <!-- right notes -->
  <g filter="url(#sk)">
    <rect x="400" y="396" width="232" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="516" y="414" text-anchor="middle" font-size="10" fill="#8a6415">⚠ 内层上界 min(30, n−i) 防越界；</text>
  <text x="516" y="431" text-anchor="middle" font-size="10" fill="#8a6415">30 源于 10⁹ &lt; 2³⁰</text>

  <g filter="url(#sk)">
    <rect x="400" y="452" width="232" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="516" y="470" text-anchor="middle" font-size="10" fill="#8a3430">⚠ first == second ⇒ target = 0，</text>
  <text x="516" y="487" text-anchor="middle" font-size="10" fill="#8a3430">忘登记 '0' ⇒ 误报 [-1, -1]</text>

  <g filter="url(#sk)">
    <rect x="400" y="508" width="232" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="516" y="526" text-anchor="middle" font-size="10" fill="#2e5a22">💡 同值候选长度全等（= bitlen），</text>
  <text x="516" y="543" text-anchor="middle" font-size="10" fill="#2e5a22">首见即「最短 + 最左」；</text>
  <text x="516" y="560" text-anchor="middle" font-size="10" fill="#2e5a22">重复 target 自动去重</text>
</svg>
