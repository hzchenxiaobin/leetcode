<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="620" height="450" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：把「子数组和 × 系数」摊到每个元素上</text>
  <path d="M 160 38 Q 310 46 460 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="55" y="52" width="510" height="44" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="310" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#r)">strength = sum[1]·k − sum[2]·(k−1) + … + sum[k]·1 —— 系数只取决于「第几段」</text>

  <!-- example grouping -->
  <text x="70" y="126" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">nums = [1, 2, 3, −1, 2]，k = 3 的最优分组：</text>
  <g filter="url(#r)">
    <rect x="70" y="134" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="138" y="134" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="206" y="134" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="274" y="134" width="56" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="342" y="134" width="56" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" filter="url(#r)">
    <text x="98" y="161" fill="#2b4a6e">1</text>
    <text x="166" y="161" fill="#2b4a6e">2</text>
    <text x="234" y="161" fill="#2b4a6e">3</text>
    <text x="302" y="161" fill="#2e6e2e">−1</text>
    <text x="370" y="161" fill="#8a6210">2</text>
  </g>

  <!-- brackets -->
  <g fill="none" filter="url(#r)">
    <path d="M 70 182 L 70 190 L 262 190 L 262 182" stroke="#446688" stroke-width="1.8"/>
    <path d="M 274 182 L 274 190 L 330 190 L 330 182" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 342 182 L 342 190 L 398 190 L 398 182" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" filter="url(#r)">
    <text x="166" y="208" fill="#2b4a6e">第①段 sum=6 → ×(+3)</text>
    <text x="302" y="208" fill="#2e6e2e">第②段 sum=−1 → ×(−2)</text>
    <text x="370" y="208" fill="#8a6210">第③段 sum=2 → ×(+1)</text>
  </g>

  <!-- per-element contributions -->
  <text x="234" y="236" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">每个元素的贡献 = 元素值 × 所属段系数：</text>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#r)">
    <text x="98" y="260" fill="#2b4a6e">1×3=3</text>
    <text x="166" y="260" fill="#2b4a6e">2×3=6</text>
    <text x="234" y="260" fill="#2b4a6e">3×3=9</text>
    <text x="302" y="260" fill="#2e6e2e">(−1)×(−2)=2</text>
    <text x="370" y="260" fill="#8a6210">2×1=2</text>
  </g>
  <text x="310" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#r)">strength = 6×3 + (−1)×(−2) + 2×1 = 18 + 2 + 2 = 22</text>

  <!-- key callout -->
  <g filter="url(#r)">
    <rect x="40" y="312" width="540" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="336" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">关键：coef(j) = (−1)^(j+1)·(k−j+1) 只跟段序号 j 有关，跟下标无关</text>
  <text x="62" y="358" font-size="12" fill="#444" filter="url(#r)">⇒ 逐元素扩展子数组时，新增元素只 O(1) 地累加 nums[i] × coef(j)，无需整段求和</text>

  <!-- coefficient table note -->
  <g filter="url(#r)">
    <rect x="40" y="384" width="540" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="62" y="406" font-size="12" fill="#333" filter="url(#r)">k = 3：系数 +3, −2, +1　　k = 5：系数 +5, −4, +3, −2, +1</text>
  <text x="62" y="428" font-size="12" fill="#333" filter="url(#r)">k 为奇数 ⇒ 首段系数 +k、末段系数 +1，首尾皆为正</text>
</svg>
