<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：已接受区间两两不相交，候选只剩「两个邻居」</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按起点升序存放后终点也升序，新区间 [s, e) 只需与分界点两侧各一个区间比较</text>

  <rect x="125" y="76" width="65" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="98" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">A [10,20)</text>

  <rect x="255" y="76" width="98" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="98" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">B [30,45)</text>

  <rect x="450" y="76" width="98" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="499" y="98" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">C [60,75)</text>

  <text x="320" y="70" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">已存入集合的三个预约（互不重叠，按起点升序）</text>

  <path d="M 60 124 L 580 124" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <path d="M 60 120 L 60 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="60" y="142">0</text>
    <path d="M 125 120 L 125 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="125" y="142">10</text>
    <path d="M 190 120 L 190 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="190" y="142">20</text>
    <path d="M 255 120 L 255 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="255" y="142">30</text>
    <path d="M 320 120 L 320 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="320" y="142">40</text>
    <path d="M 385 120 L 385 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="385" y="142">50</text>
    <path d="M 450 120 L 450 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="450" y="142">60</text>
    <path d="M 515 120 L 515 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="515" y="142">70</text>
    <path d="M 580 120 L 580 128" stroke="#aaa" stroke-width="1.2"/>
    <text x="580" y="142">80</text>
  </g>

  <rect x="203" y="152" width="104" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">X [22,38)</text>

  <path d="M 225 152 L 225 120" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 152 L 300 120" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="206" width="250" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="185" y="226" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">左邻 A = [10,20)</text>
  <text x="185" y="244" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">end 20 ≤ s 22 → 安全</text>

  <rect x="330" y="206" width="250" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="226" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">右邻 B = [30,45)</text>
  <text x="455" y="244" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">start 30 &lt; e 38 → 冲突</text>

  <rect x="60" y="272" width="520" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="292" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么只看这两个？</text>
  <text x="76" y="309" font-size="10" fill="#555" filter="url(#rough2)">更靠左的区间终点不超过 A 的终点（仍 ≤ s）；</text>
  <text x="76" y="326" font-size="10" fill="#555" filter="url(#rough2)">更靠右的区间起点不小于 B 的起点（已 ≥ e），都不可能相交。</text>

  <text x="320" y="356" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">于是 lower_bound 定位分界点后，两次比较即可判定 → 单次 book 仅 O(log n)</text>
  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（Python 用 bisect_left 在起点数组上做同样的定位）</text>
</svg>
