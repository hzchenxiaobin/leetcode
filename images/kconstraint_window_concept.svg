<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">k 约束的单调性：坏对扩窗封闭，好对缩窗封闭</text>
  <path d="M 140 44 Q 340 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="62" width="200" height="122" rx="10" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.3"/></g>
  <text x="140" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#sk)">好坏判定（取逆否）</text>
  <g filter="url(#sk)"><rect x="52" y="94" width="176" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">好：zeros ≤ k 或 ones ≤ k</text>
  <g filter="url(#sk)"><rect x="52" y="138" width="176" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="140" y="160" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">坏：zeros &gt; k 且 ones &gt; k</text>

  <g filter="url(#sk)"><rect x="268" y="62" width="372" height="122" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="454" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">单调性 → 封闭性</text>
  <text x="284" y="108" font-size="11.5" fill="#444" filter="url(#sk)">窗口扩大 → zeros 与 ones 单调不减</text>
  <text x="284" y="132" font-size="11.5" fill="#b03a3a" filter="url(#sk)">• 坏子串的任何超集仍坏（对扩窗封闭）</text>
  <text x="284" y="156" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">• 好子串的任何子集仍好（对缩窗封闭）</text>

  <text x="60" y="212" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">以 s = "10101"、k = 1 为例</text>

  <g filter="url(#sk)" fill="#ffffff" stroke="#446688" stroke-width="1.2">
    <rect x="90" y="222" width="40" height="36" rx="4"/>
    <rect x="130" y="222" width="40" height="36" rx="4"/>
    <rect x="170" y="222" width="40" height="36" rx="4"/>
    <rect x="210" y="222" width="40" height="36" rx="4"/>
    <rect x="250" y="222" width="40" height="36" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="110" y="245">1</text>
    <text x="150" y="245">0</text>
    <text x="190" y="245">1</text>
    <text x="230" y="245">0</text>
    <text x="270" y="245">1</text>
  </g>
  <g filter="url(#sk)"><rect x="86" y="220" width="168" height="40" rx="5" fill="none" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="310" y="236" font-size="11.5" fill="#444" filter="url(#sk)">"1010"（窗口 [0,3]）</text>
  <text x="310" y="256" font-size="11.5" fill="#b03a3a" font-weight="bold" filter="url(#sk)">zeros=2&gt;1 且 ones=2&gt;1 → 坏 ✗</text>

  <g filter="url(#sk)"><path d="M 170 268 Q 170 284 170 298" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#ar)"/></g>
  <text x="186" y="286" font-size="11" fill="#7a5415" filter="url(#sk)">left: 0 → 2（缩窗，丢掉 "10"）</text>

  <g filter="url(#sk)" fill="#ffffff" stroke="#446688" stroke-width="1.2">
    <rect x="90" y="304" width="40" height="36" rx="4"/>
    <rect x="130" y="304" width="40" height="36" rx="4"/>
    <rect x="170" y="304" width="40" height="36" rx="4"/>
    <rect x="210" y="304" width="40" height="36" rx="4"/>
    <rect x="250" y="304" width="40" height="36" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="110" y="327">1</text>
    <text x="150" y="327">0</text>
    <text x="190" y="327">1</text>
    <text x="230" y="327">0</text>
    <text x="270" y="327">1</text>
  </g>
  <g filter="url(#sk)"><rect x="166" y="302" width="128" height="40" rx="5" fill="none" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="310" y="318" font-size="11.5" fill="#444" filter="url(#sk)">"101"（窗口 [2,4]，right 固定不动）</text>
  <text x="310" y="338" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">zeros=1≤1，只超 ones 一边 → 好 ✓</text>

  <g filter="url(#sk)"><rect x="40" y="364" width="600" height="92" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="62" y="390" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">按右端点计数：ans += right − left + 1</text>
  <text x="62" y="414" font-size="11" fill="#444" filter="url(#sk)">以 right 结尾的好子串，左端点恰是连续后缀段 [left, right] —— 本例 right=4 时为 {2,3,4}，贡献 3</text>
  <text x="62" y="436" font-size="11" fill="#444" filter="url(#sk)">不重：不同右端点的类互斥；不漏：后缀段两侧恰好切分好与坏</text>
</svg>
