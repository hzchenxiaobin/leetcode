<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：先判左段可行性，再算右段最小终点</text>
  <path d="M 150 37 Q 320 45 490 37" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Lane 1: 示例 1 -->
  <text x="42" y="78" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">示例 1</text>
  <text x="42" y="93" text-anchor="start" font-size="9" fill="#888888">n=4, index=2, value=8</text>
  <g filter="url(#sk)">
    <rect x="128" y="64" width="36" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="184" y="64" width="36" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="240" y="64" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="302" y="64" width="42" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="146" y="85" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="202" y="85" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="261" y="85" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">8</text>
  <text x="323" y="85" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">10</text>
  <path d="M 166 81 L 180 81" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 222 81 L 236 81" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 284 81 L 298 81" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="173" y="113" text-anchor="middle" font-size="9" fill="#888888">gcd=2</text>
  <text x="229" y="113" text-anchor="middle" font-size="9" fill="#888888">gcd=4</text>
  <text x="291" y="113" text-anchor="middle" font-size="9" fill="#888888">gcd=2</text>
  <text x="358" y="77" text-anchor="start" font-size="11" fill="#444444">左段：2 ≤ (8−2)/2 = 3 ✓</text>
  <text x="358" y="93" text-anchor="start" font-size="11" fill="#444444">右段：m=1，偶数 → 8+2 = 10</text>
  <text x="358" y="109" text-anchor="start" font-size="11" fill="#444444">如 [2,4,8,10] 或 [4,6,8,10]</text>
  <g filter="url(#sk)">
    <rect x="512" y="60" width="106" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="77" text-anchor="middle" font-size="10" fill="#b85450">最小答案</text>
  <text x="565" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">10 ✓</text>

  <!-- Lane 2: 示例 3 -->
  <text x="42" y="178" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">示例 3</text>
  <text x="42" y="193" text-anchor="start" font-size="9" fill="#888888">n=2, index=0, value=3</text>
  <g filter="url(#sk)">
    <rect x="128" y="164" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="190" y="164" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="146" y="185" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">3</text>
  <text x="208" y="185" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">6</text>
  <path d="M 166 181 L 186 181" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="213" text-anchor="middle" font-size="9" fill="#888888">gcd=3</text>
  <text x="250" y="177" text-anchor="start" font-size="11" fill="#444444">index=0：左段为空，恒可行</text>
  <text x="250" y="193" text-anchor="start" font-size="11" fill="#444444">右段：m=1，奇数 p=spf(3)=3</text>
  <text x="250" y="209" text-anchor="start" font-size="11" fill="#444444">→ 3+3+2×0 = 6</text>
  <g filter="url(#sk)">
    <rect x="512" y="160" width="106" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="177" text-anchor="middle" font-size="10" fill="#b85450">最小答案</text>
  <text x="565" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">6 ✓</text>

  <!-- Lane 3: 示例 2 -->
  <text x="42" y="278" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450">示例 2</text>
  <text x="42" y="293" text-anchor="start" font-size="9" fill="#888888">n=2, index=1, value=3</text>
  <g filter="url(#sk)">
    <rect x="128" y="264" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="190" y="264" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="146" y="285" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">?</text>
  <text x="208" y="285" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">3</text>
  <path d="M 166 281 L 186 281" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="313" text-anchor="middle" font-size="9" fill="#b85450">gcd=1 ✗</text>
  <text x="250" y="277" text-anchor="start" font-size="11" fill="#444444">左段需 1 ≤ (3−3)/2 = 0 ✗</text>
  <text x="250" y="293" text-anchor="start" font-size="11" fill="#444444">3 是质数：下方无正数与它共享质因子</text>
  <text x="250" y="309" text-anchor="start" font-size="11" fill="#444444">→ 无 GCD 连通数组</text>
  <g filter="url(#sk)">
    <rect x="512" y="260" width="106" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="277" text-anchor="middle" font-size="10" fill="#b85450">无解</text>
  <text x="565" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">−1</text>

  <!-- warning -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⚠ 最隐蔽的 −1：value 为质数且 index ≥ 1 ⇒ (value−p)/2 = 0，左段必不存在</text>
  <text x="320" y="388" text-anchor="middle" font-size="11.5" fill="#b85450">另一处 −1：value = 1（gcd(1,·) = 1，右段无法起步；正数也放不进 1 的下方）</text>
</svg>
