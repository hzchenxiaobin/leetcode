<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#6a5620"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：|SCS| = |str1| + |str2| − |LCS|</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把两个串对齐到公共子序列 LCS 上：LCS 的字符只写一份，其余字符各出现一次</text>

  <text x="140" y="119" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">str1 =</text>
  <text x="140" y="193" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">SCS =</text>
  <text x="140" y="267" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">str2 =</text>

  <!-- str1 行：a b a c 落在 SCS 的第 1..4 列 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="206" y="96" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="230" y="120" text-anchor="middle" fill="#3a5a30">a</text>
    <rect x="262" y="96" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="286" y="120" text-anchor="middle" fill="#3a5a30">b</text>
    <rect x="318" y="96" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="342" y="120" text-anchor="middle" fill="#3a4a66">a</text>
    <rect x="374" y="96" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="398" y="120" text-anchor="middle" fill="#3a4a66">c</text>
  </g>

  <!-- SCS 行：c a b a c -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="150" y="170" width="48" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="174" y="194" text-anchor="middle" fill="#8a6a20">c</text>
    <rect x="206" y="170" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="230" y="194" text-anchor="middle" fill="#3a5a30">a</text>
    <rect x="262" y="170" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="286" y="194" text-anchor="middle" fill="#3a5a30">b</text>
    <rect x="318" y="170" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="342" y="194" text-anchor="middle" fill="#3a4a66">a</text>
    <rect x="374" y="170" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="398" y="194" text-anchor="middle" fill="#3a4a66">c</text>
  </g>

  <!-- str2 行：c a b 落在 SCS 的第 0..2 列 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="150" y="244" width="48" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="174" y="268" text-anchor="middle" fill="#8a6a20">c</text>
    <rect x="206" y="244" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="230" y="268" text-anchor="middle" fill="#3a5a30">a</text>
    <rect x="262" y="244" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="286" y="268" text-anchor="middle" fill="#3a5a30">b</text>
  </g>

  <!-- 对齐连线：str1 与 SCS -->
  <g filter="url(#rough2)" stroke-width="1.3" stroke-dasharray="4 3">
    <path d="M 230 132 L 230 170" stroke="#4a7a3a" fill="none" marker-end="url(#arr)"/>
    <path d="M 286 132 L 286 170" stroke="#4a7a3a" fill="none" marker-end="url(#arr)"/>
    <path d="M 342 132 L 342 170" stroke="#446688" fill="none" marker-end="url(#arr)"/>
    <path d="M 398 132 L 398 170" stroke="#446688" fill="none" marker-end="url(#arr)"/>
    <path d="M 174 206 L 174 244" stroke="#d6a040" fill="none" marker-end="url(#arr)"/>
    <path d="M 230 206 L 230 244" stroke="#4a7a3a" fill="none" marker-end="url(#arr)"/>
    <path d="M 286 206 L 286 244" stroke="#4a7a3a" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="434" y="96" width="152" height="116" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="448" y="116" font-size="11" font-weight="bold" fill="#3a4a66">图例</text>
    <rect x="448" y="126" width="14" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="468" y="136" font-size="10.5" fill="#3a5a30">LCS 共用字符</text>
    <rect x="448" y="150" width="14" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="468" y="160" font-size="10.5" fill="#3a4a66">仅属于 str1</text>
    <rect x="448" y="174" width="14" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="468" y="184" font-size="10.5" fill="#8a6a20">仅属于 str2</text>
    <text x="448" y="202" font-size="10.5" fill="#555">LCS = "ab"，长度 2</text>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="36" y="304" width="528" height="78" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="52" y="326" font-size="11.5" font-weight="bold" fill="#3a4a66">长度公式（为什么最短）</text>
    <text x="52" y="348" font-size="11" fill="#555">|SCS| = 4 + 3 − 2 = 5：LCS 的 2 个字符被两串共用，只写一次；</text>
    <text x="52" y="366" font-size="11" fill="#555">str1 独有的 2 个字符与 str2 独有的 1 个字符各写一次。</text>
  </g>
</svg>
