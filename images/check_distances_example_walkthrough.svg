<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abaccb"，distance = [1,3,0,5,0,…,0]</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="37" y="46" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="55" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>

    <rect x="73" y="46" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="98" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s[i]</text>

    <rect x="123" y="46" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="203" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">first[idx] 状态</text>

    <rect x="283" y="46" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="383" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作 / 判定</text>

    <rect x="483" y="46" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="503" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">结果</text>
  </g>

  <!-- row 1: i=0, a first -->
  <g filter="url(#rough2)">
    <rect x="37" y="84" width="36" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="55" y="110" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="73" y="84" width="50" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <rect x="123" y="84" width="160" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="203" y="104" text-anchor="middle" font-size="11" fill="#446688">first[0]：−1 → 0</text>
    <text x="203" y="120" text-anchor="middle" font-size="10" fill="#888">哨兵被替换</text>
    <rect x="283" y="84" width="200" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="383" y="110" text-anchor="middle" font-size="11" fill="#333">首次出现，记 first[0] = 0</text>
    <rect x="483" y="84" width="40" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="503" y="110" text-anchor="middle" font-size="12" fill="#888">—</text>
  </g>

  <!-- row 2: i=1, b first -->
  <g filter="url(#rough2)">
    <rect x="37" y="132" width="36" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="55" y="158" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="73" y="132" width="50" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
    <rect x="123" y="132" width="160" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="203" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">first[1]：−1 → 1</text>
    <text x="203" y="168" text-anchor="middle" font-size="10" fill="#888">哨兵被替换</text>
    <rect x="283" y="132" width="200" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="383" y="158" text-anchor="middle" font-size="11" fill="#333">首次出现，记 first[1] = 1</text>
    <rect x="483" y="132" width="40" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="503" y="158" text-anchor="middle" font-size="12" fill="#888">—</text>
  </g>

  <!-- row 3: i=2, a second -> verdict -->
  <g filter="url(#rough2)">
    <rect x="37" y="180" width="36" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="55" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <rect x="73" y="180" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="98" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a</text>
    <rect x="123" y="180" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="203" y="200" text-anchor="middle" font-size="11" fill="#b85450">first[0] = 0（非 −1）</text>
    <text x="203" y="216" text-anchor="middle" font-size="10" fill="#b85450">→ 第二次出现</text>
    <rect x="283" y="180" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="383" y="200" text-anchor="middle" font-size="11" fill="#333">gap = 2 − 0 − 1 = 1</text>
    <text x="383" y="216" text-anchor="middle" font-size="11" fill="#333">比对 distance[0] = 1</text>
    <rect x="483" y="180" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="503" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- row 4: i=3, c first -->
  <g filter="url(#rough2)">
    <rect x="37" y="228" width="36" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="55" y="254" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="73" y="228" width="50" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="98" y="254" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
    <rect x="123" y="228" width="160" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="203" y="248" text-anchor="middle" font-size="11" fill="#d6a040">first[2]：−1 → 3</text>
    <text x="203" y="264" text-anchor="middle" font-size="10" fill="#888">哨兵被替换</text>
    <rect x="283" y="228" width="200" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="383" y="254" text-anchor="middle" font-size="11" fill="#333">首次出现，记 first[2] = 3</text>
    <rect x="483" y="228" width="40" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="503" y="254" text-anchor="middle" font-size="12" fill="#888">—</text>
  </g>

  <!-- row 5: i=4, c second -> verdict -->
  <g filter="url(#rough2)">
    <rect x="37" y="276" width="36" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="55" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
    <rect x="73" y="276" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="98" y="302" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">c</text>
    <rect x="123" y="276" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="203" y="296" text-anchor="middle" font-size="11" fill="#b85450">first[2] = 3（非 −1）</text>
    <text x="203" y="312" text-anchor="middle" font-size="10" fill="#b85450">→ 第二次出现</text>
    <rect x="283" y="276" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="383" y="296" text-anchor="middle" font-size="11" fill="#333">gap = 4 − 3 − 1 = 0</text>
    <text x="383" y="312" text-anchor="middle" font-size="11" fill="#333">比对 distance[2] = 0</text>
    <rect x="483" y="276" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="503" y="302" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- row 6: i=5, b second -> verdict -->
  <g filter="url(#rough2)">
    <rect x="37" y="324" width="36" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="55" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
    <rect x="73" y="324" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="98" y="350" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
    <rect x="123" y="324" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="203" y="344" text-anchor="middle" font-size="11" fill="#b85450">first[1] = 1（非 −1）</text>
    <text x="203" y="360" text-anchor="middle" font-size="10" fill="#b85450">→ 第二次出现</text>
    <rect x="283" y="324" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="383" y="344" text-anchor="middle" font-size="11" fill="#333">gap = 5 − 1 − 1 = 3</text>
    <text x="383" y="360" text-anchor="middle" font-size="11" fill="#333">比对 distance[1] = 3</text>
    <rect x="483" y="324" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="503" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- verdict -->
  <rect x="60" y="384" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">遍历结束，a/b/c 三次定判全部通过 → 返回 true</text>

  <!-- counter example -->
  <rect x="60" y="432" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="456" text-anchor="middle" font-size="12" fill="#b85450">反例 s = "aa"：gap = 1 − 0 − 1 = 0 ≠ distance[0] = 1 → false</text>
</svg>
