<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">分层覆盖视角：target = [3, 1, 5, 4, 2]，共 7 次</text>

  <!-- 目标轮廓 -->
  <g filter="url(#rough2)" stroke="#b0b0b0" stroke-width="1">
    <line x1="70" y1="250" x2="330" y2="250"/>
  </g>
  <!-- 层 1 (高度1, 全段) -->
  <rect x="70" y="232" width="260" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 2 (高度2, 只下标0) -->
  <rect x="70" y="214" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 3 (下标0) -->
  <rect x="70" y="196" width="52" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 4 (高度4, 下标2) -->
  <rect x="174" y="178" width="52" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 5 (下标2) -->
  <rect x="174" y="160" width="52" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 6 (下标3, 高度5) -->
  <rect x="226" y="142" width="52" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <!-- 层 7 (下标2, 高度5) -->
  <rect x="174" y="124" width="52" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <!-- 数字标签 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="96" y="270">3</text><text x="148" y="270">1</text><text x="200" y="270">5</text>
    <text x="252" y="270">4</text><text x="304" y="270">2</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="96" y="288">×3 层</text><text x="148" y="288">×1 层</text><text x="200" y="288">×5 层</text>
    <text x="252" y="288">×4 层</text><text x="304" y="288">×2 层</text>
  </g>

  <!-- 操作清单 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="360" y="56" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="450" y="76">第1次：[0,4] 全体 +1</text>
    <rect x="360" y="90" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="450" y="110">第2次：[0,0] +1 → 2</text>
    <rect x="360" y="124" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="450" y="144">第3次：[0,0] +1 → 3</text>
    <rect x="360" y="158" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="450" y="178">第4次：[2,4] +1</text>
    <rect x="360" y="192" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="450" y="212">第5次：[2,3] +1</text>
    <rect x="360" y="226" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="450" y="246">第6次：[2,3] +1 → 4</text>
    <rect x="360" y="260" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="450" y="280">第7次：[2,2] +1 → 5</text>
  </g>
  <path d="M 340 200 C 352 200, 350 160, 358 132" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="308" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="328" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">每次操作 = 一个「新层」，层数恰为 3 + 2 + 5 + 4 + 2 的正台阶总数</text>
  <text x="290" y="360" font-size="12" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">检查：ans = 3 + max(0,−2) + max(0,4) + max(0,−1) + max(0,−2) = 3+0+4+0+0 = 7</text>
</svg>
