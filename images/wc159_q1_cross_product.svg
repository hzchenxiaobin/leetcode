<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">叉积判共线：三点围出的三角形面积为 0</text>
  <text x="330" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前两点 P0、P1 定下方向，第三点只要不“拐弯”就还在同一条线上</text>

  <rect x="24" y="62" width="300" height="208" fill="#f4f8fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="174" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">情形 A：共线 → cross = 0</text>

  <path d="M 52 232 L 302 150" stroke="#446688" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <circle cx="60" cy="230" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="168" cy="194" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="264" cy="162" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="44" y="251" font-size="11" fill="#3a4a66" filter="url(#rough2)">P0</text>
  <text x="150" y="186" font-size="11" fill="#3a4a66" filter="url(#rough2)">P1</text>
  <text x="268" y="152" font-size="11" fill="#8a3a36" filter="url(#rough2)">P2</text>
  <text x="174" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三角形被压成一条线段 ⇒ 面积 0，叉积 0</text>

  <rect x="336" y="62" width="300" height="208" fill="#fffdf4" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="486" y="86" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">情形 B：偏离 → cross ≠ 0</text>

  <polygon points="370,230 500,182 470,130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 370 230 L 620 138" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <circle cx="370" cy="230" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="500" cy="182" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="470" cy="130" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="354" y="251" font-size="11" fill="#3a4a66" filter="url(#rough2)">P0</text>
  <text x="508" y="200" font-size="11" fill="#3a4a66" filter="url(#rough2)">P1</text>
  <text x="470" y="118" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">P2</text>
  <text x="486" y="262" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">凸出来的三角形面积 = |cross| / 2 ≠ 0</text>

  <rect x="50" y="286" width="560" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="330" y="313" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">cross(P0, P1, P2) = (x2 − x0)·(y1 − y0) − (y2 − y0)·(x1 − x0)</text>
  <text x="330" y="338" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">cross = 0  ⇔  P0、P1、P2 三点共线</text>
  <text x="330" y="362" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">全式只有乘法与减法：不出现除法，竖直线、水平线都不必特判</text>
</svg>
