<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="36" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">首个非倍数位置 = 前缀 gcd 的第一次下降</text>
  <text x="330" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">a_l 整除的这段里 gcd 一直是 a_l；第一次不整除时 gcd 才掉下去</text>

  <!-- 四个元素方框 -->
  <rect x="50" y="120" width="110" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="150" text-anchor="middle" font-size="15" fill="#22335a" filter="url(#rough2)">18</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a₁ = 18</text>

  <rect x="190" y="120" width="110" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="150" text-anchor="middle" font-size="15" fill="#2f5424" filter="url(#rough2)">36</text>
  <text x="245" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a₂ = 36</text>

  <rect x="330" y="120" width="110" height="48" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="2.4" filter="url(#rough2)"/>
  <text x="385" y="150" text-anchor="middle" font-size="15" fill="#7a2a26" filter="url(#rough2)">26</text>
  <text x="385" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a₃ = 26</text>

  <rect x="470" y="120" width="110" height="48" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="150" text-anchor="middle" font-size="15" fill="#8a6d1f" filter="url(#rough2)">12</text>
  <text x="525" y="190" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">a₄ = 12</text>

  <!-- 箭头 + 判定 -->
  <path d="M160,144 L190,144" stroke="#666" stroke-width="1.5" marker-end="url(#arr2)"
        fill="none" filter="url(#rough2)"/>
  <text x="175" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整除 ✓</text>

  <path d="M300,144 L330,144" stroke="#b85450" stroke-width="2" marker-end="url(#arr2)"
        fill="none" filter="url(#rough2)"/>
  <text x="315" y="108" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不整除 ✗</text>

  <path d="M440,144 L470,144" stroke="#666" stroke-width="1.5" marker-end="url(#arr2)"
        fill="none" filter="url(#rough2)"/>

  <!-- 前缀 gcd 气泡 -->
  <text x="105" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">gcd = 18</text>
  <text x="245" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">gcd = 18</text>
  <text x="385" y="234" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">gcd 掉到 2</text>
  <text x="525" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">gcd = 2</text>

  <path d="M105,246 L330,246" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4"
        fill="none" filter="url(#rough2)"/>
  <text x="218" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">这一段 gcd 恒为 a_l = 18（j* = 3 之前都安全）</text>

  <!-- 结论框 -->
  <rect x="90" y="290" width="480" height="42" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="317" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">r = 26 mod 18 = 8，d = min(8, 18 − 8) = 8</text>

  <text x="330" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最优配置 [18, 18, 26]：把 b₂ 从 36 调成 18，极差 = 8</text>
  <text x="330" y="384" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">j* 之后的元素再多，也都能挤进这段区间，答案不再变</text>
</svg>
