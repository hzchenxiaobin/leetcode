<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">双车道模型：直行＝续杯，换道＝跨过一格休整（0）</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="10.5" fill="#888888" text-anchor="middle">
    <text x="139" y="88">小时 0</text>
    <text x="203" y="88">小时 1</text>
    <text x="267" y="88">小时 2</text>
    <text x="331" y="88">小时 3</text>
    <text x="395" y="88">小时 4</text>
  </g>

  <text x="52" y="130" font-size="13" font-weight="bold" fill="#33506b" filter="url(#sk)">饮料 A</text>
  <g filter="url(#sk)" stroke-width="1.2">
    <rect x="110" y="104" width="58" height="44" rx="4" fill="#d2e2f8" stroke="#446688" stroke-width="2.6"/>
    <rect x="174" y="104" width="58" height="44" rx="4" fill="#eef4fb" stroke="#9db4cc"/>
    <rect x="238" y="104" width="58" height="44" rx="4" fill="#eef4fb" stroke="#9db4cc"/>
    <rect x="302" y="104" width="58" height="44" rx="4" fill="#eef4fb" stroke="#9db4cc"/>
    <rect x="366" y="104" width="58" height="44" rx="4" fill="#eef4fb" stroke="#9db4cc"/>
  </g>
  <g filter="url(#sk)" font-size="15" text-anchor="middle">
    <text x="139" y="131" font-weight="bold" fill="#333">4</text>
    <text x="203" y="131" fill="#8a8a8a">1</text>
    <text x="267" y="131" fill="#8a8a8a">1</text>
    <text x="331" y="131" fill="#8a8a8a">1</text>
    <text x="395" y="131" fill="#8a8a8a">1</text>
  </g>

  <text x="52" y="290" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">饮料 B</text>
  <g filter="url(#sk)" stroke-width="1.2">
    <rect x="110" y="264" width="58" height="44" rx="4" fill="#edf7ef" stroke="#93b796"/>
    <rect x="174" y="264" width="58" height="44" rx="4" fill="#edf7ef" stroke="#93b796"/>
    <rect x="238" y="264" width="58" height="44" rx="4" fill="#d2eed8" stroke="#4a8e4a" stroke-width="2.6"/>
    <rect x="302" y="264" width="58" height="44" rx="4" fill="#d2eed8" stroke="#4a8e4a" stroke-width="2.6"/>
    <rect x="366" y="264" width="58" height="44" rx="4" fill="#d2eed8" stroke="#4a8e4a" stroke-width="2.6"/>
  </g>
  <g filter="url(#sk)" font-size="15" text-anchor="middle">
    <text x="139" y="291" fill="#8a8a8a">1</text>
    <text x="203" y="291" fill="#8a8a8a">1</text>
    <text x="267" y="291" font-weight="bold" fill="#333">3</text>
    <text x="331" y="291" font-weight="bold" fill="#333">3</text>
    <text x="395" y="291" font-weight="bold" fill="#333">3</text>
  </g>

  <g filter="url(#sk)"><path d="M 139 98 L 395 98" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/></g>
  <text x="402" y="102" font-size="10.5" fill="#888888" filter="url(#sk)">全程 A ＝ 8</text>
  <g filter="url(#sk)"><path d="M 139 316 L 395 316" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/></g>
  <text x="402" y="320" font-size="10.5" fill="#888888" filter="url(#sk)">全程 B ＝ 11</text>

  <g filter="url(#sk)"><path d="M 139 126 Q 194 220 267 286 L 395 286" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="172" y="206" width="44" height="28" rx="4" fill="#fff8e1" fill-opacity="0.95" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3"/></g>
  <text x="194" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8860b" filter="url(#sk)">0</text>
  <text x="58" y="248" font-size="10.5" fill="#b8860b" filter="url(#sk)">切换＝休整一小时</text>

  <g filter="url(#sk)"><rect x="40" y="352" width="600" height="108" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="62" y="380" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">合法方案 ＝ 若干段连续同饮 ＋ 段间恰好一格休整（收益 0）</text>
  <text x="62" y="404" font-size="11.5" fill="#444" filter="url(#sk)">最优：A₀(4) → 休整(0) → B₂B₃B₄(3+3+3) ＝ 13 ＞ 全程 B(11) ＞ 全程 A(8)</text>
  <text x="62" y="428" font-size="11" fill="#444" filter="url(#sk)">休整只出现在换道夹缝里——多休一小时不如续杯（每小时收益 ≥ 1）</text>
</svg>
