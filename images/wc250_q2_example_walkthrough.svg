<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="540" fill="#fdfcf7"/>
  <text x="310" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：rungs = [1,3,5,10]，dist = 2</text>
  <path d="M 150 38 Q 310 48 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="30" y="66" font-size="12" fill="#2b2b2b" font-weight="bold">补完后每个相邻落脚点距离 ≤ 2（新增台阶：高度 7、8，红色虚线）：</text>

  <line x1="50" y1="136" x2="580" y2="136" stroke="#b0b0a8" stroke-width="1.2" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="48" y="122" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="100" y="122" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="200" y="122" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="300" y="122" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="400" y="122" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3"/>
    <rect x="450" y="122" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3"/>
    <rect x="548" y="122" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="63" y="142" text-anchor="middle" font-size="11" fill="#2f5d2f" font-weight="bold">0</text>
  <text x="113" y="142" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">1</text>
  <text x="213" y="142" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">3</text>
  <text x="313" y="142" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">5</text>
  <text x="413" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="463" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <text x="561" y="142" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">10</text>
  <text x="63" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a">地板</text>
  <text x="438" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">← 新增 2 根 →</text>

  <g filter="url(#sk)" fill="none" stroke="#7a9a6a" stroke-width="1.3">
    <path d="M 63 116 Q 88 106 113 116"/>
    <path d="M 113 116 Q 163 104 213 116"/>
    <path d="M 213 116 Q 263 104 313 116"/>
    <path d="M 313 116 Q 363 104 413 116"/>
    <path d="M 413 116 Q 438 108 463 116"/>
    <path d="M 463 116 Q 511 104 561 116"/>
  </g>
  <text x="88" y="102" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="163" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="263" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="363" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="511" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="580" y="172" text-anchor="end" font-size="10" fill="#888">每步 ≤ dist = 2，全部直达 ✓</text>

  <text x="30" y="206" font-size="12" fill="#2b2b2b" font-weight="bold">对原始 rungs 单趟扫描（间隔逐个套公式）：</text>

  <g filter="url(#sk)">
    <rect x="60" y="216" width="520" height="146" rx="4" fill="#ffffff" stroke="#b0b0a8" stroke-width="1.2"/>
    <path d="M 60 246 H 580" stroke="#b0b0a8" stroke-width="1"/>
    <path d="M 60 274 H 580" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 60 302 H 580" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 60 330 H 580" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 160 216 V 362" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 260 216 V 362" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 360 216 V 362" stroke="#e0dfd8" stroke-width="1"/>
    <path d="M 500 216 V 362" stroke="#e0dfd8" stroke-width="1"/>
    <rect x="60" y="330" width="520" height="32" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#555" text-anchor="middle">
    <text x="110" y="235">prev</text>
    <text x="210" y="235">r</text>
    <text x="310" y="235">gap</text>
    <text x="430" y="235">(gap−1)//2</text>
    <text x="540" y="235">ans</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#444">
    <text x="110" y="263">0</text><text x="210" y="263">1</text><text x="310" y="263">1</text><text x="430" y="263">0</text><text x="540" y="263">0</text>
    <text x="110" y="291">1</text><text x="210" y="291">3</text><text x="310" y="291">2</text><text x="430" y="291">0</text><text x="540" y="291">0</text>
    <text x="110" y="319">3</text><text x="210" y="319">5</text><text x="310" y="319">2</text><text x="430" y="319">0</text><text x="540" y="319">0</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#8f6b1f" font-weight="bold">
    <text x="110" y="350">5</text><text x="210" y="350">10</text><text x="310" y="350">5</text><text x="430" y="350">2</text><text x="540" y="350">2 ✓</text>
  </g>

  <text x="30" y="392" font-size="12" fill="#2b2b2b" font-weight="bold">对照示例 3：rungs = [3,4,6,7]，dist = 2 —— 第一段从地板 0 起算：</text>

  <line x1="50" y1="446" x2="580" y2="446" stroke="#b0b0a8" stroke-width="1.2" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="58" y="432" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="188" y="432" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3"/>
    <rect x="308" y="432" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="408" y="432" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="488" y="432" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="548" y="432" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="73" y="452" text-anchor="middle" font-size="11" fill="#2f5d2f" font-weight="bold">0</text>
  <text x="201" y="452" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="321" y="452" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">3</text>
  <text x="421" y="452" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">4</text>
  <text x="501" y="452" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">6</text>
  <text x="561" y="452" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">7</text>

  <path d="M 78 422 Q 140 408 200 422" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="140" y="410" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">gap=3 &gt; 2</text>
  <text x="140" y="398" text-anchor="middle" font-size="9.5" fill="#b85450">补 (3−1)//2 = 1 根</text>
  <text x="440" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a">其余各段 gap ≤ 2，自动补 0 ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="482" width="540" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="310" y="500" text-anchor="middle" font-size="11.5" fill="#8f6b1f" font-weight="bold">易错点：若把第一段误当成 rungs[0] − rungs[0] = 0（即 prev 初始取 rungs[0]），</text>
  <text x="310" y="518" text-anchor="middle" font-size="11.5" fill="#8f6b1f">这组数据会漏掉 1 根 —— prev 必须从地板高度 0 起跳。</text>
</svg>
