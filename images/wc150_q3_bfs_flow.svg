<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">多源 BFS 主流程</text>
  <ellipse cx="320" cy="54" rx="44" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12.5" fill="#2f5e22" filter="url(#rough2)">开始</text>
  <path d="M 320 70 L 320 86" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="88" width="420" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="126" y="109" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">cnt = 陆地格数；所有陆地入队且 dist = 0</text>
  <text x="126" y="127" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">海洋格 dist = −1（同时充当「未访问」标记）</text>
  <path d="M 320 140 L 320 156" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="320,158 470,190 320,222 170,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="186" text-anchor="middle" font-size="11.5" fill="#7a5c18" filter="url(#rough2)">cnt == 0 或 cnt == n×n ?</text>
  <text x="320" y="204" text-anchor="middle" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">（全海洋 / 全陆地）</text>
  <path d="M 470 190 L 488 190" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="479" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="490" y="170" width="136" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="558" y="195" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">返回 −1</text>
  <path d="M 320 222 L 320 262" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="246" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <polygon points="200,264 300,290 200,316 100,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="295" text-anchor="middle" font-size="11.5" fill="#7a5c18" filter="url(#rough2)">队列非空 ?</text>
  <path d="M 300 290 L 340 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="281" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="344" y="248" width="278" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="358" y="270" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">弹出队首 (x, y)，枚举 4 个邻居</text>
  <text x="358" y="291" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">界内且 dist == −1 ⇒ 入队</text>
  <text x="358" y="312" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">dist = dist[x][y] + 1；ans = max(ans, dist)</text>
  <text x="358" y="331" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">每格只入队一次 → 天然去重</text>
  <path d="M 483 338 L 483 366 L 200 366 L 200 320" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="356" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">继续下一格</text>
  <path d="M 100 290 L 70 290 L 70 378" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="282" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="50" y="380" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="407" text-anchor="middle" font-size="12" fill="#2f5e22" filter="url(#rough2)">返回 ans（最大层号）</text>
</svg>
