<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：nums = [1,2,3,4,3,2,5]，k = 3</text>

  <g filter="url(#rough2)" font-size="11.5" fill="#555">
    <text x="42" y="66" font-weight="bold" fill="#444">i</text>
    <text x="88" y="66" font-weight="bold" fill="#444">nums[i]</text>
    <text x="186" y="66" font-weight="bold" fill="#444">接续 nums[i-1]+1 ?</text>
    <text x="356" y="66" font-weight="bold" fill="#444">run[i]</text>
    <text x="446" y="66" font-weight="bold" fill="#444">输出</text>
  </g>
  <path d="M 36 76 L 528 76" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5">
    <text x="42" y="104" fill="#555">0</text>
    <text x="88" y="104" fill="#3a4a66">1</text>
    <text x="186" y="104" fill="#999">—（起点）</text>
    <text x="356" y="104" fill="#8a6a20">1</text>
    <text x="446" y="104" fill="#999">—</text>

    <text x="42" y="140" fill="#555">1</text>
    <text x="88" y="140" fill="#3a4a66">2</text>
    <text x="186" y="140" fill="#4a7a3a">是（2 = 1 + 1）</text>
    <text x="356" y="140" fill="#8a6a20">2</text>
    <text x="446" y="140" fill="#999">—</text>

    <text x="42" y="176" fill="#555">2</text>
    <text x="88" y="176" fill="#3a4a66">3</text>
    <text x="186" y="176" fill="#4a7a3a">是（3 = 2 + 1）</text>
    <text x="356" y="176" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="446" y="176" fill="#4a7a3a" font-weight="bold">3</text>

    <text x="42" y="212" fill="#555">3</text>
    <text x="88" y="212" fill="#3a4a66">4</text>
    <text x="186" y="212" fill="#4a7a3a">是（4 = 3 + 1）</text>
    <text x="356" y="212" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="446" y="212" fill="#4a7a3a" font-weight="bold">4</text>

    <text x="42" y="248" fill="#555">4</text>
    <text x="88" y="248" fill="#8a3a36">3</text>
    <text x="186" y="248" fill="#b85450">否（3 ≠ 5）</text>
    <text x="356" y="248" fill="#b85450" font-weight="bold">1</text>
    <text x="446" y="248" fill="#b85450" font-weight="bold">-1</text>

    <text x="42" y="284" fill="#555">5</text>
    <text x="88" y="284" fill="#8a3a36">2</text>
    <text x="186" y="284" fill="#b85450">否（2 ≠ 4）</text>
    <text x="356" y="284" fill="#b85450">1</text>
    <text x="446" y="284" fill="#b85450" font-weight="bold">-1</text>

    <text x="42" y="320" fill="#555">6</text>
    <text x="88" y="320" fill="#8a3a36">5</text>
    <text x="186" y="320" fill="#b85450">否（5 ≠ 3）</text>
    <text x="356" y="320" fill="#b85450">1</text>
    <text x="446" y="320" fill="#b85450" font-weight="bold">-1</text>
  </g>

  <rect x="36" y="340" width="492" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="360" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">输出 [3, 4, -1, -1, -1]：i = 2 起每步输出一个</text>
  <text x="50" y="378" font-size="10.5" fill="#555" filter="url(#rough2)">run 达到 3 说明整段窗口都在同一递增段内，能量值取末元素 nums[i]</text>
</svg>
