<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：s = "000001"，numOps = 1</text>

  <!-- 段分解条 -->
  <text x="70" y="61" font-size="14" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="105" y="40" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="139" y="40" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="173" y="40" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="207" y="40" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="241" y="40" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="275" y="40" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="156" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="224" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="258" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="292" y="60" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <path d="M105,74 L105,80 L273,80 L273,74" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M275,74 L275,80 L309,80 L309,74" fill="none" stroke="#7a6020" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="189" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">L = 5</text>
  <text x="292" y="96" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">L = 1</text>
  <text x="340" y="58" font-size="11.5" fill="#666" filter="url(#rough2)">段长 [5, 1]，maxL = 5</text>
  <text x="340" y="76" font-size="11.5" fill="#666" filter="url(#rough2)">二分区间 [1, 5]</text>

  <!-- 二分表 -->
  <rect x="40" y="112" width="500" height="132" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="40" y="112" width="500" height="30" rx="6" fill="#fff8e1" filter="url(#rough2)"/>
  <path d="M40,142 L540,142" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M74,112 L74,244 M150,112 L150,244 M200,112 L200,244 M390,112 L390,244" stroke="#aabbcc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M40,176 L540,176 M40,210 L540,210" stroke="#ccddee" stroke-width="1" filter="url(#rough2)"/>

  <text x="57" y="132" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">轮</text>
  <text x="112" y="132" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">lo, hi</text>
  <text x="175" y="132" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">mid</text>
  <text x="295" y="132" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">判定过程</text>
  <text x="465" y="132" text-anchor="middle" font-size="11.5" fill="#7a6020" filter="url(#rough2)">结果</text>

  <text x="57" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 5</text>
  <text x="175" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="295" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⌊5/4⌋ + ⌊1/4⌋ = 1 ≤ 1</text>
  <text x="465" y="164" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 可行 → hi = 3</text>

  <text x="57" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 3</text>
  <text x="175" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="198" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⌊5/3⌋ + ⌊1/3⌋ = 1 ≤ 1</text>
  <text x="465" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 可行 → hi = 2</text>

  <text x="57" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="112" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1, 2</text>
  <text x="175" y="232" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="295" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">d = 2，min(2, 4) = 2 &gt; 1</text>
  <text x="465" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 不可行 → lo = 2</text>

  <!-- 结论 -->
  <rect x="40" y="260" width="500" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">答案 = 2：翻 s[2] 得 "001001"，最长段 2</text>
  <text x="290" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">m = 1 需整串交替：min(d, n−d) = 2 &gt; numOps，止步于此</text>

  <!-- 示例 2 -->
  <rect x="40" y="318" width="500" height="58" rx="8" fill="#ffffff" stroke="#aabbcc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">示例 2："0000"，numOps = 2 → 段长 [4]</text>
  <text x="290" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m = 1：d = 2，min(2, 2) = 2 ≤ 2 ✓</text>
  <text x="290" y="378" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">→ 答案 1（翻 s[0]、s[2] 得 "1010"）</text>
</svg>
