<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>

  <text x="345" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：nums = [2, 3, 4, 2]（奇偶依次为 偶, 奇, 偶, 偶）</text>

  <rect x="28" y="54" width="634" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="66" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">元素</text>
  <text x="238" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">新增稳定子序列（以该元素结尾）</text>
  <text x="414" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">s = [s0, s1]</text>
  <text x="528" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f00  f01  f10  f11</text>
  <text x="631" y="73" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">总数</text>

  <rect x="28" y="82" width="634" height="52" fill="#ffffff" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2 (偶)</text>
  <text x="238" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="414" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 0]</text>
  <text x="528" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0   0   0   0</text>
  <text x="631" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="28" y="134" width="634" height="52" fill="#f6f8fc" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3 (奇)</text>
  <text x="238" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{3}   {2,3}</text>
  <text x="414" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1, 1]</text>
  <text x="528" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0   1   0   0</text>
  <text x="631" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="28" y="186" width="634" height="52" fill="#ffffff" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4 (偶)</text>
  <text x="238" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{4}   {2,4}   {3,4}   {2,3,4}</text>
  <text x="414" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 1]</text>
  <text x="528" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1   1   2   0</text>
  <text x="631" y="216" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>

  <rect x="28" y="238" width="634" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="270" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2' (偶)</text>
  <text x="238" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2'}   {2,2'}   {4,2'}   {3,2'}</text>
  <text x="238" y="286" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3,2'}   {3,4,2'}   {2,3,4,2'}</text>
  <text x="414" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 1]</text>
  <text x="528" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5   1   4   0</text>
  <text x="631" y="270" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">14</text>

  <path d="M104 54 L104 306" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M372 54 L372 306" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M456 54 L456 306" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M600 54 L600 306" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="326" width="600" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="340" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">被排除的不稳定子序列：[2, 4, 2'] —— f[0][0] 中的 [2,4] 以 (偶,偶) 结尾，再接 2' 就凑齐三个连续偶数</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">所以最后一步 f[0][0] 只增加 4（而不是 5），[2,4,2'] 从未被计数</text>

  <rect x="140" y="400" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340" y="427" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最终答案 = s(3+1) + f(5+1+4+0) = 4 + 10 = 14</text>
</svg>
