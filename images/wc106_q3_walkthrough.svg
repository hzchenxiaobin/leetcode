<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="352" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：target = 8，频次 (1..5) 各 2 个</text>
  <text x="60" y="66" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">满足 a ≤ b ≤ c、a+b+c = 8、频次均 &gt; 0 的值三元组</text>
  <rect x="50" y="80" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="97.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(a,b,c)</text>
  <rect x="170" y="80" width="150" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="97.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">各值频次</text>
  <rect x="320" y="80" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="97.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">组合数</text>
  <rect x="510" y="80" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="97.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计</text>
  <rect x="50" y="110" width="120" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="128.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2,5)</text>
  <rect x="170" y="110" width="150" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="128.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 2, 2</text>
  <rect x="320" y="110" width="190" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="128.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×2×2 = 8</text>
  <rect x="510" y="110" width="100" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="128.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="50" y="140" width="120" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="158.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,3,4)</text>
  <rect x="170" y="140" width="150" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="158.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 2, 2</text>
  <rect x="320" y="140" width="190" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="158.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×2×2 = 8</text>
  <rect x="510" y="140" width="100" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="158.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>
  <rect x="50" y="170" width="120" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="188.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2,4)</text>
  <rect x="170" y="170" width="150" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="188.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 2, 2</text>
  <rect x="320" y="170" width="190" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="188.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C(2,2)×2 = 2</text>
  <rect x="510" y="170" width="100" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="188.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18</text>
  <rect x="50" y="200" width="120" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110.0" y="218.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,3,3)</text>
  <rect x="170" y="200" width="150" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="218.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 2, 2</text>
  <rect x="320" y="200" width="190" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415.0" y="218.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×C(2,2) = 2</text>
  <rect x="510" y="200" width="100" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="218.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <text x="330" y="300" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 8 + 8 + 2 + 2 = 20，与官方输出一致</text>
  <text x="330" y="332" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意 (2,2,4) 用 C(2,2)×cnt[4]、而 (2,3,3) 用 cnt[2]×C(2,2)：重复的是什么值，就取哪个值的组合数</text>
</svg>
