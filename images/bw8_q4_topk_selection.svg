<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心选取：类大小降序，取前 maxOnes 个求和</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">3×3、s=2 的四个类大小排序后为 [4, 2, 2, 1]</text>

  <g filter="url(#rough2)" font-size="10" fill="#666" font-weight="bold">
    <text x="56" y="66">排序后：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="70" width="90" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="214" y="110" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="308" y="110" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="402" y="126" width="90" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="165" y="92" fill="#3a4a66">4</text>
    <text x="259" y="131" fill="#3a5a30">2</text>
    <text x="353" y="131" fill="#8a6a20">2</text>
    <text x="447" y="138" fill="#8a3a36">1</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="165" y="152">类(0,0)</text>
    <text x="259" y="152">类(0,1)</text>
    <text x="353" y="152">类(1,0)</text>
    <text x="447" y="152">类(1,1)</text>
  </g>

  <rect x="42" y="170" width="230" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="157" y="192" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">maxOnes = 1：取 4</text>
  <g filter="url(#rough2)">
    <rect x="72" y="204" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="100" y="204" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="128" y="204" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="72" y="230" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="230" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="128" y="230" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="72" y="256" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="100" y="256" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="128" y="256" width="26" height="24" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="85" y="220">1</text><text x="141" y="220">1</text><text x="85" y="272">1</text><text x="141" y="272">1</text>
  </g>
  <text x="232" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,0,1]</text>
  <text x="232" y="240" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[0,0,0]</text>
  <text x="232" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,0,1]</text>

  <rect x="288" y="170" width="230" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="403" y="192" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">maxOnes = 2：取 4+2 = 6</text>
  <g filter="url(#rough2)">
    <rect x="318" y="204" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="346" y="204" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="374" y="204" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="318" y="230" width="26" height="24" fill="#4a7a3a" rx="4"/>
    <rect x="346" y="230" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="374" y="230" width="26" height="24" fill="#4a7a3a" rx="4"/>
    <rect x="318" y="256" width="26" height="24" fill="#446688" rx="4"/>
    <rect x="346" y="256" width="26" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="374" y="256" width="26" height="24" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="331" y="220">1</text><text x="387" y="220">1</text>
    <text x="331" y="246">1</text><text x="387" y="246">1</text>
    <text x="331" y="272">1</text><text x="387" y="272">1</text>
  </g>
  <text x="478" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,0,1]</text>
  <text x="478" y="240" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,0,1]</text>
  <text x="478" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,0,1]</text>

  <rect x="42" y="294" width="476" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">⚠ 上界并非显然：合法解可以触碰多于 maxOnes 个类</text>
  <g filter="url(#rough2)">
    <rect x="72" y="326" width="24" height="20" fill="#446688" rx="3"/>
    <rect x="98" y="326" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="124" y="326" width="24" height="20" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="72" y="348" width="24" height="20" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="98" y="348" width="24" height="20" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="124" y="348" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="72" y="370" width="24" height="20" fill="#446688" rx="3"/>
    <rect x="98" y="370" width="24" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="124" y="370" width="24" height="20" fill="#fff" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#444">
    <text x="166" y="336">此解 5 个 1（maxOnes=2 时合法，</text>
    <text x="166" y="354">每个 2×2 窗口恰 2 个），但触碰了</text>
    <text x="166" y="372">3 个类 &gt; maxOnes —— 需密度论证封上界</text>
  </g>
</svg>
