<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="620" height="370" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">块衔接的 9 种组合：只有 4 种非法（红虚线）</text>

  <!-- 起点节点 -->
  <g filter="url(#rough2)">
    <rect x="265" y="48" width="90" height="34" rx="10" fill="#fafafa" stroke="#888" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="310" y="70" text-anchor="middle" font-size="13" fill="#555">串的起点</text>
  </g>

  <!-- 三个块节点 -->
  <g filter="url(#rough2)">
    <rect x="60" y="160" width="110" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="115" y="188" text-anchor="middle" font-size="16" fill="#333">AA</text>
    <rect x="255" y="160" width="110" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="310" y="188" text-anchor="middle" font-size="16" fill="#333">BB</text>
    <rect x="450" y="160" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="505" y="188" text-anchor="middle" font-size="16" fill="#333">AB</text>
  </g>

  <!-- 起点 → 三块 -->
  <path d="M 285 82 C 230 106, 160 128, 122 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 82 C 310 106, 310 126, 310 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 335 82 C 390 106, 460 128, 498 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合法：AA→BB（上弧线） -->
  <path d="M 158 172 C 190 150, 225 150, 253 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="146" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">✓ AABB</text>
  <!-- 合法：BB→AA（下弧线） -->
  <path d="M 253 194 C 220 218, 190 218, 162 194" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="205" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ BBAA</text>

  <!-- 合法：BB→AB（上弧线） -->
  <path d="M 363 172 C 395 150, 430 150, 458 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="410" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ BBAB</text>
  <!-- 非法：AB→BB（下弧线，红） -->
  <path d="M 458 194 C 425 218, 395 218, 367 194" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ ABBB</text>

  <!-- 非法：AA→AB（下方大弧线，红，绕到节点下方） -->
  <path d="M 115 208 C 120 268, 490 268, 500 210" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ AA|AB → "AAAB" 含 AAA</text>

  <!-- 非法自环：AA→AA -->
  <path d="M 100 158 C 82 130, 130 120, 112 158" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ AAA</text>

  <!-- 非法自环：BB→BB -->
  <path d="M 295 158 C 277 130, 325 120, 307 158" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ BBB</text>

  <!-- 合法自环：AB→AB -->
  <path d="M 540 206 C 560 236, 600 226, 578 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="572" y="248" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">✓ 任意长</text>

  <!-- 结论区 -->
  <g filter="url(#rough2)">
    <rect x="50" y="284" width="520" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="310" y="308" text-anchor="middle" font-size="13" fill="#333">读表三条结论：</text>
    <text x="310" y="328" text-anchor="middle" font-size="12.5" fill="#333">① AA 的后继只能是 BB → AA/BB 严格交错，|a−b| ≤ 1</text>
    <text x="310" y="348" text-anchor="middle" font-size="12.5" fill="#333">② AB 链可任意长，只能放串首或 BB 之后；链后只能接 AA</text>
  </g>
</svg>
