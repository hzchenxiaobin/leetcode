<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="330" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单格删除判据：只差一个逆矩阵元素</text>
  <text x="290" y="45" text-anchor="middle" font-size="11" fill="#888">删掉 A 的一个 1，秩还等于 n 吗？答案藏在 A⁻¹ 的转置位置上</text>

  <!-- left: A grid -->
  <text x="96" y="74" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">当前矩阵 A（秩 n）</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="56" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="90" y="86" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="124" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="56" y="116" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="90" y="116" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="124" y="116" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="56" y="146" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="90" y="146" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="124" y="146" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="73" y="106" fill="#3a4a66">1</text>
    <text x="107" y="106" fill="#8a5a10">1</text>
    <text x="141" y="106" fill="#3a4a66">0</text>
    <text x="73" y="136" fill="#3a4a66">0</text>
    <text x="107" y="136" fill="#3a4a66">1</text>
    <text x="141" y="136" fill="#3a4a66">1</text>
    <text x="73" y="166" fill="#3a4a66">0</text>
    <text x="107" y="166" fill="#3a4a66">0</text>
    <text x="141" y="166" fill="#3a4a66">1</text>
  </g>
  <text x="107" y="194" text-anchor="middle" font-size="10" fill="#8a6a20">删掉这个 1</text>

  <!-- arrow -->
  <path d="M 176 132 L 232 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="122" text-anchor="middle" font-size="10" fill="#446688">A⁻¹</text>

  <!-- right: B grid with transposed position -->
  <text x="330" y="74" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">逆矩阵 B = A⁻¹</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="290" y="86" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="324" y="86" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="358" y="86" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="290" y="116" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="324" y="116" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="358" y="116" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="290" y="146" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="324" y="146" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="358" y="146" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="307" y="106" fill="#3a5a30">1</text>
    <text x="341" y="106" fill="#3a5a30">0</text>
    <text x="375" y="106" fill="#3a5a30">1</text>
    <text x="307" y="136" fill="#3a5a30">0</text>
    <text x="341" y="136" fill="#8a3a38">1</text>
    <text x="375" y="136" fill="#3a5a30">0</text>
    <text x="307" y="166" fill="#3a5a30">1</text>
    <text x="341" y="166" fill="#3a5a30">0</text>
    <text x="375" y="166" fill="#3a5a30">1</text>
  </g>
  <text x="341" y="194" text-anchor="middle" font-size="10" fill="#b85450">看 (j,i) 位置</text>

  <!-- formula box -->
  <rect x="46" y="212" width="488" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="234" font-size="12" fill="#8a6a20" font-weight="bold">矩阵行列式引理（F₂ 上加减同号）</text>
  <text x="62" y="258" font-size="12" fill="#555">A′ = A + eᵢeⱼᵀ 时  det(A′) = det(A)·(1 + (A⁻¹)ⱼ,ᵢ)</text>
  <text x="62" y="280" font-size="12" fill="#555">所以 A′ 仍满秩 ⟺ B[j][i] = 0（记这种格为「安全格」）</text>
  <text x="62" y="300" font-size="11" fill="#b85450">右图红格为 1，说明删左图那个 1 会让秩掉到 n−1，不能单删</text>
</svg>
