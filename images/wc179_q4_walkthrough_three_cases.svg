<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="448" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">同一棵树、三组参数：三态判定全覆盖</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n = 7, edges = [[1,2],[1,3],[1,7],[2,4],[2,6],[3,5]]</text>

  <!-- ============ Case A：恰时到达 ============ -->
  <rect x="20" y="58" width="600" height="108" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="84" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">Case A｜t=2, target=4</text>
  <text x="200" y="84" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">depth[4] = 2 == t：恰在第 2 秒踩到，是叶与否都算数</text>
  <rect x="512" y="70" width="92" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="558" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1/6 ✓</text>

  <path d="M197,116 L263,116" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M297,116 L363,116" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/3</text>
  <text x="330" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/2</text>
  <circle cx="180" cy="116" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="280" cy="116" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="380" cy="116" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="180" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第0秒</text>
  <text x="280" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第1秒</text>
  <text x="380" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第2秒=命中</text>
  <text x="445" y="121" text-anchor="start" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">p = 1×1/3×1/2</text>

  <!-- ============ Case B：早到被困在叶 ============ -->
  <rect x="20" y="176" width="600" height="108" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="202" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">Case B｜t=3, target=4</text>
  <text x="200" y="202" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">depth[4] = 2 &lt; t 且 4 无孩子：被困在叶上，一直停到第 3 秒</text>
  <rect x="512" y="188" width="92" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="558" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">1/6 ✓</text>

  <path d="M187,234 L223,234" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M257,234 L293,234" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M327,234 L363,234" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/3</text>
  <text x="275" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/2</text>
  <text x="345" y="228" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">原地跳</text>
  <circle cx="170" cy="234" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="240" cy="234" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="310" cy="234" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <circle cx="380" cy="234" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="380" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="170" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第0秒</text>
  <text x="240" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第1秒</text>
  <text x="310" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第2秒</text>
  <text x="380" y="268" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第3秒仍在此</text>
  <text x="445" y="239" text-anchor="start" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">等待不掉价：概率不衰减</text>

  <!-- ============ Case C：早到被迫跳走 ============ -->
  <rect x="20" y="294" width="600" height="108" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="320" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">Case C｜t=2, target=2</text>
  <text x="200" y="320" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">depth[2] = 1 &lt; t 且 2 还有孩子 {4,6}：被迫跳走，一去不返</text>
  <rect x="512" y="306" width="92" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="558" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 ✗</text>

  <path d="M187,352 L253,352" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/3</text>
  <path d="M287,345 C320,332 350,332 372,338" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M287,359 C320,372 350,372 372,366" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/2</text>
  <text x="325" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">×1/2</text>
  <circle cx="170" cy="352" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="270" cy="352" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="270" y="326" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">必离开!</text>
  <circle cx="390" cy="340" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="390" cy="364" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="170" y="386" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第0秒</text>
  <text x="270" y="386" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第1秒</text>
  <text x="390" y="386" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第2秒</text>
  <text x="445" y="352" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">无路必须走 ⟹ 2 处清零</text>

  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">早到非叶（Case C）是本题最高频 WA：规则不允许有路时停留，且无环 ⟹ 跳走即永别</text>
</svg>
