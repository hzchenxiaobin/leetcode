<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">按右端点维护「AND 值 → 子数组个数」</text>

  <rect x="36" y="60" width="188" height="130" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">cur：以 r−1 结尾</text>

  <rect x="66" y="94" width="128" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 6，共 2 个</text>

  <rect x="66" y="136" width="128" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 4，共 1 个</text>

  <path d="M 226 120 L 288 120" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="257" y="106" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">&amp; x = 5</text>
  <text x="257" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">再加独立的</text>
  <text x="257" y="154" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">单元素项</text>

  <rect x="296" y="60" width="192" height="130" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="82" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">cur'：以 r 结尾</text>

  <rect x="326" y="94" width="132" height="32" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值 5，共 1 个</text>

  <rect x="326" y="136" width="132" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="392" y="157" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">值 4，共 3 个</text>

  <text x="392" y="182" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">6&amp;5 = 4 与 4&amp;5 = 4 合并</text>

  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值随左端点左移严格递减 ⇒ 相同值一定相邻 ⇒ 与表尾比较即可合并</text>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每轮表长 ≤ 30（位数上限），总时间 O(n log V)</text>

  <rect x="70" y="262" width="380" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">合并时把计数相加，再对等于 k 的项累加答案</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">ans += count 当且仅当 value == k</text>
</svg>
