<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：双端区间 → 前缀差分（示例 1：nums=[1,4,2,7]，low=2，high=6）</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全部 6 个数对的异或值：5, 3, 6, 6, 3, 5 —— 都落在 [2,6] 里，答案为 6</text>

  <!-- Region bands -->
  <rect x="90" y="88" width="90" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="88" width="180" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="360" y="88" width="140" height="62" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="135" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">xor &lt; low</text>
  <text x="135" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">被 f(low) 减去</text>
  <text x="270" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">low ≤ xor ≤ high ✓</text>
  <text x="270" y="128" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">漂亮数对就在这里</text>
  <text x="430" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">xor &gt; high</text>
  <text x="430" y="128" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">f(high+1) 之外</text>

  <!-- Pair dots on the axis -->
  <g filter="url(#rough2)" fill="#446688" stroke="#2b3f57" stroke-width="1.2">
    <circle cx="225" cy="142" r="5.5"/>
    <circle cx="225" cy="126" r="5.5"/>
    <circle cx="315" cy="142" r="5.5"/>
    <circle cx="315" cy="126" r="5.5"/>
    <circle cx="360" cy="142" r="5.5"/>
    <circle cx="360" cy="126" r="5.5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#446688" font-weight="bold">
    <text x="240" y="139">×2</text>
    <text x="330" y="139">×2</text>
    <text x="375" y="139">×2</text>
  </g>
  <text x="498" y="82" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">● = 一个数对 (i,j) 的异或值</text>

  <!-- Boundary markers -->
  <path d="M 180 84 L 180 158" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">low</text>
  <path d="M 360 84 L 360 158" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">high</text>
  <path d="M 405 84 L 405 158" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">high+1</text>

  <!-- Axis -->
  <path d="M 70 158 L 505 158" stroke="#555" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#555" stroke-width="1.4">
    <path d="M 90 158 L 90 166"/>
    <path d="M 135 158 L 135 164"/>
    <path d="M 180 158 L 180 166"/>
    <path d="M 225 158 L 225 164"/>
    <path d="M 270 158 L 270 164"/>
    <path d="M 315 158 L 315 164"/>
    <path d="M 360 158 L 360 166"/>
    <path d="M 405 158 L 405 166"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#666" text-anchor="middle">
    <text x="90" y="180">0</text>
    <text x="135" y="178">1</text>
    <text x="180" y="180">2</text>
    <text x="225" y="178">3</text>
    <text x="270" y="178">4</text>
    <text x="315" y="178">5</text>
    <text x="360" y="180">6</text>
    <text x="405" y="180">7</text>
  </g>
  <text x="510" y="162" font-size="10" fill="#888" filter="url(#rough2)">→</text>
  <text x="478" y="180" font-size="9.5" fill="#aaa" filter="url(#rough2)">更大…</text>

  <!-- Brackets -->
  <path d="M 90 200 L 90 210 L 405 210 L 405 200" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="247" y="228" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">f(high+1) = f(7)：异或值 &lt; 7 的数对 = 6（全部 6 个点）</text>
  <path d="M 90 248 L 90 258 L 180 258 L 180 248" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="192" y="256" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">f(low) = f(2)：异或值 &lt; 2 的数对 = 0</text>

  <!-- Formula box -->
  <rect x="60" y="276" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = f(high+1) − f(low) = 6 − 0 = 6 ✓</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">其中 f(L) = #{ (i,j) : i &lt; j, nums[i] ⊕ nums[j] &lt; L }</text>

  <!-- Insight box -->
  <rect x="44" y="340" width="472" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 整数上 s ≤ high ⟺ s &lt; high+1：闭区间条件 = 两个「严格小于」计数之差</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 「x ⊕ y &lt; L」逐位可比：某高位一旦严格更小、低位随意 → 01-Trie 子树整块计数</text>
</svg>
