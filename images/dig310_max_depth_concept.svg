<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：最少组数 = 数轴上最大的重叠深度</text>

  <!-- 区间横条：x(v) = 55 + (v-1)*41 -->
  <rect x="37" y="66" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="81" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[1,5]</text>

  <rect x="37" y="94" width="405" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="109" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[1,10]</text>

  <rect x="78" y="122" width="77" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="137" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">[2,3]</text>

  <rect x="201" y="150" width="241" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="321" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[5,10]</text>

  <rect x="242" y="178" width="118" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="193" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[6,8]</text>

  <!-- 扫描线 x=2（浅）与 x=5（深） -->
  <path d="M96,56 L96,208" stroke="#d8a7a4" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="96" y="48" text-anchor="middle" font-size="11.5" fill="#c07a76" filter="url(#rough2)">x=2 · 深度 3</text>
  <circle cx="96" cy="77" r="3.5" fill="#d8a7a4" filter="url(#rough2)"/>
  <circle cx="96" cy="105" r="3.5" fill="#d8a7a4" filter="url(#rough2)"/>
  <circle cx="96" cy="133" r="3.5" fill="#d8a7a4" filter="url(#rough2)"/>

  <path d="M219,56 L219,208" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="219" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">x=5 · 深度 3</text>
  <circle cx="219" cy="77" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="219" cy="105" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="219" cy="161" r="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <path d="M40,210 L490,210" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M55,210 L55,215 M96,210 L96,215 M137,210 L137,215 M178,210 L178,215 M219,210 L219,215 M260,210 L260,215 M301,210 L301,215 M342,210 L342,215 M383,210 L383,215 M424,210 L424,215 M465,210 L465,215" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="96" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="137" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="178" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="219" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="260" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="301" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">7</text>
  <text x="342" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">8</text>
  <text x="383" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>
  <text x="424" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">10</text>
  <text x="465" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">11</text>

  <!-- 说明框 -->
  <rect x="40" y="240" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">竖线扫到 x=5：同时穿过 [1,5]、[5,10]、[1,10] 三个区间</text>
  <text x="260" y="281" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">它们两两共享点 5 → 必须两两异组 → 至少 3 组</text>
  <text x="260" y="298" text-anchor="middle" font-size="12.5" fill="#6b5320" filter="url(#rough2)">其余区间恰能塞进这 3 组 → 答案 = 最大深度 = 3</text>

  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">深度 d(x) = 覆盖点 x 的区间数；闭区间的覆盖延伸到 r（含端点），在 r+1 处释放</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">图论视角：区间图是完美图，最少染色数 = 最大团 = 最大重叠深度</text>
</svg>
