<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">成对抵消：x ⊕ x = 0，偶数次出现 ≡ 没出现</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="54">异或满足交换律 + 结合律，重排后相同的数两两相邻 → 成对清零</text>
  </g>

  <text x="62" y="93" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums1 的数</text>
  <g filter="url(#rough2)">
    <rect x="150" y="78" width="350" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="325" y="95" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 ⊕ 2 ⊕ 2 ⊕ 2 ⊕ 1 ⊕ 1 ⊕ 1 ⊕ 1 ⊕ 3 ⊕ 3 ⊕ 3 ⊕ 3</text>
  <text x="325" y="118" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">每个 nums1[i] 出现 n=4 次（偶数）→ 成对清零</text>

  <text x="62" y="147" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">nums2 的数</text>
  <g filter="url(#rough2)">
    <rect x="150" y="132" width="350" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="325" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 ⊕ 10 ⊕ 10 ⊕ 2 ⊕ 2 ⊕ 2 ⊕ 5 ⊕ 5 ⊕ 5 ⊕ 0 ⊕ 0 ⊕ 0</text>
  <text x="325" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">每个 nums2[j] 出现 m=3 次（奇数）→ 各留一个</text>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="130" y="186" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="214" text-anchor="middle" font-size="14" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">只剩 10 ⊕ 2 ⊕ 5 ⊕ 0 = XOR(nums2) = 13</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="254">为什么 n（nums2 的长度）决定 nums1 的去留：</text>
    <text x="280" y="276">nums1[i] 与 nums2 的每个数各配一次 → 出现次数 = len(nums2)</text>
    <text x="280" y="298">对称地，nums2[j] 的出现次数 = len(nums1)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="314" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">答案 = (n 为奇数 ? XOR(nums1) : 0) ⊕ (m 为奇数 ? XOR(nums2) : 0)</text>
</svg>
