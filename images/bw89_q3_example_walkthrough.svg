<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">nums = [3,7,1,6]：前缀均值演算表</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="80" y="58">k（前缀长）</text>
    <text x="230" y="58" text-anchor="middle">P_k（前缀和）</text>
    <text x="400" y="58" text-anchor="middle">⌈P_k / k⌉</text>
  </g>
  <path d="M 60 66 L 500 66" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="94">1</text>
    <text x="230" y="94" text-anchor="middle">3</text>
    <text x="400" y="94" text-anchor="middle">3</text>
  </g>
  <path d="M 60 104 L 500 104" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="132">2</text>
    <text x="230" y="132" text-anchor="middle">3+7 = 10</text>
    <text x="400" y="132" text-anchor="middle" fill="#b85450" font-weight="bold">5 ★</text>
  </g>
  <path d="M 60 142 L 500 142" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="170">3</text>
    <text x="230" y="170" text-anchor="middle">3+7+1 = 11</text>
    <text x="400" y="170" text-anchor="middle">4</text>
  </g>
  <path d="M 60 180 L 500 180" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="208">4</text>
    <text x="230" y="208" text-anchor="middle">3+7+1+6 = 17</text>
    <text x="400" y="208" text-anchor="middle" fill="#b85450" font-weight="bold">5 ★</text>
  </g>

  <path d="M 60 224 L 500 224" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = max{3, 5, 4, 5} = 5</text>

  <g filter="url(#rough2)">
    <rect x="60" y="268" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="290">达界构造：i=1 两次得 [5,5,1,6]，</text>
    <text x="280" y="311">i=3 一次得 [5,5,2,5] —— 最大值恰为 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="340" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a14" text-anchor="middle">
    <text x="280" y="360">对照组 [10,1]：⌈10/1⌉=10 支配一切 → 答案 10</text>
    <text x="280" y="380">（位置 0 只进不出，前缀 P₁ 就是天花板）</text>
  </g>
</svg>
