<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="372" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">结果校验：n = 4 与 n = 5</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">规则：对任意 i &lt; k &lt; j，禁止 2·a[k] = a[i] + a[j]</text>
  <text x="60" y="92" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 4 → [1,3,2,4]</text>
  <text x="60" y="118" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=1（值 3）：1+2=3 ≠ 6 ✓；k=2（值 2）：1+4=5 ≠ 4 ✓，3+4=7 ≠ 4 ✓</text>
  <text x="60" y="152" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 5 → [1,5,3,2,4]</text>
  <text x="60" y="178" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=1（5）：1+3=4 ≠ 10 ✓；k=2（3）：1+2=3 ✓(2·3=6≠3)，5+2=7 ✓，1+4=5 ✓</text>
  <text x="60" y="204" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=3（2）：1+4=5 ≠ 4 ✓，5+4=9 ✓，3+4=7 ✓</text>
  <rect x="60" y="226" width="540" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="251.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每个中位数都「太偏」，凑不出等差 —— 这是奇偶分治的直接效果</text>
  <text x="60" y="306" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">注意答案不唯一：题目接受任一漂亮排列，[2,1,4,3] 也是合法答案</text>
  <text x="330" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">若固定用「先奇后偶」，输出是唯一确定的；但判题只看合法性</text>
</svg>
