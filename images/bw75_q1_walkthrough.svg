<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：10 → 7 的三步翻转</text>

  <!-- 第 0 步：10 = 1010 -->
  <text x="96" y="72" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="end">第 0 步</text>
  <g filter="url(#rough2)">
    <rect x="352" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="370" y="73">1</text><text x="330" y="73">0</text><text x="290" y="73">1</text><text x="250" y="73">0</text>
  </g>
  <text x="226" y="73" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">= 10</text>

  <!-- 翻转 1：最右位 -->
  <path d="M 250 88 C 240 104, 240 108, 244 118" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="108" font-size="12" fill="#b85450" filter="url(#rough2)">① 翻最右位 0→1</text>
  <g filter="url(#rough2)">
    <rect x="352" y="120" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="120" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="120" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="120" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="370" y="141">1</text><text x="330" y="141">0</text><text x="290" y="141">1</text>
    <text x="250" y="141" font-weight="bold">1</text>
  </g>
  <text x="226" y="141" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">= 11</text>

  <!-- 翻转 2：第三位 -->
  <path d="M 290 156 C 282 170, 282 174, 286 184" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="174" font-size="12" fill="#b85450" filter="url(#rough2)">② 翻第三位 0→1</text>
  <g filter="url(#rough2)">
    <rect x="352" y="186" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="186" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="186" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="232" y="186" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="370" y="207">1</text><text x="330" y="207">0</text>
    <text x="290" y="207" font-weight="bold">1</text><text x="250" y="207">1</text>
  </g>
  <text x="226" y="207" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="end">= 15</text>

  <!-- 翻转 3：最高位 -->
  <path d="M 370 222 C 380 236, 380 240, 376 250" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="240" font-size="12" fill="#b85450" filter="url(#rough2)">③ 翻最高位 1→0</text>
  <g filter="url(#rough2)">
    <rect x="352" y="252" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="312" y="252" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="272" y="252" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="232" y="252" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="370" y="273" font-weight="bold">0</text>
    <text x="330" y="273" fill="#2d5a22">1</text><text x="290" y="273" fill="#2d5a22">1</text><text x="250" y="273" fill="#2d5a22">1</text>
  </g>
  <text x="226" y="273" font-size="12" fill="#2d5a22" filter="url(#rough2)" text-anchor="end">= 7 ✓</text>

  <!-- 结论 -->
  <rect x="100" y="304" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">翻转的恰好是 start ⊕ goal 中为 1 的那 3 个位</text>
</svg>
