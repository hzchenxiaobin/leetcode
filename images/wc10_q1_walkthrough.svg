<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：逐格数出暴露边（数字写在格内）</text>
  <text x="72" y="72" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">grid （4 × 4）</text>

  <text x="99" y="90" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="153" y="90" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="207" y="90" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="261" y="90" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=3</text>
  <text x="64" y="128" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="64" y="182" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="64" y="236" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="64" y="290" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>

  <rect x="72" y="96" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="126" y="96" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="128" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="96" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="234" y="96" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="72" y="150" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="150" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="153" y="182" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="180" y="150" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="182" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="234" y="150" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="72" y="204" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="126" y="204" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="204" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="234" y="204" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="72" y="258" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="99" y="290" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="258" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="153" y="290" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="180" y="258" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="234" y="258" width="54" height="54" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="316" y="96" width="384" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="122" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">按格子加：Σ 暴露边数</text>
  <text x="336" y="148" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3 + 3 + 0 + 3 + 2 + 3 + 2</text>
  <text x="336" y="172" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">= 16</text>

  <path d="M 300 200 L 312 200" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="316" y="206" width="384" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="232" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">按公式加：4 × land − 2 × shared</text>
  <text x="336" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">land = 7 → 4 × 7 = 28</text>
  <text x="336" y="282" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">shared = 6 → − 2 × 6 = −12</text>
  <text x="520" y="282" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P = 16</text>

  <text x="360" y="342" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">两种计数等价：Σ (4 − deg) = 4L − 2S；红色 0 表示该格四个邻居全是陆地</text>
  <text x="360" y="368" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">蓝 = 陆地，灰 = 水域；数字 = 该格暴露边数（0~4）</text>
</svg>
