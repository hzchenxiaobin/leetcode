<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：平衡串 = 存在分界点，左半全是 a、右半全是 b</text>
  <text x="340" y="54" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">s = a a b a b b a b，在分界处删「左边的 b」与「右边的 a」即可，两者互不干扰</text>

  <!-- string cells -->
  <g filter="url(#r)">
    <rect x="150" y="90" width="52" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="206" y="90" width="52" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="262" y="90" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="318" y="90" width="52" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="90" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="430" y="90" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="486" y="90" width="52" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="542" y="90" width="52" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="176" y="120" fill="#4a7a3a">a</text>
    <text x="232" y="120" fill="#4a7a3a">a</text>
    <text x="288" y="120" fill="#a67c1e">b</text>
    <text x="344" y="120" fill="#4a7a3a">a</text>
    <text x="400" y="120" fill="#a67c1e">b</text>
    <text x="456" y="120" fill="#446688">b</text>
    <text x="512" y="120" fill="#a67c1e">a</text>
    <text x="568" y="120" fill="#446688">b</text>
  </g>

  <!-- split line -->
  <path d="M 400 78 L 400 152" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7,5" filter="url(#r)"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">分界点 i：左侧「违规 b」×右侧「违规 a」</text>

  <!-- annotations -->
  <path d="M 288 148 L 288 196" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 512 148 L 512 196" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="150" y="200" width="230" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="402" y="200" width="230" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="265" y="227" text-anchor="middle" font-size="13" fill="#7a5b1e" filter="url(#r)">左半的 b（黄色）必须删</text>
  <text x="517" y="227" text-anchor="middle" font-size="13" fill="#7a5b1e" filter="url(#r)">右半的 a（黄色）必须删</text>

  <g filter="url(#r)">
    <rect x="120" y="266" width="460" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="350" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2c" filter="url(#r)">cost(i) = 前缀 b 数 + 后缀 a 数，答案 = min cost(i)</text>
</svg>
