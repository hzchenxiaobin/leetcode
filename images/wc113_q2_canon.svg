<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="280" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="13.5" fill="#333333" filter="url(#rough2)">另一种写法：算「规范形」，比较规范形即可</text>
  <rect x="30" y="54" width="240" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">规范形 canon(t)</text>
  <text x="150" y="102" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">= (val, sorted([canon(左), canon(右)]))</text>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">孩子按规范形排序后拼接</text>
  <rect x="320" y="54" width="240" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">翻转等价 ⟺ canon 相同</text>
  <text x="440" y="102" text-anchor="middle" font-size="10" fill="#333333" filter="url(#rough2)">因为交换只改变孩子的顺序</text>
  <text x="440" y="126" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">排序后顺序信息被抹掉</text>
  <path d="M 272 102 L 318 102" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例：树 1 的 canon = f(1, [ f(2,[f(4),f(5)]), f(3,[f(6)]) ])</text>
  <text x="290" y="200" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">排序后两个孩子按 canon 字典序排列，与是否交换无关</text>
  <rect x="60" y="218" width="480" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="11" fill="#a9761f" filter="url(#rough2)">本题节点数 ≤ 100，直接递归比较即可；规范形适合多组比较/去重</text>
</svg>
