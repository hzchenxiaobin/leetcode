<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">一遍扫双轨：同时维护历史最小 / 最大前缀</text>

  <!-- 开始 -->
  <rect x="30" y="120" width="96" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">pre += x</text>
  <text x="78" y="160" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pre₀ = 0</text>

  <path d="M126,146 L166,146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans 更新 -->
  <rect x="168" y="104" width="170" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="253" y="130" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">ans = max(ans,</text>
  <text x="253" y="150" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">pre − mn,  mx − pre)</text>
  <text x="253" y="172" text-anchor="middle" font-size="11.5" fill="#b8642a" filter="url(#rough2)">用更新前的 mx / mn！</text>

  <path d="M338,146 L378,146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新历史极值 -->
  <rect x="380" y="104" width="118" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">mx = max(mx, pre)</text>
  <text x="439" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">mn = min(mn, pre)</text>
  <text x="439" y="174" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">供后续右端点使用</text>

  <!-- 回环箭头 -->
  <path d="M439,192 Q439,262 253,262 Q70,262 70,180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="282" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">处理下一个元素 x</text>

  <!-- 语义注释 -->
  <rect x="60" y="236" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="258" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pre − mn = 最大子段和</text>
  <rect x="300" y="300" width="150" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">mx − pre = |最小子段和|</text>
  <rect x="150" y="306" width="130" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="328" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">ans 初值 0（空子数组）</text>
</svg>
