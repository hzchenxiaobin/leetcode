<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">split → 枚举窗口 → 收集第三词</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888"
        filter="url(#rough2)">整题只有一次分词 + 一次线性扫描，没有任何字符串比较之外的操作</text>

  <rect x="150" y="62" width="260" height="40" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="11" fill="#3a4a66"
        filter="url(#rough2)">words = text.split(" ")，n = len(words)</text>

  <path d="M 280 102 L 280 122" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="124" width="260" height="36" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="11" fill="#3a5a30"
        filter="url(#rough2)">i = 0，ans = []</text>

  <path d="M 280 160 L 280 178" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,180 375,212 280,244 185,212" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">i + 2 &lt; n ?</text>

  <path d="M 375 212 L 424 212" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="9.5" fill="#b85450"
        filter="url(#rough2)">否</text>
  <rect x="426" y="192" width="110" height="40" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="481" y="217" text-anchor="middle" font-size="11" fill="#8a3a36"
        filter="url(#rough2)">返回 ans</text>

  <path d="M 280 244 L 280 258" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="256" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="280,260 385,294 280,328 175,294" fill="#e6f4ea"
           stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#3a5a30"
        filter="url(#rough2)">w[i] == first</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#3a5a30"
        filter="url(#rough2)">且 w[i+1] == second ?</text>

  <path d="M 385 294 L 418 294" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="402" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a"
        filter="url(#rough2)">是</text>
  <rect x="420" y="274" width="120" height="40" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="299" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">ans.push(w[i+2])</text>

  <path d="M 480 314 L 480 369 L 396 369" stroke="#d6a040" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 328 L 280 344" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="342" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="170" y="346" width="220" height="34" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#3a4a66"
        filter="url(#rough2)">i = i + 1</text>

  <path d="M 170 363 L 82 363 L 82 142 L 146 142" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="406" text-anchor="middle" font-size="10" fill="#999"
        filter="url(#rough2)">循环体里 O(1)：一次词比较，命中时一次 push</text>
</svg>
