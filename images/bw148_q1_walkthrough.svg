<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="356" fill="#fafafa"/>

  <text filter="url(#rough2)" x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两个示例的逐边走查：差值带符号就错，必须取绝对值</text>

  <text filter="url(#rough2)" x="30" y="58" font-size="11.5" fill="#333" font-weight="bold">示例 1：nums = [1, 2, 4]</text>
  <g filter="url(#rough2)">
    <rect x="30" y="68" width="220" height="28" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
    <rect x="30" y="100" width="220" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="30" y="130" width="220" height="26" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="30" y="160" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="40" y="87" font-weight="bold">边</text>
    <text x="140" y="87" font-weight="bold">绝对差</text>
    <text x="40" y="118">nums[0] 与 nums[1]</text>
    <text x="164" y="118">|1 − 2| = 1</text>
    <text x="40" y="148">nums[1] 与 nums[2]</text>
    <text x="164" y="148">|2 − 4| = 2</text>
    <text x="40" y="178" fill="#8a6a20" font-weight="bold">nums[2] 与 nums[0]</text>
    <text x="152" y="178" fill="#8a6a20" font-weight="bold">|4 − 1| = 3</text>
  </g>
  <text filter="url(#rough2)" x="30" y="204" font-size="10.4" fill="#8a6a20">答案 = max(1, 2, 3) = 3</text>

  <text filter="url(#rough2)" x="300" y="58" font-size="11.5" fill="#333" font-weight="bold">示例 2：nums = [−5, −10, −5]</text>
  <g filter="url(#rough2)">
    <rect x="300" y="68" width="230" height="28" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
    <rect x="300" y="100" width="230" height="26" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="300" y="130" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="300" y="160" width="230" height="26" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="310" y="87" font-weight="bold">边</text>
    <text x="420" y="87" font-weight="bold">绝对差</text>
    <text x="310" y="118">nums[0] 与 nums[1]</text>
    <text x="434" y="118">|−5 + 10| = 5</text>
    <text x="310" y="148" fill="#3a5a30" font-weight="bold">nums[1] 与 nums[2]</text>
    <text x="434" y="148" fill="#3a5a30" font-weight="bold">|−10 + 5| = 5</text>
    <text x="310" y="178">nums[2] 与 nums[0]</text>
    <text x="452" y="178">|−5 + 5| = 0</text>
  </g>
  <text filter="url(#rough2)" x="300" y="204" font-size="10.4" fill="#3a5a30">答案 = max(5, 5, 0) = 5</text>

  <rect x="30" y="226" width="500" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="46" y="246" font-size="10.8" fill="#8a3a36" font-weight="bold">易错点 1：负数</text>
  <text filter="url(#rough2)" x="46" y="266" font-size="10.6" fill="#444">示例 2 全是负数：写成 nums[i] − nums[i+1] 会得到 −5 与 5 混在一起，max 立刻出错。</text>

  <rect x="30" y="288" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="46" y="308" font-size="10.8" fill="#3a5a30" font-weight="bold">易错点 2：忘了首尾</text>
  <text filter="url(#rough2)" x="46" y="328" font-size="10.6" fill="#444">只扫 i = 0..n−2 会漏掉 nums[n−1] 与 nums[0] 这条边 —— 示例 1 的答案恰好就落在这条边上。</text>
</svg>
