<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[5,4,5],[1,2,6],[7,4,6]]，5 次弹出拿到答案</text>

  <text x="110" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">原网格（格值）</text>
  <g filter="url(#rough2)">
    <rect x="58" y="56" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="114" y="56" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="170" y="56" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="58" y="98" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="114" y="98" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="170" y="98" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="58" y="140" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="114" y="140" width="52" height="38" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="170" y="140" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="84" y="79">5</text><text x="140" y="79">4</text><text x="196" y="79">5</text>
    <text x="84" y="121">1</text><text x="140" y="121">2</text><text x="196" y="121">6</text>
    <text x="84" y="163">7</text><text x="140" y="163">4</text><text x="196" y="163">6</text>
  </g>
  <text x="84" y="196" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">起点</text>
  <text x="196" y="196" text-anchor="middle" font-size="8" fill="#8a6a20" filter="url(#rough2)">终点</text>

  <text x="336" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">best（最大瓶颈）与弹出顺序 ①–⑤</text>
  <g filter="url(#rough2)">
    <rect x="280" y="56" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="336" y="56" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="392" y="56" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="280" y="98" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="336" y="98" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="392" y="98" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="280" y="140" width="52" height="38" fill="#f0f0ec" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="336" y="140" width="52" height="38" fill="#f0f0ec" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="392" y="140" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="306" y="75" fill="#3a4a66">5</text><text x="306" y="88" font-size="9" fill="#446688">①</text>
    <text x="362" y="75" fill="#3a5a30">4</text><text x="362" y="88" font-size="9" fill="#4a7a3a">②</text>
    <text x="418" y="75" fill="#3a5a30">4</text><text x="418" y="88" font-size="9" fill="#4a7a3a">③</text>
    <text x="306" y="117" fill="#8a3a36">1</text><text x="306" y="130" font-size="7.5" fill="#b85450">未弹出</text>
    <text x="362" y="117" fill="#8a3a36">2</text><text x="362" y="130" font-size="7.5" fill="#b85450">未弹出</text>
    <text x="418" y="117" fill="#3a5a30">4</text><text x="418" y="130" font-size="9" fill="#4a7a3a">④</text>
    <text x="306" y="159" fill="#999">−</text><text x="306" y="172" font-size="7.5" fill="#999">未入堆</text>
    <text x="362" y="159" fill="#999">−</text><text x="362" y="172" font-size="7.5" fill="#999">未入堆</text>
    <text x="418" y="159" fill="#2a4a20">4</text><text x="418" y="172" font-size="9" fill="#4a7a3a">⑤</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="480" y="62" font-weight="bold" fill="#446688">① 弹 (0,0) d=5</text>
    <text x="492" y="76" font-size="8.5">松弛 (0,1)=4，(1,0)=1</text>
    <text x="480" y="94" font-weight="bold" fill="#4a7a3a">② 弹 (0,1) d=4</text>
    <text x="492" y="108" font-size="8.5">松弛 (0,2)=4，(1,1)=2</text>
    <text x="480" y="126" font-weight="bold" fill="#4a7a3a">③ 弹 (0,2) d=4</text>
    <text x="492" y="140" font-size="8.5">松弛 (1,2)=4</text>
    <text x="480" y="158" font-weight="bold" fill="#4a7a3a">④ 弹 (1,2) d=4</text>
    <text x="492" y="172" font-size="8.5">松弛 (2,2)=4</text>
    <text x="480" y="190" font-weight="bold" fill="#4a7a3a">⑤ 弹 (2,2) d=4</text>
    <text x="492" y="204" font-size="8.5" fill="#8a6a20" font-weight="bold">是终点 → 返回 4 ✓</text>
  </g>

  <rect x="58" y="230" width="560" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="338" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">best[(2,2)] = 4：走廊 5→4→5→6→6 把瓶颈抬到 4</text>
  <text x="338" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">任何路径的最小值都 ≤ 4（红色 1、2 是绕不开的低谷），4 已是极限</text>

  <text x="338" y="316" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⚠ (1,0)=1、(1,1)=2 留在堆里从未弹出——终点弹出即停，堆中剩余全是劣质条目</text>
  <text x="338" y="336" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">(2,0)、(2,1) 的 best 从未超过 −1：直到返回，它们甚至没有入过堆</text>
</svg>
