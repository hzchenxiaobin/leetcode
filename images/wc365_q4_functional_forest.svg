<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">n 个点、n 条边、每点恰一条出边 ⟹ 内向基环森林</text>
  <path d="M 180 44 Q 460 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Component A ===== -->
  <text x="195" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">分量一（环长 L = 3）</text>
  <g filter="url(#sk)"><circle cx="150" cy="160" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="150" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><circle cx="295" cy="160" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="295" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="222" cy="268" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="222" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="75" cy="272" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="75" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>

  <path d="M 172 155 Q 222 143 272 155" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 282 179 Q 272 222 238 251" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 204 255 Q 176 222 163 180" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 90 253 Q 112 219 134 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <text x="222" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">环长 L=3</text>
  <text x="88" y="222" font-size="11" fill="#446688">d(3)=1</text>
  <text x="150" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="295" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="222" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="75" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=4</text>

  <!-- divider -->
  <path d="M 460 92 Q 466 210 460 328" stroke="#dddddd" stroke-width="1.5" fill="none" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- ===== Component B ===== -->
  <text x="692" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">分量二（环长 L = 2）</text>
  <g filter="url(#sk)"><circle cx="625" cy="160" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="625" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <g filter="url(#sk)"><circle cx="760" cy="160" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="760" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">5</text>
  <g filter="url(#sk)"><circle cx="560" cy="272" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="560" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">6</text>
  <g filter="url(#sk)"><circle cx="825" cy="272" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="825" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">7</text>

  <path d="M 647 150 Q 692 136 738 150" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 738 172 Q 692 186 647 172" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 575 253 Q 590 218 608 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 810 253 Q 795 218 778 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <text x="692" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">环长 L=2</text>
  <text x="556" y="222" font-size="10" fill="#446688">d=1</text>
  <text x="806" y="222" font-size="10" fill="#446688">d=1</text>
  <text x="625" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=2</text>
  <text x="760" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=2</text>
  <text x="560" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="825" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>

  <!-- ===== formula box ===== -->
  <g filter="url(#sk)">
    <rect x="100" y="360" width="720" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="460" y="390" text-anchor="middle" font-size="13" fill="#2b2b2b"><tspan fill="#b07818" font-weight="bold">环上节点</tspan>：ans = L（绕环一整圈，回到自己即止）</text>
  <text x="460" y="414" text-anchor="middle" font-size="13" fill="#2b2b2b"><tspan fill="#446688" font-weight="bold">树枝节点</tspan>：ans = d(u) + L，其中 d(u) = 沿出边走到环上的步数</text>
  <text x="460" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⚠️ ans ≠ 所在分量的大小——绕环一圈即止，同分量的其他树枝不会被访问</text>
</svg>
