<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：剥掉终点 (n, m)，剩下的是 LCS</text>
  <path d="M 128 43 Q 330 49 532 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 1. 读入 -->
  <rect x="190" y="56" width="280" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="81" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">读入 a、b（多测循环 t 组）</text>
  <path d="M 330 96 L 330 116" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 前缀残量 -->
  <rect x="170" y="118" width="320" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="143" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">Pa[0..n]、Pb[0..m]：逐位累加后 mod 10</text>
  <path d="M 330 158 L 330 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判定菱形 -->
  <polygon points="330,180 462,218 330,256 198,218" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="214" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">Pa[n] ≡ Pb[m]</text>
  <text x="330" y="232" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">(mod 10) ？</text>
  <path d="M 462 218 L 536 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="211" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="538" y="198" width="120" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="598" y="224" text-anchor="middle" font-size="16" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 -1</text>
  <text x="342" y="276" font-size="12" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <path d="M 330 256 L 330 286" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 前缀序列 -->
  <rect x="160" y="288" width="340" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="315" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">α = Pa[1..n−1]，β = Pb[1..m−1]</text>
  <path d="M 330 330 L 330 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. LCS DP -->
  <rect x="120" y="352" width="420" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">LCS 滚动数组：f[i][j] = α[1..i] 与 β[1..j] 的最长公共子序列</text>
  <text x="330" y="394" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">α_i = β_j 时 f[i][j] = f[i−1][j−1] + 1</text>
  <text x="330" y="410" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">否则 f[i][j] = max(f[i−1][j], f[i][j−1])</text>
  <path d="M 330 418 L 330 438" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 答案 -->
  <rect x="190" y="440" width="280" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = 1 + f[n−1][m−1]</text>

  <!-- 右侧复杂度 -->
  <rect x="556" y="300" width="150" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="324" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">复杂度</text>
  <text x="572" y="348" font-size="12" fill="#2f4a66" filter="url(#rough2)">时间 O(|α|·|β|)</text>
  <text x="572" y="368" font-size="12" fill="#2f4a66" filter="url(#rough2)">≤ 2.5×10⁷</text>
  <text x="572" y="392" font-size="12" fill="#2f4a66" filter="url(#rough2)">空间 O(min(|α|,|β|))</text>
  <text x="572" y="420" font-size="12" fill="#2f4a66" filter="url(#rough2)">Python 位压缩：</text>
  <text x="572" y="440" font-size="12" fill="#2f4a66" filter="url(#rough2)">O(|α||β| / 64)</text>
</svg>
