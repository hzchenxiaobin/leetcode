<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单词数 = 空格数 + 1</text>

  <!-- 句子 1 -->
  <text x="36" y="76" font-size="12" fill="#666" filter="url(#rough2)">句子 1</text>
  <g filter="url(#rough2)">
    <rect x="85" y="58" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="145" y="58" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="173" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="215" y="58" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="243" y="58" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="285" y="58" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="313" y="58" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="365" y="58" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="393" y="58" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">
    <text x="111" y="78">alice</text><text x="190" y="78">and</text><text x="260" y="78">bob</text>
    <text x="335" y="78">love</text><text x="429" y="78">leetcode</text>
  </g>
  <g font-size="10" fill="#8a6d1a" text-anchor="middle" filter="url(#rough2)">
    <text x="155" y="46">空格</text><text x="225" y="46">空格</text><text x="295" y="46">空格</text><text x="375" y="46">空格</text>
  </g>
  <text x="480" y="78" font-size="12.5" fill="#666" filter="url(#rough2)">→ 5</text>

  <!-- 句子 3 -->
  <text x="36" y="150" font-size="12" fill="#666" filter="url(#rough2)">句子 2</text>
  <g filter="url(#rough2)">
    <rect x="85" y="132" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="127" y="132" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="155" y="132" width="20" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="183" y="132" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="211" y="132" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="263" y="132" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="291" y="132" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="343" y="132" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="371" y="132" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="423" y="132" width="20" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="451" y="132" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="10" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">
    <text x="102" y="152">th…</text><text x="176" y="152">is</text><text x="233" y="152">great</text>
    <text x="313" y="152">thanks</text><text x="393" y="152">very</text><text x="468" y="152">much</text>
  </g>
  <text x="480" y="112" font-size="12.5" fill="#666" filter="url(#rough2)" opacity="0"> </text>

  <!-- 公式框 -->
  <path d="M 240 170 C 240 186, 240 192, 240 202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="95" y="206" width="330" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="14.5" fill="#2b3d52" filter="url(#rough2)">空格 c 个 → 单词数 w = c + 1</text>

  <!-- max -->
  <path d="M 260 252 C 260 266, 260 272, 260 282" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="115" y="286" width="290" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#7a3b37" filter="url(#rough2)">句子1: 4+1 = 5 句子2: 5+1 = 6</text>
  <text x="260" y="324" text-anchor="middle" font-size="13" fill="#7a3b37" filter="url(#rough2)">max = 6（黄色小方块就是全部「刀口」）</text>
</svg>
