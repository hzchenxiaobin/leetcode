<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">首次出现表 first[·]：一趟扫描求最长配对（s = "eleet…"）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="80" y="66">下标 i</text>
    <text x="170" y="66">字符</text>
    <text x="280" y="66">mask（位序 uoiea）</text>
    <text x="440" y="66">动作</text>
  </g>

  <!-- 行 0: 空前缀 -->
  <g filter="url(#rough2)">
    <rect x="30" y="78" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="78" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="210" y="78" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="78" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="98">−1（空前缀）</text>
    <text x="170" y="98">—</text>
    <text x="280" y="98">00000</text>
    <text x="440" y="98">first[0] = −1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="112" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="112" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="210" y="112" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="112" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="132">0</text>
    <text x="170" y="132">e</text>
    <text x="280" y="132">00010</text>
    <text x="440" y="132">first[2] = 0（首现）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="146" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="146" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="210" y="146" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="146" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="166">1</text>
    <text x="170" y="166">l</text>
    <text x="280" y="166">00010</text>
    <text x="440" y="166">1 − 0 = 1，ans=1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="180" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="180" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="210" y="180" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="180" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="200">2</text>
    <text x="170" y="200">e</text>
    <text x="280" y="200">00000</text>
    <text x="440" y="200">2 − (−1) = 3，ans=3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="214" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="214" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="210" y="214" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="214" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="234">3</text>
    <text x="170" y="234">e</text>
    <text x="280" y="234">00010</text>
    <text x="440" y="234">3 − 0 = 3，ans=3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="248" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="130" y="248" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="210" y="248" width="140" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="350" y="248" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="80" y="268">4</text>
    <text x="170" y="268">t</text>
    <text x="280" y="268">00010</text>
    <text x="440" y="268">4 − 0 = 4，ans=4</text>
  </g>

  <rect x="40" y="288" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">继续扫描：i=8 回到掩码 2 得 8，i=12 得 12，i=13 得 13 —— 最终 ans = 13</text>
</svg>
