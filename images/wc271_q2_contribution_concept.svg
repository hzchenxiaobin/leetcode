<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：拆和 + 贡献计数 —— 每个元素申报自己的管辖</text>
  <path d="M 100 42 Q 340 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">对「差」求和先拆成两个「极值求和」：Σ(max − min) = sumMax − sumMin，两侧各自 O(n) 贡献计数</text>

  <!-- formula strip -->
  <rect x="110" y="76" width="460" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">Σ (max − min)  =  <tspan fill="#2e6e2e">sumMax</tspan>  −  <tspan fill="#b06a10">sumMin</tspan></text>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">所有子数组最大值之和</text>
  <text x="460" y="132" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">所有子数组最小值之和</text>

  <!-- array cells -->
  <rect x="60" y="142" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="87" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">4</text>
  <rect x="120" y="142" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="147" y="166" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">−2</text>
  <rect x="180" y="142" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="207" y="166" text-anchor="middle" font-size="13" fill="#b06a10" font-weight="bold">−3</text>
  <rect x="252" y="142" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="279" y="166" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>
  <rect x="312" y="142" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="339" y="166" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="87" y="192" text-anchor="middle" font-size="9.5" fill="#999">i=0</text>
  <text x="147" y="192" text-anchor="middle" font-size="9.5" fill="#999">i=1</text>
  <text x="207" y="192" text-anchor="middle" font-size="9.5" fill="#999">i=2</text>
  <text x="279" y="192" text-anchor="middle" font-size="9.5" fill="#999">i=3</text>
  <text x="339" y="192" text-anchor="middle" font-size="9.5" fill="#999">i=4</text>

  <!-- brackets -->
  <path d="M 60 200 Q 60 208 68 208 L 226 208 Q 234 208 234 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="147" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=0 作 max：L=−1，R=3 ⇒ 左端点 1 种 × 右端点 3 种</text>
  <path d="M 60 232 Q 60 240 68 240 L 358 240 Q 366 240 366 232" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="213" y="256" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">i=2 作 min：L=−1，R=5 ⇒ 左端点 3 种 × 右端点 3 种</text>

  <!-- max panel -->
  <rect x="40" y="272" width="300" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="190" y="294" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">max 侧：i = 0（值 4）</text>
  <text x="190" y="314" text-anchor="middle" font-size="11" fill="#333">L=−1（左侧无更大）　R=3（右侧首个 ≥ 4）</text>
  <text x="190" y="332" text-anchor="middle" font-size="11" fill="#333">cnt = (0−(−1)) × (3−0) = 1 × 3 = <tspan font-weight="bold" fill="#2e6e2e">3</tspan></text>
  <text x="190" y="350" text-anchor="middle" font-size="11" fill="#333">贡献 = 4 × 3 = <tspan font-weight="bold" fill="#2e6e2e">+12</tspan></text>
  <text x="190" y="368" text-anchor="middle" font-size="10.5" fill="#444">管辖：[4]、[4,−2]、[4,−2,−3]</text>
  <text x="190" y="392" text-anchor="middle" font-size="9.5" fill="#666">（R 被 i=3 的 4 挡住 ⇒ 含双 4 的子数组归更右者）</text>

  <!-- min panel -->
  <rect x="360" y="272" width="300" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="510" y="294" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">min 侧：i = 2（值 −3）</text>
  <text x="510" y="314" text-anchor="middle" font-size="11" fill="#333">L=−1（左侧无更小）　R=5（右侧无 ≤ −3）</text>
  <text x="510" y="332" text-anchor="middle" font-size="11" fill="#333">cnt = (2−(−1)) × (5−2) = 3 × 3 = <tspan font-weight="bold" fill="#b06a10">9</tspan></text>
  <text x="510" y="350" text-anchor="middle" font-size="11" fill="#333">贡献 = (−3) × 9 = <tspan font-weight="bold" fill="#b03a3a">−27</tspan></text>
  <text x="510" y="368" text-anchor="middle" font-size="10.5" fill="#444">全局最小 ⇒ 9 个子数组的 min 全归它</text>
  <text x="510" y="392" text-anchor="middle" font-size="9.5" fill="#666">（负值 × 大计数 ⇒ sumMin 为负属正常现象）</text>

  <!-- bottom insight -->
  <rect x="60" y="420" width="560" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="443" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold">视角翻转：不枚举 ~n²/2 个子数组各算 max−min，每个元素 O(1) 申报管辖数 —— 子数组层 → 元素层</text>
</svg>
