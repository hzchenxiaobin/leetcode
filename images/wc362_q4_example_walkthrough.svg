<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例演算：好位移 → 分桶 → 闭式 → 答案</text>

  <!-- 左：示例 1 -->
  <text x="172" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：s=abcd → t=cdab，k=2（n=4）</text>

  <rect x="52" y="68" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="67" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="82" y="68" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="112" y="68" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="127" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="142" y="68" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="157" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="172" y="68" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="187" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="202" y="68" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="217" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="232" y="68" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="262" y="68" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="127" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">p=2</text>
  <text x="172" y="132" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（s+s，橙色为命中窗口）</text>

  <text x="172" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">好位移 L=(4−2) mod 4=2，m=1，m(0)=0，m(1)=1</text>

  <rect x="40" y="168" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">≡0</text>
  <text x="71" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 条</text>
  <rect x="108" y="168" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">≡1</text>
  <text x="139" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 条</text>
  <rect x="176" y="168" width="62" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="207" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">≡2</text>
  <text x="207" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 条</text>
  <rect x="244" y="168" width="62" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">≡3</text>
  <text x="275" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 条</text>

  <text x="172" y="232" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">9 条序列按净位移分布（≡2 的两条即官方两种方案）</text>
  <text x="172" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p=(n−1)^k=9，sign=+1</text>
  <text x="172" y="270" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x(2)=(9+3)/4=3，y(2)=(9−1)/4=2</text>

  <rect x="55" y="280" width="235" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 0·x + 1·y = 2 ✓</text>

  <!-- 右：示例 2 -->
  <text x="480" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：s=t=ababab，k=1（n=6）</text>

  <text x="480" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s 周期 2 ⟹ t 在 s+s 命中 p ∈ {0, 2, 4}</text>
  <text x="480" y="114" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">好位移 L ∈ {0, 4, 2}，m=3</text>
  <text x="480" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m(0)=1（L=0），m(1)=2</text>
  <text x="480" y="158" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">p=(6−1)^1=5，sign=−1</text>
  <text x="480" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">x(1)=(5−5)/6=0：一步转不回自身</text>
  <text x="480" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">y(1)=(5+1)/6=1：转到每个非零位移恰 1 种</text>

  <rect x="365" y="218" width="230" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 1·0 + 2·1 = 2 ✓</text>

  <text x="480" y="268" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">l=2 与 l=4 得到相同字符串，但仍算 2 种方案</text>

  <!-- 底部易错提示 -->
  <rect x="75" y="322" width="490" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">易错点：s 有小周期时好位移不止一个，所有命中起点都要计入</text>
  <text x="320" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">并按 L=0 / L≠0 分桶——只算「最近的一个」会把示例 2 算成 0</text>
</svg>
