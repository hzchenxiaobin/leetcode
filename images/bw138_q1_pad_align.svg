<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">补前导零对齐后，逐位取三者最小值</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：num1 = 1，num2 = 10，num3 = 1000</text>

  <text x="56" y="90" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">num1</text>
  <text x="56" y="136" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">num2</text>
  <text x="56" y="182" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">num3</text>

  <g filter="url(#rough2)">
    <rect x="120" y="66" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="66" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="232" y="66" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="288" y="66" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>

    <rect x="120" y="112" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="112" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="232" y="112" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="288" y="112" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>

    <rect x="120" y="158" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="158" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="232" y="158" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="288" y="158" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="146" y="89" fill="#3a4a66">0</text>
    <text x="202" y="89" fill="#3a4a66">0</text>
    <text x="258" y="89" fill="#3a4a66">0</text>
    <text x="314" y="89" fill="#3a4a66">1</text>

    <text x="146" y="135" fill="#3a4a66">0</text>
    <text x="202" y="135" fill="#3a4a66">0</text>
    <text x="258" y="135" fill="#3a4a66">1</text>
    <text x="314" y="135" fill="#3a4a66">0</text>

    <text x="146" y="181" fill="#3a4a66">1</text>
    <text x="202" y="181" fill="#3a4a66">0</text>
    <text x="258" y="181" fill="#3a4a66">0</text>
    <text x="314" y="181" fill="#3a4a66">0</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="146" y="118">千位</text>
    <text x="202" y="118">百位</text>
    <text x="258" y="118">十位</text>
    <text x="314" y="118">个位</text>
  </g>

  <path d="M 146 196 L 146 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 202 196 L 202 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 258 196 L 258 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 314 196 L 314 224" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">每列取 min</text>

  <g filter="url(#rough2)">
    <rect x="120" y="228" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="4"/>
    <rect x="176" y="228" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="4"/>
    <rect x="232" y="228" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="4"/>
    <rect x="288" y="228" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="146" y="251" fill="#8a6a20">0</text>
    <text x="202" y="251" fill="#8a6a20">0</text>
    <text x="258" y="251" fill="#8a6a20">0</text>
    <text x="314" y="251" fill="#8a6a20">0</text>
  </g>

  <text x="56" y="251" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">key</text>

  <rect x="44" y="286" width="452" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="308" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">数字答案 "0000" = 0（题目要求返回去掉前导零的整数）</text>
  <text x="58" y="328" font-size="10.5" fill="#555" filter="url(#rough2)">代码里不必真的补零：对 10 取余会把缺失的高位自然当成 0</text>
</svg>
