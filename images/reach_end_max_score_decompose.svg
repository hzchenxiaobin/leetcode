<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：一次长跳 = 逐格累积</text>

  <rect x="147" y="78" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="217" y="78" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="287" y="78" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="357" y="78" width="56" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="245" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="315" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="107" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="175" y="141" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="245" y="141" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="315" y="141" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="385" y="141" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <path d="M 178 74 Q 210 40 242 74" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="34" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1×1 = 1</text>
  <path d="M 248 70 Q 315 6 382 70" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="315" y="16" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2×3 = 6</text>

  <text x="280" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">拆分视角：跳 (i → j) 就是跨越 j−i 个"间隔"，每跨一个贡献一次 nums[i]</text>

  <path d="M 210 148 L 210 188" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 280 148 L 280 188" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 350 148 L 350 188" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="187" y="190" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="257" y="190" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="327" y="190" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="350" y="215" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="210" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">间隔 0</text>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">间隔 1</text>
  <text x="350" y="248" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">间隔 2</text>

  <text x="280" y="282" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">跨越间隔 s 时，起跳点可以是任何 i ≤ s</text>
  <text x="280" y="303" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">→ 每个间隔的贡献最优取 max(nums[0..s])</text>

  <rect x="80" y="318" width="400" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">答案 = Σ max(nums[0..s])，s = 0 … n−2</text>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">示例：1 + 3 + 3 = 7</text>
</svg>
