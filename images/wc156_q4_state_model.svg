<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把蛇压成三个整数：(r, c, o)</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">左上格 (r, c) + 朝向 o 唯一确定蛇占据的两个格子</text>

  <!-- 左：水平状态网格 3x3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="100" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="140" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="60" y="132" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="100" y="132" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="140" y="132" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="60" y="172" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="100" y="172" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="140" y="172" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
  </g>
  <text x="80" y="157" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">r,c</text>
  <text x="120" y="157" text-anchor="middle" font-size="9" fill="#3a4a66" filter="url(#rough2)">r,c+1</text>
  <text x="120" y="234" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">水平 o=0：占 (r,c)、(r,c+1)</text>

  <!-- 右：竖直状态网格 3x3 -->
  <g filter="url(#rough2)">
    <rect x="400" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="440" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="480" y="92" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="400" y="132" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="440" y="132" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="480" y="132" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="400" y="172" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="440" y="172" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
    <rect x="480" y="172" width="40" height="40" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="3"/>
  </g>
  <text x="420" y="157" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">r,c</text>
  <text x="420" y="197" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">r+1,c</text>
  <text x="460" y="234" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">竖直 o=1：占 (r,c)、(r+1,c)</text>

  <!-- 旋转箭头 -->
  <path d="M 206 126 Q 298 96 386 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="94" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">顺时针 90°</text>
  <path d="M 386 178 Q 298 208 210 178" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">逆时针 90°</text>

  <!-- 说明框 -->
  <rect x="36" y="250" width="548" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="274" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么状态只需要 3 个整数？</text>
  <text x="52" y="298" font-size="10" fill="#555" filter="url(#rough2)">朝向 o 决定「第二个格子」：o=0 时是 (r,c+1)，o=1 时是 (r+1,c)，所以 (r,c,o) 与蛇身完全等价。</text>
  <text x="52" y="320" font-size="10" fill="#555" filter="url(#rough2)">状态总数不超过 2n² = 20000（n ≤ 100）；每次移动的花费都是 1。</text>
  <text x="52" y="342" font-size="10" fill="#555" filter="url(#rough2)">因此「最少移动次数」= 状态图上的最短路 → 直接用 BFS，按层扩展即可。</text>

  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">起点 (0,0,0)；终点 (n−1, n−2, 0)，两者都是水平状态</text>
</svg>
