<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两个和的闭式：n² 与 n(n+1)</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: odd numbers -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="290" height="170" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="185" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">前 n 个正奇数（n=4）</text>
  <g filter="url(#sk)">
    <rect x="60" y="108" width="46" height="30" rx="4" fill="#4a8edb" opacity="0.85"/>
    <rect x="112" y="108" width="46" height="30" rx="4" fill="#4a8edb" opacity="0.7"/>
    <rect x="164" y="108" width="46" height="30" rx="4" fill="#4a8edb" opacity="0.55"/>
    <rect x="216" y="108" width="46" height="30" rx="4" fill="#4a8edb" opacity="0.4"/>
  </g>
  <text x="83" y="128" text-anchor="middle" font-size="12" fill="#fff">1</text>
  <text x="135" y="128" text-anchor="middle" font-size="12" fill="#fff">3</text>
  <text x="187" y="128" text-anchor="middle" font-size="12" fill="#fff">5</text>
  <text x="239" y="128" text-anchor="middle" font-size="12" fill="#fff">7</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1 + 3 + 5 + (2n−1)</text>
  <text x="160" y="188" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" font-family="monospace">sumOdd = n²</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#888">n=4 时：16 = 4²</text>

  <!-- Right panel: even numbers -->
  <g filter="url(#sk)">
    <rect x="360" y="70" width="290" height="170" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="505" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">前 n 个正偶数（n=4）</text>
  <g filter="url(#sk)">
    <rect x="380" y="108" width="46" height="30" rx="4" fill="#4a8e4a" opacity="0.85"/>
    <rect x="432" y="108" width="46" height="30" rx="4" fill="#4a8e4a" opacity="0.7"/>
    <rect x="484" y="108" width="46" height="30" rx="4" fill="#4a8e4a" opacity="0.55"/>
    <rect x="536" y="108" width="46" height="30" rx="4" fill="#4a8e4a" opacity="0.4"/>
  </g>
  <text x="403" y="128" text-anchor="middle" font-size="12" fill="#fff">2</text>
  <text x="455" y="128" text-anchor="middle" font-size="12" fill="#fff">4</text>
  <text x="507" y="128" text-anchor="middle" font-size="12" fill="#fff">6</text>
  <text x="559" y="128" text-anchor="middle" font-size="12" fill="#fff">8</text>
  <text x="505" y="162" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2 + 4 + 6 + 2n</text>
  <text x="505" y="188" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">sumEven = n(n+1)</text>
  <text x="505" y="214" text-anchor="middle" font-size="11" fill="#888">n=4 时：20 = 4×5</text>

  <!-- Arrows down to GCD box -->
  <g filter="url(#sk)">
    <path d="M 185 240 Q 260 280 300 296" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 505 240 Q 430 280 390 296" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- GCD derivation box -->
  <g filter="url(#sk)">
    <rect x="110" y="300" width="470" height="82" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="345" y="326" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">gcd(n², n(n+1)) = n · gcd(n, n+1)</text>
  <text x="345" y="350" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">相邻整数互质：gcd(n, n+1) = 1</text>
  <text x="345" y="374" text-anchor="middle" font-size="15" fill="#b03a3a" font-weight="bold" font-family="monospace">答案 = n</text>
</svg>
