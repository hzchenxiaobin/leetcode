<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="390" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">中间行 / 中间列 / 中心：奇偶尺寸的三种"退化"情形</text>

  <!-- 3x3 网格 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="60" y="52" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="106" y="52" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="152" y="52" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="60" y="98" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="106" y="98" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <rect x="152" y="98" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="60" y="144" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="106" y="144" width="46" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="152" y="144" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="129" y="222" text-anchor="middle" font-size="11" fill="#777">m = n = 3（都为奇数）</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <path d="M 60 84 L 60 94" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 152 84 L 152 94" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 129 98 L 129 144" stroke="#d6a040" stroke-width="1.8"/>
    <text x="214" y="66" fill="#2d5a22">绿：中间行的一对 (m/2, j) 与 (m/2, n−1−j)</text>
    <text x="214" y="88" fill="#2d5a22">代价 min(s, 2 − s)，最终 1 数为 0 或 2</text>
    <text x="214" y="118" fill="#a06c10">黄：中间列的一对 (i, n/2) 与 (m−1−i, n/2)</text>
    <text x="214" y="140" fill="#a06c10">代价 min(s, 2 − s)，最终 1 数为 0 或 2</text>
    <text x="214" y="170" fill="#b85450">红：正中心，不受任何对称约束</text>
    <text x="214" y="192" fill="#b85450">代价 0（保持）或 1（翻转），1 数为 0 或 1</text>
    <text x="214" y="216" fill="#666">只有 m 奇时才有中间行，n 奇时才有中间列</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="238" width="460" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="76" y="262" fill="#a06c10">s = 2 的对：取全 1 是 0 代价（贡献 2 个 1），改全 0 需 2 次</text>
    <text x="76" y="284" fill="#a06c10">s = 0 的对：取全 0 是 0 代价（贡献 0 个 1），改全 1 需 2 次</text>

    <rect x="60" y="308" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="76" y="332" fill="#2d5a22">s = 1 的对：全 0 与全 1 都是 1 次 ⇒ 两种取法同价（脚本里记作 flex）</text>
    <text x="76" y="354" fill="#2d5a22">这一"同价可切换"的性质，正是后面对 mod 4 做免费调整的关键</text>
  </g>
</svg>
