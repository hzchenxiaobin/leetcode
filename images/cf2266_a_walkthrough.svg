  <text x="322" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">min</text>
  <rect x="360" y="64" width="88" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">n − min</text>
  <rect x="450" y="64" width="264" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="582" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">这 n − min 个人弱在哪</text>

  <!-- 行 1 -->
  <rect x="26" y="104" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
