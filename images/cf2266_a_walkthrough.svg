  <text x="209" y="209" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">1　1　1</text>
  <rect x="286" y="184" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="209" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="360" y="184" width="88" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="450" y="184" width="264" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="582" y="209" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">没有人弱：唯一的人全解三题</text>

  <!-- 行 4 -->
  <rect x="26" y="224" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="224" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="106" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="134" y="224" width="150" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="209" y="249" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">9　8　9</text>
  <rect x="286" y="224" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="249" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">8</text>
  <rect x="360" y="224" width="88" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <rect x="450" y="224" width="264" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="582" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 人没解第 2 题（其余 8 人满分）</text>

  <!-- 行 5 -->
  <rect x="26" y="264" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="264" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="106" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="134" y="264" width="150" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="209" y="289" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">0　5　5</text>
  <rect x="286" y="264" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="289" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="360" y="264" width="88" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">5</text>
  <rect x="450" y="264" width="264" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="582" y="289" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5 人全弱：没人解出第 1 题</text>

  <!-- 行 6 -->
  <rect x="26" y="304" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="80" y="304" width="52" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="106" y="329" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="134" y="304" width="150" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="209" y="329" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">4　3　2</text>
  <rect x="286" y="304" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="329" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="360" y="304" width="88" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="329" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="450" y="304" width="264" height="38" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="582" y="329" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4 人没解第 3 题（只有 2 人满分）</text>

  <!-- 说明条 -->
  <rect x="26" y="360" width="688" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 5 组是最有说服力的一组：5 个人里有 0 个解出第 1 题，于是无论第 2、3 题多热闹，5 人全都弱。</text>
  <text x="370" y="406" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 1、3 组是另一端：aᵢ 全都等于 n 时 min = n，答案 0，所有人满分。</text>
  <text x="370" y="426" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">六组只用到一次取最小值、一次减法，与官方输出 0 / 1 / 0 / 1 / 5 / 4 逐个吻合。</text>
</svg>
