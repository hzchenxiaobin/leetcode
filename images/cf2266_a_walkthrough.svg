  <rect x="286" y="144" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="322" y="169" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="360" y="144" width="88" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
