<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一次扫描定峰，两段求和比较</text>
  <rect x="28" y="74" width="104" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">[1,3,2,1]</text>
  <text x="80" y="126" text-anchor="middle" font-size="10.5" fill="#888">p=1</text>
  <rect x="140" y="74" width="176" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="228" y="106" text-anchor="middle" font-size="10.5" fill="#8a6a20">inc=[1,3]=4</text>
  <rect x="324" y="74" width="120" height="74" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="384" y="106" text-anchor="middle" font-size="10.5" fill="#555">dec=[3,2,1]=6</text>
  <rect x="452" y="74" width="80" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="492" y="110" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dec 更大 → 1</text>
  <rect x="28" y="162" width="104" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="194" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">[2,4,5,2]</text>
  <text x="80" y="214" text-anchor="middle" font-size="10.5" fill="#888">p=2</text>
  <rect x="140" y="162" width="176" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="228" y="194" text-anchor="middle" font-size="10.5" fill="#8a6a20">inc=[2,4,5]=11</text>
  <rect x="324" y="162" width="120" height="74" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="384" y="194" text-anchor="middle" font-size="10.5" fill="#555">dec=[5,2]=7</text>
  <rect x="452" y="162" width="80" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="492" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">inc 更大 → 0</text>
  <rect x="28" y="250" width="104" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">[1,2,4,3]</text>
  <text x="80" y="302" text-anchor="middle" font-size="10.5" fill="#888">p=2</text>
  <rect x="140" y="250" width="176" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="228" y="282" text-anchor="middle" font-size="10.5" fill="#8a6a20">inc=[1,2,4]=7</text>
  <rect x="324" y="250" width="120" height="74" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="384" y="282" text-anchor="middle" font-size="10.5" fill="#555">dec=[4,3]=7</text>
  <rect x="452" y="250" width="80" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="492" y="286" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">相等 → -1</text>
  <text x="280.0" y="344" text-anchor="middle" font-size="10" fill="#999">峰值元素在一段里被算了一次，在两段里各算一次 —— 合并时不要漏掉或重复</text>
</svg>
