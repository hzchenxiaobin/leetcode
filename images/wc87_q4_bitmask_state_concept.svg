<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">状态 = (已访问集合 mask, 当前节点)</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 156.8 163.7 L 118.2 116.3" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 183.2 163.7 L 221.8 116.3" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 170.0 201.0 L 170.0 247.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><circle cx="105" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="105" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><circle cx="235" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="235" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><circle cx="170" cy="268" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="170" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">3</text>
  <g filter="url(#sk2)"><circle cx="170" cy="180" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="170" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">0</text>
  <text x="300" y="92" text-anchor="middle" font-size="10.5" fill="#666">图：0 与 1、2、3 相连</text>
  <g filter="url(#sk2)"><rect x="415.0" y="74.0" width="200" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="515" y="101.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">状态 = (mask, u)</text>
  <text x="515" y="117.3" text-anchor="middle" font-size="12" fill="#2b4a6e">mask 记录已访问的点集</text>
  <text x="515" y="152" text-anchor="middle" font-size="10.5" fill="#666">mask 用一个 n 位整数表示</text>
  <g filter="url(#sk2)"><rect x="408" y="176" width="44" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="430" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="430" y="232" text-anchor="middle" font-size="10" fill="#999">位 3</text>
  <g filter="url(#sk2)"><rect x="458" y="176" width="44" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="480" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <text x="480" y="232" text-anchor="middle" font-size="10" fill="#999">位 2</text>
  <g filter="url(#sk2)"><rect x="508" y="176" width="44" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="530" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="530" y="232" text-anchor="middle" font-size="10" fill="#999">位 1</text>
  <g filter="url(#sk2)"><rect x="558" y="176" width="44" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="580" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="580" y="232" text-anchor="middle" font-size="10" fill="#999">位 0</text>
  <text x="515" y="258" text-anchor="middle" font-size="11" fill="#2b4a6e">mask = 0b1011 = 11 → 已访问 {0, 1, 3}</text>
  <g filter="url(#sk2)"><rect x="405.0" y="277.0" width="220" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="515" y="301.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">同一个 mask 下，站</text>
  <text x="515" y="316.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">在不同 u 是不同状态</text>
  <g filter="url(#sk2)"><rect x="30.0" y="367.0" width="540" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="386.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">状态总数 ≤ n · 2^n = 12 × 4096 = 49152，因此可以放心 BFS</text>
  <text x="300" y="401.9" text-anchor="middle" font-size="11.5" fill="#2e5e22">答案 = 首次出现 mask == 全 1 时的步数</text>
</svg>
