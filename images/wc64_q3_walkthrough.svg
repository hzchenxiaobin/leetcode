<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：两侧在 1201 相遇，4 + 2 = 6</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">deadends = {0201, 0101, 0102, 1212, 2002}，红色表示一碰就锁死的节点</text>

  <text x="46" y="78" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">A 侧（从 0000 正向，蓝色）</text>

  <rect x="24" y="112" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0000</text>
  <text x="70" y="145" text-anchor="middle" font-size="8.5" fill="#3a4a66" filter="url(#rough2)">dA = 0</text>

  <path d="M 118 132 L 142 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">第 1 位 +1</text>

  <rect x="146" y="112" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="192" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1000</text>
  <text x="192" y="145" text-anchor="middle" font-size="8.5" fill="#3a4a66" filter="url(#rough2)">dA = 1</text>

  <path d="M 240 132 L 264 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">第 2 位 +1</text>

  <rect x="268" y="112" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="314" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1100</text>
  <text x="314" y="145" text-anchor="middle" font-size="8.5" fill="#3a4a66" filter="url(#rough2)">dA = 2</text>

  <path d="M 362 132 L 386 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="106" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">第 2 位 +1</text>

  <rect x="390" y="112" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="436" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1200</text>
  <text x="436" y="145" text-anchor="middle" font-size="8.5" fill="#3a4a66" filter="url(#rough2)">dA = 3</text>

  <text x="398" y="78" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B 侧（从 0202 反向，绿色）</text>

  <rect x="390" y="204" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="436" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0202</text>
  <text x="436" y="237" text-anchor="middle" font-size="8.5" fill="#3a5a30" filter="url(#rough2)">dB = 0</text>

  <path d="M 388 224 L 364 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="329" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 1 位 +1</text>

  <rect x="268" y="204" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="314" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1202</text>
  <text x="314" y="237" text-anchor="middle" font-size="8.5" fill="#3a5a30" filter="url(#rough2)">dB = 1</text>

  <path d="M 266 224 L 242 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="207" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">第 4 位 −1</text>

  <rect x="146" y="204" width="92" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="192" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1201</text>
  <text x="192" y="237" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">dB = 2 / dA = 4</text>

  <path d="M 400 152 L 236 204" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="255" y="170" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">A 侧再走 1 步（第 4 位 +1）</text>

  <rect x="24" y="268" width="512" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="294" font-size="10" fill="#8a3a36" filter="url(#rough2)">✕ 0000 → 0001 → 0002 → 0102：0102 在 deadends 里，一碰就锁死，这条路不通</text>

  <rect x="24" y="324" width="512" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="343" font-size="10" fill="#3a5a30" filter="url(#rough2)">答案 6：0000 → 1000 → 1100 → 1200 → 1201 → 1202 → 0202</text>
  <text x="44" y="361" font-size="9.5" fill="#556" filter="url(#rough2)">相遇点 1201：从 A 侧 4 步、从 B 侧 2 步，各自只扩了 4 层 / 2 层</text>

  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">分支因子 b = 8、深度 d = 6：单向 O(b^d)，双向约 O(b^(d/2))，省一半以上的层数</text>
</svg>
