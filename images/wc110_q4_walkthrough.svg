<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">示例 "aba" 的逐步演算</text>
  <rect x="20" y="44" width="84" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">步骤</text>
  <rect x="110" y="44" width="114" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">读入 c</text>
  <rect x="230" y="44" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">dp[c] 更新</text>
  <rect x="380" y="44" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">total</text>
  <rect x="20" y="74" width="84" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">初始</text>
  <rect x="110" y="74" width="114" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">—</text>
  <rect x="230" y="74" width="144" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">dp[a]=dp[b]=0</text>
  <rect x="380" y="74" width="144" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="20" y="108" width="84" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="110" y="108" width="114" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">a</text>
  <rect x="230" y="108" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">dp[a] = 0+1 = 1</text>
  <rect x="380" y="108" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">0−0+1 = 1</text>
  <rect x="20" y="142" width="84" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="110" y="142" width="114" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">b</text>
  <rect x="230" y="142" width="144" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">dp[b] = 1+1 = 2</text>
  <rect x="380" y="142" width="144" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1−0+2 = 3</text>
  <rect x="20" y="176" width="84" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="110" y="176" width="114" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">a</text>
  <rect x="230" y="176" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">dp[a] = 3+1 = 4</text>
  <rect x="380" y="176" width="144" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3−1+4 = 6</text>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">第 3 步把 dp[a] 从 1 覆盖为 4：以 a 结尾的子序列只剩 {a, ba, aa, aba}</text>
  <rect x="60" y="248" width="440" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">total = 6 ⇒ 子序列 {a, b, ab, ba, aa, aba}，与题面示例一致</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">若漏掉 −dp_old[c]，第 3 步会得到 3+4=7，多算一个重复的 "a"</text>
</svg>
