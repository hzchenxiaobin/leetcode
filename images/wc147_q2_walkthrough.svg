<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="428" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算走查：target = "leet" 的四段指令</text>
  <text x="330" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每段 = |Δr| 条竖直 + |Δc| 条水平（顺序固定 L→U→D→R）+ 1 条 '!'</text>

  <rect x="24" y="64" width="612" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <g font-size="10" fill="#33445c" font-weight="bold" filter="url(#rough2)">
    <text x="38" y="84">步</text>
    <text x="76" y="84">字符</text>
    <text x="130" y="84">起点 → 终点</text>
    <text x="270" y="84">Δr / Δc</text>
    <text x="360" y="84">本段指令</text>
    <text x="470" y="84">累计输出</text>
  </g>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <rect x="24" y="94" width="612" height="46" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
    <text x="38" y="114">1</text>
    <text x="76" y="114" font-weight="bold">l</text>
    <text x="130" y="114">(0, 0) → (2, 1)</text>
    <text x="270" y="114">+2 / +1  ⇒  DD, R</text>
    <text x="360" y="114" fill="#b85450">D D R !</text>
    <text x="470" y="114" font-size="9.5">DDR!</text>
    <text x="130" y="132" font-size="9" fill="#888">a → l（第 2 行第 1 列）</text>
    <text x="360" y="132" font-size="9" fill="#888">下移 2 格，右移 1 格</text>
    <text x="470" y="132" font-size="9" fill="#888">走了 3 步 + 1 次追加</text>

    <rect x="24" y="140" width="612" height="46" fill="#f7f9fb" stroke="#dcdcdc" stroke-width="1"/>
    <text x="38" y="160">2</text>
    <text x="76" y="160" font-weight="bold">e</text>
    <text x="130" y="160">(2, 1) → (0, 4)</text>
    <text x="270" y="160">−2 / +3  ⇒  UU, RRR</text>
    <text x="360" y="160" fill="#4a7a3a">U U R R R !</text>
    <text x="470" y="160" font-size="9.5">DDR!UURRR!</text>
    <text x="130" y="178" font-size="9" fill="#888">跨行跨越，上移 2 格右移 3 格</text>
    <text x="360" y="178" font-size="9" fill="#888">5 条移动 + 1 次追加</text>
    <text x="470" y="178" font-size="9" fill="#888">官方输出与此完全一致</text>

    <rect x="24" y="186" width="612" height="46" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/>
    <text x="38" y="206">3</text>
    <text x="76" y="206" font-weight="bold">e</text>
    <text x="130" y="206">(0, 4) → (0, 4)</text>
    <text x="270" y="206">0 / 0  ⇒  无需移动</text>
    <text x="360" y="206" fill="#d6a040">!</text>
    <text x="470" y="206" font-size="9.5">DDR!UURRR!!</text>
    <text x="130" y="224" font-size="9" fill="#888">原地重复字符：只有 '!'，没有移动</text>
    <text x="360" y="224" font-size="9" fill="#888">连续两个 '!' 是正确的</text>
    <text x="470" y="224" font-size="9" fill="#888">不要「优化」掉第二个 '!'</text>

    <rect x="24" y="232" width="612" height="46" fill="#f7f9fb" stroke="#dcdcdc" stroke-width="1"/>
    <text x="38" y="252">4</text>
    <text x="76" y="252" font-weight="bold">t</text>
    <text x="130" y="252">(0, 4) → (3, 4)</text>
    <text x="270" y="252">+3 / 0  ⇒  DDD</text>
    <text x="360" y="252" fill="#446688">D D D !</text>
    <text x="470" y="252" font-size="9.5">DDR!UURRR!!DDD!</text>
    <text x="130" y="270" font-size="9" fill="#888">同一列向下，只有竖直移动</text>
    <text x="360" y="270" font-size="9" fill="#888">3 条移动 + 1 次追加</text>
    <text x="470" y="270" font-size="9" fill="#888">拼出 leet ✓</text>
  </g>

  <rect x="24" y="290" width="612" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="310" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">总指令数 = (2+1+1) + (2+3+1) + (0+0+1) + (3+0+1) = 4 + 6 + 1 + 4 = 15</text>
  <text x="40" y="330" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">恰好等于下界 Σ|Δr| + Σ|Δc| + n = 7 + 4 + 4 = 15，因此是最小行动次数</text>

  <rect x="24" y="348" width="612" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="368" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">另一个示例 target = "code"：本解法给出 RR!DDRR!LUU!R!</text>
  <text x="40" y="386" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">官方示例给 RR!DDRR!UUL!R!：第 3 段它先 U 后 L，本解法先 L 后 U</text>
  <text x="40" y="402" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">两种顺序都落在板上、都是 14 条指令；题目允许返回任意最短路径，不必与示例相同</text>
</svg>
