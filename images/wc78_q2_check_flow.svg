<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="520" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：拆组 → 对齐检查 → 三条长度判定 → 计数</text>
  <text x="350" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(|s| + Σ|w|)，每个查询词只线性扫一遍，无需回溯</text>

  <rect x="170" y="62" width="360" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="87" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 把 s 拆成字母组 groups(s) = [(h,1),(e,3),(l,2),(o,3)]</text>
  <path d="M 350 102 L 350 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="112" width="588" height="346" rx="12" fill="none" stroke="#8a9ab0" stroke-width="1.3" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <rect x="170" y="126" width="360" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="151" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">② 同法得到 groups(w)，得到组数 m</text>
  <path d="M 350 166 L 350 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="350,184 452,224 350,264 248,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="229" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">m 与 s 的组数、组字符都一致？</text>

  <path d="M 452 224 L 490 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="215" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="494" y="194" width="164" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="576" y="218" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">continue：跳过该词</text>
  <text x="576" y="238" text-anchor="middle" font-size="9.5" fill="#a85a55" filter="url(#rough2)">组数不同 / 字符对不上</text>

  <path d="M 350 264 L 350 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="364" y="279" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="130" y="286" width="440" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="308" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 逐组比较长度：n1 = s 的组长，n2 = w 的组长</text>
  <text x="148" y="332" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">n2 &gt; n1 → 该组非法（只能变长，永远不能变短）</text>
  <text x="148" y="354" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">n1 &gt; n2 且 n1 &lt; 3 → 该组非法（扩张目标至少为 3）</text>
  <text x="148" y="376" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">以上都不触发 → 该组通过；任一组非法则该词淘汰</text>

  <path d="M 350 390 L 350 408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="228" y="410" width="244" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="436" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">④ 全部组通过 → ans += 1</text>

  <path d="M 350 458 L 350 468" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 228 431 L 124 431 L 124 146 L 164 146" stroke="#8a9ab0" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="300" text-anchor="middle" font-size="9.5" fill="#8a9ab0" transform="rotate(-90 84 300)" filter="url(#rough2)">处理下一个 w</text>

  <rect x="270" y="470" width="160" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="493" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
