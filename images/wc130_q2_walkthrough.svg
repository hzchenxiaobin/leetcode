<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：n = 2 的两次取余</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">低位先产生，最后反转</text>
  <rect x="35.0" y="72.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">轮次</text>
  <rect x="95.0" y="72.0" width="90.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">当前 n</text>
  <rect x="185.0" y="72.0" width="110.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r = n mod 2</text>
  <rect x="295.0" y="72.0" width="160.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">新 q = (n-r)/(-2)</text>
  <rect x="455.0" y="72.0" width="100.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="505.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">已得低位</text>
  <rect x="35.0" y="104.0" width="60.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="95.0" y="104.0" width="90.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="185.0" y="104.0" width="110.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="295.0" y="104.0" width="160.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(2-0)/(-2) = -1</text>
  <rect x="455.0" y="104.0" width="100.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="505.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="35.0" y="136.0" width="60.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="95.0" y="136.0" width="90.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-1</text>
  <rect x="185.0" y="136.0" width="110.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="295.0" y="136.0" width="160.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(-1-1)/(-2) = 1</text>
  <rect x="455.0" y="136.0" width="100.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="505.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">01</text>
  <rect x="35.0" y="168.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="65.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="95.0" y="168.0" width="90.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="185.0" y="168.0" width="110.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="295.0" y="168.0" width="160.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(1-1)/(-2) = 0</text>
  <rect x="455.0" y="168.0" width="100.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="505.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">011</text>
  <text x="35.0" y="206.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">低位序列 0,1,1 → 反转得 "110"</text>
  <rect x="60.0" y="224.0" width="56.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="88.0" y="252.4" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="88.0" y="288.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">× 4</text>
  <rect x="180.0" y="224.0" width="56.0" height="46.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="208.0" y="252.4" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="208.0" y="288.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">× (-2)</text>
  <rect x="300.0" y="224.0" width="56.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="328.0" y="252.4" font-size="16" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="328.0" y="288.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">× 1</text>
  <text x="430.0" y="250.0" font-size="13" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">4 - 2 + 0 = 2 ✓</text>
  <text x="25.0" y="326.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">高位在左：(-2)^2 的权值是 +4，(-2)^1 是 -2，两者相抵。</text>
</svg>
