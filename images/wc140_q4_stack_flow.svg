<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="490" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一遍扫描 + 单调栈</text>
  <text x="300" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">last[c] 预存最后出现位置，栈维护「当前最优前缀」，inStack 标记防止重复</text>

  <rect x="110" y="58" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 预处理 last[c] = c 在 s 中最后出现的下标</text>
  <path d="M 300 92 L 300 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="112" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="134" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② 枚举 i = 0 … n−1，令 c = s[i]</text>
  <path d="M 300 146 L 300 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,170 430,204 300,238 170,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="208" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">c 已在栈中？</text>

  <path d="M 430 204 L 452 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="454" y="188" width="122" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="515" y="209" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">跳过（continue）</text>

  <path d="M 300 238 L 300 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="254" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>

  <rect x="60" y="262" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="283" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">③ while 栈非空 &amp;&amp; 栈顶 &gt; c &amp;&amp; last[栈顶] &gt; i：</text>
  <text x="90" y="302" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">弹出栈顶 x，并清除 inStack[x]（x 之后还能再补回来）</text>
  <path d="M 300 318 L 300 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="342" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="365" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">④ 压入 c，令 inStack[c] = true</text>
  <path d="M 300 378 L 300 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="402" width="360" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⑤ 扫描结束，栈内字符按序拼接即答案</text>

  <text x="300" y="468" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：s = "cbacdcbc"，栈最终为 a c d b → 返回 "acdb"</text>
</svg>
