<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三段天数分解：整年 + 整月 + 当月</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">total = 从 1971-01-01 走到 day/month/year 共经过的天数</text>

  <rect x="50" y="64" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="82" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">① 整年部分　1971-01-01 → year-01-01</text>
  <text x="66" y="102" font-size="10" fill="#3a4a66" filter="url(#rough2)">days₁ = 365 × (year − 1971) + ( L(year−1) − L(1970) )</text>
  <text x="66" y="118" font-size="9.5" fill="#6b7a92" filter="url(#rough2)">L(x) = ⌊x/4⌋ − ⌊x/100⌋ + ⌊x/400⌋ 表示 [1, x] 内的闰年个数</text>

  <path d="M 290 128 L 290 144" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="146" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="168" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 整月部分　year-01-01 → year-month-01</text>
  <text x="66" y="188" font-size="10" fill="#3a5a30" filter="url(#rough2)">days₂ = 1 月到 month−1 月的月长之和</text>
  <text x="66" y="204" font-size="9.5" fill="#5c7a50" filter="url(#rough2)">只有 month &gt; 2 且 year 是闰年时，2 月才按 29 天算（补 1 天）</text>

  <path d="M 290 210 L 290 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="228" width="480" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="250" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 当月部分　year-month-01 → year-month-day</text>
  <text x="66" y="272" font-size="10" fill="#8a3a36" filter="url(#rough2)">days₃ = day − 1　（月初到当天，不算当天本身）</text>

  <path d="M 290 292 L 290 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="310" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">total = days₁ + days₂ + days₃</text>
  <text x="290" y="352" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">idx = (total + 5) mod 7　　（1971-01-01 是周五 ⇒ 偏移 5）</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="42" y="372" width="64" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="5"/>
    <text x="74" y="392" fill="#555">Sunday</text>
    <rect x="114" y="372" width="64" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="5"/>
    <text x="146" y="392" fill="#555">Monday</text>
    <rect x="186" y="372" width="64" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="5"/>
    <text x="218" y="392" fill="#555">Tuesday</text>
    <rect x="258" y="372" width="64" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="5"/>
    <text x="290" y="392" fill="#555">Wednesday</text>
    <rect x="330" y="372" width="64" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="5"/>
    <text x="362" y="392" fill="#555">Thursday</text>
    <rect x="402" y="372" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <text x="434" y="392" fill="#8a6a20" font-weight="bold">Friday</text>
    <rect x="474" y="372" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="506" y="392" fill="#8a3a36" font-weight="bold">Saturday</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="74" y="414">0</text>
    <text x="146" y="414">1</text>
    <text x="218" y="414">2</text>
    <text x="290" y="414">3</text>
    <text x="362" y="414">4</text>
    <text x="434" y="414">5</text>
    <text x="506" y="414">6</text>
  </g>

  <text x="434" y="432" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">锚点：1971-01-01</text>
  <text x="506" y="432" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">例：2019-08-31</text>
  <text x="290" y="452" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">名字表必须从 Sunday 起排（index 0..6），下标由 (total + 5) mod 7 唯一确定</text>
</svg>
