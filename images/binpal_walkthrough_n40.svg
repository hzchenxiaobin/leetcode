<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="700" height="480" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">演算：n = 40 = 101000（L=6，H=W=3，h = 40≫3 = 101）</text>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="50" y="48" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="48" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="500" y="48" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="50" y="78" width="180" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="230" y="78" width="270" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="500" y="78" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="50" y="106" width="180" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="230" y="106" width="270" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="500" y="106" width="90" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="50" y="134" width="180" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="230" y="134" width="270" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="500" y="134" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="50" y="162" width="180" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="230" y="162" width="270" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="500" y="162" width="90" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="50" y="190" width="180" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="230" y="190" width="270" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="500" y="190" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="50" y="218" width="180" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="230" y="218" width="270" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="500" y="218" width="90" height="28" fill="#f4f4f4" stroke="#999" stroke-width="1"/>
    <rect x="50" y="246" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="246" width="270" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="500" y="246" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="50" y="274" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="230" y="274" width="270" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="500" y="274" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="50" y="302" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="230" y="302" width="270" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="500" y="302" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="140" y="68" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">来源</text>
  <text x="365" y="68" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">计入的回文数</text>
  <text x="545" y="68" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">个数</text>

  <text x="140" y="97" text-anchor="middle" font-size="12.5" fill="#333">k = 0</text>
  <text x="365" y="97" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="545" y="97" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="140" y="125" text-anchor="middle" font-size="12.5" fill="#333">位数 t = 1</text>
  <text x="365" y="125" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="545" y="125" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="140" y="153" text-anchor="middle" font-size="12.5" fill="#333">t = 2</text>
  <text x="365" y="153" text-anchor="middle" font-size="12.5" fill="#333">3 = 11</text>
  <text x="545" y="153" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="140" y="181" text-anchor="middle" font-size="12.5" fill="#333">t = 3</text>
  <text x="365" y="181" text-anchor="middle" font-size="12.5" fill="#333">5 = 101、7 = 111</text>
  <text x="545" y="181" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="140" y="209" text-anchor="middle" font-size="12.5" fill="#333">t = 4</text>
  <text x="365" y="209" text-anchor="middle" font-size="12.5" fill="#333">9 = 1001、15 = 1111</text>
  <text x="545" y="209" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="140" y="237" text-anchor="middle" font-size="12.5" fill="#333">t = 5</text>
  <text x="365" y="237" text-anchor="middle" font-size="12.5" fill="#333">17、21、27、31</text>
  <text x="545" y="237" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="140" y="265" text-anchor="middle" font-size="12.5" fill="#2e5e22">t = 6，前缀 100</text>
  <text x="365" y="265" text-anchor="middle" font-size="12.5" fill="#2e5e22">33 = 100001 ✓</text>
  <text x="545" y="265" text-anchor="middle" font-size="12.5" fill="#2e5e22" font-weight="bold">1</text>
  <text x="140" y="293" text-anchor="middle" font-size="12.5" fill="#8e3a34">t = 6，前缀 101</text>
  <text x="365" y="293" text-anchor="middle" font-size="12.5" fill="#8e3a34">45 = 101101 &gt; 40 ✗</text>
  <text x="545" y="293" text-anchor="middle" font-size="12.5" fill="#8e3a34" font-weight="bold">0</text>
  <text x="140" y="324" text-anchor="middle" font-size="13.5" fill="#7a5416" font-weight="bold">合计</text>
  <text x="365" y="324" text-anchor="middle" font-size="12.5" fill="#7a5416">—</text>
  <text x="545" y="324" text-anchor="middle" font-size="14" fill="#7a5416" font-weight="bold">12</text>

  <!-- low-half comparison -->
  <text x="350" y="362" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">前缀 h = 101 的判定：高半相同，只比低 3 位</text>
  <g filter="url(#sk)">
    <rect x="90" y="378" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="378" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="158" y="378" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="378" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="240" y="378" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="274" y="378" width="32" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="90" y="420" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="420" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="158" y="420" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="420" width="32" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
    <rect x="240" y="420" width="32" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
    <rect x="274" y="420" width="32" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5"/>
  </g>
  <path d="M 196 374 L 196 456" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="106" y="399" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="140" y="399" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="174" y="399" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="222" y="399" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="256" y="399" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="290" y="399" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="106" y="441" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="140" y="441" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="174" y="441" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="222" y="441" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="256" y="441" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="290" y="441" text-anchor="middle" font-size="14" fill="#333">0</text>
  <text x="60" y="399" text-anchor="end" font-size="11.5" fill="#555">pal(h)</text>
  <text x="60" y="441" text-anchor="end" font-size="11.5" fill="#555">n</text>
  <text x="330" y="395" font-size="12.5" fill="#8e3a34">高半：101 = 101（相同）</text>
  <text x="330" y="418" font-size="12.5" fill="#8e3a34">低半：101 &gt; 000 ⟹ 45 &gt; 40</text>
  <text x="330" y="441" font-size="12.5" fill="#8e3a34" font-weight="bold">前缀 101 不计入</text>
</svg>
