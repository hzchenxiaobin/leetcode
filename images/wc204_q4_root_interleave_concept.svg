<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：根固定 · 左右子序列保序 · 交错自由</text>
  <path d="M 120 34 Q 280 40 440 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Left panel: nums -> BST -->
  <rect x="14" y="44" width="252" height="290" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">原数组插入得 BST</text>

  <text x="38" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="63" y="76" width="26" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="95" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="127" y="76" width="26" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="159" y="76" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="191" y="76" width="26" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="108" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="172" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="204" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 140 106 L 140 128" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 129 159 Q 103 175 95 187" stroke="#999999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 151 159 Q 177 175 185 187" stroke="#999999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 94 213 Q 103 226 112 236" stroke="#999999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 200 213 Q 209 226 218 236" stroke="#999999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="140" cy="150" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="86" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="194" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="116" cy="250" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="224" cy="250" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="86" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="194" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="116" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="224" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>

  <text x="101" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">L = [1, 2]</text>
  <text x="196" y="288" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R = [4, 5]</text>
  <text x="140" y="312" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">首元素必为根；后续按 &lt; / &gt; 分流</text>

  <!-- Right panel: three rules -->
  <rect x="280" y="44" width="266" height="290" rx="10" fill="#ffffff" stroke="#e3e3e0" filter="url(#rough2)"/>
  <text x="413" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合法重排的三条铁律</text>

  <rect x="294" y="78" width="238" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 首元素必须仍是 3（根不变）</text>

  <rect x="294" y="118" width="238" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="138" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② {1, 2} 内部保持 1 → 2 的顺序</text>

  <rect x="294" y="158" width="238" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ {4, 5} 内部保持 4 → 5 的顺序</text>

  <rect x="294" y="198" width="238" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="413" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">④ 左右交错完全自由 → C(4,2) = 6 种</text>

  <text x="392" y="283" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">交错一例：</text>
  <rect x="400" y="266" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="428" y="266" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="456" y="266" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="484" y="266" width="24" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="512" y="266" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="440" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="468" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="496" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="524" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="413" y="308" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">左（绿）、右（蓝）穿插顺序任意</text>

  <!-- Bottom band -->
  <rect x="14" y="346" width="532" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">★ f(nums) = C(l+r, l) × f(L) × f(R)　·　答案 = f(nums) − 1</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">交错方案数 × 左子问题 × 右子问题 —— 规模缩小、结构不变，一路分治到底</text>
</svg>
