<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">枚举右端点 r：p = 已出现 "abc" 的最大起始下标</text>
  <rect x="100" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="126.0" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=0</text>
  <rect x="156" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="182.0" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=1</text>
  <rect x="212" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="238.0" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=2</text>
  <rect x="268" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="294.0" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r=3</text>
  <text x="70" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">r</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">s[r]</text>
  <text x="250" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">更新后 p</text>
  <text x="390" y="146" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新增 r−p</text>
  <line x1="50" y1="156" x2="470" y2="156" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="250" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="390" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="250" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="70" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="390" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="70" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="250" y="266" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="390" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="50" y="286" width="420" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="304" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么是 r−p</text>
  <text x="62" y="320" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">r=3 时 s[1..3]="bac" 不是 "abc"，但更早的 s[0..2]="abc" 已出现，</text>
  <text x="62" y="335" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">故 p 仍为 0：任何以 r=3 结尾、起点 ≤ 0 的子串都含 "abc"。</text>
  <text x="62" y="350" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">合法起点必须 > p，共 r−p 个；累计 Σ(r−p) = 10。</text>
</svg>
