<svg xmlns="http://www.w3.org/2000/svg" width="700" height="382" viewBox="0 0 700 382"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="382" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">哪些配对真能做出来：禁止交叉，允许嵌套与并列</text>
  <text x="350" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">弧 = 一次「删相邻两个」的操作；每个位置只属于一条弧</text>

  <text x="160" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">交叉 ✗ 无解</text>
  <g>
    <circle cx="64" cy="132" r="5" fill="#b85450" filter="url(#rough2)"/>
    <circle cx="130" cy="132" r="5" fill="#b85450" filter="url(#rough2)"/>
    <circle cx="196" cy="132" r="5" fill="#b85450" filter="url(#rough2)"/>
    <circle cx="262" cy="132" r="5" fill="#b85450" filter="url(#rough2)"/>
    <text x="64" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">1</text>
    <text x="130" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">2</text>
    <text x="196" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">3</text>
    <text x="262" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">4</text>
  </g>
  <path d="M 64 126 C 90 76, 170 76, 196 126" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 130 126 C 156 92, 236 92, 262 126" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="163" y="169" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(1,3) 要相邻 ⇒ 2 必须先没了</text>
  <text x="163" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(2,4) 要相邻 ⇒ 3 必须先没了</text>
  <text x="163" y="203" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">互为前提，死循环</text>

  <text x="530" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">嵌套 / 并列 ✓ 可行</text>
  <g>
    <circle cx="434" cy="132" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="500" cy="132" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="566" cy="132" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <circle cx="632" cy="132" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
    <text x="434" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">1</text>
    <text x="500" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">2</text>
    <text x="566" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">3</text>
    <text x="632" y="120" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">4</text>
  </g>
  <path d="M 434 126 C 460 62, 606 62, 632 126" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 500 126 C 512 100, 554 100, 566 126" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="533" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">先删 (2,3) → 1 与 4 相邻 → 删 (1,4)</text>
  <text x="533" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">并列 (1,2)(3,4) 与嵌套 (2,3)(1,4) 都行</text>
  <text x="533" y="203" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">单元素随时可删，不会挡路</text>

  <rect x="36" y="220" width="628" height="146" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="244" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">平衡标记引理：吸收者记 C（k 个）、被吸收者记 A（k 个），任意排布都能非交叉配成对</text>
  <text x="54" y="268" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① 只要序列里 C、A 都有，就一定存在「相邻且异色」的一对（C A 或 A C）</text>
  <text x="54" y="290" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② 把这一对配掉并从序列里删除：它的区间是空的，不会和任何弧交叉</text>
  <text x="54" y="312" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">③ 剩下的序列仍平衡（各少一个），对长度归纳即得非交叉配对</text>
  <text x="54" y="338" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 位置完全不是障碍：只要「所有 C 的 g ≥ 所有 A 的 g」，收益就是前 k 大 g 之和</text>
  <text x="54" y="358" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">（于是取 g 最大的 k 个当 C、其余任取 k 个当 A，就是最优，不需要任何区间 DP）</text>
</svg>
