<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：从 (1,3) 出发的 DFS 走查</text>

  <!-- 局部 3x2 网格：行0..2, 列2..3，格子 90x56，起点 (100,60) -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="100" y="60" width="90" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="145" y="93" text-anchor="middle" fill="#888">(0,2)=1</text>
    <rect x="190" y="60" width="90" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="235" y="93" text-anchor="middle" fill="#888">(0,3)=0</text>

    <rect x="100" y="116" width="90" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="145" y="149" text-anchor="middle" fill="#888">(1,2)=0</text>
    <rect x="190" y="116" width="90" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="235" y="149" text-anchor="middle" fill="#7a5a10">(1,3)=3</text>

    <rect x="100" y="172" width="90" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="145" y="205" text-anchor="middle" fill="#888">(2,2)=0</text>
    <rect x="190" y="172" width="90" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="235" y="205" text-anchor="middle" fill="#7a5a10">(2,3)=4</text>
  </g>

  <!-- DFS 路径箭头 -->
  <path d="M 235 144 L 235 170" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="250" y="162" font-size="11" fill="#7a5a10" filter="url(#rough2)">向下是水域，进递归</text>

  <!-- 右侧步骤 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="330" y="66" width="170" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="415" y="86" text-anchor="middle" fill="#2f4a66">第 1 步：进 (1,3)</text>
    <text x="415" y="102" text-anchor="middle" fill="#2f4a66">捕 3 条，sum = 3</text>

    <rect x="330" y="126" width="170" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="415" y="146" text-anchor="middle" fill="#2f4a66">第 2 步：进 (2,3)</text>
    <text x="415" y="162" text-anchor="middle" fill="#2f4a66">捕 4 条，sum = 7</text>

    <rect x="330" y="186" width="170" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="415" y="206" text-anchor="middle" fill="#2f5527">四邻全是陆地/出界</text>
    <text x="415" y="222" text-anchor="middle" fill="#2f5527">返回块和 7 ★</text>
  </g>

  <text x="100" y="266" font-size="13" fill="#333" filter="url(#rough2)">(1,3) 的上邻居 (0,3) 与左邻居 (1,2) 都是陆地，</text>
  <text x="100" y="288" font-size="13" fill="#333" filter="url(#rough2)">所以块就是 {(1,3), (2,3)}，鱼量 3 + 4 = 7。</text>
  <text x="100" y="310" font-size="12" fill="#7a5a10" filter="url(#rough2)">若从 (0,1) 那块出发，只能得 3；从 (3,1) 出发得 5 —— 都不是最优。</text>
</svg>
