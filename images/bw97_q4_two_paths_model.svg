<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两条不相交路径 ⇔ 翻一格断不了</text>

  <!-- 示例 2 网格 [[1,1,1],[1,0,1],[1,1,1]] -->
  <text x="140" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">答案 false：有两条不相交路径</text>
  <g filter="url(#rough2)">
    <rect x="80" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="118" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="156" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="80" y="112" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="118" y="112" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="156" y="112" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="80" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="118" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="156" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <!-- 上路径 -->
  <path d="M 99 93 L 137 93 L 175 93 L 175 131 L 175 169" fill="none" stroke="#446688" stroke-width="3" filter="url(#rough2)" opacity="0.8"/>
  <text x="99" y="92" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">起</text>
  <text x="175" y="185" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">终</text>
  <!-- 下路径 -->
  <path d="M 99 131 L 99 169 L 137 169 L 175 169" fill="none" stroke="#b85450" stroke-width="3" stroke-dasharray="7 4" filter="url(#rough2)" opacity="0.85"/>
  <text x="205" y="105" font-size="12" fill="#446688" filter="url(#rough2)">上路</text>
  <text x="205" y="165" font-size="12" fill="#b85450" filter="url(#rough2)">下路</text>
  <text x="140" y="215" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">翻掉任何一格，另一条仍通</text>

  <!-- 示例 1 网格 [[1,1,1],[1,0,0],[1,1,1]] -->
  <text x="415" y="62" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">答案 true：所有路都挤过 (1,0)</text>
  <g filter="url(#rough2)">
    <rect x="340" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="378" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="416" y="74" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="340" y="112" width="38" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="378" y="112" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="416" y="112" width="38" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="340" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="378" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="416" y="150" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <!-- 唯一通道 -->
  <path d="M 359 93 L 359 131 L 359 169 L 397 169 L 435 169" fill="none" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <text x="359" y="107" font-size="15" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="466" y="120" font-size="11.5" fill="#b85450" filter="url(#rough2)">翻转</text>
  <text x="466" y="136" font-size="11.5" fill="#b85450" filter="url(#rough2)">(1,0)</text>
  <text x="415" y="215" font-size="12" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">上路 (0,2) 被 0 挡死，唯一瓶颈可一击致命</text>

  <!-- 底部结论 -->
  <rect x="60" y="240" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="13" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">割点视角：所有路径共享的中间格子 = 单格割</text>
  <text x="280" y="277" text-anchor="middle" font-size="12" fill="#2d4a66" filter="url(#rough2)">（Menger 定理：最小点割大小 = 不相交路径最大条数）</text>

  <rect x="60" y="296" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">两次 DFS：走一条删一条，再走一条试试</text>

  <rect x="60" y="344" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">初始就不连通（第一次 DFS 失败）也直接返回 true</text>
</svg>
