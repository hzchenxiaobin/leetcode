<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">O(1) 判定流程：不必真的反转，只看末位</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="255" y="52" width="130" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">输入 num</text>
  <path d="M 320 90 L 320 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,110 428,146 320,182 212,146" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">num == 0 ?</text>
  <text x="350" y="136" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 432 146 L 462 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="466" y="128" width="148" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="540" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 true</text>
  <text x="540" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">0 反转仍是 0（特例）</text>
  <text x="330" y="198" font-size="12" fill="#666">否</text>
  <path d="M 320 186 L 320 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,208 428,244 320,280 212,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#c09028">num % 10 == 0 ?</text>
  <text x="350" y="228" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <path d="M 432 244 L 462 244" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="466" y="226" width="148" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="540" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false</text>
  <text x="540" y="258" text-anchor="middle" font-size="10" fill="#b85450">尾随零必丢失</text>
  <text x="330" y="298" font-size="12" fill="#666">否</text>
  <path d="M 320 284 L 320 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="245" y="302" width="150" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 true（无损）</text>

  <g filter="url(#sk)">
    <rect x="24" y="196" width="156" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="102" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">一行判定</text>
  <text x="102" y="236" text-anchor="middle" font-size="12" fill="#333">num == 0 ||</text>
  <text x="102" y="254" text-anchor="middle" font-size="12" fill="#333">num % 10 != 0</text>
</svg>
