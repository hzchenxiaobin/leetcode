<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：s = "1010"，三类形态各算一次代价</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">答案 = 三种候选的最小代价</text>
  <rect x="28" y="82" width="156" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="106" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① 至多一个 1</text>
  <rect x="196" y="82" width="262" height="48" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="327" y="110" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">ones = 2 → 保留 1 个，翻 1 个</text>
  <rect x="470" y="82" width="62" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="501" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">代价 1</text>
  <rect x="28" y="144" width="156" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="106" y="172" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">② 全 1</text>
  <rect x="196" y="144" width="262" height="48" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="327" y="172" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">zeros = 2 → 两个 0 都翻</text>
  <rect x="470" y="144" width="62" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="501" y="172" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">代价 2</text>
  <rect x="28" y="206" width="156" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="106" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">③ 1 0…0 1</text>
  <rect x="196" y="206" width="262" height="48" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="327" y="234" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">s[3] 要翻成 1，中间 "01" 含 1 个 1</text>
  <rect x="470" y="206" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="501" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">代价 2</text>
  <rect x="28" y="292" width="504" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">三种候选取最小：min(1, 2, 2) = 1，与题面输出一致</text>
  <rect x="28" y="338" width="504" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">示例 3：s = "1000"，ones = 1 → ① 的代价 max(1-1,0) = 0</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">③ 的代价 = (s[0] != "1") + (s[-1] != "1") + 中间 1 的个数</text>
</svg>
