<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">多源 BFS：所有源同时出发，按时间步分层扩散（示例 1）</text>

  <text x="102" y="56" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">t = 0（源点入队）</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">t = 1（第一层扩散）</text>
  <text x="458" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">t = 2（冲突取 max）</text>

  <g filter="url(#rough2)">
    <rect x="36" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="80" y="64" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="124" y="64" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="36" y="108" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="80" y="108" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="124" y="108" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="36" y="152" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="80" y="152" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="124" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="58" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="146" y="179" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="102" y="128" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="146" y="128" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="58" y="172" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="102" y="172" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="146" y="128" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="58" y="128" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>

  <path d="M 172 130 L 206 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="189" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+1 步</text>

  <g filter="url(#rough2)">
    <rect x="214" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="258" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="302" y="64" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="214" y="108" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
