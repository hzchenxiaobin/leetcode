    <rect x="302" y="108" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="214" y="152" width="44" height="44" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="4"/>
    <rect x="258" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="302" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="236" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="280" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="236" y="135" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="324" y="135" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="280" y="179" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="324" y="179" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="324" y="91" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="280" y="135" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>
  <text x="236" y="179" text-anchor="middle" font-size="12" fill="#cccccc" filter="url(#rough2)">·</text>

  <path d="M 350 130 L 384 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="367" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">+1 步</text>

  <g filter="url(#rough2)">
    <rect x="392" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="436" y="64" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="480" y="64" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="392" y="108" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="436" y="108" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
