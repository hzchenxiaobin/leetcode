    <rect x="480" y="152" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="414" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="458" y="91" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="502" y="91" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="414" y="135" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="458" y="135" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="502" y="135" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="414" y="179" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="458" y="179" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="502" y="179" text-anchor="middle" font-size="15" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>

  <g filter="url(#rough2)">
    <rect x="36" y="216" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="130" y="216" width="20" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="224" y="216" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="334" y="216" width="20" height="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3,3" rx="3"/>
  </g>
  <text x="62" y="230" font-size="11" fill="#555" filter="url(#rough2)">颜色 1 的领地</text>
  <text x="156" y="230" font-size="11" fill="#555" filter="url(#rough2)">颜色 2 的领地</text>
  <text x="250" y="230" font-size="11" fill="#555" filter="url(#rough2)">同层冲突格（取 max）</text>
  <text x="360" y="230" font-size="11" fill="#555" filter="url(#rough2)">未着色</text>

  <rect x="60" y="256" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">同一时间步多个颜色到达同一格 → 取最大值（t = 2 时 1 与 2 竞争，2 胜出）</text>

  <rect x="60" y="308" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">最终颜色 = 最早到达的那批颜色中的最大值，更晚到达的颜色一律无效</text>

  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">t = 2 后全部格子已着色，扩散过程结束</text>
</svg>
