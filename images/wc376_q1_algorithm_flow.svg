<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：入桶一遍，查桶一遍</text>
  <path d="M 200 36 Q 320 44 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 阶段标签 -->
  <text x="350" y="132" font-size="13" font-weight="bold" fill="#2b6e9e">第一遍 · 入桶（摊平矩阵）</text>
  <text x="350" y="322" font-size="13" font-weight="bold" fill="#7a5415">第二遍 · 查桶（按序扫值域 1..m）</text>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="230" cy="70" rx="42" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="230" y="75" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始</text>
  <path d="M 230 86 L 230 100" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取下一格 -->
  <g filter="url(#sk)"><rect x="150" y="104" width="160" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="124" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">取下一格 v = grid[i][j]</text>
  <path d="M 230 136 L 230 150" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 入桶 -->
  <g filter="url(#sk)"><rect x="150" y="154" width="160" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="174" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">cnt[v] 自增 1</text>
  <path d="M 230 186 L 230 202" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 矩阵读完？ -->
  <g filter="url(#sk)"><path d="M 230 206 L 314 238 L 230 270 L 146 238 Z" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="230" y="243" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">矩阵读完 ?</text>

  <!-- 否：回到取下一格 -->
  <path d="M 146 238 L 105 238 L 105 120 L 148 120" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="182" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 96 182)">否，继续读格子</text>

  <!-- 是：进入第二遍 -->
  <path d="M 230 270 L 230 294" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="288" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 按序查桶 -->
  <g filter="url(#sk)"><rect x="150" y="298" width="160" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="318" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">v 从 1 到 m 逐桶检查</text>
  <path d="M 230 330 L 230 344" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 查桶判定 -->
  <g filter="url(#sk)"><rect x="140" y="348" width="180" height="48" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="230" y="368" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">cnt[v] == 2 → a = v</text>
  <text x="230" y="386" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">cnt[v] == 0 → b = v</text>

  <!-- v 自增：回到查桶头 -->
  <path d="M 140 372 L 118 372 L 118 314 L 148 314" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="109" y="345" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 109 345)">v 自增，查下一桶</text>

  <!-- v 越界 → 返回 -->
  <path d="M 230 396 L 230 412" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="408" font-size="11" fill="#888">v &gt; m（两问必有答案）</text>

  <g filter="url(#sk)"><ellipse cx="230" cy="430" rx="62" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="230" y="435" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 [a, b]</text>

  <text x="320" y="462" text-anchor="middle" font-size="12" fill="#888">两遍各 O(n²)：读矩阵一遍，扫值域一遍 —— 都贴着读取下界走</text>
</svg>
