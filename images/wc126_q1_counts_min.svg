  <text x="40.0" y="289.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">l 在三个串中各出现 2 次 → 答案里放 2 个 l；e 各出现 1 次 → 放 1 个 e</text>
  <text x="40.0" y="305.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">a、b 在 roller 中出现 0 次 → 取 min 归零，直接被淘汰（灰色格子）</text>
  <text x="40.0" y="321.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">结论：cnt[c] = min over all words of freq(c)，与串的长度、顺序都无关</text>
