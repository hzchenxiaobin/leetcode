<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="530" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">流程：探测 actual → 按奇偶决策 → prev 推进</text>
  <path d="M 160 36 Q 320 46 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="87" y="48" width="176" height="32" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="175" y="68" text-anchor="middle" font-size="11.5" fill="#2b4a66">prev = dummy; expected = 1</text>

  <path d="M 175 80 L 175 98" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="175,102 253,132 175,162 97,132" fill="#e8f0fa" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="175" y="136" text-anchor="middle" font-size="11.5" fill="#2b4a66">prev.next ≠ null ?</text>
  <text x="270" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <path d="M 253 132 L 304 132" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="308" y="114" width="150" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="383" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 dummy.next</text>

  <text x="183" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">是</text>
  <path d="M 175 162 L 175 180" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- probe -->
  <g filter="url(#sk)">
    <rect x="55" y="182" width="240" height="50" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="175" y="201" text-anchor="middle" font-size="11.5" fill="#2b4a66">① 探测：node ← prev 连走 expected 步</text>
  <text x="175" y="220" text-anchor="middle" font-size="11" fill="#2b4a66">遇 null 提前停 → 得 actual 与组尾 node</text>

  <path d="M 175 232 L 175 250" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="175,254 247,288 175,322 103,288" fill="#e8f0fa" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="175" y="292" text-anchor="middle" font-size="11.5" fill="#2b4a66">actual % 2 == 0 ?</text>

  <text x="258" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">奇</text>
  <path d="M 247 288 L 301 288" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="305" y="266" width="180" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="395" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② 原序跳过</text>
  <text x="395" y="301" text-anchor="middle" font-size="11" fill="#2e6e2e">prev ← node（组尾）</text>

  <text x="184" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07414">偶</text>
  <path d="M 175 322 L 175 340" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- reverse -->
  <g filter="url(#sk)">
    <rect x="55" y="342" width="240" height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="175" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">② 反转 [prev.next, node]</text>
  <text x="175" y="379" text-anchor="middle" font-size="11" fill="#7a5415">p ← nextGroup 起逐节点掉头</text>
  <text x="175" y="397" text-anchor="middle" font-size="11" fill="#7a5415">prev.next ← node；prev ← 原组头</text>

  <!-- merge -->
  <path d="M 175 408 L 175 424" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 395 310 L 395 441 L 254 441" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- expected++ -->
  <g filter="url(#sk)">
    <rect x="100" y="426" width="150" height="30" rx="8" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="175" y="445" text-anchor="middle" font-size="12.5" fill="#2b4a66">expected++</text>

  <!-- loop back -->
  <path d="M 100 441 L 40 441 L 40 132 L 91 132" stroke="#8a94a0" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="70" y="460" text-anchor="middle" font-size="11" fill="#8a94a0">下一组</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="300" y="470" width="310" height="50" rx="10" fill="#fff8e8" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="455" y="490" text-anchor="middle" font-size="11.5" fill="#7a5415">不变式：无论翻转与否，prev 恒指向下一组前驱</text>
  <text x="455" y="509" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">技巧：p 初始为 nextGroup，掉头后自动接回下一组</text>
</svg>
