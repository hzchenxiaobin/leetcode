<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2：{{a,z},a{b,c},{ab,z}} 的求值过程</text>
  <text x="330.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">ab 由 term2 与 term3 各贡献一次，set 只保留一份</text>

  <rect x="40" y="96" width="170" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="52" y="116" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">term 1</text>
  <text x="52" y="133" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">{a, z}</text>
  <rect x="245" y="96" width="170" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="257" y="116" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">term 2</text>
  <text x="257" y="133" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">a{b,c} → {ab, ac}</text>
  <rect x="450" y="96" width="170" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="462" y="116" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">term 3</text>
  <text x="462" y="133" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">{ab, z}</text>
  <path d="M 125 164 L 230 212" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 330 164 L 330 212" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 535 164 L 430 212" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <rect x="70" y="214" width="520" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="82" y="234" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">并集（set 去重）</text>
  <text x="82" y="251" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">{a,z} ∪ {ab,ac} ∪ {ab,z} = {a, z, ab, ac}</text>
  <path d="M 330 280 L 330 308" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <rect x="200" y="310" width="260" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="212" y="330" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">字典序输出</text>
  <text x="212" y="347" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">["a", "ab", "ac", "z"]</text>
  <text x="24" y="404" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">注意 {ab,z} 里的 ab 是「一个整体」的字母串，不会被拆成 a 和 b。</text>
</svg>
