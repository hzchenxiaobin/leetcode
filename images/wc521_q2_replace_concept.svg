<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：把 x 替换成 y 只会"缝合"两者边界，绝不拆散已有相等对</text>

  <!-- x / y 标注 -->
  <text x="206" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">y = 2</text>
  <text x="264" y="52" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">x = 3</text>

  <!-- 替换前行 -->
  <text x="58" y="84" font-size="13" fill="#666" filter="url(#rough2)">替换前</text>
  <rect x="120" y="58" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="58" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="58" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="264" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="58" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- 替换前的相邻对标记 -->
  <text x="177" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗ 不变</text>
  <text x="235" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">✗ 待缝合</text>
  <text x="293" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">✗ 待缝合</text>

  <!-- 替换箭头 -->
  <path d="M280,138 L280,170" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">所有 x=3 替换成 y=2</text>

  <!-- 替换后行 -->
  <text x="58" y="204" font-size="13" fill="#666" filter="url(#rough2)">替换后</text>
  <rect x="120" y="178" width="56" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="178" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="178" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="264" y="191" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">3→2</text>
  <text x="264" y="208" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="294" y="178" width="56" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- 替换后的相邻对标记 -->
  <text x="177" y="238" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">✗</text>
  <text x="235" y="238" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓ 新增</text>
  <text x="293" y="238" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✓ 新增</text>
  <path d="M222,250 Q264,262 307,250" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="264" y="278" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">新增 2 对 = 相邻 {3, 2} 的边界数</text>

  <!-- 三类相邻对分类说明 -->
  <rect x="28" y="296" width="156" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="320" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(x,x) 对 → (y,y)</text>
  <text x="106" y="340" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">仍相等，不丢失</text>

  <rect x="202" y="296" width="156" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">相邻 (x,y)/(y,x) → (y,y)</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">新增相等对！</text>

  <rect x="376" y="296" width="156" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="320" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">其他异值对 (a,b)</text>
  <text x="454" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">仍不相等</text>

  <text x="280" y="394" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">答案 = base（原有相等对全部保留）+ 相邻 {x,y} 边界数的最大值</text>
</svg>
