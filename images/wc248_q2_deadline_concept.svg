<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：怪物折成截止线，消灭装进分钟槽位</text>
  <path d="M 200 42 Q 450 52 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="780" height="102" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="82" font-size="13.5" font-weight="bold" fill="#33517a">第一步：把「距离 + 速度」折叠成一条整数截止线</text>
  <text x="80" y="106" font-size="11.5" fill="#444">怪物 i 恒速前进：pos(t) = dist[i] − t × speed[i]，抵达城市的真实时刻 t = dist[i] / speed[i]</text>
  <text x="80" y="128" font-size="11.5" fill="#444">武器只能在整数分钟 0, 1, 2, … 出手（开局即满电）⇒ 整数截止线 arrival = ⌈dist/speed⌉</text>
  <text x="80" y="150" font-size="11.5" font-weight="bold" fill="#b85450">向上取整的原因：恰好在某分钟开始时抵达也算输——必须在那分钟之前消灭它！</text>

  <path d="M 450 160 L 450 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 2 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="182" width="780" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="206" font-size="13.5" font-weight="bold" fill="#2e5e2e">第二步：示例 3 的三只怪物，各自的截止线</text>

  <g filter="url(#sk)">
    <rect x="90" y="220" width="200" height="96" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="190" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">怪物 0</text>
  <text x="190" y="264" text-anchor="middle" font-size="11" fill="#444">dist = 3，speed = 5</text>
  <text x="190" y="283" text-anchor="middle" font-size="11" fill="#444">真实到达 t = 0.6 分</text>
  <text x="190" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">截止线 arrival = 1</text>

  <g filter="url(#sk)">
    <rect x="350" y="220" width="200" height="96" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="450" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">怪物 1</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#444">dist = 2，speed = 3</text>
  <text x="450" y="283" text-anchor="middle" font-size="11" fill="#444">真实到达 t ≈ 0.67 分</text>
  <text x="450" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">截止线 arrival = 1</text>

  <g filter="url(#sk)">
    <rect x="610" y="220" width="200" height="96" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="710" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">怪物 2</text>
  <text x="710" y="264" text-anchor="middle" font-size="11" fill="#444">dist = 4，speed = 2</text>
  <text x="710" y="283" text-anchor="middle" font-size="11" fill="#444">真实到达 t = 2 分</text>
  <text x="710" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040">截止线 arrival = 2</text>

  <text x="80" y="332" font-size="10.5" fill="#777">注意怪物 2：t 恰为整数 2——第 2 分钟开始时「恰好抵达」，同样必须在此前消灭（这正是取整方向的意义）</text>

  <path d="M 450 340 L 450 358" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 3 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="362" width="780" height="258" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="386" font-size="13.5" font-weight="bold" fill="#8a6a1e">第三步：时间轴上的截止旗标（上）与武器槽位（下）</text>
  <text x="80" y="406" font-size="11" fill="#555">武器每分钟恰好 1 发：第 k 发固定打在第 k 分钟；槽位 k 装得下某只怪物 ⇔ 它的 arrival &gt; k</text>

  <g filter="url(#sk)">
    <path d="M 120 480 L 848 480" stroke="#5a4a2a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 120 474 L 120 486" stroke="#5a4a2a" stroke-width="1.5"/>
    <path d="M 264 474 L 264 486" stroke="#5a4a2a" stroke-width="1.5"/>
    <path d="M 408 474 L 408 486" stroke="#5a4a2a" stroke-width="1.5"/>
    <path d="M 552 474 L 552 486" stroke="#5a4a2a" stroke-width="1.5"/>
    <path d="M 696 474 L 696 486" stroke="#5a4a2a" stroke-width="1.5"/>
    <path d="M 840 474 L 840 486" stroke="#5a4a2a" stroke-width="1.5"/>
  </g>
  <text x="120" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">0</text>
  <text x="264" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">1</text>
  <text x="408" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">2</text>
  <text x="552" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">3</text>
  <text x="696" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">4</text>
  <text x="840" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a2a">5</text>
  <text x="872" y="492" font-size="11" fill="#8a6a1e">分钟</text>

  <!-- deadline pennants -->
  <g filter="url(#sk)">
    <path d="M 264 476 L 264 416" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 264 416 L 292 425 L 264 434 Z" fill="#b85450"/>
    <path d="M 264 444 L 236 453 L 264 462 Z" fill="#446688"/>
  </g>
  <text x="296" y="429" font-size="11" font-weight="bold" fill="#b85450">M1 = 1</text>
  <text x="232" y="457" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">M0 = 1</text>

  <g filter="url(#sk)">
    <path d="M 408 476 L 408 442" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 408 442 L 436 451 L 408 460 Z" fill="#4a7a3a"/>
  </g>
  <text x="440" y="455" font-size="11" font-weight="bold" fill="#4a7a3a">M2 = 2</text>

  <!-- weapon slots -->
  <g filter="url(#sk)">
    <rect x="62" y="512" width="116" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="120" y="533" text-anchor="middle" font-size="10.5" fill="#555">第 0 发（第 0 分钟）</text>
  <text x="120" y="554" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e7d32">消灭 M0 ✓</text>

  <g filter="url(#sk)">
    <rect x="206" y="512" width="116" height="54" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="264" y="533" text-anchor="middle" font-size="10.5" fill="#555">第 1 发（第 1 分钟）</text>
  <text x="264" y="554" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">M1 已抵达 ✗</text>

  <g filter="url(#sk)">
    <rect x="350" y="512" width="116" height="54" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="494" y="512" width="116" height="54" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="638" y="512" width="116" height="54" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="782" y="512" width="116" height="54" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="408" y="544" text-anchor="middle" font-size="10" fill="#999999">（游戏已结束）</text>
  <text x="552" y="544" text-anchor="middle" font-size="10" fill="#999999">（不会再有）</text>
  <text x="696" y="544" text-anchor="middle" font-size="10" fill="#999999">…</text>
  <text x="840" y="544" text-anchor="middle" font-size="10" fill="#999999">…</text>

  <text x="80" y="590" font-size="11.5" fill="#5a4a2a">M0、M1 截止线同为 1：第 0 分钟的槽位只有 1 个，装下 M0 后，M1 在第 1 分钟开始时已抵达 → 输。</text>
  <text x="80" y="610" font-size="11.5" fill="#5a4a2a">先打 M1 也一样：答案 = 1。排序贪心 =「最早截止者优先」（EDF 单机调度）。</text>
</svg>
