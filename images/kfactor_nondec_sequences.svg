<svg xmlns="http://www.w3.org/2000/svg" width="940" height="570" viewBox="0 0 940 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="570" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：多重集排序 + 逐步整除，把搜索空间压到最小</text>
  <path d="M 180 42 Q 470 50 760 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 观察一：顺序无关 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="820" height="146" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="86" font-size="13" font-weight="bold" fill="#2b6e9e">观察 1：顺序无关 ⇒ 只枚举「不下降」序列</text>

  <!-- 三个排列 -->
  <g filter="url(#sk)">
    <rect x="95" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="135" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="175" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="113" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="153" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="193" y="121" text-anchor="middle" font-size="13" fill="#333">11</text>
  <text x="153" y="148" text-anchor="middle" font-size="10" fill="#888">diff = 9</text>

  <text x="255" y="122" text-anchor="middle" font-size="16" fill="#888">≈</text>

  <g filter="url(#sk)">
    <rect x="285" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="325" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="365" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="303" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="343" y="121" text-anchor="middle" font-size="13" fill="#333">11</text>
  <text x="383" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="343" y="148" text-anchor="middle" font-size="10" fill="#888">diff = 9</text>

  <text x="445" y="122" text-anchor="middle" font-size="16" fill="#888">≈</text>

  <g filter="url(#sk)">
    <rect x="475" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="515" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="555" y="102" width="36" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="493" y="121" text-anchor="middle" font-size="13" fill="#333">11</text>
  <text x="533" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="573" y="121" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="533" y="148" text-anchor="middle" font-size="10" fill="#888">diff = 9</text>

  <path d="M 625 116 L 655 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 排序后唯一代表 -->
  <g filter="url(#sk)">
    <rect x="668" y="96" width="150" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="743" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">排序后唯一代表</text>
  <text x="743" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(2, 2, 11)</text>

  <text x="80" y="188" font-size="11" fill="#444">k 个因子的 k! 个排列是同一个多重集，max − min 相同 → 固定按 a₁ ≤ a₂ ≤ … ≤ a_k 枚举一份即可</text>

  <!-- ===== 观察二：整除 + 上界 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="224" width="820" height="150" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="248" font-size="13" font-weight="bold" fill="#7a5415">观察 2：每一步必须整除「剩余乘积」，且满足上界 d^t ≤ rem</text>

  <g filter="url(#sk)">
    <rect x="80" y="266" width="110" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="135" y="291" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n = 44</text>

  <path d="M 195 286 L 265 286" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="230" y="276" text-anchor="middle" font-size="10" fill="#7a5415">选 d₁ = 2</text>
  <text x="230" y="302" text-anchor="middle" font-size="9" fill="#999">2³ ≤ 44</text>

  <g filter="url(#sk)">
    <rect x="270" y="266" width="120" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="330" y="291" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = 22</text>

  <path d="M 395 286 L 465 286" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="276" text-anchor="middle" font-size="10" fill="#7a5415">选 d₂ = 2</text>
  <text x="430" y="302" text-anchor="middle" font-size="9" fill="#999">2² ≤ 22</text>

  <g filter="url(#sk)">
    <rect x="470" y="266" width="120" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="530" y="291" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = 11</text>

  <path d="M 595 286 L 665 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="630" y="276" text-anchor="middle" font-size="10" fill="#b85450">t = 1</text>
  <text x="630" y="302" text-anchor="middle" font-size="9" fill="#999">名额只剩 1 个</text>

  <g filter="url(#sk)">
    <rect x="670" y="266" width="180" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="760" y="291" text-anchor="middle" font-size="13" fill="#8c3a36" font-weight="bold">末因子 = 11（强制）</text>

  <text x="80" y="334" font-size="11" fill="#444">剩余 t 个因子都 ≥ 当前 d、乘积恰为 rem ⇒ d^t ≤ rem，枚举上界 rem^(1/t)；t = 2 时至多 √n ≈ 316</text>
  <text x="80" y="356" font-size="11" fill="#444">t = 1 时最后一个因子被唯一确定为 rem，无需枚举（d² ≤ rem 保证 rem/d ≥ d，不下降性自动维持）</text>

  <!-- ===== 效果：候选坍缩 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="394" width="820" height="152" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="80" y="418" font-size="13" font-weight="bold" fill="#2e6e2e">效果：n = 44, k = 3 —— 216 种有序组合坍缩成 4 个候选</text>

  <g filter="url(#sk)">
    <rect x="85" y="436" width="160" height="62" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="165" y="461" text-anchor="middle" font-size="13" fill="#333">(1, 1, 44)</text>
  <text x="165" y="483" text-anchor="middle" font-size="12" fill="#888">diff = 43</text>

  <g filter="url(#sk)">
    <rect x="275" y="436" width="160" height="62" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="355" y="461" text-anchor="middle" font-size="13" fill="#333">(1, 2, 22)</text>
  <text x="355" y="483" text-anchor="middle" font-size="12" fill="#888">diff = 21</text>

  <g filter="url(#sk)">
    <rect x="465" y="436" width="160" height="62" rx="6" fill="#ffffff" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="545" y="461" text-anchor="middle" font-size="13" fill="#333">(1, 4, 11)</text>
  <text x="545" y="483" text-anchor="middle" font-size="12" fill="#c98a2b">diff = 10</text>

  <g filter="url(#sk)">
    <rect x="655" y="436" width="170" height="62" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="740" y="461" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">(2, 2, 11)</text>
  <text x="740" y="483" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">diff = 9 ✓ 最优</text>

  <text x="80" y="530" font-size="11" fill="#444">44 的因子数 D = 6：暴力枚举有序组合有 6³ = 216 种；「不下降 + 整除 + 上界」三重约束后只剩 4 片叶子</text>
</svg>
