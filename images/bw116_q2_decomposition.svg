<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两种分解对比：按任意偶块划分 ⇔ 按定长 2 划分，后者不改答案</text>

  <!-- 上排：奇偶嵌套的划分 -->
  <g filter="url(#rough2)">
    <text x="70" y="60" font-size="12.5" fill="#446688">例 s = 00001111：合法划分 A（两块）与划分 B（四块）</text>

    <rect x="70" y="72" width="118" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="129" y="93" text-anchor="middle" font-size="12" fill="#333">0000</text>
    <rect x="188" y="72" width="118" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="247" y="93" text-anchor="middle" font-size="12" fill="#333">1111</text>
    <text x="160" y="122" text-anchor="middle" font-size="11.5" fill="#888">划分 A：两个长 4 的同色块</text>

    <path d="M 328 88 C 348 88, 352 88, 366 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="370" y="72" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="400" y="72" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="430" y="72" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="460" y="72" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="430" y="122" text-anchor="middle" font-size="11.5" fill="#888">划分 B：定长 2</text>
  </g>

  <!-- 中：等价性 -->
  <g filter="url(#rough2)">
    <rect x="40" y="140" width="220" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.55"/>
    <text x="150" y="164" text-anchor="middle" font-size="13" fill="#d6a040">观察 1：块长总是偶数</text>
    <text x="56" y="190" font-size="12" fill="#555">任何合法划分的块都可再</text>
    <text x="56" y="210" font-size="12" fill="#555">对半切成两个更小的块，</text>
    <text x="56" y="230" font-size="12" fill="#555">仍同色 → 一路切到长 2</text>

    <rect x="280" y="140" width="220" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="390" y="164" text-anchor="middle" font-size="13" fill="#4a7a3a">观察 2：同色对 = 定长对</text>
    <text x="296" y="190" font-size="12" fill="#555">定长 2 划分中每对相同时，</text>
    <text x="296" y="210" font-size="12" fill="#555">这对自身就是合法划分的</text>
    <text x="296" y="230" font-size="12" fill="#555">一块 → 全部相同 ⇔ 美丽</text>
  </g>

  <!-- 底 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="460" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="58" y="298" font-size="13" fill="#b85450">于是：改动数下界 = 不同对数，且逐一修好即达上界 → 答案 = 不同对数</text>
    <text x="58" y="324" font-size="12" fill="#888">s = 1001 的两对 (1,0)、(0,1) 各改一次得 1100 = 11|00，共 2 次</text>
  </g>
</svg>
