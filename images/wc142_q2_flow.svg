<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">拼车判定流程</text>
  <text x="310.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">区间加 → 前缀和 → 逐位置与 capacity 比较</text>

  <rect x="150" y="78" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="106.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">每个行程 → 区间加 num</text>
  <rect x="150" y="148" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="175.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">diff[from] += num；diff[to] -= num</text>
  <rect x="150" y="218" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="246.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p = 0..1000：cur += diff[p]</text>
  <polygon points="300,288 392,316 300,344 208,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">cur &gt; capacity ?</text>
  <rect x="452" y="294" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="512.0" y="321.9" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">return false</text>
  <rect x="150" y="370" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="397.2" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">扫完 → return true</text>
  <path d="M 300 122 L 300 144" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 300 192 L 300 214" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 300 262 L 300 284" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 392 316 L 448 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr_red)" filter="url(#rough2)"/>
  <path d="M 300 344 L 300 366" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <text x="430" y="342" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="310" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="24" y="424" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">只要某个位置超载就立即返回 false；全部位置通过才可行。</text>
</svg>
