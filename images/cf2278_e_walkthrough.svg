<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="420" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组官方样例演算：先取反成 b，再排序切成 −/+ 两段</text>
  <path d="M 128 42 Q 410 48 692 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="36" y="72" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输入 a</text>
  <text x="206" y="72" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b_i = (−1)^(i−1)a_i</text>
  <text x="396" y="72" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">排序后的 b</text>
  <text x="576" y="72" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">切分（⌊n/2⌋ 个取 −）</text>
  <text x="760" y="72" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案</text>
  <path d="M 32 82 L 788 82" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="32" y="92" width="756" height="42" rx="6" fill="#f4f7fb" stroke="#dfe7f0" stroke-width="1" filter="url(#rough2)"/>
  <text x="36" y="118" font-size="12" fill="#333" filter="url(#rough2)">[−3]</text>
  <text x="206" y="118" font-size="12" fill="#333" filter="url(#rough2)">[−3]</text>
  <text x="396" y="118" font-size="12" fill="#333" filter="url(#rough2)">[−3]</text>
  <text x="576" y="118" font-size="12" fill="#333" filter="url(#rough2)">o = 0：无 − 项</text>
  <text x="760" y="118" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">−3</text>

  <rect x="32" y="140" width="756" height="42" rx="6" fill="#eef7f0" stroke="#d8ebdd" stroke-width="1" filter="url(#rough2)"/>
  <text x="36" y="166" font-size="12" fill="#333" filter="url(#rough2)">[1, −2, −3, 4]</text>
  <text x="206" y="166" font-size="12" fill="#333" filter="url(#rough2)">[1, 2, −3, −4]</text>
  <text x="396" y="166" font-size="12" fill="#333" filter="url(#rough2)">[−4, −3, 1, 2]</text>
  <text x="576" y="166" font-size="12" fill="#333" filter="url(#rough2)">−4, −3 | 1, 2</text>
  <text x="760" y="166" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">10</text>

  <rect x="32" y="188" width="756" height="42" rx="6" fill="#fdf2f4" stroke="#f2dbe0" stroke-width="1" filter="url(#rough2)"/>
  <text x="36" y="214" font-size="12" fill="#333" filter="url(#rough2)">[−10, 1, 0, 1, −10]</text>
  <text x="206" y="214" font-size="12" fill="#333" filter="url(#rough2)">[−10, −1, 0, −1, −10]</text>
  <text x="396" y="214" font-size="12" fill="#333" filter="url(#rough2)">[−10, −10, −1, −1, 0]</text>
  <text x="576" y="214" font-size="12" fill="#333" filter="url(#rough2)">−10, −10 | −1, −1, 0</text>
  <text x="760" y="214" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">18</text>

  <rect x="32" y="236" width="756" height="42" rx="6" fill="#f4f7fb" stroke="#dfe7f0" stroke-width="1" filter="url(#rough2)"/>
  <text x="36" y="262" font-size="12" fill="#333" filter="url(#rough2)">[6, −7]</text>
  <text x="206" y="262" font-size="12" fill="#333" filter="url(#rough2)">[6, 7]</text>
  <text x="396" y="262" font-size="12" fill="#333" filter="url(#rough2)">[6, 7]</text>
  <text x="576" y="262" font-size="12" fill="#333" filter="url(#rough2)">6 | 7</text>
  <text x="760" y="262" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <rect x="32" y="296" width="368" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="320" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 2 组：10 = (1+2) − (−4−3)</text>
  <text x="46" y="342" font-size="11.5" fill="#446688" filter="url(#rough2)">b 里最小的两个正好是 −4、−3，</text>
  <text x="46" y="362" font-size="11.5" fill="#446688" filter="url(#rough2)">放进 −1 位反成 +4、+3 的贡献，</text>
  <text x="46" y="382" font-size="11.5" fill="#446688" filter="url(#rough2)">于是 10 = Σ|a|，一点没浪费。</text>

  <rect x="420" y="296" width="368" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="320" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 3 组：18 = (−2) − (−20)</text>
  <text x="434" y="342" font-size="11.5" fill="#8a6015" filter="url(#rough2)">Σ|a| = 22 看似可达，但交替和</text>
  <text x="434" y="362" font-size="11.5" fill="#8a6015" filter="url(#rough2)">c = −10−1+0−1−10 = −22 是不变量；</text>
  <text x="434" y="382" font-size="11.5" fill="#8a6015" filter="url(#rough2)">全正需三个正号位之和为 0，最小也 2。</text>
</svg>
