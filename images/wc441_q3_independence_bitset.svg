<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">核心观察：任选子集 ⇒ 下标独立，每个下标一场子集和背包</text>

  <!-- 一条查询与其子集选择 -->
  <rect x="40" y="54" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">查询 [l=1, r=4, v=2]</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">在范围 [1,4] 内任选下标子集</text>

  <path d="M 224,77 L 250,77" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="258" y="54" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="281" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="281" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓ 减 2</text>

  <rect x="314" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="337" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="337" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不减</text>

  <rect x="370" y="54" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="393" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="393" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">✓ 减 2</text>

  <rect x="426" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="449" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不减</text>

  <text x="320" y="130" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">下标 2、4 选不选，不影响 1、3 —— 每个下标是独立的「开关」</text>

  <!-- 左面板：券袋 -->
  <rect x="40" y="146" width="270" height="196" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下标 4 的「券袋」（按查询序）</text>

  <rect x="58" y="180" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="118" y="180" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="178" y="180" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="238" y="180" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="201" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <text x="175" y="236" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">目标：nums[4] = 6</text>
  <text x="175" y="258" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">选出一个子集，使和恰好为 6？</text>
  <text x="175" y="290" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 + 4 = 6 ✓ 命中！</text>

  <!-- 右面板：bitset 扩张 -->
  <rect x="330" y="146" width="270" height="196" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="168" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">可达和集合 f 的扩张（0..6 位）</text>
  <text x="465" y="186" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f |= f &lt;&lt; v —— 平移 + 按位或 = 一次转移</text>

  <text x="352" y="204" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">f = {0}</text>
  <rect x="352" y="210" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="225" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="408" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="421" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="436" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="449" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="464" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="477" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="492" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="505" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="520" y="210" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="533" y="225" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">6</text>

  <path d="M 556,234 L 556,246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="562" y="244" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+2</text>

  <text x="352" y="248" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">+券 2 ⇒ {0, 2}</text>
  <rect x="352" y="254" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="269" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="254" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="269" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="408" y="254" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="269" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="436" y="254" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="449" y="269" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="464" y="254" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="477" y="269" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="492" y="254" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="505" y="269" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="520" y="254" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="533" y="269" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">6</text>

  <path d="M 556,278 L 556,290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="562" y="288" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+4</text>

  <text x="352" y="292" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">+券 4 ⇒ {0, 2, 4, 6}</text>
  <rect x="352" y="298" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="313" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">0</text>
  <rect x="380" y="298" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="313" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="408" y="298" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="421" y="313" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <rect x="436" y="298" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="449" y="313" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="464" y="298" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477" y="313" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <rect x="492" y="298" width="26" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="505" y="313" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="520" y="298" width="26" height="22" rx="3" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="533" y="313" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="465" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">bit 6 = 1 ⇒ 目标 6 可凑出 ✓</text>

  <!-- 底部结论框 -->
  <rect x="40" y="358" width="560" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="386" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">子集可为空 ⇒ 「不用某条查询」永远合法 ⇒ 可达集随 k 只增不减</text>
  <text x="320" y="410" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">每个下标存在阈值 k_i（首次凑出 nums[i] 的前缀长度）</text>
  <text x="320" y="434" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">答案 = max k_i —— 木桶效应，最晚凑出的下标说了算；凑不出 ⇒ -1</text>
</svg>
