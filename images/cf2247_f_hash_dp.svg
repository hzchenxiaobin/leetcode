<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">哈希：把「经过 c 的全部路径」压成一个整数</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每条边独立随机权 x(e)；Φ(c) = 「经过 c 的所有路径」的权和 = A(c) · B(c)</text>

  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">前向：A(c) = Σ 前缀路径的权</text>
  <text x="346" y="72" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后向：B(c) = Σ 后缀路径的权</text>

  <g filter="url(#rough2)">
    <rect x="44" y="80" width="34" height="34" fill="#f4f8ff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="83" y="80" width="34" height="34" fill="#f4f8ff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="122" y="80" width="34" height="34" fill="#f4f8ff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="44" y="119" width="34" height="34" fill="#e3edfd" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="83" y="119" width="34" height="34" fill="#e3edfd" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="122" y="119" width="34" height="34" fill="#e3edfd" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="44" y="158" width="34" height="34" fill="#d0e0fb" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="83" y="158" width="34" height="34" fill="#d0e0fb" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="122" y="158" width="34" height="34" fill="#d0e0fb" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="61" y="102" text-anchor="middle" font-size="10" fill="#3a4a66">s</text>
    <text x="139" y="180" text-anchor="middle" font-size="10" fill="#3a4a66">t</text>

    <rect x="290" y="80" width="34" height="34" fill="#d8efdf" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="329" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="368" y="80" width="34" height="34" fill="#f4fbf6" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="119" width="34" height="34" fill="#d8efdf" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="329" y="119" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="368" y="119" width="34" height="34" fill="#f4fbf6" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="158" width="34" height="34" fill="#d8efdf" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="329" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="368" y="158" width="34" height="34" fill="#f4fbf6" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="385" y="102" text-anchor="middle" font-size="10" fill="#3a5a30">t</text>
    <text x="307" y="180" text-anchor="middle" font-size="10" fill="#3a5a30">s</text>
  </g>

  <text x="280" y="215" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">Φ(c) = A(c) × B(c) ：每个前缀与每个后缀唯一拼成一条经过 c 的路径</text>

  <rect x="40" y="230" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="56" y="252">A(i,j) = A(i−1,j)·x↓(i−1,j) + A(i,j−1)·x→(i,j−1)， A(1,1) = 1</text>
    <text x="56" y="274">B(i,j) = B(i+1,j)·x↓(i,j) + B(i,j+1)·x→(i,j)， B(n,m) = 1</text>
    <text x="56" y="298" fill="#8a6a20">前缀用到的边与后缀用到的边不相交 ⇒ 乘积恰好是整条路径的权</text>
  </g>

  <rect x="40" y="330" width="480" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9.5" fill="#3a5a30">
    <text x="56" y="352">2×2 例：a=(1,1)→(1,2)，b=(1,1)→(2,1)，c=(1,2)→(2,2)，d=(2,1)→(2,2)</text>
    <text x="56" y="372">Φ(s) = Φ(t) = ac + bd， Φ(1,2) = ac， Φ(2,1) = bd</text>
    <text x="56" y="392">⇒ 分组 {s,t}、{(1,2)}、{(2,1)}，与真实路径集合的分组完全一致</text>
  </g>

  <text x="280" y="430" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">权随机且非零 ⇒ 不同路径集合的权和几乎必然不同；用两套独立随机权把出错概率压到可忽略</text>
</svg>
