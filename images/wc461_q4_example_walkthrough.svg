<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [0, −2, −1, −3, 0, 2, −1]，答案 = −4</text>

  <!-- 三段弧线 -->
  <path d="M201,68 Q233,48 259,66" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="231" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">增</text>
  <path d="M265,68 Q297,48 323,66" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="295" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">降</text>
  <path d="M329,68 Q391,42 451,66" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="391" y="38" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">增</text>

  <!-- 数组格子 -->
  <rect x="105" y="78" width="64" height="44" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="106" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="169" y="78" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="201" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="233" y="78" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="297" y="78" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="329" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="361" y="78" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="393" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="425" y="78" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="457" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="489" y="78" width="64" height="44" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="106" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">−1</text>

  <!-- l p q r 标注 -->
  <text x="201" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">l</text>
  <text x="265" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">p</text>
  <text x="329" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">q</text>
  <text x="457" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">r</text>
  <text x="137" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="201" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="265" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="329" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="393" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="457" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="521" y="154" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <text x="340" y="174" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">选中窗口 nums[1..5] = [−2, −1, −3, 0, 2]，和 = −4</text>

  <!-- DP 表：表头 -->
  <rect x="25" y="188" width="80" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">i</text>
  <rect x="105" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">0</text>
  <rect x="169" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="201" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">1</text>
  <rect x="233" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">2</text>
  <rect x="297" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="329" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">3</text>
  <rect x="361" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">4</text>
  <rect x="425" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">5</text>
  <rect x="489" y="188" width="64" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">6</text>

  <!-- f1 行 -->
  <rect x="25" y="216" width="80" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">f1</text>
  <rect x="105" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="169" y="216" width="64" height="32" rx="4" fill="#e8f0fe" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="201" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="233" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="297" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="329" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="361" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="425" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="489" y="216" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−1</text>

  <!-- f2 行 -->
  <rect x="25" y="248" width="80" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">f2</text>
  <rect x="105" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="169" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="201" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="233" y="248" width="64" height="32" rx="4" fill="#e8f0fe" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="269" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="297" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="329" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="361" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="269" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="425" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="269" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="489" y="248" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- f3 行 -->
  <rect x="25" y="280" width="80" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">f3</text>
  <rect x="105" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="169" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="201" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="233" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="297" y="280" width="64" height="32" rx="4" fill="#fff8e1" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="329" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−6</text>
  <rect x="361" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="425" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="301" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="489" y="280" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="301" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- f4 行 -->
  <rect x="25" y="312" width="80" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">f4</text>
  <rect x="105" y="312" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="333" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="169" y="312" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="201" y="333" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="233" y="312" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="333" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="297" y="312" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="329" y="333" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <rect x="361" y="312" width="64" height="32" rx="4" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="333" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−6</text>
  <rect x="425" y="312" width="64" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="457" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−4</text>
  <rect x="489" y="312" width="64" height="32" rx="4" fill="#fdfdfd" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="521" y="333" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 制胜链 -->
  <rect x="40" y="360" width="360" height="105" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">制胜链：一路只做 O(1) 转移</text>
  <text x="220" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f1[1] = −2（重启）→ f2[2] = −1+(−2) = −3</text>
  <text x="220" y="426" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ f3[3] = −3+(−3) = −6（越峰）→ f4[4] = 0+(−6) = −6（越谷）</text>
  <text x="220" y="446" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">→ f4[5] = 2+(−6) = −4（尾段延长）✓</text>

  <!-- 负数提醒 -->
  <rect x="420" y="360" width="220" height="105" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">全负窗口也得选！</text>
  <text x="530" y="410" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">f1 用 max(0, ·) 丢负前缀；</text>
  <text x="530" y="432" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">f2 f3 f4 断档即 −∞，</text>
  <text x="530" y="454" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">绝不与 0 取 max</text>
</svg>
