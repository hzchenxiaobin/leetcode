<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">2f ≤ n 时：排序后「小半 ↔ 大半」配对</text>

  <!-- 排序数组 a = [1,1,2,2,3,3] -->
  <text x="46" y="86" font-size="13" fill="#666" filter="url(#rough2)">排序后</text>
  <text x="46" y="104" font-size="13" fill="#666" filter="url(#rough2)">n = 6：</text>
  <rect x="120" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="64" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="64" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="64" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="400" y="64" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="193" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="243" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="323" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="373" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="423" y="89" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 120 56 L 120 44 L 266 44 L 266 56" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="193" y="36" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">小的 n/2 个：a[0..2]</text>
  <path d="M 300 56 L 300 44 L 446 44 L 446 56" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="373" y="36" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">大的 n/2 个：a[3..5]</text>

  <!-- 配对弧线 -->
  <path d="M 143 110 C 143 150, 323 150, 323 110" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 193 110 C 193 180, 373 180, 373 110" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 243 110 C 243 210, 423 210, 423 110" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="233" y="146" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1 &lt; 2 ✓</text>
  <text x="283" y="176" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1 &lt; 3 ✓</text>
  <text x="333" y="206" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">2 &lt; 3 ✓</text>

  <!-- 底部证明要点 -->
  <rect x="36" y="240" width="448" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="266" font-size="13" fill="#333" filter="url(#rough2)">若某对 a[i] = a[i+n/2]，则这一段连续相等的值</text>
  <text x="56" y="286" font-size="13" fill="#333" filter="url(#rough2)">至少有 n/2 + 1 个，与 f ≤ n/2 矛盾 → 每对严格递增</text>
  <text x="56" y="310" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">故 2f ≤ n 时能删到只剩 n mod 2 个元素</text>
</svg>
