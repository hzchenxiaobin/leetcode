<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="312" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">栈中放候选左端点，j 从右往左扫，能配就弹出</text>
  <text x="60" y="66" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">单调栈（下标 / 值）</text>
  <rect x="60" y="76" width="96" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="104" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">0 / 6</text>
  <rect x="170" y="76" width="96" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="104" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">1 / 0</text>
  <rect x="60" y="140" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">j = 5，A[5] = 5 ≥ A[1] = 0</text>
  <path d="M 360 162 L 420 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="76" width="160" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="104" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = 5−1 = 4</text>
  <rect x="60" y="200" width="460" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">弹出后 j 左移；栈顶换成 0：A[5]=5 &lt; A[0]=6，配不上</text>
  <rect x="60" y="258" width="460" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="283" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">每个下标只入栈一次、出栈一次 ⇒ 总代价 O(n)</text>
</svg>
