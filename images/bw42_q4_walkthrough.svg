<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：nums = [1,0,0,0,0,0,1,1]，k = 3</text>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="50" y="54" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="150" y="80" font-size="13" fill="#446688" text-anchor="middle" filter="url(#rough2)">① pos = [0, 6, 7]</text>

  <path d="M 252 74 L 292 74" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <g filter="url(#rough2)">
    <rect x="296" y="54" width="214" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="403" y="80" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">② b = [0, 5, 5]（pos_j − j）</text>

  <path d="M 280 96 C 280 114, 280 122, 280 134" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <g filter="url(#rough2)">
    <rect x="50" y="138" width="200" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="150" y="164" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">③ 前缀和 pre = [0, 0, 5, 10]</text>

  <path d="M 252 158 L 292 158" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <g filter="url(#rough2)">
    <rect x="296" y="138" width="214" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="403" y="158" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">④ 窗口 [0,2]，中位 c = 1</text>
  <text x="403" y="174" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">b[c] = 5</text>

  <!-- 代价计算 -->
  <g filter="url(#rough2)">
    <rect x="60" y="196" width="440" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#b85450" text-anchor="middle">
    <text x="280" y="220">左部 = 5×2 − (pre[2] − pre[0]) = 10 − 5 = 5</text>
    <text x="280" y="246">右部 = (pre[3] − pre[2]) − 5×1 = 5 − 5 = 0</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="120" y="280" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="300" font-size="14" fill="#2d5a22" text-anchor="middle" font-weight="bold" filter="url(#rough2)">代价 = 5 + 0 = 5 ✓（最左 1 右移 5 格）</text>
</svg>
