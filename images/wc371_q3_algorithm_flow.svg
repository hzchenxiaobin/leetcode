<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="620" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：枚举两种终态 → 逐列贪心 → 取最小</text>
  <path d="M 160 32 Q 320 40 480 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="225" y="42" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">读入 nums1, nums2（n 列）</text>
  <path d="M 320 74 L 320 84" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取终态 -->
  <g filter="url(#sk)"><rect x="165" y="86" width="310" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">取一种末位终态 (a, b, cost)</text>
  <text x="320" y="123" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#sk)">A：(原末位, 0)｜B：(对调末位, 1)——两种各跑一遍</text>
  <path d="M 320 132 L 320 144" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- i = 0 -->
  <g filter="url(#sk)"><rect x="235" y="146" width="170" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="165" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#sk)">i = 0</text>
  <path d="M 320 176 L 320 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1：还有中间列？ -->
  <g filter="url(#sk)"><polygon points="320,192 452,240 320,288 188,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">i ≤ n−2 ？</text>
  <text x="320" y="256" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#sk)">还有中间列没看？</text>
  <path d="M 320 288 L 320 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="298" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <!-- 菱形 2：不换可行？ -->
  <g filter="url(#sk)"><polygon points="320,302 462,350 320,398 178,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">不换可行？</text>
  <text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#sk)">x ≤ a 且 y ≤ b</text>
  <path d="M 320 398 L 320 410" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="408" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <!-- 菱形 3：换可行？ -->
  <g filter="url(#sk)"><polygon points="320,412 458,458 320,504 182,458" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="454" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">换可行？</text>
  <text x="320" y="474" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#sk)">y ≤ a 且 x ≤ b（交叉）</text>

  <!-- 是 → cost 不变 / cost += 1 -->
  <g filter="url(#sk)"><rect x="48" y="333" width="112" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="104" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">cost 不变</text>
  <path d="M 178 350 L 166 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="174" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="48" y="441" width="112" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="104" y="462" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">cost += 1</text>
  <path d="M 182 458 L 166 458" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="448" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <!-- 回环：i += 1 -->
  <path d="M 48 350 L 26 350 L 26 161 L 231 161" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 48 458 L 26 458" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">i += 1，看下一列</text>

  <!-- 否（扫描完）→ 汇总 -->
  <path d="M 452 240 L 635 240 L 635 508 L 320 508 L 320 524" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="230" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否（扫完中间列）</text>

  <!-- 换不可行 → 终态作废 -->
  <g filter="url(#sk)"><rect x="478" y="428" width="142" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="549" y="444" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3a34" filter="url(#sk)">该终态作废</text>
  <text x="549" y="458" text-anchor="middle" font-size="10" fill="#8f3a34" filter="url(#sk)">cost 记为 +∞</text>
  <path d="M 458 458 L 476 458" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="468" y="448" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 549 464 L 549 508" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 汇总 -->
  <g filter="url(#sk)"><rect x="150" y="526" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="265" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">ans = min(costA, costB)</text>
  <text x="265" y="560" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#sk)">两种终态取最优</text>

  <!-- 输出 -->
  <path d="M 380 540 L 456 538" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="530" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">min &lt; +∞</text>
  <g filter="url(#sk)"><rect x="460" y="518" width="162" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="541" y="534" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">返回 ans</text>
  <text x="541" y="550" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#sk)">最小操作次数</text>

  <path d="M 380 556 L 420 556 L 420 590 L 456 590" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="580" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">都是 +∞</text>
  <g filter="url(#sk)"><rect x="460" y="570" width="162" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="541" y="586" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a34" filter="url(#sk)">返回 −1</text>
  <text x="541" y="602" text-anchor="middle" font-size="9.5" fill="#8f3a34" filter="url(#sk)">两种终态全作废</text>
</svg>
