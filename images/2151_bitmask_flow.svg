<svg xmlns="http://www.w3.org/2000/svg" width="680" height="710" viewBox="0 0 680 710" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="710" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：预处理掩码 → 枚举 S → 位运算验证 → 最大 popcount</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="330" cy="66" rx="42" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="155" y="94" width="350" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="155" y="152" width="350" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="155" y="210" width="350" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="220,320 330,268 440,320 330,372" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <polygon points="220,450 330,398 440,450 330,502" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="195" y="532" width="270" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="80" cy="110" rx="42" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="71" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">开始</text>
  <text x="330" y="115" text-anchor="middle" font-size="12.5" fill="#333">预处理：good[i] / bad[i] 掩码 —— O(n²)</text>
  <text x="330" y="173" text-anchor="middle" font-size="12.5" fill="#333">枚举 S = 0 … 2ⁿ−1（假想好人集合）</text>
  <text x="330" y="231" text-anchor="middle" font-size="12.5" fill="#333">取 S 中下一个成员 i（要求 i ∈ S）</text>
  <text x="330" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace">good[i] &amp; S == good[i]</text>
  <text x="330" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" font-family="monospace">且 bad[i] &amp; S == 0 ?</text>
  <text x="330" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">S 的成员</text>
  <text x="330" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">全部检查完 ?</text>
  <text x="330" y="555" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = max(ans, popcount(S))</text>
  <text x="80" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <g filter="url(#sk)">
    <path d="M 330 83 L 330 92" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 330 128 L 330 150" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 330 186 L 330 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 330 244 L 330 264" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 330 372 L 330 396" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 330 502 L 330 530" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 440 320 L 585 320 L 585 161 L 507 161" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 220 450 L 95 450 L 95 227 L 153 227" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 465 550 L 620 550 L 620 177 L 507 177" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 155 169 L 80 169 L 80 129" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="390" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="340" y="522" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <text x="452" y="312" font-size="11" font-weight="bold" fill="#b85450">否（弃 S）</text>
  <text x="212" y="440" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <text x="104" y="345" font-size="10.5" fill="#666">查下一个 i</text>
  <text x="545" y="571" text-anchor="middle" font-size="10.5" fill="#666">取下一个 S</text>
  <text x="80" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">S 取尽</text>

  <g filter="url(#sk)">
    <rect x="25" y="580" width="630" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="340" y="602" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">💡 位运算判定：good[i] &amp; S == good[i]（子集）且 bad[i] &amp; S == 0（不相交）</text>
  <text x="340" y="624" text-anchor="middle" font-size="11" fill="#444">n = 15：32768 个 S × 至多 15 次成员检查 ≈ 5×10⁵ 次位运算 —— 不剪枝也绰绰有余</text>

  <g filter="url(#sk)">
    <rect x="25" y="650" width="630" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="340" y="671" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⚠️ 可行性无单调性：例 1 中 {2} 可行但超集 {0,2} 不可行；{0,1} 可行但子集 {0} 不可行</text>
  <text x="340" y="691" text-anchor="middle" font-size="11" fill="#444">贪心扩张 / 单向剪枝都没有正确性依据 —— 老老实实枚举全部 2ⁿ 个集合</text>
</svg>
