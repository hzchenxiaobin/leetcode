<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建表 → 查表取货 → 整段核对 → 跳段前进</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <rect x="120" y="52" width="250" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="245" y="73" text-anchor="middle" font-size="12.5" fill="#2f4256" filter="url(#sk)">建表 {p[0] → p}，i = 0</text>
  <path d="M 245 86 L 245 98" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <polygon points="167,132 245,102 323,132 245,162" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="245" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">i &lt; n ?</text>
  <text x="352" y="126" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>
  <path d="M 323 132 L 452 132" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="455" y="115" width="130" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="520" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a28" filter="url(#sk)">返回 true ✓</text>
  <text x="253" y="178" font-size="11" fill="#3a6a2a" filter="url(#sk)">是</text>
  <path d="M 245 162 L 245 178" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- lookup box -->
  <rect x="120" y="182" width="250" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="245" y="203" text-anchor="middle" font-size="12.5" fill="#2f4256" filter="url(#sk)">查表：首元素 = arr[i] 的 piece</text>
  <path d="M 245 216 L 245 228" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <polygon points="175,262 245,232 315,262 245,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="245" y="267" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">查到了？</text>
  <text x="344" y="256" font-size="11" fill="#a04a44" filter="url(#sk)">否</text>
  <path d="M 315 262 L 452 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="455" y="245" width="130" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="520" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a35" filter="url(#sk)">返回 false ✗</text>
  <text x="253" y="308" font-size="11" fill="#3a6a2a" filter="url(#sk)">是</text>
  <path d="M 245 292 L 245 308" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- compare box -->
  <rect x="120" y="312" width="250" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="245" y="333" text-anchor="middle" font-size="12" fill="#2f4256" filter="url(#sk)">整段核对：arr[i+j] == p[j]</text>
  <path d="M 245 346 L 245 358" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3 -->
  <polygon points="175,392 245,362 315,392 245,422" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="245" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">逐位相等？</text>
  <text x="344" y="386" font-size="11" fill="#a04a44" filter="url(#sk)">否</text>
  <path d="M 315 392 L 452 392" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="455" y="375" width="130" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="520" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a35" filter="url(#sk)">返回 false ✗</text>
  <text x="253" y="438" font-size="11" fill="#3a6a2a" filter="url(#sk)">是</text>
  <path d="M 245 422 L 245 438" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- advance box -->
  <rect x="120" y="442" width="250" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="245" y="463" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a28" filter="url(#sk)">i += len(p)（跳过整段）</text>

  <!-- loop back -->
  <path d="M 120 459 L 66 459 L 66 132 L 163 132" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="300" text-anchor="middle" font-size="11" fill="#3a6a2a" transform="rotate(-90 56 300)" filter="url(#sk)">下一轮</text>

  <text x="320" y="492" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">每轮 i 跳一整段，arr 的每个元素至多被核对一次 —— 总比较次数 ≤ n</text>
</svg>
