<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">路线 B 核心观察：辅音定下界（指针）+ 元音定上界（lastAll 阈值）</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">示例 word = "ieaouqqieaouqq"，f(1) 的快照：right = 11，K = 1</text>

  <!-- r 指针 -->
  <text x="398" y="55" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">r = 11</text>
  <path d="M 398 58 L 398 64" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 单词格子 -->
  <rect x="30" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="46" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="62" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">e</text>
  <rect x="94" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="126" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="158" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">u</text>
  <rect x="190" y="68" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="88" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">q</text>
  <rect x="222" y="68" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="88" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">q</text>
  <rect x="254" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">i</text>
  <rect x="286" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">e</text>
  <rect x="318" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="350" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="88" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">o</text>
  <rect x="382" y="68" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="88" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">u</text>
  <rect x="414" y="68" width="32" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="430" y="88" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">q</text>
  <rect x="446" y="68" width="32" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="462" y="88" text-anchor="middle" font-size="13" fill="#aaa" filter="url(#rough2)">q</text>

  <!-- 下标 -->
  <text x="46" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="78" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="110" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="142" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="174" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">4</text>
  <text x="206" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="238" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="270" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">7</text>
  <text x="302" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">8</text>
  <text x="334" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">9</text>
  <text x="366" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">10</text>
  <text x="398" y="112" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">11</text>
  <text x="430" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">12</text>
  <text x="462" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">13</text>

  <!-- 合法起点绿条 [6..7] -->
  <rect x="222" y="116" width="64" height="6" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- left 指针 -->
  <path d="M 222 150 L 222 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="222" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">left = 6</text>
  <text x="222" y="180" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">（辅音 ≤ K 的最小起点）</text>

  <!-- last 表 -->
  <rect x="30" y="196" width="54" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="57" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">last[i]=7</text>
  <rect x="88" y="196" width="54" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">last[e]=8</text>
  <rect x="146" y="196" width="54" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">last[a]=9</text>
  <rect x="204" y="196" width="54" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">last[o]=10</text>
  <rect x="262" y="196" width="54" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="289" y="209" text-anchor="middle" font-size="8.5" fill="#33506b" filter="url(#rough2)">last[u]=11</text>
  <path d="M 322 205 L 342 205" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="346" y="194" width="112" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="402" y="209" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">lastAll = 7</text>

  <!-- 合法起点区间括号 -->
  <path d="M 222 228 L 222 236 L 286 236 L 286 228" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="254" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法起点 [6..7]：子串 [6..11] 与 [7..11]</text>
  <text x="254" y="267" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">贡献 = max(0, lastAll − left + 1) = 7 − 6 + 1 = 2</text>

  <!-- 下界解释框 -->
  <rect x="10" y="280" width="245" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="298" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">下界 · 辅音（指针驱动）</text>
  <text x="24" y="314" font-size="9" fill="#8a3a36" filter="url(#rough2)">while (cons &gt; K) 移出 word[left]：</text>
  <text x="24" y="330" font-size="9" fill="#8a3a36" filter="url(#rough2)">[5..11] 含 2 个辅音 &gt; K=1 ⇒ left 推进到 6</text>

  <!-- 上界解释框 -->
  <rect x="265" y="280" width="245" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="298" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">上界 · 元音（阈值折叠）</text>
  <text x="279" y="314" font-size="9" fill="#33506b" filter="url(#rough2)">[s..11] 含 v ⟺ s ≤ last[v]，五条件取交</text>
  <text x="279" y="330" font-size="9" fill="#33506b" filter="url(#rough2)">⇒ s ≤ lastAll = 7；s = 8 起窗口缺 i ✗</text>
</svg>
