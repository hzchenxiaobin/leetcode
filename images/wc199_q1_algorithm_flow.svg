<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="460" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟放置</text>
  <path d="M 230 36 Q 310 43 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="54" text-anchor="middle" font-size="12" fill="#666">单层循环；每个字符 O(1) 直达目标位置</text>

  <g filter="url(#sk)">
    <rect x="458" y="66" width="148" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="532" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">循环不变量</text>
  <text x="532" y="107" text-anchor="middle" font-size="10.5" fill="#2e5a24">前 i 步已放置的位置</text>
  <text x="532" y="123" text-anchor="middle" font-size="10.5" fill="#2e5a24">全部最终就位，</text>
  <text x="532" y="139" text-anchor="middle" font-size="10.5" fill="#2e5a24">不会被后续覆盖</text>

  <g filter="url(#sk)">
    <ellipse cx="310" cy="84" rx="42" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="310" y="89" text-anchor="middle" font-size="13" fill="#2e5a24">开始</text>
  <path d="M 310 104 L 310 114" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="205" y="116" width="210" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="310" y="139" text-anchor="middle" font-size="12.5" fill="#34506e">res ← 长度为 n 的空数组</text>
  <path d="M 310 154 L 310 164" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="166" width="120" height="32" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="310" y="186" text-anchor="middle" font-size="12.5" fill="#555">i ← 0</text>
  <path d="M 310 198 L 310 208" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 310 210 L 450 246 L 310 282 L 170 246 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="251" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">i &lt; n ?</text>
  <text x="324" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a24">是</text>
  <path d="M 310 282 L 310 294" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="180" y="296" width="260" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="310" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#34506e">res[indices[i]] ← s[i]</text>
  <path d="M 310 338 L 310 348" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="350" width="120" height="32" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="310" y="370" text-anchor="middle" font-size="12.5" fill="#555">i ← i + 1</text>

  <path d="M 370 366 L 540 366 L 540 246 L 462 246" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <text x="158" y="238" text-anchor="end" font-size="11" font-weight="bold" fill="#8f3830">否</text>
  <path d="M 170 246 L 70 246 L 70 420 L 196 420" stroke="#8a7a4a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="400" width="220" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="310" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">返回 res（拼成字符串）</text>
</svg>
