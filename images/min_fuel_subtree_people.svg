<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="860" height="560" fill="#fafafa"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">核心观察：边 (u → parent) 的人流量 = subtree(u) 的人数</text>
  <path d="M 250 46 Q 430 54 610 46" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: tree of example 2 ===== -->
  <text x="240" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">示例 2 的树（以 0 为根，seats = 2）</text>

  <!-- edges -->
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.8" fill="none">
    <path d="M 240 150 Q 170 210 150 250"/>
    <path d="M 240 150 Q 300 210 320 250"/>
    <path d="M 240 150 Q 390 200 460 250"/>
    <path d="M 150 310 Q 150 350 140 400"/>
    <path d="M 140 460 Q 150 500 160 530"/>
    <path d="M 460 310 Q 470 350 480 400"/>
  </g>

  <!-- nodes: [x,y,label,cnt] -->
  <!-- root 0 -->
  <g filter="url(#sk)"><circle cx="240" cy="130" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="240" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">0</text>
  <text x="240" y="145" text-anchor="middle" font-size="9" fill="#b85450">首都</text>

  <g filter="url(#sk)"><circle cx="150" cy="280" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="150" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">1</text>
  <text x="150" y="294" text-anchor="middle" font-size="10" fill="#446688">cnt=3</text>

  <g filter="url(#sk)"><circle cx="320" cy="280" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">5</text>
  <text x="320" y="294" text-anchor="middle" font-size="10" fill="#446688">cnt=1</text>

  <g filter="url(#sk)"><circle cx="460" cy="280" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="460" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">4</text>
  <text x="460" y="294" text-anchor="middle" font-size="10" fill="#446688">cnt=2</text>

  <g filter="url(#sk)"><circle cx="140" cy="430" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="140" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">3</text>
  <text x="140" y="444" text-anchor="middle" font-size="10" fill="#4a7a3a">cnt=2</text>

  <g filter="url(#sk)"><circle cx="480" cy="430" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="480" y="428" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">6</text>
  <text x="480" y="444" text-anchor="middle" font-size="10" fill="#4a7a3a">cnt=1</text>

  <g filter="url(#sk)"><circle cx="170" cy="530" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="170" y="528" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">2</text>
  <text x="170" y="543" text-anchor="middle" font-size="10" fill="#4a7a3a">cnt=1</text>

  <!-- subtree shading for node 1 -->
  <g filter="url(#sk)">
    <path d="M 150 280 Q 120 340 118 400 Q 118 470 130 500 Q 160 520 200 500 Q 210 400 190 330 Q 175 295 150 280 Z"
          fill="#e8f0fe" opacity="0.25" stroke="#446688" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="70" y="500" font-size="10" fill="#446688" transform="rotate(-75 70 500)">subtree(1)</text>

  <!-- edge annotations -->
  <g font-size="11" font-weight="bold" fill="#b85450">
    <text x="196" y="196">cnt=3 → 2 车</text>
    <text x="292" y="206">cnt=1 → 1 车</text>
    <text x="382" y="196">cnt=2 → 1 车</text>
    <text x="94" y="370">cnt=2 → 1 车</text>
    <text x="168" y="498">cnt=1 → 1 车</text>
    <text x="492" y="370">cnt=1 → 1 车</text>
  </g>
  <text x="240" y="555" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">总油耗 = 2+1+1+1+1+1 = 7 升</text>

  <!-- ===== right: explanation ===== -->
  <g filter="url(#sk)">
    <rect x="560" y="95" width="280" height="180" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="700" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">树 → 路径唯一</text>
  <text x="580" y="148" font-size="11" fill="#444">根为 0。子树 subtree(u) 里的每位代表</text>
  <text x="580" y="168" font-size="11" fill="#444">去首都都必须经过边 (u → parent(u))，</text>
  <text x="580" y="188" font-size="11" fill="#444">且只经过一次（路径唯一）。</text>
  <text x="580" y="216" font-size="11" fill="#8a6a1a" font-weight="bold">所以每条边上的人流量恰好是</text>
  <text x="580" y="238" font-size="12" fill="#8a6a1a" font-weight="bold">cnt(u) = |subtree(u)| 个代表</text>
  <text x="580" y="262" font-size="10" fill="#888">与代表何时上车、怎么换车无关</text>

  <g filter="url(#sk)">
    <rect x="560" y="300" width="280" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="700" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2a">逐边独立结算</text>
  <text x="580" y="352" font-size="11" fill="#444">一条边要运送 cnt 个人，每车最多</text>
  <text x="580" y="372" font-size="11" fill="#444">seats 人 → 至少 ⌈cnt / seats⌉ 辆车。</text>
  <text x="580" y="392" font-size="11" fill="#444">相邻城市间一辆车耗油 1 升，所以：</text>
  <text x="700" y="420" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">ans = Σ ⌈cnt(u) / seats⌉</text>
  <text x="700" y="440" text-anchor="middle" font-size="10" fill="#888">对所有 u ≠ 0 求和</text>

  <g filter="url(#sk)">
    <path d="M 560 475 Q 700 468 700 495" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="700" y="520" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">一次 DFS / BFS 统计子树大小即可</text>
</svg>
