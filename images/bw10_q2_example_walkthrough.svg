<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：target = 5 的双指针过程</text>

  <!-- 示例 1 -->
  <text x="40" y="62" font-size="12.5" fill="#333" font-weight="bold">示例 1：a = [1,2,4]，b = [0,1,3]</text>

  <rect x="60" y="80" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text y="102" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">1</tspan><tspan x="185" fill="#4a7a3a" font-weight="bold">2</tspan><tspan x="255">4</tspan></text>

  <rect x="60" y="122" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text y="144" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="325">0</tspan><tspan x="395">1</tspan><tspan x="465" fill="#4a7a3a" font-weight="bold">3</tspan></text>

  <path d="M 115 118 L 115 112" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="110" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=0</text>
  <path d="M 465 78 L 465 72" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="70" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j=2</text>

  <rect x="40" y="170" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="190" font-size="11.5" fill="#555" filter="url(#rough2)">第 1 步：1 + 3 = 4 &lt; 5 → i++（b[j]=3 已是 b 的最大可选，1 无可救药）</text>

  <rect x="40" y="204" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="56" y="224" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 步：2 + 3 = 5 == target → 返回 true ✓</text>

  <path d="M 185 118 L 185 112" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="110" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=1</text>

  <!-- 示例 2 -->
  <text x="40" y="278" font-size="12.5" fill="#333" font-weight="bold">示例 2：a = [−10,0,10]，b = [0,1,2,5,7]，target = 18</text>

  <rect x="60" y="292" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text y="312" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">−10</tspan><tspan x="185">0</tspan><tspan x="255">10</tspan></text>

  <rect x="60" y="326" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text y="346" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="143">0</tspan><tspan x="213">1</tspan><tspan x="283">2</tspan><tspan x="353">5</tspan><tspan x="465">7</tspan></text>
  <path d="M 465 288 L 465 282" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="366" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="56" y="386" font-size="11.5" fill="#b85450" filter="url(#rough2)">−10+7=−3 → i++；0+7=7 → i++；10+7=17 → i++；i 越界 → 返回 false</text>

  <text x="40" y="412" font-size="11" fill="#555">最大可能和 10+7=17 都够不到 18，指针耗尽 a 后自然退出</text>
</svg>
