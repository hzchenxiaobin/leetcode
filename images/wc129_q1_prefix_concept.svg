<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">三段相等 ⟹ 每段和都等于 sum/3</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">arr = [3,3,6,5,-2,2,5,1,-9,4]，sum = 18，target = 6</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="30" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="54.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="82" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="106.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="134" y="76" width="48" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="158.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="186" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="238" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="262.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-2</text>
  <rect x="290" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="314.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="342" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="366.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="394" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="418.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="446" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-9</text>
  <rect x="498" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="522.0" y="99.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 30.0 124.0 L 30.0 138.0 L 134.0 138.0 L 134.0 124.0" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 138.0 124.0 L 138.0 138.0 L 186.0 138.0 L 186.0 124.0" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 190.0 124.0 L 190.0 138.0 L 550.0 138.0 L 550.0 124.0" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82.0" y="156.0" font-size="10" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">和 6</text>
  <text x="162.0" y="156.0" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="370.0" y="156.0" font-size="10" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">和 6</text>
  <text x="30.0" y="190.0" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">第一刀：pre(i) = target</text>
  <text x="30.0" y="214.0" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">第二刀：pre(j) = 2·target</text>
  <text x="30.0" y="238.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">即：pre(i) = 6，pre(j) = 12</text>
  <rect x="30" y="258" width="520" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="279.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">总和不能被 3 整除 → 直接 false（必要条件）</text>
  <text x="40.0" y="295.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">两刀都必须留出非空段：i ≤ n−3，j ≤ n−2</text>
  <text x="40.0" y="311.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">取最靠左的 i 不会错过解：i 越小，留给后两段的空间越大</text>
</svg>
