<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：降序排序 → 滚动求和 → 逐格判定，穿零即停</text>

  <!-- ① 降序排序 -->
  <rect x="250" y="44" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">① 降序排序 sort(reverse)</text>
  <text x="350" y="76" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">正数 → 零 → 负数自动分段</text>
  <path d="M350,82 L350,98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="250" y="102" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="123" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">② 初始化 sum = 0, cnt = 0</text>
  <path d="M350,136 L350,152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 累加 -->
  <rect x="250" y="156" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="177" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">③ 取下一元素 x：sum += x</text>
  <path d="M350,190 L350,206" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 判定 -->
  <polygon points="350,210 430,238 350,266 270,238" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">④ sum &gt; 0 ?</text>

  <!-- ④ 是 → ⑤ -->
  <path d="M430,238 L462,238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="228" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">是 ✓</text>

  <!-- ⑤ 计数 -->
  <rect x="470" y="218" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">⑤ cnt++</text>
  <text x="545" y="250" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">还有元素则回到 ③</text>
  <path d="M545,218 L545,173 L456,173" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="166" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">下一元素</text>

  <!-- ④ 否 → ⑥ -->
  <path d="M270,238 L218,238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="228" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否 ✗</text>

  <!-- ⑥ break -->
  <rect x="60" y="218" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">⑥ break（穿零）</text>
  <text x="135" y="250" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">后面不可能再有正前缀</text>

  <!-- ⑦ 返回 -->
  <rect x="250" y="310" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">⑦ 返回 cnt</text>

  <!-- ⑥ → ⑦ -->
  <path d="M135,258 L135,330 L242,330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 遍历完 → ⑦ -->
  <path d="M545,258 L545,330 L458,330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="296" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">遍历完直达</text>

  <!-- 侧注：为何敢提前 break -->
  <rect x="40" y="64" width="190" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="86" text-anchor="start" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">为何敢提前 break？</text>
  <text x="52" y="106" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">降序下穿零后，剩余</text>
  <text x="52" y="122" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">元素全 ≤ 0，前缀和</text>
  <text x="52" y="138" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">只降不升（引理 2）——</text>
  <text x="52" y="154" text-anchor="start" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">扫到底与提前停同分</text>

  <!-- 底部提示 -->
  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">不 break 扫到底同样正确（穿零后恒非正，不会再贡献计数）——break 只是省掉后半段的无效累加</text>
</svg>
