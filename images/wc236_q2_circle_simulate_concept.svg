<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">游戏走查：n ＝ 5, k ＝ 2 —— 数 k 名（含起点），最后数到的出局</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#666">出局者的顺时针下一位成为新一轮起点；本场出局顺序 2 → 4 → 1 → 5</text>

  <circle cx="195" cy="258" r="112" fill="none" stroke="#b0b0b0" stroke-width="1.4" stroke-dasharray="4 5" filter="url(#sk)"/>

  <path d="M 214 124 Q 272 120 288 200" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="262" y="106" text-anchor="middle" font-size="10.5" fill="#446688">数 2 名（含起点）</text>

  <path d="M 148 106 L 176 128" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="144" y="102" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">起点</text>

  <g filter="url(#sk)">
    <circle cx="195" cy="146" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 181 132 L 209 160 M 209 132 L 181 160" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <circle cx="302" cy="223" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 288 209 L 316 237 M 316 209 L 288 237" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <circle cx="88" cy="223" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 74 209 L 102 237 M 102 209 L 74 237" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <circle cx="129" cy="349" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 115 335 L 143 363 M 143 335 L 115 363" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <circle cx="261" cy="349" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="195" y="151" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="302" y="228" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="88" y="228" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="129" y="354" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="261" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5a24">3</text>

  <text x="332" y="222" text-anchor="start" font-size="10.5" fill="#8f3830">① 出局</text>
  <text x="223" y="148" text-anchor="start" font-size="10.5" fill="#8f3830">③ 出局</text>
  <text x="129" y="392" text-anchor="middle" font-size="10.5" fill="#8f3830">② 出局</text>
  <text x="44" y="196" text-anchor="middle" font-size="10.5" fill="#8f3830">④ 出局</text>
  <text x="261" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">胜 者</text>

  <g filter="url(#sk)">
    <rect x="400" y="84" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="144" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="204" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="264" width="220" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="400" y="324" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="510" y="105" text-anchor="middle" font-size="11" fill="#33517a">第 1 轮：从 1 号起数</text>
  <text x="510" y="124" text-anchor="middle" font-size="11" fill="#33517a">数到 1、2 → 2 号出局</text>
  <text x="510" y="165" text-anchor="middle" font-size="11" fill="#33517a">第 2 轮：从 3 号起数</text>
  <text x="510" y="184" text-anchor="middle" font-size="11" fill="#33517a">数到 3、4 → 4 号出局</text>
  <text x="510" y="225" text-anchor="middle" font-size="11" fill="#33517a">第 3 轮：从 5 号起数</text>
  <text x="510" y="244" text-anchor="middle" font-size="11" fill="#33517a">数到 5、1 → 1 号出局</text>
  <text x="510" y="285" text-anchor="middle" font-size="11" fill="#33517a">第 4 轮：从 3 号起数</text>
  <text x="510" y="304" text-anchor="middle" font-size="11" fill="#33517a">数到 3、5 → 5 号出局</text>
  <text x="510" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a24">只剩 3 号</text>
  <text x="510" y="364" text-anchor="middle" font-size="11" fill="#2e5a24">获胜者 ＝ 3，与示例 1 一致 ✓</text>

  <g filter="url(#sk)">
    <rect x="30" y="398" width="590" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">每一轮 ＝ 数 k−1 步 ＋ 删 1 人，老实模拟共 O(nk) 步</text>
  <text x="320" y="439" text-anchor="middle" font-size="11" fill="#8a6415">「数 k 名」与「走 k 步」相差 1；换「倒推」视角可到 O(n) —— 见下面两张图</text>
</svg>
