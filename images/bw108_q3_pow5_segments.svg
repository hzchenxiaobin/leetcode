<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">15 位以内的「美丽串」只有 7 个候选</text>

  <!-- 左：5 的幂表 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="160" y="62" text-anchor="middle" font-size="13" fill="#446688">5^k 与其二进制</text>
    <rect x="40" y="72" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="94" text-anchor="middle">5^0 = 1</text>
    <rect x="110" y="72" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="94" text-anchor="middle" font-size="12">1</text>

    <rect x="40" y="108" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="130" text-anchor="middle">5^1 = 5</text>
    <rect x="110" y="108" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="130" text-anchor="middle" font-size="12">101</text>

    <rect x="40" y="144" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="166" text-anchor="middle">5^2 = 25</text>
    <rect x="110" y="144" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="166" text-anchor="middle" font-size="12">11001</text>

    <rect x="40" y="180" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="202" text-anchor="middle">5^3 = 125</text>
    <rect x="110" y="180" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="202" text-anchor="middle" font-size="12">1111101</text>

    <rect x="40" y="216" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="238" text-anchor="middle">5^4 = 625</text>
    <rect x="110" y="216" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="238" text-anchor="middle" font-size="12">1001110001</text>

    <rect x="40" y="252" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="75" y="274" text-anchor="middle">5^5 = 3125</text>
    <rect x="110" y="252" width="190" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="274" text-anchor="middle" font-size="12">1100001101101</text>

    <rect x="40" y="288" width="70" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="75" y="310" text-anchor="middle">5^6 = 15625</text>
    <rect x="110" y="288" width="190" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="205" y="310" text-anchor="middle" font-size="12">11110100001001</text>

    <rect x="40" y="324" width="70" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="75" y="346" text-anchor="middle" fill="#b85450">5^7 = 78125</text>
    <rect x="110" y="324" width="190" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="205" y="346" text-anchor="middle" font-size="12" fill="#b85450">17 位 &gt; 15，永远用不上</text>
  </g>

  <!-- 右：分割示意 -->
  <g filter="url(#rough2)">
    <text x="510" y="62" text-anchor="middle" font-size="13" fill="#446688">s = "1011" 的最优分割</text>
    <rect x="370" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="385" y="98" text-anchor="middle" font-size="13">1</text>
    <rect x="400" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="415" y="98" text-anchor="middle" font-size="13">0</text>
    <rect x="430" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <text x="445" y="98" text-anchor="middle" font-size="13">1</text>
    <rect x="460" y="76" width="30" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="475" y="98" text-anchor="middle" font-size="13">1</text>

    <text x="445" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a">"101" = 5¹（绿色框）</text>
    <text x="445" y="148" text-anchor="middle" font-size="12" fill="#d6a040">"1" = 5⁰（橙色框）</text>
    <text x="445" y="172" text-anchor="middle" font-size="12.5" fill="#333">两段 → 答案 2</text>

    <text x="510" y="206" text-anchor="middle" font-size="12.5" fill="#333">非法示例：</text>
    <text x="510" y="226" text-anchor="middle" font-size="12" fill="#b85450">"0111…"（前导零 ✗）</text>
    <text x="510" y="244" text-anchor="middle" font-size="12" fill="#b85450">"110"（= 6，不是 5 的幂 ✗）</text>

    <rect x="360" y="264" width="300" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="510" y="288" text-anchor="middle" font-size="12.5" fill="#333">小观察（可做剪枝）：</text>
    <text x="510" y="308" text-anchor="middle" font-size="12" fill="#555">k ≥ 1 时 5^k ≡ 1 (mod 4)</text>
    <text x="510" y="328" text-anchor="middle" font-size="12" fill="#555">→ 二进制末两位必为 "01"，</text>
    <text x="510" y="346" text-anchor="middle" font-size="12" fill="#555">首字符必为 "1"</text>
  </g>
</svg>
