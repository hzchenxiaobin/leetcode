<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [4,6,7,7] 恰好生成 8 条答案</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每条答案对应唯一一条「最左」下标序列；橙色行说明 (4,7) 的二义性如何被消除</text>

  <rect x="36" y="58" width="176" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="218" y="58" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="344" y="58" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="124" y="77" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">值序列（答案）</text>
  <text x="278" y="77" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">下标序列</text>
  <text x="434" y="77" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">说明</text>

  <rect x="36" y="90" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="109" font-size="11" fill="#333" filter="url(#rough2)">[4, 6]</text>
  <text x="218" y="109" font-size="11" fill="#555" filter="url(#rough2)">(0, 1)</text>
  <text x="344" y="109" font-size="9.5" fill="#777" filter="url(#rough2)">长度 2</text>

  <rect x="36" y="120" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="139" font-size="11" fill="#333" filter="url(#rough2)">[4, 6, 7]</text>
  <text x="218" y="139" font-size="11" fill="#555" filter="url(#rough2)">(0, 1, 2)</text>
  <text x="344" y="139" font-size="9.5" fill="#777" filter="url(#rough2)">长度 3</text>

  <rect x="36" y="150" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="169" font-size="11" fill="#333" filter="url(#rough2)">[4, 6, 7, 7]</text>
  <text x="218" y="169" font-size="11" fill="#555" filter="url(#rough2)">(0, 1, 2, 3)</text>
  <text x="344" y="169" font-size="9.5" fill="#777" filter="url(#rough2)">长度 4，最长</text>

  <rect x="36" y="180" width="488" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="52" y="199" font-size="11" fill="#8a6a20" filter="url(#rough2)">[4, 7]</text>
  <text x="218" y="199" font-size="11" fill="#8a6a20" filter="url(#rough2)">(0, 2)</text>
  <text x="344" y="199" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">也可 (0,3)，但同层同值被剪</text>

  <rect x="36" y="210" width="488" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="52" y="229" font-size="11" fill="#8a6a20" filter="url(#rough2)">[4, 7, 7]</text>
  <text x="218" y="229" font-size="11" fill="#8a6a20" filter="url(#rough2)">(0, 2, 3)</text>
  <text x="344" y="229" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">7 出现在下一层，不冲突</text>

  <rect x="36" y="240" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="259" font-size="11" fill="#333" filter="url(#rough2)">[6, 7]</text>
  <text x="218" y="259" font-size="11" fill="#555" filter="url(#rough2)">(1, 2)</text>
  <text x="344" y="259" font-size="9.5" fill="#777" filter="url(#rough2)">第 1 层从 i=1 起</text>

  <rect x="36" y="270" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="289" font-size="11" fill="#333" filter="url(#rough2)">[6, 7, 7]</text>
  <text x="218" y="289" font-size="11" fill="#555" filter="url(#rough2)">(1, 2, 3)</text>
  <text x="344" y="289" font-size="9.5" fill="#777" filter="url(#rough2)">长度 3</text>

  <rect x="36" y="300" width="488" height="28" fill="#ffffff" stroke="#d5d5d5" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="319" font-size="11" fill="#333" filter="url(#rough2)">[7, 7]</text>
  <text x="218" y="319" font-size="11" fill="#555" filter="url(#rough2)">(2, 3)</text>
  <text x="344" y="319" font-size="9.5" fill="#777" filter="url(#rough2)">第 1 层 i=3 已被剪掉</text>

  <rect x="36" y="342" width="488" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="52" y="362" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">两道剪枝在 (4,7) 上同时生效</text>
  <text x="52" y="380" font-size="10" fill="#555" filter="url(#rough2)">第 2 层候选是 6、7、7：第三个 7 与第二个同值，换成 (0,2) 后值序列不变，</text>
  <text x="52" y="396" font-size="10" fill="#555" filter="url(#rough2)">而且剩余可选区间更大 —— 所以 DFS 只走 (0,2)，永远不会产生 (0,3)。</text>

  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8 条 = 全部不同的非递减子序列，无重复、无遗漏</text>
</svg>
