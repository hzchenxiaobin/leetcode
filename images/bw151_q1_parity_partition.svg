<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">奇偶替换 + 排序，本质是「前 cnt 个 0，后面全是 1」</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">nums = [4,3,2,1]，偶数 cnt = 2，奇数 n − cnt = 2</text>
  <text x="24" y="108" text-anchor="start" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="80" y="84" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102.0" y="109.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="136" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158.0" y="109.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="84" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="109.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="248" y="84" width="44" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="109.4" text-anchor="middle" font-size="15" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 102 130 L 102 152" stroke="#999999" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="80" y="156" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="102.0" y="174.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 158 130 L 158 152" stroke="#999999" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="136" y="156" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="158.0" y="174.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 214 130 L 214 152" stroke="#999999" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="192" y="156" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="174.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 270 130 L 270 152" stroke="#999999" stroke-width="1.4" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="248" y="156" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="174.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="40" y="176" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">替换</text>
  <path d="M 202 192 L 202 214" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="208" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">非递减排序</text>
  <rect x="80" y="220" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102.0" y="244.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="136" y="220" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158.0" y="244.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="192" y="220" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="244.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="248" y="220" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="244.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="24" y="246" text-anchor="start" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">结果</text>
  <rect x="310" y="84" width="224" height="178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="322" y="108" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">计数即可决定终局：</text>
  <text x="322" y="129" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">偶数 cnt 个 → 前 cnt 位全 0</text>
  <text x="322" y="150" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">奇数 n−cnt 个 → 其余位全 1</text>
  <text x="322" y="171" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)"></text>
  <text x="322" y="192" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">所以排序是可省的：</text>
  <text x="322" y="213" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">「替换 + 排序」= 「计数 + 拼接」</text>
  <text x="280.0" y="348" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">O(n) 时间：一遍计数 + 一遍填充；排序写法要多付 O(n log n)</text>
</svg>
