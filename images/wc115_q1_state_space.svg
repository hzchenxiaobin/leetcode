<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 302"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="302" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">8 间牢房 = 8 位 0/1：状态总数极小</text>
  <rect x="60" y="56" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="83" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房0</text>
  <rect x="116" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="139" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房1</text>
  <rect x="172" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="195" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房2</text>
  <rect x="228" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="251" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房3</text>
  <rect x="284" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="307" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="307" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房4</text>
  <rect x="340" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="363" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房5</text>
  <rect x="396" y="56" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="419" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房6</text>
  <rect x="452" y="56" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="82" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0/1</text>
  <text x="475" y="110" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">牢房7</text>
  <text x="280" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">两端的第 0、7 间没有两个邻居 ⇒ 任意一天之后必为 0</text>
  <path d="M 280 148 L 280 172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="174" width="380" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">自由位只剩中间 6 位 ⇒ 至多 2⁶ = 64 种状态</text>
  <path d="M 280 220 L 280 242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="244" width="440" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">状态有限 + 转移确定 ⇒ 序列必然进入周期（尾巴 + 环）</text>
</svg>
