<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="39"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单变量 freeAt 滚动推进（示例 2）</text>

  <!-- 步骤链 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <rect x="160" y="60" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <rect x="280" y="60" width="100" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <rect x="400" y="60" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="90" y="82">顾客1</text><text x="90" y="98">start=5</text><text x="90" y="114">finish=7</text>
    <text x="210" y="82">顾客2</text><text x="210" y="98">start=7</text><text x="210" y="114">finish=11</text>
    <text x="330" y="82">顾客3</text><text x="330" y="98">start=11</text><text x="330" y="114">finish=14</text>
    <text x="450" y="82">顾客4</text><text x="450" y="98">start=20</text><text x="450" y="114">finish=21</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 140 90 L 158 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 260 90 L 278 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 380 90 L 398 90" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="210" y="52" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">max(7,5)=7 厨师忙</text>
  <text x="330" y="52" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">max(11,10)=11</text>
  <text x="450" y="52" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">max(14,20)=20 空闲跳变</text>

  <!-- freeAt 传递 -->
  <path d="M 90 120 C 90 160, 210 160, 210 120" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="150" y="176" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">freeAt=7 传给下一位</text>

  <!-- 等待累加 -->
  <g filter="url(#rough2)">
    <rect x="60" y="196" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="218">wait：2、6、4、1（finish − arrival）</text>
    <text x="280" y="238">totalWait = 13（整数累加，最后才除）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="256" width="320" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="276" font-size="14" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">答案 = 13 / 4 = 3.25</text>
</svg>
