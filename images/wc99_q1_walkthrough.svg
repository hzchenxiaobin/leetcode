<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="370" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：grid = [[1,2],[3,4]] 的四格贡献</text>
  <rect x="60" y="66" width="80" height="80" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100.0" y="113.0" text-anchor="middle" font-size="20" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="146" y="66" width="80" height="80" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186.0" y="113.0" text-anchor="middle" font-size="20" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="60" y="152" width="80" height="80" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100.0" y="199.0" text-anchor="middle" font-size="20" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <rect x="146" y="152" width="80" height="80" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186.0" y="199.0" text-anchor="middle" font-size="20" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <text x="140" y="240" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">grid</text>
  <rect x="230" y="66" width="80" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270.0" y="85.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">格子</text>
  <rect x="300" y="66" width="80" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="85.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">h</text>
  <rect x="360" y="66" width="80" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400.0" y="85.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">顶+底</text>
  <rect x="425" y="66" width="125" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487.5" y="85.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">四个方向的高度差</text>
  <rect x="560" y="66" width="80" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600.0" y="85.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">合计</text>
  <rect x="230" y="110" width="65" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.5" y="133.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">(0,0)</text>
  <rect x="300" y="110" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.5" y="133.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="360" y="110" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387.5" y="133.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="425" y="110" width="125" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487.5" y="133.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1+0+1+0 = 2</text>
  <rect x="560" y="110" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="587.5" y="133.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="230" y="160" width="65" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.5" y="183.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">(0,1)</text>
  <rect x="300" y="160" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.5" y="183.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="360" y="160" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387.5" y="183.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="425" y="160" width="125" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487.5" y="183.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1+2+2+0 = 5</text>
  <rect x="560" y="160" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="587.5" y="183.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">7</text>
  <rect x="230" y="210" width="65" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.5" y="233.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">(1,0)</text>
  <rect x="300" y="210" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.5" y="233.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <rect x="360" y="210" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387.5" y="233.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="425" y="210" width="125" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487.5" y="233.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3+0+2+3 = 8</text>
  <rect x="560" y="210" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="587.5" y="233.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">10</text>
  <rect x="230" y="260" width="65" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262.5" y="283.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">(1,1)</text>
  <rect x="300" y="260" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.5" y="283.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="360" y="260" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387.5" y="283.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">2</text>
  <rect x="425" y="260" width="125" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="487.5" y="283.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1+4+2+4 = 11</text>
  <rect x="560" y="260" width="55" height="38" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="587.5" y="283.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">13</text>
  <text x="350" y="336" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" font-style="" filter="url(#rough2)">4 + 7 + 10 + 13 = 34  ✓（与题面输出一致）</text>
</svg>
