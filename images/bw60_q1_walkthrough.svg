<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="52"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算走查：nums = [2,3,−1,8,4]（示例 1，答案 3）</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="480" height="30" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="90" y="72">下标 i</text>
    <text x="190" y="72">left（扫到 i 前）</text>
    <text x="330" y="72">right = total−left−x</text>
    <text x="480" y="72">判定</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="82" width="480" height="30" fill="#e8f0fe" rx="4"/>
    <rect x="40" y="112" width="480" height="30" fill="#f4f8ff" rx="4"/>
    <rect x="40" y="142" width="480" height="30" fill="#e8f0fe" rx="4"/>
    <rect x="40" y="172" width="480" height="30" fill="#e6f4ea" rx="4" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="40" y="202" width="480" height="30" fill="#f4f8ff" rx="4"/>
    <line x1="140" y1="52" x2="140" y2="232" stroke="#c3d2e4" stroke-width="1"/>
    <line x1="260" y1="52" x2="260" y2="232" stroke="#c3d2e4" stroke-width="1"/>
    <line x1="410" y1="52" x2="410" y2="232" stroke="#c3d2e4" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="90" y="102">0</text><text x="190" y="102">0</text><text x="330" y="102">14</text><text x="480" y="102">✗</text>
    <text x="90" y="132">1</text><text x="190" y="132">2</text><text x="330" y="132">11</text><text x="480" y="132">✗</text>
    <text x="90" y="162">2</text><text x="190" y="162">5</text><text x="330" y="162">12</text><text x="480" y="162">✗</text>
    <text x="90" y="192" fill="#2d5a22" font-weight="bold">3</text><text x="190" y="192" fill="#2d5a22" font-weight="bold">4</text>
    <text x="330" y="192" fill="#2d5a22" font-weight="bold">4</text><text x="480" y="192" fill="#2d5a22" font-weight="bold">✓ 命中</text>
    <text x="90" y="222">4</text><text x="190" y="222">12</text><text x="330" y="222">0</text><text x="480" y="222">（不再看）</text>
  </g>

  <rect x="40" y="252" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="279" font-size="13.5" fill="#2d5a22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">total = 16；i = 3 时 left = 4 = right = 16 − 4 − 8 → 返回 3</text>

  <!-- 其他示例 -->
  <rect x="40" y="312" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="280" y="336" text-anchor="middle" font-weight="bold">边界对照</text>
    <text x="280" y="356" text-anchor="middle">[1,−1,4]：total = 4，i = 2 时 left = 0 = right = 0 → 返回 2（最右也可能命中）</text>
    <text x="280" y="376" text-anchor="middle">[2,5]：total = 7；i=0：left 0 vs 5 ✗；i=1：left 2 vs 0 ✗ → −1（可能无解）</text>
  </g>
</svg>
