<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 385"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="385" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = 「xaxcd」，k = 4</text>

  <!-- header row -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <rect x="40" y="52" width="36" height="36" rx="4"/>
    <rect x="76" y="52" width="48" height="36" rx="4"/>
    <rect x="124" y="52" width="48" height="36" rx="4"/>
    <rect x="172" y="52" width="52" height="36" rx="4"/>
    <rect x="224" y="52" width="168" height="36" rx="4"/>
    <rect x="392" y="52" width="48" height="36" rx="4"/>
    <rect x="440" y="52" width="60" height="36" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#446688" text-anchor="middle">
    <text x="58" y="75">i</text>
    <text x="100" y="75">s[i]</text>
    <text x="148" y="75">o</text>
    <text x="198" y="75">cost</text>
    <text x="308" y="75">决策</text>
    <text x="416" y="75">t[i]</text>
    <text x="470" y="75">rem</text>
  </g>

  <!-- row 0: i=0 'x' affordable -->
  <g filter="url(#rough2)">
    <rect x="40" y="88" width="36" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="76" y="88" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="124" y="88" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="172" y="88" width="52" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="224" y="88" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="392" y="88" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="440" y="88" width="60" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <text x="58" y="115" text-anchor="middle" font-size="12" fill="#888">0</text>
    <text x="100" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">x</text>
    <text x="148" y="115" text-anchor="middle" font-size="12.5" fill="#666">23</text>
    <text x="198" y="115" text-anchor="middle" font-size="12.5" fill="#666">3</text>
    <text x="308" y="115" text-anchor="middle" font-size="12" fill="#2f5e24">3 ≤ 4 ⇒ 变 'a'</text>
    <text x="416" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5e24">a</text>
    <text x="470" y="115" text-anchor="middle" font-size="12.5" fill="#666">1</text>
  </g>

  <!-- row 1: i=1 'a' free -->
  <g filter="url(#rough2)">
    <rect x="40" y="132" width="36" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="76" y="132" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="124" y="132" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="172" y="132" width="52" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="224" y="132" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="392" y="132" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="440" y="132" width="60" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <text x="58" y="159" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="100" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">a</text>
    <text x="148" y="159" text-anchor="middle" font-size="12.5" fill="#666">0</text>
    <text x="198" y="159" text-anchor="middle" font-size="12.5" fill="#666">0</text>
    <text x="308" y="159" text-anchor="middle" font-size="12" fill="#2f5e24">0 ≤ 1 ⇒ 白嫖 'a'</text>
    <text x="416" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5e24">a</text>
    <text x="470" y="159" text-anchor="middle" font-size="12.5" fill="#666">1</text>
  </g>

  <!-- row 2: i=2 'x' cannot afford, step back -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="36" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="76" y="176" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="124" y="176" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="172" y="176" width="52" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="224" y="176" width="168" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="392" y="176" width="48" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="440" y="176" width="60" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <text x="58" y="203" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="100" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">x</text>
    <text x="148" y="203" text-anchor="middle" font-size="12.5" fill="#666">23</text>
    <text x="198" y="203" text-anchor="middle" font-size="12.5" fill="#666">3</text>
    <text x="308" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3 &gt; 1 ⇒ 退 1 步变 'w'</text>
    <text x="416" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">w</text>
    <text x="470" y="203" text-anchor="middle" font-size="12.5" fill="#666">0</text>
  </g>

  <!-- row 3: i=3 budget empty -->
  <g filter="url(#rough2)">
    <rect x="40" y="220" width="36" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="76" y="220" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="124" y="220" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="172" y="220" width="52" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="224" y="220" width="168" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="392" y="220" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="440" y="220" width="60" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <text x="58" y="247" text-anchor="middle" font-size="12" fill="#888">3</text>
    <text x="100" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">c</text>
    <text x="148" y="247" text-anchor="middle" font-size="12.5" fill="#666">2</text>
    <text x="198" y="247" text-anchor="middle" font-size="12.5" fill="#666">2</text>
    <text x="308" y="247" text-anchor="middle" font-size="12" fill="#888">预算空 ⇒ 原样</text>
    <text x="416" y="247" text-anchor="middle" font-size="13" fill="#666">c</text>
    <text x="470" y="247" text-anchor="middle" font-size="12.5" fill="#666">0</text>
  </g>

  <!-- row 4: i=4 budget empty -->
  <g filter="url(#rough2)">
    <rect x="40" y="264" width="36" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="76" y="264" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="124" y="264" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="172" y="264" width="52" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="224" y="264" width="168" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="392" y="264" width="48" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="440" y="264" width="60" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <text x="58" y="291" text-anchor="middle" font-size="12" fill="#888">4</text>
    <text x="100" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">d</text>
    <text x="148" y="291" text-anchor="middle" font-size="12.5" fill="#666">3</text>
    <text x="198" y="291" text-anchor="middle" font-size="12.5" fill="#666">3</text>
    <text x="308" y="291" text-anchor="middle" font-size="12" fill="#888">预算空 ⇒ 原样</text>
    <text x="416" y="291" text-anchor="middle" font-size="13" fill="#666">d</text>
    <text x="470" y="291" text-anchor="middle" font-size="12.5" fill="#666">0</text>
  </g>

  <!-- result box -->
  <g filter="url(#rough2)">
    <rect x="90" y="318" width="360" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="270" y="338" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e24">t = 「aawcd」</text>
    <text x="270" y="357" text-anchor="middle" font-size="12" fill="#2f5e24">distance = 3 + 0 + 1 + 0 + 0 = 4 ≤ k ✓</text>
  </g>

  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">买不起 'a' 时：朝 'a' 退 rem 步（x 的 o = 23 退 1 步 → w = 22），预算恰好花光</text>
</svg>
