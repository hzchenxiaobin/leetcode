<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="448" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">4 张签名表 + 游程：分类设计与两个反例</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 4 signature cards -->
  <g filter="url(#sk)">
    <rect x="18" y="52" width="142" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="172" y="52" width="142" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="326" y="52" width="142" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="480" y="52" width="142" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="89" y="74" fill="#33506b">表0 字符对 {a,b}</text>
    <text x="243" y="74" fill="#33506b">表1 字符对 {a,c}</text>
    <text x="397" y="74" fill="#33506b">表2 字符对 {b,c}</text>
    <text x="551" y="74" fill="#7a5415">表3 三字符</text>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="89" y="100" fill="#446688">(a−b, c)</text>
    <text x="243" y="100" fill="#446688">(a−c, b)</text>
    <text x="397" y="100" fill="#446688">(b−c, a)</text>
    <text x="551" y="100" fill="#d6a040">(b−a, c−a)</text>
  </g>
  <g font-size="9.5" fill="#556" text-anchor="middle">
    <text x="89" y="122">分1：a、b 计数差</text>
    <text x="243" y="122">分1：a、c 计数差</text>
    <text x="397" y="122">分1：b、c 计数差</text>
    <text x="551" y="122">分1：b 相对 a 的差</text>
  </g>
  <g font-size="9.5" fill="#556" text-anchor="middle">
    <text x="89" y="140">分2：c 计数（锁 0）</text>
    <text x="243" y="140">分2：b 计数（锁 0）</text>
    <text x="397" y="140">分2：a 计数（锁 0）</text>
    <text x="551" y="140">分2：c 相对 a 的差</text>
  </g>

  <!-- run bar -->
  <g filter="url(#sk)">
    <rect x="18" y="166" width="604" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">d=1 全同字符：不需要签名表</text>
  <text x="320" y="201" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">相邻同字符 run+1，最长游程一遍扫出（"cc…c"）</text>

  <!-- counterexample 1 -->
  <g filter="url(#sk)">
    <rect x="18" y="224" width="296" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="166" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#sk)">⚠ 反例一 "acbc"：第二分量不能省</text>
  <g filter="url(#sk)">
    <rect x="106" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="136" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="166" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="196" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="119" y="273">a</text>
    <text x="149" y="273">c</text>
    <text x="179" y="273">b</text>
    <text x="209" y="273">c</text>
  </g>
  <text x="166" y="298" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#sk)">前缀 0 与前缀 4 的 a−b 都是 0，只看差会误报整段 len=4</text>
  <text x="166" y="315" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#sk)">但 Δc=2 ≠ 0：第二分量 (0,0) ≠ (0,2) 挡住 ✓</text>
  <text x="166" y="330" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#sk)">真正最优 "acb" len=3 由三字符表命中</text>

  <!-- counterexample 2 -->
  <g filter="url(#sk)">
    <rect x="326" y="224" width="296" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="474" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#sk)">⚠ 反例二 "acac"：4 张表缺一不可</text>
  <g filter="url(#sk)">
    <rect x="414" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="444" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="474" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="504" y="256" width="26" height="24" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="427" y="273">a</text>
    <text x="457" y="273">c</text>
    <text x="487" y="273">a</text>
    <text x="517" y="273">c</text>
  </g>
  <text x="474" y="298" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#sk)">最优解 "acac"（len=4）只在 {a,c} 表命中：</text>
  <text x="474" y="315" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#sk)">sig_ac 在 i=0 与 i=4 均为 (0,0) → 结算 4</text>
  <text x="474" y="330" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#sk)">只建 {a,b} + 三字符两张表 → 只得 1，漏掉 4 ✗</text>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="18" y="352" width="604" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">每张表只存「签名 → 首现下标」；再次出现即当右端点结算 ans = max(ans, i − first)</text>
  <text x="320" y="400" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">空前缀（计数全 0）的 4 个签名先入表 —— 最优左端点可能是串首</text>
  <text x="320" y="420" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">C++ 键编码 (x+n)(2n+1)+(y+n) 值约 4n²，需 long long；Python 直接用元组</text>
</svg>
