<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：[[2,1], [5,0], [4,2]] → 10</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="280" y="56">三笔全亏损：d = 1, 5, 2，Σloss = 8；最大 cashback = 2（来自 [4,2]）</text>
    <text x="280" y="78">answer = 8 + 2 = 10；最坏顺序 = 其他亏损在前，[4,2] 压轴</text>
  </g>

  <!-- 资金曲线 -->
  <g filter="url(#rough2)">
    <path d="M 90 130 L 90 320" stroke="#aaa" stroke-width="1.2" fill="none"/>
  </g>
  <text x="82" y="134" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">10</text>
  <text x="82" y="176" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">9</text>
  <text x="82" y="248" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">4</text>
  <text x="82" y="324" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">2</text>

  <g filter="url(#rough2)">
    <path d="M 90 130 L 210 130" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
    <path d="M 210 130 L 210 172" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
  </g>
  <path d="M 90 130 L 210 130 L 330 172 L 450 244 L 470 244 L 470 318" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="150" y="122">先做 [2,1]</text>
    <text x="270" y="164">再做 [5,0]</text>
    <text x="396" y="236">最后做 [4,2]</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="210" y="112">10 ≥ 2 ✓ → 9</text>
    <text x="330" y="152">9 ≥ 5 ✓ → 4</text>
    <text x="452" y="286">4 ≥ 4 ✓ → 2</text>
  </g>

  <g filter="url(#rough2)">
    <ellipse cx="450" cy="244" rx="6" ry="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <path d="M 450 236 L 450 200" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="196" font-size="12" fill="#d6a040" text-anchor="end" filter="url(#rough2)">卡脖子的一步：钱包只剩 4，恰够 cost 4</text>

  <g filter="url(#rough2)">
    <rect x="56" y="342" width="448" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="366">示例 2：[[3,0], [0,3]] → 亏损 Σloss = 3，盈利最大 cost = 0</text>
    <text x="280" y="390">answer = 3 + max(0, 0) = 3；钱数 3 的两条顺序：3→0→3 与 0→3→0 都走得通</text>
  </g>
</svg>
