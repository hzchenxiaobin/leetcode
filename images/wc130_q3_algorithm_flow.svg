<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：链表先落地成数组，再一遍扫描</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">链表不能随机访问，必须先把值读进数组</text>
  <rect x="150.0" y="64.0" width="260.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="87.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">遍历链表 → a[0..n-1]</text>
  <path d="M 280.0 104.0 L 280.0 122.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="122.0" width="260.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="144.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans 全置 0，栈 st 置空</text>
  <path d="M 280.0 160.0 L 280.0 178.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90.0" y="178.0" width="380.0" height="60.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="204.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for i：while 栈非空 且 a[栈顶] &lt; a[i]</text>
  <text x="280.0" y="218.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">→ ans[栈顶] = a[i]，弹栈；然后 push i</text>
  <path d="M 280.0 238.0 L 280.0 256.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="256.0" width="260.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="279.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 ans（残留下标保持 0）</text>
  <path d="M 470 208 C 510 206 510 141 412 141" stroke="#78909c" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="25.0" y="320.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">内层 while 的总迭代次数不超过 n：每个下标最多被弹一次。</text>
</svg>
