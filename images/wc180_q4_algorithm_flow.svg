<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：排序 → 入堆 → 维护 top-k → 更新答案</text>

  <!-- 开始 -->
  <rect x="225" y="44" width="110" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">开始</text>
  <path d="M 280,76 L 280,90" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 按效率降序排序 -->
  <rect x="175" y="94" width="210" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">工程师按效率 e 降序排序</text>
  <path d="M 280,134 L 280,148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="170" y="152" width="220" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">建空小顶堆；sum ← 0；ans ← 0</text>
  <path d="M 280,192 L 280,206" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：还有工程师？ -->
  <polygon points="280,210 400,246 280,282 160,246" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">还有未处理的</text>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">工程师 (e, s) ？</text>
  <text x="293" y="300" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 280,282 L 280,312" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入堆 -->
  <rect x="175" y="316" width="210" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">push(s)；sum += s</text>
  <path d="M 280,354 L 280,368" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断：堆超员？ -->
  <polygon points="280,372 368,404 280,436 192,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">堆大小 &gt; k ？</text>
  <text x="291" y="458" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 280,436 L 280,468" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 踢堆顶 -->
  <text x="380" y="394" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 368,404 L 398,404" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="382" width="146" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="400" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">sum -= 堆顶</text>
  <text x="475" y="418" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">pop()：踢最小速度</text>
  <path d="M 475,426 L 475,492 L 398,492" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新答案 -->
  <rect x="170" y="472" width="220" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="496" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">ans = max(ans, sum × e)</text>

  <!-- 循环回路 -->
  <path d="M 170,492 L 70,492 L 70,246 L 152,246" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" transform="rotate(-90 56 370)" filter="url(#rough2)">循环 n 轮</text>

  <!-- 结束分支 -->
  <text x="413" y="236" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 400,246 L 436,246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="224" width="104" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="492" y="242" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">返回</text>
  <text x="492" y="260" text-anchor="middle" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">ans % (1e9+7)</text>

  <!-- 易错提示 -->
  <rect x="340" y="530" width="200" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="552" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">易错：全程 long long，</text>
  <text x="440" y="570" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">中途不取模，最后才取模</text>
</svg>
