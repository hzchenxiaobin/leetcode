<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 → 步长 3 扫描，一票否决</text>
  <path d="M 180 34 Q 320 42 460 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><ellipse cx="320" cy="60" rx="62" ry="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始 (nums, k)</text>

  <path d="M 320 78 L 320 94" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="250" y="98" width="140" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="118" text-anchor="middle" font-size="13" fill="#2e6e2e">sort(nums) 升序</text>

  <path d="M 320 130 L 320 146" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="260" y="150" width="120" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="170" text-anchor="middle" font-size="13" fill="#2e6e2e">i = 0</text>

  <path d="M 320 182 L 320 200" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="245,238 320,204 395,238 320,272" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="243" text-anchor="middle" font-size="13" fill="#7a5415">i ≥ n ?</text>

  <path d="M 395 238 L 426 238" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="404" y="230" text-anchor="middle" font-size="11" fill="#8a3a36">是</text>
  <g filter="url(#sk)"><rect x="430" y="220" width="175" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="517" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans ✓</text>

  <path d="M 320 272 L 320 290" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="331" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>

  <g filter="url(#sk)"><polygon points="195,322 320,290 445,322 320,354" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#7a5415">nums[i+2] − nums[i]</text>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#7a5415">&gt; k ?</text>

  <path d="M 445 322 L 471 322" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="314" text-anchor="middle" font-size="11" fill="#8a3a36">是</text>
  <g filter="url(#sk)"><rect x="475" y="304" width="152" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="551" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">返回 [] 无解 ✗</text>

  <path d="M 320 354 L 320 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="331" y="368" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>

  <g filter="url(#sk)"><rect x="215" y="376" width="210" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#2b6e9e">收录 [a[i], a[i+1], a[i+2]]</text>

  <path d="M 320 408 L 320 424" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="260" y="428" width="120" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="448" text-anchor="middle" font-size="13" fill="#2b6e9e">i += 3</text>

  <path d="M 260 444 L 150 444 L 150 238 L 241 238" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="138" y="345" text-anchor="middle" font-size="11" fill="#4a8edb">下一组</text>

  <g filter="url(#sk)"><rect x="40" y="60" width="90" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="85" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">失败 = 无解</text>
  <path d="M 130 75 L 175 75 L 175 120 L 246 120" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
