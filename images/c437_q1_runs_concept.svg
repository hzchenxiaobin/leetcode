<svg xmlns="http://www.w3.org/2000/svg" width="680" height="496" viewBox="0 0 680 496" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="496" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：合法子串 ⇔ 完整覆盖一个长度恰为 k 的极长段</text>
  <path d="M 130 40 Q 340 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① run-length 分组 -->
  <text x="30" y="78" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① run-length 分组</text>
  <text x="118" y="108" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="150" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="86" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="286" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="354" y="86" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="167" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="201" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="235" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="269" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="303" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="337" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="371" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="201" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段1 L=3</text>
  <text x="269" y="140" text-anchor="middle" font-size="11" fill="#a06a1a" filter="url(#rough2)">段2 L=1</text>
  <text x="337" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段3 L=3</text>
  <g filter="url(#rough2)">
    <rect x="420" y="84" width="236" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="538" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">k = 3 时</text>
  <text x="538" y="124" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">段1 / 段3：L = 3 == k</text>
  <text x="538" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">整段即合法子串 ✓</text>

  <!-- ② L > k -->
  <text x="30" y="182" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">② L &gt; k（L=4, k=2）：三种放法都撞同字符</text>
  <g filter="url(#rough2)">
    <rect x="150" y="192" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="192" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="192" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="192" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="167" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="201" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="235" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="269" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)">
    <path d="M 150 240 v 6 h 68 v -6" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 184 264 v 6 h 68 v -6" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 218 288 v 6 h 68 v -6" stroke="#b85450" stroke-width="1.8" fill="none"/>
  </g>
  <text x="184" y="258" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">贴左 ✗ 右邻 = 'a'</text>
  <text x="218" y="282" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">居中 ✗ 两侧 = 'a'</text>
  <text x="252" y="306" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#rough2)">贴右 ✗ 左邻 = 'a'</text>
  <g filter="url(#rough2)">
    <rect x="420" y="186" width="236" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="538" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">段长 4 &gt; k = 2</text>
  <text x="538" y="230" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">无论贴左 / 贴右 / 居中</text>
  <text x="538" y="248" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">总有一侧留在段内</text>
  <text x="538" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">紧邻字符 = c ✗</text>

  <!-- ③ L == k -->
  <text x="30" y="346" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ L == k：整段即合法子串</text>
  <g filter="url(#rough2)">
    <rect x="150" y="356" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="184" y="356" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="218" y="356" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="252" y="356" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="286" y="356" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="167" y="378" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="201" y="378" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="235" y="378" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="269" y="378" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="303" y="378" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)">
    <path d="M 184 400 v 6 h 102 v -6" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <text x="235" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">k = 3 恰好覆盖整段 ✓</text>
  <text x="167" y="350" text-anchor="middle" font-size="10.5" fill="#a06a1a" filter="url(#rough2)">s[l−1] ≠ a</text>
  <text x="303" y="350" text-anchor="middle" font-size="10.5" fill="#a06a1a" filter="url(#rough2)">s[r] ≠ a</text>
  <text x="360" y="372" font-size="11" fill="#4a7a3a" filter="url(#rough2)">段外紧邻 ≠ c（极长性保证）</text>
  <text x="360" y="394" font-size="11" fill="#888" filter="url(#rough2)">L &lt; k：放不下，直接排除 ✗</text>

  <!-- key insight -->
  <g filter="url(#rough2)">
    <rect x="30" y="442" width="620" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：存在极长段长度恰为 k ⇔ true（严格相等；写成 L ≥ k 会在 "aaaa", k=2 上翻车）</text>
</svg>
