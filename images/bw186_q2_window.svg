<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">固定右端点 j：左端点最远只能到 j−k</text>
  <rect x="70" y="80" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="99.0" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="134" y="80" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="163.0" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="198" y="80" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="227.0" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="262" y="80" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="291.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="291.0" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <rect x="326" y="80" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="355.0" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>
  <rect x="326" y="72" width="58" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355.0" y="107.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">8</text>
  <text x="355.0" y="60" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">j=4</text>
  <line x1="99.0" y1="150" x2="99.0" y2="176" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="163.0" y1="150" x2="163.0" y2="176" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="227.0" y1="150" x2="227.0" y2="176" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="134" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">候选 i ≤ j−k = 2  (取其中最大值 5)</text>
  <rect x="60" y="216" width="400" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="234" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">维护 best 的滑动窗口</text>
  <text x="72" y="250" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">扫描 j 从 k 到 n−1：</text>
  <text x="72" y="265" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">① 把 nums[j−k] 并入「左侧最大值」best</text>
  <text x="72" y="280" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">② 候选答案 = best + nums[j]</text>
  <text x="72" y="295" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">③ 全程取最大 → O(n)、O(1) 空间</text>
  <text x="72" y="310" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)"></text>
  <text x="72" y="325" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">j=4: best = max(1,3,5) = 5 → 5+8 = 13 ✓</text>
</svg>
