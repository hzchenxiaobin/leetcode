<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c96a2b"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">查询归一化：三种情况一击判完</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== bar chart ===== -->
  <text x="330" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">heights = [6, 4, 8, 5, 2, 7]（示例 1）</text>

  <!-- bars: baseline y=360, 11px per unit -->
  <g filter="url(#sk)"><rect x="104" y="294" width="52" height="66" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="130" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">6</text>
  <g filter="url(#sk)"><rect x="182" y="316" width="52" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="208" y="308" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <g filter="url(#sk)"><rect x="260" y="272" width="52" height="88" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="286" y="264" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">8</text>
  <g filter="url(#sk)"><rect x="338" y="305" width="52" height="55" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="364" y="297" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
  <g filter="url(#sk)"><rect x="416" y="338" width="52" height="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="442" y="330" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="494" y="283" width="52" height="77" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="520" y="275" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">7</text>

  <!-- baseline -->
  <path d="M 88 360 L 560 360" stroke="#888" stroke-width="1.6" filter="url(#sk)"/>

  <!-- index labels -->
  <g font-size="10" fill="#666">
    <text x="130" y="378" text-anchor="middle">0</text>
    <text x="208" y="378" text-anchor="middle">1</text>
    <text x="286" y="378" text-anchor="middle" font-weight="bold" fill="#7a5415">2</text>
    <text x="364" y="378" text-anchor="middle">3</text>
    <text x="442" y="378" text-anchor="middle">4</text>
    <text x="520" y="378" text-anchor="middle" font-weight="bold" fill="#2e6e2e">5</text>
  </g>

  <!-- green arc: query [0,5], Alice direct jump -->
  <path d="M 130 288 Q 300 190 508 276" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="318" y="212" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">查 [0,5]：6 &lt; 7，Alice 一跳直达 Bob</text>
  <text x="318" y="228" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">→ 答案 5</text>

  <!-- orange arcs: query [0,1], both go right -->
  <path d="M 130 296 Q 196 234 274 262" stroke="#c96a2b" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 210 312 Q 244 268 278 266" stroke="#c96a2b" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="252" y="256" text-anchor="middle" font-size="10.5" fill="#a3541c" font-weight="bold">查 [0,1]：6 ≥ 4，两人同赴第一个 &gt; 6 的楼 → 答案 2</text>

  <!-- right note box -->
  <g filter="url(#sk)">
    <rect x="596" y="96" width="312" height="160" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="752" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">两个读题要点</text>
  <text x="614" y="142" font-size="10.5" fill="#444">1. 只能原地不动或向右走，</text>
  <text x="614" y="158" font-size="10.5" fill="#444">   故相遇点 ≥ hi = max(a, b)；</text>
  <text x="614" y="180" font-size="10.5" fill="#444">2. 一步可跳到右侧任意更高的楼：</text>
  <text x="614" y="196" font-size="10.5" fill="#444">   可达集 = {u} ∪ {j &gt; u : heights[j] &gt; heights[u]}</text>
  <text x="614" y="218" font-size="10.5" fill="#888">   （中转不会带来新的位置，白纸黑字</text>
  <text x="614" y="234" font-size="10.5" fill="#888">     比的就是两端高度）</text>

  <!-- ===== three case boxes ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="440" width="264" height="164" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="182" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">情况① a = b</text>
  <text x="70" y="490" font-size="11" fill="#444">两人已在同一栋楼，原地即相遇。</text>
  <text x="70" y="516" font-size="13" fill="#b03a3a" font-family="monospace" font-weight="bold">ans = a</text>
  <text x="70" y="544" font-size="10.5" fill="#666">例：查询 [2,2] → 2</text>
  <text x="70" y="570" font-size="10.5" fill="#888">最先特判，别去比较高度</text>
  <text x="70" y="590" font-size="10.5" fill="#888">（会误伤 a=b 的情况）</text>

  <g filter="url(#sk)">
    <rect x="338" y="440" width="264" height="164" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="470" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">情况② heights[lo] &lt; heights[hi]</text>
  <text x="358" y="490" font-size="11" fill="#444">矮的一方可一跳直达 hi，</text>
  <text x="358" y="508" font-size="11" fill="#444">而 Bob 可达位置都 ≥ hi，</text>
  <text x="358" y="526" font-size="11" fill="#444">hi 已是最左可能。</text>
  <text x="358" y="552" font-size="13" fill="#b03a3a" font-family="monospace" font-weight="bold">ans = hi</text>
  <text x="358" y="580" font-size="10.5" fill="#666">例：查询 [0,5] → 5</text>
  <text x="358" y="598" font-size="10.5" fill="#888">注意是严格小于才直达</text>

  <g filter="url(#sk)">
    <rect x="626" y="440" width="264" height="164" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="758" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">情况③ heights[lo] ≥ heights[hi]</text>
  <text x="646" y="488" font-size="10.5" fill="#444">hi 站不上去（需严格更高），</text>
  <text x="646" y="506" font-size="10.5" fill="#444">两人只能一起向右找更高的楼，</text>
  <text x="646" y="524" font-size="10.5" fill="#444">较高的 lo 是瓶颈：</text>
  <text x="646" y="548" font-size="11.5" fill="#b03a3a" font-family="monospace" font-weight="bold">ans = min{ j &gt; hi :</text>
  <text x="646" y="566" font-size="11.5" fill="#b03a3a" font-family="monospace" font-weight="bold">  heights[j] &gt; heights[lo] }，</text>
  <text x="646" y="584" font-size="10.5" fill="#666">不存在则 −1（例：[0,1] → 2）</text>

  <!-- insight strip -->
  <g filter="url(#sk)">
    <rect x="50" y="622" width="840" height="62" rx="8" fill="#f3eefa" stroke="#8a6eb8" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="646" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">情况①② O(1) 直接出答案；情况③ 统一为一个子问题</text>
  <text x="470" y="668" text-anchor="middle" font-size="11.5" fill="#5a3a7a">「位置 hi 右侧、第一个高度 &gt; x = heights[lo] 的下标」—— n、q 同为 5×10⁴，离线 + 单调栈一次扫描全解决</text>
</svg>
