<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="580" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每一对括号 = 一层作用域</text>
  <text x="290" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">求值发生在哪一层，就只在那一层及其外层里找变量</text>

  <rect x="24" y="74" width="320" height="280" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="40" y="96" font-size="13" fill="#2c4a66" filter="url(#rough2)">外层：let x 2   ⇒  x = 2</text>

  <rect x="44" y="150" width="280" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="172" font-size="13" fill="#2f5527" filter="url(#rough2)">内层：let x 3 y 4</text>
  <text x="60" y="194" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同名 x 覆盖外层，只在体内生效</text>

  <rect x="64" y="240" width="240" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="266" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(add x y) = 3 + 4 = 7</text>
  <text x="184" y="288" text-anchor="middle" font-size="11" fill="#a3772a" filter="url(#rough2)">x 命中内层 3，外层 2 被遮蔽</text>

  <rect x="380" y="96" width="176" height="54" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="120" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">最外层：无绑定</text>
  <text x="468" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查到底仍无 ⇒ 非法</text>

  <rect x="380" y="172" width="176" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="196" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">x = 2</text>
  <text x="468" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">查第 2 步才会用到</text>

  <rect x="380" y="248" width="176" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="272" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">x = 3, y = 4</text>
  <text x="468" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最先被检查</text>

  <path d="M 468 244 L 468 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 468 168 L 468 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">自内向外查找</text>

  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">括号决定边界　·　内层遮蔽外层　·　未命中就继续向外一层</text>
</svg>
