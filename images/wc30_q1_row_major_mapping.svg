<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="30" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：行优先序是不变量，reshape 只是重新切分</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">同一串长度 mn 的元素，形状不同只是「每行放几个」不同 ⇒ 一对一的下标换算</text>

  <text x="40" y="82" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">原矩阵 mat：m × n = 2 × 3</text>
  <g filter="url(#sk)" text-anchor="middle" font-size="12" fill="#33404f">
    <rect x="40" y="92" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="62" y="113">1</text>
    <rect x="84" y="92" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="113">2</text>
    <rect x="128" y="92" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="113">3</text>
    <rect x="40" y="124" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="62" y="145">4</text>
    <rect x="84" y="124" width="44" height="32" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="106" y="145">5</text>
    <rect x="128" y="124" width="44" height="32" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="150" y="145">6</text>
  </g>

  <text x="202" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">行优先展开</text>
  <path d="M 176 126 L 226 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="334" y="102" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#sk)">一维序列 a₀ … a₅（k 递增）</text>
  <g filter="url(#sk)" text-anchor="middle" font-size="11" fill="#33404f">
    <rect x="232" y="109" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="249" y="129">1</text>
    <rect x="266" y="109" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="283" y="129">2</text>
    <rect x="300" y="109" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="317" y="129">3</text>
    <rect x="334" y="109" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="351" y="129">4</text>
    <rect x="368" y="109" width="34" height="30" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.3"/>
    <text x="385" y="129">5</text>
    <rect x="402" y="109" width="34" height="30" rx="3" fill="#fff8e1" stroke="#b8860b" stroke-width="1.3"/>
    <text x="419" y="129">6</text>
  </g>
  <text x="334" y="156" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">k = i·n + j = 0 … 5</text>

  <text x="462" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">按 c 切分</text>
  <path d="M 440 126 L 482 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="488" y="72" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">目标 ans：r × c = 3 × 2</text>
  <g filter="url(#sk)" text-anchor="middle" font-size="12" fill="#33404f">
    <rect x="488" y="80" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="510" y="101">1</text>
    <rect x="532" y="80" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="554" y="101">2</text>
    <rect x="488" y="112" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="510" y="133">3</text>
    <rect x="532" y="112" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="554" y="133">4</text>
    <rect x="488" y="144" width="44" height="32" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="510" y="165">5</text>
    <rect x="532" y="144" width="44" height="32" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="554" y="165">6</text>
  </g>

  <rect x="40" y="188" width="560" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="56" y="208" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#sk)">两个方向都用「除以列数」：形参从 n 换成 c</text>
  <text x="56" y="228" font-size="10" fill="#555" filter="url(#sk)">二维 → 一维：k = i·n + j　　一维 → 目标：(r′, c′) = (k / c, k % c)</text>
  <text x="56" y="245" font-size="10" fill="#555" filter="url(#sk)">可行性判据：m·n == r·c（元素个数守恒）；不成立就原样返回 mat</text>

  <g filter="url(#sk)">
    <rect x="40" y="264" width="192" height="68" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="54" y="284" font-size="12" font-weight="bold" fill="#446688">① 先判可行</text>
    <text x="54" y="303" font-size="9.5" fill="#555">m·n ≠ r·c → 返回 mat</text>
    <text x="54" y="321" font-size="9.5" fill="#555">不要返回空矩阵</text>
  </g>
  <g filter="url(#sk)">
    <rect x="240" y="264" width="184" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="254" y="284" font-size="12" font-weight="bold" fill="#4a7a3a">② 一次遍历</text>
    <text x="254" y="303" font-size="9.5" fill="#555">k 从 0 递增到 mn−1</text>
    <text x="254" y="321" font-size="9.5" fill="#555">读 (k/n, k%n) 写 (k/c, k%c)</text>
  </g>
  <g filter="url(#sk)">
    <rect x="432" y="264" width="168" height="68" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="446" y="284" font-size="12" font-weight="bold" fill="#b85450">③ 不留中间数组</text>
    <text x="446" y="303" font-size="9.5" fill="#555">无需先展平再重建</text>
    <text x="446" y="321" font-size="9.5" fill="#555">额外空间 O(1)</text>
  </g>

  <text x="320" y="352" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">目标的一行可能横跨源的两行：本例 c = 2，ans 第 1 行 = 3 和 4，分别来自源的第 0、1 行</text>
  <text x="320" y="368" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#sk)">⇒ 只能按「元素下标」映射，不能整行整块拷贝；k 的遍历顺序天然保证行优先</text>
</svg>
