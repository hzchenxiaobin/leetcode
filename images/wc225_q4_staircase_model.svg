<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">角落阶梯金字塔：底层 T4 = 10 格，共放 20 个盒子</text>

  <!-- ===== 左：贴角俯视图 ===== -->
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">俯视：贴住两面墙</text>

  <line x1="58" y1="86" x2="58" y2="226" stroke="#888" stroke-width="4" filter="url(#rough2)"/>
  <line x1="58" y1="86" x2="198" y2="86" stroke="#888" stroke-width="4" filter="url(#rough2)"/>
  <text x="36" y="120" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">墙</text>
  <text x="210" y="80" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">墙</text>

  <rect x="60" y="88" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="88" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="109" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="128" y="88" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="143" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="162" y="88" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="177" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="122" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="94" y="122" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="109" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="128" y="122" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="143" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="156" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="94" y="156" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="109" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="190" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每格数字 = 该列堆的盒子数</text>
  <text x="150" y="270" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4+3+2+1+3+2+1+2+1+1 = 20</text>

  <!-- ===== 右：逐层盒子数 ===== -->
  <text x="432" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">逐层盒子数（上→下）</text>

  <text x="362" y="104" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">第4层 T1</text>
  <rect x="424" y="88" width="12" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="105" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="362" y="136" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">第3层 T2</text>
  <rect x="412" y="120" width="36" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="137" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="362" y="168" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">第2层 T3</text>
  <rect x="394" y="152" width="72" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="169" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <text x="362" y="200" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">底层 T4</text>
  <rect x="370" y="184" width="120" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="201" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">10</text>

  <text x="432" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 + 3 + 6 + 10 = 20</text>
  <text x="432" y="252" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">= F(4) = 4·5·6/6</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="60" y="292" width="440" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">底层占 T_h 格时，整个塔最多放 F(h) 个盒子</text>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">F(h) = 1 + 3 + 6 + ... + T_h = h(h+1)(h+2)/6</text>
</svg>
