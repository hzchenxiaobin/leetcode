<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，流式维护每桶最大值 best[d]</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="205" y="56" width="230" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="#333">初始化 ans = -1，best[1..9] = 0</text>
  <path d="M 320 94 L 320 110" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- take next -->
  <g filter="url(#sk)">
    <rect x="230" y="114" width="180" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="138" text-anchor="middle" font-size="13" fill="#333">取下一个数 x</text>
  <path d="M 320 152 L 320 168" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- max digit -->
  <g filter="url(#sk)">
    <rect x="230" y="172" width="180" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="196" text-anchor="middle" font-size="13" fill="#333">d ← x 的最大数位</text>
  <path d="M 320 210 L 320 228" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- decision 1 -->
  <g filter="url(#sk)">
    <polygon points="320,232 418,272 320,312 222,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">best[d] &gt; 0 ?</text>
  <path d="M 418 272 L 450 272" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="432" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 320 312 L 320 348" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="331" y="335" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <!-- ans update -->
  <g filter="url(#sk)">
    <rect x="454" y="253" width="168" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="538" y="277" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans = max(ans, x + best[d])</text>
  <path d="M 538 291 Q 538 342 405 350" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- update best -->
  <g filter="url(#sk)">
    <rect x="230" y="352" width="180" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#333">best[d] = max(best[d], x)</text>
  <path d="M 320 390 L 320 406" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <!-- decision 2 -->
  <g filter="url(#sk)">
    <polygon points="320,410 415,452 320,494 225,452" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="457" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">还有数吗 ?</text>
  <path d="M 225 452 C 108 452 108 133 226 133" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="146" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 415 452 L 446 452" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="428" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <!-- return -->
  <g filter="url(#sk)">
    <rect x="450" y="433" width="130" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="515" y="457" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- warning note -->
  <g filter="url(#sk)">
    <rect x="40" y="512" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="320" y="529" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">⚠ 关键顺序：先用旧 best[d] 配对，再用 x 更新 best[d]</text>
  <text x="320" y="546" text-anchor="middle" font-size="11" fill="#8a3a36">顺序颠倒会把 x 先写进 best[d]，再与 x 自己相加，得到 2x 的假配对</text>
</svg>
