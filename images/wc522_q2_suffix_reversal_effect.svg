<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 446"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="446" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">反转后缀 k：前缀不动 · 后缀反序代价不变 · 只有一条边改变</text>

  <!-- ===== 原串 ===== -->
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">原串 s 的边分解（总费用 = 起点 0 → s₀ → s₁ → … → sₙ₋₁ 各边代价之和）</text>

  <circle cx="64" cy="105" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="110" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="110" y="88" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s₀</text>
  <rect x="176" y="88" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="199" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s₁</text>
  <text x="250" y="110" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">…</text>
  <rect x="278" y="88" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sₖ₋₁</text>
  <rect x="384" y="88" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">sₖ</text>
  <text x="458" y="110" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">…</text>
  <rect x="516" y="88" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="544" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sₙ₋₁</text>

  <!-- 切点虚线 -->
  <path d="M366,74 L366,140" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="366" y="66" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">切点 k</text>

  <!-- 原串的边 -->
  <path d="M82,105 L107,105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M157,105 L174,105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M224,105 L240,105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M262,105 L276,105" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M331,105 L382,105" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M431,105 L452,105" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M466,105 L514,105" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="160" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">起点边 + 前缀边（k ≥ 1 时原样保留）</text>
  <text x="407" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">旧衔接边 δ(sₖ₋₁, sₖ)</text>
  <text x="544" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">后缀内部边</text>

  <!-- ===== 反转箭头 ===== -->
  <path d="M300,172 L300,212" stroke="#8a6d1f" stroke-width="3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="316" y="196" font-size="13.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">反转后缀 s[k..n−1]</text>

  <!-- ===== 新串 ===== -->
  <circle cx="64" cy="262" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="267" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="110" y="245" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s₀</text>
  <rect x="176" y="245" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="199" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s₁</text>
  <text x="250" y="267" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">…</text>
  <rect x="278" y="245" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sₖ₋₁</text>
  <rect x="384" y="245" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="412" y="267" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">sₙ₋₁</text>
  <rect x="466" y="245" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sₙ₋₂</text>
  <text x="547" y="267" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">…</text>
  <rect x="572" y="245" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595" y="267" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">sₖ</text>

  <!-- 新串的边 -->
  <path d="M82,262 L107,262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M157,262 L174,262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M224,262 L240,262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M262,262 L276,262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M331,262 L382,262" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M441,262 L464,262" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M523,262 L570,262" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="304" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">前缀原样保留，起点边不变</text>
  <text x="412" y="298" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">新衔接边 δ(sₖ₋₁, sₙ₋₁)（唯一真正的变化）</text>
  <text x="512" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">配对全部反序，但 δ(a,b)=δ(b,a) ⇒ 代价和不变</text>

  <!-- ===== 公式 ===== -->
  <rect x="40" y="334" width="560" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">total(k) = base − δ(prev, s[k]) + δ(prev, s[n−1])</text>
  <text x="320" y="373" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">prev = 0（k = 0，改的是起点边）或 s[k−1]（k ≥ 1）；k = n−1 时公式退化为 base</text>

  <rect x="40" y="394" width="560" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="419" text-anchor="middle" font-size="13.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans = min( base, total(0), total(1), …, total(n−1) )</text>
</svg>
