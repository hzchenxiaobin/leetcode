<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：判向 → 入度统计 → 唯一候选 → 度数检查</text>

  <rect x="270" y="36" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="53" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,62 L320,74" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="78" width="290" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">遍历每条边 [u,v]：deg[u]++、deg[v]++</text>
  <path d="M320,112 L320,124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="128" width="310" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">这条边的合法方向？</text>
  <text x="320" y="162" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">（颜色沿环前进一步）</text>

  <path d="M165,148 C120,148 117,170 117,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="202" width="195" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="117" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">colors[v] = next(colors[u])</text>
  <text x="117" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 取向 u→v，indeg[v]++</text>

  <path d="M475,148 C520,148 522,170 522,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="425" y="202" width="195" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">colors[u] = next(colors[v])</text>
  <text x="522" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 取向 v→u，indeg[u]++</text>

  <path d="M320,168 L320,194" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">都不成立</text>
  <rect x="225" y="198" width="190" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">两个方向都不成立</text>
  <text x="320" y="231" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">（含两端同色）→ 返回 −1</text>

  <path d="M117,246 C117,264 200,266 250,270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M522,246 C522,264 440,266 390,270" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="272" width="290" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="293" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">所有边定向完成，统计 indeg==0 的节点</text>
  <path d="M320,306 L320,318" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,320 430,350 320,380 210,350" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">入度 0 的节点</text>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">恰好 1 个？</text>

  <text x="446" y="342" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M430,350 L466,350" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="470" y="332" width="145" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="542" y="354" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <text x="332" y="392" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M320,380 L320,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,394 415,422 320,450 225,422" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="427" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">deg[r] ≤ 2 ？</text>

  <text x="207" y="414" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M225,422 L190,422" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="45" y="404" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="426" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <text x="432" y="414" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M415,422 L450,422" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="455" y="404" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="530" y="426" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 r ✓</text>
</svg>
