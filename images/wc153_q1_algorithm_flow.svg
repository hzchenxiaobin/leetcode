<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">四步 O(n)：归一化 → 总长 → 区间和 → 取较小</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">全部操作都是加法，没有任何模拟与回溯</text>

  <!-- ① -->
  <rect x="50" y="70" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="89" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 归一化方向</text>
  <text x="66" y="106" font-size="10" fill="#555555" filter="url(#rough2)">start &gt; destination 时交换两者</text>

  <path d="M 200 118 L 200 134" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="50" y="136" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="155" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 求整圈周长 total</text>
  <text x="66" y="172" font-size="10" fill="#555555" filter="url(#rough2)">一次遍历累加所有 distance[i]</text>

  <path d="M 200 184 L 200 200" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="50" y="202" width="300" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="221" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 求顺时针区间和 cw</text>
  <text x="66" y="238" font-size="10" fill="#555555" filter="url(#rough2)">累加 distance[start .. destination−1]</text>

  <path d="M 200 250 L 200 266" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ -->
  <rect x="50" y="268" width="300" height="48" fill="#f5f5f5" stroke="#888888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66" y="287" font-size="11" fill="#444444" font-weight="bold" filter="url(#rough2)">④ 补集就是另一条弧</text>
  <text x="66" y="304" font-size="10" fill="#555555" filter="url(#rough2)">ccw = total − cw，不必再扫一遍</text>

  <path d="M 200 316 L 200 332" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ -->
  <rect x="50" y="334" width="300" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="66" y="354" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⑤ 返回 min(cw, total − cw)</text>
  <text x="66" y="372" font-size="10" fill="#555555" filter="url(#rough2)">两个方向都能走，取更短的那条</text>

  <!-- 右侧解释面板 -->
  <rect x="372" y="70" width="168" height="262" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="386" y="94" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么只算一侧？</text>
  <text x="386" y="120" font-size="9.5" fill="#555555" filter="url(#rough2)">环上两个不同的站</text>
  <text x="386" y="138" font-size="9.5" fill="#555555" filter="url(#rough2)">之间恰好有两条弧：</text>
  <text x="386" y="160" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">· 顺时针：区间</text>
  <text x="386" y="176" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">  [start, destination)</text>
  <text x="386" y="198" font-size="9.5" fill="#b85450" filter="url(#rough2)">· 逆时针：补集</text>
  <text x="386" y="214" font-size="9.5" fill="#b85450" filter="url(#rough2)">  长度 = total − cw</text>
  <text x="386" y="240" font-size="9.5" fill="#555555" filter="url(#rough2)">两段拼起来正好走</text>
  <text x="386" y="256" font-size="9.5" fill="#555555" filter="url(#rough2)">完一圈，不重不漏。</text>
  <text x="386" y="282" font-size="9.5" fill="#555555" filter="url(#rough2)">所以另一条弧的长</text>
  <text x="386" y="298" font-size="9.5" fill="#555555" filter="url(#rough2)">度总是 total − cw，</text>
  <text x="386" y="314" font-size="9.5" fill="#555555" filter="url(#rough2)">只需算一次区间和。</text>

  <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">② 与 ③ 可以合进同一个循环：边累加 total，边判断下标是否落在 [start, destination)</text>
</svg>
