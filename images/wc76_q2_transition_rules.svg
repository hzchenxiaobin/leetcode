<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">状态转移表：两个条件决定四条边</text>
  <text x="360" y="58" text-anchor="middle" font-size="12.5" fill="#667" filter="url(#rough2)">K(i) / S(i)：前缀 0..i 严格递增、且第 i 列「不换 / 换」时的最少交换次数</text>

  <rect x="85" y="76" width="130" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="102" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">上一列状态</text>
  <rect x="221" y="76" width="212" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327" y="102" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">转移到 K(i)：第 i 列不换</text>
  <rect x="439" y="76" width="212" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="102" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">转移到 S(i)：第 i 列交换</text>

  <text x="150" y="152" text-anchor="middle" font-size="13.5" fill="#33604a" filter="url(#rough2)">K(i-1) 不换</text>
  <rect x="221" y="124" width="212" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327" y="157" text-anchor="middle" font-size="13.5" fill="#33604a" filter="url(#rough2)">A 成立 ⇒ 取 K(i-1)</text>
  <rect x="439" y="124" width="212" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="157" text-anchor="middle" font-size="13.5" fill="#8a6a20" filter="url(#rough2)">C 成立 ⇒ 取 K(i-1) + 1</text>

  <text x="150" y="212" text-anchor="middle" font-size="13.5" fill="#8f3b38" filter="url(#rough2)">S(i-1) 已换</text>
  <rect x="221" y="184" width="212" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327" y="217" text-anchor="middle" font-size="13.5" fill="#8a6a20" filter="url(#rough2)">C 成立 ⇒ 取 S(i-1)</text>
  <rect x="439" y="184" width="212" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="217" text-anchor="middle" font-size="13.5" fill="#33604a" filter="url(#rough2)">A 成立 ⇒ 取 S(i-1) + 1</text>

  <rect x="85" y="256" width="566" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="283" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">条件 A（同向可比）：nums1[i-1] &lt; nums1[i] 且 nums2[i-1] &lt; nums2[i]</text>

  <rect x="85" y="308" width="566" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="335" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">条件 C（交叉可比）：nums1[i-1] &lt; nums2[i] 且 nums2[i-1] &lt; nums1[i]</text>

  <text x="360" y="376" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">A、C 可同时成立：此时四条边都可用，逐项取 min；都不成立则该输入无解</text>
  <text x="360" y="402" text-anchor="middle" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">绿色 = 走「同向」条件 A，橙色 = 走「交叉」条件 C；每个目标格都取两条来源的最优</text>
</svg>
