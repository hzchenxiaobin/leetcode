<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：选哪个下标追加最划算</text>
  <rect x="24" y="58" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="124" y="78" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：nums1=[2,8]</text>
  <rect x="236" y="58" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="326" y="78" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums2=[1,7,3]，T=3</text>
  <rect x="428" y="58" width="178" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="517" y="78" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">base = 1+1 = 2</text>
  <rect x="24" y="96" width="60" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j=0</text>
  <rect x="92" y="96" width="132" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="158" y="121" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{2,1,3}</text>
  <rect x="232" y="96" width="180" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="322" y="121" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">max-min = 2</text>
  <rect x="420" y="96" width="186" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="513" y="121" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">extra = 2-1 = 1</text>
  <rect x="24" y="142" width="60" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j=1</text>
  <rect x="92" y="142" width="132" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="158" y="167" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{8,7,3}</text>
  <rect x="232" y="142" width="180" height="40" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="322" y="167" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">max-min = 5</text>
  <rect x="420" y="142" width="186" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="513" y="167" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">extra = 5-1 = 4</text>
  <rect x="24" y="192" width="582" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="315" y="214" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">取 j=0：答案 = 2 + 1 + 1 = 4 ✓</text>
  <rect x="24" y="224" width="582" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="244" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2：nums1=[1,3,6]，nums2=[2,4,5,3]，T=3，base=3</text>
  <rect x="24" y="264" width="60" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="54" y="287" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">j=0</text>
  <rect x="90" y="264" width="70" height="36" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="287" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">{1,2,3}</text>
  <rect x="166" y="264" width="54" height="36" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="193" y="287" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">2 - 1 = 1</text>
  <rect x="220" y="264" width="60" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="287" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">j=1</text>
  <rect x="286" y="264" width="70" height="36" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="321" y="287" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">{3,4,3}</text>
  <rect x="362" y="264" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="389" y="287" text-anchor="middle" font-size="9" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1 - 1 = 0 ✓</text>
  <rect x="416" y="264" width="60" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="446" y="287" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">j=2</text>
  <rect x="482" y="264" width="70" height="36" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="517" y="287" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">{6,5,3}</text>
  <rect x="558" y="264" width="54" height="36" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="585" y="287" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">3 - 1 = 2</text>
  <text x="315" y="322" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">取 j=1（a_j 恰等于 T，追加零调整）→ 答案 3 + 1 + 0 = 4 ✓</text>
  <text x="315" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">启示：优先挑「a_j 已经等于 T」或三点跨度小的下标</text>
</svg>
