<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5 逐日桌面变化（第 3 天起稳定）</text>

  <!-- ====== table header ====== -->
  <rect x="40" y="44" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">天数</text>
  <rect x="140" y="44" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">桌面集合</text>
  <rect x="330" y="44" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="63" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">当日新增（依据）</text>

  <!-- ====== row 1 ====== -->
  <rect x="40" y="76" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="96" text-anchor="middle" font-size="10.5" fill="#333">第 0 天</text>
  <rect x="140" y="76" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="96" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{5}</text>
  <rect x="330" y="76" width="200" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="96" text-anchor="middle" font-size="10" fill="#888">—（初始只有 n）</text>

  <!-- ====== row 2 ====== -->
  <rect x="40" y="110" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="130" text-anchor="middle" font-size="10.5" fill="#333">第 1 天</text>
  <rect x="140" y="110" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{2, 4, 5}</text>
  <rect x="330" y="110" width="200" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a">+2、+4（5%2=1、5%4=1）</text>

  <!-- ====== row 3 ====== -->
  <rect x="40" y="144" width="90" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="164" text-anchor="middle" font-size="10.5" fill="#333">第 2 天</text>
  <rect x="140" y="144" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="164" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">{2, 3, 4, 5}</text>
  <rect x="330" y="144" width="200" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a">+3（4%3=1）</text>

  <!-- ====== row 4 (stable) ====== -->
  <rect x="40" y="178" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">第 3 天起</text>
  <rect x="140" y="178" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">{2, 3, 4, 5}</text>
  <rect x="330" y="178" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="430" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a">无新增，桌面收敛</text>

  <!-- ====== answer ====== -->
  <path d="M 230 212 L 230 232" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="120" y="236" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">十亿天后：|{2,3,4,5}| = 4 = n − 1</text>

  <!-- ====== mini cases ====== -->
  <rect x="40" y="296" width="235" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="157" y="318" text-anchor="middle" font-size="10.5" fill="#333">n = 3：{3} →(3%2=1) {2,3}</text>
  <text x="157" y="338" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">答案 2 = n − 1</text>

  <rect x="285" y="296" width="235" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="402" y="318" text-anchor="middle" font-size="10.5" fill="#333">n = 1：{1} 永不变（1%1=0）</text>
  <text x="402" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">答案 1 ≠ n−1=0，需特判</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">规律：n ≥ 2 时终态恰为 {2,…,n}；比赛时可先打表 n=1..8 → 1,1,2,3,4,5,6,7</text>
</svg>
