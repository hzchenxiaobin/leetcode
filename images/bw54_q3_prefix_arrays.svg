<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">四个前缀和数组：行、列、两条对角线各 O(1) 查询</text>

  <!-- R：行前缀 -->
  <text x="150" y="66" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">R[i][j]：第 i 行前 j 列之和</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="80" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="77" y="101">4</text>
    <rect x="94" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="111" y="101">7</text>
    <rect x="128" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="145" y="101">9</text>
    <rect x="162" y="80" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="179" y="101">1</text>
    <text x="77" y="131">R[0][1]</text><text x="145" y="131">R[0][3]</text>
  </g>
  <path d="M 94 118 Q 128 122, 162 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="152" font-size="12.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">行段和 = R[i][c+k] − R[i][c]</text>

  <!-- C：列前缀 -->
  <text x="420" y="66" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">C[i][j]：前 i 行第 j 列之和</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="330" y="80" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="347" y="101">4</text>
    <rect x="330" y="114" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="347" y="135">9</text>
    <rect x="330" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/><text x="347" y="169">1</text>
    <rect x="364" y="80" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="381" y="101">5</text>
    <rect x="364" y="114" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="381" y="135">3</text>
    <rect x="364" y="148" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="381" y="169">3</text>
    <text x="347" y="200">C[·][0]</text>
  </g>
  <text x="420" y="152" font-size="12.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">列段和 = C[r+k][j] − C[r][j]</text>

  <!-- D/A：对角线 -->
  <text x="150" y="228" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">D（↘）与 A（↙）对角线前缀</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="244" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="77" y="265">4</text>
    <rect x="94" y="244" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="111" y="265">7</text>
    <rect x="128" y="244" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/><text x="145" y="265">9</text>
    <rect x="162" y="244" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="179" y="265">1</text>
    <rect x="60" y="278" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="77" y="299">5</text>
    <rect x="94" y="278" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="111" y="299">3</text>
    <rect x="128" y="278" width="34" height="34" fill="#fafafa" stroke="#bbb" rx="4"/><text x="145" y="299">3</text>
    <rect x="162" y="278" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/><text x="179" y="299">8</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 64 248 L 192 288" stroke="#d6a040" stroke-width="3" opacity="0.5"/>
    <path d="M 190 248 L 64 288" stroke="#446688" stroke-width="3" opacity="0.5"/>
  </g>
  <text x="150" y="332" font-size="12.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">D[i][j] = grid[i][j] + D[i−1][j−1]</text>
  <text x="150" y="350" font-size="12.5" fill="#33507a" text-anchor="middle" filter="url(#rough2)">A[i][j] = grid[i][j] + A[i−1][j+1]</text>

  <!-- 右下：角标处理 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="330" y="228" width="200" height="122" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <text x="430" y="252" text-anchor="middle" font-weight="bold" fill="#8a3a36">边界减法要当心</text>
    <text x="430" y="276" text-anchor="middle" font-size="12">对角线段和 = D[右下角]</text>
    <text x="430" y="294" text-anchor="middle" font-size="12">− D[左上角的外一格]</text>
    <text x="430" y="316" text-anchor="middle" font-size="12">（r=0 或 c=0 时外格不存在，</text>
    <text x="430" y="334" text-anchor="middle" font-size="12">　减 0，别越界访问）</text>
  </g>
</svg>
