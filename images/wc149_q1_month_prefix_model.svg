  <text x="36" y="172" font-size="11" fill="#2f5228" font-weight="bold" filter="url(#rough2)">闰年判定（格里高利历）</text>
  <text x="36" y="194" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">闰年 ⇔ y % 4 == 0 且 (y % 100 != 0 或 y % 400 == 0)</text>
  <text x="36" y="214" font-size="10" fill="#555" filter="url(#rough2)">例：2000 是闰年；1900 不是（整百必须被 400 整除）</text>
  <rect x="318" y="150" width="282" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="334" y="172" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">闰年只影响「2 月之后」</text>
  <text x="334" y="194" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">m ≥ 3 时前面的月份里含 2 月 → 答案 +1</text>
  <text x="334" y="214" font-size="10" fill="#555" filter="url(#rough2)">m ≤ 2 时还没经过 2 月 29 日 → 不修正</text>
  <rect x="20" y="242" width="580" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="11.5" fill="#30436b" filter="url(#rough2)">第 m 月 d 日 = C[m−1] + d + [闰年 且 m ≥ 3]，其中 C[0] = 0</text>
  <text x="310" y="312" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2019-02-10：C[1] = 31 → 31 + 10 = 41；2016-03-01：C[2] = 59 → 59 + 1 + 1 = 61</text>
