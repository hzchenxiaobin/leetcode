<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：窗口长则开销涨、窗口缩则开销降</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- top array -->
  <text x="228" y="88" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">nums =</text>
  <rect x="257" y="64" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="301" y="64" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="345" y="64" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="276" y="114" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="320" y="114" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="364" y="114" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <!-- left panel: expand -->
  <rect x="36" y="132" width="276" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 右端 r 右移：窗口扩张</text>
  <rect x="56" y="168" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="71" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="168" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="186" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">cost = (3−1)×2 = 4</text>
  <path d="M 96 202 L 96 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="218" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">并入 2</text>
  <rect x="56" y="230" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="71" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="230" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="124" y="230" width="30" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="139" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="248" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">cost = (3−1)×3 = 6</text>
  <text x="174" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">max 不减 · min 不增 · len+1 ⇒ cost 必不降</text>

  <!-- right panel: shrink -->
  <rect x="328" y="132" width="276" height="182" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">② 左端 l 右移：窗口收缩</text>
  <rect x="348" y="168" width="30" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="363" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="382" y="168" width="30" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="397" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="416" y="168" width="30" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="431" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="460" y="186" text-anchor="start" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">cost = 6</text>
  <path d="M 388 202 L 388 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="218" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">丢掉 1</text>
  <rect x="348" y="230" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="363" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="382" y="230" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="397" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="432" y="248" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">cost = (3−2)×2 = 2</text>
  <text x="466" y="294" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">子窗口极差、len 都不增 ⇒ cost 必不升</text>

  <!-- conclusion -->
  <rect x="36" y="330" width="568" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">固定 r：合法左端点恰为一段后缀 [L(r), r]；失效过的 l 永久失效，L(r) 单调不减</text>
  <text x="320" y="372" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⇒ 双指针：r 主扫、l 只进不退；窗口 max / min 交给两条单调队列 O(1) 维护</text>
  <text x="320" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = Σ (r − L(r) + 1)，一遍扫描 O(n)</text>
</svg>
