<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="620" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：单趟栈计数器扫描，终值 k 代入公式 (k+1)/2</text>
  <path d="M 150 38 Q 340 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- side note -->
  <g filter="url(#sk)"><rect x="100" y="196" width="190" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="195" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">易错提示</text>
  <g font-size="10.5" fill="#5c4512" filter="url(#sk)">
    <text x="112" y="240">· ']' 且 open = 0 → 跳过</text>
    <text x="112" y="258">· open 永不变负</text>
    <text x="112" y="276">· 终值 = 未匹配 [ 数 = k</text>
    <text x="112" y="294">· 别与「跌负 +2」版混写</text>
  </g>

  <!-- start -->
  <g filter="url(#sk)"><rect x="300" y="56" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="78" text-anchor="middle" font-size="12.5" fill="#33455c" filter="url(#sk)">开始：open ← 0，i ← 0</text>
  <path d="M 400 90 L 400 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- fetch -->
  <g filter="url(#sk)"><rect x="300" y="112" width="200" height="34" rx="8" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/></g>
  <text x="400" y="134" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">取 c = s[i]，i ← i + 1</text>
  <path d="M 400 146 L 400 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)"><polygon points="400,170 510,212 400,254 290,212" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="217" text-anchor="middle" font-size="12.5" fill="#33455c" filter="url(#sk)">c = '[' ?</text>
  <text x="522" y="205" font-size="11.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">是</text>
  <path d="M 510 212 L 546 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="272" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 400 254 L 400 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- action A -->
  <g filter="url(#sk)"><rect x="550" y="194" width="100" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="600" y="217" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#sk)">open++（入栈）</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)"><polygon points="400,282 510,324 400,366 290,324" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="329" text-anchor="middle" font-size="12.5" fill="#33455c" filter="url(#sk)">open &gt; 0 ?</text>
  <text x="522" y="317" font-size="11.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">是</text>
  <path d="M 510 324 L 546 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="410" y="384" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 400 366 L 400 390" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- action B -->
  <g filter="url(#sk)"><rect x="550" y="306" width="100" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="600" y="329" text-anchor="middle" font-size="11.5" fill="#2f5d25" filter="url(#sk)">open−−（消去）</text>

  <!-- action C -->
  <g filter="url(#sk)"><rect x="320" y="392" width="160" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="400" y="415" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">跳过：超前 ] 不入栈</text>

  <!-- actions to diamond 3 -->
  <path d="M 650 212 L 670 212 L 670 490 L 504 490" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 650 324 L 671 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 400 428 L 400 450" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3 -->
  <g filter="url(#sk)"><polygon points="400,452 500,490 400,528 300,490" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="400" y="495" text-anchor="middle" font-size="12.5" fill="#33455c" filter="url(#sk)">还有字符 ?</text>
  <text x="284" y="484" font-size="11.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">是</text>
  <path d="M 300 490 L 70 490 L 70 129 L 296 129" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="86" y="470" font-size="10.5" fill="#8a8f98" filter="url(#sk)">下一字符</text>
  <text x="410" y="546" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 400 528 L 400 550" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- final -->
  <g filter="url(#sk)"><rect x="300" y="552" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="400" y="571" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#sk)">返回 (open + 1) / 2</text>
  <text x="400" y="588" text-anchor="middle" font-size="10.5" fill="#3d6b31" filter="url(#sk)">（open 终值即 k = 未匹配数）</text>
</svg>
