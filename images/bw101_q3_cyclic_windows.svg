<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">循环数组：arr = [1, 4, 1, 3]，k = 2（n = 4）</text>

  <!-- 环形排列的四个格子 -->
  <g filter="url(#rough2)">
    <rect x="200" y="52" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="222" y="76" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="312" y="52" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="334" y="76" text-anchor="middle" font-size="14" fill="#333">4</text>
    <rect x="312" y="128" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="334" y="152" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="200" y="128" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="222" y="152" text-anchor="middle" font-size="14" fill="#333">3</text>
  </g>
  <text x="222" y="44" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下标 0</text>
  <text x="334" y="44" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下标 1</text>
  <text x="404" y="151" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下标 2</text>
  <text x="150" y="151" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">下标 3</text>
  <!-- 环形箭头提示循环 -->
  <path d="M 360 70 C 400 62, 400 148, 362 147" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 70 C 156 62, 156 148, 194 147" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">循环：最后一个的下一个是第一个</text>

  <!-- 相邻窗口 -->
  <text x="120" y="212" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">W₀ = a₀ + a₁</text>
  <text x="120" y="232" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">W₁ = a₁ + a₂</text>
  <text x="120" y="262" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">W₀ − W₁ = a₀ − a₂</text>

  <path d="M 208 240 L 268 240" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="280" y="204" width="248" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="404" y="228" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">所有窗口和相等</text>
  <text x="404" y="250" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">⟺ Wᵢ = Wᵢ₊₁ 对所有 i 成立</text>
  <text x="404" y="272" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">⟺ aᵢ = a₍ᵢ₊ₖ₎ mod n 对所有 i 成立</text>

  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">相邻窗口只差"滑出一个 aᵢ、滑入一个 a₍ᵢ₊ₖ₎"——约束自动消去中间项！</text>
</svg>
