<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">BIT 弧查询：环形弧 (prev, cur] 的存活数</text>

  <!-- 情形一：cur > prev -->
  <text x="60" y="66" font-size="13" fill="#2f4a66" filter="url(#rough2)">情形一：cur 大于 prev —— 弧不跨环尾</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="82" y="101" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="104" y="80" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="126" y="101" text-anchor="middle" fill="#8c3a36">2=prev</text>
    <rect x="148" y="80" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="170" y="101" text-anchor="middle" fill="#7a5a10">3</text>
    <rect x="192" y="80" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="214" y="101" text-anchor="middle" fill="#7a5a10">4</text>
    <rect x="236" y="80" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="258" y="101" text-anchor="middle" fill="#7a5a10">5</text>
    <rect x="280" y="80" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="302" y="101" text-anchor="middle" fill="#2f5527">6=cur</text>
    <rect x="324" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="346" y="101" text-anchor="middle" fill="#2f4a66">7</text>
    <rect x="368" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="390" y="101" text-anchor="middle" fill="#2f4a66">8</text>
  </g>
  <path d="M 126 122 L 302 122" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)" fill="none"/>
  <text x="140" y="140" font-size="12" fill="#2f5527" filter="url(#rough2)">cnt = Q(cur) − Q(prev)：橙绿格（弧 (prev,cur]，含 cur）</text>
  <text x="140" y="158" font-size="12" fill="#7a5a10" filter="url(#rough2)">moves = cnt − 1（cur 自身占一个名额）</text>

  <!-- 情形二：cur < prev -->
  <text x="60" y="206" font-size="13" fill="#2f4a66" filter="url(#rough2)">情形二：cur 小于 prev —— 弧跨过环尾，拆两段</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="220" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="82" y="241" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="104" y="220" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="126" y="241" text-anchor="middle" fill="#2f5527">2=cur</text>
    <rect x="148" y="220" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="170" y="241" text-anchor="middle" fill="#2f4a66">3</text>
    <rect x="192" y="220" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="214" y="241" text-anchor="middle" fill="#2f4a66">4</text>
    <rect x="236" y="220" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="258" y="241" text-anchor="middle" fill="#2f4a66">5</text>
    <rect x="280" y="220" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="302" y="241" text-anchor="middle" fill="#8c3a36">6=prev</text>
    <rect x="324" y="220" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="346" y="241" text-anchor="middle" fill="#7a5a10">7</text>
    <rect x="368" y="220" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="390" y="241" text-anchor="middle" fill="#7a5a10">8</text>
  </g>
  <path d="M 302 262 L 390 262 L 390 278" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" fill="none"/>
  <path d="M 390 278 L 390 296 L 126 296 L 126 266" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)" fill="none"/>
  <text x="330" y="310" font-size="12" fill="#2f5527" filter="url(#rough2)">绕过环尾：先 (prev, n]，再 [1, cur]</text>
  <text x="60" y="310" font-size="12" fill="#2f5527" filter="url(#rough2)">cnt = (Q(n) − Q(prev)) + Q(cur)</text>

  <!-- 底部说明 -->
  <rect x="60" y="330" width="400" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="347" font-size="12" fill="#7a5a10" filter="url(#rough2)">BIT 单点 ±1、前缀和 Q，两分支各一次查询拆分；</text>
  <text x="76" y="363" font-size="12" fill="#7a5a10" filter="url(#rough2)">总答案 = n（删除）+ Σ (cnt − 1)（移动），全程 O(n log n)。</text>
</svg>
