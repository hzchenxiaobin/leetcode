<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5ad"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">建图：i → j 当且仅当 j 落在 i 的圆内（有向！）</text>

  <!-- 炸弹 0：小圆 -->
  <circle cx="175" cy="205" r="62" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="175" cy="205" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="175" y="160" text-anchor="middle" font-size="12.5" fill="#2b3d52" filter="url(#rough2)">炸弹 0：(2, 1), r₀ = 3</text>

  <!-- 炸弹 1：大圆 -->
  <circle cx="320" cy="205" r="140" fill="#fff8e1" fill-opacity="0.4" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <circle cx="320" cy="205" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12.5" fill="#8a6d1a" filter="url(#rough2)">炸弹 1：(6, 1), r₁ = 4</text>

  <!-- 有向边：1 -> 0（存在） -->
  <path d="M 306 199 C 270 193, 235 194, 205 201" fill="none" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="255" y="238" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">距离 4 ≤ r₁ = 4 → 1 引爆 0</text>

  <!-- 反方向：不存在 -->
  <path d="M 192 222 C 230 246, 268 250, 300 240" fill="none" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="245" y="272" text-anchor="middle" font-size="12.5" fill="#8b949b" filter="url(#rough2)">距离 4 &gt; r₀ = 3 → 0 引不爆 1 ✗</text>

  <!-- 说明 -->
  <rect x="60" y="300" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">连锁 = 有向图可达：引爆 s 的集合</text>
  <text x="260" y="336" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">= 从 s 出发沿边可达的点集（含 s 自身）</text>
</svg>
