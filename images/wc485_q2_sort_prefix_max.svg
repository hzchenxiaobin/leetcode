<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：按成本排序后，j 的合法搭档永远是一段前缀</text>

  <!-- 原始行 -->
  <text x="118" y="75" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">原始：</text>
  <rect x="150" y="54" width="72" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, 1)</text>
  <rect x="232" y="54" width="72" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(8, 5)</text>
  <rect x="314" y="54" width="72" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 2)</text>
  <rect x="396" y="54" width="72" height="34" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 7)</text>
  <text x="480" y="75" text-anchor="start" font-size="9.5" fill="#777" filter="url(#rough2)">（c = 成本, p = 容量）</text>

  <!-- 排序箭头 -->
  <path d="M310,94 L310,114" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="108" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">按成本升序排序</text>

  <!-- 排序后行 -->
  <text x="138" y="150" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">排序后：</text>
  <rect x="150" y="118" width="88" height="56" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">成本 3</text>
  <line x1="162" y1="146" x2="226" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="194" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">容量 7</text>
  <rect x="252" y="118" width="88" height="56" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="296" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">成本 4</text>
  <line x1="264" y1="146" x2="328" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="296" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">容量 1</text>
  <rect x="354" y="118" width="88" height="56" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">成本 5</text>
  <line x1="366" y1="146" x2="430" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="398" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">容量 2</text>
  <rect x="456" y="118" width="88" height="56" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">成本 8</text>
  <line x1="468" y1="146" x2="532" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="500" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">容量 5</text>
  <rect x="552" y="130" width="74" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="589" y="150" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">budget=8</text>

  <!-- 搭档窗口（虚线框住第一台） -->
  <rect x="143" y="111" width="102" height="70" rx="8" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="194" y="200" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">搭档窗口：成本 &lt; 8−4 = 4</text>

  <!-- j 标注 -->
  <path d="M296,198 L296,180" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="200" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">枚举 j（成本 4）</text>

  <!-- pre 行 -->
  <text x="320" y="236" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">前缀最大容量：pre[k] = 前 k 台中容量的最大值</text>
  <rect x="152" y="246" width="84" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="265" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[1]=7</text>
  <rect x="254" y="246" width="84" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296" y="265" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[2]=7</text>
  <rect x="356" y="246" width="84" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="265" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[3]=7</text>
  <rect x="458" y="246" width="84" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="265" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">pre[4]=7</text>

  <!-- 公式框 -->
  <rect x="80" y="296" width="480" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">j 的最佳搭档 = 前缀里容量最大的那台 → 查 pre 即 O(1)</text>
  <text x="320" y="336" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">候选总容量 = cap[j] + pre[min(p, j)]，p 为窗口长度（成本和 &lt; budget 的前缀）</text>

  <!-- 单调性框 -->
  <rect x="80" y="358" width="480" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">j 增大 → budget − cost[j] 减小 → 窗口长度 p 单调不增</text>
  <text x="320" y="393" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">→ 双指针左移维护，排序后仅需 O(n)（也可每个 j 二分一次）</text>

  <!-- 底部警示 -->
  <rect x="60" y="414" width="520" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="437" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ min(p, j) 排除 j 自身；「只买一台 / 一台不买」要单独纳入答案</text>
</svg>
