<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="600" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按天扫描 + 小根堆：算法流程</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(n log n)，空间 O(n)</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="70" y="62" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="260" y="85" fill="#3a4a66">输入 events[i] = [start, end]，n ≤ 10⁵</text>

    <rect x="70" y="122" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="260" y="145" fill="#3a4a66">按 start 升序排序（end 不参与排序）</text>

    <rect x="70" y="182" width="380" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="260" y="200" fill="#3a4a66">day = 所有 start 的最小值，i = 0，堆 = ∅</text>
    <text x="260" y="217" fill="#3a4a66">堆中只保存会议的结束日 end</text>

    <rect x="100" y="248" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="260" y="269" fill="#8a6a20">while i &lt; n 或 堆非空：</text>

    <rect x="60" y="306" width="400" height="32" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" rx="6"/>
    <text x="260" y="326" fill="#555">① 跳跃：堆空且 day &lt; start[i] ⇒ day = start[i]</text>

    <rect x="60" y="352" width="400" height="32" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" rx="6"/>
    <text x="260" y="372" fill="#555">② 入池：所有 start ≤ day 的会议 push(end)</text>

    <rect x="60" y="398" width="400" height="32" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" rx="6"/>
    <text x="260" y="418" fill="#555">③ 清过期：while 堆顶 end &lt; day ⇒ pop</text>

    <rect x="60" y="444" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="260" y="464" fill="#3a5a30">④ 参会：若堆非空 ⇒ pop 最小 end，ans += 1</text>

    <rect x="60" y="490" width="400" height="32" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" rx="6"/>
    <text x="260" y="510" fill="#555">⑤ 前进：day += 1，回到 while 判断</text>

    <rect x="130" y="546" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="260" y="568" fill="#8a3a36">返回 ans</text>
  </g>

  <g stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 260 98 L 260 120" marker-end="url(#arr)"/>
    <path d="M 260 158 L 260 180" marker-end="url(#arr)"/>
    <path d="M 260 224 L 260 246" marker-end="url(#arr)"/>
    <path d="M 260 282 L 260 304" marker-end="url(#arr)"/>
    <path d="M 260 338 L 260 350" marker-end="url(#arr)"/>
    <path d="M 260 384 L 260 396" marker-end="url(#arr)"/>
    <path d="M 260 430 L 260 442" marker-end="url(#arr)"/>
    <path d="M 260 476 L 260 488" marker-end="url(#arr)"/>
    <path d="M 260 522 L 260 544" marker-end="url(#arr)"/>
  </g>

  <path d="M 462 265 L 484 265 L 484 506 L 464 506" stroke="#666" stroke-width="1.4" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="392" font-size="9.5" fill="#888" text-anchor="middle"
        transform="rotate(90 509 392)" filter="url(#rough2)">回到 while</text>
</svg>
