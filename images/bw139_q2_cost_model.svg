<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">把健康值换算成路径代价：数一数踩了几个 1</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">示例 3：grid 全 1、中心为 0，health = 5</text>

  <rect x="70" y="80" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="126" y="80" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="80" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="70" y="136" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="126" y="136" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="136" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="70" y="192" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="126" y="192" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="182" y="192" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>

  <text x="98" y="114" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="154" y="114" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="210" y="114" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="98" y="170" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="154" y="170" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold">0</text>
  <text x="210" y="170" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="98" y="226" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="154" y="226" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>
  <text x="210" y="226" text-anchor="middle" font-size="15" fill="#8a3a36" font-weight="bold">1</text>

  <path d="M 98 108 L 140 108 L 154 122 L 154 158 L 168 170 L 210 170 L 210 212" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="70" text-anchor="middle" font-size="9.5" fill="#4a7a3a">起点</text>
  <text x="216" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a">终点</text>

  <rect x="300" y="80" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="10.5" fill="#3a4a66">起点也是 1 → 进门前先扣 1 点血</text>

  <rect x="300" y="118" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="138" text-anchor="middle" font-size="10.5" fill="#8a6a20">该路径踩到 4 个「1」→ 代价 = 4</text>

  <rect x="300" y="156" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="middle" font-size="10.5" fill="#3a5a30">health − 代价 = 5 − 4 = 1 &gt; 0 ✓</text>

  <rect x="300" y="194" width="220" height="30" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="410" y="214" text-anchor="middle" font-size="10" fill="#666">若 health = 4：4 − 4 = 0 ✗ 到不了</text>

  <rect x="40" y="268" width="480" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">代价只增不减 ⟹ 「全程为正」等价于「终点仍为正」</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#555">于是问题化为：求最小代价路径，判断 minCost ≤ health − 1</text>
</svg>
