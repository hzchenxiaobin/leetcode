<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：前缀和 + 按区间长度递推，右上角 dp[0][n−1] 即答案</text>
  <path d="M 200 42 Q 450 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">每个 dp[i][j] 只依赖「正下方 dp[i+1][j]」与「正左方 dp[i][j−1]」—— 都比当前区间短 1，按对角线推进即可</text>

  <!-- left pipeline -->
  <rect x="40" y="84" width="400" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">① 建前缀和：prefix[k] = stones[0] + … + stones[k−1]</text>
  <text x="240" y="126" text-anchor="middle" font-size="11.5" fill="#33506e" filter="url(#rough2)">sum(l, r) = prefix[r+1] − prefix[l]，任意区间和 O(1)</text>
  <path d="M 240 138 L 240 152" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="40" y="154" width="400" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">② 边界：长度 1 的主对角线 dp[i][i] = 0</text>
  <text x="240" y="196" text-anchor="middle" font-size="11.5" fill="#3a6a2a" filter="url(#rough2)">移除唯一石子后剩余为空，本回合得 0 分</text>
  <path d="M 240 208 L 240 222" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="40" y="224" width="400" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ 按长度递推：len = 2 … n，i = 0 … n−len，j = i+len−1</text>
  <text x="240" y="272" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">dp[i][j] = max( sum(i+1,j) − dp[i+1][j] ,</text>
  <text x="240" y="292" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">sum(i,j−1) − dp[i][j−1] )</text>
  <text x="240" y="310" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">两个分支分别是「移除左端」「移除右端」，sum 全走前缀和</text>
  <path d="M 240 320 L 240 334" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="40" y="336" width="400" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">④ 返回 dp[0][n−1]</text>
  <text x="240" y="378" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">整段区间上爱丽丝先手的最大净赚（爱丽丝 − 鲍勃）</text>

  <!-- right dependency grid -->
  <text x="650" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">依赖方向：格子只看「正下方」和「正左方」</text>
  <g filter="url(#rough2)">
    <rect x="520" y="100" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="568" y="100" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="616" y="100" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="664" y="100" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="712" y="100" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="568" y="148" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="616" y="148" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="664" y="148" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="712" y="148" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="616" y="196" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="664" y="196" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="712" y="196" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="664" y="244" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="712" y="244" width="44" height="38" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1"/>
    <rect x="712" y="292" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="542" y="123" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="590" y="171" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="638" y="219" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="686" y="267" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="734" y="315" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="734" y="123" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">答案</text>
  <text x="638" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dp[i][j]</text>
  <text x="638" y="219" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dp[i+1][j]</text>
  <text x="686" y="171" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dp[i][j−1]</text>
  <path d="M 638 194 L 638 189" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 660 167 L 665 167" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 762 311 Q 796 215 762 123" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="810" y="220" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 810 220)" filter="url(#rough2)">填表顺序：len 递增</text>
  <text x="500" y="122" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <text x="500" y="266" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i = 2</text>
  <text x="512" y="92" font-size="10.5" fill="#888" filter="url(#rough2)">j = 0 … 4 →</text>
  <text x="650" y="350" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">正在填 dp[i][j] 时，正下方与正左方（都是 len−1 的区间）早已算好</text>
  <text x="650" y="370" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">绿色对角线（len=1）全 0 起步，沿虚线方向推进到右上角</text>

  <!-- rolling array note -->
  <rect x="40" y="406" width="820" height="96" rx="10" fill="#f0f7f1" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="430" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">滚动数组：一维 dp[j] 就够（空间 O(n²) → O(n)）</text>
  <text x="60" y="452" font-size="11.5" fill="#333" filter="url(#rough2)">· dp[i][j] 只依赖「下一行 i+1」与「本行左侧 j−1」→ 外层 i 从 n−1 降到 0，内层 j 从 i+1 升到 n−1</text>
  <text x="60" y="472" font-size="11.5" fill="#333" filter="url(#rough2)">· 计算 dp[j] 时：dp[j] 尚未被覆盖，存的正是 dp[i+1][j]；dp[j−1] 刚更新过，已是 dp[i][j−1]</text>
  <text x="60" y="492" font-size="11.5" fill="#333" filter="url(#rough2)">· n = 1000 时：二维表 4 MB → 一维 8 KB；时间不变 O(n²)</text>
</svg>
