<svg xmlns="http://www.w3.org/2000/svg" width="940" height="820" viewBox="0 0 940 820" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="820" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "leetcode"，k = 4，letter = "e"，repetition = 2</text>
  <path d="M 240 40 Q 470 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：字符格与 suffix -->
  <text x="152" y="66" font-size="11" fill="#7a5415" text-anchor="end" font-weight="bold">suffix[i]</text>
  <text x="152" y="86" font-size="11" fill="#888" text-anchor="end">s[i]</text>
  <g filter="url(#sk)">
    <rect x="170" y="72" width="46" height="46" rx="4" fill="#f0f0ee" stroke="#9a9a9a" stroke-width="1.3"/>
    <rect x="216" y="72" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="262" y="72" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="308" y="72" width="46" height="46" rx="4" fill="#f0f0ee" stroke="#9a9a9a" stroke-width="1.3"/>
    <rect x="354" y="72" width="46" height="46" rx="4" fill="#f0f0ee" stroke="#9a9a9a" stroke-width="1.3"/>
    <rect x="400" y="72" width="46" height="46" rx="4" fill="#f0f0ee" stroke="#9a9a9a" stroke-width="1.3"/>
    <rect x="446" y="72" width="46" height="46" rx="4" fill="#f0f0ee" stroke="#9a9a9a" stroke-width="1.3"/>
    <rect x="492" y="72" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="193" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">3</text>
  <text x="239" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">3</text>
  <text x="285" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">2</text>
  <text x="331" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">1</text>
  <text x="377" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">1</text>
  <text x="423" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">1</text>
  <text x="469" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">1</text>
  <text x="515" y="68" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">1</text>
  <text x="193" y="101" text-anchor="middle" font-size="15" fill="#333">l</text>
  <text x="239" y="101" text-anchor="middle" font-size="15" fill="#333">e</text>
  <text x="285" y="101" text-anchor="middle" font-size="15" fill="#333">e</text>
  <text x="331" y="101" text-anchor="middle" font-size="15" fill="#333">t</text>
  <text x="377" y="101" text-anchor="middle" font-size="15" fill="#333">c</text>
  <text x="423" y="101" text-anchor="middle" font-size="15" fill="#333">o</text>
  <text x="469" y="101" text-anchor="middle" font-size="15" fill="#333">d</text>
  <text x="515" y="101" text-anchor="middle" font-size="15" fill="#333">e</text>
  <text x="193" y="134" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="239" y="134" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="285" y="134" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="331" y="134" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="377" y="134" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="423" y="134" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="469" y="134" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="515" y="134" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="570" y="86" font-size="11" fill="#888">黄格 = letter "e"</text>
  <text x="570" y="104" font-size="11" fill="#888">需选 k=4 个，其中 ≥ 2 个 e</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="150" width="830" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="78" y="170" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">i</text>
  <text x="120" y="170" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">c</text>
  <text x="148" y="170" font-size="11.5" fill="#2b6e9e" font-weight="bold">弹栈（while 循环）</text>
  <text x="488" y="170" font-size="11.5" fill="#2b6e9e" font-weight="bold">入栈决策</text>
  <text x="808" y="170" font-size="11.5" fill="#2b6e9e" font-weight="bold">栈（底→顶）</text>

  <!-- 行 0 -->
  <g filter="url(#sk)">
    <rect x="60" y="184" width="830" height="62" rx="3" fill="#fdfcf7" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="120" y="212" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <text x="148" y="208" font-size="10.5" fill="#888">栈空，无栈顶可弹</text>
  <text x="488" y="208" font-size="10.5" fill="#444">非 letter 席位检查：suffix=3 ≥ 2 ✓</text>
  <text x="488" y="228" font-size="10.5" fill="#444">空位 k−0−1=3 ≥ 2 ✓ → 入栈</text>
  <text x="808" y="212" font-size="11.5" fill="#4a7a3a" font-weight="bold">[l]</text>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="248" width="830" height="62" rx="3" fill="#f7f5ee" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="276" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="120" y="276" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="148" y="266" font-size="10.5" fill="#444">l &gt; e：弹出 l</text>
  <text x="148" y="286" font-size="10.5" fill="#888">（长度 0−1+8 ≥ 4 ✓，l 非 letter ✓）</text>
  <text x="488" y="276" font-size="10.5" fill="#2e6e2e" font-weight="bold">c == letter → 入栈，cnt=1</text>
  <text x="808" y="276" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e]</text>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="312" width="830" height="62" rx="3" fill="#fdfcf7" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="340" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="120" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="148" y="340" font-size="10.5" fill="#888">e = e 不满足严格大于，不弹</text>
  <text x="488" y="340" font-size="10.5" fill="#2e6e2e" font-weight="bold">c == letter → 入栈，cnt=2</text>
  <text x="808" y="340" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, e]</text>

  <!-- 行 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="376" width="830" height="62" rx="3" fill="#f7f5ee" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="404" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="120" y="404" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <text x="148" y="404" font-size="10.5" fill="#888">e &lt; t，不弹</text>
  <text x="488" y="398" font-size="10.5" fill="#444">非 letter：suffix=1 ≥ 2−2=0 ✓</text>
  <text x="488" y="418" font-size="10.5" fill="#444">空位 4−2−1=1 ≥ 0 ✓ → 入栈</text>
  <text x="808" y="404" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, e, t]</text>

  <!-- 行 4（字母约束） -->
  <g filter="url(#sk)">
    <rect x="60" y="440" width="830" height="78" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="78" y="480" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="120" y="480" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <text x="148" y="462" font-size="10.5" fill="#444">t &gt; c：弹出 t（非 letter）</text>
  <text x="148" y="480" font-size="10.5" fill="#444">e &gt; c：字母检查 cnt+suffix=2+1=3 &gt; 2 ✓ 弹出，cnt=1</text>
  <text x="148" y="498" font-size="10.5" fill="#a04038" font-weight="bold">再弹 e？字母检查 1+1=2 ≤ 2 ✗ 停！（letter 名额告急）</text>
  <text x="488" y="462" font-size="10.5" fill="#444">非 letter：suffix=1 ≥ 2−1=1 ✓</text>
  <text x="488" y="480" font-size="10.5" fill="#444">空位 4−1−1=2 ≥ 1 ✓ → 入栈</text>
  <text x="808" y="480" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, c]</text>
  <text x="920" y="456" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">★字母约束</text>

  <!-- 行 5 -->
  <g filter="url(#sk)">
    <rect x="60" y="522" width="830" height="62" rx="3" fill="#fdfcf7" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="550" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="120" y="550" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <text x="148" y="550" font-size="10.5" fill="#888">c &lt; o，不弹</text>
  <text x="488" y="544" font-size="10.5" fill="#444">非 letter：suffix=1 ≥ 1 ✓</text>
  <text x="488" y="564" font-size="10.5" fill="#444">空位 4−2−1=1 ≥ 1 ✓ → 入栈</text>
  <text x="808" y="550" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, c, o]</text>

  <!-- 行 6（严格大于判定） -->
  <g filter="url(#sk)">
    <rect x="60" y="588" width="830" height="78" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="78" y="628" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="120" y="628" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <text x="148" y="610" font-size="10.5" fill="#444">o &gt; d：弹出 o（非 letter）</text>
  <text x="148" y="628" font-size="10.5" fill="#444">栈顶 c &lt; d：不满足「严格大于」</text>
  <text x="148" y="646" font-size="10.5" fill="#a04038" font-weight="bold">停止——相等或更小都不弹（i=2 的 e=e 同理）</text>
  <text x="488" y="610" font-size="10.5" fill="#444">非 letter：suffix=1 ≥ 1 ✓</text>
  <text x="488" y="628" font-size="10.5" fill="#444">空位 4−2−1=1 ≥ 1 ✓ → 入栈</text>
  <text x="808" y="628" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, c, d]</text>
  <text x="920" y="604" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">★严格大于</text>

  <!-- 行 7 -->
  <g filter="url(#sk)">
    <rect x="60" y="670" width="830" height="62" rx="3" fill="#f7f5ee" stroke="#ddd8cc" stroke-width="0.8"/>
  </g>
  <text x="78" y="698" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="120" y="698" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <text x="148" y="698" font-size="10.5" fill="#888">d &lt; e，不弹</text>
  <text x="488" y="692" font-size="10.5" fill="#2e6e2e" font-weight="bold">c == letter → 入栈，cnt=2</text>
  <text x="488" y="712" font-size="10.5" fill="#888">size = 4 = k，扫描结束</text>
  <text x="808" y="698" font-size="11.5" fill="#4a7a3a" font-weight="bold">[e, c, d, e]</text>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="60" y="744" width="830" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="475" y="768" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">最终栈 = "ecde"：长度 4 ✓，含 2 个 e ✓ —— 与期望输出一致</text>
  <text x="475" y="790" text-anchor="middle" font-size="10.5" fill="#666">i=4 的字母约束拦截保住必需的 e，i=2、i=6 的「严格大于」判定同为关键；长度约束与席位预留在本例未触发，但缺一不可</text>
</svg>
