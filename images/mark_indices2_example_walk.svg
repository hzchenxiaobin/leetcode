<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：check(6) 恰好卡线通过</text>
  <text x="260" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">nums = [3,2,3]，changeIndices = [1,3,2,2,2,2,3]，基准 total = 8+3 = 11</text>

  <!-- 表头 -->
  <rect x="37" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="81" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="125" y="56" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="305" y="56" width="90" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="395" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="439" y="56" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">秒 s</text>
  <text x="103" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ci[s]</text>
  <text x="215" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="350" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小根堆</text>
  <text x="417" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="461" y="75" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt</text>

  <!-- 行 6 -->
  <rect x="37" y="90" width="446" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="103" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="109" font-size="11" fill="#333" filter="url(#rough2)">非最早出现 → 当标记秒</text>
  <text x="350" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="417" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="461" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 5 -->
  <rect x="37" y="122" width="446" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="103" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="141" font-size="11" fill="#333" filter="url(#rough2)">非最早出现 → 当标记秒</text>
  <text x="350" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="417" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="461" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 4 -->
  <rect x="37" y="154" width="446" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="59" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="103" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="173" font-size="11" fill="#333" filter="url(#rough2)">非最早出现 → 当标记秒</text>
  <text x="350" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }</text>
  <text x="417" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="461" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 3：首次出现 -->
  <rect x="37" y="186" width="446" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="103" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="205" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最早出现✓ 入堆 2（省 1 秒）</text>
  <text x="350" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="417" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="461" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 2 -->
  <rect x="37" y="218" width="446" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="103" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="237" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最早出现✓ 入堆 3（省 2 秒）</text>
  <text x="350" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3}</text>
  <text x="417" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="461" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 1 -->
  <rect x="37" y="250" width="446" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="59" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="103" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="269" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最早出现✓ 入堆 3（省 2 秒）</text>
  <text x="350" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3,3}</text>
  <text x="417" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="461" y="269" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 结论框 -->
  <rect x="37" y="290" width="446" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="308" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 6 ≤ 6 ✓ 可行：三个候选恰好挤进 3 个名额</text>
  <text x="53" y="325" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对应官方方案：秒 1/2/3 清零下标 1/3/2，秒 4/5/6 依次标记</text>

  <!-- check(5) 对照框 -->
  <rect x="37" y="338" width="446" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="357" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">check(5)：只有秒 4、5 贡献名额（cnt 停在 2），扫到秒 1 时堆 {2,3,3} 超员</text>
  <text x="53" y="376" font-size="11.5" fill="#b85450" filter="url(#rough2)">→ 踢出最小 2：total 回到 7 &gt; 5 ✗ 不可行 ⇒ 答案为 6</text>
</svg>
