<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a2b"/>
    </marker>
    <marker id="arrBl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a8edb"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#fafafa"/>

  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描演算：输出矩阵复用 + 滚动变量</text>
  <text x="460" y="54" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">以 grid = [[1,2],[3,4]] 为例，拍扁 a = [1,2,3,4]，N = 4</text>

  <!-- k 下标 -->
  <text x="232" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=0</text>
  <text x="296" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=1</text>
  <text x="360" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=2</text>
  <text x="424" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k=3</text>

  <!-- 第一遍：装后缀 -->
  <text x="40" y="94" font-size="13" font-weight="bold" fill="#c98a2b" filter="url(#rough2)">第一遍</text>
  <text x="40" y="110" font-size="11" fill="#c98a2b" filter="url(#rough2)">右→左 装后缀</text>
  <rect x="200" y="76" width="64" height="38" rx="4" fill="#f0d9a8" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="76" width="64" height="38" rx="4" fill="#f0d9a8" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="76" width="64" height="38" rx="4" fill="#f0d9a8" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="392" y="76" width="64" height="38" rx="4" fill="#f0d9a8" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="99" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">24</text>
  <text x="296" y="99" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">12</text>
  <text x="360" y="99" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">4</text>
  <text x="424" y="99" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#rough2)">1</text>
  <text x="232" y="140" text-anchor="middle" font-size="10" fill="#c98a2b" filter="url(#rough2)">suf=24</text>
  <text x="296" y="140" text-anchor="middle" font-size="10" fill="#c98a2b" filter="url(#rough2)">suf=12</text>
  <text x="360" y="140" text-anchor="middle" font-size="10" fill="#c98a2b" filter="url(#rough2)">suf=4</text>
  <text x="424" y="140" text-anchor="middle" font-size="10" fill="#c98a2b" filter="url(#rough2)">suf=1</text>
  <path d="M 424 156 L 216 156" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="10" fill="#c98a2b" filter="url(#rough2)">写入时 suf 恰为 a[k+1..N−1] 之积（滚动 1→4→12→24）</text>
  <path d="M 170 120 L 170 180" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二遍：乘前缀 -->
  <text x="40" y="202" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">第二遍</text>
  <text x="40" y="218" font-size="11" fill="#2b6e9e" filter="url(#rough2)">左→右 乘前缀</text>
  <rect x="200" y="186" width="64" height="38" rx="4" fill="#d9e8f7" stroke="#4a8edb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="186" width="64" height="38" rx="4" fill="#d9e8f7" stroke="#4a8edb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="186" width="64" height="38" rx="4" fill="#d9e8f7" stroke="#4a8edb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="392" y="186" width="64" height="38" rx="4" fill="#d9e8f7" stroke="#4a8edb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="209" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">24</text>
  <text x="296" y="209" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">12</text>
  <text x="360" y="209" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">8</text>
  <text x="424" y="209" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">6</text>
  <text x="232" y="250" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#rough2)">24×1</text>
  <text x="296" y="250" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#rough2)">12×1</text>
  <text x="360" y="250" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#rough2)">4×2</text>
  <text x="424" y="250" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#rough2)">1×6</text>
  <path d="M 216 264 L 424 264" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arrBl)" filter="url(#rough2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="10" fill="#2b6e9e" filter="url(#rough2)">乘入时 pre 恰为 a[0..k−1] 之积（滚动 1→1→2→6→24）</text>
  <path d="M 170 230 L 170 300" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还原二维 -->
  <text x="40" y="330" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">还原</text>
  <text x="40" y="346" font-size="11" fill="#2e6e2e" filter="url(#rough2)">二维矩阵 p</text>
  <rect x="200" y="306" width="64" height="38" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="306" width="64" height="38" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="344" width="64" height="38" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="344" width="64" height="38" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="329" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">24</text>
  <text x="296" y="329" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">12</text>
  <text x="232" y="367" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <text x="296" y="367" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <text x="420" y="345" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">与示例 1 输出 [[24,12],[8,6]] 一致 ✓</text>

  <!-- 底注 -->
  <rect x="120" y="414" width="680" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="438" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">额外空间只有 pre / suf 两个滚动变量（O(1)）</text>
  <text x="460" y="460" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">p 先装后缀、再乘前缀，两遍互不干扰 —— 载体复用是 238 的招牌优化</text>
</svg>
