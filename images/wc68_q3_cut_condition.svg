<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">可切位置：前缀最大值 m(i) 恰好等于下标 i</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">arr 是 [0, n-1] 的排列，值 v 的最终位置就是 v</text>

  <text x="128" y="115" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="128" y="171" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">arr[i]</text>
  <text x="128" y="227" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">m(i)</text>

  <!-- 下标行 -->
  <rect x="150" y="96" width="72" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="96" width="72" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="96" width="72" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="390" y="96" width="72" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="470" y="96" width="72" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="115" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="266" y="115" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="346" y="115" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="426" y="115" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="506" y="115" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>

  <!-- arr 值行 -->
  <rect x="150" y="132" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="230" y="132" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="310" y="132" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="390" y="132" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="470" y="132" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="186" y="161" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="266" y="161" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="346" y="161" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="426" y="161" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="506" y="161" text-anchor="middle" font-size="17" fill="#3a4a66" filter="url(#rough2)">4</text>

  <!-- 前缀最大值行 -->
  <rect x="150" y="184" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="230" y="184" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="310" y="184" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="390" y="184" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <rect x="470" y="184" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="186" y="213" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="266" y="213" text-anchor="middle" font-size="17" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="346" y="213" text-anchor="middle" font-size="17" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="426" y="213" text-anchor="middle" font-size="17" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="506" y="213" text-anchor="middle" font-size="17" fill="#3a5a30" filter="url(#rough2)">4</text>

  <!-- 可切标记 -->
  <text x="186" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 不能切</text>
  <text x="266" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 可切</text>
  <text x="346" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 可切</text>
  <text x="426" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 可切</text>
  <text x="506" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">✓ 收尾</text>

  <!-- 注释 -->
  <text x="310" y="288" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">m(i) = i ⇒ 前缀这 i+1 个数刚好装满 {0, 1, …, i}，块内排序后落在原位</text>
  <text x="310" y="309" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">m(i) &gt; i ⇒ 有「本该去右边」的大值被挡在左边，切在这必错</text>

  <rect x="110" y="326" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="345" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">反例 arr = [4,3,2,1,0]：m 恒为 4，只有 i = 4 对齐</text>
  <text x="310" y="362" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">4 堵在开头、0 压在末尾，整串只能是一块 → 答案 1</text>
</svg>
