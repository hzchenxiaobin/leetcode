<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">同一分组、两种跨号标签：只改「谁必须更大」</text>
  <text x="360" y="50" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">P = {1}，N = {2,3} 都不变；跨号边方向决定 x_1 的取值</text>

  <rect x="26" y="64" width="330" height="300" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="44" y="88" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">样例第 5 组（官方答案 1 −1 −1）</text>
  <text x="44" y="110" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,1)=1 (1,2)=1 (1,3)=1</text>
  <text x="44" y="129" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(2,2)=2 (2,3)=2 (3,3)=2</text>
  <text x="44" y="155" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对角线 ⇒ 1 ∈ P，2,3 ∈ N</text>
  <text x="44" y="177" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">跨号对 (1,2)、(1,3) 标签都是 1</text>
  <rect x="44" y="190" width="120" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="104" y="209" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x_1 ≥ y_2</text>
  <rect x="180" y="190" width="120" height="28" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="240" y="209" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x_1 ≥ y_3</text>
  <text x="44" y="243" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">初值 y_2 = y_3 = 1（必须 ≥ 1）</text>
  <text x="44" y="265" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">最长路 ⇒ x_1 = max(1, 1) = 1</text>
  <rect x="44" y="278" width="290" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="60" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a = (1, −1, −1)：1 + (−1) = 0 ≥ 0 ✔</text>
  <text x="44" y="334" font-size="11" fill="#888888" filter="url(#rough2)">跨号 o=1 时非负者要压过负数者</text>
  <text x="44" y="352" font-size="11" fill="#888888" filter="url(#rough2)">⇒ 正的模长必须 ≥ 负的模长</text>

  <rect x="366" y="64" width="328" height="300" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        filter="url(#rough2)"/>
  <text x="384" y="88" font-size="12.5" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">自造例子（★ 跨号标签全为 2）</text>
  <text x="384" y="110" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,1)=1 (1,2)=2 (1,3)=2</text>
  <text x="384" y="129" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(2,2)=2 (2,3)=2 (3,3)=2</text>
  <text x="384" y="155" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">对角线 ⇒ 1 ∈ P，2,3 ∈ N（同上）</text>
  <text x="384" y="177" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">跨号对 (1,2)、(1,3) 标签都是 2</text>
  <rect x="384" y="190" width="130" height="28" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="449" y="209" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">y_2 ≥ x_1 + 1</text>
  <rect x="528" y="190" width="130" height="28" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="593" y="209" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">y_3 ≥ x_1 + 1</text>
  <text x="384" y="243" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">初值 y_2 = y_3 = 1，x_1 = 0</text>
  <text x="384" y="265" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">约束要求 x_1 ≤ y_2 − 1 = 0 ✔</text>
  <rect x="384" y="278" width="288" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="400" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a = (0, −1, −1)：0 + (−1) = −1 &lt; 0 ✔</text>
  <text x="384" y="334" font-size="11" fill="#888888" filter="url(#rough2)">跨号 o=2 时负数者要严格压过</text>
  <text x="384" y="352" font-size="11" fill="#888888" filter="url(#rough2)">⇒ 负的模长必须 &gt; 正的模长</text>

  <text x="360" y="390" text-anchor="middle" font-size="11.5" fill="#2b2b2b"
        filter="url(#rough2)">两例说明：符号由对角约束决定，数值只需满足一串「≥ / ≥+1」的偏序</text>
  <text x="360" y="410" text-anchor="middle" font-size="11" fill="#888888"
        filter="url(#rough2)">把所有跨号不等式串成有向图，若成环（x &gt; x）就无解，否则最长路就是答案</text>
</svg>
