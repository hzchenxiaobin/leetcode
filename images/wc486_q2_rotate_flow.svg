<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟收集，一趟回填，公式一步到位</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="170" y="58" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="13" fill="#2f4a66">① 扫描 nums，收集非负下标 idx（x ≥ 0 入链）</text>
  <path d="M 320 100 L 320 118" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="320,120 410,152 320,184 230,152" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="157" text-anchor="middle" font-size="13" fill="#8a4442" font-weight="bold">m == 0？（全负）</text>
  <!-- yes branch -->
  <path d="M 410 152 L 452 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="456" y="130" width="160" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="536" y="148" text-anchor="middle" font-size="12" fill="#7a5415">早退：返回原 nums</text>
  <text x="536" y="165" text-anchor="middle" font-size="11" fill="#a06a15">（防 k %= 0 除零）</text>
  <!-- no branch -->
  <path d="M 320 184 L 320 206" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="200" text-anchor="start" font-size="11" fill="#4a8e4a" font-weight="bold">否</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="170" y="210" width="300" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="235" text-anchor="middle" font-size="13" fill="#2e6e2e">② k %= m：循环移位，把 k 压进 [0, m)</text>
  <path d="M 320 250 L 320 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="170" y="272" width="300" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="297" text-anchor="middle" font-size="13" fill="#2e6e2e">③ 抽值：vals[i] = nums[idx[i]]（先读后写）</text>
  <path d="M 320 312 L 320 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 4 emphasized -->
  <g filter="url(#sk)">
    <rect x="150" y="334" width="340" height="48" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="320" y="363" text-anchor="middle" font-size="13.5" fill="#7a5415" font-weight="bold" font-family="monospace">④ 回填：nums[idx[i]] = vals[(i+k) % m]</text>
  <path d="M 320 382 L 320 400" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 5 -->
  <g filter="url(#sk)">
    <rect x="170" y="404" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="428" text-anchor="middle" font-size="13" fill="#2f4a66">⑤ 返回 nums（负数槽位从未被触碰）</text>
</svg>
