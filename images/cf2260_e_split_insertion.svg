<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="800" height="432" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">多一个「段」就要多插一个异色字符</text>
  <path d="M 226 42 Q 400 49 574 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400" y="64" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">段数只能靠「在同色段内部插入异色字符」增加，一次分裂两边的段数同时 +1</text>

  <!-- ================= 左：分裂示意 ================= -->
  <rect x="24" y="80" width="352" height="272" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="200" y="104" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">插入前：一个 0 段（k = 1）</text>
  <rect x="123" y="112" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="135" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="163" y="112" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="135" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="203" y="112" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="135" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="243" y="112" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>

  <path d="M 200 154 L 200 180" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="172" font-size="12" fill="#8a6015" filter="url(#rough2)">段内插入一个 1</text>

  <text x="200" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">插入后：0 段变 2 个，1 段变 1 个</text>
  <rect x="103" y="208" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="231" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="143" y="208" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="231" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="183" y="208" width="34" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="223" y="208" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="231" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="263" y="208" width="34" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>

  <path d="M 120 246 L 160 246" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 243 246 L 283 246" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 188 246 L 212 246" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="140" y="264" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">0 段 #1</text>
  <text x="200" y="264" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">1 段</text>
  <text x="263" y="264" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">0 段 #2</text>

  <text x="200" y="292" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">两边段数同时 +1，代价 = 1 个插入字符</text>
  <rect x="103" y="304" width="194" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以总共要分裂 p − k 次</text>

  <!-- ================= 右：计数推导 ================= -->
  <rect x="396" y="88" width="380" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="110" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">现在：0 段 k 个、1 段 k 个</text>
  <text x="586" y="129" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">目标：两边各 p 个，各 2p 个字符</text>

  <rect x="396" y="150" width="380" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="179" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">要新增的段：每种 p − k 个 ⇒ 共 p − k 次分裂</text>

  <rect x="396" y="206" width="380" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="228" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">总插入 = (2p − z) + (2p − o) = 4p − m</text>
  <text x="586" y="247" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">其中至少有 p − k 个是分裂用的</text>

  <path d="M 586 262 L 586 278" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="396" y="280" width="380" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="586" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4p − m ≥ p − k  ⟹  p ≥ ⌈(m − k) / 3⌉</text>

  <rect x="396" y="332" width="112" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="353" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">p ≥ k</text>
  <rect x="524" y="332" width="112" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="353" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">2p ≥ z</text>
  <rect x="652" y="332" width="112" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="353" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">2p ≥ o</text>
  <text x="586" y="382" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">段不能合并、字符不能删除，其余三个下界同理</text>

  <text x="400" y="414" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">四条下界取最大即得最小可行 p，且 p 越大越容易（可行集向上封闭）</text>
</svg>
