<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="452" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：定长滑动窗口求最小窗口和</text>

  <rect x="130" y="52" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="12.5" fill="#2a4660" filter="url(#rough2)">total ← 数组总和，m ← n − k</text>

  <path d="M 260 88 L 260 108" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,112 330,146 260,180 190,146" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07420" filter="url(#rough2)">m = 0 ？</text>
  <text x="260" y="158" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">（即 k = n）</text>

  <path d="M 330 146 L 380 146" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="348" y="138" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="382" y="126" width="124" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 total</text>
  <text x="444" y="158" text-anchor="middle" font-size="10.5" fill="#a06058" filter="url(#rough2)">（k = n，全部取走）</text>

  <path d="M 260 180 L 260 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="195" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="110" y="204" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="12.5" fill="#2a4660" filter="url(#rough2)">winSum ← 前 m 项之和，minSum ← winSum</text>

  <path d="M 260 242 L 260 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="266" width="340" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">对 i = m, m+1, …, n−1 依次执行</text>
  <text x="260" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">winSum += cardPoints[i] − cardPoints[i−m]</text>

  <path d="M 260 314 L 260 334" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="338" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="12.5" fill="#2f5424" filter="url(#rough2)">minSum = min(minSum, winSum)</text>

  <path d="M 130 355 L 64 355 L 64 290 L 84 290" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 260 372 L 260 392" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="396" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4660" filter="url(#rough2)">返回 total − minSum</text>
</svg>
