<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n = 4, m = 2（k = 2）的逐项演算</text>

  <!-- 表头 -->
  <rect x="44" y="44" width="472" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="65" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">t</text>
  <text x="168" y="65" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">C(k,t)</text>
  <text x="252" y="65" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">(−1)^t</text>
  <text x="356" y="65" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">(3−t)^3</text>
  <text x="464" y="65" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">贡献</text>

  <!-- 行 0 -->
  <rect x="44" y="76" width="472" height="30" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="96" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">0</text>
  <text x="168" y="96" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">1</text>
  <text x="252" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="356" y="96" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">3^3 = 27</text>
  <text x="464" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+27</text>

  <!-- 行 1 -->
  <rect x="44" y="106" width="472" height="30" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="126" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">1</text>
  <text x="168" y="126" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">2</text>
  <text x="252" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−</text>
  <text x="356" y="126" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">2^3 = 8</text>
  <text x="464" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−16</text>

  <!-- 行 2 -->
  <rect x="44" y="136" width="472" height="30" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="156" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">2</text>
  <text x="168" y="156" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">1</text>
  <text x="252" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="356" y="156" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">1^3 = 1</text>
  <text x="464" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <!-- 合计 -->
  <rect x="44" y="170" width="472" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">Σ = 27 − 16 + 1 = 12　⇒　A = (n−1) · Σ = 3 × 12 = 36</text>

  <path d="M 280 204 L 280 222" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="226" width="400" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">答案 = C(4,2) · 36 = 6 · 36 = 216 ✓</text>

  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">样例题 8 3（k = 5）：7^7 − 5·6^7 + 10·5^7 − 10·4^7 + 5·3^7 − 2^7 = 52080</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ 答案 = C(8,3) · 7 · 52080 = 56 · 364560 = 20415360 ✓</text>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">注意：t 从 0 取到 k，末项底数为 m−1（m=1 时为 0）</text>
</svg>
