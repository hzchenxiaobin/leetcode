<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "abc"，shifts = [3,5,9]</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="40" y="84" width="50" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="65.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">i</text>
  <g filter="url(#sk2)"><rect x="90" y="84" width="88" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="134.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">shifts[i]</text>
  <g filter="url(#sk2)"><rect x="178" y="84" width="190" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="273.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">total（后缀和 mod 26）</text>
  <g filter="url(#sk2)"><rect x="368" y="84" width="62" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="399.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">s[i]</text>
  <g filter="url(#sk2)"><rect x="430" y="84" width="66" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="463.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">结果</text>
  <g filter="url(#sk2)"><rect x="40" y="109" width="50" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="65.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="90" y="109" width="88" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="134.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <g filter="url(#sk2)"><rect x="178" y="109" width="190" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="273.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">9</text>
  <g filter="url(#sk2)"><rect x="368" y="109" width="62" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="399.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">c</text>
  <g filter="url(#sk2)"><rect x="430" y="109" width="66" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="463.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">l</text>
  <g filter="url(#sk2)"><rect x="40" y="134" width="50" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="65.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="90" y="134" width="88" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="134.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <g filter="url(#sk2)"><rect x="178" y="134" width="190" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="273.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">14</text>
  <g filter="url(#sk2)"><rect x="368" y="134" width="62" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="399.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <g filter="url(#sk2)"><rect x="430" y="134" width="66" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="463.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">p</text>
  <g filter="url(#sk2)"><rect x="40" y="159" width="50" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="65.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <g filter="url(#sk2)"><rect x="90" y="159" width="88" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="134.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="178" y="159" width="190" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="273.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">17</text>
  <g filter="url(#sk2)"><rect x="368" y="159" width="62" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="399.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <g filter="url(#sk2)"><rect x="430" y="159" width="66" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="463.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">r</text>
  <g filter="url(#sk2)"><rect x="70.0" y="227.0" width="520" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="253.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">后缀和：c 只被 i=2 覆盖 → 9；b 被 i=1,2 覆盖 → 14；a 被 3 次覆盖 → 17</text>
  <g filter="url(#sk2)"><rect x="140.0" y="299.0" width="380" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="326.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">s = "abc" → "rpl"</text>
  <g filter="url(#sk2)"><rect x="60.0" y="369.0" width="540" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="393.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">第二个示例：s = "aaa"、shifts = [1,2,3] → 后缀和 6,5,3 → "gfd"</text>
</svg>
