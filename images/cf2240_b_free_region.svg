  <text x="362" y="178" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">任意 r×c 块</text>
  <text x="362" y="198" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">XOR 恒为 0</text>
  <text x="362" y="218" font-size="11" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">（4 格相加）</text>
  <rect x="30" y="250" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="30" y="276" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="262" font-size="13" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">自由格：可任取 → n(c−1) + (r−1)(m−c+1) = 4 + 5 = 9</text>
  <text x="56" y="288" font-size="13" fill="#d6a040" text-anchor="start" font-weight="normal" filter="url(#rough2)">被确定格：由块约束逐格锁死 → (n−r+1)(m−c+1) = 3×5 = 15</text>
  <text x="30" y="330" font-size="15" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">e = nm − (n−r+1)(m−c+1) = 24 − 15 = 9</text>
  <text x="30" y="360" font-size="15" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">合法矩阵数 = 2^e = 2^9 = 512（正是样例第 5 组）</text>
  <text x="30" y="386" font-size="12" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">块约束条数恰好等于被确定格数 → 约束两两独立</text>
</svg>
