     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa" filter="url(#rough2)"/>
  <text x="26" y="38" font-size="17" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">核心观察：自由格 ↔ 被确定格</text>
  <text x="26" y="62" font-size="13" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">n=4, m=6, r=2, c=2（共 24 格）</text>
  <text x="84.0" y="86" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="132.0" y="86" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
