<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3 全枚举验证 + 快速幂求 2ⁿ mod p</text>

  <!-- ====== left: enumerate n = 3 ====== -->
  <text x="140" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">n = 3：全枚举 2³ = 8 种方向串</text>

  <rect x="34" y="58" width="212" height="240" fill="none" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <line x1="34" y1="80" x2="246" y2="80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="58" x2="150" y2="298" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="73" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">方向串（猴0 猴1 猴2）</text>
  <text x="198" y="73" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">结果</text>

  <rect x="36" y="82" width="208" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="92" y="97" text-anchor="middle" font-size="11" fill="#333">→ → →</text>
  <text x="198" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 安全（全顺）</text>

  <rect x="36" y="106" width="208" height="22" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="92" y="121" text-anchor="middle" font-size="11" fill="#333">← ← ←</text>
  <text x="198" y="121" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 安全（全逆）</text>

  <text x="92" y="141" text-anchor="middle" font-size="11" fill="#333">→ → ←</text>
  <text x="198" y="141" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>
  <text x="92" y="163" text-anchor="middle" font-size="11" fill="#333">→ ← →</text>
  <text x="198" y="163" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>
  <text x="92" y="185" text-anchor="middle" font-size="11" fill="#333">← → →</text>
  <text x="198" y="185" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>
  <text x="92" y="207" text-anchor="middle" font-size="11" fill="#333">→ ← ←</text>
  <text x="198" y="207" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>
  <text x="92" y="229" text-anchor="middle" font-size="11" fill="#333">← → ←</text>
  <text x="198" y="229" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>
  <text x="92" y="251" text-anchor="middle" font-size="11" fill="#333">← ← →</text>
  <text x="198" y="251" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">✗ 撞</text>

  <rect x="40" y="262" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="281" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">碰撞 6 = 2³ − 2 ✓（示例 1）</text>

  <!-- ====== right: fast pow n = 5 ====== -->
  <text x="420" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">快速幂：n = 5 = 101₂（mod p）</text>

  <rect x="290" y="58" width="240" height="104" fill="none" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <line x1="290" y1="80" x2="530" y2="80" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="370" y1="58" x2="370" y2="162" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="456" y1="58" x2="456" y2="162" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="330" y="73" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">二进制位</text>
  <text x="413" y="73" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">base = 2^(2^k)</text>
  <text x="493" y="73" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">位=1 时累乘</text>

  <text x="330" y="97" text-anchor="middle" font-size="10" fill="#333">bit0 = 1</text>
  <text x="413" y="97" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="493" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans = 1×2 = 2</text>

  <text x="330" y="119" text-anchor="middle" font-size="10" fill="#333">bit1 = 0</text>
  <text x="413" y="119" text-anchor="middle" font-size="10" fill="#333">2² = 4</text>
  <text x="493" y="119" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <text x="330" y="141" text-anchor="middle" font-size="10" fill="#333">bit2 = 1</text>
  <text x="413" y="141" text-anchor="middle" font-size="10" fill="#333">2⁴ = 16</text>
  <text x="493" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">ans = 2×16 = 32</text>

  <text x="330" y="158" text-anchor="middle" font-size="8.5" fill="#888">每行末 base 自乘平方</text>

  <rect x="290" y="172" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="410" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2⁵ mod p = 32 ⇒ 答案 = 32 − 2 = 30</text>
  <text x="410" y="200" text-anchor="middle" font-size="9" fill="#b85450">= 2⁵ − 2 ✓</text>

  <rect x="290" y="216" width="240" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="234" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">规模感受</text>
  <text x="410" y="250" text-anchor="middle" font-size="9" fill="#333">n = 4：2⁴ − 2 = 14 ✓（示例 2）</text>
  <text x="410" y="266" text-anchor="middle" font-size="9" fill="#333">n = 10⁹：仅 ⌊log₂n⌋+1 ≈ 30 轮平方</text>
  <text x="410" y="282" text-anchor="middle" font-size="9" fill="#333">若直接算 2ⁿ：约 3×10⁸ 位十进制数 ✗</text>

  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">「小样例全枚举定规律，大样例交给快速幂」——周赛计数题的标准节奏</text>
</svg>
