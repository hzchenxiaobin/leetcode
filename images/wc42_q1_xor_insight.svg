<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">异或消去：正确值成对抵消</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把 1..n 与 nums 放在一起异或，只剩「重复值 ⊕ 缺失值」</text>

  <text x="100" y="103" text-anchor="end" font-size="11" fill="#3a4a66" filter="url(#rough2)">1..n</text>
  <text x="100" y="181" text-anchor="end" font-size="11" fill="#8a5a20" filter="url(#rough2)">nums</text>

  <text x="260" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">缺失 3</text>

  <rect x="108" y="80" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="103" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="172" y="80" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="103" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <rect x="236" y="80" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="103" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <rect x="300" y="80" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="324" y="103" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>

  <rect x="108" y="158" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="181" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="172" y="158" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="181" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="236" y="158" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="300" y="158" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="324" y="181" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">4</text>

  <path d="M 132 116 L 132 154" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 116 L 196 154" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 324 116 L 324 154" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 116 L 260 154" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="260" y="210" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">重复 2</text>

  <rect x="40" y="222" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#6a4a10" filter="url(#rough2)">x = (1⊕2⊕3⊕4) ⊕ (1⊕2⊕2⊕4) = 4 ⊕ 5</text>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#6a4a10" filter="url(#rough2)">  = 1 = 2 ⊕ 3 = 重复值 ⊕ 缺失值</text>

  <rect x="60" y="292" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿线：同一个值在两边各出现一次 → 异或抵消为 0</text>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">红线：3 被改成 2 → 3 缺失、2 重复，二者各净剩一次</text>

  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">low = x &amp; (−x)：2 与 3 最低的不同二进制位（第 0 位）</text>
</svg>
