<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">四个示例的判定</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">先数奇偶，再算代价，取可行图案的最小值</text>
  <rect x="40" y="66" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="170" y="66" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">偶/奇</text>
  <rect x="250" y="66" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="310.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">可行图案</text>
  <rect x="370" y="66" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">代价</text>
  <rect x="490" y="66" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="530.0" y="85.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="40" y="96" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,4,6,5,7]</text>
  <rect x="170" y="96" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3 / 2</text>
  <rect x="250" y="96" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">偶数打头</text>
  <rect x="370" y="96" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0+1+2 = 3</text>
  <rect x="490" y="96" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="115.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="40" y="126" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,4,5,7]</text>
  <rect x="170" y="126" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2 / 2</text>
  <rect x="250" y="126" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">两种都比</text>
  <rect x="370" y="126" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">A:1  B:1</text>
  <rect x="490" y="126" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="145.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="40" y="156" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,2,3]</text>
  <rect x="170" y="156" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1 / 2</text>
  <rect x="250" y="156" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">奇数打头</text>
  <rect x="370" y="156" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0+0 = 0</text>
  <rect x="490" y="156" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="175.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="40" y="186" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105.0" y="205.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[4,5,6,8]</text>
  <rect x="170" y="186" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="210.0" y="205.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3 / 1</text>
  <rect x="250" y="186" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310.0" y="205.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">差 = 2 &gt; 1</text>
  <rect x="370" y="186" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="430.0" y="205.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-</text>
  <rect x="490" y="186" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="530.0" y="205.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">-1</text>
  <text x="40" y="268" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">示例 2 的两种图案代价都是 1：偶数 [0,1] 对 [0,2] 或奇数 [2,3] 对 [1,3]</text>
  <text x="40" y="290" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">[1,2,3] 已经是交替的，代价 0</text>
</svg>
