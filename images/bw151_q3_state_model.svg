<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">状态设计：(i, p) 表示「欠着一个 nums[i]，前缀从 p 开始」</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">剩余数组永远是 [nums[i]] + nums[p..n−1]，操作只碰前三个元素</text>
  <text x="20" y="96" text-anchor="start" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">剩余数组</text>
  <rect x="70" y="80" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="96.0" y="103.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">a_i</text>
  <text x="96.0" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">留下的那个</text>
  <rect x="130" y="80" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="156.0" y="103.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">a_p</text>
  <text x="156.0" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">起点</text>
  <rect x="190" y="80" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="216.0" y="103.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">a_p+1</text>
  <rect x="250" y="80" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276.0" y="103.68" text-anchor="middle" font-size="13" fill="#333333" font-weight="bold" filter="url(#rough2)">a_p+2</text>
  <text x="322" y="104" text-anchor="middle" font-size="16" fill="#888888" filter="url(#rough2)">…</text>
  <text x="96" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">前三个</text>
  <text x="166" y="148" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">每次从这里删两个</text>
  <rect x="60" y="176" width="470" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="196" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">删 a_i 与 a_p</text>
  <text x="230" y="196" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">代价 max(a_i, a_p)</text>
  <text x="74" y="214" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">留下 a_p+1 作为新「欠」</text>
  <rect x="60" y="238" width="470" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="258" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">删 a_i 与 a_p+1</text>
  <text x="230" y="258" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">代价 max(a_i, a_p+1)</text>
  <text x="74" y="276" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">留下 a_p 作为新「欠」</text>
  <rect x="60" y="300" width="470" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="320" text-anchor="start" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">删 a_p 与 a_p+1</text>
  <text x="230" y="320" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">代价 max(a_p, a_p+1)</text>
  <text x="74" y="338" text-anchor="start" font-size="10" fill="#555555" filter="url(#rough2)">「欠」的还是 a_i</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">三个转移都把 p 推进 2：p → p+2</text>
</svg>
