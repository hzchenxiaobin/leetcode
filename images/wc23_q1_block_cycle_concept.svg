<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="340" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：以 2k 为周期分块，每块只反转前 k 个</text>
    <text x="340" y="48" text-anchor="middle" font-size="10.5" fill="#888">s = abcdefg，k = 2（2k = 4）：第 0 块反 ab→ba，第 1 块只剩 efg，反 ef→fe，g 保持</text>

    <!-- 2k 块括号 -->
    <path d="M52,78 L52,71 L262,71 L262,78" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M252,78 L252,71 L412,71 L412,78" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <text x="157" y="63" text-anchor="middle" font-size="9.5" fill="#d6a040">第 0 个 2k 块（下标 0..3，完整）</text>
    <text x="332" y="63" text-anchor="middle" font-size="9.5" fill="#d6a040">第 1 个 2k 块（下标 4..6，只剩 3 个）</text>

    <!-- 输入行下标 -->
    <g font-size="8.5" fill="#aaa" text-anchor="middle">
      <text x="80" y="90">0</text><text x="130" y="90">1</text><text x="180" y="90">2</text>
      <text x="230" y="90">3</text><text x="280" y="90">4</text><text x="330" y="90">5</text>
      <text x="380" y="90">6</text>
    </g>
    <text x="24" y="122" font-size="10" fill="#446688">输入 s</text>

    <!-- 输入单元格：a b c d e f g -->
    <g stroke-width="1.6">
      <rect x="58" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"/>
      <rect x="108" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"/>
      <rect x="158" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#446688"/>
      <rect x="208" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#446688"/>
      <rect x="258" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"/>
      <rect x="308" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#4a7a3a"/>
      <rect x="358" y="98" width="44" height="38" rx="4" fill="#ffffff" stroke="#446688"/>
    </g>
    <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
      <text x="80" y="124">a</text><text x="130" y="124">b</text><text x="180" y="124">c</text>
      <text x="230" y="124">d</text><text x="280" y="124">e</text><text x="330" y="124">f</text>
      <text x="380" y="124">g</text>
    </g>

    <!-- 分组外框 -->
    <rect x="54" y="94" width="106" height="46" rx="7" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="154" y="94" width="106" height="46" rx="7" fill="none" stroke="#446688" stroke-width="1.8"/>
    <rect x="254" y="94" width="106" height="46" rx="7" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="354" y="94" width="52" height="46" rx="7" fill="none" stroke="#446688" stroke-width="1.8"/>

    <!-- 映射箭头 -->
    <path d="M107,144 L107,206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <path d="M207,144 L207,206" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <path d="M307,144 L307,206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)"/>
    <path d="M380,144 L380,206" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="118" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">反转</text>
    <text x="218" y="178" font-size="10" fill="#446688">保持</text>
    <text x="318" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">反转</text>
    <text x="391" y="178" font-size="10" fill="#446688">保持</text>

    <!-- 输出行 -->
    <text x="24" y="242" font-size="10" fill="#446688">输出</text>
    <g stroke-width="1.6">
      <rect x="58" y="216" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="108" y="216" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="158" y="216" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688"/>
      <rect x="208" y="216" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688"/>
      <rect x="258" y="216" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="308" y="216" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="358" y="216" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688"/>
    </g>
    <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
      <text x="80" y="242">b</text><text x="130" y="242">a</text><text x="180" y="242">c</text>
      <text x="230" y="242">d</text><text x="280" y="242">f</text><text x="330" y="242">e</text>
      <text x="380" y="242">g</text>
    </g>
    <rect x="54" y="212" width="106" height="46" rx="7" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="154" y="212" width="106" height="46" rx="7" fill="none" stroke="#446688" stroke-width="1.8"/>
    <rect x="254" y="212" width="106" height="46" rx="7" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="354" y="212" width="52" height="46" rx="7" fill="none" stroke="#446688" stroke-width="1.8"/>

    <!-- 三个角色说明 -->
    <rect x="28" y="288" width="204" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="44" y="310" font-size="11" fill="#4a7a3a" font-weight="bold">① 反转区（块内前 k 个）</text>
    <text x="44" y="332" font-size="9.5" fill="#444">段长 = min(k, 剩余长度)</text>
    <text x="44" y="352" font-size="9.5" fill="#444">双指针首尾相向交换</text>
    <text x="44" y="372" font-size="9.5" fill="#444">swap 次数 = ⌊段长 / 2⌋</text>

    <rect x="238" y="288" width="204" height="96" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="254" y="310" font-size="11" fill="#446688" font-weight="bold">② 保持区（块内后 k 个）</text>
    <text x="254" y="332" font-size="9.5" fill="#444">原样照抄，不参与交换</text>
    <text x="254" y="352" font-size="9.5" fill="#444">仅在「剩余 ≥ k」时存在</text>
    <text x="254" y="372" font-size="9.5" fill="#444">长度 = 剩余 − k，可为 0</text>

    <rect x="448" y="288" width="204" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="464" y="310" font-size="11" fill="#d6a040" font-weight="bold">③ 块起点步进</text>
    <text x="464" y="332" font-size="9.5" fill="#444">i = 0, 2k, 4k, …</text>
    <text x="464" y="352" font-size="9.5" fill="#444">块数 = ⌈n / 2k⌉</text>
    <text x="464" y="372" font-size="9.5" fill="#444">剩余 &lt; k 时整块全反转</text>

    <!-- 结论 -->
    <text x="340" y="414" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">统一写法：反转 s[i .. min(i + k, n) − 1]，再令 i ← i + 2k</text>
    <text x="340" y="438" text-anchor="middle" font-size="9.5" fill="#888">k ≥ n ⇒ 一次迭代完成全串反转；k = 1 ⇒ 每段只有 1 个字符，反转是空操作</text>
  </g>
</svg>
