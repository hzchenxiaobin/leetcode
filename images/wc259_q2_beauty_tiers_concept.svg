<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：量词压成最值，档位从高到低</text>
  <path d="M 170 40 Q 340 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array cells -->
  <text x="104" y="96" text-anchor="end" font-size="13" fill="#333">nums =</text>
  <text x="195" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">i = 1 ⭐</text>

  <g filter="url(#sk)"><rect x="118" y="72" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="141" y="96" text-anchor="middle" font-size="14" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="172" y="72" width="46" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="195" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a">4</text>
  <g filter="url(#sk)"><rect x="226" y="72" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="249" y="96" text-anchor="middle" font-size="14" fill="#333">6</text>
  <g filter="url(#sk)"><rect x="280" y="72" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="303" y="96" text-anchor="middle" font-size="14" fill="#333">4</text>

  <text x="141" y="126" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="195" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">1</text>
  <text x="249" y="126" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="303" y="126" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- compression labels -->
  <path d="M 130 118 L 152 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 288 118 L 290 132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="96" y="136" width="142" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="167" y="154" text-anchor="middle" font-size="11.5" fill="#446688">左侧全部 → max = 2</text>
  <g filter="url(#sk)"><rect x="224" y="136" width="142" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="295" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a">右侧全部 → min = 4</text>

  <!-- verdict box -->
  <g filter="url(#sk)"><rect x="370" y="64" width="286" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="513" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2 档判定（例 2 的 i=1）</text>
  <text x="513" y="112" text-anchor="middle" font-size="12" fill="#2f5d25">left_max[1] = 2 &lt; 4 ✓</text>
  <text x="513" y="134" text-anchor="middle" font-size="12" fill="#b85450">right_min[1] = 4，但 4 &lt; 4 ✗</text>
  <text x="513" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">→ 非 2 档：严格小于，相等不算</text>

  <!-- tier boxes -->
  <g filter="url(#sk)"><rect x="40" y="190" width="600" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="50" y="198" width="30" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="65" y="219" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">2</text>
  <text x="96" y="209" font-size="12.5" font-weight="bold" fill="#8a3a36">全局夹住：左侧全部 &lt; x 且 x &lt; 右侧全部</text>
  <text x="96" y="228" font-size="11.5" fill="#b85450">⟺ left_max[i] &lt; x &lt; right_min[i] —— 两次比较定档</text>

  <g filter="url(#sk)"><rect x="40" y="244" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="50" y="252" width="30" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="65" y="273" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688">1</text>
  <text x="96" y="263" font-size="12.5" font-weight="bold" fill="#446688">仅相邻三元素：nums[i−1] &lt; x &lt; nums[i+1]</text>
  <text x="96" y="282" font-size="11.5" fill="#557799">未得 2 分才查 —— 天然 O(1)，无需任何预处理</text>

  <g filter="url(#sk)"><rect x="40" y="298" width="600" height="38" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="50" y="302" width="30" height="30" rx="5" fill="#ffffff" stroke="#999999" stroke-width="1.5"/></g>
  <text x="65" y="323" text-anchor="middle" font-size="16" font-weight="bold" fill="#888888">0</text>
  <text x="96" y="322" font-size="12" fill="#777777">其余情况 —— 不计分</text>

  <!-- implication box -->
  <g filter="url(#sk)"><rect x="40" y="346" width="600" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">蕴含链：全局夹住 ⟹ 相邻也递增（左侧含 i−1，右侧含 i+1）</text>
  <text x="340" y="386" text-anchor="middle" font-size="11.5" fill="#b85450">判定必须 2 → 1 → 0：先判低档会把每个 2 分错记成 1 分</text>

  <text x="340" y="410" text-anchor="middle" font-size="11" fill="#888">把「对所有 j 检查」压成「和 max 比一次」——前缀最大 + 后缀最小，O(n²) → O(n)</text>
</svg>
