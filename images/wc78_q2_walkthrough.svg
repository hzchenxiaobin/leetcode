<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "heeellooo" 的逐组判定表</text>
  <text x="350" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s 的组：h × 1 ｜ e × 3 ｜ l × 2 ｜ o × 3，共 4 组；判定列写「w 的组长 → s 的组长」</text>

  <rect x="40" y="64" width="70" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="84" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">组</text>
  <rect x="118" y="64" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">s 的组长</text>
  <rect x="226" y="64" width="110" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="281" y="84" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">"hello"</text>
  <rect x="344" y="64" width="94" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="391" y="84" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">好 / 坏</text>
  <rect x="446" y="64" width="96" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="494" y="84" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"helo"</text>
  <rect x="550" y="64" width="100" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="84" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">好 / 坏</text>

  <rect x="40" y="100" width="70" height="38" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="124" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">①</text>
  <rect x="118" y="100" width="100" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="124" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">h × 1</text>
  <rect x="226" y="100" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="124" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">h × 1</text>
  <rect x="344" y="100" width="94" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1 = 1 ✓</text>
  <rect x="446" y="100" width="96" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="494" y="124" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">h × 1</text>
  <rect x="550" y="100" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="124" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1 = 1 ✓</text>

  <rect x="40" y="144" width="70" height="38" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">②</text>
  <rect x="118" y="144" width="100" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="168" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">e × 3</text>
  <rect x="226" y="144" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="168" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">e × 1</text>
  <rect x="344" y="144" width="94" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="168" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1→3 ✓</text>
  <rect x="446" y="144" width="96" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="494" y="168" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">e × 1</text>
  <rect x="550" y="144" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="168" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1→3 ✓</text>

  <rect x="40" y="188" width="70" height="38" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="212" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">③</text>
  <rect x="118" y="188" width="100" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="212" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">l × 2</text>
  <rect x="226" y="188" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="212" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">l × 2</text>
  <rect x="344" y="188" width="94" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="212" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2 = 2 ✓</text>
  <rect x="446" y="188" width="96" height="38" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="494" y="212" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">l × 1</text>
  <rect x="550" y="188" width="100" height="38" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="600" y="212" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1→2 ✗</text>

  <rect x="40" y="232" width="70" height="38" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="256" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">④</text>
  <rect x="118" y="232" width="100" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="256" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">o × 3</text>
  <rect x="226" y="232" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="256" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">o × 1</text>
  <rect x="344" y="232" width="94" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="256" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">1→3 ✓</text>
  <rect x="446" y="232" width="96" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="494" y="256" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">o × 1</text>
  <rect x="550" y="232" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="256" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1→3 ✓</text>

  <rect x="40" y="284" width="610" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">"hello"：4 组全部通过（1=1、1→3、2=2、1→3，扩张目标 3 ≥ 3）→ 可扩张</text>
  <text x="56" y="328" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">"hi"：只有 h、i 两组，组数 2 ≠ 4 → 直接淘汰（组数不等就无从对齐）</text>
  <text x="56" y="350" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">"helo"：第 ③ 组要把 l 从 1 扩到 2，但目标 2 &lt; 3 → 不可扩张。答案 = 1</text>

  <text x="40" y="386" font-size="10" fill="#888" filter="url(#rough2)">注意 s 的 l 组长度是 2：它自己「短」，因此任何想在这里对齐的查询词都必须原本就是 2，多一个少一个都不行。</text>
  <text x="40" y="406" font-size="10" fill="#888" filter="url(#rough2)">"hello" 的 l 组恰好也是 2，无需扩张即可相等，这不违反「扩张只能到 3 以上」的限制。</text>
</svg>
