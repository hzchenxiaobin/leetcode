<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="430" fill="#fafafa"/>

  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：x = 210，a = [105, 70, 42, 30]，沿 210 → 70 → 35 → 7 取满</text>
  <path d="M 110 40 Q 440 47 770 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="66" width="800" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="79" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">步</text>
  <text x="193" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">当前 x</text>
  <text x="338" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">选择堆</text>
  <text x="502" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g = gcd(堆值, x)</text>
  <text x="657" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">该堆取走</text>
  <text x="779" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">累计</text>

  <!-- 第 0 行 -->
  <rect x="40" y="104" width="800" height="44" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="193" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">210（起点）</text>
  <text x="338" y="132" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="502" y="132" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="657" y="132" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="779" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>

  <!-- 第 1 行 -->
  <rect x="40" y="148" width="800" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="193" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">210 → 70</text>
  <text x="338" y="176" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">70</text>
  <text x="502" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">70</text>
  <text x="657" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">70</text>
  <text x="779" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">70</text>

  <!-- 第 2 行 -->
  <rect x="40" y="192" width="800" height="44" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="193" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">70 → 35</text>
  <text x="338" y="220" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">105</text>
  <text x="502" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">35</text>
  <text x="657" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">105</text>
  <text x="779" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">175</text>

  <!-- 第 3 行（最优链终点） -->
  <rect x="40" y="236" width="800" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="264" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="193" y="264" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">35 → 7</text>
  <text x="338" y="264" text-anchor="middle" font-size="13" fill="#8c3b38" filter="url(#rough2)">42</text>
  <text x="502" y="264" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="657" y="264" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">42</text>
  <text x="779" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">217</text>

  <!-- 第 4 行 -->
  <rect x="40" y="280" width="800" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="79" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="193" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7（停）</text>
  <text x="338" y="308" text-anchor="middle" font-size="13" fill="#8c3b38" filter="url(#rough2)">30</text>
  <text x="502" y="308" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1（非法）</text>
  <text x="657" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="779" y="308" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">217</text>

  <!-- 竖分隔线 -->
  <path d="M 118 66 L 118 324" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 268 66 L 268 324" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 408 66 L 408 324" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 596 66 L 596 324" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 718 66 L 718 324" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <text x="40" y="352" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">• 每步 g 都是当前 x 的约数 ⇒ x 沿约数链下降；同一堆连取时 gcd(105 − 35, 35) = 35，所以能一直取到 0</text>
  <text x="40" y="378" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">• 若贪心先取 105（gcd = 105），x 立刻锁死在 105，最多拿 105；要让 x 变"小"才能扫走更多堆</text>
  <text x="40" y="404" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">• 4 步后 gcd(30, 7) = 1，过程合法结束；最终收益 S(7) = 217，与暴搜一致（可达集合 R 中 S 最大者）</text>
</svg>
