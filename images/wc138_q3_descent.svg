<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">先找最靠右的「下降点」i：arr[i] &gt; arr[i+1]</text>
  <text x="300" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">i 右侧必须是单调不降的，否则还能找到更靠右的下降点</text>
  <rect x="90" y="84" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="118" y="109" font-size="14" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="146" y="84" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="174" y="109" font-size="14" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">9</text>
  <rect x="202" y="84" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="109" font-size="14" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="258" y="84" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="286" y="109" font-size="14" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="314" y="84" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="342" y="109" font-size="14" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">7</text>
  <text x="118" y="146" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="174" y="146" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="230" y="146" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="286" y="146" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="342" y="146" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">4</text>
  <path d="M 202 184 Q 202 176 210 176 L 362 176 Q 370 176 370 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="286" y="168" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">后缀 [4,6,7] 单调不降</text>
  <text x="90" y="212" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">i = 1（值 9）：交换必须发生在 i 与它右侧，才能让前缀保持不变、结果尽量大。</text>
  <rect x="90" y="228" width="420" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="102" y="246.5" font-size="10.5" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">若找不到下降点（整个数组单调不降）</text>
  <text x="102" y="263" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">说明已经是字典序最小的排列 → 直接返回原数组</text>
  <text x="300" y="306" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">例：[1,1,5] 没有下降点，答案就是 [1,1,5]</text>
</svg>
