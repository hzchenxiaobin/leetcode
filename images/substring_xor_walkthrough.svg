<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "101101" 的预处理与两次查询</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells -->
  <g filter="url(#sk)">
    <rect x="60" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="108" y="48" width="44" height="34" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="156" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="204" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="48" width="44" height="34" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="300" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold">
    <text x="82" y="70" fill="#2b4a6b">1</text>
    <text x="130" y="70" fill="#888">0</text>
    <text x="178" y="70" fill="#2b4a6b">1</text>
    <text x="226" y="70" fill="#2b4a6b">1</text>
    <text x="274" y="70" fill="#888">0</text>
    <text x="322" y="70" fill="#2b4a6b">1</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="82" y="98">0</text>
    <text x="130" y="98">1</text>
    <text x="178" y="98">2</text>
    <text x="226" y="98">3</text>
    <text x="274" y="98">4</text>
    <text x="322" y="98">5</text>
  </g>

  <!-- braces -->
  <path d="M 60 112 Q 60 126 78 126 L 182 126 Q 200 126 200 112" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="130" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">① s[0..2] = "101"，值 5</text>
  <path d="M 156 152 Q 156 166 174 166 L 230 166 Q 248 166 248 152" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="202" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6b">② s[2..3] = "11"，值 3</text>

  <!-- pos table -->
  <text x="320" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">预处理生成的 pos（按插入顺序，节选）</text>
  <text x="36" y="222" font-size="12" font-weight="bold" fill="#2b4a6b">起点 i = 0（'1' 开头延伸）</text>
  <text x="212" y="222" font-size="12" font-weight="bold" fill="#2b4a6b">起点 i = 2：</text>
  <text x="388" y="222" font-size="12" font-weight="bold" fill="#2b4a6b">其余起点与 '0'：</text>

  <g filter="url(#sk)">
    <rect x="36" y="232" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="36" y="256" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="36" y="280" width="160" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="36" y="304" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="36" y="328" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="36" y="352" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="44" y="246">L=1：1 → [0,0]</text>
    <text x="44" y="270">L=2：2 → [0,1]</text>
    <text x="44" y="294" font-weight="bold" fill="#8a6415">L=3：5 → [0,2]</text>
    <text x="44" y="318">L=4：11 → [0,3]</text>
    <text x="44" y="342">L=5：22 → [0,4]</text>
    <text x="44" y="366">L=6：45 → [0,5]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="212" y="232" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="212" y="256" width="160" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="212" y="280" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="212" y="304" width="160" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="220" y="246">L=1：1 已存在，跳过</text>
    <text x="220" y="270" font-weight="bold" fill="#2b4a6b">L=2：3 → [2,3]</text>
    <text x="220" y="294">L=3：6 → [2,4]</text>
    <text x="220" y="318">L=4：13 → [2,5]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="388" y="232" width="232" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="388" y="256" width="232" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="388" y="280" width="232" height="20" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
    <rect x="388" y="304" width="232" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="396" y="246">i=3：1、2、5 均已存在 → 跳过</text>
    <text x="396" y="270">i=5：1 已存在 → 跳过</text>
    <text x="396" y="294">最左 '0' @ 下标 1：0 → [1,1]</text>
    <text x="504" y="320" text-anchor="middle" font-weight="bold" fill="#2e5a22">pos 就绪：键 {0,1,2,3,5,6,11,13,22,45} 共 10 个</text>
  </g>

  <!-- queries -->
  <text x="320" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">查询应答（每组一次异或 + 一次哈希）</text>
  <g filter="url(#sk)">
    <rect x="36" y="396" width="264" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="340" y="396" width="264" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="168" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">查询 ① [0, 5]：target = 0 ⊕ 5 = 5</text>
  <text x="168" y="435" text-anchor="middle" font-size="10.5" fill="#8a6415">pos[5] = [0, 2]，即子串 "101"</text>
  <text x="168" y="450" text-anchor="middle" font-size="10" fill="#666">验证：5 ⊕ 0 = 5 ✓</text>
  <text x="472" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6b">查询 ② [1, 2]：target = 1 ⊕ 2 = 3</text>
  <text x="472" y="435" text-anchor="middle" font-size="10.5" fill="#2b4a6b">pos[3] = [2, 3]，即子串 "11"</text>
  <text x="472" y="450" text-anchor="middle" font-size="10" fill="#666">验证：3 ⊕ 1 = 2 ✓</text>

  <text x="320" y="478" text-anchor="middle" font-size="10.5" fill="#666">两组查询均 O(1) 命中；target ∉ pos（如示例 2 的 target = 4 = "100"）时输出 [-1, -1]。</text>
  <text x="320" y="496" text-anchor="middle" font-size="10.5" fill="#666">同值候选长度全等 = bitlen(val)，首见登记即「最短 + 最左」。</text>
</svg>
