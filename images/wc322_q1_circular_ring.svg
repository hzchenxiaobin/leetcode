<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="390" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：首尾相接成环，每条缝两侧字符相等</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 顶部说明框 -->
  <rect x="60" y="58" width="740" height="68" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">把首单词接到末单词之后，句子闭合成环；单词边界成为环上的「缝」</text>
  <text x="430" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">回环句 ⇔ 每条缝两侧的字符相等，缝 = 单词间的空格 或 末词→首词的环绕缝</text>

  <!-- 单词首字符标注（蓝） -->
  <text x="192" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">首 l</text>
  <text x="344" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">首 e</text>
  <text x="488" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">首 s</text>
  <text x="640" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">首 d</text>

  <!-- 单词框 -->
  <rect x="140" y="156" width="104" height="46" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="286" y="156" width="116" height="46" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="444" y="156" width="88" height="46" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="574" y="156" width="132" height="46" rx="4" fill="#f7f7f3" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">leetcode</text>
  <text x="344" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">exercises</text>
  <text x="488" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">sound</text>
  <text x="640" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">delightful</text>

  <!-- 单词尾字符标注（红） -->
  <text x="192" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">尾 e</text>
  <text x="344" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">尾 s</text>
  <text x="488" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">尾 d</text>
  <text x="640" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">尾 l</text>

  <!-- 缝箭头与匹配标注 -->
  <text x="265" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">e=e</text>
  <text x="423" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=s</text>
  <text x="553" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d=d</text>
  <path d="M 248 179 L 280 179" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 179 L 438 179" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 538 179 L 566 179" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 环绕缝箭头 -->
  <path d="M 712 179 C 760 290, 60 290, 132 182" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="421" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">l = l（环绕缝：末词尾 → 首词首）</text>

  <!-- 底部结论框 -->
  <rect x="60" y="300" width="740" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">所有缝两侧字符相等 ⇔ 回环句</text>
  <text x="430" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">单趟扫描：空格处查 s[i-1]==s[i+1]；收尾查 s[0]==s[n-1]</text>
</svg>
