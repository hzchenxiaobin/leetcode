<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6a20"/>
    </marker>
  </defs>

  <rect width="720" height="402" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">状态转移：cur（第 r 行）→ nxt（第 r+1 行）</text>

  <text x="118" y="76" text-anchor="start" font-size="12.5" fill="#2b4a6f" filter="url(#rough2)">cur[c]：第 r 行第 c 杯收到的总杯数（共 r+1 个）</text>

  <rect x="118" y="88" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="116" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">a0</text>
  <rect x="218" y="88" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">a1</text>
  <rect x="318" y="88" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="116" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">a2</text>
  <rect x="418" y="88" width="84" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="116" text-anchor="middle" font-size="15" fill="#2b4a6f" filter="url(#rough2)">a3</text>

  <text x="118" y="307" text-anchor="start" font-size="12.5" fill="#33604a" filter="url(#rough2)">nxt[c]：第 r+1 行第 c 杯收到的总杯数（共 r+2 个）</text>

  <rect x="118" y="244" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="15" fill="#33604a" filter="url(#rough2)">b0</text>
  <rect x="218" y="244" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="15" fill="#33604a" filter="url(#rough2)">b1</text>
  <rect x="318" y="244" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="272" text-anchor="middle" font-size="15" fill="#33604a" filter="url(#rough2)">b2</text>
  <rect x="418" y="244" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="272" text-anchor="middle" font-size="15" fill="#33604a" filter="url(#rough2)">b3</text>
  <rect x="518" y="244" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="272" text-anchor="middle" font-size="15" fill="#33604a" filter="url(#rough2)">b4</text>

  <path d="M160,134 L160,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M178,134 C214,170 242,208 258,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,134 L260,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M278,134 C314,170 342,208 358,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,134 L360,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M378,134 C414,170 442,208 458,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M460,134 L460,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M478,134 C514,170 542,208 558,240" fill="none" stroke="#8a6a20" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="132" y="196" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">÷2</text>
  <text x="600" y="196" text-anchor="middle" font-size="12.5" fill="#667" filter="url(#rough2)">每个箭头</text>
  <text x="600" y="214" text-anchor="middle" font-size="12.5" fill="#667" filter="url(#rough2)">只搬运</text>
  <text x="600" y="232" text-anchor="middle" font-size="12.5" fill="#667" filter="url(#rough2)">溢出的一半</text>

  <rect x="48" y="316" width="624" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="338" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">q[c] = max(0, cur[c] − 1) / 2 ；未满的杯子 q[c] = 0</text>

  <rect x="48" y="358" width="624" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="380" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">nxt[c] = q[c−1] + q[c] ；答案 = min(1, cur[query_glass])</text>
</svg>
