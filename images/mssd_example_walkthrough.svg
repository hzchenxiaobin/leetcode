<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="38" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3：nums = [1, 2, −1, −2, 1, 0, −1]</text>

  <!-- 表格：x=55 起，列宽 64/96/150/84，行高 32，表头 y=64 -->
  <rect x="55" y="64" width="394" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">值</text>
  <text x="167" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">出现次数</text>
  <text x="290" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">取 / 不取</text>
  <text x="407" y="85" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">贡献</text>

  <!-- 数据行 -->
  <rect x="55" y="96" width="394" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="117" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="167" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 次</text>
  <text x="290" y="117" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ 取（重复只算一次）</text>
  <text x="407" y="117" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <rect x="55" y="128" width="394" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="167" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 次</text>
  <text x="290" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ 取</text>
  <text x="407" y="149" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+2</text>

  <rect x="55" y="160" width="394" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="181" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="167" y="181" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 次</text>
  <text x="290" y="181" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">—（取否均可）</text>
  <text x="407" y="181" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <rect x="55" y="192" width="394" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="213" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="167" y="213" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 次</text>
  <text x="290" y="213" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不取</text>
  <text x="407" y="213" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <rect x="55" y="224" width="394" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="245" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="167" y="245" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 次</text>
  <text x="290" y="245" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 不取</text>
  <text x="407" y="245" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <!-- 合计行 -->
  <rect x="55" y="256" width="394" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="277" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="407" y="277" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>

  <!-- 箭头 -->
  <path d="M453,160 L476,160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 答案框 -->
  <rect x="480" y="104" width="125" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="542" y="132" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">ans</text>
  <text x="542" y="158" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">= 1 + 2</text>
  <text x="542" y="196" text-anchor="middle" font-size="24" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3</text>

  <!-- 底部提示框 -->
  <rect x="55" y="310" width="530" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">若存在正数：答案 = 所有互不相同的正数之和</text>
  <text x="320" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">若全非正：答案 = max(nums)（只选一个元素，保证非空）</text>
</svg>
