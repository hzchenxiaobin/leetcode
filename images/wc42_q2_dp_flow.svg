<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 单次扫描 → 贪心决策</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后右端点单调不减，因此“谁能跟在谁后面”只需和 last 比较一次</text>

  <rect x="175" y="64" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="86" text-anchor="middle" font-size="11" fill="#2f4666" filter="url(#rough2)">按右端点 b 升序排序 pairs</text>
  <path d="M 290 98 L 290 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="118" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="11.5" fill="#2f4a26" filter="url(#rough2)">初始化 cnt = 0，last = −∞</text>
  <path d="M 290 152 L 290 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,172 425,205 290,238 155,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="209" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">a &gt; last ?</text>

  <path d="M 155 205 L 100 205 L 100 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="198" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 425 205 L 480 205 L 480 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="198" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="40" y="250" width="170" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="272" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">跳过该数对</text>
  <text x="125" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">cnt、last 都不变</text>

  <rect x="395" y="250" width="170" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="10.5" fill="#2f4a26" filter="url(#rough2)">cnt ← cnt + 1</text>
  <text x="480" y="292" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">last ← b（右端点）</text>

  <path d="M 125 308 L 125 324 L 290 324" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 480 308 L 480 324 L 290 324" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 290 324 L 290 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="338" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11.5" fill="#2f4666" filter="url(#rough2)">返回 cnt（最长数对链长度）</text>

  <text x="290" y="396" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">等价 DP：dp[i] = 1 + max{ dp[j] : b_j &lt; a_i }，按左端点排序后 O(n²)</text>
  <text x="290" y="412" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">值域小时把 dp 挂到右端点下标上，配合前缀最大值可做到 O(n + V)</text>
</svg>
