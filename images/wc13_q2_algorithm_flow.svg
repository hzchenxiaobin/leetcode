<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：31 轮位统计，每轮只扫一遍数组</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">没有排序、没有哈希，纯计数</text>

  <rect x="150" y="62" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">n = len(nums)，ans = 0</text>

  <path d="M 280 92 L 280 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="116" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">取位 b（从 0 开始，逐次加 1）</text>

  <path d="M 280 146 L 280 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="170" width="360" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">c = 0；遍历 x ∈ nums：c += (x &gt;&gt; b) &amp; 1</text>

  <path d="M 280 202 L 280 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="224" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ans += c × (n − c)</text>

  <path d="M 280 256 L 280 272" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,274 400,302 280,330 160,302" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">b = 30 ？</text>

  <path d="M 160 302 L 56 302 L 56 131 L 146 131" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="292" font-size="10" fill="#b85450" filter="url(#rough2)">否，b += 1</text>

  <path d="M 280 330 L 280 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="346" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <rect x="150" y="354" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 ans（全部位的贡献之和）</text>
</svg>
