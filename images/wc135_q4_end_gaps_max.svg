<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">最大步数：总空位减去“被永久放弃”的一侧</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">示例 2：stones = [3,4,5,6,10] → max = 3</text>

  <path d="M 60 130 L 520 130" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <circle cx="96" cy="130" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="146" cy="130" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="196" cy="130" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="246" cy="130" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="446" cy="130" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="96" y="134" fill="#3a4a66">3</text>
    <text x="146" y="134" fill="#3a4a66">4</text>
    <text x="196" y="134" fill="#3a4a66">5</text>
    <text x="246" y="134" fill="#3a4a66">6</text>
    <text x="446" y="134" fill="#8a6a20">10</text>
  </g>

  <rect x="70" y="152" width="404" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="272" y="174" text-anchor="middle" font-size="10.5" fill="#3a5a30">跨度内总格数 = 10 − 3 + 1 = 8，已有 5 颗 → 空位 E = 3</text>

  <path d="M 60 208 L 108 208" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="120" y="212" font-size="10.5" fill="#8a3a36">左端空隙 g_left = 3 − 4 …</text>
  <text x="120" y="230" font-size="10" fill="#888">（石子 3 左侧没有其它石子，此处按相邻间距算 0）</text>

  <path d="M 258 208 L 434 208" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="272" y="212" font-size="10.5" fill="#8a6a20">右侧空隙 g_right = 10 − 6 − 1 = 3</text>

  <rect x="40" y="248" width="250" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="268" font-size="11" fill="#8a6a20" font-weight="bold">公式</text>
  <text x="54" y="290" font-size="10.5" fill="#555">max = E − min(g_left, g_right)</text>
  <text x="54" y="310" font-size="10" fill="#555">E = a[n−1] − a[0] + 1 − n</text>
  <text x="54" y="330" font-size="10" fill="#555">g_left = a[1] − a[0] − 1，g_right = a[n−1] − a[n−2] − 1</text>

  <rect x="308" y="248" width="222" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="322" y="268" font-size="11" fill="#3a5a30" font-weight="bold">为什么“必丢一侧”？</text>
  <text x="322" y="290" font-size="10" fill="#555">第一步只能动最左或最右的石头，</text>
  <text x="322" y="308" font-size="10" fill="#555">它一旦移动，它原来那侧的空隙</text>
  <text x="322" y="326" font-size="10" fill="#555">就永远落在跨度之外 → 丢掉 min 侧</text>

  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#999">示例 1 [4,7,9]：E = 3，g_left = 2，g_right = 1 → max = 3 − 1 = 2 ✓</text>
</svg>
