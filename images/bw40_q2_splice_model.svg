<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：只改两条指针 —— before→list2 头，list2 尾→after</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">list1 = 10→1→13→6→9→5，a=3，b=4：删除下标 3~4 的节点（6、9），把 list2 接进去</text>

  <!-- list1 nodes: keep 0..2, drop 3..4, keep 5 -->
  <g filter="url(#r)">
    <rect x="60" y="90" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="180" y="90" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="300" y="90" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="560" y="90" width="64" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="420" y="90" width="64" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="490" y="90" width="64" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="92" y="120" fill="#33517a">10</text>
    <text x="212" y="120" fill="#33517a">1</text>
    <text x="332" y="120" fill="#33517a">13</text>
    <text x="592" y="120" fill="#33517a">5</text>
    <text x="452" y="120" fill="#b85450">6</text>
    <text x="522" y="120" fill="#b85450">9</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#999" filter="url(#r)">
    <text x="92" y="152">下标 0</text>
    <text x="212" y="152">下标 1</text>
    <text x="332" y="152">下标 2</text>
    <text x="452" y="152">下标 3</text>
    <text x="522" y="152">下标 4</text>
    <text x="592" y="152">下标 5</text>
  </g>
  <path d="M 126 114 L 176 114" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 246 114 L 296 114" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 366 114 L 414 114" stroke="#ccc" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 486 114 L 536 114" stroke="#ccc" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 556 114 L 556 114" stroke="none"/>

  <!-- list2 nodes -->
  <g filter="url(#r)">
    <rect x="180" y="230" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="230" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="420" y="230" width="64" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="212" y="260" fill="#3a5c2c">1000000</text>
    <text x="332" y="260" fill="#3a5c2c">1000001</text>
    <text x="452" y="260" fill="#3a5c2c">1000002</text>
  </g>
  <path d="M 246 254 L 296 254" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 366 254 L 416 254" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="500" y="259" font-size="12" fill="#4a7a3a" filter="url(#r)">list2（链表二）</text>

  <!-- new pointers -->
  <path d="M 348 146 Q 240 190 216 226" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="250" y="196" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">① before(下标 a−1)→list2</text>
  <path d="M 466 226 Q 560 170 588 144" stroke="#d6a040" stroke-width="2.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="560" y="196" font-size="13" font-weight="bold" fill="#a67c1e" filter="url(#r)">② list2 尾→after(下标 b+1)</text>

  <g filter="url(#r)">
    <rect x="60" y="322" width="580" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="350" text-anchor="middle" font-size="13.5" fill="#7a5b1e" filter="url(#r)">走到下标 a−1 与 b+1 各一趟；被删段无需逐个 free（题目不要求，链表也不需要遍历它）</text>
</svg>
