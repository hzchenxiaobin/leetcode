<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="310" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums 与 inc 数组（k = 3）</text>

  <!-- 列下标 -->
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <text x="113" y="54">0</text>
    <text x="158" y="54">1</text>
    <text x="203" y="54">2</text>
    <text x="248" y="54">3</text>
    <text x="293" y="54">4</text>
    <text x="338" y="54">5</text>
    <text x="383" y="54">6</text>
    <text x="428" y="54">7</text>
    <text x="473" y="54">8</text>
    <text x="518" y="54">9</text>
  </g>

  <!-- 行标签 -->
  <text x="80" y="84" text-anchor="end" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">nums</text>
  <text x="80" y="122" text-anchor="end" font-size="12" font-weight="bold" fill="#555" filter="url(#rough2)">inc</text>

  <!-- nums 行 -->
  <g filter="url(#rough2)">
    <rect x="90" y="60" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="135" y="60" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="60" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="225" y="60" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="270" y="60" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="315" y="60" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="360" y="60" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="405" y="60" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="450" y="60" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="495" y="60" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="113" y="84">2</text>
    <text x="158" y="84">5</text>
    <text x="203" y="84">7</text>
    <text x="248" y="84">8</text>
    <text x="293" y="84">9</text>
    <text x="338" y="84">2</text>
    <text x="383" y="84">3</text>
    <text x="428" y="84">4</text>
    <text x="473" y="84">3</text>
    <text x="518" y="84">1</text>
  </g>

  <!-- inc 行 -->
  <g filter="url(#rough2)">
    <rect x="90" y="98" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="135" y="98" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="180" y="98" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="225" y="98" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="270" y="98" width="45" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="315" y="98" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="360" y="98" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="405" y="98" width="45" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="450" y="98" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="495" y="98" width="45" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="113" y="122">1</text>
    <text x="158" y="122">2</text>
    <text x="203" y="122">3</text>
    <text x="248" y="122">4</text>
    <text x="293" y="122">5</text>
    <text x="338" y="122">1</text>
    <text x="383" y="122">2</text>
    <text x="428" y="122">3</text>
    <text x="473" y="122">1</text>
    <text x="518" y="122">1</text>
  </g>

  <!-- 关键格子圈注：inc[4] 与 inc[7] -->
  <ellipse cx="293" cy="117" rx="22" ry="15" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="428" cy="117" rx="22" ry="15" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 括号标注两段 -->
  <path d="M 180 142 L 180 152 L 313 152 L 313 142" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="247" y="168" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① nums[2..4] 递增 ✓</text>

  <path d="M 317 146 L 317 160 L 450 160 L 450 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="384" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② nums[5..7] 递增 ✓</text>

  <!-- 判定结果 -->
  <rect x="60" y="198" width="480" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">取 e = 7：inc[7] = 3 ≥ k ✓，且 inc[e-k] = inc[4] = 5 ≥ k ✓</text>
  <text x="300" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">→ 对应 a = e - 2k + 1 = 2，返回 true</text>

  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">e = 5、6、8、9 时 inc[e] &lt; k，被跳过</text>
</svg>
