<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 472" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="472" fill="#fafafa"/>
  <text x="310" y="26" font-size="15.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：s = &quot;ababab&quot;（n = 6）</text>
  <text x="310" y="46" font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">前 3 位完全重合后 j 走到串尾，循环终止，i = 1 胜出</text>
