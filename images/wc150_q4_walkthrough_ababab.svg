  <text x="460.0" y="261" font-size="9.8" fill="#444" text-anchor="middle" filter="url(#rough2)">j ← 2+0+1 = 3，k ← 0</text>
  <rect x="22" y="272" width="40" height="30" fill="#fdfdfd" stroke="#c8cdd4" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
