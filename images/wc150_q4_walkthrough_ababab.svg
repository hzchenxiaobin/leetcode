  <text x="460.0" y="291" font-size="9.8" fill="#444" text-anchor="middle" filter="url(#rough2)">k ← 1（进入公共前缀）</text>
  <rect x="22" y="302" width="40" height="30" fill="#f7f9fb" stroke="#c8cdd4" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
