  <text x="245.0" y="321" font-size="9.8" fill="#444" text-anchor="middle" filter="url(#rough2)">a = a</text>
  <rect x="320" y="302" width="280" height="30" fill="#f7f9fb" stroke="#c8cdd4" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
