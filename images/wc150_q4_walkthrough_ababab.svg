  <rect x="170" y="362" width="150" height="30" fill="#f7f9fb" stroke="#c8cdd4" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="245.0" y="381" font-size="9.8" fill="#b85450" text-anchor="middle" filter="url(#rough2)">j+k = 6 = n</text>
  <rect x="320" y="362" width="280" height="30" fill="#fdf0f2" stroke="#d8b0b4" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="460.0" y="381" font-size="9.8" fill="#b85450" text-anchor="middle" filter="url(#rough2)">循环结束，返回 s[1..] = &quot;babab&quot;</text>
  <rect x="22" y="396" width="576" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="38" y="417" font-size="10.2" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">答案：s[1..] = &quot;babab&quot;。注意 k 停住的原因是 j+k 撞到了串尾，</text>
  <text x="38" y="437" font-size="10.2" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">而不是失配 —— 更长的后缀在公共前缀相同时反而更大，所以 i = 1 胜出。</text>
