<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">值只向左流：每个前缀的平均值是瓶颈</text>

  <g filter="url(#rough2)">
    <rect x="70" y="300" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
  </g>
  <text x="105" y="330" text-anchor="middle" font-size="15" fill="#1a2b45" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <rect x="150" y="210" width="70" height="140" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
  </g>
  <text x="185" y="330" text-anchor="middle" font-size="15" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)">
    <rect x="230" y="340" width="70" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
  </g>
  <text x="265" y="330" text-anchor="middle" font-size="15" fill="#1a2b45" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="310" y="240" width="70" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5"/>
  </g>
  <text x="345" y="330" text-anchor="middle" font-size="15" fill="#7a5a14" filter="url(#rough2)">6</text>

  <path d="M 60 300 L 400 300" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="304" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <g filter="url(#rough2)">
    <rect x="70" y="46" width="40" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0" rx="3"/>
  </g>
  <path d="M 70 48 L 140 48 L 140 300" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="105" y="40" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=1: ⌈3/1⌉=3</text>

  <path d="M 70 74 L 220 74 L 220 300" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=2: ⌈10/2⌉=5 ← 瓶颈!</text>

  <path d="M 70 102 L 300 102 L 300 300" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="255" y="94" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">k=3: ⌈11/3⌉=4</text>

  <path d="M 70 130 L 380 130 L 380 300" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="350" y="122" text-anchor="middle" font-size="11" fill="#a3721d" filter="url(#rough2)">k=4: ⌈17/4⌉=5 ← 并列瓶颈</text>

  <path d="M 430 316 L 236 316" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="330" font-size="11.5" fill="#b85450" filter="url(#rough2)">值只能</text>
  <text x="440" y="346" font-size="11.5" fill="#b85450" filter="url(#rough2)">向左搬</text>

  <g filter="url(#rough2)">
    <rect x="430" y="52" width="110" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#1d3a17" text-anchor="middle">
    <text x="485" y="74">答案 = max</text>
    <text x="485" y="92">⌈P_k / k⌉ = 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前缀 [3,7] 与 [3,7,1,6] 的均值把最大值死死顶在 5</text>
</svg>
