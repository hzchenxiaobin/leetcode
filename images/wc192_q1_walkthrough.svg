<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,5,1,3,4,7]，n = 3</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第 i 轮同时取出 x<tspan font-size="7.5" dy="2.5">i+1</tspan><tspan dy="-2.5"> 与 y</tspan><tspan font-size="7.5" dy="2.5">i+1</tspan><tspan dy="-2.5">，分别落到 2i 与 2i+1</tspan></text>
  <rect x="25" y="64" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60.0" y="83" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="95" y="64" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150.0" y="83" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <rect x="205" y="64" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260.0" y="83" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">nums[n+i]</text>
  <rect x="315" y="64" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370.0" y="83" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">res[2i]</text>
  <rect x="425" y="64" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480.0" y="83" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">res[2i+1]</text>
  <rect x="25" y="92" width="70" height="34" fill="#ffffff" stroke="#c9d4e2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="60.0" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="95" y="92" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="114" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">2</text>
  <rect x="205" y="92" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="114" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">3</text>
  <rect x="315" y="92" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="370.0" y="114" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">2</text>
  <rect x="425" y="92" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="480.0" y="114" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">3</text>
  <rect x="25" y="126" width="70" height="34" fill="#f4f7fb" stroke="#c9d4e2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="60.0" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="95" y="126" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="148" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">5</text>
  <rect x="205" y="126" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="148" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">4</text>
  <rect x="315" y="126" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="370.0" y="148" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">5</text>
  <rect x="425" y="126" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="480.0" y="148" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">4</text>
  <rect x="25" y="160" width="70" height="34" fill="#ffffff" stroke="#c9d4e2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="60.0" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="95" y="160" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="182" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">1</text>
  <rect x="205" y="160" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="182" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">7</text>
  <rect x="315" y="160" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="370.0" y="182" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">1</text>
  <rect x="425" y="160" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="480.0" y="182" text-anchor="middle" font-size="11" fill="#33502c" filter="url(#rough2)">7</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最终 res = [2, 3, 5, 4, 1, 7]，奇数位来自 y 段、偶数位来自 x 段</text>
  <rect x="103" y="234" width="54" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="163" y="234" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="223" y="234" width="54" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="283" y="234" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="310" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="343" y="234" width="54" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="403" y="234" width="54" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="260" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="430" y="292" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
</svg>
