<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描求 LCP，失配即停</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="200" y="52" width="240" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="73" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">n = min(len₁,len₂,len₃)，i = 0</text>
  <path d="M 320 86 L 320 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形① -->
  <g filter="url(#sk)"><polygon points="320,110 448,156 320,202 192,156" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">i &lt; n 且</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">s₁[i]=s₂[i]=s₃[i] ？</text>

  <!-- 是 → i++ 回环 -->
  <path d="M 448 156 L 482 156" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="464" y="146" text-anchor="middle" font-size="11.5" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="486" y="140" width="64" height="32" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="518" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">i++</text>
  <path d="M 518 140 C 518 100, 400 90, 328 106" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="100" text-anchor="middle" font-size="10.5" fill="#666">三位全相等才前进</text>

  <!-- 否 ↓ -->
  <path d="M 320 202 L 320 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="220" font-size="11.5" fill="#b85450">否</text>

  <!-- 菱形② -->
  <g filter="url(#sk)"><polygon points="320,230 408,272 320,314 232,272" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">i = 0 ？</text>

  <!-- 是 → -1 -->
  <path d="M 232 272 L 198 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="216" y="262" text-anchor="middle" font-size="11.5" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="76" y="254" width="120" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="136" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 −1</text>

  <!-- 否 → 答案 -->
  <path d="M 408 272 L 442 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="424" y="262" text-anchor="middle" font-size="11.5" fill="#b85450">否</text>
  <g filter="url(#sk)"><rect x="444" y="254" width="152" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="520" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 Σlen − 3i</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="60" y="336" width="520" height="48" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="320" y="356" text-anchor="middle" font-size="11.5" fill="#2b6e9e">扫描上界取最短串长度：越界（最短串耗尽）与失配同样让 i 停下</text>
  <text x="320" y="374" text-anchor="middle" font-size="11.5" fill="#2b6e9e">i 停在哪儿，LCP 就有多长——一次扫描替代「枚举 k + 反复切片比较」</text>
</svg>
