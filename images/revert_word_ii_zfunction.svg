<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 455"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="455" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心判据：t 秒可还原 ⟺ z[i] ≥ n − i（i ＝ t·k）</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="70" y="52" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a66" filter="url(#rough2)">z[i] ＝ w 与后缀 w[i:] 的最长公共前缀（LCP）长度</text>

  <!-- left panel: full hit -->
  <text x="185" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 整段命中：w ＝ "abacaba"，k ＝ 4，i ＝ 4</text>
  <text x="40" y="148" font-size="12" fill="#555" filter="url(#rough2)">前缀 w[:3] ＝</text>
  <g filter="url(#rough2)">
    <rect x="135" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="173" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="211" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="152" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="190" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="228" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="152" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="190" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="228" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="40" y="200" font-size="12" fill="#555" filter="url(#rough2)">后缀 w[4:] ＝</text>
  <g filter="url(#rough2)">
    <rect x="135" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="173" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="211" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="152" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="190" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="228" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="40" y="228" width="290" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">z[4] ＝ 3 ＝ n − i ＝ 3 ✓ 后缀整段是前缀</text>
  <text x="185" y="265" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">尾部 4 格自由照抄 → 1 秒即还原</text>

  <!-- right panel: near miss -->
  <text x="478" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3a35" filter="url(#rough2)">✗ 差一位不行：w ＝ "abcbabcd"，k ＝ 2，i ＝ 4</text>
  <text x="330" y="148" font-size="12" fill="#555" filter="url(#rough2)">前缀 w[:4] ＝</text>
  <g filter="url(#rough2)">
    <rect x="428" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="466" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="504" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="542" y="132" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="445" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="483" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="521" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="559" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="445" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="483" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="521" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">＝</text>
  <text x="559" y="176" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="330" y="200" font-size="12" fill="#555" filter="url(#rough2)">后缀 w[4:] ＝</text>
  <g filter="url(#rough2)">
    <rect x="428" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="466" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="504" y="182" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="542" y="182" width="34" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="445" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="483" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="521" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="559" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">d</text>
  <rect x="330" y="228" width="290" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a35" filter="url(#rough2)">z[4] ＝ 3 &lt; n − i ＝ 4 ✗ LCP 铺不满后缀</text>
  <text x="475" y="265" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">差一位也不行 → 该 t 不可行</text>

  <!-- bottom notes -->
  <rect x="40" y="298" width="580" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">z[i] ≤ n − i 恒成立（LCP 不超过后缀长），故判据等价于 z[i] ＝ n − i</text>
  <text x="330" y="344" text-anchor="middle" font-size="12" fill="#8a6a30" filter="url(#rough2)">候选起点 i ＝ t·k 只落在 k 的倍数格点上，共 ⌈n/k⌉ 个，每个查询 O(1)</text>

  <!-- lattice strip -->
  <text x="40" y="396" font-size="12" fill="#555" filter="url(#rough2)">格点示意（k ＝ 2，n ＝ 8）：</text>
  <g filter="url(#rough2)">
    <rect x="230" y="380" width="40" height="32" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="270" y="380" width="40" height="32" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="310" y="380" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="350" y="380" width="40" height="32" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="390" y="380" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="430" y="380" width="40" height="32" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="470" y="380" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="510" y="380" width="40" height="32" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="380" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="250" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="370" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="410" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="450" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="490" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="530" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="570" y="401" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="330" y="436" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">橙色格点（i ＝ 2, 4, 6）查 z；i ＝ 8 ≥ n 直接走「删光」分支</text>
</svg>
