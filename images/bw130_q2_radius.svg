<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="12"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="450" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">半边长 r = max(|x|, |y|)：点进正方形的最小代价</text>
  <path d="M 150.0 190.0 L 468.0 190.0" stroke="#888888" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <path d="M 300.0 320.0 L 300.0 50.0" stroke="#888888" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="476.0" y="194.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">x</text>
  <text x="306.0" y="44.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">y</text>
  <rect x="247.8" y="138.1" width="103.5" height="104.5" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="338.0" y="158.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">r=2</text>
  <rect x="196.3" y="86.5" width="207.8" height="207.7" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="390.0" y="106.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">r=4</text>
  <circle cx="351.6" cy="137.8" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364.0" y="132.0" text-anchor="start" font-size="10" fill="#444444" filter="url(#rough2)">a(2,2)</text>
  <text x="364.0" y="147.0" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=2</text>
  <circle cx="273.6" cy="242.2" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262.0" y="236.0" text-anchor="end" font-size="10" fill="#444444" filter="url(#rough2)">b(-1,-2)</text>
  <text x="262.0" y="251.0" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=2</text>
  <circle cx="195.9" cy="86.3" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184.0" y="80.0" text-anchor="end" font-size="10" fill="#444444" filter="url(#rough2)">d(-4,4)</text>
  <text x="184.0" y="95.0" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=4</text>
  <circle cx="222.2" cy="163.9" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210.0" y="158.0" text-anchor="end" font-size="10" fill="#444444" filter="url(#rough2)">c(-3,1)</text>
  <text x="210.0" y="173.0" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=3</text>
  <circle cx="377.7" cy="267.9" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390.0" y="262.0" text-anchor="start" font-size="10" fill="#444444" filter="url(#rough2)">a(3,-3)</text>
  <text x="390.0" y="277.0" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=3</text>
  <rect x="29.5" y="322.1" width="239.7" height="74.6" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150.0" y="346.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">点在正方形内 ⇔ |x| ≤ r 且 |y| ≤ r</text>
  <text x="150.0" y="363.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⇔ max(|x|, |y|) ≤ r</text>
  <text x="150.0" y="380.2" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">所以「点进正方形的最小 r」就是 d 坐标</text>
  <rect x="330.4" y="321.9" width="240.4" height="75.5" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450.0" y="346.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">边长 2r 的正方形只由 r 决定</text>
  <text x="450.0" y="363.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">r 一旦定下，包含的点集完全确定</text>
  <text x="450.0" y="380.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">⇒ 按 r 升序排序后逐组扫</text>
  <text x="300.0" y="432.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">示例 1：a、b 卡在 r=2；r=3 会收进 c 和第二个 a，标签重复 ⇒ 答案停在 2</text>
</svg>
