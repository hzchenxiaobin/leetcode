<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="30" y="32" font-size="17" fill="#333" filter="url(#rough2)">演算：n = 3、4、10、13 的 h、rest、k 与答案</text>

  <!-- 表头 -->
  <rect x="30" y="56" width="428" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n</text>
  <text x="102" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">h</text>
  <text x="161" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">F(h)</text>
  <text x="232" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">T_h</text>
  <text x="302" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">rest</text>
  <text x="359" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">k</text>
  <text x="420" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案</text>
  <line x1="80" y1="56" x2="80" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="125" y1="56" x2="125" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="197" y1="56" x2="197" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="267" y1="56" x2="267" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="337" y1="56" x2="337" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="382" y1="56" x2="382" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="30" y="88" width="428" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="102" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="161" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="232" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="302" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="359" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="30" y="120" width="428" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="102" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="161" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="232" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="302" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="359" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="142" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="30" y="152" width="428" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="102" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="161" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="232" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="302" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="359" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <rect x="30" y="184" width="428" height="32" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="102" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="161" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="232" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="302" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="359" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="206" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <rect x="30" y="56" width="428" height="160" rx="6" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>

  <text x="532" y="68" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">n = 13 的摆放</text>
  <rect x="482" y="84" width="22" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="508" y="84" width="22" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="519" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="534" y="84" width="22" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="560" y="84" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="571" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="482" y="110" width="22" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="508" y="110" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="519" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="534" y="110" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="545" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="482" y="136" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="493" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="532" y="196" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">触地 8 格</text>
  <text x="532" y="214" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">共 13 盒</text>

  <text x="30" y="254" font-size="13" fill="#333" filter="url(#rough2)">n = 13：底层 8 格（行长 4,3,1）</text>
  <text x="30" y="276" font-size="13" fill="#333" filter="url(#rough2)">各列高 3,2,2,1 / 2,1,1 / 1，合计 13</text>
  <text x="30" y="298" font-size="13" fill="#333" filter="url(#rough2)">逐层 8 + 4 + 1 = 13，触地 8 格</text>

  <rect x="30" y="316" width="560" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">h = max{ F(h) ≤ n }，rest = n − F(h)，k = min{ T_k ≥ rest }</text>
  <text x="310" y="360" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = T_h + k</text>
</svg>
