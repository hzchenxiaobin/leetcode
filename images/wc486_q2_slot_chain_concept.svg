<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：负数 = 焊死的槽位，非负槽位连成虚拟链</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input row -->
  <text x="192" y="96" text-anchor="end" font-size="13" fill="#555" font-family="monospace">nums =</text>
  <g filter="url(#sk)">
    <rect x="208" y="70" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="264" y="70" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="320" y="70" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="2"/>
    <rect x="376" y="70" width="56" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="236" y="97">5</text>
    <text x="292" y="97">4</text>
    <text x="348" y="97" fill="#b85450" font-weight="bold">−9</text>
    <text x="404" y="97">6</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="236" y="126">0</text>
    <text x="292" y="126">1</text>
    <text x="348" y="126">2</text>
    <text x="404" y="126">3</text>
  </g>
  <text x="348" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">焊死槽位（不读不写）</text>

  <!-- rotation arcs above: values move left by k=2 along the chain -->
  <path d="M 236 66 Q 264 40 290 66" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 292 64 Q 348 18 402 64" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="348" y="26" text-anchor="middle" font-size="11" fill="#a06a15">4 越过 −9 左移</text>
  <!-- wrap arc below: 6 wraps around to front -->
  <path d="M 404 132 Q 320 168 240 132" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="322" y="162" text-anchor="middle" font-size="11" fill="#a06a15">6 左移越界 → 绕回链首（循环）</text>
  <text x="560" y="100" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">k = 2</text>
  <text x="560" y="116" text-anchor="middle" font-size="10" fill="#999">沿链左移 2 格</text>

  <!-- output row -->
  <text x="192" y="216" text-anchor="end" font-size="13" fill="#555" font-family="monospace">输出 =</text>
  <g filter="url(#sk)">
    <rect x="208" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="264" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="320" y="190" width="56" height="44" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="2"/>
    <rect x="376" y="190" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="236" y="217" font-weight="bold">6</text>
    <text x="292" y="217" font-weight="bold">5</text>
    <text x="348" y="217" fill="#b85450" font-weight="bold">−9</text>
    <text x="404" y="217" font-weight="bold">4</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="236" y="246">0</text>
    <text x="292" y="246">1</text>
    <text x="348" y="246">2</text>
    <text x="404" y="246">3</text>
  </g>
  <text x="348" y="264" text-anchor="middle" font-size="11" fill="#b85450">原值原位，全程无人触碰</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="95" y="284" width="450" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="306" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">链：idx = [0,1,3]，vals = [5,4,6]，m = 3</text>
  <text x="320" y="328" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" font-family="monospace">回填：nums[idx[i]] ← vals[(i + k) mod m]</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="358" width="520" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="11" fill="#888">负数槽位是恒等映射，轮替只在虚拟链上进行——与被负数隔开多远无关。</text>
</svg>
