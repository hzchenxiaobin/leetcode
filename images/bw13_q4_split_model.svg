<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：1 号的握手把圆弧切成两个独立子问题</text>

  <!-- 6 人圆圈 -->
  <g filter="url(#rough2)">
    <ellipse cx="200" cy="200" rx="120" ry="120" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="200" cy="80"  r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="304" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="304" cy="260" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="200" cy="320" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="96"  cy="260" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="96"  cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="200" y="85"  fill="#7a2e2a" font-weight="bold">1</text>
    <text x="304" y="145">2</text><text x="304" y="265">3</text>
    <text x="200" y="325" fill="#2d5a22" font-weight="bold">4</text>
    <text x="96"  y="265">5</text><text x="96"  y="145">6</text>
  </g>
  <!-- 握手 (1,4) -->
  <path d="M 200 97 L 200 303" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 左侧子弧 -->
  <path d="M 200 320 A 120 120 0 0 0 200 80" fill="none" stroke="#4a7a3a" stroke-width="4" opacity="0.45" filter="url(#rough2)"/>
  <!-- 右侧子弧 -->
  <path d="M 200 80 A 120 120 0 0 1 200 320" fill="none" stroke="#d6a040" stroke-width="4" opacity="0.5" filter="url(#rough2)"/>
  <text x="112" y="204" font-size="12" fill="#4a7a3a" filter="url(#rough2)">弧 A</text>
  <text x="288" y="204" font-size="12" fill="#d6a040" filter="url(#rough2)">弧 B</text>

  <!-- 标注 -->
  <text x="430" y="96" font-size="13" fill="#7a2e2a" filter="url(#rough2)">1 号握手对象 j 必为偶数</text>
  <text x="430" y="116" font-size="13" fill="#7a2e2a" filter="url(#rough2)">(这里 j = 4)</text>
  <text x="430" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">弧 A：5、6 共 2 人</text>
  <text x="430" y="168" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ f(2) 种</text>
  <text x="430" y="200" font-size="12" fill="#d6a040" filter="url(#rough2)">弧 B：2、3 共 2 人</text>
  <text x="430" y="218" font-size="12" fill="#d6a040" filter="url(#rough2)">→ f(2) 种</text>
  <rect x="380" y="240" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="460" y="264" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">跨越握手线的弦必与</text>
  <text x="460" y="284" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">(1,4) 相交 → 只能同侧配对</text>

  <rect x="60" y="356" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="383" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">递推：f(k) = Σ f(j) · f(k−1−j)（卡特兰数卷积）</text>
</svg>
