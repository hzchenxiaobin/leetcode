<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单调栈一次扫描，出栈瞬间结算（以 sumMax 为例）</text>
  <path d="M 110 42 Q 340 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">值严格递减栈 + 哨兵 i=n；sumMin 完全镜像——弹栈条件 ≤ 换成 ≥</text>

  <!-- ===== left column: flowchart ===== -->
  <rect x="45" y="72" width="240" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="165" y="91" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold">for i = 0 … n（i = n 作 +∞ 哨兵）</text>
  <path d="M 165 102 L 165 114" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="45" y="118" width="240" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="165" y="136" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">while 栈非空 且</text>
  <text x="165" y="153" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">(i = n 或 nums[top] ≤ nums[i])</text>
  <path d="M 165 162 L 165 174" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="176" y="172" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="45" y="178" width="240" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="165" y="196" text-anchor="middle" font-size="10.5" fill="#2e5e2e">弹出 j = 栈顶；left = 新栈顶（空则 −1）</text>
  <text x="165" y="214" text-anchor="middle" font-size="10.5" fill="#2e5e2e">right = i（正是 j 的右边界 R_j）</text>
  <text x="165" y="232" text-anchor="middle" font-size="10.5" fill="#2e5e2e" font-weight="bold">sumMax += nums[j]·(j−left)·(right−j)</text>

  <path d="M 285 210 L 303 210 Q 311 210 311 202 L 311 148 Q 311 140 303 140 L 293 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 45 140 L 27 140 Q 19 140 19 148 L 19 268 Q 19 276 27 276 L 39 276" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="28" y="162" font-size="9.5" fill="#446688" font-weight="bold">否</text>

  <rect x="45" y="258" width="240" height="36" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="165" y="280" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold">i 入栈（栈值保持严格递减）</text>
  <path d="M 165 294 L 165 306" stroke="#3a3a3a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="110" y="310" width="110" height="24" rx="12" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" filter="url(#sk)"/>
  <text x="165" y="326" text-anchor="middle" font-size="10.5" fill="#666">↻ 下一 i</text>
  <path d="M 165 334 L 165 346" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <rect x="45" y="350" width="240" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="165" y="369" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">扫描结束 ⇒ 返回 sumMax</text>

  <rect x="45" y="396" width="240" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="165" y="416" text-anchor="middle" font-size="10.5" fill="#8c3a36" font-weight="bold">sumMin 完全镜像：</text>
  <text x="165" y="434" text-anchor="middle" font-size="10.5" fill="#8c3a36">递减栈 → 递增栈，弹 ≤ → 弹 ≥</text>

  <!-- ===== right column: stack snapshot + settle table ===== -->
  <text x="340" y="88" font-size="10.5" fill="#444" font-weight="bold">nums</text>
  <rect x="372" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="394" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="418" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="440" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−2</text>
  <rect x="464" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="486" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−3</text>
  <rect x="510" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="532" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <rect x="556" y="72" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="578" y="91" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="394" y="110" text-anchor="middle" font-size="8.5" fill="#999">0</text>
  <text x="440" y="110" text-anchor="middle" font-size="8.5" fill="#999">1</text>
  <text x="486" y="110" text-anchor="middle" font-size="8.5" fill="#999">2</text>
  <text x="532" y="110" text-anchor="middle" font-size="8.5" fill="#999">3</text>
  <text x="578" y="110" text-anchor="middle" font-size="8.5" fill="#999">4</text>

  <text x="500" y="134" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">i=3（值 4）到来时的栈（底 → 顶）</text>
  <rect x="370" y="144" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="402" y="161" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−3</text>
  <rect x="370" y="170" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="402" y="187" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−2</text>
  <rect x="370" y="196" width="64" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="402" y="213" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <path d="M 374 152 L 430 164" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 374 178 L 430 190" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 374 204 L 430 216" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#sk)"/>
  <path d="M 560 122 Q 500 132 442 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="565" y="118" font-size="10.5" fill="#b85450" font-weight="bold">nums[3]=4 ≥ 栈顶们</text>
  <text x="500" y="238" text-anchor="middle" font-size="10" fill="#8c3a36" font-weight="bold">⇒ −3、−2、4 依次弹出并结算，随后 3 入栈</text>

  <!-- settle event table -->
  <rect x="335" y="252" width="104" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="387" y="267" text-anchor="middle" font-size="10" fill="#2b4a6e" font-weight="bold">事件</text>
  <rect x="439" y="252" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="456" y="267" text-anchor="middle" font-size="10" fill="#2b4a6e" font-weight="bold">j</text>
  <rect x="473" y="252" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="495" y="267" text-anchor="middle" font-size="10" fill="#2b4a6e" font-weight="bold">left</text>
  <rect x="517" y="252" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="541" y="267" text-anchor="middle" font-size="10" fill="#2b4a6e" font-weight="bold">right</text>
  <rect x="565" y="252" width="62" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="596" y="267" text-anchor="middle" font-size="10" fill="#2b4a6e" font-weight="bold">贡献</text>

  <rect x="335" y="274" width="292" height="23" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="387" y="290" text-anchor="middle" font-size="10.5" fill="#333">i=3 弹 −3</text>
  <text x="456" y="290" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="495" y="290" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="541" y="290" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="596" y="290" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−3</text>

  <rect x="335" y="297" width="292" height="23" fill="#f7f7f3" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="387" y="313" text-anchor="middle" font-size="10.5" fill="#333">i=3 弹 −2</text>
  <text x="456" y="313" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="495" y="313" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="541" y="313" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="596" y="313" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">−4</text>

  <rect x="335" y="320" width="292" height="23" fill="#ffffff" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="387" y="336" text-anchor="middle" font-size="10.5" fill="#333">i=3 弹 4</text>
  <text x="456" y="336" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="495" y="336" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="541" y="336" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="596" y="336" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+12</text>

  <rect x="335" y="343" width="292" height="23" fill="#fff8e1" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="387" y="359" text-anchor="middle" font-size="10.5" fill="#333">i=5 弹 1（哨兵）</text>
  <text x="456" y="359" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="495" y="359" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="541" y="359" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="596" y="359" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+1</text>

  <rect x="335" y="366" width="292" height="23" fill="#fff8e1" stroke="#cccccc" stroke-width="0.8" filter="url(#sk)"/>
  <text x="387" y="382" text-anchor="middle" font-size="10.5" fill="#333">i=5 弹 4（哨兵）</text>
  <text x="456" y="382" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="495" y="382" text-anchor="middle" font-size="10.5" fill="#333">−1</text>
  <text x="541" y="382" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="596" y="382" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">+32</text>

  <rect x="335" y="402" width="292" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="481" y="423" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">sumMax = −3 − 4 + 12 + 1 + 32 = 38</text>
  <text x="481" y="444" text-anchor="middle" font-size="11" fill="#2e5e2e">镜像得 sumMin = −21 ⇒ ans = 38 − (−21) = 59</text>
</svg>
