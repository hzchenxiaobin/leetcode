<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：奇偶负号两条路</text>

  <!-- 示例 1 -->
  <rect x="24" y="44" width="232" height="264" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="68" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">示例 1：[3, −1, −5, 2, 5, −9]</text>
  <g filter="url(#rough2)" font-size="12" fill="#2f5527">
    <text x="42" y="94">大元素：3, −5, 2, 5, −9（−1 先放一边）</text>
    <text x="42" y="120">P = 3 · (−5) · 2 · 5 · (−9)</text>
    <text x="42" y="146">负号个数 = 2（偶数）✓</text>
    <text x="42" y="172">P = 3 · 5 · 2 · 5 · 9 = 1350</text>
    <text x="42" y="198" font-size="14" fill="#4a7a3a">返回 1350</text>
    <text x="42" y="224" font-size="11" fill="#5a7a4a">−1 若也乘进去 → 符号变负（−1350）</text>
    <text x="42" y="242" font-size="11" fill="#5a7a4a">所以只选下标 [0,2,3,4,5]</text>
    <text x="42" y="268" font-size="11" fill="#5a7a4a">全部大元素都是“越多越好”，</text>
    <text x="42" y="286" font-size="11" fill="#5a7a4a">不必纠结取舍顺序</text>
  </g>

  <!-- 示例 2 -->
  <rect x="272" y="44" width="232" height="264" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="388" y="68" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">示例 2：[−4, −5, −4]</text>
  <g filter="url(#rough2)" font-size="12" fill="#7a5a10">
    <text x="290" y="94">大元素：−4, −5, −4</text>
    <text x="290" y="120">P = (−4)·(−5)·(−4) = −80</text>
    <text x="290" y="146">负号个数 = 3（奇数）✗</text>
    <text x="290" y="172">没有 −1 可借 → 弃 |·| 最小的负数</text>
    <text x="290" y="192">（弃一个 −4）：</text>
    <text x="290" y="214">(−5)·(−4) = |P| / 4 = 20</text>
    <text x="290" y="240" font-size="14" fill="#b85450">返回 20</text>
    <text x="290" y="266" font-size="11" fill="#a08030">弃 −5 会剩 (−4)·(−4) = 16 &lt; 20，</text>
    <text x="290" y="284" font-size="11" fill="#a08030">弃绝对值最小的负数永远最优</text>
  </g>
</svg>
