<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 15, t = 3 → 答案是 16</text>

  <!-- 第一轮：15 -->
  <text x="40" y="86" font-size="13" fill="#446688" filter="url(#rough2)">x = 15</text>
  <g filter="url(#rough2)">
    <rect x="110" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="152" y="62" width="38" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="129" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 196 79 L 226 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="62" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p = 5</text>
  <path d="M 290 79 L 320 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="85" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5 % 3 = 2 ≠ 0 → 淘汰</text>
  <text x="345" y="85" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 第二轮：16 -->
  <text x="40" y="196" font-size="13" fill="#4a7a3a" filter="url(#rough2)">x = 16</text>
  <g filter="url(#rough2)">
    <rect x="110" y="172" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="152" y="172" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="129" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 196 189 L 226 189" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="172" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p = 6</text>
  <path d="M 290 189 L 320 189" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="448" y="195" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">6 % 3 = 0 → 命中</text>

  <rect x="150" y="238" width="260" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">返回 16</text>

  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">第一轮失败后 x 自增 1，第二轮命中即停 —— 顺序递增保证"首个即最小"</text>
</svg>
