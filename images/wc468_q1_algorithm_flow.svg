<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一遍扫描，扫到偶数就累积</text>

  <!-- 开始 -->
  <rect x="270" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="61" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,70 L320,86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="90" width="270" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="111" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">ans = 0（0 是 OR 的单位元）</text>
  <path d="M320,124 L320,140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 pill -->
  <rect x="245" y="144" width="150" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="161" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">i = 0 … n−1</text>
  <path d="M320,170 L320,182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,184 418,214 320,244 222,214" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="219" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">(nums[i] &amp; 1) == 0 ?</text>

  <!-- 是分支：偶数 → 累积 -->
  <text x="206" y="207" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M222,214 L194,214" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="196" width="145" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans = ans | nums[i]</text>

  <!-- 否分支：奇数 → 跳过 -->
  <text x="434" y="207" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M418,214 L446,214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="196" width="145" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="522" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过（奇数不参与）</text>

  <!-- 汇合 -->
  <path d="M120,232 L120,268" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M522,232 L522,268" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M120,268 L522,268" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M320,268 L320,284" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i+1 圆 -->
  <circle cx="320" cy="302" r="16" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="307" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i+1</text>

  <!-- 回边 -->
  <path d="M336,302 L604,302 L604,157 L402,157" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="294" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 循环结束 -->
  <text x="332" y="336" font-size="10.5" fill="#888" filter="url(#rough2)">循环结束</text>
  <path d="M320,318 L320,336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="340" width="140" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">返回 ans</text>

  <!-- 等价写法 -->
  <rect x="60" y="384" width="520" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="401" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">等价一行（Python）：reduce(or_, (x for x in nums if x % 2 == 0), 0)</text>
  <text x="320" y="416" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">顺序无关：| 满足交换律与结合律，初值 0 是单位元</text>
</svg>
