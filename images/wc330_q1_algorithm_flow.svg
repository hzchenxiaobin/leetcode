<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次比较直接出答案，等价于 max(n−1, 1)</text>

  <!-- ====== start ====== -->
  <rect x="210" y="44" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入正整数 n</text>

  <path d="M 280 82 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== decision diamond ====== -->
  <polygon points="280,104 366,160 280,216 194,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n == 1 ?</text>

  <!-- ====== yes branch (left) ====== -->
  <path d="M 192 160 L 176 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="184" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="30" y="138" width="142" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="101" y="157" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 1</text>
  <text x="101" y="174" text-anchor="middle" font-size="9.5" fill="#888">终态桌面 {1}</text>

  <!-- ====== no branch (right) ====== -->
  <path d="M 368 160 L 386 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="377" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="390" y="138" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="157" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">返回 n − 1</text>
  <text x="465" y="174" text-anchor="middle" font-size="9.5" fill="#888">终态桌面 {2,…,n}</text>

  <!-- ====== bottom note ====== -->
  <path d="M 280 218 L 280 256" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="100" y="260" width="360" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">统一写法：return max(n − 1, 1)</text>
  <text x="280" y="303" text-anchor="middle" font-size="10.5" fill="#333">无需真的跑 10⁹ 天：桌面 ⊆ [1,n] 且只增不减</text>
  <text x="280" y="321" text-anchor="middle" font-size="10" fill="#888">至多 n − 2 天集齐 {2,…,n}，10⁹ ≫ 100</text>
  <text x="280" y="343" text-anchor="middle" font-size="9.5" fill="#888">（保底写法：set 逐日模拟到无新增，O(n³) 亦能过）</text>
</svg>
