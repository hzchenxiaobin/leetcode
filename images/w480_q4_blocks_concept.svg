  <rect x="342" y="52" width="40" height="34" rx="4" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="74" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">A</text>
  <text x="152" y="74" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">A</text>
  <text x="194" y="74" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">B</text>
