  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：每块至多留 1 个、各留 1 个必交替</text>

  <text x="80" y="75" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">s =</text>

