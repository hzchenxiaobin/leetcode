  <rect x="298" y="108" width="44" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="340" y="108" width="44" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">A×2</text>
  <text x="236" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B×3</text>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#rough2)">A</text>
  <text x="362" y="128" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="235" y="158" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4 个极大同值块（相邻块字符必不同）</text>

  <path d="M235,164 L235,184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

