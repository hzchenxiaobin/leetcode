  <text x="152" y="212" text-anchor="middle" font-size="15" fill="#cccccc" filter="url(#rough2)">A</text>
  <text x="194" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">B</text>
