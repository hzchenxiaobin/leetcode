  <text x="320" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">A</text>
  <text x="362" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">B</text>
  <path d="M145,200 L159,214 M159,200 L145,214" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M229,200 L243,214 M243,200 L229,214" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M271,200 L285,214 M285,200 L271,214" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="202" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 保序拼接</text>
  <text x="398" y="222" text-anchor="start" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ABAB ✓</text>

  <rect x="80" y="246" width="360" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">最少删除 = 7 − 4 = 3</text>

  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">同块留两个：中间字符与之全同，留则相邻相等、删光则两者直接相邻相等</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每块各留一个：相邻块字符不同，拼接结果两两不同，必交替</text>
  <text x="260" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">等价说法：答案 = 区间内「相邻相等对」的个数</text>
</svg>
