<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：高个子看不见矮个子</text>
  <text filter="url(#rough2)" x="290" y="48" text-anchor="middle" font-size="11" fill="#888">按身高从高到低处理，把当前人插到下标 k：前面正好 k 个「身高 ≥ 他」的人</text>

  <text filter="url(#rough2)" x="54" y="82" font-size="10.5" fill="#3a4a66">① 处理到 (5,2) 时，已就位的 4 人身高都 ≥ 5（且各自已满足 k）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="118" y="94" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="206" y="94" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="294" y="94" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="382" y="94" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="158" y="116" fill="#3a5a30">5,0</text>
    <text x="246" y="116" fill="#3a5a30">7,0</text>
    <text x="334" y="116" fill="#3a5a30">6,1</text>
    <text x="422" y="116" fill="#3a5a30">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#999">
    <text x="158" y="144">0</text>
    <text x="246" y="144">1</text>
    <text x="334" y="144">2</text>
    <text x="422" y="144">3</text>
  </g>

  <path d="M 290 152 L 290 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="276" y="170" text-anchor="end" font-size="10.5" fill="#3a5a30">把 (5,2) 插到下标 k = 2</text>
  <text filter="url(#rough2)" x="302" y="171" font-size="9" fill="#999">（(6,1) 顺延一位）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="74" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="162" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="250" y="184" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="338" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="426" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="114" y="206" fill="#3a5a30">5,0</text>
    <text x="202" y="206" fill="#3a5a30">7,0</text>
    <text x="290" y="206" fill="#8a6a20">5,2</text>
    <text x="378" y="206" fill="#3a5a30">6,1</text>
    <text x="466" y="206" fill="#3a5a30">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#999">
    <text x="114" y="234">0</text>
    <text x="202" y="234">1</text>
    <text x="290" y="234">2</text>
    <text x="378" y="234">3</text>
    <text x="466" y="234">4</text>
  </g>

  <text filter="url(#rough2)" x="290" y="258" text-anchor="middle" font-size="10.5" fill="#444">下标 2 之前恰好 2 人（身高 5、7，都 ≥ 5）→ 满足 k = 2 ✓</text>

  <rect x="40" y="278" width="258" height="98" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="54" y="300" font-size="11" fill="#3a5a30" font-weight="bold">后来的人为什么不破坏它？</text>
  <text filter="url(#rough2)" x="54" y="322" font-size="9.8" fill="#555">严格更矮：插到他前面也不计入 k</text>
  <text filter="url(#rough2)" x="54" y="342" font-size="9.8" fill="#555">身高相同：k 更大，只会插在他后面</text>
  <text filter="url(#rough2)" x="54" y="362" font-size="9.4" fill="#888">（同身高且 k 相同 → 数据不可重建）</text>

  <rect x="318" y="278" width="222" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="332" y="300" font-size="11" fill="#8a6a20" font-weight="bold">所以一次插入就定型</text>
  <text filter="url(#rough2)" x="332" y="322" font-size="9.8" fill="#555">下标 = 前方高个数量</text>
  <text filter="url(#rough2)" x="332" y="342" font-size="9.8" fill="#555">不必回头修改任何人</text>
  <text filter="url(#rough2)" x="332" y="362" font-size="9.4" fill="#888">总代价 O(n²)</text>

  <text filter="url(#rough2)" x="290" y="392" text-anchor="middle" font-size="10" fill="#999">绿框 = 已就位且身高 ≥ 5 的人；橙框 = 本步插入的 (5,2)</text>
</svg>
