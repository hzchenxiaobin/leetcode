<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：字符自由搬运 ⇒ 只看各字母总数能否被 n 整除</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="48" y="64" font-size="11" fill="#888">绿 = 总数整除 ✓ · 红 = 不整除 ✗</text>

  <!-- Example 1 -->
  <text x="48" y="86" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1</text>
  <text x="106" y="86" font-size="12" fill="#444" font-family="monospace">words = ["abc","aabc","bc"]</text>
  <g filter="url(#sk)">
    <rect x="48" y="92" width="76" height="32" rx="5" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="132" y="92" width="96" height="32" rx="5" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="236" y="92" width="60" height="32" rx="5" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="86" y="113" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">"abc"</text>
  <text x="180" y="113" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">"aabc"</text>
  <text x="266" y="113" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">"bc"</text>
  <g filter="url(#sk)">
    <path d="M 172 128 L 172 142" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="182" y="140" font-size="10" fill="#888">跨串合并计数</text>
  <g filter="url(#sk)">
    <rect x="48" y="146" width="76" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="132" y="146" width="76" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="216" y="146" width="76" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="86" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">a : 3</text>
  <text x="170" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">b : 3</text>
  <text x="254" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">c : 3</text>
  <text x="306" y="166" font-size="12" fill="#444" font-family="monospace">n = 3</text>
  <text x="306" y="182" font-size="11" fill="#2e6e2e" font-family="monospace">3 % 3 = 0 ✓</text>
  <g filter="url(#sk)">
    <rect x="48" y="186" width="248" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="172" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">全部整除 → return true</text>
  <text x="172" y="219" text-anchor="middle" font-size="10" fill="#666">均分方案：每串 1a 1b 1c → 都成 "abc"</text>

  <!-- Example 2 -->
  <text x="48" y="248" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2</text>
  <text x="106" y="248" font-size="12" fill="#444" font-family="monospace">words = ["ab","a"]</text>
  <g filter="url(#sk)">
    <rect x="48" y="254" width="64" height="32" rx="5" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="120" y="254" width="44" height="32" rx="5" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="80" y="275" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">"ab"</text>
  <text x="142" y="275" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">"a"</text>
  <g filter="url(#sk)">
    <path d="M 112 290 L 112 304" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="48" y="308" width="76" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="132" y="308" width="76" height="30" rx="5" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="86" y="328" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">a : 2</text>
  <text x="170" y="328" text-anchor="middle" font-size="13" fill="#b03a3a" font-family="monospace">b : 1</text>
  <text x="222" y="328" font-size="12" fill="#444" font-family="monospace">n = 2</text>
  <text x="222" y="344" font-size="11" fill="#b03a3a" font-family="monospace">1 % 2 = 1 ✗</text>
  <g filter="url(#sk)">
    <rect x="48" y="348" width="248" height="38" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="172" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">b 无法均分 → return false</text>
  <text x="172" y="381" text-anchor="middle" font-size="10" fill="#666">无论怎么搬，总有一个串多出那一个 b</text>

  <!-- Right observation boxes -->
  <g filter="url(#sk)">
    <rect x="420" y="60" width="224" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="532" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察① 总数守恒</text>
  <text x="532" y="106" text-anchor="middle" font-size="11" fill="#444">每步只把一个字符从 words[i]</text>
  <text x="532" y="122" text-anchor="middle" font-size="11" fill="#444">搬到 words[j]，不增不减</text>
  <text x="532" y="140" text-anchor="middle" font-size="11" fill="#666">⇒ 每个字母的总数是不变量</text>
  <g filter="url(#sk)">
    <rect x="420" y="168" width="224" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="532" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察② 位置自由</text>
  <text x="532" y="214" text-anchor="middle" font-size="11" fill="#444">字符可插入 words[j] 任意位置</text>
  <text x="532" y="230" text-anchor="middle" font-size="11" fill="#444">⇒ 串内顺序无关紧要</text>
  <text x="532" y="248" text-anchor="middle" font-size="11" fill="#666">只看每串的字符多重集合</text>
  <g filter="url(#sk)">
    <rect x="420" y="276" width="224" height="110" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="532" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">观察③ 充要条件</text>
  <text x="532" y="322" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">全等 ⟺ ∀字母: total % n = 0</text>
  <text x="532" y="342" text-anchor="middle" font-size="11" fill="#b03a3a">不整除：永远差一个，无解</text>
  <text x="532" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e">整除：均分即得目标串 T</text>
  <text x="532" y="378" text-anchor="middle" font-size="10" fill="#888">判定 = 纯数值条件，与搬运过程无关</text>
</svg>
