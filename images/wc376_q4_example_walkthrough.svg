<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,6,4]，k = 3</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12.5" fill="#666">排序得 a = [1, 2, 4, 6]，pre = [0, 1, 3, 7, 13]；ans 初始为 0</text>

  <g filter="url(#sk)"><rect x="30" y="74" width="470" height="66" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="46" y="96" font-size="12.5" font-weight="bold" fill="#2b6e9e">r = 0：窗口 [1]（l=0）</text>
  <g filter="url(#sk)"><rect x="46" y="104" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="68" y="122" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="94" y="104" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="116" y="122" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk)"><rect x="142" y="104" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="164" y="122" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk)"><rect x="190" y="104" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="212" y="122" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="330" y="100" font-size="12" fill="#444">cost = 0 ≤ 3，t = 1</text>
  <text x="330" y="122" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = 1</text>

  <g filter="url(#sk)"><rect x="30" y="148" width="470" height="66" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="46" y="170" font-size="12.5" font-weight="bold" fill="#2b6e9e">r = 1：窗口 [1, 2]（l=0）</text>
  <g filter="url(#sk)"><rect x="46" y="178" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="68" y="196" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="94" y="178" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="116" y="196" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="142" y="178" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="164" y="196" text-anchor="middle" font-size="12" fill="#aaa">4</text>
  <g filter="url(#sk)"><rect x="190" y="178" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="212" y="196" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="330" y="174" font-size="12" fill="#444">cost = 1 ≤ 3（t = 1：2−1）</text>
  <text x="330" y="196" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = 2</text>

  <g filter="url(#sk)"><rect x="30" y="222" width="470" height="66" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="46" y="244" font-size="12.5" font-weight="bold" fill="#2b6e9e">r = 2：窗口 [1, 2, 4]（l=0）</text>
  <g filter="url(#sk)"><rect x="46" y="252" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="68" y="270" text-anchor="middle" font-size="12" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="94" y="252" width="44" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="116" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="142" y="252" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="164" y="270" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="190" y="252" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="212" y="270" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <text x="330" y="248" font-size="12" fill="#444">中位数 t = 2，cost = 3 ≤ 3</text>
  <text x="330" y="270" font-size="12.5" font-weight="bold" fill="#2e6e2e">ans = 3</text>

  <g filter="url(#sk)"><rect x="30" y="296" width="470" height="102" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="46" y="318" font-size="12.5" font-weight="bold" fill="#8a3a36">r = 3：超预算，连续收缩两次</text>
  <g filter="url(#sk)"><rect x="46" y="326" width="44" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="68" y="344" text-anchor="middle" font-size="12" fill="#8a3a36">1</text>
  <g filter="url(#sk)"><rect x="94" y="326" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="116" y="344" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="142" y="326" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="164" y="344" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="190" y="326" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="212" y="344" text-anchor="middle" font-size="12" fill="#2b6e9e">6</text>
  <text x="330" y="336" font-size="12" fill="#444">[1,2,4,6]：cost = 7 &gt; 3 → l = 1</text>
  <text x="330" y="356" font-size="12" fill="#444">[2,4,6]：cost = 4 &gt; 3 → l = 2</text>
  <g filter="url(#sk)"><rect x="46" y="360" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="68" y="378" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <g filter="url(#sk)"><rect x="94" y="360" width="44" height="26" rx="4" fill="#f4f4f0" stroke="#c5c3bb" stroke-width="1"/></g>
  <text x="116" y="378" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <g filter="url(#sk)"><rect x="142" y="360" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="164" y="378" text-anchor="middle" font-size="12" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><rect x="190" y="360" width="44" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="212" y="378" text-anchor="middle" font-size="12" fill="#2b6e9e">6</text>
  <text x="330" y="378" font-size="12" fill="#444">[4,6]：cost = 2 ≤ 3 ✓</text>

  <path d="M 265 398 L 265 418" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="420" width="440" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="280" y="437" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">扫描结束：ans = 3（对应把 1、4、6 都改成 2，共花 1+2+0 = 3 步）</text>
  <text x="280" y="454" text-anchor="middle" font-size="11" fill="#444">与官方示例一致：[2,2,6,2] → 众数 2 出现 3 次</text>
</svg>
