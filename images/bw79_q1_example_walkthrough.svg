<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">反例走查：num = "030" → false</text>

  <g filter="url(#rough2)">
    <rect x="160" y="46" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="230" y="46" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="46" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="20" fill="#333" text-anchor="middle">
    <text x="190" y="75">0</text><text x="260" y="75">3</text><text x="330" y="75">0</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="190" y="106">下标 0</text><text x="260" y="106">下标 1</text><text x="330" y="106">下标 2</text>
  </g>

  <!-- 逐条判定 -->
  <g filter="url(#rough2)">
    <rect x="30" y="130" width="460" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="44" y="151">i = 0：num[0] = '0' → 要求数字 0 出现 0 次，实际出现 2 次</text>
    <text x="44" y="172" fill="#b85450" font-weight="bold">✗ 不满足（两个 '0' 多出来了）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="192" width="460" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="44" y="213">i = 1：num[1] = '3' → 要求数字 1 出现 3 次，实际出现 0 次</text>
    <text x="44" y="234" fill="#b85450" font-weight="bold">✗ 不满足（一个 '1' 都没有）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="254" width="460" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="44" y="275">i = 2：num[2] = '0' → 要求数字 2 出现 0 次，实际出现 0 次</text>
    <text x="44" y="296" fill="#4a7a3a" font-weight="bold">✓ 满足</text>
  </g>

  <path d="M 60 312 C 80 332, 120 340, 170 342" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="344" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">只要一位不满足 → 返回 false</text>
</svg>
