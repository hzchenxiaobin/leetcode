<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">下标 i 的不稳定值 = max(nums[0..i]) − min(nums[i..n−1])</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">两段区间都包含 i 本身，所以不稳定值恒 ≥ 0</text>

  <g filter="url(#rough2)" font-size="13">
    <rect x="100" y="66" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="66" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="280" y="66" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="370" y="66" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="140" y="86" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="230" y="86" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320" y="86" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410" y="86" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="140" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="230" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="320" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="410" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <text x="492" y="82" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <path d="M 486 84 C 450 92, 400 88, 366 82" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 100 132 L 100 126 M 100 129 L 360 129 M 360 132 L 360 126" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 nums[0..2] 的 max = 5（preMax）</text>

  <path d="M 280 176 L 280 170 M 280 173 L 450 173 M 450 176 L 450 170" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="194" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀 nums[2..3] 的 min = 1（sufMin）</text>

  <rect x="60" y="210" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">不稳定值(2) = 5 − 1 = 4 &gt; k = 3 → 下标 2 不稳定 ✗</text>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不稳定值(3) = 5 − 4 = 1 ≤ 3 → 下标 3 稳定 ✓</text>

  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">preMax 与 sufMin 都随 i 增大而不减，差值不单调</text>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">→ 不能二分，从左往右扫，取第一个满足的下标</text>
</svg>
