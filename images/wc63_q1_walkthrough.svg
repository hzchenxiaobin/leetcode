  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">灰底列给出下标，橙色为普通台阶、红色为昂贵的 100</text>

  <rect x="52" y="210" width="416" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#8a2f28" filter="url(#rough2)">f[10] = min( f[9] + cost[9],  f[8] + cost[8] )</text>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">= min( 5 + 1,  4 + 100 ) = 6</text>

  <rect x="52" y="258" width="416" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">最优路径 0 → 2 → 4 → 6 → 7 → 9 → 顶部，代价 1+1+1+1+1+1</text>

  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意 f[1] = 0 却带着 cost[1] = 100：从 1 起步并不更省</text>
