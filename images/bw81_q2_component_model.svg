<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="84"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：不可达对 = 全部对 − 同分量内部对</text>

  <!-- 示例图 n=7 -->
  <text x="280" y="60" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">示例 2：n = 7，edges = [[0,2],[0,5],[2,4],[1,6],[5,4]]</text>

  <!-- 分量 A {0,2,4,5} -->
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="130" rx="118" ry="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="150" y="86" font-size="12.5" fill="#446688" filter="url(#rough2)" text-anchor="middle">分量 A：大小 4</text>
  <g filter="url(#rough2)">
    <circle cx="84" cy="118" r="17" fill="#fafafa" stroke="#446688" stroke-width="1.8"/>
    <circle cx="140" cy="148" r="17" fill="#fafafa" stroke="#446688" stroke-width="1.8"/>
    <circle cx="196" cy="118" r="17" fill="#fafafa" stroke="#446688" stroke-width="1.8"/>
    <circle cx="152" cy="100" r="17" fill="#fafafa" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="84" y="122">0</text>
    <text x="140" y="152">2</text>
    <text x="196" y="122">4</text>
    <text x="152" y="104">5</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 98 126 L 126 141" stroke="#446688" stroke-width="1.6"/>
    <path d="M 154 116 L 190 114" stroke="#446688" stroke-width="1.6"/>
    <path d="M 165 112 L 132 135" stroke="#446688" stroke-width="1.6"/>
  </g>

  <!-- 分量 B {1,6} -->
  <g filter="url(#rough2)">
    <ellipse cx="410" cy="128" rx="76" ry="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="410" y="90" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">分量 B：大小 2</text>
  <g filter="url(#rough2)">
    <circle cx="384" cy="128" r="17" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="438" cy="128" r="17" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="384" y="132">1</text>
    <text x="438" y="132">6</text>
  </g>
  <path d="M 401 128 L 421 128" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 分量 C {3} -->
  <g filter="url(#rough2)">
    <ellipse cx="500" cy="210" rx="44" ry="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <text x="500" y="188" font-size="12.5" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">分量 C：大小 1</text>
  <g filter="url(#rough2)">
    <circle cx="500" cy="214" r="17" fill="#fafafa" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="500" y="218" font-size="12.5" fill="#333" filter="url(#rough2)" text-anchor="middle">3</text>

  <!-- 计数公式 -->
  <g filter="url(#rough2)">
    <rect x="40" y="266" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="288" text-anchor="middle">总对数 C(7,2) = 21　；　同分量对数 = C(4,2)+C(2,2)+C(1,2) = 6+1+0 = 7</text>
    <text x="280" y="310" text-anchor="middle" font-weight="bold" fill="#d6a040">不可达对数 = 21 − 7 = 14 ✓（与官方答案一致）</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#888">
    <text x="280" y="348" text-anchor="middle">按分量大小统计的直觉：大小为 s 的分量「内部」贡献 C(s,2) 个可达对；</text>
    <text x="280" y="366" text-anchor="middle">不同分量之间的 s_i × s_j 个对全部不可达 —— 用总数减去内部对恰好在统计上等价</text>
  </g>
</svg>
