<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">花费在「离开台阶」时支付，到达时不计费</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">站在位置 i 上时还没付 cost[i]；付完才能跨 1 或 2 阶</text>

  <text x="65" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <rect x="34" y="96" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4660" filter="url(#rough2)">10</text>

  <text x="143" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <rect x="112" y="96" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="143" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4660" filter="url(#rough2)">15</text>

  <text x="221" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <rect x="190" y="96" width="62" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="221" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4660" filter="url(#rough2)">20</text>

  <text x="299" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <rect x="268" y="96" width="62" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="299" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">…</text>

  <text x="377" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n−1</text>
  <rect x="346" y="96" width="62" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="377" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">…</text>

  <text x="455" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=n</text>
  <rect x="424" y="96" width="62" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="455" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424" filter="url(#rough2)">顶部</text>
  <text x="455" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">走出最后一步</text>

  <path d="M 96 130 Q 104 121 111 129" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 174 130 Q 182 121 189 129" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 130 Q 260 121 267 129" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 408 130 Q 416 121 423 129" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="312" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每次移动只付当前台阶的钱</text>

  <rect x="48" y="182" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="146" y="200" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">起点：下标 0 或 1</text>
  <text x="146" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">站在上面不付费 → f[0]=f[1]=0</text>
  <path d="M 65 182 L 65 148" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 143 182 L 143 148" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="266" y="182" width="206" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="369" y="200" text-anchor="middle" font-size="12" fill="#8a2f28" filter="url(#rough2)">终点：位置 n，不是 n−1</text>
  <text x="369" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">所以 cost[n−1] / cost[n−2] 也要付</text>

  <rect x="60" y="246" width="400" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">f[i] = min( f[i−1] + cost[i−1],  f[i−2] + cost[i−2] )</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">答案就是 f[n]，一步到位，无需再取 min</text>

  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对照：常见错误写法是 f[i] = cost[i] + min(f[i−1], f[i−2])</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">它把「离开时的付费」记成了「到达时的付费」，最后一步会漏算</text>
</svg>
