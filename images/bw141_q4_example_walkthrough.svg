<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 3，x = 3，y = 4 → 684</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">逐项填 C(x,j)、S(3,j)、j!、y^j 四列，最后一列是乘积</text>

  <rect x="32" y="62" width="496" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j</text>
  <text x="156" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">C(3, j)</text>
  <text x="246" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">S(3, j)</text>
  <text x="336" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j!</text>
  <text x="416" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">y^j = 4^j</text>
  <text x="498" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">本项</text>

  <rect x="32" y="98" width="496" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="72" y="118" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
  <text x="156" y="118" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="246" y="118" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="336" y="118" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="416" y="118" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="498" y="118" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">3·1·1·4 = 12</text>

  <rect x="32" y="132" width="496" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="72" y="152" text-anchor="middle" font-size="11" fill="#8a6a20">2</text>
  <text x="156" y="152" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="246" y="152" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="336" y="152" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="416" y="152" text-anchor="middle" font-size="11" fill="#555">16</text>
  <text x="498" y="152" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">3·3·2·16 = 288</text>

  <rect x="32" y="166" width="496" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="72" y="186" text-anchor="middle" font-size="11" fill="#8a3a36">3</text>
  <text x="156" y="186" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="246" y="186" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="336" y="186" text-anchor="middle" font-size="11" fill="#555">6</text>
  <text x="416" y="186" text-anchor="middle" font-size="11" fill="#555">64</text>
  <text x="498" y="186" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">1·1·6·64 = 384</text>

  <rect x="32" y="204" width="496" height="34" fill="#fafafa" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="72" y="226" text-anchor="middle" font-size="11" fill="#333">合计</text>
  <text x="300" y="226" text-anchor="middle" font-size="11" fill="#333">12 + 288 + 384</text>
  <text x="498" y="226" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">= 684</text>

  <rect x="32" y="252" width="496" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10.5" fill="#3a4a66">j = 2 的解释：挑 2 个节目（3 种），3 人分成 2 个非空组（S(3,2)=3 种），</text>
  <text x="280" y="289" text-anchor="middle" font-size="10.5" fill="#3a4a66">再给这 2 组编号（2! = 2 种），最后各自打 1..4 的分（4² = 16 种）。</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#888">小数据可用暴力枚举 x^n 种安排交叉验证（见编译验证脚本），n, x ≤ 4 时穷举一致</text>
</svg>
