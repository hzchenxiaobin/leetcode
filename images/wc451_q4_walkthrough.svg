<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="920" height="660" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">示例演算：s = "abababace" —— 「能删就删」反而最大</text>
  <path d="M 210 44 Q 460 52 710 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="226" y="70" width="52" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="252" y="101" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">a</text>
  <rect x="278" y="70" width="52" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="304" y="101" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">b</text>
  <rect x="330" y="70" width="52" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="356" y="101" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">a</text>
  <rect x="382" y="70" width="52" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="408" y="101" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">b</text>
  <rect x="434" y="70" width="52" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="460" y="101" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">a</text>
  <rect x="486" y="70" width="52" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="512" y="101" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">b</text>
  <rect x="538" y="70" width="52" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="564" y="101" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">a</text>
  <rect x="590" y="70" width="52" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="616" y="101" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">c</text>
  <rect x="642" y="70" width="52" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="668" y="101" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">e</text>
  <text x="252" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">0</text>
  <text x="304" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">1</text>
  <text x="356" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">2</text>
  <text x="408" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">3</text>
  <text x="460" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">4</text>
  <text x="512" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">5</text>
  <text x="564" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">6</text>
  <text x="616" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">7</text>
  <text x="668" y="138" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">8</text>
  <text x="190" y="100" text-anchor="end" font-size="12" fill="#666" filter="url(#sk)">s =</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">绿框 = 可作为首个幸存字符的位置 k（合法 k = 0, 2, 4, 6，s[k] 全是 'a'）</text>

  <text x="80" y="206" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#sk)">枚举 dp[0][8] 的首个幸存位置 k：</text>

  <rect x="80" y="222" width="760" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="120" y="248" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">k</text>
  <text x="250" y="248" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">前缀 [0..k−1] 须可全删</text>
  <text x="580" y="248" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">候选 = s[k] + dp[k+1][8]</text>

  <rect x="80" y="262" width="760" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="120" y="288" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#sk)">0</text>
  <text x="250" y="288" font-size="12.5" fill="#555" filter="url(#sk)">（空前缀）✓</text>
  <text x="580" y="288" font-size="13.5" fill="#2f5d24" font-weight="bold" filter="url(#sk)">"a" + dp[1..8] = "abababace" ← 最小 ✓</text>

  <rect x="80" y="302" width="760" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="120" y="328" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="250" y="328" font-size="12.5" fill="#555" filter="url(#sk)">"ab" ✓</text>
  <text x="580" y="328" font-size="13" fill="#555" filter="url(#sk)">"a" + dp[3..8] = "ababace"</text>

  <rect x="80" y="342" width="760" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="120" y="368" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <text x="250" y="368" font-size="12.5" fill="#555" filter="url(#sk)">"abab" ✓</text>
  <text x="580" y="368" font-size="13" fill="#555" filter="url(#sk)">"a" + dp[5..8] = "abace"</text>

  <rect x="80" y="382" width="760" height="40" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="120" y="408" font-size="13" fill="#333" filter="url(#sk)">6</text>
  <text x="250" y="408" font-size="12.5" fill="#555" filter="url(#sk)">"ababab" ✓</text>
  <text x="580" y="408" font-size="13" fill="#555" filter="url(#sk)">"a" + dp[7..8] = "ace"</text>

  <rect x="80" y="422" width="760" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="120" y="448" font-size="13" fill="#b85450" filter="url(#sk)">8</text>
  <text x="250" y="448" font-size="12.5" fill="#b85450" filter="url(#sk)">"abababac" ✗ 末尾的 c 无法配对，删不完</text>
  <text x="580" y="448" font-size="13" fill="#b85450" filter="url(#sk)">——</text>

  <text x="460" y="496" text-anchor="middle" font-size="13.5" fill="#3d5a30" filter="url(#sk)">逐位比较（公共前缀 "aba…" 之后才分胜负）：</text>
  <text x="460" y="524" text-anchor="middle" font-size="15" fill="#2f5d24" font-weight="bold" filter="url(#sk)">abababace &lt; ababace &lt; abace &lt; ace</text>

  <rect x="100" y="552" width="720" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="460" y="578" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#sk)">陷阱：贪心「能删就删」= 沿着上表一路删下去 —— abababace → ababace → abace → ace，越删越大！</text>
  <text x="460" y="602" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">从最左边删掉一对 (a,b)，右侧字符整体左移，比较位上的 'b' 被更右的 'c' 顶替 ——</text>
  <text x="460" y="624" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">删除竟然让字典序变大！局部「能删」≠ 全局更小 ⇒ 必须区间 DP 全面比较</text>
</svg>
