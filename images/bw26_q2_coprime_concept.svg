<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    每行分母 d 恰有 φ(d) 个互质分子
  </text>

  <!-- 法里点阵：行 = 分母，列 = 分子 -->
  <text x="60" y="72" font-size="13" fill="#666" filter="url(#rough2)">分母 ↓ / 分子 →</text>
  <g filter="url(#rough2)" font-size="12" fill="#999">
    <text x="140" y="72" text-anchor="middle">1</text>
    <text x="180" y="72" text-anchor="middle">2</text>
    <text x="220" y="72" text-anchor="middle">3</text>
    <text x="260" y="72" text-anchor="middle">4</text>
    <text x="300" y="72" text-anchor="middle">5</text>
    <text x="340" y="72" text-anchor="middle">6</text>
  </g>

  <!-- d=2 行 -->
  <text x="100" y="106" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">d = 2</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="102" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="102" r="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="140" y="106" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">1</text>
  <text x="180" y="106" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">2</text>

  <!-- d=3 行 -->
  <text x="100" y="146" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">d = 3</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="142" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="142" r="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
    <circle cx="220" cy="142" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="140" y="146" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="180" y="146" text-anchor="middle" fill="#aaa">2</text>
    <text x="220" y="146" text-anchor="middle" fill="#2f5a24">2</text>
  </g>
  <text x="410" y="146" font-size="13" fill="#2f5a24" filter="url(#rough2)">φ(3) = 2</text>

  <!-- d=4 行 -->
  <text x="100" y="186" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">d = 4</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="182" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="182" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="220" cy="182" r="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
    <circle cx="260" cy="182" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="140" y="186" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="180" y="186" text-anchor="middle" fill="#b85450">2</text>
    <text x="220" y="186" text-anchor="middle" fill="#aaa">3</text>
    <text x="260" y="186" text-anchor="middle" fill="#2f5a24">3</text>
  </g>
  <text x="410" y="186" font-size="13" fill="#2f5a24" filter="url(#rough2)">φ(4) = 2</text>

  <!-- d=5 行 -->
  <text x="100" y="226" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">d = 5</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="220" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="260" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="300" cy="222" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#2f5a24">
    <text x="140" y="226" text-anchor="middle">1</text>
    <text x="180" y="226" text-anchor="middle">2</text>
    <text x="220" y="226" text-anchor="middle">3</text>
    <text x="260" y="226" text-anchor="middle">4</text>
    <text x="300" y="226" text-anchor="middle">4</text>
  </g>
  <text x="410" y="226" font-size="13" fill="#2f5a24" filter="url(#rough2)">φ(5) = 4</text>

  <!-- d=6 行 -->
  <text x="100" y="266" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">d = 6</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="262" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="262" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="220" cy="262" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="260" cy="262" r="12" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/>
    <circle cx="300" cy="262" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="340" cy="262" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="11">
    <text x="140" y="266" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="180" y="266" text-anchor="middle" fill="#b85450">2</text>
    <text x="220" y="266" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="260" y="266" text-anchor="middle" fill="#aaa">3</text>
    <text x="300" y="266" text-anchor="middle" fill="#b85450">4</text>
    <text x="340" y="266" text-anchor="middle" fill="#2f5a24">5</text>
  </g>
  <text x="410" y="266" font-size="13" fill="#2f5a24" filter="url(#rough2)">φ(6) = 2</text>

  <!-- 图例与结论 -->
  <rect x="60" y="290" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <circle cx="84" cy="310" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="315" font-size="12" fill="#8a6a1a" filter="url(#rough2)">gcd=1 保留</text>
  <circle cx="192" cy="310" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="206" y="315" font-size="12" fill="#8a6a1a" filter="url(#rough2)">可约分（如 2/4）</text>
  <text x="330" y="315" font-size="12" fill="#8a6a1a" filter="url(#rough2)">总数 = Σφ(d)</text>
</svg>
