<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">一最多的行：逐行计数 + 打擂台</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: 每行独立计数 ===== -->
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 每行独立：cntᵢ = 第 i 行 1 的个数</text>

  <!-- row 0 : [0,1,0,1] -->
  <text x="92" y="121" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行0:</text>
  <g filter="url(#sk)"><rect x="100" y="96" width="44" height="40" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="122" y="121" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="152" y="96" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="174" y="121" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="204" y="96" width="44" height="40" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="226" y="121" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="256" y="96" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="278" y="121" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <path d="M 304 116 L 330 116" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="336" y="96" width="84" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="378" y="121" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cnt = 2</text>

  <!-- row 1 : [1,1,0,0] -->
  <text x="92" y="171" text-anchor="end" font-size="11" fill="#888" font-weight="bold">行1:</text>
  <g filter="url(#sk)"><rect x="100" y="146" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="122" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="152" y="146" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="174" y="171" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="204" y="146" width="44" height="40" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="226" y="171" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="256" y="146" width="44" height="40" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="278" y="171" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <path d="M 304 166 L 330 166" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="336" y="146" width="84" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="378" y="171" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cnt = 2</text>

  <!-- row 2 : [0,1,1,1] -->
  <text x="92" y="221" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">行2:</text>
  <g filter="url(#sk)"><rect x="100" y="196" width="44" height="40" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="122" y="221" text-anchor="middle" font-size="12" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="152" y="196" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="174" y="221" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="204" y="196" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="226" y="221" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="256" y="196" width="44" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="278" y="221" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <path d="M 304 216 L 330 216" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="336" y="196" width="84" height="40" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="378" y="221" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cnt = 3 ★</text>

  <text x="60" y="264" font-size="11" fill="#888">★ 行与行互不影响 → 问题退化为</text>
  <text x="60" y="286" font-size="11" fill="#888">　「数组 cnt 的最大值 + 首次出现的下标」</text>

  <!-- ===== Panel B: 打擂台决策 ===== -->
  <text x="520" y="78" font-size="13" font-weight="bold" fill="#2e6e2e">② 打擂台：严格大于才换擂主</text>

  <g filter="url(#sk)">
    <polygon points="620,104 752,154 620,204 488,154" fill="#eef4fb" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="620" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">cnt &gt; best ?</text>

  <path d="M 756 154 L 786 154" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="770" y="144" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="790" y="128" width="108" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="844" y="150" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">best ← cnt</text>
  <text x="844" y="168" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">ans ← i</text>

  <path d="M 620 208 L 620 228" stroke="#aaa" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="634" y="226" font-size="10" fill="#888" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="545" y="232" width="152" height="44" rx="8" fill="#f0ede4" stroke="#bbb" stroke-width="1.4"/>
  </g>
  <text x="621" y="259" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">不更新（并列）</text>

  <text x="620" y="298" text-anchor="middle" font-size="10" fill="#888">cnt = best（并列）→ 不换擂：自动保留下标更小的行</text>

  <!-- ===== Panel C: 两个需求一个条件 + 结果 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="320" width="500" height="120" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="62" y="346" font-size="13" font-weight="bold" fill="#2b6e9e">③ 两个需求，一个条件</text>
  <text x="62" y="372" font-size="11" fill="#444">「1 最多」= max cntᵢ；「下标最小」= 最大值首次出现</text>
  <text x="62" y="394" font-size="11" fill="#444">顺序扫描 + 仅当 <tspan fill="#b03a3a" font-weight="bold">cnt &gt; best</tspan> 才更新 → 一趟满足两个条件</text>
  <text x="62" y="416" font-size="11" fill="#888">best 初值 −1：保证第一行必然上擂台</text>

  <g filter="url(#sk)">
    <rect x="560" y="320" width="340" height="120" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="582" y="346" font-size="13" font-weight="bold" fill="#2e6e2e">结果与复杂度</text>
  <text x="582" y="372" font-size="11" fill="#444">左例矩阵 → 返回 [2, 3]（行 2 有 3 个 1）</text>
  <text x="582" y="394" font-size="11" fill="#444">时间 O(m·n)：读完所有元素即下界</text>
  <text x="582" y="416" font-size="11" fill="#444">空间 O(1)：仅 ans、best、cnt 三个变量</text>

  <!-- ===== 易错警示 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="456" width="860" height="94" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="62" y="482" font-size="12" font-weight="bold" fill="#7a2828">易错警示</text>
  <text x="62" y="506" font-size="11" fill="#444">更新条件若写成 cnt &gt;= best，并列时会保留最大下标 —— 官方示例 1（两行各 1 个 1）将错返回 [1,1]。</text>
  <text x="62" y="530" font-size="11" fill="#444">返回顺序为 [行下标, 1 的个数]，先下标后计数，别写反。</text>
</svg>
