<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟计数 + 三段拼接</text>

  <!-- 步骤 1：统计 -->
  <rect x="55" y="52" width="280" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="78" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">扫描 s，统计 '1' 的个数 k</text>

  <path d="M 195 96 L 195 108" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：前缀 -->
  <rect x="55" y="110" width="280" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="136" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">构造前缀：'1' × (k−1) 个</text>

  <path d="M 195 154 L 195 166" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：中段 -->
  <rect x="55" y="168" width="280" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="194" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">构造中段：'0' × (n−k) 个</text>

  <path d="M 195 212 L 195 224" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4：末位 -->
  <rect x="55" y="226" width="280" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="252" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">末位拼接一个 '1'（守奇数）</text>

  <path d="M 195 270 L 195 282" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 5：返回 -->
  <rect x="55" y="284" width="280" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="310" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">返回结果串</text>

  <!-- 右侧注释：无需特判 -->
  <rect x="368" y="110" width="134" height="158" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="435" y="140" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k ≥ 1 由题目</text>
  <text x="435" y="162" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">约束保证</text>
  <text x="435" y="184" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k−1 ≥ 0</text>
  <text x="435" y="206" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">0 个字符 = 空串</text>
  <text x="435" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">n−k ≥ 0</text>
  <text x="435" y="250" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">全程无需特判</text>

  <!-- 注释虚线连接 -->
  <path d="M 336 131 L 368 160" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 336 189 L 368 200" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
</svg>
