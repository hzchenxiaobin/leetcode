<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">ASCII 值排序：全部大写元音都排在小写前面</text>

  <!-- ASCII 轴 -->
  <g filter="url(#rough2)">
    <line x1="50" y1="120" x2="470" y2="120" stroke="#446688" stroke-width="2"/>
    <path d="M 470 120 L 458 114 L 458 126 z" fill="#446688"/>
    <text x="478" y="124" font-size="11" fill="#446688">ASCII</text>

    <!-- 大写元音刻度 -->
    <g font-size="14">
      <text x="70" y="106" text-anchor="middle" fill="#b85450">A</text>
      <text x="130" y="106" text-anchor="middle" fill="#b85450">E</text>
      <text x="190" y="106" text-anchor="middle" fill="#b85450">I</text>
      <text x="250" y="106" text-anchor="middle" fill="#b85450">O</text>
      <text x="310" y="106" text-anchor="middle" fill="#b85450">U</text>
    </g>
    <g font-size="10" fill="#555">
      <text x="70" y="136" text-anchor="middle">65</text>
      <text x="130" y="136" text-anchor="middle">69</text>
      <text x="190" y="136" text-anchor="middle">73</text>
      <text x="250" y="136" text-anchor="middle">79</text>
      <text x="310" y="136" text-anchor="middle">85</text>
    </g>
    <!-- 小写元音刻度 -->
    <g font-size="14">
      <text x="170" y="166" text-anchor="middle" fill="#4a7a3a">a</text>
      <text x="230" y="166" text-anchor="middle" fill="#4a7a3a">e</text>
      <text x="290" y="166" text-anchor="middle" fill="#4a7a3a">i</text>
      <text x="350" y="166" text-anchor="middle" fill="#4a7a3a">o</text>
      <text x="410" y="166" text-anchor="middle" fill="#4a7a3a">u</text>
    </g>
    <g font-size="10" fill="#555">
      <text x="170" y="186" text-anchor="middle">97</text>
      <text x="230" y="186" text-anchor="middle">101</text>
      <text x="290" y="186" text-anchor="middle">105</text>
      <text x="350" y="186" text-anchor="middle">111</text>
      <text x="410" y="186" text-anchor="middle">117</text>
    </g>
    <ellipse cx="190" cy="120" rx="180" ry="66" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="190" y="76" text-anchor="middle" font-size="12.5" fill="#b85450">大写区 65~90 在左，小写区 97~122 在右</text>
  </g>

  <!-- 结论面板 -->
  <g filter="url(#rough2)">
    <rect x="36" y="216" width="448" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="244" font-size="13.5" fill="#8a6d1f">排序示例（元音混着大小写时）：</text>
    <rect x="66" y="258" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="126" y="282" text-anchor="middle" font-size="13" fill="#333">排序前：e A o U</text>
    <text x="126" y="304" text-anchor="middle" font-size="11.5" fill="#555">大小写混杂</text>
    <path d="M 196 288 C 216 288, 226 288, 240 288" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="232" y="272" font-size="11" fill="#555">sort</text>
    <rect x="252" y="258" width="140" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" fill-opacity="0.6"/>
    <text x="322" y="282" text-anchor="middle" font-size="13" fill="#333">排序后：A U e o</text>
    <text x="322" y="304" text-anchor="middle" font-size="11.5" fill="#555">先大写后小写</text>
    <text x="60" y="336" font-size="12" fill="#555">⚠ 直接对字符 sort 即可；不要按 tolower 后的字母序排（那会把 ‘a’ 排到 ‘E’ 前，错！）</text>
  </g>
</svg>
