<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">两阶段流水线：预处理 O(n)，回答全部查询 O(q)</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">判定只碰首尾字符；每个查询只做两次数组访问 + 一次减法</text>

  <!-- phase 1 -->
  <text x="40" y="66" font-size="12.5" font-weight="bold" fill="#2b6e9e">阶段 ① 预处理（i = 0 … n−1）</text>

  <g filter="url(#sk)">
    <rect x="36" y="80" width="104" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="88" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">words[i]</text>
  <text x="88" y="116" text-anchor="middle" font-size="10" fill="#555555">首 / 末字符</text>

  <path d="M 140 103 L 190 103" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="196,103 256,72 316,103 256,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="256" y="100" text-anchor="middle" font-size="11" fill="#8a6415">首 ∈ V 且</text>
  <text x="256" y="114" text-anchor="middle" font-size="11" fill="#8a6415">末 ∈ V ？</text>
  <text x="256" y="150" text-anchor="middle" font-size="9.5" fill="#999999">V = {a, e, i, o, u}</text>

  <path d="M 316 103 L 326 92" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="318" y="88" font-size="10" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="330" y="72" width="86" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="373" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">b[i] = 1</text>

  <path d="M 256 134 L 256 140 L 326 140" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="264" y="136" font-size="10" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="330" y="118" width="86" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="373" y="141" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">b[i] = 0</text>

  <path d="M 416 91 Q 447 91 474 98" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 416 137 Q 447 137 474 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="478" y="80" width="140" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="548" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">pre[i+1] =</text>
  <text x="548" y="116" text-anchor="middle" font-size="11.5" fill="#2b6e9e">pre[i] + b[i]</text>

  <path d="M 548 132 L 548 162 L 88 162 L 88 128" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="318" y="157" text-anchor="middle" font-size="10.5" fill="#555555">下一个 i（n 轮，每轮 O(1)，b 不必单独存数组）</text>

  <!-- divider -->
  <line x1="40" y1="182" x2="600" y2="182" stroke="#b8b8b8" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#sk)"/>
  <rect x="246" y="174" width="148" height="16" fill="#fdfcf7"/>
  <text x="320" y="186" text-anchor="middle" font-size="10.5" fill="#888888">pre[0..n] 就绪，查询阶段开始</text>

  <!-- phase 2 -->
  <text x="40" y="212" font-size="12.5" font-weight="bold" fill="#8a6415">阶段 ② 回答查询（j = 1 … q）</text>

  <g filter="url(#sk)">
    <rect x="60" y="226" width="118" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="119" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">queries[j]</text>
  <text x="119" y="260" text-anchor="middle" font-size="11" fill="#8a6415">= [l, r]</text>

  <path d="M 178 248 L 252 248" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="256" y="226" width="170" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="341" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">ans = pre[r+1] − pre[l]</text>
  <text x="341" y="262" text-anchor="middle" font-size="10" fill="#555555">闭区间 [l, r] ↔ 半开 [l, r+1)</text>

  <path d="M 426 248 L 482 248" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="486" y="226" width="112" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="542" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">追加进 ans</text>

  <path d="M 542 270 L 542 296 L 119 296 L 119 272" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="291" text-anchor="middle" font-size="10.5" fill="#555555">q 轮，每轮 O(1)</text>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="560" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">时间 O(n + q)：判定 O(1)/个（与单词长度无关），每查 O(1)</text>
  <text x="320" y="351" text-anchor="middle" font-size="10.5" fill="#555555">空间 O(n)：pre 长 n+1（输出 ans O(q) 不计）—— 静态数组只查不改，前缀和即最优</text>
</svg>
