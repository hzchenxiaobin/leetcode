<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：每个限制都是一个 V 形上界</text>
  <text x="470" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">例：n＝10，限制 [(5,3), (10,3)] ＋ 隐含的 (1,0) —— 三个 V 的下包络决定整条天际线</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="600" y="64" width="320" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="620" y="88" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">限制 (id, c) 生成的 V 形上界</text>
  <text x="620" y="112" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace" filter="url(#sk)">∀x : h(x) ≤ c + |x − id|</text>
  <text x="620" y="136" font-size="10" fill="#666" filter="url(#sk)">相邻差 ≤ 1 ⇒ 走 |x−id| 步至多抬高 |x−id|</text>

  <!-- grid -->
  <g stroke="#e9e3d3" stroke-width="1">
    <line x1="90" y1="516" x2="850" y2="516"/>
    <line x1="90" y1="472" x2="850" y2="472"/>
    <line x1="90" y1="428" x2="850" y2="428"/>
    <line x1="90" y1="384" x2="850" y2="384"/>
    <line x1="90" y1="340" x2="850" y2="340"/>
    <line x1="90" y1="296" x2="850" y2="296"/>
    <line x1="90" y1="252" x2="850" y2="252"/>
    <line x1="90" y1="208" x2="850" y2="208"/>
    <line x1="90" y1="164" x2="850" y2="164"/>
  </g>
  <g stroke="#efe9d9" stroke-width="1" stroke-dasharray="2 5">
    <line x1="170" y1="160" x2="170" y2="560"/>
    <line x1="250" y1="160" x2="250" y2="560"/>
    <line x1="330" y1="160" x2="330" y2="560"/>
    <line x1="410" y1="160" x2="410" y2="560"/>
    <line x1="490" y1="160" x2="490" y2="560"/>
    <line x1="570" y1="160" x2="570" y2="560"/>
    <line x1="650" y1="160" x2="650" y2="560"/>
    <line x1="730" y1="160" x2="730" y2="560"/>
    <line x1="810" y1="160" x2="810" y2="560"/>
  </g>

  <!-- axes -->
  <path d="M 90 560 H 858" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 90 560 V 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="862" y="550" font-size="10" fill="#888" filter="url(#sk)">位置 x</text>
  <text x="98" y="106" font-size="10" fill="#888" filter="url(#sk)">高度 h</text>

  <!-- height labels -->
  <g font-size="10" fill="#999" text-anchor="end">
    <text x="78" y="564">0</text>
    <text x="78" y="520">1</text>
    <text x="78" y="476">2</text>
    <text x="78" y="432">3</text>
    <text x="78" y="388">4</text>
    <text x="78" y="344">5</text>
    <text x="78" y="300">6</text>
    <text x="78" y="256">7</text>
    <text x="78" y="212">8</text>
    <text x="78" y="168">9</text>
  </g>

  <!-- position labels -->
  <g font-size="10.5" text-anchor="middle" fill="#666">
    <text x="90" y="582" font-weight="bold" fill="#2a4a6a">1</text>
    <text x="170" y="582">2</text>
    <text x="250" y="582">3</text>
    <text x="330" y="582">4</text>
    <text x="410" y="582" font-weight="bold" fill="#b03a3a">5</text>
    <text x="490" y="582">6</text>
    <text x="570" y="582">7</text>
    <text x="650" y="582">8</text>
    <text x="730" y="582">9</text>
    <text x="810" y="582" font-weight="bold" fill="#b03a3a">10</text>
  </g>

  <!-- envelope A: (1,0) right leg -->
  <polyline points="90,560 170,516 250,472 330,428 410,384 490,340 570,296 650,252 730,208 810,164"
            fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.85" filter="url(#sk)"/>
  <text x="818" y="170" font-size="10.5" fill="#446688" filter="url(#sk)">(1,0)：x−1</text>

  <!-- envelope B: (5,3) -->
  <polyline points="90,252 170,296 250,340 330,384 410,428 490,384 570,340 650,296 730,252 810,208"
            fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.85" filter="url(#sk)"/>
  <text x="96" y="244" font-size="10.5" fill="#b07818" filter="url(#sk)">(5,3)：3+|x−5|</text>

  <!-- envelope C: (10,3) -->
  <polyline points="330,164 410,208 490,252 570,296 650,340 730,384 810,428"
            fill="none" stroke="#8a5fa8" stroke-width="1.6" stroke-dasharray="7 5" opacity="0.85" filter="url(#sk)"/>
  <text x="338" y="156" font-size="10.5" fill="#8a5fa8" filter="url(#sk)">(10,3)：3+|x−10|</text>

  <!-- lower envelope H -->
  <polyline points="90,560 170,516 250,472 330,428 410,428 490,384 570,340 650,340 730,384 810,428"
            fill="none" stroke="#4a7a3a" stroke-width="3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="90" cy="560" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="170" cy="516" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="250" cy="472" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="330" cy="428" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="410" cy="428" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="490" cy="384" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="570" cy="340" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="650" cy="340" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="730" cy="384" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="810" cy="428" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="570" cy="340" r="6.5" fill="none" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="650" cy="340" r="6.5" fill="none" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="300" y="502" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">下包络 H(x)</text>

  <!-- restriction markers -->
  <g filter="url(#sk)">
    <circle cx="90" cy="560" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="410" cy="428" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="810" cy="428" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="90" y="600" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">(1,0)</text>
  <text x="410" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">(5,3)</text>
  <text x="810" y="452" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">(10,3)</text>

  <!-- tent peak star + drop line -->
  <path d="M 610 334 V 560" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 4" fill="none" filter="url(#sk)"/>
  <text x="610" y="576" text-anchor="middle" font-size="9.5" fill="#b03a3a" filter="url(#sk)">x＝7.5</text>
  <text x="610" y="326" text-anchor="middle" font-size="22" fill="#b85450" filter="url(#sk)">★</text>

  <!-- tent annotation box -->
  <g filter="url(#sk)">
    <rect x="290" y="88" width="262" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="306" y="110" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">两腿交叉点＝帐篷峰</text>
  <text x="306" y="130" font-size="12" font-weight="bold" fill="#b03a3a" font-family="monospace" filter="url(#sk)">⌊(h₁+h₂+gap)/2⌋</text>
  <text x="306" y="146" font-size="10" fill="#7a2828" filter="url(#sk)">本例 ⌊(3+3+5)/2⌋＝5，整数峰在 x＝7、8</text>
  <path d="M 554 120 Q 596 200 607 300" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="620" y="460" width="272" height="96" rx="8" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2"/>
  </g>
  <line x1="636" y1="480" x2="668" y2="480" stroke="#446688" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="676" y="484" font-size="10" fill="#446688" filter="url(#sk)">(1,0) 的 V：h ≤ x−1</text>
  <line x1="636" y1="502" x2="668" y2="502" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="676" y="506" font-size="10" fill="#b07818" filter="url(#sk)">(5,3) 的 V 形腿</text>
  <line x1="636" y1="524" x2="668" y2="524" stroke="#8a5fa8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="676" y="528" font-size="10" fill="#8a5fa8" filter="url(#sk)">(10,3) 的 V 形腿</text>
  <line x1="636" y1="546" x2="668" y2="546" stroke="#4a7a3a" stroke-width="3.5"/>
  <text x="676" y="550" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">下包络 H（最优天际线）</text>

  <!-- bottom summary box -->
  <g filter="url(#sk)">
    <rect x="60" y="612" width="860" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="636" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 ＝ max H(x)：候选只有三类位置</text>
  <text x="80" y="658" font-size="11" fill="#444" filter="url(#sk)">① 限制点本身；② 相邻限制点间的帐篷峰（峰值 ≥ 两端点，已覆盖 ①）；③ 最后限制点之后的尾段</text>
  <text x="80" y="678" font-size="11" fill="#444" filter="url(#sk)">本例：帐篷峰 ⌊(3+3+5)/2⌋＝5、⌊(0+3+4)/2⌋＝3，尾段 3＋0＝3 ⇒ 答案 5</text>
</svg>
