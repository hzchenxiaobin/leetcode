<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：一个开机点可被多个任务共享，缺口优先补在窗口右端</text>

  <!-- ===== Panel A: timeline + task bars ===== -->
  <text x="220" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 时间点共享（示例 2 的最优解）</text>

  <!-- column headers t=1..6, cells x=100+50*(t-1) -->
  <g font-size="10" fill="#888">
    <text x="125" y="62" text-anchor="middle" filter="url(#rough2)">t=1</text>
    <text x="175" y="62" text-anchor="middle" filter="url(#rough2)">t=2</text>
    <text x="225" y="62" text-anchor="middle" filter="url(#rough2)">t=3</text>
    <text x="275" y="62" text-anchor="middle" filter="url(#rough2)">t=4</text>
    <text x="325" y="62" text-anchor="middle" filter="url(#rough2)">t=5</text>
    <text x="375" y="62" text-anchor="middle" filter="url(#rough2)">t=6</text>
  </g>
  <!-- light grid separators -->
  <g stroke="#ccc" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="100" y1="66" x2="100" y2="196"/>
    <line x1="150" y1="66" x2="150" y2="196"/>
    <line x1="200" y1="66" x2="200" y2="196"/>
    <line x1="250" y1="66" x2="250" y2="196"/>
    <line x1="300" y1="66" x2="300" y2="196"/>
    <line x1="350" y1="66" x2="350" y2="196"/>
    <line x1="400" y1="66" x2="400" y2="196"/>
  </g>

  <!-- task A [1,3] d=2 : window x=100..250 -->
  <rect x="100" y="76" width="150" height="26" rx="6" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="76" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="76" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="93" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="225" y="93" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="96" y="93" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">A [1,3] 需 2</text>

  <!-- task B [2,5] d=3 : window x=150..350 -->
  <rect x="150" y="114" width="200" height="26" rx="6" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="114" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="114" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="114" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="225" y="131" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="325" y="131" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="146" y="131" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">B [2,5] 需 3</text>

  <!-- task C [5,6] d=2 : window x=300..400 -->
  <rect x="300" y="152" width="100" height="26" rx="6" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="152" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="152" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="169" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="375" y="169" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">✓</text>
  <text x="296" y="169" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">C [5,6] 需 2</text>

  <!-- shared vertical highlight at t=5 -->
  <path d="M 325 66 L 325 186" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="332" y="72" font-size="10" fill="#a8781f" filter="url(#rough2)">t=5 一个点</text>
  <text x="332" y="85" font-size="10" fill="#a8781f" filter="url(#rough2)">同时服务 B、C</text>

  <!-- note box -->
  <rect x="480" y="76" width="225" height="102" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="592" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">共享带来的节省</text>
  <text x="494" y="118" font-size="10" fill="#555" filter="url(#rough2)">需求总和 2+3+2 = 7 点次</text>
  <text x="494" y="136" font-size="10" fill="#555" filter="url(#rough2)">开机点 {2,3,5,6} 仅 4 个</text>
  <text x="494" y="154" font-size="10" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">4 个点提供了 7 次覆盖 → 复用 3 次</text>
  <text x="494" y="171" font-size="9" fill="#999" filter="url(#rough2)">电脑同时跑无数任务 = 点可共享</text>

  <!-- ===== Panel B: where to add missing points ===== -->
  <text x="360" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 缺口补在哪？后续任务满足 end_j ≥ end_i，点越靠右越易被复用</text>

  <!-- left scenario: fill at right end -->
  <rect x="30" y="254" width="320" height="168" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">补在右端 e_i ✓</text>
  <!-- bar i -->
  <rect x="70" y="288" width="200" height="22" rx="5" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="303" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">任务 i</text>
  <circle cx="245" cy="299" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="303" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">新</text>
  <text x="170" y="303" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[s_i, e_i]</text>
  <!-- reuse arrow -->
  <path d="M 245 310 L 245 352" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- bar j -->
  <rect x="130" y="356" width="190" height="22" rx="5" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="371" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">任务 j</text>
  <text x="225" y="371" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[s_j, e_j]，end_j ≥ end_i</text>
  <circle cx="245" cy="367" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="371" text-anchor="middle" font-size="9" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="190" y="402" text-anchor="middle" font-size="10" fill="#2e5b2e" filter="url(#rough2)">e_i ≤ e_j 恒成立，e_i 越靠右</text>
  <text x="190" y="416" text-anchor="middle" font-size="10" fill="#2e5b2e" filter="url(#rough2)">越可能 ≥ s_j → 可复用 ✓</text>

  <!-- right scenario: fill at left end -->
  <rect x="370" y="254" width="320" height="168" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="530" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a30" filter="url(#rough2)">补在左端 s_i ✗</text>
  <!-- bar i -->
  <rect x="410" y="288" width="200" height="22" rx="5" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="303" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">任务 i</text>
  <circle cx="430" cy="299" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="303" text-anchor="middle" font-size="9" fill="#8a3a30" font-weight="bold" filter="url(#rough2)">新</text>
  <text x="510" y="303" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[s_i, e_i]</text>
  <!-- blocked arrow -->
  <path d="M 430 310 L 430 336" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="330" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <!-- bar j -->
  <rect x="490" y="356" width="170" height="22" rx="5" fill="#f7f7f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="486" y="371" text-anchor="end" font-size="10" fill="#555" filter="url(#rough2)">任务 j</text>
  <text x="575" y="371" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">[s_j, e_j]，s_j &gt; s_i</text>
  <text x="530" y="402" text-anchor="middle" font-size="10" fill="#8a3a30" filter="url(#rough2)">新点 s_i &lt; s_j，落在后续窗口之外</text>
  <text x="530" y="416" text-anchor="middle" font-size="10" fill="#8a3a30" filter="url(#rough2)">谁也复用不了 → 白白多开一个点 ✗</text>

  <text x="360" y="452" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">同样补一个点，从右补不劣于从左 —— 严格论证见正文 §5 引理 3</text>
</svg>
