<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：tail / cur 双指针单趟扫描（就地复用零节点）</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <rect x="230" y="50" width="180" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">开始：head（首尾皆 0）</text>
  <path d="M320,82 L320,96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="195" y="98" width="250" height="48" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">tail = head（首零 = 容器①）</text>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cur = head.next，sum = 0</text>
  <path d="M320,146 L320,160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond A -->
  <polygon points="300,162 396,198 300,234 204,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="202" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">cur == null ?</text>
  <path d="M204,198 L162,198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="190" font-size="10.5" fill="#a04040" filter="url(#rough2)">是</text>
  <rect x="20" y="180" width="140" height="36" rx="16" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="203" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">返回 head</text>
  <text x="90" y="232" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">合法输入恒先触发下方切断出口</text>
  <text x="308" y="250" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M300,234 L300,248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond B -->
  <polygon points="300,250 398,288 300,326 202,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">cur.val == 0 ?</text>
  <text x="300" y="303" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（撞到段右侧零？）</text>
  <path d="M398,288 L466,288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="280" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="470" y="270" width="100" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="520" y="292" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">sum += cur.val</text>
  <path d="M570,288 L616,288 L616,198 L402,198" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="610" y="243" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">cur = cur.next</text>
  <text x="308" y="342" font-size="10.5" fill="#a04040" filter="url(#rough2)">是</text>
  <path d="M300,326 L300,340" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- settle -->
  <rect x="195" y="342" width="210" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">tail.val = sum（写进左侧零）</text>
  <path d="M300,376 L300,390" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond C -->
  <polygon points="300,392 400,428 300,464 200,428" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">cur.next == null ?</text>
  <text x="300" y="441" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">（cur 是末尾零？）</text>
  <path d="M200,428 L152,428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="420" font-size="10.5" fill="#a04040" filter="url(#rough2)">是</text>
  <rect x="20" y="398" width="130" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">tail.next = null</text>
  <text x="85" y="434" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">切断尾零，break</text>
  <text x="85" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 head ✓</text>
  <path d="M400,428 L464,428" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="420" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="468" y="400" width="128" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="532" y="418" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">tail.next = cur</text>
  <text x="532" y="434" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">tail = cur（升格容器）</text>
  <text x="532" y="450" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sum = 0</text>
  <path d="M596,428 L616,428 L616,290" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="16" y="474" width="608" height="28" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="492" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">循环不变式：tail 恒指向当前段左侧零（已串入结果链），sum 恒为 (tail, cur) 区间内已扫值之和</text>
</svg>
