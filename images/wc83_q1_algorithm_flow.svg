<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双指针扫描的算法流程</text>
  <path d="M 130.0 44 Q 280.0 54 430.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="280.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">i 标记分组起点，j 负责探到分组末尾</text>
  <g filter="url(#rough2)"><rect x="200" y="84" width="160" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="280" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">i = 0，res = [ ]</text>
  <path d="M 280 118 Q 280.0 128.0 280 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="180" y="140" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="280" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">j = i</text>
  <text x="280" y="173" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">while s[j] == s[i]: j++</text>
  <path d="M 280 180 Q 280.0 190.0 280 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><polygon points="280,202 400,238 280,274 160,238" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="280" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">j − i ≥ 3 ?</text>
  <text x="280" y="251" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度是否达标</text>
  <path d="M 400 238 Q 424.0 238.0 448 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="450" y="218" width="100" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="500" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">res.push(</text>
  <text x="500" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">[i, j−1])</text>
  <text x="430" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否（直接跳过）</text>
  <path d="M 280 274 Q 280.0 291.0 280 308" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <path d="M 500 258 Q 440.0 299.0 400 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="180" y="310" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="280" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i = j</text>
  <path d="M 280 346 Q 280.0 354.0 280 362" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><polygon points="280,364 370,390 280,416 190,390" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="280" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 190 390 Q 155.0 390.0 120 390" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="150" y="380" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是：回到 j = i</text>
  <path d="M 120 390 Q 90 300 175 155" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="470" y="395" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">否：返回 res</text>
  <path d="M 370 390 Q 405.0 390.0 440 390" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  </svg>