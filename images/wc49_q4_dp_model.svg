<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">计数型 DP：length[i] 管长度，count[i] 管条数</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">关键：只从「能让长度取到最大」的前驱累加，绝不多算一条</text>

  <g filter="url(#rough2)">
    <rect x="40" y="60" width="230" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="56" y="82" font-size="12" fill="#2f3f5c" font-weight="bold">length[i]</text>
    <text x="56" y="102" font-size="10" fill="#333">以 nums[i] 结尾的最长</text>
    <text x="56" y="117" font-size="10" fill="#333">严格递增子序列长度</text>
    <text x="56" y="132" font-size="9.5" fill="#777">初值 1（子序列只含自己）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="290" y="60" width="230" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="306" y="82" font-size="12" fill="#3a5a30" font-weight="bold">count[i]</text>
    <text x="306" y="102" font-size="10" fill="#333">达到 length[i] 的子序列条数</text>
    <text x="306" y="117" font-size="10" fill="#333">下标序列不同即算不同</text>
    <text x="306" y="132" font-size="9.5" fill="#777">初值 1（长度为 1 只有自己）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="154" width="480" height="166" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="56" y="176" font-size="10.5" fill="#8a6a20" font-weight="bold">转移：枚举 j &lt; i 且 nums[j] &lt; nums[i]，把 nums[i] 接到以 j 结尾的链后面</text>

    <rect x="54" y="186" width="452" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="66" y="207" font-size="10" fill="#2f3f5c">① 更大：length[i] = length[j] + 1，count[i] = count[j]（覆盖旧的短链）</text>

    <rect x="54" y="228" width="452" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="66" y="249" font-size="10" fill="#3a5a30">② 相等：count[i] += count[j]（同长度的不同尾巴，互不重叠）</text>

    <rect x="54" y="270" width="452" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="66" y="291" font-size="10" fill="#8a3a36">③ 更小：length[j] + 1 &lt; length[i]，接不上最长链，直接跳过</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="480" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="56" y="354" font-size="10.5" fill="#2f3f5c" font-weight="bold">答案 = 对所有 length[i] 等于全局最大长度 L 的 i，把 count[i] 求和</text>
  </g>
</svg>
