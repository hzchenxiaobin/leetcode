<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：同一函数 countType(A, B) 跑两遍，两类结果相加</text>
  <path d="M 90 42 Q 330 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="210" y="50" width="240" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="330" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">numTriplets(nums1, nums2)</text>
    <path d="M 285 88 C 250 100 215 104 182 112" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 375 88 C 410 100 445 104 478 112" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="116" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">类型 1：A = nums1，B = nums2</text>
    <rect x="360" y="116" width="240" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="480" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">类型 2：A = nums2，B = nums1</text>

    <path d="M 180 148 C 180 156 180 162 180 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 480 148 C 480 156 480 162 480 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="168" width="240" height="64" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="234" y="172" width="58" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="263" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">O(m²)</text>
    <text x="180" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">建表 cnt</text>
    <text x="180" y="212" text-anchor="middle" font-size="11" fill="#3a5a3a">枚举 (j,k)，j &lt; k：</text>
    <text x="180" y="227" text-anchor="middle" font-size="11" fill="#3a5a3a">cnt[B[j]·B[k]] += 1</text>

    <rect x="360" y="168" width="240" height="64" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="534" y="172" width="58" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="563" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">O(n²)</text>
    <text x="480" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">建表 cnt</text>
    <text x="480" y="212" text-anchor="middle" font-size="11" fill="#3a5a3a">枚举 (j,k)，j &lt; k：</text>
    <text x="480" y="227" text-anchor="middle" font-size="11" fill="#3a5a3a">cnt[B[j]·B[k]] += 1</text>

    <path d="M 306 240 C 318 232 342 232 354 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 354 256 C 342 264 318 264 306 256" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="330" y="250" text-anchor="middle" font-size="9" fill="#888">参数互换</text>

    <path d="M 180 232 C 180 240 180 246 180 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 480 232 C 480 240 480 246 480 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="252" width="240" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="244" y="256" width="44" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="266" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">O(n)</text>
    <text x="180" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">平方查询</text>
    <text x="180" y="296" text-anchor="middle" font-size="11" fill="#2b4a66">对 A 中每个 x：</text>
    <text x="180" y="311" text-anchor="middle" font-size="11" fill="#2b4a66">res += cnt[x²]</text>

    <rect x="360" y="252" width="240" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="544" y="256" width="44" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="566" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">O(m)</text>
    <text x="480" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">平方查询</text>
    <text x="480" y="296" text-anchor="middle" font-size="11" fill="#2b4a66">对 A 中每个 x：</text>
    <text x="480" y="311" text-anchor="middle" font-size="11" fill="#2b4a66">res += cnt[x²]</text>

    <path d="M 180 316 C 180 326 180 332 180 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 480 316 C 480 326 480 332 480 336" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="105" y="338" width="150" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="180" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">res₁（类型 1 小计）</text>
    <rect x="405" y="338" width="150" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="480" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">res₂（类型 2 小计）</text>

    <path d="M 180 368 C 180 392 240 402 310 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 480 368 C 480 392 420 402 350 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="170" y="414" width="320" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="330" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a">ans = res₁ + res₂，返回</text>
    <text x="330" y="455" text-anchor="middle" font-size="10.5" fill="#3a5a3a">时间 O(n²+m²) · 空间 O(max(n,m)²)，峰值仅一张表</text>
  </g>

  <text x="330" y="488" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两次调用共享同一个 countType(A, B)——对称性带来的代码复用</text>
</svg>
