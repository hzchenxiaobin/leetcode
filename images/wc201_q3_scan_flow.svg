<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：单次扫描，命中即剪断重启</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">状态：cur = 自上次剪断起元素之和；seen = 自上次剪断起见过的相对前缀（含虚拟前缀 0）</text>

  <g filter="url(#rough2)">
    <rect x="200" y="56" width="240" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="75" text-anchor="middle" font-size="12" fill="#333">初始化 cur = 0，seen = {0}，ans = 0</text>

    <path d="M 320 86 L 320 98" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="225" y="102" width="190" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="119" text-anchor="middle" font-size="12.5" fill="#333">取下一个元素 x</text>
    <text x="320" y="136" text-anchor="middle" font-size="12" fill="#333">cur ← cur + x</text>

    <path d="M 320 142 L 320 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="320,160 455,204 320,248 185,204" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="320" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b07818">cur − target ∈ seen ？</text>

    <text x="484" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">是</text>
    <path d="M 455 204 L 512 204 L 512 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="437" y="266" width="150" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="512" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28">ans ← ans + 1</text>
    <text x="512" y="303" text-anchor="middle" font-size="11.5" fill="#4a7a3a">✂ 剪断重启</text>
    <text x="512" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a">cur ← 0，seen ← {0}</text>

    <text x="146" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">否</text>
    <path d="M 185 204 L 128 204 L 128 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <rect x="53" y="266" width="150" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="128" y="284" text-anchor="middle" font-size="12" fill="#333">seen ← seen ∪ {cur}</text>
    <text x="128" y="302" text-anchor="middle" font-size="10.5" fill="#666">（记住当前前缀）</text>

    <path d="M 128 310 L 128 350 L 316 350" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 512 324 L 512 350 L 324 350" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 320 350 L 320 360" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="320,366 410,398 320,430 230,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="403" text-anchor="middle" font-size="12" fill="#b07818">还有元素吗？</text>

    <text x="243" y="389" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">是</text>
    <path d="M 230 398 L 30 398 L 30 122 L 216 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="110" y="390" text-anchor="middle" font-size="10" fill="#888">（回到扫描）</text>

    <path d="M 320 430 L 320 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="336" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
    <rect x="255" y="446" width="130" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="320" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d28">输出 ans</text>

    <rect x="442" y="362" width="186" height="122" rx="8" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="535" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">⚠️ 先查后插</text>
    <text x="535" y="399" text-anchor="middle" font-size="10.5" fill="#555">判断在插入 cur 之前</text>
    <text x="535" y="415" text-anchor="middle" font-size="10.5" fill="#555">⇒ 命中时 j &lt; i</text>
    <text x="535" y="431" text-anchor="middle" font-size="10.5" fill="#555">子数组必然非空</text>
    <text x="535" y="450" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">✂ 剪断 = 清空 seen</text>
    <text x="535" y="467" text-anchor="middle" font-size="10.5" fill="#555">禁止跨剪断点匹配</text>
  </g>
</svg>
