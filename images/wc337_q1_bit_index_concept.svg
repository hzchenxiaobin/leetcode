<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：位下标从右往左数，偶/奇位交错</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- n = 50 label -->
  <text x="92" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">n = 50</text>

  <!-- bit boxes: bit5..bit0, left to right -->
  <g font-size="20" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="180" y="96" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="208" y="127" fill="#7a5415">1</text>
    <g filter="url(#sk)"><rect x="246" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
    <text x="274" y="127" fill="#2c4a6e">1</text>
    <g filter="url(#sk)"><rect x="312" y="96" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="340" y="127" fill="#b0a488">0</text>
    <g filter="url(#sk)"><rect x="378" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="406" y="127" fill="#9db0c4">0</text>
    <g filter="url(#sk)"><rect x="444" y="96" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="472" y="127" fill="#7a5415">1</text>
    <g filter="url(#sk)"><rect x="510" y="96" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
    <text x="538" y="127" fill="#9db0c4">0</text>
  </g>

  <!-- index labels -->
  <g font-size="12" text-anchor="middle">
    <text x="208" y="166" fill="#a07818" filter="url(#sk)">下标 5</text>
    <text x="274" y="166" fill="#446688" filter="url(#sk)">下标 4</text>
    <text x="340" y="166" fill="#a07818" filter="url(#sk)">下标 3</text>
    <text x="406" y="166" fill="#446688" filter="url(#sk)">下标 2</text>
    <text x="472" y="166" fill="#a07818" filter="url(#sk)">下标 1</text>
    <text x="538" y="166" fill="#446688" filter="url(#sk)">下标 0</text>
  </g>

  <!-- weights -->
  <g font-size="11" text-anchor="middle" fill="#999" font-family="monospace">
    <text x="208" y="188" filter="url(#sk)">32</text>
    <text x="274" y="188" filter="url(#sk)">16</text>
    <text x="340" y="188" filter="url(#sk)">8</text>
    <text x="406" y="188" filter="url(#sk)">4</text>
    <text x="472" y="188" filter="url(#sk)">2</text>
    <text x="538" y="188" filter="url(#sk)">1</text>
  </g>
  <text x="152" y="166" text-anchor="end" font-size="11" fill="#777" filter="url(#sk)">下标</text>
  <text x="152" y="188" text-anchor="end" font-size="10" fill="#aaa" filter="url(#sk)">位权 2ⁱ</text>

  <!-- direction arrow -->
  <text x="375" y="208" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">下标 0 在最右，向左递增：第 i 位就是 2ⁱ 那一位</text>
  <path d="M 545 216 L 205 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result boxes -->
  <g filter="url(#sk)">
    <rect x="100" y="238" width="210" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="205" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e">even = 1：偶下标的 1 在下标 4</text>
  <text x="205" y="270" text-anchor="middle" font-size="11" fill="#446688" font-family="monospace">= popcount(n &amp; 0x555…)</text>

  <g filter="url(#sk)">
    <rect x="330" y="238" width="210" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="435" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">odd = 2：奇下标的 1 在下标 1、5</text>
  <text x="435" y="270" text-anchor="middle" font-size="11" fill="#a07818" font-family="monospace">= popcount(n &amp; 0xAAA…)</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="100" y="292" width="440" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" font-family="monospace">第 i 位 = (n &gt;&gt; i) &amp; 1 —— 右移取出，按下标奇偶分桶</text>
  <text x="320" y="331" text-anchor="middle" font-size="11" fill="#4a7a3a">进阶：偶/奇下标交错排列，0x555… / 0xAAA… 两把梳子掩码 + popcount 一步分离</text>
</svg>
