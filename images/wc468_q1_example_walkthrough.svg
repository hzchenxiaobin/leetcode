<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：偶数进累积器，奇数一律跳过</text>

  <!-- 行 1：[1,2,3,4,5,6] -->
  <text x="80" y="71" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 1</text>
  <rect x="150" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="202" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="274" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="306" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="358" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="378" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="410" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="170" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="222" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <text x="274" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="326" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <text x="378" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="430" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <rect x="478" y="52" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="73" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 | 4 | 6 = 6</text>
  <text x="548" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">累积过程 0 → 2 → 6 → 6</text>

  <!-- 行 2：[7,9,11] -->
  <text x="80" y="161" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 2</text>
  <rect x="150" y="142" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="202" y="142" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="222" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">9</text>
  <rect x="254" y="142" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="274" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="170" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="222" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="274" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <rect x="478" y="142" width="140" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="163" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">无偶数 → 0</text>
  <text x="548" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">ans 保持单位元 0，免特判</text>

  <!-- 行 3：[1,8,16] -->
  <text x="80" y="251" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 3</text>
  <rect x="150" y="232" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="202" y="232" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="254" y="232" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">16</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="222" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <text x="274" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <rect x="478" y="232" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="253" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 | 16 = 24</text>
  <text x="548" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">01000 | 10000 = 11000₂</text>

  <!-- 行 4：[1,3,5,64] -->
  <text x="80" y="341" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">补充</text>
  <rect x="150" y="322" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="170" y="344" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="202" y="322" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="222" y="344" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="254" y="322" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="274" y="344" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="306" y="322" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">64</text>
  <text x="170" y="370" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="222" y="370" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="274" y="370" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="326" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <rect x="478" y="322" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="343" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 | 64 = 64</text>
  <text x="548" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">唯一偶数：单位元起手即自身</text>

  <!-- 图例 -->
  <rect x="150" y="390" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="400" font-size="11" fill="#666" filter="url(#rough2)">参与（偶数）</text>
  <rect x="290" y="390" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="400" font-size="11" fill="#666" filter="url(#rough2)">跳过（奇数）</text>
  <text x="430" y="400" font-size="11" fill="#8a6d1f" filter="url(#rough2)">OR 结果必为偶数且 ≥ 最大参与偶数</text>
</svg>
