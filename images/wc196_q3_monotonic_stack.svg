<svg xmlns="http://www.w3.org/2000/svg" width="680" height="478" viewBox="0 0 680 478" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="478" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">优化：单调栈维护 curSum = Σ min(h[l..j])</text>
  <text x="340" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">栈存（高度, 个数），高度严格递增；以底边行 i = 2 的 h = [3,2,0] 为例</text>

  <!-- panel j=0 -->
  <rect x="20" y="58" width="200" height="340" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="120" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">j = 0：h[j] = 3</text>
  <text x="120" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#sk)">压入 (3, 1)</text>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#sk)">curSum = 3 × 1 = 3</text>
  <text x="120" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 3 → 3</text>
  <line x1="40" y1="248" x2="200" y2="248" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="45" y="176" width="38" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="64" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">3</text>
  <text x="64" y="262" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">j=0</text>
  <text x="120" y="286" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="50" y="296" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="120" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">( h=3, c=1 )</text>
  <text x="120" y="344" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（无弹出）</text>
  <text x="120" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">c = 1：仅左端点 l = 0</text>
  <text x="120" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">帧 (h,c)：c 个左端点的 min 都是 h</text>

  <path d="M 222 210 L 238 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>

  <!-- panel j=1 -->
  <rect x="240" y="58" width="200" height="340" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="340" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">j = 1：h[j] = 2</text>
  <text x="340" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">弹出 (3,1)，cnt = 1</text>
  <text x="340" y="124" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#sk)">压入 (2, 2)，curSum = 2×2 = 4</text>
  <text x="340" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 4 → 7</text>
  <line x1="260" y1="248" x2="420" y2="248" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="265" y="176" width="38" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="313" y="200" width="38" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="284" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">3</text>
  <text x="332" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">2</text>
  <g font-size="9" fill="#999" filter="url(#sk)">
    <text x="284" y="262" text-anchor="middle">j=0</text>
    <text x="332" y="262" text-anchor="middle">j=1</text>
  </g>
  <text x="340" y="286" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="270" y="296" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="340" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">( h=2, c=2 )</text>
  <text x="340" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">✗ (3,1) 已弹出：它们的 min 跌到 2</text>
  <text x="340" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">c = 1(弹出) + 1(新) = 2</text>
  <text x="340" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">左端点 0、1 的 min 都是 2</text>

  <path d="M 442 210 L 458 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>

  <!-- panel j=2 -->
  <rect x="460" y="58" width="200" height="340" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="560" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">j = 2：h[j] = 0</text>
  <text x="560" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">弹出 (2,2)，cnt = 2</text>
  <text x="560" y="124" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#sk)">压入 (0, 3)，curSum = 0</text>
  <text x="560" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans += 0 → 7</text>
  <line x1="480" y1="248" x2="640" y2="248" stroke="#8a7a66" stroke-width="2.5" filter="url(#sk)"/>
  <rect x="485" y="176" width="38" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <rect x="533" y="200" width="38" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="504" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">3</text>
  <text x="552" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#33517a" filter="url(#sk)">2</text>
  <text x="580" y="242" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <g font-size="9" fill="#999" filter="url(#sk)">
    <text x="504" y="262" text-anchor="middle">j=0</text>
    <text x="552" y="262" text-anchor="middle">j=1</text>
    <text x="580" y="262" text-anchor="middle">j=2</text>
  </g>
  <text x="560" y="286" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="490" y="296" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="560" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">( h=0, c=3 )</text>
  <text x="560" y="344" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">✗ (2,2) 已弹出：min 跌到 0</text>
  <text x="560" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">c = 2(弹出) + 1(新) = 3</text>
  <text x="560" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">三个左端点的 min 都是 0</text>

  <!-- banner -->
  <rect x="20" y="412" width="640" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">不变量：curSum = Σ 以 j 为右端点的 min = Σ 栈帧（高度 × 个数）—— 弹帧减、压帧加</text>
  <text x="340" y="456" text-anchor="middle" font-size="11.5" fill="#8a6520" filter="url(#sk)">每帧至多进出一次 → 每行均摊 O(n)，总计 O(mn)；行贡献 3 + 4 + 0 = 7 ✓</text>
</svg>
