<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建哈希表 → 逐个学生取前五平均</text>

  <rect x="210" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">开始：读入 items</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="104" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 一趟遍历建表</text>
  <text x="280" y="137" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">byId[id].append(score)，每条记录恰入一组</text>

  <path d="M 280 144 L 280 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,168 368,208 280,248 192,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">还有未处理的</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">学生吗?</text>

  <path d="M 368 208 L 412 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="198" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="416" y="188" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="481" y="205" text-anchor="middle" font-size="10.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="481" y="221" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（已按 id 升序）</text>

  <path d="M 280 248 L 280 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="180" y="270" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="11" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">② 取下一个学生（id 升序）</text>
  <text x="280" y="303" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">C++ 用 map 天然升序；Python 用 sorted(by_id)</text>

  <path d="M 280 310 L 280 328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="332" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">③ 该生成绩降序排序</text>

  <path d="M 280 368 L 280 386" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="390" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="11" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">④ 取前 5 求和 sum</text>
  <text x="280" y="423" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans.push_back([id, sum / 5])，整数除法</text>

  <path d="M 160 410 L 96 410 L 96 208 L 188 208" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="100" y="318" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">处理下一个 id（回②）</text>
</svg>
