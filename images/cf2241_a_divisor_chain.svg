<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">多步除法 = 一步除法：可达值恰为 x 的全部因子</text>
  <path d="M 168 40 Q 360 47 552 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：两步走 12 -> 6 -> 2 -->
  <text x="60" y="72" font-size="12" fill="#667" filter="url(#rough2)">两条路都到 2</text>

  <rect x="110" y="82" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">12</text>

  <path d="M 160 126 L 160 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="146" font-size="12" fill="#8a6015" filter="url(#rough2)">÷2</text>

  <rect x="110" y="160" width="100" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>

  <path d="M 160 204 L 160 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="224" font-size="12" fill="#8a6015" filter="url(#rough2)">÷3</text>

  <rect x="110" y="238" width="100" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>

  <!-- 右侧：一步到位 ÷6 -->
  <path d="M 210 104 L 330 104 L 330 254 L 216 254" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-dasharray="6 5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="342" y="150" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">一步：取 z = 12 / 2 = 6</text>
  <text x="342" y="170" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">12 ÷ 6 = 2，z 也是 12 的因子 ✔</text>
  <text x="342" y="196" font-size="11.5" fill="#667" filter="url(#rough2)">两步的总商 2 × 3 = 6，恰好就是那一步的 z</text>

  <!-- 因子集合 -->
  <text x="82" y="316" font-size="12" fill="#2b2b2b" filter="url(#rough2)">从 12 出发的全部可达值（= 12 的 6 个因子，一个不多一个不少）：</text>
  <rect x="82" y="326" width="76" height="34" rx="6" fill="#f2f4f7" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="348" text-anchor="middle" font-size="14" fill="#33475c" filter="url(#rough2)">1</text>
  <rect x="178" y="326" width="76" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="216" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="274" y="326" width="76" height="34" rx="6" fill="#f2f4f7" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="312" y="348" text-anchor="middle" font-size="14" fill="#33475c" filter="url(#rough2)">3</text>
  <rect x="370" y="326" width="76" height="34" rx="6" fill="#f2f4f7" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="348" text-anchor="middle" font-size="14" fill="#33475c" filter="url(#rough2)">4</text>
  <rect x="466" y="326" width="76" height="34" rx="6" fill="#f2f4f7" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="504" y="348" text-anchor="middle" font-size="14" fill="#33475c" filter="url(#rough2)">6</text>
  <rect x="562" y="326" width="76" height="34" rx="6" fill="#f2f4f7" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="348" text-anchor="middle" font-size="14" fill="#33475c" filter="url(#rough2)">12</text>

  <rect x="430" y="374" width="196" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="528" y="396" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5 ∉ 因子集合 ⇒ NO</text>
  <text x="120" y="398" font-size="11.5" fill="#a14340" filter="url(#rough2)">例：x = 12, y = 5</text>

  <text x="360" y="424" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">把因子拆成多步除，落点永远是 x 的某个因子；因此只需判断 y 是否整除 x</text>
</svg>
