<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">到达 f[i] 只有两条路，取较小者</text>

  <rect x="44" y="66" width="104" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a4660" filter="url(#rough2)">f[i−2]</text>
  <text x="96" y="130" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跨 2 阶</text>

  <rect x="44" y="176" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">f[i−1]</text>
  <text x="96" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跨 1 阶</text>

  <path d="M 152 88 C 196 88 200 122 248 134" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="76" font-size="11" fill="#446688" filter="url(#rough2)">+ cost[i−2]</text>

  <path d="M 152 198 C 196 198 200 152 248 146" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="222" font-size="11" fill="#446688" filter="url(#rough2)">+ cost[i−1]</text>

  <polygon points="284,126 316,140 284,154 252,140" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2f28" filter="url(#rough2)">min</text>

  <path d="M 320 140 L 366 140" fill="none" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="372" y="112" width="104" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="424" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5424" filter="url(#rough2)">f[i]</text>
  <text x="424" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">站到 i 的最小花费</text>

  <rect x="40" y="256" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">f[i] = min(f[i−1] + cost[i−1], f[i−2] + cost[i−2])</text>

  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两条路的最后一笔付费分别是 cost[i−1] 与 cost[i−2]</text>
</svg>
