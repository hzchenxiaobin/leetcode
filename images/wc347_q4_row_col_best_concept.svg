<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：路径值严格递增 → 按值升序，转移只需行列最优</text>

  <!-- left: 3x3 matrix -->
  <text x="150" y="62" text-anchor="middle" font-size="12.5" fill="#446688"
        filter="url(#rough2)">g(i,j)：以 (i,j) 结尾最多访问几个格子</text>

  <!-- row/col membership outlines -->
  <rect x="42" y="126" width="200" height="58" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="112" y="66" width="58" height="178" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- cells -->
  <rect x="42" y="66" width="58" height="52" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="112" y="66" width="58" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="66" width="58" height="52" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="42" y="128" width="58" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="112" y="128" width="58" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="182" y="128" width="58" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="42" y="190" width="58" height="52" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="112" y="190" width="58" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="182" y="190" width="58" height="52" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="71" y="97" text-anchor="middle" font-size="17" fill="#555" filter="url(#rough2)">8</text>
  <text x="141" y="97" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="211" y="97" text-anchor="middle" font-size="17" fill="#555" filter="url(#rough2)">7</text>
  <text x="71" y="159" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">3</text>
  <text x="141" y="159" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="211" y="159" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">1</text>
  <text x="71" y="221" text-anchor="middle" font-size="17" fill="#555" filter="url(#rough2)">6</text>
  <text x="141" y="221" text-anchor="middle" font-size="17" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="211" y="221" text-anchor="middle" font-size="17" fill="#555" filter="url(#rough2)">9</text>

  <text x="211" y="112" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(0,1)</text>
  <text x="71" y="174" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(1,0)</text>
  <text x="211" y="174" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(1,2)</text>
  <text x="141" y="174" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(i,j)</text>
  <text x="141" y="236" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">(2,1)</text>

  <!-- arrows from smaller row-mates -->
  <path d="M 104 152 Q 122 144 130 147" stroke="#446688" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 178 152 Q 160 144 152 147" stroke="#446688" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <!-- arrows from smaller col-mates -->
  <path d="M 148 122 Q 142 124 141 126" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 141 186 Q 141 182 141 178" stroke="#4a7a3a" stroke-width="2" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="258" y="88" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">同列：值更小的格子</text>
  <text x="258" y="104" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只需 colBest[j]</text>
  <text x="40" y="262" font-size="11.5" fill="#446688" filter="url(#rough2)">同行：值更小的格子，只需 rowBest[i]</text>

  <!-- formula box -->
  <rect x="28" y="278" width="228" height="56" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="142" y="300" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333"
        filter="url(#rough2)">g(i,j) = 1 + max( rowBest[i],</text>
  <text x="142" y="320" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333"
        filter="url(#rough2)">colBest[j] )</text>

  <!-- right panel -->
  <rect x="276" y="122" width="232" height="52" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688"
        filter="url(#rough2)">rowBest[i]：行 i 中已处理格子的 g 最大值</text>
  <text x="392" y="162" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">升序处理 ⇒ 已处理 = 值更小 = 合法前驱</text>

  <rect x="276" y="186" width="232" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">colBest[j]：列 j 中已处理格子的 g 最大值</text>
  <text x="392" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">后续更大的格子还没算，本就不该参与</text>

  <rect x="276" y="250" width="232" height="52" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">逐格扫行扫列：每格 O(m+n)</text>
  <text x="392" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">读两个汇总值：每格 O(1) ⭐</text>

  <text x="392" y="326" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">m·n ≤ 10⁵，但 m 或 n 可达 10⁵</text>
  <text x="392" y="344" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">O(mn·(m+n)) 最坏 10¹⁰，必须压缩成 O(1)</text>
</svg>
