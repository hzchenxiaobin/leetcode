<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">排序 + 扫描：maxEnd"水位线"只能右移</text>

  <!-- 数轴 -->
  <line x1="60" y1="250" x2="440" y2="250" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="60" y="270" filter="url(#rough2)">0</text>
    <text x="100" y="270" filter="url(#rough2)">1</text>
    <text x="140" y="270" filter="url(#rough2)">2</text>
    <text x="180" y="270" filter="url(#rough2)">3</text>
    <text x="220" y="270" filter="url(#rough2)">4</text>
    <text x="260" y="270" filter="url(#rough2)">5</text>
    <text x="300" y="270" filter="url(#rough2)">6</text>
    <text x="340" y="270" filter="url(#rough2)">7</text>
    <text x="380" y="270" filter="url(#rough2)">8</text>
    <text x="420" y="270" filter="url(#rough2)">9</text>
  </g>

  <!-- 排序后三条区间（处理顺序自上而下） -->
  <text x="60" y="96" font-size="13" fill="#666" filter="url(#rough2)">①</text>
  <rect x="100" y="84" width="120" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[1,4]</text>

  <text x="60" y="146" font-size="13" fill="#666" filter="url(#rough2)">②</text>
  <rect x="140" y="134" width="240" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[2,8]</text>

  <text x="60" y="196" font-size="13" fill="#666" filter="url(#rough2)">③</text>
  <rect x="180" y="184" width="120" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="176" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[3,6]</text>

  <!-- maxEnd 水位线 -->
  <line x1="220" y1="76" x2="220" y2="116" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="228" y="112" font-size="12" fill="#4a7a3a" filter="url(#rough2)">maxEnd = 4（e=4 不超过 → ① 幸存）</text>

  <line x1="380" y1="126" x2="380" y2="166" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="388" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)">水位升到 8（e=8 &gt; 4 → ② 幸存）</text>

  <line x1="380" y1="176" x2="380" y2="216" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="388" y="202" font-size="12" fill="#b85450" filter="url(#rough2)">e=6 ≤ 8 → ③ 被罩住 ✗</text>

  <!-- 罩住的叉 -->
  <g stroke="#b85450" stroke-width="2.2">
    <line x1="230" y1="182" x2="262" y2="206" filter="url(#rough2)"/>
    <line x1="262" y1="182" x2="230" y2="206" filter="url(#rough2)"/>
  </g>

  <!-- 规则框 -->
  <rect x="470" y="80" width="170" height="170" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">排序键：</text>
  <text x="555" y="128" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">start 升序</text>
  <text x="555" y="150" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">同 start 时 end 降序</text>
  <text x="555" y="178" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">判定：</text>
  <text x="555" y="198" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">e &gt; maxEnd → 幸存</text>
  <text x="555" y="218" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">否则被历史大区间罩住</text>
  <text x="555" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">本题答案：2 个幸存</text>

  <text x="60" y="306" font-size="13" fill="#666" filter="url(#rough2)">罩住 ③ 的不是前一个 ②，而是历史最大右端点——所以必须维护 maxEnd，而不是只比较相邻。</text>
</svg>
