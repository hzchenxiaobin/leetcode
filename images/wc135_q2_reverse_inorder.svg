<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">逆向中序：右子树 → 根 → 左子树</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">BST 的中序是升序，逆向中序就是降序 = 从大到小累加</text>

  <circle cx="280" cy="86" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">4</text>
  <circle cx="180" cy="152" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="157" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
  <circle cx="380" cy="152" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="157" text-anchor="middle" font-size="12" fill="#3a5a30">6</text>
  <circle cx="130" cy="214" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="219" text-anchor="middle" font-size="11" fill="#8a6a20">0</text>
  <circle cx="226" cy="214" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="219" text-anchor="middle" font-size="11" fill="#8a6a20">2</text>
  <circle cx="330" cy="214" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="219" text-anchor="middle" font-size="11" fill="#8a6a20">5</text>
  <circle cx="424" cy="214" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="424" y="219" text-anchor="middle" font-size="11" fill="#8a6a20">7</text>
  <circle cx="256" cy="266" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="271" text-anchor="middle" font-size="10.5" fill="#8a3a36">3</text>
  <circle cx="470" cy="266" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="271" text-anchor="middle" font-size="10.5" fill="#8a3a36">8</text>

  <path d="M 268 104 L 196 136" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 292 104 L 366 136" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 170 168 L 138 198" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 190 168 L 218 200" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 366 168 L 338 200" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 392 168 L 416 200" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 220 228 L 246 254" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 438 228 L 460 252" stroke="#aaa" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="24" y="96" width="86" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="67" y="118" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">访问序</text>
  <text x="67" y="142" text-anchor="middle" font-size="10.5" fill="#555">8, 7, 6, 5</text>
  <text x="67" y="162" text-anchor="middle" font-size="10.5" fill="#555">4, 3, 2, 1</text>
  <text x="67" y="182" text-anchor="middle" font-size="10.5" fill="#555">0</text>
  <text x="67" y="212" text-anchor="middle" font-size="10" fill="#888">降序，恰好是</text>
  <text x="67" y="230" text-anchor="middle" font-size="10" fill="#888">“更大或相等”</text>

  <path d="M 96 170 L 112 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="392" y="86" width="150" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="404" y="106" font-size="10.5" fill="#8a6a20" font-weight="bold">累加器 total</text>
  <text x="404" y="128" font-size="10" fill="#555">访问到 v 时，total</text>
  <text x="404" y="146" font-size="10" fill="#555">已包含所有 &gt; v 的值</text>
  <text x="404" y="168" font-size="10" fill="#555">故 total += v 后</text>
  <text x="404" y="184" font-size="10" fill="#555">写回即「≥ v 的和」</text>

  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#999">一次 DFS 完成，无需先收集中序遍历再求后缀和（那样要多一遍 O(n) 存储）</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#999">递归深度 ≤ 树高 ≤ 100，安全</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999">时间复杂度 O(n)，空间 O(h)</text>
</svg>
