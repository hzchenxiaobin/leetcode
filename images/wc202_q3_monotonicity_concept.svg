<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：间距 d 越大，能放的球越少 —— count(d) 单调不增</text>
  <path d="M 110 34 Q 320 41 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">count(d) = 以间距 ≥ d 贪心放置最多能放的球数（一趟 O(n)）—— 例 position = [1,2,3,4,7]，m = 3</text>

  <!-- d 列表头 -->
  <text x="88" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 1</text>
  <text x="168" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 2</text>
  <text x="248" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 3</text>
  <text x="328" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 4</text>
  <text x="408" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 5</text>
  <text x="488" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">d = 6</text>

  <!-- count 值格：可行绿 / 不可行红 -->
  <rect x="50" y="84" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>
  <text x="88" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">个球</text>

  <rect x="130" y="84" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="168" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">个球</text>

  <rect x="210" y="84" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="248" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">个球</text>

  <rect x="290" y="84" width="76" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="328" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">个球</text>

  <rect x="370" y="84" width="76" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="408" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">个球</text>

  <rect x="450" y="84" width="76" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="488" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">个球</text>

  <!-- 可行 / 不可行徽章 -->
  <text x="88" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ ≥ 3</text>
  <text x="168" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ ≥ 3</text>
  <text x="248" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ ≥ 3</text>
  <text x="328" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ &lt; 3</text>
  <text x="408" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ &lt; 3</text>
  <text x="488" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ &lt; 3</text>

  <!-- 分界虚线 -->
  <path d="M 288 62 L 288 174" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="296" y="172" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">分界点 d* = 3</text>

  <!-- 左右两个说明面板 -->
  <rect x="50" y="196" width="228" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">可行侧：d ≤ d*</text>
  <text x="164" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">count(d) ≥ m，放得下 m 个球</text>
  <text x="164" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">二分：ans = mid，lo = mid + 1</text>

  <rect x="362" y="196" width="228" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="476" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36" filter="url(#rough2)">不可行侧：d &gt; d*</text>
  <text x="476" y="234" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">count(d) &lt; m，放不下 m 个球</text>
  <text x="476" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">二分：hi = mid − 1（向左缩）</text>

  <!-- 面板 → 结论 -->
  <path d="M 164 266 Q 220 278 258 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 476 266 Q 420 278 382 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="110" y="288" width="420" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="310" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = max{ d : count(d) ≥ m }</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">可行集是前缀 {1, …, d*} ⇒ 二段性 ⇒ 二分答案 O(n log S)</text>
</svg>
