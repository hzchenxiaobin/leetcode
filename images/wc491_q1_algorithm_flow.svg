<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟倒序扫描，定位切割点后返回前缀</text>

  <!-- 开始 -->
  <rect x="270" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="61" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,70 L320,86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="90" width="270" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="111" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i = n − 1（从末位出发）</text>
  <path d="M320,124 L320,140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 pill -->
  <rect x="245" y="144" width="150" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="161" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">每轮判定（至多 n 轮）</text>
  <path d="M320,170 L320,182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,182 470,220 320,258 170,220" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="215" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">i ≥ 0 且</text>
  <text x="320" y="231" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">s[i] ∈ {a,e,i,o,u} ?</text>

  <!-- 是分支 -->
  <text x="155" y="210" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M170,220 L146,220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="16" y="202" width="126" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i ← i − 1</text>
  <text x="79" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（左移一步）</text>

  <!-- 回边 -->
  <path d="M79,202 L79,157 L243,157" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="151" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 否分支 -->
  <text x="332" y="276" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="440" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s[i] 非元音，或 i 已扫穿（i &lt; 0）</text>
  <path d="M320,258 L320,290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="200" y="294" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">返回 s.substr(0, i + 1)</text>
  <path d="M320,330 L320,344" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="285" y="348" width="70" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="365" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结束</text>

  <!-- 左侧注记 -->
  <rect x="16" y="294" width="150" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="312" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">早停</text>
  <text x="91" y="327" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">s[i] 非元音即停</text>
  <text x="91" y="341" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">更左边的字符与答案无关</text>
  <text x="91" y="352" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">最坏（全元音）O(n)</text>

  <!-- 右侧注记 -->
  <rect x="474" y="294" width="150" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="549" y="312" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全元音串</text>
  <text x="549" y="327" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i 一路减到 −1</text>
  <text x="549" y="341" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">substr(0, 0) = 空串</text>
  <text x="549" y="352" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">零 if 特判 ✓</text>

  <!-- 底部要点 -->
  <rect x="60" y="388" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 条件顺序：i ≥ 0 必须写在元音判定之前（短路求值）</text>
  <text x="320" y="418" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否则 i = −1 时 Python 的 s[−1] 合法但取到末位字符，C++ 直接越界 UB</text>
  <rect x="60" y="430" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="444" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一行流等价：C++ find_last_not_of("aeiou") + 1（全元音时 npos + 1 = 0，恰为空串）</text>
  <text x="320" y="458" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">Python：s.rstrip("aeiou")——参数是字符集合而非子串，语义逐字对应</text>
</svg>
