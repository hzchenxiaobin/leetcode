<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：分段压平 + 形态继承 —— L[i] = L[j] + h[i] × (i − j)</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">示例 2：maxHeights = [6, 5, 3, 9, 2, 7]。绿色实心柱 = 继承段（形态照搬峰 j 的左半），橙色柱 = 压平段（全部 = h[i]）</text>

  <!-- ================= Row A: peak i = 3 ================= -->
  <text x="40" y="88" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">峰 i = 3（h = 9）：j = 2 —— 左侧第一个 h[j] ≤ h[i]</text>
  <text x="640" y="88" text-anchor="end" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">L₃ = L₂ + 9 × (3 − 2) = 18</text>

  <!-- caps row A (dashed) -->
  <g filter="url(#sk)">
    <rect x="80"  y="152" width="56" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="162" y="162" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="244" y="182" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="326" y="122" width="56" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="408" y="192" width="56" height="20" fill="#e8f0fe" stroke="#999" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.45"/>
    <rect x="490" y="142" width="56" height="70" fill="#e8f0fe" stroke="#999" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.45"/>
  </g>

  <!-- finals row A (solid) -->
  <g filter="url(#sk)">
    <rect x="80"  y="182" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="162" y="182" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="244" y="182" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="326" y="122" width="56" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
  </g>
  <text x="354" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">峰 i = 3</text>

  <!-- segment bars row A -->
  <rect x="80" y="222" width="220" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="190" y="234" text-anchor="middle" font-size="10.5" fill="#2f5a22" filter="url(#sk)">继承段 [0..j]：形态与峰取 j=2 时完全一致（L₂ = 9）</text>
  <rect x="326" y="222" width="56" height="16" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="392" y="234" font-size="10.5" fill="#8a6520" filter="url(#sk)">← 压平段 (j,i]：全部 = h[i] = 9</text>

  <!-- h labels row A -->
  <g text-anchor="middle" filter="url(#sk)">
    <text x="108" y="258" font-size="11.5" fill="#555">h=6</text>
    <text x="190" y="258" font-size="11.5" fill="#555">h=5</text>
    <text x="272" y="258" font-size="11.5" fill="#555">h=3 ← j</text>
    <text x="354" y="258" font-size="11.5" font-weight="bold" fill="#8a6520">h=9 ← i</text>
    <text x="436" y="258" font-size="10.5" fill="#aaa">（右侧不进 L₃）</text>
  </g>

  <!-- ================= Row B: peak i = 5 ================= -->
  <text x="40" y="295" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">峰 i = 5（h = 7）：j = 4 —— 左侧第一个 h[j] ≤ h[i]</text>
  <text x="640" y="295" text-anchor="end" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">L₅ = L₄ + 7 × (5 − 4) = 17</text>

  <!-- caps row B (dashed) -->
  <g filter="url(#sk)">
    <rect x="80"  y="362" width="56" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="162" y="372" width="56" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="244" y="392" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="326" y="332" width="56" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="408" y="402" width="56" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
    <rect x="490" y="352" width="56" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" stroke-dasharray="6 4" rx="3" opacity="0.75"/>
  </g>

  <!-- finals row B (solid) -->
  <g filter="url(#sk)">
    <rect x="80"  y="402" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="162" y="402" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="244" y="402" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="326" y="402" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="408" y="402" width="56" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="490" y="352" width="56" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
  </g>

  <!-- flatten water line -->
  <path d="M 70 400 L 464 400" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="266" y="392" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">继承段整段被全局最小 2 压平</text>
  <text x="518" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">峰 i = 5</text>

  <!-- segment bars row B -->
  <rect x="80" y="432" width="384" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="272" y="444" text-anchor="middle" font-size="10.5" fill="#2f5a22" filter="url(#sk)">继承段 [0..j]：形态与峰取 j=4 时完全一致（L₄ = 10）</text>
  <rect x="490" y="432" width="56" height="16" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="470" y="444" text-anchor="end" font-size="10.5" fill="#8a6520" filter="url(#sk)">压平段 →</text>

  <!-- h labels row B -->
  <g text-anchor="middle" filter="url(#sk)">
    <text x="108" y="468" font-size="11.5" fill="#555">h=6</text>
    <text x="190" y="468" font-size="11.5" fill="#555">h=5</text>
    <text x="272" y="468" font-size="11.5" fill="#555">h=3</text>
    <text x="354" y="468" font-size="11.5" fill="#555">h=9</text>
    <text x="436" y="468" font-size="11.5" fill="#555">h=2 ← j</text>
    <text x="518" y="468" font-size="11.5" font-weight="bold" fill="#8a6520">h=7 ← i</text>
  </g>

  <!-- formula card -->
  <rect x="55" y="482" width="570" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="340" y="505" font-size="12" fill="#6a4a10">递推：L[i] = L[j] + h[i] × (i − j)；j = 左侧第一个 h[j] ≤ h[i]，由单调栈 O(1) 摊还给出</text>
    <text x="340" y="528" font-size="11.5" fill="#8a6520">j 不存在（左侧全 &gt; h[i]）时 L[i] = h[i] × (i + 1)；right 对称：R[i] = R[j] + h[i] × (j − i)</text>
  </g>
</svg>
