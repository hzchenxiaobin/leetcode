<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 3000 → 3133，n = 1000 → 1333</text>
  <path d="M 280 46 Q 470 54 660 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 候选升序条 -->
  <text x="60" y="80" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">候选表（升序，仅截取 3000 附近；完整表共 278 个）</text>
  <text x="52" y="122" font-size="14" fill="#999" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)">
    <rect x="70" y="94" width="54" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="94" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="244" y="94" width="70" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="340" y="94" width="70" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <rect x="436" y="94" width="70" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <rect x="532" y="94" width="70" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <rect x="628" y="94" width="86" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
    <rect x="740" y="94" width="86" height="36" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="97" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">333</text>
  <text x="183" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1333</text>
  <text x="279" y="118" text-anchor="middle" font-size="15" fill="#1d4d17" font-weight="bold" filter="url(#rough2)">3133</text>
  <text x="375" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3313</text>
  <text x="471" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3331</text>
  <text x="567" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4444</text>
  <text x="671" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">22333</text>
  <text x="783" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">55555</text>
  <text x="844" y="122" font-size="14" fill="#999" filter="url(#rough2)">…</text>
  <text x="97" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{3}</text>
  <text x="183" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{1,3}</text>
  <text x="279" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{1,3} ← 答案</text>
  <text x="375" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{1,3}</text>
  <text x="471" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{1,3}</text>
  <text x="567" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{4}</text>
  <text x="671" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{2,3}</text>
  <text x="783" y="146" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">{5}</text>

  <!-- n 标记 -->
  <path d="M 137 158 L 137 186 L 176 186 L 176 136" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 1000</text>
  <path d="M 233 158 L 233 226 L 272 226 L 272 136" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="233" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">n = 3000</text>

  <!-- {1,3} 排列表 -->
  <text x="60" y="282" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">{1,3} 的全部 4 个排列（4!/3! = 4）与 n = 3000 的比较：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="296" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="296" width="280" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="460" y="296" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60" y="326" width="120" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="180" y="326" width="280" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="460" y="326" width="170" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="360" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="180" y="360" width="280" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="460" y="360" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="60" y="394" width="120" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="180" y="394" width="280" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="460" y="394" width="170" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="60" y="428" width="120" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="180" y="428" width="280" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
    <rect x="460" y="428" width="170" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="120" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">排列</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">与 n = 3000 比较</text>
  <text x="545" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">结论</text>
  <text x="120" y="348" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1333</text>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1333 &lt; 3000</text>
  <text x="545" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不满足 &gt; n，淘汰</text>
  <text x="120" y="382" text-anchor="middle" font-size="14" fill="#1d4d17" font-weight="bold" filter="url(#rough2)">3133</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3133 &gt; 3000，且是升序表中最先命中</text>
  <text x="545" y="382" text-anchor="middle" font-size="12" fill="#1d4d17" font-weight="bold" filter="url(#rough2)">✓ 答案</text>
  <text x="120" y="416" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3313</text>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3313 &gt; 3000，但比 3133 大</text>
  <text x="545" y="416" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">备选，非最小</text>
  <text x="120" y="450" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3331</text>
  <text x="320" y="450" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3331 &gt; 3000，但比 3133 大</text>
  <text x="545" y="450" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">备选，非最小</text>

  <!-- 陷阱卡 -->
  <g filter="url(#rough2)">
    <rect x="660" y="296" width="220" height="166" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="676" y="322" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 若只保留每个子集的</text>
  <text x="676" y="340" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">「最小排列」？</text>
  <text x="676" y="364" font-size="11" fill="#444" filter="url(#rough2)">{1,3} 只交出 1333（≤ 3000）</text>
  <text x="676" y="382" font-size="11" fill="#444" filter="url(#rough2)">接着轮到 {4} 的 4444</text>
  <text x="676" y="404" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 错答 4444 ✗</text>
  <text x="676" y="428" font-size="11" fill="#444" filter="url(#rough2)">全排列都在表里：3133 恰好</text>
  <text x="676" y="446" font-size="11" fill="#444" filter="url(#rough2)">卡在 3000 与 4444 之间 ✓</text>

  <!-- 底部两张边界对照卡 -->
  <g filter="url(#rough2)">
    <rect x="60" y="486" width="400" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="512" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">边界对照一：n 本身是平衡数</text>
  <text x="80" y="536" font-size="12" fill="#444" filter="url(#rough2)">n = 1333 → 答案 3133（严格大于！），n = 1 → 22</text>
  <text x="80" y="556" font-size="12" fill="#444" filter="url(#rough2)">二分必须用 upper_bound / bisect_right；</text>
  <text x="80" y="576" font-size="12" fill="#b85450" filter="url(#rough2)">误用 lower_bound / bisect_left 会把 n 原样返回</text>
  <text x="80" y="596" font-size="11" fill="#888" filter="url(#rough2)">（n 已在表里时二者落点不同）</text>

  <g filter="url(#rough2)">
    <rect x="490" y="486" width="390" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="510" y="512" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">边界对照二：同一多重集内部接力</text>
  <text x="510" y="536" font-size="12" fill="#444" filter="url(#rough2)">n = 1224444 → 答案 1242444</text>
  <text x="510" y="556" font-size="12" fill="#444" filter="url(#rough2)">两者同为 {1,2,4} 的排列：前一个的「下一个</text>
  <text x="510" y="576" font-size="12" fill="#444" filter="url(#rough2)">排列」就是答案 —— 候选表一个都不能漏</text>
  <text x="510" y="596" font-size="11" fill="#888" filter="url(#rough2)">（这也是只留最小排列会翻车的原因）</text>
</svg>
