<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：逐行推进的网格 DP（滚动数组 prev / cur）</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="120" y="52" width="230" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="235" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">初始化：prev[j] ← grid[0][j]</text>
  <text x="235" y="89" text-anchor="middle" font-size="10.5" fill="#555">首行无移动，代价 = 自身格值</text>

  <path d="M 235 98 L 235 130" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="118" font-size="11" fill="#666">i ← 1</text>

  <!-- 判断菱形 -->
  <g filter="url(#sk)"><polygon points="235,136 305,172 235,208 165,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="235" y="177" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">i &lt; m ？</text>

  <path d="M 235 208 L 235 220" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="245" y="218" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- j 循环 -->
  <g filter="url(#sk)"><rect x="120" y="222" width="230" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="235" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#33455e">对每个 j = 0 … n−1</text>
  <text x="235" y="257" text-anchor="middle" font-size="10.5" fill="#555">逐格计算 cur[j]</text>

  <path d="M 235 264 L 235 276" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 扫 k 取 best -->
  <g filter="url(#sk)"><rect x="120" y="278" width="230" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="235" y="298" text-anchor="middle" font-size="11" fill="#2e5e2e" font-family="monospace">best ← min over k of</text>
  <text x="235" y="316" text-anchor="middle" font-size="10.5" fill="#2e5e2e" font-family="monospace">prev[k] + moveCost[grid[i−1][k]][j]</text>

  <path d="M 235 330 L 235 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 写入 cur + 翻面 -->
  <g filter="url(#sk)"><rect x="120" y="344" width="230" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="235" y="364" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-family="monospace">cur[j] ← grid[i][j] + best</text>
  <text x="235" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">整行完成后 swap(prev, cur)</text>

  <!-- 回环：下一行 -->
  <path d="M 120 372 L 78 372 L 78 172 L 160 172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="70" y="166" text-anchor="end" font-size="11" font-weight="bold" fill="#446688">i ← i+1</text>
  <text x="70" y="182" text-anchor="end" font-size="10" fill="#888">下一行</text>

  <!-- 否分支：末行取 min -->
  <path d="M 305 172 L 416 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="360" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否（已到末行）</text>
  <g filter="url(#sk)"><rect x="420" y="146" width="196" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="518" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">答案 ← min_j prev[j]</text>
  <text x="518" y="186" text-anchor="middle" font-size="10.5" fill="#555">末行 dp 取最小，返回</text>

  <!-- 底部提示 -->
  <g filter="url(#sk)"><rect x="90" y="430" width="460" height="38" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="320" y="453" text-anchor="middle" font-size="10.5" fill="#666">滚动数组只留两行（空间 O(n)）；整行翻面后再用 —— 切勿逐格原地更新</text>
</svg>
