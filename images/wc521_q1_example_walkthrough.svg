<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 2 逐轮演算：[7,7,4,4,4] → [4,7,4,7,4]</text>

  <!-- 表头 -->
  <text x="66" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">轮次</text>
  <text x="198" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">存活的值（升序）</text>
  <text x="330" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">剩余计数变化</text>
  <text x="462" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">追加 / ans</text>

  <!-- 轮 1 -->
  <rect x="28" y="74" width="504" height="72" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="94" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="115" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">轮 1</text>
  <rect x="152" y="94" width="42" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="115" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="202" y="94" width="42" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223" y="115" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <text x="272" y="109" font-size="12" fill="#b85450" filter="url(#rough2)">cnt[4] 3→2</text>
  <text x="272" y="131" font-size="12" fill="#b85450" filter="url(#rough2)">cnt[7] 2→1</text>
  <text x="462" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+ 4, 7</text>
  <text x="462" y="136" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = [4, 7]</text>

  <!-- 轮 2 -->
  <rect x="28" y="156" width="504" height="72" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="176" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="197" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">轮 2</text>
  <rect x="152" y="176" width="42" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="197" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="202" y="176" width="42" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223" y="197" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <text x="272" y="191" font-size="12" fill="#b85450" filter="url(#rough2)">cnt[4] 2→1</text>
  <text x="272" y="213" font-size="12" fill="#b85450" filter="url(#rough2)">cnt[7] 1→0</text>
  <text x="462" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+ 4, 7</text>
  <text x="462" y="218" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = [4,7,4,7]</text>

  <!-- 轮 3 -->
  <rect x="28" y="238" width="504" height="72" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="42" y="258" width="48" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="279" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">轮 3</text>
  <rect x="152" y="258" width="42" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="279" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <text x="216" y="279" font-size="11" fill="#999" filter="url(#rough2)">（7 已取完）</text>
  <text x="272" y="279" font-size="12" fill="#b85450" filter="url(#rough2)">cnt[4] 1→0</text>
  <text x="462" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+ 4</text>
  <text x="462" y="300" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = [4,7,4,7,4]</text>

  <!-- 结果 -->
  <path d="M280,310 L280,324" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="328" width="320" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">全部计数归零 → 返回 [4, 7, 4, 7, 4]</text>

  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每轮存活集合只会变小（{4,7} → {4,7} → {4}），升序相对位置始终不变</text>
</svg>
