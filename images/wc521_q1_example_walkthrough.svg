<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [3,1,3,2,1,3]</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">cnt：1→2 次，2→1 次，3→3 次；M = 3</text>

  <!-- 表头 -->
  <rect x="60" y="62" width="570" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">轮次 r</text>
  <text x="250" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">满足 cnt[v] ≥ r 的值</text>
  <text x="410" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">追加到 ans</text>
  <text x="550" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">操作后的 nums（模拟视角）</text>

  <!-- 行 -->
  <rect x="60" y="94" width="570" height="56" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="150" width="570" height="56" fill="#fdfdf8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="206" width="570" height="56" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M150,62 L150,262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M350,62 L350,262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M470,62 L470,262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="105" y="126" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">r = 1</text>
  <text x="250" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1, 2, 3</text>
  <text x="250" y="136" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">cnt 全部 ≥ 1</text>
  <text x="410" y="126" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1, 2, 3</text>
  <text x="550" y="126" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[3, 1, 3]</text>

  <!-- 第 2 行 -->
  <text x="105" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r = 2</text>
  <text x="250" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1, 3</text>
  <text x="250" y="192" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">cnt = 2, 3</text>
  <text x="410" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1, 3</text>
  <text x="550" y="182" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">[3]</text>

  <!-- 第 3 行 -->
  <text x="105" y="238" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">r = 3</text>
  <text x="250" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="250" y="248" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">cnt = 3</text>
  <text x="410" y="238" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="550" y="238" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">∅</text>

  <!-- 最终 ans -->
  <text x="158" y="324" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">最终 ans：</text>
  <rect x="170" y="300" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="300" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="270" y="300" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="320" y="300" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="343" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="370" y="300" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="420" y="300" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="326" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">计数判定 cnt[v] ≥ r 与逐轮模拟的“当前不同值”完全一致，共 M = 3 轮</text>
</svg>
