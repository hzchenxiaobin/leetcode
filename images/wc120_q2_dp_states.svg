<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两个互补状态：up 从 down 接力，down 从 up 接力</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">「以 i 结尾」是状态的关键定语，全局最优单独用 ans 记</text>
  <circle cx="120" cy="100" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="120" y="104.32" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">up</text>
  <circle cx="120" cy="200" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="120" y="203.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">down</text>
  <text x="120" y="58" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">以 i 结尾、最后一步上升</text>
  <text x="120" y="250" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">以 i 结尾、最后一步下降</text>
  <path d="M 150 116 Q 196 130 206 176" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="130" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">arr[i] &gt; arr[i-1]</text>
  <text x="232" y="150" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">up = down + 1</text>
  <path d="M 206 216 Q 196 220 150 184" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="232" y="208" font-size="11" fill="#446688" text-anchor="start" filter="url(#rough2)">arr[i] &lt; arr[i-1]</text>
  <text x="232" y="228" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">down = up + 1</text>
  <path d="M 120 126 L 120 172" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="100" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">相等时两个状态都重置为 1</text>
  <rect x="300" y="258" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="310" y="279" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案</text><text x="310" y="294.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">ans = max(ans, up, down)</text><text x="310" y="310.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">初值 1 覆盖单元素</text>
</svg>
