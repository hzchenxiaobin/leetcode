<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">答案公式与两个示例</text>
  <rect x="50" y="70" width="600" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">ans = ⌈n / (2k+1)⌉ × ⌈m / (2k+1)⌉</text>
  <text x="350" y="130" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">边长 2k+1 的方块：「块间距离 &gt; 2k」，所以一块至少要一个传感器</text>
  <text x="60" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">n</text>
  <text x="120" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">m</text>
  <text x="180" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">k</text>
  <text x="240" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">2k+1</text>
  <text x="320" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">x 方向块数</text>
  <text x="450" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">y 方向块数</text>
  <text x="580" y="178" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">ans</text>
  <line x1="56" y1="186" x2="636" y2="186" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="120" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">⌈5/3⌉ = 2</text>
  <text x="450" y="218" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">⌈5/3⌉ = 2</text>
  <text x="580" y="218" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="60" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="320" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">⌈2/5⌉ = 1</text>
  <text x="450" y="258" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">⌈2/5⌉ = 1</text>
  <text x="580" y="258" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="50" y="300" width="600" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="328" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k = 0 时公式退化为 n·m（每个格子都要一个传感器）</text>
</svg>
