<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 走查：nums = [2,4,3,7,10,6]，集合逐步「并」大</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="46" y="58" width="64" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="114" y="58" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="58" width="250" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="58" width="70" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="78" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">元素</text>
  <text x="174" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">质因数分解</text>
  <text x="363" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">并入后集合</text>
  <text x="527" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">新增</text>

  <!-- row 1: 2 -->
  <g filter="url(#sk)">
    <rect x="46" y="92" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="92" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="92" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="92" width="70" height="40" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="78" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="174" y="117" text-anchor="middle" font-size="11.5" fill="#444">2（质数）</text>
  <text x="363" y="117" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2}</text>
  <text x="527" y="117" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">+2</text>

  <!-- row 2: 4 -->
  <g filter="url(#sk)">
    <rect x="46" y="138" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="138" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="138" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="138" width="70" height="40" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="78" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">4</text>
  <text x="174" y="163" text-anchor="middle" font-size="11.5" fill="#444">2 × 2</text>
  <text x="363" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2}</text>
  <text x="527" y="163" text-anchor="middle" font-size="11.5" fill="#999">—</text>

  <!-- row 3: 3 -->
  <g filter="url(#sk)">
    <rect x="46" y="184" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="184" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="184" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="184" width="70" height="40" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="78" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>
  <text x="174" y="209" text-anchor="middle" font-size="11.5" fill="#444">3（质数）</text>
  <text x="363" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2, 3}</text>
  <text x="527" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">+3</text>

  <!-- row 4: 7 -->
  <g filter="url(#sk)">
    <rect x="46" y="230" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="230" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="230" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="230" width="70" height="40" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="78" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">7</text>
  <text x="174" y="255" text-anchor="middle" font-size="11.5" fill="#444">7（质数）</text>
  <text x="363" y="255" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2, 3, 7}</text>
  <text x="527" y="255" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">+7</text>

  <!-- row 5: 10 -->
  <g filter="url(#sk)">
    <rect x="46" y="276" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="276" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="276" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="276" width="70" height="40" rx="4" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="78" y="301" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">10</text>
  <text x="174" y="301" text-anchor="middle" font-size="11.5" fill="#444">2 × 5</text>
  <text x="363" y="301" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2, 3, 5, 7}</text>
  <text x="527" y="301" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">+5</text>

  <!-- row 6: 6 -->
  <g filter="url(#sk)">
    <rect x="46" y="322" width="64" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="114" y="322" width="120" height="40" rx="4" fill="#f7f9fd" stroke="#8aa2bd" stroke-width="1.2"/>
    <rect x="238" y="322" width="250" height="40" rx="4" fill="#f2fbf4" stroke="#8db892" stroke-width="1.2"/>
    <rect x="492" y="322" width="70" height="40" rx="4" fill="#f2f2ee" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="78" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">6</text>
  <text x="174" y="347" text-anchor="middle" font-size="11.5" fill="#444">2 × 3</text>
  <text x="363" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">{2, 3, 5, 7}</text>
  <text x="527" y="347" text-anchor="middle" font-size="11.5" fill="#999">—</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="46" y="374" width="516" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="304" y="395" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">最终集合 {2, 3, 5, 7}，返回 4 ✓</text>
  <text x="304" y="413" text-anchor="middle" font-size="10.5" fill="#4a7a3a">校验：乘积 2·4·3·7·10·6 = 10080 = 2⁵·3²·5·7，不同质因数恰为 4 个</text>

  <!-- right side note -->
  <g filter="url(#sk)">
    <rect x="578" y="92" width="88" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="622" y="112" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">4 和 6 这两行</text>
  <text x="622" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">质因子全在集合里</text>
  <text x="622" y="146" text-anchor="middle" font-size="9.5" fill="#555">「—」= 并入后集合</text>
  <text x="622" y="160" text-anchor="middle" font-size="9.5" fill="#555">不变，重复质因子</text>
  <text x="622" y="174" text-anchor="middle" font-size="9.5" fill="#555">被 set 天然去重，</text>
  <text x="622" y="190" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a">即「不同」的语义</text>

  <g filter="url(#sk)">
    <rect x="578" y="214" width="88" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="622" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">示例 2 对照</text>
  <text x="622" y="252" text-anchor="middle" font-size="9.5" fill="#555">[2,4,8,16] 全是</text>
  <text x="622" y="266" text-anchor="middle" font-size="9.5" fill="#555">2 的幂，分解出的</text>
  <text x="622" y="280" text-anchor="middle" font-size="9.5" fill="#555">质因子全是 2，</text>
  <text x="622" y="298" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a5415">集合恒为 {2}</text>
  <text x="622" y="322" text-anchor="middle" font-size="9.5" fill="#555">乘积 1024 = 2¹⁰</text>
  <text x="622" y="340" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">返回 1 ✓</text>
</svg>
