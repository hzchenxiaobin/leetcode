<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">vals = [1,2,3,4,10,-10,-20]，k = 2</text>

  <!-- 边 -->
  <path d="M95,120 L185,95" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M190,95 L280,120" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M90,130 L285,145" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M325,125 L415,95" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M330,155 L415,185" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M330,165 L415,245" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <!-- 普通节点 -->
  <circle cx="90" cy="120" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="90" y="133" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>

  <circle cx="90" cy="175" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="90" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <circle cx="190" cy="88" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="101" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>

  <circle cx="190" cy="160" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="173" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <!-- 中心节点 3 -->
  <circle cx="305" cy="145" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="305" y="142" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="305" y="159" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="305" y="100" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">中心</text>

  <!-- 邻居 4（选中） -->
  <circle cx="430" cy="88" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="101" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">10</text>

  <!-- 邻居 5、6（负值不选） -->
  <circle cx="430" cy="188" r="22" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <text x="430" y="201" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">-10</text>
  <circle cx="430" cy="248" r="22" fill="#f2f2f2" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="246" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">6</text>
  <text x="430" y="261" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">-20</text>

  <path d="M405,180 L382,205" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M405,240 L384,222" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 星和算式 -->
  <rect x="60" y="255" width="250" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">星和 = 4 (中心) + 10 + 2</text>
  <text x="185" y="291" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 16（取前 k=2 个正邻居）</text>

  <!-- 图例 -->
  <rect x="40" y="316" width="440" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="336" font-size="12" fill="#333" filter="url(#rough2)">实线 = 选入星图的边（2 条 ≤ k）</text>
  <text x="290" y="336" font-size="12" fill="#666" filter="url(#rough2)">虚线 = 负值邻居，一概不选</text>
</svg>
