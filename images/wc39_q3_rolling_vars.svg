<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滚动变量：一趟递推、O(1) 空间</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮只依赖前两项，无需数组、无需阶乘逆元</text>

  <rect x="60" y="64" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="85" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">进入第 i 轮时</text>
  <text x="76" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">prev2 = D(i−2)，prev1 = D(i−1)；初始 prev2 = D(0) = 1，prev1 = D(1) = 0</text>

  <path d="M 310 122 L 310 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="142" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="163" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 i 轮状态转移（i 从 2 到 n）</text>
  <text x="76" y="185" font-size="11.5" fill="#555" filter="url(#rough2)">cur = (i − 1) × (prev1 + prev2) mod (10⁹ + 7)</text>
  <text x="76" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">prev2 ← prev1　　prev1 ← cur</text>

  <path d="M 310 222 L 310 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="242" width="240" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="269" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">i = n 了吗？</text>

  <path d="M 310 286 L 310 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="298" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是，结束</text>

  <rect x="180" y="304" width="260" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="331" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 prev1 = D(n)</text>

  <path d="M 188 262 C 96 262, 34 232, 56 200" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="286" font-size="10" fill="#8a3a36" filter="url(#rough2)">否：i ← i + 1</text>

  <text x="310" y="372" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">共 n−1 轮，每轮 1 次加法、1 次乘法、1 次取模 → 时间 O(n)，空间 O(1)</text>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">C++ 里 (i−1) 要转 long long 再乘，否则 32 位溢出；Python 的 % 天然非负</text>
</svg>
