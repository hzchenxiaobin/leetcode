<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：中序收集 → 首尾双指针夹逼</text>

  <rect x="150" y="48" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">中序遍历 root1 → 升序数组 a</text>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">中序遍历 root2 → 升序数组 b</text>

  <line x1="280" y1="90" x2="280" y2="112" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="114" width="220" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">i = 0，j = len(b) − 1</text>

  <line x1="280" y1="152" x2="280" y2="174" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="176" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">s = a[i] + b[j]</text>

  <line x1="280" y1="210" x2="280" y2="230" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,232 352,266 280,300 208,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s ? target</text>

  <line x1="280" y1="300" x2="280" y2="322" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="200" y="324" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">相等 → 返回 true</text>
  <text x="292" y="318" font-size="11.5" fill="#4a7a3a" font-weight="bold">==</text>

  <line x1="352" y1="266" x2="412" y2="266" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="256" font-size="11.5" fill="#b85450" font-weight="bold">&lt;</text>
  <rect x="414" y="248" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="479" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">和太小 → i++</text>

  <line x1="208" y1="266" x2="148" y2="266" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="256" font-size="11.5" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="16" y="248" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="81" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">和太大 → j−−</text>

  <polygon points="280,366 346,392 280,414 214,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">指针越界了？</text>
  <line x1="346" y1="392" x2="440" y2="392" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="382" font-size="11" fill="#999">否 → 继续</text>
  <line x1="280" y1="324" x2="280" y2="336" stroke="#666" stroke-width="0" filter="url(#rough2)"/>

  <rect x="440" y="376" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="397" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">是 → 返回 false</text>

  <text x="30" y="70" font-size="11.5" fill="#555">中序递归最简洁；</text>
  <text x="30" y="88" font-size="11.5" fill="#555">担心链状退化可改</text>
  <text x="30" y="106" font-size="11.5" fill="#555">显式栈迭代中序</text>

  <text x="30" y="210" font-size="11.5" fill="#555">和的范围 ±2×10⁹</text>
  <text x="30" y="228" font-size="11.5" fill="#555">恰在 int32 内，</text>
  <text x="30" y="246" font-size="11.5" fill="#555">求稳可用 long long</text>

  <text x="30" y="414" font-size="11" fill="#999">bw10 Q2 · 查找两棵二叉搜索树之和</text>
</svg>
