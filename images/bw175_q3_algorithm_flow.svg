<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="540" height="330" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333">外层枚举 30 个 bit，内层跑一次 LIS</text>

  <rect x="140" y="46" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#333">for b in 0..29：tails ← 空</text>
  <path d="M270,84 L270,106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,106 400,134 270,162 140,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11" fill="#333">x 的第 b 位为 1 ?</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#b85450">否 → 跳过（不进候选序列）</text>
  <path d="M270,162 L270,184" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="184" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#333">p = lower_bound(tails, x)　（严格递增）</text>
  <text x="270" y="222" text-anchor="middle" font-size="10" fill="#333">p == len → 追加；否则 tails[p] = x</text>
  <path d="M270,230 L270,252" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="252" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="277" text-anchor="middle" font-size="12" fill="#333">ans = max(ans, len(tails))</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#888">30 · O(n log n)</text>
</svg>
