<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbb" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    DFS 记住父方向：撞到「非父已访问」同色格即有环
  </text>

  <!-- 4x4 网格 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="15">
    <!-- 行 0 -->
    <rect x="66" y="58" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="106" y="58" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="146" y="58" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="186" y="58" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <!-- 行 1 -->
    <rect x="66" y="98" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="106" y="98" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="146" y="98" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="186" y="98" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <!-- 行 2 -->
    <rect x="66" y="138" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="106" y="138" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="146" y="138" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="186" y="138" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <!-- 行 3 -->
    <rect x="66" y="178" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="106" y="178" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="146" y="178" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="186" y="178" width="40" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="86" y="83" fill="#446688">a</text>
    <text x="126" y="83" fill="#446688">a</text>
    <text x="166" y="83" fill="#446688">a</text>
    <text x="206" y="83" fill="#999">a</text>
    <text x="86" y="123" fill="#446688">a</text>
    <text x="126" y="123" fill="#446688">a</text>
    <text x="166" y="123" fill="#8a6a1a" font-weight="bold">a</text>
    <text x="206" y="123" fill="#446688">a</text>
    <text x="86" y="163" fill="#999">a</text>
    <text x="126" y="163" fill="#446688">a</text>
    <text x="166" y="163" fill="#446688">a</text>
    <text x="206" y="163" fill="#446688">a</text>
    <text x="86" y="203" fill="#999">a</text>
    <text x="126" y="203" fill="#999">a</text>
    <text x="166" y="203" fill="#999">a</text>
    <text x="206" y="203" fill="#999">a</text>
  </g>

  <!-- 当前格与父格的方向箭头 -->
  <path d="M 166 100 C 164 88, 163 84, 166 76" stroke="#bbb" stroke-width="2" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="60" y="74" font-size="11" fill="#999" filter="url(#rough2)">父格（跳过）</text>

  <path d="M 186 118 L 210 118" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="216" y="92" font-size="11" fill="#b85450" filter="url(#rough2)">已访问非父</text>
  <text x="216" y="106" font-size="11" fill="#b85450" filter="url(#rough2)">→ return true</text>

  <path d="M 166 140 L 166 168" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 144 118 L 116 118" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="158" font-size="11" fill="#446688" filter="url(#rough2)">继续 DFS</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="300" y="66" width="190" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="395" y="84" text-anchor="middle" font-size="12" fill="#446688">蓝格 = 本块已访问</text>
    <rect x="300" y="116" width="190" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="395" y="134" text-anchor="middle" font-size="12" fill="#8a6a1a">橙格 = 当前出栈格</text>
    <rect x="300" y="166" width="190" height="40" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="8"/>
    <text x="395" y="184" text-anchor="middle" font-size="12" fill="#666">灰格 = 未访问</text>
  </g>

  <rect x="56" y="248" width="420" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="266" y="272" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    「不许回到上一步」⟺ 跳过父格：比较的是格子坐标，不是字符
  </text>
  <text x="266" y="294" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">
    灰虚线（父方向）跳过；红实线撞已访问 → 同色块内有环
  </text>
  <text x="266" y="316" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">
    网格是二分图：简单环长为偶数且 ≥ 4，无需检查长度
  </text>
</svg>
