<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#fdfcf7"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：n = 6（m = 3 列）</text>
  <path d="M 300 40 Q 480 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 最优涂色网格 ===== -->
  <g font-size="10" fill="#888">
    <text x="214" y="66" text-anchor="middle" filter="url(#sk)">列0</text>
    <text x="310" y="66" text-anchor="middle" filter="url(#sk)">列1</text>
    <text x="406" y="66" text-anchor="middle" filter="url(#sk)">列2</text>
  </g>
  <!-- 上行：位置 0,1,2 -->
  <g filter="url(#sk)"><rect x="170" y="72" width="88" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="178" y="86" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置0</text>
  <text x="214" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="214" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本2</text>
  <g filter="url(#sk)"><rect x="266" y="72" width="88" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="274" y="86" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置1</text>
  <text x="310" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <text x="310" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本8</text>
  <g filter="url(#sk)"><rect x="362" y="72" width="88" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="370" y="86" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置2</text>
  <text x="406" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="406" y="116" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本1</text>
  <!-- 下行：位置 5,4,3 -->
  <g filter="url(#sk)"><rect x="170" y="132" width="88" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="178" y="146" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置5</text>
  <text x="214" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="214" y="176" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本2</text>
  <g filter="url(#sk)"><rect x="266" y="132" width="88" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="274" y="146" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置4</text>
  <text x="310" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="310" y="176" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本3</text>
  <g filter="url(#sk)"><rect x="362" y="132" width="88" height="48" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="370" y="146" text-anchor="start" font-size="8.5" fill="#999" filter="url(#sk)">位置3</text>
  <text x="406" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>
  <text x="406" y="176" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">成本2</text>

  <!-- 约束满足标记 -->
  <g font-size="11" font-weight="bold" fill="#2e6e2e">
    <text x="214" y="129" text-anchor="middle" filter="url(#sk)">≠</text>
    <text x="310" y="129" text-anchor="middle" filter="url(#sk)">≠</text>
    <text x="406" y="129" text-anchor="middle" filter="url(#sk)">≠</text>
    <text x="262" y="101" text-anchor="middle" font-size="9" filter="url(#sk)">≠</text>
    <text x="358" y="101" text-anchor="middle" font-size="9" filter="url(#sk)">≠</text>
    <text x="262" y="161" text-anchor="middle" font-size="9" filter="url(#sk)">≠</text>
    <text x="358" y="161" text-anchor="middle" font-size="9" filter="url(#sk)">≠</text>
  </g>

  <!-- 右侧说明 -->
  <text x="500" y="92" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">最优涂色（由 DP 回溯得到）</text>
  <text x="500" y="114" text-anchor="start" font-size="11" fill="#444" filter="url(#sk)">位置 0..5 的颜色 = [1, 3, 2, 3, 1, 2]</text>
  <text x="500" y="136" text-anchor="start" font-size="11" fill="#444" filter="url(#sk)">总成本 = 2 + 8 + 1 + 2 + 3 + 2 = 18 ✓</text>
  <text x="500" y="158" text-anchor="start" font-size="10" fill="#666" filter="url(#sk)">蓝=颜色1，绿=颜色2，黄=颜色3（格内小字为该格成本）</text>

  <!-- ===== dp 表 ===== -->
  <text x="160" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">dp₀（第 0 列）</text>
  <text x="480" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">dp₁（第 1 列）</text>
  <text x="800" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">dp₂（第 2 列）</text>

  <!-- 列 0 -->
  <g filter="url(#sk)"><rect x="85" y="236" width="150" height="26" rx="4" fill="#eaf6ee" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="99" y="254" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,2)</text>
  <text x="225" y="254" text-anchor="end" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">4 ★</text>
  <g filter="url(#sk)"><rect x="85" y="266" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="99" y="284" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,3)</text>
  <text x="225" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="85" y="296" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="99" y="314" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,1)</text>
  <text x="225" y="314" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">12</text>
  <g filter="url(#sk)"><rect x="85" y="326" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="99" y="344" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,3)</text>
  <text x="225" y="344" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="85" y="356" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="99" y="374" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,1)</text>
  <text x="225" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">14</text>
  <g filter="url(#sk)"><rect x="85" y="386" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="99" y="404" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,2)</text>
  <text x="225" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">8</text>

  <!-- 列 1 -->
  <g filter="url(#sk)"><rect x="405" y="236" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="419" y="254" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,2)</text>
  <text x="545" y="254" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">18</text>
  <g filter="url(#sk)"><rect x="405" y="266" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="419" y="284" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,3)</text>
  <text x="545" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">20</text>
  <g filter="url(#sk)"><rect x="405" y="296" width="150" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="419" y="314" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,1)</text>
  <text x="545" y="314" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">10</text>
  <g filter="url(#sk)"><rect x="405" y="326" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="419" y="344" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,3)</text>
  <text x="545" y="344" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">14</text>
  <g filter="url(#sk)"><rect x="405" y="356" width="150" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="419" y="374" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,1)</text>
  <text x="545" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">15 ★</text>
  <g filter="url(#sk)"><rect x="405" y="386" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="419" y="404" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,2)</text>
  <text x="545" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">19</text>

  <!-- 列 2 -->
  <g filter="url(#sk)"><rect x="725" y="236" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="739" y="254" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,2)</text>
  <text x="865" y="254" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">23</text>
  <g filter="url(#sk)"><rect x="725" y="266" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="739" y="284" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(1,3)</text>
  <text x="865" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">19</text>
  <g filter="url(#sk)"><rect x="725" y="296" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="739" y="314" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,1)</text>
  <text x="865" y="314" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">23</text>
  <g filter="url(#sk)"><rect x="725" y="326" width="150" height="26" rx="4" fill="#eaf6ee" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="739" y="344" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(2,3)</text>
  <text x="865" y="344" text-anchor="end" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">18 ★</text>
  <g filter="url(#sk)"><rect x="725" y="356" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="739" y="374" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,1)</text>
  <text x="865" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">27</text>
  <g filter="url(#sk)"><rect x="725" y="386" width="150" height="26" rx="4" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2"/></g>
  <text x="739" y="404" text-anchor="start" font-size="11" font-family="monospace" fill="#444" filter="url(#sk)">(3,2)</text>
  <text x="865" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">25</text>

  <!-- 最优路径箭头 -->
  <path d="M 237 252 Q 320 300 403 366" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="312" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a" filter="url(#sk)">+w₁(3,1)=11</text>
  <path d="M 557 366 Q 640 352 723 336" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="640" y="346" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a" filter="url(#sk)">+w₂(2,3)=3</text>

  <text x="480" y="426" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">dp 值 = 前 k+1 列以状态 (a,b) 结尾的最小总成本；绿色填充 = 该列最小值；红框★ = 最优路径经过的状态</text>

  <!-- 贪心陷阱 -->
  <g filter="url(#sk)"><rect x="60" y="440" width="870" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="80" y="462" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">贪心陷阱：别在每列单独取最小！</text>
  <text x="80" y="482" font-size="11" fill="#444" filter="url(#sk)">dp₁ 的列最小值是 (2,1)=10，但最优路径经过的是 (3,1)=15——(2,1) 根本不是 (2,3) 的兼容前驱（上行同为颜色 2）</text>
  <text x="80" y="500" font-size="11" fill="#444" filter="url(#sk)">列局部最优 ≠ 全局最优路径，必须让 6 个状态并行滚动到最后一列</text>

  <!-- 回溯 -->
  <g filter="url(#sk)"><rect x="60" y="522" width="870" height="80" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="80" y="546" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">回溯：dp₂(2,3)=18 ← dp₁(3,1)=15 ← dp₀(1,2)=4（列成本 3 + 11 + 4 = 18 ✓）</text>
  <text x="80" y="568" font-size="11" fill="#444" filter="url(#sk)">对应位置 0..5 涂色 [1, 3, 2, 3, 1, 2]，与官方解释完全一致</text>
  <text x="80" y="588" font-size="11" fill="#2e6e2e" filter="url(#sk)">校验：等距对 (0,5)、(1,4)、(2,3) 两两不同色 ✓；相邻对 (0,1)(1,2)(2,3)(3,4)(4,5) 全部不同色 ✓</text>
</svg>
