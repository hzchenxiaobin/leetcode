<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：元素 i 能赢下多少个子数组？</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: array with prime scores ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 示例：nums = [19,12,14,6,10,18]，ps = [1,2,2,2,2,2]，聚焦 i = 2（值 14）</text>

  <!-- index labels -->
  <g font-size="11" fill="#999">
    <text x="270" y="98" text-anchor="middle">0</text>
    <text x="350" y="98" text-anchor="middle">1</text>
    <text x="430" y="98" text-anchor="middle" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="510" y="98" text-anchor="middle">3</text>
    <text x="590" y="98" text-anchor="middle">4</text>
    <text x="670" y="98" text-anchor="middle">5</text>
  </g>

  <!-- cells -->
  <g filter="url(#sk)"><rect x="235" y="104" width="70" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="270" y="131" text-anchor="middle" font-size="15" fill="#333">19</text>
  <g filter="url(#sk)"><rect x="315" y="104" width="70" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="350" y="131" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">12</text>
  <g filter="url(#sk)"><rect x="395" y="104" width="70" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/></g>
  <text x="430" y="131" text-anchor="middle" font-size="15" fill="#2e6e2e" font-weight="bold">14</text>
  <g filter="url(#sk)"><rect x="475" y="104" width="70" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="510" y="131" text-anchor="middle" font-size="15" fill="#333">6</text>
  <g filter="url(#sk)"><rect x="555" y="104" width="70" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="590" y="131" text-anchor="middle" font-size="15" fill="#333">10</text>
  <g filter="url(#sk)"><rect x="635" y="104" width="70" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="670" y="131" text-anchor="middle" font-size="15" fill="#333">18</text>

  <!-- ps labels -->
  <g font-size="10" fill="#888">
    <text x="270" y="162" text-anchor="middle">ps=1</text>
    <text x="350" y="162" text-anchor="middle">ps=2</text>
    <text x="430" y="162" text-anchor="middle" font-weight="bold" fill="#2e6e2e">ps=2</text>
    <text x="510" y="162" text-anchor="middle">ps=2</text>
    <text x="590" y="162" text-anchor="middle">ps=2</text>
    <text x="670" y="162" text-anchor="middle">ps=2</text>
  </g>

  <!-- boundary lines L=1 (between cell 1 and 2), R=6 (right of cell 5) -->
  <line x1="390" y1="92" x2="390" y2="344" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="390" y="358" text-anchor="middle" font-size="11" fill="#a5741a" font-weight="bold">L[2]=1（相等也拦）</text>
  <line x1="710" y1="92" x2="710" y2="344" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="710" y="358" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">R[2]=6（严格更大才拦）</text>

  <!-- ===== Panel 2: winning subarrays ===== -->
  <text x="235" y="196" font-size="13" font-weight="bold" fill="#2e6e2e">② i = 2 赢下的 4 个子数组：l 只能取 2，r 可取 2..5</text>

  <g font-size="11" fill="#2e6e2e">
    <g filter="url(#sk)"><rect x="395" y="210" width="70" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="430" y="223" text-anchor="middle">[2,2] ✓</text>
    <g filter="url(#sk)"><rect x="395" y="236" width="150" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="470" y="249" text-anchor="middle">[2,3] ✓</text>
    <g filter="url(#sk)"><rect x="395" y="262" width="230" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="510" y="275" text-anchor="middle">[2,4] ✓</text>
    <g filter="url(#sk)"><rect x="395" y="288" width="310" height="17" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="550" y="301" text-anchor="middle">[2,5] ✓</text>
  </g>

  <g filter="url(#sk)"><rect x="315" y="314" width="150" height="17" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="390" y="327" text-anchor="middle" font-size="11" fill="#b85450">[1,2] ✗</text>
  <text x="600" y="327" font-size="11" fill="#b85450">含 12 与 14，ps 并列 → 判下标小的 12 赢</text>

  <!-- ===== Panel 3: formula ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="820" height="118" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="470" y="408" text-anchor="middle" font-size="12" fill="#444">L[2] = 1：左侧最近的 ps ≥ ps[2]（12 与 14 并列，跨过就会被抢走）</text>
  <text x="470" y="430" text-anchor="middle" font-size="12" fill="#444">R[2] = 6：右侧不存在 ps &gt; ps[2]（右侧并列不影响，i 赢）</text>
  <text x="470" y="464" text-anchor="middle" font-size="16" fill="#b03a3a" font-weight="bold" font-family="monospace">cnt[i] = (i − L[i]) × (R[i] − i) = (2−1) × (6−2) = 4</text>
  <text x="470" y="488" text-anchor="middle" font-size="11" fill="#666">值 14 在「所有子数组胜者的值」多重集合中出现 4 次</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="60" y="522" width="820" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="80" y="548" font-size="12" font-weight="bold" fill="#2b2b2b">免费自检：Σ cnt[i] = n(n+1)/2 = 21</text>
  <text x="80" y="570" font-size="11" fill="#444">每个子数组恰好一个胜者 → 若两侧比较符号写错，并列子数组会被 0 个或 2 个元素同时认领，</text>
  <text x="80" y="590" font-size="11" fill="#444">恒等式立即破坏——调试时先验证它。</text>
</svg>
