<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">每人恰一个出边：路线 = 尾巴 + 环（ρ 形）</text>

  <!-- 左：一般化的 ρ 结构 -->
  <text x="145" y="56" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">一般结构</text>

  <!-- 尾巴 -->
  <circle cx="48" cy="118" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="88" cy="142" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 61,124 Q 72,132 76,136" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 101,149 Q 112,157 119,163" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 环：c → d → e → c -->
  <circle cx="132" cy="176" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="212" cy="128" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="224" cy="222" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 146,169 Q 178,146 197,134" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 223,143 Q 233,176 228,207" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 209,226 Q 172,239 145,190" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="70" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">尾巴</text>
  <text x="186" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">环</text>

  <text x="145" y="268" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">走 k 步：先耗完尾巴，</text>
  <text x="145" y="286" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">再在环上不停绕圈</text>

  <!-- 右：示例 2 -->
  <text x="405" y="56" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">示例 2：receiver = [1,1,1,2,3]</text>

  <!-- 节点 1：自环 + 汇聚点 -->
  <circle cx="382" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="382" y="155" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <path d="M 370,141 C 356,112 408,112 394,141" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="426" y="116" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">自环</text>

  <!-- 0 → 1 -->
  <circle cx="298" cy="102" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="107" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M 310,110 Q 340,124 366,140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2 → 1 -->
  <circle cx="316" cy="216" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="221" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 329,210 Q 352,190 370,165" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3 → 2 -->
  <circle cx="400" cy="252" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="257" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">3</text>
  <path d="M 387,247 Q 358,240 331,224" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 4 → 3 -->
  <circle cx="470" cy="278" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="283" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4</text>
  <path d="M 456,274 Q 436,268 415,259" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="470" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">最优起点 x=4（不在环上！）</text>

  <!-- 底部说明框 -->
  <rect x="30" y="318" width="460" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">路线唯一：f(x) = ρ 路径上前 k+1 个落脚点编号之和（重复计次）</text>
  <text x="260" y="347" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k ≤ 10¹⁰ —— 逐步模拟 O(nk) 必超时，得「跳着走」</text>
</svg>
