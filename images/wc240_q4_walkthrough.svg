<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：colors = "abaca"，edges = [[0,1],[0,2],[2,3],[3,4]]</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案 3 —— 路径 0→2→3→4 上 "a" 出现 3 次（红 = 最优路径）</text>

  <!-- ===== 顶部图 ===== -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="112" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="110" y="118" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <text x="110" y="150" text-anchor="middle" font-size="10.5" fill="#888">0</text>

    <circle cx="270" cy="80" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="270" y="86" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <text x="270" y="118" text-anchor="middle" font-size="10.5" fill="#888">1</text>

    <circle cx="270" cy="145" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="270" y="151" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <text x="270" y="183" text-anchor="middle" font-size="10.5" fill="#888">2</text>

    <circle cx="420" cy="145" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="420" y="151" text-anchor="middle" font-size="14" fill="#d6a040">c</text>
    <text x="420" y="183" text-anchor="middle" font-size="10.5" fill="#888">3</text>

    <circle cx="570" cy="145" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="570" y="151" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <text x="570" y="183" text-anchor="middle" font-size="10.5" fill="#888">4</text>

    <path d="M127,100 Q190,72 246,77" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M126,124 Q190,140 246,144" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)"/>
    <path d="M292,145 L396,145" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)"/>
    <path d="M442,145 L546,145" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)"/>
  </g>

  <!-- 初始状态卡 -->
  <g filter="url(#rough2)">
    <rect x="640" y="66" width="230" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="755" y="88" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始状态</text>
    <text x="755" y="110" text-anchor="middle" font-size="11.5" fill="#333">indeg = [0, 1, 1, 1, 1]</text>
    <text x="755" y="128" text-anchor="middle" font-size="11.5" fill="#333">队列 = [0]（唯一源点）</text>
    <text x="755" y="146" text-anchor="middle" font-size="11.5" fill="#333">dp 全为 0（26 维）</text>
  </g>

  <!-- 高亮行 ⑤ -->
  <rect x="60" y="386" width="780" height="46" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 表格 -->
  <g filter="url(#rough2)" stroke="#8a9aaa" stroke-width="1.2">
    <rect x="60" y="168" width="780" height="264" fill="none"/>
    <line x1="60" y1="202" x2="840" y2="202"/>
    <line x1="60" y1="248" x2="840" y2="248"/>
    <line x1="60" y1="294" x2="840" y2="294"/>
    <line x1="60" y1="340" x2="840" y2="340"/>
    <line x1="60" y1="386" x2="840" y2="386"/>
    <line x1="112" y1="168" x2="112" y2="432"/>
    <line x1="200" y1="168" x2="200" y2="432"/>
    <line x1="460" y1="168" x2="460" y2="432"/>
    <line x1="680" y1="168" x2="680" y2="432"/>
    <line x1="726" y1="168" x2="726" y2="432"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="168" width="780" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b4e6e" filter="url(#rough2)">
    <text x="86" y="190" text-anchor="middle">步骤</text>
    <text x="156" y="190" text-anchor="middle">出队 u</text>
    <text x="212" y="190">dp[u]（加自身色后）</text>
    <text x="472" y="190">传播给后继</text>
    <text x="703" y="190" text-anchor="middle">ans</text>
    <text x="783" y="190" text-anchor="middle">队列</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#333">
    <text x="86" y="229" text-anchor="middle">①</text>
    <text x="156" y="229" text-anchor="middle">u=0 (a)</text>
    <text x="212" y="229">{a:1}</text>
    <text x="472" y="229">1、2 ← {a:1}</text>
    <text x="703" y="229" text-anchor="middle">1</text>
    <text x="783" y="229" text-anchor="middle">[1, 2]</text>

    <text x="86" y="275" text-anchor="middle">②</text>
    <text x="156" y="275" text-anchor="middle">u=1 (b)</text>
    <text x="212" y="275">{a:1, b:1}</text>
    <text x="472" y="275">无出边</text>
    <text x="703" y="275" text-anchor="middle">1</text>
    <text x="783" y="275" text-anchor="middle">[2]</text>

    <text x="86" y="321" text-anchor="middle">③</text>
    <text x="156" y="321" text-anchor="middle">u=2 (a)</text>
    <text x="212" y="321">{a:2}（继承 {a:1} ＋ 自身 a）</text>
    <text x="472" y="321">3 ← {a:2}</text>
    <text x="703" y="321" text-anchor="middle">2</text>
    <text x="783" y="321" text-anchor="middle">[3]</text>

    <text x="86" y="367" text-anchor="middle">④</text>
    <text x="156" y="367" text-anchor="middle">u=3 (c)</text>
    <text x="212" y="367">{a:2, c:1}</text>
    <text x="472" y="367">4 ← {a:2, c:1}</text>
    <text x="703" y="367" text-anchor="middle">2</text>
    <text x="783" y="367" text-anchor="middle">[4]</text>

    <text x="86" y="413" text-anchor="middle" font-weight="bold">⑤</text>
    <text x="156" y="413" text-anchor="middle" font-weight="bold">u=4 (a)</text>
    <text x="212" y="413" font-weight="bold" fill="#b03a3a">{a:3, c:1} ★</text>
    <text x="472" y="413" font-weight="bold">无出边</text>
    <text x="703" y="413" text-anchor="middle" font-weight="bold" fill="#b03a3a">3</text>
    <text x="783" y="413" text-anchor="middle" font-weight="bold">[]</text>
  </g>

  <!-- 结论横幅 -->
  <g filter="url(#rough2)">
    <rect x="60" y="444" width="780" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="450" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">processed = 5 = n ⇒ 无环 ⇒ 返回 3 ✓（路径 0→2→3→4：节点 0、2、4 共 3 个 "a"）</text>

  <!-- 注记卡 -->
  <g filter="url(#rough2)">
    <rect x="60" y="502" width="780" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="526" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">⚠️ 两处「同色累加」＋ 一路「顺带传播」</text>
  <text x="80" y="548" font-size="11.5" fill="#444" filter="url(#rough2)">步 ③：节点 2 继承源点 0 传来的 {a:1}，加自身 a 得 {a:2}；步 ⑤：节点 4 再进一步得 {a:3}，</text>
  <text x="80" y="568" font-size="11.5" fill="#444" filter="url(#rough2)">a 的计数沿红色路径 1 → 2 → 3 累加 —— 这正是「以 v 结尾路径」DP 的传递方式。</text>
  <text x="80" y="592" font-size="11.5" fill="#444" filter="url(#rough2)">b、c 的计数全程随向量同行（步 ②④ 出现、从未当过答案）；一旦后继同色成串，它们随时可能</text>
  <text x="80" y="610" font-size="11.5" fill="#444" filter="url(#rough2)">「上位」—— 这正是必须携带全部 26 维、不能只记当前最大色的原因。</text>
</svg>
