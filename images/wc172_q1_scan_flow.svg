<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="364" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：扫描一次，命中即返回</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只判断「有没有 6」以及「最左边的 6 在哪」，不需要尝试所有翻转</text>

  <rect x="150" y="62" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="82" font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s = str(num)，从左往右找第一个 '6'</text>
  <text x="280" y="98" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">等价于 s.find('6')，得到下标 i（找不到为 −1）</text>

  <path d="M 280 106 L 280 126" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,132 366,170 280,208 194,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="166" font-size="11" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i = −1 ？</text>
  <text x="280" y="182" font-size="9" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">（整个数没有 6）</text>

  <path d="M 194 170 L 178 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 366 170 L 384 170" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="190" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">是</text>
  <text x="374" y="190" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">否</text>

  <rect x="34" y="136" width="142" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="105" y="156" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">全是 9，一次都不改</text>
  <text x="105" y="174" font-size="10" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">返回原来的 num</text>
  <text x="105" y="192" font-size="9" fill="#666" text-anchor="middle" filter="url(#rough2)">例：9999 → 9999</text>

  <rect x="390" y="136" width="150" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="465" y="156" font-size="10" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">k = n − 1 − i</text>
  <text x="465" y="174" font-size="9.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">返回 num + 3 × 10^k</text>
  <text x="465" y="192" font-size="9" fill="#666" text-anchor="middle" filter="url(#rough2)">例：9669 → 9969</text>

  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">唯一要动的就是被找到的这一位：6 → 9，其余位原样保留</text>
  <text x="280" y="260" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(n)：n ≤ 4，找到即返回；空间 O(1)</text>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">若不用字符串：逐位取模得数字，再从高位到低位找第一个 6，同样 O(n)</text>

  <rect x="70" y="300" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="86" y="318" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">易错点：n 必须用「原数字的位数」，不是 4</text>
  <text x="86" y="334" font-size="9.5" fill="#666" filter="url(#rough2)">例如 6 → n = 1、k = 0、答案 9；写成 1000 就会得到 3006</text>
</svg>
