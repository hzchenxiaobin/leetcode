<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arrB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：排序 + 对撞双指针，n/2 对一趟扫完</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- main vertical flow -->
  <g filter="url(#sk)">
    <rect x="100" y="64" width="220" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="210" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a70">① sort(nums)</text>
  <text x="210" y="107" text-anchor="middle" font-size="11.5" fill="#555">升序排序</text>
  <path d="M 210 118 L 210 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="140" width="220" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="210" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a70">② i = 0 ，j = n−1</text>
  <text x="210" y="183" text-anchor="middle" font-size="11.5" fill="#555">best = +∞（存整数和）</text>
  <path d="M 210 194 L 210 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="210,216 340,260 210,304 80,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="210" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">③ i &lt; j ?</text>

  <!-- yes: down to loop body -->
  <text x="228" y="296" font-size="13" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 210 304 L 210 324" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="326" width="220" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="210" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a2e">④ best = min(best,</text>
  <text x="210" y="369" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a2e">nums[i] + nums[j])</text>
  <path d="M 210 380 L 210 400" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="402" width="220" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="210" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">⑤ i++ ，j−−</text>
  <text x="210" y="445" text-anchor="middle" font-size="11.5" fill="#555">两端向中间靠拢</text>

  <!-- loop back to diamond left vertex -->
  <g filter="url(#sk)">
    <path d="M 100 429 L 52 429 Q 40 429 40 417 L 40 272 Q 40 260 52 260 L 74 260" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arrG)"/>
  </g>
  <text transform="rotate(-90 28 350)" x="28" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk2)">回到判断</text>

  <!-- no: right to return -->
  <text x="356" y="246" font-size="13" font-weight="bold" fill="#b85450">否</text>
  <path d="M 340 260 L 396 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR2)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="400" y="231" width="240" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="520" y="255" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8c3a36">return best / 2.0</text>
  <text x="520" y="276" text-anchor="middle" font-size="11.5" fill="#774444">已配满 n/2 对（i ≥ j）</text>

  <g filter="url(#sk)">
    <rect x="400" y="313" width="240" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="520" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">为什么不先除以 2 ？</text>
  <text x="520" y="357" text-anchor="middle" font-size="11.5" fill="#444">x/2 随 x 单调递增</text>
  <text x="520" y="373" text-anchor="middle" font-size="11.5" fill="#444">min(平均值) ⇔ min(整数和)</text>

  <!-- footer: two-pointer mini visual -->
  <g filter="url(#sk2)">
    <rect x="282" y="490" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="330" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="378" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="426" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="474" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="522" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="570" y="490" width="40" height="40" rx="5" fill="#f3f7fd" stroke="#8899aa" stroke-width="1.3"/>
    <rect x="618" y="490" width="40" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#sk2)" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="302" y="514" fill="#2b4a70">a₀</text>
    <text x="350" y="514" fill="#8899aa">a₁</text>
    <text x="398" y="514" fill="#8899aa">a₂</text>
    <text x="446" y="514" fill="#8899aa">…</text>
    <text x="494" y="514" fill="#8899aa">…</text>
    <text x="542" y="514" fill="#8899aa">…</text>
    <text x="590" y="514" fill="#8899aa">aₙ₋₂</text>
    <text x="638" y="514" fill="#8c3a36">aₙ₋₁</text>
  </g>
  <g filter="url(#sk2)">
    <text x="262" y="515" text-anchor="end" font-size="14" font-weight="bold" fill="#446688">i</text>
    <path d="M 266 510 L 278 510" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB2)"/>
    <text x="678" y="515" font-size="14" font-weight="bold" fill="#b85450">j</text>
    <path d="M 674 510 L 662 510" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR2)"/>
  </g>
  <text x="470" y="552" text-anchor="middle" font-size="12" fill="#555">i、j 每轮向中间靠拢一步；n 为偶数时恰好配满 n/2 对后交叉（i ≥ j 退出），全程无浮点比较</text>
</svg>
