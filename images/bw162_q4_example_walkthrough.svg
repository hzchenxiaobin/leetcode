<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,1,2,2,1,1]，三个查询</text>
  <text x="50" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">查询</text>
  <text x="146" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">子数组</text>
  <text x="316" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">threshold</text>
  <text x="412" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">频次表</text>
  <text x="562" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">答案</text>
  <line x1="46" y1="84" x2="628" y2="84" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="118" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[0,5,4]</text>
  <text x="146" y="118" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,1,2,2,1,1]</text>
  <text x="316" y="118" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="412" y="118" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1→4, 2→2</text>
  <text x="562" y="118" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="50" y="160" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[0,3,3]</text>
  <text x="146" y="160" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[1,1,2,2]</text>
  <text x="316" y="160" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="160" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1→2, 2→2</text>
  <text x="562" y="160" text-anchor="start" font-size="12.5" fill="#b85450" filter="url(#rough2)">-1</text>
  <text x="50" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[2,3,2]</text>
  <text x="146" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="316" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2→2</text>
  <text x="562" y="202" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="46" y="250" width="606" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="276" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">第一个查询：值 1 出现 4 次达阈值，值 2 只有 2 次</text>
  <text x="350" y="300" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第二个查询：两个值都只有 2 次 &lt; 3，无答案返回 −1</text>
  <rect x="46" y="326" width="606" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="352" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">平局时取更小的值 —— 这是题目要求的第二个排序键</text>
</svg>
