<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">k 落在哪个区间？三种情况与统一公式</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Number line -->
  <g filter="url(#sk)">
    <line x1="70" y1="105" x2="250" y2="105" stroke="#4a7a3a" stroke-width="5"/>
    <line x1="250" y1="105" x2="430" y2="105" stroke="#446688" stroke-width="5"/>
    <line x1="430" y1="105" x2="610" y2="105" stroke="#b85450" stroke-width="5"/>
    <line x1="70" y1="96" x2="70" y2="114" stroke="#3a3a3a" stroke-width="1.6"/>
    <line x1="250" y1="96" x2="250" y2="114" stroke="#3a3a3a" stroke-width="1.6"/>
    <line x1="430" y1="96" x2="430" y2="114" stroke="#3a3a3a" stroke-width="1.6"/>
    <line x1="610" y1="96" x2="610" y2="114" stroke="#3a3a3a" stroke-width="1.6"/>
  </g>
  <text x="70" y="130" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#555">numOnes</text>
  <text x="430" y="130" text-anchor="middle" font-size="11" fill="#555">numOnes+numZeros</text>
  <text x="610" y="130" text-anchor="middle" font-size="11" fill="#555">全部件数</text>

  <text x="160" y="87" text-anchor="middle" font-size="10.5" fill="#2e6e2e">拿 1</text>
  <text x="340" y="87" text-anchor="middle" font-size="10.5" fill="#2b6e9e">1 拿完，0 补数</text>
  <text x="520" y="87" text-anchor="middle" font-size="10.5" fill="#b03a3a">被迫拿 −1</text>

  <g filter="url(#sk)"><circle cx="160" cy="105" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="160" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">①</text>
  <g filter="url(#sk)"><circle cx="340" cy="105" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="340" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">②</text>
  <g filter="url(#sk)"><circle cx="520" cy="105" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="520" y="109" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">③</text>

  <g filter="url(#sk)"><path d="M 160 118 Q 150 155 138 186" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 340 118 L 340 184" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 520 118 Q 530 155 542 186" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/></g>

  <!-- Case 1 -->
  <g filter="url(#sk)"><rect x="39" y="190" width="192" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="135" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">情况①</text>
  <text x="135" y="234" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">k ≤ numOnes</text>
  <text x="135" y="256" text-anchor="middle" font-size="11" fill="#444">1 足够多，全选 1</text>
  <text x="135" y="274" text-anchor="middle" font-size="11" fill="#444">0 和 −1 都不碰</text>
  <text x="135" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">和 = k</text>

  <!-- Case 2 -->
  <g filter="url(#sk)"><rect x="244" y="190" width="192" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">情况②</text>
  <text x="340" y="234" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">numOnes &lt; k ≤ numOnes+numZeros</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#444">1 全拿，0 补足到 k 件</text>
  <text x="340" y="274" text-anchor="middle" font-size="11" fill="#444">不碰 −1</text>
  <text x="340" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">和 = numOnes</text>

  <!-- Case 3 -->
  <g filter="url(#sk)"><rect x="449" y="190" width="192" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="545" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">情况③</text>
  <text x="545" y="234" text-anchor="middle" font-size="10.5" fill="#555" font-family="monospace">k &gt; numOnes + numZeros</text>
  <text x="545" y="256" text-anchor="middle" font-size="11" fill="#444">1、0 全拿，被迫再拿</text>
  <text x="545" y="274" text-anchor="middle" font-size="11" fill="#444">k−numOnes−numZeros 件 −1</text>
  <text x="545" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">和 = 2·numOnes+numZeros−k</text>

  <!-- Unified formula -->
  <g filter="url(#sk)"><rect x="90" y="330" width="500" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="340" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">统一公式</text>
  <text x="340" y="372" text-anchor="middle" font-size="13" fill="#2b2b2b" font-family="monospace">答案 = min(k, numOnes) − max(0, k − numOnes − numZeros)</text>
</svg>
