<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="312" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：[2,4,1,3]（n=4，i=2 &gt; j=1，交叉情形）</text>

  <!-- 第 0 行：[2,4,1,3] -->
  <rect x="36" y="48" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="48" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="70" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="132" y="48" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="70" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="180" y="48" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <rect x="244" y="48" width="232" height="44" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 2，j = 1（i &gt; j，交叉）</text>
  <text x="360" y="84" text-anchor="middle" font-size="12.5" fill="#8a2f2c" filter="url(#rough2)">公式：2 + (4-1-1) - 1 = 3</text>

  <path d="M 128 86 L 128 114" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="244" y="106" font-size="12" fill="#b85450" filter="url(#rough2)">① 交换 idx1、idx2：n 与 1 直接互换</text>

  <!-- 第 1 行：[2,1,4,3] -->
  <rect x="36" y="118" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="118" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="104" y="140" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="132" y="118" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="140" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="180" y="118" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="244" y="138" font-size="12" fill="#b85450" filter="url(#rough2)">1 左移一步，n 右移一步 —— 一步抵两步</text>

  <path d="M 80 156 L 80 184" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="244" y="176" font-size="12" fill="#333" filter="url(#rough2)">② 交换 idx0、idx1：1 到达首位</text>

  <!-- 第 2 行：[1,2,4,3] -->
  <rect x="36" y="188" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="210" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="84" y="188" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="188" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="210" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>
  <rect x="180" y="188" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="244" y="216" font-size="12" fill="#333" filter="url(#rough2)">1 已在首位 ✓，只差 n</text>

  <path d="M 176 226 L 176 254" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="244" y="246" font-size="12" fill="#333" filter="url(#rough2)">③ 交换 idx2、idx3：n 到达末位</text>

  <!-- 第 3 行：[1,2,3,4] -->
  <rect x="36" y="258" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="280" text-anchor="middle" font-size="14" fill="#2f5423" filter="url(#rough2)">1</text>
  <rect x="84" y="258" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="280" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="132" y="258" width="40" height="34" rx="4" fill="#ffffff" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="280" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="258" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="280" text-anchor="middle" font-size="14" fill="#2c4360" filter="url(#rough2)">4</text>

  <text x="244" y="278" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">半有序达成 ✓ 共 3 次 = 2 + 2 - 1</text>
</svg>
