<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 552" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="800" height="552" fill="#fdfcf7"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "string"——翻标志、按方向入队</text>
  <path d="M 240 44 Q 400 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="84" y="64" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="140" y="64" width="168" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="308" y="64" width="252" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="560" y="64" width="64" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="624" y="64" width="136" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e">
    <text x="62" y="86" text-anchor="middle">步</text>
    <text x="112" y="86" text-anchor="middle">c</text>
    <text x="224" y="86" text-anchor="middle">动作</text>
    <text x="434" y="86" text-anchor="middle">dq（头 → 尾）</text>
    <text x="592" y="86" text-anchor="middle">flag</text>
    <text x="692" y="86" text-anchor="middle">屏幕</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="98" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="84" y="98" width="56" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="98" width="168" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="98" width="252" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="98" width="64" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="624" y="98" width="136" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)"><rect x="414" y="105" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="434" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">s</text>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="123" text-anchor="middle">1</text>
    <text x="112" y="123" text-anchor="middle">s</text>
    <text x="224" y="123" text-anchor="middle">push_back（尾进）</text>
    <text x="592" y="124" text-anchor="middle" font-size="14" fill="#4a8edb">→</text>
    <text x="692" y="123" text-anchor="middle" font-family="monospace">"s"</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="140" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="84" y="140" width="56" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="140" width="168" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="140" width="252" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="140" width="64" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="624" y="140" width="136" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="392" y="147" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="436" y="147" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#sk)">
    <text x="412" y="166" text-anchor="middle">s</text>
    <text x="456" y="166" text-anchor="middle">t</text>
  </g>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="165" text-anchor="middle">2</text>
    <text x="112" y="165" text-anchor="middle">t</text>
    <text x="224" y="165" text-anchor="middle">push_back（尾进）</text>
    <text x="592" y="166" text-anchor="middle" font-size="14" fill="#4a8edb">→</text>
    <text x="692" y="165" text-anchor="middle" font-family="monospace">"st"</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="182" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="84" y="182" width="56" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="182" width="168" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="182" width="252" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="182" width="64" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="624" y="182" width="136" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="370" y="189" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="414" y="189" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="458" y="189" width="40" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#sk)">
    <text x="390" y="208" text-anchor="middle">s</text>
    <text x="434" y="208" text-anchor="middle">t</text>
    <text x="478" y="208" text-anchor="middle">r</text>
  </g>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="207" text-anchor="middle">3</text>
    <text x="112" y="207" text-anchor="middle">r</text>
    <text x="224" y="207" text-anchor="middle">push_back（尾进）</text>
    <text x="592" y="208" text-anchor="middle" font-size="14" fill="#4a8edb">→</text>
    <text x="692" y="207" text-anchor="middle" font-family="monospace">"str"</text>
  </g>

  <!-- row 4 : the 'i' -->
  <g filter="url(#sk)">
    <rect x="40" y="224" width="44" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="84" y="224" width="56" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="140" y="224" width="168" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="308" y="224" width="252" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="560" y="224" width="64" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="624" y="224" width="136" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <rect x="370" y="231" width="40" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="414" y="231" width="40" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="458" y="231" width="40" height="28" rx="4" fill="#ffffff" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <g font-size="13" fill="#888" filter="url(#sk)">
    <text x="390" y="250" text-anchor="middle">s</text>
    <text x="434" y="250" text-anchor="middle">t</text>
    <text x="478" y="250" text-anchor="middle">r</text>
  </g>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="249" text-anchor="middle">4</text>
    <text x="112" y="249" text-anchor="middle" font-weight="bold" fill="#b85450">i</text>
    <text x="224" y="249" text-anchor="middle" font-weight="bold" fill="#7a5415">flag = !flag（dq 不动）</text>
    <text x="592" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">←</text>
    <text x="692" y="249" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#b85450">"rts"</text>
  </g>

  <!-- row 5 -->
  <g filter="url(#sk)">
    <rect x="40" y="266" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="84" y="266" width="56" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="266" width="168" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="266" width="252" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="266" width="64" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="624" y="266" width="136" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="348" y="273" width="40" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="392" y="273" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="436" y="273" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="480" y="273" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#sk)">
    <text x="368" y="292" text-anchor="middle" font-weight="bold">n</text>
    <text x="412" y="292" text-anchor="middle">s</text>
    <text x="456" y="292" text-anchor="middle">t</text>
    <text x="500" y="292" text-anchor="middle">r</text>
  </g>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="291" text-anchor="middle">5</text>
    <text x="112" y="291" text-anchor="middle">n</text>
    <text x="224" y="291" text-anchor="middle">push_front（头进）</text>
    <text x="592" y="292" text-anchor="middle" font-size="14" fill="#b85450">←</text>
    <text x="692" y="291" text-anchor="middle" font-family="monospace">"rtsn"</text>
  </g>

  <!-- row 6 -->
  <g filter="url(#sk)">
    <rect x="40" y="308" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="84" y="308" width="56" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="308" width="168" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="308" width="252" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="560" y="308" width="64" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="624" y="308" width="136" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="326" y="315" width="40" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="370" y="315" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="414" y="315" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="458" y="315" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="502" y="315" width="40" height="28" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#sk)">
    <text x="346" y="334" text-anchor="middle" font-weight="bold">g</text>
    <text x="390" y="334" text-anchor="middle">n</text>
    <text x="434" y="334" text-anchor="middle">s</text>
    <text x="478" y="334" text-anchor="middle">t</text>
    <text x="522" y="334" text-anchor="middle">r</text>
  </g>
  <g font-size="12" fill="#444" filter="url(#sk)">
    <text x="62" y="333" text-anchor="middle">6</text>
    <text x="112" y="333" text-anchor="middle">g</text>
    <text x="224" y="333" text-anchor="middle">push_front（头进）</text>
    <text x="592" y="334" text-anchor="middle" font-size="14" fill="#b85450">←</text>
    <text x="692" y="333" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#2e6e2e">"rtsng"</text>
  </g>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="40" y="366" width="720" height="52" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="400" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 flag = ←（反向）：从右往左读 dq = g n s t r 的逆序 → 输出 "rtsng" ✓</text>
  <text x="400" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">全程只在最后读一次 dq，其余操作均为 O(1)</text>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="432" width="440" height="92" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="56" y="452" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 抵消验证：s = "poiinter"</text>
  <g font-size="10.5" fill="#444">
    <text x="56" y="472" filter="url(#sk)">p、o 进尾端 → 遇 'i'：flag 翻为 ←，屏幕变 "op"</text>
    <text x="56" y="490" filter="url(#sk)">再遇 'i'：flag 翻回 →，屏幕变回 "po"（两个 'i' 抵消）</text>
    <text x="56" y="508" filter="url(#sk)">n、t、e、r 进尾端 → flag 正向，最终输出 "ponter" ✓</text>
  </g>
  <g filter="url(#sk)"><rect x="500" y="432" width="260" height="92" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="516" y="452" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键点</text>
  <g font-size="10.5" fill="#444">
    <text x="516" y="472" filter="url(#sk)">· 'i' 只翻 flag，不搬数据</text>
    <text x="516" y="490" filter="url(#sk)">· 新字符按 flag 方向进对应端</text>
    <text x="516" y="508" filter="url(#sk)">· 结束时按方向读一次 → O(n)</text>
  </g>
</svg>
