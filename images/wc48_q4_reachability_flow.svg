<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">恰好 presses 次 ⇒ 只按「子集大小 + 奇偶」筛选</text>
  <text x="330" y="51" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">按两次同一开关等于没按，因此顺序无关，只有「按过奇数次」的开关集合有意义</text>

  <!-- 步骤 1 -->
  <rect x="70" y="68" width="520" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="98" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">枚举 16 个掩码 mask ∈ {0,1}⁴（每个开关按奇数次还是偶数次）</text>
  <path d="M330,116 L330,138" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 筛选条件 -->
  <rect x="70" y="142" width="520" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="166" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">保留：|S| ≤ presses 且 |S| ≡ presses (mod 2)</text>
  <text x="330" y="188" text-anchor="middle" font-size="10.5" fill="#9a7d2f" filter="url(#rough2)">差值 (presses − |S|) 用「同一开关再按两次」补齐，状态不变</text>
  <path d="M330,200 L330,222" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="70" y="226" width="520" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">逐个 mask 算出前 m = min(n, 6) 盏灯的翻转位，编码成一个位掩码</text>
  <path d="M330,274 L330,296" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="70" y="300" width="520" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="328" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 位掩码集合的大小（最多 16 个候选，天然去重）</text>

  <!-- 结果表 -->
  <rect x="40" y="358" width="580" height="88" rx="10" fill="#f5f0ff" stroke="#7a5ea8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="11.5" fill="#4a3670" filter="url(#rough2)">n = 1 ：presses = 0 → 1 ；presses ≥ 1 → 2</text>
  <text x="60" y="402" font-size="11.5" fill="#4a3670" filter="url(#rough2)">n = 2 ：0 → 1 ；1 → 3 ；presses ≥ 2 → 4</text>
  <text x="60" y="424" font-size="11.5" fill="#4a3670" filter="url(#rough2)">n ≥ 3 ：0 → 1 ；1 → 4 ；2 → 7 ；presses ≥ 3 → 8</text>
  <text x="330" y="440" text-anchor="middle" font-size="9.5" fill="#8a7aa8" filter="url(#rough2)">（这张表就是代码里 16 次枚举的自然结果，不需要背）</text>
</svg>
