<svg xmlns="http://www.w3.org/2000/svg" width="780" height="446" viewBox="0 0 780 446"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="446" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：n = 15 ⇒ h_max = 2，答案 1 + 1 + 3 = 5</text>
  <path d="M 96 43 Q 390 50 684 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="64" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">p = 2(r − t)，a = k + p，c = 3·2^h + r + 2t（t 取遍 r 的子掩码）</text>

  <!-- 表头 -->
  <rect x="30" y="80" width="720" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">h</text>
  <text x="146" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">k</text>
  <text x="216" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">r</text>
  <text x="286" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">t</text>
  <text x="356" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">p</text>
  <text x="430" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="506" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="592" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">c</text>
  <text x="694" y="101" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">c ≤ 15 ?</text>

  <!-- 行 1 -->
  <rect x="30" y="114" width="720" height="34" rx="5" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="146" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">1</text>
  <text x="216" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="286" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="356" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="430" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">1</text>
  <text x="506" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">2</text>
  <text x="592" y="136" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">3</text>
  <text x="694" y="136" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">✓</text>

  <!-- 行 2 -->
  <rect x="30" y="150" width="720" height="34" rx="5" fill="#f7fbff" stroke="#c9d3dc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">1</text>
  <text x="146" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">2</text>
  <text x="216" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="286" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="356" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">0</text>
  <text x="430" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">2</text>
  <text x="506" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">4</text>
  <text x="592" y="172" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">6</text>
  <text x="694" y="172" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">✓</text>

  <!-- 行 3 -->
  <rect x="30" y="186" width="720" height="34" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">2</text>
  <text x="146" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">4</text>
  <text x="216" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <text x="286" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <text x="356" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <text x="430" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">4</text>
  <text x="506" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">8</text>
  <text x="592" y="208" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">12</text>
  <text x="694" y="208" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">✓</text>

  <!-- 行 4 -->
  <rect x="30" y="222" width="720" height="34" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">2</text>
  <text x="146" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">5</text>
  <text x="216" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">1</text>
  <text x="286" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <text x="356" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">2</text>
  <text x="430" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">7</text>
  <text x="506" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">10</text>
  <text x="592" y="244" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">15</text>
  <text x="694" y="244" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">✓</text>

  <!-- 行 5 -->
  <rect x="30" y="258" width="720" height="34" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">2</text>
  <text x="146" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">5</text>
  <text x="216" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">1</text>
  <text x="286" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">1</text>
  <text x="356" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <text x="430" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">5</text>
  <text x="506" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">10</text>
  <text x="592" y="280" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">13</text>
  <text x="694" y="280" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">✓</text>

  <text x="30" y="316" font-size="12" fill="#66788c" filter="url(#rough2)">前两行来自 h = 0、h = 1 两个整组（A_0 = A_1 = 1）；后三行来自 h = 2 的截断组，B = 15 − 12 = 3。</text>

  <!-- 小结框 -->
  <rect x="30" y="330" width="720" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="46" y="354" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">h = 2 内 r + 2t ≤ 3 的 (r,t)：(0,0) → 0，(1,0) → 1，(1,1) → 3，共 3 组 ⇒ 答案 = 1 + 1 + 3 = 5</text>
  <text x="46" y="378" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">对应三元组：(1,2,3)、(2,4,6)、(4,8,12)、(7,10,13)、(5,10,15)，与样例输出 5 一致</text>

  <text x="390" y="424" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">注意 c 在 12~15 中缺了 14：u = r + 2t 只取到部分值，这正是最后要用数位 DP 而不是简单乘法的地方。</text>
  <text x="390" y="440" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">h = 0、1 两组在 15 以内必然全部合法（组内最大 c 分别为 3、6），所以可以整组累加。</text>
</svg>
