<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="444" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：plants = [2,2,3,3]，capacity = 5</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk2)">
    <rect x="52" y="62" width="536" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2b4a6e" text-anchor="middle" font-weight="bold">
    <text x="74" y="83">i</text>
    <text x="138" y="83">plants[i]</text>
    <text x="213" y="83">cur（前）</text>
    <text x="283" y="83">水够？</text>
    <text x="380" y="83">步数增量</text>
    <text x="479" y="83">ans 累计</text>
    <text x="553" y="83">cur（后）</text>
  </g>

  <!-- rows -->
  <g filter="url(#sk2)">
    <rect x="52" y="94" width="536" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="52" y="136" width="536" height="42" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="52" y="178" width="536" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="52" y="220" width="536" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g stroke="#999" stroke-width="1">
    <line x1="96" y1="62" x2="96" y2="262"/>
    <line x1="180" y1="62" x2="180" y2="262"/>
    <line x1="246" y1="62" x2="246" y2="262"/>
    <line x1="320" y1="62" x2="320" y2="262"/>
    <line x1="440" y1="62" x2="440" y2="262"/>
    <line x1="518" y1="62" x2="518" y2="262"/>
  </g>

  <!-- row 0 -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="74" y="120">0</text>
    <text x="138" y="120">2</text>
    <text x="213" y="120">5</text>
    <text x="283" y="120" font-weight="bold" fill="#2e6e2e">✓</text>
    <text x="380" y="120" fill="#2e6e2e">＋1（直走）</text>
    <text x="479" y="120">1</text>
    <text x="553" y="120">3</text>
  </g>
  <!-- row 1 -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="74" y="162">1</text>
    <text x="138" y="162">2</text>
    <text x="213" y="162">3</text>
    <text x="283" y="162" font-weight="bold" fill="#2e6e2e">✓</text>
    <text x="380" y="162" fill="#2e6e2e">＋1（直走）</text>
    <text x="479" y="162">2</text>
    <text x="553" y="162">1</text>
  </g>
  <!-- row 2 -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="74" y="204">2</text>
    <text x="138" y="204">3</text>
    <text x="213" y="204">1</text>
    <text x="283" y="204" font-weight="bold" fill="#b85450">✗</text>
    <text x="380" y="204" fill="#b85450">2×2+1 = 5</text>
    <text x="479" y="204">7</text>
    <text x="553" y="204">2</text>
  </g>
  <!-- row 3 -->
  <g font-size="12.5" fill="#333" text-anchor="middle">
    <text x="74" y="246">3</text>
    <text x="138" y="246">3</text>
    <text x="213" y="246">2</text>
    <text x="283" y="246" font-weight="bold" fill="#b85450">✗</text>
    <text x="380" y="246" fill="#b85450">2×3+1 = 7</text>
    <text x="479" y="246" font-weight="bold" fill="#7a5415">14</text>
    <text x="553" y="246">2</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="170" y="282" width="300" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">ans = 1 + 1 + 5 + 7 = 14 ✓</text>

  <!-- example 3 note -->
  <g filter="url(#sk)">
    <rect x="64" y="348" width="512" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">示例 3：plants = [7,7,7,7,7,7,7]，capacity = 8</text>
  <text x="320" y="398" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b4a6e">浇完每株剩 1 → 从 i = 1 起每株都折返：1 + 3+5+7+9+11+13 = 49 ✓</text>
</svg>
