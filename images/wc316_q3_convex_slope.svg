<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：f(t) 是分段线性凸函数，最小值在斜率变号处</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#sk)">f(t) = Σ cost[i]·|nums[i] − t|；例：nums = [1,3,5,2]，cost = [2,3,1,14]，排序后 v = [1,2,3,5]，w = [2,14,3,1]，W = 20</text>

  <!-- 坐标轴 -->
  <path d="M 110 330 L 590 330" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 130 340 V 84" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="116" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777" filter="url(#sk)">f(t)</text>
  <text x="596" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777" filter="url(#sk)">t</text>

  <!-- 刻度 -->
  <g stroke="#777777" stroke-width="1.2" filter="url(#sk)">
    <path d="M 180 325 V 335"/>
    <path d="M 260 325 V 335"/>
    <path d="M 340 325 V 335"/>
    <path d="M 500 325 V 335"/>
  </g>
  <text x="180" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" filter="url(#sk)">1</text>
  <text x="260" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" filter="url(#sk)">2</text>
  <text x="340" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" filter="url(#sk)">3</text>
  <text x="500" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333" filter="url(#sk)">5</text>
  <text x="180" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">w=2</text>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">w=14</text>
  <text x="340" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">w=3</text>
  <text x="500" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">w=1</text>

  <!-- 折线两端虚线延伸 -->
  <path d="M 142 213 L 180 246" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 500 134 L 536 102" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>

  <!-- 主体折线 -->
  <path d="M 180 246 L 260 302 L 340 260 L 500 134" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#sk)"/>

  <!-- 断点 -->
  <circle cx="180" cy="246" r="5" fill="#446688" filter="url(#sk)"/>
  <circle cx="340" cy="260" r="5" fill="#446688" filter="url(#sk)"/>
  <circle cx="500" cy="134" r="5" fill="#446688" filter="url(#sk)"/>
  <text x="188" y="240" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#sk)">f(1)=24</text>
  <text x="348" y="254" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#sk)">f(3)=20</text>
  <text x="470" y="126" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#sk)">f(5)=56</text>

  <!-- 最小值点 -->
  <circle cx="260" cy="302" r="11" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#sk)"/>
  <circle cx="260" cy="302" r="5.5" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="280" y="315" text-anchor="start" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">t = 2，f(2) = 8 ✓ 全局最小（斜率在此变号）</text>

  <!-- 斜率标注 -->
  <text x="156" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">−20</text>
  <text x="220" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">−16</text>
  <text x="300" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">+12 变号！</text>
  <text x="420" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">+18</text>
  <text x="522" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">+20</text>

  <!-- 底部两个结论框 -->
  <g filter="url(#sk)">
    <rect x="55" y="386" width="262" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="186" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">斜率跳变：跨过 v_j 一次 +2·w_j</text>
  <text x="186" y="428" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">斜率从 −W 单调升到 +W → f 是凸的</text>
  <text x="186" y="446" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#sk)">极小点 = 斜率由负转正的位置</text>

  <g filter="url(#sk)">
    <rect x="323" y="386" width="262" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="454" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">加权中位数 = 累计权重首次过半</text>
  <text x="454" y="428" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#sk)">pw：2 → 16 → 19 → 20，W/2 = 10</text>
  <text x="454" y="446" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#sk)">首个 pw ≥ 10 在 v₁ = 2 → t = 2，f = 8</text>
</svg>
