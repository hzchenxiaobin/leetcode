<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">4 个开关 × 6 类灯泡：只有 3 个自由度</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">灯泡按（奇偶，mod 3）分成 6 类，编号差 6 的两盏灯永远同步变化</text>

  <!-- 表头：6 个类 -->
  <text x="158" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="220" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="282" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="344" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="406" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="468" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="158" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">奇 / 1</text>
  <text x="220" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">偶 / 2</text>
  <text x="282" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">奇 / 0</text>
  <text x="344" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">偶 / 1</text>
  <text x="406" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">奇 / 2</text>
  <text x="468" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">偶 / 0</text>

  <!-- 行 1：开关 1 全翻 -->
  <text x="118" y="132" text-anchor="end" font-size="11.5" fill="#b85450" filter="url(#rough2)">开关 1</text>
  <rect x="130" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="192" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="254" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="316" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="378" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="440" y="114" width="56" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="220" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="282" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="344" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="406" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="468" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 行 2：开关 2 偶数 -->
  <text x="118" y="170" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">开关 2</text>
  <rect x="130" y="152" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="192" y="152" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="254" y="152" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="316" y="152" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="378" y="152" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="440" y="152" width="56" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="170" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="220" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="282" y="170" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="344" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="406" y="170" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="468" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 行 3：开关 3 奇数 -->
  <text x="118" y="208" text-anchor="end" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">开关 3</text>
  <rect x="130" y="190" width="56" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="192" y="190" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="254" y="190" width="56" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="316" y="190" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="378" y="190" width="56" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="440" y="190" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="158" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="220" y="208" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="282" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="344" y="208" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="406" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="468" y="208" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>

  <!-- 行 4：开关 4 = 3k+1 -->
  <text x="118" y="246" text-anchor="end" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">开关 4</text>
  <rect x="130" y="228" width="56" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="192" y="228" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="254" y="228" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="316" y="228" width="56" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="378" y="228" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="440" y="228" width="56" height="26" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="158" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="220" y="246" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="282" y="246" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="344" y="246" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="406" y="246" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="468" y="246" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>

  <text x="512" y="132" font-size="10" fill="#999" filter="url(#rough2)">1 = 翻转</text>
  <text x="512" y="150" font-size="10" fill="#999" filter="url(#rough2)">0 = 不动</text>

  <!-- 右侧结论 -->
  <rect x="512" y="170" width="146" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="585" y="192" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">秩 = 3</text>
  <text x="585" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最多 2³ = 8 种状态</text>
  <text x="585" y="232" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">远小于 2^1000</text>
  <text x="585" y="252" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（不可能暴力枚举）</text>

  <!-- 底部：行关系 -->
  <rect x="40" y="284" width="470" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="313" font-size="12" fill="#2c4a66" filter="url(#rough2)">开关 1 = 开关 2 ⊕ 开关 3：偶数灯 + 奇数灯 = 全部灯</text>
  <path d="M505,196 L470,278" stroke="#666" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="356" font-size="11.5" fill="#666" filter="url(#rough2)">于是 4 个开关里只有 3 个是「独立」的：翻转集合 {全部, 奇数, 3k+1} 构成一组基。</text>
  <text x="40" y="378" font-size="11.5" fill="#666" filter="url(#rough2)">又因「按两次 = 不按」，只需关心每个开关被按的次数的奇偶性。</text>
</svg>
