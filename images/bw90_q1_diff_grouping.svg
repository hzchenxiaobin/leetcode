<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">差值数组做键：哈希一聚，孤桶即异类</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#rough2)">
      <rect x="60" y="52" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    </g>
    <text x="105" y="73">"adc"</text>
    <g filter="url(#rough2)">
      <rect x="170" y="52" width="90" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    </g>
    <text x="215" y="73">"wzy"</text>
    <g filter="url(#rough2)">
      <rect x="280" y="52" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    </g>
    <text x="325" y="73">"abc"</text>
  </g>
  <text x="440" y="73" font-size="12" fill="#888" filter="url(#rough2)">words</text>

  <path d="M 105 88 L 105 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 215 88 L 215 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 325 88 L 325 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <g filter="url(#rough2)">
      <rect x="120" y="132" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    </g>
    <text x="205" y="157">键 [3, −1] → 桶大小 2</text>
    <g filter="url(#rough2)">
      <rect x="330" y="132" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    </g>
    <text x="415" y="157">键 [1, 1] → 桶大小 1</text>
  </g>
  <text x="205" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">多数派聚成大桶（≥ 2 个）</text>
  <text x="415" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">异类孤零零 ← 返回它！</text>

  <g filter="url(#rough2)">
    <rect x="60" y="216" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="280" y="240">等价刻画：差值数组相同 ⟺ 互为「整体平移」</text>
    <text x="280" y="264">"adc" 与 "wzy" 都满足相邻字母差 [3, −1]，只差一个常数偏移</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="296" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="318">题面保证恰一个异类 → 恰有两个桶，大小 1 与 k−1</text>
    <text x="280" y="342">「桶大小」自带投票信息，比两两比较省心得多</text>
  </g>
</svg>
