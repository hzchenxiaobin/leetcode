<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 逐步演算</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">logs = [[0,3],[2,5],[0,9],[1,15]]，初始 prev = 0, bestDur = −1</text>

  <!-- 表格外框 -->
  <rect x="30" y="58" width="520" height="198" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 列分隔线 -->
  <line x1="100" y1="58" x2="100" y2="256" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="195" y1="58" x2="195" y2="256" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="335" y1="58" x2="335" y2="256" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="445" y1="58" x2="445" y2="256" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- 行分隔线 -->
  <line x1="30" y1="88" x2="550" y2="88" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="30" y1="130" x2="550" y2="130" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="172" x2="550" y2="172" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="214" x2="550" y2="214" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 高亮格子 -->
  <rect x="335" y="88" width="110" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="445" y="88" width="105" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="335" y="172" width="110" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="445" y="172" width="105" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="335" y="214" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="445" y="214" width="105" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="65" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="147" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">log</text>
  <text x="265" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">dur = t − prev</text>
  <text x="390" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">bestDur</text>
  <text x="497" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">bestId</text>

  <!-- 行 1 -->
  <text x="65" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="147" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[0, 3]</text>
  <text x="265" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 − 0 = 3</text>
  <text x="390" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="497" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 行 2 -->
  <text x="65" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="147" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[2, 5]</text>
  <text x="265" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5 − 3 = 2</text>
  <text x="390" y="156" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <text x="497" y="156" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 3 -->
  <text x="65" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="147" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[0, 9]</text>
  <text x="265" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9 − 5 = 4</text>
  <text x="390" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="497" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 行 4 -->
  <text x="65" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="147" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">[1, 15]</text>
  <text x="265" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15 − 9 = 6</text>
  <text x="390" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="497" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 结论框 -->
  <rect x="90" y="280" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">最长用时 6 由员工 1 创造 → 返回 1</text>
</svg>
