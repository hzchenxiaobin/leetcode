<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：costs = [1,3,2,4,1]，coins = 7</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: freq table -->
  <text x="70" y="68" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 计数排序 → 频率表</text>
  <g filter="url(#sk)">
    <rect x="70" y="78" width="78" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="109" y="97" text-anchor="middle" font-size="11" fill="#2b6e9e">价位 1</text>
  <text x="109" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2 支</text>
  <g filter="url(#sk)">
    <rect x="158" y="78" width="78" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="197" y="97" text-anchor="middle" font-size="11" fill="#2b6e9e">价位 2</text>
  <text x="197" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1 支</text>
  <g filter="url(#sk)">
    <rect x="246" y="78" width="78" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="285" y="97" text-anchor="middle" font-size="11" fill="#2b6e9e">价位 3</text>
  <text x="285" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1 支</text>
  <g filter="url(#sk)">
    <rect x="334" y="78" width="78" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="373" y="97" text-anchor="middle" font-size="11" fill="#2b6e9e">价位 4</text>
  <text x="373" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1 支</text>

  <g filter="url(#sk)">
    <rect x="436" y="78" width="170" height="58" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  </g>
  <text x="521" y="100" text-anchor="middle" font-size="10.5" fill="#777">等价于升序排列</text>
  <text x="521" y="120" text-anchor="middle" font-size="11" fill="#777" font-family="monospace">[1, 1, 2, 3, 4]</text>

  <!-- step 2: batch purchase table -->
  <text x="70" y="170" font-size="12.5" font-weight="bold" fill="#2b6e9e">② 从价位 1 起逐桶批量购买</text>

  <g filter="url(#sk)">
    <rect x="30" y="318" width="580" height="36" fill="#fce4ec"/>
  </g>
  <g filter="url(#sk)">
    <rect x="30" y="182" width="580" height="28" fill="#e8f0fa"/>
  </g>
  <g filter="url(#sk)">
    <rect x="30" y="182" width="580" height="172" fill="none" stroke="#4a8edb" stroke-width="1.4" rx="4"/>
  </g>
  <path d="M 140 182 L 140 354" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 220 182 L 220 354" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 310 182 L 310 354" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 515 182 L 515 354" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 30 210 L 610 210" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 30 246 L 610 246" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 30 282 L 610 282" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 30 318 L 610 318" stroke="#4a8edb" stroke-width="1.1" filter="url(#sk)"/>

  <text x="85" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">价位</text>
  <text x="180" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">freq</text>
  <text x="265" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">coins（买前）</text>
  <text x="412" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">can = min(freq, coins/price)</text>
  <text x="562" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">买后（coins, ans）</text>

  <text x="85" y="232" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="180" y="232" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="265" y="232" text-anchor="middle" font-size="11.5" fill="#333">7</text>
  <text x="412" y="232" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">min(2, 7) = 2</text>
  <text x="562" y="232" text-anchor="middle" font-size="11" fill="#333">coins=5，ans=2</text>

  <text x="85" y="268" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <text x="180" y="268" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="265" y="268" text-anchor="middle" font-size="11.5" fill="#333">5</text>
  <text x="412" y="268" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">min(1, 2) = 1</text>
  <text x="562" y="268" text-anchor="middle" font-size="11" fill="#333">coins=3，ans=3</text>

  <text x="85" y="304" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="180" y="304" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="265" y="304" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="412" y="304" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">min(1, 1) = 1</text>
  <text x="562" y="304" text-anchor="middle" font-size="11" fill="#333">coins=0，ans=4</text>

  <text x="85" y="340" text-anchor="middle" font-size="11.5" fill="#a04040">4</text>
  <text x="180" y="340" text-anchor="middle" font-size="11.5" fill="#a04040">1</text>
  <text x="265" y="340" text-anchor="middle" font-size="11.5" fill="#a04040">0</text>
  <text x="412" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04040">coins=0 &lt; 4 → break</text>
  <text x="562" y="340" text-anchor="middle" font-size="11" fill="#a04040">—（终止）</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="30" y="374" width="580" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">答案 ans = 4：买下两支 1 元、一支 2 元、一支 3 元</text>
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#2e6e2e">总价 1+1+2+3 = 7 恰好用完；价位 4 时 coins = 0 &lt; 4，提前终止</text>
</svg>
