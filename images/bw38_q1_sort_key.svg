<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">排序键 = 二元组 (频率, −数值)</text>

  <!-- 步骤 1：计数 -->
  <text x="60" y="76" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">① 计数：值 → 频率</text>
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="120" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="120" y="118">freq(5) = 1</text>
    <text x="120" y="146">freq(-1) = 1</text>
    <text x="120" y="174">freq(4) = 2</text>
    <text x="120" y="202">freq(-6) = 2</text>
    <text x="120" y="228" font-size="11.5" fill="#666">…（示例 3 数据）</text>
  </g>

  <!-- 步骤 2：构造键 -->
  <text x="250" y="76" font-size="13.5" fill="#d6a040" filter="url(#rough2)">② 每个元素的键</text>
  <g filter="url(#rough2)">
    <rect x="250" y="90" width="130" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a10" text-anchor="middle">
    <text x="315" y="118">5 → (1, −5)</text>
    <text x="315" y="146">−1 → (1, 1)</text>
    <text x="315" y="174">4 → (2, −4)</text>
    <text x="315" y="202">−6 → (2, 6)</text>
    <text x="315" y="228" font-size="11.5" fill="#666">val → (freq, −val)</text>
  </g>

  <!-- 步骤 3：按键升序 -->
  <text x="440" y="76" font-size="13.5" fill="#446688" filter="url(#rough2)">③ 键升序排序</text>
  <g filter="url(#rough2)">
    <rect x="440" y="90" width="90" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle">
    <text x="485" y="118">(1, −5)</text>
    <text x="485" y="146">(1, 1)</text>
    <text x="485" y="174">(2, −4)</text>
    <text x="485" y="202">(2, 6)</text>
    <text x="485" y="228" font-size="11.5" fill="#666">5, −1, 4, −6</text>
  </g>

  <path d="M 182 165 L 246 165" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 382 165 L 436 165" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部解释 -->
  <g filter="url(#rough2)">
    <rect x="60" y="266" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="288" text-anchor="middle" font-size="13" fill="#8b3a34" filter="url(#rough2)">频率升序：组间 (1) 与 (2)，先排频率 1 的组；</text>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#8b3a34" filter="url(#rough2)">组内 −val 升序 = val 降序：5 先于 −1，4 先于 −6 ✓</text>
</svg>
