<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例走查：low = 1000，high = 13000</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888">位数越大数值越大：L 位最小候选 123…（共 L 位）一旦超过 high，更大的 L 也全部超过</text>

  <rect x="36" y="60" width="56" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="76" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">位数 L</text>
  <rect x="100" y="60" width="330" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="76" font-size="10" fill="#444" filter="url(#rough2)">生成（首位 d = 1 … 10−L）</text>
  <rect x="438" y="60" width="148" height="24" fill="#e8e8e8" stroke="#777" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="512" y="76" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">与 [1000, 13000] 比对</text>

  <rect x="36" y="88" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="112" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="100" y="88" width="330" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="105" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">12  23  34  45  56  67  78  89</text>
  <text x="112" y="120" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">共 8 个</text>
  <rect x="438" y="88" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="512" y="112" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">全部 &lt; 1000，丢弃</text>

  <rect x="36" y="130" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="154" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="100" y="130" width="330" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="147" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">123  234  345  456  567  678  789</text>
  <text x="112" y="162" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">共 7 个</text>
  <rect x="438" y="130" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="512" y="154" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">全部 &lt; 1000，丢弃</text>

  <rect x="36" y="172" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="196" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="100" y="172" width="330" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="189" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1234  2345  3456  4567  5678  6789</text>
  <text x="112" y="204" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">共 6 个，全部落在区间内</text>
  <rect x="438" y="172" width="148" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="512" y="196" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">6 个全部收录</text>

  <rect x="36" y="214" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="238" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="100" y="214" width="330" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="231" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">12345  23456  34567  45678  56789</text>
  <text x="112" y="246" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">只有最小的 12345 ≤ 13000</text>
  <rect x="438" y="214" width="148" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="512" y="238" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">仅 1 个收录</text>

  <rect x="36" y="256" width="56" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="64" y="280" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">6</text>
  <rect x="100" y="256" width="330" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="273" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">123456  234567  345678  456789</text>
  <text x="112" y="288" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">最小值 123456 已超过 high</text>
  <rect x="438" y="256" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="512" y="280" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">可提前终止循环</text>

  <rect x="62" y="308" width="500" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="327" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">ans = [1234, 2345, 3456, 4567, 5678, 6789, 12345]</text>
  <text x="76" y="345" font-size="10" fill="#555" filter="url(#rough2)">6789 &lt; 12345，但位数少者一定更小：位数优先即得升序</text>

  <text x="310" y="380" text-anchor="middle" font-size="9.5" fill="#999">绿色 = 命中区间，粉色 = 被区间筛掉</text>
</svg>
