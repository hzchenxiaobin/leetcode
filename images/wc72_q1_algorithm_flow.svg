<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：先记字母下标，再枚举掩码逐位写回</text>

  <rect x="130" y="52" width="380" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="76" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">扫描 s，记下所有字母下标 → letters，k ← len(letters)</text>

  <path d="M 320 90 L 320 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="110" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">base ← list(s)；mask ← 0；res ← []</text>

  <path d="M 320 148 L 320 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,166 430,198 320,230 210,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="203" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">mask &lt; 2^k ?</text>

  <path d="M 430 198 L 464 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="189" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="468" y="180" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="543" y="203" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33552a" filter="url(#rough2)">返回 res</text>

  <path d="M 320 230 L 320 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="120" y="252" width="400" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="274" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">for b in 0 … k−1:</text>
  <text x="152" y="294" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">bit ← (mask &gt;&gt; (k−1−b)) &amp; 1</text>
  <text x="152" y="313" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">base[letters[b]] ← bit ? upper : lower</text>

  <path d="M 320 322 L 320 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="342" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="365" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">res.append(join(base))</text>

  <path d="M 320 378 L 320 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="396" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">mask ← mask + 1</text>

  <path d="M 220 413 L 60 413 L 60 198 L 204 198" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="9.5" fill="#b85450" filter="url(#rough2)">回到判断</text>

  <text x="320" y="452" text-anchor="middle" font-size="10.5" fill="#5a6a80" filter="url(#rough2)">每个掩码只做 k 次字符写入 + 一次长度 n 的拼接，整体 O(2^k · n)</text>
</svg>
