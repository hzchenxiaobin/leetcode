<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：最小堆 + k 轮「弹最小 → +1 → 回填」</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <ellipse cx="340" cy="66" rx="40" ry="17" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="71" text-anchor="middle" font-size="13" fill="#2b6e9e">开始</text>
  <path d="M 340 83 L 340 96" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- build heap -->
  <g filter="url(#sk2)">
    <rect x="215" y="100" width="250" height="28" rx="6" fill="#ffffff" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>
  <text x="340" y="119" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">建最小堆：nums 全部入堆（O(n)）</text>
  <path d="M 340 128 L 340 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pop min -->
  <g filter="url(#sk2)">
    <rect x="215" y="144" width="250" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="164" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace">弹出堆顶 x —— 当前最小值</text>
  <path d="M 340 174 L 340 188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- push back -->
  <g filter="url(#sk2)">
    <rect x="215" y="192" width="250" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="212" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-family="monospace">压回 x + 1</text>
  <path d="M 340 222 L 340 234" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision: more rounds? -->
  <g filter="url(#sk2)">
    <polygon points="340,238 480,268 340,298 200,268" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="273" text-anchor="middle" font-size="12.5" fill="#9a6a15" font-family="monospace">剩余次数 &gt; 0 ?</text>

  <!-- yes: loop back left -->
  <text x="188" y="258" font-size="11.5" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 200 268 L 120 268 L 120 160 L 211 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="128" y="206" font-size="10.5" fill="#888">次数 −1，</text>
  <text x="128" y="220" font-size="10.5" fill="#888">继续下一轮</text>

  <!-- no: down to product -->
  <text x="352" y="312" font-size="11.5" fill="#b85450" font-weight="bold">否</text>
  <path d="M 340 298 L 340 312" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- product box -->
  <g filter="url(#sk2)">
    <rect x="200" y="316" width="280" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="335" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">ans = 1；依次取出堆中元素 x</text>
  <text x="340" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = ans · x mod (10⁹+7)</text>
  <path d="M 340 362 L 340 376" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- end -->
  <g filter="url(#sk2)">
    <ellipse cx="340" cy="396" rx="44" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="401" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- right side note: zero handling -->
  <g filter="url(#sk2)">
    <rect x="500" y="144" width="164" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="582" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a15">0 天然是堆顶</text>
  <text x="582" y="186" text-anchor="middle" font-size="11" fill="#7a5415">最先被 +1 消除；</text>
  <text x="582" y="204" text-anchor="middle" font-size="11" fill="#7a5415">并列最小任选其一</text>
  <text x="582" y="218" text-anchor="middle" font-size="10.5" fill="#7a5415">（终态多重集唯一）</text>
  <path d="M 498 170 L 470 170" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="26" y="424" width="628" height="34" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="340" y="446" text-anchor="middle" font-size="12.5" fill="#2b4a6e">复杂度 O(n + k log n)：建堆 O(n) · k 轮弹压各 O(log n)（n, k ≤ 10⁵ ⇒ 约 1.7×10⁶ 次堆调整）· 求积 O(n)</text>
</svg>
