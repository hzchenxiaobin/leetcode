<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="450" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：源点任取皆合法，最深者恰为直径端点 ⇒ m = 4</text>
  <path d="M 170 40 Q 430 48 690 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：分层图 -->
  <rect x="36" y="54" width="436" height="300" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="254" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">以 s=5 为源做 BFS 分层</text>

  <rect x="62" y="96" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="62" y="152" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="62" y="208" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="62" y="264" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <text x="372" y="123" font-size="10.5" fill="#557" filter="url(#rough2)">组1 · dist 0</text>
  <text x="372" y="179" font-size="10.5" fill="#557" filter="url(#rough2)">组2 · dist 1</text>
  <text x="372" y="235" font-size="10.5" fill="#557" filter="url(#rough2)">组3 · dist 2</text>
  <text x="372" y="291" font-size="10.5" fill="#557" filter="url(#rough2)">组4 · dist 3</text>

  <!-- 边 -->
  <line x1="212" y1="135" x2="212" y2="159" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="187" x2="162" y2="217" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="224" y1="187" x2="262" y2="217" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="152" y1="247" x2="152" y2="271" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="164" y1="245" x2="260" y2="267" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="272" y1="247" x2="272" y2="271" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="212" cy="119" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="212" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6414" filter="url(#rough2)">5</text>
  <text x="212" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#b07818" filter="url(#rough2)">源 s=5</text>
  <circle cx="212" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <circle cx="152" cy="231" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <circle cx="272" cy="231" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="272" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <circle cx="152" cy="287" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <circle cx="272" cy="287" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="272" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">6</text>

  <text x="316" y="258" font-size="9.5" fill="#b85450" filter="url(#rough2)">非树边</text>
  <text x="316" y="270" font-size="9.5" fill="#b85450" filter="url(#rough2)">|2−3|=1 ✓</text>

  <text x="254" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">每条边两端 dist 差恰为 1 —— 合法分组 ✓</text>
  <text x="254" y="350" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6 个节点全在同一连通分量</text>

  <!-- 右面板：枚举源点表 -->
  <rect x="496" y="54" width="328" height="300" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="660" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">枚举全部 6 个源点</text>

  <rect x="520" y="84" width="280" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="568" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">源 s</text>
  <text x="646" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">BFS 深度</text>
  <text x="744" y="103" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">组数=深度+1</text>

  <rect x="520" y="112" width="280" height="36" fill="none" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="568" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="646" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="744" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="520" y="148" width="280" height="36" fill="none" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="568" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="646" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="744" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <rect x="520" y="184" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="568" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="646" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">3</text>
  <text x="744" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">4 ✓</text>

  <rect x="520" y="220" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="568" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="646" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">3</text>
  <text x="744" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">4 ✓</text>

  <rect x="520" y="256" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="568" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6414" filter="url(#rough2)">5 ←本图</text>
  <text x="646" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">3</text>
  <text x="744" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">4 ✓</text>

  <rect x="520" y="292" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="568" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="646" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">3</text>
  <text x="744" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818" filter="url(#rough2)">4 ✓</text>

  <text x="660" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">直径 = max 深度 = 3 ⇒ 该分量 m = 4</text>

  <!-- 底部结论 -->
  <rect x="36" y="368" width="788" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">单连通分量：m = 直径 + 1（上界：组号差 ≤ dist ≤ 直径；可达：直径端点为源）</text>
  <text x="430" y="414" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">整个图（可能不连通）：答案 = Σ 各分量（直径 + 1），分量间组号平移到互不重叠区间</text>
</svg>
