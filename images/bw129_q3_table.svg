<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="48"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="348" fill="#fafafa"/>
  <text x="280.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">演算：zero=2, one=2, limit=1 的 dp 表</text>
  <text x="80.0" y="104.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">i\j</text>
  <text x="152.0" y="104.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j=0</text>
  <text x="244.0" y="104.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j=1</text>
  <text x="336.0" y="104.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j=2</text>
  <text x="80.0" y="144.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=0</text>
  <rect x="106.1" y="116.1" width="88.3" height="49.8" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="138.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">0 | 0</text>
  <rect x="198.2" y="116.4" width="88.4" height="49.7" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242.0" y="138.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">0 | 1</text>
  <rect x="290.2" y="116.1" width="88.0" height="50.5" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334.0" y="138.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">0 | 0</text>
  <text x="80.0" y="198.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=1</text>
  <rect x="106.0" y="169.9" width="88.4" height="50.1" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="192.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">1 | 0</text>
  <rect x="197.8" y="169.8" width="88.0" height="49.6" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242.0" y="192.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">1 | 1</text>
  <rect x="290.1" y="170.2" width="87.9" height="50.3" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="334.0" y="192.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">0 | 1</text>
  <text x="80.0" y="252.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i=2</text>
  <rect x="106.4" y="224.1" width="88.2" height="49.6" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="246.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">0 | 0</text>
  <rect x="197.6" y="224.5" width="87.8" height="49.7" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242.0" y="246.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">1 | 0</text>
  <rect x="290.4" y="224.2" width="87.6" height="49.8" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="334.0" y="246.0" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">1 | 1</text>
  <text x="332.0" y="264.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 + 1 = 2</text>
  <rect x="29.7" y="261.8" width="499.5" height="60.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.0" y="287.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">每格写「dp0 | dp1」：limit=1 时不允许任何长度为 2 的同值段</text>
  <text x="280.0" y="305.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">答案 = dp0[2][2] + dp1[2][2] = 1 + 1 = 2（0101 与 1010）</text>
</svg>
