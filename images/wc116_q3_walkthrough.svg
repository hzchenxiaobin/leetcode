<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 324"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="324" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 1：三点定矩形，第四点 (1,0) 恰好存在</text>
<polygon points="250,82 328,160 250,238 172,160" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="82" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(1,2)</text>
  <circle cx="328" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="328" y="144" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(2,1)</text>
  <circle cx="250" cy="238" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="222" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <circle cx="172" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="144" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">B = (1,2)</text>
  <text x="400" y="102" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">A = (2,1)，C = (0,1)</text>
  <text x="400" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">BA·BC = 0 ✓</text>
  <text x="400" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">D = (1,0) 存在 ✓</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">面积 = √2 · √2 = 2</text>
  <rect x="60" y="268" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">四个角轮流当直角顶点，答案都是 2；取最小得 2</text>
</svg>
