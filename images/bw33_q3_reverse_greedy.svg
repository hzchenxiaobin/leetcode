<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    逆向思考：把 nums 变回全 0
  </text>

  <!-- 正逆操作对照 -->
  <g filter="url(#rough2)">
    <rect x="46" y="52" width="180" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="136" y="74" text-anchor="middle" font-size="13" fill="#446688">正向（全 0 → nums）</text>
    <text x="136" y="96" text-anchor="middle" font-size="12" fill="#446688">单点 +1 ｜ 全体 ×2</text>
  </g>
  <path d="M 232 79 C 252 74, 262 74, 278 79" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="286" y="52" width="190" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="381" y="74" text-anchor="middle" font-size="13" fill="#2f5a24">逆向（nums → 全 0）</text>
    <text x="381" y="96" text-anchor="middle" font-size="12" fill="#2f5a24">单点 −1 ｜ 全体 ÷2（需全偶）</text>
  </g>

  <!-- 逆向链：nums=[1,5] -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="16"  y="150" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="47" y="175" fill="#333">[1,5]</text>
    <rect x="106" y="150" width="62" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="137" y="175" fill="#333">[1,4]</text>
    <rect x="196" y="150" width="62" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="227" y="175" fill="#333">[0,4]</text>
    <rect x="286" y="150" width="62" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="317" y="175" fill="#333">[0,2]</text>
    <rect x="376" y="150" width="62" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="407" y="175" fill="#333">[0,1]</text>
    <rect x="466" y="150" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="490" y="175" fill="#2f5a24">[0,0]</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M 80 168 C 88 164, 92 164, 100 168"/>
    <path d="M 170 168 C 178 164, 182 164, 190 168"/>
    <path d="M 260 168 C 268 164, 272 164, 280 168"/>
    <path d="M 350 168 C 358 164, 362 164, 370 168"/>
    <path d="M 440 168 C 446 164, 450 164, 460 168"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="11" fill="#666">
    <text x="90" y="144">5 奇 → −1</text>
    <text x="180" y="144">1 奇 → −1</text>
    <text x="270" y="144">全偶 → ÷2</text>
    <text x="360" y="144">全偶 → ÷2</text>
    <text x="450" y="144">1 奇 → −1</text>
  </g>

  <!-- 计数说明 -->
  <rect x="60" y="240" width="400" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    「−1」共 4 次（= Σpopcount），「÷2」共 1 次（= 最高位）
  </text>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">
    答案 = 4 + 1 = 5 ✓（示例 1）
  </text>

  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    有奇数时必须先减（除法对奇数不可用）；全偶非零就整体减半
  </text>
</svg>
