<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：出堆顺序与最终答案</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">球 (4,3)，洞 (0,1)；同距离时按指令串字典序决胜</text>
  <rect x="40" y="78" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="56" y="98" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="104" y="98" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">停止格</text>
  <text x="214" y="98" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">总距离</text>
  <text x="294" y="98" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">指令串</text>
  <text x="386" y="98" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="40" y="108" width="540" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="129" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="104" y="129" font-size="10.5" fill="#33506e" filter="url(#rough2)">(4,3)</text>
  <text x="214" y="129" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="294" y="129" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">""</text>
  <text x="386" y="129" font-size="10" fill="#666" filter="url(#rough2)">起点</text>
  <rect x="40" y="142" width="540" height="32" fill="#f6f8fb" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="104" y="163" font-size="10.5" fill="#33506e" filter="url(#rough2)">(4,2)</text>
  <text x="214" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="294" y="163" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="386" y="163" font-size="10" fill="#666" filter="url(#rough2)">左滚撞墙</text>
  <rect x="40" y="176" width="540" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="197" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="104" y="197" font-size="10.5" fill="#33506e" filter="url(#rough2)">(4,4)</text>
  <text x="214" y="197" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="294" y="197" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="386" y="197" font-size="10" fill="#666" filter="url(#rough2)">右滚撞墙</text>
  <rect x="40" y="210" width="540" height="32" fill="#f6f8fb" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="231" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="104" y="231" font-size="10.5" fill="#33506e" filter="url(#rough2)">(0,3)</text>
  <text x="214" y="231" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="294" y="231" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="386" y="231" font-size="10" fill="#666" filter="url(#rough2)">上滚到底</text>
  <rect x="40" y="244" width="540" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="265" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="104" y="265" font-size="10.5" fill="#33506e" filter="url(#rough2)">(0,2)</text>
  <text x="214" y="265" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="294" y="265" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">lu</text>
  <text x="386" y="265" font-size="10" fill="#666" filter="url(#rough2)">从 (4,2) 上滚</text>
  <rect x="40" y="278" width="540" height="32" fill="#f6f8fb" stroke="#cccccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="299" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="104" y="299" font-size="10.5" fill="#33506e" filter="url(#rough2)">(0,4)</text>
  <text x="214" y="299" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="294" y="299" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ur</text>
  <text x="386" y="299" font-size="10" fill="#666" filter="url(#rough2)">从 (0,3) 右滚</text>
  <rect x="40" y="312" width="540" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="56" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="104" y="333" font-size="10.5" fill="#33506e" filter="url(#rough2)">(0,1)</text>
  <text x="214" y="333" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="294" y="333" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">lul</text>
  <text x="386" y="333" font-size="10" fill="#666" filter="url(#rough2)">洞，返回答案</text>

  <path d="M 262 352 L 262 366" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="366" font-size="10" fill="#b85450" filter="url(#rough2)">第一次弹出洞</text>

  <text x="40" y="392" font-size="10" fill="#666" filter="url(#rough2)">同为 6 格的 "ul"（u → l）候选被第 7 行的 (6, "lul") 击败，因而没有入堆。</text>
  <text x="40" y="410" font-size="10" fill="#666" filter="url(#rough2)">注意 (0,3) 的上滚只花 4 格却先出堆，因为它距离更小 —— 距离优先于字典序。</text>
</svg>
