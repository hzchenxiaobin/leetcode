<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect x="-3" y="-3" width="726" height="386" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一次询问 = 给每个袋子发一个「数字」</text>

  <!-- 五个袋子卡片 -->
  <text x="624" y="46" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">隐藏袋（6 克）</text>

  <rect x="36" y="56" width="120" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 1</text>
  <text x="96" y="104" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a=1</text>
  <text x="96" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取 b=0</text>

  <rect x="168" y="56" width="120" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="228" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 2</text>
  <text x="228" y="104" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a=1</text>
  <text x="228" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取 b=1</text>

  <rect x="300" y="56" width="120" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 3</text>
  <text x="360" y="104" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a=2</text>
  <text x="360" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取 b=1</text>

  <rect x="432" y="56" width="120" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="492" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 4</text>
  <text x="492" y="104" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a=2</text>
  <text x="492" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">取 b=0</text>

  <rect x="564" y="56" width="120" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="624" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 5</text>
  <text x="624" y="104" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">a=2</text>
  <text x="624" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">取 b=2</text>

  <path d="M360,146 L360,166" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="170" width="624" height="66" fill="#fffdf6" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="64" y="194" font-size="12.5" fill="#333" filter="url(#rough2)">W = 7·(b1+b2+b3+b4+b5) − b_h ，其中 B = b1+…+b5 由我们自己选定</text>
  <text x="64" y="220" font-size="12.5" fill="#8a3030" filter="url(#rough2)">⇒ b_h = 7B − W ：回答只暴露「隐藏袋这一轮的数字」，与 7 克袋无关</text>

  <path d="M360,240 L360,262" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="266" width="300" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="198" y="290" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">一次询问 = 得到一位数字</text>
  <text x="198" y="312" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">k 轮 ⟹ 每个袋子拿到 k 位编码</text>

  <rect x="372" y="266" width="300" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="522" y="290" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">答案唯一 ⟺ 编码两两不同</text>
  <text x="522" y="312" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">第 i 位必须 ≤ a_i（取不出更多币）</text>

  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">于是问题变成：用最短的「互异编码」装下这些容量 —— f(a) 就是编码长度</text>
  <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">容量越大，可用的数字越多；容量为 1 的袋子每轮只能出 0 或 1</text>
</svg>
