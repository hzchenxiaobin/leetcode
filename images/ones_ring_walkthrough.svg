<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#fafafa"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 2 演算：九个环形窗口逐一走查</text>
  <path d="M 250 42 Q 440 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="60" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">nums = [0,1,1,1,0,0,1,1,0]　n = 9，t = 5</text>

  <!-- 线性排布 + 环形回绕 -->
  <g filter="url(#rough2)">
    <rect x="251" y="66" width="42" height="34" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6" rx="4"/>
    <rect x="293" y="66" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="335" y="66" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="377" y="66" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="419" y="66" width="42" height="34" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6" rx="4"/>
    <rect x="461" y="66" width="42" height="34" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6" rx="4"/>
    <rect x="503" y="66" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="545" y="66" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="587" y="66" width="42" height="34" fill="#ffffff" stroke="#99a6b3" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="272" y="88">0</text>
    <text x="314" y="88">1</text>
    <text x="356" y="88">1</text>
    <text x="398" y="88">1</text>
    <text x="440" y="88">0</text>
    <text x="482" y="88">0</text>
    <text x="524" y="88">1</text>
    <text x="566" y="88">1</text>
    <text x="608" y="88">0</text>
  </g>
  <g font-size="10" fill="#9aa5af" text-anchor="middle" filter="url(#rough2)">
    <text x="272" y="114">0</text>
    <text x="314" y="114">1</text>
    <text x="356" y="114">2</text>
    <text x="398" y="114">3</text>
    <text x="440" y="114">4</text>
    <text x="482" y="114">5</text>
    <text x="524" y="114">6</text>
    <text x="566" y="114">7</text>
    <text x="608" y="114">8</text>
  </g>
  <path d="M 606 122 Q 440 148 254 122" stroke="#888" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">环形：下标 8 与 0 相邻，窗口可跨首尾</text>

  <!-- 表头 -->
  <g text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="184" fill="#446688">起点 s</text>
    <text x="300" y="184" fill="#446688">覆盖下标</text>
    <text x="470" y="184" fill="#446688">窗口值</text>
    <text x="650" y="184" fill="#4a7a3a">1 的个数</text>
  </g>
  <path d="M 80 192 Q 440 197 720 192" stroke="#c5cdd6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 -->
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <!-- s 值 -->
    <g fill="#333">
      <text x="110" y="210">0</text>
      <text x="110" y="232">1</text>
      <text x="110" y="254">2</text>
      <text x="110" y="276">3</text>
      <text x="110" y="298">4</text>
      <text x="110" y="320">5</text>
      <text x="110" y="342">6</text>
      <text x="110" y="364">7</text>
      <text x="110" y="386">8</text>
    </g>
    <!-- 覆盖下标 -->
    <g fill="#556" font-family="monospace">
      <text x="300" y="210">0 – 4</text>
      <text x="300" y="232">1 – 5</text>
      <text x="300" y="254">2 – 6</text>
      <text x="300" y="276">3 – 7</text>
      <text x="300" y="298">4 – 8</text>
      <text x="300" y="320">5,6,7,8,0</text>
      <text x="300" y="342">6,7,8,0,1</text>
      <text x="300" y="364">7,8,0,1,2</text>
      <text x="300" y="386">8,0,1,2,3</text>
    </g>
    <!-- 跨界标记 -->
    <g fill="#d6a040" font-size="11">
      <text x="357" y="320">↻</text>
      <text x="357" y="342">↻</text>
      <text x="357" y="364">↻</text>
      <text x="357" y="386">↻</text>
    </g>
    <!-- 窗口值 -->
    <g fill="#333" font-family="monospace">
      <text x="470" y="210">0 1 1 1 0</text>
      <text x="470" y="232">1 1 1 0 0</text>
      <text x="470" y="254">1 1 0 0 1</text>
      <text x="470" y="276">1 0 0 1 1</text>
      <text x="470" y="298">0 0 1 1 0</text>
      <text x="470" y="320">0 1 1 0 0</text>
      <text x="470" y="342">1 1 0 0 1</text>
      <text x="470" y="364">1 0 0 1 1</text>
      <text x="470" y="386">0 0 1 1 1</text>
    </g>
  </g>

  <!-- 1 的个数（高亮最优） -->
  <g filter="url(#rough2)">
    <rect x="632" y="198" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="220" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="242" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="264" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="308" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="330" width="36" height="16" rx="5" fill="#e6f4ea"/>
    <rect x="632" y="352" width="36" height="16" rx="5" fill="#e6f4ea"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <g fill="#2e5e2e" font-weight="bold">
      <text x="650" y="210">3</text>
      <text x="650" y="232">3</text>
      <text x="650" y="254">3</text>
      <text x="650" y="276">3</text>
      <text x="650" y="342">3</text>
      <text x="650" y="364">3</text>
      <text x="650" y="386">3</text>
    </g>
    <g fill="#888">
      <text x="650" y="298">2</text>
      <text x="650" y="320">2</text>
    </g>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="402" width="760" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="440" y="428" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">max ones = 3 → 答案 = t − max = 5 − 3 = 2</text>
  <text x="440" y="452" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">取 s = 0 窗口：窗内 0 在下标 0、4 ↔ 窗外 1 在下标 6、7，两次交换 → [1,1,1,1,1,0,0,0,0]</text>
</svg>
