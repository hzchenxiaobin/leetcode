<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">第一步：揭穿神秘函数 —— func 就是区间按位与</text>
  <path d="M 230 42 Q 460 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: func code box ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="64" width="270" height="172" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="171" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">func 的真面目（题面递归定义）</text>
  <text x="52" y="112" font-size="11" fill="#333">func(arr, l, r):</text>
  <text x="68" y="131" font-size="11" fill="#333">if r &gt; l:</text>
  <text x="86" y="150" font-size="11" fill="#333">m = (l + r) / 2</text>
  <text x="86" y="169" font-size="11" fill="#333">return func(l, m)</text>
  <text x="98" y="188" font-size="11" fill="#333">&amp; func(m+1, r)</text>
  <text x="68" y="207" font-size="11" fill="#333">else:</text>
  <text x="86" y="226" font-size="11" fill="#333">return arr[l]</text>
  <g filter="url(#sk)">
    <rect x="36" y="280" width="270" height="108" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="171" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">剥开递归</text>
  <text x="52" y="326" font-size="10.5" fill="#444">· 长度 &gt; 1 就二分，两半的返回值</text>
  <text x="52" y="344" font-size="10.5" fill="#444">  再按位与；剥到底是单元素 arr[l]</text>
  <text x="52" y="366" font-size="10.5" fill="#444">· &amp; 满足结合律 ⇒ 与切分顺序无关，</text>
  <text x="52" y="384" font-size="10.5" fill="#444">  整棵树自底向上就是一路 &amp; 上去</text>

  <!-- ===== right: array ===== -->
  <text x="330" y="99" font-size="11" fill="#888" font-weight="bold">arr:</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="378" y="78" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="409" y="100" text-anchor="middle" fill="#2b6e9e" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="442" y="78" width="62" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="473" y="100" text-anchor="middle" fill="#7a5415" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="506" y="78" width="62" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="537" y="100" text-anchor="middle" fill="#7a5415" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="570" y="78" width="62" height="34" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
    <text x="601" y="100" text-anchor="middle" fill="#7a5415" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="634" y="78" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="665" y="100" text-anchor="middle" fill="#2b6e9e" font-weight="bold">15</text>
  </g>
  <text x="409" y="128" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="473" y="128" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="537" y="128" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="601" y="128" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="665" y="128" text-anchor="middle" font-size="10" fill="#999">4</text>
  <path d="M 443 136 L 443 148 Q 537 158 631 148 L 631 136" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="537" y="172" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">查询区间 [1, 3]</text>

  <!-- ===== callout ===== -->
  <g filter="url(#sk)">
    <rect x="690" y="64" width="196" height="40" rx="10" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.6"/>
  </g>
  <text x="788" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">func(arr, 1, 3) = ?</text>

  <!-- ===== recursion tree ===== -->
  <g filter="url(#sk)">
    <rect x="492" y="188" width="118" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="551" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">func(1, 3)</text>
  <path d="M 612 203 L 648 203" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="654" y="207" font-size="12" font-weight="bold" fill="#b03a3a">= 0 &amp; 7 = 0</text>

  <g filter="url(#sk)">
    <rect x="368" y="272" width="118" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="427" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">func(1, 2)</text>
  <path d="M 488 287 L 524 287" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="530" y="291" font-size="12" font-weight="bold" fill="#b03a3a">= 12 &amp; 3 = 0</text>

  <g filter="url(#sk)">
    <rect x="612" y="272" width="126" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="675" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">func(3, 3) = 7</text>

  <g filter="url(#sk)">
    <rect x="288" y="352" width="126" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="351" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">func(1, 1) = 12</text>

  <g filter="url(#sk)">
    <rect x="448" y="352" width="126" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="511" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">func(2, 2) = 3</text>

  <!-- tree edges -->
  <path d="M 545 220 Q 478 240 432 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 557 220 Q 624 240 668 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 421 302 Q 372 322 352 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 433 302 Q 482 322 505 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- AND junction circles -->
  <g filter="url(#sk)">
    <circle cx="551" cy="245" r="11" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="551" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">&amp;</text>
  <g filter="url(#sk)">
    <circle cx="427" cy="327" r="11" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="427" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">&amp;</text>

  <!-- ===== conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="404" width="850" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="56" y="426" font-size="12.5" font-weight="bold" fill="#2e6e2e">揭穿：func(arr, l, r) = arr[l] &amp; arr[l+1] &amp; ⋯ &amp; arr[r] —— 就是区间按位与</text>
  <text x="56" y="445" font-size="11" fill="#333">对区间长度做数学归纳即证（题解 §5 引理 1）；分治只是包装，先揭皮，再做题。</text>
</svg>
