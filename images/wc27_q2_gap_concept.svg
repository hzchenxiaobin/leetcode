  <text x="530" y="78" font-size="11.5" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">各位置的缝隙数</text>
  <rect x="380" y="92" width="46" height="54" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="403" y="111" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">x=1</text>
  <text x="403" y="134" font-size="17" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="438" y="92" width="46" height="54" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461" y="111" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">x=2</text>
  <text x="461" y="134" font-size="17" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="496" y="92" width="46" height="54" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="519" y="111" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">x=3</text>
