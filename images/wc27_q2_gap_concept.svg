  <text x="635" y="134" font-size="17" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="612" y="168" font-size="9.5" fill="#d6a040" text-anchor="end" filter="url(#rough2)">↑ 最多 4 条</text>
  <rect x="62" y="266" width="576" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="288" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">穿过砖块数 = n − cnt[x]</text>
  <text x="78" y="308" font-size="10.5" fill="#4a5a46" filter="url(#rough2)">竖线在 x 处贴缝滑过 cnt[x] 行，其余 n − cnt[x] 行被穿过</text>
  <rect x="62" y="328" width="576" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="348" font-size="9.8" fill="#7d4a46" filter="url(#rough2)">① 位置 0 与 total 是墙的两条竖直边缘，禁止画线</text>
  <text x="78" y="364" font-size="9.8" fill="#7d4a46" filter="url(#rough2)">　 → 每行只累计到「倒数第二块砖」的右边界</text>
  <text x="78" y="380" font-size="9.8" fill="#7d4a46" filter="url(#rough2)">② 非整数 x 必穿过全部 n 行 → 只需枚举整数缝隙坐标</text>
