<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：竖线沿「砖缝」走就不穿砖，缝隙重合越多、穿过的砖越少</text>
  <text x="350" y="50" font-size="11" fill="#777" text-anchor="middle" filter="url(#rough2)">每条砖缝的横坐标 = 该行砖宽的「前缀和」；统计所有前缀和的出现次数即可</text>
  <text x="62" y="70" font-size="10" fill="#888" filter="url(#rough2)">wall：6 行，总宽 6</text>
