  <text x="577" y="134" font-size="17" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="612" y="92" width="46" height="54" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
