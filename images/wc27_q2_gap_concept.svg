  <text x="322" y="252" font-size="9" fill="#b08a8a" filter="url(#rough2)">↑ 墙边缘，禁止画线</text>
  <path d="M 230 64 L 230 238" stroke="#b85450" stroke-width="2.4" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
