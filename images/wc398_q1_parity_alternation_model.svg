<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">奇偶沿数组交替：判定原子单位是 n−1 个间隙</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以 [2,1,4] 为例：每个间隙做一次末位异或，一位定音</text>

  <!-- 元素行 -->
  <rect x="110" y="56" width="88" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="154" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">2</text>
  <text x="154" y="93" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>
  <rect x="236" y="56" width="88" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="280" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">1</text>
  <text x="280" y="93" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">奇</text>
  <rect x="362" y="56" width="88" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="406" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">4</text>
  <text x="406" y="93" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">偶</text>

  <!-- 间隙锚点 -->
  <path d="M 217 102 L 217 112" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>
  <path d="M 343 102 L 343 112" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 2" filter="url(#r)"/>

  <!-- 间隙判定 -->
  <text x="217" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">✓ (2⊕1)&amp;1=1</text>
  <text x="343" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">✓ (1⊕4)&amp;1=1</text>

  <!-- 奇偶 bit 序列 -->
  <text x="102" y="156" text-anchor="end" font-size="10.5" fill="#888" filter="url(#r)">奇偶bit：</text>
  <rect x="110" y="134" width="88" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="154" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#r)">0</text>
  <rect x="236" y="134" width="88" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="280" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#r)">1</text>
  <rect x="362" y="134" width="88" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="406" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#r)">0</text>

  <text x="280" y="188" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">0,1,0 严格交替——全局只有 0101…（首偶）与 1010…（首奇）两种合法形态</text>

  <!-- 判定公式 -->
  <rect x="40" y="204" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="60" y="228" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#r)">特殊 ⟺ 对每个间隙 i：(nums[i] ⊕ nums[i−1]) &amp;1 = 1</text>
  <text x="60" y="250" font-size="11" fill="#888" filter="url(#r)">一次异或 + 一次按位与完成一次判定：末位相异（一奇一偶）时结果为 1</text>

  <!-- 首元素定调 -->
  <rect x="40" y="276" width="480" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="60" y="300" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">首元素定调：p_i ≡ p_0 + i (mod 2)——奇偶序列由起点唯一确定</text>
  <text x="60" y="322" font-size="11" fill="#888" filter="url(#r)">首奇 → 1010…，首偶 → 0101…：每个位置的「应有奇偶」O(1) 可算，无需看邻居</text>

  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">判定原子单位是间隙而非元素——Q2 就在这 n−1 个间隙上挂 0/1 违规位做前缀和</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">n = 1：没有间隙，条件空真 → true，循环不执行、无需特判</text>
</svg>
