<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="511" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">双指针归并演算：H=[7,1,1]↓，V=[5,3]↓ —— 每次取较大的头</text>
  <path d="M 120 40 Q 320 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sorted arrays -->
  <text x="82" y="78" font-size="12" font-weight="bold" fill="#446688">H（降序）</text>
  <g filter="url(#sk)">
    <rect x="150" y="58" width="46" height="32" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="196" y="58" width="46" height="32" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="242" y="58" width="46" height="32" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">
    <text x="173" y="79">7</text>
    <text x="219" y="79">1</text>
    <text x="265" y="79">1</text>
  </g>
  <text x="82" y="126" font-size="12" font-weight="bold" fill="#a06a20">V（降序）</text>
  <g filter="url(#sk)">
    <rect x="150" y="106" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="196" y="106" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a20">
    <text x="173" y="127">5</text>
    <text x="219" y="127">3</text>
  </g>
  <text x="330" y="78" font-size="11.5" fill="#666">两列各自降序、头对头比较取大者，</text>
  <text x="330" y="96" font-size="11.5" fill="#666">输出恰是全局“从贵到便宜”的切割序列</text>
  <text x="330" y="126" font-size="11.5" fill="#666">切水平线乘 v_cnt（竖条数）</text>
  <text x="330" y="144" font-size="11.5" fill="#666">切竖直线乘 h_cnt（横条数）</text>

  <!-- steps table -->
  <g filter="url(#sk)">
    <rect x="64" y="158" width="492" height="232" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" rx="6"/>
    <path d="M 64 190 L 556 190" stroke="#8a8a8a" stroke-width="1"/>
    <path d="M 64 230 L 556 230" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 64 270 L 556 270" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 64 310 L 556 310" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 64 350 L 556 350" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 116 158 L 116 390" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 240 158 L 240 390" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 392 158 L 392 390" stroke="#c9c9c9" stroke-width="1"/>
    <path d="M 466 158 L 466 390" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">
    <text x="90" y="177">步骤</text>
    <text x="178" y="177">取线</text>
    <text x="316" y="177">乘数 = 另一方向块数</text>
    <text x="429" y="177">代价</text>
    <text x="511" y="177">累计</text>
  </g>
  <g filter="url(#sk)">
    <rect x="156" y="198" width="44" height="24" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="156" y="238" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="156" y="278" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="156" y="318" width="44" height="24" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="156" y="358" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold">
    <text x="90" y="214" fill="#555">①</text>
    <text x="90" y="254" fill="#555">②</text>
    <text x="90" y="294" fill="#555">③</text>
    <text x="90" y="334" fill="#555">④</text>
    <text x="90" y="374" fill="#555">⑤</text>
    <text x="178" y="215" fill="#446688">h=7</text>
    <text x="178" y="255" fill="#a06a20">v=5</text>
    <text x="178" y="295" fill="#a06a20">v=3</text>
    <text x="178" y="335" fill="#446688">h=1</text>
    <text x="178" y="375" fill="#446688">h=1</text>
    <text x="316" y="214" fill="#666">v_cnt = 1</text>
    <text x="316" y="254" fill="#666">h_cnt = 2</text>
    <text x="316" y="294" fill="#666">h_cnt = 2</text>
    <text x="316" y="334" fill="#666">v_cnt = 3</text>
    <text x="316" y="374" fill="#666">v_cnt = 3</text>
    <text x="429" y="214" fill="#2b2b2b">7×1 = 7</text>
    <text x="429" y="254" fill="#2b2b2b">5×2 = 10</text>
    <text x="429" y="294" fill="#2b2b2b">3×2 = 6</text>
    <text x="429" y="334" fill="#2b2b2b">1×3 = 3</text>
    <text x="429" y="374" fill="#2b2b2b">1×3 = 3</text>
    <text x="511" y="214" fill="#2b2b2b">7</text>
    <text x="511" y="254" fill="#2b2b2b">17</text>
    <text x="511" y="294" fill="#2b2b2b">23</text>
    <text x="511" y="334" fill="#2b2b2b">26</text>
    <text x="511" y="374" fill="#2e6e2e">29 ✓</text>
  </g>
  <text x="64" y="408" font-size="11" fill="#666">h_cnt / v_cnt：已切穿的横 / 竖线计数，初值为 1（整块蛋糕本身算 1 条）</text>

  <!-- bottom check box -->
  <g filter="url(#sk)">
    <rect x="40" y="422" width="560" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">闭式复核：(7+1+1+5+3) + (5+3+1+1+1+1) = 17 + 12 = 29 ✓ —— 贪心与闭式两路互验</text>
</svg>
