<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：最终字符串可以是「多个相同字符」</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula box -->
  <g filter="url(#sk)">
    <rect x="110" y="58" width="420" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">删除代价 = total − 保留字符的代价和</text>

  <!-- Left panel: WRONG (keep only one) -->
  <g filter="url(#sk)">
    <rect x="40" y="112" width="270" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="175" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">✗ 误以为只能保留「一个」字符</text>
  <text x="175" y="158" text-anchor="middle" font-size="12" fill="#7a3b38" filter="url(#sk)">s = "aa", cost = [5, 100]</text>
  <g filter="url(#sk)">
    <rect x="103" y="170" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b85450" stroke-width="1.8"/>
    <rect x="203" y="170" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="125" y="199" text-anchor="middle" font-size="17" fill="#7a3b38" font-weight="bold" filter="url(#sk)">a</text>
  <text x="225" y="199" text-anchor="middle" font-size="17" fill="#7a3b38" font-weight="bold" filter="url(#sk)">a</text>
  <text x="125" y="228" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">5</text>
  <text x="225" y="228" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">100</text>
  <path d="M 108 175 L 142 209 M 142 175 L 108 209" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <text x="175" y="250" text-anchor="middle" font-size="12" fill="#7a3b38" font-family="monospace" filter="url(#sk)">删 5：代价 = 5（不是最优！）</text>

  <!-- Right panel: CORRECT (keep all same letter) -->
  <g filter="url(#sk)">
    <rect x="330" y="112" width="270" height="150" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="465" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 同一字母可以「全部保留」</text>
  <text x="465" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">s = "aa", cost = [5, 100]</text>
  <g filter="url(#sk)">
    <rect x="393" y="170" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="493" y="170" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="415" y="199" text-anchor="middle" font-size="17" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="515" y="199" text-anchor="middle" font-size="17" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="415" y="228" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">5</text>
  <text x="515" y="228" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">100</text>
  <text x="465" y="250" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">一个都不删：代价 = 0 ✓</text>

  <!-- Why box -->
  <g filter="url(#sk)">
    <rect x="40" y="278" width="560" height="52" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#sk)">因为 cost[i] ≥ 1 > 0：固定字母时，多保留一个就少删一个</text>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">→ 保留集合越大，保留和越大，删除代价越小 → 全保留最优</text>

  <!-- Final formula -->
  <g filter="url(#sk)">
    <rect x="90" y="346" width="460" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">答案 = total − max(每个字母的代价和)</text>
  <text x="320" y="384" text-anchor="middle" font-size="10" fill="#8aa8c0" filter="url(#sk)">哪个字母的「总代价」最大，就保留哪个字母的全部出现</text>
</svg>
