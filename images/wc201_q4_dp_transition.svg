<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间 DP：按「第一刀切在哪」拆分</text>

  <g filter="url(#rough2)">
    <circle cx="66" cy="50" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="80" y="54" font-size="11.5" fill="#666">哨兵（补上的 0 和 n）</text>
    <circle cx="250" cy="50" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="264" y="54" font-size="11.5" fill="#666">切割点</text>
    <circle cx="360" cy="50" r="8" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="374" y="54" font-size="11.5" fill="#666">当前枚举的第一刀 k</text>

    <text x="100" y="86" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="188" y="86" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="276" y="86" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="364" y="86" text-anchor="middle" font-size="11" fill="#999">3</text>
    <text x="452" y="86" text-anchor="middle" font-size="11" fill="#999">4</text>
    <text x="540" y="86" text-anchor="middle" font-size="11" fill="#999">5</text>
    <text x="302" y="90" font-size="12" font-weight="bold" fill="#b85450">← k</text>

    <circle cx="100" cy="112" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="188" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="276" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="364" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="452" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="540" cy="112" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="100" y="117" text-anchor="middle" font-size="13" fill="#b07818">0</text>
    <text x="188" y="117" text-anchor="middle" font-size="13" fill="#2b4a66">1</text>
    <text x="276" y="117" text-anchor="middle" font-size="13" fill="#2b4a66">3</text>
    <text x="364" y="117" text-anchor="middle" font-size="13" fill="#2b4a66">4</text>
    <text x="452" y="117" text-anchor="middle" font-size="13" fill="#2b4a66">5</text>
    <text x="540" y="117" text-anchor="middle" font-size="13" fill="#b07818">7</text>
    <text x="60" y="117" text-anchor="end" font-size="11.5" fill="#777">c =</text>
    <circle cx="276" cy="112" r="23" fill="none" stroke="#b85450" stroke-width="2"/>

    <path d="M 100 138 L 100 152 L 540 152 L 540 138" fill="none" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">状态 dp[i][j]：把开区间 (c[i], c[j]) 内的所有切割点切完的最小成本</text>
    <text x="320" y="194" text-anchor="middle" font-size="11.5" fill="#888">例：dp[0][5] 处理整根木棍 [0, 7]；dp[i][i+1] = 0（相邻两点间没有切割点）</text>

    <path d="M 100 204 L 100 218 L 252 218 L 252 204" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    <path d="M 300 204 L 300 218 L 540 218 L 540 204" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="176" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d28">左段 (i, k) → dp[i][k]</text>
    <text x="420" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d28">右段 (k, j) → dp[k][j]</text>

    <text x="320" y="266" text-anchor="middle" font-size="12" fill="#333">第一刀切在 c[k]：此刻木棍还是完整的 [c[i], c[j]]，这刀成本恰为 <tspan fill="#b85450" font-weight="bold">c[j] − c[i]</tspan>，与后续无关</text>

    <rect x="50" y="280" width="540" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a66">dp[i][j] = (c[j] − c[i]) + min { dp[i][k] + dp[k][j] : i &lt; k &lt; j }</text>
    <text x="320" y="328" text-anchor="middle" font-size="11.5" fill="#446688">边界 dp[i][i+1] = 0；答案 = dp[0][m+1]（m = len(cuts)）</text>

    <rect x="140" y="356" width="360" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="320" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d28">实现顺序：按区间长度 L = j − i 从小到大（或记忆化搜索）</text>

    <rect x="50" y="396" width="540" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="320" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">为什么「枚举第一刀」可行？</text>
    <text x="320" y="436" text-anchor="middle" font-size="11" fill="#666">第一刀成本 = c[j] − c[i] 只依赖本区间；切完后左右两段完全独立，可自由拼接。</text>
    <text x="320" y="452" text-anchor="middle" font-size="11" fill="#666">对比 312. 戳气球：得分依赖左右邻居，「第一戳」不可行，只能枚举「最后一戳」。</text>
  </g>
</svg>
