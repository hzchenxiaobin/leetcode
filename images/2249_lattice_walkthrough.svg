    <rect x="377" y="82" width="96" height="26"/>
    <rect x="473" y="82" width="96" height="26"/>
    <rect x="569" y="82" width="58" height="26"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#444444">
