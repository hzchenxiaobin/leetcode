    <text x="521" y="99" text-anchor="middle" filter="url(#sk)">圆 B 区间</text>
    <text x="598" y="99" text-anchor="middle" filter="url(#sk)">点数</text>
  </g>
  <g filter="url(#sk)" fill="#ffffff" stroke="#aaaaaa" stroke-width="1">
    <rect x="335" y="108" width="42" height="28"/><rect x="377" y="108" width="96" height="28"/><rect x="473" y="108" width="96" height="28"/><rect x="569" y="108" width="58" height="28"/>
    <rect x="335" y="136" width="42" height="28"/><rect x="377" y="136" width="96" height="28"/><rect x="473" y="136" width="96" height="28"/><rect x="569" y="136" width="58" height="28"/>
    <rect x="335" y="164" width="42" height="28"/><rect x="377" y="164" width="96" height="28"/><rect x="473" y="164" width="96" height="28"/><rect x="569" y="164" width="58" height="28"/>
  </g>
  <g filter="url(#sk)" fill="#fce4ec" stroke="#b85450" stroke-width="1.4">
    <rect x="335" y="192" width="42" height="28"/><rect x="377" y="192" width="96" height="28"/><rect x="473" y="192" width="96" height="28"/><rect x="569" y="192" width="58" height="28"/>
    <rect x="335" y="220" width="42" height="28"/><rect x="377" y="220" width="96" height="28"/><rect x="473" y="220" width="96" height="28"/><rect x="569" y="220" width="58" height="28"/>
  </g>
  <g filter="url(#sk)" fill="#ffffff" stroke="#aaaaaa" stroke-width="1">
    <rect x="335" y="248" width="42" height="28"/><rect x="377" y="248" width="96" height="28"/><rect x="473" y="248" width="96" height="28"/><rect x="569" y="248" width="58" height="28"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="356" y="126" text-anchor="middle" filter="url(#sk)">0</text><text x="425" y="126" text-anchor="middle" filter="url(#sk)">[2, 2]</text><text x="521" y="126" text-anchor="middle" filter="url(#sk)">—</text><text x="598" y="126" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="356" y="154" text-anchor="middle" filter="url(#sk)">1</text><text x="425" y="154" text-anchor="middle" filter="url(#sk)">[1, 3]</text><text x="521" y="154" text-anchor="middle" filter="url(#sk)">—</text><text x="598" y="154" text-anchor="middle" filter="url(#sk)">3</text>
    <text x="356" y="182" text-anchor="middle" filter="url(#sk)">2</text><text x="425" y="182" text-anchor="middle" filter="url(#sk)">[0, 4]</text><text x="521" y="182" text-anchor="middle" filter="url(#sk)">—</text><text x="598" y="182" text-anchor="middle" filter="url(#sk)">5</text>
    <text x="356" y="210" text-anchor="middle" filter="url(#sk)">3</text><text x="425" y="210" text-anchor="middle" filter="url(#sk)">[1, 3]</text><text x="521" y="210" text-anchor="middle" filter="url(#sk)">[3, 3]</text><text x="598" y="210" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
    <text x="356" y="238" text-anchor="middle" filter="url(#sk)">4</text><text x="425" y="238" text-anchor="middle" filter="url(#sk)">[2, 2]</text><text x="521" y="238" text-anchor="middle" filter="url(#sk)">[2, 4]</text><text x="598" y="238" text-anchor="middle" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
    <text x="356" y="266" text-anchor="middle" filter="url(#sk)">5</text><text x="425" y="266" text-anchor="middle" filter="url(#sk)">—</text><text x="521" y="266" text-anchor="middle" filter="url(#sk)">[3, 3]</text><text x="598" y="266" text-anchor="middle" filter="url(#sk)">1</text>
  </g>
  <text x="495" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">红色行：两圆都覆盖到该行，需去重</text>

  <!-- inclusion-exclusion box -->
  <g filter="url(#sk)">
    <rect x="335" y="304" width="292" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="481" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">容斥核对</text>
  <text x="481" y="347" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">|A| = 13，|B| = 5，|A∩B| = 2</text>
  <text x="481" y="369" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">13 + 5 − 2 = 16 ✓</text>

  <!-- idempotent note box -->
  <g filter="url(#sk)">
    <rect x="335" y="390" width="292" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="481" y="412" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">布尔矩阵重复置位天然幂等</text>
  <text x="481" y="432" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">去重自动完成，无需显式容斥</text>
</svg>
