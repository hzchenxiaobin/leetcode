  </g>
  <text x="296" y="202" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">py=3</text>
  <text x="296" y="158" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">py=4</text>

