    <ellipse cx="202" cy="198" rx="10.5" ry="9.5" fill="none" stroke="#b85450" stroke-width="1.1"/>
    <circle cx="158" cy="154" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <ellipse cx="158" cy="154" rx="10.5" ry="9.5" fill="none" stroke="#b85450" stroke-width="1.1"/>
  </g>

  <!-- legend -->
  <g filter="url(#sk)" fill="#e8f0fe" stroke="#446688" stroke-width="1.8">
    <circle cx="82" cy="362" r="4.5"/>
  </g>
  <text x="92" y="366" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">仅 A：11</text>
  <g filter="url(#sk)" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8">
    <circle cx="152" cy="362" r="4.5"/>
  </g>
  <text x="162" y="366" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">仅 B：3</text>
  <g filter="url(#sk)">
    <circle cx="212" cy="362" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="224" y="366" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">重叠：2</text>
  <text x="170" y="386" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">重叠点 (3,3)、(2,4) 只计一次</text>

  <!-- right: per-row span table -->
  <text x="495" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逐行区间走查（该行被覆盖的 px 范围）</text>
  <g filter="url(#sk)" fill="#f0eee9" stroke="#999999" stroke-width="1">
