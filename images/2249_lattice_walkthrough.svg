    <text x="114" y="346" text-anchor="middle">1</text>
    <text x="158" y="346" text-anchor="middle">2</text>
    <text x="202" y="346" text-anchor="middle">3</text>
    <text x="246" y="346" text-anchor="middle">4</text>
    <text x="290" y="346" text-anchor="middle">5</text>
