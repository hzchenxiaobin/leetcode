<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：circles = [[2,2,2],[3,4,1]]，答案 16</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: grid with two circles -->
  <g filter="url(#sk)" stroke="#b9b9b9" stroke-width="1">
    <line x1="70" y1="110" x2="70" y2="330"/>
    <line x1="114" y1="110" x2="114" y2="330"/>
    <line x1="158" y1="110" x2="158" y2="330"/>
    <line x1="202" y1="110" x2="202" y2="330"/>
    <line x1="246" y1="110" x2="246" y2="330"/>
    <line x1="290" y1="110" x2="290" y2="330"/>
    <line x1="70" y1="110" x2="290" y2="110"/>
