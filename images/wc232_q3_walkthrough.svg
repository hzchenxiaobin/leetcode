<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 435"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="620" height="435" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：4 个名额的堆顶轮换</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">classes = [[2,4],[3,9],[4,5],[2,10]]，extraStudents = 4</text>

  <!-- 表头 -->
  <text x="42" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">步</text>
  <text x="116" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">A 班</text>
  <text x="216" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">B 班</text>
  <text x="316" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">C 班</text>
  <text x="416" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">D 班</text>
  <text x="533" y="68" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">堆顶选择</text>
  <line x1="24" y1="76" x2="596" y2="76" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Row 1：初始，选 A -->
  <circle cx="42" cy="106" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="111" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="72" y="82" width="88" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="116" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">A (2,4)</text>
  <text x="116" y="121" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">g=0.100 ★</text>
  <rect x="172" y="82" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="102" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B (3,9)</text>
  <text x="216" y="121" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.067</text>
  <rect x="272" y="82" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="102" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">C (4,5)</text>
  <text x="316" y="121" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.033</text>
  <rect x="372" y="82" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="102" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">D (2,10)</text>
  <text x="416" y="121" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.073</text>
  <rect x="470" y="86" width="126" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="111" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">→ 给 A</text>

  <!-- Row 2：选 D -->
  <circle cx="42" cy="166" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="171" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="72" y="142" width="88" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="162" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">A (3,5)</text>
  <text x="116" y="181" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=0.067</text>
  <rect x="172" y="142" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="162" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B (3,9)</text>
  <text x="216" y="181" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.067</text>
  <rect x="272" y="142" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="162" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">C (4,5)</text>
  <text x="316" y="181" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.033</text>
  <rect x="372" y="142" width="88" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="416" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">D (2,10)</text>
  <text x="416" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">g=0.073 ★</text>
  <rect x="470" y="146" width="126" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="171" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">→ 给 D</text>

  <!-- Row 3：A/B 平局，选 A -->
  <circle cx="42" cy="226" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="231" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="72" y="202" width="88" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="116" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">A (3,5)</text>
  <text x="116" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">g=0.067 ★</text>
  <rect x="172" y="202" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="196" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">平局!</text>
  <text x="216" y="222" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B (3,9)</text>
  <text x="216" y="241" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">g=0.067</text>
  <rect x="272" y="202" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="222" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">C (4,5)</text>
  <text x="316" y="241" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.033</text>
  <rect x="372" y="202" width="88" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="222" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">D (3,11)</text>
  <text x="416" y="241" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=0.061</text>
  <rect x="470" y="206" width="126" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="231" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">→ 给 A（B 亦可）</text>

  <!-- Row 4：选 B -->
  <circle cx="42" cy="286" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="291" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="72" y="262" width="88" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="282" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">A (4,6)</text>
  <text x="116" y="301" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=0.048</text>
  <rect x="172" y="262" width="88" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="216" y="282" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">B (3,9)</text>
  <text x="216" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">g=0.067 ★</text>
  <rect x="272" y="262" width="88" height="48" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="282" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">C (4,5)</text>
  <text x="316" y="301" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">g=0.033</text>
  <rect x="372" y="262" width="88" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="282" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">D (3,11)</text>
  <text x="416" y="301" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g=0.061</text>
  <rect x="470" y="266" width="126" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="291" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">→ 给 B</text>

  <!-- 汇总 -->
  <rect x="24" y="330" width="572" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">最终：A = 4/6，B = 4/10，C = 4/5，D = 3/11</text>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">sum = 353/165 ≈ 2.1394，平均 = 353/660 ≈ 0.53485 ✓</text>

  <text x="310" y="414" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">Step 3 中 A、B 增益同为 1/15（平局）：先给谁都不影响最终各班人数 —— 最优值与平局破开方式无关</text>
</svg>
