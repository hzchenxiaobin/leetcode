<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="680" height="410" fill="#fafafa"/>

  <text x="340" y="36" font-size="19" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">预算 vs 需求：把拼写化成逐字母比较</text>
  <text x="340" y="58" font-size="12" fill="#777777" text-anchor="middle" filter="url(#rough2)">预算只统计一次，每个单词各自复制一份来消耗</text>
  <rect x="28" y="74" width="300" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="44" y="98" font-size="13" fill="#2f4f6f" text-anchor="start" font-weight="bold" filter="url(#rough2)">chars = "atach" → 预算 budget</text>
  <rect x="44" y="118" width="60" height="36" fill="#eef4ff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="74.0" y="140.68" font-size="13" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">a×2</text>
  <rect x="116" y="118" width="60" height="36" fill="#eef4ff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="146.0" y="140.68" font-size="13" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">t×1</text>
  <rect x="188" y="118" width="60" height="36" fill="#eef4ff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="218.0" y="140.68" font-size="13" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">c×1</text>
  <rect x="260" y="118" width="60" height="36" fill="#eef4ff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="140.68" font-size="13" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">h×1</text>
  <text x="44" y="178" font-size="11.5" fill="#5b6b80" text-anchor="start" filter="url(#rough2)">其余 22 个字母的预算都是 0</text>
  <rect x="352" y="74" width="300" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="368" y="98" font-size="13" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">判据：26 个分量逐个比较</text>
  <text x="368" y="132" font-size="13.5" fill="#5a4a1a" text-anchor="start" filter="url(#rough2)">need[c] ≤ budget[c]（对全部 c）</text>
  <text x="368" y="158" font-size="11.5" fill="#8a7a4a" text-anchor="start" filter="url(#rough2)">26 个整数比较，常数时间完成</text>
  <path d="M 332 133 L 348 133" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="216" width="300" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="44" y="244" font-size="13.5" fill="#2f5f22" text-anchor="start" font-weight="bold" filter="url(#rough2)">词 "cat" → 需求 c1 a1 t1</text>
  <rect x="44" y="260" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="72.0" y="281.68" font-size="13" fill="#2f5f22" text-anchor="middle" filter="url(#rough2)">c×1</text>
  <rect x="108" y="260" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="136.0" y="281.68" font-size="13" fill="#2f5f22" text-anchor="middle" filter="url(#rough2)">a×1</text>
  <rect x="172" y="260" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200.0" y="281.68" font-size="13" fill="#2f5f22" text-anchor="middle" filter="url(#rough2)">t×1</text>
  <text x="44" y="322" font-size="12.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">三个字母都在预算内</text>
  <text x="44" y="352" font-size="15" fill="#3a6a2a" text-anchor="start" font-weight="bold" filter="url(#rough2)">✓ 好串，累计 +3</text>
  <rect x="352" y="216" width="300" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="368" y="244" font-size="13.5" fill="#8a2f2c" text-anchor="start" font-weight="bold" filter="url(#rough2)">词 "tree" → 需求 t1 r1 e2</text>
  <rect x="368" y="260" width="56" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="396.0" y="281.68" font-size="13" fill="#8a2f2c" text-anchor="middle" filter="url(#rough2)">t×1</text>
  <rect x="432" y="260" width="56" height="34" fill="#f8ccd4" stroke="#8a2f2c" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460.0" y="281.68" font-size="13" fill="#8a2f2c" text-anchor="middle" filter="url(#rough2)">r×1</text>
  <rect x="496" y="260" width="56" height="34" fill="#f8ccd4" stroke="#8a2f2c" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="524.0" y="281.68" font-size="13" fill="#8a2f2c" text-anchor="middle" filter="url(#rough2)">e×2</text>
  <text x="368" y="322" font-size="12.5" fill="#8a2f2c" text-anchor="start" filter="url(#rough2)">r 与 e 的预算为 0，直接超支</text>
  <text x="368" y="352" font-size="15" fill="#8a2f2c" text-anchor="start" font-weight="bold" filter="url(#rough2)">✗ 坏串，累计不变</text>
  <path d="M 178 194 L 178 212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 502 194 L 502 212" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
