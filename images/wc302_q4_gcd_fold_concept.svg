<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：「x 整除全部 dᵢ」⟺「x 整除 g = gcd(dᵢ)」</text>

  <!-- numsDivide row -->
  <text x="112" y="72" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">numsDivide</text>
  <rect x="130" y="52" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="186" y="52" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="242" y="52" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="298" y="52" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="354" y="52" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <text x="412" y="72" font-size="10" fill="#999" filter="url(#rough2)">（m ≤ 10⁵ 个）</text>

  <!-- funnel arrows into g -->
  <path d="M 151 86 Q 180 115 225 136" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 207 86 Q 230 112 250 136" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 263 86 Q 265 110 265 136" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 319 86 Q 300 112 280 136" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 375 86 Q 330 115 305 136" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">gcd 折叠</text>
  <text x="82" y="128" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">O(m log V)</text>

  <!-- g box -->
  <rect x="200" y="138" width="130" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="165" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g = gcd = 3</text>
  <path d="M 334 160 L 424 160" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="164" font-size="10.5" fill="#666" filter="url(#rough2)">g 整除每个 dᵢ（传递性桥梁）</text>

  <!-- candidates -->
  <text x="330" y="214" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">从 nums 中取候选 x，只问一句：g % x == 0 ?</text>
  <path d="M 171 222 Q 210 205 238 186" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 281 222 Q 281 202 279 186" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 391 222 Q 340 205 302 186" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="86" y="246" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums 的</text>
  <text x="86" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">候选 x</text>

  <rect x="150" y="226" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="260" y="226" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="281" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="370" y="226" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <text x="171" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 % 2 = 1 ✗</text>
  <text x="281" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 % 3 = 0 ✓</text>
  <text x="391" y="278" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 % 4 = 3 ✗</text>
  <text x="171" y="296" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不整除 g</text>
  <text x="281" y="296" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">x*（最小合格者）</text>
  <text x="391" y="296" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不整除 g</text>

  <!-- bottom equivalence note -->
  <rect x="60" y="316" width="540" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330" y="338" text-anchor="middle" font-size="11" fill="#a08030" filter="url(#rough2)">⟸ 传递性：x | g 且 g | dᵢ ⟹ x | dᵢ —— 判定只要 1 次取模</text>
  <text x="330" y="358" text-anchor="middle" font-size="11" fill="#a08030" filter="url(#rough2)">⟹ Bézout：g = Σ cᵢ·dᵢ 是整系数组合，x 整除每个 dᵢ 则 x | g</text>
  <text x="330" y="378" text-anchor="middle" font-size="11" fill="#a08030" filter="url(#rough2)">验证成本：O(m) 次取模 → O(1)（一次 gcd 预处理换来）</text>
</svg>
