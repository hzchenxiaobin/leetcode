<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：逐窗口「收集 → 排序去重 → 查相邻差」，窗口之间互相独立</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left flow ===== -->
  <g filter="url(#sk)"><rect x="80" y="70" width="280" height="52" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="8"/></g>
  <text x="220" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">枚举窗口左上角 (i, j)</text>
  <text x="220" y="112" text-anchor="middle" font-size="11" fill="#666">0 ≤ i ≤ m−k，0 ≤ j ≤ n−k</text>

  <path d="M 220,122 L 220,156" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="160" width="280" height="52" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="8"/></g>
  <text x="220" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">收集窗口内 k² 个值</text>
  <text x="220" y="202" text-anchor="middle" font-size="11" fill="#666">i ≤ x &lt; i+k，j ≤ y &lt; j+k</text>

  <path d="M 220,212 L 220,246" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="250" width="280" height="52" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="8"/></g>
  <text x="220" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">排序 + 去重</text>
  <text x="220" y="292" text-anchor="middle" font-size="11" fill="#666">sort → unique，得 T 个互异值</text>

  <path d="M 220,302 L 220,340" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="220,344 355,392 220,440 85,392" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="220" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">只剩 1 个值？</text>

  <path d="M 220,440 L 220,468" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="232" y="460" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk)"><rect x="100" y="472" width="240" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="8"/></g>
  <text x="220" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans[i][j] = 0</text>
  <text x="220" y="512" text-anchor="middle" font-size="11" fill="#555">（k = 1 或窗口值全相同）</text>

  <path d="M 355,392 L 448,392" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="392" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">否</text>

  <g filter="url(#sk)"><rect x="452" y="366" width="270" height="52" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="8"/></g>
  <text x="587" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">扫描相邻差</text>
  <text x="587" y="408" text-anchor="middle" font-size="11" fill="#666">min(v[t] − v[t−1])，1 ≤ t &lt; T</text>

  <path d="M 587,418 L 587,468" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="452" y="472" width="270" height="48" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="8"/></g>
  <text x="587" y="501" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">ans[i][j] = 最小相邻差</text>

  <!-- loop back -->
  <path d="M 722,496 L 764,496" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>
  <path d="M 340,510 Q 560,552 780,524" stroke="#999" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arK)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="768" y="472" width="140" height="48" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" rx="8"/></g>
  <text x="838" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">下一个窗口</text>
  <text x="838" y="512" text-anchor="middle" font-size="10" fill="#999">(i, j) 右移 / 下移</text>

  <!-- ===== right annotation ===== -->
  <g filter="url(#sk)"><rect x="430" y="70" width="480" height="260" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" rx="8"/></g>
  <text x="450" y="96" font-size="13" font-weight="bold" fill="#7a5415">实现要点</text>
  <text x="450" y="124" font-size="11" fill="#444">· 窗口彼此独立：无需前缀和 / DP / 增量维护，逐个重算即可</text>
  <text x="450" y="150" font-size="11" fill="#444">· 去重不能省：重复值之间不算「不同值」，不去重会出假 0</text>
  <text x="450" y="176" font-size="11" fill="#444">· 单值分支不能省：k = 1 或窗口全相同时直接置 0</text>
  <text x="450" y="202" font-size="11" fill="#444">· 排序后相邻差天然非负，负数无需特殊处理</text>
  <text x="450" y="228" font-size="11" fill="#444">· 规模上界：窗口至多 900 个 × 每窗至多 900 个值</text>
  <text x="450" y="254" font-size="11" font-weight="bold" fill="#b03a3a">· 总搬运量 ≤ (m+1)²(n+1)²/16 ≈ 5.8×10⁴（AM–GM），放心暴力</text>
  <text x="450" y="286" font-size="11" fill="#888">复杂度 O((m−k+1)(n−k+1)·k²·log k)，m = n = 30 时毫秒级</text>
</svg>
