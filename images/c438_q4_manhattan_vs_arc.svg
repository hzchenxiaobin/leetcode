<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">引理图解：曼哈顿 ≤ 两条弧；x ≤ s 时「两弧 ≥ x ⟺ 曼哈顿 ≥ x」</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="165" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">① 任意两点：曼哈顿 ≤ 两条弧</text>
  <g filter="url(#sk)">
    <rect x="70" y="80" width="170" height="170" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M140,250 L240,250 L240,180" stroke="#4a8edb" stroke-width="3.5" fill="none"/>
    <path d="M140,250 L70,250 L70,80 L240,80 L240,180" stroke="#c98a2b" stroke-width="2.5" fill="none" stroke-dasharray="7,5"/>
    <path d="M140,250 L140,180 L240,180" stroke="#b85450" stroke-width="3" fill="none"/>
    <circle cx="140" cy="250" r="5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="240" cy="180" r="5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
  </g>
  <text x="140" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">A</text>
  <text x="252" y="184" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450">B</text>
  <text x="203" y="264" text-anchor="middle" font-size="10" fill="#2b6e9e">弧₁（顺时针）</text>
  <text x="155" y="70" text-anchor="middle" font-size="10" fill="#7a5415">弧₂（逆时针）</text>
  <text x="133" y="218" text-anchor="end" font-size="10" fill="#b85450">曼哈顿（轴对齐最短路）</text>
  <text x="155" y="294" text-anchor="middle" font-size="10.5" fill="#888">两条弧都是轴对齐路径 ⟹ 曼哈顿 ≤ min(弧₁, 弧₂)（永远成立）</text>

  <text x="505" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">② 同边 / 邻边：曼哈顿 = 过共角的短弧</text>
  <g filter="url(#sk)">
    <rect x="420" y="80" width="160" height="170" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M450,250 L580,250 L580,185" stroke="#b85450" stroke-width="5" fill="none"/>
    <path d="M450,250 L580,250 L580,185" stroke="#4a8edb" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
    <circle cx="450" cy="250" r="5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="580" cy="185" r="5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="580" cy="250" r="7" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  <text x="450" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">A</text>
  <text x="592" y="189" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450">B</text>
  <text x="580" y="270" text-anchor="middle" font-size="10" fill="#b85450">共角 C</text>
  <text x="505" y="294" text-anchor="middle" font-size="10" fill="#888">红蓝重合：过共角恰走完 |Δx| 与 |Δy|，弧长 = 曼哈顿（≤ 2s，是短弧）</text>

  <text x="340" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">③ 对边：弧长虚高 —— 与曼哈顿差出近 s</text>
  <g filter="url(#sk)">
    <rect x="80" y="345" width="100" height="90" fill="none" stroke="#bbb" stroke-width="2"/>
    <path d="M100,435 L180,435 L180,345 L150,345" stroke="#4a8edb" stroke-width="3" fill="none"/>
    <path d="M100,435 L80,435 L80,345 L150,345" stroke="#c98a2b" stroke-width="2.5" fill="none" stroke-dasharray="7,5"/>
    <path d="M100,435 L150,435 L150,345" stroke="#b85450" stroke-width="3" fill="none"/>
    <circle cx="100" cy="435" r="4.5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
    <circle cx="150" cy="345" r="4.5" fill="#b85450" stroke="#7a3030" stroke-width="1.5"/>
  </g>
  <text x="100" y="453" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">A</text>
  <text x="150" y="337" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">B</text>
  <text x="240" y="352" text-anchor="start" font-size="11" fill="#333">A = (u, 0) 在底边、B = (v, s) 在顶边（左右对边对称）：</text>
  <text x="240" y="372" text-anchor="start" font-size="11" fill="#333">弧₁ = 3s − u − v，弧₂ = s + u + v，都可逼近 2s；</text>
  <text x="240" y="392" text-anchor="start" font-size="11" fill="#333">而曼哈顿 = s + |u − v| ∈ [s, 2s] —— 对边中点反例：弧 = 2s，曼哈顿 = s</text>
  <g filter="url(#sk)">
    <rect x="230" y="406" width="430" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="445" y="427" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">k ≥ 4 ⟹ 答案 ≤ 4s/k ≤ s（鸽笼 + 引理①）</text>
  <text x="445" y="446" text-anchor="middle" font-size="10.5" fill="#2e6e2e">二分探测的每个 x 都 ≤ s ⟹ 等价刻画「两弧 ≥ x ⟺ 曼哈顿 ≥ x」全程生效</text>
  <text x="340" y="473" text-anchor="middle" font-size="10" fill="#888">配色约定：蓝实线 = 顺时针弧，橙虚线 = 逆时针弧，红 = 曼哈顿最短路</text>
</svg>
