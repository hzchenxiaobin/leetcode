<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把字符串变成 0/1 数组，定长窗口求和</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">元音记 1、辅音记 0，问题化为「长度 k 的连续区间和的最大值」</text>

  <!-- 高亮当前窗口 -->
  <rect x="238" y="62" width="124" height="92" fill="#e8f0fe" opacity="0.75" stroke="#446688"
        stroke-width="1.5" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>

  <text x="112" y="90" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">s[i]</text>
  <text x="112" y="138" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">v[i]</text>

  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="140" y="60">0</text><text x="180" y="60">1</text><text x="220" y="60">2</text>
    <text x="260" y="60">3</text><text x="300" y="60">4</text><text x="340" y="60">5</text>
    <text x="380" y="60">6</text><text x="420" y="60">7</text><text x="460" y="60">8</text>
  </g>

  <g font-size="15" text-anchor="middle" filter="url(#rough2)">
    <rect x="120" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="160" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="200" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="240" y="70" width="40" height="30" fill="#ffffff" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="280" y="70" width="40" height="30" fill="#ffffff" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="320" y="70" width="40" height="30" fill="#ffffff" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="360" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="400" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
    <rect x="440" y="70" width="40" height="30" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="91">a</text><text x="180" y="91">b</text><text x="220" y="91">c</text>
    <text x="260" y="91">i</text><text x="300" y="91">i</text><text x="340" y="91">i</text>
    <text x="380" y="91">d</text><text x="420" y="91">e</text><text x="460" y="91">f</text>
  </g>

  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <rect x="120" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="160" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="200" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="240" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="280" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="320" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="360" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="400" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="440" y="118" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="137">1</text><text x="180" y="137">0</text><text x="220" y="137">0</text>
    <text x="260" y="137">1</text><text x="300" y="137">1</text><text x="340" y="137">1</text>
    <text x="380" y="137">0</text><text x="420" y="137">1</text><text x="460" y="137">0</text>
  </g>

  <text x="280" y="174" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">当前窗口 i = 3：s[3..5] = "iii"，窗口和 cur = 1 + 1 + 1 = 3</text>

  <rect x="56" y="190" width="448" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="212" font-size="12" fill="#8a6a20" filter="url(#rough2)">w(i) = v[i] + v[i+1] + … + v[i+k−1]</text>
  <text x="72" y="238" font-size="12" fill="#8a6a20" filter="url(#rough2)">w(i+1) = w(i) − v[i] + v[i+k]</text>
  <text x="330" y="238" font-size="10.5" fill="#a08030" filter="url(#rough2)">一次加法 + 一次减法 = O(1)</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="56" y="272" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="126" y="293" fill="#3a5a30">元音 a e i o u → 1</text>
    <rect x="210" y="272" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
    <text x="280" y="293" fill="#8a3a36">其余辅音 → 0</text>
    <rect x="364" y="272" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="434" y="293" fill="#3a4a66">答案 = max w(i)</text>
  </g>

  <path d="M 280 310 L 280 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">窗口起点 i 取遍 0 … n−k，共 n−k+1 个窗口，每个只花 O(1) 更新</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 s = "abciiidef"，k = 3：窗口和依次为 1,1,2,3,2,2,1 → 答案 3</text>
</svg>
