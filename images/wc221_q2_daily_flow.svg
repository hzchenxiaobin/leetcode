<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <ellipse cx="320" cy="35" rx="70" ry="19" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="320" y="40" text-anchor="middle" font-size="12" fill="#34557e" filter="url(#rough2)">d←0, ans←0, 空堆</text>
  <path d="M 320 54 V 76" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <polygon points="320,80 410,112 320,144 230,112" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">d&lt;n 或 堆非空？</text>
  <text x="436" y="106" font-size="11" fill="#b07818" filter="url(#rough2)">否</text>
  <path d="M 410 112 H 462" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <ellipse cx="538" cy="112" rx="70" ry="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="538" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b07818" filter="url(#rough2)">返回 ans</text>
  <text x="330" y="164" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 320 144 V 182" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- push -->
  <g filter="url(#rough2)">
    <rect x="160" y="186" width="320" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">入堆：若 d&lt;n 且 apples[d]&gt;0</text>
  <text x="320" y="223" text-anchor="middle" font-size="11" font-family="monospace" fill="#2e6e2e" filter="url(#rough2)">push( d+days[d], apples[d] )</text>
  <path d="M 320 232 V 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pop rotten -->
  <g filter="url(#rough2)">
    <rect x="160" y="256" width="320" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#8a6a10" filter="url(#rough2)">清腐烂：堆顶腐烂日 ≤ d</text>
  <text x="320" y="293" text-anchor="middle" font-size="11" font-family="monospace" fill="#8a6a10" filter="url(#rough2)">while heap &amp;&amp; rot(top) ≤ d: pop</text>
  <path d="M 320 302 V 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- heap nonempty? -->
  <polygon points="320,326 410,358 320,390 230,358" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">堆非空？</text>
  <text x="330" y="406" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 320 390 V 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="350" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- eat -->
  <g filter="url(#rough2)">
    <rect x="160" y="414" width="320" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="435" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">吃堆顶：ans++，cnt−1</text>
  <text x="320" y="455" text-anchor="middle" font-size="11" font-family="monospace" fill="#b85450" filter="url(#rough2)">if cnt == 0: pop</text>

  <!-- back edge: no-eat branch joins, then d++ loop back -->
  <path d="M 405 358 H 560 V 482 H 100 V 112 H 222" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 320 466 V 482" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="100" cy="300" r="19" fill="#fafafa" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="100" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">d++</text>

  <text x="380" y="496" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">顺序固定：入堆 → 清腐烂 → 吃（清腐烂必须在吃之前）；d≥n 后堆非空仍继续</text>
</svg>
