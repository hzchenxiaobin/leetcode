<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按奇偶下标拆成两组残差，问题变成「各选一个残差」</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">k = 3：偶数下标取 x，奇数下标取 y，x ≠ y</text>
  <text x="30" y="88" text-anchor="start" font-size="11" fill="#333" font-weight="bold">nums = [1,4,2,8]，k = 3</text>
  <rect x="60" y="100" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="86.0" y="125.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="86.0" y="160" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="120" y="100" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146.0" y="125.68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <text x="146.0" y="160" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="180" y="100" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206.0" y="125.68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <text x="206.0" y="160" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="240" y="100" width="52" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266.0" y="125.68" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">8</text>
  <text x="266.0" y="160" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="30" y="196" text-anchor="start" font-size="10.5" fill="#446688">偶数下标 0,2 → 残差 {1, 2}</text>
  <text x="300" y="196" text-anchor="start" font-size="10.5" fill="#d6a040">奇数下标 1,3 → 残差 {1, 2}</text>
  <rect x="30" y="210" width="210" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="237" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x = 1 → 代价 0+1 = 1</text>
  <text x="135" y="251" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x = 2 → 代价 1+0 = 1</text>
  <rect x="300" y="210" width="210" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="237" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">y = 1 → 代价 0+1 = 1</text>
  <text x="405" y="251" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">y = 2 → 代价 1+0 = 1</text>
  <rect x="30" y="288" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">选 (x,y) = (1,2)：偶数侧 1 次 + 奇数侧 1 次 = 2</text>
  <text x="270" y="321" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（残差沿环移动，代价 = 环上距离 min(|r-x|, k-|r-x|)）</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">x 与 y 必须不同；k = 2 时只有 (0,1) 与 (1,0) 两种组合</text>
</svg>
