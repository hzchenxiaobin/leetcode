<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：每段连续相等只留一个，其余删除</text>

  <!-- 行 1：[1,1,2,2,2,3] -->
  <text x="80" y="71" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 1</text>
  <rect x="150" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="222" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="254" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="306" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="326" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="358" y="52" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="378" y="74" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="410" y="52" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="196" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="248" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="300" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="352" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="404" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="170" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="222" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="274" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="326" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="378" y="100" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="430" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <rect x="478" y="52" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="73" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删 3 → [1,2,3]</text>

  <!-- 行 2：[4,4,9,4] -->
  <text x="80" y="161" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 2</text>
  <rect x="150" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="202" y="142" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="222" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="254" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="306" y="142" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="196" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="248" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="300" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="170" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="222" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="274" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="326" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <rect x="478" y="142" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="163" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删 1 → [4,9,4]</text>
  <text x="478" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不相邻的两个 4 不用删</text>

  <!-- 行 3：[7,7,7,7] -->
  <text x="80" y="251" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">补充 A</text>
  <rect x="150" y="232" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="202" y="232" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="222" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="254" y="232" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="274" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="306" y="232" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="326" y="254" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="196" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="248" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="300" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="170" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="222" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="274" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <text x="326" y="280" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删</text>
  <rect x="478" y="232" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="253" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删 3 → [7]</text>
  <text x="478" y="280" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">只剩 1 个也合法</text>

  <!-- 行 4：[1,2,1,2] -->
  <text x="80" y="341" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">补充 B</text>
  <rect x="150" y="322" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="322" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="254" y="322" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="306" y="322" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="326" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="248" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="300" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="170" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="222" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="274" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <text x="326" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">留</text>
  <rect x="478" y="322" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="343" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删 0 → 原样</text>
  <text x="478" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">相邻互不相等，一个不删</text>

  <!-- 图例 -->
  <rect x="150" y="390" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="400" font-size="11" fill="#666" filter="url(#rough2)">保留</text>
  <rect x="230" y="390" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="400" font-size="11" fill="#666" filter="url(#rough2)">删除</text>
  <text x="330" y="400" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 异或为 0</text>
  <text x="440" y="400" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠ 异或非零</text>
</svg>
