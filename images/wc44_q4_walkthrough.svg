<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="'Comic Sans MS','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrG2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：coins = [1,2,4,−1,2]，maxJump = 2</text>
  <path d="M 170 42 Q 450 50 730 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">自右向左填表（dp[N] 已知），再从 1 号位按「最小可行下标」走回终点</text>

  <!-- 表头 -->
  <text x="80" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <text x="170" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">coins[i]</text>
  <text x="400" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">窗口候选 dp[j]（j = i+1 … i+2）</text>
  <text x="630" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">dp[i]</text>
  <text x="780" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">说明</text>
  <path d="M 40 104 L 860 104" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1：i=5 -->
  <rect x="40" y="110" width="820" height="36" rx="4" fill="#f2f6fb" stroke="none" filter="url(#rough2)"/>
  <text x="80" y="134" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="170" y="134" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">2</text>
  <text x="400" y="134" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">—（终点，无后继）</text>
  <text x="630" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="780" y="134" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">基准</text>

  <!-- 行 2：i=4 -->
  <text x="80" y="174" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="174" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="400" y="174" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">—（不可落脚，不填）</text>
  <text x="630" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">∞</text>
  <text x="780" y="174" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">跳过</text>

  <!-- 行 3：i=3 -->
  <rect x="40" y="188" width="820" height="36" rx="4" fill="#f2f6fb" stroke="none" filter="url(#rough2)"/>
  <text x="80" y="212" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="212" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">4</text>
  <text x="400" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">dp[4]=∞, dp[5]=2 → min 2</text>
  <text x="630" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <text x="780" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">只能 3 → 5</text>

  <!-- 行 4：i=2 -->
  <text x="80" y="252" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="252" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">2</text>
  <text x="400" y="252" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">dp[3]=6, dp[4]=∞ → min 6</text>
  <text x="630" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <text x="780" y="252" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">被迫经 3</text>

  <!-- 行 5：i=1（答案行） -->
  <rect x="40" y="266" width="820" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="170" y="291" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#rough2)">1</text>
  <text x="400" y="291" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">dp[2]=8, dp[3]=6 → min 6</text>
  <text x="630" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">7</text>
  <text x="780" y="291" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">选 3 更便宜</text>

  <!-- 重建说明 -->
  <text x="450" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">重建：每步取最小的 j，且须满足 dp[j] + coins[cur] = dp[cur]（保证仍在最优解集合内）</text>

  <!-- 最优路径 -->
  <circle cx="150" cy="392" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <path d="M 175 392 L 268 392" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="222" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跳 2 步</text>
  <circle cx="300" cy="392" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <path d="M 325 392 L 418 392" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <text x="372" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">跳 2 步</text>
  <circle cx="450" cy="392" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>
  <text x="560" y="386" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">花费 1 + 4 + 2 = 7 ✓ 最优</text>
  <text x="560" y="406" font-size="11.5" fill="#666" filter="url(#rough2)">字典序：1 之后能选 2，但 dp[2]+1 ≠ 7</text>

  <!-- 对照路径 -->
  <circle cx="150" cy="478" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="483" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M 170 478 L 234 478" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <circle cx="258" cy="478" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="483" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M 278 478 L 342 478" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <circle cx="366" cy="478" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="483" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <path d="M 386 478 L 450 478" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <circle cx="474" cy="478" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="474" y="483" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="590" y="474" font-size="12.5" fill="#b85450" filter="url(#rough2)">花费 1 + 2 + 4 + 2 = 9 ✗ 更贵</text>
  <text x="590" y="494" font-size="11.5" fill="#888" filter="url(#rough2)">落点 2 的硬币更小，却被拖成更长的路</text>

  <text x="450" y="526" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">「每步选最便宜的落点」会得到 9，说明必须用 DP 看「剩余花费」而不是单步硬币</text>
</svg>
