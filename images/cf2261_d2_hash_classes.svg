<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第一步：把已有探测器压成等价类（覆盖集合相同 ⇒ 同类）</text>
  <path d="M 150 92 Q 467.0 92.0 780 92" stroke="#b9c4cf" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">1</text>
  <path d="M 190 92 Q 192.0 94.0 190 96" stroke="#b9c4cf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">2</text>
  <path d="M 320 92 Q 322.0 94.0 320 96" stroke="#b9c4cf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">3</text>
  <path d="M 450 92 Q 452.0 94.0 450 96" stroke="#b9c4cf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="580" y="84" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">4</text>
  <path d="M 580 92 Q 582.0 94.0 580 96" stroke="#b9c4cf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="710" y="84" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">5</text>
  <path d="M 710 92 Q 712.0 94.0 710 96" stroke="#b9c4cf" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="286" y="110" width="198" height="30" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385.0" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">D₁ = [2,3]</text>
  <text x="150" y="130" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">已有</text>
  <rect x="156" y="152" width="588" height="30" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="450.0" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#33602a" filter="url(#rough2)">D₂ = [1,5]</text>
  <text x="150" y="172" text-anchor="end" font-size="13" font-weight="bold" fill="#33602a" filter="url(#rough2)">已有</text>
  <text x="150" y="224" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">覆盖集合</text>
  <rect x="138" y="204" width="104" height="32" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="225" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{D₂}</text>
  <rect x="268" y="204" width="104" height="32" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="225" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{D₁,D₂}</text>
  <rect x="398" y="204" width="104" height="32" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="225" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{D₁,D₂}</text>
  <rect x="528" y="204" width="104" height="32" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="580" y="225" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{D₂}</text>
  <rect x="658" y="204" width="104" height="32" rx="7" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="710" y="225" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">{D₂}</text>
  <rect x="120" y="266" width="300" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">类 A = {1,4,5}：报告恒为 {D₂}</text>
  <rect x="470" y="266" width="300" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="620" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">类 B = {2,3}：报告恒为 {D₁,D₂}</text>
  <text x="450" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">哈希：每个探测器取随机 64 位值，区间异或前缀和 ⇒ 同类点哈希相同；压缩后得到类编号</text>
</svg>
