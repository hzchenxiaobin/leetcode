<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态机 DP：一段极差 = 一笔交易（第 j 笔）</text>
  <path d="M 120 42 Q 280 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left: idle state of layer j-1 -->
  <g filter="url(#rough2)"><rect x="40" y="160" width="128" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="104" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">f[j−1][0] 空仓</text>
  <text x="104" y="208" text-anchor="middle" font-size="10" fill="#33526e" filter="url(#rough2)">已完成至多 j−2 笔</text>

  <!-- middle top: long position -->
  <g filter="url(#rough2)"><rect x="216" y="64" width="128" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="280" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">f[j][1] 持多</text>
  <text x="280" y="108" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">已买入，待卖出</text>

  <!-- middle bottom: short position -->
  <g filter="url(#rough2)"><rect x="216" y="252" width="128" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6510" filter="url(#rough2)">f[j][2] 持空</text>
  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#8a6510" filter="url(#rough2)">已卖空，待买回</text>

  <!-- right: idle state of layer j -->
  <g filter="url(#rough2)"><rect x="392" y="160" width="128" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="456" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">f[j][0] 空仓</text>
  <text x="456" y="208" text-anchor="middle" font-size="10" fill="#33526e" filter="url(#rough2)">已完成至多 j−1 笔</text>

  <!-- transitions -->
  <path d="M 168 168 Q 200 140 214 116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="128" text-anchor="end" font-size="10.5" fill="#2e5e2e" filter="url(#rough2)">开多：买入 −p</text>
  <path d="M 168 216 Q 200 244 214 268" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="196" y="262" text-anchor="end" font-size="10.5" fill="#8a6510" filter="url(#rough2)">开空：卖出 +p</text>
  <path d="M 344 116 Q 376 140 390 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="364" y="128" font-size="10.5" fill="#2e5e2e" filter="url(#rough2)">平多：卖出 +p</text>
  <path d="M 344 268 Q 376 244 390 216" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="364" y="268" font-size="10.5" fill="#8a6510" filter="url(#rough2)">平空：买回 −p</text>

  <!-- self loops -->
  <path d="M 104 160 Q 104 132 130 132 Q 152 132 152 158" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不动作</text>
  <path d="M 456 224 Q 456 252 432 252 Q 408 252 408 226" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不动作</text>

  <!-- layer note -->
  <path d="M 168 205 Q 280 232 390 205" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">从左到右跨一层 = 消耗一笔交易额度（j−1 → j）</text>

  <!-- mapping note -->
  <g filter="url(#rough2)"><rect x="36" y="330" width="286" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="48" y="351" font-size="11" fill="#2e5e2e" filter="url(#rough2)">段内 min 在 max 左边 ⇔ 低买高卖（做多），利润 = max − min</text>
  <text x="48" y="371" font-size="11" fill="#2e5e2e" filter="url(#rough2)">段内 max 在 min 左边 ⇔ 高借低还（做空），利润同样是 max − min</text>

  <!-- warning box -->
  <g filter="url(#rough2)"><rect x="338" y="330" width="186" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="350" y="348" font-size="11" font-weight="bold" fill="#8a3540" filter="url(#rough2)">⚠ j 必须倒序更新！</text>
  <text x="350" y="366" font-size="10" fill="#8a3540" filter="url(#rough2)">同一价格至多一个动作，正序会</text>
  <text x="350" y="381" font-size="10" fill="#8a3540" filter="url(#rough2)">允许「同刻平仓又开仓」而出错</text>
</svg>
