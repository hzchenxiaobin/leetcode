<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 362" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="620" height="362" fill="#fafafa"/>
<text x="320" y="32" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">示例 2：nums = [1,1,2,4,9]，k = 20（每步合并最小两个）</text>
<rect x="36" y="48" width="578" height="36" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="55.0" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">步</text>
<text x="150.0" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">a（最小）</text>
<text x="230.0" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">b（次小）</text>
<text x="320.0" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">2a + b</text>
<text x="457.5" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">数组（排序后）</text>
<text x="577.5" y="72" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#roughs)">全体 ≥ 20</text>
<rect x="36" y="84" width="578" height="44" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="55.0" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="150.0" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="230.0" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="320.0" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">3</text>
<text x="457.5" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">[2,3,4,9]</text>
<text x="577.5" y="112" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="36" y="128" width="578" height="44" rx="6" fill="#fbfbfb" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="55.0" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="150.0" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="230.0" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">3</text>
<text x="320.0" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">7</text>
<text x="457.5" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">[4,7,9]</text>
<text x="577.5" y="156" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="36" y="172" width="578" height="44" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="55.0" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">3</text>
<text x="150.0" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">4</text>
<text x="230.0" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">7</text>
<text x="320.0" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">15</text>
<text x="457.5" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">[9,15]</text>
<text x="577.5" y="200" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="36" y="216" width="578" height="44" rx="6" fill="#e6f4ea" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="55.0" y="244" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">4</text>
<text x="150.0" y="244" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">9</text>
<text x="230.0" y="244" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">15</text>
<text x="320.0" y="244" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">33</text>
<text x="457.5" y="244" text-anchor="middle" font-size="14" fill="#333333" font-weight="normal" filter="url(#roughs)">[33]</text>
<text x="577.5" y="244" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">是</text>
<text x="320" y="296" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">小元素被反复喂进合并：1 → 3 → 7 → 15 → 33</text>
<text x="320" y="322" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">规则写死了「取最小两个」，没有选择余地 → 确定性模拟</text>
<text x="320" y="346" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">正因为顺序被写死，答案就是首次全体达标的步数</text>
</svg>
