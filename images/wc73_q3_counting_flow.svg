<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="580" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：一次计数 → 按名次拼接 → 补上剩余字符</text>
  <text x="340" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两趟线性扫描，全程不比较字符，也不构造子串</text>

  <!-- S1 计数 -->
  <rect x="190" y="64" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="88" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">freq[26] ← 0；遍历 s 累加频次</text>
  <path d="M340,102 L340,120" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- S2 初始化 -->
  <rect x="190" y="124" width="300" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="148" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">res ← 空串；i ← 0</text>
  <path d="M340,162 L340,180" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 循环判定 -->
  <polygon points="340,184 466,214 340,244 214,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">i &lt; |order| ?</text>
  <text x="340" y="228" text-anchor="middle" font-size="9.5" fill="#a0822a" filter="url(#rough2)">（还有名次待输出）</text>

  <!-- 是 → S3 -->
  <path d="M340,244 L340,266" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="170" y="270" width="340" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="292" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">c ← order[i]；把 c 重复 freq[c] 次追加到 res</text>
  <text x="340" y="314" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">freq[c] ← 0（标记已消费）；i ← i + 1</text>

  <!-- 回边 -->
  <path d="M170,301 L112,301 L112,214 L210,214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="336" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每轮消费一个名次</text>

  <!-- 否 → 收尾 -->
  <path d="M466,214 L598,214 L598,432 L494,432" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="636" y="250" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">跳出循环</text>

  <!-- S4 收尾 -->
  <rect x="190" y="404" width="300" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="426" text-anchor="middle" font-size="10.5" fill="#8a4a48" filter="url(#rough2)">遍历 ch = 'a' … 'z'：若 freq[ch] &gt; 0</text>
  <text x="340" y="446" text-anchor="middle" font-size="10.5" fill="#8a4a48" filter="url(#rough2)">把 ch 重复 freq[ch] 次追加到 res（即 key = ∞ 的桶）</text>
  <path d="M340,460 L340,488" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- S5 返回 -->
  <rect x="230" y="492" width="220" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="340" y="518" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return res</text>

  <text x="340" y="560" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">res 的长度恒等于 |s|：每个字符只在「按名次」或「收尾」阶段被放置一次</text>
</svg>
