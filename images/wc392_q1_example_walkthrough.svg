<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [1,4,3,3,2]</text>

  <!-- header row -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <rect x="40" y="52" width="50" height="36" rx="4"/>
    <rect x="90" y="52" width="90" height="36" rx="4"/>
    <rect x="180" y="52" width="120" height="36" rx="4"/>
    <rect x="300" y="52" width="70" height="36" rx="4"/>
    <rect x="370" y="52" width="70" height="36" rx="4"/>
    <rect x="440" y="52" width="60" height="36" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#446688" text-anchor="middle">
    <text x="65" y="75">i</text>
    <text x="135" y="75">nums[i]</text>
    <text x="240" y="75">与前一位比较</text>
    <text x="335" y="75">inc</text>
    <text x="405" y="75">dec</text>
    <text x="470" y="75">ans</text>
  </g>

  <!-- row 0: i=0 -->
  <g filter="url(#rough2)">
    <rect x="40" y="88" width="50" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="90" y="88" width="90" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="180" y="88" width="120" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="300" y="88" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="370" y="88" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="440" y="88" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="65" y="115" text-anchor="middle" font-size="12" fill="#888">0</text>
    <text x="135" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
    <text x="240" y="115" text-anchor="middle" font-size="12" fill="#888">—（初始）</text>
    <text x="335" y="115" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="405" y="115" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="470" y="115" text-anchor="middle" font-size="12.5" fill="#8a6a1a">1</text>
  </g>

  <!-- row 1: i=1, 4>1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="132" width="50" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="90" y="132" width="90" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="180" y="132" width="120" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="300" y="132" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="370" y="132" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="440" y="132" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="65" y="159" text-anchor="middle" font-size="12" fill="#888">1</text>
    <text x="135" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4</text>
    <text x="240" y="159" text-anchor="middle" font-size="12" fill="#446688">4 ＞ 1 ↑</text>
    <text x="335" y="159" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e24">2</text>
    <text x="405" y="159" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="470" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">2</text>
  </g>

  <!-- row 2: i=2, 3<4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="50" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="90" y="176" width="90" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="180" y="176" width="120" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="300" y="176" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="370" y="176" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="440" y="176" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="65" y="203" text-anchor="middle" font-size="12" fill="#888">2</text>
    <text x="135" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
    <text x="240" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a">3 ＜ 4 ↓</text>
    <text x="335" y="203" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="405" y="203" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e24">2</text>
    <text x="470" y="203" text-anchor="middle" font-size="12.5" fill="#8a6a1a">2</text>
  </g>

  <!-- row 3: i=3, 3=3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="220" width="50" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="90" y="220" width="90" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="180" y="220" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="300" y="220" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="370" y="220" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="440" y="220" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="65" y="247" text-anchor="middle" font-size="12" fill="#888">3</text>
    <text x="135" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
    <text x="240" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3 ＝ 3 ✕</text>
    <text x="335" y="247" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="405" y="247" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="470" y="247" text-anchor="middle" font-size="12.5" fill="#8a6a1a">2</text>
  </g>

  <!-- row 4: i=4, 2<3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="264" width="50" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="90" y="264" width="90" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="180" y="264" width="120" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="300" y="264" width="70" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="4"/>
    <rect x="370" y="264" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="440" y="264" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="65" y="291" text-anchor="middle" font-size="12" fill="#888">4</text>
    <text x="135" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
    <text x="240" y="291" text-anchor="middle" font-size="12" fill="#4a7a3a">2 ＜ 3 ↓</text>
    <text x="335" y="291" text-anchor="middle" font-size="12.5" fill="#666">1</text>
    <text x="405" y="291" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e24">2</text>
    <text x="470" y="291" text-anchor="middle" font-size="12.5" fill="#8a6a1a">2</text>
  </g>

  <text x="270" y="344" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">＝ 处双计数器同时归 1；ans 打擂台记下历史峰值 2</text>
</svg>
