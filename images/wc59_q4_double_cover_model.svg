<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心不变式：doubles 恰好覆盖「被 ≥ 2 个预订覆盖」的时刻</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">于是「加入 I 后出现三重」⇔「I 与 doubles 中某一段相交」，只需一次线性扫描</text>

  <g filter="url(#rough2)" font-size="9.5" fill="#555">
    <text x="18" y="105">一重</text>
    <text x="18" y="141">一重</text>
    <text x="18" y="177">候选</text>
    <text x="18" y="213">双重</text>
  </g>

  <rect x="150" y="90" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="105" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[10,20)</text>
  <rect x="470" y="90" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="510" y="105" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[50,60)</text>

  <rect x="150" y="126" width="240" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="141" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[10,40)</text>

  <rect x="110" y="162" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="150" y="177" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">[5,15)</text>

  <rect x="150" y="198" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="213" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[10,20)</text>

  <text x="310" y="238" text-anchor="middle" font-size="9.5" fill="#777">每个时刻被覆盖的次数（覆盖层数）</text>

  <rect x="110" y="260" width="40" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="150" y="244" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="190" y="252" width="40" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="210" y="248" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="230" y="260" width="160" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="256" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="470" y="260" width="80" height="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="256" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">1</text>

  <path d="M 70 268 L 570 268" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="8.5" fill="#888" text-anchor="middle">
    <text x="70" y="284">0</text>
    <text x="150" y="284">10</text>
    <text x="230" y="284">20</text>
    <text x="310" y="284">30</text>
    <text x="390" y="284">40</text>
    <text x="470" y="284">50</text>
    <text x="550" y="284">60</text>
    <text x="580" y="284">t</text>
  </g>

  <rect x="60" y="304" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="324" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">三重只可能出现在 I ∩ doubles 上</text>
  <text x="76" y="342" font-size="9.8" fill="#555" filter="url(#rough2)">示例：候选 [5,15) 与 doubles 段 [10,20) 交于 [10,15)，该段层数从 2 变 3 → 拒绝该请求。</text>
  <text x="76" y="358" font-size="9.8" fill="#555" filter="url(#rough2)">反之只要候选不碰 doubles，层数最多到 2，加入一定安全。</text>

  <text x="310" y="388" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">doubles 内的段互不重叠（新段只在「与已有 doubles 无交」时才会被写入）</text>
</svg>
