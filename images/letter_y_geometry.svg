<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">Y 区域：只由 n 决定的静态几何划分</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以 n = 5、m = 2 为例（m 为中心下标）：蓝格属于 Y，白格不属于</text>

  <!-- 列标签 -->
  <text x="93" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="139" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="185" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="231" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=3</text>
  <text x="277" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=4</text>
  <!-- 行标签 -->
  <text x="63" y="108" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="63" y="154" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="63" y="200" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="63" y="246" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="63" y="292" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>

  <!-- 行 0 -->
  <g filter="url(#rough2)">
    <rect x="70" y="80" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="93" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>
  <g filter="url(#rough2)">
    <rect x="116" y="80" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="162" y="80" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="208" y="80" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="254" y="80" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="277" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">②</text>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="70" y="126" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="116" y="126" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="139" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>
  <g filter="url(#rough2)">
    <rect x="162" y="126" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="208" y="126" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="231" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <g filter="url(#rough2)">
    <rect x="254" y="126" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- 行 2：中心在 (2,2) -->
  <g filter="url(#rough2)">
    <rect x="70" y="172" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="116" y="172" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="162" y="172" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="185" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415" filter="url(#rough2)">①②③</text>
  <g filter="url(#rough2)">
    <rect x="208" y="172" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="254" y="172" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- 行 3 -->
  <g filter="url(#rough2)">
    <rect x="70" y="218" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="116" y="218" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="162" y="218" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="185" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③</text>
  <g filter="url(#rough2)">
    <rect x="208" y="218" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="254" y="218" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="70" y="264" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="116" y="264" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="162" y="264" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="185" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③</text>
  <g filter="url(#rough2)">
    <rect x="208" y="264" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="254" y="264" width="46" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>

  <!-- 图例与引线 -->
  <path d="M 352 112 Q 240 66 148 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="358" y="116" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 左对角线 (i,i)，0≤i≤m —— m+1 格</text>

  <path d="M 352 142 Q 312 92 262 100" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="358" y="146" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 右对角线 (i,n−1−i)，0≤i≤m —— m+1 格</text>

  <path d="M 352 172 Q 292 252 206 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="358" y="176" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 垂直线 (i,m)，m≤i≤n−1 —— n−m 格</text>

  <path d="M 352 202 Q 282 208 214 200" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="358" y="206" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">★ 中心 (m,m) 三线共享 —— 只计一次</text>

  <!-- 容斥计数框 -->
  <g filter="url(#rough2)">
    <rect x="350" y="228" width="270" height="122" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="485" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">容斥计数</text>
  <text x="485" y="276" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">|Y| = (m+1)+(m+1)+(n−m) − 2</text>
  <text x="485" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">= 3m+1 = n + m</text>
  <text x="485" y="324" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n=3 → 4 格    n=5 → 7 格    n=49 → 73 格</text>

  <!-- 底部结论条 -->
  <g filter="url(#rough2)">
    <rect x="40" y="368" width="580" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="330" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">Y 区域是静态几何：只由 n 决定，与 grid 的数值无关 —— 每格「是否在 Y 内」只需判定一次</text>
  <text x="330" y="414" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">非 Y 格数 = n² − n − m；n = 5 时 |Y| = 7、非 Y = 18</text>
  <text x="330" y="436" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">自检技巧：一次遍历统计出的 sum(cntY) 应恰等于 n + m</text>
</svg>
