<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 476" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="476" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：9 → 2 依次除尽，再反转拼接</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">先特判一位数，再对每个数位「能除几次除几次」，最后校验余数与溢出</text>

  <g filter="url(#rough2)">
    <rect x="180" y="64" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="85" text-anchor="middle" font-size="11" fill="#3a4a66">输入 a（1 ≤ a ≤ 2³¹−1）</text>
  </g>
  <path d="M 280 96 L 280 116" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,118 400,140 280,162 160,140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="144" text-anchor="middle" font-size="10.5" fill="#3a5a30">a &lt; 10 ?</text>
  </g>
  <path d="M 400 140 L 448 140" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="450" y="124" width="100" height="32" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
    <text x="500" y="145" text-anchor="middle" font-size="10.5" fill="#3a5a30">返回 a</text>
  </g>
  <text x="424" y="118" text-anchor="middle" font-size="9.5" fill="#4a7a3a">是</text>
  <text x="292" y="180" font-size="9.5" fill="#8a6a20">否</text>

  <path d="M 280 162 L 280 188" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="190" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">for d = 9, 8, …, 2：（从大到小）</text>
    <text x="280" y="220" text-anchor="middle" font-size="10.5" fill="#8a6a20">while a % d == 0：记录 d，a /= d</text>
  </g>

  <path d="M 280 226 L 280 250" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,252 400,274 280,296 160,274" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#3a4a66">a == 1 ?</text>
  </g>
  <path d="M 400 274 L 448 274" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="450" y="258" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="500" y="279" text-anchor="middle" font-size="10.5" fill="#8a3a36">返回 0</text>
  </g>
  <text x="424" y="252" text-anchor="middle" font-size="9.5" fill="#b85450">否（含 ≥11 质因子）</text>
  <text x="292" y="314" font-size="9.5" fill="#4a7a3a">是</text>

  <path d="M 280 296 L 280 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="322" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#3a5a30">反转记录顺序，逐位拼成 b</text>
    <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#3a5a30">（记录是 9→2 降序，反转后升序）</text>
  </g>

  <path d="M 280 358 L 280 382" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,384 400,406 280,428 160,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#8a6a20">b &gt; 2³¹−1 ?</text>
  </g>
  <path d="M 400 406 L 448 406" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="500" y="410" text-anchor="middle" font-size="10.5" fill="#8a3a36">返回 0</text>
  </g>
  <g filter="url(#rough2)">
    <text x="500" y="456" text-anchor="middle" font-size="10.5" fill="#3a5a30">返回 b</text>
  </g>
  <text x="424" y="398" text-anchor="middle" font-size="9.5" fill="#b85450">是</text>
  <path d="M 280 428 L 280 452 L 428 452" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="446" font-size="9.5" fill="#4a7a3a">否</text>
</svg>
