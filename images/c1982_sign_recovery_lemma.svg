<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">符号恢复:任取 sum(T) = −neg 的子集 T 取负号即可</text>

  <!-- X 与 target -->
  <text x="70" y="58" font-size="11" fill="#555" filter="url(#rough2)">绝对值 X =</text>
  <rect x="148" y="44" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="183" y="44" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="199" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="218" y="44" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="234" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="292" y="44" width="236" height="28" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">需要负号的部分绝对值和 = −neg = 3</text>

  <!-- 两种选法 -->
  <rect x="36" y="92" width="228" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">选法一:T = {3}</text>
  <rect x="76" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="121" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="166" y="122" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="186" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <text x="150" y="162" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans = [1, 2, −3]</text>

  <text x="280" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#888" filter="url(#rough2)">或</text>

  <rect x="316" y="92" width="228" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">选法二:T = {1, 2}</text>
  <rect x="356" y="122" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="401" y="122" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="446" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="466" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="162" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ans = [−1, −2, 3]</text>

  <!-- 汇聚箭头 -->
  <path d="M 150 172 C 170 190, 210 196, 250 200" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 430 172 C 410 190, 370 196, 330 200" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 相同结果 -->
  <rect x="56" y="204" width="448" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">两者的子集和多重集完全相同!</text>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ −3, −2, −1, 0, 0, 1, 2, 3 }</text>
  <text x="480" y="224" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">=</text>

  <!-- 翻转双击说明 -->
  <rect x="16" y="274" width="528" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">翻转双射:对 T 内元素翻转「选/不选」,每个子集和恰好变成 (X 的某子集和) − sum(T),</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">所以多重集 = X 的子集和整体平移 −sum(T)——只依赖 sum(T),与选哪个 T 无关!</text>
</svg>
