<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">逐位统计：31 轮循环，每轮只看一个位</text>

  <ellipse cx="320" cy="54" rx="52" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="59" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">开始</text>

  <path d="M 320 73 L 320 94" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="94" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">for i = 0 … 30</text>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">a, b, c ≤ 10^9 &lt; 2^30，31 位足够</text>

  <path d="M 320 142 L 320 162" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="162" width="360" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="182" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">a_i = (a &gt;&gt; i) &amp; 1</text>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">b_i、c_i 用同一写法取出</text>

  <path d="M 320 210 L 320 232" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,232 428,276 320,320 212,276" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">c_i == 0 ?</text>

  <path d="M 212 276 L 150 276 L 150 330" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 428 276 L 490 276 L 490 330" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="266" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="40" y="330" width="220" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="352" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">ans += a_i + b_i</text>
  <text x="150" y="370" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">两个 1 都要清成 0</text>

  <rect x="380" y="330" width="220" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="352" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans += (a_i | b_i) == 0</text>
  <text x="490" y="370" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">缺 1 才补，已有一个 1 则 0</text>

  <path d="M 150 384 L 150 420 L 233 420" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 384 L 490 420 L 407 420" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="235" y="398" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="425" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="320" y="466" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮 O(1)，总共 31 轮；不需要真的修改 a、b</text>
</svg>
