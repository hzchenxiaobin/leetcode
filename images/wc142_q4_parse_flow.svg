<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">递归下降：三个函数共享一个游标 pos</text>
  <text x="310.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">term 的循环条件是「下一个字符是 '{' 或字母」</text>

  <rect x="110" y="78" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="109.8" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">parseExpr：先算一个 term，再 while ',' 并入并集</text>
  <rect x="110" y="150" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="181.8" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">parseTerm：先算一个 factor，再 while 相邻继续做笛卡尔积</text>
  <rect x="110" y="222" width="400" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="253.8" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">parseFactor：'{' → 递归 parseExpr → 跳过 '}'；否则单个字母</text>
  <rect x="110" y="300" width="400" height="46" fill="#f3e8fd" stroke="#7a5ea8" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="328.9" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">得到 set：自动去重 + 字典序 → 直接转 vector 返回</text>
  <path d="M 310 130 L 310 146" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 310 202 L 310 218" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 310 274 L 310 296" stroke="#78909c" stroke-width="1.8" fill="none" marker-end="url(#arr_gray)" filter="url(#rough2)"/>
  <path d="M 110 248 C 46 248 46 104 106 104" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr_red)" filter="url(#rough2)"/>
  <text x="58" y="180" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">嵌套</text>
  <text x="58" y="196" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">递归</text>
  <text x="24" y="384" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">表达式长度 ≤ 60，递归深度最多 30 层，无需显式栈。</text>
</svg>
