<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">对偶视角：可达位置向右「泼漆」，差分 O(1) 区间 +1</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">s = "011010"，minJump = 2，maxJump = 3</text>

  <!-- indices above cells -->
  <text x="150" y="60" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="214" y="60" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="278" y="60" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="342" y="60" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="406" y="60" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="470" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- string cells -->
  <rect x="122" y="66" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="66" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="66" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="314" y="66" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="66" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="442" y="66" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="214" y="94" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="278" y="94" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="342" y="94" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <text x="406" y="94" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="94" text-anchor="middle" font-size="16" fill="#223a55" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- flow arrow: cell0 paints barA -->
  <path d="M 150 112 C 150 128 215 134 246 142" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- paint bar A (from 0) -->
  <rect x="250" y="144" width="120" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="157" text-anchor="start" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">0 泼出 [0+2, 0+3] = [2, 3]</text>
  <!-- covered arrow up into cell3 -->
  <path d="M 330 142 V 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="380" y="130" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">s[3]='0' 且被覆盖 ⇒ 3 可达</text>

  <!-- flow arrow: cell3 paints barB -->
  <path d="M 354 112 C 354 158 408 180 438 184" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- paint bar B (from 3) -->
  <rect x="442" y="176" width="56" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="506" y="189" text-anchor="start" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">3 泼出 [5, 5]</text>
  <!-- covered arrow up into cell5 -->
  <path d="M 470 174 V 116" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="484" y="136" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">s[5]='0' 且被覆盖</text>
  <text x="484" y="150" text-anchor="start" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 到达终点 true ✓</text>

  <!-- bottom cards -->
  <rect x="32" y="216" width="280" height="122" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="238" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">差分：区间 +1 的 O(1) 写法</text>
  <text x="172" y="262" text-anchor="middle" font-size="10.5" fill="#6b5a1a" filter="url(#rough2)">覆盖 [l, r]：diff[l] += 1，diff[r+1] −= 1</text>
  <text x="172" y="284" text-anchor="middle" font-size="10.5" fill="#6b5a1a" filter="url(#rough2)">扫到 i：covered += diff[i] 恢复覆盖数</text>
  <text x="172" y="306" text-anchor="middle" font-size="10.5" fill="#6b5a1a" filter="url(#rough2)">covered &gt; 0 且 s[i] = '0' ⇒ i 可达</text>
  <text x="172" y="328" text-anchor="middle" font-size="10.5" fill="#6b5a1a" filter="url(#rough2)">每个位置至多泼一次 ⇒ 总 O(n)</text>

  <rect x="330" y="216" width="258" height="122" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="238" text-anchor="middle" font-size="11.5" fill="#223a55" font-weight="bold" filter="url(#rough2)">与前缀和互为对偶</text>
  <text x="459" y="262" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">前缀和（反向）：查左窗口有无可达</text>
  <text x="459" y="284" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">差分（正向）：把可达铺成右区间</text>
  <text x="459" y="306" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">同一转移边集的两种读法，均 O(n)</text>
  <text x="459" y="328" text-anchor="middle" font-size="10.5" fill="#33465e" filter="url(#rough2)">比赛时哪个顺手写哪个</text>
</svg>
