<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">pick(target)：扫一遍，边扫边抽样</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有 cnt、ans 两个变量；不需要索引表，也不数第二遍</text>

  <g filter="url(#rough2)">
    <rect x="125" y="63" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17"/>
    <text x="215" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66">pick(target)</text>

    <rect x="105" y="116" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="215" y="139" text-anchor="middle" font-size="11" fill="#8a6a20">cnt ← 0，ans ← −1</text>

    <polygon points="140,206 215,174 290,206 215,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="215" y="211" text-anchor="middle" font-size="11.5" fill="#3a5a30">i &lt; n ?</text>

    <rect x="10" y="186" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="60" y="211" text-anchor="middle" font-size="11" fill="#8a3a36">返回 ans</text>

    <polygon points="105,300 215,268 325,300 215,332" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="215" y="305" text-anchor="middle" font-size="11.5" fill="#3a5a30">nums[i] == target ?</text>

    <rect x="45" y="350" width="285" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="187" y="372" text-anchor="middle" font-size="10.5" fill="#3a4a66">cnt ← cnt + 1，r ← randrange(cnt)</text>
    <text x="187" y="392" text-anchor="middle" font-size="10.5" fill="#3a4a66">若 r == 0 则 ans ← i（概率 1/cnt）</text>

    <rect x="380" y="348" width="110" height="40" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="435" y="373" text-anchor="middle" font-size="11" fill="#3a4a66">i ← i + 1</text>
  </g>

  <path d="M 215 97 L 215 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 215 152 L 215 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 206 L 114 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="127" y="198" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>

  <path d="M 215 238 L 215 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="256" font-size="10" fill="#3a5a30" filter="url(#rough2)">是</text>

  <path d="M 215 332 L 215 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="345" font-size="10" fill="#3a5a30" filter="url(#rough2)">是</text>

  <path d="M 325 300 C 372 300 430 314 432 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="292" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>

  <path d="M 330 378 C 352 378 366 370 378 369" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 490 368 C 528 368 532 300 532 206 L 298 206" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="290" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下一轮</text>

  <text x="280" y="432" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只读 nums、只增计数：每次调用互不影响，天然可重复调用</text>
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不命中就跳过 —— 因此事先不需要知道 target 出现了多少次</text>
</svg>
