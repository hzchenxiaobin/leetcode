<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：把命中「拍平」成布尔掩码</text>
  <text x="280" y="47" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每条命中区间逐格打 true；重叠、相邻都连成同一段</text>

  <text x="42" y="93" font-size="12" fill="#555" filter="url(#rough2)">s =</text>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="100" y="66" width="42" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="121" y="93" fill="#333">a</text>
    <rect x="146" y="66" width="42" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="167" y="93" fill="#333">a</text>
    <rect x="192" y="66" width="42" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="213" y="93" fill="#333">b</text>
    <rect x="238" y="66" width="42" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="259" y="93" fill="#333">c</text>
    <rect x="284" y="66" width="42" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="305" y="93" fill="#333">d</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="121" y="120">0</text>
    <text x="167" y="120">1</text>
    <text x="213" y="120">2</text>
    <text x="259" y="120">3</text>
    <text x="305" y="120">4</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <rect x="146" y="132" width="88" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="190" y="146" fill="#3a4a66">ab 命中 [1,2]</text>
    <rect x="192" y="158" width="88" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="236" y="172" fill="#8a6a20">bc 命中 [2,3]</text>
  </g>

  <text x="34" y="240" font-size="11" fill="#555" filter="url(#rough2)">bold =</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="100" y="218" width="42" height="36" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="121" y="241" fill="#999">F</text>
    <rect x="146" y="218" width="42" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="167" y="241" fill="#3a5a30">T</text>
    <rect x="192" y="218" width="42" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="213" y="241" fill="#3a5a30">T</text>
    <rect x="238" y="218" width="42" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="259" y="241" fill="#3a5a30">T</text>
    <rect x="284" y="218" width="42" height="36" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="305" y="241" fill="#999">F</text>
  </g>

  <g filter="url(#rough2)" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3">
    <path d="M 144 206 L 144 262" fill="none"/>
    <path d="M 282 206 L 282 262" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#b8871f">
    <text x="144" y="204">F→T 插 &lt;b&gt;</text>
    <text x="284" y="204">T→F 插 &lt;/b&gt;</text>
  </g>

  <path d="M 280 262 L 280 284" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="140" y="288" width="280" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="313" font-size="13" fill="#5a4620">a&lt;b&gt;abc&lt;/b&gt;d</text>
  </g>

  <rect x="360" y="66" width="180" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" fill="#3a5a30">
    <text x="372" y="86" font-size="10" font-weight="bold">为什么能自动合并</text>
    <text x="372" y="105" font-size="8.8">· 重叠：两段共用格子 2</text>
    <text x="372" y="121" font-size="8.8">· 相邻：前段末尾紧贴后段</text>
    <text x="372" y="137" font-size="8.8">· 二者都是一段连续 true</text>
    <text x="372" y="153" font-size="8.8">· 数段数 = 最少标签对数</text>
  </g>

  <text x="280" y="348" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">3 个 true 连成一段，只需 1 对标签：写成嵌套标签反而是错的</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 2：words = ["ab","cb"] 时只有 [1,2] 被覆盖 → a&lt;b&gt;ab&lt;/b&gt;cd</text>
</svg>
