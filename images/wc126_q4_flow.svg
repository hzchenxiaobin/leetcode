<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：先判可行性，再按长度递增做区间 DP</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">转移枚举 m = i, i+k-1, i+2(k-1), …</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <polygon points="290,64 420,94 290,124 160,94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="99.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(n-1) % (k-1) == 0 ?</text>
  <path d="M 420.0 94.0 L 460.0 94.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="466.0" y="98.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 290.0 124.0 L 290.0 148.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298.0" y="142.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">否 → 返回 -1</text>
  <rect x="150" y="148" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前缀和 pre，dp[i][i] = 0</text>
  <path d="M 290.0 184.0 L 290.0 206.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="206" width="340" height="60" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="240.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="290.0" y="228.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for len = 2..n:</text>
  <text x="290.0" y="248.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">dp[i][j] = min_m ( dp[i][m] + dp[m+1][j] )</text>
  <path d="M 290.0 266.0 L 290.0 288.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="288" width="340" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="309.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">若 (j-i) % (k-1) == 0：dp[i][j] += sum(i..j)</text>
  <rect x="120" y="334" width="340" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="353.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 dp[0][n-1]</text>
</svg>
