<svg xmlns="http://www.w3.org/2000/svg" width="660" height="412" viewBox="0 0 660 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="412" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：两组数据的完整流水线</text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">左：可以精确到达；右：y 远大于 T(13)，p 被夹到 0，只能停在 (0, 91)</text>

  <g filter="url(#rough2)">
    <rect x="30" y="60" width="600" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 222 60 L 222 378 M 452 60 L 452 378" stroke="#9bb4cc" stroke-width="1.2" fill="none"/>
    <path d="M 30 90 L 630 90 M 30 122 L 630 122 M 30 154 L 630 154 M 30 186 L 630 186 M 30 218 L 630 218 M 30 250 L 630 250 M 30 282 L 630 282 M 30 314 L 630 314 M 30 346 L 630 346 M 30 378 L 630 378" stroke="#d8d8d4" stroke-width="1" fill="none"/>
  </g>

  <g font-size="12.5" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="126" y="80" filter="url(#rough2)">步骤</text>
    <text x="337" y="80" filter="url(#rough2)">x = 5, y = 4</text>
    <text x="541" y="80" filter="url(#rough2)">x = 1, y = 100</text>
  </g>

  <g font-size="12" fill="#444" text-anchor="start">
    <text x="44" y="110" filter="url(#rough2)">N（步数）</text>
    <text x="44" y="142" filter="url(#rough2)">T(N) = N(N+1)/2</text>
    <text x="44" y="174" filter="url(#rough2)">e = T(N) − y</text>
    <text x="44" y="206" filter="url(#rough2)">p*（终点 x 坐标）</text>
    <text x="44" y="238" filter="url(#rough2)">k（X 的个数）</text>
    <text x="44" y="270" filter="url(#rough2)">权重集合</text>
    <text x="44" y="302" filter="url(#rough2)">输出串</text>
    <text x="44" y="334" filter="url(#rough2)">落点 (p, q)</text>
    <text x="44" y="366" filter="url(#rough2)">距离²</text>
  </g>

  <g font-size="12.5" fill="#2e6e2e" text-anchor="middle" font-weight="bold">
    <text x="337" y="110" filter="url(#rough2)">3</text>
    <text x="337" y="142" filter="url(#rough2)">6</text>
    <text x="337" y="174" filter="url(#rough2)">2</text>
    <text x="337" y="206" filter="url(#rough2)">3</text>
    <text x="337" y="238" filter="url(#rough2)">2</text>
    <text x="337" y="270" filter="url(#rough2)">{1, 2}</text>
    <text x="337" y="302" filter="url(#rough2)">YXX</text>
    <text x="337" y="334" filter="url(#rough2)">(3, 3)</text>
    <text x="337" y="366" filter="url(#rough2)">4 + 1 = 5</text>
  </g>
  <g font-size="12.5" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="541" y="110" filter="url(#rough2)">13</text>
    <text x="541" y="142" filter="url(#rough2)">91</text>
    <text x="541" y="174" filter="url(#rough2)">−9</text>
    <text x="541" y="206" filter="url(#rough2)">0（夹到 0）</text>
    <text x="541" y="238" filter="url(#rough2)">0</text>
    <text x="541" y="270" filter="url(#rough2)">空集</text>
    <text x="541" y="302" filter="url(#rough2)">YYYYYYYYYYYYY</text>
    <text x="541" y="334" filter="url(#rough2)">(0, 91)</text>
    <text x="541" y="366" filter="url(#rough2)">1 + 81 = 82</text>
  </g>

  <text x="330" y="398" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">注：官方样例给 (5,4) 的答案是 XYY，落点同样是 (3,3)；最优解不唯一，任意输出均可</text>
</svg>
