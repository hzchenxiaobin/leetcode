<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三段构造演算</text>

  <!-- 表头 -->
  <rect x="32" y="56" width="85" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="84" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">输入 s</text>
  <rect x="117" y="56" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="84" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">n</text>
  <rect x="157" y="56" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="84" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">k</text>
  <rect x="197" y="56" width="95" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="74" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">第 1 段</text>
  <text x="244" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">'1'×(k−1)</text>
  <rect x="292" y="56" width="95" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="74" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">第 2 段</text>
  <text x="339" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">'0'×(n−k)</text>
  <rect x="387" y="56" width="40" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="74" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">末位</text>
  <text x="407" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">'1'</text>
  <rect x="427" y="56" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="84" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">结果</text>

  <!-- 数据行 1："010" -->
  <rect x="32" y="100" width="85" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"010"</text>
  <rect x="117" y="100" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="157" y="100" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="177" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="197" y="100" width="95" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="244" y="130" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">（空串）</text>
  <rect x="292" y="100" width="95" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="339" y="130" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">"00"</text>
  <rect x="387" y="100" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="407" y="130" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"1"</text>
  <rect x="427" y="100" width="60" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f2f" filter="url(#rough2)">"001"</text>

  <!-- 数据行 2："0101" -->
  <rect x="32" y="148" width="85" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"0101"</text>
  <rect x="117" y="148" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="157" y="148" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="177" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="197" y="148" width="95" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="244" y="178" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">"1"</text>
  <rect x="292" y="148" width="95" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="339" y="178" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">"00"</text>
  <rect x="387" y="148" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="407" y="178" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"1"</text>
  <rect x="427" y="148" width="60" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f2f" filter="url(#rough2)">"1001"</text>

  <!-- 数据行 3："110" -->
  <rect x="32" y="196" width="85" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"110"</text>
  <rect x="117" y="196" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="157" y="196" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="177" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="197" y="196" width="95" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="244" y="226" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">"1"</text>
  <rect x="292" y="196" width="95" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="339" y="226" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">"0"</text>
  <rect x="387" y="196" width="40" height="48" fill="#ffffff" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="407" y="226" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"1"</text>
  <rect x="427" y="196" width="60" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f2f" filter="url(#rough2)">"101"</text>

  <!-- 数据行 4："111" -->
  <rect x="32" y="244" width="85" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"111"</text>
  <rect x="117" y="244" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="157" y="244" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="177" y="274" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="197" y="244" width="95" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="244" y="274" text-anchor="middle" font-size="13" fill="#33445e" filter="url(#rough2)">"11"</text>
  <rect x="292" y="244" width="95" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="339" y="274" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">（空串）</text>
  <rect x="387" y="244" width="40" height="48" fill="#f7f7f2" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="407" y="274" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">"1"</text>
  <rect x="427" y="244" width="60" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4f2f" filter="url(#rough2)">"111"</text>

  <!-- 底部注释 -->
  <rect x="60" y="306" width="400" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k = 1：前缀为空串，答案全是前导零；</text>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">k = n：中段为空串，答案全 '1' —— 两种极端均无需特判</text>
</svg>
