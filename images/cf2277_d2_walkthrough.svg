<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算 g(1000)：样例第 4 组，答案 25383</text>
  <path d="M 232 42 Q 390 48 548 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="116" y="58" width="548" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="81" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">n = 1000，k = 9（512 ≤ 1000 &lt; 1024），pos[9] = 479</text>

  <rect x="44" y="112" width="208" height="96" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="148" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一段 用预处理</text>
  <text x="148" y="162" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">pre[9] = g(511)</text>
  <text x="148" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10482</text>

  <rect x="268" y="112" width="248" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="392" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第二段 m′ = 2 … 479</text>
  <text x="392" y="160" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">g(479) − 1 + 478 × 10</text>
  <text x="392" y="180" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">= 9703 + 4780</text>
  <text x="392" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">14483</text>

  <rect x="532" y="112" width="204" height="96" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="634" y="136" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">第三段 n′ = 990 … 1000</text>
  <text x="634" y="160" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">Σ (1033 − n′)，11 项</text>
  <text x="634" y="180" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">= (43 + 33) × 11 / 2</text>
  <text x="634" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">418</text>

  <path d="M 252 160 L 264 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 516 160 L 528 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="44" y="228" width="692" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="390" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">10482 + 14483 + 418 = 25383，与官方输出一致</text>

  <rect x="44" y="290" width="692" height="112" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="314" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">三段端点怎么定：</text>
  <text x="62" y="338" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">t = min(n − 2^k + 2, pos[k]) = min(490, 479) = 479 ⇒ 第二段覆盖 m′ = 2…479</text>
  <text x="62" y="360" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">last = 2^k + t − 2 = 512 + 479 − 2 = 989 ⇒ 第三段从 990 起，共 n − last = 11 项</text>
  <text x="62" y="382" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第一段恰好是 [0, 2^9 − 1] = [0, 511]，直接查 pre[9]</text>

  <text x="390" y="420" text-anchor="middle" font-size="12" fill="#6b6b6b" filter="url(#rough2)">区间询问 [l, r] = g(r) − g(l − 1)，每组数据两次递归</text>
</svg>
