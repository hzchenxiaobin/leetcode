<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="139" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="330" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例走查：n = 5, k = 6（周期 T = 2(n−1) = 8）</text>
  <path d="M 100 36 Q 320 44 540 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- fold symmetry label -->
  <text x="320" y="56" text-anchor="middle" font-size="12" font-style="italic" font-weight="bold" fill="#b85450" filter="url(#sk)">折返对称：pos(6) = pos(8 − 6) = 2</text>

  <!-- fold arc between t=2 and t=6 -->
  <path d="M 208 86 C 250 62, 390 62, 432 86" stroke="#b85450" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" filter="url(#sk)"/>

  <!-- position cells t=0..8 -->
  <g filter="url(#sk)">
    <rect x="72" y="90" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="128" y="90" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="184" y="90" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="240" y="90" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="296" y="90" width="48" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="352" y="90" width="48" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="408" y="90" width="48" height="34" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5"/>
    <rect x="464" y="90" width="48" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="520" y="90" width="48" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="96" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">0</text>
  <text x="152" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">1</text>
  <text x="208" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">2</text>
  <text x="264" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">3</text>
  <text x="320" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">4</text>
  <text x="376" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <text x="432" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">2</text>
  <text x="488" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="544" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0</text>

  <!-- time labels -->
  <text x="96" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">t=0</text>
  <text x="152" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">1</text>
  <text x="208" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">2</text>
  <text x="264" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">3</text>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">4</text>
  <text x="376" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">5</text>
  <text x="432" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">6 = k</text>
  <text x="488" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">7</text>
  <text x="544" y="136" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">8</text>

  <!-- direction arrows: right (blue) -->
  <g filter="url(#sk)" stroke="#4a8edb" stroke-width="1.8" fill="none">
    <path d="M 104 156 L 144 156" marker-end="url(#ar)"/>
    <path d="M 160 156 L 200 156" marker-end="url(#ar)"/>
    <path d="M 216 156 L 256 156" marker-end="url(#ar)"/>
    <path d="M 272 156 L 312 156" marker-end="url(#ar)"/>
  </g>
  <!-- direction arrows: left (green) -->
  <g filter="url(#sk)" stroke="#4a8e4a" stroke-width="1.8" fill="none">
    <path d="M 368 156 L 328 156" marker-end="url(#ar)"/>
    <path d="M 424 156 L 384 156" marker-end="url(#ar)"/>
    <path d="M 480 156 L 440 156" marker-end="url(#ar)"/>
    <path d="M 536 156 L 496 156" marker-end="url(#ar)"/>
  </g>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="120" y="186" width="400" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="210" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">r = k mod 2(n−1) = 6 mod 8 = 6</text>
  <text x="320" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">r = 6 ≥ n = 5，已折返 → ans = 8 − 6 = 2</text>

  <!-- legend -->
  <text x="180" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">→ 向右传（去程）</text>
  <text x="460" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">← 向左传（回程）</text>

  <!-- footer -->
  <text x="320" y="310" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">第 8 秒末球回到 0 号、方向复原，之后每 8 秒循环一遍</text>
</svg>
