<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：|y−x|=1 ⇒ 必是二分图；是二分图 ⇒ BFS 分层天然合法</text>
  <path d="M 190 40 Q 430 48 670 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：奇环无解 -->
  <rect x="36" y="54" width="390" height="300" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="231" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">示例 2：奇环 ⇒ 必有冲突 ⇒ 返回 −1</text>

  <!-- 三角形三边 -->
  <line x1="213" y1="144" x2="143" y2="241" stroke="#9a9a9a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="237" y1="144" x2="316" y2="238" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="152" y1="268" x2="308" y2="268" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 边约束标签 -->
  <text x="122" y="196" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">边(1,2) ✓</text>
  <text x="298" y="176" font-size="11.5" fill="#b07818" filter="url(#rough2)">边(1,3)：要 g₃=2</text>
  <text x="175" y="292" font-size="11.5" fill="#b85450" filter="url(#rough2)">边(2,3)：要 g₃∈{1,3}</text>

  <!-- 节点 -->
  <circle cx="225" cy="128" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="225" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g₁=1</text>
  <circle cx="135" cy="255" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">2</text>
  <text x="96" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">g₂=2</text>
  <circle cx="325" cy="255" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="325" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a34" filter="url(#rough2)">3?</text>

  <text x="231" y="326" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">g₃ 同时被逼「=2」与「∈{1,3}」⇒ 无解</text>
  <text x="231" y="346" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇环 ⟺ 非二分图 ⇒ 返回 −1（785 二着色判定）</text>

  <!-- 右面板：BFS 分层 -->
  <rect x="444" y="54" width="380" height="300" rx="10" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="634" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">二分图：任取源 s，g(v)=dist(s,v) 天然合法</text>

  <!-- 四个分层带 -->
  <rect x="462" y="92" width="330" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="462" y="146" width="330" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="462" y="200" width="330" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="462" y="254" width="330" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <text x="786" y="118" text-anchor="end" font-size="10" fill="#557" filter="url(#rough2)">组1 · dist 0</text>
  <text x="786" y="172" text-anchor="end" font-size="10" fill="#557" filter="url(#rough2)">组2 · dist 1</text>
  <text x="786" y="226" text-anchor="end" font-size="10" fill="#557" filter="url(#rough2)">组3 · dist 2</text>
  <text x="786" y="280" text-anchor="end" font-size="10" fill="#557" filter="url(#rough2)">组4 · dist 3</text>

  <!-- 跨层边 -->
  <line x1="560" y1="130" x2="560" y2="152" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="548" y1="184" x2="523" y2="206" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="572" y1="184" x2="597" y2="206" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="510" y1="240" x2="510" y2="258" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="522" y1="238" x2="596" y2="258" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="610" y1="240" x2="610" y2="258" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="560" cy="114" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="560" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6414" filter="url(#rough2)">5</text>
  <text x="560" y="94" text-anchor="middle" font-size="10" font-weight="bold" fill="#b07818" filter="url(#rough2)">源 s</text>
  <circle cx="560" cy="168" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <circle cx="510" cy="222" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <circle cx="610" cy="222" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="610" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <circle cx="510" cy="276" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <circle cx="610" cy="276" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="610" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">6</text>

  <text x="634" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">每条边恰好跨一层 ⇒ |Δ组号| = 1 ✓（示例 1 的图）</text>
  <text x="634" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">合法性不挑源点：换成任何节点当源，分层照样合法</text>

  <!-- 底部结论 -->
  <rect x="36" y="368" width="788" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">夹逼：相邻 ⇒ 距离差 ≤ 1；二分 ⇒ 距离差为奇数；两者相与 ⇒ 差恰为 1</text>
  <text x="430" y="414" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">于是问题塌缩为：每个连通分量的 BFS 最多能分多少层？—— m = 直径 + 1，各分量独立求和</text>
</svg>
