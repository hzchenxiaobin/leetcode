<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把所有矩形投影到一个轴，再看能分成几段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 的 y 投影：4 个矩形，阈值是"段数 ≥ 3"</text>

  <text x="116" y="104" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">矩形 1</text>
  <rect x="130" y="90" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="134" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">矩形 2</text>
  <rect x="250" y="120" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="164" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">矩形 3</text>
  <rect x="250" y="150" width="60" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="116" y="194" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">矩形 4</text>
  <rect x="370" y="180" width="60" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <path d="M 120 214 L 452 214" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="250" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="370" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="430" y="232" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <path d="M 250 70 L 250 272" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 70 L 370 272" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="250" y="64" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">切 1</text>
  <text x="370" y="64" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">切 2</text>

  <rect x="130" y="248" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="190" y="264" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">段 1</text>
  <rect x="250" y="248" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">段 2</text>
  <rect x="370" y="248" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">段 3</text>

  <path d="M 190 210 L 190 246" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="262" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 ≥ 3 ✓</text>

  <rect x="46" y="290" width="468" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">排序后扫描：区间左端点 ≥ 当前段最大右端点 ⇒ 段数 +1（相接也算新段）</text>
</svg>
