<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="680" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 全流程演算：nums = [19,12,14,6,10,18]，k = 3</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: contribution table ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 单调栈求 L、R，贡献 cnt[i] = (i − L[i]) × (R[i] − i)</text>

  <!-- table outline + header row -->
  <g filter="url(#sk)"><rect x="130" y="92" width="110" height="212" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="240" y="92" width="630" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="240" y="126" width="630" height="178" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="240" y="270" width="630" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>

  <!-- row separators -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="130" y1="160" x2="870" y2="160"/>
    <line x1="130" y1="194" x2="870" y2="194"/>
    <line x1="130" y1="228" x2="870" y2="228"/>
    <line x1="130" y1="262" x2="870" y2="262"/>
  </g>
  <!-- column separators -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="345" y1="92" x2="345" y2="304"/>
    <line x1="450" y1="92" x2="450" y2="304"/>
    <line x1="555" y1="92" x2="555" y2="304"/>
    <line x1="660" y1="92" x2="660" y2="304"/>
    <line x1="765" y1="92" x2="765" y2="304"/>
  </g>

  <!-- labels -->
  <g font-size="12" fill="#555" font-weight="bold">
    <text x="185" y="113" text-anchor="middle">下标 i</text>
    <text x="185" y="147" text-anchor="middle">值 nums</text>
    <text x="185" y="181" text-anchor="middle">质数分数 ps</text>
    <text x="185" y="215" text-anchor="middle">L[i]（≥）</text>
    <text x="185" y="249" text-anchor="middle">R[i]（&gt;）</text>
    <text x="185" y="293" text-anchor="middle" fill="#2e6e2e">cnt[i]</text>
  </g>

  <!-- data -->
  <g font-size="12.5" text-anchor="middle">
    <g fill="#444">
      <text x="292" y="114">0</text><text x="397" y="114">1</text><text x="502" y="114">2</text><text x="607" y="114">3</text><text x="712" y="114">4</text><text x="817" y="114">5</text>
      <text x="292" y="148">19</text><text x="397" y="148">12</text><text x="502" y="148" font-weight="bold" fill="#2e6e2e">14</text><text x="607" y="148">6</text><text x="712" y="148">10</text><text x="817" y="148">18</text>
      <text x="292" y="182">1</text><text x="397" y="182">2</text><text x="502" y="182">2</text><text x="607" y="182">2</text><text x="712" y="182">2</text><text x="817" y="182">2</text>
      <text x="292" y="216">−1</text><text x="397" y="216">−1</text><text x="502" y="216">1</text><text x="607" y="216">2</text><text x="712" y="216">3</text><text x="817" y="216">4</text>
      <text x="292" y="250">1</text><text x="397" y="250">6</text><text x="502" y="250">6</text><text x="607" y="250">6</text><text x="712" y="250">6</text><text x="817" y="250">6</text>
    </g>
    <g fill="#2e6e2e" font-weight="bold">
      <text x="292" y="293">1</text><text x="397" y="293">10</text><text x="502" y="293">4</text><text x="607" y="293">3</text><text x="712" y="293">2</text><text x="817" y="293">1</text>
    </g>
  </g>
  <text x="470" y="330" text-anchor="middle" font-size="11.5" fill="#2e6e2e">Σ cnt = 21 = 6×7/2 ✓（每个子数组恰有一个胜者）</text>

  <!-- ===== Panel 2: greedy ===== -->
  <text x="470" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a9e">② 按值从大到小贪心：每个元素取 t = min(k, cnt[i]) 次</text>

  <!-- cards -->
  <g filter="url(#sk)"><rect x="110" y="392" width="112" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="166" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e6e2e">19</text>
  <text x="166" y="462" text-anchor="middle" font-size="11" fill="#555">cnt = 1</text>

  <g filter="url(#sk)"><rect x="240" y="392" width="112" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="296" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e6e2e">18</text>
  <text x="296" y="462" text-anchor="middle" font-size="11" fill="#555">cnt = 1</text>

  <g filter="url(#sk)"><rect x="370" y="392" width="112" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="426" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#2e6e2e">14</text>
  <text x="426" y="462" text-anchor="middle" font-size="11" fill="#555">cnt = 4</text>

  <g filter="url(#sk)"><rect x="500" y="392" width="112" height="86" rx="8" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g>
  <text x="556" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#aaa">12</text>
  <text x="556" y="462" text-anchor="middle" font-size="11" fill="#aaa">cnt = 10</text>

  <g filter="url(#sk)"><rect x="630" y="392" width="112" height="86" rx="8" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g>
  <text x="686" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#aaa">10</text>
  <text x="686" y="462" text-anchor="middle" font-size="11" fill="#aaa">cnt = 2</text>

  <g filter="url(#sk)"><rect x="760" y="392" width="112" height="86" rx="8" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g>
  <text x="816" y="434" text-anchor="middle" font-size="24" font-weight="bold" fill="#aaa">6</text>
  <text x="816" y="462" text-anchor="middle" font-size="11" fill="#aaa">cnt = 3</text>

  <!-- arrows between cards -->
  <g font-size="16" fill="#999" text-anchor="middle">
    <text x="231" y="440">→</text>
    <text x="361" y="440">→</text>
    <text x="491" y="440">→</text>
    <text x="621" y="440">→</text>
    <text x="751" y="440">→</text>
  </g>

  <!-- step notes under taken cards -->
  <g font-size="10.5" fill="#2e6e2e" text-anchor="middle">
    <text x="166" y="502">t = min(3, 1) = 1</text>
    <text x="166" y="517">k：3 → 2</text>
    <text x="296" y="502">t = min(2, 1) = 1</text>
    <text x="296" y="517">k：2 → 1</text>
    <text x="426" y="502">t = min(1, 4) = 1</text>
    <text x="426" y="517">k：1 → 0，停</text>
  </g>
  <g font-size="10.5" fill="#aaa" text-anchor="middle">
    <text x="556" y="502">跳过</text>
    <text x="686" y="502">跳过</text>
    <text x="816" y="502">跳过</text>
  </g>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="250" y="546" width="440" height="70" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="576" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e6e2e">分数 = 19¹ × 18¹ × 14¹ = 4788 ✓</text>
  <text x="470" y="602" text-anchor="middle" font-size="11.5" fill="#555">每个因子用快速幂 v^t mod (10⁹+7) 累乘，指数可达 ~2.5×10⁹</text>

  <!-- insight -->
  <text x="470" y="650" text-anchor="middle" font-size="11" fill="#888">若 k = 7：会继续取 12³（cnt=10 用掉 3 次）——贪心顺序只影响叙述，选取结果唯一</text>
</svg>
