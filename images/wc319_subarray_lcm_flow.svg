<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：枚举起点 → 前缀 lcm → 非因子早退 → 命中计数</text>
  <path d="M 140 42 Q 320 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- outer loop -->
  <g filter="url(#sk)"><rect x="150" y="56" width="280" height="38" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="290" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">外层：枚举起点 i = 0 … n−1</text>
  <path d="M 290 94 L 290 114" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- l = 1 -->
  <g filter="url(#sk)"><rect x="220" y="118" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="290" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">l = 1</text>
  <text x="208" y="140" text-anchor="end" font-size="10" fill="#5a8a5a">lcm(1,x)=x</text>
  <path d="M 290 152 L 290 172" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- inner loop -->
  <g filter="url(#sk)"><rect x="150" y="176" width="280" height="38" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="290" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">内层：j = i … n−1（向右扩展）</text>
  <path d="M 290 214 L 290 238" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: divisibility -->
  <g filter="url(#sk)"><polygon points="290,242 412,278 290,314 168,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="290" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" font-family="monospace">k % nums[j] == 0 ?</text>
  <path d="M 412 278 L 440 278" stroke="#b85450" stroke-width="1.5" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="424" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">No</text>
  <g filter="url(#sk)"><rect x="444" y="256" width="180" height="44" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="534" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">break → 换下一个起点</text>
  <text x="534" y="291" text-anchor="middle" font-size="10" fill="#b85450">含非因子的子数组 lcm 必 ≠ k</text>
  <path d="M 290 314 L 290 340" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="304" y="332" font-size="11" font-weight="bold" fill="#2e6e2e">Yes</text>

  <!-- lcm update -->
  <g filter="url(#sk)"><rect x="190" y="344" width="200" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="290" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">l = lcm(l, nums[j])</text>
  <text x="180" y="368" text-anchor="end" font-size="10" fill="#5a8a5a">先判后更 → l | k</text>
  <path d="M 290 382 L 290 406" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2: hit? -->
  <g filter="url(#sk)"><polygon points="290,408 380,444 290,480 200,444" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="290" y="449" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">l == k ?</text>
  <path d="M 380 444 L 408 444" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">Yes</text>
  <g filter="url(#sk)"><rect x="412" y="422" width="212" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="518" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans += 1 —— 勿 break！</text>
  <text x="518" y="457" text-anchor="middle" font-size="10" fill="#5a8a5a">续加 k 的因子，lcm 仍 = k</text>
  <path d="M 290 480 L 290 498" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="304" y="494" font-size="11" font-weight="bold" fill="#888">No</text>

  <!-- j++ -->
  <g filter="url(#sk)"><rect x="200" y="502" width="180" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="290" y="524" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a94" font-family="monospace">j++，继续扩展</text>

  <!-- loop back -->
  <path d="M 200 519 C 108 519, 108 278, 164 278" stroke="#888" stroke-width="1.3" stroke-dasharray="6 5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="98" y="400" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 98 400)">回到整除判定</text>

  <!-- return -->
  <g filter="url(#sk)"><rect x="430" y="502" width="194" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="527" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">全部起点枚举完 → return ans</text>
</svg>
