<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="340" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s1 = "abc"、s2 = "bca"，BFS 两层命中</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">表格记录每层弹出的状态与它展开出的合法后继</text>
  <rect x="34" y="88" width="64" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">层</text>
  <rect x="98" y="88" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">弹出状态</text>
  <rect x="194" y="88" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首个失配位</text>
  <rect x="290" y="88" width="236" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">合法交换</text>
  <rect x="526" y="88" width="60" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="556" y="109.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">后继</text>
  <rect x="34" y="124" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 1 层</text>
  <rect x="98" y="124" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">abc</text>
  <rect x="194" y="124" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i = 0</text>
  <rect x="290" y="124" width="236" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">j = 1（b）→ bac；j = 2 的 c ≠ b 跳过</text>
  <rect x="526" y="124" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="556" y="145.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">bac</text>
  <rect x="34" y="160" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 2 层</text>
  <rect x="98" y="160" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">bac</text>
  <rect x="194" y="160" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i = 1</text>
  <rect x="290" y="160" width="236" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">j = 2（c = s2[1]）→ bca = s2</text>
  <rect x="526" y="160" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="556" y="181.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">bca</text>
  <rect x="34" y="196" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="66" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">命中</text>
  <rect x="98" y="196" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="146" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="194" y="196" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="290" y="196" width="236" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="408" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">首次生成 s2，距离 = 2</text>
  <rect x="526" y="196" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="556" y="217.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="24" y="250" width="572" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="268" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">第 1 层：i = 0 处 a ≠ b，只有 j = 1 的 b 可用，换出 "bac"；j = 2 的 c 不等于 s2[0] = b，无意义。</text>
  <text x="34" y="282.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">第 2 层：i = 1 处 a ≠ c，j = 2 的 c 可用且它自己错位（c ≠ a），换成 "bca" 直接命中目标。</text>
</svg>
