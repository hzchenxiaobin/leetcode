<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次扫描：b 每次归零就多一段（贪心切分）</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">扫描顺序固定，遇到 b = 0 立刻切 —— 不留到后面再切</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="190" y="64" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="310" y="87" fill="#3a4a66" filter="url(#rough2)">开始：ans = 0，b = 0</text>
    <rect x="175" y="116" width="270" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="310" y="139" fill="#3a4a66" filter="url(#rough2)">for c in s（从左到右扫一遍）</text>
    <rect x="160" y="168" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
    <text x="310" y="193" fill="#8a6a20" filter="url(#rough2)">b += 1 若 c = 'L'，否则 b −= 1</text>
  </g>

  <g stroke="#666" stroke-width="1.5" fill="none">
    <path d="M 310 100 L 310 114" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 152 L 310 166" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 310 208 L 310 226" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 215 268 L 215 334" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 405 268 L 430 268 L 430 334" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 210 380 L 210 404" filter="url(#rough2)"/>
    <path d="M 430 380 L 430 404" filter="url(#rough2)"/>
    <path d="M 210 404 L 430 404" filter="url(#rough2)"/>
    <path d="M 310 404 L 310 426" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <polygon points="310,228 405,268 310,308 215,268" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="273" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">b == 0 ?</text>

  <text x="222" y="302" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="440" y="262" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">否</text>

  <g text-anchor="middle">
    <rect x="120" y="336" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
    <text x="210" y="357" font-size="12" fill="#3a5a30" filter="url(#rough2)">ans += 1</text>
    <text x="210" y="372" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">在这里切一段</text>
    <rect x="340" y="336" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
    <text x="430" y="357" font-size="12" fill="#8a3a36" filter="url(#rough2)">不切，继续扫</text>
    <text x="430" y="372" font-size="9.5" fill="#b85450" filter="url(#rough2)">b 还没回到 0</text>
    <rect x="180" y="428" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="310" y="453" font-size="12" fill="#3a4a66" filter="url(#rough2)">扫完整个 s → 返回 ans</text>
  </g>

  <text x="310" y="497" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">循环不变量：扫过 i 个字符后，ans 恰为前缀 s[0..i) 能切出的最大段数</text>
</svg>
