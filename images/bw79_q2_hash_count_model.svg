<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">哈希计数：按发件人累计单词数</text>

  <!-- 左侧：消息 + 发件人 -->
  <text x="115" y="60" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">messages[i]（senders[i] 发出）</text>
  <g filter="url(#rough2)">
    <rect x="18" y="72" width="195" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="18" y="118" width="195" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="18" y="164" width="195" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="18" y="210" width="195" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="28" y="95">"Hello userTwooo"</text>
    <text x="205" y="95" text-anchor="end" fill="#4a7a3a">Alice · 2 词</text>
    <text x="28" y="141">"Hi userThree"</text>
    <text x="205" y="141" text-anchor="end" fill="#4a7a3a">userTwo · 2 词</text>
    <text x="28" y="187">"Wonderful day Alice"</text>
    <text x="205" y="187" text-anchor="end" fill="#4a7a3a">userThree · 3 词</text>
    <text x="28" y="233">"Nice day userThree"</text>
    <text x="205" y="233" text-anchor="end" fill="#4a7a3a">Alice · 3 词</text>
  </g>
  <text x="115" y="272" font-size="12" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">单词数 = 空格数 + 1</text>
  <text x="115" y="290" font-size="12" fill="#d6a040" filter="url(#rough2)" text-anchor="middle">不必真正 split，数空格即可</text>

  <!-- 中间箭头：按 senders[i] 归桶 -->
  <path d="M 219 91 C 260 91, 272 152, 306 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 219 137 C 252 137, 262 204, 306 212" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 219 183 C 252 183, 262 272, 306 278" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 219 229 C 260 229, 272 176, 306 170" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="130" font-size="11" fill="#888" filter="url(#rough2)" text-anchor="middle">按名字归桶</text>

  <!-- 右侧：哈希桶 -->
  <text x="430" y="60" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">cnt 哈希表（累计后）</text>
  <g filter="url(#rough2)">
    <rect x="316" y="140" width="228" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6"/>
    <rect x="316" y="204" width="228" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="316" y="260" width="228" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333">
    <text x="332" y="162">Alice：2 + 3 = 5 词</text>
    <text x="332" y="182" fill="#4a7a3a" font-weight="bold">单词数最多 ← 答案</text>
    <text x="332" y="231">userTwo：2 词</text>
    <text x="332" y="287">userThree：3 词</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="276" y="322" width="268" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="410" y="340" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">同一发件人的多条消息要「累加」，</text>
  <text x="410" y="357" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">不是分别比较！</text>
</svg>
