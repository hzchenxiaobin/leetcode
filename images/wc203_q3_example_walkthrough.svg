<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：arr = [3,5,1,2,4]，m = 1，n = 5 → 答案 4</text>
  <path d="M 170 34 Q 330 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="55"  y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">步骤</text>
  <text x="120" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">置位 p</text>
  <text x="269" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">串状态（位置 1..5）</text>
  <text x="445" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">组</text>
  <text x="545" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">cnt[1]</text>
  <text x="612" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">ans</text>

  <!-- 行分隔线 -->
  <path d="M 30 112 L 630 112" stroke="#e4e4e4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 164 L 630 164" stroke="#e4e4e4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 216 L 630 216" stroke="#e4e4e4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 268 L 630 268" stroke="#e4e4e4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 320 L 630 320" stroke="#e4e4e4" stroke-width="1" filter="url(#rough2)"/>

  <!-- 步骤 4 高亮底色 -->
  <rect x="24" y="216" width="614" height="52" fill="#fff8e1" opacity="0.75" filter="url(#rough2)"/>

  <!-- ===== 步骤 1：p=3，00100 ===== -->
  <text x="55" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">步 1</text>
  <text x="120" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="190" y="68" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="222" y="68" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="254" y="68" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="286" y="68" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="68" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="237" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="269" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="301" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="333" y="88" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="445" y="91" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="545" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="612" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- ===== 步骤 2：p=5，00101 ===== -->
  <text x="55" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">步 2</text>
  <text x="120" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="190" y="120" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="222" y="120" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="254" y="120" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="120" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="120" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="205" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="237" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="269" y="140" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="301" y="140" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="333" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="445" y="143" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1], [1]</text>
  <text x="545" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="612" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- ===== 步骤 3：p=1，10101 ===== -->
  <text x="55" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">步 3</text>
  <text x="120" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190" y="172" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="222" y="172" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="254" y="172" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="172" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="172" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="237" y="192" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="269" y="192" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="301" y="192" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="333" y="192" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="445" y="195" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1], [1], [1]</text>
  <text x="545" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="612" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- ===== 步骤 4：p=2，11101（最后一次 cnt[1] > 0） ===== -->
  <text x="55" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">步 4</text>
  <text x="120" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190" y="224" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="222" y="224" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="254" y="224" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="286" y="224" width="30" height="30" rx="4" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="224" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="244" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="237" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="269" y="244" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="301" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <text x="333" y="244" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="445" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">[111], [1]</text>
  <text x="445" y="256" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">L=1, R=1 → 合并成 111</text>
  <text x="545" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="612" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- ===== 步骤 5：p=4，11111 ===== -->
  <text x="55" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">步 5</text>
  <text x="120" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="190" y="276" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="276" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="276" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="276" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="318" y="276" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="296" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="237" y="296" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="269" y="296" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="301" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="333" y="296" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="445" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[11111]</text>
  <text x="445" y="308" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">L=3, R=1 → 全串一组</text>
  <text x="545" y="299" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="612" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 图例 -->
  <rect x="190" y="328" width="13" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="339" font-size="10" fill="#555" filter="url(#rough2)">本步新置 1</text>
  <rect x="292" y="328" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="339" font-size="10" fill="#555" filter="url(#rough2)">新合并成的组</text>
  <rect x="424" y="328" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="339" font-size="10" fill="#555" filter="url(#rough2)">已有组</text>

  <!-- 结论框 -->
  <rect x="20" y="358" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">输出 4</text>
  <text x="170" y="398" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">步 4 是最后一个存在长度 1 组的步骤</text>

  <rect x="340" y="358" width="300" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="380" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">步 5：p=4 把 [111] 与 [1] 并成 [11111]</text>
  <text x="490" y="398" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt[1] 归零，ans 停在 4 不再更新</text>
</svg>
