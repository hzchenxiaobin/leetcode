<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">关键结构：删光 "ab" 后，每段的栈内残余必为 b…b a…a</text>

  <!-- 左：栈机制 -->
  <text x="130" y="60" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">栈式扫描（删 ab）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="76" width="120" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="130" y="98" text-anchor="middle" font-size="14" fill="#b85450">a a a …</text>
    <rect x="70" y="114" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="136" text-anchor="middle" font-size="14" fill="#446688">b b b …</text>
    <rect x="70" y="152" width="120" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.8"/>
    <text x="130" y="174" text-anchor="middle" font-size="14" fill="#777">（栈底）</text>
  </g>
  <path d="M210,120 L210,84" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="96" font-size="12" fill="#b85450" filter="url(#rough2)">b 入栈时</text>
  <text x="238" y="112" font-size="12" fill="#b85450" filter="url(#rough2)">栈顶是 a</text>
  <text x="238" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">→ 立即配对删除</text>
  <text x="130" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">所以 a 之上只会再压 a，</text>
  <text x="130" y="232" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b 一旦在 a 下面就永远沉底</text>
  <text x="130" y="258" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">残余 = b^p a^q（分段同理）</text>

  <!-- 右：残余计数 -->
  <text x="390" y="60" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">第二遍数 ba 对数</text>
  <g filter="url(#rough2)">
    <rect x="330" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="345" y="98" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <rect x="360" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="375" y="98" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <rect x="390" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="405" y="98" text-anchor="middle" font-size="14" fill="#446688">…</text>
    <rect x="420" y="76" width="30" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="435" y="98" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <rect x="330" y="114" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="345" y="136" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="360" y="114" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="375" y="136" text-anchor="middle" font-size="14" fill="#b85450">…</text>
    <rect x="390" y="114" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="405" y="136" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="420" y="114" width="30" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="435" y="136" text-anchor="middle" font-size="14" fill="#b85450">a</text>
  </g>
  <text x="390" y="172" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">可删的 ba 对数 = min(p, q)</text>
  <text x="390" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">设第一遍删了 A* 对 ab，则</text>
  <text x="390" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cA = A* + q，cB = A* + p</text>
  <text x="390" y="248" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">总删除数 = A* + min(p,q)</text>
  <text x="390" y="272" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">= min(cA, cB) ← 资源上界！</text>

  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">两遍贪心同时达到「ab 对数最多」与「总对数最多」两个上界，</text>
  <text x="260" y="332" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">故得分 y·总对数 + (x−y)·#ab 在 x ≥ y 时最优</text>
</svg>
