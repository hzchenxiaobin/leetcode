<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">逐位试填：位 b 填 0 的合法补全数 = C(b, rem)</text>
  <path d="M 220 44 Q 440 52 660 44" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- start box -->
  <rect x="56" y="78" width="190" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="151" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">初始化</text>
  <text x="151" y="119" text-anchor="middle" font-size="11.5" fill="#333">r = n，rem = k，ans = 0</text>
  <text x="151" y="136" text-anchor="middle" font-size="11.5" fill="#333">b = 49（答案最高位）</text>
  <path d="M 252 110 L 322 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="430,68 532,110 430,152 328,110" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">r &gt; C(b, rem) ?</text>

  <!-- yes branch (right) -->
  <path d="M 532 110 L 574 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="548" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">是</text>
  <rect x="580" y="80" width="280" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="720" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">位 b 填 1</text>
  <text x="720" y="126" text-anchor="middle" font-size="11.5" fill="#333">r −= C(b, rem)；rem −= 1</text>

  <!-- no branch (down) -->
  <path d="M 430 152 L 430 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="442" y="170" font-size="11.5" font-weight="bold" fill="#4a7a3a">否</text>
  <rect x="300" y="184" width="260" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="207" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">位 b 填 0</text>
  <text x="430" y="227" text-anchor="middle" font-size="11.5" fill="#333">r、rem 保持不变</text>

  <!-- arrows to merge box -->
  <path d="M 430 240 L 430 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 720 142 C 720 240 640 300 536 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge box -->
  <rect x="330" y="300" width="206" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="433" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">b −= 1（往低位走）</text>
  <text x="433" y="342" text-anchor="middle" font-size="11" fill="#7a5415">处理下一位</text>

  <!-- loop back -->
  <path d="M 330 327 C 230 327 236 112 322 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">b ≥ 0</text>

  <!-- exit -->
  <path d="M 536 327 L 594 327" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="316" text-anchor="middle" font-size="11" fill="#888">b &lt; 0</text>
  <rect x="600" y="300" width="230" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="715" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">返回 ans</text>
  <text x="715" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a">（此时 r=1，rem=0）</text>

  <!-- bottom left panel: why C(b, rem) -->
  <rect x="40" y="392" width="480" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="418" font-size="13" font-weight="bold" fill="#446688">为什么是 C(b, rem)？</text>

  <!-- bit slots -->
  <rect x="64" y="434" width="26" height="30" rx="3" fill="#c9d6e8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="434" width="26" height="30" rx="3" fill="#c9d6e8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="124" y="434" width="26" height="30" rx="3" fill="#c9d6e8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="156" y="434" width="26" height="30" rx="3" fill="#f5c6aa" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="190" y="434" width="26" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="434" width="26" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="434" width="26" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="434" width="26" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="310" y="434" width="26" height="30" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="352" y="456" font-size="16" fill="#999">…</text>

  <text x="107" y="478" text-anchor="middle" font-size="10" fill="#446688">前缀已定</text>
  <text x="169" y="478" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">当前位 b</text>
  <path d="M 188 484 L 190 480 L 336 480 L 338 484" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="262" y="498" text-anchor="middle" font-size="10" fill="#666">低 b 位：任选 rem 个放 1 → C(b, rem) 种</text>
  <text x="64" y="524" font-size="11" fill="#333">这些补全在位 b 首次分岔（0 &lt; 1）→ 全都小于「位 b 填 1」的补全</text>

  <!-- bottom right panel: details -->
  <rect x="540" y="392" width="310" height="148" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="562" y="418" font-size="13" font-weight="bold" fill="#7a5415">两个细节</text>
  <text x="562" y="444" font-size="11.5" fill="#333">① rem &gt; b 时 C(b, rem) = 0（低位放不下）</text>
  <text x="562" y="464" font-size="11.5" fill="#333">   → r &gt; 0 恒成立，自动强制填 1，无需特判</text>
  <text x="562" y="492" font-size="11.5" fill="#333">② r = C(b, rem) 时必须填 0</text>
  <text x="562" y="512" font-size="11.5" fill="#333">   （目标恰好是 0 分支的最后一个）</text>
  <text x="562" y="534" font-size="11" fill="#7a5415">50 轮 × O(1)，与 n 的大小无关</text>
</svg>
