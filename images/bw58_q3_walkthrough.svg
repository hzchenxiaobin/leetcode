<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">dp 转移：dp[j][i] = min over t 的 dp[j−1][t] + cost(t, i−1)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">nums = [10,20,15,30,20]，k = 2（— 表示不可达 INF）</text>

  <!-- dp 表示意 -->
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <!-- 表头：i = 0..5 -->
    <text x="120" y="66" fill="#3a4a66" font-weight="bold">j \ i</text>
    <text x="180" y="66" fill="#3a4a66" font-weight="bold">0</text>
    <text x="240" y="66" fill="#3a4a66" font-weight="bold">1</text>
    <text x="300" y="66" fill="#3a4a66" font-weight="bold">2</text>
    <text x="360" y="66" fill="#3a4a66" font-weight="bold">3</text>
    <text x="420" y="66" fill="#3a4a66" font-weight="bold">4</text>
    <text x="480" y="66" fill="#3a4a66" font-weight="bold">5</text>

    <!-- j=0 行 -->
    <text x="120" y="94" fill="#3a4a66" font-weight="bold">j=0</text>
    <rect x="162" y="78" width="46" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="222" y="78" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="282" y="78" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="342" y="78" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="402" y="78" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="462" y="78" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="185" y="95">0</text>
    <text x="245" y="95">0</text>
    <text x="305" y="95">10</text>
    <text x="365" y="95">15</text>
    <text x="425" y="95">45</text>
    <text x="485" y="95">55</text>

    <!-- j=1 行 -->
    <text x="120" y="134" fill="#3a4a66" font-weight="bold">j=1</text>
    <rect x="162" y="118" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="118" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="282" y="118" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="342" y="118" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="402" y="118" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="462" y="118" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <text x="185" y="135">—</text>
    <text x="245" y="135">—</text>
    <text x="305" y="135">0</text>
    <text x="365" y="135" font-weight="bold">5</text>
    <text x="425" y="135">15</text>
    <text x="485" y="135">25</text>

    <!-- j=2 行 -->
    <text x="120" y="174" fill="#3a4a66" font-weight="bold">j=2</text>
    <rect x="162" y="158" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="222" y="158" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="282" y="158" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="342" y="158" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="402" y="158" width="46" height="24" fill="#fff" stroke="#bbb" stroke-width="1.1" rx="4"/>
    <rect x="462" y="158" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="185" y="175">—</text>
    <text x="245" y="175">—</text>
    <text x="305" y="175">—</text>
    <text x="365" y="175">0</text>
    <text x="425" y="175">5</text>
    <text x="485" y="175" font-weight="bold">15</text>
  </g>

  <!-- 转移箭头 -->
  <path d="M 365 146 L 365 158" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 130 L 476 156" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dp[2][5] ← dp[1][3] + cost(3,4)</text>

  <!-- cost 公式框 -->
  <rect x="60" y="216" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">cost(l, r) = max(nums[l..r]) × (r−l+1) − (pre[r+1] − pre[l])</text>
  <text x="280" y="260" text-anchor="middle" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">例：cost(3,4) = 30×2 − 50 = 10；cost(1,2) = 20×2 − 35 = 5</text>

  <!-- 答案框 -->
  <rect x="60" y="292" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">答案 = min(dp[0][n], dp[1][n], dp[2][n]) = min(55, 25, 15) = 15</text>
  <text x="280" y="333" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">对应分段 [10] | [20,15] | [30,20]，size = [10,20,20,30,30]</text>
</svg>
