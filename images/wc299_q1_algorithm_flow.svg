<svg xmlns="http://www.w3.org/2000/svg" width="640" height="660" viewBox="0 0 640 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="660" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描 · 角色分流 · 违例短路</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 侧注 -->
  <g filter="url(#sk)"><rect x="452" y="54" width="172" height="118" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="466" y="76" font-size="11" font-weight="bold" fill="#7a5415">三个小注</text>
  <text x="466" y="96" font-size="10.5" fill="#666">① 短路：任一格违例</text>
  <text x="476" y="112" font-size="10.5" fill="#666">立即返回 false</text>
  <text x="466" y="132" font-size="10.5" fill="#666">② 最坏 n² ≤ 10⁴ 格</text>
  <text x="476" y="148" font-size="10.5" fill="#666">（n ≤ 100）</text>
  <text x="466" y="164" font-size="10.5" fill="#666">③ 原地 O(1) 空间</text>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="170" cy="56" rx="40" ry="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="170" y="61" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 170 70 L 170 80" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="105" y="84" width="130" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="170" y="102" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">n = grid.size()</text>
  <path d="M 170 110 L 170 120" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="135" y="122" width="70" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="170" y="140" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i = 0</text>
  <path d="M 170 148 L 170 158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 外层条件 -->
  <g filter="url(#sk)"><polygon points="170,160 214,190 170,220 126,190" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="170" y="195" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">i &lt; n ?</text>

  <path d="M 214 190 L 296 190" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="255" y="182" text-anchor="middle" font-size="11.5" fill="#888">否（扫完）</text>
  <g filter="url(#sk)"><ellipse cx="354" cy="190" rx="56" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="354" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 true</text>

  <path d="M 170 220 L 170 232" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="231" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><rect x="135" y="236" width="70" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="170" y="254" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">j = 0</text>
  <path d="M 170 262 L 170 272" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 内层条件 -->
  <g filter="url(#sk)"><polygon points="170,274 214,304 170,334 126,304" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="170" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">j &lt; n ?</text>

  <path d="M 126 304 L 116 304" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="121" y="296" font-size="11.5" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="54" y="291" width="60" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="84" y="309" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i++</text>
  <path d="M 84 291 L 84 190 L 120 190" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="74" y="245" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 74 245)">换下一行</text>

  <path d="M 170 334 L 170 346" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="345" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- 角色分流 -->
  <g filter="url(#sk)"><polygon points="170,362 292,400 170,438 48,400" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="170" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">onDiag ?</text>
  <text x="170" y="414" text-anchor="middle" font-size="10.5" fill="#888" font-family="monospace">(i==j) ‖ (i+j==n−1)</text>

  <path d="M 292 400 L 332 400" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="390" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">是·对角线</text>

  <g filter="url(#sk)"><polygon points="436,364 536,400 436,436 336,400" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="436" y="405" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" font-family="monospace">grid[i][j] ≠ 0 ?</text>

  <path d="M 536 400 L 556 400" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="545" y="392" font-size="11.5" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="560" y="387" width="58" height="26" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="589" y="405" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">j++</text>
  <path d="M 589 387 L 589 304 L 218 304" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="601" y="345" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 601 345)">下一格</text>

  <path d="M 436 436 L 436 474" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="460" font-size="11.5" fill="#b85450" font-weight="bold">否·违例</text>
  <g filter="url(#sk)"><ellipse cx="436" cy="492" rx="56" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="436" y="497" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 false</text>

  <path d="M 48 400 L 24 400 L 24 540 L 46 540" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="14" y="470" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 14 470)">否·非对角线</text>

  <g filter="url(#sk)"><polygon points="150,504 250,540 150,576 50,540" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="150" y="545" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" font-family="monospace">grid[i][j] = 0 ?</text>

  <path d="M 250 540 L 589 540 L 589 417" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="532" font-size="11.5" fill="#2e6e2e" font-weight="bold">是·合规</text>

  <path d="M 150 576 L 150 620 L 436 620 L 436 511" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="160" y="600" font-size="11.5" fill="#b85450" font-weight="bold">否·违例</text>

  <text x="320" y="650" text-anchor="middle" font-size="12" fill="#888">两个菱形查方向相反的期望 —— 违例即短路返回 false，合法矩阵才扫满 n² 格</text>
</svg>
