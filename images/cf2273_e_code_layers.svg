<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-3" y="-3" width="726" height="406" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">码字按「最大数字」分层（下图是 k = 2 的完整清单）</text>

  <!-- 层 0 -->
  <rect x="36" y="48" width="340" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="52" y="72" font-size="13" fill="#33502a" filter="url(#rough2)">层 v=0 ：1 个码字 = 1² − 0²</text>
  <text x="52" y="100" font-size="13" fill="#2f4f6f" filter="url(#rough2)">(0,0)</text>
  <text x="52" y="118" font-size="11.5" fill="#666" filter="url(#rough2)">最大数字为 0：只有全零</text>

  <!-- 层 1 -->
  <rect x="36" y="134" width="340" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="52" y="158" font-size="13" fill="#2f4f6f" filter="url(#rough2)">层 v=1 ：3 个码字 = 2² − 1²</text>
  <text x="52" y="186" font-size="13" fill="#2f4f6f" filter="url(#rough2)">(1,0)　(1,1)　(0,1)</text>
  <text x="52" y="204" font-size="11.5" fill="#666" filter="url(#rough2)">第 2、3、4 小的袋子取这三个</text>

  <!-- 层 2 -->
  <rect x="36" y="220" width="340" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="52" y="244" font-size="13" fill="#8a6d1f" filter="url(#rough2)">层 v=2 ：5 个码字 = 3² − 2²</text>
  <text x="52" y="272" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(2,0)　(2,1)　(2,2)　(0,2)　(1,2)</text>
  <text x="52" y="290" font-size="11.5" fill="#666" filter="url(#rough2)">第 5 到第 9 小的袋子取这五个</text>

  <!-- 右侧说明 -->
  <rect x="392" y="48" width="292" height="248" fill="#fffdf6" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="410" y="76" font-size="13" fill="#8a6d1f" filter="url(#rough2)">为什么这样排？</text>
  <text x="410" y="106" font-size="12" fill="#333" filter="url(#rough2)">前 (v+1)^k 个码字</text>
  <text x="410" y="128" font-size="12" fill="#333" filter="url(#rough2)">= 每一位都 ≤ v 的所有码字</text>
  <text x="410" y="158" font-size="12" fill="#333" filter="url(#rough2)">于是第 j 个码字的最大数字</text>
  <text x="410" y="180" font-size="12" fill="#8a3030" filter="url(#rough2)">= min{ v : (v+1)^k ≥ j }</text>
  <text x="410" y="202" font-size="12" fill="#333" filter="url(#rough2)">≤ c_j（第 j 小的容量）</text>
  <text x="410" y="232" font-size="12" fill="#33502a" filter="url(#rough2)">⇒ 每一位都 ≤ c_j ≤ a_i，合法</text>
  <text x="410" y="256" font-size="12" fill="#33502a" filter="url(#rough2)">⇒ 不同 j 拿不同码字，互异</text>
  <text x="410" y="282" font-size="11.5" fill="#666" filter="url(#rough2)">两条合起来：k 轮一定分得开</text>

  <!-- 层内顺序 -->
  <rect x="36" y="308" width="648" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="52" y="332" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">层内顺序（实现用）：按「第一个等于 v 的位置 i」分块，块大小 v^(i−1)·(v+1)^(k−i)</text>
  <text x="52" y="356" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">i 之前是 v 进制、i 之后是 (v+1) 进制 —— 于是第 t 个码字可以 O(k) 直接反查</text>
  <text x="52" y="376" font-size="11.5" fill="#666" filter="url(#rough2)">各块大小之和 = (v+1)^k − v^k，正好是这一层的码字数</text>
</svg>
