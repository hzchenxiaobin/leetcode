<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">分类决策：答案只有 0 / 1 / 2 / 3 / −1 五种</text>

  <rect x="110" y="44" width="180" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">计算 t = sorted(s)</text>
  <path d="M200,80 L200,92" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 -->
  <path d="M200,96 L322,126 L200,156 L78,126 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="131" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">s == t ？</text>
  <path d="M322,126 L390,126" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="119" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="396" y="108" width="216" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="131" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 · 已经有序</text>
  <path d="M200,156 L200,172" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="169" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- D2 -->
  <path d="M200,176 L322,206 L200,236 L78,206 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="211" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">n == 2 ？</text>
  <path d="M322,206 L390,206" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="199" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="396" y="188" width="216" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="211" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 · 无有效操作</text>
  <path d="M200,236 L200,252" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="249" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- D3 -->
  <path d="M200,256 L336,288 L200,320 L64,288 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="284" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">与 t 的失配区间</text>
  <text x="200" y="300" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">[p, q] 是真子串？</text>
  <path d="M336,288 L390,288" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="281" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="396" y="270" width="216" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="293" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1 · 排一次 [p, q]</text>
  <path d="M200,320 L200,336" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="333" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- D4 -->
  <path d="M200,340 L336,372 L200,404 L64,372 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">s[0] 是唯一最大值</text>
  <text x="200" y="384" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">且 s[n−1] 是唯一最小值？</text>
  <path d="M336,372 L390,372" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="365" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <rect x="396" y="354" width="216" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="504" y="377" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3 · 首尾卡死，先腾出一端</text>
  <path d="M200,404 L200,420" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="417" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <rect x="78" y="426" width="244" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="449" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 · 一端可救 + 一次收尾</text>

  <text x="320" y="486" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">−1 仅当 n = 2 且 s[0] &gt; s[1]：真子串只剩两个单字符，「排序」不改变任何东西</text>
</svg>
