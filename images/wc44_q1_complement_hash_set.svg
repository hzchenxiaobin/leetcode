<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：把「配对」变成「查补数」</text>
  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">a + b = k  ⇔  b = k − a：遍历每个节点，只问「k − val 出现过吗」</text>

  <g stroke="#8a8a8a" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 280 110 L 195 180"/>
    <path d="M 280 110 L 370 180"/>
    <path d="M 195 180 L 135 250"/>
    <path d="M 195 180 L 245 250"/>
    <path d="M 370 180 L 425 250"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="280" cy="110" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="280" y="115" text-anchor="middle" font-size="13" fill="#8a6a20">5</text>

    <circle cx="195" cy="180" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="195" y="185" text-anchor="middle" font-size="13" fill="#3a4a66">3</text>

    <circle cx="370" cy="180" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="370" y="185" text-anchor="middle" font-size="13" fill="#3a4a66">6</text>

    <circle cx="135" cy="250" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="135" y="255" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>

    <circle cx="245" cy="250" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="245" y="255" text-anchor="middle" font-size="13" fill="#8a3a36">4</text>

    <circle cx="425" cy="250" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="425" y="255" text-anchor="middle" font-size="13" fill="#3a4a66">7</text>
  </g>

  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">k − 5 = 4，记下它</text>
  <text x="278" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">9 − 4 = 5 已在表中 ✔</text>

  <rect x="55" y="300" width="450" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">5 ｜ 9−5=4 ∉ seen → 插入 5</text>
  <text x="72" y="342" font-size="10" fill="#555" filter="url(#rough2)">3 ｜ 9−3=6 ∉ seen → 插入 3　　2 ｜ 9−2=7 ∉ seen → 插入 2</text>
  <text x="72" y="362" font-size="10" fill="#b85450" filter="url(#rough2)">4 ｜ 9−4=5 ∈ seen ✔ → 返回 true（每个节点只处理一次）</text>
</svg>
