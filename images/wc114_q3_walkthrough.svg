<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 226"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="226" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 1：strs = ["ca","bb","ac"]</text>
  <rect x="18" y="50" width="62" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">列 c</text>
  <rect x="80" y="50" width="132" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">第 0 对 ca/bb</text>
  <rect x="212" y="50" width="132" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="278" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">第 1 对 bb/ac</text>
  <rect x="344" y="50" width="106" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="397" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="450" y="50" width="152" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="526" y="72.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="18" y="86" width="62" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="80" y="86" width="132" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">c(2) &gt; b(1)</text>
  <rect x="212" y="86" width="132" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="278" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">b(1) &gt; a(0)</text>
  <rect x="344" y="86" width="106" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="397" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">两对都逆序</text>
  <rect x="450" y="86" width="152" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="526" y="108.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">删除，ans = 1</text>
  <rect x="18" y="122" width="62" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="49" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="80" y="122" width="132" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">a(0) &lt; b(1)</text>
  <rect x="212" y="122" width="132" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="278" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">b(1) &lt; c(2)</text>
  <rect x="344" y="122" width="106" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="397" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">两对都严格小</text>
  <rect x="450" y="122" width="152" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="526" y="144.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">保留并标记两对</text>
  <text x="280" y="176" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">第 0 列被删除后，结果行变为 "a"、"b"、"c"，非降 → 答案 1</text>
  <text x="280" y="200" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">示例 2 第 0 列 x&lt;y&lt;z 已区分全部行对 → 第 1 列可任意（答案 0）</text>
</svg>
