<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">复杂度对比：枚举边 × 9 组合，替代四重枚举</text>

  <!-- 左：暴力四重 -->
  <rect x="50" y="60" width="220" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">朴素做法</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a3a36" text-anchor="middle">
    <text x="160" y="112">枚举 a-b、b-c、c-d 三条边</text>
    <text x="160" y="132">最坏 O(m²)（n=5×10⁴, m=5×10⁴）</text>
    <text x="160" y="152">≈ 2.5×10⁹ 次检查 → 超时</text>
  </g>

  <!-- 中间箭头 -->
  <path d="M 280 120 C 288 120, 292 120, 300 120" stroke="#446688" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="104" font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">预计算 top3</text>

  <!-- 右：本题解法 -->
  <rect x="304" y="60" width="220" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414" y="88" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">本文做法</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="414" y="112">每点维护 top3 邻居 O(n+m)</text>
    <text x="414" y="132">每条边枚举 3×3 组合 O(9m)</text>
    <text x="414" y="152">总计 O(n+m)，5×10⁴ 瞬间完成</text>
  </g>

  <!-- 下方：流程图 -->
  <text x="280" y="212" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">算法流程</text>
  <g filter="url(#rough2)">
    <rect x="40" y="228" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="210" y="228" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="380" y="228" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#33507a" text-anchor="middle">
    <text x="110" y="249">① 建邻接表，</text><text x="110" y="266">每点收 top3 邻居</text>
    <text x="280" y="249">② 枚举每条边</text><text x="280" y="266">(u,v) 作中间边</text>
    <text x="450" y="249">③ x∈top[u], y∈top[v]，</text><text x="450" y="266">去重取最大总分</text>
  </g>
  <path d="M 182 251 L 206 251" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 251 L 376 251" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 去重判定 -->
  <rect x="90" y="300" width="380" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">组合合法性仅四条：x ≠ v、y ≠ u、x ≠ y（节点互异）</text>
  <text x="280" y="348" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">加上「x、y 分别是 u、v 的邻居」由 top 表天然保证</text>
</svg>
