<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">O(1) 公式：整周求和 + 余日求和（以 n = 20 为例）</text>

  <!-- 左：整周部分 -->
  <rect x="28" y="52" width="224" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">整周部分：W = n / 7 个完整周</text>
  <text x="140" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">第 w 周和 = 7w + 28</text>
  <text x="140" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">Σ(w=0..W−1) = 28W + 7·W(W−1)/2</text>
  <text x="140" y="170" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">n = 20：W = 2</text>
  <text x="140" y="196" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">28×2 + 7×2×1/2 = 63</text>
  <text x="140" y="222" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">(1+2+…+7) + (2+3+…+8)</text>

  <!-- 右：余日部分 -->
  <rect x="268" y="52" width="224" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">余日部分：days = n mod 7</text>
  <text x="380" y="110" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">第 W 周前 days 天：W+1 … W+days</text>
  <text x="380" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">和 = days·W + days(days+1)/2</text>
  <text x="380" y="170" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">n = 20：days = 6</text>
  <text x="380" y="196" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">6×2 + 6×7/2 = 33</text>
  <text x="380" y="222" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">(3+4+5+6+7+8)</text>

  <!-- 汇合 -->
  <path d="M140,236 Q200,268 240,286" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M380,236 Q320,268 280,286" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="288" width="180" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="16" fill="#8a6d3b" filter="url(#rough2)">63 + 33 = 96 ✓</text>
</svg>
