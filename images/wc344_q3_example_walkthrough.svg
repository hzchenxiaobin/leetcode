<svg xmlns="http://www.w3.org/2000/svg" width="620" height="450" viewBox="0 0 620 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="620" height="450" fill="#fdfcf7"/>
  <text x="310" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：ans 随每条查询差量滚动</text>
  <path d="M 190 38 Q 310 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="30" y="52" width="530" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="65" y="72" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">查询</text>
  <text x="195" y="72" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">染后 colors</text>
  <text x="395" y="72" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">差量 Δ 细节</text>
  <text x="530" y="72" text-anchor="middle" font-size="12.5" fill="#2b4a6e" font-weight="bold">ans</text>
  <g filter="url(#sk)">
    <path d="M 100 54 L 100 378" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 290 54 L 290 378" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M 500 54 L 500 378" stroke="#446688" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  </g>

  <!-- 第 1 行 [0,2] -->
  <g filter="url(#sk)">
    <rect x="30" y="82" width="530" height="58" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="65" y="115" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0,2]</text>
  <g filter="url(#sk)">
    <rect x="115" y="96" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="155" y="96" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="195" y="96" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="235" y="96" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="130" y="116" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="170" y="116" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="210" y="116" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="250" y="116" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="395" y="108" text-anchor="middle" font-size="11" fill="#555">old = 0：不撤</text>
  <text x="395" y="126" text-anchor="middle" font-size="11" fill="#555">左右邻均 ≠ 2：+0</text>
  <text x="530" y="115" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>

  <!-- 第 2 行 [1,2] -->
  <g filter="url(#sk)">
    <rect x="30" y="140" width="530" height="58" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="65" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[1,2]</text>
  <g filter="url(#sk)">
    <rect x="115" y="154" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="155" y="154" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="195" y="154" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="235" y="154" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="130" y="174" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">2</text>
  <text x="170" y="174" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">2</text>
  <text x="210" y="174" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="250" y="174" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#2e5e24" font-weight="bold">✓</text>
  <text x="395" y="166" text-anchor="middle" font-size="11" fill="#555">old = 0：不撤</text>
  <text x="395" y="184" text-anchor="middle" font-size="11" fill="#2e5e24" font-weight="bold">左邻 2 == c：+1</text>
  <text x="530" y="173" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>

  <!-- 第 3 行 [3,1] -->
  <g filter="url(#sk)">
    <rect x="30" y="198" width="530" height="58" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="65" y="231" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[3,1]</text>
  <g filter="url(#sk)">
    <rect x="115" y="212" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="155" y="212" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="195" y="212" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="235" y="212" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="130" y="232" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">2</text>
  <text x="170" y="232" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">2</text>
  <text x="210" y="232" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="250" y="232" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="150" y="208" text-anchor="middle" font-size="10" fill="#2e5e24" font-weight="bold">✓</text>
  <text x="395" y="224" text-anchor="middle" font-size="11" fill="#555">old = 0：不撤</text>
  <text x="395" y="242" text-anchor="middle" font-size="11" fill="#555">左右邻均 ≠ 1：+0</text>
  <text x="530" y="231" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>

  <!-- 第 4 行 [1,1]：撤销行 -->
  <g filter="url(#sk)">
    <rect x="30" y="256" width="530" height="58" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="65" y="289" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">[1,1]</text>
  <g filter="url(#sk)">
    <rect x="115" y="270" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="155" y="270" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="195" y="270" width="30" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="235" y="270" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="130" y="290" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="170" y="290" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1</text>
  <text x="210" y="290" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="250" y="290" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="395" y="282" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">old = 2：左邻 2 == old，撤 −1</text>
  <text x="395" y="300" text-anchor="middle" font-size="11" fill="#8a3a36">新色 1 无匹配：+0</text>
  <text x="530" y="289" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>

  <!-- 第 5 行 [2,1]：双命中行 -->
  <g filter="url(#sk)">
    <rect x="30" y="314" width="530" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="65" y="347" text-anchor="middle" font-size="12" fill="#2e5e24" font-weight="bold">[2,1]</text>
  <g filter="url(#sk)">
    <rect x="115" y="328" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="155" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="195" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="235" y="328" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="130" y="348" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="170" y="348" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">1</text>
  <text x="210" y="348" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">1</text>
  <text x="250" y="348" text-anchor="middle" font-size="13" fill="#2e5e24" font-weight="bold">1</text>
  <text x="190" y="324" text-anchor="middle" font-size="10" fill="#2e5e24" font-weight="bold">✓</text>
  <text x="230" y="324" text-anchor="middle" font-size="10" fill="#2e5e24" font-weight="bold">✓</text>
  <text x="395" y="340" text-anchor="middle" font-size="11" fill="#2e5e24" font-weight="bold">old = 0：左邻 1 == c +1</text>
  <text x="395" y="358" text-anchor="middle" font-size="11" fill="#2e5e24" font-weight="bold">右邻 1 == c 再 +1（双命中）</text>
  <text x="530" y="347" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">2</text>

  <!-- 底部注解 -->
  <text x="310" y="398" text-anchor="middle" font-size="11.5" fill="#8a3a36">撤销分支（第 4 行）：先扣掉旧色在邻边上的贡献，ans 1 → 0</text>
  <text x="310" y="420" text-anchor="middle" font-size="11.5" fill="#2e5e24">双命中（第 5 行）：一条查询左右两条边同时 +1，ans 0 → 2</text>
  <text x="310" y="442" text-anchor="middle" font-size="10.5" fill="#888">每次 Δ 只由「改色位与左右邻居」决定，与其余位置无关</text>
</svg>
