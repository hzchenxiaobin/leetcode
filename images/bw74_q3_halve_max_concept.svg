<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">每次操作减半当前最大值，单步收益最大</text>

  <!-- 基线 -->
  <g filter="url(#rough2)">
    <path d="M 60 280 L 520 280" stroke="#999" stroke-width="2" fill="none"/>
  </g>

  <!-- 初始柱状 -->
  <g filter="url(#rough2)">
    <rect x="90" y="220" width="44" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="170" y="103" width="44" height="177" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="250" y="203" width="44" height="77" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <rect x="330" y="270" width="44" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="112" y="212">5</text>
    <text x="192" y="95">19</text>
    <text x="272" y="195">8</text>
    <text x="352" y="262">1</text>
  </g>
  <!-- 减半虚线：19 → 9.5 -->
  <g filter="url(#rough2)">
    <path d="M 214 103 L 214 194" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="228" y="150" font-size="12" fill="#b85450" filter="url(#rough2)">19 → 9.5</text>
  <text x="228" y="168" font-size="12" fill="#b85450" filter="url(#rough2)">减少 9.5</text>

  <!-- 减半后的柱子（右侧组） -->
  <g filter="url(#rough2)">
    <rect x="410" y="240" width="36" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <rect x="452" y="167" width="36" height="113" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="494" y="217" width="36" height="63" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="428" y="232">5</text>
    <text x="470" y="159">9.5</text>
    <text x="512" y="209">8</text>
  </g>
  <text x="470" y="300" font-size="12.5" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">操作一次后：堆顶变成 9.5</text>

  <!-- 收益标注 -->
  <g filter="url(#rough2)">
    <rect x="60" y="308" width="440" height="0" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#4a7a3a" font-weight="bold">
    <text x="90" y="326">选谁都被减半，收益 = 被选数的一半，所以选最大值收益最大</text>
  </g>
</svg>
