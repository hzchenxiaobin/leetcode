<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：盒子编号 = 球号各位数字之和</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: ball 321 -->
  <g filter="url(#sk)"><ellipse cx="95" cy="105" rx="32" ry="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="95" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">321</text>
  <text x="95" y="148" text-anchor="middle" font-size="10" fill="#888">小球</text>
  <path d="M 132 105 L 188 105" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="195" y="88" width="160" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="275" y="110" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">3 + 2 + 1 = 6</text>
  <path d="M 360 105 L 418 105" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="425" y="86" width="150" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="500" y="105" text-anchor="middle" font-size="12" fill="#2e6e2e">盒子 #6</text>
  <text x="500" y="119" text-anchor="middle" font-size="10" fill="#4a8e4a">count[6] += 1</text>

  <!-- Row 2: ball 10 -->
  <g filter="url(#sk)"><ellipse cx="95" cy="195" rx="32" ry="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="95" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">10</text>
  <path d="M 132 195 L 188 195" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="195" y="178" width="160" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="275" y="200" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">1 + 0 = 1</text>
  <path d="M 360 195 L 418 195" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="425" y="176" width="150" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="500" y="195" text-anchor="middle" font-size="12" fill="#2e6e2e">盒子 #1</text>
  <text x="500" y="209" text-anchor="middle" font-size="10" fill="#4a8e4a">count[1] += 1</text>

  <!-- Row 3: ball 9999 -->
  <g filter="url(#sk)"><ellipse cx="95" cy="285" rx="32" ry="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="95" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" font-family="monospace">9999</text>
  <path d="M 132 285 L 188 285" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="195" y="268" width="160" height="34" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="275" y="290" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">9+9+9+9 = 36</text>
  <path d="M 360 285 L 418 285" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="425" y="266" width="150" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#2e6e2e">盒子 #36</text>
  <text x="500" y="299" text-anchor="middle" font-size="10" fill="#4a8e4a">count[36] += 1</text>

  <!-- Summary -->
  <g filter="url(#sk)">
    <rect x="55" y="328" width="530" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">x ≤ 10^5 ⇒ S(x) ∈ [1, 45]，开长度 46 的计数数组就够！</text>
</svg>
