<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="32"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">同一行 j 上，沿 i 方向只需一个长度 limit 的窗口</text>
  <rect x="45.9" y="103.7" width="41.7" height="34.4" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="67.0" y="126.0" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">1</text>
  <rect x="92.1" y="104.2" width="42.1" height="33.9" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="113.0" y="126.0" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">1</text>
  <rect x="138.2" y="104.1" width="42.3" height="34.2" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="159.0" y="126.0" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">1</text>
  <rect x="184.3" y="103.9" width="41.7" height="33.6" rx="5" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="205.0" y="126.0" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">1</text>
  <rect x="230.2" y="103.7" width="42.2" height="34.1" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="251.0" y="126.0" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">…</text>
  <text x="251.0" y="156.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">i−1</text>
  <text x="67.0" y="156.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">0</text>
  <path d="M 86.0 92.0 L 278.0 92.0" stroke="#d6a040" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 86.0 86.0 L 86.0 98.0" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 278.0 86.0 L 278.0 98.0" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="182.0" y="80.0" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">恰好 limit 项（i−limit … i−1）</text>
  <rect x="39.6" y="176.3" width="519.5" height="66.4" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="204.0" text-anchor="middle" font-size="13" fill="#2f4a6d" font-weight="bold" filter="url(#rough2)">dp0[i][j] = S1[i−1][j] − S1[i−limit−1][j]</text>
  <text x="300.0" y="228.0" text-anchor="middle" font-size="11" fill="#5a6c88" filter="url(#rough2)">其中 S1[a][j] = dp1[0][j] + dp1[1][j] + … + dp1[a][j]</text>
  <rect x="40.3" y="257.7" width="250.2" height="58.2" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="282.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">k 从 1 到 limit 的求和</text>
  <text x="165.0" y="299.2" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">被前缀和压成一次减法</text>
  <rect x="309.6" y="258.2" width="249.6" height="58.4" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435.0" y="282.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">j 方向同理：S0 用当前行</text>
  <text x="435.0" y="299.2" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">按 j 递增即时累加即可</text>
</svg>
