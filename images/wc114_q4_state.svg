<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="348" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">状态压缩：只记高度差 d 与较矮一侧 s</text>
  <line x1="60" y1="250" x2="460" y2="250" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="110" y="90" width="54" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="272" text-anchor="middle" font-size="12" fill="#33475b" filter="url(#rough2)">左 a</text>
  <rect x="230" y="140" width="54" height="110" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="257" y="272" text-anchor="middle" font-size="12" fill="#33475b" filter="url(#rough2)">右 b</text>
  <line x1="164" y1="90" x2="226" y2="90" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="196" y="82" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">d = a - b</text>
  <line x1="284" y1="140" x2="330" y2="140" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="360" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s = min(a,b)</text>
  <rect x="340" y="60" width="200" height="70" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">a = s + max(d,0)</text>
  <text x="440" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">b = s + max(-d,0)</text>
  <text x="440" y="122" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">⇒ (d,s) 与 (a,b) 一一对应</text>
  <rect x="60" y="292" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="317" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">目标 a = b  ⇔  d = 0，此时广告牌高度就是 s</text>
</svg>
