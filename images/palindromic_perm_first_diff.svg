<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="480" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">唯一的自由度：首个不同位 i（answer[i] &gt; target[i]）</text>
  <path d="M 150 40 Q 350 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- aligned rows -->
  <text x="339" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">首个不同位 i</text>
  <path d="M 339 60 L 339 68" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="102" y="82" text-anchor="end" font-size="13" fill="#555">target</text>
  <g filter="url(#sk)">
    <rect x="112" y="60" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="60" width="110" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="406" y="60" width="180" height="34" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="192" y="82" text-anchor="middle" font-size="12" fill="#2b4a6e">target[0..i−1]</text>
  <text x="339" y="82" text-anchor="middle" font-size="12" fill="#8e3a34" font-weight="bold">target[i]</text>
  <text x="496" y="82" text-anchor="middle" font-size="12" fill="#666">target[i+1..]</text>
  <text x="102" y="128" text-anchor="end" font-size="13" fill="#555">answer</text>
  <g filter="url(#sk)">
    <rect x="112" y="106" width="160" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="106" width="110" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="406" y="106" width="180" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="192" y="128" text-anchor="middle" font-size="12" fill="#2b4a6e">完全相同的前缀</text>
  <text x="339" y="128" text-anchor="middle" font-size="12" fill="#7a5416" font-weight="bold">c &gt; target[i]</text>
  <text x="496" y="128" text-anchor="middle" font-size="12" fill="#2e5e22">之后尽量小</text>
  <text x="350" y="162" text-anchor="middle" font-size="12.5" fill="#666">任何严格大于 target 的串都唯一对应一个这样的 i ⇒ 按 i 分类枚举</text>

  <text x="350" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">i 落在哪一半？</text>

  <!-- case B box -->
  <g filter="url(#sk)">
    <rect x="40" y="206" width="316" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="198" y="232" text-anchor="middle" font-size="13.5" fill="#2b4a6e" font-weight="bold">情况 B：i 在左半（i ≤ h−1）</text>
  <text x="56" y="258" font-size="12" fill="#2b4a6e">· 前缀 target[0..i) 每字符消耗 2 份</text>
  <text x="56" y="280" font-size="12" fill="#2b4a6e">· p[i] 取最小的可用 c &gt; target[i]</text>
  <text x="70" y="300" font-size="11.5" fill="#5a7a9e">（要求剩余计数 ≥ 2）</text>
  <text x="56" y="322" font-size="12" fill="#2b4a6e">· 其余左半位：剩余字符对升序填入</text>
  <text x="56" y="344" font-size="12" fill="#2b4a6e">· 奇数长且 i = 中间位：c 必须是</text>
  <text x="70" y="364" font-size="11.5" fill="#5a7a9e">那个出现奇数次的字符</text>

  <!-- case A box -->
  <g filter="url(#sk)">
    <rect x="384" y="206" width="276" height="172" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="522" y="232" text-anchor="middle" font-size="13.5" fill="#2e5e22" font-weight="bold">情况 A：i 在右半（i ≥ h）</text>
  <text x="400" y="258" font-size="12" fill="#2e5e22">· 左半整体 = target[0..h)</text>
  <text x="400" y="280" font-size="12" fill="#2e5e22">· 候选唯一：P₀ = pal(target[:h])</text>
  <text x="400" y="302" font-size="12" fill="#2e5e22">· 需是 s 的排列，且 P₀ &gt; target</text>
  <text x="414" y="322" font-size="11.5" fill="#5e8a4e">（等于 target 不行，要严格大于）</text>
  <text x="400" y="344" font-size="12" fill="#2e5e22">· 奇数长还要求 target 的中间位</text>
  <text x="414" y="364" font-size="11.5" fill="#5e8a4e">恰好是那个奇数字符</text>

  <!-- bottom -->
  <g filter="url(#sk)">
    <rect x="55" y="396" width="590" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="422" text-anchor="middle" font-size="13" fill="#7a5416" font-weight="bold">情况 A 的首个不同位一定更靠后 ⇒ 若合法，它比一切情况 B 的候选都小</text>
  <text x="350" y="446" text-anchor="middle" font-size="13" fill="#7a5416">→ 先查情况 A；情况 B 从大 i 往小 i 找，返回第一个合法候选</text>
</svg>
