<svg xmlns="http://www.w3.org/2000/svg" width="560" height="655" viewBox="0 0 560 655" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="655" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次遍历建边 + 一次扫描找根</text>
  <path d="M 150 40 Q 280 50 410 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="160" y="58" width="240" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="76" text-anchor="middle" font-size="12.5" fill="#2b3b52" filter="url(#sk)">初始化：nodes ← {}，children ← {}</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 86 V 98" marker-end="url(#ag)"/>
  </g>

  <!-- box1: next edge -->
  <g filter="url(#sk)">
    <rect x="170" y="100" width="220" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="117" text-anchor="middle" font-size="12.5" fill="#2b3b52" filter="url(#sk)">取下一条边 [p, c, isLeft]</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 126 V 138" marker-end="url(#ag)"/>
  </g>

  <!-- D1: p in nodes? -->
  <g filter="url(#sk)">
    <polygon points="280,142 370,172 280,202 190,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">p 已在 nodes ?</text>

  <g filter="url(#sk)">
    <rect x="398" y="159" width="148" height="26" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.8"/>
  </g>
  <text x="472" y="176" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">nodes[p] ← new TreeNode(p)</text>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 370 172 H 394" marker-end="url(#ag)"/>
  </g>
  <text x="380" y="164" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 202 V 222" marker-end="url(#ag)"/>
    <path d="M 472 185 V 212 H 296" marker-end="url(#ag)"/>
  </g>
  <text x="290" y="217" text-anchor="start" font-size="11" fill="#7a5415" filter="url(#sk)">是</text>

  <!-- D2: c in nodes? -->
  <g filter="url(#sk)">
    <polygon points="280,226 370,256 280,286 190,256" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">c 已在 nodes ?</text>

  <g filter="url(#sk)">
    <rect x="398" y="243" width="148" height="26" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.8"/>
  </g>
  <text x="472" y="260" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">nodes[c] ← new TreeNode(c)</text>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 370 256 H 394" marker-end="url(#ag)"/>
  </g>
  <text x="380" y="248" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 286 V 306" marker-end="url(#ag)"/>
    <path d="M 472 269 V 296 H 296" marker-end="url(#ag)"/>
  </g>
  <text x="290" y="301" text-anchor="start" font-size="11" fill="#7a5415" filter="url(#sk)">是</text>

  <!-- D3: isLeft? -->
  <g filter="url(#sk)">
    <polygon points="280,310 370,340 280,370 190,340" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">isLeft == 1 ?</text>

  <!-- fork to left/right assignment -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 370 V 382"/>
    <path d="M 130 382 H 430"/>
    <path d="M 130 382 V 390" marker-end="url(#ag)"/>
    <path d="M 430 382 V 390" marker-end="url(#ag)"/>
  </g>
  <text x="118" y="377" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>
  <text x="442" y="377" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>

  <g filter="url(#sk)">
    <rect x="52" y="392" width="156" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="130" y="409" text-anchor="middle" font-size="11" fill="#2b3b52" filter="url(#sk)">nodes[p].left ← nodes[c]</text>

  <g filter="url(#sk)">
    <rect x="352" y="392" width="156" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="430" y="409" text-anchor="middle" font-size="11" fill="#2b3b52" filter="url(#sk)">nodes[p].right ← nodes[c]</text>

  <!-- join -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 130 418 V 432 H 280"/>
    <path d="M 430 418 V 432 H 280"/>
    <path d="M 280 432 V 442" marker-end="url(#ag)"/>
  </g>

  <!-- box2: mark child -->
  <g filter="url(#sk)">
    <rect x="170" y="444" width="220" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="461" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">children ← children ∪ {c}</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 470 V 482" marker-end="url(#ag)"/>
  </g>

  <!-- D4: more edges? -->
  <g filter="url(#sk)">
    <polygon points="280,486 370,516 280,546 190,516" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="520" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">还有未处理的边 ?</text>

  <!-- loop back -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4">
    <path d="M 190 516 H 22 V 113 H 164" marker-end="url(#ag)"/>
  </g>
  <text x="206" y="508" text-anchor="end" font-size="11" fill="#7a5415" filter="url(#sk)">是</text>
  <text x="30" y="320" font-size="11" fill="#888" filter="url(#sk)">循环</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 546 V 564" marker-end="url(#ag)"/>
  </g>
  <text x="290" y="560" text-anchor="start" font-size="11" fill="#7a5415" filter="url(#sk)">否</text>

  <!-- box3: scan for root -->
  <g filter="url(#sk)">
    <rect x="170" y="566" width="220" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="280" y="583" text-anchor="middle" font-size="12.5" fill="#2b3b52" filter="url(#sk)">扫描 nodes：找 ∉ children 的键</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 280 592 V 604" marker-end="url(#ag)"/>
  </g>

  <!-- end -->
  <g filter="url(#sk)">
    <rect x="190" y="606" width="180" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="280" y="625" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">返回该节点（根）</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="396" y="556" width="152" height="84" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="472" y="576">每条边 O(1)：3 次哈希</text>
    <text x="472" y="592">+ 1 次集合插入</text>
    <text x="472" y="608">无 DFS、无森林合并</text>
    <text x="472" y="624">与输入顺序无关</text>
  </g>
</svg>
