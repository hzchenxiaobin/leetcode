<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Python 无内置有序集合？逆序处理：删除变插入</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 上面：正向的困难 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="820" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="80" y="88" font-size="13" font-weight="bold" fill="#b85450">正向模拟的痛点</text>
  <text x="80" y="110" font-size="12" fill="#444" font-family="monospace">[2,x] 要从集合中"删除"元素并仍 O(log) 取最小 → 需要有序集合（C++ 有 std::set，Python 标准库没有）</text>

  <!-- ===== 中间：逆序思想 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="144" width="820" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="170" font-size="13" font-weight="bold" fill="#2b6e9e">逆序视角：离线不可逆 → 倒着看是"复活"，只加不删</text>
  <text x="80" y="194" font-size="12" fill="#444" font-family="monospace">off_time[x] = 第一次 [2,x] 出现的下标 i（从未离线则 ∞）</text>
  <text x="80" y="216" font-size="12" fill="#444" font-family="monospace">初始堆 = { off_time[x] = ∞ 的电站 }，按电网分组各自建小根堆</text>
  <text x="80" y="238" font-size="12" fill="#444" font-family="monospace">i 从 q-1 倒着扫：[2,x] 且 off_time[x]==i → heappush(x)；[1,x] → 看自身与堆顶</text>
  <text x="80" y="258" font-size="10.5" fill="#888">每个电站至多入堆一次（初始一次 / 复活一次）→ 均摊 O(log c)</text>

  <!-- ===== 时间线示意 ===== -->
  <text x="470" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1 的时间线（i 从 4 往 0 处理）</text>

  <!-- 正向箭头 -->
  <path d="M 100 322 L 850 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="92" y="326" font-size="11" fill="#666">时间正向 →</text>

  <!-- 查询刻度：i=0..4 从左到右 -->
  <g filter="url(#sk)">
    <rect x="130" y="340" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="340" width="130" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="450" y="340" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="610" y="340" width="130" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="770" y="340" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold">
    <text x="195" y="365">[1,3]</text><text x="355" y="365">[2,1]</text><text x="515" y="365">[1,1]</text><text x="675" y="365">[2,2]</text><text x="820" y="365">[1,2]</text>
  </g>
  <text x="195" y="326" font-size="10.5" fill="#666" text-anchor="middle">i=0</text>
  <text x="355" y="326" font-size="10.5" fill="#666" text-anchor="middle">i=1</text>
  <text x="515" y="326" font-size="10.5" fill="#666" text-anchor="middle">i=2</text>
  <text x="675" y="326" font-size="10.5" fill="#666" text-anchor="middle">i=3</text>
  <text x="820" y="326" font-size="10.5" fill="#666" text-anchor="middle">i=4</text>
  <text x="355" y="404" text-anchor="middle" font-size="10.5" fill="#8a6a1a">off_time[1]=1</text>
  <text x="675" y="404" text-anchor="middle" font-size="10.5" fill="#8a6a1a">off_time[2]=3</text>

  <!-- 逆向箭头 -->
  <path d="M 850 428 L 100 428" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="475" y="450" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">处理方向 ←（i 从 4 到 0）</text>

  <!-- 逆序过程 -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="820" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="494" font-size="12" fill="#444" font-family="monospace">初始堆（永不离线者）= {3, 4, 5}；电站 1、2 之后各被"复活"一次</text>
  <text x="80" y="516" font-size="12" fill="#444" font-family="monospace">i=4 [1,2]：off_time[2]=3 ≤ 4 → 2 已离线 → 堆顶 3 → 答案 3</text>
  <text x="80" y="538" font-size="12" fill="#444" font-family="monospace">i=3 [2,2]：off_time[2]==3 → push(2) 堆={2,3,4,5}；i=2 [1,1]：1 已离线 → 堆顶 2</text>
  <text x="80" y="560" font-size="12" fill="#444" font-family="monospace">i=1 [2,1]：off_time[1]==1 → push(1) 堆={1,2,3,4,5}；i=0 [1,3]：3 在线 → 答案 3</text>

  <!-- 底部警告 -->
  <g filter="url(#sk)">
    <rect x="60" y="588" width="820" height="24" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="470" y="605" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">⚠ 重复 [2,x] 只认第一次（off_time 判重），否则 x 会在错误时刻提前"复活"</text>
</svg>
