<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">同源字符串检测：记忆化搜索决策流程</text>
  <path d="M 130 38 Q 320 48 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="255" y="50" width="130" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">dfs(i, j, k)</text>
  <path d="M 320 80 L 320 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- terminal diamond -->
  <g filter="url(#sk)"><polygon points="320,104 398,134 320,164 242,134" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">i = n1 且 j = n2 ?</text>
  <path d="M 398 134 L 451 134" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="422" y="128" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="455" y="118" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="530" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 k == 0</text>
  <path d="M 320 164 L 320 192" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="184" font-size="10.5" fill="#b85450" filter="url(#sk)">否</text>

  <!-- sign diamond -->
  <g filter="url(#sk)"><polygon points="320,196 390,224 320,252 250,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" filter="url(#sk)">k 的符号 ?</text>

  <!-- three branch arrows -->
  <path d="M 250 224 L 152 224 L 152 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">k = 0</text>
  <path d="M 320 252 L 320 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="256" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">k &gt; 0</text>
  <path d="M 390 224 L 488 224 L 488 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="440" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">k &lt; 0</text>

  <!-- k = 0 box -->
  <g filter="url(#sk)"><rect x="45" y="262" width="215" height="168" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g font-size="9.8" fill="#444">
    <text x="152" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">k = 0：双方各消费一个 token</text>
    <text x="55" y="304" filter="url(#sk)">一侧已耗尽 → false</text>
    <text x="55" y="320" filter="url(#sk)">双字母：须 s1[i] == s2[j]</text>
    <text x="67" y="335" filter="url(#sk)">→ (i+1, j+1, 0)</text>
    <text x="55" y="352" filter="url(#sk)">s1 字母 + s2 数字：枚举解析 v</text>
    <text x="67" y="367" filter="url(#sk)">→ (i+1, j+l, 1−v)</text>
    <text x="55" y="384" filter="url(#sk)">s1 数字 + s2 字母：枚举解析 v</text>
    <text x="67" y="399" filter="url(#sk)">→ (i+l, j+1, v−1)</text>
    <text x="55" y="416" filter="url(#sk)">双数字：枚举 v1、v2 全部组合</text>
    <text x="67" y="431" filter="url(#sk)">→ (i+l1, j+l2, v1−v2)</text>
  </g>

  <!-- k > 0 box -->
  <g filter="url(#sk)"><rect x="272" y="262" width="180" height="168" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g font-size="10.5" fill="#444">
    <text x="362" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#sk)">k &gt; 0：s2 独自追赶</text>
    <text x="282" y="308" filter="url(#sk)">s1 冻结原地等待</text>
    <text x="282" y="328" filter="url(#sk)">j = n2 → false（追不上）</text>
    <text x="282" y="350" filter="url(#sk)">s2[j] 为字母（无约束）</text>
    <text x="294" y="366" filter="url(#sk)">→ (i, j+1, k−1)</text>
    <text x="282" y="388" filter="url(#sk)">s2[j] 为数字：枚举解析 v</text>
    <text x="294" y="404" filter="url(#sk)">→ (i, j+l, k−v)</text>
  </g>
  <text x="362" y="424" text-anchor="middle" font-size="9" fill="#66788a" filter="url(#sk)">追赶方消费的字符内容未知，</text>
  <text x="362" y="436" text-anchor="middle" font-size="9" fill="#66788a" filter="url(#sk)">字母怎么声明都不矛盾</text>

  <!-- k < 0 box -->
  <g filter="url(#sk)"><rect x="464" y="262" width="166" height="168" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g font-size="10.5" fill="#444">
    <text x="547" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14" filter="url(#sk)">k &lt; 0：s1 独自追赶</text>
    <text x="474" y="308" filter="url(#sk)">s2 冻结原地等待</text>
    <text x="474" y="328" filter="url(#sk)">i = n1 → false（追不上）</text>
    <text x="474" y="350" filter="url(#sk)">s1[i] 为字母（无约束）</text>
    <text x="486" y="366" filter="url(#sk)">→ (i+1, j, k+1)</text>
    <text x="474" y="388" filter="url(#sk)">s1[i] 为数字：枚举解析 v</text>
    <text x="486" y="404" filter="url(#sk)">→ (i+l, j, k+v)</text>
  </g>
  <text x="547" y="424" text-anchor="middle" font-size="9" fill="#8a7a4a" filter="url(#sk)">与 k &gt; 0 完全对称，</text>
  <text x="547" y="436" text-anchor="middle" font-size="9" fill="#8a7a4a" filter="url(#sk)">只是双方角色互换</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="45" y="444" width="585" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <g font-size="10.5" fill="#555">
    <text x="337" y="462" text-anchor="middle" filter="url(#sk)">数字解析 = 从当前位置起取连续数字的 1 / 2 / 3 位前缀 (l, v)，如 "12" → (1,1)、(2,12)</text>
    <text x="337" y="479" text-anchor="middle" filter="url(#sk)">所有状态记忆化：memo[i][j][k+1000]，其中 |k| ≤ 998（推导见题解）</text>
  </g>
</svg>
