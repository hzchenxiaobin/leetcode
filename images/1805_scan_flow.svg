<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="620" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">算法流程：一次扫描 + 双指针提段 + 归一化入集合</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="56" rx="50" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="61" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 320 75 V 77" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- P1 -->
  <g filter="url(#sk)">
    <rect x="225" y="81" width="190" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="105" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#446688">i = 0；seen = ∅</text>
  <path d="M 320 119 V 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D1: i < n ? -->
  <g filter="url(#sk)">
    <polygon points="245,170 320,138 395,170 320,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i &lt; n ?</text>

  <!-- D1 exit: no -->
  <path d="M 395 170 H 454" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="460" y="150" width="130" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="525" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 |seen|</text>
  <path d="M 525 190 V 211" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="525" cy="232" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="525" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">结束</text>

  <!-- D1 yes -->
  <path d="M 320 202 V 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="216" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- D2: digit? -->
  <g filter="url(#sk)">
    <polygon points="225,260 320,228 415,260 320,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="265" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">word[i] 是数字 ?</text>

  <!-- D2 no: skip -->
  <path d="M 225 260 H 199" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="210" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="65" y="240" width="130" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="130" y="265" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#446688">i = i + 1</text>
  <path d="M 65 260 H 48" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- D2 yes -->
  <path d="M 320 292 V 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="304" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- P3: extract segment -->
  <g filter="url(#sk)">
    <rect x="175" y="310" width="290" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="329" text-anchor="middle" font-size="11.5" fill="#446688">j 从 i 起向右扫描，直到 word[j] 非数字</text>
  <text x="320" y="347" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#446688">极大段 = word[i .. j)</text>
  <path d="M 320 358 V 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- P4: strip leading zeros -->
  <g filter="url(#sk)">
    <rect x="160" y="376" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="395" text-anchor="middle" font-size="11.5" fill="#446688">k 跳过前导 '0'（条件 k+1 &lt; j）</text>
  <text x="320" y="413" text-anchor="middle" font-size="11.5" fill="#446688">全零段保留一个字符 → "0"</text>
  <path d="M 320 424 V 438" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- P5: insert -->
  <g filter="url(#sk)">
    <rect x="190" y="442" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="467" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#446688">seen.insert(word[k .. j))</text>
  <path d="M 320 482 V 498" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- P6: i = j -->
  <g filter="url(#sk)">
    <rect x="265" y="504" width="110" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="527" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#446688">i = j</text>

  <!-- loop-back rail -->
  <path d="M 265 522 H 48" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 48 522 V 170 H 237" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="52" y="350" font-size="10.5" fill="#888" font-style="italic">回到条件判断</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="60" y="560" width="520" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">要点：k+1 &lt; j 保证全零段归一化成 "0" 而不是空串</text>
  <text x="320" y="598" text-anchor="middle" font-size="11" fill="#444">"001" → "1"；"000" → "0"——所有同值段得到同一个 key</text>
</svg>
