<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 10, m = 3</text>
  <path d="M 210 38 Q 320 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left steps -->
  <g filter="url(#sk)">
    <rect x="45" y="56" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="45" y="116" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="45" y="176" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="45" y="236" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="45" y="296" width="280" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-family="monospace">
    <text x="185" y="83" fill="#2b6e9e">① total = 10×11/2 = 55</text>
    <text x="185" y="143" fill="#2b6e9e">② k = ⌊10/3⌋ = 3</text>
    <text x="185" y="203" fill="#2e6e2e">③ num2 = 3×(3×4)/2 = 18</text>
    <text x="185" y="263" fill="#2b6e9e">④ num1 = 55 − 18 = 37</text>
    <text x="185" y="323" fill="#7a5415" font-weight="bold">⑤ 答案 = 37 − 18 = 19 ✓</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M 185 102 L 185 112" marker-end="url(#ar)"/>
    <path d="M 185 162 L 185 172" marker-end="url(#ar)"/>
    <path d="M 185 222 L 185 232" marker-end="url(#ar)"/>
    <path d="M 185 282 L 185 292" marker-end="url(#ar)"/>
  </g>

  <!-- right table -->
  <text x="485" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">三示例验证</text>
  <g filter="url(#sk)">
    <rect x="350" y="82" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="450" y="82" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="505" y="82" width="115" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="350" y="108" width="100" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="450" y="108" width="55" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="505" y="108" width="115" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="350" y="142" width="100" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="450" y="142" width="55" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="505" y="142" width="115" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="350" y="176" width="100" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="450" y="176" width="55" height="34" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="505" y="176" width="115" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="400" y="99" fill="#2b6e9e" font-weight="bold">输入 (n, m)</text>
    <text x="477" y="99" fill="#2b6e9e" font-weight="bold">k</text>
    <text x="562" y="99" fill="#2b6e9e" font-weight="bold">答案</text>
    <text x="400" y="130">n=10, m=3</text>
    <text x="477" y="130">3</text>
    <text x="562" y="130" fill="#2e6e2e" font-weight="bold">19 ✓</text>
    <text x="400" y="164">n=5, m=6</text>
    <text x="477" y="164">0</text>
    <text x="562" y="164" fill="#2e6e2e" font-weight="bold">15 ✓</text>
    <text x="400" y="198">n=5, m=1</text>
    <text x="477" y="198">5</text>
    <text x="562" y="198" fill="#b85450" font-weight="bold">−15 ✓</text>
  </g>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="350" y="228" width="270" height="88" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#888">
    <text x="362" y="252">· m &gt; n：k = 0，num2 = 0，答案 = total</text>
    <text x="362" y="274">· m = 1：全部可整除，答案 = −total</text>
    <text x="362" y="296">· n(n+1)、k(k+1) 必为偶数，先乘后除安全</text>
  </g>
</svg>
