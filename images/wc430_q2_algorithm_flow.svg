<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：特判 → 定窗长 → 逐起点打擂台</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="252" y="58" width="136" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 320 88 L 320 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 判定：numFriends == 1 ? -->
  <g filter="url(#sk)">
    <polygon points="320,102 425,134 320,166 215,134" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="139" text-anchor="middle" font-size="12" font-family="monospace" fill="#9c3a34">numFriends == 1 ?</text>
  <path d="M 425 134 L 469 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="445" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="473" y="119" width="140" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="543" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">返回 word（整串）</text>
  <path d="M 320 166 L 320 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="331" y="178" text-anchor="middle" font-size="10" fill="#b85450">否</text>

  <!-- 定窗长 -->
  <g filter="url(#sk)">
    <rect x="195" y="182" width="250" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="204" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b6e9e">L = n − numFriends + 1</text>
  <path d="M 320 216 L 320 228" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="195" y="230" width="250" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b6e9e">best = ""（空串最小）</text>
  <path d="M 320 264 L 320 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 枚举起点 -->
  <g filter="url(#sk)">
    <rect x="195" y="278" width="250" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="300" text-anchor="middle" font-size="12" fill="#2b6e9e">枚举起点 i = 0 … n−1</text>
  <path d="M 320 312 L 320 324" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="160" y="326" width="320" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b6e9e">c = word[i : min(i + L, n)]</text>
  <path d="M 320 360 L 320 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 判定：c > best ? -->
  <g filter="url(#sk)">
    <polygon points="320,374 418,404 320,434 222,404" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="12" font-family="monospace" fill="#9c3a34">c &gt; best ?</text>
  <path d="M 418 404 L 456 404" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="434" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="460" y="387" width="110" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="515" y="409" text-anchor="middle" font-size="12" font-family="monospace" fill="#7a5415">best = c</text>

  <!-- 汇合 -->
  <path d="M 515 421 L 515 446 L 328 446" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
  <path d="M 222 404 L 222 446 L 312 446" stroke="#b85450" stroke-width="1.4" fill="none"/>
  <text x="206" y="400" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <path d="M 320 434 L 320 446" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
  <path d="M 320 446 L 320 458" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 判定：起点扫完？ -->
  <g filter="url(#sk)">
    <polygon points="320,460 412,490 320,520 228,490" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="495" text-anchor="middle" font-size="12" fill="#9c3a34">起点扫完？</text>

  <path d="M 228 490 L 140 490 L 140 295 L 191 295" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="212" y="478" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <text x="126" y="395" text-anchor="middle" font-size="11" font-family="monospace" fill="#b85450">i+1</text>

  <path d="M 320 520 L 320 534" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="331" y="532" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>

  <g filter="url(#sk)">
    <rect x="245" y="538" width="150" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 best</text>

  <!-- 备注 -->
  <g filter="url(#sk)">
    <rect x="110" y="570" width="420" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="586" text-anchor="middle" font-size="11" fill="#888">k = n 时 L = 1：答案即最大字符（如 “gggg” → “g”），无需特判</text>
</svg>
