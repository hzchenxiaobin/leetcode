<svg xmlns="http://www.w3.org/2000/svg" width="720" height="472" viewBox="0 0 720 472"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="472" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次 26 字母的差分统计</text>
  <path d="M 218 43 Q 360 50 502 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="58" width="360" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 n、m，再读字符串 p 与 q</text>
  <text x="360" y="95" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">n = |p|、m = |q|，只用于校验长度，不参与判定</text>

  <path d="M 360 104 L 360 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="124" width="420" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">cnt[26] 全部置 0</text>
  <text x="360" y="166" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">p 的每个字符 cnt[c] += 1；q 的每个字符 cnt[c] −= 1</text>

  <path d="M 360 182 L 360 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="202" width="420" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">对 c = 'a'..'z' 逐一比较 cnt[c] 与 want[c]</text>
  <text x="360" y="245" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">want[c] = 1 当且仅当 c ∈ {s, i, x}，否则为 0</text>

  <path d="M 360 262 L 360 280" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,282 540,326 360,370 180,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="321" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">26 个字母全部相等？</text>
  <text x="360" y="340" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">任一不等即提前跳出</text>

  <path d="M 262 352 L 208 390" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#rough2)"/>
  <text x="222" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">全相等</text>
  <path d="M 458 352 L 512 390" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="500" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">存在不等</text>

  <rect x="92" y="396" width="208" height="50" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="427" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <rect x="420" y="396" width="208" height="50" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="524" y="427" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <text x="360" y="464" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">差分为负、差分为正但不属于 s、i、x、总数不为 3——四种错误全部由这一条判据统一拦下</text>
</svg>
