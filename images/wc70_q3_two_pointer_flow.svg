<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">双指针判定：跳过 X，逐对比较「字符 + 原始下标」</text>
  <text x="280" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i 扫 start，j 扫 result；只对齐 L / R，不真正模拟移动</text>

  <rect x="110" y="58" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i ← 0，j ← 0</text>

  <path d="M 200 88 L 200 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="76" y="106" width="248" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">跳过 X：start[i] == 'X' 则 i++</text>
  <text x="200" y="142" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">result[j] == 'X' 则 j++</text>

  <path d="M 200 154 L 200 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,176 348,208 200,240 52,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="212" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">i == n 或 j == n ？</text>

  <path d="M 350 208 L 372 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="376" y="188" width="164" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="205" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">return i == n &amp;&amp; j == n</text>
  <text x="458" y="219" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">两串同时扫完才为真</text>

  <path d="M 200 240 L 200 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="256" font-size="9" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="200,268 348,300 200,332 52,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="304" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">start[i] != result[j] ？</text>

  <path d="M 350 300 L 372 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="294" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="376" y="280" width="164" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="297" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="458" y="311" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">L / R 序列不同</text>

  <path d="M 200 332 L 200 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="348" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="200,360 348,392 200,424 52,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="388" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">方向违例？</text>
  <text x="200" y="404" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">L 却 i &lt; j，或 R 却 i &gt; j</text>

  <path d="M 350 392 L 372 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="386" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="376" y="372" width="164" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458" y="389" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="458" y="403" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">字母在往反方向跑</text>

  <path d="M 200 424 L 200 446" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="440" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="96" y="448" width="208" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="468" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">i++，j++（这一对通过）</text>

  <path d="M 96 464 L 34 464 L 34 130 L 72 130" stroke="#666" stroke-width="1.5" fill="none"
        stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="300" font-size="9" fill="#888" filter="url(#rough2)">循环</text>

  <text x="280" y="492" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个字符至多被两个指针各访问一次 ⇒ O(n) 时间、O(1) 空间</text>
</svg>
