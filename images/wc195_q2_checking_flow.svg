<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 546" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="546" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次计数 + 三类条件检查</text>

  <g filter="url(#rough2)">
    <rect x="110" y="46" width="280" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">① 遍历 arr，统计余数计数 cnt[0..k−1]</text>
    <text x="250" y="88" text-anchor="middle" font-size="10.5" fill="#446688">r = ((x mod k) + k) mod k · 负数归一化</text>

    <path d="M 250 104 L 250 128" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

    <polygon points="250,132 368,176 250,220 132,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">cnt[0] 为偶数？</text>

    <path d="M 250 220 L 250 250" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="240" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

    <polygon points="250,254 372,298 250,342 128,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="293" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">k 为偶数时：</text>
    <text x="250" y="311" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">cnt[k/2] 为偶数？</text>

    <path d="M 250 342 L 250 372" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="362" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

    <polygon points="250,376 380,420 250,464 120,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="415" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">每个 1 ≤ r &lt; k/2</text>
    <text x="250" y="433" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">都有 cnt[r] = cnt[k−r]？</text>

    <path d="M 250 464 L 250 486" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="480" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

    <rect x="130" y="490" width="240" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="250" y="517" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a3a">条件全过 → 返回 true ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="474" y="272" width="150" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="549" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">返回 false ✗</text>
    <text x="549" y="311" text-anchor="middle" font-size="10" fill="#b85450">任一条件失败即出局</text>

    <path d="M 368 176 L 438 176 L 438 290 L 470 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="392" y="168" font-size="11" font-weight="bold" fill="#b85450">否</text>

    <path d="M 372 298 L 470 298" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="400" y="290" font-size="11" font-weight="bold" fill="#b85450">否</text>

    <path d="M 380 420 L 438 420 L 438 306 L 470 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)"/>
    <text x="404" y="412" font-size="11" font-weight="bold" fill="#b85450">否</text>
  </g>
</svg>
