<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：单趟扫描，滚动维护 cur 与 ans</text>
  <path d="M 140 42 Q 340 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="255" y="58" width="170" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="81" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">cur = 1，ans = 1</text>

  <g filter="url(#sk)"><path d="M 340 96 L 340 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="255" y="124" width="170" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="340" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">遍历 i = 1 … n−1</text>

  <g filter="url(#sk)"><path d="M 340 162 L 340 182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 340 186 L 462 228 L 340 270 L 218 228 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="340" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">s[i] − s[i−1] = 1 ?</text>

  <text x="470" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="210" y="222" text-anchor="end" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><path d="M 462 228 L 490 228" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="496" y="208" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="566" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cur = cur + 1</text>

  <g filter="url(#sk)"><path d="M 218 228 L 190 228" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="44" y="208" width="140" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="114" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">cur = 1</text>

  <g filter="url(#sk)"><path d="M 566 248 L 566 319 L 432 319" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 114 248 L 114 319 L 248 319" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="255" y="300" width="170" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="340" y="323" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = max(ans, cur)</text>

  <g filter="url(#sk)"><path d="M 340 338 L 340 360" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="255" y="364" width="170" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="386" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">i = i + 1</text>

  <g filter="url(#sk)"><path d="M 255 381 L 20 381 L 20 143 L 248 143" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="137" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">继续下一间隙</text>

  <g filter="url(#sk)"><path d="M 425 143 L 662 143 L 662 447 L 596 447" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="544" y="135" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">i 越界 → 遍历结束</text>

  <g filter="url(#sk)"><rect x="42" y="428" width="280" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="182" y="451" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">可选剪枝：cur = 26 时立即返回 26</text>

  <g filter="url(#sk)"><rect x="430" y="428" width="160" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="510" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03a3a" filter="url(#sk)">返回 ans</text>
</svg>
