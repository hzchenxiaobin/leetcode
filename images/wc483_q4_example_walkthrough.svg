<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：lists = [[1,3,5],[2,4],[6,7,8]]（记为 L0、L1、L2）</text>

  <!-- DP 表 -->
  <g filter="url(#rough2)">
    <rect x="30" y="44" width="396" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="72" y="62">子集 S</text>
    <text x="186" y="62">合并后内容</text>
    <text x="292" y="62">len</text>
    <text x="326" y="62">med</text>
    <text x="384" y="62">dp[S]</text>
  </g>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1">
    <line x1="30" y1="90" x2="426" y2="90"/><line x1="30" y1="120" x2="426" y2="120"/>
    <line x1="30" y1="150" x2="426" y2="150"/><line x1="30" y1="180" x2="426" y2="180"/>
    <line x1="30" y1="210" x2="426" y2="210"/><line x1="30" y1="240" x2="426" y2="240"/>
  </g>

  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="72" y="108">{L0}</text><text x="186" y="108">[1,3,5]</text><text x="292" y="108">3</text><text x="326" y="108">3</text><text x="384" y="108">0</text>
    <text x="72" y="138">{L1}</text><text x="186" y="138">[2,4]</text><text x="292" y="138">2</text><text x="326" y="138">2</text><text x="384" y="138">0</text>
    <text x="72" y="168">{L2}</text><text x="186" y="168">[6,7,8]</text><text x="292" y="168">3</text><text x="326" y="168">7</text><text x="384" y="168">0</text>
    <text x="72" y="198">{L0,L1}</text><text x="186" y="198">[1,2,3,4,5]</text><text x="292" y="198">5</text><text x="326" y="198">3</text><text x="384" y="198">5+|3−2|=6</text>
    <text x="72" y="228">{L0,L2}</text><text x="186" y="228">[1,3,5,6,7,8]</text><text x="292" y="228">6</text><text x="326" y="228">5</text><text x="384" y="228">6+|3−7|=10</text>
    <text x="72" y="258">{L1,L2}</text><text x="186" y="258">[2,4,6,7,8]</text><text x="292" y="258">5</text><text x="326" y="258">6</text><text x="384" y="258">5+|2−7|=10</text>
  </g>

  <!-- 满集行（橙，高亮） -->
  <rect x="30" y="268" width="396" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="72" y="287">{L0,L1,L2}</text><text x="186" y="287">[1,2,…,8]</text><text x="292" y="287">8</text><text x="326" y="287">4</text><text x="384" y="287">8+10=18</text>
  </g>

  <!-- 右侧：满集的三种划分 -->
  <path d="M428,283 Q444,283 452,268" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="454" y="44" width="196" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="552" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">满集的三种划分</text>
  <g font-size="10" fill="#333" filter="url(#rough2)">
    <text x="470" y="92">{L0} | {L1,L2}:</text>
    <text x="478" y="108">0+10+|3−6| = 13</text>
    <text x="470" y="134">{L1} | {L0,L2}:</text>
    <text x="478" y="150">0+10+|2−5| = 13</text>
  </g>
  <rect x="464" y="162" width="176" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="552" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{L2} | {L0,L1}: ← 最优</text>
  <text x="552" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0+6+|7−3| = 10 ✓</text>
  <text x="552" y="222" text-anchor="middle" font-size="10.5" fill="#5a7099" filter="url(#rough2)">dp = len(8) + 10 = 18</text>

  <!-- 底部注解 -->
  <text x="330" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">偶数长度取左中：{L0,L2} 合并后长 6，med = 排序后第 (6−1)//2 = 2 位 → 5</text>
  <text x="330" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最优方案：先合并 L0、L1（成本 6），再与 L2 合并（成本 5+3+|3−7| = 12），总成本 18</text>
  <text x="330" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 med({L0,L1,L2}) = 4 在最终答案中并未用到：满集不再作为别人的孩子参与转移</text>
</svg>
