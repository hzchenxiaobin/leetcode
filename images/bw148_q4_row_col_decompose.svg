<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="384" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">曼哈顿距离可以按行、列拆开算，两侧完全对称</text>
  <text filter="url(#rough2)" x="290" y="45" text-anchor="middle" font-size="11" fill="#888">固定行距 d：有 n² 对格子、共 m−d 对行组合，贡献 n² · d · (m−d)</text>

  <text filter="url(#rough2)" x="26" y="76" font-size="11" fill="#333" font-weight="bold">行方向（m 行）</text>
  <g filter="url(#rough2)">
    <rect x="30" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="68" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="106" y="86" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="144" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="182" y="86" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#334">
    <text x="47" y="106">r₀</text>
    <text x="85" y="106">r₁</text>
    <text x="123" y="106">r₂</text>
    <text x="161" y="106">r₃</text>
    <text x="199" y="106">r₄</text>
  </g>
  <text filter="url(#rough2)" x="230" y="106" font-size="10.2" fill="#666">行距 d = 2 的行对：(r₀,r₂) (r₁,r₃) (r₂,r₄)，共 m − d = 3 对</text>

  <g filter="url(#rough2)">
    <rect x="30" y="128" width="266" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
  </g>
  <text filter="url(#rough2)" x="163" y="148" text-anchor="middle" font-size="10.6" fill="#3a5a30">每对行 ⇒ n × n = n² 对格子（列可任意）</text>

  <text filter="url(#rough2)" x="26" y="188" font-size="11" fill="#333" font-weight="bold">列方向（n 列）同理</text>
  <g filter="url(#rough2)">
    <rect x="30" y="198" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="60" y="198" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="90" y="198" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="120" y="198" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#334">
    <text x="43" y="216">c₀</text>
    <text x="73" y="216">c₁</text>
    <text x="103" y="216">c₂</text>
    <text x="133" y="216">c₃</text>
  </g>
  <text filter="url(#rough2)" x="164" y="216" font-size="10.2" fill="#666">列距 d 的格子对贡献 m² · d · (n − d)</text>

  <rect x="316" y="70" width="238" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="435" y="92" text-anchor="middle" font-size="11.4" fill="#8a6a20" font-weight="bold">一维公式</text>
  <text filter="url(#rough2)" x="435" y="118" text-anchor="middle" font-size="11" fill="#444">S(L) = Σ_{d=1}^{L−1} d · (L − d)</text>
  <text filter="url(#rough2)" x="435" y="144" text-anchor="middle" font-size="11" fill="#444">= (L³ − L) / 6</text>
  <text filter="url(#rough2)" x="435" y="172" text-anchor="middle" font-size="10.2" fill="#666">推导：Σ d·L − Σ d²</text>
  <text filter="url(#rough2)" x="435" y="190" text-anchor="middle" font-size="10.2" fill="#666">= L·L(L−1)/2 − (L−1)L(2L−1)/6</text>
  <text filter="url(#rough2)" x="435" y="214" text-anchor="middle" font-size="10.4" fill="#8a6a20">S(2)=1，S(4)=10，S(10)=165</text>
  <text filter="url(#rough2)" x="435" y="234" text-anchor="middle" font-size="9.8" fill="#888">取模后要用 6 的逆元</text>

  <rect x="26" y="266" width="528" height="52" fill="#eef3f8" stroke="#8899aa" stroke-width="1.2" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="286" font-size="10.8" fill="#3a4a66" font-weight="bold">合起来</text>
  <text filter="url(#rough2)" x="42" y="306" font-size="11" fill="#444">Σ 格子对 dist = n² · S(m) + m² · S(n)　　最终答案 = C(mn−2, k−2) × 上式 (mod 1e9+7)</text>

  <rect x="26" y="330" width="528" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="42" y="350" font-size="10.8" fill="#8a3a36" font-weight="bold">易错：m、n 只到 1e5，但 m·n 也只到 1e5</text>
  <text filter="url(#rough2)" x="42" y="368" font-size="10.6" fill="#444">所以阶乘表开到 mn 即可；m³ 会超 32 位，务必先取模再乘，或用 64 位整数。</text>
</svg>
