<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：names = ["kaido","kaido(1)","kaido","kaido(1)"]</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿 = 名字本来就空闲，红 = 撞名后要靠指针探测出最小 k</text>

  <rect x="24" y="62" width="632" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="40" y="82" font-size="11" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="88" y="82" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 name</text>
  <text x="224" y="82" font-size="11" fill="#3a4a66" filter="url(#rough2)">占用？</text>
  <text x="318" y="82" font-size="11" fill="#3a4a66" filter="url(#rough2)">探测过程（k 与命中情况）</text>
  <text x="548" y="82" font-size="11" fill="#3a4a66" filter="url(#rough2)">实际落名</text>

  <rect x="24" y="92" width="632" height="42" fill="#e6f4ea" stroke="#8aab7a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="118" font-size="11.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="88" y="118" font-size="11.5" fill="#444" filter="url(#rough2)">kaido</text>
  <text x="224" y="118" font-size="11" fill="#3a5a30" filter="url(#rough2)">否</text>
  <text x="318" y="118" font-size="11" fill="#3a5a30" filter="url(#rough2)">不加后缀</text>
  <text x="548" y="118" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">kaido</text>

  <rect x="24" y="134" width="632" height="42" fill="#e6f4ea" stroke="#8aab7a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="160" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="88" y="160" font-size="11.5" fill="#444" filter="url(#rough2)">kaido(1)</text>
  <text x="224" y="160" font-size="11" fill="#3a5a30" filter="url(#rough2)">否</text>
  <text x="318" y="160" font-size="11" fill="#3a5a30" filter="url(#rough2)">原样保留，后缀是名字的一部分</text>
  <text x="548" y="160" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">kaido(1)</text>

  <rect x="24" y="176" width="632" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="202" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="88" y="202" font-size="11.5" fill="#444" filter="url(#rough2)">kaido</text>
  <text x="224" y="202" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <text x="318" y="202" font-size="11" fill="#8a3a36" filter="url(#rough2)">k=1 已占 → k=2 空闲，命中</text>
  <text x="548" y="202" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">kaido(2)</text>

  <rect x="24" y="218" width="632" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="88" y="244" font-size="11.5" fill="#444" filter="url(#rough2)">kaido(1)</text>
  <text x="224" y="244" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <text x="318" y="244" font-size="11" fill="#8a3a36" filter="url(#rough2)">基名整体是 kaido(1)，k=1 即空闲</text>
  <text x="548" y="244" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">kaido(1)(1)</text>

  <rect x="24" y="270" width="632" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="294" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">关键：基名永远是「输入的完整字符串」。第 3 步若把 kaido(1) 拆成基名 kaido + 后缀 1，就会错答 kaido(3)。</text>
  <text x="40" y="316" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">指针写回：nxt[kaido] = 3，nxt[kaido(1)] = 2；下次遇到同基名直接从记忆处起步，不必从 k = 1 重扫。</text>
  <text x="40" y="338" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">used 只增不删 ⇒ 被跳过的格子永远不会变空，指针回退没有任何收益。</text>
</svg>
