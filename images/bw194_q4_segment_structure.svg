<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：last 降序分段（左）与 first 升序分段（右）</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "abcac"，边界 j = 2：左桶断点 = 各字符在 [0..2] 的最后出现；右桶断点 = 起点 3 起各字符的首次出现</text>

  <!-- 字符格子 -->
  <rect x="152" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="208" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="264" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="320" y="62" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="376" y="62" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>

  <text x="180" y="114" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 0</text>
  <text x="236" y="114" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标 1</text>
  <text x="292" y="114" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 2 = j</text>
  <text x="348" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下标 3 = j+1</text>
  <text x="404" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">下标 4</text>

  <text x="180" y="130" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">last(a)=0</text>
  <text x="236" y="130" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">last(b)=1</text>
  <text x="292" y="130" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">last(c)=2</text>
  <text x="348" y="130" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">first(a)=3</text>
  <text x="404" y="130" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">first(c)=4</text>

  <!-- 边界虚线 -->
  <path d="M320,54 L320,136" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 左面板 -->
  <rect x="32" y="148" width="280" height="182" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="170" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左桶：断点降序 L₁=2 &gt; L₂=1 &gt; L₃=0（哨兵 −1）</text>

  <rect x="48" y="182" width="82" height="30" rx="4" fill="#b8d0f0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i=0 → d=3</text>
  <rect x="130" y="182" width="82" height="30" rx="4" fill="#d0e0f8" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i=1 → d=2</text>
  <rect x="212" y="182" width="82" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">i=2 → d=1</text>

  <text x="48" y="238" font-size="10.5" fill="#333" filter="url(#rough2)">i ∈ (L₂, L₁] = {2}："c" → d = 1</text>
  <text x="48" y="258" font-size="10.5" fill="#333" filter="url(#rough2)">i ∈ (L₃, L₂] = {1}："bc" → d = 2</text>
  <text x="48" y="278" font-size="10.5" fill="#333" filter="url(#rough2)">i ∈ [0, L₃] = {0}："abc" → d = 3</text>
  <text x="48" y="310" font-size="10.5" fill="#446688" filter="url(#rough2)">L_j(d) = L_d − L_{d+1}，三段各长 1</text>

  <!-- 右面板 -->
  <rect x="328" y="148" width="280" height="182" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右桶：断点升序 N₁=3 &lt; N₂=4（哨兵 n=5）</text>

  <rect x="344" y="182" width="118" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">k=3 → d=1</text>
  <rect x="462" y="182" width="118" height="30" rx="4" fill="#d0ead8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">k=4 → d=2</text>

  <text x="344" y="238" font-size="10.5" fill="#333" filter="url(#rough2)">k ∈ [N₁, N₂) = {3}："a" → d = 1</text>
  <text x="344" y="258" font-size="10.5" fill="#333" filter="url(#rough2)">k ∈ [N₂, n) = {4}："ac" → d = 2</text>
  <text x="344" y="278" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">b 在 [3..4] 不出现 → 断点只有 2 个</text>
  <text x="344" y="310" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">R_p(d) = N_{d+1} − N_d，两段各长 1</text>

  <!-- 乘号 -->
  <text x="320" y="250" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold" filter="url(#rough2)">×</text>

  <!-- 贡献框 -->
  <rect x="32" y="344" width="576" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="371" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">边界 2 的贡献 = 1×1 (d=1) + 1×1 (d=2) = 2；d=3 右侧无桶，自动为 0</text>

  <!-- 底部注释 -->
  <text x="320" y="418" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">断点集合 ≤ 26 个数 → 整张桶表被压缩成一列相邻差分</text>
  <text x="320" y="442" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j 右移一步：左侧仅 s[j+1] 的 last 变为 j+1（新最大）；右侧仅 s[p] 的 first 后移到下一次出现</text>
  <text x="320" y="466" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i 每跨过一个 last 断点、k 每跨过一个 first 断点，不同字符数恰好 +1</text>
</svg>
