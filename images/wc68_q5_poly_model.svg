<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：让每个子表达式都变成「多项式」</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">多项式对 ＋ − × 封闭 ⇒ 括号内、括号外、乘法两侧可以自由拼接</text>

  <!-- 表示方式 -->
  <rect x="30" y="68" width="272" height="182" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="90" text-anchor="start" font-size="11" fill="#2f4466" font-weight="bold" filter="url(#rough2)">① 稀疏表示：键 → 系数</text>
  <text x="46" y="114" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">3 * a*a*b   ⇒  {(a,a,b): 3}</text>
  <text x="46" y="136" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">5 * c       ⇒  {(c,): 5}</text>
  <text x="46" y="158" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">-6          ⇒  {(): -6}</text>
  <text x="46" y="186" text-anchor="start" font-size="10.5" fill="#8a5a20" filter="url(#rough2)">相加：键相同则系数相加</text>
  <text x="46" y="208" text-anchor="start" font-size="10.5" fill="#8a5a20" filter="url(#rough2)">相乘：键有序归并、系数相乘</text>
  <text x="46" y="230" text-anchor="start" font-size="10.5" fill="#8a5a20" filter="url(#rough2)">系数 0 ⇒ 立刻删键</text>

  <!-- 规则 -->
  <rect x="318" y="68" width="272" height="182" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="334" y="90" text-anchor="start" font-size="11" fill="#2f5230" font-weight="bold" filter="url(#rough2)">② 键的规范形式（唯一性）</text>
  <text x="334" y="114" text-anchor="start" font-size="10.5" fill="#33512f" filter="url(#rough2)">变量名按字典序排序，重复次数保留</text>
  <text x="334" y="136" text-anchor="start" font-size="10.5" fill="#33512f" filter="url(#rough2)">(a,a,b) 就是 a*a*b，不会写成 b*a*a</text>
  <text x="334" y="162" text-anchor="start" font-size="10.5" fill="#33512f" filter="url(#rough2)">③ 键是有序元组 ⇒ 乘积 = 归并</text>
  <text x="334" y="184" text-anchor="start" font-size="10.5" fill="#33512f" filter="url(#rough2)">(a,a,b) × (b,c) → (a,a,b,b,c)</text>
  <text x="334" y="210" text-anchor="start" font-size="10.5" fill="#33512f" filter="url(#rough2)">代价 O(deg)，同类项天然同键</text>
  <text x="334" y="232" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">④ 变量一读到就代入已知值（更省）</text>

  <!-- 代入 -->
  <rect x="30" y="262" width="560" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="280" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">代入是环同态：先把 e 换成 1 再乘，与先乘完再换 e，结果完全一样。</text>
  <text x="46" y="297" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">提前代入还能在「值为 0」时整项消失，避免项数膨胀。</text>

  <!-- 输出 -->
  <rect x="30" y="316" width="560" height="80" fill="#f2f2f2" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="336" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">输出排序：先按次数（变量个数）降序，同次数按变量元组字典序升序</text>
  <text x="46" y="358" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">-2*a*a*a → 1*a*a*b → 3*b*b → 4*a → 5*c → -6</text>
  <text x="46" y="380" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ 直接对整串排序会错：「1*a」&lt;「1*b*b」，会把 1 次的 a 排到 2 次的 b*b 前面</text>
</svg>
