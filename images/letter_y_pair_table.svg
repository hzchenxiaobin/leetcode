<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">固定 (a, b) 后代价完全解耦：两张计数表 + 6 对组合</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a = Y 内目标值，b = Y 外目标值，a ≠ b；值域只有 {0,1,2}，|N| 记非 Y 格数</text>

  <!-- 左：代价公式框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="290" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="185" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">代价公式（固定 a、b 后两区域独立）</text>
  <text x="185" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">cost(a,b) = (|Y| − cntY[a])</text>
  <text x="199" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+ (|N| − cntN[b])</text>
  <text x="185" y="188" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每格恰属一侧：已是目标值 → 0 次操作</text>
  <text x="185" y="210" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否则 → 恰 1 次（一次操作可改成任意值）</text>
  <text x="185" y="232" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">改 Y 内格子不影响 Y 外的最优决策 —— 代价可直接相加</text>

  <!-- 右：3×3 组合表 -->
  <text x="468" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">枚举全部组合（行 = a，列 = b）</text>
  <text x="424" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b=0</text>
  <text x="486" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b=1</text>
  <text x="548" y="104" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">b=2</text>
  <text x="412" y="130" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">a=0</text>
  <text x="412" y="172" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">a=1</text>
  <text x="412" y="214" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">a=2</text>

  <g filter="url(#rough2)">
    <rect x="420" y="110" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="448" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <g filter="url(#rough2)">
    <rect x="476" y="110" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="504" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(0,1)</text>
  <g filter="url(#rough2)">
    <rect x="532" y="110" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(0,2)</text>

  <g filter="url(#rough2)">
    <rect x="476" y="150" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="504" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(1,0)</text>
  <g filter="url(#rough2)">
    <rect x="420" y="150" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="448" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <g filter="url(#rough2)">
    <rect x="532" y="150" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(1,2)</text>

  <g filter="url(#rough2)">
    <rect x="420" y="190" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="448" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(2,0)</text>
  <g filter="url(#rough2)">
    <rect x="476" y="190" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="504" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">(2,1)</text>
  <g filter="url(#rough2)">
    <rect x="532" y="190" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="560" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="468" y="250" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3×3 = 9 对，划掉 a = b 的 3 对，剩 6 对合法组合</text>

  <!-- 底部：贪心陷阱警示框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="580" height="144" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">贪心陷阱：两侧各自取众数 ✗（用示例 2 的真实数据）</text>
  <text x="330" y="324" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">示例 2：cntY = [2, 2, 3]，cntN = [3, 4, 11]，|Y| = 7，|N| = 18</text>
  <text x="330" y="348" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">贪心：a = 2（Y 的众数），b 只能退而取 1 → cost(2,1) = 4 + 14 = 18</text>
  <text x="330" y="372" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">最优：a = 0 让出众数，b = 2 吃下大计数 → cost(0,2) = 5 + 7 = 12</text>
  <text x="330" y="398" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">a ≠ b 把两个选择耦合在一起 —— 值域只有 3，整体枚举 6 对最省心</text>
</svg>
