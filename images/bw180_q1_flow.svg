<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="384" fill="#fafafa"/>
  <text x="260.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：三次判断，兜底 Invalid</text>
  <text x="260.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">顺序无关，但建议按「特殊值 → 区间 → 兜底」写</text>
  <rect x="100" y="60" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入 timer</text>
  <path d="M 220 100 L 220 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="220,122.0 320.0,146 220,170.0 120.0,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="151" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">timer == 0 ？</text>
  <path d="M 320 146 L 358 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="338" y="137" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="362" y="128" width="96" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="150" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">Green</text>
  <path d="M 220 170 L 220 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="220,192.0 320.0,216 220,240.0 120.0,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="221" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">timer == 30 ？</text>
  <path d="M 320 216 L 358 216" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="338" y="207" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="362" y="198" width="96" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="220" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Orange</text>
  <path d="M 220 240 L 220 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="220,262.0 330.0,286 220,310.0 110.0,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="291" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">30 &lt; timer ≤ 90 ？</text>
  <path d="M 330 286 L 358 286" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="344" y="277" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="362" y="268" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Red</text>
  <path d="M 220 310 L 220 330" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="334" width="220" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="220" y="358" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">都不是 → "Invalid"</text>
</svg>
