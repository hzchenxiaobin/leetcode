<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两条约束压扁成一维：每列绑定成一个值</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: constraints ===== -->
  <text x="470" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 约束解读：竖直相等沿列传递，水平不等只看相邻</text>

  <g font-size="10" fill="#888" font-weight="bold">
    <text x="137" y="96" text-anchor="middle">列0</text>
    <text x="217" y="96" text-anchor="middle">列1</text>
    <text x="297" y="96" text-anchor="middle">列2</text>
    <text x="62" y="121">行0</text>
    <text x="62" y="177">行1</text>
  </g>

  <!-- row 0 cells -->
  <g filter="url(#sk)"><rect x="110" y="100" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="137" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="190" y="100" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="217" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="270" y="100" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="297" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>

  <!-- vertical equality arrows in the gap -->
  <g stroke="#4a8e4a" stroke-width="1.6">
    <line x1="137" y1="134" x2="137" y2="154" marker-end="url(#arG)" marker-start="url(#arG)" filter="url(#sk)"/>
    <line x1="217" y1="134" x2="217" y2="154" marker-end="url(#arG)" marker-start="url(#arG)" filter="url(#sk)"/>
    <line x1="297" y1="134" x2="297" y2="154" marker-end="url(#arG)" marker-start="url(#arG)" filter="url(#sk)"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2e6e2e">
    <text x="150" y="148">=</text>
    <text x="230" y="148">=</text>
    <text x="310" y="148">=</text>
  </g>

  <!-- horizontal not-equal arrows in row 0 -->
  <g stroke="#b85450" stroke-width="1.6">
    <line x1="168" y1="116" x2="186" y2="116" marker-end="url(#arR)" filter="url(#sk)"/>
    <line x1="248" y1="116" x2="266" y2="116" marker-end="url(#arR)" filter="url(#sk)"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#b85450">
    <text x="177" y="112" text-anchor="middle">≠</text>
    <text x="257" y="112" text-anchor="middle">≠</text>
  </g>

  <!-- row 1 cells -->
  <g filter="url(#sk)"><rect x="110" y="156" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="137" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="190" y="156" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="217" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="270" y="156" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="297" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1</text>

  <!-- constraint boxes -->
  <g filter="url(#sk)"><rect x="420" y="94" width="470" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="440" y="116" font-size="12" font-weight="bold" fill="#2e6e2e">竖直约束 grid[i][j] = grid[i+1][j]：同一列上下相等</text>
  <text x="440" y="136" font-size="11" fill="#444">沿列链式传递 → 整列所有格子取同一个值（整列 = 一个整体）</text>
  <g filter="url(#sk)"><rect x="420" y="170" width="470" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="440" y="192" font-size="12" font-weight="bold" fill="#7a5415">水平约束 grid[i][j] ≠ grid[i][j+1]：同一行左右不等</text>
  <text x="440" y="212" font-size="11" fill="#444">每列同值之后 → 相邻两列的「列值」必须不同</text>
  <text x="440" y="252" font-size="10" fill="#b03a3a">★ 行方向再无其他约束：全部信息都浓缩进长度为 n 的列值序列</text>

  <!-- ===== Panel 2: column compression ===== -->
  <text x="470" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② 列压缩：m×n 网格塌缩成 1×n 列值序列，问题降成一维</text>

  <!-- dimmed mini grid -->
  <g opacity="0.55">
    <g filter="url(#sk)"><rect x="110" y="304" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="146" y="304" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="182" y="304" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="110" y="326" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="146" y="326" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <g filter="url(#sk)"><rect x="182" y="326" width="30" height="18" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  </g>
  <text x="161" y="360" text-anchor="middle" font-size="10" fill="#999">整列绑定</text>

  <!-- arrow -->
  <path d="M 232 325 Q 262 315 288 325" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#666">每列 → 1 个值</text>

  <!-- value chips -->
  <g filter="url(#sk)"><rect x="300" y="300" width="56" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="328" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk)"><rect x="386" y="300" width="56" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="414" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">0</text>
  <g filter="url(#sk)"><rect x="472" y="300" width="56" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="500" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e">1</text>
  <g font-size="14" font-weight="bold" fill="#b85450">
    <text x="371" y="331" text-anchor="middle">≠</text>
    <text x="457" y="331" text-anchor="middle">≠</text>
  </g>
  <text x="560" y="332" font-size="11" fill="#444">← 列值序列：相邻互异</text>

  <text x="390" y="380" text-anchor="middle" font-size="11" fill="#444">一个值定一整列的生死：把第 j 列整体改成值 v 的代价 = m − cnt[j][v]</text>

  <!-- model box -->
  <g filter="url(#sk)"><rect x="60" y="396" width="840" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="470" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">等价模型：路径图染色 —— n 个点排成一排、10 种颜色、相邻点异色</text>
  <text x="470" y="440" text-anchor="middle" font-size="11" fill="#444">目标：给每列挑一个值（相邻列互异），最小化总代价 Σ cost(j, v)</text>

  <!-- ===== Panel 3: cost and value domain ===== -->
  <text x="470" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 代价函数与值域：10 个候选值就够</text>

  <g filter="url(#sk)"><rect x="60" y="498" width="430" height="76" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="80" y="520" font-size="12" font-weight="bold" fill="#2b6e9e">代价：cost(j, v) = m − cnt[j][v]</text>
  <text x="80" y="540" font-size="11" fill="#444">cnt[j][v] = 第 j 列中原本就等于 v 的格子数</text>
  <text x="80" y="558" font-size="10" fill="#888">不用改的格子恰好是它们，其余 m − cnt 个全部要动</text>

  <g filter="url(#sk)"><rect x="520" y="498" width="360" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="540" y="520" font-size="12" font-weight="bold" fill="#2e6e2e">值域：候选列值只需 0 ~ 9</text>
  <text x="540" y="540" font-size="11" fill="#444">格子值 ∈ 0..9 → 域外新值（≥10）代价恒为 m</text>
  <text x="540" y="558" font-size="10" fill="#888">与「最坏的域内值」并列、不更优 → 被支配，无需考虑</text>

  <!-- value chips 0..9 -->
  <text x="242" y="610" text-anchor="end" font-size="10" fill="#888">10 个候选值：</text>
  <g>
    <g filter="url(#sk)"><rect x="250" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="270" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">0</text>
    <g filter="url(#sk)"><rect x="296" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="316" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
    <g filter="url(#sk)"><rect x="342" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="362" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">2</text>
    <g filter="url(#sk)"><rect x="388" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="408" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
    <g filter="url(#sk)"><rect x="434" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="454" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">4</text>
    <g filter="url(#sk)"><rect x="480" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="500" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">5</text>
    <g filter="url(#sk)"><rect x="526" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="546" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">6</text>
    <g filter="url(#sk)"><rect x="572" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="592" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">7</text>
    <g filter="url(#sk)"><rect x="618" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="638" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">8</text>
    <g filter="url(#sk)"><rect x="664" y="588" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="684" y="608" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">9</text>
  </g>
</svg>
