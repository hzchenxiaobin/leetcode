<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="560" height="450" fill="#fdfcf7"/>
  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [−5, 1, 2, −3, 4]，k = 2</text>
  <path d="M 110 44 Q 280 52 450 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="84" y="60" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="132" y="60" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="196" y="60" width="112" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="308" y="60" width="102" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="410" y="60" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">
    <text x="62" y="76">j</text>
    <text x="108" y="76">r = j mod 2</text>
    <text x="164" y="76">P[j]</text>
    <text x="252" y="76">先查 minPref[r]</text>
    <text x="359" y="72">候选</text>
    <text x="359" y="86">P[j] − minPref[r]</text>
    <text x="465" y="72">后更</text>
    <text x="465" y="86">minPref[r]</text>
  </g>

  <!-- rows: r=0 light blue, r=1 light green, winner pink -->
  <g filter="url(#sk)">
    <rect x="40" y="96" width="480" height="36" fill="#eef4fd"/>
    <rect x="40" y="132" width="480" height="36" fill="#edf6ee"/>
    <rect x="40" y="168" width="480" height="36" fill="#eef4fd"/>
    <rect x="40" y="204" width="480" height="36" fill="#edf6ee"/>
    <rect x="40" y="240" width="480" height="36" fill="#eef4fd"/>
    <rect x="40" y="276" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="40" y="96" width="480" height="216" fill="none" stroke="#8aa3b8" stroke-width="1.1"/>
    <path d="M 84 60 L 84 312 M 132 60 L 132 312 M 196 60 L 196 312 M 308 60 L 308 312 M 410 60 L 410 312" stroke="#8aa3b8" stroke-width="1.1" fill="none"/>
    <path d="M 40 132 L 520 132 M 40 168 L 520 168 M 40 204 L 520 204 M 40 240 L 520 240 M 40 276 L 520 276" stroke="#c6d4e0" stroke-width="0.9" fill="none"/>
  </g>

  <g text-anchor="middle" font-size="12.5" fill="#333">
    <text x="62" y="119">0</text><text x="108" y="119" fill="#2b6e9e" font-weight="bold">0</text><text x="164" y="119">0</text>
    <text x="252" y="119" fill="#777">+∞（跳过）</text><text x="359" y="119" fill="#999">—</text><text x="465" y="119">0</text>
    <text x="62" y="155">1</text><text x="108" y="155" fill="#2e6e2e" font-weight="bold">1</text><text x="164" y="155">−5</text>
    <text x="252" y="155" fill="#777">+∞（跳过）</text><text x="359" y="155" fill="#999">—</text><text x="465" y="155">−5</text>
    <text x="62" y="191">2</text><text x="108" y="191" fill="#2b6e9e" font-weight="bold">0</text><text x="164" y="191">−4</text>
    <text x="252" y="191">0</text><text x="359" y="191" font-weight="bold">−4</text><text x="465" y="191">−4</text>
    <text x="62" y="227">3</text><text x="108" y="227" fill="#2e6e2e" font-weight="bold">1</text><text x="164" y="227">−2</text>
    <text x="252" y="227">−5</text><text x="359" y="227" font-weight="bold">3</text><text x="465" y="227">−5</text>
    <text x="62" y="263">4</text><text x="108" y="263" fill="#2b6e9e" font-weight="bold">0</text><text x="164" y="263">−5</text>
    <text x="252" y="263">−4</text><text x="359" y="263" font-weight="bold">−1</text><text x="465" y="263">−5</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">
    <text x="62" y="299">5</text><text x="108" y="299">1</text><text x="164" y="299">−1</text>
    <text x="252" y="299">−5</text><text x="359" y="300" font-size="15">4 ★</text><text x="465" y="299">−5</text>
  </g>

  <!-- channel annotations -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="230" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="155" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">余 0 通道：下标 {0, 2, 4}</text>
  <text x="155" y="370" text-anchor="middle" font-size="11.5" fill="#446688">minPref 轨迹：0 → −4 → −5</text>

  <g filter="url(#sk)">
    <rect x="290" y="330" width="230" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="405" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">余 1 通道：下标 {1, 3, 5}</text>
  <text x="405" y="370" text-anchor="middle" font-size="11.5" fill="#4a7a3a">minPref 轨迹：−5 → −5 → −5（历史最低反复被蹭）</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="400" width="480" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="280" y="422" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ans = max(−4, 3, −1, 4) = 4 ← 子数组 [1, 2, −3, 4]（长度 4 = 2k）</text>
</svg>
