<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：energy = [5, 2, −10, −5, 1]，k = 3</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i 从 4 倒序走到 0，原地填 dp[i] 并打擂台</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="45" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="105" y="58" width="85" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="58" width="115" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="305" y="58" width="85" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="390" y="58" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">i</text>
    <text x="147" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">原值</text>
    <text x="247" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">i+k 情形</text>
    <text x="347" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">dp[i]</text>
    <text x="435" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">ans</text>
  </g>

  <!-- row i=4 -->
  <g filter="url(#rough2)">
    <rect x="60" y="86" width="45" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="105" y="86" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="190" y="86" width="115" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="305" y="86" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="86" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="108" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="147" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="247" y="108" text-anchor="middle" font-size="11" fill="#888">7 ≥ 5，链尾</text>
    <text x="347" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="435" y="108" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- row i=3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="122" width="45" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="105" y="122" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="190" y="122" width="115" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="305" y="122" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="122" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="144" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="147" y="144" text-anchor="middle" font-size="12" fill="#333">−5</text>
    <text x="247" y="144" text-anchor="middle" font-size="11" fill="#888">6 ≥ 5，链尾</text>
    <text x="347" y="144" text-anchor="middle" font-size="12" fill="#333">−5</text>
    <text x="435" y="144" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- row i=2 -->
  <g filter="url(#rough2)">
    <rect x="60" y="158" width="45" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="105" y="158" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="190" y="158" width="115" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="305" y="158" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="158" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="147" y="180" text-anchor="middle" font-size="12" fill="#333">−10</text>
    <text x="247" y="180" text-anchor="middle" font-size="11" fill="#888">5 ≥ 5，链尾</text>
    <text x="347" y="180" text-anchor="middle" font-size="12" fill="#333">−10</text>
    <text x="435" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- row i=1 (highlight) -->
  <g filter="url(#rough2)">
    <rect x="60" y="194" width="45" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="105" y="194" width="85" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="190" y="194" width="115" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="305" y="194" width="85" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="390" y="194" width="90" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="216" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="147" y="216" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="247" y="216" text-anchor="middle" font-size="11" fill="#333">4 &lt; 5 → 取 dp[4]</text>
    <text x="347" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2+1 = 3</text>
    <text x="435" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3</text>
  </g>

  <!-- row i=0 -->
  <g filter="url(#rough2)">
    <rect x="60" y="230" width="45" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="105" y="230" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="190" y="230" width="115" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="305" y="230" width="85" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="230" width="90" height="36" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)">
    <text x="82" y="252" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="147" y="252" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="247" y="252" text-anchor="middle" font-size="11" fill="#888">3 &lt; 5 → 取 dp[3]</text>
    <text x="347" y="252" text-anchor="middle" font-size="12" fill="#333">5+(−5) = 0</text>
    <text x="435" y="252" text-anchor="middle" font-size="12" fill="#333">3</text>
  </g>

  <!-- dp array strip -->
  <text x="112" y="306" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">dp =</text>
  <g filter="url(#rough2)">
    <rect x="140" y="286" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="192" y="286" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6"/>
    <rect x="244" y="286" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="296" y="286" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="348" y="286" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)">
    <text x="162" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
    <text x="214" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
    <text x="266" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−10</text>
    <text x="318" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−5</text>
    <text x="370" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  </g>
  <text x="440" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">max = 3 ✓</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="60" y="342" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="360" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i = 2、3、4 都是链尾，dp 值即原值；ans 一直停在 1</text>
  <text x="270" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i = 1 处 dp[1] = 2 + 1 = 3 抬高答案：从魔法师 1 出发吸 2 + 1 = 3</text>
</svg>
