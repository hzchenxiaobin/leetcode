<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="404" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">排序规则：按 S^∞ = (1^a 0^b)^∞ 从大到小</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">相邻两段 A、B 谁在前，等价于比较 A+B 与 B+A（也等价于比较 A^∞ 与 B^∞）</text>
  <polygon points="230,60.0 380.0,88 230,116.0 80.0,88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="84" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">A、B 的 b 都为 0 ？</text>
  <text x="230" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（两段都是全 1）</text>
  <path d="M 380 88 L 414 88" stroke="#999999" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="397" y="79" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">是</text>
  <rect x="418" y="70" width="118" height="36" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="477" y="92" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">顺序随意</text>
  <path d="M 230 116 L 230 138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="130" text-anchor="start" font-size="9.5" fill="#777" filter="url(#rough2)">否</text>
  <polygon points="230,142.0 380.0,170 230,198.0 80.0,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="166" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">其中一段 b = 0 ？</text>
  <text x="230" y="182" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（全 1 段必须排最前）</text>
  <path d="M 380 170 L 414 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="397" y="161" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="418" y="152" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="477" y="174" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">b = 0 在前</text>
  <path d="M 230 198 L 230 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="212" text-anchor="start" font-size="9.5" fill="#777" filter="url(#rough2)">否</text>
  <rect x="70" y="224" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="244" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">按 a 从大到小</text>
  <text x="230" y="261" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1 越多越靠前，高位越多 1</text>
  <path d="M 230 270 L 230 292" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="296" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="316" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a 相同 → 按 b 从小到大</text>
  <text x="230" y="333" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">0 越少，后面的 1 越早出现</text>
  <text x="230" y="366" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">这套规则正是把 A^∞ 与 B^∞ 逐位比较的结果，因此是良定义的（可传递）</text>
  <text x="230" y="386" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意：「a 降序」单独用是错的——全 1 段（b=0）必须优先</text>
</svg>
