<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">枚举候选 + 签名比较：O(30 · 10)</text>

  <rect x="150" y="54" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">target = sig(n)（10 个计数桶）</text>

  <path d="M300 100 L300 126" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="150" y="128" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="155" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">p = 1（最小的 2 的幂）</text>

  <path d="M300 172 L300 196" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="300,198 450,232 300,266 150,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="237" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">sig(p) == target ？</text>

  <!-- 是 -->
  <path d="M450 232 L520 232 L520 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="484" y="224" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="450" y="290" width="140" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="520" y="318" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">返回 true</text>

  <!-- 否 -->
  <path d="M150 232 L60 232 L60 288" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="96" y="224" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="6" y="290" width="120" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="66" y="318" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">p &lt;&lt;= 1</text>

  <path d="M66 336 L66 366 L240 366" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M240 366 L240 348" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="252" y="382" font-size="11" fill="#666" filter="url(#rough2)">p &gt; 10¹⁰ 仍无命中 → 返回 false</text>
</svg>
