<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 全程演算：nums = [1, 0, 2, 1, 3]</text>

  <g filter="url(#rough2)">
    <rect x="56" y="52" width="448" height="248" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="10"/>
  </g>
  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="100" y="76">i</text>
    <text x="164" y="76">后缀 OR</text>
    <text x="244" y="76">bit0 最近</text>
    <text x="324" y="76">bit1 最近</text>
    <text x="400" y="76">end</text>
    <text x="470" y="76">answer[i]</text>
  </g>
  <path d="M 66 86 L 494 86" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="112">0</text><text x="164" y="112">3</text><text x="244" y="112">0</text>
    <text x="324" y="112">2</text><text x="400" y="112">2</text>
    <text x="470" y="112" fill="#b85450" font-weight="bold">3</text>
    <text x="100" y="148">1</text><text x="164" y="148">3</text><text x="244" y="148">3</text>
    <text x="324" y="148">2</text><text x="400" y="148">3</text>
    <text x="470" y="148" fill="#b85450" font-weight="bold">3</text>
    <text x="100" y="184">2</text><text x="164" y="184">3</text><text x="244" y="184">3</text>
    <text x="324" y="184">2</text><text x="400" y="184">3</text>
    <text x="470" y="184" fill="#b85450" font-weight="bold">2</text>
    <text x="100" y="220">3</text><text x="164" y="220">3</text><text x="244" y="220">3</text>
    <text x="324" y="220">4</text><text x="400" y="220">4</text>
    <text x="470" y="220" fill="#b85450" font-weight="bold">2</text>
    <text x="100" y="256">4</text><text x="164" y="256">3</text><text x="244" y="256">4</text>
    <text x="324" y="256">4</text><text x="400" y="256">4</text>
    <text x="470" y="256" fill="#b85450" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 66 266 L 494 266" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  </g>
  <text x="280" y="290" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">answer = [3, 3, 2, 2, 1]，与官方一致</text>

  <g filter="url(#rough2)">
    <rect x="56" y="318" width="448" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="340">i 从右往左扫：先用自己的二进制刷新各 bit 的 nxt，</text>
    <text x="280" y="362">再取「后缀中仍存在的 bit」的 nxt 最大值作为 end</text>
  </g>
</svg>
