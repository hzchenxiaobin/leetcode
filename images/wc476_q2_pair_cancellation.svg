<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">构造：相邻异对相消，一定能消到只剩 |D| 个</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- rule box -->
  <rect x="56" y="58" width="528" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">规则：串里 a、b 并存 ⇒ 必有相邻的 "ab" / "ba"（长度 2 的平衡子串），删掉它</text>

  <!-- step 0: aaabb -->
  <g filter="url(#sk)">
    <rect x="96" y="112" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="112" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="204" y="112" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="258" y="112" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="312" y="112" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="120" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="174" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="228" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="282" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="336" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <rect x="198" y="106" width="114" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#sk)"/>
  <text x="328" y="138" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">删 "ab"</text>
  <path d="M 255 164 L 255 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 1: aab -->
  <g filter="url(#sk)">
    <rect x="156" y="192" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="210" y="192" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="264" y="192" width="48" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="180" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="234" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="288" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <rect x="204" y="186" width="114" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#sk)"/>
  <text x="332" y="218" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">再删 "ab"</text>
  <path d="M 261 244 L 261 268" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 2: a -->
  <rect x="228" y="274" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="252" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="292" y="300" text-anchor="start" font-size="11" fill="#888" filter="url(#sk)">只剩 a：没有 b，无对可消 ⇒ 终止</text>

  <!-- tracker panel -->
  <rect x="420" y="106" width="176" height="212" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="508" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">全程盯着 D</text>
  <text x="508" y="156" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">D = 3 − 2 = 1</text>
  <text x="508" y="180" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">长度：5 → 3 → 1</text>
  <text x="508" y="204" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">D 始终 = 1（不变量）</text>
  <text x="508" y="236" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">终止：只剩 1 个 a</text>
  <text x="508" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a48" filter="url(#sk)">答案 = |D| = 1</text>
  <text x="508" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">下界可达 ⇒ 最优</text>

  <!-- stack view box -->
  <rect x="56" y="330" width="528" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">栈视角（等价实现）：从左往右扫，当前字符与栈顶不同 → 一起弹掉，相同 → 入栈</text>
  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">栈内永远是同一种字符，最终栈的大小 = |D|，与直接计数殊途同归</text>
  <text x="320" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">所以一趟数出 a、b 的个数就够了</text>
</svg>
