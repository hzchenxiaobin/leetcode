<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">算法骨架：DFS 维护「根到当前节点」的 core 计数器</text>
  <path d="M 130 36 Q 320 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: tree -->
  <text x="150" y="64" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">示例 3 的树（节点旁：nums → core）</text>
  <g filter="url(#sk)">
    <path d="M 108 112 L 74 158" stroke="#4a7a3a" stroke-width="2.6"/>
    <path d="M 132 112 L 182 158" stroke="#b0b0b0" stroke-width="1.6"/>
    <path d="M 74 184 L 74 226" stroke="#4a7a3a" stroke-width="2.6"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="120" cy="96" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="70" cy="172" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="190" cy="172" r="17" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
    <circle cx="70" cy="244" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">
    <text x="120" y="101">0</text>
    <text x="70" y="177">1</text>
    <text x="190" y="177">2</text>
    <text x="70" y="249">3</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#667" filter="url(#sk)">
    <text x="120" y="75">1→c1</text>
    <text x="40" y="150" text-anchor="end">2→c2</text>
    <text x="218" y="150">9→c1</text>
    <text x="104" y="268">4→c1 当前</text>
  </g>
  <path d="M 62 210 Q 88 214 92 230" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="300" text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">绿色路径 = 当前 DFS 栈上</text>
  <text x="150" y="318" text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">「已进入未退出」的节点</text>
  <text x="150" y="336" text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">= 节点 3 的全部祖先</text>

  <!-- right: counter box -->
  <g filter="url(#sk)">
    <rect x="300" y="56" width="300" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="450" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">cnt：路径 0→1→3 的 core 计数</text>
  <g filter="url(#sk)">
    <rect x="330" y="90" width="110" height="26" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="460" y="90" width="110" height="26" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">
    <text x="385" y="108">core 1 → 1</text>
    <text x="515" y="108">core 2 → 1</text>
  </g>
  <text x="450" y="138" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">（贡献者：节点 0 的 c1、节点 1 的 c2）</text>

  <!-- right: query box -->
  <g filter="url(#sk)">
    <rect x="300" y="164" width="300" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="450" y="186" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">进入节点 3：t₃ = cnt[core(4)] = cnt[1] = 1</text>
  <text x="450" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans += 1，随后 cnt[1] 变为 2</text>

  <!-- right: enter/exit flow -->
  <g filter="url(#sk)">
    <path d="M 450 232 L 486 258 L 450 284 L 414 258 z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#sk)">栈顶 u</text>
  <g filter="url(#sk)">
    <rect x="316" y="300" width="150" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="486" y="300" width="122" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <path d="M 430 276 L 400 296" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 276 L 534 296" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="437" y="271" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">u ≥ 0 进入</text>
  <text x="522" y="271" font-size="10.5" fill="#b85450" filter="url(#sk)">u &lt; 0 退出</text>
  <g text-anchor="middle" font-size="11.5" fill="#2e5e22" filter="url(#sk)">
    <text x="391" y="322">① ans += cnt[c]</text>
    <text x="391" y="344">② cnt[c] += 1</text>
    <text x="391" y="366">③ 压 ~u 与子节点</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#8f3a34" filter="url(#sk)">
    <text x="547" y="332">cnt[c] −= 1</text>
    <text x="547" y="354">（回溯撤销）</text>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">~u（按位取反，恒为负）作退出标记：子树全部处理完才轮到它弹出</text>
</svg>
