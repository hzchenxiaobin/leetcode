<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">√ 指数收缩：10⁹ 五步归 1</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- shrink chain -->
  <g filter="url(#sk)">
    <rect x="30" y="58" width="72" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="127" y="58" width="72" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="224" y="58" width="72" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="321" y="58" width="72" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="418" y="58" width="72" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="515" y="58" width="72" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="66" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">10⁹</text>
  <text x="163" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">31622</text>
  <text x="260" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">177</text>
  <text x="357" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">13</text>
  <text x="454" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="551" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)">
    <line x1="102" y1="78" x2="125" y2="78" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar3)"/>
    <line x1="199" y1="78" x2="222" y2="78" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar3)"/>
    <line x1="296" y1="78" x2="319" y2="78" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar3)"/>
    <line x1="393" y1="78" x2="416" y2="78" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar3)"/>
    <line x1="490" y1="78" x2="513" y2="78" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar3)"/>
  </g>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#666666">任意 v 经 O(log log v) 次开方稳定到 1；全部 n 堆的「有效削减」总步数约 5n</text>

  <!-- early termination decision -->
  <g filter="url(#sk)">
    <polygon points="320,150 405,188 320,226 235,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">堆顶 v = 1 ？</text>
  <text x="320" y="202" text-anchor="middle" font-size="10" fill="#8a6415">（全局最大为 1 ⇒ 全体为 1）</text>

  <path d="M 233 188 Q 190 188 148 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="190" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 407 188 Q 450 188 492 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>
  <text x="450" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">否</text>

  <g filter="url(#sk)">
    <rect x="30" y="170" width="118" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="492" y="170" width="118" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="89" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">后续每步移走 0</text>
  <text x="89" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">→ break 提前结束</text>
  <text x="551" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">继续弹顶开方</text>
  <text x="551" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">正常削弱循环</text>

  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#666666">本题 k ≤ 10³ 无需优化；k ≫ 5n（如 k = 10⁹）时提前终止把 O(k log n) 降到约 O(n log n · log log max)，是质变</text>

  <!-- precision warning -->
  <g filter="url(#sk)">
    <rect x="40" y="268" width="560" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">⚠ 别盲目相信浮点 sqrt：完全平方数边界可能因舍入差 1</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#b85450">Python：math.isqrt(v) —— 整数开方，精确、零浮点误差，首选</text>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#b85450">C++：s = (int)sqrt((double)v) 估值，再 while ((s+1)*(s+1) &lt;= v) ++s; 上升修正</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#b85450">修正中的平方用 long long：s ≈ 31623 时 (s+1)² ≈ 10⁹ 贴近 32 位上界</text>
</svg>
