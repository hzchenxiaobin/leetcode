<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [10,12,13,14,15]（示例 2）</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="60" width="54" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="167" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">10</text>
  <g filter="url(#sk)"><rect x="200" y="60" width="54" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="227" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">12</text>
  <g filter="url(#sk)"><rect x="260" y="60" width="54" height="36" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="287" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">13</text>
  <g filter="url(#sk)"><rect x="320" y="60" width="54" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="347" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">14</text>
  <g filter="url(#sk)"><rect x="380" y="60" width="54" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="407" y="83" text-anchor="middle" font-size="13" fill="#2b6e9e">15</text>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#7a5415">中位数 m = 13 本身不是回文 → 去回文集合里找「邻居」</text>

  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#666">数轴：蓝色实点 = 数组元素，橙色圈 = 回文数</text>
  <path d="M 70 200 L 575 200" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 220 176 L 220 234" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="220" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">中位数 13</text>

  <circle cx="145" cy="200" r="5" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="195" cy="200" r="5" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="220" cy="200" r="5" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="245" cy="200" r="5" fill="#4a8edb" filter="url(#sk)"/>
  <circle cx="270" cy="200" r="5" fill="#4a8edb" filter="url(#sk)"/>
  <text x="145" y="186" text-anchor="middle" font-size="10.5" fill="#2b6e9e">10</text>
  <text x="195" y="186" text-anchor="middle" font-size="10.5" fill="#2b6e9e">12</text>
  <text x="220" y="238" text-anchor="middle" font-size="10.5" fill="#2b6e9e">13</text>
  <text x="245" y="186" text-anchor="middle" font-size="10.5" fill="#2b6e9e">14</text>
  <text x="270" y="186" text-anchor="middle" font-size="10.5" fill="#2b6e9e">15</text>

  <circle cx="95" cy="200" r="7" fill="#fdfcf7" stroke="#c98a2b" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="120" cy="200" r="7" fill="#fdfcf7" stroke="#c98a2b" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="170" cy="200" r="7" fill="#fdfcf7" stroke="#c98a2b" stroke-width="2.6" filter="url(#sk)"/>
  <circle cx="445" cy="200" r="7" fill="#fdfcf7" stroke="#c98a2b" stroke-width="2.6" filter="url(#sk)"/>
  <text x="95" y="224" text-anchor="middle" font-size="10.5" fill="#7a5415">8</text>
  <text x="120" y="224" text-anchor="middle" font-size="10.5" fill="#7a5415">9</text>
  <text x="170" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">11</text>
  <text x="445" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">22</text>
  <text x="170" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">p−</text>
  <text x="445" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">p+</text>

  <g filter="url(#sk)"><rect x="120" y="272" width="90" height="26" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="165" y="290" text-anchor="middle" font-size="12" fill="#555">目标 p</text>
  <g filter="url(#sk)"><rect x="210" y="272" width="150" height="26" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="285" y="290" text-anchor="middle" font-size="12" fill="#555">代价 f(p) = Σ|aᵢ − p|</text>
  <g filter="url(#sk)"><rect x="360" y="272" width="200" height="26" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="460" y="290" text-anchor="middle" font-size="12" fill="#555">备注</text>

  <g filter="url(#sk)"><rect x="120" y="300" width="90" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="317" text-anchor="middle" font-size="12" fill="#555">8</text>
  <g filter="url(#sk)"><rect x="210" y="300" width="150" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="285" y="317" text-anchor="middle" font-size="12" fill="#555">24</text>
  <g filter="url(#sk)"><rect x="360" y="300" width="200" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="460" y="317" text-anchor="middle" font-size="11" fill="#888">左侧远端</text>

  <g filter="url(#sk)"><rect x="120" y="326" width="90" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="343" text-anchor="middle" font-size="12" fill="#555">9</text>
  <g filter="url(#sk)"><rect x="210" y="326" width="150" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="285" y="343" text-anchor="middle" font-size="12" fill="#555">19</text>
  <g filter="url(#sk)"><rect x="360" y="326" width="200" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="460" y="343" text-anchor="middle" font-size="11" fill="#888">离中位数还是远</text>

  <g filter="url(#sk)"><rect x="120" y="352" width="90" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="165" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">11</text>
  <g filter="url(#sk)"><rect x="210" y="352" width="150" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="285" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">11</text>
  <g filter="url(#sk)"><rect x="360" y="352" width="200" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="460" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">★ 最优（= p−）</text>

  <g filter="url(#sk)"><rect x="120" y="380" width="90" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="165" y="397" text-anchor="middle" font-size="12" fill="#555">22</text>
  <g filter="url(#sk)"><rect x="210" y="380" width="150" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="285" y="397" text-anchor="middle" font-size="12" fill="#555">46</text>
  <g filter="url(#sk)"><rect x="360" y="380" width="200" height="24" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/></g>
  <text x="460" y="397" text-anchor="middle" font-size="11" fill="#888">= p+，更远更贵</text>

  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#666">算法实际枚举了全部 ~1.2×10⁵ 个回文；由凸性，离中位数更远的代价只会更大</text>

  <g filter="url(#sk)"><rect x="90" y="436" width="460" height="28" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="455" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">答案 = 11：10+1、12−1、13−2、14−3、15−4，全部变成 11</text>
</svg>
