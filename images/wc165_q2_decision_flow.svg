<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三条判定 → 唯一方案</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">可行当且仅当 2C ≤ T ≤ 4C 且 T 为偶数</text>

  <text x="200" y="74" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">判定条件</text>
  <text x="446" y="74" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">不满足时</text>

  <g filter="url(#rough2)">
    <rect x="60" y="84" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="74" y="108" font-size="11" fill="#3a4a66">① T 为偶数（否则 x 非整数）</text>
    <rect x="372" y="84" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="446" y="108" text-anchor="middle" font-size="11" fill="#8a3a36">返回 []</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="130" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="74" y="154" font-size="11" fill="#3a4a66">② T ≥ 2C（保证 x ≥ 0）</text>
    <rect x="372" y="130" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="446" y="154" text-anchor="middle" font-size="11" fill="#8a3a36">返回 []</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="176" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="74" y="200" font-size="11" fill="#3a4a66">③ T ≤ 4C（保证 y ≥ 0）</text>
    <rect x="372" y="176" width="148" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="446" y="200" text-anchor="middle" font-size="11" fill="#8a3a36">返回 []</text>
  </g>

  <text x="200" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">三条全部满足 ↓</text>

  <path d="M 200 236 L 200 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 342 256 L 366 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="254" width="280" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="200" y="278" text-anchor="middle" font-size="12" fill="#2f4a28" font-weight="bold">x = (T − 2C) / 2　　y = C − x</text>
    <text x="200" y="300" text-anchor="middle" font-size="10" fill="#555">两个数都是非负整数</text>
    <rect x="370" y="254" width="150" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="445" y="280" text-anchor="middle" font-size="11" fill="#3a4a66">输出</text>
    <text x="445" y="300" text-anchor="middle" font-size="13" fill="#2f3f5a" font-weight="bold">[x, y]</text>
  </g>

  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4x + 2y − 2(x + y) = 2x = T − 2C：两式相减消去 y</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">系数行列式 4·1 − 2·1 = 2 ≠ 0 ⇒ 解唯一，无需比较多个方案</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">特例：T = C = 0 时三条全过，返回 [0, 0] 而非 []</text>
</svg>
