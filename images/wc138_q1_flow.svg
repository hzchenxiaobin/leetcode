<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：O(n log n) 排序 → O(n) 比对</text>
  <rect x="160" y="66" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="172" y="92" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">输入 heights（长度 n）</text>
  <path d="M 260 110 L 260 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="134" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="152" y="155.5" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">expected = sorted(heights)</text>
  <text x="152" y="172.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">另一份数组，不改动原数组</text>
  <path d="M 260 186 L 260 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="210" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="132" y="238" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">逐位比较：heights[i] != expected[i] 则 ans++</text>
  <path d="M 260 258 L 260 278" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="278" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="212" y="300" font-size="11" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">返回 ans</text>
</svg>
