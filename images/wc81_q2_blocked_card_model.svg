<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">封锁判定：两面同数的卡片</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">fronts = [1, 2, 4, 4, 7]　　backs = [1, 3, 4, 1, 3]</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666">
    <text x="108" y="70">卡 0</text>
    <text x="224" y="70">卡 1</text>
    <text x="340" y="70">卡 2</text>
    <text x="456" y="70">卡 3</text>
    <text x="572" y="70">卡 4</text>
  </g>

  <!-- 卡 0：1/1 封锁 -->
  <rect x="60" y="78" width="96" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7" filter="url(#rough2)"/>
  <line x1="66" y1="126" x2="150" y2="126" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="108" y="110" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="108" y="160" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="68" y="96" font-size="9" fill="#b85450" filter="url(#rough2)">正</text>
  <text x="68" y="146" font-size="9" fill="#b85450" filter="url(#rough2)">背</text>

  <!-- 卡 1：2/3 -->
  <rect x="176" y="78" width="96" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <line x1="182" y1="126" x2="266" y2="126" stroke="#7a93b8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="224" y="110" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="224" y="160" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="184" y="96" font-size="9" fill="#7a93b8" filter="url(#rough2)">正</text>
  <text x="184" y="146" font-size="9" fill="#7a93b8" filter="url(#rough2)">背</text>

  <!-- 卡 2：4/4 封锁 -->
  <rect x="292" y="78" width="96" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7" filter="url(#rough2)"/>
  <line x1="298" y1="126" x2="382" y2="126" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="340" y="110" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="340" y="160" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="300" y="96" font-size="9" fill="#b85450" filter="url(#rough2)">正</text>
  <text x="300" y="146" font-size="9" fill="#b85450" filter="url(#rough2)">背</text>

  <!-- 卡 3：4/1 -->
  <rect x="408" y="78" width="96" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <line x1="414" y1="126" x2="498" y2="126" stroke="#7a93b8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="456" y="110" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="456" y="160" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="416" y="96" font-size="9" fill="#7a93b8" filter="url(#rough2)">正</text>
  <text x="416" y="146" font-size="9" fill="#7a93b8" filter="url(#rough2)">背</text>

  <!-- 卡 4：7/3 -->
  <rect x="524" y="78" width="96" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <line x1="530" y1="126" x2="614" y2="126" stroke="#7a93b8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="572" y="110" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="572" y="160" text-anchor="middle" font-size="17" fill="#33507a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="532" y="96" font-size="9" fill="#7a93b8" filter="url(#rough2)">正</text>
  <text x="532" y="146" font-size="9" fill="#7a93b8" filter="url(#rough2)">背</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="108" y="196" fill="#b85450">封锁：两面都是 1</text>
    <text x="224" y="196" fill="#4a7a3a">可用</text>
    <text x="340" y="196" fill="#b85450">封锁：两面都是 4</text>
    <text x="456" y="196" fill="#4a7a3a">可用</text>
    <text x="572" y="196" fill="#4a7a3a">可用</text>
  </g>

  <rect x="40" y="212" width="560" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="234" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">封锁集合 S = {1, 4}</text>
  <text x="58" y="254" font-size="10" fill="#555" filter="url(#rough2)">卡片 0、卡片 2 正反同数：无论怎么翻，这两个数总有一面朝上，永远当不成「背面」。</text>

  <rect x="40" y="280" width="560" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="302" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x 能成为好数字　⟺　x 在某个面上出现过　且　x ∉ S</text>
  <text x="58" y="318" font-size="10" fill="#555" filter="url(#rough2)">本例候选值 {2, 3, 7}，取最小值 2；若候选为空则返回 0。</text>

  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min{2, 3, 7} = 2</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「两面同数」是一票否决：它把 x 锁死在朝上的那一面，翻转只能交换同一张卡的两面</text>
</svg>
