<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例 1：绕道 0.25 &gt; 直达 0.2，大根堆先弹出更优者</text>

  <!-- graph edges -->
  <g filter="url(#r)">
    <line x1="132" y1="142" x2="296" y2="108" stroke="#4a7a3a" stroke-width="2.5"/>
    <line x1="344" y1="108" x2="508" y2="142" stroke="#4a7a3a" stroke-width="2.5"/>
    <path d="M 132 158 Q 320 200 508 158" stroke="#999" stroke-width="1.8" fill="none" stroke-dasharray="6 5"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle">
    <text x="198" y="116" fill="#2e6e2e" filter="url(#r)">×0.5</text>
    <text x="432" y="116" fill="#2e6e2e" filter="url(#r)">×0.5</text>
    <text x="320" y="194" fill="#888" filter="url(#r)">×0.2</text>
  </g>

  <!-- nodes -->
  <g filter="url(#r)">
    <circle cx="110" cy="150" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="320" cy="100" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="530" cy="150" r="25" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="110" y="156" fill="#33517a" filter="url(#r)">0</text>
    <text x="320" y="106" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="530" y="156" fill="#8a6d1a" filter="url(#r)">2</text>
  </g>
  <g font-size="10.5" fill="#999" text-anchor="middle">
    <text x="110" y="192" filter="url(#r)">start</text>
    <text x="530" y="192" filter="url(#r)">end</text>
  </g>

  <!-- annotations -->
  <text x="320" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最优路径 0→1→2：0.5 × 0.5 = 0.25 ✓</text>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#r)">直达 0.2 &lt; 绕道 0.25 ✗</text>

  <!-- walkthrough table -->
  <g filter="url(#r)">
    <rect x="40" y="246" width="560" height="34" fill="#e8f0fe"/>
    <rect x="40" y="382" width="560" height="34" fill="#e6f4ea"/>
    <rect x="40" y="246" width="560" height="170" fill="none" stroke="#446688" stroke-width="1.8"/>
    <line x1="40" y1="280" x2="600" y2="280" stroke="#446688" stroke-width="1.4"/>
    <line x1="40" y1="314" x2="600" y2="314" stroke="#446688" stroke-width="1.2"/>
    <line x1="40" y1="348" x2="600" y2="348" stroke="#446688" stroke-width="1.2"/>
    <line x1="40" y1="382" x2="600" y2="382" stroke="#446688" stroke-width="1.2"/>
    <line x1="100" y1="246" x2="100" y2="416" stroke="#446688" stroke-width="1.2"/>
    <line x1="240" y1="246" x2="240" y2="416" stroke="#446688" stroke-width="1.2"/>
    <line x1="430" y1="246" x2="430" y2="416" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="70" y="267" filter="url(#r)">步骤</text>
    <text x="170" y="267" filter="url(#r)">弹出 (p, u)</text>
    <text x="335" y="267" filter="url(#r)">prob（0 / 1 / 2）</text>
    <text x="515" y="267" filter="url(#r)">堆（处理后）</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="301" filter="url(#r)">初始</text>
    <text x="170" y="301" filter="url(#r)">—</text>
    <text x="335" y="301" filter="url(#r)">[1, 0, 0]</text>
    <text x="515" y="301" filter="url(#r)">(1.0, 0)</text>

    <text x="70" y="335" filter="url(#r)">1</text>
    <text x="170" y="335" filter="url(#r)">(1.0, 0)</text>
    <text x="335" y="335" filter="url(#r)">[1, 0.5, 0.2]</text>
    <text x="515" y="335" filter="url(#r)">(0.5, 1), (0.2, 2)</text>

    <text x="70" y="369" filter="url(#r)">2</text>
    <text x="170" y="369" filter="url(#r)">(0.5, 1)</text>
    <text x="308" y="369" filter="url(#r)">[1, 0.5, </text>
    <text x="390" y="369" font-weight="bold" fill="#b85450" filter="url(#r)">0.25</text>
    <text x="415" y="369" filter="url(#r)">]</text>
    <text x="515" y="369" filter="url(#r)">(0.25, 2), (0.2, 2)</text>

    <text x="70" y="403" font-weight="bold" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="170" y="403" font-weight="bold" fill="#2e6e2e" filter="url(#r)">(0.25, 2)</text>
    <text x="335" y="403" font-weight="bold" fill="#2e6e2e" filter="url(#r)">u = end → 返回 0.25</text>
    <text x="515" y="403" filter="url(#r)">—</text>
  </g>
  <text x="320" y="446" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#r)">第 2 步：绕道 0.25 覆盖直达 0.2；第 3 步弹出 end 即答案，旧记录 (0.2, 2) 留在堆中不处理</text>
</svg>
