<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">容斥四项的对称结构（n = 10⁶, limit = 10⁶）</text>

  <!-- 三个对称孩子 -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="110" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="280" cy="110" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="420" cy="110" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#b85450" filter="url(#rough2)">
    <text x="140" y="114" text-anchor="middle">A₁</text>
    <text x="280" y="114" text-anchor="middle">A₂</text>
    <text x="420" y="114" text-anchor="middle">A₃</text>
  </g>
  <text x="280" y="162" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">三个「某人超限」事件完全对称 → 只需各算一次 ×3</text>

  <!-- 预发示意 -->
  <rect x="60" y="184" width="440" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">预发变换：x_k 先拿 (limit+1) 颗</text>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">剩余 n − s·(limit+1) 颗做隔板法 → C(n−s·(limit+1)+2, 2)</text>

  <!-- 退化情形 -->
  <rect x="60" y="256" width="440" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">n ≤ limit 时：超限事件全不可能</text>
  <text x="280" y="300" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">ans 退化为 C(n+2,2) = 500001500001 ✓</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（负下标组合数自动截断为 0，无需特判）</text>
</svg>
