<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：排序后贪心分段</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: example 1 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="820" height="250" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="84" y="90" font-size="14" font-weight="bold" fill="#2b2b2b">示例 1：nums = [3,6,1,2,5]，k = 2</text>
  <text x="84" y="120" font-size="13" fill="#444">排序后：</text>
  <g filter="url(#sk)">
    <rect x="170" y="96" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="224" y="96" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="278" y="96" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="332" y="96" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="386" y="96" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="193" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">1</text>
  <text x="247" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">2</text>
  <text x="301" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">3</text>
  <text x="355" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">5</text>
  <text x="409" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">6</text>
  <path d="M 328 88 L 328 138" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="84" y="172" font-size="12" fill="#2b6e9e">组1：anchor = 1，上界 = 1+2 = 3 → 吞并 1、2、3（5 − 1 = 4 &gt; 2 ✗ 切割）</text>
  <text x="84" y="202" font-size="12" fill="#2e6e2e">组2：anchor = 5，上界 = 5+2 = 7 → 吞并 5、6（扫描结束）</text>
  <text x="84" y="234" font-size="13" font-weight="bold" fill="#2b2b2b">答案 = 2 ✓　对应划分 [3,1,2] 与 [6,5]，两组 max−min 均不超过 2</text>
  <text x="84" y="284" font-size="10" fill="#888">count 变化：开组1 → 1，开组2 → 2</text>

  <!-- ===== Panel B: example 3 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="330" width="820" height="250" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="84" y="362" font-size="14" font-weight="bold" fill="#2b2b2b">示例 3：nums = [2,2,4,5]，k = 0</text>
  <text x="84" y="392" font-size="13" fill="#444">排序后：</text>
  <g filter="url(#sk)">
    <rect x="170" y="368" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="224" y="368" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="278" y="368" width="46" height="34" rx="4" fill="#fef6e6" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="332" y="368" width="46" height="34" rx="4" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.8"/>
  </g>
  <text x="193" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">2</text>
  <text x="247" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">2</text>
  <text x="301" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4</text>
  <text x="355" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">5</text>
  <path d="M 274 360 L 274 410" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <path d="M 328 360 L 328 410" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="84" y="444" font-size="12" fill="#2b6e9e">组1：anchor = 2，上界 = 2+0 = 2 → 吞并 2、2（4 − 2 = 2 &gt; 0 ✗ 切割）</text>
  <text x="84" y="474" font-size="12" fill="#7a5415">组2：anchor = 4，上界 = 4 → 吞并 4（5 − 4 = 1 &gt; 0 ✗ 切割）</text>
  <text x="84" y="504" font-size="12" fill="#5a3a7a">组3：anchor = 5 → 吞并 5（扫描结束）</text>
  <text x="84" y="536" font-size="13" font-weight="bold" fill="#2b2b2b">答案 = 3 ✓　k = 0 时只有相等的元素才能同组</text>

  <text x="470" y="620" text-anchor="middle" font-size="12" fill="#888">两个示例都验证：排序 → 贪心切分，一次线性扫描即得答案</text>
</svg>
