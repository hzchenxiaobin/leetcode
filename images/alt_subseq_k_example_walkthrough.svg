<svg xmlns="http://www.w3.org/2000/svg" width="920" height="830" viewBox="0 0 920 830" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="920" height="830" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 5, 4, 2, 4]，k = 1</text>
  <path d="M 320 42 Q 460 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部数组 -->
  <g filter="url(#sk)" font-size="16" text-anchor="middle">
    <rect x="240" y="56" width="56" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="310" y="56" width="56" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="380" y="56" width="56" height="42" rx="4" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="450" y="56" width="56" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="520" y="56" width="56" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <text x="268" y="83">3</text><text x="338" y="83">5</text><text x="408" y="83" fill="#9a9a9a">4</text>
    <text x="478" y="83">2</text><text x="548" y="83">4</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="268" y="118">下标 0</text><text x="338" y="118">下标 1</text><text x="408" y="118">下标 2</text>
    <text x="478" y="118">下标 3</text><text x="548" y="118">下标 4</text>
  </g>
  <text x="640" y="82" font-size="12" fill="#7a7a7a" filter="url(#sk)">（虚线格 = 最优解未选中）</text>

  <!-- 演算表 -->
  <g filter="url(#sk)">
    <rect x="60" y="140" width="810" height="34" rx="4" fill="#f0ede4" stroke="#b9b29a" stroke-width="1.3"/>
    <rect x="60" y="174" width="810" height="54" fill="#ffffff" stroke="#d8d2c0" stroke-width="1"/>
    <rect x="60" y="228" width="810" height="54" fill="#faf9f4" stroke="#d8d2c0" stroke-width="1"/>
    <rect x="60" y="282" width="810" height="54" fill="#ffffff" stroke="#d8d2c0" stroke-width="1"/>
    <rect x="60" y="336" width="810" height="54" fill="#faf9f4" stroke="#d8d2c0" stroke-width="1"/>
    <rect x="60" y="390" width="810" height="54" fill="#ffffff" stroke="#d8d2c0" stroke-width="1"/>
    <rect x="310" y="390" width="230" height="54" fill="#dbeafe" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="740" y="390" width="130" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#6b6350" text-anchor="middle" filter="url(#sk)">
    <text x="90" y="162">j</text>
    <text x="215" y="162">先插入 i = j−k</text>
    <text x="425" y="162">U[j]（末步升 / 单元素）</text>
    <text x="640" y="162">D[j]（末步降 / 单元素）</text>
    <text x="805" y="162">ans</text>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#sk)">
    <text x="90" y="205" font-weight="bold">0</text>
    <text x="215" y="205">—（树为空）</text>
    <text x="425" y="205">3 + 0 = 3（单元素）</text>
    <text x="640" y="205">3 + 0 = 3（单元素）</text>
    <text x="805" y="205">3</text>

    <text x="90" y="259" font-weight="bold">1</text>
    <text x="215" y="259">入 0：值3 → U=3, D=3</text>
    <text x="425" y="259">5 + max{D: 值&lt;5} = 5+3 = 8</text>
    <text x="640" y="259">5 + max{U: 值&gt;5} = 5+0 = 5</text>
    <text x="805" y="259">8</text>

    <text x="90" y="313" font-weight="bold">2</text>
    <text x="215" y="313">入 1：值5 → U=8, D=5</text>
    <text x="425" y="313">4 + max{D: 值&lt;4} = 4+3 = 7</text>
    <text x="640" y="313">4 + max{U: 值&gt;4} = 4+8 = 12</text>
    <text x="805" y="313" font-weight="bold">12</text>

    <text x="90" y="367" font-weight="bold">3</text>
    <text x="215" y="367">入 2：值4 → U=7, D=12</text>
    <text x="425" y="367">2 + max{D: 值&lt;2} = 2+0 = 2</text>
    <text x="640" y="367">2 + max{U: 值&gt;2} = 2+8 = 10</text>
    <text x="805" y="367">12</text>

    <text x="90" y="421" font-weight="bold">4</text>
    <text x="215" y="421">入 3：值2 → U=2, D=10</text>
    <text x="425" y="421" font-weight="bold" fill="#2a5a92">4 + max{D: 值&lt;4} = 4+max(3,10) = 14</text>
    <text x="640" y="421">4 + max{U: 值&gt;4} = 4+8 = 12</text>
    <text x="805" y="421" font-weight="bold" fill="#b85450">14 ✓</text>
  </g>

  <!-- j=4 时刻的树叶子状态 -->
  <text x="60" y="484" font-size="13" font-weight="bold" fill="#444">j = 4 入树后，两棵树的叶子状态（值域 1..5）：</text>
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <rect x="120" y="498" width="130" height="52" rx="6" fill="#f4f6f8" stroke="#b0bcc8" stroke-width="1.4"/>
    <rect x="270" y="498" width="130" height="52" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="420" y="498" width="130" height="52" rx="6" fill="#f4f6f8" stroke="#b0bcc8" stroke-width="1.4"/>
    <rect x="570" y="498" width="130" height="52" rx="6" fill="#f4f6f8" stroke="#b0bcc8" stroke-width="1.4"/>
    <rect x="720" y="498" width="130" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="185" y="516" fill="#888" font-size="11">值1</text>
    <text x="185" y="536">U — ｜ D —</text>
    <text x="335" y="516" fill="#8a6a2b" font-size="11">值2</text>
    <text x="335" y="536" font-weight="bold">U 2 ｜ D 10</text>
    <text x="485" y="516" fill="#888" font-size="11">值3</text>
    <text x="485" y="536">U 3 ｜ D 3</text>
    <text x="635" y="516" fill="#888" font-size="11">值4</text>
    <text x="635" y="536">U 7 ｜ D 12</text>
    <text x="785" y="516" fill="#2e6e2e" font-size="11">值5</text>
    <text x="785" y="536" font-weight="bold">U 8 ｜ D 5</text>
  </g>
  <path d="M 335 556 Q 380 574 425 572" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="460" y="578" font-size="12" font-weight="bold" fill="#c98a2b" filter="url(#sk)">U[4] 查前缀[1,3] → 取值2 的 D=10（即子序列 [3,5,2]）→ 4+10 = 14 ✓</text>
  <path d="M 785 556 Q 820 574 850 570" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="460" y="598" font-size="12" fill="#4a7a3a" filter="url(#sk)">D[4] 查后缀[5,5] → 取值5 的 U=8（即 [3,5]）→ 4+8 = 12</text>

  <!-- 最优子序列锯齿 -->
  <ellipse cx="470" cy="696" rx="12" ry="12" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="470" y="701" text-anchor="middle" font-size="12" fill="#9e9e9e" filter="url(#sk)">4</text>
  <path d="M 262 706 Q 360 676 348 684" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 372 684 Q 470 732 568 724" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 592 724 Q 640 700 678 698" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)" font-size="13" text-anchor="middle">
    <ellipse cx="250" cy="712" rx="12" ry="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <ellipse cx="360" cy="680" rx="12" ry="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <ellipse cx="580" cy="728" rx="12" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <ellipse cx="690" cy="696" rx="12" ry="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <text x="250" y="717" font-weight="bold" fill="#7a5416">3</text>
    <text x="360" y="685" font-weight="bold" fill="#2a5a92">5</text>
    <text x="580" y="733" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="690" y="701" font-weight="bold" fill="#2a5a92">4</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="250" y="756">下标 0</text><text x="360" y="662">下标 1</text><text x="470" y="672">下标 2</text>
    <text x="580" y="756">下标 3</text><text x="690" y="672">下标 4</text>
  </g>
  <text x="460" y="800" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">最优子序列 [3, 5, 2, 4]（下标 0, 1, 3, 4）→ ans = 3 + 5 + 2 + 4 = 14 ✓</text>
</svg>
