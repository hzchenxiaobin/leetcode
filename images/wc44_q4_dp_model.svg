<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="'Comic Sans MS','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#fafafa"/>

  <text x="450" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反向 DP 模型：dp[i] = 从 i 走到 N 的最小花费（含 coins[i]）</text>
  <path d="M 190 46 Q 450 54 712 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="450" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">例：coins = [1,2,4,-1,2]（1-based），maxJump = B = 2；只能向右跳，图是 DAG</text>

  <!-- 下标标签 -->
  <text x="112" y="104" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">下标</text>
  <text x="192" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="312" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="432" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="552" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="672" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>

  <!-- 窗口高亮：i=1 时 j ∈ {2,3} -->
  <rect x="252" y="110" width="240" height="72" rx="8" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 硬币格 -->
  <g filter="url(#rough2)">
    <rect x="140" y="114" width="104" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="260" y="114" width="104" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="380" y="114" width="104" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="500" y="114" width="104" height="64" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="620" y="114" width="104" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="192" y="156" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">1</text>
  <text x="312" y="156" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">2</text>
  <text x="432" y="156" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">4</text>
  <text x="552" y="156" text-anchor="middle" font-size="22" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="672" y="156" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">2</text>

  <text x="372" y="200" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">窗口 i+1 … i+B：共 B = 2 个候选</text>
  <text x="552" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">不可落脚，但可一步跨过</text>

  <!-- dp 行 -->
  <text x="112" y="287" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">dp 值</text>
  <g filter="url(#rough2)">
    <rect x="140" y="252" width="104" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="260" y="252" width="104" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="380" y="252" width="104" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="500" y="252" width="104" height="56" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="620" y="252" width="104" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="192" y="288" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">7</text>
  <text x="312" y="288" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <text x="432" y="288" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <text x="552" y="288" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">∞</text>
  <text x="672" y="288" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>

  <!-- 窗口左下角 → dp[1]（避开说明文字） -->
  <path d="M 260 184 C 244 220 214 228 199 246" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="262" y="217" font-size="10" fill="#a07820" filter="url(#rough2)">取窗口最小</text>

  <!-- 公式框 -->
  <rect x="118" y="316" width="664" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="356" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#8a5a10" filter="url(#rough2)">dp[i] = coins[i] + min { dp[j] : i &lt; j ≤ min(N, i+B) }</text>
  <text x="450" y="386" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">coins[i] = −1（不可落脚）或窗口内全为 +∞  ⇒  dp[i] = +∞</text>
  <text x="450" y="408" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">转移只依赖右侧，故从右往左算一遍即可</text>

  <text x="450" y="452" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">绿色 = 已求得的最小花费；红色 = 不可落脚；答案即 dp[1] = 7</text>
</svg>
