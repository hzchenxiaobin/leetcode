<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="36" y="30" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [5,4,0,3,1,6,2]，三环长度 4 / 2 / 1</text>
  <text x="36" y="50" font-size="10" fill="#888" filter="url(#rough2)">格子上方是下标 i，格内是 nums[i]；每个起点只会把所在环数一遍</text>

  <!-- 数组 -->
  <g filter="url(#rough2)" fill="#555" font-size="9.5">
    <text x="70" y="80" text-anchor="middle">0</text>
    <text x="144" y="80" text-anchor="middle">1</text>
    <text x="218" y="80" text-anchor="middle">2</text>
    <text x="292" y="80" text-anchor="middle">3</text>
    <text x="366" y="80" text-anchor="middle">4</text>
    <text x="440" y="80" text-anchor="middle">5</text>
    <text x="514" y="80" text-anchor="middle">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="38" y="88" width="64" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="112" y="88" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="186" y="88" width="64" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="260" y="88" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="334" y="88" width="64" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="408" y="88" width="64" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="482" y="88" width="64" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="17" font-weight="bold" fill="#2b2b2b">
    <text x="70" y="118" text-anchor="middle">5</text>
    <text x="144" y="118" text-anchor="middle">4</text>
    <text x="218" y="118" text-anchor="middle">0</text>
    <text x="292" y="118" text-anchor="middle">3</text>
    <text x="366" y="118" text-anchor="middle">1</text>
    <text x="440" y="118" text-anchor="middle">6</text>
    <text x="514" y="118" text-anchor="middle">2</text>
  </g>

  <!-- 图例 -->
  <rect x="38" y="148" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="160" font-size="9.6" fill="#2f5a24" filter="url(#rough2)">环 ①：{0,5,6,2}，长度 4</text>
  <rect x="238" y="148" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="160" font-size="9.6" fill="#2b4f6e" filter="url(#rough2)">环 ②：{1,4}，长度 2</text>
  <rect x="428" y="148" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="160" font-size="9.6" fill="#8a6410" filter="url(#rough2)">环 ③：{3}，长度 1</text>

  <!-- 表头 -->
  <line x1="52" y1="186" x2="690" y2="186" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" font-weight="bold" fill="#555">
    <text x="58" y="182">起点 i</text>
    <text x="140" y="182">行走轨迹（i → nums[i] → …）</text>
    <text x="470" y="182">cnt</text>
    <text x="540" y="182">best</text>
  </g>

  <g filter="url(#rough2)" font-size="10.4" fill="#333">
    <text x="58" y="212">0</text>
    <text x="140" y="212">0 → 5 → 6 → 2 →（回到 0）</text>
    <text x="470" y="212">4</text>
    <text x="540" y="212">4</text>

    <text x="58" y="246">1</text>
    <text x="140" y="246">1 → 4 →（回到 1）</text>
    <text x="470" y="246">2</text>
    <text x="540" y="246">4</text>

    <text x="58" y="280">2</text>
    <text x="140" y="280" fill="#999">nums[2] 已被标记，跳过</text>
    <text x="470" y="280" fill="#999">—</text>
    <text x="540" y="280">4</text>

    <text x="58" y="314">3</text>
    <text x="140" y="314">3 →（自环，nums[3] = 3）</text>
    <text x="470" y="314">1</text>
    <text x="540" y="314">4</text>

    <text x="58" y="348" fill="#999">4, 5, 6</text>
    <text x="140" y="348" fill="#999">全在环 ①② 里，跳过</text>
    <text x="470" y="348" fill="#999">—</text>
    <text x="540" y="348">4</text>
  </g>
  <line x1="52" y1="366" x2="690" y2="366" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9.8" fill="#666">
    <text x="52" y="390">· 答案 = 4，与官方示例输出一致；4 + 2 + 1 = 7 = n，每个下标恰好被计入一次</text>
    <text x="52" y="410">· cnt 只在新环的起点处累加：跳进已标记的格子，说明这个环本轮已走完</text>
  </g>
</svg>
