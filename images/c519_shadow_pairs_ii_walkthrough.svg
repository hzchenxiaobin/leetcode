<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例：nums = [3, 1, 4, 2, 5]，mid = 2（值 4 与 2 之间）</text>

  <!-- array boxes -->
  <g filter="url(#rough2)">
    <rect x="60"  y="44" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="124" y="44" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="188" y="44" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="252" y="44" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="316" y="44" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="11" fill="#666" filter="url(#rough2)">
    <text x="88"  y="40" text-anchor="middle">0</text>
    <text x="152" y="40" text-anchor="middle">1</text>
    <text x="216" y="40" text-anchor="middle">2</text>
    <text x="280" y="40" text-anchor="middle">3</text>
    <text x="344" y="40" text-anchor="middle">4</text>
  </g>
  <g font-size="16" fill="#333" filter="url(#rough2)">
    <text x="88"  y="69" text-anchor="middle">3</text>
    <text x="152" y="69" text-anchor="middle">1</text>
    <text x="216" y="69" text-anchor="middle">4</text>
    <text x="280" y="69" text-anchor="middle">2</text>
    <text x="344" y="69" text-anchor="middle">5</text>
  </g>

  <line x1="244" y1="44" x2="244" y2="84" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="244" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">mid</text>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">左半</text>
  <text x="330" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右半</text>

  <!-- b and c tables -->
  <rect x="48" y="118" width="216" height="120" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="138" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">左端点 i → b[i]</text>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="70"  y="162">i=0: 3 → 4</text>
    <text x="70"  y="182">i=1: 1 → 4</text>
    <text x="70"  y="202">i=2: 4 → +∞</text>
    <text x="70"  y="224" font-size="11" fill="#666">(i 之后左半内 &gt; nums[i] 的最小值)</text>
  </g>

  <rect x="296" y="118" width="216" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">右端点 j → c[j]</text>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="318" y="162">j=3: 2 → −∞</text>
    <text x="318" y="182">j=4: 5 → 2</text>
    <text x="318" y="202" font-size="11" fill="#666">(j 之前右半内 &lt; nums[j] 的最大值)</text>
  </g>

  <!-- counting -->
  <text x="280" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">右端点按 y 降序：先 (5, c=2)，后 (2, c=−∞)</text>

  <rect x="48" y="276" width="228" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="162" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y=5, c=2</text>
  <text x="70" y="316" font-size="11" fill="#333" filter="url(#rough2)">加 b[i]≥5：仅 i=2(x=4)</text>
  <text x="70" y="334" font-size="11" fill="#333" filter="url(#rough2)">数 x∈[2,5)：x=4 ✓ → +1</text>
  <text x="70" y="352" font-size="11" fill="#666" filter="url(#rough2)">(2,4) 是影子对</text>

  <rect x="296" y="276" width="216" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y=2, c=−∞</text>
  <text x="318" y="316" font-size="11" fill="#333" filter="url(#rough2)">加 b[i]≥2：i=0,1 (x=3,1)</text>
  <text x="318" y="334" font-size="11" fill="#333" filter="url(#rough2)">数 x∈(−∞,2)：x=1 ✓ → +1</text>
  <text x="318" y="352" font-size="11" fill="#666" filter="url(#rough2)">(1,3) 是影子对</text>

  <!-- total -->
  <rect x="140" y="384" width="280" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">跨 mid = 2，半内 = 2 + 1，总计 5</text>
</svg>
