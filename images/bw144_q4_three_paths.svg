<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三条路径被锁在三个区域：对角线 / 上三角 / 下三角</text>

  <!-- 网格 4x4，格子 54，起点 (130, 52) -->
  <!-- 行 0 -->
  <g filter="url(#rough2)">
    <rect x="130" y="52" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="184" y="52" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="238" y="52" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="292" y="52" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>

    <rect x="130" y="106" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="184" y="106" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="238" y="106" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="292" y="106" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>

    <rect x="130" y="160" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="184" y="160" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="238" y="160" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="292" y="160" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>

    <rect x="130" y="214" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
    <rect x="184" y="214" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="238" y="214" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="292" y="214" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>

  <!-- 坐标 -->
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="157" y="46">(0,0)</text>
    <text x="319" y="46">(0,3)</text>
    <text x="319" y="288">(3,3)</text>
    <text x="157" y="288">(3,0)</text>
  </g>

  <!-- 对角线箭头 -->
  <g stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 160 82 L 208 130" marker-end="url(#arr)"/>
    <path d="M 214 136 L 262 184" marker-end="url(#arr)"/>
    <path d="M 268 190 L 316 238" marker-end="url(#arr)"/>
  </g>

  <!-- 右侧图例 -->
  <rect x="366" y="60" width="168" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="78" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对角格：第一位</text>
  <text x="450" y="94" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">路径唯一，已收走</text>

  <rect x="366" y="112" width="168" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">上三角 j &gt; i：第二位</text>
  <text x="450" y="146" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">j − i 单调不增 ⇒ j ≥ i</text>

  <rect x="366" y="164" width="168" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">下三角 i &gt; j：第三位</text>
  <text x="450" y="198" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">i − j 单调不增 ⇒ i ≥ j</text>

  <rect x="366" y="216" width="168" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">交集只在主对角线</text>
  <text x="450" y="254" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">而它已被第一位收走</text>

  <rect x="66" y="300" width="428" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = 对角线和 + 上三角最优 + 下三角最优（三块互不相交）</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">第一位的路径：i+j 每步最多 +2，n−1 步要涨 2(n−1) ⇒ 只能全走 (i+1,j+1)</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">因此两位小朋友的贡献可以分别用 DP 求最大，再相加</text>
</svg>
