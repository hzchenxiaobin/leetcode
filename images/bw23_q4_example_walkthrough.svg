<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：[-1,-8,0,5,-7] 降序扫描</text>

  <!-- 降序序列 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="46"  y="50" width="82" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="134" y="50" width="82" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="222" y="50" width="82" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="310" y="50" width="82" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="398" y="50" width="82" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="14" filter="url(#rough2)">
    <text x="87" y="75">5</text><text x="175" y="75">0</text><text x="263" y="75">−1</text>
    <text x="351" y="75">−7</text><text x="439" y="75">−8</text>
  </g>
  <text x="488" y="75" font-size="11.5" fill="#888" filter="url(#rough2)">降序</text>

  <!-- 表格：前缀和与 F(v) -->
  <g filter="url(#rough2)">
    <rect x="30" y="112" width="500" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="148" width="500" height="36" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="184" width="500" height="36" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="220" width="500" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="30" y="256" width="500" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <line x1="150" y1="112" x2="150" y2="292" stroke="#446688" stroke-width="1"/>
    <line x1="330" y1="112" x2="330" y2="292" stroke="#446688" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="90" y="134">步 v</text><text x="240" y="134">g</text><text x="430" y="134">前缀和 G</text>
    <text x="90" y="170">1</text><text x="240" y="170">+5</text><text x="430" y="170" fill="#4a7a3a">5 ✓</text>
    <text x="90" y="206">2</text><text x="240" y="206">+0</text><text x="430" y="206" fill="#4a7a3a">5 ✓</text>
    <text x="90" y="242">3</text><text x="240" y="242">+(−1)</text><text x="430" y="242" fill="#4a7a3a">4 ✓</text>
    <text x="90" y="278">4</text><text x="240" y="278">+(−7)</text><text x="430" y="278" fill="#b85450">−3 ✗ 停止</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="90" y="304" width="380" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="325" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans = 5 + 5 + 4 = 14（做 {−1, 0, 5}，升序 −1→0→5）</text>
</svg>
