<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3：a=[2,4,3]，b=[1,6,7]，s=[3,10,10]</text>

  <!-- 石子 -->
  <g filter="url(#rough2)">
    <ellipse cx="130" cy="90" rx="52" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="280" cy="90" rx="52" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="430" cy="90" rx="52" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="130" y="86">石子 0</text><text x="130" y="100">a=2 b=1</text>
    <text x="280" y="86">石子 1</text><text x="280" y="100">a=4 b=6</text>
    <text x="430" y="86">石子 2</text><text x="430" y="100">a=3 b=7</text>
  </g>

  <!-- 排序箭头 -->
  <path d="M 130 122 C 180 150, 230 160, 262 170" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 122 L 280 166" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 122 C 380 150, 330 160, 298 170" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="150" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">按 s 降序：s=10, 10, 3</text>

  <!-- 取走顺序 -->
  <g filter="url(#rough2)">
    <rect x="120" y="172" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="240" y="172" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <rect x="360" y="172" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="160" y="190">Alice 取</text><text x="160" y="206">石子 1</text>
    <text x="280" y="190">Bob 取</text><text x="280" y="206">石子 2</text>
    <text x="400" y="190">Alice 取</text><text x="400" y="206">石子 0</text>
  </g>

  <!-- 得分 -->
  <g filter="url(#rough2)">
    <rect x="100" y="234" width="170" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="290" y="234" width="170" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="185" y="259">Alice = 4 + 2 = 6</text>
    <text x="375" y="259">Bob = 7 + 1 = 8</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="90" y="290" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="311" font-size="14" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">D = (10+3) − 14 = −1 &lt; 0 → Bob 胜，返回 −1</text>
</svg>
