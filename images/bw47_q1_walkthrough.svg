<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：x=3, y=4，points=[[1,2],[3,1],[2,4],[2,3],[4,4]]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="96" y="52" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="192" y="52" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="332" y="52" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="412" y="52" width="108" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="68" y="73">下标 i</text>
    <text x="144" y="73">坐标 (a, b)</text>
    <text x="262" y="73">有效性判定</text>
    <text x="372" y="73">距离 d</text>
    <text x="466" y="73">best / ans</text>
  </g>

  <!-- 行数据 -->
  <g filter="url(#rough2)">
    <rect x="40" y="92" width="56" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="92" width="96" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="92" width="140" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="92" width="80" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="412" y="92" width="108" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="68" y="113">0</text><text x="144" y="113">(1, 2)</text><text x="262" y="113">1≠3 且 2≠4 → 无效</text><text x="372" y="113">—</text><text x="466" y="113">∞ / −1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="130" width="56" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="130" width="96" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="130" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="332" y="130" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="412" y="130" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="68" y="151">1</text><text x="144" y="151">(3, 1)</text><text x="262" y="151" fill="#2f5226">a=3 同列 → 有效</text><text x="372" y="151" fill="#2f5226">3</text><text x="466" y="151" fill="#2f5226" font-weight="bold">3 / 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="168" width="56" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="168" width="96" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="168" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="332" y="168" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="412" y="168" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="68" y="189">2</text><text x="144" y="189">(2, 4)</text><text x="262" y="189" fill="#2f5226">b=4 同行 → 有效</text><text x="372" y="189" fill="#2f5226">1 &lt; 3</text><text x="466" y="189" fill="#2f5226" font-weight="bold">1 / 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="206" width="56" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="206" width="96" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="206" width="140" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="332" y="206" width="80" height="34" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="412" y="206" width="108" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="68" y="227">3</text><text x="144" y="227">(2, 3)</text><text x="262" y="227">2≠3 且 3≠4 → 无效</text><text x="372" y="227">—</text><text x="466" y="227">1 / 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="244" width="56" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="96" y="244" width="96" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="192" y="244" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="332" y="244" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="412" y="244" width="108" height="34" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="68" y="265">4</text><text x="144" y="265">(4, 4)</text><text x="262" y="265" fill="#8a6a20">b=4 同行 → 有效</text><text x="372" y="265" fill="#8a6a20">1 = 1 不更新</text><text x="466" y="265">1 / 2</text>
  </g>

  <!-- 结论 -->
  <rect x="40" y="290" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">返回 ans = 2：[2,4] 与 [4,4] 同为 d=1，平局保留下标最小的 2</text>
</svg>
