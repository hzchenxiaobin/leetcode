<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">反向汇总：谁可以接在我前面</text>
  <text x="320" y="57" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">dp_k(v) = 所有「后面能接 v」的元音 u 的 dp_(k−1)(u) 之和</text>

  <text x="90" y="88" text-anchor="middle" font-size="12" fill="#2f4d68" filter="url(#rough2)">新末位（长度 k）</text>
  <text x="250" y="88" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">来源末位（长度 k−1）</text>

  <!-- 行 1：a <- e,i,u -->
  <rect x="64" y="128" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="151" text-anchor="middle" font-size="17" fill="#7a5a12" filter="url(#rough2)">a</text>
  <text x="132" y="152" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <rect x="156" y="128" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="151" text-anchor="middle" font-size="17" fill="#3c6430" filter="url(#rough2)">e</text>
  <text x="212" y="152" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="224" y="128" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="151" text-anchor="middle" font-size="17" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="280" y="152" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="292" y="128" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="151" text-anchor="middle" font-size="17" fill="#3c6430" filter="url(#rough2)">u</text>
  <text x="360" y="151" font-size="11.5" fill="#666" filter="url(#rough2)">e、i、u 后面都能接 a</text>

  <!-- 行 2：e <- a,i -->
  <rect x="64" y="178" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="201" text-anchor="middle" font-size="17" fill="#3c6430" filter="url(#rough2)">e</text>
  <text x="132" y="202" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <rect x="156" y="178" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="201" text-anchor="middle" font-size="17" fill="#7a5a12" filter="url(#rough2)">a</text>
  <text x="212" y="202" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="224" y="178" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="201" text-anchor="middle" font-size="17" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="360" y="201" font-size="11.5" fill="#666" filter="url(#rough2)">a、i 后面能接 e</text>

  <!-- 行 3：i <- e,o -->
  <rect x="64" y="228" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="251" text-anchor="middle" font-size="17" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="132" y="252" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <rect x="156" y="228" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="251" text-anchor="middle" font-size="17" fill="#3c6430" filter="url(#rough2)">e</text>
  <text x="212" y="252" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="224" y="228" width="52" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="251" text-anchor="middle" font-size="17" fill="#8a3a37" filter="url(#rough2)">o</text>
  <text x="360" y="251" font-size="11.5" fill="#666" filter="url(#rough2)">e、o 后面能接 i（i 不行）</text>

  <!-- 行 4：o <- i -->
  <rect x="64" y="278" width="52" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="301" text-anchor="middle" font-size="17" fill="#8a3a37" filter="url(#rough2)">o</text>
  <text x="132" y="302" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <rect x="156" y="278" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="301" text-anchor="middle" font-size="17" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="360" y="301" font-size="11.5" fill="#666" filter="url(#rough2)">只有 i 后面能接 o</text>

  <!-- 行 5：u <- i,o -->
  <rect x="64" y="328" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="351" text-anchor="middle" font-size="17" fill="#3c6430" filter="url(#rough2)">u</text>
  <text x="132" y="352" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">=</text>
  <rect x="156" y="328" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="351" text-anchor="middle" font-size="17" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="212" y="352" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="224" y="328" width="52" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="351" text-anchor="middle" font-size="17" fill="#8a3a37" filter="url(#rough2)">o</text>
  <text x="360" y="351" font-size="11.5" fill="#666" filter="url(#rough2)">i、o 后面能接 u</text>

  <rect x="64" y="372" width="512" height="48" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="392" font-size="12" fill="#7a5a12" filter="url(#rough2)">初始 k = 1：五个状态各 1 种（单字符串）；答案 = k = n 时五个值之和。</text>
  <text x="76" y="412" font-size="12" fill="#7a5a12" filter="url(#rough2)">每层只依赖上一层，5 个变量原地滚动，空间 O(1)。</text>
</svg>
