<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：L 形路径 = 转角 + 两条臂；尾随零 = min(v₂, v₅)</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 5x5 grid, cell 42, origin (60,88) -->
  <!-- non-path cells -->
  <g filter="url(#sk2)">
    <rect x="60" y="88" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="102" y="88" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="186" y="88" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="228" y="88" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="60" y="130" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="102" y="130" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="186" y="130" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="228" y="130" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="60" y="172" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="102" y="172" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="186" y="172" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="228" y="172" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="60" y="214" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="102" y="214" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="60" y="256" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="102" y="256" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="186" y="256" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="228" y="256" width="42" height="42" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <!-- up arm: col 2, rows 0..2 (green) -->
    <rect x="144" y="88" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="144" y="130" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="144" y="172" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <!-- right arm: row 3, cols 3..4 (blue) -->
    <rect x="186" y="214" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="228" y="214" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- corner: (2,3) (orange) -->
    <rect x="144" y="214" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="165" y="229" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">转角</text>
  <text x="165" y="248" text-anchor="middle" font-size="11" fill="#7a5415">(i,j)</text>

  <!-- traversal: straight down col 2, turn, then right -->
  <circle cx="165" cy="76" r="3.2" fill="#b85450" filter="url(#sk2)"/>
  <path d="M 165 80 L 165 235 L 258 235" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- legend, right column -->
  <g filter="url(#sk2)">
    <rect x="320" y="80" width="22" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="320" y="132" width="22" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="320" y="184" width="22" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="352" y="95" font-size="12.5" font-weight="bold" fill="#2e5e22">竖直臂：列 j 上的一维区间</text>
  <text x="352" y="112" font-size="10.5" fill="#666">列前缀和 O(1) 求任意臂段之和</text>
  <text x="352" y="147" font-size="12.5" font-weight="bold" fill="#2b4a6e">水平臂：行 i 上的一维区间</text>
  <text x="352" y="164" font-size="10.5" fill="#666">行前缀和 O(1) 求任意臂段之和</text>
  <text x="352" y="199" font-size="12.5" font-weight="bold" fill="#7a5415">转角 (i,j)：两臂的唯一交点</text>
  <text x="352" y="216" font-size="10.5" fill="#666">两臂前缀和各含它一次 → 总和要减去一份</text>

  <!-- formula box -->
  <g filter="url(#sk2)">
    <rect x="320" y="236" width="300" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="262" text-anchor="middle" font-size="12.5" fill="#2b4a6e">路径乘积 P = 2ᵃ · 5ᵇ · r（r 与 10 互素）</text>
  <text x="470" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5c">尾随零数 = min(a, b) = min(Σv₂, Σv₅)</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="30" y="330" width="580" height="98" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="12.5" fill="#7a5415">关键转化：因子个数对乘法可加 →「数乘积的零」变成「数路径上 v₂、v₅ 之和」，乘积问题变求和问题。</text>
  <text x="320" y="382" text-anchor="middle" font-size="12.5" fill="#7a5415">满臂延伸：新增格贡献 (Δv₂, Δv₅) ≥ (0, 0)，两分量同增 → min 单调不降，</text>
  <text x="320" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">⇒ 不必枚举臂长：每个转角只算 4 种「满臂」方向组合，O(m+n) 的臂长维度被消去。</text>
</svg>
