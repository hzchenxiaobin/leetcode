<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#446688"/>
    </marker>
    <marker id="ao" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">按出现位置分流：谁能救哪个值</text>
  <path d="M 150 42 Q 260 49 370 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="88" y="52" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="106" y="63" font-size="10.5" fill="#446688" filter="url(#sk)">仅 nums1（o₁ 个）</text>
  <rect x="240" y="52" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="258" y="63" font-size="10.5" fill="#b07818" filter="url(#sk)">公共（c 个）</text>
  <rect x="350" y="52" width="13" height="13" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="368" y="63" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">仅 nums2（o₂ 个）</text>

  <rect x="78" y="84" width="36" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="104" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">1</text>
  <rect x="78" y="126" width="36" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="146" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">4</text>
  <rect x="78" y="168" width="36" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="188" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">5</text>
  <rect x="78" y="210" width="36" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="230" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">6</text>
  <rect x="78" y="258" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="278" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">2</text>
  <rect x="78" y="300" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="96" y="320" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">3</text>

  <rect x="336" y="92" width="154" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="413" y="114" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#sk)">nums1 名额</text>
  <text x="413" y="133" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">恰好 n/2 个</text>
  <text x="413" y="240" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">（示例 2 没有「仅 nums2」的值）</text>
  <rect x="336" y="250" width="154" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="413" y="272" text-anchor="middle" font-size="13" fill="#2f5a25" font-weight="bold" filter="url(#sk)">nums2 名额</text>
  <text x="413" y="291" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">恰好 n/2 个</text>

  <path d="M 114,99 C 190,96 260,98 336,102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 114,141 C 195,138 265,110 336,111" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 114,183 C 200,180 270,120 336,120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 114,225 C 205,222 275,130 336,129" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 114,268 C 220,262 280,190 336,140" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 114,278 C 180,280 250,272 336,268" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 114,308 C 235,300 295,210 336,144" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 114,318 C 185,318 255,295 336,282" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <text x="215" y="86" font-size="10.5" fill="#446688" filter="url(#sk)">独占值：只能走本侧</text>

  <rect x="55" y="348" width="410" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">独占值只有一条路，公共值两条路皆可</text>
  <text x="260" y="383" text-anchor="middle" font-size="11" fill="#2f5a25" filter="url(#sk)">名额分配的全部自由度，集中在公共值身上</text>
</svg>
