<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">菱形 = 中心 (ci,cj) + 半径 r：四个角由 r 唯一确定</text>

  <!-- 左：菱形几何 -->
  <text x="170" y="58" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">半径 r = 2 的菱形边界</text>
  <!-- 网格 5x5，格子 34px，起点 (40,84) -->
  <g filter="url(#rough2)">
    <!-- 背景网格 -->
    <g stroke="#d8d8d8" stroke-width="1" fill="none">
      <path d="M 40 84 h 170"/><path d="M 40 118 h 170"/><path d="M 40 152 h 170"/>
      <path d="M 40 186 h 170"/><path d="M 40 220 h 170"/><path d="M 40 254 h 170"/>
      <path d="M 40 84 v 170"/><path d="M 74 84 v 170"/><path d="M 108 84 v 170"/>
      <path d="M 142 84 v 170"/><path d="M 176 84 v 170"/><path d="M 210 84 v 170"/>
    </g>
    <!-- 菱形边界格子（r=2，中心(2,2)）：T(0,2) L(2,0) B(4,2) R(2,4) 及边上格 -->
    <rect x="108" y="84"  width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="142" y="118" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="176" y="152" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="142" y="186" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="108" y="220" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="74"  y="186" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="40"  y="152" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="74"  y="118" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <!-- 中心 -->
    <rect x="108" y="152" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <text x="125" y="174" font-size="14" fill="#7a5c1e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)" font-size="13" fill="#33507a" font-weight="bold" text-anchor="middle">
    <text x="125" y="105">T</text><text x="193" y="173">R</text>
    <text x="125" y="241">B</text><text x="57" y="173">L</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="170" y="282">T = (ci−r, cj)</text>
    <text x="170" y="298">R = (ci, cj+r)</text>
    <text x="170" y="314">B = (ci+r, cj)</text>
    <text x="170" y="330">L = (ci, cj−r)</text>
  </g>

  <!-- 右：r 上限 -->
  <text x="420" y="58" font-size="14" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">r 的上限：r ≤ min(ci, cj, m−1−ci, n−1−cj)</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="330" y="80" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="420" y="105">r = 0：只有中心一格</text>
    <rect x="330" y="130" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="420" y="155">r = 1：中心 + 上下左右</text>
    <rect x="330" y="180" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="420" y="205">r = 2：如左图，边界 8 格</text>
    <rect x="330" y="230" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="420" y="255">r 再大：出界 ✗</text>
  </g>
  <path d="M 300 200 Q 320 200, 328 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="348" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="373" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">枚举 (ci, cj, r) 三元组，覆盖网格中所有菱形，无一遗漏</text>
</svg>
