<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：按键身份不重要，位次决定代价</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">每个键可挂任意多字母；挂第 p 位 = 每次输入连按 p 次</text>

  <!-- 8 key columns: layer 1 (green) letters a..h -->
  <g filter="url(#sk)">
    <rect x="92"  y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="150" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="208" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="266" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="324" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="382" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="440" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="498" y="78" width="40" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="112" y="99">a</text><text x="170" y="99">b</text><text x="228" y="99">c</text><text x="286" y="99">d</text>
    <text x="344" y="99">e</text><text x="402" y="99">f</text><text x="460" y="99">g</text><text x="518" y="99">h</text>
  </g>

  <!-- layer 2 (blue) letters i..p -->
  <g filter="url(#sk)">
    <rect x="92"  y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="150" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="208" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="266" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="324" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="382" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="440" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="498" y="116" width="40" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#2b5d85">
    <text x="112" y="137">i</text><text x="170" y="137">j</text><text x="228" y="137">k</text><text x="286" y="137">l</text>
    <text x="344" y="137">m</text><text x="402" y="137">n</text><text x="460" y="137">o</text><text x="518" y="137">p</text>
  </g>

  <!-- layer 3 (orange) letters q..x -->
  <g filter="url(#sk)">
    <rect x="92"  y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="150" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="208" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="266" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="324" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="382" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="440" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="498" y="154" width="40" height="32" rx="4" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#a06b1a">
    <text x="112" y="175">q</text><text x="170" y="175">r</text><text x="228" y="175">s</text><text x="286" y="175">t</text>
    <text x="344" y="175">u</text><text x="402" y="175">v</text><text x="460" y="175">w</text><text x="518" y="175">x</text>
  </g>

  <!-- layer 4 (red): only 2 slots -->
  <g filter="url(#sk)">
    <rect x="92"  y="192" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b8546a" stroke-width="2.2"/>
    <rect x="150" y="192" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b8546a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle" fill="#a04a5a">
    <text x="112" y="213">y</text><text x="170" y="213">z</text>
  </g>

  <!-- layer labels on the right -->
  <g filter="url(#sk)" font-size="10.5" font-weight="bold">
    <text x="546" y="99"  fill="#4a8e4a">第1位·按1次</text>
    <text x="546" y="137" fill="#4a8edb">第2位·按2次</text>
    <text x="546" y="175" fill="#c98a2b">第3位·按3次</text>
    <text x="546" y="207" fill="#b8546a">第4位·按4次</text>
    <text x="546" y="221" fill="#b8546a">(仅 2 槽)</text>
  </g>

  <!-- key labels -->
  <g filter="url(#sk)" font-size="11" text-anchor="middle" fill="#777">
    <text x="112" y="244">键2</text><text x="170" y="244">键3</text><text x="228" y="244">键4</text><text x="286" y="244">键5</text>
    <text x="344" y="244">键6</text><text x="402" y="244">键7</text><text x="460" y="244">键8</text><text x="518" y="244">键9</text>
  </g>

  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">26 个字母 = 8 + 8 + 8 + 2：贪心分层后的位次多重集 { 1×8, 2×8, 3×8, 4×2 }</text>

  <!-- supply constraint note -->
  <g filter="url(#sk)">
    <rect x="35" y="288" width="570" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">供给约束：位次 ≤ p 的槽至多 8p 个——任何映射（哪怕一键挂 10 个字母）都逃不出</text>
  <text x="320" y="326" text-anchor="middle" font-size="11.5" fill="#2b5d85" filter="url(#sk)">贪心「每 8 个一层」恰好把每层供给吃满</text>

  <!-- formula banner -->
  <g filter="url(#sk)">
    <rect x="35" y="348" width="570" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = Σ freq_sorted[i] × ( ⌊i / 8⌋ + 1 )　（频率降序，i 从 0 起）</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="35" y="400" width="570" height="40" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="11.5" fill="#a06b1a" filter="url(#sk)">未出现的字母频率为 0，挂哪里都不产生代价——只需照顾 word 中出现的字母</text>
</svg>
