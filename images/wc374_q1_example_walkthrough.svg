<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：[1,4,3,8,5] 逐下标判定</text>
  <path d="M 185 36 Q 320 44 455 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 下标 -->
  <text x="178" y="50" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="244" y="50" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="310" y="50" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="376" y="50" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="442" y="50" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- 数组格子 -->
  <g filter="url(#sk)"><rect x="150" y="56" width="56" height="42" rx="4" fill="#f0efea" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="178" y="83" text-anchor="middle" font-size="14" fill="#888">1</text>
  <text x="178" y="116" text-anchor="middle" font-size="11" fill="#999">首 ✗</text>

  <g filter="url(#sk)"><rect x="216" y="56" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="244" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">4</text>
  <text x="244" y="116" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold">峰 ✓</text>

  <g filter="url(#sk)"><rect x="282" y="56" width="56" height="42" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="310" y="83" text-anchor="middle" font-size="14" fill="#777">3</text>
  <text x="310" y="116" text-anchor="middle" font-size="11" fill="#999">✗</text>

  <g filter="url(#sk)"><rect x="348" y="56" width="56" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="376" y="83" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10">8</text>
  <text x="376" y="116" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold">峰 ✓</text>

  <g filter="url(#sk)"><rect x="414" y="56" width="56" height="42" rx="4" fill="#f0efea" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="442" y="83" text-anchor="middle" font-size="14" fill="#888">5</text>
  <text x="442" y="116" text-anchor="middle" font-size="11" fill="#999">尾 ✗</text>

  <!-- 连接箭头 -->
  <path d="M 310 122 L 310 142" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="138" font-size="11" fill="#888">枚举范围只有 [1, 3]</text>

  <!-- 判定表 -->
  <g filter="url(#sk)"><rect x="50" y="148" width="44" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="94" y="148" width="150" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="244" y="148" width="150" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="394" y="148" width="66" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="460" y="148" width="140" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="72" y="167" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold" font-family="monospace">i</text>
  <text x="169" y="167" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold" font-family="monospace">m[i−1] &lt; m[i]</text>
  <text x="319" y="167" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold" font-family="monospace">m[i] &gt; m[i+1]</text>
  <text x="427" y="167" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">峰？</text>
  <text x="530" y="167" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold" font-family="monospace">ans</text>

  <!-- 行 1：i=1 峰 -->
  <g filter="url(#sk)"><rect x="50" y="176" width="44" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="94" y="176" width="150" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="244" y="176" width="150" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="394" y="176" width="66" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="460" y="176" width="140" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <text x="72" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">1</text>
  <text x="169" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">1 &lt; 4 ✓</text>
  <text x="319" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">4 &gt; 3 ✓</text>
  <text x="427" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="530" y="196" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">[1]</text>

  <!-- 行 2：i=2 短路 -->
  <g filter="url(#sk)"><rect x="50" y="206" width="44" height="30" fill="#fdfcf7" stroke="#c9c5ba" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="94" y="206" width="150" height="30" fill="#fdfcf7" stroke="#c9c5ba" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="244" y="206" width="150" height="30" fill="#fdfcf7" stroke="#c9c5ba" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="394" y="206" width="66" height="30" fill="#fdfcf7" stroke="#c9c5ba" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="460" y="206" width="140" height="30" fill="#fdfcf7" stroke="#c9c5ba" stroke-width="1"/></g>
  <text x="72" y="226" text-anchor="middle" font-size="12" fill="#555" font-family="monospace">2</text>
  <text x="169" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">4 &lt; 3 ✗</text>
  <text x="319" y="226" text-anchor="middle" font-size="11" fill="#999" font-family="monospace">（短路）</text>
  <text x="427" y="226" text-anchor="middle" font-size="12" fill="#999">✗</text>
  <text x="530" y="226" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">[1]</text>

  <!-- 行 3：i=3 峰 -->
  <g filter="url(#sk)"><rect x="50" y="236" width="44" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="94" y="236" width="150" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="244" y="236" width="150" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="394" y="236" width="66" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="460" y="236" width="140" height="30" fill="#eaf6ee" stroke="#9cc9a0" stroke-width="1"/></g>
  <text x="72" y="256" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">3</text>
  <text x="169" y="256" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">3 &lt; 8 ✓</text>
  <text x="319" y="256" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">8 &gt; 5 ✓</text>
  <text x="427" y="256" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="530" y="256" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">[1, 3]</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="40" y="292" width="560" height="68" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">遍历结束 → 返回 [1, 3] ✓</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#666">对照示例 1 [2,4,4]：唯一候选 i=1 因 4 &gt; 4 不成立被剔除 → 返回 [ ]</text>
</svg>
