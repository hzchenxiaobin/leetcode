<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">一个 '(' 必须吃到两个 ')'：贪心扫描 + need 计数</text>

  <!-- 示例串 ))())( -->
  <g filter="url(#rough2)">
    <rect x="80" y="58" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="132" y="58" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="184" y="58" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="236" y="58" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="288" y="58" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="340" y="58" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="18" fill="#333" text-anchor="middle">
    <text x="106" y="85">)</text><text x="158" y="85">)</text><text x="210" y="85">(</text>
    <text x="262" y="85">)</text><text x="314" y="85">)</text><text x="366" y="85">(</text>
  </g>
  <text x="280" y="128" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">s = ))())(  →  答案 3：补 1 个 '(' 给开头 ))，补 2 个 ')' 给结尾 (</text>

  <!-- 配对结构 -->
  <g filter="url(#rough2)">
    <path d="M 106 140 C 106 168, 314 168, 314 140" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 158 140 C 158 156, 262 156, 262 140" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 210 140 C 210 186, 366 186, 366 140" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a7a7a" text-anchor="middle">
    <text x="210" y="200">孤立 ')' 找不到 '('，前面补一个</text>
    <text x="288" y="182">结尾 '(' 缺 '))'</text>
  </g>

  <!-- 状态流转 -->
  <text x="280" y="228" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">扫描时的两个记账变量</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="242" width="230" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="175" y="266">need = 打开的 '(' 共差多少 ')'</text>
    <text x="175" y="288">每个 '(' 贡献 2，每个 ')' 抵 1</text>
    <rect x="310" y="242" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="425" y="266">res = 已插入的字符数</text>
    <text x="425" y="288">孤立 ')' 补 '(' 记 1（need 变 1）</text>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <rect x="60" y="318" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="300" y="343" fill="#2d5a22" font-weight="bold">关键贪心：遇 '(' 时若 need 为奇，立刻紧贴补一个 ')'（隔断的半对绝不跨过 '('）</text>
  </g>
</svg>
