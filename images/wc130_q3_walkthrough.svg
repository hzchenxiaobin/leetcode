<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：head = [2,7,4,3,5] 的五步结算</text>
  <text x="310.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">栈内保存的是下标，答案由被弹出的下标回填</text>
  <rect x="25.0" y="72.0" width="45.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="70.0" y="72.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <rect x="130.0" y="72.0" width="175.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">弹栈动作</text>
  <rect x="305.0" y="72.0" width="145.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">栈（自底→顶）</text>
  <rect x="450.0" y="72.0" width="150.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="91.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="25.0" y="104.0" width="45.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="70.0" y="104.0" width="60.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="130.0" y="104.0" width="175.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">—</text>
  <rect x="305.0" y="104.0" width="145.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[0]</text>
  <rect x="450.0" y="104.0" width="150.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="123.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0,0,0,0,0</text>
  <rect x="25.0" y="136.0" width="45.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="70.0" y="136.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="130.0" y="136.0" width="175.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">弹 0，ans[0]=7</text>
  <rect x="305.0" y="136.0" width="145.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1]</text>
  <rect x="450.0" y="136.0" width="150.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="155.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7,0,0,0,0</text>
  <rect x="25.0" y="168.0" width="45.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="70.0" y="168.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="130.0" y="168.0" width="175.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">—（7 &gt; 4）</text>
  <rect x="305.0" y="168.0" width="145.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,2]</text>
  <rect x="450.0" y="168.0" width="150.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="187.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7,0,0,0,0</text>
  <rect x="25.0" y="200.0" width="45.0" height="32.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="219.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="70.0" y="200.0" width="60.0" height="32.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="219.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="130.0" y="200.0" width="175.0" height="32.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="219.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">—（4 &gt; 3）</text>
  <rect x="305.0" y="200.0" width="145.0" height="32.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="219.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,2,3]</text>
  <rect x="450.0" y="200.0" width="150.0" height="32.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="219.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7,0,0,0,0</text>
  <rect x="25.0" y="232.0" width="45.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="47.5" y="251.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="70.0" y="232.0" width="60.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100.0" y="251.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="130.0" y="232.0" width="175.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="217.5" y="251.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">弹 3、2，ans 置 5</text>
  <rect x="305.0" y="232.0" width="145.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377.5" y="251.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,4]</text>
  <rect x="450.0" y="232.0" width="150.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="525.0" y="251.7" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7,0,5,5,0</text>
  <text x="25.0" y="290.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">结束栈中剩 [1,4]（值 7、5），右侧无更大值 → 保持 0，最终 [7,0,5,5,0]。</text>
</svg>
