<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="404" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [−3,2,−2,−1,3,−2,3]，删除 X = −2 得到 7</text>

  <g filter="url(#rough2)">
    <rect x="40" y="42" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="90" y="42" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="140" y="42" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="190" y="42" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="240" y="42" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="290" y="42" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="340" y="42" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="63" y="62" fill="#3a4a66">−3</text>
    <text x="113" y="62" fill="#3a4a66">2</text>
    <text x="163" y="62" fill="#8a3a36">−2</text>
    <text x="213" y="62" fill="#3a5a30">−1</text>
    <text x="263" y="62" fill="#3a5a30">3</text>
    <text x="313" y="62" fill="#8a3a36">−2</text>
    <text x="363" y="62" fill="#3a5a30">3</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#999">
    <text x="63" y="84">P=0</text>
    <text x="113" y="84">−3</text>
    <text x="163" y="84">−1</text>
    <text x="213" y="84">−3</text>
    <text x="263" y="84">−4</text>
    <text x="313" y="84">−1</text>
    <text x="363" y="84">−3</text>
    <text x="400" y="84">P₇=0</text>
  </g>

  <rect x="404" y="42" width="152" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="480" y="60" text-anchor="middle" font-size="10.4" fill="#8a6a20">红色 = 被删除的 −2</text>
  <text filter="url(#rough2)" x="480" y="76" text-anchor="middle" font-size="10.4" fill="#8a6a20">蓝/绿 = 三段</text>

  <g filter="url(#rough2)">
    <rect x="40" y="96" width="136" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7"/>
    <rect x="190" y="96" width="136" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7"/>
    <rect x="340" y="96" width="104" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7"/>
  </g>
  <g filter="url(#rough2)" font-size="10.2" text-anchor="middle" fill="#334">
    <text x="108" y="114" font-weight="bold">S₀ = [−3, 2]</text>
    <text x="108" y="132">sum −1　pref −1</text>
    <text x="108" y="148" fill="#3a4a66" font-weight="bold">suff 2</text>
    <text x="258" y="114" font-weight="bold">S₁ = [−1, 3]</text>
    <text x="258" y="132">sum 2　pref 2</text>
    <text x="258" y="148" fill="#3a5a30" font-weight="bold">suff 3</text>
    <text x="392" y="114" font-weight="bold">S₂ = [3]</text>
    <text x="392" y="132">sum 3　pref 3</text>
    <text x="392" y="148" fill="#3a5a30" font-weight="bold">suff 3</text>
  </g>

  <path d="M 178 125 L 188 125" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 328 125 L 338 125" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="40" y="168" width="498" height="28" fill="#dde5ee" stroke="#446688" stroke-width="1.2" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.4" font-weight="bold" fill="#334">
    <text x="52" y="187">处理到</text>
    <text x="160" y="187">curBest 更新</text>
    <text x="330" y="187">curSuff 更新</text>
    <text x="486" y="187">ans</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="198" width="498" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="40" y="230" width="498" height="30" fill="#f6f8fa" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="40" y="262" width="498" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.2" fill="#333">
    <text x="52" y="218">S₀</text>
    <text x="160" y="218" fill="#888">第一段，无旧后缀</text>
    <text x="330" y="218">curSuff = 2</text>
    <text x="486" y="218">—</text>

    <text x="52" y="250">S₁</text>
    <text x="160" y="250">max(−∞, 2 + 2) = 4</text>
    <text x="330" y="250">max(3, 2 + 2) = 4</text>
    <text x="486" y="250">4</text>

    <text x="52" y="282" font-weight="bold">S₂</text>
    <text x="160" y="282" fill="#3a5a30" font-weight="bold">max(4, 4 + 3) = 7</text>
    <text x="330" y="282">max(3, 4 + 3) = 7</text>
    <text x="486" y="282" fill="#3a5a30" font-weight="bold">7</text>
  </g>

  <text filter="url(#rough2)" x="52" y="318" font-size="10.6" fill="#333">取出的区间：S₀ 的后缀 [2] + 跳过 −2 + S₁ 整段 [−1, 3] + 跳过 −2 + S₂ 整段 [3] → 2 − 1 + 3 + 3 = 7</text>

  <rect x="40" y="330" width="498" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="54" y="350" font-size="10.6" fill="#8a6a20" font-weight="bold">其他取值的对照</text>
  <text filter="url(#rough2)" x="54" y="368" font-size="10.2" fill="#444">X = −3 → 只剩 [2,−2,−1,3,−2]，最优 3；X = −1 → 3；X = 2 → −2；X = 3 → 2；不删除 → Kadane 得 4。</text>
  <text filter="url(#rough2)" x="54" y="384" font-size="10.2" fill="#444">全局 max(4, 7) = 7，与官方输出一致。</text>
</svg>
