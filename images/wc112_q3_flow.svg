<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 322" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="322" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">removeStones：并查集合并行与列</text>
  <rect x="48" y="50" width="424" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">① 行 x 与列 y 合并（节点编号：行用 x，列用 ~y 区分）</text>
  <path d="M 260 94 L 260 112" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="112" width="424" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">② 对每块石头 union(x, ~y)</text>
  <path d="M 260 156 L 260 174" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="174" width="424" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">③ 统计不同根的数量 = 连通分量数</text>
  <path d="M 260 218 L 260 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="236" width="424" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ return n − 分量数</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(n α(n))，空间 O(n)；坐标 0..10⁴ 用哈希表或 2×10⁴ 数组</text>
</svg>
