<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：每个节点开一行的"子树账本"</text>

  <g filter="url(#rough2)">
    <rect x="36" y="46" width="488" height="164" fill="#fff" stroke="#666" stroke-width="1.2" rx="10"/>
    <text x="52" y="70" font-size="12" fill="#3a4a66" font-weight="bold">示例 1：root = [5,6,1]</text>

    <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
      <text x="132" y="90">子树根</text>
      <text x="252" y="90">包含的节点</text>
      <text x="352" y="90">(sum, cnt)</text>
      <text x="452" y="90">平均值</text>
    </g>
    <g filter="url(#rough2)">
      <line x1="52" y1="98" x2="508" y2="98" stroke="#ccc" stroke-width="1"/>
      <rect x="62" y="108" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6"/>
      <text x="132" y="125" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">5（整棵树）</text>
      <rect x="192" y="108" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="252" y="125" text-anchor="middle" font-size="10.5" fill="#555">{5, 6, 1}</text>
      <rect x="312" y="108" width="80" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="352" y="125" text-anchor="middle" font-size="10.5" fill="#555">(12, 3)</text>
      <rect x="412" y="108" width="84" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="454" y="125" text-anchor="middle" font-size="10.5" fill="#555">4.0</text>

      <rect x="62" y="144" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
      <text x="132" y="161" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">6（单点）★</text>
      <rect x="192" y="144" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
      <text x="252" y="161" text-anchor="middle" font-size="10.5" fill="#3a5a30">{6}</text>
      <rect x="312" y="144" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
      <text x="352" y="161" text-anchor="middle" font-size="10.5" fill="#3a5a30">(6, 1)</text>
      <rect x="412" y="144" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
      <text x="454" y="161" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">6.0 ← best</text>

      <rect x="62" y="180" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
      <text x="132" y="197" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">1（单点）</text>
      <rect x="192" y="180" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="252" y="197" text-anchor="middle" font-size="10.5" fill="#555">{1}</text>
      <rect x="312" y="180" width="80" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="352" y="197" text-anchor="middle" font-size="10.5" fill="#555">(1, 1)</text>
      <rect x="412" y="180" width="84" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="454" y="197" text-anchor="middle" font-size="10.5" fill="#555">1.0</text>
    </g>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="224" width="488" height="120" fill="#fff" stroke="#666" stroke-width="1.2" rx="10"/>
    <text x="52" y="248" font-size="12" fill="#8a6a20" font-weight="bold">示例 2：root = [0,null,1]（根 0 只有右孩子 1）</text>
    <g filter="url(#rough2)">
      <rect x="62" y="262" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
      <text x="132" y="279" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">0（整棵树）</text>
      <rect x="192" y="262" width="120" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="252" y="279" text-anchor="middle" font-size="10.5" fill="#555">{0, 1}</text>
      <rect x="312" y="262" width="80" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="352" y="279" text-anchor="middle" font-size="10.5" fill="#555">(1, 2)</text>
      <rect x="412" y="262" width="84" height="26" fill="#fff" stroke="#999" stroke-width="1" rx="6"/>
      <text x="454" y="279" text-anchor="middle" font-size="10.5" fill="#555">0.5</text>

      <rect x="62" y="298" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
      <text x="132" y="315" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">1（单点）★</text>
      <rect x="192" y="298" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
      <text x="252" y="315" text-anchor="middle" font-size="10.5" fill="#3a5a30">{1}</text>
      <rect x="312" y="298" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6"/>
      <text x="352" y="315" text-anchor="middle" font-size="10.5" fill="#3a5a30">(1, 1)</text>
      <rect x="412" y="298" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
      <text x="454" y="315" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">1.0 ← best</text>
    </g>
    <text x="52" y="336" font-size="10" fill="#555">把 0 也"平均"进来的整棵树 avg = 0.5 反而更小 —— 最优子树未必包含根</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="356" width="488" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="280" y="374" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">两例的 best 都来自"单点子树"：n = 5000 时若全树退化成链，最优也可能在链上任何一点</text>
    <text x="280" y="392" text-anchor="middle" font-size="10" fill="#555">所以必须对每个节点都算一次 avg，不能只看根或只看叶子</text>
  </g>
</svg>
