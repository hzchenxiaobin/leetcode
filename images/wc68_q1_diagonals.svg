<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="40" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">托普利茨矩阵：每条左上→右下对角线元素相同</text>

  <!-- 3x4 矩阵格子 -->
  <rect x="60" y="80" width="60" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="120" y="80" width="60" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="180" y="80" width="60" height="54" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="80" width="60" height="54" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="134" width="60" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="120" y="134" width="60" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="180" y="134" width="60" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="240" y="134" width="60" height="54" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="188" width="60" height="54" rx="6" fill="#ffffff" stroke="#9aa4a8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="188" width="60" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="180" y="188" width="60" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="240" y="188" width="60" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 三条对角线连线 -->
  <path d="M90,107 L150,161 L210,215" fill="none" stroke="#4a7a3a" stroke-width="2.2" opacity="0.5" filter="url(#rough2)"/>
  <path d="M90,161 L150,215" fill="none" stroke="#d6a040" stroke-width="2.2" opacity="0.5" filter="url(#rough2)"/>
  <path d="M150,107 L210,161 L270,215" fill="none" stroke="#446688" stroke-width="2.2" opacity="0.5" filter="url(#rough2)"/>

  <!-- 元素值 -->
  <text x="90" y="113" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="113" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="113" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="113" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>
  <text x="90" y="167" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="167" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="167" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="167" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <text x="90" y="221" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">9</text>
  <text x="150" y="221" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>
  <text x="210" y="221" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="221" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>

  <!-- 右侧说明框 -->
  <rect x="330" y="80" width="200" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="106" text-anchor="middle" font-size="13" fill="#7a5b1e" filter="url(#rough2)">同一条左上→右下</text>
  <text x="430" y="128" text-anchor="middle" font-size="13" fill="#7a5b1e" filter="url(#rough2)">对角线上：i − j 相同</text>
  <text x="430" y="152" text-anchor="middle" font-size="12" fill="#9a7a34" filter="url(#rough2)">d = i − j 就是对角线的编号</text>

  <rect x="330" y="180" width="200" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="206" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">灰白格属于其余 3 条</text>
  <text x="430" y="230" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">对角线，同样各自同值</text>

  <!-- 图例 -->
  <rect x="52" y="270" width="16" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="282" font-size="13" fill="#333" filter="url(#rough2)">d = 0（主对角线）：1, 1, 1</text>
  <rect x="52" y="296" width="16" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="308" font-size="13" fill="#333" filter="url(#rough2)">d = 1：5, 5</text>
  <rect x="52" y="322" width="16" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="334" font-size="13" fill="#333" filter="url(#rough2)">d = −1：2, 2, 2</text>
</svg>
