<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="310" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">双指针：左找奇数、右找偶数，就地交换</text>
  <text x="140" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i 从左往右</text>
  <text x="500" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j 从右往左</text>
  <rect x="108" y="100" width="64" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="100" width="64" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="100" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="324" y="100" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="396" y="100" width="64" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <rect x="468" y="100" width="64" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="130.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <path d="M 140,158 L 140,186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="140" y="205" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 500,158 L 500,186" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="500" y="205" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">红=奇数　蓝=偶数</text>
  <rect x="70" y="226" width="150" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="252.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[i] 偶 → i++</text>
  <rect x="240" y="226" width="150" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315.0" y="252.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">nums[j] 奇 → j--</text>
  <rect x="410" y="226" width="160" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490.0" y="252.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">左奇右偶 → 交换</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">交换后 i++、j--，两侧各归位一个元素</text>
</svg>
