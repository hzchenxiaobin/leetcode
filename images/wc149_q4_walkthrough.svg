<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">官方示例走查：arr = [1,1,2,2,1,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">pos[1] = [0,1,4,5]，pos[2] = [2,3]；计数靠两次二分</text>

  <g>
    <rect x="132" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <rect x="182" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <rect x="232" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <rect x="282" y="58" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <rect x="332" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <rect x="382" y="58" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="155" y="78" filter="url(#rough2)">1</text><text x="205" y="78" filter="url(#rough2)">1</text>
    <text x="255" y="78" filter="url(#rough2)">2</text><text x="305" y="78" filter="url(#rough2)">2</text>
    <text x="355" y="78" filter="url(#rough2)">1</text><text x="405" y="78" filter="url(#rough2)">1</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="155" y="102" filter="url(#rough2)">0</text><text x="205" y="102" filter="url(#rough2)">1</text>
    <text x="255" y="102" filter="url(#rough2)">2</text><text x="305" y="102" filter="url(#rough2)">3</text>
    <text x="355" y="102" filter="url(#rough2)">4</text><text x="405" y="102" filter="url(#rough2)">5</text>
  </g>

  <text x="280" y="126" text-anchor="middle" font-size="10" fill="#7a8ba6" filter="url(#rough2)">值 1 的下标：0、1、4、5</text>

  <rect x="30" y="140" width="504" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="30" y="172" width="504" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <rect x="30" y="208" width="504" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <rect x="30" y="244" width="504" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>

  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="75" y="159" filter="url(#rough2)">query</text>
    <text x="186" y="159" filter="url(#rough2)">区间内容</text>
    <text x="297" y="159" filter="url(#rough2)">合并结果</text>
    <text x="398" y="159" filter="url(#rough2)">计数</text>
    <text x="500" y="159" filter="url(#rough2)">返回</text>
  </g>

  <g font-size="10.5" fill="#2f4a2a" text-anchor="middle">
    <text x="75" y="193" filter="url(#rough2)">(0, 5, 4)</text>
    <text x="186" y="193" filter="url(#rough2)">1 1 2 2 1 1</text>
    <text x="297" y="193" filter="url(#rough2)">(1, 2)</text>
    <text x="398" y="193" filter="url(#rough2)">cnt(1) = 4</text>
    <text x="500" y="193" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <g font-size="10.5" fill="#7a3230" text-anchor="middle">
    <text x="75" y="229" filter="url(#rough2)">(0, 3, 3)</text>
    <text x="186" y="229" filter="url(#rough2)">1 1 2</text>
    <text x="297" y="229" filter="url(#rough2)">(1, 1)</text>
    <text x="398" y="229" filter="url(#rough2)">cnt(1) = 2</text>
    <text x="500" y="229" font-weight="bold" filter="url(#rough2)">−1</text>
  </g>
  <g font-size="10.5" fill="#2f4a2a" text-anchor="middle">
    <text x="75" y="265" filter="url(#rough2)">(2, 3, 2)</text>
    <text x="186" y="265" filter="url(#rough2)">2 2</text>
    <text x="297" y="265" filter="url(#rough2)">(2, 2)</text>
    <text x="398" y="265" filter="url(#rough2)">cnt(2) = 2</text>
    <text x="500" y="265" font-weight="bold" filter="url(#rough2)">2</text>
  </g>

  <path d="M 398 236 L 398 246" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="292" width="504" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="312" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 2 行正是易错点</text>
  <text x="46" y="332" font-size="10" fill="#555" filter="url(#rough2)">抵消给出的候选是 1，但区间 [0,3] 里 1 只出现 2 次，够不到 threshold = 3，</text>
  <text x="46" y="348" font-size="10" fill="#555" filter="url(#rough2)">所以候选必须回到 pos 列表里数一遍，数不够就返回 −1。</text>
  <text x="46" y="366" font-size="10" fill="#555" filter="url(#rough2)">由于 2·threshold &gt; 区间长度，达到 threshold 的元素至多一个，答案唯一。</text>
</svg>
