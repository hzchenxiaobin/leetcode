<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>
  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">BFS 序 + 逆序扫描：递归后序的迭代等价</text>

  <!-- BFS 序数组 -->
  <text x="330" y="76" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">BFS 序：孩子必然排在双亲之后</text>
  <g>
    <rect x="40" y="96" width="70" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="75" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">根 0</text>
    <text x="75" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 0</text>
    <rect x="122" y="96" width="70" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="157" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="157" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 1</text>
    <rect x="204" y="96" width="70" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="239" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
    <text x="239" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 1</text>
    <rect x="286" y="96" width="70" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="321" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
    <text x="321" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 2</text>
    <rect x="368" y="96" width="70" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="403" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
    <text x="403" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 2</text>
    <rect x="450" y="96" width="70" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="485" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
    <text x="485" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 2</text>
    <rect x="532" y="96" width="70" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="567" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
    <text x="567" y="140" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">深度 2</text>
  </g>
  <line x1="30" y1="76" x2="620" y2="76" stroke="#446688" stroke-width="2" marker-end="url(#arr)" transform="translate(0,4)" filter="url(#rough2)"/>

  <!-- 逆序扫描大箭头 -->
  <line x1="620" y1="186" x2="40" y2="186" stroke="#4a7a3a" stroke-width="3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">逆序扫描 = 先处理所有孩子、最后处理根（叶子最先）</text>

  <!-- 每个节点的操作三连 -->
  <rect x="40" y="230" width="180" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① sum[v] += value[v]</text>
  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">孩子的 sum 已累加进来</text>
  <text x="130" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">cnt[v] 已含孩子的 cnt</text>

  <rect x="240" y="230" width="180" height="80" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 若 sum[v] == 0</text>
  <text x="330" y="278" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">cnt[v] = 0（整棵删除）</text>
  <text x="330" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">v 自己也删</text>

  <rect x="440" y="230" width="180" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 上传给双亲</text>
  <text x="530" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">sum[p] += sum[v]</text>
  <text x="530" y="296" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">cnt[p] += cnt[v]</text>

  <text x="330" y="348" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">迭代写法避免 10^4 深链的递归爆栈（Python 默认栈深仅 1000）</text>
</svg>
