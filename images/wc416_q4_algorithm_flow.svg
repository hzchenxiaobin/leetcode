<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单趟扫描：入窗 → 弹到失合法 → ans += l</text>
  <path d="M 260 42 Q 450 50 640 42" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="80" y="64" width="310" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="235" y="86" text-anchor="middle" font-size="12.5" fill="#2b4a6e">统计 need[26]；less = word2 不同字符种数</text>
    <text x="235" y="106" text-anchor="middle" font-size="12.5" fill="#2b4a6e">l = 0，ans = 0</text>
  </g>
  <path d="M 235 120 L 235 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- r loop -->
  <g filter="url(#rough2)">
    <rect x="80" y="142" width="310" height="46" rx="8" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="235" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">for r = 0 … n − 1</text>
    <text x="235" y="179" text-anchor="middle" font-size="10.5" fill="#999">（r 每轮右移一步）</text>
  </g>
  <path d="M 235 188 L 235 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enter window -->
  <g filter="url(#rough2)">
    <rect x="80" y="210" width="310" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="235" y="234" text-anchor="middle" font-size="12.5" fill="#2b4a6e">入窗：c = word1[r]，cnt[c]++</text>
    <text x="235" y="256" text-anchor="middle" font-size="11" fill="#446688">need[c]&gt;0 且 cnt[c]==need[c] 时 less−−（恰追平）</text>
  </g>
  <path d="M 235 272 L 235 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="235,294 355,342 235,390 115,342" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="235" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a7420">less == 0 ?</text>
    <text x="235" y="356" text-anchor="middle" font-size="10.5" fill="#9a7420">（窗口合法？）</text>
  </g>

  <!-- yes: pop loop -->
  <path d="M 235 390 L 235 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="407" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="40" y="414" width="420" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="436" text-anchor="middle" font-size="12" fill="#665">弹出 d = word1[l]，cnt[d]−−，l++</text>
    <text x="250" y="458" text-anchor="middle" font-size="11" fill="#9a7420">删前若 cnt[d]==need[d]（将跌破）则 less++</text>
  </g>
  <path d="M 42 446 L 28 446 L 28 342 L 108 342" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="310" text-anchor="middle" font-size="10.5" fill="#9a7420" filter="url(#rough2)">继续弹</text>

  <!-- no: accumulate -->
  <path d="M 355 342 L 416 342" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="334" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="420" y="312" width="250" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="545" y="336" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b5a2b">ans += l</text>
    <text x="545" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a">l = 以 r 结尾的合法左端点个数</text>
  </g>
  <path d="M 545 372 L 545 394" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- advance r -->
  <g filter="url(#rough2)">
    <rect x="430" y="398" width="230" height="44" rx="22" fill="#ffffff" stroke="#777" stroke-width="1.5"/>
    <text x="545" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">r++；r &lt; n ?</text>
  </g>
  <path d="M 660 420 L 740 420 L 740 165 L 400 165" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="752" y="295" font-size="11" fill="#666" filter="url(#rough2)">下一轮</text>
  <path d="M 545 442 L 545 462" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="460" font-size="11" fill="#b85450" filter="url(#rough2)">否（扫描结束）</text>

  <!-- end -->
  <g filter="url(#rough2)">
    <rect x="420" y="466" width="250" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="545" y="496" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">返回 ans（long long）</text>
  </g>

  <!-- annotation -->
  <g filter="url(#rough2)">
    <rect x="40" y="522" width="420" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="250" y="548" text-anchor="middle" font-size="11.5" fill="#3a5a3a">每个步骤 O(1)；l 单调前进，全程 ≤ n 步</text>
    <text x="250" y="572" text-anchor="middle" font-size="11.5" fill="#3a5a3a">总时间 O(n + m + Σ)；额外内存 ≈ 200 B</text>
    <text x="250" y="596" text-anchor="middle" font-size="11.5" fill="#3a5a3a">不变量：while 后 [l−1, r] 合法且 [l, r] 不合法</text>
  </g>
</svg>
