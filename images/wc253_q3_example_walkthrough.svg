<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：]]][[[ —— balance 跌至 −3 定 k = 3，首尾两换归位</text>
  <path d="M 150 36 Q 360 46 570 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: balance table -->
  <rect x="40" y="52" width="400" height="246" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 40 78 L 440 78" stroke="#8a8a8a" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 76 52 L 76 298" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 128 52 L 128 298" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 216 52 L 216 298" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 288 52 L 288 298" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <g font-size="11.5" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="70">i</text>
    <text x="102" y="70">字符</text>
    <text x="172" y="70">balance</text>
    <text x="252" y="70">open</text>
    <text x="364" y="70">事件</text>
  </g>
  <!-- highlight row i=2 -->
  <rect x="41" y="142" width="398" height="32" fill="#fce4ec" opacity="0.6" filter="url(#sk)"/>
  <path d="M 40 110 L 440 110" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 142 L 440 142" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 174 L 440 174" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 206 L 440 206" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 238 L 440 238" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 270 L 440 270" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="99">0</text><text x="102" y="99" fill="#b85450" font-weight="bold">]</text><text x="172" y="99">−1</text><text x="252" y="99">0</text><text x="364" y="99">超前 ] #1</text>
    <text x="58" y="131">1</text><text x="102" y="131" fill="#b85450" font-weight="bold">]</text><text x="172" y="131">−2</text><text x="252" y="131">0</text><text x="364" y="131">超前 ] #2</text>
    <text x="58" y="163">2</text><text x="102" y="163" fill="#b85450" font-weight="bold">]</text><text x="172" y="163" font-weight="bold" fill="#b85450">−3</text><text x="252" y="163">0</text><text x="364" y="163" font-weight="bold" fill="#b85450">超前 ] #3（最低点）</text>
    <text x="58" y="195">3</text><text x="102" y="195" fill="#446688" font-weight="bold">[</text><text x="172" y="195">−2</text><text x="252" y="195">1</text><text x="364" y="195">入栈</text>
    <text x="58" y="227">4</text><text x="102" y="227" fill="#446688" font-weight="bold">[</text><text x="172" y="227">−1</text><text x="252" y="227">2</text><text x="364" y="227">入栈</text>
    <text x="58" y="259">5</text><text x="102" y="259" fill="#446688" font-weight="bold">[</text><text x="172" y="259">0</text><text x="252" y="259">3</text><text x="364" y="259">入栈，扫描结束</text>
  </g>
  <text x="240" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">k = −min balance = 3 = open 终值 → 答案 (3+1)/2 = 2</text>

  <!-- Panel B: side notes -->
  <g filter="url(#sk)"><rect x="456" y="52" width="244" height="112" rx="10" fill="#f4f6f8" stroke="#8a99aa" stroke-width="1.4"/></g>
  <text x="578" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#556" filter="url(#sk)">快查另外两例</text>
  <g font-size="11" fill="#445" filter="url(#sk)">
    <text x="470" y="100">][][ ：k = 1 → 1 次，换 (0,3)</text>
    <text x="470" y="120">[]    ：k = 0 → 0 次</text>
    <text x="470" y="146" font-weight="bold" fill="#2f5d25">答案 = ⌈k/2⌉，不是 k</text>
  </g>
  <g filter="url(#sk)"><rect x="456" y="180" width="244" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="578" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a4a42" filter="url(#sk)">⚠ 别数成超前总数 k</text>
  <g font-size="10.5" fill="#5c4512" filter="url(#sk)">
    <text x="470" y="224">]]][[[ 有 3 个超前 ]，</text>
    <text x="470" y="242">但第 1 次交换换来的 [ 会</text>
    <text x="470" y="260">「顺带救活」相邻的超前 ]，</text>
    <text x="470" y="278">所以只需 2 次（⌈3/2⌉）。</text>
  </g>

  <!-- Panel C: construction -->
  <text x="60" y="332" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">构造方案（首尾配对交换）：最左超前 ] ↔ 最右未闭 [，k 每轮 −2</text>

  <!-- stage 1 -->
  <path d="M 69 356 Q 151 322 234 356" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="151" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">① 换 (0, 5)</text>
  <g filter="url(#sk)">
    <rect x="55" y="360" width="28" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="88" y="360" width="28" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="121" y="360" width="28" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="154" y="360" width="28" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="187" y="360" width="28" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="220" y="360" width="28" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="69" y="381">]</text><text x="102" y="381">]</text><text x="135" y="381">]</text>
    <text x="168" y="381">[</text><text x="201" y="381">[</text><text x="234" y="381">[</text>
  </g>
  <text x="151" y="412" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#sk)">k：3 → 1</text>
  <path d="M 254 376 L 280 376" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- stage 2 -->
  <path d="M 365 356 Q 381 326 398 356" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="381" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">② 换 (2, 3)</text>
  <g filter="url(#sk)">
    <rect x="285" y="360" width="28" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="318" y="360" width="28" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="351" y="360" width="28" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="384" y="360" width="28" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="417" y="360" width="28" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="450" y="360" width="28" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="299" y="381">[</text><text x="332" y="381">]</text><text x="365" y="381">]</text>
    <text x="398" y="381">[</text><text x="431" y="381">[</text><text x="464" y="381">]</text>
  </g>
  <text x="381" y="412" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#sk)">k：1 → 0</text>
  <path d="M 484 376 L 510 376" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- stage 3 -->
  <g fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)">
    <path d="M 529 356 Q 545.5 334 562 356"/>
    <path d="M 595 356 Q 611.5 334 628 356"/>
    <path d="M 661 356 Q 677.5 334 694 356"/>
  </g>
  <text x="611" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25" filter="url(#sk)">平衡 ✓</text>
  <g filter="url(#sk)">
    <rect x="515" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="548" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="581" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="614" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="647" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="680" y="360" width="28" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#2f5d25" text-anchor="middle" filter="url(#sk)">
    <text x="529" y="381">[</text><text x="562" y="381">]</text><text x="595" y="381">[</text>
    <text x="628" y="381">]</text><text x="661" y="381">[</text><text x="694" y="381">]</text>
  </g>
  <text x="611" y="412" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">共 2 次 = ⌈3/2⌉</text>

  <text x="360" y="442" text-anchor="middle" font-size="11.5" fill="#8a6d2f" filter="url(#sk)">换来的 [ 与相邻超前 ] 立即配对（「顺带救活」），这正是答案 ⌈k/2⌉ 小于超前总数 k 的原因。</text>
</svg>
