<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：奇数翻倍统一 → 大顶堆贪心折半</text>
  <path d="M 190 34 Q 320 42 450 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="48" width="240" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">预处理：奇数 ×2，全部入大顶堆</text>
  <text x="320" y="86" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">mn ← 堆中最小值</text>

  <g filter="url(#sk)">
    <path d="M 320 95 L 320 101" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="320,104 424,150 320,196 216,150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">堆顶（max）为偶数？</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">还能继续 ÷2 吗</text>

  <g filter="url(#sk)">
    <path d="M 320 197 L 320 221" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="333" y="214" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="200" y="224" width="240" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="251" text-anchor="middle" font-size="12.5" fill="#b07818" filter="url(#sk)">记录 ans ← min(ans, 堆顶 − mn)</text>

  <g filter="url(#sk)">
    <path d="M 320 269 L 320 290" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="200" y="292" width="240" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="315" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">弹出堆顶 mx，v ← mx ÷ 2 放回</text>
  <text x="320" y="337" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#sk)">mn ← min(mn, v)</text>

  <g filter="url(#sk)">
    <path d="M 200 323 L 122 323 L 122 150 L 212 150" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="158" y="315" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">循环</text>

  <g filter="url(#sk)">
    <path d="M 421 150 L 465 150" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="443" y="142" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="470" y="126" width="152" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="546" y="147" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">补记 ans ←</text>
  <text x="546" y="165" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#sk)">min(ans, 堆顶 − mn)</text>

  <g filter="url(#sk)">
    <path d="M 546 175 L 546 196" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="466" y="198" width="158" height="42" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">返回 ans</text>

  <g filter="url(#sk)">
    <rect x="80" y="378" width="480" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">每个中间状态（初始 / 每轮折半后 / 终止态）的偏差都被记录</text>
  <text x="320" y="414" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">每个元素始终停在自身 ÷2 链上 ⟹ 记录值全部真实可达</text>
</svg>
