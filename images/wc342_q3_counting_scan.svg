<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="760" height="390" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">值域只有 [−50, 50]：桶计数 + 从小到大扫描找第 x 小</text>
  <path d="M 190 40 Q 380 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- window -->
  <text x="96" y="72" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">窗口（k = 3）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="96" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="152" y="80" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="66" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−1</text>
  <text x="122" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="178" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">−2</text>

  <!-- arrow window -> buckets -->
  <line x1="212" y1="97" x2="260" y2="97" stroke="#888888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="82" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">只数负数</text>

  <!-- buckets -->
  <text x="481" y="68" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">负数取值桶 cnt[v + 50]（只记 −50 … −1）</text>
  <g filter="url(#rough2)">
    <rect x="270" y="78" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="342" y="78" width="62" height="32" rx="4" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.3" stroke-dasharray="5 4"/>
    <rect x="414" y="78" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="486" y="78" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="558" y="78" width="62" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <rect x="630" y="78" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="301" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−50</text>
  <text x="373" y="99" text-anchor="middle" font-size="12" fill="#999999" filter="url(#rough2)">⋯</text>
  <text x="445" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−4</text>
  <text x="517" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−3</text>
  <text x="589" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="661" y="99" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−1</text>

  <!-- counts -->
  <text x="248" y="128" text-anchor="end" font-size="10.5" fill="#a07820" filter="url(#rough2)">计数：</text>
  <text x="301" y="128" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <text x="373" y="128" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">⋯</text>
  <text x="445" y="128" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <text x="517" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="589" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="661" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07820" filter="url(#rough2)">1</text>

  <!-- scan arrow -->
  <path d="M 285 152 Q 460 160 618 152" stroke="#888888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="146" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">从小到大累加前缀和 cum</text>

  <!-- cum labels -->
  <text x="301" y="180" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">cum=0</text>
  <text x="445" y="180" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <text x="517" y="180" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">1</text>
  <text x="589" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 ≥ x ✓ 停！</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="50" y="206" width="660" height="162" rx="10" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="380" y="234" text-anchor="middle" font-size="12" fill="#444444" filter="url(#rough2)">s(v) = 窗口内值 ≤ v 的元素个数（计数前缀和）</text>
  <text x="380" y="260" text-anchor="middle" font-size="12" fill="#444444" filter="url(#rough2)">第 x 小 = 最小的 v 使 s(v) ≥ x；本题只需在 v ∈ [−50, −1] 里找</text>
  <text x="380" y="286" text-anchor="middle" font-size="12" fill="#444444" filter="url(#rough2)">负数全扫完仍 cum &lt; x → 窗口内负数不足 x 个 → 美丽值 = 0</text>
  <g filter="url(#rough2)">
    <rect x="120" y="304" width="520" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">x = 2：s(−4) = 0，s(−3) = 1 &lt; 2，s(−2) = 2 ≥ 2</text>
  <text x="380" y="343" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">第 2 小 = −2 &lt; 0 → 美丽值 = −2</text>
</svg>
