<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：edges = [[2,4],[0,1],[2,3],[0,2]]</text>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <path d="M 96 104 L 96 176" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 118 190 L 186 190" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 96 212 L 96 282" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 118 190 L 170 262" stroke="#446688" stroke-width="1.8" fill="none"/>

    <circle cx="96" cy="88" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="96" y="94" text-anchor="middle" font-size="13" fill="#a06c10">1</text>
    <circle cx="96" cy="196" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="96" y="202" text-anchor="middle" font-size="13" fill="#446688">0</text>
    <circle cx="202" cy="190" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="202" y="196" text-anchor="middle" font-size="13" fill="#446688">2</text>
    <circle cx="96" cy="296" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="96" y="302" text-anchor="middle" font-size="13" fill="#a06c10">3</text>
    <circle cx="182" cy="274" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="182" y="280" text-anchor="middle" font-size="13" fill="#446688">4</text>

    <text x="118" y="70" text-anchor="middle" font-size="11" fill="#777">w = 1</text>
    <text x="60" y="150" text-anchor="middle" font-size="11" fill="#777">w = 2</text>
    <text x="150" y="178" text-anchor="middle" font-size="11" fill="#777">w = 2</text>
    <text x="52" y="256" text-anchor="middle" font-size="11" fill="#777">w = 1</text>
    <text x="216" y="248" text-anchor="middle" font-size="11" fill="#777">w = 2</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="266" y="52" width="292" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="316" y="72" fill="#446688">起点 i</text>
    <text x="412" y="72" fill="#446688">最远路径与耗时</text>
    <text x="518" y="72" fill="#446688">times[i]</text>

    <rect x="266" y="84" width="292" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="316" y="103">0</text>
    <text x="412" y="103" fill="#666">0→2→4：2+2 = 4</text>
    <text x="518" y="103" font-weight="bold">4</text>

    <rect x="266" y="114" width="292" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="316" y="133">1</text>
    <text x="412" y="133" fill="#666">1→0→2→4：2+2+2 = 6</text>
    <text x="518" y="133" font-weight="bold" fill="#2d5a22">6</text>

    <rect x="266" y="144" width="292" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="316" y="163">2</text>
    <text x="412" y="163" fill="#666">2→0→1：2+1 = 3</text>
    <text x="518" y="163" font-weight="bold">3</text>

    <rect x="266" y="174" width="292" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="316" y="193">3</text>
    <text x="412" y="193" fill="#666">3→2→0→1：2+2+1 = 5</text>
    <text x="518" y="193" font-weight="bold">5</text>

    <rect x="266" y="204" width="292" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5"/>
    <text x="316" y="223">4</text>
    <text x="412" y="223" fill="#666">4→2→0→1：2+2+1 = 5</text>
    <text x="518" y="223" font-weight="bold">5</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="330" width="470" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="76" y="354" fill="#a06c10">输出 [4, 6, 3, 5, 5]。注意起点自身不计 w，它的时刻固定为 0</text>
    <text x="76" y="374" fill="#666">换根时只需把「父 → 子」的 w(parent) 加到父侧最长路径上</text>
  </g>
</svg>
