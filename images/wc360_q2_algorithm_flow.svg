<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">O(1) 公式流程</text>

  <rect x="185" y="48" width="150" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">输入 n, target</text>

  <path d="M 260,82 L 260,100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="165" y="104" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">half = ⌊target / 2⌋</text>

  <path d="M 260,140 L 260,152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,154 350,196 260,238 170,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">n ≤ half ?</text>
  <text x="260" y="209" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">（前缀装得下吗）</text>

  <text x="148" y="188" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 170,196 L 118,196 L 118,260" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="380" y="188" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">否</text>
  <path d="M 350,196 L 402,196 L 402,254" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="30" y="262" width="180" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="284" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">ans = n(n+1)/2</text>
  <text x="120" y="304" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（取 1..n 即可）</text>

  <rect x="300" y="256" width="204" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="276" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">k = n − half</text>
  <text x="402" y="294" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">ans = half(half+1)/2</text>
  <text x="402" y="312" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">+ k·target + k(k−1)/2</text>

  <path d="M 120,316 L 120,339 L 156,339" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 402,328 L 402,339 L 364,339" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="160" y="322" width="200" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 ans mod (10⁹+7)</text>
</svg>
