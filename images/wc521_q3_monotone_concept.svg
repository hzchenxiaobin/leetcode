<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">核心观察：① 违规可遗传 ⇒ 滑窗；② 正值 ⇒「和」最大 ⇒ 新元素只有两种违规形态</text>

  <!-- ① 遗传性 -->
  <text x="30" y="58" font-size="12.5" fill="#446688" filter="url(#rough2)">① 遗传性：窗口含违规三元组则无效，扩得更大仍无效，缩到丢掉它才有效</text>

  <!-- 第一行：[2,3,5,3] 无效 -->
  <rect x="110" y="72" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="133" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="156" y="72" width="46" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="202" y="72" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="225" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="248" y="72" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="271" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <path d="M133,118 Q179,136 225,118" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="179" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 + 3 = 5 ✗</text>

  <text x="316" y="88" font-size="12" fill="#b85450" filter="url(#rough2)">[2,3,5,3] 无效</text>
  <text x="316" y="106" font-size="10.5" fill="#888" filter="url(#rough2)">下标 0,1,2 的 2+3=5 仍在其中</text>

  <!-- 缩窗箭头 -->
  <path d="M280,158 L280,184" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="176" font-size="11" fill="#666" filter="url(#rough2)">缩窗丢掉 2</text>

  <!-- 第二行：[3,5] 有效 -->
  <rect x="156" y="192" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="217" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="202" y="192" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="217" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="316" y="208" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[3,5] 有效</text>
  <text x="316" y="226" font-size="10.5" fill="#888" filter="url(#rough2)">不再含任何违规三元组</text>

  <text x="30" y="258" font-size="12" fill="#446688" filter="url(#rough2)">⇒ 每个左端点 l 的最大有效右端点 R(l) 单调不减 ⇒ 双指针（滑窗）适用</text>

  <!-- ② 正值 ⇒ 和最大 -->
  <text x="30" y="290" font-size="12.5" fill="#b85450" filter="url(#rough2)">② nums[i] ≥ 1：a + b = c 中 c 严格最大 ⇒ 新入窗的 x 只有两种违规角色</text>

  <!-- 形态 A -->
  <rect x="25" y="304" width="248" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="149" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">形态 A：x 是「和」（最大者）</text>
  <text x="83" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">窗口内（互异下标）</text>
  <text x="167" y="344" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">新入窗</text>
  <rect x="47" y="350" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="372" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="83" y="350" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="372" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="149" y="350" width="36" height="34" rx="4" fill="#fff" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="167" y="372" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">x=5</text>
  <text x="149" y="404" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3 + 2 = 5 = x ✗</text>
  <text x="149" y="418" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">检查 A：窗口内是否有互异下标对 a + b = x</text>

  <!-- 形态 B -->
  <rect x="287" y="304" width="248" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="411" y="326" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">形态 B：x 是「加数」</text>
  <text x="345" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">窗口内</text>
  <text x="429" y="344" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">新入窗</text>
  <rect x="309" y="350" width="36" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327" y="372" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="345" y="350" width="36" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="372" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="411" y="350" width="36" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="429" y="372" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x=2</text>
  <text x="411" y="404" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2 + 3 = 5 ✗（5 在窗口中）</text>
  <text x="411" y="418" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">检查 B：窗口内是否有 b, c 使 x + b = c</text>

  <text x="280" y="448" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">窗口 [l, r−1] 本身有效 ⇒ 新违规必含 r ⇒ 检查 A / B 完备，各 O(V)</text>
</svg>
