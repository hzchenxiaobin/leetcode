<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">单调队列：存下标、charge 递减，队头即窗口 max</text>

  <!-- charge 数组 -->
  <text x="60" y="58" font-size="13" fill="#888" filter="url(#rough2)">chargeTimes：</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="160" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="368" y="44" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="186" y="66">3</text>
    <text x="238" y="66" fill="#1a2b45" font-weight="bold">6</text>
    <text x="290" y="66">1</text>
    <text x="342" y="66">3</text>
    <text x="394" y="66">4</text>
    <text x="186" y="92" font-size="11" fill="#888">i=0</text>
    <text x="238" y="92" font-size="11" fill="#888">i=1</text>
    <text x="290" y="92" font-size="11" fill="#888">i=2</text>
    <text x="342" y="92" font-size="11" fill="#888">i=3</text>
    <text x="394" y="92" font-size="11" fill="#888">i=4</text>
  </g>

  <!-- 入队弹尾示意 -->
  <text x="60" y="126" font-size="13.5" fill="#333" filter="url(#rough2)">r = 1 入队：弹出所有 ≤ 6 的队尾（3 被 6 支配）：</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="140" width="52" height="34" fill="#eee" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <text x="146" y="162" fill="#999">3</text>
    <path d="M 180 150 L 208 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="194" y="140" font-size="11.5" fill="#b85450">弹出</text>
    <rect x="214" y="140" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="240" y="162" fill="#b85450" font-weight="bold">6</text>
  </g>
  <text x="310" y="162" font-size="12.5" fill="#888" filter="url(#rough2)">被弹的老元素更左且更小，</text>
  <text x="310" y="180" font-size="12.5" fill="#888" filter="url(#rough2)">未来任何窗口里都当不了 max</text>

  <!-- 队列状态 -->
  <text x="60" y="222" font-size="13.5" fill="#333" filter="url(#rough2)">r = 2、3、4 依次入队后的队列（值递减）：</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="236" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="146" y="258" fill="#b85450" font-weight="bold">6</text>
    <rect x="176" y="236" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="202" y="258">1</text>
    <rect x="232" y="236" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="258" y="258">3</text>
    <rect x="288" y="236" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="314" y="258">4</text>
    <text x="146" y="282" font-size="11" fill="#b85450">队头=max</text>
    <text x="314" y="282" font-size="11" fill="#888">队尾</text>
  </g>
  <path d="M 110 253 L 92 253" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="258" font-size="12.5" fill="#888" filter="url(#rough2)">下标严格递增</text>

  <!-- 左端出窗弹头 -->
  <text x="60" y="318" font-size="13.5" fill="#333" filter="url(#rough2)">left 越过队头下标时弹头（窗口收缩）：</text>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <rect x="120" y="330" width="52" height="34" fill="#eee" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <text x="146" y="352" fill="#999">6</text>
    <path d="M 180 340 L 208 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="194" y="330" font-size="11.5" fill="#b85450">弹出</text>
    <rect x="214" y="330" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="352">1</text>
    <rect x="270" y="330" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="296" y="352">3</text>
  </g>
  <text x="360" y="352" font-size="12.5" fill="#888" filter="url(#rough2)">越界者必在队头（下标递增保证）</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="384" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="407" text-anchor="middle" font-size="13.5" fill="#1d3a17" filter="url(#rough2)">每个下标至多入队一次、出队一次 → 窗口 max 总代价 O(n)</text>
</svg>
