<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="450" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">冠军 = DAG 的源点：入度为 0 的节点</text>
  <path d="M 210 40 Q 350 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== 左：示例 2 ====== -->
  <text x="195" y="72" text-anchor="middle" font-size="13" fill="#666">示例 2：n=4, edges=[[0,2],[1,3],[1,2]]</text>

  <!-- edges -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 149 130 L 258 130" marker-end="url(#ar)"/>
    <path d="M 149 230 L 258 230" marker-end="url(#ar)"/>
    <path d="M 146 216 L 264 146" marker-end="url(#ar)"/>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="130" cy="130" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="130" cy="230" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="280" cy="130" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="280" cy="230" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="130" y="136">0</text>
    <text x="130" y="236">1</text>
    <text x="280" y="136">2</text>
    <text x="280" y="236">3</text>
  </g>
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <text x="130" y="166" fill="#2e6e2e" font-weight="bold">入度 0</text>
    <text x="130" y="266" fill="#2e6e2e" font-weight="bold">入度 0</text>
    <text x="280" y="166" fill="#666">入度 2</text>
    <text x="280" y="266" fill="#666">入度 1</text>
  </g>

  <!-- 源点圈注 -->
  <g filter="url(#sk)">
    <rect x="96" y="108" width="68" height="144" rx="12" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="130" y="292" text-anchor="middle" font-size="12" fill="#4a8e4a" filter="url(#sk)">两个源点（无人指向）</text>

  <g filter="url(#sk)">
    <rect x="40" y="302" width="310" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="195" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">两个源点 0、1 → 冠军不唯一 → 返回 -1</text>

  <!-- ====== 右：示例 1 ====== -->
  <text x="540" y="72" text-anchor="middle" font-size="13" fill="#666">示例 1：n=3, edges=[[0,1],[1,2]]</text>

  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 479 130 L 570 130" marker-end="url(#ar)"/>
    <path d="M 590 149 L 590 208" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="460" cy="130" r="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="590" cy="130" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="590" cy="230" r="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="460" y="136">0</text>
    <text x="590" y="136">1</text>
    <text x="590" y="236">2</text>
  </g>
  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <text x="460" y="166" fill="#2e6e2e" font-weight="bold">入度 0</text>
    <text x="622" y="136" fill="#666">入度 1</text>
    <text x="590" y="266" fill="#666">入度 1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="426" y="108" width="68" height="144" rx="12" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="460" y="292" text-anchor="middle" font-size="12" fill="#4a8e4a" filter="url(#sk)">唯一源点</text>

  <g filter="url(#sk)">
    <rect x="400" y="302" width="270" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="535" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">唯一源点 0 → 唯一冠军 → 返回 0</text>

  <!-- ====== 底部：两条关键洞察 ====== -->
  <g filter="url(#sk)">
    <rect x="30" y="356" width="312" height="82" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="186" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">冠军集合 = { v : 入度(v) = 0 }</text>
  <text x="46" y="402" font-size="12" fill="#444">入度 &gt; 0 ⇒ 被直接压制，出局</text>
  <text x="46" y="422" font-size="12" fill="#444">恰好 1 个候选 → 返回它；≥ 2 个 → -1</text>

  <g filter="url(#sk)">
    <rect x="362" y="356" width="308" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="516" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a">间接压制也不用怕</text>
  <text x="378" y="402" font-size="12" fill="#444">b 经路径强于 a ⇒ 路径最后一条边落在 a 上</text>
  <text x="378" y="422" font-size="12" fill="#444">⇒ 入度 0 连间接压制一起排除</text>
</svg>
