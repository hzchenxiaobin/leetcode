<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">数位 DP 状态：(pos, prev, tight, started)</text>
  <rect x="40" y="60" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115.0" y="99.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos：当前枚举到的数位</text>
  <rect x="200" y="60" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="275.0" y="99.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prev：上一位数字 (0..9)</text>
  <rect x="360" y="60" width="130" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425.0" y="99.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">tight：是否贴住上界</text>
  <rect x="40" y="160" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115.0" y="199.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">started：是否已出现非零位</text>
  <rect x="230" y="160" width="250" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="355.0" y="199.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">转移：枚下一位 d，要求 |d−prev| ≤ k</text>
  <path d="M190,195 L228,195" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">答案 = f(r) − f(l−1)，f(x) 统计 [1,x] 的好整数</text>
  <rect x="40" y="290" width="450" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="308" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">前导零不计入「相邻数位」：started=false 时跳过差值判断；</text>
  <text x="52" y="323" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">位数 ≤ 16、prev 11 种、tight/started 各 2 种 → 状态数约 700。</text>
</svg>
