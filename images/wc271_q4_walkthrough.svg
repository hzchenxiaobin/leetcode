<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="axg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888888"/>
    </marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="505" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：startPos = 5，k = 4</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">fruits = [[0,9],[4,1],[5,7],[6,2],[7,4],[10,9]] —— 最优：先左 1 步到 4，折返向右 3 步到 7，共 4 步摘 14 个</text>

  <path d="M 306 122 L 352 122" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="330" y="114" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">① 左 1 步</text>
  <path d="M 300 104 L 484 104" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#agr)" filter="url(#sk)"/>
  <text x="392" y="96" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">② 折返向右 3 步</text>

  <path d="M 60 150 L 660 150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#axg)" filter="url(#sk)"/>
  <line x1="60" y1="144" x2="60" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="120" y1="144" x2="120" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="180" y1="144" x2="180" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="240" y1="144" x2="240" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="300" y1="144" x2="300" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="360" y1="144" x2="360" y2="156" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <line x1="420" y1="144" x2="420" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="480" y1="144" x2="480" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="540" y1="144" x2="540" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="600" y1="144" x2="600" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <line x1="660" y1="144" x2="660" y2="156" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>

  <circle cx="60" cy="150" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="60" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">9</text>
  <circle cx="300" cy="150" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="300" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">1</text>
  <circle cx="360" cy="150" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="360" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">7</text>
  <circle cx="420" cy="150" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="420" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">2</text>
  <circle cx="480" cy="150" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="480" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">4</text>
  <circle cx="660" cy="150" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="660" y="154" text-anchor="middle" font-size="10" font-weight="bold" fill="#b06a10" filter="url(#sk)">9</text>

  <text x="60" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="120" y="170" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">1</text>
  <text x="180" y="170" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">2</text>
  <text x="240" y="170" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">3</text>
  <text x="300" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="360" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#sk)">5</text>
  <text x="420" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#sk)">6</text>
  <text x="480" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#333" filter="url(#sk)">7</text>
  <text x="540" y="170" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">8</text>
  <text x="600" y="170" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#sk)">9</text>
  <text x="660" y="170" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="360" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">↑ s = startPos（起点就在水果上）</text>

  <path d="M 300 192 L 300 200 M 300 196 L 480 196 M 480 192 L 480 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="390" y="214" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">覆盖 [4, 7]，代价 min(2·1+2, 1+2·2) = 4 ≤ k ✓</text>

  <rect x="40" y="232" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#sk)"/>
  <rect x="95" y="232" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#sk)"/>
  <rect x="150" y="232" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#sk)"/>
  <rect x="330" y="232" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#sk)"/>
  <rect x="520" y="232" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#sk)"/>
  <text x="67" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">i</text>
  <text x="122" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">p_i</text>
  <text x="240" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">情形与关键量</text>
  <text x="425" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">二分：最大 j（cost ≤ 4）</text>
  <text x="600" y="249" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">候选区间和</text>

  <rect x="40" y="258" width="640" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="67" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">0</text>
  <text x="122" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">0</text>
  <text x="240" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">整段在左：a = 5</text>
  <text x="425" y="276" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#sk)">无（cost(0,0) = 5 &gt; 4）</text>
  <text x="600" y="276" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">— 跳过</text>

  <rect x="40" y="286" width="640" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#sk)"/>
  <text x="67" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="122" y="304" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">4</text>
  <text x="240" y="304" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">跨两侧：a = 1，b = 2</text>
  <text x="425" y="304" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">j = 4（cost 4 ✓；j=5 时 7 ✗）</text>
  <text x="600" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1+7+2+4 = 14</text>

  <rect x="40" y="314" width="640" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="67" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2</text>
  <text x="122" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">5</text>
  <text x="240" y="332" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">p_i = s：cost(2,j) = p_j − 5</text>
  <text x="425" y="332" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">j = 4（cost 2 ✓；j=5 时 5 ✗）</text>
  <text x="600" y="332" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">7+2+4 = 13</text>

  <rect x="40" y="342" width="640" height="28" fill="#f6f8f4" stroke="#ccc" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="67" y="360" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">3</text>
  <text x="122" y="360" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">6</text>
  <text x="240" y="360" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">整段在右：cost(3,j) = p_j − 5</text>
  <text x="425" y="360" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">j = 4（cost 2 ✓；j=5 时 5 ✗）</text>
  <text x="600" y="360" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">2+4 = 6</text>

  <rect x="40" y="370" width="640" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="67" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">4</text>
  <text x="122" y="388" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">7</text>
  <text x="240" y="388" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">整段在右：cost(4,j) = p_j − 5</text>
  <text x="425" y="388" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">j = 4（cost 2 ✓；j=5 时 5 ✗）</text>
  <text x="600" y="388" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">4</text>

  <rect x="40" y="398" width="640" height="28" fill="#f6f8f4" stroke="#ccc" stroke-width="1" rx="3" filter="url(#sk)"/>
  <text x="67" y="416" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">5</text>
  <text x="122" y="416" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">10</text>
  <text x="240" y="416" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">整段在右：p = 10 太远</text>
  <text x="425" y="416" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#sk)">无（cost(5,5) = 5 &gt; 4）</text>
  <text x="600" y="416" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">— 跳过</text>

  <rect x="60" y="440" width="600" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="360" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 14：i = 1 行胜出 —— 先左 1 步到 4，再右 3 步到 7（2a + b = 4）</text>
  <text x="360" y="476" text-anchor="middle" font-size="9.5" fill="#4a6a4a" filter="url(#sk)">路径还原：5（摘7）→ 4（摘1）→ 6（摘2）→ 7（摘4）；示例 1 同法得 9（右侧 6..8），示例 3 全部跳过得 0</text>

  <text x="360" y="496" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">i = 0 与 i = 5 展示「二分落空即跳过」；全部不可达时答案自然为 0 —— 无需任何特判</text>
</svg>
