  </g>
  <text x="575" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">递推公式：O(1) 算一个 mask</text>
  <text x="424" y="113" font-size="11.5" fill="#2b4666" filter="url(#rough2)">low = mask &amp; (−mask)　　// 最低位 1</text>
  <text x="424" y="131" font-size="11.5" fill="#2b4666" filter="url(#rough2)">i = low 的下标（bit i ↔ nums[i]）</text>
  <text x="424" y="149" font-size="11.5" fill="#2b4666" filter="url(#rough2)">f[mask] = f[mask ^ low] | nums[i]</text>
  <text x="424" y="170" font-size="10.5" fill="#567" filter="url(#rough2)">mask ^ low 去掉最低位 1——前驱一定先算好，</text>
  <text x="424" y="181" font-size="10.5" fill="#567" filter="url(#rough2)">故按 mask 从小到大扫一遍即成</text>

  <g filter="url(#rough2)">
    <rect x="410" y="200" width="330" height="102" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="575" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">两个具体算例</text>
  <text x="424" y="244" font-size="11" fill="#444" filter="url(#rough2)">mask=1011：low=0001,i=0</text>
  <text x="628" y="244" font-size="11" fill="#444" filter="url(#rough2)">f[1010]=7 → 7|3=7 ✓</text>
  <text x="424" y="264" font-size="11" fill="#444" filter="url(#rough2)">mask=1100：low=0100,i=2</text>
  <text x="628" y="264" font-size="11" fill="#444" filter="url(#rough2)">f[1000]=5 → 5|1=5 ✗</text>
  <text x="424" y="288" font-size="10.5" fill="#567" filter="url(#rough2)">对照：{1,5} 含 5 点亮了位 2，但位 1（值 2）</text>
  <text x="424" y="299" font-size="10.5" fill="#567" filter="url(#rough2)">没人点亮，OR = 101₂ = 5 追不上 7</text>

  <g filter="url(#rough2)">
    <rect x="410" y="322" width="330" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="575" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">汇总：命中 6 个，答案 6</text>
  <text x="424" y="369" font-size="11" fill="#3a5c2e" filter="url(#rough2)">· {3,5}、{2,5}、{3,2,5}、{3,1,5}、{2,1,5}、</text>
  <text x="424" y="387" font-size="11" fill="#3a5c2e" filter="url(#rough2)">  {3,2,1,5} —— 全部含 5</text>
  <text x="424" y="411" font-size="10.5" fill="#567" filter="url(#rough2)">· 规律（仅对本组数据成立）：位 2 只有 5 能</text>
  <text x="424" y="422" font-size="10.5" fill="#567" filter="url(#rough2)">  点亮，命中子集必须含 5——通用解法仍全枚举</text>

  <g filter="url(#rough2)">
    <rect x="410" y="446" width="330" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="575" y="469" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">n=16 规模核算</text>
  <text x="424" y="491" font-size="11" fill="#444" filter="url(#rough2)">2¹⁶ = 65536 个 mask × 每个 O(1) → 毫秒级</text>

  <text x="390" y="545" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">自检锚点：f[1111] 必须等于 maxOR（全员 OR 就是递推终点）；</text>
  <text x="390" y="562" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">若计数为 0，大概率是 maxOR 求错（比如先入为主把 max(nums) 当成了 maxOR）。</text>
</svg>
