<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="640" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：筛 spf → 值域并查集 → 排序 → 逐位验根</text>
  <path d="M 100 36 Q 260 44 420 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <rect x="130" y="52" width="260" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">输入 nums（n ≤ 3×10⁴，值 ≤ 10⁵）</text>
  <path d="M260,86 L260,104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="90" y="108" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 埃氏筛求最小质因子 spf[2..M]</text>
  <text x="260" y="143" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">M = max(nums)，单次分解降到 O(log x)</text>
  <path d="M260,152 L260,170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="90" y="174" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 并查集初始化 parent[i] = i，i ∈ [0, M]</text>
  <text x="260" y="207" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">数值即下标：值与质因子共用一套</text>
  <path d="M260,214 L260,232" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="70" y="236" width="380" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">③ 对每个 x：v = x，while v &gt; 1：</text>
  <text x="260" y="273" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">p = spf[v] → union(x, p) → 把 v 中的 p 一次性除尽</text>
  <path d="M260,292 L260,310" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="90" y="314" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">④ target = sorted(nums)</text>
  <text x="260" y="347" text-anchor="middle" font-size="10.5" fill="#667" filter="url(#rough2)">排序给出每个位置的「目标值」</text>
  <path d="M260,354 L260,372" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,376 402,444 260,512 118,444" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⑤ 对每个 i：</text>
  <text x="260" y="450" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">find(nums[i]) = find(target[i])</text>
  <text x="260" y="468" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">全部成立吗？</text>

  <!-- true branch -->
  <path d="M118,444 L100,444 L100,516" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="436" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="520" width="140" height="44" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="538" text-anchor="middle" font-size="12" fill="#2d5a24" filter="url(#rough2)">返回 true</text>
  <text x="100" y="554" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（可排序）</text>

  <!-- false branch -->
  <path d="M402,444 L420,444 L420,516" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="436" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="350" y="520" width="140" height="44" rx="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="538" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 false</text>
  <text x="420" y="554" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（存在跨分量错位）</text>

  <!-- bottom note -->
  <rect x="16" y="582" width="488" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="600" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">并查集按「数值」建：find 查的是值所属的分量</text>
  <text x="260" y="618" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">交换是否合法只看两个「值」的 gcd，与下标无关 —— 这是正确性证明的关键</text>
</svg>
