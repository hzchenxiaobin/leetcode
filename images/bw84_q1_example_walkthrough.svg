<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：价值 7 只在 items2 出现，单边物品直接进结果</text>

  <!-- 输入 -->
  <text x="90" y="62" font-size="13.5" fill="#333" filter="url(#rough2)">items1 = [[1,3], [2,2]]</text>
  <text x="330" y="62" font-size="13.5" fill="#333" filter="url(#rough2)">items2 = [[7,1], [2,2], [1,4]]</text>

  <!-- 累加表格 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <rect x="120" y="86" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="86" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="86" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="165" y="108">1</text><text x="255" y="108">2</text><text x="345" y="108">7</text>
    <rect x="120" y="120" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="210" y="120" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="300" y="120" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="165" y="142" fill="#1d3a17" font-weight="bold">3+4=7</text>
    <text x="255" y="142" fill="#1d3a17" font-weight="bold">2+2=4</text>
    <text x="345" y="142" fill="#1d3a17" font-weight="bold">0+1=1</text>
  </g>
  <text x="440" y="140" font-size="12" fill="#b85450" filter="url(#rough2)">7 在 items1 中</text>
  <text x="440" y="158" font-size="12" fill="#b85450" filter="url(#rough2)">无贡献，记 0</text>

  <!-- 排序输出 -->
  <path d="M 255 162 L 255 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="106" y="200" width="298" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="255" y="229" text-anchor="middle" font-size="14.5" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">ret = [[1,7], [2,4], [7,1]]</text>

  <!-- 三种情形小结 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60"  y="270" width="150" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="135" y="294">两数组都有该价值：</text>
    <text x="135" y="314">重量相加</text>
    <rect x="205" y="270" width="150" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="294">只有 items1 有：</text>
    <text x="280" y="314">原重量保留</text>
    <rect x="350" y="270" width="150" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="425" y="294">只有 items2 有：</text>
    <text x="425" y="314">同样保留</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="350" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">哈希表 + 排序键只需「价值」，重量永远只做加法，和 ≤ 2000 无溢出风险。</text>
</svg>
