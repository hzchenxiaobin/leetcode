<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">示例 2 演算：n = 6，每侧恰好保留 3 个</text>
  <path d="M 130 40 Q 260 47 390 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="86" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">nums1</text>
  <rect x="112" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="126" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <rect x="144" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="158" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="176" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="190" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <rect x="208" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="222" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <rect x="240" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="254" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <rect x="272" y="68" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="286" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">6</text>

  <text x="60" y="124" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">nums2</text>
  <rect x="112" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="126" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="144" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="158" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <rect x="176" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="190" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="208" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="222" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <rect x="240" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="254" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="272" y="106" width="28" height="26" rx="4" fill="#eef2f7" stroke="#8895a6" stroke-width="1.4" filter="url(#sk)"/>
  <text x="286" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>

  <text x="60" y="160" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">① 去重三分</text>
  <rect x="112" y="144" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="126" y="162" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">1</text>
  <rect x="144" y="144" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="158" y="162" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">4</text>
  <rect x="176" y="144" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="190" y="162" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">5</text>
  <rect x="208" y="144" width="28" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="222" y="162" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">6</text>
  <rect x="244" y="144" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="258" y="162" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">2</text>
  <rect x="276" y="144" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="290" y="162" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">3</text>
  <rect x="308" y="144" width="28" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="322" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">∅</text>
  <text x="366" y="161" font-size="11.5" fill="#555" filter="url(#sk)">o₁=4  c=2  o₂=0  n/2=3</text>

  <text x="60" y="202" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">② 名额分配（独占优先）</text>
  <text x="60" y="232" font-size="11" fill="#446688" filter="url(#sk)">nums1</text>
  <rect x="112" y="214" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="127" y="233" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">1</text>
  <rect x="146" y="214" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="161" y="233" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">4</text>
  <rect x="180" y="214" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="195" y="233" text-anchor="middle" font-size="12" fill="#33506e" font-weight="bold" filter="url(#sk)">5</text>
  <text x="226" y="233" font-size="11" fill="#555" filter="url(#sk)">独占值₁ 占满 3 个名额，值 6 被舍弃</text>

  <text x="60" y="266" font-size="11" fill="#4a7a3a" filter="url(#sk)">nums2</text>
  <rect x="112" y="248" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="127" y="267" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">2</text>
  <rect x="146" y="248" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="161" y="267" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#sk)">3</text>
  <rect x="180" y="248" width="30" height="28" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="195" y="267" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">·</text>
  <text x="226" y="267" font-size="11" fill="#555" filter="url(#sk)">公共值 2、3 落入空名额 r₂ = 3</text>

  <rect x="88" y="296" width="344" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="260" y="322" text-anchor="middle" font-size="15" fill="#2f5a25" font-weight="bold" filter="url(#sk)">s = {1, 2, 3, 4, 5}</text>
  <text x="260" y="348" text-anchor="middle" font-size="12.5" fill="#2f5a25" filter="url(#sk)">ans = 3 + 0 + min(2, 0 + 3)</text>
  <text x="260" y="372" text-anchor="middle" font-size="12.5" fill="#2f5a25" font-weight="bold" filter="url(#sk)">= 5 ✓（值 6 败给名额：o₁ &gt; n/2）</text>
</svg>
