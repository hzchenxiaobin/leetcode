<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：降阶乘 (n)j 在 j &gt; n 时自动变成 0</text>
  <path d="M 130 42 Q 380 48 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="76" font-size="13" fill="#2f4a66" filter="url(#rough2)">取 n = 4 看容斥求和 Σ (−1)j · (4)j ：</text>

  <!-- 符号行 -->
  <text x="71" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="145" y="112" text-anchor="middle" font-size="15" fill="#a14340" filter="url(#rough2)">−</text>
  <text x="219" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="293" y="112" text-anchor="middle" font-size="15" fill="#a14340" filter="url(#rough2)">−</text>
  <text x="367" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="441" y="112" text-anchor="middle" font-size="15" fill="#a14340" filter="url(#rough2)">−</text>
  <text x="515" y="112" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">+</text>
  <text x="589" y="112" text-anchor="middle" font-size="15" fill="#a14340" filter="url(#rough2)">−</text>

  <!-- 八个格子 -->
  <rect x="40" y="122" width="62" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="71" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4)0</text>
  <text x="71" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>

  <rect x="114" y="122" width="62" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4)1</text>
  <text x="145" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>

  <rect x="188" y="122" width="62" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4)2</text>
  <text x="219" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">12</text>

  <rect x="262" y="122" width="62" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="293" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4)3</text>
  <text x="293" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">24</text>

  <rect x="336" y="122" width="62" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="367" y="144" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4)4</text>
  <text x="367" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">24</text>

  <rect x="410" y="122" width="62" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="441" y="144" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">(4)5</text>
  <text x="441" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a37" filter="url(#rough2)">0</text>

  <rect x="484" y="122" width="62" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="515" y="144" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">(4)6</text>
  <text x="515" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a37" filter="url(#rough2)">0</text>

  <rect x="558" y="122" width="62" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="589" y="144" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">(4)7</text>
  <text x="589" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a37" filter="url(#rough2)">0</text>

  <text x="676" y="150" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">… 全 0</text>

  <!-- 说明：为什么是 0 -->
  <rect x="40" y="196" width="580" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="12" fill="#8f3a37" filter="url(#rough2)">(4)5 = 4·3·2·1·0 ：链条里出现了因子 (4 − 4) = 0，此后整条链恒为 0。</text>
  <text x="56" y="234" font-size="12" fill="#8f3a37" filter="url(#rough2)">所以 j &gt; n 的项可以直接保留在式子里 —— 它们自己就是 0，不需要任何“截断开关”。</text>

  <!-- 箭头到结论 -->
  <path d="M 330 242 V 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="268" width="640" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">G(4) = 1 − 4 + 12 − 24 + 24 − 0 + 0 − … = 9，再乘 (−1)⁴ = 1，得 D(4) = 9</text>
  <text x="380" y="316" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">定长求和是恒等式：对每个 2 ≤ n ≤ k 都精确相等，没有任何舍入误差</text>
  <text x="380" y="336" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">每个 j 只写一个因子，且长度只与 K 有关 —— 与 n 无关</text>

  <!-- 对比 -->
  <rect x="60" y="362" width="640" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">对照：另一条常见路线 round(n! / e)</text>
  <text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">n! 要用 49 个“指示器”因子 n! = Π(1 + [n ≥ i]·(n − i))，1/e 要用 50 层级数，</text>
  <text x="380" y="426" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">总长约 9.3k 字符，还必须先证明误差 &lt; 1/2；本文的构造只要约 3.2k 字符且零误差。</text>
</svg>
