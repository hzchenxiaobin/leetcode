<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：n = 4, m = 2, k = 2</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666">C(3,2) 种标记 × 每种标记 m·(m−1)<tspan dy="-5" font-size="9">1</tspan><tspan dy="5"> = 2 个数组</tspan></text>

  <!-- 第 1 行：= = ≠ → [1,1,1,2] 与 [2,2,2,1] -->
  <g filter="url(#sk)">
    <rect x="36" y="72" width="114" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="93" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">=  =  ≠</text>
  <g filter="url(#sk)">
    <rect x="170" y="72" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="222" y="72" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="274" y="72" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="326" y="72" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="380" y="72" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="432" y="72" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="484" y="72" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="536" y="72" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="187" y="95" fill="#2b6e9e">1</text>
    <text x="239" y="95" fill="#2b6e9e">1</text>
    <text x="291" y="95" fill="#2b6e9e">1</text>
    <text x="343" y="95" fill="#7a5415">2</text>
    <text x="397" y="95" fill="#7a5415">2</text>
    <text x="449" y="95" fill="#7a5415">2</text>
    <text x="501" y="95" fill="#7a5415">2</text>
    <text x="553" y="95" fill="#2b6e9e">1</text>
  </g>

  <!-- 第 2 行：= ≠ = → [1,1,2,2] 与 [2,2,1,1] -->
  <g filter="url(#sk)">
    <rect x="36" y="128" width="114" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="93" y="151" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">=  ≠  =</text>
  <g filter="url(#sk)">
    <rect x="170" y="128" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="222" y="128" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="274" y="128" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="326" y="128" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="380" y="128" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="432" y="128" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="484" y="128" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="536" y="128" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="187" y="151" fill="#2b6e9e">1</text>
    <text x="239" y="151" fill="#2b6e9e">1</text>
    <text x="291" y="151" fill="#7a5415">2</text>
    <text x="343" y="151" fill="#7a5415">2</text>
    <text x="397" y="151" fill="#7a5415">2</text>
    <text x="449" y="151" fill="#7a5415">2</text>
    <text x="501" y="151" fill="#2b6e9e">1</text>
    <text x="553" y="151" fill="#2b6e9e">1</text>
  </g>

  <!-- 第 3 行：≠ = = → [1,2,2,2] 与 [2,1,1,1] -->
  <g filter="url(#sk)">
    <rect x="36" y="184" width="114" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="93" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">≠  =  =</text>
  <g filter="url(#sk)">
    <rect x="170" y="184" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="222" y="184" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="274" y="184" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="326" y="184" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="380" y="184" width="34" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="432" y="184" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="484" y="184" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="536" y="184" width="34" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="14" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="187" y="207" fill="#2b6e9e">1</text>
    <text x="239" y="207" fill="#7a5415">2</text>
    <text x="291" y="207" fill="#7a5415">2</text>
    <text x="343" y="207" fill="#7a5415">2</text>
    <text x="397" y="207" fill="#7a5415">2</text>
    <text x="449" y="207" fill="#2b6e9e">1</text>
    <text x="501" y="207" fill="#2b6e9e">1</text>
    <text x="553" y="207" fill="#2b6e9e">1</text>
  </g>

  <text x="320" y="248" text-anchor="middle" font-size="11" fill="#888">每行两个数组互为「整体取补」（1↔2）——正是首元素 m = 2 种选择的体现；同色连续段 = 同一游程</text>

  <!-- 汇总框 -->
  <g filter="url(#sk)">
    <rect x="80" y="268" width="480" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="16" font-weight="bold" font-family="monospace" fill="#2e6e2e">C(3, 2) · 2 · 1¹ = 3 × 2 = 6 ✓</text>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#2e6e2e">与官方列举的 6 个好数组一一对应，不重不漏</text>
  <text x="320" y="344" text-anchor="middle" font-size="11" fill="#555">回验示例 1：C(2,1)·2·1 = 4 ✓；示例 3：C(4,0)·2·1⁴ = 2 ✓</text>
</svg>
