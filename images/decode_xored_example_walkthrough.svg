<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：encoded = [1,2,3]，first = 1</text>

  <!-- 行 1：初始化 -->
  <text x="60" y="62" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="130" y="62" font-size="12" fill="#666" filter="url(#rough2)">arr[0] = first = 1</text>
  <rect x="340" y="46" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="363" y="68" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <path d="M363,84 L363,104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 2：i=0 -->
  <text x="60" y="124" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <text x="110" y="124" font-size="12" fill="#666" filter="url(#rough2)">arr[1] = 1 ⊕ 1 = 0</text>
  <rect x="340" y="108" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="108" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="415" y="130" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="452" y="130" font-size="11.5" fill="#d6a040" filter="url(#rough2)">← enc[0]</text>

  <path d="M363,146 L363,166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 3：i=1 -->
  <text x="60" y="186" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="110" y="186" font-size="12" fill="#666" filter="url(#rough2)">arr[2] = 0 ⊕ 2 = 2（0 ⊕ e = e）</text>
  <rect x="340" y="170" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="170" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="444" y="170" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="467" y="192" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="504" y="192" font-size="11.5" fill="#d6a040" filter="url(#rough2)">← enc[1]</text>

  <path d="M363,208 L363,228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 4：i=2 -->
  <text x="60" y="248" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <text x="110" y="248" font-size="12" fill="#666" filter="url(#rough2)">arr[3] = 2 ⊕ 3 = 1</text>
  <rect x="340" y="232" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="392" y="232" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="444" y="232" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="496" y="232" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="519" y="254" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="556" y="254" font-size="11.5" fill="#d6a040" filter="url(#rough2)">← enc[2]</text>

  <!-- 最终答案 -->
  <text x="320" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">arr = [1, 0, 2, 1]</text>

  <!-- 自检验证框 -->
  <rect x="60" y="316" width="520" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">自检（反代编码公式）：enc[0] = 1⊕0 = 1，enc[1] = 0⊕2 = 2，enc[2] = 2⊕1 = 3</text>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">与 encoded = [1,2,3] 完全吻合 ✓</text>
</svg>
