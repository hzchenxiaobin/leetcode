<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：最小矩形 = 所有 1 的「最小包围盒」</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主网格：7 列 x 5 行 -->
  <g filter="url(#sk2)">
    <rect x="110" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="156" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="202" y="95" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="248" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="294" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="340" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="386" y="95" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="110" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="156" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="202" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="248" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="294" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="340" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="386" y="141" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="110" y="187" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="156" y="187" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="202" y="187" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="248" y="187" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="294" y="187" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="340" y="187" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="386" y="187" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="110" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="156" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="202" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="248" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="294" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="340" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="386" y="233" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="110" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="156" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="202" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="248" y="279" width="46" height="46" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="294" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="340" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="386" y="279" width="46" height="46" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#b0aca2">
    <text x="133" y="123">0</text><text x="179" y="123">0</text><text x="271" y="123">0</text>
    <text x="317" y="123">0</text><text x="363" y="123">0</text><text x="409" y="123">0</text>
    <text x="133" y="169">0</text><text x="179" y="169">0</text><text x="225" y="169">0</text>
    <text x="271" y="169">0</text><text x="317" y="169">0</text><text x="363" y="169">0</text><text x="409" y="169">0</text>
    <text x="133" y="215">0</text><text x="271" y="215">0</text><text x="363" y="215">0</text><text x="409" y="215">0</text>
    <text x="133" y="261">0</text><text x="179" y="261">0</text><text x="225" y="261">0</text>
    <text x="271" y="261">0</text><text x="317" y="261">0</text><text x="363" y="261">0</text><text x="409" y="261">0</text>
    <text x="133" y="307">0</text><text x="179" y="307">0</text><text x="225" y="307">0</text>
    <text x="317" y="307">0</text><text x="363" y="307">0</text><text x="409" y="307">0</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#2b4a70">
    <text x="225" y="123">1</text>
    <text x="179" y="215">1</text>
    <text x="225" y="215">1</text>
    <text x="317" y="215">1</text>
    <text x="271" y="307">1</text>
  </g>
  <text x="225" y="228" text-anchor="middle" font-size="9.5" fill="#999">观众</text>

  <!-- 最小包围盒（虚线） -->
  <rect x="156" y="95" width="184" height="230" fill="#fce4ec" fill-opacity="0.16" stroke="#b85450" stroke-width="2.4" stroke-dasharray="9 6" filter="url(#sk)"/>

  <!-- 四个极值 1 的彩色描圈 -->
  <g filter="url(#sk2)" fill="none" stroke-width="2.6">
    <rect x="199" y="92" width="52" height="52" rx="8" stroke="#446688"/>
    <rect x="153" y="184" width="52" height="52" rx="8" stroke="#d6a040"/>
    <rect x="291" y="184" width="52" height="52" rx="8" stroke="#b85450"/>
    <rect x="245" y="276" width="52" height="52" rx="8" stroke="#4a7a3a"/>
  </g>

  <!-- 极值标签 + 引导虚线 -->
  <g filter="url(#sk2)">
    <rect x="145" y="54" width="68" height="22" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="179" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">minCol = 1</text>
    <rect x="283" y="54" width="68" height="22" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="317" y="69" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">maxCol = 4</text>
    <rect x="20" y="107" width="72" height="22" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="56" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a70">minRow = 0</text>
    <rect x="20" y="291" width="72" height="22" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="56" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a2e">maxRow = 4</text>
  </g>
  <g filter="url(#sk)" fill="none" stroke-width="1.8" stroke-dasharray="5 4">
    <path d="M 179 80 L 179 178" stroke="#d6a040" marker-end="url(#arrO)"/>
    <path d="M 317 80 L 317 178" stroke="#b85450" marker-end="url(#arrR)"/>
    <path d="M 94 118 L 193 118" stroke="#446688" marker-end="url(#arrB)"/>
    <path d="M 94 302 L 237 302" stroke="#4a7a3a" marker-end="url(#arrG)"/>
  </g>

  <!-- 包围盒标签 -->
  <g filter="url(#sk2)">
    <rect x="110" y="342" width="330" height="28" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="275" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">最小包围盒 B：行 0…4 × 列 1…4 → 面积 5 × 4 = 20</text>
  <text x="275" y="388" text-anchor="middle" font-size="11.5" fill="#888">盒内的 0 与其余的 1 都是「观众」——数量与位置都不再影响答案</text>

  <!-- 左下：为什么恰好是这个盒子 -->
  <g filter="url(#sk)">
    <rect x="70" y="400" width="380" height="124" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="426" font-size="13.5" font-weight="bold" fill="#7a5415">为什么恰好是这个盒子？</text>
  <text x="92" y="450" font-size="11.5" fill="#444">任何覆盖矩形都要盖住 4 个极值 1：</text>
  <text x="92" y="472" font-size="11.5" fill="#444">⇒ 行区间 ⊇ [minRow, maxRow]，列区间 ⊇ [minCol, maxCol]</text>
  <text x="92" y="494" font-size="11.5" font-weight="bold" fill="#b03a3a">面积 ≥ 5 × 4 压不小；B 又确实盖住全部 1 ⇒ 20 最小</text>

  <!-- 右上：投影 -->
  <text x="695" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">投影到两条轴：行、列互不干扰</text>

  <!-- 列轴（横向条带，0..6，1 在 1..4） -->
  <text x="492" y="138" text-anchor="end" font-size="12" fill="#555">列轴</text>
  <g filter="url(#sk2)">
    <rect x="500" y="116" width="40" height="40" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="540" y="116" width="40" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="580" y="116" width="40" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="620" y="116" width="40" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="660" y="116" width="40" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="700" y="116" width="40" height="40" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="740" y="116" width="40" height="40" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b0aca2">
    <text x="520" y="141">0</text><text x="760" y="141">0</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#7a5415">
    <text x="560" y="141">1</text><text x="600" y="141">1</text><text x="640" y="141">1</text><text x="680" y="141">1</text>
  </g>
  <g filter="url(#sk2)" fill="none" stroke-width="2.2">
    <rect x="537" y="113" width="46" height="46" rx="6" stroke="#d6a040"/>
    <rect x="657" y="113" width="46" height="46" rx="6" stroke="#b85450"/>
  </g>
  <path d="M 540 162 L 540 172 L 760 172 L 760 162" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="650" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">w = maxCol − minCol + 1 = 4 − 1 + 1 = 4</text>

  <!-- 行轴（纵向条带，上=第 0 行，1 在 0/2/4 行） -->
  <text x="492" y="254" text-anchor="end" font-size="12" fill="#555">行轴</text>
  <g filter="url(#sk2)">
    <rect x="500" y="224" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="500" y="264" width="40" height="40" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="500" y="304" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="500" y="344" width="40" height="40" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="500" y="384" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b0aca2">
    <text x="520" y="289">0</text><text x="520" y="369">0</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2b4a70">
    <text x="520" y="249">1</text><text x="520" y="329">1</text><text x="520" y="409">1</text>
  </g>
  <g filter="url(#sk2)" fill="none" stroke-width="2.2">
    <rect x="497" y="221" width="46" height="46" rx="6" stroke="#446688"/>
    <rect x="497" y="381" width="46" height="46" rx="6" stroke="#4a7a3a"/>
  </g>
  <path d="M 548 224 L 558 224 L 558 424 L 548 424" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="576" y="316" font-size="12.5" font-weight="bold" fill="#2b4a70">h = maxRow − minRow + 1</text>
  <text x="576" y="336" font-size="12.5" font-weight="bold" fill="#2b4a70">= 4 − 0 + 1 = 5</text>

  <!-- 右下：公式 -->
  <g filter="url(#sk)">
    <rect x="470" y="448" width="420" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="680" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a70">ans = h × w = 5 × 4 = 20</text>
  <text x="680" y="508" text-anchor="middle" font-size="11.5" fill="#555">二维包围盒 = 行跨度 × 列跨度，两个一维问题相乘</text>
</svg>
