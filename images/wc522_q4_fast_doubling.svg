<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">演算：n = 4</text>
  <text x="392" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">n ≤ 10¹⁵ → 倍增法</text>

  <!-- 左半：6 个好字符串 -->
  <!-- aaab -->
  <rect x="34" y="48" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="48" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="48" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="48" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="59" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="76" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="93" y="63" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="130" y="63" font-size="12" fill="#666" filter="url(#rough2)">→ (3, 1)</text>

  <!-- abbb -->
  <rect x="34" y="76" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="76" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="76" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="76" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="59" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="76" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="93" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="130" y="91" font-size="12" fill="#666" filter="url(#rough2)">→ (1, 3)</text>

  <!-- baaa -->
  <rect x="34" y="104" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="104" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="104" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="104" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="59" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="76" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="93" y="119" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="130" y="119" font-size="12" fill="#666" filter="url(#rough2)">→ (1, 3)</text>

  <!-- bbba -->
  <rect x="34" y="132" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="132" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="132" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="132" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="59" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="76" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="93" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="130" y="147" font-size="12" fill="#666" filter="url(#rough2)">→ (3, 1)</text>

  <!-- abab -->
  <rect x="34" y="160" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="160" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="160" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="160" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="59" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="76" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="93" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="130" y="175" font-size="12" fill="#666" filter="url(#rough2)">→ (1,1,1,1)</text>

  <!-- baba -->
  <rect x="34" y="188" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="51" y="188" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="68" y="188" width="17" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="188" width="17" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="59" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="76" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="93" y="203" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="130" y="203" font-size="12" fill="#666" filter="url(#rough2)">→ (1,1,1,1)</text>

  <rect x="28" y="228" width="228" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="252" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">奇组成：3+1、1+3、1+1+1+1，共 3 个</text>
  <text x="142" y="274" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">每个游程序列 ↔ 首字符 2 种（a / b）</text>
  <text x="142" y="299" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2 × F(4) = 2 × 3 = 6 ✓</text>

  <!-- 右半：倍增法流程 -->
  <rect x="302" y="46" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="67" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 n（可达 10¹⁵）</text>
  <path d="M 392 78 L 392 96" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="296" y="100" width="192" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">倍增法递归求 (F(m), F(m+1))：</text>
  <text x="392" y="143" text-anchor="middle" font-size="11.5" fill="#2d4d22" filter="url(#rough2)">F(2k) = F(k)·(2F(k+1) − F(k))</text>
  <text x="392" y="162" text-anchor="middle" font-size="11.5" fill="#2d4d22" filter="url(#rough2)">F(2k+1) = F(k)² + F(k+1)²</text>
  <text x="392" y="179" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">（约定 F(0)=0, F(1)=1）</text>
  <path d="M 392 184 L 392 202" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="302" y="206" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="227" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">得 F(n) mod 1e9+7</text>
  <path d="M 392 238 L 392 256" fill="none" stroke="#666666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="302" y="260" width="180" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="283" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">答案 = 2·F(n) mod 1e9+7</text>

  <text x="392" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">时间 O(log n)：递归深度 ≤ 50 层</text>
  <text x="392" y="352" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">空间 O(log n) 栈（可改迭代 → O(1)）</text>
  <text x="392" y="378" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">等价写法：矩阵 [[1,1],[1,0]] 的 n 次快速幂</text>
</svg>
