<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="540" height="320" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333">一趟扫描：距离过滤 + 键比较</text>

  <rect x="150" y="44" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333">取一座塔 (x, y, q)</text>
  <path d="M270,84 L270,106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,106 400,134 270,162 140,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="11" fill="#333">|x−cx| + |y−cy| ≤ radius ?</text>
  <text x="270" y="148" text-anchor="middle" font-size="10" fill="#b85450">否 → 跳过该塔</text>

  <path d="M270,162 L270,186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="270,186 410,214 270,242 130,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333">q &gt; bestQ，或 q 相同且 (x,y) 更小？</text>
  <text x="270" y="228" text-anchor="middle" font-size="10" fill="#b85450">是 → bestQ = q，ans = [x, y]</text>

  <path d="M270,242 L270,266" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="266" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="291" text-anchor="middle" font-size="12" fill="#333">扫描结束返回 ans（哨兵 [-1,-1]）</text>
</svg>
