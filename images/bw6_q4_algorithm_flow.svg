<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：特判相等 → 建映射 → 查空闲</text>

  <!-- 特判 -->
  <path d="M 280 190 L 200 148 L 280 108 L 360 148 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">str1 == str2 ?</text>
  <text x="280" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（零次转换即可达成）</text>

  <path d="M 200 148 L 120 148 L 120 170" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="130" y="138" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">是</text>
  <rect x="62" y="172" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="195" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <path d="M 280 190 L 280 212" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="206" font-size="12.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 建映射循环 -->
  <rect x="120" y="214" width="320" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">遍历位置 i：登记 f[str1[i]] = str2[i]</text>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">若 str1[i] 已有映射且 ≠ str2[i] → 返回 false</text>

  <path d="M 440 243 C 500 243, 500 243, 446 238" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="496" y="264" font-size="10.5" fill="#446688" filter="url(#rough2)">下一 i</text>

  <path d="M 280 272 L 280 294" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 查空闲 -->
  <rect x="130" y="296" width="300" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">统计 str2 的不同字符数 k</text>
  <text x="280" y="344" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">返回 k &lt; 26</text>
</svg>
