<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例走查：三个桶各装了多少个，答案就是最大的桶</text>

  <!-- 表头 -->
  <rect x="55" y="56" width="590" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">组</text>
  <text x="235" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">数组 a</text>
  <text x="395" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">奇数</text>
  <text x="475" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">x ≡ 0</text>
  <text x="555" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">x ≡ 2</text>
  <text x="620" y="79" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <rect x="55" y="90" width="590" height="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="355" y="92" width="80" height="36" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="85" y="116" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <text x="235" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 3</text>
  <text x="395" y="116" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">2</text>
  <text x="475" y="116" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="555" y="116" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="620" y="116" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">2</text>

  <!-- 第 2 行 -->
  <rect x="55" y="130" width="590" height="40" fill="#f7f7f7" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="355" y="132" width="80" height="36" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="85" y="156" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>
  <text x="235" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 1 1 2</text>
  <text x="395" y="156" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">3</text>
  <text x="475" y="156" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="555" y="156" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="620" y="156" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">3</text>

  <!-- 第 3 行 -->
  <rect x="55" y="170" width="590" height="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="196" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <text x="235" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 7 8</text>
  <text x="395" y="196" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="475" y="196" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="555" y="196" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="620" y="196" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">1</text>

  <!-- 第 4 行 -->
  <rect x="55" y="210" width="590" height="40" fill="#f7f7f7" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="515" y="212" width="80" height="36" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="85" y="236" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">4</text>
  <text x="235" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 2 2 2</text>
  <text x="395" y="236" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="475" y="236" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">0</text>
  <text x="555" y="236" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <text x="620" y="236" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">4</text>

  <!-- 第 5 行 -->
  <rect x="55" y="250" width="590" height="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="252" width="80" height="36" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <text x="85" y="276" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">5</text>
  <text x="235" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 10 100 1000 100000</text>
  <text x="395" y="276" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="475" y="276" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">3</text>
  <text x="555" y="276" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="620" y="276" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">3</text>

  <!-- 第 6 行：自造 -->
  <rect x="55" y="290" width="590" height="40" fill="#f7f7f7" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <rect x="435" y="292" width="80" height="36" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="515" y="292" width="80" height="36" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="85" y="316" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">自造</text>
  <text x="235" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 8 2 6 3</text>
  <text x="395" y="316" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="475" y="316" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="555" y="316" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <text x="620" y="316" text-anchor="middle" font-size="14" fill="#7a2f2b" filter="url(#rough2)">2</text>

  <text x="350" y="356" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第 5 组：100、1000、100000 都是 4 的倍数，同组 3 个一起落到 2</text>
  <text x="350" y="380" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第 6 组（自造）：4、8 同组，2、6 同组，取 2；奇数只有 3</text>
  <text x="350" y="406" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">表中「x ≡ 0 / x ≡ 2」指 x mod 4；上色格为该行最大桶（第 3 行三类并列，未上色）</text>
</svg>
