<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">算法流程：滚动维护「以当前元素结尾」的 OR 集合</text>
  <rect x="50" y="56" width="520" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="81.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">all = ∅，cur = ∅</text>
  <rect x="50" y="116" width="520" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="141.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">对每个 x：nxt = {x}</text>
  <rect x="50" y="176" width="520" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="201.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">for v in cur：nxt.add(v | x)      ← 把旧集合整体并上 x</text>
  <rect x="50" y="236" width="520" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="261.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">all |= nxt；cur = nxt</text>
  <rect x="50" y="296" width="520" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310.0" y="321.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">返回 |all|</text>
  <path d="M 310 98 L 310 114" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 158 L 310 174" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 218 L 310 234" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 278 L 310 294" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">O(n · 30)，因为 |cur| ≤ 30</text>
</svg>
