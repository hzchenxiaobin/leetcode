<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：正数开头 + 相邻异号 ⇒ 偶下标放正、奇下标放负</text>
  <path d="M 150 40 Q 340 47 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="58" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="120" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="178" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="236" y="64" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="294" y="64" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="352" y="64" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="410" y="64" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="146" y="87" fill="#2e6e2e">3</text>
    <text x="204" y="87" fill="#2e6e2e">1</text>
    <text x="262" y="87" fill="#a06a20">−2</text>
    <text x="320" y="87" fill="#a06a20">−5</text>
    <text x="378" y="87" fill="#2e6e2e">2</text>
    <text x="436" y="87" fill="#a06a20">−4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="146" y="116">0</text>
    <text x="204" y="116">1</text>
    <text x="262" y="116">2</text>
    <text x="320" y="116">3</text>
    <text x="378" y="116">4</text>
    <text x="436" y="116">5</text>
  </g>

  <!-- routing arrows: nums -> two streams -->
  <g filter="url(#sk)" stroke-width="1.3" fill="none">
    <path d="M 146 102 Q 128 120 112 134" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 204 102 Q 197 120 192 134" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 378 102 Q 330 122 274 134" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 262 102 Q 330 122 416 134" stroke="#d6a040" marker-end="url(#aro)"/>
    <path d="M 320 102 Q 396 122 486 134" stroke="#d6a040" marker-end="url(#aro)"/>
    <path d="M 436 102 Q 495 122 556 134" stroke="#d6a040" marker-end="url(#aro)"/>
  </g>

  <!-- two streams -->
  <g filter="url(#sk)">
    <rect x="70" y="140" width="230" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="380" y="140" width="230" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="185" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">正数流（保序）：3，1，2</text>
  <text x="185" y="180" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">第 k 个正数 → 偶下标 2k</text>
  <text x="495" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">负数流（保序）：−2，−5，−4</text>
  <text x="495" y="180" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">第 k 个负数 → 奇下标 2k+1</text>

  <!-- landing arrows: streams -> ans slots (crossing = interleave) -->
  <g filter="url(#sk)" stroke-width="1.3" fill="none">
    <path d="M 120 188 Q 128 220 142 244" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 200 188 Q 226 220 256 244" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 280 188 Q 322 220 372 244" stroke="#4a7a3a" marker-end="url(#arg)"/>
    <path d="M 420 188 Q 330 222 210 244" stroke="#d6a040" marker-end="url(#aro)"/>
    <path d="M 490 188 Q 420 224 326 244" stroke="#d6a040" marker-end="url(#aro)"/>
    <path d="M 560 188 Q 505 220 442 244" stroke="#d6a040" marker-end="url(#aro)"/>
  </g>

  <!-- ans row -->
  <text x="58" y="274" font-size="13" font-weight="bold" fill="#2b2b2b">ans =</text>
  <g filter="url(#sk)">
    <rect x="120" y="250" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="178" y="250" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="236" y="250" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="294" y="250" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="352" y="250" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="410" y="250" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="15" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="146" y="273" fill="#2e6e2e">3</text>
    <text x="204" y="273" fill="#a06a20">−2</text>
    <text x="262" y="273" fill="#2e6e2e">1</text>
    <text x="320" y="273" fill="#a06a20">−5</text>
    <text x="378" y="273" fill="#2e6e2e">2</text>
    <text x="436" y="273" fill="#a06a20">−4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="146" y="302">0</text>
    <text x="204" y="302">1</text>
    <text x="262" y="302">2</text>
    <text x="320" y="302">3</text>
    <text x="378" y="302">4</text>
    <text x="436" y="302">5</text>
  </g>

  <!-- cursor progress -->
  <text x="185" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">posIdx：0→2→4→6</text>
  <text x="495" y="321" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a20" font-family="monospace">negIdx：1→3→5→7</text>

  <!-- banners -->
  <g filter="url(#sk)">
    <rect x="60" y="334" width="560" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">「保序」+「奇偶落位」⇒ 每个元素的位置被唯一锁定（§5 引理 1）</text>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#444">合法输出唯一存在，本题实为结论题 + 模拟，无任何搜索空间</text>

  <g filter="url(#sk)">
    <rect x="60" y="394" width="560" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="417" text-anchor="middle" font-size="11.5" fill="#2b6e9e">正负各 n/2 个：偶落点 0,2,…,n−2 与奇落点 1,3,…,n−1 同时填满 ⇒ 双游标不越界（§5 引理 2）</text>
</svg>
