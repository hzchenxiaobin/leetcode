<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个区域：低区 DAG + 高区「抬升 + 不变量」</text>
  <text x="340" y="51" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">M = 最便宜的净增益总价；h &lt; M 时一笔也买不起，h &#8805; M 时可反复抬升</text>

  <text x="196" y="94" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">低区 0 &#8804; h &lt; M</text>
  <text x="478" y="94" text-anchor="middle" font-size="13" fill="#3d6b30" filter="url(#rough2)">高区 M &#8804; h &#8804; s</text>

  <rect x="62" y="104" width="268" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="336" y="104" width="284" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="196" y="132" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">净增益交易一笔也买不起</text>
  <text x="196" y="158" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">状态只减、无环，是一条 DAG</text>
  <text x="196" y="186" text-anchor="middle" font-size="12" fill="#8d3a36" filter="url(#rough2)">f[h] = OR&#8201;f[h &#8722; d]</text>

  <text x="478" y="132" text-anchor="middle" font-size="11.5" fill="#3d6b30" filter="url(#rough2)">反复买最便宜的净增益交易</text>
  <text x="478" y="158" text-anchor="middle" font-size="11.5" fill="#3d6b30" filter="url(#rough2)">余额能抬到任意大</text>
  <text x="478" y="186" text-anchor="middle" font-size="12.5" fill="#8d3a36" filter="url(#rough2)">f[h] = [ g | h ]</text>

  <path d="M84 128 L84 190" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M104 128 L104 190" stroke="#446688" stroke-width="1.2" marker-end="url(#arrb)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M600 190 L600 128" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M580 190 L580 128" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrg)" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M333 86 L333 214" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="333" y="228" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">M</text>

  <rect x="62" y="242" width="558" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="268" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">g = gcd{ &#948;(x) : x 是可达总价 } = gcd( gcd(c&#7522;), b_m, &#948;(x) 对 x &#8804; V )，V = max(s, a_m)</text>

  <rect x="62" y="292" width="558" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="318" font-size="11.5" fill="#8d3a36" filter="url(#rough2)">每笔交易都保持余额 mod g 不变 &#8658; 必要条件：g 整除 h</text>

  <rect x="62" y="342" width="558" height="42" rx="8" fill="#eef3ee" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="368" font-size="11.5" fill="#3d6b30" filter="url(#rough2)">末笔必须恰好花光余额且不吃返利 &#8658; 需要 c_min &lt; a&#8321;，否则答案全为 NO</text>
</svg>
