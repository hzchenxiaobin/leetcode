<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：符号赋值 ↔ 正号子集</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P 为带 + 的元素之和，N 为带 − 的元素之和，二者只取决于「哪些元素被分进 P」</text>

  <!-- 左：一次符号赋值 -->
  <rect x="26" y="64" width="242" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="86" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">例：nums = [2, 1], target = 1</text>

  <rect x="42" y="98" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="118" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">+</text>
  <rect x="70" y="98" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="118" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">2</text>
  <rect x="104" y="98" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="117" y="118" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">−</text>
  <rect x="132" y="98" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="147" y="118" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="172" y="118" font-size="12" fill="#4a7a3a" filter="url(#rough2)">= 1 ✓</text>

  <text x="42" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">正号集合 P = {2}，负号集合 N = {1}</text>
  <text x="42" y="170" font-size="10.5" fill="#555" filter="url(#rough2)">sum(P) = 2，sum(N) = 1，两块互不重叠</text>
  <text x="42" y="190" font-size="10.5" fill="#888" filter="url(#rough2)">每种符号赋值 ⇔ 一个子集 P</text>

  <path d="M 274 134 L 290 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：两个方程消元 -->
  <rect x="294" y="64" width="242" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="86" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">两个方程消去 N</text>
  <text x="310" y="112" font-size="11.5" fill="#333" filter="url(#rough2)">P − N = target</text>
  <text x="310" y="134" font-size="11.5" fill="#333" filter="url(#rough2)">P + N = S = sum(nums)</text>
  <path d="M 310 146 L 520 146" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="310" y="168" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">⇒ 2P = S + target</text>
  <text x="310" y="190" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ P = (S + target) / 2</text>

  <!-- 可行性判定 -->
  <rect x="26" y="222" width="510" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="243" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两个条件任一不满足，就说明没有任何符号赋值可行</text>
  <text x="42" y="263" font-size="10.5" fill="#555" filter="url(#rough2)">① S + target 必须为偶数，w = (S + target) / 2 才是整数</text>
  <text x="42" y="281" font-size="10.5" fill="#555" filter="url(#rough2)">② 0 ≤ w ≤ S，等价于 |target| ≤ S，否则答案恒为 0</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例：S = 5, target = 3 ⟹ w = 4，答案即「和为 4 的子集个数」</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">子集 P 与符号赋值一一对应，因此计数完全不变</text>
</svg>
