<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "leetscode"，词典 {leet, code, leetcode}</text>

  <!-- 表格：i / dp[i] / 说明 -->
  <g filter="url(#rough2)" font-size="11.5">
    <rect x="36" y="42" width="52" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="88" y="42" width="60" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="148" y="42" width="336" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <text x="62" y="59" text-anchor="middle" fill="#444">i</text>
    <text x="118" y="59" text-anchor="middle" fill="#444">dp[i]</text>
    <text x="316" y="59" text-anchor="middle" fill="#444">说明（前 i 个字符）</text>

    <rect x="36" y="68" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="68" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="68" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="86" text-anchor="middle" fill="#333">0</text>
    <text x="118" y="86" text-anchor="middle" fill="#333">0</text>
    <text x="160" y="86" fill="#333">边界：空前缀，0 个额外字符</text>

    <rect x="36" y="96" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="96" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="96" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="114" text-anchor="middle" fill="#333">1</text>
    <text x="118" y="114" text-anchor="middle" fill="#333">1</text>
    <text x="160" y="114" fill="#333">"l"：无单词，l 记额外 → dp[0]+1</text>

    <rect x="36" y="124" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="124" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="124" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="142" text-anchor="middle" fill="#333">2</text>
    <text x="118" y="142" text-anchor="middle" fill="#333">2</text>
    <text x="160" y="142" fill="#333">"le"：e 再记额外</text>

    <rect x="36" y="152" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="152" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="152" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="170" text-anchor="middle" fill="#333">3</text>
    <text x="118" y="170" text-anchor="middle" fill="#333">3</text>
    <text x="160" y="170" fill="#333">"lee"：同样 +1</text>

    <rect x="36" y="180" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="88" y="180" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="148" y="180" width="336" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="62" y="198" text-anchor="middle" fill="#2f5527">4</text>
    <text x="118" y="198" text-anchor="middle" fill="#2f5527" font-size="13">0</text>
    <text x="160" y="198" fill="#2f5527">"leet" 是单词！dp[4] ← dp[0] = 0</text>

    <rect x="36" y="208" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="208" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="208" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="226" text-anchor="middle" fill="#333">5</text>
    <text x="118" y="226" text-anchor="middle" fill="#333">1</text>
    <text x="160" y="226" fill="#333">"leets"：s 记额外 → dp[4] + 1 = 1</text>

    <rect x="36" y="236" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="236" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="236" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="254" text-anchor="middle" fill="#333">6</text>
    <text x="118" y="254" text-anchor="middle" fill="#333">2</text>
    <text x="160" y="254" fill="#333">"leetsc"：c 再记额外</text>

    <rect x="36" y="264" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="264" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="264" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="282" text-anchor="middle" fill="#333">7</text>
    <text x="118" y="282" text-anchor="middle" fill="#333">3</text>
    <text x="160" y="282" fill="#333">"leetsco"</text>

    <rect x="36" y="292" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="88" y="292" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="148" y="292" width="336" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="62" y="310" text-anchor="middle" fill="#333">8</text>
    <text x="118" y="310" text-anchor="middle" fill="#333">4</text>
    <text x="160" y="310" fill="#333">"leetscod"</text>

    <rect x="36" y="320" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="88" y="320" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="148" y="320" width="336" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="62" y="338" text-anchor="middle" fill="#2f5527">9</text>
    <text x="118" y="338" text-anchor="middle" fill="#2f5527" font-size="13">1</text>
    <text x="160" y="338" fill="#2f5527">"code"（j=5）是单词 → dp[9] ← dp[5] = 1</text>
  </g>

  <text x="260" y="372" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">答案 dp[9] = 1：只有 s[4] 的那个 's' 是额外字符 ✓</text>
</svg>
