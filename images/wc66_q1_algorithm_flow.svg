<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：建桶 → 依次查表 → 弹出一个下标</text>
  <text x="300" y="51" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两趟线性扫描，中间只多一个哈希表</text>

  <g filter="url(#rough2)">
    <rect x="150" y="70" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="300" y="90" text-anchor="middle" font-size="11.5" fill="#2f3f5c">① 遍历 nums2：pos[ nums2[j] ].append(j)</text>
    <text x="300" y="106" text-anchor="middle" font-size="10" fill="#6b7a8f">同值的下标按升序进同一个桶</text>
  </g>
  <path d="M 300 116 L 300 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="138" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="300" y="163" text-anchor="middle" font-size="11.5" fill="#2f3f5c">② 遍历 nums1，逐个取出 x = nums1[i]</text>
  </g>
  <path d="M 300 180 L 300 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="300,202 420,240 300,278 180,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="300" y="236" text-anchor="middle" font-size="11.5" fill="#8a6a20">pos[x] 的桶为空？</text>
    <text x="300" y="253" text-anchor="middle" font-size="10" fill="#a08339">变位词保证不会发生</text>
    <text x="436" y="236" font-size="10.5" fill="#4a7a3a">否 →</text>
  </g>
  <path d="M 420 240 L 470 240 L 470 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 240 L 118 240 L 118 300" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="326" font-size="10" fill="#b85450" filter="url(#rough2)">是 → 输入不是变位词</text>
  <text x="122" y="341" font-size="10" fill="#b85450" filter="url(#rough2)">（题面保证不会走到）</text>

  <g filter="url(#rough2)">
    <rect x="150" y="280" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="300" y="305" text-anchor="middle" font-size="11.5" fill="#33552a">③ j ← pos[x].pop()，取走一个还没用过的下标</text>
  </g>
  <path d="M 300 322 L 300 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="344" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="300" y="368" text-anchor="middle" font-size="11.5" fill="#33552a">④ ans.append(j)</text>
  </g>

  <g filter="url(#rough2)">
    <ellipse cx="300" cy="412" rx="120" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="300" y="417" text-anchor="middle" font-size="11.5" fill="#8a3a36">返回 ans（长度 n 的下标序列）</text>
  </g>

  <text x="300" y="454" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">关键：弹出一个就少一个，同值的多个 i 一定落到不同下标上</text>
</svg>
