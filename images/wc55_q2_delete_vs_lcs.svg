<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">删除总量固定 ⟹ 转化为「最大权和公共子序列」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s1 = "sea"，s2 = "eat"：保留公共子序列 "ea"，删掉 s 与 t</text>

  <text x="46" y="93" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s1</text>
  <text x="46" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s2</text>

  <g filter="url(#rough2)">
    <rect x="70" y="66" width="44" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="118" y="66" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="166" y="66" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="70" y="136" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="118" y="136" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="166" y="136" width="44" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="15" font-weight="bold">
    <text x="92" y="91" fill="#8a3a36">s</text>
    <text x="140" y="91" fill="#3a5a30">e</text>
    <text x="188" y="91" fill="#3a5a30">a</text>
    <text x="92" y="161" fill="#3a5a30">e</text>
    <text x="140" y="161" fill="#3a5a30">a</text>
    <text x="188" y="161" fill="#8a3a36">t</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9" fill="#999">
    <text x="92" y="104">115</text>
    <text x="140" y="104">101</text>
    <text x="188" y="104">97</text>
    <text x="92" y="174">101</text>
    <text x="140" y="174">97</text>
    <text x="188" y="174">116</text>
  </g>

  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2">
    <path d="M 73 89 L 111 89" fill="none"/>
    <path d="M 169 159 L 207 159" fill="none"/>
  </g>

  <text x="216" y="93" font-size="10" fill="#b85450" filter="url(#rough2)">删 s：−115</text>
  <text x="216" y="163" font-size="10" fill="#b85450" filter="url(#rough2)">删 t：−116</text>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M 140 112 L 140 128" marker-end="url(#arr)"/>
    <path d="M 188 112 L 188 128" marker-end="url(#arr)"/>
  </g>

  <rect x="40" y="206" width="252" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="228" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">固定量：两个串的 ASCII 总和</text>
  <text x="54" y="248" font-size="10" fill="#555" filter="url(#rough2)">Σ1 = 115 + 101 + 97 = 313</text>
  <text x="54" y="266" font-size="10" fill="#555" filter="url(#rough2)">Σ2 = 101 + 97 + 116 = 314</text>
  <text x="54" y="284" font-size="10" fill="#555" filter="url(#rough2)">Σ = Σ1 + Σ2 = 627（与删除方案无关）</text>

  <rect x="304" y="206" width="216" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="318" y="228" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案只由「保留了多少权」决定</text>
  <text x="318" y="250" font-size="12" fill="#3a5a30" filter="url(#rough2)">ans = Σ − 2 · W</text>
  <text x="318" y="270" font-size="11" fill="#555" filter="url(#rough2)">W = w("ea") = 101 + 97 = 198</text>
  <text x="318" y="288" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 627 − 396 = 231</text>

  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">保留的字符在 s1、s2 里各留一次，因此每个保留字符让代价减少 2·ord(c)</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是「最小删除和」⟺「最大权和公共子序列」——注意是权最大，不是长度最长</text>
</svg>
