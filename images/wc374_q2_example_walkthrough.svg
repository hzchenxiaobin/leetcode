<svg xmlns="http://www.w3.org/2000/svg" width="640" height="455" viewBox="0 0 640 455" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="455" fill="#fdfcf7"/>
  <text x="320" y="27" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：coins = [1,4,10]，target = 19</text>
  <path d="M 155 35 Q 320 43 485 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- target 参考线 -->
  <path d="M 478 70 L 478 388" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,5" filter="url(#sk)"/>
  <text x="478" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">target = 19</text>
  <text x="252" y="63" font-size="11" fill="#888">绿/蓝/红条 = 该步结束后的覆盖 [1, x−1]（每 12px 代表 1 元）</text>

  <!-- 行① -->
  <g filter="url(#sk)"><circle cx="38" cy="97" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="38" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="60" y="93" font-size="12" fill="#444" font-family="monospace">x = 1,  c = 1</text>
  <text x="60" y="111" font-size="12" fill="#2b6e9e" font-weight="bold">1 ≤ 1 ✓ 吸收，x ← 2</text>
  <g filter="url(#sk)"><rect x="250" y="84" width="12" height="26" rx="3" fill="#dcebfb" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="270" y="102" font-size="11" fill="#2b6e9e" font-family="monospace">[1,1]</text>

  <!-- 行② -->
  <g filter="url(#sk)"><circle cx="38" cy="151" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="38" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2</text>
  <text x="60" y="147" font-size="12" fill="#444" font-family="monospace">x = 2,  c = 4</text>
  <text x="60" y="165" font-size="12" fill="#b85450" font-weight="bold">4 &gt; 2 ✗ 补面值 2，ans = 1</text>
  <g filter="url(#sk)"><rect x="250" y="138" width="36" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="294" y="156" font-size="11" fill="#b85450" font-family="monospace">[1,3]</text>

  <!-- 行③ -->
  <g filter="url(#sk)"><circle cx="38" cy="205" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="38" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="60" y="201" font-size="12" fill="#444" font-family="monospace">x = 4,  c = 4</text>
  <text x="60" y="219" font-size="12" fill="#2b6e9e" font-weight="bold">4 ≤ 4 ✓ 吸收，x ← 8</text>
  <g filter="url(#sk)"><rect x="250" y="192" width="84" height="26" rx="3" fill="#dcebfb" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="342" y="210" font-size="11" fill="#2b6e9e" font-family="monospace">[1,7]</text>

  <!-- 行④ -->
  <g filter="url(#sk)"><circle cx="38" cy="259" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="38" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <text x="60" y="255" font-size="12" fill="#444" font-family="monospace">x = 8,  c = 10</text>
  <text x="60" y="273" font-size="12" fill="#b85450" font-weight="bold">10 &gt; 8 ✗ 补面值 8，ans = 2</text>
  <g filter="url(#sk)"><rect x="250" y="246" width="180" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="438" y="264" font-size="11" fill="#b85450" font-family="monospace">[1,15]</text>

  <!-- 行⑤ -->
  <g filter="url(#sk)"><circle cx="38" cy="313" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="38" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="60" y="309" font-size="12" fill="#444" font-family="monospace">x = 16,  c = 10</text>
  <text x="60" y="327" font-size="12" fill="#2b6e9e" font-weight="bold">10 ≤ 16 ✓ 吸收，x ← 26</text>
  <g filter="url(#sk)"><rect x="250" y="300" width="300" height="26" rx="3" fill="#dcebfb" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="558" y="318" font-size="11" fill="#2b6e9e" font-family="monospace">[1,25]</text>

  <!-- 行⑥ -->
  <g filter="url(#sk)"><circle cx="38" cy="367" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="38" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="60" y="363" font-size="12" fill="#444" font-family="monospace">x = 26</text>
  <text x="60" y="381" font-size="12" fill="#2e6e2e" font-weight="bold">26 &gt; 19 ✓ 覆盖 ⊇ [1,19]，终止</text>
  <g filter="url(#sk)"><rect x="250" y="354" width="300" height="26" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="558" y="372" font-size="11" fill="#2e6e2e" font-family="monospace">✓ [1,25]</text>

  <!-- 底部注释 -->
  <g filter="url(#sk)"><rect x="45" y="402" width="550" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#444">补出 {2, 8} 两枚，ans = 2，与官方解释一致 ✓</text>
  <text x="320" y="437" text-anchor="middle" font-size="11" fill="#888">步骤⑤：补币后的覆盖 [1,15] 已把面值 10 罩住，它照常被吸收——补币不废原生硬币</text>
</svg>
