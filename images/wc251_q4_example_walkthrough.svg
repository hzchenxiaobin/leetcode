<svg xmlns="http://www.w3.org/2000/svg" width="640" height="492" viewBox="0 0 640 492" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="492" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 5 演算：签名 → 结构 ID → 计数 → 删除</text>
  <path d="M 150 36 Q 320 46 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <path d="M 130 74 L 100 114" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 150 74 L 188 114" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 80 140 L 62 180" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 100 140 L 120 180" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 52 206 L 52 240" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 186 140 L 162 180" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 196 140 L 198 180" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 206 140 L 232 180" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 200 206 L 200 240" stroke="#666" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <g font-size="13" fill="#333" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="123" y="48" width="34" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="140" y="65" filter="url(#sk)">/</text>
    <g filter="url(#sk)"><rect x="73" y="114" width="34" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="90" y="131" filter="url(#sk)">a</text>
    <g filter="url(#sk)"><rect x="179" y="114" width="34" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="196" y="131" filter="url(#sk)">b</text>
    <g filter="url(#sk)"><rect x="35" y="182" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="52" y="199" fill="#8f3b37" filter="url(#sk)">x</text>
    <g filter="url(#sk)"><rect x="183" y="182" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="200" y="199" fill="#8f3b37" filter="url(#sk)">x</text>
    <g filter="url(#sk)"><rect x="139" y="182" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g><text x="156" y="199" fill="#777" filter="url(#sk)">w</text>
    <g filter="url(#sk)"><rect x="111" y="182" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g><text x="128" y="199" fill="#777" filter="url(#sk)">z</text>
    <g filter="url(#sk)"><rect x="227" y="182" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g><text x="244" y="199" fill="#777" filter="url(#sk)">z</text>
    <g filter="url(#sk)"><rect x="35" y="244" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g><text x="52" y="261" fill="#777" filter="url(#sk)">y</text>
    <g filter="url(#sk)"><rect x="183" y="244" width="34" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/></g><text x="200" y="261" fill="#777" filter="url(#sk)">y</text>
  </g>
  <g font-size="9.5" text-anchor="middle">
    <text x="172" y="62" fill="#4a8edb" filter="url(#sk)">id=4</text>
    <text x="120" y="128" fill="#4a8edb" filter="url(#sk)">id=2</text>
    <text x="226" y="128" fill="#4a8edb" filter="url(#sk)">id=3</text>
    <text x="62" y="196" fill="#b85450" filter="url(#sk)">id=1</text>
    <text x="210" y="196" fill="#b85450" filter="url(#sk)">id=1</text>
    <text x="76" y="278" fill="#999" filter="url(#sk)">叶子 id=0</text>
    <text x="224" y="278" fill="#999" filter="url(#sk)">叶子 id=0</text>
  </g>

  <g filter="url(#sk)"><rect x="292" y="48" width="322" height="28" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <g font-size="11.5" fill="#2c4a6e" font-weight="bold">
    <text x="330" y="67" text-anchor="middle" filter="url(#sk)">结点</text>
    <text x="440" y="67" text-anchor="middle" filter="url(#sk)">签名 sig（后序）</text>
    <text x="545" y="67" text-anchor="middle" filter="url(#sk)">ID</text>
    <text x="588" y="67" text-anchor="middle" filter="url(#sk)">cnt</text>
  </g>

  <g font-size="11" fill="#444" font-family="monospace">
    <g filter="url(#sk)"><rect x="292" y="80" width="322" height="30" rx="4" fill="#f6f6f4" stroke="#ccc" stroke-width="1"/></g>
    <text x="330" y="100" text-anchor="middle" filter="url(#sk)">y, z, w（叶）</text>
    <text x="440" y="100" text-anchor="middle" filter="url(#sk)">∅</text>
    <text x="545" y="100" text-anchor="middle" filter="url(#sk)">0</text>
    <text x="588" y="100" text-anchor="middle" fill="#999" filter="url(#sk)">—</text>

    <g filter="url(#sk)"><rect x="292" y="114" width="322" height="30" rx="4" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
    <text x="330" y="134" text-anchor="middle" filter="url(#sk)">/a/x</text>
    <text x="440" y="134" text-anchor="middle" filter="url(#sk)">(y,0)</text>
    <text x="545" y="134" text-anchor="middle" filter="url(#sk)">1</text>
    <text x="588" y="134" text-anchor="middle" filter="url(#sk)">1</text>

    <g filter="url(#sk)"><rect x="292" y="148" width="322" height="30" rx="4" fill="#f6f6f4" stroke="#ccc" stroke-width="1"/></g>
    <text x="330" y="168" text-anchor="middle" filter="url(#sk)">/a</text>
    <text x="440" y="168" text-anchor="middle" filter="url(#sk)">(x,1)(z,0)</text>
    <text x="545" y="168" text-anchor="middle" filter="url(#sk)">2</text>
    <text x="588" y="168" text-anchor="middle" filter="url(#sk)">1</text>

    <g filter="url(#sk)"><rect x="292" y="182" width="322" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="330" y="202" text-anchor="middle" fill="#8f3b37" font-weight="bold" filter="url(#sk)">/b/x</text>
    <text x="440" y="202" text-anchor="middle" fill="#8f3b37" font-weight="bold" filter="url(#sk)">(y,0)</text>
    <text x="545" y="202" text-anchor="middle" fill="#8f3b37" font-weight="bold" filter="url(#sk)">1</text>
    <text x="588" y="202" text-anchor="middle" fill="#b85450" font-weight="bold" filter="url(#sk)">2 ←</text>

    <g filter="url(#sk)"><rect x="292" y="216" width="322" height="30" rx="4" fill="#fdfcf7" stroke="#ccc" stroke-width="1"/></g>
    <text x="330" y="236" text-anchor="middle" filter="url(#sk)">/b</text>
    <text x="440" y="236" text-anchor="middle" filter="url(#sk)">(w,0)(x,1)(z,0)</text>
    <text x="545" y="236" text-anchor="middle" filter="url(#sk)">3</text>
    <text x="588" y="236" text-anchor="middle" filter="url(#sk)">1</text>

    <g filter="url(#sk)"><rect x="292" y="250" width="322" height="30" rx="4" fill="#f6f6f4" stroke="#ccc" stroke-width="1"/></g>
    <text x="330" y="270" text-anchor="middle" filter="url(#sk)">root</text>
    <text x="440" y="270" text-anchor="middle" filter="url(#sk)">(a,2)(b,3)</text>
    <text x="545" y="270" text-anchor="middle" filter="url(#sk)">4</text>
    <text x="588" y="270" text-anchor="middle" filter="url(#sk)">1</text>
  </g>

  <g filter="url(#sk)"><rect x="30" y="298" width="584" height="66" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="322" y="322" text-anchor="middle" font-size="12.5" fill="#8f3b37" font-weight="bold" filter="url(#sk)">标记删除：cnt[1] = 2 ⟹ /a/x 与 /b/x（连同各自的 y）整棵删除</text>
  <text x="322" y="345" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">/a 与 /b 因 w 而不同构；z、w 是空文件夹不判重，保留</text>

  <g filter="url(#sk)"><rect x="30" y="380" width="584" height="58" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="322" y="404" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-family="monospace" font-weight="bold" filter="url(#sk)">输出：["a"] ["a","z"] ["b"] ["b","w"] ["b","z"]</text>
  <text x="322" y="426" text-anchor="middle" font-size="11" fill="#4a8e4a" filter="url(#sk)">与官方答案一致（题目允许任意顺序）</text>

  <text x="320" y="470" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">一遍后序 DFS 即完成判定：sig 相同 ⟺ ID 相同 ⟺ 子树同构，全程无哈希碰撞</text>
</svg>
