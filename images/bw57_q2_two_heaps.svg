<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">双堆模型：busy 按离开时刻释放 → free 按编号取最小</text>

  <!-- 时间轴上的朋友事件 -->
  <text x="80" y="60" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">按到达时刻排序的朋友队列</text>
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="142" y="70" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="244" y="70" width="92" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="346" y="70" width="92" height="34" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="86" y="91">到达 1</text>
    <text x="188" y="91">到达 2</text>
    <text x="290" y="91">到达 4</text>
    <text x="392" y="91">…</text>
  </g>

  <!-- busy 堆 -->
  <rect x="60" y="150" width="230" height="150" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="175" y="174" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">busy 堆：键 = 离开时刻</text>
  <g filter="url(#rough2)">
    <rect x="105" y="186" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="80" y="234" width="58" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="150" y="234" width="58" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="140" y="207">(3, 椅1) 顶</text>
    <text x="109" y="254">(4, 椅0)</text>
    <text x="179" y="254">(6, 椅2)</text>
  </g>
  <path d="M 175 268 L 175 268" stroke="none"/>
  <text x="175" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">堆顶最早离开，先出堆</text>

  <!-- free 堆 -->
  <rect x="320" y="150" width="210" height="150" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="425" y="174" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">free 堆：键 = 椅子编号</text>
  <g filter="url(#rough2)">
    <rect x="390" y="186" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="365" y="234" width="52" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="428" y="234" width="52" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="425" y="207">椅 0 顶</text>
    <text x="391" y="254">椅 2</text>
    <text x="454" y="254">椅 5</text>
  </g>
  <text x="425" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">堆顶 = 最小空椅，直接复用</text>

  <!-- 释放箭头：busy 顶 → free -->
  <path d="M 292 203 L 388 203" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">leaving ≤ 到达 → 释放</text>

  <!-- 入座箭头 -->
  <path d="M 425 336 L 425 304" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="324" font-size="11" fill="#446688" filter="url(#rough2)">到达者取堆顶</text>

  <!-- 全新椅子 -->
  <rect x="60" y="320" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="175" y="341" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">free 空 → 启用新椅 nextChair++</text>
  <text x="175" y="360" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">无需预建无限椅子，计数器即可</text>
</svg>
