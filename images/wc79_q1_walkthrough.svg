<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：5 个点里的 C(5,3) = 10 个三角形</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">取 (0,0)、(0,2)、(2,0) 时 2S = 4 最大，面积 = 4 / 2 = 2.0</text>

  <!-- 坐标系 -->
  <path d="M 86 330 L 344 330" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 110 352 L 110 104" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="346" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="96" y="94" font-size="10" fill="#999" filter="url(#rough2)">y</text>

  <!-- 网格 -->
  <path d="M 210 330 L 210 320" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 310 330 L 310 320" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 110 230 L 120 230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 110 130 L 120 130" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="310" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="98" y="234" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="98" y="134" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <!-- 次优三角形 (0,0),(0,2),(1,0)：2S = 2 -->
  <path d="M 110 330 L 110 130 L 210 330 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <!-- 最优三角形 (0,0),(0,2),(2,0)：2S = 4 -->
  <path d="M 110 330 L 110 130 L 310 330 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="176" y="286" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2S = 4</text>

  <!-- 五个点： (0,0),(0,1),(1,0),(0,2),(2,0) -->
  <circle cx="110" cy="330" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="110" cy="230" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="330" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="110" cy="130" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="310" cy="330" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="102" y="322" text-anchor="end" font-size="10" fill="#8a3a36" filter="url(#rough2)">(0,0)</text>
  <text x="102" y="222" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">(0,1)</text>
  <text x="216" y="344" text-anchor="start" font-size="10" fill="#3a4a66" filter="url(#rough2)">(1,0)</text>
  <text x="102" y="122" text-anchor="end" font-size="10" fill="#8a3a36" filter="url(#rough2)">(0,2)</text>
  <text x="316" y="344" text-anchor="start" font-size="10" fill="#8a3a36" filter="url(#rough2)">(2,0)</text>

  <!-- 右侧候选表 -->
  <text x="352" y="92" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">候选三角形（节选）</text>
  <rect x="352" y="104" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="364" y="121" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">三元组</text>
  <text x="516" y="121" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">2S</text>
  <text x="552" y="121" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">面积</text>

  <rect x="352" y="136" width="240" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="364" y="152" font-size="10" fill="#555" filter="url(#rough2)">(0,0) (0,1) (1,0)</text>
  <text x="520" y="152" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="552" y="152" font-size="10" fill="#555" filter="url(#rough2)">0.5</text>

  <rect x="352" y="166" width="240" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="364" y="182" font-size="10" fill="#555" filter="url(#rough2)">(0,0) (0,2) (1,0)</text>
  <text x="520" y="182" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="552" y="182" font-size="10" fill="#555" filter="url(#rough2)">1.0</text>

  <rect x="352" y="196" width="240" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="212" font-size="10" fill="#8a6a20" filter="url(#rough2)">(0,0) (0,2) (2,0)</text>
  <text x="520" y="212" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="552" y="212" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2.0</text>

  <rect x="352" y="226" width="240" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="364" y="242" font-size="10" fill="#555" filter="url(#rough2)">(0,0) (1,0) (2,0)</text>
  <text x="520" y="242" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="552" y="242" font-size="10" fill="#555" filter="url(#rough2)">0.0</text>

  <rect x="352" y="256" width="240" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="364" y="272" font-size="10" fill="#555" filter="url(#rough2)">(0,1) (1,0) (2,0)</text>
  <text x="520" y="272" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="552" y="272" font-size="10" fill="#555" filter="url(#rough2)">0.5</text>

  <text x="352" y="302" font-size="9.5" fill="#999" filter="url(#rough2)">共线不构成三角形 ⇒ 2S = 0</text>

  <!-- 底部结论 -->
  <rect x="80" y="366" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="96" y="389" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">10 组里最大者 2S = 4 ⇒ 返回 4 / 2.0 = 2.00000</text>
</svg>
