<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="430" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1（A = {0,1,2,3,4,5}）：两个合法 c，各 6 种摆法，合计 12</text>

  <!-- 左面板 -->
  <rect x="40" y="52" width="390" height="272" rx="10" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="62" y="82" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c = 1：T = {3,4}，末尾 v = 4</text>
  <text x="62" y="108" font-size="12" fill="#2f4a66" filter="url(#rough2)">前缀 P = {0,1,2} → 3! 种</text>
  <text x="62" y="130" font-size="12" fill="#2f4a66" filter="url(#rough2)">尾部 T = {3,4}，末位固定 4 → 1! 种</text>

  <rect x="62" y="146" width="42" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="146" width="42" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="146" width="42" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="146" width="42" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="146" width="42" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="352" y="146" width="42" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="83" y="172" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="141" y="172" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="199" y="172" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="257" y="172" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="315" y="172" text-anchor="middle" font-size="15" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="373" y="172" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">5</text>

  <text x="62" y="208" font-size="11" fill="#6b6b6b" filter="url(#rough2)">值链：2 → 3 → 1 → 4 → 0 → 5（蓝 = 前缀值，绿 = 尾部值）</text>
  <text x="62" y="238" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">贡献 3! × 1! = 6 种</text>
  <text x="62" y="264" font-size="11" fill="#6b6b6b" filter="url(#rough2)">例：0 1 2 | 5 | 3 4，即 b = (0,1,2,5,3,4)</text>
  <text x="62" y="292" font-size="11" fill="#6b6b6b" filter="url(#rough2)">位 4 = 5（最大），位 6 = 4（末尾），0 在最大元素左侧</text>

  <!-- 右面板 -->
  <rect x="450" y="52" width="390" height="272" rx="10" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="472" y="82" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c = 2：T = {1,3}，末尾 v = 3</text>
  <text x="472" y="108" font-size="12" fill="#2f4a66" filter="url(#rough2)">前缀 P = {0,2,4} → 3! 种</text>
  <text x="472" y="130" font-size="12" fill="#2f4a66" filter="url(#rough2)">尾部 T = {1,3}，末位固定 3 → 1! 种</text>

  <rect x="472" y="146" width="42" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="530" y="146" width="42" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="588" y="146" width="42" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="646" y="146" width="42" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="704" y="146" width="42" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="762" y="146" width="42" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="493" y="172" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="551" y="172" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="609" y="172" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="667" y="172" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="725" y="172" text-anchor="middle" font-size="15" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="783" y="172" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">5</text>

  <text x="472" y="208" font-size="11" fill="#6b6b6b" filter="url(#rough2)">值链：4 → 1 → 2 → 3 → 0 → 5（蓝 = 前缀值，绿 = 尾部值）</text>
  <text x="472" y="238" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">贡献 3! × 1! = 6 种</text>
  <text x="472" y="264" font-size="11" fill="#6b6b6b" filter="url(#rough2)">例：2 4 0 | 5 | 1 3，即 b = (2,4,0,5,1,3)</text>
  <text x="472" y="292" font-size="11" fill="#6b6b6b" filter="url(#rough2)">位 4 = 5（最大），位 6 = 3（末尾），0 在最大元素左侧</text>

  <rect x="60" y="344" width="760" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="370" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">合计 6 + 6 = 12，与样例 1 的输出一致（n = 6：|P| = 3、|T| = 2）</text>
  <text x="440" y="396" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">候选 c 只有 a_2 = 1 与 (5 − 1)/2 = 2 两个；两个都通过校验，故答案为 2 × 6 = 12</text>
</svg>
