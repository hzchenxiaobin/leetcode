<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：无重复滑窗——遇重复收缩，正数保证越宽和越大</text>
  <path d="M 180 38 Q 320 48 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row A: conflict -->
  <text x="58" y="92" font-size="13.5" font-weight="bold" fill="#8f3830" filter="url(#sk)">① 冲突</text>
  <g filter="url(#sk)">
    <rect x="170" y="70" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="230" y="70" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="290" y="70" width="54" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="350" y="70" width="54" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="410" y="70" width="54" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 314 62 C 285 44, 229 44, 203 60" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
  </g>
  <g filter="url(#sk)" font-size="14" fill="#333" text-anchor="middle">
    <text x="197" y="94">4</text>
    <text x="257" y="94">2</text>
    <text x="317" y="94" fill="#8f3830" font-weight="bold">4</text>
    <text x="377" y="94" fill="#aaa">5</text>
    <text x="437" y="94" fill="#aaa">6</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="197" y="120">0</text>
    <text x="257" y="120">1</text>
    <text x="317" y="120">2</text>
    <text x="377" y="120">3</text>
    <text x="437" y="120">4</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="553" y="82" font-size="11.5" fill="#8f3830">right = 2：新元素 4</text>
    <text x="553" y="100" font-size="11.5" fill="#8f3830">与窗口内的 4 重复 ✗</text>
    <text x="258" y="42" font-size="11" fill="#b85450">重复 ✗</text>
  </g>

  <!-- Row B: shrink -->
  <text x="58" y="190" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">② 收缩</text>
  <g filter="url(#sk)">
    <rect x="170" y="168" width="54" height="38" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="230" y="168" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="290" y="168" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="350" y="168" width="54" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="410" y="168" width="54" height="38" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M 197 210 Q 227 226 252 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)"/>
  </g>
  <g filter="url(#sk)" font-size="14" fill="#333" text-anchor="middle">
    <text x="197" y="192" fill="#aaa">4</text>
    <text x="257" y="192">2</text>
    <text x="317" y="192" font-weight="bold">4</text>
    <text x="377" y="192" fill="#aaa">5</text>
    <text x="437" y="192" fill="#aaa">6</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="197" y="218">0</text>
    <text x="257" y="218">1</text>
    <text x="317" y="218">2</text>
    <text x="377" y="218">3</text>
    <text x="437" y="218">4</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="225" y="240" font-size="11" fill="#4a7a3a">left++（移出旧的 4）</text>
    <text x="553" y="186" font-size="11.5" fill="#2e5a24">窗口 [1,2] 恢复互异 ✓</text>
    <text x="553" y="204" font-size="11" fill="#666">再让新 4 入窗</text>
  </g>

  <!-- Row C: expand -->
  <text x="58" y="288" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#sk)">③ 扩张</text>
  <g filter="url(#sk)">
    <rect x="170" y="266" width="54" height="38" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="230" y="266" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="290" y="266" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="350" y="266" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="410" y="266" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="14" fill="#333" text-anchor="middle">
    <text x="197" y="290" fill="#aaa">4</text>
    <text x="257" y="290" fill="#2e5a24" font-weight="bold">2</text>
    <text x="317" y="290" fill="#2e5a24" font-weight="bold">4</text>
    <text x="377" y="290" fill="#2e5a24" font-weight="bold">5</text>
    <text x="437" y="290" fill="#2e5a24" font-weight="bold">6</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="197" y="316">0</text>
    <text x="257" y="316">1</text>
    <text x="317" y="316">2</text>
    <text x="377" y="316">3</text>
    <text x="437" y="316">4</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="553" y="280" font-size="11.5" fill="#4a7a3a">5、6 依次入窗</text>
    <text x="553" y="298" font-size="12.5" font-weight="bold" fill="#2e5a24">和 = 2+4+5+6 = 17</text>
    <text x="553" y="316" font-size="12" font-weight="bold" fill="#2e5a24">答案 ✓</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="560" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="320" y="364" font-size="12.5" font-weight="bold" fill="#8f3830">正数 ⇒ 同一右端点下窗口越宽和越大，「最长无重复窗口」即「最大和窗口」</text>
    <text x="320" y="386" font-size="12" fill="#8f3830">left 与 right 都只向右移动，各至多走 n 步 ⇒ 均摊 O(n)</text>
    <text x="320" y="407" font-size="12" fill="#8f3830">模板同「无重复字符的最长子串」：只把「记录长度」换成「记录窗口和」</text>
  </g>
</svg>
