<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：[2,3,2] → 4（左）与 [1,1000,1] 棘轮死局 → 0（右）</text>

  <!-- left table: nums = [2,3,2] -->
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="48" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="57" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">i</text>
    <rect x="74" y="48" width="74" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="111" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">Δ / d</text>
    <rect x="148" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="184" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="220" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="256" y="48" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="166" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=0</text>
    <text x="202" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=1</text>
    <text x="238" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=2</text>
    <text x="274" y="65" text-anchor="middle" font-size="10.5" fill="#8a6a1a" font-weight="bold">s=3</text>

    <!-- row 0 -->
    <rect x="40" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="57" y="94" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">0</text>
    <rect x="74" y="74" width="74" height="30" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="111" y="93" text-anchor="middle" font-size="9.5" fill="#557">初始</text>
    <rect x="148" y="74" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="184" y="74" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="220" y="74" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="256" y="74" width="36" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="166" y="94" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="202" y="94" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="238" y="94" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="274" y="94" text-anchor="middle" font-size="10" fill="#999">—</text>

    <!-- row 1 -->
    <rect x="40" y="104" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="57" y="124" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <rect x="74" y="104" width="74" height="30" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="111" y="123" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Δ=+1</text>
    <text x="111" y="130" text-anchor="middle" font-size="9" fill="#557">d=1</text>
    <rect x="148" y="104" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="184" y="104" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="220" y="104" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="256" y="104" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="166" y="124" text-anchor="middle" font-size="11" fill="#8a2f2a" font-weight="bold">0</text>
    <text x="202" y="124" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="238" y="124" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">2</text>
    <text x="274" y="124" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">3</text>

    <!-- row 2 -->
    <rect x="40" y="134" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="57" y="154" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">2</text>
    <rect x="74" y="134" width="74" height="30" rx="4" fill="#ffffff" stroke="#888" stroke-width="1"/>
    <text x="111" y="153" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Δ=−1</text>
    <text x="111" y="160" text-anchor="middle" font-size="9" fill="#557">d=0</text>
    <rect x="148" y="134" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="184" y="134" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="220" y="134" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="256" y="134" width="36" height="30" rx="4" fill="#f0f0f0" stroke="#aaa" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="166" y="154" text-anchor="middle" font-size="11" fill="#8a2f2a" font-weight="bold">0</text>
    <text x="202" y="154" text-anchor="middle" font-size="11" fill="#2c4258" font-weight="bold">1</text>
    <text x="238" y="154" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">3</text>
    <text x="274" y="154" text-anchor="middle" font-size="10" fill="#999">—</text>

    <!-- sum -->
    <rect x="220" y="172" width="72" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="256" y="191" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">Σ = 4 ✓</text>

    <!-- notes under table -->
    <text x="166" y="224" text-anchor="middle" font-size="9" fill="#888">逐格演算与四个数组对详见同场 Q3 题解</text>
    <text x="166" y="254" text-anchor="middle" font-size="9.5" fill="#557">[5,5,5,5] 同法算得 126 = C(9,4)</text>
    <text x="166" y="270" text-anchor="middle" font-size="9" fill="#888">（全相等退化为非减序列计数，闭式见扩展）</text>
  </g>

  <!-- right panel: nums = [1,1000,1] -->
  <g filter="url(#rough2)">
    <rect x="336" y="44" width="192" height="330" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="432" y="68" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums = [1,1000,1]</text>
    <text x="432" y="94" text-anchor="middle" font-size="10" fill="#557">i=0：ℓ=0，dp=[1,1]（s ≤ 1）</text>
    <text x="432" y="118" text-anchor="middle" font-size="10" fill="#557">i=1：Δ=+999 ⇒ d=999，ℓ=999</text>
    <text x="432" y="134" text-anchor="middle" font-size="9.5" fill="#557">1001 格只有 2 格活着：</text>
    <text x="432" y="150" text-anchor="middle" font-size="10" fill="#2c4258" font-weight="bold">dp[999]=1，dp[1000]=2</text>
    <text x="432" y="174" text-anchor="middle" font-size="10" fill="#557">i=2：Δ=−999 ⇒ d=0，ℓ 仍=999</text>
    <rect x="348" y="186" width="168" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="432" y="204" text-anchor="middle" font-size="10" fill="#8a2f2a" font-weight="bold">支撑区间 [999, 1] = 空</text>
    <text x="432" y="220" text-anchor="middle" font-size="9.5" fill="#8a2f2a">本层 dp 全 0，此后全零</text>
    <rect x="348" y="240" width="168" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="432" y="259" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">ans = 0 ✓</text>
    <text x="432" y="288" text-anchor="middle" font-size="9.5" fill="#557">arr1 被 +999 顶上天（≥999）</text>
    <text x="432" y="302" text-anchor="middle" font-size="9.5" fill="#557">nums 回落到 1 也下不来</text>
    <text x="432" y="316" text-anchor="middle" font-size="9.5" fill="#888">——非减序列没有回头路</text>
    <text x="432" y="342" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">O(n) 判空：任一层 ℓ 越过 nums[i] ⇒ 0</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="392" width="512" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="409" text-anchor="middle" font-size="10.5" fill="#2c4258" font-weight="bold">棘轮 ℓ 只升不降：支撑区间一旦变空，其后每层全零，答案 0</text>
    <text x="280" y="425" text-anchor="middle" font-size="10.5" fill="#444">对拍请务必带上无解用例——锯齿大摆动是重灾区</text>
  </g>
</svg>
