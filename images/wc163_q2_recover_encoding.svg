<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：值由根到节点的路径唯一决定</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一条规则既用于「还原」，也用于「反查」</text>
  <rect x="70" y="62" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="86" y="84" font-size="11" fill="#8a6a20" filter="url(#rough2)">记 u = v + 1：左孩子 u′ = 2u（补 0），右孩子 u′ = 2u+1（补 1），根 u = 1</text>
  <path d="M 300 170 L 218 227" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 170 L 382 227" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 244 L 158 281" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 244 L 222 281" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 244 L 378 281" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 244 L 442 281" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="270" y="130" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=0</text>
  <text x="300" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=1</text>
  <rect x="160" y="205" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=1</text>
  <text x="190" y="237" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=10</text>
  <rect x="380" y="205" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=2</text>
  <text x="410" y="237" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=11</text>
  <rect x="100" y="280" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=3</text>
  <text x="130" y="312" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=100</text>
  <rect x="220" y="280" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="250" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=4</text>
  <text x="250" y="312" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=101</text>
  <rect x="340" y="280" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="370" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=5</text>
  <text x="370" y="312" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=110</text>
  <rect x="460" y="280" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="297" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v=6</text>
  <text x="490" y="312" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">u=111</text>
  <circle cx="247" cy="200" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="247" y="203" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <circle cx="353" cy="200" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="353" y="203" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <circle cx="152" cy="263" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="266" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <circle cx="216" cy="262" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="265" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <circle cx="372" cy="263" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="372" y="266" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <circle cx="438" cy="262" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="265" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="320" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个格子上行是真实值 v、下行是 u = v+1 的二进制；边上圆圈是这一步走的位（0 左、1 右）</text>
  <rect x="60" y="356" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="377" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">所以 v 的编码 = 前导 1 + 根到节点的 01 串；判断 target 是否存在只需沿 target+1 的位下行</text>
</svg>
