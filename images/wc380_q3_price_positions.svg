<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">「价格」= 计费位上设置位的个数（num = 13，二进制 000001101）</text>

  <!-- 图例 -->
  <rect x="56" y="44" width="16" height="11" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="53" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">计费位（x 的倍数位）</text>
  <rect x="205" y="44" width="16" height="11" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="227" y="53" font-size="9.5" fill="#446688" filter="url(#rough2)">非计费位</text>
  <rect x="300" y="44" width="16" height="11" rx="2" fill="#fff8e1" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="53" font-size="9.5" fill="#b85450" filter="url(#rough2)">命中：计费位上的 1</text>

  <!-- 二进制格子：MSB 在左，位号 9..1 -->
  <rect x="97" y="64" width="42" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="118" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="145" y="64" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="166" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="193" y="64" width="42" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="241" y="64" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="289" y="64" width="42" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="337" y="64" width="42" height="46" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="358" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="385" y="64" width="42" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="433" y="64" width="42" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="454" y="93" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="481" y="64" width="42" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="502" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="358" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✓</text>

  <!-- 位号标签 -->
  <text x="118" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位 9</text>
  <text x="166" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">位 8</text>
  <text x="214" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位 7</text>
  <text x="262" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">位 6</text>
  <text x="310" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位 5</text>
  <text x="358" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">位 4</text>
  <text x="406" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位 3</text>
  <text x="454" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">位 2</text>
  <text x="502" y="126" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">位 1</text>
  <text x="502" y="143" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">← 最低有效位，位号从它起算</text>

  <!-- 对照：x = 1 与 x = 2 -->
  <rect x="60" y="170" width="240" height="100" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x = 1：所有位都计费</text>
  <text x="180" y="218" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">第 1、3、4 位上是 1</text>
  <text x="180" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">价格 = 3</text>

  <rect x="320" y="170" width="240" height="100" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">x = 2：只看第 2、4、6、8 位</text>
  <text x="440" y="218" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">只有第 4 位上是 1</text>
  <text x="440" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">价格 = 1</text>

  <!-- 警示框 -->
  <rect x="60" y="288" width="500" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33333" filter="url(#rough2)">⚠️ 价格数的是计费位上「1 的个数」，不是把位的权值加起来！</text>
  <text x="310" y="328" text-anchor="middle" font-size="10.5" fill="#7a3a37" filter="url(#rough2)">x = 2、num = 13：第 4 位（权值 8）命中一次 → 价格是 1，不是 8</text>
</svg>
