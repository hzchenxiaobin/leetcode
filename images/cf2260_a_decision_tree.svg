<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="432" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：答案只可能是 −1、0、1、2 这四种</text>
  <path d="M 176 40 Q 380 47 584 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">先数「有两个以上 easy 吗」，再看「两端已经 easy 了吗」</text>

  <!-- ① 统计 0 的个数 -->
  <rect x="46" y="78" width="404" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="104" font-size="13" fill="#2f4a66" filter="url(#rough2)">① 数一遍数组，记 z = easy（值 0）的个数</text>
  <path d="M 452 99 L 512 99" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="518" y="79" width="204" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="620" y="104" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">z &lt; 2 ⇒ 答案 −1</text>

  <!-- ② 两端都 easy -->
  <rect x="46" y="140" width="404" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="166" font-size="13" fill="#3c5e2e" filter="url(#rough2)">② z ≥ 2，且 a₀ = 0 与 aₙ₋₁ = 0 同时成立？</text>
  <path d="M 452 161 L 512 161" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="518" y="141" width="204" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="620" y="166" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是 ⇒ 答案 0</text>

  <!-- ③ 恰有一端 easy -->
  <rect x="46" y="202" width="404" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="228" font-size="13" fill="#8a6015" filter="url(#rough2)">③ 否则，两个端点里恰好有一个是 0？</text>
  <path d="M 452 223 L 512 223" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="518" y="203" width="204" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="620" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">是 ⇒ 答案 1</text>

  <!-- ④ 两端都 hard -->
  <rect x="46" y="264" width="404" height="42" rx="8" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="290" font-size="13" fill="#4a4a4a" filter="url(#rough2)">④ 剩下唯一情形：a₀ = 1 且 aₙ₋₁ = 1</text>
  <path d="M 452 285 L 512 285" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="518" y="265" width="204" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="620" y="290" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">⇒ 答案 2</text>

  <!-- 说明条 -->
  <rect x="46" y="328" width="676" height="84" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="350" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么只有这四档：一次交换只动两个位置，而能「修好」一个 hard 端点的方式只有</text>
  <text x="62" y="372" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">「把某个 0 换进来」；把两个 hard 端点互相交换是空操作，所以两端都 hard 时至少要两次。</text>
  <text x="62" y="396" font-size="12.5" fill="#446688" filter="url(#rough2)">每档都由「可行性（z ≥ 2）」+「坏的端点数」唯一决定，不需要模拟，也不需要贪心。</text>
</svg>
