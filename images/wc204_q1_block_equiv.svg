<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#555" filter="url(#rough2)">核心观察：k 个全等块 ⇔ 连续 m×(k−1) 个位置满足 arr[i] = arr[i+m]</text>

  <text x="280" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 块视角：k = 3 个全等块（m = 3），只需 k−1 = 2 对相邻相等</text>

  <!-- block brackets -->
  <path d="M 74 70 L 74 64 L 212 64 L 212 70" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 212 70 L 212 64 L 350 64 L 350 70" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 350 70 L 350 64 L 488 64 L 488 70" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="143" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688">块 0</text>
  <text x="281" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">块 1</text>
  <text x="419" y="60" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">块 2</text>

  <!-- top array cells -->
  <rect x="74" y="74" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="74" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="166" y="74" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="74" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="74" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="74" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="74" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="396" y="74" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="442" y="74" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="143" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="189" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="235" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="281" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="327" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="373" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="419" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="465" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="30" y="96" font-size="11" fill="#888">arr =</text>

  <!-- equality pills on block boundaries -->
  <circle cx="212" cy="90" r="11" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">＝</text>
  <circle cx="350" cy="90" r="11" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">＝</text>

  <text x="280" y="138" text-anchor="middle" font-size="10" fill="#888">k−1 = 2 对相邻块相等 → 传递性 ⇒ 3 块全等（模式 [5,1,7] 重复 3 次）</text>

  <!-- transformation arrow -->
  <path d="M 280 148 L 280 168" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="294" y="163" font-size="10" fill="#555">块相等 ⇒ 逐位相等</text>

  <text x="280" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 位置视角：只需数连续匹配个数 —— 阈值 m×(k−1) = 3×2 = 6</text>

  <!-- bottom array cells (same arr) -->
  <rect x="74" y="200" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="200" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="166" y="200" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="200" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="200" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="200" width="46" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="200" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="396" y="200" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="442" y="200" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="143" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="189" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="235" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="281" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="327" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="373" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="419" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="465" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">7</text>
  <text x="52" y="221" text-anchor="end" font-size="11" fill="#888">arr =</text>

  <text x="97" y="246" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="143" y="246" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="189" y="246" text-anchor="middle" font-size="9" fill="#999">i=2</text>
  <text x="235" y="246" text-anchor="middle" font-size="9" fill="#999">i=3</text>
  <text x="281" y="246" text-anchor="middle" font-size="9" fill="#999">i=4</text>
  <text x="327" y="246" text-anchor="middle" font-size="9" fill="#999">i=5</text>
  <text x="373" y="246" text-anchor="middle" font-size="9" fill="#999">i=6</text>
  <text x="419" y="246" text-anchor="middle" font-size="9" fill="#999">i=7</text>
  <text x="465" y="246" text-anchor="middle" font-size="9" fill="#999">i=8</text>

  <!-- arcs pair 1: block0 -> block1 -->
  <path d="M 97 234 Q 166 262 235 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 143 234 Q 212 274 281 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 189 234 Q 258 262 327 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>

  <!-- arcs pair 2: block1 -> block2 -->
  <path d="M 235 234 Q 304 300 373 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 281 234 Q 350 312 419 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 327 234 Q 396 300 465 234" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>

  <!-- left pair labels -->
  <text x="10" y="250" font-size="9.5" font-weight="bold" fill="#446688">块0 ↔ 块1</text>
  <text x="10" y="262" font-size="9.5" fill="#446688">m = 3 个匹配</text>
  <text x="10" y="276" font-size="9.5" font-weight="bold" fill="#9a7020">块1 ↔ 块2</text>
  <text x="10" y="288" font-size="9.5" fill="#9a7020">m = 3 个匹配</text>

  <!-- bottom note box -->
  <rect x="40" y="314" width="480" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">一遍扫描：arr[i] == arr[i+m] → count++；失配 → count = 0</text>
  <text x="280" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">count ≥ m×(k−1) ⇒ 找到 k 个全等块 → 返回 true ⭐</text>
</svg>
