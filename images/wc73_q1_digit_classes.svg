<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">旋转 180°：每位数字的三种命运</text>

  <rect x="36" y="56" width="176" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="80" text-anchor="middle" font-size="14" fill="#2b4a6f" filter="url(#rough2)">自映射 A</text>
  <text x="124" y="108" text-anchor="middle" font-size="20" fill="#2b4a6f" filter="url(#rough2)">0  1  8</text>
  <text x="124" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">转完仍是自己</text>

  <rect x="242" y="56" width="176" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="80" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">互换 B</text>
  <text x="330" y="108" text-anchor="middle" font-size="20" fill="#8a6a20" filter="url(#rough2)">2  5  6  9</text>
  <text x="330" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2↔5，6↔9 互为镜像</text>

  <rect x="448" y="56" width="176" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="536" y="80" text-anchor="middle" font-size="14" fill="#8f3b38" filter="url(#rough2)">非法 C</text>
  <text x="536" y="108" text-anchor="middle" font-size="20" fill="#8f3b38" filter="url(#rough2)">3  4  7</text>
  <text x="536" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">转完不再是数字</text>

  <text x="330" y="176" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">合法数 = 每位 ∈ A ∪ B（7 种）    好数 = 合法数 − 不变数</text>

  <rect x="48" y="196" width="564" height="196" rx="10" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="218" font-size="12" fill="#667" filter="url(#rough2)">1 .. n 的全部整数</text>

  <rect x="72" y="234" width="516" height="142" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="258" font-size="12" fill="#2b4a6f" filter="url(#rough2)">合法数：每位 ∈ {0,1,2,5,6,8,9}（共 7 种）</text>

  <rect x="90" y="272" width="238" height="90" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="298" text-anchor="middle" font-size="13" fill="#33604a" filter="url(#rough2)">不变数</text>
  <text x="209" y="322" text-anchor="middle" font-size="12" fill="#33604a" filter="url(#rough2)">每位 ∈ {0,1,8}</text>
  <text x="209" y="346" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">旋转后与自身相同</text>

  <text x="334" y="322" font-size="15" fill="#667" filter="url(#rough2)">⊔</text>

  <rect x="340" y="272" width="232" height="90" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="298" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">好数</text>
  <text x="456" y="322" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">至少一位 ∈ {2,5,6,9}</text>
  <text x="456" y="346" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">旋转后与自身不同</text>

  <text x="330" y="422" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">好数个数 = count(≤ n, 合法) − count(≤ n, 不变)</text>
</svg>
