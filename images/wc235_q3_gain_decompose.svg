<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：只换一位 ⇒ 各位独立；找最近值 ⇒ 排序 + 二分</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">答案 = total − max gain；第 i 位的最优替换 = nums1 中最接近 nums2[i] 的值</text>

  <!-- 小节①：数轴找最近值 -->
  <text x="30" y="68" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 在 sorted1 中找最接近 t 的值：只需比较插入点左右两个「夹板」</text>

  <path d="M 70 132 L 450 132" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- sorted1 的元素点：1, 5, 7 -->
  <circle cx="120" cy="132" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="320" cy="132" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <circle cx="420" cy="132" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>

  <!-- 目标 t = 3 -->
  <polygon points="220,110 212,124 228,124" fill="#b85450" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = nums2[i] = 3</text>

  <!-- 插入点 p -->
  <path d="M 268 96 L 268 118" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="272" y="90" text-anchor="middle" font-size="10" fill="#b27a10" filter="url(#rough2)">p = lower_bound(t)</text>

  <!-- 距离弧线：t→1 与 t→5 -->
  <path d="M 220 150 Q 170 168 120 150" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="170" y="178" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">|1−3| = 2</text>
  <path d="M 220 150 Q 270 168 320 150" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">|5−3| = 2</text>

  <text x="260" y="198" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">sorted1[p−1] = 1 &lt; t ≤ sorted1[p] = 5：t 被相邻元素夹住，最近值必是两者之一</text>
  <text x="260" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（7 及更远的元素距离只会更大，无需比较）</text>

  <!-- 小节②：各位独立的 gain -->
  <text x="30" y="240" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 各位独立：对每位算「可减小量」gain，答案 = total − max gain</text>

  <!-- 条形图：基线 y=324，比例 22px/单位 -->
  <path d="M 80 324 L 450 324" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- i=0: d=1 -->
  <rect x="110" y="302" width="44" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="132" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=1, gain=0</text>

  <!-- i=1: d=4 → 2 -->
  <rect x="240" y="280" width="44" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="236" width="44" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="262" y="306" text-anchor="middle" font-size="9" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="262" y="262" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="262" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">gain = 2 ★</text>
  <text x="262" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="262" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=4 → 2</text>

  <!-- i=2: d=0 -->
  <rect x="370" y="320" width="44" height="4" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="338" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="392" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">d=0, gain=0</text>

  <!-- 图例 -->
  <rect x="418" y="236" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="432" y="245" font-size="9" fill="#888" filter="url(#rough2)">被压掉</text>
  <rect x="418" y="252" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="432" y="261" font-size="9" fill="#888" filter="url(#rough2)">替换后保留</text>

  <!-- 结论框 -->
  <rect x="30" y="362" width="460" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">total = 1 + 4 + 0 = 5；maxGain = 2（i=1：把 7 换成 5 或 1）</text>
  <text x="260" y="393" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">答案 = (5 − 2) mod (10⁹+7) = 3</text>
</svg>
