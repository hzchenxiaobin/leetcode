<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">逐位提取：把选中的数字「抽」进结果前缀</text>
  <text x="320" y="48" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">相邻交换一次只能越过 1 个数字 ⇒ 代价 = 前方剩余数字的个数</text>

  <!-- Panel A: step 1 extract '1' -->
  <g filter="url(#r)">
    <rect x="56" y="62" width="528" height="152" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="76" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">第 1 步｜num = "4321"，k = 4</text>
  <g filter="url(#r)">
    <rect x="84" y="100" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="100" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="196" y="100" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="252" y="100" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <path d="M 276 96 Q 192 62 108 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="108" y="122" fill="#33517a" filter="url(#r)">4</text>
    <text x="164" y="122" fill="#33517a" filter="url(#r)">3</text>
    <text x="220" y="122" fill="#33517a" filter="url(#r)">2</text>
    <text x="276" y="122" fill="#a0761e" filter="url(#r)">1</text>
  </g>
  <text x="192" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0761e" filter="url(#r)">越过 3 个 → cost = 3</text>
  <path d="M 312 117 L 340 117" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="352" y="100" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="424" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="474" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="524" y="100" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="374" y="122" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="446" y="122" fill="#33517a" filter="url(#r)">4</text>
    <text x="496" y="122" fill="#33517a" filter="url(#r)">3</text>
    <text x="546" y="122" fill="#33517a" filter="url(#r)">2</text>
  </g>
  <text x="374" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#r)">结果前缀</text>
  <text x="495" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">剩余序列（原相对顺序不变）</text>
  <text x="76" y="176" text-anchor="start" font-size="12" fill="#555" filter="url(#r)">'1' 前方有 3 个数字挡路，cost = 3 ≤ k = 4，取用；k: 4 → 1</text>
  <text x="76" y="200" text-anchor="start" font-size="11.5" fill="#888" filter="url(#r)">原下标 3 被「抽走」成为幽灵位置，剩余 [4,3,2] 仍按原顺序排列</text>

  <!-- Panel B: step 2 try '2' then '3' -->
  <g filter="url(#r)">
    <rect x="56" y="230" width="528" height="152" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="76" y="254" text-anchor="start" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">第 2 步｜剩余序列 [4, 3, 2]，k = 1</text>
  <g filter="url(#r)">
    <rect x="84" y="272" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="140" y="272" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="196" y="272" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <path d="M 220 268 Q 152 236 108 268" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="5,4"/>
    <path d="M 164 306 Q 116 336 108 306" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="108" y="294" fill="#33517a" filter="url(#r)">4</text>
    <text x="164" y="294" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="220" y="294" fill="#b85450" filter="url(#r)">2</text>
  </g>
  <text x="164" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">'2'：前方 2 个挡路 → cost = 2 &gt; 1 ✗</text>
  <text x="146" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">'3'：前方 1 个 → cost = 1 ≤ 1 ✓</text>
  <path d="M 262 289 L 290 289" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="302" y="272" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="352" y="272" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="424" y="272" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="474" y="272" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="324" y="294" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="374" y="294" fill="#2e6e2e" filter="url(#r)">3</text>
    <text x="446" y="294" fill="#33517a" filter="url(#r)">4</text>
    <text x="496" y="294" fill="#33517a" filter="url(#r)">2</text>
  </g>
  <text x="349" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#r)">结果前缀 "13"</text>
  <text x="470" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">剩余 [4,2]</text>
  <text x="76" y="344" text-anchor="start" font-size="12" fill="#555" filter="url(#r)">贪心按 d = 0→9 枚举：'2' 超预算，退而选 '3'，k: 1 → 0</text>
  <text x="76" y="368" text-anchor="start" font-size="11.5" fill="#888" filter="url(#r)">这一步正是 "1243"（共需 3+2 = 5 次交换 &gt; 4）不可达的瞬间</text>

  <!-- Panel C: conclusion -->
  <g filter="url(#r)">
    <rect x="56" y="398" width="528" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">k = 0 后只能零代价续接：结果 "13" + 剩余 [4, 2] → "1342"，总代价 3 + 1 = 4 ✓</text>
  <text x="320" y="448" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">对照："1243" 需 5 次、"1234" 需 6 次（逆序对数），k = 4 都不够</text>
  <text x="320" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">贪心：每一位在「能负担得起」的数字里选最小的，</text>
  <text x="320" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">代价 = 它前方尚未被取走的数字个数</text>
</svg>
