    <text x="156" y="101">7</text><text x="180" y="101">7</text><text x="204" y="101">7</text><text x="228" y="101">7</text>
    <text x="252" y="101">8</text><text x="276" y="101">8</text><text x="300" y="101">8</text><text x="324" y="101">8</text>
    <text x="348" y="101">8</text><text x="372" y="101">8</text><text x="396" y="101">8</text>
    <text x="420" y="101" fill="#b8860b" font-weight="bold">9</text>
    <text x="444" y="101" fill="#b8860b" font-weight="bold">10</text>
  </g>

  <text x="36" y="140" font-size="12.5" fill="#b85450" filter="url(#rough2)">↑ 前 2 个（两个 0）：删</text>
  <text x="400" y="140" font-size="12.5" fill="#b8860b" filter="url(#rough2)">↑ 后 2 个（9、10）：删</text>

  <g filter="url(#rough2)">
    <rect x="100" y="158" width="360" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="182" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">保留 36 个数，和 = 172</text>
  <text x="280" y="204" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">均值 = 172 / 36 = 4.777…</text>

  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">注意：第 3、4 位的两个 0 属于「最小 5% 之外」——删除按个数 m，不按值</text>
  <path d="M 120 256 C 60 256, 40 220, 36 178" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="270" font-size="11.5" fill="#b85450" filter="url(#rough2)">仅删 2 个 0，后面的 0 保留</text>
