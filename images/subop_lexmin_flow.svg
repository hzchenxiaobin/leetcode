<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍线性扫描（下标单调右移）</text>
  <path d="M 110 40 Q 320 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="200" y="58" width="240" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="80" text-anchor="middle" font-size="12.5" fill="#2e5e24" filter="url(#sk)">输入字符串 s（仅小写字母）</text>

  <path d="M 320 92 L 320 110" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="114" width="340" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="136" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">i ← 第一个满足 s[i] ≠ 'a' 的下标（跳过 'a' 前缀）</text>

  <path d="M 320 148 L 320 166" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,170 458,212 320,254 182,212" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">i = n ？</text>
  <text x="320" y="226" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">（整个 s 全是 'a'）</text>

  <path d="M 458 212 L 494 212" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="476" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="500" y="190" width="128" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="564" y="208" text-anchor="middle" font-size="12" fill="#2e5e24" filter="url(#sk)">s[n−1] ← 'z'</text>
  <text x="564" y="226" text-anchor="middle" font-size="11" fill="#2e5e24" filter="url(#sk)">结果 "a…az"</text>

  <path d="M 320 254 L 320 272" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="268" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="125" y="276" width="390" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">j 从 i 向右扩展，只要 s[j] ≠ 'a'（极大非 'a' 段）</text>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">s[i..j−1] 每个字符减一（段内都 ≥ 'b'，无环绕）</text>

  <path d="M 320 328 L 320 346" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 564 234 L 564 363 L 476 363" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="346" width="300" height="34" rx="9" fill="#f2f2ee" stroke="#8a8a80" stroke-width="1.6"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">返回 s（时间 O(n)，额外空间 O(1)）</text>
</svg>
