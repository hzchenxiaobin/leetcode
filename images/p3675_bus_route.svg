<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：环形字母表上的一趟「班车」</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <circle cx="225" cy="205" r="100" fill="none" stroke="#c0cad2" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="178.5" y="297.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">c</text>
  <text x="158.7" y="283.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">d</text>
  <text x="142.7" y="265.3" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">e</text>
  <text x="131.5" y="244.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">f</text>
  <text x="125.7" y="220.6" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">g</text>
  <text x="125.7" y="196.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">h</text>
  <text x="131.5" y="173.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">i</text>
  <text x="142.7" y="151.7" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">j</text>
  <text x="158.7" y="133.6" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">k</text>
  <text x="178.5" y="120.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">l</text>
  <text x="201.1" y="111.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">m</text>
  <text x="225.0" y="108.5" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">n</text>
  <text x="248.9" y="111.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">o</text>
  <text x="271.5" y="120.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">p</text>
  <text x="291.3" y="133.6" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">q</text>
  <text x="307.3" y="151.7" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">r</text>
  <text x="318.5" y="173.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">s</text>
  <text x="324.3" y="196.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">t</text>
  <text x="324.3" y="220.6" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">u</text>
  <text x="318.5" y="244.0" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">v</text>
  <text x="307.3" y="265.3" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">w</text>
  <text x="291.3" y="283.4" text-anchor="middle" font-size="10.5" fill="#7d8ea0" filter="url(#sk)">x</text>
  <circle cx="248.9" cy="302.1" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="248.9" y="306.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">z</text>
  <circle cx="271.5" cy="293.5" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="271.5" y="297.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">y</text>
  <circle cx="225.0" cy="305.0" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="225.0" y="309.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">a</text>
  <path d="M 311.6 155.0 A 100 100 0 0 1 321.6 179.1" stroke="#8899a6" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="143" text-anchor="start" font-size="10.5" fill="#66778a" filter="url(#sk)">+1 方向</text>
  <path d="M 278.9 307.7 A 116 116 0 0 1 210.9 320.1" stroke="#d6a040" stroke-width="3" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="298" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">y 发车（need=2）</text>
  <path d="M 288 324 Q 284 316 279 310" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="225" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">目标 a · need=0</text>
  <text x="262" y="272" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#sk)">z · need=1</text>
  <path d="M 259 279 Q 254 288 251 295" stroke="#c8a24a" stroke-width="1.2" fill="none" stroke-dasharray="3 3" filter="url(#sk)"/>
  <text x="128" y="326" text-anchor="middle" font-size="11" fill="#66778a" filter="url(#sk)">b · need=25</text>
  <path d="M 158 318 Q 175 312 190 306" stroke="#9aa8b5" stroke-width="1.2" fill="none" stroke-dasharray="3 3" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="133" y="166" width="184" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="225" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">need(c) = (a − c) mod 26</text>
  <text x="225" y="203" text-anchor="middle" font-size="10.5" fill="#4a6a88" filter="url(#sk)">= 顺时针走到 a 的步数</text>
  <g filter="url(#sk)">
    <rect x="450" y="80" width="180" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="540" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">例 s = "yz"</text>
  <text x="540" y="121" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">need(y)=2, need(z)=1</text>
  <text x="540" y="138" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">k = max = 2，y 发车</text>
  <text x="540" y="155" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">班车：y → z → a（2 步）</text>
  <g filter="url(#sk)">
    <rect x="450" y="184" width="180" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="540" y="206" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">z 在 z 站顺路捎带</text>
  <text x="540" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = max need = 2</text>
  <g filter="url(#sk)">
    <rect x="450" y="258" width="180" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="540" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">一般结论</text>
  <text x="540" y="300" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">ans = max need(c)</text>
  <text x="540" y="318" text-anchor="middle" font-size="10.5" fill="#4a6a88" filter="url(#sk)">c 取 s 中出现过的字符</text>
  <text x="540" y="335" text-anchor="middle" font-size="10.5" fill="#4a6a88" filter="url(#sk)">一遍扫描即可</text>
  <g filter="url(#sk)">
    <rect x="70" y="362" width="370" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="255" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">易错：不是 Σneed —— yz 求和 = 3 ✗，max = 2 ✓</text>
</svg>
