<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">判定流程：三次比较定答案</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">顺序不能换：同格必须最先判，否则 |Δr|==|Δc|==0 会误判成 1 步</text>

  <rect x="170" y="56" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">source=(sr,sc)，target=(tr,tc)</text>

  <path d="M 260 92 L 260 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="260,106 350,146 260,186 170,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">同格？</text>
  <text x="260" y="158" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">(sr,sc) == (tr,tc)</text>

  <path d="M 350 146 L 388 146" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="390" y="126" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="438" y="180" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">无需移动</text>

  <path d="M 260 186 L 260 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="200" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <polygon points="260,210 375,254 260,298 145,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">同行 / 同列</text>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">或同对角线？</text>

  <path d="M 375 254 L 406 254" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="408" y="234" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="258" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="456" y="288" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">一步直达</text>

  <path d="M 260 298 L 260 318" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="314" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="195" y="322" width="130" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 2</text>
  <text x="340" y="346" font-size="9.5" fill="#888" filter="url(#rough2)">车式 L 形：先沿行、再沿列</text>
</svg>
