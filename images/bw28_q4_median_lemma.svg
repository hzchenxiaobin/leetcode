<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">引理图解：一组房子共用一个邮筒时，放在中位数处最优</text>

  <!-- 数轴 -->
  <path d="M 60 200 L 500 200" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="100" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="180" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="460" cy="200" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text y="226" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="100">1</tspan><tspan x="180">4</tspan><tspan x="260">8</tspan><tspan x="340">10</tspan><tspan x="460">20</tspan></text>

  <!-- 中位数邮筒 -->
  <g filter="url(#rough2)">
    <rect x="246" y="150" width="28" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="260" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">📮</text>
  <text x="260" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">中位数 8</text>

  <!-- 距离连线 -->
  <g filter="url(#rough2)">
    <path d="M 100 190 Q 180 160 252 168" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M 180 190 Q 220 172 250 172" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M 340 190 Q 300 172 270 172" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="M 460 190 Q 360 156 270 170" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>

  <!-- 交换论证 -->
  <rect x="55" y="248" width="230" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="70" y="270" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">交换论证：邮筒右移 δ &gt; 0 会怎样？</text>
  <text x="70" y="290" font-size="11" fill="#555" filter="url(#rough2)">右侧每栋房子省 δ、左侧每栋多付 δ；</text>
  <text x="70" y="308" font-size="11" fill="#555" filter="url(#rough2)">左移同理。总变化 = δ × (左 − 右)。</text>
  <text x="70" y="330" font-size="11" fill="#555" filter="url(#rough2)">只有左右房子数相等时才无法改进。</text>

  <rect x="305" y="248" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="270" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">本例（5 栋，邮筒在 8）：</text>
  <text x="320" y="290" font-size="11" fill="#555" filter="url(#rough2)">左侧 2 栋（1、4），右侧 2 栋（10、20），</text>
  <text x="320" y="308" font-size="11" fill="#555" filter="url(#rough2)">中位数自身的距离 0 不随移动变化；</text>
  <text x="320" y="330" font-size="11" fill="#555" filter="url(#rough2)">左右对称 → 8 就是最优点。</text>

  <text x="60" y="120" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">代价和：|1−8| + |4−8| + 0 + |10−8| + |20−8| = 7 + 4 + 0 + 2 + 12 = 25</text>
</svg>
