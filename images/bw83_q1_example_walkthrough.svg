<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：ranks = [4,4,2,4,4]，suits = [d,a,a,b,c]</text>

  <!-- 五张牌 -->
  <g filter="url(#rough2)" font-size="20" fill="#333" text-anchor="middle">
    <rect x="60"  y="52" width="70" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="150" y="52" width="70" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="240" y="52" width="70" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="330" y="52" width="70" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="420" y="52" width="70" height="92" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="95"  y="88" font-weight="bold">4</text>
    <text x="185" y="88" font-weight="bold">4</text>
    <text x="275" y="88" font-weight="bold">2</text>
    <text x="365" y="88" font-weight="bold">4</text>
    <text x="455" y="88" font-weight="bold">4</text>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#b85450" text-anchor="middle">
    <text x="95"  y="128">d</text>
    <text x="185" y="128">a</text>
    <text x="275" y="128">a</text>
    <text x="365" y="128">b</text>
    <text x="455" y="128">c</text>
  </g>
  <text x="150" y="168" font-size="12.5" fill="#b85450" filter="url(#rough2)">花色 d,a,a,b,c 不全同 → 排除 "Flush"</text>
  <text x="372" y="168" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">点数 4 有 4 张 ≥ 3</text>
  <path d="M 455 170 L 455 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 点数计数条形 -->
  <text x="80" y="216" font-size="13" fill="#333" filter="url(#rough2)">点数计数：</text>
  <g filter="url(#rough2)">
    <rect x="160" y="196" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="196" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="180" y="220" text-anchor="middle" font-size="14" fill="#1d3a17" font-weight="bold">4 → 4张</text>
    <rect x="220" y="196" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="220" text-anchor="middle" font-size="14" fill="#333">2 → 1张</text>
  </g>
  <text x="300" y="220" font-size="13" fill="#333" filter="url(#rough2)">最大同点数张数 best = 4</text>

  <!-- 结论 -->
  <path d="M 280 244 L 280 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="266" width="320" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="288" text-anchor="middle" font-size="14" fill="#1d3a17" filter="url(#rough2)">best = 4 ≥ 3（尽管同时也能凑出对子）</text>
  <text x="280" y="308" text-anchor="middle" font-size="15" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">返回 "Three of a Kind"</text>

  <g filter="url(#rough2)">
    <rect x="60" y="340" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="365" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">顺次判定：对子条件成立也不回头——更差的类型直接被跳过。</text>
</svg>
