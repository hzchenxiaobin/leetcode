<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个被钉死的结构：s₁ 不变、前导 0 永远是 0</text>
  <path d="M 168 40 Q 390 47 612 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="390" y="64" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 s = 0 0 1 0 1 1 0 为例：j = 2（前导 0 个数），Z = 4（0 的总数）</text>

  <!-- 下标 -->
  <text x="272" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="322" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="372" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="422" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="472" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="522" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="572" y="88" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>

  <!-- 锁死区：前两格 -->
  <rect x="250" y="96" width="44" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <rect x="300" y="96" width="44" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="272" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#33582a" filter="url(#rough2)">0</text>
  <text x="322" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#33582a" filter="url(#rough2)">0</text>

  <!-- 其余格 -->
  <rect x="350" y="96" width="44" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="400" y="96" width="44" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="450" y="96" width="44" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="500" y="96" width="44" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="550" y="96" width="44" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="422" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="472" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="522" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="572" y="123" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>

  <!-- 左：s1 说明 -->
  <rect x="36" y="96" width="180" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="114" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">i = 1 的 AND / OR</text>
  <text x="126" y="132" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">都等于 s₁ 本身 ⇒ s₁ 不变</text>
  <path d="M 218 118 L 246 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 区域括号 -->
  <path d="M 250 144 L 250 152 L 344 152 L 344 144" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="297" y="170" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">永远为 0</text>
  <text x="297" y="186" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（前缀全 0 ⇒ AND = OR = 0）</text>

  <path d="M 350 144 L 350 152 L 594 152 L 594 144" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="472" y="170" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">这些位置都可能被改写</text>
  <text x="472" y="186" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（OR 让 0→1，AND 让 1→0）</text>

  <!-- 结论 -->
  <rect x="60" y="196" width="660" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">终局只能形如 0^a 1^(n−a)，且切点满足 a ≥ j</text>
  <text x="390" y="237" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">非降序 01 串只有一种形状；前导 0 区已冻结，切点不能伸进去</text>

  <!-- 可行切点条 -->
  <text x="390" y="268" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">切点 a 的可行取值：</text>
  <rect x="194" y="276" width="42" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="244" y="276" width="42" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="344" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="394" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="444" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="494" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="544" y="276" width="42" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="296" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="265" y="296" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">1</text>
  <text x="315" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">2</text>
  <text x="365" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="415" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="465" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">5</text>
  <text x="515" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">6</text>
  <text x="565" y="296" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">7</text>

  <path d="M 194 312 L 194 320 L 286 320 L 286 312" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="240" y="338" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">不可行（位置 1, 2 已是 0）</text>

  <path d="M 294 312 L 294 320 L 586 320 L 586 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="440" y="338" text-anchor="middle" font-size="10.5" fill="#33582a" filter="url(#rough2)">可行：从左到右试每一种切点</text>

  <rect x="60" y="348" width="660" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="366" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">代价 f(a) = 前缀中 1 的个数 + 后缀中 0 的个数 —— 就是「错位数」</text>
</svg>
