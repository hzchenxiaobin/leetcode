<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两针转速与「劣角」：答案永远取 min(θ, 360° − θ)</text>

  <!-- 左：转速对比 -->
  <text x="150" y="64" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">指针转速</text>
  <rect x="30" y="80" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="105" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">分针</text>
  <path d="M 92 100 L 246 100" stroke="#446688" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6°/分（60 分一圈 360°）</text>

  <rect x="30" y="130" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="155" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">时针</text>
  <path d="M 92 150 L 122 150" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="142" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">0.5°/分</text>
  <text x="185" y="161" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（12 小时 360°）</text>

  <rect x="30" y="182" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="202" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">相对速度 6 − 0.5 = 5.5°/分</text>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">分针每 720/11 分追平时针一次</text>

  <!-- 左下：另一等价公式 -->
  <rect x="30" y="244" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">等价公式</text>
  <text x="150" y="286" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">θ = |30h′ − 5.5m|，h′ = h mod 12</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（两种写法完全等价）</text>

  <!-- 右：3:15 小夹角 7.5° -->
  <text x="430" y="64" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：3:15 → 夹角仅 7.5°</text>
  <circle cx="430" cy="200" r="86" fill="#fffdf5" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#8a7a5c" stroke-width="2">
    <path d="M 430 114 L 430 122"/>
    <path d="M 473 129 L 469 137"/>
    <path d="M 502 157 L 495 163"/>
    <path d="M 516 200 L 508 200"/>
    <path d="M 502 243 L 495 237"/>
    <path d="M 473 271 L 469 263"/>
    <path d="M 430 286 L 430 278"/>
    <path d="M 387 271 L 391 263"/>
    <path d="M 358 243 L 365 237"/>
    <path d="M 344 200 L 352 200"/>
    <path d="M 358 157 L 365 163"/>
    <path d="M 387 129 L 391 137"/>
  </g>
  <!-- 时针 97.5°，分针 90° -->
  <path d="M 430 200 L 504 200" stroke="#446688" stroke-width="3" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 430 200 L 499.4 209.1" stroke="#b85450" stroke-width="4.5" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 430 200 L 504 200 A 74 74 0 0 1 503.4 209.7 Z" fill="#fce4ec" filter="url(#rough2)"/>
  <circle cx="430" cy="200" r="5" fill="#333" filter="url(#rough2)"/>
  <text x="468" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分针 90°</text>
  <text x="486" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">时针 97.5°</text>
  <text x="430" y="306" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">15 分 × 6° = 90°；3×30° + 15×0.5° = 97.5°</text>

  <rect x="330" y="322" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="340" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">差 7.5°，另一侧 352.5°</text>
  <text x="435" y="358" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">min(7.5, 352.5) = 7.5 ✓</text>
</svg>
