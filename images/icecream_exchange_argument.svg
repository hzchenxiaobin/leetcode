<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：交换论证——贵的换成便宜的</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- band 1: sorted bars -->
  <text x="42" y="94" font-size="12.5" fill="#555">升序排序后：</text>
  <g filter="url(#sk)">
    <polygon points="128,100 152,100 140,126" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.4"/>
    <circle cx="140" cy="88" r="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="140" y="144" text-anchor="middle" font-size="12" fill="#444">1 元</text>
  <g filter="url(#sk)">
    <polygon points="218,100 242,100 230,126" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.4"/>
    <circle cx="230" cy="88" r="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="230" y="144" text-anchor="middle" font-size="12" fill="#444">1 元</text>
  <g filter="url(#sk)">
    <polygon points="308,100 332,100 320,126" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.4"/>
    <circle cx="320" cy="88" r="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="144" text-anchor="middle" font-size="12" fill="#444">2 元</text>
  <g filter="url(#sk)">
    <polygon points="398,100 422,100 410,126" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.4"/>
    <circle cx="410" cy="88" r="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#444">3 元</text>
  <g filter="url(#sk)">
    <polygon points="488,100 512,100 500,126" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.4"/>
    <circle cx="500" cy="88" r="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="500" y="144" text-anchor="middle" font-size="12" fill="#444">4 元</text>

  <!-- band 2: exchange demo -->
  <g filter="url(#sk)">
    <rect x="36" y="172" width="260" height="136" rx="10" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="166" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">某可行方案 S</text>
  <g filter="url(#sk)">
    <polygon points="88,226 112,226 100,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="100" cy="214" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="100" y="270" text-anchor="middle" font-size="11" fill="#444">1 元</text>
  <g filter="url(#sk)">
    <polygon points="154,226 178,226 166,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="166" cy="214" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="166" y="270" text-anchor="middle" font-size="11" fill="#444">2 元</text>
  <g filter="url(#sk)">
    <polygon points="220,226 244,226 232,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="232" cy="214" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="232" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04040">4 元</text>
  <text x="166" y="294" text-anchor="middle" font-size="11.5" fill="#555">共 3 支，总价 7 ≤ coins</text>

  <path d="M 298 240 L 340 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04040">4 ⇒ 1</text>
  <text x="320" y="262" text-anchor="middle" font-size="10.5" fill="#777">交换</text>

  <g filter="url(#sk)">
    <rect x="344" y="172" width="260" height="136" rx="10" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4"/>
  </g>
  <text x="474" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">交换后 S′</text>
  <g filter="url(#sk)">
    <polygon points="396,226 420,226 408,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="408" cy="214" r="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="408" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1 元</text>
  <g filter="url(#sk)">
    <polygon points="462,226 486,226 474,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="474" cy="214" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="474" y="270" text-anchor="middle" font-size="11" fill="#444">1 元</text>
  <g filter="url(#sk)">
    <polygon points="528,226 552,226 540,252" fill="#fdf0dd" stroke="#c98a2b" stroke-width="1.3"/>
    <circle cx="540" cy="214" r="11" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="540" y="270" text-anchor="middle" font-size="11" fill="#444">2 元</text>
  <text x="474" y="294" text-anchor="middle" font-size="11.5" fill="#555">仍 3 支，总价 4 ≤ 7，省下 3 元</text>

  <!-- band 3: conclusion -->
  <g filter="url(#sk)">
    <rect x="36" y="330" width="568" height="84" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">只要方案里买了贵的 b、却漏掉更便宜的 a，就把 b 换成 a：</text>
  <text x="320" y="376" text-anchor="middle" font-size="12.5" fill="#2e6e2e">支数不变、总价不增 → 仍是可行方案</text>
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">反复交换 ⇒ 最优解总能取「最便宜前缀」——从最便宜的开始买！</text>

  <g filter="url(#sk)">
    <rect x="150" y="428" width="340" height="32" rx="6" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,4"/>
  </g>
  <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#777">贪心前提：每支贡献同为 +1、价格非负、购买顺序任意</text>
</svg>
