<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="420" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：hours = [12, 12, 30, 24, 24]</text>
  <path d="M 140 38 Q 330 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="15" y="56" width="50" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="65" y="56" width="80" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="145" y="56" width="80" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="225" y="56" width="170" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="395" y="56" width="66" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="461" y="56" width="184" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="40" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="40" y="90" text-anchor="middle" font-size="10" fill="#7a9ac0">(下标)</text>
  <text x="105" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">hours[i]</text>
  <text x="105" y="90" text-anchor="middle" font-size="10" fill="#7a9ac0">(元素)</text>
  <text x="185" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">r</text>
  <text x="185" y="90" text-anchor="middle" font-size="10" fill="#7a9ac0">= h mod 24</text>
  <text x="310" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">查 cnt[(24−r)%24]</text>
  <text x="310" y="90" text-anchor="middle" font-size="10" fill="#a8843a">(查互补余数)</text>
  <text x="428" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">ans</text>
  <text x="428" y="90" text-anchor="middle" font-size="10" fill="#a8843a">(累加后)</text>
  <text x="553" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt 更新后</text>
  <text x="553" y="90" text-anchor="middle" font-size="10" fill="#5a9a5a">(余数表)</text>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="15" y="100" width="50" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="65" y="100" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="145" y="100" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="225" y="100" width="170" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="395" y="100" width="66" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="461" y="100" width="184" height="40" rx="4" fill="#f6fbf7" stroke="#b8d8b0" stroke-width="1"/>
  </g>
  <text x="40" y="125" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="105" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="185" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="310" y="125" text-anchor="middle" font-size="12" fill="#8a6415">cnt[12] = 0</text>
  <text x="428" y="125" text-anchor="middle" font-size="12" fill="#8a6415">0</text>
  <text x="553" y="125" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">{12:1}</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="15" y="144" width="50" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="65" y="144" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="145" y="144" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="225" y="144" width="170" height="40" rx="4" fill="#fdf3dd" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="395" y="144" width="66" height="40" rx="4" fill="#fdf3dd" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="461" y="144" width="184" height="40" rx="4" fill="#f6fbf7" stroke="#b8d8b0" stroke-width="1"/>
  </g>
  <text x="40" y="169" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="105" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="185" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">12</text>
  <text x="310" y="169" text-anchor="middle" font-size="12" fill="#b8761a" font-weight="bold">cnt[12] = 1 → +1</text>
  <text x="428" y="169" text-anchor="middle" font-size="12" fill="#b8761a" font-weight="bold">1</text>
  <text x="553" y="169" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">{12:2}</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="15" y="188" width="50" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="65" y="188" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="145" y="188" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="225" y="188" width="170" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="395" y="188" width="66" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="461" y="188" width="184" height="40" rx="4" fill="#f6fbf7" stroke="#b8d8b0" stroke-width="1"/>
  </g>
  <text x="40" y="213" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="105" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">30</text>
  <text x="185" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <text x="310" y="213" text-anchor="middle" font-size="12" fill="#8a6415">cnt[18] = 0</text>
  <text x="428" y="213" text-anchor="middle" font-size="12" fill="#8a6415">1</text>
  <text x="553" y="213" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">{12:2, 6:1}</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="15" y="232" width="50" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="65" y="232" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="145" y="232" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="225" y="232" width="170" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="395" y="232" width="66" height="40" rx="4" fill="#ffffff" stroke="#d8c8a0" stroke-width="1"/>
    <rect x="461" y="232" width="184" height="40" rx="4" fill="#f6fbf7" stroke="#b8d8b0" stroke-width="1"/>
  </g>
  <text x="40" y="257" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="105" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">24</text>
  <text x="185" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="310" y="257" text-anchor="middle" font-size="12" fill="#8a6415">cnt[0] = 0</text>
  <text x="428" y="257" text-anchor="middle" font-size="12" fill="#8a6415">1</text>
  <text x="553" y="257" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">{12:2, 6:1, 0:1}</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="15" y="276" width="50" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="65" y="276" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="145" y="276" width="80" height="40" rx="4" fill="#ffffff" stroke="#b8c8d8" stroke-width="1"/>
    <rect x="225" y="276" width="170" height="40" rx="4" fill="#fdf3dd" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="395" y="276" width="66" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="461" y="276" width="184" height="40" rx="4" fill="#f6fbf7" stroke="#b8d8b0" stroke-width="1"/>
  </g>
  <text x="40" y="301" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="105" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">24</text>
  <text x="185" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="310" y="301" text-anchor="middle" font-size="12" fill="#b8761a" font-weight="bold">cnt[0] = 1 → +1</text>
  <text x="428" y="301" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="553" y="301" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">{12:2, 6:1, 0:2}</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="60" y="338" width="540" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="330" y="368" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">答案 ans = 2：下标对 (0, 1) 与 (3, 4)，均构成整天 ✓</text>

  <text x="330" y="406" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">加粗橙格 = 找到了互补余数；红格 = 答案增加的时刻</text>
</svg>
