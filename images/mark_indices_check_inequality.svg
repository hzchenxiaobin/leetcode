<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">判定不等式 S_j ≤ t_j − j：前 t_j 秒的容量账本</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">设前 3 个标记发生在秒 3、6、9（j = 3，t₃ = 9），S₃ = 2 + 0 + 3 = 5</text>

  <!-- 时间带：9 格 -->
  <rect x="36" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="86" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="62" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="186" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="62" width="46" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="336" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="62" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="436" y="62" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <text x="59" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="109" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="159" y="87" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标1</text>
  <text x="209" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="259" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="309" y="87" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标2</text>
  <text x="359" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="409" y="87" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">减1</text>
  <text x="459" y="87" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">标3</text>

  <text x="59" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒1</text>
  <text x="109" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒2</text>
  <text x="159" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒3</text>
  <text x="209" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒4</text>
  <text x="259" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒5</text>
  <text x="309" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒6</text>
  <text x="359" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒7</text>
  <text x="409" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒8</text>
  <text x="459" y="118" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒9</text>

  <!-- 容量标注 -->
  <path d="M36,128 L36,140" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M432,128 L432,140" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M36,140 L432,140" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="234" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">秒 9 之前的 8 秒，扣掉 2 个更早的标记秒 ⇒ 减 1 容量 = t₃ − 3 = 6</text>

  <!-- S_3 的 5 个减 1 -->
  <text x="40" y="196" font-size="12" fill="#666" filter="url(#rough2)">而这 3 个下标共需 S₃ = 5 次减 1：</text>
  <rect x="40" y="204" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="84" y="204" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="204" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="204" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="204" width="40" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下标1 需 2 次</text>
  <text x="148" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下标2 需 0 次</text>
  <text x="236" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">下标3 需 3 次</text>

  <text x="300" y="224" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ≤ 6 ✓ 塞得下</text>

  <!-- 大字不等式 -->
  <rect x="36" y="264" width="448" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">对每个 j（按标记时刻升序）：S_j ≤ t_j − j</text>

  <rect x="36" y="318" width="448" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="338" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部成立 ⟺ 可行。这是「截止期调度」的 Hall 条件特例，</text>
  <text x="52" y="356" font-size="12" fill="#4a7a3a" filter="url(#rough2)">也是最早截止期优先（EDF）可行性的判据——逐前缀核对即可</text>
</svg>
