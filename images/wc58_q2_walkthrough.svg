<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例走查：head = [1..10]，k = 3</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 10 → base = 3，extra = 1 → 各段长度 4, 3, 3</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="101" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <rect x="92" y="80" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="101" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <rect x="144" y="80" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="164" y="101" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
    <rect x="196" y="80" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="101" text-anchor="middle" font-size="12" fill="#3a4a66">4</text>
    <rect x="248" y="80" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="268" y="101" text-anchor="middle" font-size="12" fill="#3a5a30">5</text>
    <rect x="300" y="80" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="320" y="101" text-anchor="middle" font-size="12" fill="#3a5a30">6</text>
    <rect x="352" y="80" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="372" y="101" text-anchor="middle" font-size="12" fill="#3a5a30">7</text>
    <rect x="404" y="80" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="424" y="101" text-anchor="middle" font-size="12" fill="#8a6a20">8</text>
    <rect x="456" y="80" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="476" y="101" text-anchor="middle" font-size="12" fill="#8a6a20">9</text>
    <rect x="508" y="80" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="528" y="101" text-anchor="middle" font-size="12" fill="#8a6a20">10</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M 80 96 L 88 96"/>
    <path d="M 132 96 L 140 96"/>
    <path d="M 184 96 L 192 96"/>
    <path d="M 236 96 L 244 96"/>
    <path d="M 288 96 L 296 96"/>
    <path d="M 340 96 L 348 96"/>
    <path d="M 392 96 L 400 96"/>
    <path d="M 444 96 L 452 96"/>
    <path d="M 496 96 L 504 96"/>
  </g>

  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M 242 66 L 242 122"/>
    <path d="M 458 66 L 458 122"/>
  </g>
  <text x="242" y="130" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">断链</text>
  <text x="458" y="130" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">断链</text>

  <g filter="url(#rough2)" stroke="#9aa7b8" stroke-width="1.3" fill="none">
    <path d="M 40 140 L 40 152 L 236 152 L 236 140"/>
    <path d="M 248 140 L 248 152 L 452 152 L 452 140"/>
    <path d="M 464 140 L 464 152 L 548 152 L 548 140"/>
  </g>
  <text x="138" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段 0 · 4 个</text>
  <text x="350" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">段 1 · 3 个</text>
  <text x="506" y="172" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">段 2 · 3 个</text>

  <g filter="url(#rough2)">
    <rect x="40" y="190" width="520" height="140" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.5" rx="8"/>
    <path d="M 40 226 L 560 226" stroke="#d5dde8" stroke-width="1.2" fill="none"/>
    <path d="M 120 190 L 120 330" stroke="#e3e8f0" stroke-width="1" fill="none"/>
    <path d="M 260 190 L 260 330" stroke="#e3e8f0" stroke-width="1" fill="none"/>
    <path d="M 420 190 L 420 330" stroke="#e3e8f0" stroke-width="1" fill="none"/>
    <text x="80" y="216" text-anchor="middle" font-size="11" fill="#667" >i</text>
    <text x="190" y="216" text-anchor="middle" font-size="11" fill="#667">len = base + (i &lt; extra)</text>
    <text x="340" y="216" text-anchor="middle" font-size="11" fill="#667">走 len − 1 步到段尾</text>
    <text x="490" y="216" text-anchor="middle" font-size="11" fill="#667">下一段的 cur</text>

    <text x="80" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">0</text>
    <text x="190" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">3 + 1 = 4</text>
    <text x="340" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">4 → 把 4.next 置空</text>
    <text x="490" y="254" text-anchor="middle" font-size="12" fill="#3a4a66">5</text>

    <text x="80" y="288" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="190" y="288" text-anchor="middle" font-size="12" fill="#3a4a66">3 + 0 = 3</text>
    <text x="340" y="288" text-anchor="middle" font-size="12" fill="#3a4a66">7 → 把 7.next 置空</text>
    <text x="490" y="288" text-anchor="middle" font-size="12" fill="#3a4a66">8</text>

    <text x="80" y="322" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="190" y="322" text-anchor="middle" font-size="12" fill="#3a4a66">3 + 0 = 3</text>
    <text x="340" y="322" text-anchor="middle" font-size="12" fill="#3a4a66">10 → 把 10.next 置空</text>
    <text x="490" y="322" text-anchor="middle" font-size="12" fill="#3a4a66">null</text>
  </g>

  <text x="300" y="358" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">先记下 nxt 再置空，顺序颠倒就会把后半条链表弄丢</text>
  <text x="300" y="386" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">同一份逻辑对 [1,2,3]、k = 5：n = 3，base = 0，extra = 3 → 1, 1, 1, 0, 0</text>
</svg>
