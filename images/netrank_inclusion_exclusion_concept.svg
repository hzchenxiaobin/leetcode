<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：rank(u,v) = deg(u) + deg(v) − [u↔v 直连]</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: example 1 graph, pair (0,1) -->
  <text x="44" y="74" font-size="12.5" font-weight="bold" fill="#2b2b2b">示例 1：考察城市对 (0, 1)</text>

  <!-- edges -->
  <path d="M 95 175 L 235 120" stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 95 175 L 150 250" stroke="#4a8edb" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 235 120 L 300 200" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 235 120 L 150 250" stroke="#4a8e4a" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- edge annotation -->
  <text x="145" y="134" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">0↔1 被数两次</text>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="95" cy="175" r="16" fill="#4a8edb" stroke="#33669c" stroke-width="1.6"/>
    <circle cx="235" cy="120" r="16" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="300" cy="200" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
    <circle cx="150" cy="250" r="15" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.4"/>
  </g>
  <text x="95" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">0</text>
  <text x="235" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="300" y="205" text-anchor="middle" font-size="13" fill="#333333">2</text>
  <text x="150" y="255" text-anchor="middle" font-size="13" fill="#333333">3</text>

  <!-- degree labels -->
  <text x="72" y="180" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2b6e9e">deg 2</text>
  <text x="235" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">deg 3</text>
  <text x="322" y="206" font-size="11.5" fill="#555555">deg 1</text>
  <text x="150" y="288" text-anchor="middle" font-size="11.5" fill="#555555">deg 2</text>

  <!-- Panel B: Venn diagram -->
  <text x="490" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">容斥：与 0 或 1 相连的边</text>
  <text x="418" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">deg(0) = 2</text>
  <path d="M 424 100 L 442 110" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="566" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">deg(1) = 3</text>
  <path d="M 560 100 L 542 110" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="448" cy="175" r="62" fill="#e8f0fa" fill-opacity="0.62" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="532" cy="175" r="62" fill="#e6f4ea" fill-opacity="0.62" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="424" y="170" text-anchor="middle" font-size="12" fill="#2b6e9e">0–3</text>
  <text x="424" y="189" text-anchor="middle" font-size="11" fill="#2b6e9e">1 条</text>
  <text x="490" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0–1</text>
  <text x="490" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">1 条</text>
  <text x="534" y="170" text-anchor="middle" font-size="12" fill="#2e6e2e">1–2</text>
  <text x="572" y="170" text-anchor="middle" font-size="12" fill="#2e6e2e">1–3</text>
  <text x="552" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e">2 条</text>
  <text x="490" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">|E(0) ∪ E(1)| = 2 + 3 − 1 = 4</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="296" width="580" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">rank(u, v) = deg(u) + deg(v) − [u ↔ v 直连]</text>
  <text x="320" y="343" text-anchor="middle" font-size="11.5" fill="#8a6415">每对城市最多一条道路 ⇒ E(u) ∩ E(v) 要么为空，要么恰好是 (u,v) 这条边</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="40" y="364" width="580" height="60" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">预处理 O(n+m)：度数数组 deg[ ] + 直连判定，此后每对城市 O(1) 出值</text>
  <text x="320" y="410" text-anchor="middle" font-size="12" fill="#2e6e2e">剩下的就是无脑双循环——n ≤ 100 时至多 C(100,2) = 4950 对</text>
</svg>
