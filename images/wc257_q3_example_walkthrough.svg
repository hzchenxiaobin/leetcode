<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nextVisit = [0, 0, 2]（n = 3，答案 6）</text>
  <path d="M 160 34 Q 320 42 480 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- timeline panel -->
  <rect x="16" y="44" width="608" height="212" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">逐日访问序列（第 0 ~ 6 天）</text>

  <!-- day labels -->
  <text x="74" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第0天</text>
  <text x="158" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第1天</text>
  <text x="242" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第2天</text>
  <text x="326" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第3天</text>
  <text x="410" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第4天</text>
  <text x="494" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第5天</text>
  <text x="578" y="88" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">第6天</text>

  <!-- day cells -->
  <rect x="36" y="94" width="76" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 0</text>
  <text x="74" y="128" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">第1次·奇</text>

  <rect x="120" y="94" width="76" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 0</text>
  <text x="158" y="128" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">第2次·偶</text>

  <rect x="204" y="94" width="76" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">房间 1</text>
  <text x="242" y="128" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">第1次·奇</text>

  <rect x="288" y="94" width="76" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 0</text>
  <text x="326" y="128" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">第3次·奇</text>

  <rect x="372" y="94" width="76" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 0</text>
  <text x="410" y="128" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">第4次·偶</text>

  <rect x="456" y="94" width="76" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="494" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 1</text>
  <text x="494" y="128" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">第2次·偶</text>

  <rect x="540" y="94" width="76" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="578" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">房间 2</text>
  <text x="578" y="128" text-anchor="middle" font-size="8.5" fill="#2d5a24" filter="url(#rough2)">首访·答案</text>

  <!-- phase brackets -->
  <path d="M 36 152 L 36 146 L 280 146 L 280 152" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="158" y="170" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">阶段 0：dp[0] = 2 天（首访 0 → 首访 1）</text>

  <path d="M 204 182 L 204 176 L 616 176 L 616 182" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="410" y="200" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">阶段 1：dp[1] = 4 天（首访 1 → 首访 2：跳回 0 + 重放阶段 0 + 前进）</text>

  <text x="320" y="222" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 2 天首访 1（奇）→ 次日跳回 nextVisit[1] = 0</text>
  <text x="320" y="240" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">第 3、4 天逐日重放阶段 0 的两天 → 第 5 天再访 1（偶）→ 第 6 天首访 2 ✓</text>

  <!-- DP table panel -->
  <rect x="16" y="268" width="608" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">DP 递推表（pre[i] = dp[0] + … + dp[i−1]）</text>

  <rect x="48" y="298" width="544" height="22" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="313" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">i</text>
  <text x="200" y="313" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">j = nextVisit[i]</text>
  <text x="340" y="313" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">dp[i] = 2 + pre[i] − pre[j]</text>
  <text x="500" y="313" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">pre[i+1]</text>

  <rect x="48" y="322" width="544" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="200" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2 + 0 − 0 = 2</text>
  <text x="500" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="48" y="344" width="544" height="20" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2 + 2 − 0 = 4</text>
  <text x="500" y="358" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- answer banner -->
  <rect x="16" y="400" width="608" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">答案 = pre[n−1] = pre[2] = dp[0] + dp[1] = 6 —— 第 6 天首次到访房间 2，全部房间已访问 ✓</text>

  <text x="320" y="460" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">对照示例 3 [0, 1, 2, 0]：处处 nextVisit[i] = i，折返区间为空 → dp[i] = 2，答案 = 2 + 2 + 2 = 6 ✓</text>
</svg>
