<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 645"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="645" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：对撞双指针 → 双计数 → 判相等</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="245" y="36" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="340" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">开始：n = len(s)</text>
  <path d="M340 70 V82" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- init -->
  <g filter="url(#rough2)">
    <rect x="215" y="86" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="340" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">i ← 0，j ← n−1，cntA ← cntB ← 0</text>
  <path d="M340 118 V132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- D1: i < j ? -->
  <g filter="url(#rough2)">
    <polygon points="340,136 450,174 340,212 230,174" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="340" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i &lt; j ?</text>
  <path d="M 450 174 H 662 V 542 H 478" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="466" y="166" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <text x="556" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">偶数长度 ⇒ 恰好配 n/2 对</text>
  <path d="M340 212 V226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="224" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- D2: s[i] vowel? -->
  <g filter="url(#rough2)">
    <polygon points="340,230 455,268 340,306 225,268" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[i] ∈ aeiouAEIOU ?</text>
  <path d="M455 268 H496" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="473" y="258" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="500" y="251" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="570" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#rough2)">cntA += 1</text>
  <text x="570" y="299" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↻ 继续看 j 端</text>
  <path d="M340 306 V322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="352" y="318" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- D3: s[j] vowel? -->
  <g filter="url(#rough2)">
    <polygon points="340,326 455,364 340,402 225,364" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="369" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[j] ∈ aeiouAEIOU ?</text>
  <path d="M455 364 H496" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="473" y="354" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="500" y="347" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="570" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">cntB += 1</text>
  <text x="570" y="395" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">↻ 本对结束</text>
  <path d="M340 402 V418" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="352" y="414" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- advance -->
  <g filter="url(#rough2)">
    <rect x="215" y="422" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="340" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">i += 1，j −= 1</text>

  <!-- loop back -->
  <path d="M 215 438 H 55 V 174 H 224" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="63" y="310" font-size="10" fill="#888" filter="url(#rough2)">↻ 下一对</text>

  <!-- D4: compare -->
  <g filter="url(#rough2)">
    <polygon points="340,505 470,542 340,579 210,542" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="340" y="547" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cntA == cntB ?</text>
  <path d="M210 542 H156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="182" y="532" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="26" y="525" width="126" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <text x="89" y="546" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">return true</text>
  <path d="M340 579 V593" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="352" y="590" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="272" y="597" width="136" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="340" y="618" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
</svg>
