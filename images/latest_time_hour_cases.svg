<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：小时两位互相牵制，分钟两位各自独立</text>

  <!-- s positions -->
  <text x="52" y="86" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">s =</text>

  <rect x="80" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="102" y="87" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">H</text>

  <rect x="130" y="58" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="87" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">H</text>

  <text x="185" y="87" text-anchor="middle" font-size="17" fill="#777" font-weight="bold" filter="url(#rough2)">:</text>

  <rect x="196" y="58" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="218" y="87" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">M</text>

  <rect x="246" y="58" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="87" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">M</text>

  <text x="102" y="118" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">s[0]</text>
  <text x="152" y="118" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">s[1]</text>
  <text x="218" y="118" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">s[3]</text>
  <text x="268" y="118" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">s[4]</text>

  <rect x="74" y="50" width="106" height="60" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3" rx="10" filter="url(#rough2)"/>
  <rect x="190" y="50" width="106" height="60" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" rx="10" filter="url(#rough2)"/>

  <text x="127" y="138" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小时 HH ≤ 11</text>
  <text x="243" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分钟 MM ≤ 59</text>

  <text x="312" y="78" font-size="11.5" fill="#555" filter="url(#rough2)">只有 s[0]、s[1]、s[3]、s[4]</text>
  <text x="312" y="96" font-size="11.5" fill="#555" filter="url(#rough2)">可能是 '?'（s[2]=':' 固定）</text>

  <!-- hour candidates -->
  <text x="48" y="164" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">小时的 12 个候选（越右越晚）：</text>

  <rect x="62" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">00</text>
  <rect x="96" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">01</text>
  <rect x="130" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">02</text>
  <rect x="164" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">03</text>
  <rect x="198" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">04</text>
  <rect x="232" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">05</text>
  <rect x="266" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">06</text>
  <rect x="300" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">07</text>
  <rect x="334" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">08</text>
  <rect x="368" y="172" width="28" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="382" y="191" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">09</text>
  <rect x="402" y="172" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="191" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="436" y="172" width="28" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="191" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">11</text>

  <text x="450" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">目标</text>
  <path d="M 450 166 L 450 171" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- coupling rules -->
  <rect x="48" y="220" width="424" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="244" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">耦合规则：十位 ∈ {0,1}，且十位 = '1' 时个位 ≤ '1'</text>
  <text x="62" y="266" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">十位 '?'：冲 '1' 需个位 ∈ {?, 0, 1}，否则兜底 '0'（02…09）</text>
  <text x="62" y="288" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">个位 '?'：十位 '0' → 填 '9'；十位 '1' → 填 '1'</text>

  <!-- minute rules -->
  <rect x="48" y="322" width="424" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="62" y="344" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">分钟无耦合（≤59 ⟺ 十位≤5、个位任意）：'?' 直接填 '5' 和 '9'</text>
  <text x="62" y="364" font-size="11" fill="#2f5d24" filter="url(#rough2)">50~59、X9（X≤5）全部合法 —— 两位各自拉满，互不妨碍</text>

  <!-- conclusion -->
  <rect x="48" y="384" width="424" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="403" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结论：先拉满小时，再各自拉满分钟 —— 4 个 '?' 位每个 O(1) 定值</text>
</svg>
