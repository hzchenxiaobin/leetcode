<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：dist 网格与队列两段变化</text>
  <path d="M 200 44 Q 440 52 680 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：dist 终态网格 -->
  <text x="175" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">dist 终态（颜色 = 层）</text>
  <!-- row 0 -->
  <rect x="90" y="100" width="56" height="56" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="118" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="118" y="146" text-anchor="middle" font-size="10" fill="#2b6e9e">(0,0)</text>
  <rect x="146" y="100" width="56" height="56" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="174" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="174" y="146" text-anchor="middle" font-size="10" fill="#2e6e2e">(0,1)</text>
  <rect x="202" y="100" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="230" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="230" y="146" text-anchor="middle" font-size="10" fill="#7a5415">(0,2)</text>
  <!-- row 1 -->
  <rect x="90" y="156" width="56" height="56" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="118" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="118" y="202" text-anchor="middle" font-size="10" fill="#2e6e2e">(1,0)</text>
  <rect x="146" y="156" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="174" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="174" y="202" text-anchor="middle" font-size="10" fill="#7a5415">(1,1)</text>
  <rect x="202" y="156" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="230" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="230" y="202" text-anchor="middle" font-size="10" fill="#7a5415">(1,2)</text>
  <!-- row 2 -->
  <rect x="90" y="212" width="56" height="56" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="118" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="118" y="258" text-anchor="middle" font-size="10" fill="#7a5415">(2,0)</text>
  <rect x="146" y="212" width="56" height="56" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="174" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#8c3a36">3</text>
  <text x="174" y="258" text-anchor="middle" font-size="10" fill="#8c3a36">(2,1)</text>
  <rect x="202" y="212" width="56" height="56" rx="5" fill="#fef6e6" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="230" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">2</text>
  <text x="230" y="258" text-anchor="middle" font-size="10" fill="#7a5415">(2,2) 终点</text>

  <!-- 最优路径 -->
  <path d="M 122 128 L 158 128" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 178 128 L 214 128" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 230 134 L 230 168" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 230 190 L 230 224" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="175" y="290" text-anchor="middle" font-size="11.5" fill="#8c3a36">红路径：移除 (0,1)(0,2) 两处障碍</text>
  <text x="175" y="312" text-anchor="middle" font-size="11.5" fill="#888">粉格 (2,1)=3：从下方绕反而更贵</text>
  <text x="175" y="334" text-anchor="middle" font-size="11.5" fill="#888">答案 = dist[2][2] = 2</text>

  <!-- 右：队列演化 -->
  <text x="610" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">队列演化（绿色 = 0 边插队首，橙色 = 1 边插队尾）</text>

  <!-- 行 1 -->
  <text x="345" y="126" font-size="11.5" fill="#333">步 1-2｜pop (0,0) d=0：</text>
  <text x="345" y="143" font-size="11.5" fill="#333">障碍邻居键 1 入队尾</text>
  <rect x="500" y="110" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="536" y="134" text-anchor="middle" font-size="12" fill="#7a5415">(0,1)</text>
  <rect x="572" y="110" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="608" y="134" text-anchor="middle" font-size="12" fill="#7a5415">(1,0)</text>
  <text x="660" y="134" font-size="11.5" fill="#888">全键 1</text>

  <!-- 行 2 -->
  <text x="345" y="196" font-size="11.5" fill="#333">步 3-5｜pop (0,1)(1,0) d=1：</text>
  <text x="345" y="213" font-size="11.5" fill="#333">键 2 邻居继续入队尾</text>
  <rect x="500" y="180" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="536" y="204" text-anchor="middle" font-size="12" fill="#7a5415">(0,2)</text>
  <rect x="572" y="180" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="608" y="204" text-anchor="middle" font-size="12" fill="#7a5415">(1,1)</text>
  <rect x="644" y="180" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="680" y="204" text-anchor="middle" font-size="12" fill="#7a5415">(2,0)</text>
  <text x="732" y="204" font-size="11.5" fill="#888">全键 2</text>

  <!-- 行 3 -->
  <text x="345" y="266" font-size="11.5" fill="#333">步 6｜pop (0,2) d=2：0 边把</text>
  <text x="345" y="283" font-size="11.5" fill="#333">空格 (1,2) 拉回队首！</text>
  <rect x="500" y="250" width="72" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="536" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(1,2)</text>
  <rect x="572" y="250" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="608" y="274" text-anchor="middle" font-size="12" fill="#7a5415">(1,1)</text>
  <rect x="644" y="250" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="680" y="274" text-anchor="middle" font-size="12" fill="#7a5415">(2,0)</text>
  <path d="M 490 269 L 496 269" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="536" y="240" text-anchor="middle" font-size="10.5" fill="#2e6e2e">← push_front（键 2）</text>
  <text x="732" y="274" font-size="11.5" fill="#888">两段</text>

  <!-- 行 4 -->
  <text x="345" y="336" font-size="11.5" fill="#333">步 7｜pop (1,2) d=2：0 边把</text>
  <text x="345" y="353" font-size="11.5" fill="#333">空格 (2,2) 拉回队首</text>
  <rect x="500" y="320" width="72" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="536" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(2,2)</text>
  <rect x="572" y="320" width="72" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7" filter="url(#sk)"/>
  <text x="608" y="344" text-anchor="middle" font-size="12" fill="#2e6e2e">(1,1)</text>
  <rect x="644" y="320" width="72" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.7" filter="url(#sk)"/>
  <text x="680" y="344" text-anchor="middle" font-size="12" fill="#7a5415">(2,0)</text>
  <path d="M 490 339 L 496 339" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="536" y="310" text-anchor="middle" font-size="10.5" fill="#2e6e2e">← push_front（键 2）</text>
  <text x="732" y="344" font-size="11.5" fill="#888">两段</text>

  <!-- 行 5 -->
  <text x="345" y="406" font-size="11.5" fill="#333">步 8｜pop (2,2) = 终点：</text>
  <text x="345" y="423" font-size="11.5" fill="#333">出队即定案，直接返回</text>
  <rect x="500" y="390" width="216" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="608" y="418" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a36">返回 d = 2 ✓</text>

  <!-- 小结框 -->
  <rect x="340" y="452" width="460" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="570" y="474" text-anchor="middle" font-size="11.5" fill="#7a5415">同层空格连片优先扫完，层与层之间由「两段队列」无缝衔接</text>

  <!-- 底部结论 -->
  <rect x="80" y="500" width="720" height="76" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="530" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">pop (0,2)、(1,2) 都是 d=2：0 边不涨层，只把同层空格提到队首</text>
  <text x="440" y="556" text-anchor="middle" font-size="12" fill="#333">出队顺序按 dist 非降 ⟹ (2,2) 第一次出队时 dist = 2 已是最优，无需再比</text>
</svg>
