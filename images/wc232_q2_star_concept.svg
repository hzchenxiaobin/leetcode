<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：中心出现在每一条边里</text>

  <!-- 左：星型图（示例 1） -->
  <line x1="155" y1="212" x2="90" y2="108" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="155" y1="212" x2="250" y2="112" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="155" y1="212" x2="232" y2="298" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="93" y="155" font-size="12" fill="#446688" filter="url(#rough2)">e0</text>
  <text x="215" y="152" font-size="12" fill="#446688" filter="url(#rough2)">e1</text>

  <circle cx="90" cy="108" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="250" cy="112" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="232" cy="298" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <circle cx="155" cy="212" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="155" y="256" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">中心 c</text>
  <text x="160" y="332" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1 的星型图（n = 4）</text>

  <!-- 图 → 边 chip 的箭头 -->
  <path d="M282,178 C 310,178 316,146 334,132" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右：前两条边的公共端点 -->
  <text x="430" y="58" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">前两条边就够（任两条都行）</text>

  <rect x="340" y="76" width="92" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="98" font-size="13" fill="#446688" filter="url(#rough2)">e0=</text>
  <text x="383" y="98" font-size="13" fill="#446688" filter="url(#rough2)">1,</text>
  <text x="404" y="98" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>

  <rect x="340" y="126" width="92" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="148" font-size="13" fill="#446688" filter="url(#rough2)">e1=</text>
  <text x="383" y="148" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="404" y="148" font-size="13" fill="#446688" filter="url(#rough2)">,3</text>

  <text x="462" y="122" font-size="15" fill="#666" filter="url(#rough2)">∩</text>

  <path d="M386,164 L386,198" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="202" width="92" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">{2}</text>
  <text x="430" y="260" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">公共端点 = 中心，唯一确定</text>

  <!-- 底部说明框 -->
  <rect x="40" y="342" width="480" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="363" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· deg(中心) = n−1，deg(非中心) = 1：度数极端二分</text>
  <text x="56" y="385" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 中心 ∈ 每条边 ⟹ e0 ∩ e1 = {c}，后续 n−3 条边无新信息</text>
</svg>
