<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：从右往左一趟扫描，每步 O(1)</text>
  <path d="M 120 36 Q 280 44 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="50" width="360" height="46" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.4"/>
  </g>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#6a5a2a">预处理：m ← 首个失配下标（无则 m ＝ n）</text>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#6a5a2a">cnt[·] ← 0，bad ← 0，nonincr ← true</text>

  <path d="M 280 96 L 280 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="192" y="108" width="176" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="125" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">for i ＝ n−1 downto 0</text>

  <path d="M 280 134 L 280 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="96" y="146" width="368" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="280" y="165" text-anchor="middle" font-size="12" fill="#8a6415">① cnt[nums[i]]++：0→1 则 bad++；−1→0 则 bad−−</text>

  <path d="M 280 176 L 280 188" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="96" y="188" width="368" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="280" y="207" text-anchor="middle" font-size="12" fill="#8a6415">② cnt[target[i]]−−：0→−1 则 bad++；1→0 则 bad−−</text>

  <path d="M 280 218 L 280 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="96" y="230" width="368" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="280" y="249" text-anchor="middle" font-size="12" fill="#8a6415">③ 若 i &lt; n−1 且 target[i] &lt; target[i+1]：nonincr ← false</text>

  <path d="M 280 260 L 280 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 280 274 L 392 314 L 280 354 L 168 314 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i ≤ m 且 bad ＝ 0</text>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">且 nonincr ？</text>

  <path d="M 392 314 L 444 314" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="306" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="446" y="299" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="491" y="318" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">ans++</text>

  <path d="M 280 354 L 280 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="296" y="366" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="192" y="368" width="176" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="385" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">i −−，继续循环</text>

  <path d="M 192 381 L 74 381 L 74 121 L 188 121" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 368 121 L 492 121 L 492 411 L 376 411" stroke="#9a8a5a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="266" text-anchor="middle" font-size="11" fill="#6a5a2a" transform="rotate(90 500 266)">循环结束（i &lt; 0）</text>

  <g filter="url(#sk)">
    <rect x="192" y="398" width="176" height="26" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.6"/>
  </g>
  <text x="280" y="415" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">返回 ans</text>
</svg>
