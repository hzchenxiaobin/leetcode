<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [0,3,2,1,3,2]，n = 4</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums 数组 -->
  <text x="62" y="73" font-size="13" font-weight="bold" fill="#2b2b2b" font-family="monospace">nums:</text>
  <g font-size="14" font-weight="bold" font-family="monospace">
    <g filter="url(#sk)"><rect x="110" y="52" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="132" y="72" text-anchor="middle" fill="#2b6e9e">0</text>
    <g filter="url(#sk)"><rect x="162" y="52" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="184" y="72" text-anchor="middle" fill="#2b6e9e">3</text>
    <g filter="url(#sk)"><rect x="214" y="52" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="236" y="72" text-anchor="middle" fill="#2b6e9e">2</text>
    <g filter="url(#sk)"><rect x="266" y="52" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="288" y="72" text-anchor="middle" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="318" y="52" width="44" height="30" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="340" y="72" text-anchor="middle" fill="#b03a3a">3</text>
    <g filter="url(#sk)"><rect x="370" y="52" width="44" height="30" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="392" y="72" text-anchor="middle" fill="#b03a3a">2</text>
  </g>
  <g font-size="10" fill="#888" font-family="monospace" text-anchor="middle">
    <text x="132" y="96">i=0</text><text x="184" y="96">i=1</text><text x="236" y="96">i=2</text>
    <text x="288" y="96">i=3</text><text x="340" y="96">i=4</text><text x="392" y="96">i=5</text>
  </g>
  <text x="452" y="72" font-size="11" fill="#b03a3a">红框 = 第二次露面</text>

  <!-- 表头 -->
  <g font-size="11" fill="#888" font-family="monospace">
    <text x="62" y="120">i , v</text>
    <text x="193" y="120" text-anchor="middle">cnt[0..3]</text>
    <text x="322" y="120">ans</text>
    <text x="432" y="120">触发</text>
  </g>

  <!-- 6 行演算 -->
  <!-- 行 0 -->
  <text x="44" y="150" font-size="12" fill="#333" font-family="monospace">i=0  v=0</text>
  <g filter="url(#sk)"><rect x="130" y="134" width="36" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="148" y="151" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="172" y="134" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="190" y="151" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="214" y="134" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="232" y="151" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="256" y="134" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="274" y="151" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <text x="322" y="151" font-size="12" fill="#888" font-family="monospace">[]</text>
  <text x="432" y="151" font-size="12" fill="#bbb">—</text>

  <!-- 行 1 -->
  <text x="44" y="188" font-size="12" fill="#333" font-family="monospace">i=1  v=3</text>
  <g filter="url(#sk)"><rect x="130" y="172" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="148" y="189" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="172" y="172" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="190" y="189" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="214" y="172" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="232" y="189" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="256" y="172" width="36" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="274" y="189" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">1</text>
  <text x="322" y="189" font-size="12" fill="#888" font-family="monospace">[]</text>
  <text x="432" y="189" font-size="12" fill="#bbb">—</text>

  <!-- 行 2 -->
  <text x="44" y="226" font-size="12" fill="#333" font-family="monospace">i=2  v=2</text>
  <g filter="url(#sk)"><rect x="130" y="210" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="148" y="227" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="172" y="210" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="190" y="227" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="214" y="210" width="36" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="232" y="227" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="256" y="210" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="274" y="227" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="322" y="227" font-size="12" fill="#888" font-family="monospace">[]</text>
  <text x="432" y="227" font-size="12" fill="#bbb">—</text>

  <!-- 行 3 -->
  <text x="44" y="264" font-size="12" fill="#333" font-family="monospace">i=3  v=1</text>
  <g filter="url(#sk)"><rect x="130" y="248" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="148" y="265" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="172" y="248" width="36" height="24" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="190" y="265" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="214" y="248" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="232" y="265" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="256" y="248" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="274" y="265" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <text x="322" y="265" font-size="12" fill="#888" font-family="monospace">[]</text>
  <text x="432" y="265" font-size="12" fill="#bbb">—</text>

  <!-- 行 4：撞上 2 -->
  <g filter="url(#sk)"><rect x="36" y="286" width="530" height="28" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="44" y="302" font-size="12" fill="#333" font-family="monospace">i=4  v=3</text>
  <g filter="url(#sk)"><rect x="130" y="288" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="148" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="172" y="288" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="190" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="214" y="288" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="232" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="256" y="288" width="36" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="274" y="305" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">2</text>
  <text x="322" y="305" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">[3]</text>
  <text x="372" y="305" font-size="11.5" fill="#b03a3a" font-family="monospace">cnt[3]→2 ✓ 捉到!</text>

  <!-- 行 5：撞上 2 -->
  <g filter="url(#sk)"><rect x="36" y="322" width="530" height="28" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1"/></g>
  <text x="44" y="338" font-size="12" fill="#333" font-family="monospace">i=5  v=2</text>
  <g filter="url(#sk)"><rect x="130" y="324" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="148" y="341" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="172" y="324" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="190" y="341" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">1</text>
  <g filter="url(#sk)"><rect x="214" y="324" width="36" height="24" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="232" y="341" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="256" y="324" width="36" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="274" y="341" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">2</text>
  <text x="322" y="341" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">[3,2]</text>
  <text x="372" y="341" font-size="11.5" fill="#b03a3a" font-family="monospace">cnt[2]→2 ✓ 捉到!</text>

  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#888">前 4 步 cnt 被填成全 1（人人露过面）；后 2 步撞上「二次」—— 捣蛋鬼落网</text>
</svg>
