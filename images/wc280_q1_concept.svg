<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：一串同向连减 = 一次除法</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Left panel: repeated subtraction -->
  <rect x="26" y="58" width="278" height="250" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">逐次相减：num1 = 7, num2 = 3</text>

  <rect x="40" y="110" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="71" y="137" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>

  <path d="M106,132 L136,132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="121" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="121" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 1 步</text>

  <rect x="140" y="110" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="171" y="137" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <path d="M206,132 L236,132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="221" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−3</text>
  <text x="221" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 2 步</text>

  <rect x="240" y="110" width="60" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="137" text-anchor="middle" font-size="15" fill="#8a6d1f" filter="url(#rough2)">1</text>

  <rect x="44" y="182" width="244" height="52" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="166" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">方向反转条件：1 &lt; 3，轮到 3 减 1</text>
  <text x="166" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">连减了 k = 2 次才反转</text>

  <text x="166" y="262" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">每步记 1 次操作 → 这一段共 2 次</text>
  <text x="166" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">若 num1=10⁵、num2=1：要连减 10⁵ 次！</text>

  <!-- Middle equivalence -->
  <text x="320" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇔</text>
  <text x="320" y="208" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">完全等价</text>

  <!-- Right panel: one division -->
  <rect x="336" y="58" width="278" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一次除法：7 ÷ 3 = 2 余 1</text>

  <rect x="366" y="104" width="218" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="129" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">k = 7 / 3 = 2（商）</text>

  <rect x="366" y="162" width="218" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="180" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">商 k = 本轮操作数 → ops += 2</text>
  <text x="475" y="196" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">用 O(1) 替代 k 次循环</text>

  <rect x="366" y="216" width="218" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="234" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">余数 = 新 num1：7 % 3 = 1</text>
  <text x="475" y="250" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">方向随即反转（1 &lt; 3）</text>

  <text x="475" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一轮 = 商累加 + 取模替换</text>

  <!-- Bottom note -->
  <rect x="26" y="330" width="588" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="351" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">辗转相减 ⟷ 辗转相除：GCD 只留余数、丢掉商；本题还要把每轮的商累加进答案</text>

  <text x="320" y="392" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一般地：a ≥ b &gt; 0 连减到方向反转需 ⌊a/b⌋ 次，终值 a mod b ∈ [0, b)</text>
</svg>
