<svg xmlns="http://www.w3.org/2000/svg" width="640" height="385" viewBox="0 0 640 385" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="103" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="385" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">位掩码统计：解析颜色对 → mask[杆] |= 颜色位</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 7 pairs of (color, rod) -->
  <g font-size="15" font-weight="bold">
    <g filter="url(#sk)"><rect x="96" y="58" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
    <text x="113" y="84" text-anchor="middle" fill="#446688">B</text><text x="133" y="84" text-anchor="middle" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="162" y="58" width="52" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
    <text x="179" y="84" text-anchor="middle" fill="#446688">B</text><text x="199" y="84" text-anchor="middle" fill="#333">6</text>
    <g filter="url(#sk)"><rect x="228" y="58" width="52" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="245" y="84" text-anchor="middle" fill="#4a7a3a">G</text><text x="265" y="84" text-anchor="middle" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="294" y="58" width="52" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="311" y="84" text-anchor="middle" fill="#b85450">R</text><text x="331" y="84" text-anchor="middle" fill="#333">6</text>
    <g filter="url(#sk)"><rect x="360" y="58" width="52" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="377" y="84" text-anchor="middle" fill="#b85450">R</text><text x="397" y="84" text-anchor="middle" fill="#333">0</text>
    <g filter="url(#sk)"><rect x="426" y="58" width="52" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="443" y="84" text-anchor="middle" fill="#b85450">R</text><text x="463" y="84" text-anchor="middle" fill="#333">6</text>
    <g filter="url(#sk)"><rect x="492" y="58" width="52" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="509" y="84" text-anchor="middle" fill="#4a7a3a">G</text><text x="529" y="84" text-anchor="middle" fill="#333">9</text>
  </g>

  <path d="M 320 104 L 320 126" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">每处理一对：mask[杆号] |= 颜色位（按位或天然去重）</text>

  <!-- 10 rods -->
  <g font-size="14" font-weight="bold">
    <g filter="url(#sk)"><rect x="43" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="68" y="182" text-anchor="middle" fill="#666">0</text>
    <g filter="url(#sk)"><rect x="99" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="124" y="182" text-anchor="middle" fill="#666">1</text>
    <g filter="url(#sk)"><rect x="155" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="180" y="182" text-anchor="middle" fill="#666">2</text>
    <g filter="url(#sk)"><rect x="211" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="236" y="182" text-anchor="middle" fill="#666">3</text>
    <g filter="url(#sk)"><rect x="267" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="292" y="182" text-anchor="middle" fill="#666">4</text>
    <g filter="url(#sk)"><rect x="323" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="348" y="182" text-anchor="middle" fill="#666">5</text>
    <g filter="url(#sk)"><rect x="379" y="162" width="50" height="86" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="404" y="182" text-anchor="middle" fill="#7a5415">6</text>
    <g filter="url(#sk)"><rect x="435" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="460" y="182" text-anchor="middle" fill="#666">7</text>
    <g filter="url(#sk)"><rect x="491" y="162" width="50" height="86" rx="6" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1" opacity="0.7"/></g>
    <text x="516" y="182" text-anchor="middle" fill="#666">8</text>
    <g filter="url(#sk)"><rect x="547" y="162" width="50" height="86" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="572" y="182" text-anchor="middle" fill="#b03a3a">9</text>
  </g>
  <!-- highlight rod 0 -->
  <g filter="url(#sk)"><rect x="43" y="162" width="50" height="86" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="68" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>

  <g font-size="13" font-family="monospace" text-anchor="middle">
    <text x="68" y="206" fill="#2e6e2e" font-weight="bold">111</text>
    <text x="124" y="206" fill="#999">000</text>
    <text x="180" y="206" fill="#999">000</text>
    <text x="236" y="206" fill="#999">000</text>
    <text x="292" y="206" fill="#999">000</text>
    <text x="348" y="206" fill="#999">000</text>
    <text x="404" y="206" fill="#7a5415">101</text>
    <text x="460" y="206" fill="#999">000</text>
    <text x="516" y="206" fill="#999">000</text>
    <text x="572" y="206" fill="#b03a3a">010</text>
    <text x="68" y="223" font-size="11" fill="#2e6e2e">(7)</text>
    <text x="124" y="223" font-size="11" fill="#999">(0)</text>
    <text x="180" y="223" font-size="11" fill="#999">(0)</text>
    <text x="236" y="223" font-size="11" fill="#999">(0)</text>
    <text x="292" y="223" font-size="11" fill="#999">(0)</text>
    <text x="348" y="223" font-size="11" fill="#999">(0)</text>
    <text x="404" y="223" font-size="11" fill="#7a5415">(5)</text>
    <text x="460" y="223" font-size="11" fill="#999">(0)</text>
    <text x="516" y="223" font-size="11" fill="#999">(0)</text>
    <text x="572" y="223" font-size="11" fill="#b03a3a">(2)</text>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <text x="68" y="242" fill="#2e6e2e">R·G·B ✓</text>
    <text x="404" y="242" fill="#b03a3a">缺 G ✗</text>
    <text x="572" y="242" fill="#b03a3a">仅 G ✗</text>
  </g>

  <!-- bit legend -->
  <g filter="url(#sk)"><rect x="60" y="264" width="520" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="320" y="281" text-anchor="middle" font-size="12" fill="#2b4a6e">颜色位编码：R = 001（1），G = 010（2），B = 100（4）</text>
  <text x="320" y="297" text-anchor="middle" font-size="12" fill="#2b4a6e" font-weight="bold">三色齐全 ⟺ mask == 111 == 7</text>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="60" y="318" width="520" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="320" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">ans = 统计 mask == 7 的杆数 = 1（示例 1）</text>
</svg>
