<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="stop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8">
      <circle cx="5" cy="5" r="4" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 走查：警卫 (1,1) 四邻全墙，一个都看不到</text>

  <!-- 3x3 网格，格子 90x64 -->
  <g filter="url(#rough2)">
    <!-- 行 0 -->
    <rect x="120" y="56" width="90" height="64" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6"/>
    <rect x="214" y="56" width="90" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6"/>
    <rect x="308" y="56" width="90" height="64" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6"/>
    <!-- 行 1 -->
    <rect x="120" y="124" width="90" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6"/>
    <rect x="214" y="124" width="90" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6"/>
    <rect x="308" y="124" width="90" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6"/>
    <!-- 行 2 -->
    <rect x="120" y="192" width="90" height="64" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6"/>
    <rect x="214" y="192" width="90" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6"/>
    <rect x="308" y="192" width="90" height="64" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="165" y="90">空</text><text x="259" y="90">墙</text><text x="353" y="90">空</text>
    <text x="165" y="158">墙</text><text x="353" y="158">墙</text>
    <text x="165" y="226">空</text><text x="259" y="226">墙</text><text x="353" y="226">空</text>
  </g>
  <text x="259" y="162" text-anchor="middle" font-size="18" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">G</text>

  <!-- 四向全被墙挡 -->
  <g filter="url(#rough2)">
    <path d="M 244 132 L 226 110" stroke="#b85450" stroke-width="2.2" marker-end="url(#stop)" fill="none"/>
    <path d="M 274 132 L 292 110" stroke="#b85450" stroke-width="2.2" marker-end="url(#stop)" fill="none"/>
    <path d="M 244 180 L 226 202" stroke="#b85450" stroke-width="2.2" marker-end="url(#stop)" fill="none"/>
    <path d="M 274 180 L 292 202" stroke="#b85450" stroke-width="2.2" marker-end="url(#stop)" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#8a3a36">
    <text x="212" y="104" text-anchor="end">北 → 墙 ✗</text>
    <text x="306" y="104">东 → 墙 ✗</text>
    <text x="212" y="216" text-anchor="end">西 → 墙 ✗</text>
    <text x="306" y="216">南 → 墙 ✗</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="432" y="110" width="22" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <rect x="432" y="138" width="22" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="432" y="166" width="22" height="18" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="462" y="123">警卫（遮挡）</text>
    <text x="462" y="151">墙（遮挡）</text>
    <text x="462" y="179">未保卫空格</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="284" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">警卫被四堵墙围死 → 投射零格 → 没有任何格子被标 2</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">未保卫空格 = 四个角 (0,0) (0,2) (2,0) (2,2)</text>

  <rect x="150" y="344" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = 4 ✓（与官方输出一致）</text>
</svg>
