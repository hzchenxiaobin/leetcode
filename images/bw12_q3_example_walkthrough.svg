<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：edges = [[0,1],[1,2],[2,3],[1,4],[4,5]]</text>

  <g filter="url(#rough2)" stroke-width="1.6">
    <line x1="250" y1="150" x2="250" y2="96" stroke="#999"/>
    <line x1="250" y1="150" x2="190" y2="204" stroke="#999"/>
    <line x1="250" y1="150" x2="310" y2="204" stroke="#999"/>
    <line x1="190" y1="204" x2="190" y2="258" stroke="#999"/>
    <line x1="310" y1="204" x2="310" y2="258" stroke="#999"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="250" cy="96" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="250" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="190" cy="204" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="310" cy="204" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="190" cy="258" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="310" cy="258" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="250" y="101" fill="#8a6a20">0</text>
    <text x="250" y="155" fill="#3a4a66">1</text>
    <text x="190" y="209" fill="#3a4a66">2</text>
    <text x="310" y="209" fill="#3a4a66">4</text>
    <text x="190" y="263" fill="#8a3a36">3</text>
    <text x="310" y="263" fill="#8a3a36">5</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <text x="250" y="80">起点 x</text>
    <text x="190" y="286">d=3</text>
    <text x="310" y="286">d=3</text>
    <text x="190" y="230">d=2</text>
    <text x="310" y="230">d=2</text>
    <text x="250" y="172">d=1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 232 100 C 170 130, 150 200, 176 248" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" fill="none"/>
  </g>

  <rect x="392" y="88" width="152" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="468" y="110" fill="#8a6a20" font-weight="bold">第一次 BFS（从 0）</text>
    <text x="468" y="130" fill="#555">0:0　1:1</text>
    <text x="468" y="146" fill="#555">2:2　4:2</text>
    <text x="468" y="162" fill="#555">3:3　5:3</text>
    <text x="468" y="184" fill="#8a3a36" font-weight="bold">最远点 a = 3（并列 5）</text>
    <text x="468" y="200" fill="#777">任取一个都正确</text>
  </g>

  <rect x="392" y="224" width="152" height="108" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="468" y="246" fill="#8a3a36" font-weight="bold">第二次 BFS（从 3）</text>
    <text x="468" y="266" fill="#555">2:1　1:2</text>
    <text x="468" y="282" fill="#555">0:3　4:3</text>
    <text x="468" y="298" fill="#555">5:4</text>
    <text x="468" y="318" fill="#b85450" font-weight="bold">直径 = 4 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 388 282 L 336 268" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" fill="none" stroke-dasharray="4 3"/>
  </g>
  <text x="250" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最长路径 3 − 2 − 1 − 4 − 5，含 4 条边</text>
</svg>
