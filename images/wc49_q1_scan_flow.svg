<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">一次遍历：维护当前游程 cur 与历史最大 best</text>

  <!-- 初始化 -->
  <rect x="185" y="46" width="190" height="40" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur = 1，best = 1</text>

  <path d="M280,88 L280,106" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="280,110 402,152 280,194 158,152" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i] &gt;</text>
  <text x="280" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">nums[i-1] ?</text>

  <!-- 左分支：是 -->
  <path d="M158,152 L100,152 L100,214" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="45" y="218" width="140" height="44" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur += 1</text>

  <!-- 右分支：否 -->
  <path d="M402,152 L460,152 L460,214" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="144" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="390" y="218" width="140" height="44" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cur = 1</text>

  <!-- 汇合 -->
  <path d="M115,262 L115,326 L166,326" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M460,262 L460,326 L394,326" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="304" width="220" height="44" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">best = max(best, cur)</text>

  <path d="M280,348 L280,376" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="380" width="180" height="40" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 best</text>

  <text x="280" y="448" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">循环 i = 1 … n−1，每轮 O(1)；初值 cur = best = 1 对应长度为 1 的游程</text>
</svg>
