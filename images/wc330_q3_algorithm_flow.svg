<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrN" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="452" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：相邻和排序，前 k−1 大 减 前 k−1 小</text>

  <!-- ====== decision: k == 1 ? ====== -->
  <polygon points="260,52 338,84 260,116 182,84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="11" fill="#8a6510" font-weight="bold">k = 1 ?</text>

  <path d="M 338 84 L 366 84" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="348" y="76" text-anchor="middle" font-size="9.5" fill="#d6a040">是</text>
  <rect x="370" y="66" width="130" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="82" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">直接返回 0</text>
  <text x="435" y="95" text-anchor="middle" font-size="8.5" fill="#b85450">（不切，方案唯一）</text>

  <path d="M 260 116 L 260 136" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="271" y="130" text-anchor="start" font-size="9.5" fill="#666">否</text>

  <!-- ====== step 1: pairs ====== -->
  <rect x="110" y="140" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">计算相邻和 pairs[i] = w[i] + w[i+1]</text>
  <text x="260" y="173" text-anchor="middle" font-size="9.5" fill="#555">i = 0 … n−2，共 n−1 个</text>

  <path d="M 260 180 L 260 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- ====== step 2: sort ====== -->
  <rect x="110" y="204" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">将 pairs 升序排序</text>
  <text x="260" y="237" text-anchor="middle" font-size="9.5" fill="#555">O(n log n)，也可用堆 / 快速选择</text>

  <!-- split arrows -->
  <path d="M 200 244 L 148 272" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 320 244 L 372 272" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ====== step 3: min / max side by side ====== -->
  <rect x="40" y="276" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最小分数</text>
  <text x="145" y="313" text-anchor="middle" font-size="9.5" fill="#333">= 底座 + 前 k−1 小之和</text>
  <text x="145" y="328" text-anchor="middle" font-size="9.5" fill="#4a7a3a">Σ pairs[0..k−2]</text>

  <rect x="270" y="276" width="210" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最大分数</text>
  <text x="375" y="313" text-anchor="middle" font-size="9.5" fill="#333">= 底座 + 前 k−1 大之和</text>
  <text x="375" y="328" text-anchor="middle" font-size="9.5" fill="#b85450">Σ pairs[n−2 … n−k]</text>

  <!-- merge arrows -->
  <path d="M 145 334 L 240 354" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 375 334 L 280 354" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ====== step 4: answer ====== -->
  <rect x="80" y="358" width="360" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11.5" fill="#8a6510" font-weight="bold">答案 = 最大分数 − 最小分数</text>
  <text x="260" y="394" text-anchor="middle" font-size="9.5" fill="#555">底座两边都加了，做差时抵消 → 无需计算底座</text>

  <!-- ====== alternatives note ====== -->
  <rect x="80" y="414" width="360" height="28" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="432" text-anchor="middle" font-size="9.5" fill="#888">替代：大小为 k−1 的双堆 O(n log k)；快速选择 平均 O(n)</text>
</svg>
