<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="600" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：翻倍枚举 → 排序 → 二分匹配</text>
  <path d="M 190 42 Q 380 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="160" y="58" width="440" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="380" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">① 分半</text>
  <text x="380" y="98" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">left = nums[0 .. ⌊n/2⌋)，right = nums[⌊n/2⌋ .. n)，各 ≤ 20 个元素</text>

  <path d="M 380 108 L 380 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="105" y="126" width="550" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="380" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">② 翻倍法枚举两半的子集和（从 [0] 出发）</text>

  <g font-size="12">
    <g filter="url(#rough2)"><rect x="135" y="160" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="152" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">0</text>
    <path d="M 176 175 L 200 175" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="188" y="167" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+a</text>
    <g filter="url(#rough2)"><rect x="208" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="223" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="238" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="253" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">a</text>
    <path d="M 275 175 L 299 175" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="287" y="167" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+b</text>
    <g filter="url(#rough2)"><rect x="307" y="160" width="45" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="329.5" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="352" y="160" width="45" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="374.5" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">a</text>
    <g filter="url(#rough2)"><rect x="397" y="160" width="45" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="419.5" y="180" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">b</text>
    <g filter="url(#rough2)"><rect x="442" y="160" width="45" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
    <text x="464.5" y="180" text-anchor="middle" fill="#8a6520" font-weight="bold" filter="url(#rough2)">a+b</text>
    <text x="500" y="180" font-size="14" fill="#666" filter="url(#rough2)">…</text>
  </g>
  <text x="380" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每加入元素 a：sums ← sums ∪ { s + a : s ∈ sums }，长度 1→2→4→…→2<tspan dy="-4" font-size="8.5">20</tspan></text>

  <path d="M 380 230 L 380 246" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="160" y="248" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#rough2)">③ 右半和数组 Y 排序（可去重）</text>

  <path d="M 380 288 L 380 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="80" y="306" width="500" height="204" rx="10" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5"/></g>
  <text x="100" y="330" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">④ 遍历 X 中每个 x</text>

  <g filter="url(#rough2)"><rect x="115" y="342" width="150" height="38" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="190" y="366" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">t = goal − x</text>

  <path d="M 190 380 L 190 396" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="100" y="398" width="180" height="38" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="190" y="422" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = lower_bound(Y, t)</text>

  <path d="M 190 436 L 190 452" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="88" y="454" width="204" height="46" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="190" y="473" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">候选 y = Y[i]、Y[i−1]</text>
  <text x="190" y="491" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans ← min(ans, |x + y − goal|)</text>

  <path d="M 292 477 L 358 477" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><polygon points="430,445 500,477 430,509 360,477" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="430" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#rough2)">ans = 0 ?</text>

  <text x="448" y="433" font-size="11" font-weight="bold" fill="#a03a3a" filter="url(#rough2)">否</text>
  <path d="M 430 443 C 430 400, 400 361, 274 361" stroke="#a03a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="394" font-size="10" fill="#a03a3a" filter="url(#rough2)">取下一个 x</text>

  <text x="522" y="468" font-size="11" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">是</text>
  <path d="M 504 477 L 586 477" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="590" y="459" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="646" y="482" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">提前返回 0</text>

  <path d="M 380 510 L 380 532" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="528" font-size="10" fill="#666" filter="url(#rough2)">X 遍历完毕</text>

  <g filter="url(#rough2)"><rect x="240" y="534" width="280" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="380" y="560" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">⑤ 循环结束，返回 ans</text>
</svg>
