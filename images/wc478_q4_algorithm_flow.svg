<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：前缀判可行 + 主席树「版本差」上同步下行</text>

  <!-- Left column: flow -->
  <rect x="30" y="40" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="58" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 预处理：残差前缀 d、前缀和 pre、</text>
  <text x="160" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">离散化 vals、主席树 root[0..n]</text>

  <path d="M 160 84 L 160 100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="102" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 查询 [l, r]：检查 d[r] − d[l]</text>

  <path d="M 120 132 L 120 148" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="120,148 210,178 120,208 30,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">可行？</text>

  <path d="M 210 178 L 238 178" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="242" y="162" width="56" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <path d="M 120 208 L 120 224" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="221" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="30" y="226" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 版本差 (root[l], root[r+1]) 同步下行</text>
  <text x="160" y="262" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">找第 ⌊(p+1)/2⌋ 小 → 中位数 m</text>

  <path d="M 160 272 L 160 286" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="288" width="260" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 版本差统计区间内 ≤ m 的个数 c 与和 s</text>

  <path d="M 160 320 L 160 334" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="336" width="260" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑤ ans = [ (m·c − s)</text>
  <text x="160" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+ (S − s − m·(p−c)) ] / k</text>

  <!-- Right panel: concrete descent -->
  <text x="470" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">例：nums = [1,4,7]，查询 [0,2]，rank = 2</text>

  <!-- tree nodes -->
  <line x1="452" y1="98" x2="398" y2="128" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="488" y1="98" x2="542" y2="128" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="535" y1="168" x2="505" y2="198" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="565" y1="168" x2="595" y2="198" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="438" y="58" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1..7]</text>
  <text x="470" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">差 = 3</text>

  <rect x="358" y="128" width="64" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1..1]</text>
  <text x="390" y="160" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">差 = 1</text>

  <rect x="518" y="128" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="550" y="144" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4..7]</text>
  <text x="550" y="160" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">差 = 2</text>

  <rect x="463" y="198" width="64" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="495" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4..4]</text>
  <text x="495" y="230" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">差 = 1</text>

  <rect x="573" y="198" width="64" height="40" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="605" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[7..7]</text>
  <text x="605" y="230" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">差 = 1</text>

  <!-- descent arrows -->
  <path d="M 486 100 Q 516 112 540 124" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 533 170 Q 517 184 503 194" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- step labels -->
  <text x="325" y="112" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">① 左差 1 &lt; rank 2 → 右行，rank −= 1</text>
  <text x="325" y="182" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">② 左差 1 ≥ rank 1 → 左行</text>
  <text x="325" y="246" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">③ 落到叶子 [4..4] ⇒ 中位数 m = 4</text>
  <text x="325" y="268" font-size="10" fill="#666" filter="url(#rough2)">节点「差」= root[r+1] 与 root[l] 的计数之差</text>
  <text x="325" y="284" font-size="10" fill="#666" filter="url(#rough2)">= 区间 [l,r] 内落在该值域的元素个数</text>

  <!-- calc box -->
  <rect x="325" y="296" width="290" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="316" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">query_le 统计 ≤ 4：(c, s) = (2, 5)，S = 12，p = 3</text>
  <text x="470" y="338" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">代价 = (4×2 − 5) + (12 − 5 − 4×1) = 3 + 3 = 6</text>
  <text x="470" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 6 / 3 = 2 ✓</text>

  <!-- bottom note -->
  <rect x="30" y="400" width="580" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="421" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">主席树每个节点维护 cnt（个数）与 sm（真实值和）；root[i] = 只含前 i 个元素的版本</text>
  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">查询 = 两次下行：kth 找中位数 O(log n)、query_le 取 (c, s) O(log n)</text>
</svg>
