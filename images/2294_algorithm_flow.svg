<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="720" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">贪心分段算法流程</text>
  <path d="M 260 40 Q 470 48 680 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Step 1: sort ===== -->
  <g filter="url(#sk)">
    <rect x="270" y="60" width="400" height="54" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="470" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">① 升序排序 nums</text>
  <path d="M 470 114 L 470 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 2: init ===== -->
  <g filter="url(#sk)">
    <rect x="270" y="146" width="400" height="54" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="470" y="179" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">② i ← 0，count ← 0</text>
  <path d="M 470 200 L 470 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 3: open new group ===== -->
  <g filter="url(#sk)">
    <rect x="270" y="232" width="400" height="60" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="470" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">③ 开新组：anchor ← nums[i]，count+1</text>
  <path d="M 470 292 L 470 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 4: extend ===== -->
  <g filter="url(#sk)">
    <rect x="250" y="324" width="440" height="78" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="470" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">④ 扩组：当 i &lt; n 且 nums[i] − anchor ≤ k</text>
  <text x="470" y="376" text-anchor="middle" font-size="13" fill="#7a5415">则 i ← i + 1（本组尽量向右吞并）</text>
  <path d="M 470 402 L 470 426" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- ===== Step 5: decision ===== -->
  <g filter="url(#sk)">
    <polygon points="470,436 640,496 470,556 300,496" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="470" y="490" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36">i &lt; n ?</text>
  <text x="470" y="512" text-anchor="middle" font-size="11" fill="#8a3a36">（还有未分组的元素吗）</text>

  <!-- yes: back to step 3 -->
  <path d="M 300 496 L 150 496 L 150 262 L 258 262" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="138" y="372" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">是：</text>
  <text x="138" y="392" text-anchor="end" font-size="12" fill="#2e6e2e" font-weight="bold">开下一组</text>

  <!-- no: output -->
  <path d="M 470 556 L 470 588" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="486" y="578" font-size="12" fill="#8a3a36" font-weight="bold">否</text>

  <!-- ===== Step 6: output ===== -->
  <g filter="url(#sk)">
    <rect x="270" y="594" width="400" height="54" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.6"/>
  </g>
  <text x="470" y="627" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">⑥ 扫描结束，输出 count</text>

  <text x="470" y="694" text-anchor="middle" font-size="12" fill="#888">时间：排序 O(n log n) + 扫描 O(n)　|　空间：O(1)（不计排序栈）</text>
</svg>
