<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：完美性自底向上可分解 —— 后序传高度</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 顶部公式框 -->
  <rect x="80" y="48" width="480" height="42" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">subtree(u) 完美 ⟺ 左右子树均完美 ∧ hL = hR</text>

  <!-- 面板 A：叶子 -->
  <rect x="16" y="108" width="192" height="226" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">情形 ①：叶子节点</text>

  <ellipse cx="112" cy="168" rx="15" ry="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">u</text>
  <path d="M 104 180 Q 90 200 78 220" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 120 180 Q 134 200 146 220" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <ellipse cx="74" cy="232" rx="12" ry="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="74" y="236" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">∅</text>
  <ellipse cx="150" cy="232" rx="12" ry="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="150" y="236" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">∅</text>

  <text x="112" y="272" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">hL = hR = 0</text>
  <text x="112" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">→ h = 1，完美 ✓</text>
  <text x="112" y="312" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">size = 2¹ − 1 = 1</text>

  <!-- 面板 B：单孩子 -->
  <rect x="224" y="108" width="192" height="226" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a34540" filter="url(#rough2)">情形 ②：只有一个孩子</text>

  <ellipse cx="320" cy="168" rx="15" ry="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a34540" filter="url(#rough2)">u</text>
  <path d="M 312 180 Q 292 200 278 218" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <ellipse cx="272" cy="230" rx="12" ry="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="272" y="234" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">∅</text>
  <path d="M 328 180 Q 346 200 360 218" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <ellipse cx="368" cy="230" rx="13" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="368" y="235" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">子</text>
  <text x="368" y="256" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">hR ≥ 1</text>

  <text x="320" y="278" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">空侧 hL = 0 ≠ hR ≥ 1</text>
  <text x="320" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a34540" filter="url(#rough2)">→ 返回 −1，不完美 ✗</text>
  <text x="320" y="315" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">被「高度不等」自然淘汰，无需特判</text>

  <!-- 面板 C：双子等高 -->
  <rect x="432" y="108" width="192" height="226" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">情形 ③：双子且等高</text>

  <ellipse cx="528" cy="154" rx="15" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="528" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">u</text>
  <path d="M 520 165 Q 505 184 494 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 536 165 Q 551 184 562 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <ellipse cx="490" cy="206" rx="12" ry="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">L</text>
  <ellipse cx="566" cy="206" rx="12" ry="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="566" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">R</text>
  <path d="M 483 215 Q 478 232 475 244" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 497 215 Q 504 232 508 244" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 559 215 Q 555 232 551 244" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 573 215 Q 579 232 583 244" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <ellipse cx="473" cy="254" rx="8" ry="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="509" cy="254" rx="8" ry="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="549" cy="254" rx="8" ry="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="585" cy="254" rx="8" ry="7.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="528" y="276" text-anchor="middle" font-size="9.5" fill="#3a5f2e" filter="url(#rough2)">左右子树完美 ∧ hL = hR</text>

  <text x="528" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">→ h = hL + 1，完美 ✓</text>
  <text x="528" y="315" text-anchor="middle" font-size="10.5" fill="#3a5f2e" filter="url(#rough2)">size = 2^h − 1</text>

  <!-- 底部注记 -->
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">空树约定返回高度 0 —— 与叶子的 1 错开一格，情形 ② 被「hL ≠ hR」自然淘汰</text>
  <text x="320" y="382" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">大小由高度唯一决定：size = 2^h − 1（根 + 两棵等高完美子树）</text>
</svg>
