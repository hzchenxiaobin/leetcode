<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">算法流程：一个字符一次 O(1) 的「压 / 累加 / 弹」</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">全程只有栈顶操作，没有回溯、没有反复扫描</text>

  <!-- 主循环：读入字符 -->
  <rect x="240" y="52" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="73" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">从左到右读入 s 的每个字符 c</text>

  <!-- 判定 1 -->
  <polygon points="256,124 360,90 464,124 360,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="117" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">栈非空 且</text>
  <text x="360" y="133" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">栈顶字符 == c ？</text>
  <path d="M 360 84 L 360 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：压入新块 -->
  <path d="M 256 124 L 234 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="245" y="117" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="36" y="104" width="198" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="131" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">压入新块 (c, 1)</text>

  <!-- 是：计数加一 -->
  <path d="M 360 158 L 360 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="164" text-anchor="end" font-size="9.5" fill="#3a6a2a" filter="url(#rough2)">是</text>
  <rect x="280" y="166" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="189" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">栈顶计数 += 1</text>

  <!-- 判定 2 -->
  <path d="M 360 202 L 360 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="260,240 360,208 460,240 360,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="245" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">计数 == k ？</text>

  <!-- 是：弹出 -->
  <path d="M 460 240 L 478 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="469" y="233" text-anchor="middle" font-size="9.5" fill="#3a6a2a" filter="url(#rough2)">是</text>
  <rect x="480" y="218" width="144" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="552" y="238" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">弹出栈顶块</text>
  <text x="552" y="253" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">（这 k 个字符被删）</text>

  <!-- 汇合到下一字符 -->
  <path d="M 360 272 L 360 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="282" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 135 148 L 135 284" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 552 262 L 552 284" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="286" width="588" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="306" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">读下一个字符继续；全部读完后把栈按 (字符 × 计数) 展开成结果串</text>

  <!-- 循环回边 -->
  <path d="M 36 302 L 18 302 L 18 68 L 236 68" stroke="#8899aa" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="60" text-anchor="middle" font-size="9" fill="#8899aa" filter="url(#rough2)">循环，直到读完 n 个字符</text>

  <!-- 结果 -->
  <path d="M 330 318 L 330 328" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="330" width="228" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="347" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">返回 ''.join(c * cnt)（Python 写法）</text>
</svg>
