<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：短位数枚举 + 同位数前缀计数</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">L ≤ 10，全部操作在千次以内</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="140" y="64" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">取 n 的各位 d[0..L−1]</text>
  <path d="M 290.0 100.0 L 290.0 122.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="122" width="340" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="144.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for len = 1..L−1：cnt += 9·P(9, len−1)</text>
  <path d="M 290.0 158.0 L 290.0 180.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="180" width="380" height="56" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="212.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="290.0" y="202.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for i = 0..L−1：</text>
  <text x="290.0" y="224.0" font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">x &lt; d[i] 且未用 → cnt += P(9−i, L−1−i)</text>
  <path d="M 290.0 236.0 L 290.0 258.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,258 390,282 290,306 190,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="287.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d[i] 已用过？</text>
  <path d="M 390.0 282.0 L 430.0 282.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="436.0" y="286.0" font-size="10" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">是 → 停止</text>
  <path d="M 290.0 306.0 L 290.0 326.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="150" y="326" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="346.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">走完则 cnt += 1；返回 n − cnt</text>
</svg>
