<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：enemyEnergies = [3,2,2]，energy = 2</text>

  <text x="70" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">步骤</text>
  <text x="235" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">操作</text>
  <text x="352" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">分数</text>
  <text x="414" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">能量</text>
  <text x="472" y="68" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">已标记</text>

  <path d="M 34 78 L 502 78" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="70" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始</text>
  <text x="235" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="352" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="414" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="472" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <path d="M 34 112 L 502 112" stroke="#eee" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">打敌人 1（花 2）</text>
  <text x="352" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="414" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="472" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <path d="M 34 146 L 502 146" stroke="#eee" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">标记敌人 0（+3）</text>
  <text x="352" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="414" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="472" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}</text>
  <path d="M 34 180 L 502 180" stroke="#eee" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="235" y="204" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">打敌人 2（花 2）</text>
  <text x="352" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="472" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0}</text>
  <path d="M 34 214 L 502 214" stroke="#eee" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="235" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">标记敌人 2（+2）</text>
  <text x="352" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="472" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0,2}</text>
  <path d="M 34 248 L 502 248" stroke="#eee" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="235" y="272" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">打敌人 1（花 2）</text>
  <text x="352" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="414" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="472" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{0,2}</text>

  <path d="M 34 282 L 502 282" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="70" y="300" width="380" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">(2 + 3 + 2 + 2 − 2) ÷ 2 = 7 ÷ 2 = 3 分</text>
</svg>
