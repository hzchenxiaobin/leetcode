<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 1 演算：a = [1, 2, 3, 4, 4]，m = 4</text>
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">S(x) = #{a_i ≥ x}，cnt(v) = #{a_i = v}；F_k(L) = S(L) + … + S((2ᵏ−1)L) + cnt(2ᵏL)</text>

  <rect x="18" y="66" width="584" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">L</text>
  <text x="130" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">S(L)</text>
  <text x="208" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">S(2L)</text>
  <text x="286" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">S(3L)</text>
  <text x="366" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">cnt(2L)</text>
  <text x="446" y="88" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=1</text>
  <text x="522" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">cnt(4L)</text>
  <text x="586" y="88" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=2</text>

  <rect x="18" y="106" width="584" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="52" y="135" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">1</text>
  <text x="130" y="135" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">5</text>
  <text x="208" y="135" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">4</text>
  <text x="286" y="135" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">3</text>
  <text x="366" y="135" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">1</text>
  <text x="446" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="522" y="135" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="586" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">14</text>

  <rect x="18" y="158" width="584" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="52" y="187" text-anchor="middle" font-size="14" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="130" y="187" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">4</text>
  <text x="208" y="187" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="286" y="187" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="366" y="187" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="446" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="522" y="187" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="586" y="187" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">6</text>

  <rect x="18" y="210" width="584" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="239" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="208" y="239" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="286" y="239" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="366" y="239" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="446" y="239" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">3</text>
  <text x="522" y="239" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="586" y="239" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">3</text>

  <rect x="18" y="262" width="584" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="291" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="291" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="286" y="291" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="366" y="291" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="446" y="291" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">2</text>
  <text x="522" y="291" text-anchor="middle" font-size="13" fill="#999999" filter="url(#rough2)">0</text>
  <text x="586" y="291" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">2</text>

  <text x="310" y="328" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k=1 取 L=1 或 2 得 6；k=2 取 L=1 得 5+4+3+2 = 14 ⇒ 输出 6 14 14 14</text>
</svg>
