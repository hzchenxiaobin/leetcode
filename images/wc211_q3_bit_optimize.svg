<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ba" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">进阶优化：换个排序键，把 DP 转移变成「前缀最大值」查询</text>
  <path d="M 110 38 Q 330 46 550 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- Left panel: bottleneck -->
  <g filter="url(#r)">
    <rect x="34" y="56" width="280" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="174" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">O(n²) DP 的瓶颈</text>
  <text x="50" y="104" font-size="11" fill="#444" filter="url(#r)">对每个 i 线性扫所有 j &lt; i：</text>
  <text x="50" y="126" font-size="11.5" font-family="monospace" fill="#333" filter="url(#r)">max{ dp[j] : 位置 j &lt; i,</text>
  <text x="50" y="144" font-size="11.5" font-family="monospace" fill="#333" filter="url(#r)">          sⱼ ≤ sᵢ }</text>
  <text x="50" y="168" font-size="11" fill="#b85450" filter="url(#r)">「位置在前」+「得分不超」两个约束交在一起，</text>
  <text x="50" y="186" font-size="11" fill="#b85450" filter="url(#r)">只能暴力扫 → O(n²)。</text>

  <!-- Right panel: idea -->
  <g filter="url(#r)">
    <rect x="344" y="56" width="282" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="485" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">换键：按 (score, age) 排序</text>
  <text x="358" y="104" font-size="11" fill="#444" filter="url(#r)">处理到 i 时，已入库的 j 得分都 ≤ sᵢ，</text>
  <text x="358" y="122" font-size="11" fill="#2e6e2e" filter="url(#r)">得分约束被排序「免费」满足，只剩：</text>
  <text x="358" y="146" font-size="11.5" font-family="monospace" fill="#333" filter="url(#r)">max{ dp[j] : ageⱼ ≤ ageᵢ }</text>
  <text x="358" y="170" font-size="11" fill="#2e6e2e" filter="url(#r)">→ 以年龄为下标建树状数组，</text>
  <text x="358" y="188" font-size="11" fill="#2e6e2e" filter="url(#r)">   单点更新 + 前缀取 max，各 O(log A)。</text>

  <!-- Middle arrow -->
  <path d="M 318 200 Q 330 214 342 200" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ba)" filter="url(#r)"/>

  <!-- Age axis BIT diagram -->
  <text x="40" y="236" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">树状数组挂在「年龄」值域上（ages ≤ 1000，无需离散化）</text>
  <g filter="url(#r)">
    <line x1="60" y1="300" x2="600" y2="300" stroke="#8a8a8a" stroke-width="1.8"/>
    <path d="M 594 295 L 600 300 L 594 305 Z" fill="#8a8a8a"/>
  </g>
  <text x="614" y="304" font-size="10.5" fill="#666" filter="url(#r)">年龄</text>
  <g filter="url(#r)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="70" y="316">1</text>
    <text x="140" y="316">2</text>
    <text x="210" y="316">3</text>
    <text x="280" y="316">…</text>
    <text x="350" y="316">a−1</text>
    <text x="428" y="316">aᵢ</text>
    <text x="540" y="316">1000</text>
  </g>
  <!-- BIT bins -->
  <g filter="url(#r)">
    <rect x="64" y="272" width="16" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="84" y="272" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="112" y="272" width="16" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="132" y="272" width="28" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="164" y="272" width="16" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="184" y="272" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="404" y="264" width="20" height="36" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="430" y="272" width="34" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="530" y="272" width="52" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <!-- query bracket -->
  <path d="M 64 336 L 64 344 M 64 340 L 420 340 M 420 336 L 420 344" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <text x="242" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">query(ageᵢ)：年龄 ≤ aᵢ 的最大 dp，O(log A)</text>
  <!-- update arrow -->
  <path d="M 414 264 L 414 244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ba)" filter="url(#r)"/>
  <text x="470" y="244" font-size="11" fill="#8a6a1a" filter="url(#r)">update(ageᵢ, dpᵢ)：单点写前缀 max</text>
  <text x="428" y="256" font-size="9" fill="#8a6a1a" filter="url(#r)" text-anchor="middle">aᵢ</text>

  <!-- bottom notes -->
  <g filter="url(#r)">
    <rect x="34" y="376" width="592" height="42" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="50" y="394" font-size="11" fill="#444" filter="url(#r)">⚠ 经典 LIS 的「贪心 + 二分」（tail 数组）只维护长度语义，推不出最大和——求和变体请用 DP 或树状数组。</text>
  <text x="50" y="410" font-size="11" fill="#444" filter="url(#r)">若改以「得分」为树状数组下标（值域 10⁶），则需先离散化；本题挂年龄域反而更省事。</text>
</svg>
