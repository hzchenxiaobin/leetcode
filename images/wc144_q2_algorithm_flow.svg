<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先记账，再统一结算</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两条循环各自线性，中间没有任何嵌套</text>

  <ellipse cx="200" cy="76" rx="46" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="81" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">开始</text>

  <path d="M 200 92 L 200 100" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="102" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">diff[1 .. n+1] 全部置 0</text>

  <path d="M 200 136 L 200 148" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="150" width="260" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="170" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">for [l, r, v] in bookings</text>
  <text x="200" y="190" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">diff[l] += v ;  diff[r+1] -= v</text>

  <path d="M 200 202 L 200 214" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="216" width="260" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="236" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cur = 0</text>
  <text x="200" y="256" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">i = 1..n : cur += diff[i]; ans[i-1] = cur</text>

  <path d="M 200 268 L 200 286" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="200" cy="306" rx="58" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="311" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">返回 ans</text>

  <rect x="360" y="90" width="232" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="372" y="110" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么两个端点就够</text>
  <text x="372" y="130" font-size="9.5" fill="#555" filter="url(#rough2)">l 处 +v：从这个航班起生效</text>
  <text x="372" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">r+1 处 -v：从下个航班撤销</text>
  <text x="372" y="166" font-size="9.5" fill="#555" filter="url(#rough2)">区间内每点都吃到这个 +v，</text>
  <text x="372" y="184" font-size="9.5" fill="#446688" filter="url(#rough2)">区间两端之外自动抵消</text>

  <rect x="360" y="204" width="232" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="372" y="224" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">前缀和就是座位数</text>
  <text x="372" y="244" font-size="9.5" fill="#555" filter="url(#rough2)">cur 恰好是「此刻仍在生效」</text>
  <text x="372" y="262" font-size="9.5" fill="#555" filter="url(#rough2)">的所有预订座位数之和</text>
  <text x="372" y="282" font-size="9.5" fill="#446688" filter="url(#rough2)">故 ans[i-1] = cur</text>

  <rect x="360" y="302" width="232" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="372" y="322" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">代价</text>
  <text x="372" y="342" font-size="9.5" fill="#555" filter="url(#rough2)">时间 O(n + m)：两趟线性扫描</text>
  <text x="372" y="360" font-size="9.5" fill="#555" filter="url(#rough2)">空间 O(n)：只有 diff 和 ans</text>

  <text x="310" y="398" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">bookings 共 m 条，每条只做 2 次单点加；下标 1..n 直接对应航班 1..n</text>
  <text x="310" y="418" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">若改用「逐点累加」，最坏要把 2×10^4 条预订各扫 2×10^4 个航班</text>
  <text x="310" y="440" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">注意：diff 长度至少 n+2，否则 diff[r+1] 在 r = n 时会越界</text>
</svg>
