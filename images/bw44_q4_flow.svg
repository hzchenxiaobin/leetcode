<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每个查询的处理流程（queries ≤ 10⁴，k ≤ 10⁴）</text>

  <rect x="180" y="48" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">查询 [n, k]</text>
  <path d="M260,90 L260,110" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="112" width="260" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">试除法分解：k → { (p, e) }，√k ≤ 100 步</text>
  <path d="M260,154 L260,174" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="176" width="320" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">每个质数：e ≤ 13（2¹³ > 10⁴），隔板法 C(e+n−1, n−1)</text>
  <path d="M260,218 L260,238" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="240" width="320" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">各质数方案数相乘，mod 10⁹+7</text>

  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">组合数用预处理阶乘 + 费马小定理求逆元：O(1) 查询</text>
  <text x="260" y="338" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">k = 1 时质因数集合为空，答案 1（全 1 数组）；n = 1 时答案也是 1</text>
</svg>
