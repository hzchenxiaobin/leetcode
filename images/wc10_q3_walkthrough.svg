<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：排序后逐项累加 |nums[i] − m|</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1, 10, 2, 9]，n = 4，m = nums[2] = 9</text>

  <rect x="60" y="66" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="245" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="415" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">|nums[i] − 9|</text>

  <rect x="60" y="96" width="440" height="30" fill="#ffffff" stroke="none" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="245" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="415" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <rect x="60" y="126" width="440" height="30" fill="#ffffff" stroke="none" filter="url(#rough2)"/>
  <text x="110" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="245" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="415" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <rect x="60" y="156" width="440" height="30" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2 ← 中位数</text>
  <text x="245" y="176" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="415" y="176" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="60" y="186" width="440" height="30" fill="#ffffff" stroke="none" filter="url(#rough2)"/>
  <text x="110" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="245" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="415" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <line x1="60" y1="66" x2="60" y2="216" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="500" y1="66" x2="500" y2="216" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="160" y1="66" x2="160" y2="216" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="330" y1="66" x2="330" y2="216" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="60" y1="96" x2="500" y2="96" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="60" y1="126" x2="500" y2="126" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="60" y1="156" x2="500" y2="156" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="60" y1="186" x2="500" y2="186" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="60" y1="216" x2="500" y2="216" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="60" y="228" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Σ = 8 + 7 + 0 + 1 = 16</text>

  <rect x="60" y="286" width="440" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">另一个示例：nums = [1, 2, 3]，m = 2</text>
  <text x="280" y="327" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">|1 − 2| + |2 − 2| + |3 − 2| = 1 + 0 + 1 = 2</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">偶数长度：取 t = 2 或 t = 9 都是 16，中位数区间内任意值等价</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个元素的操作互相独立，总代价就是各自距离的累加</text>
</svg>
