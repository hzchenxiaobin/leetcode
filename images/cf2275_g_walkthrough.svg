<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">演算：第三个样例（n = 5，D = 16）</text>
  <path d="M 240 42 Q 380 49 520 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">排序：1-3(1)、1-2(5)、2-3(5)、3-4(5)；其中 2-3 会成环，被 Kruskal 拒绝</text>
  <text x="380" y="80" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">于是 w = (1, 5, 5)，W = (0, 1, 6, 11)，kmax = 3</text>

  <!-- 表头 -->
  <rect x="28" y="96" width="704" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x</text>
  <text x="262" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">可行性：w_k + x·k ≤ x·n（n = 5）</text>
  <text x="442" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k*</text>
  <text x="512" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">新铺</text>
  <text x="636" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">利润</text>

  <!-- 行 1 -->
  <rect x="28" y="136" width="704" height="40" rx="6" fill="#fffdf5" stroke="#cbb98e" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="262" y="161" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1+1≤5 ✓，5+2=7＞5 ✗</text>
  <text x="442" y="161" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="512" y="161" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">3</text>
  <text x="636" y="161" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">16−1−6 = 9</text>

  <!-- 行 2 -->
  <rect x="28" y="182" width="704" height="40" rx="6" fill="#fffdf5" stroke="#cbb98e" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="262" y="207" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">4≤15 ✓，11≤15 ✓，14≤15 ✓</text>
  <text x="442" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="512" y="207" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="636" y="207" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">16−11−3 = 2</text>

  <!-- 行 3 -->
  <rect x="28" y="228" width="704" height="40" rx="6" fill="#fffdf5" stroke="#cbb98e" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="262" y="253" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">11≤50 ✓，25≤50 ✓，35≤50 ✓</text>
  <text x="442" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="512" y="253" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="636" y="253" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">16−11−10 = −5</text>

  <path d="M 380 272 L 380 288" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 注解 -->
  <rect x="28" y="292" width="704" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="314" font-size="11" fill="#3a5a30" filter="url(#rough2)">x = 1：只保留最便宜的 1-3(1)，卖掉 15 铜，新铺 3 条花 1+2+3 = 6 ⇒ 利润 15 − 6 = 9</text>
  <text x="46" y="336" font-size="11" fill="#3a5a30" filter="url(#rough2)">x = 3 / 10：铺线太贵，保留全部 3 条（k = 3）；仍缺 5 号楼，新铺 1 条花 3 或 10 ⇒ 利润 2 与 −5</text>

  <rect x="28" y="362" width="704" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="384" font-size="11" fill="#7a5a18" filter="url(#rough2)">x 越大 ⇒ 新电缆越贵 ⇒ 最优 k 越大（更愿意留着旧电缆）；k 单调不减，但利润不一定单调。</text>
  <text x="46" y="406" font-size="11" fill="#7a5a18" filter="url(#rough2)">注意 k = 3 时 n−1−k = 1，只需新铺 1 条把 3-4 那一块连进来，花费正好 10。</text>
</svg>
