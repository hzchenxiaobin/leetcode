<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="233" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：操作只触及两端 → 状态只需 (步数 k, 左取数 i)</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 区域标签 -->
  <text x="200" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">左端已取 i = 2</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#a06a20" font-weight="bold">剩余 nums[i .. n−1−j]</text>
  <text x="488" y="56" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">右端已取 j = 1</text>

  <!-- nums 行 -->
  <g filter="url(#sk)">
    <rect x="140" y="64" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="204" y="64" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="268" y="64" width="56" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="332" y="64" width="56" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="396" y="64" width="56" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="460" y="64" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
    <path d="M 146 100 L 190 68" stroke="#b85450" stroke-width="1.6" opacity="0.65"/>
    <path d="M 210 100 L 254 68" stroke="#b85450" stroke-width="1.6" opacity="0.65"/>
    <path d="M 466 100 L 510 68" stroke="#4a8e4a" stroke-width="1.6" opacity="0.65"/>
  </g>
  <g font-size="13" fill="#333" font-family="monospace">
    <text x="168" y="89" text-anchor="middle">−5</text>
    <text x="232" y="89" text-anchor="middle">−3</text>
    <text x="296" y="89" text-anchor="middle">−3</text>
    <text x="360" y="89" text-anchor="middle">−2</text>
    <text x="424" y="89" text-anchor="middle">7</text>
    <text x="488" y="89" text-anchor="middle">1</text>
  </g>
  <g font-size="11" fill="#666" font-family="monospace">
    <text x="168" y="118" text-anchor="middle">0</text>
    <text x="232" y="118" text-anchor="middle">1</text>
    <text x="296" y="118" text-anchor="middle">2</text>
    <text x="360" y="118" text-anchor="middle">3</text>
    <text x="424" y="118" text-anchor="middle">4</text>
    <text x="488" y="118" text-anchor="middle">5</text>
  </g>
  <text x="320" y="138" text-anchor="middle" font-size="11" fill="#666">nums = [−5,−3,−3,−2,7,1]，已执行 k = 3 步（顺序：左、左、右）</text>

  <!-- 取走方向箭头 -->
  <path d="M 134 84 L 106 84" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 522 84 L 550 84" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- mult 行 -->
  <text x="146" y="171" text-anchor="end" font-size="12" fill="#666">mult</text>
  <text x="243" y="147" text-anchor="middle" font-size="9" fill="#999">已用（k = 3 步）</text>
  <text x="349" y="147" text-anchor="middle" font-size="9" fill="#4a8edb">下一个</text>
  <g filter="url(#sk)">
    <rect x="170" y="152" width="46" height="30" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1.2" opacity="0.8"/>
    <rect x="222" y="152" width="46" height="30" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1.2" opacity="0.8"/>
    <rect x="274" y="152" width="46" height="30" rx="4" fill="#f0f0f0" stroke="#b8b8b8" stroke-width="1.2" opacity="0.8"/>
    <rect x="326" y="152" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="378" y="152" width="46" height="30" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <path d="M 176 176 L 210 158" stroke="#999" stroke-width="1.4" opacity="0.8"/>
    <path d="M 228 176 L 262 158" stroke="#999" stroke-width="1.4" opacity="0.8"/>
    <path d="M 280 176 L 314 158" stroke="#999" stroke-width="1.4" opacity="0.8"/>
  </g>
  <g font-size="12" fill="#555" font-family="monospace">
    <text x="193" y="171" text-anchor="middle">−10</text>
    <text x="245" y="171" text-anchor="middle">−5</text>
    <text x="297" y="171" text-anchor="middle">3</text>
    <text x="349" y="171" text-anchor="middle" fill="#2b6e9e" font-weight="bold">4</text>
    <text x="401" y="171" text-anchor="middle">6</text>
  </g>
  <text x="320" y="200" text-anchor="middle" font-size="11" fill="#666">前 k 个乘子随步数消耗，剩余乘子只由 k 决定 → 下一步用 mult[k] = 4</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="70" y="216" width="500" height="62" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">k = i + j ⇒ j = k − i：两维 (k, i) 锁定整个局面</text>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#2b6e9e">剩余区间 nums[i .. n−1−(k−i)] 与剩余乘子均由 (k, i) 唯一确定，与取数顺序无关</text>

  <!-- 直觉框 -->
  <g filter="url(#sk)">
    <rect x="70" y="294" width="500" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#2e6e2e">m ≤ 10³ ≪ n ≤ 10⁵：nums 中间大片元素从未被触及，不进状态</text>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#2e6e2e">状态总数 Σ(k+1) = O(m²)；n 只做 O(1) 下标访问，不进复杂度</text>
</svg>
