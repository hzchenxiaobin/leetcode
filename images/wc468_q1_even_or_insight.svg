<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：筛出偶数做 OR，初值 0 是单位元</text>

  <!-- 数组行 -->
  <text x="115" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="143" y="48" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="165" y="70" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="205" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="227" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="267" y="48" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="289" y="70" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="329" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="351" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="391" y="48" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="413" y="70" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="453" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>

  <text x="165" y="97" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="227" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <text x="289" y="97" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="351" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>
  <text x="413" y="97" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">跳过</text>
  <text x="475" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">参与</text>

  <!-- 筛选箭头 -->
  <path d="M320,106 L320,128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="122" font-size="11" fill="#666" filter="url(#rough2)">筛选：只让偶数进入累积器</text>

  <!-- OR 累积链 -->
  <rect x="90" y="138" width="125" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="159" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">ans = 0（单位元）</text>
  <path d="M215,155 L257,155" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">| 2</text>
  <rect x="263" y="138" width="64" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <path d="M327,155 L369,155" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="351" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">| 4</text>
  <rect x="375" y="138" width="64" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <path d="M439,155 L481,155" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="463" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">| 6</text>
  <rect x="487" y="138" width="64" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="519" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <text x="320" y="190" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">累积器只增不减：0 → 2 → 6 → 6，奇数从未进入</text>

  <!-- 二进制视角 -->
  <rect x="90" y="200" width="460" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">二进制：010 | 100 | 110 = 110₂，最低位恒为 0 → 结果必为偶数</text>

  <!-- 性质框 1：偶数判定 -->
  <rect x="60" y="246" width="520" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">偶数判定：x &amp; 1 == 0 ⟺ x % 2 == 0 ⟺ 最低位为 0</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">位视角与模视角在正数域完全等价，本题值域 [1,100] 两者都安全</text>

  <!-- 性质框 2：单位元 -->
  <rect x="60" y="308" width="520" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">单位元：0 | x = x → 初始 ans = 0</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">无偶数时 ans 保持 0，「无偶数返回 0」的特判被初值天然覆盖</text>

  <!-- 性质框 3：单调性 -->
  <rect x="60" y="370" width="520" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">OR 单调性：位只置 1、不清 0</text>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">结果 ≥ 参与运算的最大偶数；偶数最低位的 0 不会被置成 1</text>

  <!-- 图例 -->
  <rect x="150" y="436" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="446" font-size="11" fill="#666" filter="url(#rough2)">参与 OR 的偶数</text>
  <rect x="300" y="436" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="318" y="446" font-size="11" fill="#666" filter="url(#rough2)">被跳过的奇数</text>
  <text x="462" y="446" font-size="11" fill="#8a6d1f" filter="url(#rough2)">0 是 | 的单位元</text>
</svg>
