<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：木桶效应 —— 每个字符能拼出的「份数」取最小</text>
  <path d="M 240 44 Q 440 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：s 的字符池 -->
  <rect x="40" y="70" width="240" height="330" rx="12" fill="#f0f6fc" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="160" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">s = "ilovecodingonleetcode"</text>
  <text x="160" y="122" text-anchor="middle" font-size="12" fill="#666">（只看 target 里出现的字母）</text>

  <rect x="64" y="140" width="192" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="82" y="160" font-size="12.5" fill="#333">c × 2</text>
  <rect x="64" y="176" width="192" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="82" y="196" font-size="12.5" fill="#333">o × 4</text>
  <rect x="64" y="212" width="192" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="82" y="232" font-size="12.5" fill="#333">d × 2</text>
  <rect x="64" y="248" width="192" height="30" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="82" y="268" font-size="12.5" fill="#333">e × 4</text>

  <text x="160" y="316" text-anchor="middle" font-size="11.5" fill="#888">池子里的字母是「原材料」，</text>
  <text x="160" y="334" text-anchor="middle" font-size="11.5" fill="#888">每个下标只能用一次</text>

  <!-- 中：target 每份需求 -->
  <rect x="330" y="70" width="200" height="330" rx="12" fill="#f0f9f1" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="430" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">target = "code"</text>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="#666">拼 1 份需要：</text>

  <rect x="352" y="140" width="156" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="430" y="160" text-anchor="middle" font-size="12.5" fill="#333">c × 1</text>
  <rect x="352" y="176" width="156" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="430" y="196" text-anchor="middle" font-size="12.5" fill="#333">o × 1</text>
  <rect x="352" y="212" width="156" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="430" y="232" text-anchor="middle" font-size="12.5" fill="#333">d × 1</text>
  <rect x="352" y="248" width="156" height="30" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="430" y="268" text-anchor="middle" font-size="12.5" fill="#333">e × 1</text>

  <text x="430" y="316" text-anchor="middle" font-size="11.5" fill="#888">重排 = 只看字母个数，</text>
  <text x="430" y="334" text-anchor="middle" font-size="11.5" fill="#888">不看顺序</text>

  <!-- 右：每个字符的份数 -->
  <rect x="580" y="70" width="260" height="330" rx="12" fill="#fef9ef" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="710" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">每个字符能拼出几份？</text>

  <rect x="602" y="140" width="216" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="710" y="160" text-anchor="middle" font-size="12.5" fill="#333">⌊2 / 1⌋ = 2 份</text>
  <rect x="602" y="176" width="216" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="710" y="196" text-anchor="middle" font-size="12.5" fill="#333">⌊4 / 1⌋ = 4 份</text>
  <rect x="602" y="212" width="216" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="710" y="232" text-anchor="middle" font-size="12.5" fill="#333">⌊2 / 1⌋ = 2 份</text>
  <rect x="602" y="248" width="216" height="30" rx="5" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="710" y="268" text-anchor="middle" font-size="12.5" fill="#333">⌊4 / 1⌋ = 4 份</text>

  <rect x="602" y="290" width="216" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="710" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">最短板：c 和 d 各只有 2 份</text>
  <text x="710" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36">答案 = min = 2</text>

  <!-- 箭头 -->
  <path d="M 284 172 L 322 172" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 284 188 L 322 188" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 284 204 L 322 204" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 284 220 L 322 220" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <path d="M 532 172 C 552 172, 560 172, 578 172" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 532 204 C 552 204, 560 204, 578 204" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- 底部结论 -->
  <rect x="40" y="430" width="800" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="462" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">答案 = min over target 中每个字母 c of ⌊ cntS[c] / cntT[c] ⌋</text>
  <text x="440" y="490" text-anchor="middle" font-size="12" fill="#333">字母不够的字符直接把整体卡死 —— 正是「木桶效应」：能拼几份由最稀缺的字母决定</text>
  <text x="440" y="514" text-anchor="middle" font-size="11" fill="#888">若某字母在 s 中不存在，则 ⌊0 / cntT[c]⌋ = 0，答案为 0</text>
</svg>
