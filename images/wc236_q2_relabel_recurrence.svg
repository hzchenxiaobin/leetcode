<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：删掉首个出局者后，剩下的是「同一个问题的小号版本」</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#666">0-indexed，从 0 号数 k 个 → 首个出局是 k−1 号，下一轮从 k 号重新起数</text>

  <text x="68" y="86" text-anchor="start" font-size="11.5" fill="#446688">规模 m 的圈：0 ~ m−1 号</text>
  <text x="318" y="88" text-anchor="middle" font-size="9.5" fill="#8f3830">出局</text>
  <text x="374" y="88" text-anchor="middle" font-size="9.5" fill="#2e5a24">重新起数</text>

  <g filter="url(#sk)">
    <rect x="68" y="94" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="94" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="236" y="94" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="292" y="94" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <path d="M 296 98 L 340 124 M 340 98 L 296 124" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <rect x="348" y="94" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="404" y="94" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="516" y="94" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="94" y="115" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="150" y="115" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="206" y="115" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="262" y="115" text-anchor="middle" font-size="13" fill="#333">k−2</text>
  <text x="318" y="115" text-anchor="middle" font-size="13" fill="#8f3830">k−1</text>
  <text x="374" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">k</text>
  <text x="430" y="115" text-anchor="middle" font-size="13" fill="#333">k+1</text>
  <text x="486" y="115" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="542" y="115" text-anchor="middle" font-size="13" fill="#333">m−1</text>

  <path d="M 314 132 C 314 170 210 150 128 186" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="240" y="164" text-anchor="middle" font-size="10.5" fill="#8f3830">k−1 号出局 → 从 k 号重新起数</text>

  <text x="96" y="182" text-anchor="start" font-size="11.5" fill="#2e5a24">剩下的 m−1 人，从 k 号顺时针排：</text>
  <g filter="url(#sk)">
    <rect x="96" y="190" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="152" y="190" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="190" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="190" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="376" y="190" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="488" y="190" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="122" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">k</text>
  <text x="178" y="211" text-anchor="middle" font-size="13" fill="#333">k+1</text>
  <text x="234" y="211" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="290" y="211" text-anchor="middle" font-size="13" fill="#333">m−1</text>
  <text x="346" y="211" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="402" y="211" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="458" y="211" text-anchor="middle" font-size="13" fill="#999">…</text>
  <text x="514" y="211" text-anchor="middle" font-size="13" fill="#333">k−2</text>

  <text x="122" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">0</text>
  <text x="178" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">1</text>
  <text x="234" y="242" text-anchor="middle" font-size="10.5" fill="#999">…</text>
  <text x="290" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">m−1−k</text>
  <text x="346" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">m−k</text>
  <text x="402" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">m−k+1</text>
  <text x="458" y="242" text-anchor="middle" font-size="10.5" fill="#999">…</text>
  <text x="514" y="242" text-anchor="middle" font-size="10.5" fill="#2e5a24">m−2</text>
  <text x="320" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">新号 j ↔ 旧号 (j ＋ k) mod m —— 同款约瑟夫问题，规模小 1</text>

  <g filter="url(#sk)">
    <rect x="60" y="276" width="520" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="299" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">剩下的是规模 m−1 的同款约瑟夫问题：幸存者新号为 f(m−1)</text>
  <text x="320" y="322" text-anchor="middle" font-size="12" fill="#8a6415">换回旧号：f(m) ＝ (f(m−1) ＋ k) mod m —— 位置错位 k，越界用 mod m 回绕</text>

  <g filter="url(#sk)">
    <rect x="60" y="358" width="520" height="82" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a">递推：f(1) ＝ 0，　f(m) ＝ (f(m−1) ＋ k) mod m，　答案 ＝ f(n) ＋ 1</text>
  <text x="320" y="406" text-anchor="middle" font-size="11.5" fill="#33517a">从只剩 1 人的终局一圈圈长回 n 人，每圈只花一次加法与取模</text>
  <text x="320" y="428" text-anchor="middle" font-size="11.5" fill="#33517a">O(n) 时间 ＋ O(1) 空间 —— 满足进阶要求</text>
</svg>
