<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="780" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：每个相邻下坠都是一笔必还的债</text>
  <path d="M 320 42 Q 460 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 面板 A：一个大下坠 [5,1,2,3] ===== -->
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#444">① 一个大下坠：nums = [5, 1, 2, 3]</text>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="96" width="52" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="300" y="96" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="360" y="96" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="420" y="96" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <text x="266" y="124">5</text>
    <text x="326" y="124">1</text>
    <text x="386" y="124">2</text>
    <text x="446" y="124">3</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="266" y="158">0</text>
    <text x="326" y="158">1</text>
    <text x="386" y="158">2</text>
    <text x="446" y="158">3</text>
  </g>
  <path d="M 266 88 Q 296 62 326 88" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="296" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">下坠 δ = 4</text>

  <path d="M 300 170 L 300 178 L 472 178 L 472 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="386" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">一次操作：子数组 [1..3] 整体 +4</text>
  <text x="386" y="214" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">代价只按「高度」记一次 = 4，不是 4 × 3 = 12（宽度免费！）</text>

  <path d="M 386 226 L 386 248" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="254" width="52" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="300" y="254" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="360" y="254" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="420" y="254" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="266" y="282">5</text>
    <text x="326" y="282">5</text>
    <text x="386" y="282">6</text>
    <text x="446" y="282">7</text>
  </g>
  <text x="530" y="282" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ 非递减，总代价 = 4</text>

  <!-- ===== 面板 B：两个小下坠 [3,3,2,1] ===== -->
  <text x="60" y="338" font-size="14" font-weight="bold" fill="#444">② 两个小下坠：nums = [3, 3, 2, 1]</text>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="356" width="52" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="300" y="356" width="52" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="360" y="356" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="420" y="356" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <text x="266" y="384">3</text>
    <text x="326" y="384">3</text>
    <text x="386" y="384">2</text>
    <text x="446" y="384">1</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="266" y="418">0</text>
    <text x="326" y="418">1</text>
    <text x="386" y="418">2</text>
    <text x="446" y="418">3</text>
  </g>
  <path d="M 326 348 Q 356 324 386 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 386 348 Q 416 324 446 348" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="356" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">δ=1</text>
  <text x="416" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">δ=1</text>

  <path d="M 386 430 L 386 452" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="446" font-size="12" fill="#555" filter="url(#sk)">op①：后缀 [2..3] +1（抹平第一处下坠）</text>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="458" width="52" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="300" y="458" width="52" height="44" rx="4" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.6"/>
    <rect x="360" y="458" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="420" y="458" width="52" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <text x="266" y="486">3</text>
    <text x="326" y="486">3</text>
    <text x="386" y="486">3</text>
    <text x="446" y="486">2</text>
  </g>
  <text x="530" y="486" font-size="13" fill="#444" filter="url(#sk)">ans = 1</text>

  <path d="M 386 512 L 386 528" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="526" font-size="12" fill="#555" filter="url(#sk)">op②：后缀 [3..3] +1（抹平第二处下坠）</text>

  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="240" y="534" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="300" y="534" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="360" y="534" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="420" y="534" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="266" y="562">3</text>
    <text x="326" y="562">3</text>
    <text x="386" y="562">3</text>
    <text x="446" y="562">3</text>
  </g>
  <text x="530" y="562" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 2 ✓ 非递减</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="612" width="820" height="140" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="640" font-size="13" fill="#444" filter="url(#sk)">💡 结论：答案 = Σ max(0, nums[i] − nums[i+1]) —— 每个相邻下坠都必须偿还、也只需偿还一次。</text>
  <text x="70" y="664" font-size="12" fill="#555" filter="url(#sk)">后缀抬升 [i+1..n−1] 恰好抹平第 i 处下坠，且不触碰已修好的前缀 [0..i]，左端点之外纹丝不动。</text>
  <text x="70" y="688" font-size="12" fill="#555" filter="url(#sk)">一次操作花 x 的代价，至多改善一个相邻对 x（区间内部的相邻差全部不变）——「计费」与「影响」的错位是本题的全部秘密。</text>
  <text x="70" y="712" font-size="12" fill="#555" filter="url(#sk)">严格递减数组 [5,4,3,2,1]：四处下坠各 1，答案 4（四次后缀抬升 → 全 5）。</text>
  <text x="70" y="736" font-size="11" fill="#7a7a7a" filter="url(#sk)">复杂度：时间 O(n) | 额外空间 O(1)</text>
</svg>
