<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：建池后逐位 O(1) 命中</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">words1 = [great, acting, skills]　words2 = [fine, drama, talent]</text>

  <rect x="60" y="66" width="468" height="132" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <rect x="60" y="66" width="468" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <path d="M 60 96 L 528 96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 60 130 L 528 130" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 60 164 L 528 164" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="86" fill="#3a4a66" font-weight="bold">i</text>
    <text x="154" y="86" fill="#3a4a66" font-weight="bold">words1[i]</text>
    <text x="254" y="86" fill="#3a4a66" font-weight="bold">words2[i]</text>
    <text x="379" y="86" fill="#3a4a66" font-weight="bold">查询键 len(a)#a b</text>
    <text x="491" y="86" fill="#3a4a66" font-weight="bold">结果</text>
  </g>

  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="118">0</text>
    <text x="154" y="118">great</text>
    <text x="254" y="118" fill="#b85450">fine</text>
    <text x="379" y="118" font-size="9.5">5#greatfine</text>
    <text x="491" y="118" fill="#4a7a3a">命中</text>

    <text x="82" y="152">1</text>
    <text x="154" y="152">acting</text>
    <text x="254" y="152" fill="#b85450">drama</text>
    <text x="379" y="152" font-size="9.5">6#actingdrama</text>
    <text x="491" y="152" fill="#4a7a3a" font-size="9">命中（反向）</text>

    <text x="82" y="186">2</text>
    <text x="154" y="186">skills</text>
    <text x="254" y="186" fill="#b85450">talent</text>
    <text x="379" y="186" font-size="9.5">6#skillstalent</text>
    <text x="491" y="186" fill="#4a7a3a">命中</text>
  </g>

  <rect x="60" y="212" width="468" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="294" y="235" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3 / 3 位全部通过 ⇒ 返回 true（三个位置均非相等，全靠 pairs 键命中）</text>

  <text x="300" y="270" text-anchor="middle" font-size="8.6" fill="#777" filter="url(#rough2)">池内 6 键：5#greatfine · 4#finegreat · 5#dramaacting · 6#actingdrama · 6#skillstalent · 6#talentskills</text>

  <rect x="60" y="288" width="468" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="308" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 3：words1 = ["great"]，words2 = ["doubleplus", "good"]</text>
  <text x="76" y="328" font-size="10" fill="#555" filter="url(#rough2)">词数 1 ≠ 2 ⇒ 长度门直接 false，连键池都不必建</text>
</svg>
