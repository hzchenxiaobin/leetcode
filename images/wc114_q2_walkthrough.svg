  <rect x="162" y="184" width="74" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="199" y="205.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="236" y="184" width="68" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="270" y="205.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">—</text>
  <rect x="304" y="184" width="82" height="34" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
