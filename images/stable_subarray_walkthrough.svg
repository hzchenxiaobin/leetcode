<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：capacity ＝ [−4, 4, 0, 0, −8, −4] → 输出 1</text>
  <path d="M 160 40 Q 330 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="168" y="56" width="54" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="226" y="56" width="54" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="284" y="56" width="54" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="342" y="56" width="54" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="56" width="54" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="458" y="56" width="54" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="195" y="83" fill="#2b6e9e">−4</text>
    <text x="253" y="83" fill="#2e5e22">4</text>
    <text x="311" y="83" fill="#7a5415">0</text>
    <text x="369" y="83" fill="#7a5415">0</text>
    <text x="427" y="83" fill="#8e3a34">−8</text>
    <text x="485" y="83" fill="#2b6e9e">−4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#999">
    <text x="195" y="110">0</text>
    <text x="253" y="110">1</text>
    <text x="311" y="110">2</text>
    <text x="369" y="110">3</text>
    <text x="427" y="110">4</text>
    <text x="485" y="110">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="120" y="122" width="420" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="330" y="144" text-anchor="middle" font-size="12.5" fill="#333">前缀和 P[0..6] ＝ 0，−4，0，0，0，−8，−12</text>

  <g filter="url(#sk)">
    <rect x="48" y="172" width="64" height="50" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="128" y="172" width="396" height="50" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="540" y="172" width="72" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="80" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">−4</text>
  <text x="326" y="192" text-anchor="middle" font-size="12.5" fill="#333">下标 {0, 5}：P[5] − P[0] ＝ −8 ＝ 2×(−4) ✓</text>
  <text x="326" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a">对应整个子数组 [−4, 4, 0, 0, −8, −4]</text>
  <text x="576" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">＋1</text>

  <g filter="url(#sk)">
    <rect x="48" y="238" width="64" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="128" y="238" width="396" height="50" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="540" y="238" width="72" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="80" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <text x="326" y="258" text-anchor="middle" font-size="12.5" fill="#333">下标 {2, 3}：P[3] − P[2] ＝ 0 ＝ 2×0 ✓</text>
  <text x="326" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8e3a34">但 r ＝ l+1，长度只有 2 → 相邻双零，误计！</text>
  <text x="576" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e3a34">−1</text>

  <g filter="url(#sk)">
    <rect x="48" y="304" width="64" height="44" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="128" y="304" width="396" height="44" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.2"/>
    <rect x="540" y="304" width="72" height="44" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="80" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">4, −8</text>
  <text x="326" y="331" text-anchor="middle" font-size="12.5" fill="#666">单元素组，组内凑不出数对</text>
  <text x="576" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">＋0</text>

  <g filter="url(#sk)">
    <rect x="70" y="368" width="520" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="330" y="396" text-anchor="middle" font-size="13.5" fill="#2b6e9e">数对合计 T ＝ 2，相邻双零 Z ＝ 1（a[2] ＝ a[3] ＝ 0）</text>
  <text x="330" y="424" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e">ans ＝ T − Z ＝ 2 − 1 ＝ 1 ✓</text>
</svg>
