<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">移山所需的最少秒数：单个工人的成本台阶</text>
  <path d="M 150 41 Q 320 50 490 41" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11" fill="#888">以某工人 w = workerTimes[i] = 2 为例</text>

  <!-- staircase silhouette -->
  <path d="M 86 332 V 316 H 162 V 284 H 238 V 236 H 314 V 172 H 390 V 332 Z"
        fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- base axis -->
  <path d="M 70 332 L 408 332" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="374" text-anchor="middle" font-size="11" fill="#777">完成单位数 x（山的高度 −x）</text>

  <!-- riser marginal cost labels -->
  <text x="82" y="314" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+2s</text>
  <text x="158" y="308" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+4s</text>
  <text x="234" y="270" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+6s</text>
  <text x="310" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">+8s</text>
  <text x="240" y="112" text-anchor="middle" font-size="10.5" fill="#a08040">每高 1 格，下一单位更贵：第 x 单位花 w·x 秒</text>

  <!-- tread cumulative labels -->
  <text x="124" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">累计 2s</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">累计 6s</text>
  <text x="276" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">累计 12s</text>
  <text x="352" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">累计 20s</text>

  <!-- x tick labels -->
  <text x="124" y="350" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace">x=1</text>
  <text x="200" y="350" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace">x=2</text>
  <text x="276" y="350" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace">x=3</text>
  <text x="352" y="350" text-anchor="middle" font-size="10.5" fill="#777" font-family="monospace">x=4</text>

  <!-- formula panel -->
  <rect x="430" y="92" width="184" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="522" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">单工人成本公式</text>
  <text x="522" y="138" text-anchor="middle" font-size="11" fill="#333">第 k 单位耗时 w·k</text>
  <text x="522" y="158" text-anchor="middle" font-size="11" fill="#333">挖 x 单位总耗时</text>
  <text x="522" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" font-family="monospace">w·(1+2+…+x)</text>
  <text x="522" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">= w·x(x+1)/2</text>

  <!-- max note panel -->
  <rect x="430" y="238" width="184" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="260" text-anchor="middle" font-size="11" fill="#7a5415">所有工人同时开工</text>
  <text x="522" y="280" text-anchor="middle" font-size="11" fill="#7a5415">总耗时 = max(各工人)</text>
  <text x="522" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">「最小化最大值」</text>
  <text x="522" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">→ 二分答案！</text>
  <text x="522" y="350" text-anchor="middle" font-size="10" fill="#a08040">（由示例 1：2, 3, 1 → max = 3）</text>
</svg>
