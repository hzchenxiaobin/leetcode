<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [1,1,1,1]，queries = [[1,3],[0,2],[1,3],[1,2]]</text>

  <g font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="52" y="64">i</text>
    <text x="150" y="64">新入 avail</text>
    <text x="256" y="64">cur</text>
    <text x="316" y="64">nums[i]</text>
    <text x="400" y="64">本次选取</text>
    <text x="492" y="64">used</text>
  </g>
  <path d="M 24 74 L 536 74" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="52" y="104">0</text>
    <text x="150" y="104">[0,2] → r = 2</text>
    <text x="256" y="104">0</text>
    <text x="316" y="104">1</text>
    <text x="400" y="104" font-weight="bold" fill="#4a7a3a">取 r = 2</text>
    <text x="492" y="104">1</text>

    <text x="52" y="134">1</text>
    <text x="150" y="134">[1,3]×2, [1,2]</text>
    <text x="256" y="134">1</text>
    <text x="316" y="134">1</text>
    <text x="400" y="134" fill="#888">不需要</text>
    <text x="492" y="134">1</text>

    <text x="52" y="164">2</text>
    <text x="150" y="164">—</text>
    <text x="256" y="164">1</text>
    <text x="316" y="164">1</text>
    <text x="400" y="164" fill="#888">不需要</text>
    <text x="492" y="164">1</text>

    <text x="52" y="194">3</text>
    <text x="150" y="194">—（r = 2 过期，cur−−）</text>
    <text x="256" y="194">0</text>
    <text x="316" y="194">1</text>
    <text x="400" y="194" font-weight="bold" fill="#4a7a3a">取 r = 3</text>
    <text x="492" y="194">2</text>
  </g>
  <path d="M 24 208 L 536 208" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="110" y="222" width="150" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">选中 [0,2] 与 [1,3]</text>

  <rect x="290" y="222" width="170" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="375" y="249" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">答案 = 4 − 2 = 2</text>

  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">位置 3 只有右端点为 3 的查询能覆盖，所以第 1 步必须先取 r 更大的？</text>
  <text x="280" y="316" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">不 —— 位置 0 只有 [0,2] 能覆盖，故先取它；位置 3 再补 [1,3]</text>
</svg>
