<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">append 的历史折算：按「当时」的 tag 送回基坐标</text>

  <!-- 时间轴 -->
  <g filter="url(#rough2)">
    <line x1="50" y1="130" x2="520" y2="130" stroke="#446688" stroke-width="2.4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="120" cy="130" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="230" cy="130" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="340" cy="130" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="450" cy="130" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688" text-anchor="middle">
    <text x="120" y="112">t₁: append(2)</text>
    <text x="230" y="112">t₂: addAll(3)</text>
    <text x="340" y="112">t₃: multAll(2)</text>
    <text x="450" y="112">t₄: getIndex(0)</text>
  </g>
  <text x="60" y="150" font-size="12" fill="#888" filter="url(#rough2)">时间 →</text>

  <!-- t1 时刻的 val=2 与当时的 tag -->
  <g filter="url(#rough2)">
    <rect x="82" y="170" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="110" y="196" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">val=2</text>
  <text x="110" y="232" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">t₁ 时的真实值</text>

  <g filter="url(#rough2)">
    <rect x="170" y="170" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="245" y="190" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">t₁ 时的 tag：</text>
  <text x="245" y="204" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">(add=0, mul=1)</text>

  <!-- 折算箭头 -->
  <path d="M 140 190 L 164 190" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="248" font-size="12.5" fill="#b85450" filter="url(#rough2)">折算：base = (2−0) × 1⁻¹ = 2</text>

  <!-- base 存储 -->
  <g filter="url(#rough2)">
    <rect x="82" y="264" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
  </g>
  <text x="157" y="290" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">存进数组：base = 2</text>
  <path d="M 240 250 C 220 260, 200 264, 188 268" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 之后 tag 演化 + 查询正变换 -->
  <g filter="url(#rough2)">
    <rect x="290" y="180" width="180" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <text x="380" y="204" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">t₂..t₃ 后 tag 变成：</text>
  <text x="380" y="226" text-anchor="middle" font-size="14" fill="#b8860b" font-weight="bold" filter="url(#rough2)">(add=6, mul=2)</text>

  <path d="M 235 292 C 280 290, 330 280, 368 268" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="374" y="262" width="152" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8"/>
  </g>
  <text x="450" y="284" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">t₄ 正变换还原：</text>
  <text x="450" y="304" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2×2 + 6 = 10 ✓</text>

  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">关键：折算用「append 当时」的 tag，</text>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">查询用「当前」的 tag —— 恒等式 base·mul + add 始终成立</text>
</svg>
