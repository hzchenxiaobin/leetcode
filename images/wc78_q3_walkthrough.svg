<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 50 → m = 2，答案是 dp[2][2]</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前驱下标为负就截断到 0；于是第 0 行、第 0 列正好表示“已经有一锅空了”的终局</text>

  <text x="160" y="92" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">a ＼ b</text>
  <text x="220" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="308" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="396" y="92" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>

  <rect x="176" y="100" width="264" height="168" fill="none" stroke="#8a9ab0" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="180" y="104" width="80" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="268" y="104" width="80" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="356" y="104" width="80" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="180" y="160" width="80" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="268" y="160" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="356" y="160" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="180" y="216" width="80" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="268" y="216" width="80" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="352" y="212" width="88" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <text x="220" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a28" filter="url(#rough2)">0.50000</text>
  <text x="308" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a28" filter="url(#rough2)">1.00000</text>
  <text x="396" y="132" text-anchor="middle" font-size="11.5" fill="#2f4a28" filter="url(#rough2)">1.00000</text>
  <text x="220" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">0.00000</text>
  <text x="308" y="188" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">0.62500</text>
  <text x="396" y="188" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">0.75000</text>
  <text x="220" y="244" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">0.00000</text>
  <text x="308" y="244" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">0.50000</text>
  <text x="396" y="244" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0.62500</text>

  <text x="168" y="132" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">a=0</text>
  <text x="168" y="188" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">a=1</text>
  <text x="168" y="244" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">a=2</text>

  <text x="462" y="112" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">dp[2][2] 的四个前驱（各 ¼）</text>
  <text x="462" y="136" font-size="10" fill="#3a5a30" filter="url(#rough2)">① at(−2, 2) = dp[0][2] = 1.0　A 先空</text>
  <text x="462" y="160" font-size="10" fill="#3a5a30" filter="url(#rough2)">② at(−1, 1) = dp[0][1] = 1.0　A 先空</text>
  <text x="462" y="184" font-size="10" fill="#8a3a36" filter="url(#rough2)">③ at( 0, 0) = dp[0][0] = 0.5　同时空</text>
  <text x="462" y="208" font-size="10" fill="#8a6d1f" filter="url(#rough2)">④ at( 1,−1) = dp[1][0] = 0.0　B 先空</text>

  <path d="M 462 218 L 700 218" stroke="#8a9ab0" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <rect x="456" y="228" width="248" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="580" y="250" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">dp[2][2] = ¼ × (1 + 1 + 0.5 + 0)</text>
  <text x="580" y="274" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">= 0.625　与示例 1 一致 ✔</text>

  <rect x="42" y="292" width="636" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">读表口诀：第 0 行、第 0 列、左上角，就是三种终局</text>
  <text x="60" y="336" font-size="10" fill="#3a5a30" filter="url(#rough2)">第 0 行（a = 0，A 空而 B 还有）→ A 先取完，记 1.0；第 0 列（b = 0）→ B 先取完，记 0.0</text>
  <text x="60" y="356" font-size="10" fill="#3a5a30" filter="url(#rough2)">左上角 dp[0][0] → 同一回合一起取完，按题意只记 ½。截断到 0 让四种操作统一成一次查表</text>
</svg>
