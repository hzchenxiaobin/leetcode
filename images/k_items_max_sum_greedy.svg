<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪心：按价值降序排成一排，从左往右拿</text>
  <path d="M 150 42 Q 340 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: sorted items -->
  <text x="163" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">① 物品按价值降序排列</text>

  <g filter="url(#sk)"><rect x="36" y="96" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="53" y="117" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="76" y="96" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="93" y="117" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="116" y="96" width="34" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="133" y="117" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="156" y="96" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="173" y="117" text-anchor="middle" font-size="13" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><rect x="196" y="96" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="213" y="117" text-anchor="middle" font-size="13" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><rect x="236" y="96" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="253" y="117" text-anchor="middle" font-size="13" fill="#b03a3a">−1</text>
  <g filter="url(#sk)"><rect x="276" y="96" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="293" y="117" text-anchor="middle" font-size="13" fill="#b03a3a">−1</text>

  <g filter="url(#sk)"><rect x="30" y="88" width="206" height="48" rx="6" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4"/></g>
  <text x="133" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">k=5</text>

  <g filter="url(#sk)"><path d="M 36 160 Q 165 188 294 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#555">从左往右依次拿</text>

  <text x="36" y="222" font-size="11" fill="#444">1 最优先（和 +1）；0 用来补件数（和 +0）；</text>
  <text x="36" y="240" font-size="11" fill="#444">−1 只在 1 和 0 都拿完后才被迫碰（和 −1）。</text>

  <text x="36" y="268" font-size="11" fill="#2e6e2e" font-family="monospace">k=2 → 拿 1,1          → 和 = 2</text>
  <text x="36" y="288" font-size="11" fill="#2b6e9e" font-family="monospace">k=4 → 拿 1,1,1,0      → 和 = 3</text>
  <text x="36" y="308" font-size="11" fill="#b03a3a" font-family="monospace">k=6 → 拿 1,1,1,0,0,−1 → 和 = 2</text>

  <!-- Right: f(t) chart -->
  <text x="505" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 拿前 t 件的累积和 f(t)</text>

  <g filter="url(#sk)">
    <rect x="394" y="260" width="26" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="432" y="230" width="26" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="470" y="200" width="26" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="508" y="200" width="26" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="546" y="200" width="26" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="584" y="230" width="26" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="622" y="260" width="26" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)"><line x1="346" y1="290" x2="655" y2="290" stroke="#999" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><path d="M 369 290 L 407 260 L 445 230 L 483 200 L 521 200 L 559 200 L 597 230 L 635 260" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/></g>

  <text x="407" y="254" text-anchor="middle" font-size="10" fill="#2e6e2e">1</text>
  <text x="445" y="224" text-anchor="middle" font-size="10" fill="#2e6e2e">2</text>
  <text x="483" y="194" text-anchor="middle" font-size="10" fill="#7a5415">3</text>
  <text x="521" y="194" text-anchor="middle" font-size="10" fill="#7a5415">3</text>
  <text x="559" y="194" text-anchor="middle" font-size="10" fill="#7a5415">3</text>
  <text x="597" y="224" text-anchor="middle" font-size="10" fill="#b03a3a">2</text>
  <text x="635" y="254" text-anchor="middle" font-size="10" fill="#b03a3a">1</text>

  <text x="369" y="304" text-anchor="middle" font-size="10" fill="#777">0</text>
  <text x="407" y="304" text-anchor="middle" font-size="10" fill="#777">1</text>
  <text x="445" y="304" text-anchor="middle" font-size="10" fill="#777">2</text>
  <text x="483" y="304" text-anchor="middle" font-size="10" fill="#777">3</text>
  <text x="521" y="304" text-anchor="middle" font-size="10" fill="#777">4</text>
  <text x="559" y="304" text-anchor="middle" font-size="10" fill="#777">5</text>
  <text x="597" y="304" text-anchor="middle" font-size="10" fill="#777">6</text>
  <text x="635" y="304" text-anchor="middle" font-size="10" fill="#777">7</text>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#777">已拿件数 t</text>

  <text x="430" y="160" text-anchor="middle" font-size="10.5" fill="#2e6e2e">拿 1：每件 +1</text>
  <g filter="url(#sk)"><path d="M 470 190 L 572 190" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="521" y="181" text-anchor="middle" font-size="10.5" fill="#7a5415">平台：0 补数，和不变</text>
  <text x="648" y="248" text-anchor="end" font-size="10.5" fill="#b03a3a">被迫拿 −1：每件 −1</text>

  <!-- Insight box -->
  <g filter="url(#sk)"><rect x="40" y="338" width="600" height="50" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="60" y="358" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：</text>
  <text x="60" y="378" font-size="11" fill="#444">每件物品贡献 ∈ {+1, 0, −1}，按价值降序拿 ⇒ 累积和先升、平台、再降（上凸），停在最优处。</text>
</svg>
