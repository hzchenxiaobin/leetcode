<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">按 s[i]=a[i]+b[i] 降序：奇偶位轮流分配</text>

  <!-- 排序序列 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="130" y="70" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="200" y="70" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="270" y="70" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="340" y="70" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="410" y="70" width="70" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="95" y="101">s₁</text><text x="165" y="101">s₂</text>
    <text x="235" y="101">s₃</text><text x="305" y="101">s₄</text>
    <text x="375" y="101">s₅</text><text x="445" y="101">s₆</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="280" y="140">降序 s₁ ≥ s₂ ≥ s₃ ≥ s₄ ≥ s₅ ≥ s₆</text>
  </g>

  <!-- 归属箭头 -->
  <path d="M 95 122 C 95 170, 160 180, 210 196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 122 C 235 168, 240 178, 262 196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 375 122 C 375 168, 370 178, 348 196" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 122 C 165 172, 150 182, 128 236" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 305 122 C 305 172, 300 186, 280 236" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 445 122 C 445 172, 440 186, 420 236" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Alice 行 -->
  <g filter="url(#rough2)">
    <rect x="180" y="198" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="305" y="220" font-size="14" fill="#446688" text-anchor="middle" filter="url(#rough2)">Alice：偶数位 s₁+s₃+s₅</text>

  <!-- Bob 行 -->
  <g filter="url(#rough2)">
    <rect x="60" y="238" width="250" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <text x="185" y="260" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">Bob：奇数位 s₂+s₄+s₆</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="80" y="286" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="308" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">配对策略：对手取走某对的一个，你立刻取同对的另一个</text>
</svg>
