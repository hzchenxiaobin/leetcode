<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">排序后从右往左滑动窗口，只检查相邻三个</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">窗口一旦不满足，就把当前最大元素永久剔除</text>
  <rect x="40" y="110" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="68.0" y="137.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="96" y="110" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="124.0" y="137.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="152" y="110" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="137.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="208" y="110" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="236.0" y="137.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="40" y="96" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">升序后 a = </text>
  <text x="40" y="184" font-size="11.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">① 看最大的三个 (3, 3, 6)</text>
  <text x="40" y="204" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">   3 + 3 = 6，不严格大于 → 剔除 6</text>
  <rect x="40" y="232" width="56" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="96" y="232" width="56" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="124.0" y="259.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="152" y="232" width="56" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="259.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="208" y="232" width="56" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="236.0" y="259.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="40" y="292" width="56" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="68.0" y="319.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="96" y="292" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="124.0" y="319.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="152" y="292" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="319.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="208" y="292" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="236.0" y="319.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="40" y="366" font-size="11.5" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">② 窗口左移一位：2 + 3 = 5 &gt; 3 ✓ 周长 8</text>
  <path d="M 96 236 L 96 286" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 200 254 L 236 254" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="246" y="258" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">剔除 6（它在任何三元组里都太大）</text>
  <rect x="330" y="100" width="200" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="340" y="121" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">只需判一条</text><text x="340" y="136.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">a ≤ b ≤ c 时</text><text x="340" y="152.89999999999998" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">a + b &gt; c 即充分</text>
</svg>
