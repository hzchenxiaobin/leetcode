<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：值域只有 1~100，一行数组压成一个位掩码</text>
  <path d="M 150 38 Q 320 48 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：两个数组 -->
  <text x="86" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">a =</text>
  <g filter="url(#sk)">
    <g stroke="#446688" stroke-width="1.5" fill="#e8f0fe">
      <rect x="104" y="56" width="32" height="32" rx="4"/>
      <rect x="140" y="56" width="32" height="32" rx="4"/>
      <rect x="176" y="56" width="32" height="32" rx="4"/>
    </g>
  </g>
  <g font-size="13" fill="#2b4a6b" text-anchor="middle" font-weight="bold">
    <text x="120" y="77">1</text><text x="156" y="77">2</text><text x="192" y="77">3</text>
  </g>
  <text x="412" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">b =</text>
  <g filter="url(#sk)">
    <g stroke="#4a7a3a" stroke-width="1.5" fill="#e6f4ea">
      <rect x="430" y="56" width="32" height="32" rx="4"/>
      <rect x="466" y="56" width="32" height="32" rx="4"/>
      <rect x="502" y="56" width="32" height="32" rx="4"/>
    </g>
  </g>
  <g font-size="13" fill="#2e5e2e" text-anchor="middle" font-weight="bold">
    <text x="446" y="77">2</text><text x="482" y="77">3</text><text x="518" y="77">4</text>
  </g>

  <!-- 说明带 -->
  <g filter="url(#sk)">
    <rect x="120" y="96" width="400" height="24" rx="6" fill="#f0f0f0"/>
  </g>
  <text x="320" y="112" text-anchor="middle" font-size="11.5" fill="#666">去重 → 第 v 位置 1（值域 1 ≤ v ≤ 100，图里只画 1~7 位）</text>

  <!-- 位掩码三行 -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="230" y="138">1</text><text x="262" y="138">2</text><text x="294" y="138">3</text>
    <text x="326" y="138">4</text><text x="358" y="138">5</text><text x="390" y="138">6</text><text x="422" y="138">7</text>
  </g>
  <text x="206" y="162" text-anchor="end" font-size="12" fill="#446688">mask_a</text>
  <g filter="url(#sk)">
    <g stroke-width="1.4">
      <rect x="216" y="144" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
      <rect x="248" y="144" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
      <rect x="280" y="144" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
      <rect x="312" y="144" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="344" y="144" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="376" y="144" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="408" y="144" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
    </g>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="230" y="163" fill="#446688">1</text><text x="262" y="163" fill="#446688">1</text><text x="294" y="163" fill="#446688">1</text>
    <text x="326" y="163" fill="#bbbbbb">0</text><text x="358" y="163" fill="#bbbbbb">0</text>
    <text x="390" y="163" fill="#bbbbbb">0</text><text x="422" y="163" fill="#bbbbbb">0</text>
  </g>

  <text x="200" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#666">&amp;</text>
  <text x="206" y="202" text-anchor="end" font-size="12" fill="#4a7a3a">mask_b</text>
  <g filter="url(#sk)">
    <g stroke-width="1.4">
      <rect x="216" y="184" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="248" y="184" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="280" y="184" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="312" y="184" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a"/>
      <rect x="344" y="184" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="376" y="184" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="408" y="184" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
    </g>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="230" y="203" fill="#bbbbbb">0</text><text x="262" y="203" fill="#4a7a3a">1</text><text x="294" y="203" fill="#4a7a3a">1</text>
    <text x="326" y="203" fill="#4a7a3a">1</text><text x="358" y="203" fill="#bbbbbb">0</text>
    <text x="390" y="203" fill="#bbbbbb">0</text><text x="422" y="203" fill="#bbbbbb">0</text>
  </g>
  <path d="M 214 222 Q 322 228 430 222" stroke="#aaaaaa" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <text x="206" y="250" text-anchor="end" font-size="12" font-weight="bold" fill="#a67c2e">a &amp; b</text>
  <g filter="url(#sk)">
    <g stroke-width="1.4">
      <rect x="216" y="232" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="248" y="232" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"/>
      <rect x="280" y="232" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"/>
      <rect x="312" y="232" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="344" y="232" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="376" y="232" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
      <rect x="408" y="232" width="28" height="28" rx="4" fill="#ffffff" stroke="#cccccc"/>
    </g>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="230" y="251" fill="#bbbbbb">0</text><text x="262" y="251" fill="#a67c2e">1</text><text x="294" y="251" fill="#a67c2e">1</text>
    <text x="326" y="251" fill="#bbbbbb">0</text><text x="358" y="251" fill="#bbbbbb">0</text>
    <text x="390" y="251" fill="#bbbbbb">0</text><text x="422" y="251" fill="#bbbbbb">0</text>
  </g>

  <!-- 右侧注释 -->
  <text x="450" y="162" font-size="11" fill="#446688">← 值集 {1,2,3}</text>
  <text x="450" y="202" font-size="11" fill="#4a7a3a">← 值集 {2,3,4}</text>
  <text x="450" y="250" font-size="11.5" font-weight="bold" fill="#a67c2e">← 公共值 {2,3}</text>

  <!-- 判定框 -->
  <g filter="url(#sk)">
    <rect x="150" y="286" width="340" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">popcount(a &amp; b) = 2 ≥ k = 2</text>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" fill="#a67c2e">→ 节点 i、j 之间连一条边</text>

  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#888">每个公共值恰好点亮一位 → popcount 正是 intersect</text>
  <text x="320" y="383" text-anchor="middle" font-size="11" fill="#888">重复值只置一次位，天然去重；两两判定只需 C(100,2) ≈ 5000 次字级操作</text>
</svg>
