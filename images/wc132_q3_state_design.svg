<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">状态设计：dp[i][d] = 以 i 结尾、公差 d 的最长长度</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">公差由前后两项确定，值域小所以可以开数组</text>
  <rect x="60.0" y="96.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="117.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[0][0]</text>
  <rect x="60.0" y="136.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="157.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[1][0]</text>
  <rect x="60.0" y="176.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="197.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[2][0]</text>
  <rect x="60.0" y="216.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95.0" y="237.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[3][0]</text>
  <rect x="134.0" y="96.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="117.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[0][1]</text>
  <rect x="134.0" y="136.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="157.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[1][1]</text>
  <rect x="134.0" y="176.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="197.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[2][1]</text>
  <rect x="134.0" y="216.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="169.0" y="237.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[3][1]</text>
  <rect x="208.0" y="96.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="243.0" y="117.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[0][2]</text>
  <rect x="208.0" y="136.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="243.0" y="157.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[1][2]</text>
  <rect x="208.0" y="176.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="243.0" y="197.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[2][2]</text>
  <rect x="208.0" y="216.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="243.0" y="237.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[3][2]</text>
  <rect x="282.0" y="96.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="117.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[0][3]</text>
  <rect x="282.0" y="136.0" width="70.0" height="36.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="157.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[1][3]</text>
  <rect x="282.0" y="176.0" width="70.0" height="36.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="197.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[2][3]</text>
  <rect x="282.0" y="216.0" width="70.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="237.1" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp[3][3]</text>
  <text x="208.0" y="84.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">公差维度 d</text>
  <text x="34.0" y="176.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">i</text>
  <rect x="370.0" y="90.0" width="190.0" height="60.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="465.0" y="116.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">nums[i] - nums[j] = d</text>
  <text x="465.0" y="130.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">⇒ dp[i][d] = dp[j][d] + 1</text>
  <path d="M 366.0 120.0 L 300.0 150.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="40.0" y="262.0" width="500.0" height="52.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="284.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">同一 (i, d) 可能由多个 j 转移（nums 有重复值）</text>
  <text x="290.0" y="298.8" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">必须取 max，而不是直接覆盖</text>
</svg>
