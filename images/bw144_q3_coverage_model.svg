<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">每次查询对区间内每个位置"最多减 1" ⇒ 逐点覆盖次数必须够</text>

  <!-- 位置刻度 -->
  <g font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="66">0</text>
    <text x="230" y="66">1</text>
    <text x="330" y="66">2</text>
    <text x="430" y="66">3</text>
  </g>
  <g font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="86">nums = 1</text>
    <text x="230" y="86">nums = 1</text>
    <text x="330" y="86">nums = 1</text>
    <text x="430" y="86">nums = 1</text>
  </g>

  <!-- 查询区间条 -->
  <g filter="url(#rough2)">
    <rect x="86" y="106" width="90" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="286" y="106" width="190" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="40" y="124" font-size="11" fill="#446688" filter="url(#rough2)">查询</text>
  <text x="131" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="381" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[0,2]</text>

  <g filter="url(#rough2)">
    <rect x="286" y="142" width="190" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="286" y="178" width="90" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="381" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="331" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1,2]</text>

  <path d="M 30 222 L 530 222" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 两个判据 -->
  <rect x="40" y="236" width="230" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">必要性：覆盖次数 ≥ nums[i]</text>
  <text x="155" y="277" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每次最多减 1，少一次都减不到 0</text>

  <rect x="290" y="236" width="230" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">充分性：各位置独立决定减不减</text>
  <text x="405" y="277" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">多出来的查询在该位置"放空"即可</text>

  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⇒ 问题变成：用最少的区间覆盖逐点需求量</text>
</svg>
