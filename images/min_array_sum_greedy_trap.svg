<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 395"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="395" fill="#fafafa"/>

  <text x="270" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">贪心翻车现场：先花哪张券都不对</text>

  <!-- ===== Panel 1: strategy A ===== -->
  <text x="40" y="76" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">策略 A：先把 ① 全花在最大元素上 —— nums=[4,2], k=3, op1=op2=1</text>

  <!-- greedy row -->
  <rect x="45" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="79" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="94" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 118 103 L 165 103" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="142" y="92" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① 砍 4</text>
  <rect x="175" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="209" y="90" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="224" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 248 103 L 295 103" stroke="#999" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="272" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">② ✗ 都&lt;3</text>
  <rect x="305" y="90" width="30" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="339" y="90" width="30" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="354" y="108" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="385" y="90" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">和 = 4 ✗</text>

  <!-- optimal row -->
  <rect x="45" y="132" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="79" y="132" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="94" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 118 145 L 165 145" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="142" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">② 扣 4</text>
  <rect x="175" y="132" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="209" y="132" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <text x="224" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">2</text>
  <path d="M 248 145 L 295 145" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">① 砍 2</text>
  <rect x="305" y="132" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="339" y="132" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <text x="354" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <rect x="385" y="132" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">和 = 2 ✓</text>

  <!-- ===== Panel 2: strategy B ===== -->
  <text x="40" y="192" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">策略 B：先把 ② 花在 ≥k 的最大元素上 —— nums=[10,6], k=3, op1=op2=1</text>

  <!-- greedy row -->
  <rect x="45" y="206" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="79" y="206" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">10</text>
  <text x="94" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <path d="M 118 219 L 165 219" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="142" y="208" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">② 扣 10</text>
  <rect x="175" y="206" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="209" y="206" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="224" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <path d="M 248 219 L 295 219" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="208" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">① 砍 7</text>
  <rect x="305" y="206" width="30" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="339" y="206" width="30" height="26" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="354" y="224" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">6</text>
  <rect x="385" y="206" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">和 = 10 ✗</text>

  <!-- optimal row -->
  <rect x="45" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="79" y="248" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">10</text>
  <text x="94" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <path d="M 118 261 L 165 261" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="142" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">① 砍 10</text>
  <rect x="175" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="209" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">5</text>
  <text x="224" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">6</text>
  <path d="M 248 261 L 295 261" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">② 扣 6</text>
  <rect x="305" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="339" y="248" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">5</text>
  <text x="354" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">3</text>
  <rect x="385" y="248" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">和 = 8 ✓</text>

  <!-- bottom note -->
  <rect x="20" y="296" width="500" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">① 会把元素砍到门槛 k 之下（或恰好留在门槛之上），② 的可行集随之改写；</text>
  <text x="270" y="340" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">② 又改写 ① 的收益基数——可行性与收益互相纠缠，不存在安全的局部决策</text>
  <text x="270" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">⇒ 把「已用预算」记进状态，上 DP</text>
</svg>
