<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：左移抬高整个位段，全部次数集中给一个元素</text>

  <!-- 位标尺 -->
  <g filter="url(#rough2)" font-size="10" fill="#999">
    <text x="98" y="56" text-anchor="middle">4</text>
    <text x="138" y="56" text-anchor="middle">3</text>
    <text x="178" y="56" text-anchor="middle">2</text>
    <text x="218" y="56" text-anchor="middle">1</text>
    <text x="258" y="56" text-anchor="middle">0</text>
  </g>

  <!-- 12 | 9 = 13 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="26" y="82" fill="#555">12 | 9</text>
    <rect x="80" y="64" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="98" y="82" text-anchor="middle" fill="#999">0</text>
    <rect x="120" y="64" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="138" y="82" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="160" y="64" width="36" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="178" y="82" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="200" y="64" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="218" y="82" text-anchor="middle" fill="#999">0</text>
    <rect x="240" y="64" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="258" y="82" text-anchor="middle" fill="#7a5a10">1</text>
    <text x="292" y="82" fill="#555">= 13（不动手）</text>
  </g>

  <!-- 24 | 9 = 25 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="26" y="132" fill="#555">k 给 12</text>
    <rect x="80" y="114" width="36" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="98" y="132" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="120" y="114" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="138" y="132" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="160" y="114" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="178" y="132" text-anchor="middle" fill="#999">0</text>
    <rect x="200" y="114" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="218" y="132" text-anchor="middle" fill="#999">0</text>
    <rect x="240" y="114" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="258" y="132" text-anchor="middle" fill="#7a5a10">1</text>
    <text x="292" y="132" fill="#555">= 24 | 9 = 25</text>
  </g>

  <!-- 12 | 18 = 30 -->
  <g filter="url(#rough2)" font-size="13">
    <text x="26" y="182" fill="#7a5a10">k 给 9 ★</text>
    <rect x="80" y="164" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="98" y="182" text-anchor="middle" fill="#7a5a10">1</text>
    <rect x="120" y="164" width="36" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="138" y="182" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="160" y="164" width="36" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="178" y="182" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="200" y="164" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="218" y="182" text-anchor="middle" fill="#7a5a10">1</text>
    <rect x="240" y="164" width="36" height="26" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="258" y="182" text-anchor="middle" fill="#999">0</text>
    <text x="292" y="182" fill="#7a5a10">= 12 | 18 = 30 ✓</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="80" y="202" width="13" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <text x="98" y="212" fill="#555">12 的位</text>
    <rect x="150" y="202" width="13" height="12" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="168" y="212" fill="#555">9 的位（左移后仍归属 9）</text>
    <rect x="258" y="202" width="13" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="276" y="212" fill="#555">重叠位</text>
    <rect x="330" y="202" width="13" height="12" rx="2" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="348" y="212" fill="#555">0 位</text>
  </g>

  <!-- 论证框 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="232" width="440" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="56" y="254" fill="#7a5a10">两步论证（详见正文证明）：</text>
    <text x="56" y="274" fill="#7a5a10">① 若 ≥ 2 个元素被移位：把全部次数集中给“贡献最高位”的那个元素，</text>
    <text x="56" y="292" fill="#7a5a10">   新最高位 = top(z)+K 更高，数值严格变大 → 存在单元素最优方案；</text>
    <text x="56" y="312" fill="#7a5a10">② 若单元素只移 m 小于 k 次：要么全场 top 最大的元素吃满 k 次位更高，</text>
    <text x="56" y="330" fill="#7a5a10">   要么给它补满 k 次位更高 → 最优必是“单元素恰吃满 k 次”。</text>
    <text x="56" y="350" fill="#a08030">   于是枚举 n 个候选取最大，O(n) 一趟完成；k 次也可以少用，但最优值必在其中。</text>
  </g>
</svg>
