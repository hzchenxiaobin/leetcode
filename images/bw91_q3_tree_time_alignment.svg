<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">时间对齐：Alice 的到达时刻 vs Bob 的到达时刻</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">Alice 到某点的时刻 = 该点深度；Bob 只在 bob→0 的路径上出现</text>

  <g filter="url(#rough2)">
    <ellipse cx="200" cy="96" rx="30" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <ellipse cx="200" cy="176" rx="30" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="120" cy="256" rx="30" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <ellipse cx="280" cy="256" rx="30" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <ellipse cx="360" cy="336" rx="30" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <line x1="200" y1="120" x2="200" y2="152" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="200" x2="134" y2="236" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="200" x2="266" y2="236" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="280" y1="280" x2="342" y2="316" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="200" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="200" y="106" text-anchor="middle" font-size="9.5" fill="#446688">−2</text>
  <text x="200" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="200" y="186" text-anchor="middle" font-size="9.5" fill="#d6a040">+4</text>
  <text x="120" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="120" y="266" text-anchor="middle" font-size="9.5" fill="#4a7a3a">+2</text>
  <text x="280" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="280" y="266" text-anchor="middle" font-size="9.5" fill="#b85450">−4</text>
  <text x="360" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="360" y="346" text-anchor="middle" font-size="9.5" fill="#4a7a3a">+6</text>

  <path d="M 276 262 C 230 220, 226 200, 222 190" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 194 184 C 186 160, 190 130, 196 122" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="216" font-size="10" fill="#b85450" font-weight="bold">Bob：3→1→0</text>
  <text x="284" y="278" font-size="9.5" fill="#b85450">t=0</text>
  <text x="222" y="196" font-size="9.5" fill="#b85450">t=1</text>
  <text x="224" y="132" font-size="9.5" fill="#b85450">t=2</text>

  <text x="166" y="90" font-size="9.5" fill="#446688">Alice t=0</text>
  <text x="166" y="174" font-size="9.5" fill="#446688">Alice t=1</text>
  <text x="72" y="254" font-size="9.5" fill="#4a7a3a">Alice t=2</text>
  <text x="316" y="254" font-size="9.5" fill="#b85450">Alice t=2</text>
  <text x="398" y="334" font-size="9.5" fill="#4a7a3a">Alice t=3</text>

  <rect x="420" y="70" width="116" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="478" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">depth &lt; bobTime</text>
  <text x="478" y="106" text-anchor="middle" font-size="10" fill="#555">Alice 先到 → 全分</text>

  <rect x="420" y="132" width="116" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="478" y="152" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">depth = bobTime</text>
  <text x="478" y="168" text-anchor="middle" font-size="10" fill="#555">同时到 → 平分 c/2</text>

  <rect x="420" y="194" width="116" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="478" y="214" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">depth &gt; bobTime</text>
  <text x="478" y="230" text-anchor="middle" font-size="10" fill="#555">Bob 已开 → 0 分</text>

  <rect x="420" y="256" width="116" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="478" y="276" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">不在 Bob 路径</text>
  <text x="478" y="292" text-anchor="middle" font-size="10" fill="#555">bobTime = ∞ → 全分</text>

  <text x="200" y="372" text-anchor="middle" font-size="10" fill="#999">节点颜色 = Alice 最终在该点的得分档位：全分(绿) / 半分(橙) / 零分(红)</text>
  <text x="200" y="388" text-anchor="middle" font-size="10" fill="#999">例：节点 1 双方都在 t=1 到达 → 各得 4/2 = 2 分</text>
</svg>
