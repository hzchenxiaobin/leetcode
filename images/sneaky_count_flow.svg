<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一遍扫描，边数边收</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="230" cy="64" rx="44" ry="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="230" y="69" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始</text>
  <path d="M 230 80 L 230 94" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取元素 -->
  <g filter="url(#sk)"><rect x="150" y="98" width="160" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="117" text-anchor="middle" font-size="12" fill="#2b6e9e">取出下一元素 v</text>
  <path d="M 230 128 L 230 142" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 计数 -->
  <g filter="url(#sk)"><rect x="150" y="144" width="160" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="163" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">cnt[v] 自增 1</text>
  <path d="M 230 174 L 230 188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 -->
  <g filter="url(#sk)"><path d="M 230 190 L 316 218 L 230 246 L 144 218 Z" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="230" y="223" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">cnt[v] == 2 ?</text>

  <text x="244" y="262" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <path d="M 230 246 L 230 262" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 收集 -->
  <g filter="url(#sk)"><rect x="150" y="266" width="160" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="230" y="285" text-anchor="middle" font-size="12" fill="#2e6e2e">收集 v 进 ans</text>

  <!-- 否 → 回到取元素 -->
  <path d="M 316 218 L 420 218 L 420 107 L 316 107" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="210" font-size="12" fill="#b03a3a" font-weight="bold">否</text>

  <!-- 收集后 → 回到取元素 -->
  <path d="M 230 296 L 230 316 L 500 316 L 500 119 L 316 119" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="508" y="212" font-size="11" fill="#888">继续扫描</text>

  <!-- 元素取尽 → 返回 -->
  <path d="M 150 113 L 70 113 L 70 350 L 100 350" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="232" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 56 232)">元素取尽</text>

  <g filter="url(#sk)"><ellipse cx="162" cy="350" rx="56" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="162" y="355" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 ans</text>

  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#888">「计数到 2 的瞬间」即捣蛋鬼第二次露面 —— 无需第二遍扫描</text>
</svg>
