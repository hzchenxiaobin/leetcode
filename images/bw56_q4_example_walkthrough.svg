<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：三种时间预算，两条途径的胜负互换</text>

  <!-- 城市图 -->
  <g filter="url(#rough2)">
    <circle cx="90" cy="180" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="230" cy="110" r="24" fill="#fff" stroke="#bbb" stroke-width="1.6"/>
    <circle cx="360" cy="110" r="24" fill="#fff" stroke="#bbb" stroke-width="1.6"/>
    <circle cx="230" cy="260" r="24" fill="#fff" stroke="#bbb" stroke-width="1.6"/>
    <circle cx="360" cy="260" r="24" fill="#fff" stroke="#bbb" stroke-width="1.6"/>
    <circle cx="490" cy="180" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="185">0</text><text x="230" y="115">1</text><text x="360" y="115">2</text>
    <text x="230" y="265">3</text><text x="360" y="265">4</text><text x="490" y="185">5</text>
  </g>
  <text x="90" y="220" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">起点 fee 5</text>
  <text x="490" y="222" text-anchor="middle" font-size="10" fill="#2f5226" font-weight="bold" filter="url(#rough2)">终点 fee 3</text>

  <!-- 路径 A：0-1-2-5 -->
  <path d="M 108 168 L 212 116" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 252 106 L 338 106" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 378 122 L 474 168" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="150" y="126" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">10 min</text>
  <text x="295" y="98" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">10 min</text>
  <text x="434" y="136" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">10 min</text>

  <!-- 路径 B：0-3-4-5 -->
  <path d="M 108 192 L 212 256" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 252 266 L 338 266" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 378 246 L 472 198" stroke="#446688" stroke-width="2.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="248" font-size="10.5" fill="#446688" filter="url(#rough2)">1 min</text>
  <text x="295" y="288" font-size="10.5" fill="#446688" filter="url(#rough2)">10 min</text>
  <text x="434" y="244" font-size="10.5" fill="#446688" filter="url(#rough2)">15 min</text>

  <!-- 路径说明框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="300" width="245" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="152" y="318" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">途径 A：0→1→2→5　时间 30，费用 11</text>
  <text x="152" y="336" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">便宜但慢：5+1+2+3</text>
  <g filter="url(#rough2)">
    <rect x="290" y="300" width="245" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="412" y="318" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">途径 B：0→3→4→5　时间 26，费用 48</text>
  <text x="412" y="336" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">快但贵：5+20+20+3</text>

  <!-- 三种预算结论 -->
  <g filter="url(#rough2)">
    <rect x="30" y="356" width="505" height="52" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="10"/>
  </g>
  <text x="282" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">maxTime = 30：A、B 都可行，min(11, 48) = 11　｜　maxTime = 29：A 超时，取 B = 48</text>
  <text x="282" y="398" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">maxTime = 25：A(30)、B(26) 均超时 → dp 全 ∞ → 返回 −1</text>
</svg>
