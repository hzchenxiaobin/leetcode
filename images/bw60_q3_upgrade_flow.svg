<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="56"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">upgrade(num, user) 的三个条件（全部满足才成功）</text>

  <!-- 条件框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="160" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="200" y="56" width="160" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <rect x="370" y="56" width="160" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="110" y="82" fill="#33506e" font-weight="bold">条件 1</text>
    <text x="110" y="102" fill="#33506e">节点 num</text>
    <text x="110" y="120" fill="#33506e">当前未上锁</text>
    <text x="280" y="82" fill="#7a5c1e" font-weight="bold">条件 2</text>
    <text x="280" y="102" fill="#7a5c1e">没有任何上锁的</text>
    <text x="280" y="120" fill="#7a5c1e">祖先节点</text>
    <text x="450" y="82" fill="#8a3a34" font-weight="bold">条件 3</text>
    <text x="450" y="102" fill="#8a3a34">子树中至少有一个</text>
    <text x="450" y="120" fill="#8a3a34">上锁的子孙（任意用户）</text>
  </g>

  <!-- 树例：upgrade(0, 1) 官方示例 -->
  <text x="180" y="170" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">官方示例：lock(4,5) 后 upgrade(0,1)</text>
  <g filter="url(#rough2)">
    <circle cx="180" cy="210" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="100" cy="286" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="260" cy="286" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="60" cy="362" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="140" cy="362" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="220" cy="362" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="300" cy="362" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="163" y1="226" x2="118" y2="270" stroke="#446688" stroke-width="2"/>
    <line x1="197" y1="226" x2="242" y2="270" stroke="#446688" stroke-width="2"/>
    <line x1="85" y1="303" x2="68" y2="342" stroke="#446688" stroke-width="2"/>
    <line x1="115" y1="303" x2="132" y2="342" stroke="#446688" stroke-width="2"/>
    <line x1="242" y1="303" x2="226" y2="342" stroke="#446688" stroke-width="2"/>
    <line x1="278" y1="303" x2="294" y2="342" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="180" y="215" font-weight="bold" fill="#2d5a22">0</text>
    <text x="100" y="291">1</text><text x="260" y="291">2</text>
    <text x="60" y="367">3</text><text x="140" y="367" fill="#8a3a34" font-weight="bold">4</text>
    <text x="220" y="367">5</text><text x="300" y="367">6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="118" y="326" width="44" height="15" fill="#b85450" rx="7"/>
  </g>
  <text x="140" y="338" font-size="10" fill="#fff" text-anchor="middle" filter="url(#rough2)">user5</text>
  <!-- 升级结果标记 -->
  <g filter="url(#rough2)">
    <rect x="158" y="180" width="44" height="16" fill="#2d5a22" rx="7"/>
  </g>
  <text x="180" y="192" font-size="10" fill="#fff" text-anchor="middle" filter="url(#rough2)">user1 ✓</text>

  <!-- 条件核对（右侧） -->
  <text x="430" y="200" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">条件核对</text>
  <g filter="url(#rough2)">
    <rect x="340" y="212" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="340" y="248" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <rect x="340" y="284" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#2d5a22" text-anchor="middle">
    <text x="435" y="232">① 节点 0 未上锁 ✓</text>
    <text x="435" y="268">② 0 是根，无祖先 ✓</text>
    <text x="435" y="304">③ 子孙 4 被 user5 锁 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="340" y="322" width="190" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#7a5c1e" text-anchor="middle">
    <text x="435" y="342" font-weight="bold">成功执行两步：</text>
    <text x="435" y="360">节点 0 由 user1 上锁</text>
    <text x="435" y="378">子孙 4 解锁（清为 −1）</text>
  </g>

  <rect x="30" y="398" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="419" font-size="11.5" fill="#8a3a34" text-anchor="middle" filter="url(#rough2)">易错：解锁子孙时不区分用户——「任意用户上锁的子孙」全部清掉</text>
</svg>
