<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例演算：s = "cabbac" 一遍扫描走查</text>
  <path d="M 175 38 Q 330 46 485 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- string strip -->
  <g filter="url(#r)">
    <rect x="40" y="54" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="84" y="54" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="128" y="54" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="172" y="54" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="216" y="54" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="260" y="54" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="14" text-anchor="middle">
    <text x="62" y="76" font-weight="bold" fill="#2b4a6e">c</text>
    <text x="106" y="76" fill="#2e6e2e">a</text>
    <text x="150" y="76" fill="#2e6e2e">b</text>
    <text x="194" y="76" fill="#2e6e2e">b</text>
    <text x="238" y="76" fill="#2e6e2e">a</text>
    <text x="282" y="76" font-weight="bold" fill="#2b4a6e">c</text>
  </g>
  <g filter="url(#r)" font-size="9" fill="#999" text-anchor="middle">
    <text x="62" y="96">0</text><text x="106" y="96">1</text><text x="150" y="96">2</text>
    <text x="194" y="96">3</text><text x="238" y="96">4</text><text x="282" y="96">5</text>
  </g>

  <!-- best pair annotation -->
  <g filter="url(#r)">
    <rect x="330" y="54" width="290" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="475" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最优 = 'c' 的首末对 (0, 5)</text>
  <text x="475" y="90" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">中间 "abba"，长度 5 − 0 − 1 = 4</text>

  <!-- walkthrough table -->
  <g filter="url(#r)">
    <rect x="40" y="118" width="580" height="260" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.4"/>
    <rect x="40" y="118" width="580" height="30" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g filter="url(#r)" font-size="12.5" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="70" y="138">i</text>
    <text x="122" y="138">s[i]</text>
    <text x="237" y="138">first[c]（扫描前）</text>
    <text x="415" y="138">动作</text>
    <text x="560" y="138">ans</text>
  </g>
  <g filter="url(#r)" stroke="#c8d2dc" stroke-width="1">
    <line x1="100" y1="148" x2="100" y2="378"/>
    <line x1="145" y1="148" x2="145" y2="378"/>
    <line x1="330" y1="148" x2="330" y2="378"/>
    <line x1="500" y1="148" x2="500" y2="378"/>
    <line x1="40" y1="186" x2="620" y2="186"/>
    <line x1="40" y1="225" x2="620" y2="225"/>
    <line x1="40" y1="263" x2="620" y2="263"/>
    <line x1="40" y1="301" x2="620" y2="301"/>
    <line x1="40" y1="340" x2="620" y2="340"/>
  </g>
  <g filter="url(#r)">
    <rect x="41" y="340" width="578" height="37" fill="#e6f4ea" opacity="0.6"/>
  </g>

  <g filter="url(#r)" font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="169" font-weight="bold">0</text>
    <text x="122" y="169" font-weight="bold">c</text>
    <text x="237" y="169" fill="#999">−1</text>
    <text x="415" y="169">first[c] ← 0（首次，只记录）</text>
    <text x="560" y="169" fill="#999">−1</text>

    <text x="70" y="207" font-weight="bold">1</text>
    <text x="122" y="207" font-weight="bold">a</text>
    <text x="237" y="207" fill="#999">−1</text>
    <text x="415" y="207">first[a] ← 1（首次，只记录）</text>
    <text x="560" y="207" fill="#999">−1</text>

    <text x="70" y="246" font-weight="bold">2</text>
    <text x="122" y="246" font-weight="bold">b</text>
    <text x="237" y="246" fill="#999">−1</text>
    <text x="415" y="246">first[b] ← 2（首次，只记录）</text>
    <text x="560" y="246" fill="#999">−1</text>

    <text x="70" y="284" font-weight="bold">3</text>
    <text x="122" y="284" font-weight="bold">b</text>
    <text x="237" y="284" font-weight="bold" fill="#2b4a6e">2</text>
    <text x="415" y="284">ans ← max(−1, 3−2−1) = 0</text>
    <text x="560" y="284" font-weight="bold">0</text>

    <text x="70" y="322" font-weight="bold">4</text>
    <text x="122" y="322" font-weight="bold">a</text>
    <text x="237" y="322" font-weight="bold" fill="#2b4a6e">1</text>
    <text x="415" y="322">ans ← max(0, 4−1−1) = 2</text>
    <text x="560" y="322" font-weight="bold">2</text>

    <text x="70" y="361" font-weight="bold">5</text>
    <text x="122" y="361" font-weight="bold">c</text>
    <text x="237" y="361" font-weight="bold" fill="#2b4a6e">0</text>
    <text x="415" y="361">ans ← max(2, 5−0−1) = 4</text>
    <text x="560" y="361" font-size="13" font-weight="bold" fill="#2e6e2e">4 ✓</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="392" width="580" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="330" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">边界速记："aa" → 0（空子串也算）；"cbzxy" → −1（无字符出现两次）；n = 1 → −1</text>
</svg>
