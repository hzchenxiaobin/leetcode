<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">核心观察：模 3 权值不变量</text>

  <text x="44" y="64" font-size="14" fill="#446688" filter="url(#rough2)">① 权值映射 φ</text>
  <rect x="44" y="76" width="58" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="101" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <path d="M108,95 L146,95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="127" y="88" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">φ</text>
  <rect x="152" y="76" width="62" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="101" text-anchor="middle" font-size="18" fill="#3c6130" filter="url(#rough2)">1</text>

  <rect x="44" y="132" width="58" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="157" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">1</text>
  <path d="M108,151 L146,151" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="127" y="144" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">φ</text>
  <rect x="152" y="132" width="62" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="157" text-anchor="middle" font-size="18" fill="#3c6130" filter="url(#rough2)">2</text>

  <text x="44" y="196" font-size="12" fill="#666" filter="url(#rough2)">S(t) = Σ φ(t_i)  (mod 3)</text>

  <text x="330" y="64" font-size="14" fill="#d6a040" filter="url(#rough2)">② 两种合并都保持 S</text>
  <rect x="330" y="76" width="92" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="100" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">00 → 1</text>
  <text x="434" y="99" font-size="12" fill="#444" filter="url(#rough2)">2 × 1 = 2 = φ(1) ✓</text>

  <rect x="330" y="130" width="92" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="154" text-anchor="middle" font-size="15" fill="#8a6420" filter="url(#rough2)">11 → 0</text>
  <text x="434" y="153" font-size="12" fill="#444" filter="url(#rough2)">2 × 2 = 4 ≡ 1 = φ(0) ✓</text>

  <text x="330" y="196" font-size="12" fill="#666" filter="url(#rough2)">长度 1 的 S 只能是 1 或 2，绝不是 0</text>

  <text x="44" y="222" font-size="14" fill="#446688" filter="url(#rough2)">③ 乘 2 在 Z/3 上交换 1 和 2</text>
  <circle cx="150" cy="296" r="50" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="250" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <circle cx="194" cy="320" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="326" text-anchor="middle" font-size="15" fill="#3c6130" filter="url(#rough2)">1</text>
  <circle cx="106" cy="320" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="326" text-anchor="middle" font-size="15" fill="#8f3b38" filter="url(#rough2)">2</text>
  <path d="M180,306 C160,288 140,288 120,306" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M120,334 C140,352 160,352 180,334" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="234" y="282" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×2</text>

  <rect x="318" y="212" width="322" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="479" y="240" text-anchor="middle" font-size="14" fill="#2f5228" filter="url(#rough2)">判定：t 美丽 ⟺ S(t) ≢ 0 (mod 3)</text>
  <text x="479" y="266" text-anchor="middle" font-size="14" fill="#2f5228" filter="url(#rough2)">且（|t| = 1 或 t 不是交替串）</text>
  <text x="479" y="296" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">交替串一步都动不了，是唯一要单独扣掉的族</text>

  <rect x="40" y="352" width="182" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="131" y="379" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">0001 → 011 → 00 → 1 ✓</text>
  <rect x="242" y="352" width="182" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="333" y="379" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">010 交替卡死，S = 4 ≡ 1 ✗</text>
  <rect x="444" y="352" width="182" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="379" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">111 的 S = 3 ≡ 0 ✗</text>
</svg>
