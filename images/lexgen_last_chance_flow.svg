<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">扫描流程：一路 'a'，只在「最后机会」抬升</text>

  <!-- 开始 -->
  <rect x="150" y="46" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">q 从左到右扫过每个自由位</text>
  <path d="M280,80 L280,98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,100 400,138 280,176 160,138" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">存在 F 窗口满足</text>
  <text x="280" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">mism=0 且 rfree=q？</text>
  <text x="415" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是（有待打破窗口在 q 截止）</text>
  <path d="M280,176 L280,206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 否分支：填 a -->
  <path d="M400,138 L440,138" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="444" y="120" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">w[q] ← 'a'</text>
  <text x="496" y="151" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mism 一律不变</text>
  <path d="M496,156 L496,330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 是分支：禁字母集 -->
  <rect x="130" y="208" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">禁字母集 B = {'a'} ∪ {critical 窗口在 q 的偏移}</text>
  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">critical = 唯一失配恰为 q 处基线、且 q 已是其最后机会</text>
  <path d="M280,248 L280,262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 抬升 -->
  <rect x="130" y="264" width="300" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">c ← 最小的 ∉ B 的字母（26 个全禁 → ""）</text>
  <text x="280" y="292" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">实践中 c 几乎总是 'b'</text>
  <path d="M280,298 L280,310" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 更新 -->
  <rect x="100" y="312" width="360" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">w[q] ← c，更新覆盖 q 的窗口 mism</text>
  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">先撤销 q 处基线项，再记入已决项（O(m)）</text>
  <path d="M280,348 L280,362" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 汇合：下一步 / 结束 -->
  <rect x="170" y="364" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">下一个自由位（回到顶部）</text>
  <path d="M170,379 L60,379 L60,63 L146,63" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6,4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="410" y="364" width="138" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">扫完 → 输出 w</text>
  <path d="M390,379 L406,379" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">决定 'a' 不改变任何 mism；只有抬升位需要 O(m) 的批量更新</text>
</svg>
