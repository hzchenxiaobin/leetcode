<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">美丽分割：分割结构 + 两个判定条件</text>
  <path d="M 300 44 Q 480 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 顶部：数组与分割 ===== -->
  <text x="94" y="112" font-size="12" fill="#888" filter="url(#sk)">nums =</text>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="84" width="60" height="44" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="180" y="112" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="210" y="84" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="240" y="112" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="270" y="84" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="300" y="112" fill="#9a6a1a" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="330" y="84" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="360" y="112" fill="#2e6e2e" filter="url(#sk)">1</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="180" y="76" fill="#446688" filter="url(#sk)">nums1</text>
    <text x="270" y="76" fill="#d6a040" filter="url(#sk)">nums2</text>
    <text x="360" y="76" fill="#4a7a3a" filter="url(#sk)">nums3</text>
  </g>
  <path d="M 210 78 L 210 134" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 330 78 L 330 134" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="210" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">i</text>
  <text x="330" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#sk)">j</text>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="180" y="168" filter="url(#sk)">长 i</text>
    <text x="270" y="168" filter="url(#sk)">长 j−i</text>
    <text x="360" y="168" filter="url(#sk)">长 n−j</text>
  </g>
  <text x="240" y="192" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">上图：切点 i=1、j=3 的分割（nums1=[1]，nums2=[1,2]，nums3=[1]）</text>

  <!-- 右侧说明框 -->
  <g filter="url(#sk)"><rect x="470" y="64" width="450" height="112" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="492" y="92" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">分割 = 一对切点 (i, j)，1 ≤ i &lt; j ≤ n−1</text>
  <text x="492" y="114" font-size="11.5" fill="#444" filter="url(#sk)">n = 5000 时共 C(4999,2) ≈ 1250 万种——枚举得起，</text>
  <text x="492" y="134" font-size="11.5" fill="#444" filter="url(#sk)">怕的是每次判定 O(n) ⇒ 先花 O(n²) 把判定做成 O(1)</text>
  <text x="492" y="158" font-size="11.5" font-weight="bold" fill="#9a6a1a" filter="url(#sk)">本例 n=4，候选仅 (1,2)、(1,3)、(2,3)</text>

  <!-- ===== 条件 A ===== -->
  <g filter="url(#sk)"><rect x="40" y="210" width="440" height="240" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/></g>
  <text x="60" y="240" font-size="14" font-weight="bold" fill="#2b5a88" filter="url(#sk)">条件 A：nums1 是 nums2 的前缀</text>
  <g font-size="10" font-weight="bold" text-anchor="middle">
    <text x="92" y="264" fill="#446688" filter="url(#sk)">nums1</text>
    <text x="216" y="264" fill="#d6a040" filter="url(#sk)">nums2</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="70" y="272" width="44" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
    <text x="92" y="295" fill="#2b5a88" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="170" y="272" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="192" y="295" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="214" y="272" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="236" y="295" fill="#9a6a1a" filter="url(#sk)">2</text>
  </g>
  <path d="M 118 289 L 164 289" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="141" y="280" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">对齐开头</text>
  <text x="282" y="280" font-size="10.5" fill="#888" filter="url(#sk)">只要前 i 位逐位相同，</text>
  <text x="282" y="297" font-size="10.5" fill="#888" filter="url(#sk)">nums2 后面长成怎样都行</text>
  <text x="60" y="344" font-size="12" fill="#444" filter="url(#sk)">内容：nums[0..i) = nums[i..2i)  ⟺  lcp[0][i] ≥ i</text>
  <text x="60" y="368" font-size="12" fill="#444" filter="url(#sk)">长度：nums2 装得下 nums1  ⟺  j ≥ 2i</text>
  <text x="60" y="400" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">⚠ 这里的长度必须显式判：lcp[0][i] ≤ n−i，封不住 j−i</text>
  <path d="M 60 410 Q 250 416 462 410" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="4 3" filter="url(#sk)" opacity="0.6"/>

  <!-- ===== 条件 B ===== -->
  <g filter="url(#sk)"><rect x="480" y="210" width="440" height="240" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="500" y="240" font-size="14" font-weight="bold" fill="#9a6a1a" filter="url(#sk)">条件 B：nums2 是 nums3 的前缀</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="500" y="256" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="522" y="279" fill="#9a6a1a" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="544" y="256" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/></g>
    <text x="566" y="279" fill="#9a6a1a" filter="url(#sk)">2</text>
  </g>
  <text x="600" y="277" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#sk)">nums2</text>
  <path d="M 522 292 L 522 322" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 566 292 L 566 316" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="506" y="314" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="580" y="310" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="500" y="326" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/></g>
    <text x="522" y="349" fill="#2e6e2e" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="544" y="326" width="44" height="34" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" rx="4"/></g>
    <text x="566" y="349" fill="#b85450" filter="url(#sk)">∅</text>
  </g>
  <g font-size="10" font-weight="bold" text-anchor="middle">
    <text x="522" y="378" fill="#4a7a3a" filter="url(#sk)">nums3</text>
  </g>
  <text x="632" y="300" font-size="10.5" fill="#888" filter="url(#sk)">第二位「2」落了空：</text>
  <text x="632" y="318" font-size="10.5" fill="#888" filter="url(#sk)">匹配到第 1 位就断，lcp 自己就到不了 2</text>
  <text x="500" y="398" font-size="12" fill="#444" filter="url(#sk)">只需 lcp[i][j] ≥ j−i —— 内容、长度一次搞定</text>
  <text x="500" y="420" font-size="12" fill="#444" filter="url(#sk)">因为 lcp[i][j] ≤ n−j（后缀 j 的长度封顶）</text>
  <text x="500" y="442" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓ ≥ j−i 已蕴含 j−i ≤ n−j，长度免检</text>
</svg>
