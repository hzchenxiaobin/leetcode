<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#fdfcf7"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：反复用质因数之和替换，直到 s == n</text>
  <path d="M 240 42 Q 490 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- main flow -->
  <g filter="url(#sk)">
    <rect x="140" y="58" width="180" height="44" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="230" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">开始：读入 n</text>

  <path d="M 230 102 L 230 132" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="136" width="260" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="230" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">s ← f(n)（质因数之和）</text>
  <text x="230" y="182" text-anchor="middle" font-size="11" fill="#7a94ad" filter="url(#sk)">试除法求 f：见右侧子程序</text>

  <path d="M 230 196 L 230 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="230,228 348,288 230,348 112,288" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="230" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">s == n ?</text>

  <path d="M 348 288 L 404 288" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="374" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="412" y="256" width="176" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="500" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">返回 n ⭐</text>
  <text x="500" y="306" text-anchor="middle" font-size="11" fill="#5a8a5a" filter="url(#sk)">不动点：质数 或 4</text>

  <path d="M 230 348 L 230 388" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="246" y="374" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="100" y="392" width="260" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="230" y="423" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">n ← s（替换后继续）</text>

  <path d="M 100 418 L 40 418 L 40 166 L 92 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="60" y="298" font-size="11" fill="#888" filter="url(#sk)">下一轮</text>

  <!-- subroutine: trial division -->
  <g filter="url(#sk)">
    <rect x="610" y="76" width="344" height="352" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="628" y="102" font-size="13" font-weight="bold" fill="#555" filter="url(#sk)">子程序：试除法求 f(x)</text>
  <text x="628" y="134" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">s ← 0，d ← 2</text>
  <text x="628" y="158" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">while d*d ≤ x:</text>
  <text x="628" y="182" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">    while x % d == 0:</text>
  <text x="628" y="206" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">        s += d，x ← x/d</text>
  <text x="628" y="230" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">    d += 1</text>
  <text x="628" y="254" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">if x &gt; 1:  s += x</text>
  <text x="628" y="278" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">return s</text>
  <text x="628" y="322" font-size="11" fill="#888" filter="url(#sk)">重数：内层「除干净」才前进（8 → 2+2+2 = 6）</text>
  <text x="628" y="344" font-size="11" fill="#888" filter="url(#sk)">残余 &gt; 1：它就是最大质因子，直接累加</text>
  <text x="628" y="366" font-size="11" fill="#888" filter="url(#sk)">只试除到 √x：大于 √x 的质因子至多一个</text>
  <text x="628" y="402" font-size="11" fill="#c98a2b" filter="url(#sk)">例：x=15 → d=3 除一次(3)，剩 5 → s=3+5=8</text>

  <!-- bottom left: stopping criterion -->
  <g filter="url(#sk)">
    <rect x="60" y="478" width="540" height="130" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="80" y="504" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">⚠ 停机判据为什么是 s == n？</text>
  <text x="80" y="530" font-size="12" fill="#444" filter="url(#sk)">「是合数才替换」会在 n = 4 死循环：4 = 2×2，f(4) = 4</text>
  <text x="80" y="552" font-size="12" fill="#444" filter="url(#sk)">s == n 一句覆盖全部不动点（质数 ∪ {4}），无需 isPrime</text>
  <text x="80" y="580" font-size="11" fill="#999" filter="url(#sk)">落点即最小值：序列单调不增（见概念图）</text>

  <!-- bottom right: complexity -->
  <g filter="url(#sk)">
    <rect x="630" y="478" width="324" height="130" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="650" y="504" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">复杂度</text>
  <text x="650" y="528" font-size="12" fill="#444" filter="url(#sk)">每轮试除 O(√n)，轮数 O(log n)</text>
  <text x="650" y="550" font-size="12" fill="#444" filter="url(#sk)">n ≤ 10^5：√n ≤ 317，十几轮即停</text>
  <text x="650" y="572" font-size="12" fill="#444" filter="url(#sk)">总量约 10^4 次整除运算，空间 O(1)</text>
</svg>
