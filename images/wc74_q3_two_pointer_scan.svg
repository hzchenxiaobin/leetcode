<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">写法二：单趟双指针，用 j − i 直接计数</text>
  <text x="280" y="45" text-anchor="middle" font-size="9.8" fill="#888" filter="url(#rough2)">i = 最后一个「&gt; right」的下标（墙），j = 最后一个「≥ left」的下标（锚）</text>

  <rect x="163" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="90" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">2</text>
  <rect x="223" y="64" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="251" y="90" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="283" y="64" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="90" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">4</text>
  <rect x="343" y="64" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="90" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">3</text>

  <text x="191" y="117" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="251" y="117" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="311" y="117" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="371" y="117" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>

  <text x="311" y="134" text-anchor="middle" font-size="9.3" fill="#b85450" filter="url(#rough2)">i 停在这里</text>
  <text x="371" y="134" text-anchor="middle" font-size="9.3" fill="#d6a040" filter="url(#rough2)">j 停在这里</text>
  <text x="280" y="150" text-anchor="middle" font-size="9.3" fill="#777" filter="url(#rough2)">扫完时 i = 2、j = 3，右端 r = 3 的贡献为 j − i = 1 个</text>

  <rect x="50" y="162" width="460" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="181" font-size="10.2" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">v &gt; right</text>
  <text x="66" y="199" font-size="9.6" fill="#8a3a36" filter="url(#rough2)">i ← r（墙后移），j ← −1（旧锚全部作废），本次贡献 0</text>

  <rect x="50" y="220" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="239" font-size="10.2" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">left ≤ v ≤ right</text>
  <text x="66" y="257" font-size="9.6" fill="#8a6a20" filter="url(#rough2)">j ← r（锚右移），本次贡献 j − i 个合法左端点</text>

  <rect x="50" y="278" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="297" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">v &lt; left</text>
  <text x="66" y="315" font-size="9.6" fill="#3a4a66" filter="url(#rough2)">i、j 都不动；它只能挂在更早的锚后面，贡献仍是 j − i</text>

  <rect x="90" y="338" width="380" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">ans += max(0, j − i)</text>
  <text x="280" y="372" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">j ≤ i 时没有可用起点（墙挡住了全部），贡献记 0</text>

  <text x="280" y="400" text-anchor="middle" font-size="9.4" fill="#666" filter="url(#rough2)">固定右端 r：起点 &gt; i 才避开墙；起点 ≤ j 才能把锚 v 包进来 → 合法起点恰有 j − i 个</text>
  <text x="280" y="418" text-anchor="middle" font-size="9.2" fill="#999" filter="url(#rough2)">与写法一等价，但只需一趟扫描、两个下标，常数更小</text>
</svg>
