<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="560" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，每个间隔一次整除</text>
  <path d="M 130 40 Q 280 50 430 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="170" cy="78" rx="48" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="170" y="83" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold">开始</text>
  <path d="M 170 99 L 170 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="88" y="126" width="164" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="147" text-anchor="middle" font-size="12" fill="#2b5d8e" font-family="monospace" font-weight="bold">prev = 0, ans = 0</text>
  <text x="270" y="140" font-size="10" fill="#888">prev：上一个立足高度，</text>
  <text x="270" y="153" font-size="10" fill="#888">初始为地板（不是 rungs[0]）</text>
  <path d="M 170 158 L 170 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="170,182 260,217 170,252 80,217" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="170" y="213" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">还有未处理的</text>
  <text x="170" y="229" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">台阶 r ？</text>

  <path d="M 260 217 H 405" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="208" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <ellipse cx="452" cy="217" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="452" y="222" text-anchor="middle" font-size="12" fill="#2f5d2f" font-weight="bold">返回 ans</text>

  <path d="M 170 252 L 170 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="266" font-size="11.5" fill="#2f5d2f" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="92" y="276" width="156" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="297" text-anchor="middle" font-size="12" fill="#2b5d8e" font-family="monospace" font-weight="bold">gap = r − prev</text>
  <path d="M 170 308 L 170 328" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="72" y="332" width="196" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="170" y="356" text-anchor="middle" font-size="12.5" fill="#8f6b1f" font-family="monospace" font-weight="bold">ans += (gap−1) // dist</text>
  <text x="290" y="345" font-size="10" fill="#888">gap ≤ dist 时</text>
  <text x="290" y="358" font-size="10" fill="#888">自动加 0——</text>
  <text x="290" y="371" font-size="10" fill="#888" font-weight="bold">整条链无 if 分支</text>
  <path d="M 170 370 L 170 390" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="108" y="394" width="124" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="415" text-anchor="middle" font-size="12" fill="#2b5d8e" font-family="monospace" font-weight="bold">prev = r</text>

  <path d="M 232 410 H 330 Q 346 410 346 395 V 232 Q 346 217 331 217 H 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="330" font-size="10.5" fill="#888">回到循环，</text>
  <text x="360" y="344" font-size="10.5" fill="#888">处理下一台阶</text>

  <g filter="url(#sk)">
    <rect x="40" y="466" width="480" height="72" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="280" y="488" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-weight="bold">时间 O(n)：每个台阶一次减法 + 一次整除（10⁵ 级瞬时）</text>
  <text x="280" y="508" text-anchor="middle" font-size="11.5" fill="#2f5d2f">空间 O(1)：仅 prev、ans 两个变量，不建任何中间容器</text>
  <text x="280" y="528" text-anchor="middle" font-size="11.5" fill="#2f5d2f">全对答案的 burden 压在公式正确性上——差 1 见 §8</text>
</svg>
