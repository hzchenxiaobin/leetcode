<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">层和 = 同一层节点值之和（到根距离相同）</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic">示例 1：BFS 每轮恰好处理一层，levelSum 轮末结算进 sums</text>

  <!-- level bands -->
  <g filter="url(#sk)">
    <rect x="100" y="66" width="400" height="46" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
    <rect x="100" y="126" width="400" height="46" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    <rect x="100" y="186" width="400" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="100" y="246" width="400" height="46" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.1"/>
  </g>
  <text x="92" y="93" text-anchor="end" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">第 1 层</text>
  <text x="92" y="153" text-anchor="end" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">第 2 层</text>
  <text x="92" y="213" text-anchor="end" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#sk)">第 3 层</text>
  <text x="92" y="273" text-anchor="end" font-size="12" font-weight="bold" fill="#4a8edb" filter="url(#sk)">第 4 层</text>

  <!-- edges -->
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.6" fill="none">
    <path d="M 300 98 Q 268 122 240 140"/>
    <path d="M 320 98 Q 352 122 380 140"/>
    <path d="M 220 160 Q 192 185 174 198"/>
    <path d="M 232 164 Q 238 184 240 197"/>
    <path d="M 382 164 Q 370 184 360 197"/>
    <path d="M 398 160 Q 418 185 426 198"/>
    <path d="M 155 220 Q 140 245 133 256"/>
    <path d="M 174 220 Q 190 245 197 256"/>
  </g>

  <!-- tree nodes -->
  <g filter="url(#sk)">
    <circle cx="310" cy="89" r="17" fill="#ffffff" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="230" cy="149" r="17" fill="#ffffff" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="390" cy="149" r="17" fill="#ffffff" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="165" cy="209" r="17" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <circle cx="240" cy="209" r="17" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <circle cx="355" cy="209" r="17" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <circle cx="430" cy="209" r="17" fill="#ffffff" stroke="#d6a040" stroke-width="2"/>
    <circle cx="130" cy="269" r="17" fill="#ffffff" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="200" cy="269" r="17" fill="#ffffff" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="310" y="94" fill="#4a8edb">5</text>
    <text x="230" y="154" fill="#4a8e4a">8</text>
    <text x="390" y="154" fill="#4a8e4a">9</text>
    <text x="165" y="214" fill="#d6a040">2</text>
    <text x="240" y="214" fill="#d6a040">1</text>
    <text x="355" y="214" fill="#d6a040">3</text>
    <text x="430" y="214" fill="#d6a040">7</text>
    <text x="130" y="274" fill="#4a8edb">4</text>
    <text x="200" y="274" fill="#4a8edb">6</text>
  </g>

  <!-- arrows to sum cards -->
  <g filter="url(#sk)" stroke="#7a7a7a" stroke-width="1.4" fill="none">
    <path d="M 503 89 L 515 89" marker-end="url(#ar)"/>
    <path d="M 503 149 L 515 149" marker-end="url(#ar)"/>
    <path d="M 503 209 L 515 209" marker-end="url(#ar)"/>
    <path d="M 503 269 L 515 269" marker-end="url(#ar)"/>
  </g>
  <text x="564" y="62" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">层和</text>

  <!-- sum cards -->
  <g filter="url(#sk)">
    <rect x="518" y="70" width="92" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="518" y="130" width="92" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="518" y="190" width="92" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="518" y="250" width="92" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="564" y="94" fill="#4a8edb">5</text>
    <text x="564" y="154" fill="#4a8e4a">17</text>
    <text x="564" y="214" fill="#b85450">13</text>
    <text x="564" y="274" fill="#4a8edb">10</text>
  </g>
  <text x="564" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">第 2 大 ✓</text>

  <!-- sorted row -->
  <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">全部层和降序排序：</text>
  <g filter="url(#sk)">
    <rect x="155" y="326" width="66" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="250" y="326" width="66" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="345" y="326" width="66" height="42" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
    <rect x="440" y="326" width="66" height="42" rx="6" fill="#f5f5f5" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="188" y="353" fill="#4a8edb">17</text>
    <text x="283" y="353" fill="#b85450">13</text>
    <text x="378" y="353" fill="#666666">10</text>
    <text x="473" y="353" fill="#666666">5</text>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#sk)">
    <text x="188" y="384" fill="#7a7a7a">第 1 大</text>
    <text x="283" y="384" fill="#b85450" font-weight="bold">第 2 大 ✓</text>
    <text x="378" y="384" fill="#7a7a7a">第 3 大</text>
    <text x="473" y="384" fill="#7a7a7a">第 4 大</text>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">k = 2 → 取降序第 2 个，即 sums[1] = 13；层数不足 k 时返回 −1</text>
</svg>
