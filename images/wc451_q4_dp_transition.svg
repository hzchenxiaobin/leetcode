<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">dp[l][r]：枚举「首个幸存字符」的位置 k</text>
  <path d="M 260 44 Q 460 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="130" y="62" width="660" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="460" y="84" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">分支一：若 canDel[l][r] = true，则 dp[l][r] = ""（空串）</text>
  <text x="460" y="104" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">空串字典序最小，直接取，无需再枚举</text>

  <rect x="130" y="132" width="660" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">分支二：区间删不完 ⇒ 结果非空，必有「首个幸存字符」s[k]</text>

  <text x="150" y="200" font-size="13" fill="#666" filter="url(#sk)">区间 [l..r]：</text>
  <rect x="240" y="174" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#sk)"/>
  <text x="325" y="196" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#sk)">前缀 [l..k−1]</text>
  <text x="325" y="215" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">整段删除 ✂</text>
  <path d="M 250 168 L 400 232" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>

  <rect x="422" y="174" width="56" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="450" y="207" text-anchor="middle" font-size="19" fill="#2f5d24" font-weight="bold" filter="url(#sk)">s[k]</text>

  <rect x="490" y="174" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="575" y="196" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#sk)">后缀 [k+1..r]</text>
  <text x="575" y="215" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">子问题 dp[k+1][r]</text>

  <text x="460" y="258" text-anchor="middle" font-size="14" fill="#3d5a30" filter="url(#sk)">dp[l][r] = min { s[k] + dp[k+1][r] ：k = l，或 canDel[l][k−1] }</text>
  <text x="460" y="282" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">k 的合法条件 = 「k 之前的前缀能整段删光」（k = l 时前缀为空，即直接保留 s[l]）</text>

  <rect x="70" y="308" width="380" height="94" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#sk)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#sk)">为什么只需枚举「第一个」幸存字符？</text>
  <text x="260" y="354" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">结果串的第一位 = 某个 s[k]，且 k 之前全被删光；</text>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">其后的事（继续删 / 继续留）完全落在子区间 [k+1..r]，</text>
  <text x="260" y="394" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">与已删掉的前缀互不干扰 —— 天然的区间 DP 无后效性</text>

  <rect x="470" y="308" width="380" height="94" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#sk)"/>
  <text x="660" y="332" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">比较 = 普通字符串字典序比较</text>
  <text x="660" y="354" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">候选 s[k] + dp[k+1][r] 首字符不同时 O(1) 分胜负；</text>
  <text x="660" y="374" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">相同则比较后缀（首字符剪枝：s[k] 大于当前最优</text>
  <text x="660" y="394" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">首字符的 k 可直接跳过）</text>

  <rect x="170" y="428" width="580" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="460" y="450" text-anchor="middle" font-size="13" fill="#446688" filter="url(#sk)">计算顺序：r 从小到大，l 从大到小（dp[l][r] 只依赖同一列 r 的更小 l）</text>
  <text x="460" y="472" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#sk)">最终答案 = dp[0][n−1]</text>

  <text x="460" y="516" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">⚠ k = l 这一支千万别漏 —— 它对应「保留 s[l]」，很多错误解法只枚举了「删前缀再留」的情形</text>
  <text x="460" y="538" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">（也不存在「删掉一段又跨过 s[k]」的方案：幸存字符是墙，见核心观察图）</text>
</svg>
