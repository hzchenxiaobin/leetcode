<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">先看最小的数 mn：答案只可能是 1 或 ⌈cnt / 2⌉</text>
  <rect x="90" y="46" width="380" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mn = min(nums)，cnt = mn 在数组中出现的次数</text>
  <path d="M280,82 L280,104" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <polygon points="230,105.0 390.0,136 230,167.0 70.0,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="140" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">存在某个 v 使 v % mn ≠ 0 ?</text>
  <path d="M390,136 L420,136" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="405" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="422" y="118" width="118" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="481" y="142" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">答案 1</text>
  <path d="M230,167 L230,196" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <polygon points="230,197.0 380.0,228 230,259.0 80.0,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">mn 只出现一次（cnt = 1）?</text>
  <path d="M380,228 L420,228" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="218" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="422" y="210" width="118" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="481" y="234" text-anchor="middle" font-size="12.5" fill="#1c3a1c" filter="url(#rough2)">答案 1</text>
  <path d="M230,259 L230,288" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="278" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="120" y="290" width="220" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="317" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">答案 = ⌈cnt / 2⌉</text>
  <text x="430" y="300" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全是 mn 的倍数</text>
  <text x="430" y="316" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">→ 只剩 ⌈cnt/2⌉</text>
</svg>
