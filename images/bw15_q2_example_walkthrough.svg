<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="300" fill="#fafafa"/>
  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：[[1,4],[3,6],[2,8]] → 排序 → 扫描 → 答案 2</text>

  <!-- 第一步：原顺序 -->
  <text x="40" y="70" font-size="13" fill="#666" filter="url(#rough2)">原顺序：</text>
  <rect x="120" y="58" width="90" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[1,4]</text>
  <rect x="240" y="58" width="90" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[3,6]</text>
  <rect x="360" y="58" width="180" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[2,8]</text>

  <!-- 排序箭头 -->
  <line x1="300" y1="86" x2="300" y2="112" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="104" font-size="12" fill="#8a6a20" filter="url(#rough2)">按 (start 升, end 降) 排序</text>

  <!-- 第二步：排序后 -->
  <text x="40" y="150" font-size="13" fill="#666" filter="url(#rough2)">排序后：</text>
  <rect x="120" y="138" width="90" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① [1,4]</text>
  <rect x="240" y="138" width="180" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② [2,8]</text>
  <rect x="450" y="138" width="90" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">③ [3,6]</text>

  <!-- 扫描结论 -->
  <text x="40" y="200" font-size="13" fill="#666" filter="url(#rough2)">逐个过闸：</text>
  <rect x="120" y="186" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① 4 &gt; -1 → 保留</text>
  <rect x="290" y="186" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="207" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 8 &gt; 4 → 保留</text>
  <rect x="460" y="186" width="170" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="207" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">③ 6 ≤ 8 → 被覆盖 ✗</text>

  <!-- 叉 -->
  <g stroke="#b85450" stroke-width="2">
    <line x1="480" y1="136" x2="512" y2="158" filter="url(#rough2)"/>
    <line x1="512" y1="136" x2="480" y2="158" filter="url(#rough2)"/>
  </g>

  <!-- 答案 -->
  <rect x="210" y="246" width="240" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="272" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">剩余区间数 remain = 2</text>
</svg>
