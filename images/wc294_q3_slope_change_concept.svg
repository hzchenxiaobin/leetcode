<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：排序后数「斜率变化」，极大共线链有几条答案就是几</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 坐标轴 -->
  <path d="M 55 292 L 470 292" stroke="#666" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 55 292 L 55 88" stroke="#666" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="480" y="296" font-size="12" fill="#666">day</text>
  <text x="42" y="84" font-size="12" fill="#666">price</text>

  <!-- 三段折线（示例 1） -->
  <path d="M 70 114 L 232 192" stroke="#b85450" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 232 192 L 286 192" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#sk)"/>
  <path d="M 286 192 L 448 270" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#sk)"/>

  <!-- 顶点 -->
  <g filter="url(#sk)">
    <circle cx="70" cy="114" r="4.5" fill="#446688"/><circle cx="124" cy="140" r="4.5" fill="#446688"/>
    <circle cx="178" cy="166" r="4.5" fill="#446688"/><circle cx="232" cy="192" r="4.5" fill="#446688"/>
    <circle cx="286" cy="192" r="4.5" fill="#446688"/><circle cx="340" cy="218" r="4.5" fill="#446688"/>
    <circle cx="394" cy="244" r="4.5" fill="#446688"/><circle cx="448" cy="270" r="4.5" fill="#446688"/>
  </g>

  <!-- 段标注 -->
  <text x="128" y="132" font-size="12.5" font-weight="bold" fill="#b85450">段 1 · 斜率 −1</text>
  <text x="216" y="178" font-size="12.5" font-weight="bold" fill="#a5791f">段 2 · 斜率 0</text>
  <text x="330" y="226" font-size="12.5" font-weight="bold" fill="#4a7a3a">段 3 · 斜率 −1</text>

  <!-- 变化点强调 -->
  <g filter="url(#sk)"><ellipse cx="232" cy="192" rx="14" ry="11" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><ellipse cx="286" cy="192" rx="14" ry="11" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <text x="259" y="158" text-anchor="middle" font-size="11.5" fill="#b85450">斜率变化 ×2</text>

  <!-- 右侧结论框 -->
  <g filter="url(#sk)"><rect x="492" y="104" width="132" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="558" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">答案</text>
  <text x="558" y="154" text-anchor="middle" font-size="12" fill="#33455e">= 链数</text>
  <text x="558" y="176" text-anchor="middle" font-size="12" fill="#33455e">= 1 + 变化次数</text>
  <text x="558" y="200" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">1 + 2 = 3 ✓</text>

  <!-- 公式行 -->
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#2b2b2b">一条线段是直的 ⇒ 它只能覆盖折线上一段「连续且共线」的部分 ⇒ 极大共线链必须各配一条线段</text>
  <text x="320" y="346" text-anchor="middle" font-size="13" fill="#2b2b2b">链内相邻边斜率全相同 ⇒ 链数 = 首段 1 + 相邻边斜率不同的次数</text>

  <!-- 乱序警示 -->
  <g filter="url(#sk)"><rect x="36" y="364" width="568" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04040">⚠ 输入不保证按 day 有序：示例 2 [[3,4],[1,2],[7,8],[2,3]] 乱序读像是 3 段，</text>
  <text x="320" y="408" text-anchor="middle" font-size="12.5" fill="#a04040">排序后 (1,2)(2,3)(3,4)(7,8) 四点共线，答案 1 —— 不排序必 WA</text>
</svg>
