<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 演算：逐列标记可达格子，最大可达列 = 3</text>
  <text x="260" y="47" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">grid = [[2,4,3,5],[5,4,9,3],[3,4,2,11],[10,9,13,15]]</text>

  <!-- 列标签 -->
  <text x="79" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c=0</text>
  <text x="125" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c=1</text>
  <text x="171" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c=2</text>
  <text x="217" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c=3</text>
  <!-- 行标签 -->
  <text x="50" y="114" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">r=0</text>
  <text x="50" y="160" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">r=1</text>
  <text x="50" y="206" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">r=2</text>
  <text x="50" y="252" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">r=3</text>

  <!-- 列 0：全可达，路径格 (0,0) 强调 -->
  <rect x="56" y="88" width="46" height="46" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="79" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <rect x="56" y="134" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">5</text>
  <rect x="56" y="180" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">3</text>
  <rect x="56" y="226" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="79" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">10</text>

  <!-- 列 1：全可达，路径格 (0,1) 强调 -->
  <rect x="102" y="88" width="46" height="46" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="125" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="102" y="134" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">4</text>
  <rect x="102" y="180" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">4</text>
  <rect x="102" y="226" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">9</text>

  <!-- 列 2：仅行 1、3 可达 -->
  <rect x="148" y="88" width="46" height="46" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="116" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">3</text>
  <rect x="148" y="134" width="46" height="46" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="171" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">9</text>
  <rect x="148" y="180" width="46" height="46" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="208" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>
  <rect x="148" y="226" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="171" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">13</text>

  <!-- 列 3：全可达，路径格 (2,3) 强调 -->
  <rect x="194" y="88" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">5</text>
  <rect x="194" y="134" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">3</text>
  <rect x="194" y="180" width="46" height="46" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="217" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">11</text>
  <rect x="194" y="226" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">15</text>

  <!-- 路径箭头 2 → 4 → 9 → 11 -->
  <path d="M100,111 L118,111" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M130,118 L163,146" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M176,162 L209,190" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 右侧逐列可达集合 -->
  <rect x="262" y="88" width="238" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">c = 0：R = {0,1,2,3}</text>
  <text x="381" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第一列整列都是起点</text>

  <rect x="262" y="156" width="238" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">c = 1：R = {0,1,2,3}</text>
  <text x="381" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4&gt;2 ✓、9&gt;3 ✓，各行都进得来</text>

  <rect x="262" y="224" width="238" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c = 2：R = {1,3}</text>
  <text x="381" y="266" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">9&gt;4 ✓、13&gt;4 ✓；3≤4、2≤4 被卡</text>

  <rect x="262" y="292" width="238" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="381" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c = 3：R = {0,1,2,3} → ans=3</text>
  <text x="381" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">5&gt;3 ✓、11&gt;9 ✓、15&gt;13 ✓</text>

  <!-- 底部结论 -->
  <rect x="30" y="366" width="470" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">最后一个非空可达列是第 3 列 → 最多移动 3 次</text>
  <text x="265" y="406" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">对应路径 2 → 4 → 9 → 11（红色），每步值严格增大</text>
</svg>
