  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：covid2019 → c2o0v1i9d</text>
  <path d="M 210 36 Q 330 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

