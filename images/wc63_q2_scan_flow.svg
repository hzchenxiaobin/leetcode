<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次顺序扫描 + 严格更短才更新</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不排序、不回看、不复制 words</text>

  <rect x="140" y="60" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 统计 need[26]，数字与空格丢弃</text>

  <path d="M 270 98 L 270 114" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="116" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">② 按原顺序取 words[i]</text>

  <path d="M 270 154 L 270 174" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,176 390,206 270,236 150,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">len(w) &lt; len(best)？</text>

  <path d="M 390 206 L 400 206" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="406" y="202" font-size="10" fill="#b85450" filter="url(#rough2)">否：长度不占优</text>
  <text x="406" y="216" font-size="10" fill="#b85450" filter="url(#rough2)">→ 跳过，不计数</text>

  <path d="M 270 236 L 270 256" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="258" width="260" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">③ 统计 cnt[26]（词的字母计数）</text>

  <path d="M 270 296 L 270 316" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,318 400,348 270,378 140,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">∀c：cnt[c] ≥ need[c]？</text>

  <path d="M 400 348 L 410 348" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="416" y="344" font-size="10" fill="#b85450" filter="url(#rough2)">否：不是补全词</text>
  <text x="416" y="358" font-size="10" fill="#b85450" filter="url(#rough2)">→ 跳过</text>

  <path d="M 270 378 L 270 398" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="400" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">④ best ← w（必为严格更短）</text>

  <path d="M 140 419 L 100 419 L 100 135 L 136 135" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="112" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i++</text>

  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">更新用「严格更短」、剪枝用「≥」，两条互补：既保证最短，又自动满足并列取最先出现</text>
  <text x="280" y="482" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">best 为空时剪枝不生效，所以第一个词必须真正数一遍字母</text>
</svg>
