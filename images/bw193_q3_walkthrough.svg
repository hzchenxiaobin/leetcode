<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="415" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [7,13,19,4,10,3,9,15,5,11]，k = 6</text>

  <!-- nums 行 -->
  <text x="52" y="82" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="60" y="60" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="112" y="60" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">13</text>
  <rect x="164" y="60" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">19</text>
  <rect x="216" y="60" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="268" y="60" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="320" y="60" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="372" y="60" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="424" y="60" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">15</text>
  <rect x="476" y="60" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="528" y="60" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="552" y="82" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11</text>

  <!-- 余数行 -->
  <text x="52" y="123" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">mod 6</text>
  <rect x="60" y="102" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="121" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="112" y="102" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="121" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="164" y="102" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="121" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="216" y="102" width="48" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="121" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="268" y="102" width="48" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="121" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">4</text>
  <rect x="320" y="102" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="121" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="372" y="102" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="121" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="424" y="102" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="121" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="476" y="102" width="48" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="121" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="528" y="102" width="48" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="552" y="121" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- 段括号 -->
  <path d="M62,138 L62,146 L210,146 L210,138" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="136" y="162" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段A (r=1, L=3)</text>
  <path d="M218,138 L218,146 L314,146 L314,138" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="266" y="162" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">段B (r=4, L=2)</text>
  <path d="M322,138 L322,146 L470,146 L470,138" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="396" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">段C (r=3, L=3)</text>
  <path d="M478,138 L478,146 L574,146 L574,138" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="526" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">段D (r=5, L=2)</text>

  <!-- 四个结算框 -->
  <rect x="20" y="180" width="138" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="202" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段A：r=1, L=3</text>
  <text x="89" y="222" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">d = 6/gcd(1,6) = 6</text>
  <text x="89" y="240" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">合法长度 1, 7, 13, …</text>
  <text x="89" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">best = 1</text>

  <rect x="174" y="180" width="138" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="202" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">段B：r=4, L=2</text>
  <text x="243" y="222" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">d = 6/gcd(4,6) = 3</text>
  <text x="243" y="240" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">合法长度 1, 4, 7, …</text>
  <text x="243" y="260" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">best = 1</text>

  <rect x="328" y="180" width="138" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="397" y="202" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">段C：r=3, L=3</text>
  <text x="397" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">d = 6/gcd(3,6) = 2</text>
  <text x="397" y="240" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">合法长度 1, 3, 5, …</text>
  <text x="397" y="260" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">best = 3 ✓</text>

  <rect x="482" y="180" width="138" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="551" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">段D：r=5, L=2</text>
  <text x="551" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">d = 6/gcd(5,6) = 6</text>
  <text x="551" y="240" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">合法长度 1, 7, …</text>
  <text x="551" y="260" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">best = 1</text>

  <!-- 答案框 -->
  <path d="M397,272 L350,296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="300" width="300" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max(1, 1, 3, 1) = 3</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">即 [3, 9, 15]：删后剩 24 / 18 / 12，均被 6 整除 ✓</text>

  <!-- 底部注记 -->
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">段A [7,13,19] 全体 ≡ 1 却不韧性：(m−1)·r = 2 不被 6 整除</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">同余只是必要条件，长度格点 (m ≡ 1 (mod d)) 才是另一半</text>
</svg>
