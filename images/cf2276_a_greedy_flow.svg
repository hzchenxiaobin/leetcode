<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次比较 + 一次取 min</text>
  <path d="M 210 46 Q 380 53 550 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 输入框 -->
  <rect x="28" y="92" width="196" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="118" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 a 片奶酪</text>
  <text x="126" y="142" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">b 片香肠</text>

  <path d="M 226 126 L 258 126" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="262,126 366,74 470,126 366,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a &gt; b ?</text>

  <!-- 是分支 -->
  <path d="M 470 126 L 508 126" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="489" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <rect x="512" y="86" width="220" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="622" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">ans = min(a − b, b)</text>
  <text x="622" y="136" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">输出 ans</text>
  <text x="622" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">两个上界都能达到</text>

  <!-- 否分支 -->
  <path d="M 366 178 L 366 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="268" y="212" width="196" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="238" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 −1</text>
  <text x="366" y="260" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">奶酪不比香肠多，一片也分不出</text>

  <!-- 说明条 -->
  <rect x="28" y="300" width="704" height="86" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="326" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a − b 卡住「奶酪够不够多」，b 卡住「香肠够不够分」，两条都必须满足</text>
  <text x="380" y="350" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">构造证明上界可同时取到，所以取 min 之后不用再调整</text>
  <text x="380" y="372" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">每组 O(1)，全部测试 O(t)；a, b ≤ 100，int 足够</text>
</svg>
