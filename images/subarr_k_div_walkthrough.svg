<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums ＝ [1,1,2,2,3,3]，k ＝ 3</text>
  <path d="M 140 38 Q 320 48 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="54" width="52" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="116" y="54" width="52" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="172" y="54" width="52" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="228" y="54" width="52" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="284" y="54" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="54" width="52" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="86" y="79">1</text>
    <text x="142" y="79">1</text>
    <text x="198" y="79">2</text>
    <text x="254" y="79">2</text>
    <text x="310" y="79">3</text>
    <text x="366" y="79">3</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#999">
    <text x="86" y="106">0</text>
    <text x="142" y="106">1</text>
    <text x="198" y="106">2</text>
    <text x="254" y="106">3</text>
    <text x="310" y="106">4</text>
    <text x="366" y="106">5</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#777">
    <text x="418" y="68">B₀＝{0,1}</text>
    <text x="418" y="84">B₁＝{2,3}</text>
    <text x="418" y="100">B₂＝{4,5}</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="104" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="148" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="192" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="236" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="280" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="324" y="116" width="40" height="30" rx="5" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333">
    <text x="80" y="135">0</text>
    <text x="124" y="135">1</text>
    <text x="168" y="135">2</text>
    <text x="212" y="135">4</text>
    <text x="256" y="135">6</text>
    <text x="300" y="135">9</text>
    <text x="344" y="135">12</text>
  </g>
  <text x="384" y="135" font-size="11.5" fill="#777">＝ P[0..6]</text>
  <g font-size="11" text-anchor="middle" fill="#b85450" font-weight="bold">
    <text x="80" y="160">0</text>
    <text x="124" y="160">1</text>
    <text x="168" y="160">2</text>
    <text x="212" y="160">1</text>
    <text x="256" y="160">0</text>
    <text x="300" y="160">0</text>
    <text x="344" y="160">0</text>
  </g>
  <text x="384" y="160" font-size="11" fill="#b85450">mod 3</text>

  <g filter="url(#sk)">
    <rect x="30" y="176" width="580" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="42" y="196" font-size="11.5" font-weight="bold" fill="#2b6e9e">B₀</text>
  <text x="80" y="196" font-size="11.5" fill="#333">t=0 查 P[1]≡1：无；t=1 查 P[2]≡2：无</text>
  <text x="80" y="214" font-size="11.5" fill="#333">插入 P[0]≡0、P[1]≡1 → cnt={0:1, 1:1}，ans=0</text>

  <g filter="url(#sk)">
    <rect x="30" y="228" width="580" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="42" y="248" font-size="11.5" font-weight="bold" fill="#2e5e22">B₁</text>
  <text x="80" y="248" font-size="11.5" fill="#333">t=2 查 P[3]≡1 命中 s=1 → [1,2]✓；t=3 查 P[4]≡0 命中 s=0 → [1,1,2,2]✓</text>
  <text x="80" y="266" font-size="11.5" fill="#333">插入 P[2]≡2、P[3]≡1 → cnt={0:1, 1:2, 2:1}，ans=2</text>

  <g filter="url(#sk)">
    <rect x="30" y="280" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="42" y="300" font-size="11.5" font-weight="bold" fill="#7a5415">B₂</text>
  <text x="80" y="300" font-size="11.5" fill="#333">t=4 查 P[5]≡0 命中 s=0 → [1,1,2,2,3]✓；t=5 查 P[6]≡0 命中 s=0 → 全数组✓</text>
  <text x="80" y="318" font-size="11.5" fill="#333">ans=4（跨块部分完成）</text>

  <g filter="url(#sk)">
    <rect x="30" y="332" width="580" height="46" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="42" y="352" font-size="11.5" font-weight="bold" fill="#555">单块</text>
  <text x="80" y="352" font-size="11.5" fill="#333">B₀：v=1，k/gcd=3，⌊2/3⌋=0；B₁：v=2，k/gcd=3，⌊2/3⌋=0</text>
  <text x="80" y="370" font-size="11.5" fill="#333">B₂：v=3，k/gcd=3/3=1，⌊2/1⌋=2 → [3]、[3,3] 各计一次，ans+2</text>

  <g filter="url(#sk)">
    <rect x="30" y="392" width="580" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">答案 ＝ 跨块 4 ＋ 单块 2 ＝ 6</text>
  <text x="320" y="446" text-anchor="middle" font-size="11.5" fill="#8a3a36">良好且互异：[1,2]、[1,1,2,2]、[1,1,2,2,3]、[1,1,2,2,3,3]、[3]、[3,3]</text>
  <text x="320" y="468" text-anchor="middle" font-size="11" fill="#8a3a36">（[1]、[1,1]、[2]、[2,2] 的和均不被 3 整除，不计入）</text>
</svg>
