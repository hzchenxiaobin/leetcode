<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个按键各管一摊：追加 'a' / 末位 +1</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：按键 1 -->
  <rect x="25" y="58" width="290" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688">按键 1：追加 'a'</text>

  <rect x="90" y="96" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="116" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="130" y="96" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="116" text-anchor="middle" font-size="13" fill="#333">b</text>

  <path d="M 168 111 L 186 111" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="192" y="96" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="207" y="116" text-anchor="middle" font-size="13" fill="#7a5415">a</text>

  <text x="170" y="150" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">s = "ab"  →  "aba"</text>
  <text x="170" y="176" text-anchor="middle" font-size="11" fill="#555">长度 +1，落地的字符恒为 'a'</text>
  <text x="170" y="198" text-anchor="middle" font-size="11" fill="#555">→ 位置 i 上的字符只能这样产生</text>

  <!-- 右：按键 2 -->
  <rect x="325" y="58" width="290" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a15">按键 2：末位转轮 +1</text>

  <rect x="350" y="98" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="117" text-anchor="middle" font-size="12.5" fill="#333">a</text>
  <rect x="392" y="98" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="117" text-anchor="middle" font-size="12.5" fill="#333">b</text>
  <rect x="434" y="98" width="28" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="117" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">c</text>
  <text x="478" y="117" text-anchor="middle" font-size="13" fill="#888">…</text>
  <rect x="500" y="98" width="28" height="28" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="117" text-anchor="middle" font-size="12.5" fill="#333">z</text>

  <path d="M 364 140 Q 406 156 448 140" stroke="#a06a15" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="168" text-anchor="middle" font-size="10.5" fill="#a06a15">每按一次：正向 +1</text>
  <text x="470" y="190" text-anchor="middle" font-size="10.5" fill="#b85450">× z → a 绕回：本题永不触发</text>
  <text x="470" y="208" text-anchor="middle" font-size="10.5" fill="#555">只修改最后一位</text>

  <!-- 下：前缀锁定 -->
  <rect x="25" y="232" width="590" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="258" font-size="12.5" font-weight="bold" fill="#3a5f2e">前缀逐位锁定</text>
  <text x="52" y="278" font-size="10.5" fill="#4a7a3a">位置 i+1 一旦追加</text>
  <text x="52" y="292" font-size="10.5" fill="#4a7a3a">位置 i 永久定格</text>

  <rect x="205" y="262" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="280" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="237" y="262" width="26" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#333">b</text>

  <!-- 锁：挂在 a、b 上 -->
  <g stroke="#3a5f2e" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <rect x="216" y="252" width="34" height="9" rx="2" fill="#e6f4ea"/>
    <path d="M 222 252 v-4 a 11 11 0 0 1 22 0 v 4"/>
  </g>

  <rect x="273" y="262" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="286" y="280" text-anchor="middle" font-size="12" fill="#a06a15" font-weight="bold">c</text>
  <path d="M 296 258 q 14 -10 6 -18" stroke="#a06a15" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="218" y="254" text-anchor="middle" font-size="9.5" fill="#3a5f2e">锁定</text>
  <text x="286" y="300" text-anchor="middle" font-size="9.5" fill="#a06a15">只有末位可改</text>

  <text x="430" y="272" font-size="11" fill="#3a5f2e">各位置代价互相独立</text>
  <text x="430" y="288" font-size="11" fill="#3a5f2e">→ 天然可以逐字符贪心</text>

  <!-- 底部结论 -->
  <rect x="25" y="310" width="590" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">每个位置：1 次按键 1 + (ord(c) − 97) 次按键 2 → 最少方案唯一，照抄即可</text>
</svg>
