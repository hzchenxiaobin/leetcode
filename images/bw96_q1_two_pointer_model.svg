<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">双指针：谁小谁走，相遇即最小公共值</text>

  <!-- nums1 行 -->
  <text x="70" y="70" font-size="13" fill="#666" filter="url(#rough2)">nums1（升序）：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="52" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="52" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="274" y="52" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="326" y="52" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="196" y="73">1</text><text x="248" y="73">2</text><text x="300" y="73">3</text><text x="352" y="73">6</text>
  </g>

  <!-- nums2 行 -->
  <text x="70" y="150" font-size="13" fill="#666" filter="url(#rough2)">nums2（升序）：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="132" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="222" y="132" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="132" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="326" y="132" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="196" y="153">2</text><text x="248" y="153">3</text><text x="300" y="153">4</text><text x="352" y="153">5</text>
  </g>

  <!-- 指针 -->
  <path d="M 248 118 L 248 92" stroke="#446688" stroke-width="2" marker-end="url(#arri)" filter="url(#rough2)"/>
  <text x="262" y="112" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M 196 182 L 196 172" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 196 172 C 190 178, 200 178, 196 172" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="196" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>

  <!-- 决策规则 -->
  <g filter="url(#rough2)">
    <rect x="60" y="222" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <rect x="205" y="222" width="150" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
    <rect x="350" y="222" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="135" y="241" fill="#446688">a[i] &lt; b[j]</text><text x="135" y="260" fill="#446688">→ i 右移</text>
    <text x="280" y="241" fill="#b85450">a[i] &gt; b[j]</text><text x="280" y="260" fill="#b85450">→ j 右移</text>
    <text x="425" y="241" fill="#2d5a22" font-weight="bold">a[i] == b[j]</text><text x="425" y="260" fill="#2d5a22">→ 返回它!</text>
  </g>

  <!-- 为什么正确 -->
  <rect x="60" y="292" width="440" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5c1e">
    <text x="280" y="314" text-anchor="middle">a[i] &lt; b[j] 时，b[j] 后面的数只会更大，</text>
    <text x="280" y="333" text-anchor="middle">a[i] 与它们全都不可能相等 → 这一行整批排除，i 放心右移</text>
    <text x="280" y="352" text-anchor="middle">先被跳过的元素都论证过“不是公共值”，故首次相遇必是最小</text>
  </g>
</svg>
