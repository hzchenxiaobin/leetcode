<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="490" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：逐条对角线「取出 → 定向排序 → 写回」</text>
  <path d="M 120 40 Q 340 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="270" y="56" width="140" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">给定 n×n 矩阵 grid</text>
  <g filter="url(#rough2)">
    <path d="M 340 92 L 340 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- enumerate d -->
  <g filter="url(#rough2)">
    <rect x="240" y="110" width="200" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">对每条对角线 d = i − j</text>
  <text x="340" y="152" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d ∈ [−(n−1), n−1]，共 2n−1 条</text>
  <g filter="url(#rough2)">
    <path d="M 340 162 L 340 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- collect -->
  <g filter="url(#rough2)">
    <rect x="240" y="180" width="200" height="64" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="202" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">沿 ↘ 取出该线元素 vals</text>
  <text x="340" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">起点：d≥0 → (d,0)；d&lt;0 → (0,−d)</text>
  <text x="340" y="238" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每次 i++、j++，直到出界</text>
  <g filter="url(#rough2)">
    <path d="M 340 244 L 340 254" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="340,258 430,300 340,342 250,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="305" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d ≥ 0 ？</text>

  <!-- branch yes -->
  <g filter="url(#rough2)">
    <path d="M 250 300 L 213 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="231" y="291" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="40" y="276" width="170" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="125" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">降序排序（非递增）</text>
  <text x="125" y="315" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">左下三角（含主对角线）</text>

  <!-- branch no -->
  <g filter="url(#rough2)">
    <path d="M 430 300 L 467 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="449" y="291" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="470" y="276" width="170" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="555" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">升序排序（非递减）</text>
  <text x="555" y="315" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">右上三角</text>

  <!-- merge elbows -->
  <g filter="url(#rough2)">
    <path d="M 125 324 L 125 378 L 236 378" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 555 324 L 555 378 L 444 378" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- write back -->
  <g filter="url(#rough2)">
    <rect x="240" y="360" width="200" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="382" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">按取出顺序写回</text>
  <text x="340" y="400" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 k 个值 → 第 k 个格子</text>
  <text x="340" y="416" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（沿 ↘，i 递增）</text>

  <!-- loop back -->
  <g filter="url(#rough2)">
    <path d="M 280 422 L 280 444 L 24 444 L 24 136 L 236 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  </g>
  <text x="140" y="437" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">还有对角线：下一条 d</text>

  <!-- exit -->
  <g filter="url(#rough2)">
    <path d="M 400 422 L 400 442" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="392" y="436" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">全部处理完</text>
  <g filter="url(#rough2)">
    <rect x="330" y="446" width="140" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="400" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 grid</text>

  <!-- warning note -->
  <g filter="url(#rough2)">
    <rect x="40" y="150" width="180" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="130" y="174" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ 易错点</text>
  <text x="130" y="194" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">主对角线 d = 0 属左下</text>
  <text x="130" y="211" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">必须走「是」分支降序</text>

  <!-- complexity note -->
  <g filter="url(#rough2)">
    <rect x="470" y="120" width="190" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="565" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">复杂度速览</text>
  <text x="565" y="164" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">每条线长 ≤ n</text>
  <text x="565" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">总元素恰为 n²</text>
  <text x="565" y="200" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">整体 O(n² log n)</text>
</svg>
