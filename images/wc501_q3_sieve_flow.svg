<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：值域调和筛——升序枚举源值，扫倍数标记 best</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始框 -->
  <g filter="url(#sk)"><rect x="180" y="48" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">建 exists[]（值域布尔表）与 best[]（全 0）；y = 1</text>
  <path d="M 320 86 L 320 98" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- D1: y <= V ? -->
  <g filter="url(#sk)"><polygon points="320,102 404,128 320,154 236,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">y ≤ V ?</text>
  <path d="M 404 128 L 466 128" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="435" y="120" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="470" y="108" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="550" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans = Σ best[nums[i]]</text>
  <text x="550" y="141" text-anchor="middle" font-size="9" fill="#555">（64 位累加，防溢出）</text>
  <path d="M 320 154 L 320 166" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="330" y="164" font-size="10.5" fill="#666">是</text>

  <!-- D2: exists[y]? -->
  <g filter="url(#sk)"><polygon points="320,170 404,196 320,222 236,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">exists[y] ?</text>
  <path d="M 236 196 L 176 196" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="206" y="188" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="96" y="179" width="78" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="135" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">y++</text>
  <path d="M 135 179 L 135 128 L 232 128" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <path d="M 320 222 L 320 234" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="330" y="232" font-size="10.5" fill="#666">是</text>

  <!-- m = y -->
  <g filter="url(#sk)"><rect x="272" y="238" width="96" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">m = y</text>
  <path d="M 320 270 L 320 282" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- D3: m <= V ? -->
  <g filter="url(#sk)"><polygon points="320,286 404,312 320,338 236,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">m ≤ V ?</text>
  <path d="M 236 312 L 135 312 L 135 216" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="196" y="304" text-anchor="middle" font-size="10.5" fill="#666">否（内层结束）</text>
  <path d="M 320 338 L 320 350" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="330" y="348" font-size="10.5" fill="#666">是</text>

  <!-- D4: exists[m] 且未标记? -->
  <g filter="url(#sk)"><polygon points="320,354 442,384 320,414 198,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">exists[m] 且</text>
  <text x="320" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">best[m] 未标记 ?</text>
  <path d="M 442 384 L 468 384" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="455" y="376" text-anchor="middle" font-size="10.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="472" y="360" width="124" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="534" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">best[m] = y</text>
  <text x="534" y="397" text-anchor="middle" font-size="9" fill="#555">升序 ⇒ 首个命中即最小</text>
  <path d="M 534 406 L 534 453 L 406 453" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <path d="M 198 384 L 198 453 L 234 453" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="190" y="376" text-anchor="end" font-size="10.5" fill="#666">否</text>

  <!-- m += y -->
  <g filter="url(#sk)"><rect x="240" y="436" width="164" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="322" y="457" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">m += y</text>
  <path d="M 322 470 L 322 494 L 614 494 L 614 312 L 410 312" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>

  <!-- 底部注释 -->
  <text x="320" y="530" text-anchor="middle" font-size="11" fill="#888">内层总迭代 ≤ Σ&#8202;<tspan font-size="10">y∈S</tspan>&#8202;V/y = O(V ln V) ≈ 1.2×10⁶（调和级数，同埃氏筛）</text>
  <text x="320" y="548" text-anchor="middle" font-size="10.5" fill="#888">只有 exists[y] 为真的源值才进入内层，重复元素天然去重</text>
</svg>
