<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">为什么「段内任意置换」成立，而元素跨不过段边界</text>
  <rect x="40" y="52" width="240" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="74" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">段内：相邻交换可任意重排</text>
  <rect x="60" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86.0" y="113.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="122" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148.0" y="113.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="184" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210.0" y="113.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <path d="M130,140 L172,140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M192,140 L150,140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">任取两元素反复相邻交换即可互换</text>
  <rect x="292" y="52" width="228" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="74" text-anchor="middle" font-size="11.5" fill="#7a3030" font-weight="bold" filter="url(#rough2)">跨段：交换不改变位置的 popcount</text>
  <rect x="312" y="88" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338.0" y="113.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <path d="M370,84 L370,134" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="378" y="88" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404.0" y="113.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">30</text>
  <text x="364" y="160" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1 个 1</text>
  <text x="406" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4 个 1</text>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一次操作只交换相邻两个 popcount 相同的元素 → 位置上的 popcount 永远不变</text>
  <rect x="50" y="214" width="460" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">所以元素只能在它所属的那一段里活动 → 每段独立排序即可</text>
  <rect x="50" y="268" width="460" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="295" text-anchor="middle" font-size="11.5" fill="#1c3a1c" filter="url(#rough2)">实现上无需真排序：只要比较相邻两段的 max 与 min</text>
</svg>
