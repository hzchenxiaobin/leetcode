<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">同一道题的三条路：二分阈值、泛洪判定、按高度激活</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">水位 T 越大，可行格子集合 S_T 只增不减，所以「能否到达」关于 T 单调</text>

  <text x="56" y="74" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">① 单调性 → 二分答案</text>

  <path d="M 56 196 L 282 196" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 56 196 L 56 92" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="200" font-size="10" fill="#666" filter="url(#rough2)">T</text>
  <text x="60" y="100" font-size="9.5" fill="#666" filter="url(#rough2)">可达规模</text>

  <path d="M 56 190 L 104 190 L 104 178 L 136 178 L 136 162 L 168 162 L 168 146 L 190 146 L 190 124 L 240 124 L 240 108 L 272 108"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 190 196 L 190 112" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="194" y="112" font-size="9.5" fill="#b85450" filter="url(#rough2)">T* = 答案</text>
  <text x="70" y="184" font-size="9" fill="#8a5a86" filter="url(#rough2)">否</text>
  <text x="238" y="184" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <text x="62" y="224" font-size="9.5" fill="#666" filter="url(#rough2)">T ≥ T* 时连通，T &lt; T* 时必不连通</text>

  <rect x="300" y="80" width="264" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="100" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">② 定界</text>
  <text x="314" y="116" font-size="10" fill="#4a5a74" filter="url(#rough2)">lo = max(h(S), h(E))，hi = n² − 1</text>

  <path d="M 432 124 L 432 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="136" width="264" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="156" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">③ 二分 mid = (lo + hi) / 2</text>
  <text x="314" y="172" font-size="10" fill="#7a6220" filter="url(#rough2)">判 check(mid)：T = mid 时能否到终点</text>

  <path d="M 432 180 L 432 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="192" width="264" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="314" y="212" font-size="10.5" font-weight="bold" fill="#33552a" filter="url(#rough2)">④ 能到 → hi = mid；否则 lo = mid + 1</text>
  <text x="314" y="228" font-size="10" fill="#3a5a30" filter="url(#rough2)">lo == hi 时即为最小可行水位</text>

  <text x="40" y="262" font-size="11" font-weight="bold" fill="#444" filter="url(#rough2)">⑤ 三种实现的复杂度对比（n ≤ 50，格子数 n² ≤ 2500）</text>

  <rect x="40" y="272" width="170" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">Dijkstra（max 松弛）</text>
  <text x="125" y="316" text-anchor="middle" font-size="10" fill="#4a5a74" filter="url(#rough2)">O(n² log n)</text>

  <rect x="220" y="272" width="170" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">二分 + 泛洪 check</text>
  <text x="305" y="316" text-anchor="middle" font-size="10" fill="#7a6220" filter="url(#rough2)">O(n² log n)</text>

  <rect x="400" y="272" width="164" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="482" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33552a" filter="url(#rough2)">并查集按高度激活</text>
  <text x="482" y="316" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">O(n² α(n²))</text>

  <rect x="40" y="346" width="524" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="10" fill="#7a2f2c" filter="url(#rough2)">check(T)：从起点做一次 BFS/DFS，只走 h ≤ T 的格子，恰好 O(n²)；二分 O(log n²) 轮。</text>
  <text x="56" y="386" font-size="10" fill="#7a2f2c" filter="url(#rough2)">并查集版把格子按高度升序逐个激活并合并四邻，起点与终点首次连通时的那个高度就是答案。</text>
</svg>
