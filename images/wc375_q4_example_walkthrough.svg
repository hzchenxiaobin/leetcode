<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [2,1,2,3,3,4,5,4] → 3 块、2 个自由间隙、答案 4</text>
  <path d="M 150 36 Q 470 45 790 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top array strip -->
  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="184" y="58" filter="url(#sk)">0</text><text x="256" y="58" filter="url(#sk)">1</text>
    <text x="328" y="58" filter="url(#sk)">2</text><text x="400" y="58" filter="url(#sk)">3</text>
    <text x="472" y="58" filter="url(#sk)">4</text><text x="544" y="58" filter="url(#sk)">5</text>
    <text x="616" y="58" filter="url(#sk)">6</text><text x="688" y="58" filter="url(#sk)">7</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="64" width="68" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="184" y="84" fill="#2b6e9e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="222" y="64" width="68" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g><text x="256" y="84" fill="#2e6e2e" filter="url(#sk)">1</text>
    <g filter="url(#sk)"><rect x="294" y="64" width="68" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g><text x="328" y="84" fill="#2b6e9e" filter="url(#sk)">2</text>
    <g filter="url(#sk)"><rect x="366" y="64" width="68" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g><text x="400" y="84" fill="#7a5415" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="438" y="64" width="68" height="30" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g><text x="472" y="84" fill="#7a5415" filter="url(#sk)">3</text>
    <g filter="url(#sk)"><rect x="510" y="64" width="68" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g><text x="544" y="84" fill="#b85450" filter="url(#sk)">4</text>
    <g filter="url(#sk)"><rect x="582" y="64" width="68" height="30" rx="4" fill="#f0ede4" stroke="#999" stroke-width="1.5"/></g><text x="616" y="84" fill="#777" filter="url(#sk)">5</text>
    <g filter="url(#sk)"><rect x="654" y="64" width="68" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g><text x="688" y="84" fill="#b85450" filter="url(#sk)">4</text>
  </g>

  <!-- sweep table -->
  <g filter="url(#sk)"><rect x="70" y="108" width="800" height="244" rx="4" fill="#fdfcf7" stroke="#ccc" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="70" y="108" width="800" height="28" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
  <g font-size="11" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="90" y="126" filter="url(#sk)">i</text>
    <text x="160" y="126" filter="url(#sk)">nums[i]</text>
    <text x="280" y="126" filter="url(#sk)">last[nums[i]]</text>
    <text x="415" y="126" filter="url(#sk)">reach（处理后）</text>
    <text x="545" y="126" filter="url(#sk)">i == reach ?</text>
    <text x="740" y="126" filter="url(#sk)">事件</text>
  </g>
  <g stroke="#ddd" stroke-width="1" filter="url(#sk)">
    <path d="M 110 108 L 110 352"/><path d="M 210 108 L 210 352"/><path d="M 350 108 L 350 352"/>
    <path d="M 480 108 L 480 352"/><path d="M 610 108 L 610 352"/>
    <path d="M 70 163 L 870 163"/><path d="M 70 190 L 870 190"/><path d="M 70 217 L 870 217"/>
    <path d="M 70 244 L 870 244"/><path d="M 70 271 L 870 271"/><path d="M 70 298 L 870 298"/><path d="M 70 325 L 870 325"/>
  </g>
  <g filter="url(#sk)"><rect x="70" y="190" width="800" height="27" fill="#eaf6ee" opacity="0.85"/></g>
  <g filter="url(#sk)"><rect x="70" y="244" width="800" height="27" fill="#eaf6ee" opacity="0.85"/></g>
  <g filter="url(#sk)"><rect x="70" y="325" width="800" height="27" fill="#eaf6ee" opacity="0.85"/></g>

  <g font-size="11.5" text-anchor="middle">
    <g fill="#333">
      <text x="90" y="154" filter="url(#sk)">0</text><text x="160" y="154" fill="#2b6e9e" filter="url(#sk)">2</text><text x="280" y="154" filter="url(#sk)">2</text><text x="415" y="154" font-weight="bold" filter="url(#sk)">2</text>
      <text x="545" y="154" font-size="13" fill="#b85450" filter="url(#sk)">✗</text><text x="740" y="154" font-size="10.5" fill="#444" filter="url(#sk)">值 2 把 reach 拉到 2</text>

      <text x="90" y="181" filter="url(#sk)">1</text><text x="160" y="181" fill="#2e6e2e" filter="url(#sk)">1</text><text x="280" y="181" filter="url(#sk)">1</text><text x="415" y="181" font-weight="bold" filter="url(#sk)">2</text>
      <text x="545" y="181" font-size="13" fill="#b85450" filter="url(#sk)">✗</text><text x="740" y="181" font-size="10.5" fill="#444" filter="url(#sk)">1 ≤ 2，继续</text>

      <text x="90" y="208" filter="url(#sk)">2</text><text x="160" y="208" fill="#2b6e9e" filter="url(#sk)">2</text><text x="280" y="208" filter="url(#sk)">2</text><text x="415" y="208" font-weight="bold" filter="url(#sk)">2</text>
      <text x="545" y="208" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text><text x="740" y="208" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">块₁ 收口，间隙 A 可切 → ans=2</text>

      <text x="90" y="235" filter="url(#sk)">3</text><text x="160" y="235" fill="#7a5415" filter="url(#sk)">3</text><text x="280" y="235" filter="url(#sk)">4</text><text x="415" y="235" font-weight="bold" filter="url(#sk)">4</text>
      <text x="545" y="235" font-size="13" fill="#b85450" filter="url(#sk)">✗</text><text x="740" y="235" font-size="10.5" fill="#444" filter="url(#sk)">值 3 把 reach 拉到 4</text>

      <text x="90" y="262" filter="url(#sk)">4</text><text x="160" y="262" fill="#7a5415" filter="url(#sk)">3</text><text x="280" y="262" filter="url(#sk)">4</text><text x="415" y="262" font-weight="bold" filter="url(#sk)">4</text>
      <text x="545" y="262" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text><text x="740" y="262" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">块₂ 收口，间隙 B 可切 → ans=4</text>

      <text x="90" y="289" filter="url(#sk)">5</text><text x="160" y="289" fill="#b85450" filter="url(#sk)">4</text><text x="280" y="289" filter="url(#sk)">7</text><text x="415" y="289" font-weight="bold" filter="url(#sk)">7</text>
      <text x="545" y="289" font-size="13" fill="#b85450" filter="url(#sk)">✗</text><text x="740" y="289" font-size="10.5" fill="#444" filter="url(#sk)">值 4 把 reach 拉到 7</text>

      <text x="90" y="316" filter="url(#sk)">6</text><text x="160" y="316" fill="#777" filter="url(#sk)">5</text><text x="280" y="316" filter="url(#sk)">6</text><text x="415" y="316" font-weight="bold" filter="url(#sk)">7</text>
      <text x="545" y="316" font-size="13" fill="#b85450" filter="url(#sk)">✗</text><text x="740" y="316" font-size="10.5" fill="#444" filter="url(#sk)">5 ≤ 7，继续</text>

      <text x="90" y="343" filter="url(#sk)">7</text><text x="160" y="343" fill="#b85450" filter="url(#sk)">4</text><text x="280" y="343" filter="url(#sk)">7</text><text x="415" y="343" font-weight="bold" filter="url(#sk)">7</text>
      <text x="545" y="343" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text><text x="740" y="343" font-size="10.5" fill="#444" filter="url(#sk)">块₃ 收口（数组末尾，无间隙）</text>
    </g>
  </g>

  <!-- blocks strip -->
  <g filter="url(#sk)"><rect x="150" y="386" width="212" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="256" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">块₁ [0,2]</text>
  <text x="256" y="428" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{1,2}</text>

  <g filter="url(#sk)"><rect x="370" y="386" width="132" height="52" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="436" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">块₂ [3,4]</text>
  <text x="436" y="428" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{3}</text>

  <g filter="url(#sk)"><rect x="510" y="386" width="212" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="616" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">块₃ [5,7]</text>
  <text x="616" y="428" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">值{4,5}</text>

  <g font-size="10" fill="#b85450" opacity="0.7" text-anchor="middle">
    <text x="222" y="416" filter="url(#sk)">✗</text><text x="294" y="416" filter="url(#sk)">✗</text>
    <text x="438" y="416" filter="url(#sk)">✗</text><text x="582" y="416" filter="url(#sk)">✗</text><text x="654" y="416" filter="url(#sk)">✗</text>
  </g>

  <g filter="url(#sk)"><circle cx="366" cy="412" r="12" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="366" y="417" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="366" y="456" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">间隙A</text>
  <g filter="url(#sk)"><circle cx="506" cy="412" r="12" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="506" y="417" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="506" y="456" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">间隙B</text>

  <!-- result box -->
  <g filter="url(#sk)"><rect x="70" y="478" width="800" height="112" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <path d="M 540 490 L 540 578" stroke="#e0d5b8" stroke-width="1.2" filter="url(#sk)"/>
  <text x="300" y="510" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">m = 3 个块 ⇒ 可切间隙 c = m − 1 = 2</text>
  <text x="300" y="550" text-anchor="middle" font-size="17" font-weight="bold" fill="#b03a3a" filter="url(#sk)">答案 = 2<tspan dy="-8" font-size="11">c</tspan><tspan dy="8"> = 2² = 4</tspan></text>

  <text x="570" y="502" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">间隙集合 ⊆ {A, B}，逐一枚举：</text>
  <g font-size="10.5" fill="#444">
    <text x="570" y="524" filter="url(#sk)">∅ → [2,1,2,3,3,4,5,4]</text>
    <text x="570" y="544" filter="url(#sk)">{A} → [2,1,2] [3,3,4,5,4]</text>
    <text x="570" y="564" filter="url(#sk)">{B} → [2,1,2,3,3] [4,5,4]</text>
    <text x="570" y="584" filter="url(#sk)">{A,B} → [2,1,2] [3,3] [4,5,4]</text>
  </g>

  <text x="470" y="616" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">每行 O(1)：一次哈希查询 + 一次 max + 一次比较；整表 O(n)</text>
</svg>
