  <rect x="670" y="106" width="34" height="144" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>

  <text x="67" y="196" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="129" y="220" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="191" y="100" text-anchor="middle" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">14</text>
  <text x="253" y="196" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="315" y="172" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="377" y="112" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">13</text>
  <text x="439" y="160" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">9</text>
  <text x="501" y="184" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="563" y="148" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">10</text>
  <text x="625" y="196" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="687" y="124" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">12</text>

  <text x="67" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="129" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="191" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="253" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="315" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="377" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="439" y="270" text-anchor="middle" font-size="9.5" fill="#b8860b" filter="url(#rough2)">6</text>
  <text x="501" y="270" text-anchor="middle" font-size="9.5" fill="#b8860b" filter="url(#rough2)">7</text>
  <text x="563" y="270" text-anchor="middle" font-size="9.5" fill="#b8860b" filter="url(#rough2)">8</text>
  <text x="625" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="687" y="270" text-anchor="middle" font-size="9.5" fill="#b8860b" filter="url(#rough2)">10</text>

  <text x="67" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=2</text>
  <text x="129" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=1</text>
  <text x="191" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">dp=3</text>
  <text x="253" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=1</text>
  <text x="315" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=2</text>
  <text x="377" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=3</text>
  <text x="439" y="288" text-anchor="middle" font-size="9" fill="#b8860b" filter="url(#rough2)">dp=2</text>
  <text x="501" y="288" text-anchor="middle" font-size="9" fill="#b8860b" filter="url(#rough2)">dp=1</text>
  <text x="563" y="288" text-anchor="middle" font-size="9" fill="#b8860b" filter="url(#rough2)">dp=3</text>
  <text x="625" y="288" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">dp=1</text>
  <text x="687" y="288" text-anchor="middle" font-size="9" fill="#b8860b" filter="url(#rough2)">dp=4</text>

  <path d="M 687 100 Q 626 62 568 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrPath)" filter="url(#rough2)"/>
  <path d="M 558 124 Q 500 82 444 138" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrPath)" filter="url(#rough2)"/>
  <path d="M 437 136 Q 468 116 492 160" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrPath)" filter="url(#rough2)"/>

  <text x="380" y="322" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">dp[i] = 1 + max{ dp[j] }，j 取遍 i 两侧「距离 ≤ d 且中途都更矮」的位置</text>
  <text x="380" y="346" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">橙色路径：idx10（12）→ idx8（10）→ idx6（9）→ idx7（7），共 4 个下标，dp[10] = 4 即答案</text>
  <text x="380" y="370" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">对比：最高的 14 只有 dp = 3（14 → 8 → 6），因为一步之内最好的邻居 dp 仅 2</text>
</svg>
