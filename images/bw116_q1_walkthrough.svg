<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：nums = [1, 2, 1] → 六个子数组的不同计数平方和 = 15</text>

  <!-- 三角矩阵 -->
  <g filter="url(#rough2)">
    <text x="230" y="62" font-size="12.5" fill="#446688">右端固定 j，左端 i 从 j 往回</text>

    <!-- 行 j=0 -->
    <text x="70" y="94" font-size="12" fill="#555">j=0</text>
    <rect x="100" y="78" width="64" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="132" y="97" text-anchor="middle" font-size="11.5" fill="#333">[1] d=1</text>

    <!-- 行 j=1 -->
    <text x="70" y="130" font-size="12" fill="#555">j=1</text>
    <rect x="100" y="114" width="64" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="132" y="133" text-anchor="middle" font-size="11.5" fill="#333">[1,2] d=2</text>
    <rect x="172" y="114" width="56" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="200" y="133" text-anchor="middle" font-size="11.5" fill="#333">[2] d=1</text>

    <!-- 行 j=2 -->
    <text x="70" y="166" font-size="12" fill="#555">j=2</text>
    <rect x="100" y="150" width="78" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="139" y="169" text-anchor="middle" font-size="11.5" fill="#333">[1,2,1] d=2</text>
    <rect x="186" y="150" width="64" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="218" y="169" text-anchor="middle" font-size="11.5" fill="#333">[2,1] d=2</text>
    <rect x="258" y="150" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="286" y="169" text-anchor="middle" font-size="11.5" fill="#333">[1] d=1</text>

    <text x="230" y="204" font-size="12.5" fill="#555">逐行平方和：1 / (4+1) / (4+4+1)</text>
    <text x="230" y="226" font-size="13" fill="#b85450">总和 = 1 + 5 + 9 = 15</text>
    <text x="230" y="250" font-size="11.5" fill="#888">每行恰好是「右端 = j 的所有子数组」，与 D 数组一行的 d(l, j) 对应</text>
  </g>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="352" y="70" width="136" height="180" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="420" y="94" text-anchor="middle" font-size="12.5" fill="#b85450">规模对比</text>
    <text x="368" y="120" font-size="12" fill="#555">I：n ≤ 100</text>
    <text x="368" y="140" font-size="12" fill="#555">　暴力 O(n²)</text>
    <text x="368" y="164" font-size="12" fill="#555">II：n ≤ 10⁵</text>
    <text x="368" y="184" font-size="12" fill="#555">　必须 O(n log n)</text>
    <text x="368" y="208" font-size="12" fill="#555">答案取模 10⁹+7</text>
    <text x="368" y="232" font-size="11.5" fill="#888">两题接口同名 sumCounts</text>
  </g>
</svg>
