<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：每条查询，删掉开区间 (u, v) 内的所有存活点</text>

  <!-- start -->
  <rect x="110" y="44" width="220" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="63" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">读取下一条查询 [u, v]</text>
  <line x1="220" y1="74" x2="220" y2="90" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- locate -->
  <rect x="95" y="94" width="250" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">it ← A.lower_bound(u + 1)</text>
  <text x="220" y="134" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">（A 中第一个大于 u 的存活点）</text>
  <line x1="220" y1="144" x2="220" y2="162" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="220,164 330,210 220,256 110,210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="214" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">it 存在且 *it &lt; v ？</text>

  <!-- yes -> delete -->
  <text x="344" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="330" y1="210" x2="358" y2="210" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="362" y="186" width="142" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删除 *it</text>
  <text x="433" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">该点被新边 (u,v) 跳过</text>

  <!-- loop back -->
  <path d="M 433 184 C 433 156, 433 156, 250 156" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="352" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删完继续判断</text>

  <!-- no -> answer -->
  <text x="232" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <line x1="220" y1="256" x2="220" y2="284" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="288" width="280" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">answer ← |A| − 1</text>
  <text x="220" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（存活点数 − 1 = 最短路长度）</text>
  <line x1="220" y1="334" x2="220" y2="352" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- more queries? -->
  <polygon points="220,354 295,381 220,408 145,381" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="386" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">还有查询？</text>
  <text x="98" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 145 381 C 58 381, 58 59, 104 59" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="308" y="373" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <line x1="295" y1="381" x2="322" y2="381" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="365" width="110" height="32" rx="8" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="385" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">返回 answer</text>

  <!-- note 1 -->
  <rect x="364" y="88" width="140" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A：存活点集合</text>
  <text x="434" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 当前最短路的</text>
  <text x="434" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">顶点序列（有序）</text>

  <!-- note 2 -->
  <rect x="364" y="288" width="140" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">零特判！</text>
  <text x="434" y="318" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">(u,v) 被大边包含时</text>
  <text x="434" y="332" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">开区间内没有存活点</text>
  <text x="434" y="346" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">循环自动空转，</text>
  <text x="434" y="360" text-anchor="middle" font-size="10.5" fill="#a07820" filter="url(#rough2)">answer 自动不变</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="30" y="424" width="460" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="442" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">均摊：每个点至多被删除一次 ⇒ 删除总量 O(n)，再加每条查询的定位</text>
  <text x="260" y="460" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">总计 O((n + q) log n) —— 并查集跳点变体可压到近线性</text>
</svg>
