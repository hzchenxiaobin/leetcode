<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">前缀和窗口：把 O(i) 求和降为 O(1)</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 n = 4、i = 4 为例，上一行是 dp[3] = [1, 2, 2, 1, 0, 0, 0, 0]</text>

  <!-- dp[3] 行 -->
  <text x="96" y="74" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">上一行 dp[i−1] = dp[3]</text>
  <g filter="url(#rough2)">
    <rect x="96" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="154" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="212" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="270" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="328" y="86" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="386" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="444" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="502" y="86" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="121" y="109" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="179" y="109" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="237" y="109" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="295" y="109" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="353" y="109" text-anchor="middle" font-size="12" fill="#3a4a66">0</text>
    <text x="411" y="109" text-anchor="middle" font-size="12" fill="#3a5a30">0</text>
    <text x="469" y="109" text-anchor="middle" font-size="12" fill="#3a5a30">0</text>
    <text x="527" y="109" text-anchor="middle" font-size="12" fill="#3a5a30">0</text>
    <text x="121" y="140" text-anchor="middle" font-size="9.5" fill="#999">j=0</text>
    <text x="179" y="140" text-anchor="middle" font-size="9.5" fill="#999">1</text>
    <text x="237" y="140" text-anchor="middle" font-size="9.5" fill="#999">2</text>
    <text x="295" y="140" text-anchor="middle" font-size="9.5" fill="#999">3</text>
    <text x="353" y="140" text-anchor="middle" font-size="9.5" fill="#999">4</text>
    <text x="411" y="140" text-anchor="middle" font-size="9.5" fill="#999">5</text>
    <text x="469" y="140" text-anchor="middle" font-size="9.5" fill="#999">6</text>
    <text x="527" y="140" text-anchor="middle" font-size="9.5" fill="#999">7</text>
  </g>

  <rect x="150" y="80" width="232" height="48" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="266" y="58" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">窗口 [j−i+1, j] = [1, 4]</text>

  <!-- 箭头 -->
  <path d="M 330 148 L 330 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="165" font-size="10" fill="#666" filter="url(#rough2)">窗口和 2 + 2 + 1 + 0 = 5，写入 dp[4][4]</text>

  <!-- dp[4] 行 -->
  <text x="96" y="190" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">当前行 dp[4]（橙色是刚算出的新值）</text>
  <g filter="url(#rough2)">
    <rect x="96" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="154" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="212" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="270" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="328" y="200" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="386" y="200" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="444" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="502" y="200" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="121" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="179" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">3</text>
    <text x="237" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">5</text>
    <text x="295" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">6</text>
    <text x="353" y="223" text-anchor="middle" font-size="12" fill="#8a6a20">5</text>
    <text x="411" y="223" text-anchor="middle" font-size="12" fill="#8a6a20">3</text>
    <text x="469" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="527" y="223" text-anchor="middle" font-size="12" fill="#3a5a30">0</text>
  </g>
  <text x="96" y="256" font-size="10" fill="#666" filter="url(#rough2)">右移一格：dp[4][5] = dp[4][4] + dp[3][5] − dp[3][1] = 5 + 0 − 2 = 3</text>

  <rect x="62" y="270" width="536" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="294" font-size="11.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">增量式：dp[i][j] = dp[i][j−1] + dp[i−1][j] − dp[i−1][j−i]</text>
  <text x="80" y="316" font-size="10.5" fill="#555" filter="url(#rough2)">其中最后一项仅在 j ≥ i 时扣除；j &lt; i 时窗口未满 i 格，无需弹出左端</text>

  <text x="330" y="356" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每格 O(1) 更新，整表 O(nk)：n = k = 1000 时约 10⁶ 次运算</text>
  <text x="330" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意减法可能为负：C++ 需先加 MOD 再取模，Python 的 % 天然非负</text>
</svg>
