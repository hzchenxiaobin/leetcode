<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#b85450" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：dp[i] 依赖窗口 [i−k, i−1] 内 dp 的最大值</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">把 Kadane 的「续接前一位」推广为「续接窗口内最优前驱」（示例 3，k = 2，当前 i = 3）</text>

  <g filter="url(#rough2)">
    <text x="202" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a">窗口 [i−k, i−1] = [1, 2]</text>
    <text x="308" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">↓ i = 3</text>

    <text x="56" y="104" text-anchor="end" font-size="12" fill="#666">nums</text>
    <rect x="64" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660">10</text>
    <rect x="136" y="82" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="164" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424">−2</text>
    <rect x="208" y="82" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="236" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424">−10</text>
    <rect x="280" y="82" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="308" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">−5</text>
    <rect x="352" y="82" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="380" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660">20</text>

    <text x="92" y="130" text-anchor="middle" font-size="11" fill="#888">0</text>
    <text x="164" y="130" text-anchor="middle" font-size="11" fill="#888">1</text>
    <text x="236" y="130" text-anchor="middle" font-size="11" fill="#888">2</text>
    <text x="308" y="130" text-anchor="middle" font-size="11" fill="#888">3</text>
    <text x="380" y="130" text-anchor="middle" font-size="11" fill="#888">4</text>

    <rect x="130" y="74" width="144" height="54" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>

    <text x="56" y="174" text-anchor="end" font-size="12" fill="#666">dp</text>
    <rect x="64" y="152" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a4660">10</text>
    <rect x="136" y="152" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="164" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424">8</text>
    <rect x="208" y="152" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="236" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5424">0</text>
    <rect x="280" y="152" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="308" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">3</text>
    <rect x="352" y="152" width="56" height="34" fill="none" stroke="#bbb" stroke-width="1.3" stroke-dasharray="5,4" rx="4"/>
    <text x="380" y="174" text-anchor="middle" font-size="12" fill="#aaa">…</text>
  </g>

  <path d="M 164,190 C 190,218 258,218 301,191" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 236,190 C 252,210 274,210 301,192" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a" filter="url(#rough2)">best = max(0, dp[1], dp[2]) = 8</text>

  <text x="420" y="164" font-size="12.5" font-weight="bold" fill="#b07818" filter="url(#rough2)">dp[3] = −5 + 8 = 3</text>
  <text x="420" y="182" font-size="10" fill="#888" filter="url(#rough2)">接最优前驱，跳过 −10</text>

  <g filter="url(#rough2)">
    <rect x="40" y="248" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="280" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">dp[i] = nums[i] + max( 0 , 窗口 [i−k, i−1] 内 dp 的最大值 )</text>
    <text x="280" y="288" text-anchor="middle" font-size="10" fill="#555">max(0, ·)：窗口最优前驱为负时，从 nums[i] 单开一段（子序列非空）</text>

    <rect x="40" y="314" width="238" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="159" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">① 单调队列维护窗口 max</text>
    <text x="159" y="354" text-anchor="middle" font-size="10.5" fill="#444">与 239. 滑动窗口最大值同构</text>
    <text x="159" y="370" text-anchor="middle" font-size="10.5" fill="#444">维护对象 nums → dp，均摊 O(1)</text>

    <rect x="294" y="314" width="226" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="407" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">② k = 1 ⇒ 退化为 Kadane</text>
    <text x="407" y="354" text-anchor="middle" font-size="10.5" fill="#555">步长 ≤ 1 强制连续</text>
    <text x="407" y="370" text-anchor="middle" font-size="10.5" fill="#555">即 53. 最大子数组和</text>
  </g>
</svg>
