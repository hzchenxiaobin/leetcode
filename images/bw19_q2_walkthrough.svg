<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 走查：k = 3，threshold = 4 ⇔ 窗口和 ≥ 12</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <rect x="40" y="52" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="70" y="72">起点 i</text>
    <rect x="100" y="52" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="200" y="72">窗口内容</text>
    <rect x="300" y="52" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="345" y="72">和</text>
    <rect x="390" y="52" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="455" y="72">和 ≥ 12 ?</text>
  </g>

  <!-- 六行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="86" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="86" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="300" y="86" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="390" y="86" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="70" y="106">0</text><text x="200" y="106">[2, 2, 2]</text><text x="345" y="106">6</text><text x="455" y="106" fill="#b85450">✗</text>

    <rect x="40" y="118" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="118" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="300" y="118" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="390" y="118" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="70" y="138">1</text><text x="200" y="138">[2, 2, 2]</text><text x="345" y="138">6</text><text x="455" y="138" fill="#b85450">✗</text>

    <rect x="40" y="150" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="150" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="300" y="150" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="390" y="150" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="70" y="170">2</text><text x="200" y="170">[2, 2, 5]</text><text x="345" y="170">9</text><text x="455" y="170" fill="#b85450">✗</text>

    <rect x="40" y="182" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="182" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="300" y="182" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="390" y="182" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="70" y="202">3</text><text x="200" y="202">[2, 5, 5]</text><text x="345" y="202">12</text><text x="455" y="202" fill="#2d5a22" font-weight="bold">✓ 均值 4</text>

    <rect x="40" y="214" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="214" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="300" y="214" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="390" y="214" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="70" y="234">4</text><text x="200" y="234">[5, 5, 5]</text><text x="345" y="234">15</text><text x="455" y="234" fill="#2d5a22" font-weight="bold">✓ 均值 5</text>

    <rect x="40" y="246" width="60" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="100" y="246" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="300" y="246" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <rect x="390" y="246" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="70" y="266">5</text><text x="200" y="266">[5, 5, 8]</text><text x="345" y="266">18</text><text x="455" y="266" fill="#2d5a22" font-weight="bold">✓ 均值 6</text>
  </g>

  <!-- 滑动示意 -->
  <path d="M 120 290 C 160 320, 360 320, 420 290" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">窗口从左往右逐格滑动，和的更新只与两端元素有关</text>

  <rect x="90" y="348" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">满足条件的窗口共 3 个 → 返回 3</text>
</svg>
