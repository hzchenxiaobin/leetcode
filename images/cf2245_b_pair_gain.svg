<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">配对到底赚了多少：一次配对 vs 两次单删</text>
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">记 g_i = c − a_i，则配对 (x, y) 的净收益 = c − min(x, y) = max(g_x, g_y)</text>

  <rect x="240" y="78" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="107" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="272" y="70" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">x</text>
  <rect x="376" y="78" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="107" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">9</text>
  <text x="408" y="70" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">y</text>
  <text x="340" y="107" text-anchor="middle" font-size="14" fill="#3a3a3a" filter="url(#rough2)">,</text>
  <rect x="500" y="86" width="120" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="106" text-anchor="middle" font-size="12.5" fill="#8a6d20" filter="url(#rough2)">操作费 c = 5</text>

  <rect x="36" y="146" width="286" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="172" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">两次单删（2 次操作）</text>
  <text x="56" y="197" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">得分 = 3 + 9 − 2 × 5 = 2</text>
  <text x="56" y="220" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">两个值都拿到，但付了两次 c</text>

  <rect x="358" y="146" width="286" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="172" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">一次配对（1 次操作）</text>
  <text x="378" y="197" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">得分 = max(3, 9) − 5 = 4</text>
  <text x="378" y="220" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">丢掉较小的值，只付一次 c</text>

  <path d="M 322 194 L 352 194" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="36" y="258" width="608" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="284" text-anchor="start" font-size="12.5" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">收益差 = 4 − 2 = 2 = c − min(x, y) = 5 − 3</text>
  <text x="56" y="308" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">换一种写法：g_x = 5 − 3 = 2，g_y = 5 − 9 = −4 ⇒ max(g_x, g_y) = 2 ✓</text>
  <text x="56" y="332" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">所以配对 = 「丢掉 min、换回一次 c」：g 大的元素留下来当吸收者，g 小的被吸收</text>
  <text x="56" y="356" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">每个元素只能被用一次：吸收者与被吸收者必须是两批不相交的元素</text>
</svg>
