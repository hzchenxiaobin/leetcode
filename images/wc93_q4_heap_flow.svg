<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">扫描加油站 + 大顶堆记录「路过未加」的油</text>

  <rect x="160" y="52" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">fuel = startFuel，prev = 0，ans = 0</text>

  <path d="M310 94 L310 118" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="160" y="120" width="300" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="146" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">取下一个站 (pos, gas)</text>

  <path d="M310 162 L310 186" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="160" y="188" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="213" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">fuel −= pos − prev（开过去）</text>

  <path d="M310 228 L310 252" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="310,254 470,290 310,326 150,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="295" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">fuel &lt; 0 ？</text>

  <!-- 是 -->
  <path d="M470 290 L540 290 L540 340" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="500" y="282" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="430" y="342" width="180" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="520" y="364" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">弹堆顶加油，ans++</text>
  <text x="520" y="386" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">堆空仍 &lt; 0 ⇒ 返回 −1</text>

  <path d="M520 402 L520 412 L120 412 L120 290 L150 290" stroke="#b85450" stroke-width="1.4"
        fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="300" y="408" font-size="10" fill="#8d3b37" filter="url(#rough2)">补完再判断</text>

  <!-- 否 -->
  <path d="M150 290 L80 290 L80 340" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="104" y="282" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="10" y="342" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="85" y="364" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">gas 入堆（先不加）</text>
  <text x="85" y="386" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">prev = pos，继续下一个</text>
</svg>
