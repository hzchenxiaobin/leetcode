  <rect x="302" y="64" width="96" height="24" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="64" width="104" height="24" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="64" width="186" height="24" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">回合</text>
  <text x="137" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">投石者</text>
  <text x="237" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">砸中的山</text>
  <text x="350" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">Bea 山脉</text>
  <text x="452" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">Ver 山脉</text>
  <text x="599" y="80" text-anchor="middle" font-size="10" fill="#445" filter="url(#rough2)">备注</text>

  <!-- 第 1 行 -->
  <rect x="40" y="90" width="60" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="90" width="70" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="90" width="126" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
