  <text x="237" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b_1: 3 → 2</text>
  <text x="350" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="452" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2, 1]</text>
  <text x="599" y="153" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 4 行 -->
  <rect x="40" y="162" width="60" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="162" width="70" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="162" width="126" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="162" width="96" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="162" width="104" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="162" width="186" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="177" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">4</text>
  <text x="137" y="177" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">Ver</text>
  <text x="237" y="177" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a_1: 3 → 2</text>
  <text x="350" y="177" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="452" y="177" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2, 1]</text>
  <text x="599" y="177" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 5 行 -->
  <rect x="40" y="186" width="60" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="186" width="70" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="186" width="126" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="186" width="96" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="186" width="104" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="186" width="186" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="201" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="137" y="201" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">Bea</text>
  <text x="237" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b_1: 2 → 1</text>
  <text x="350" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[2]</text>
  <text x="452" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1, 1]</text>
  <text x="599" y="201" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 6 行 -->
  <rect x="40" y="210" width="60" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="210" width="70" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="210" width="126" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="210" width="96" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="210" width="104" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="210" width="186" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="225" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">6</text>
  <text x="137" y="225" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">Ver</text>
  <text x="237" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a_1: 2 → 1</text>
  <text x="350" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="452" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1, 1]</text>
  <text x="599" y="225" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 7 行 -->
  <rect x="40" y="234" width="60" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="234" width="70" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="234" width="126" height="22" fill="#fff8e1" stroke="#e5cf9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="234" width="96" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="234" width="104" height="22" fill="#fff8e1" stroke="#e5cf9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="234" width="186" height="22" fill="#fff8e1" stroke="#e5cf9a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="249" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">7</text>
  <text x="137" y="249" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">Bea</text>
  <text x="237" y="249" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">b_1: 1 → 0</text>
  <text x="350" y="249" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="452" y="249" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">[0, 1]</text>
  <text x="599" y="249" text-anchor="middle" font-size="8.5" fill="#8a6a20" filter="url(#rough2)">b_1 归零，Ver 仍有 2 号山</text>

  <!-- 第 8 行 -->
  <rect x="40" y="258" width="60" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="258" width="70" height="22" fill="#e8f0fe" stroke="#b9cde0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="258" width="126" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="258" width="96" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="258" width="104" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="258" width="186" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="273" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">8</text>
  <text x="137" y="273" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">Ver</text>
  <text x="237" y="273" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">a_1: 1 → 0</text>
  <text x="350" y="273" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">[0]</text>
  <text x="452" y="273" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0, 1]</text>
  <text x="599" y="273" text-anchor="middle" font-size="8.5" fill="#8a3a36" filter="url(#rough2)">前无退路 → Bea 判负</text>

  <!-- 结论 -->
  <rect x="40" y="298" width="652" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="366" y="315" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">两边首座都是 4，可 Ver 多一座山：T_V = 5 &gt; T_A = 4</text>
  <text x="366" y="331" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">Bea 把 b_1 砸到 0 只用了 4 次，但 Ver 靠 2 号山多撑了一次</text>

  <text x="360" y="360" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">所以本题比的不是「谁的山更高」，而是「首座高度 + 山数」这个合成量</text>
  <text x="360" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意第 7 回合之后 Ver 脚下已是 0 高度，但前方还有山，因此不算输——这正是「翻越费」的来源</text>
</svg>
