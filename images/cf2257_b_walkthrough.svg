  <rect x="174" y="114" width="126" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="114" width="96" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
