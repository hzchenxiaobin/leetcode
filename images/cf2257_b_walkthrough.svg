<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">样例 3 走查：a = [4]（n = 1）、b = [4, 1]（m = 2）</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">T_A = 4 + 1 − 1 = 4 次，T_V = 4 + 2 − 1 = 5 次：Bea 先手也只砸得出 4 次</text>

  <!-- 表头 -->
  <rect x="40" y="64" width="60" height="24" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
