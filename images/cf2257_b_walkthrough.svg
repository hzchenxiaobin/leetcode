  <rect x="506" y="114" width="186" height="22" fill="#f2f7fc" stroke="#cfdde9" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="129" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">2</text>
  <text x="137" y="129" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">Ver</text>
  <text x="237" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">a_1: 4 → 3</text>
  <text x="350" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3]</text>
  <text x="452" y="129" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3, 1]</text>
  <text x="599" y="129" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

  <!-- 第 3 行 -->
  <rect x="40" y="138" width="60" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="138" width="70" height="22" fill="#fce4ec" stroke="#e0b4b0" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="174" y="138" width="126" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="302" y="138" width="96" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="138" width="104" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="506" y="138" width="186" height="22" fill="#fdf0f2" stroke="#e8cdd2" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="153" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">3</text>
