  <text x="70" y="105" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="137" y="105" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">Bea</text>
  <text x="237" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b_1: 4 → 3</text>
  <text x="350" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="452" y="105" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[3, 1]</text>
  <text x="599" y="105" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">—</text>

