<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 3：k 超过不同值个数，能取多少取多少</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="16" y="90" font-size="12" fill="#666">① 原数组 nums</text>
  <g filter="url(#sk)">
    <rect x="170" y="70" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="222" y="70" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="274" y="70" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="326" y="70" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="378" y="70" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="430" y="70" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 229 85 L 261 85" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 281 85 L 313 85" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 385 85 L 417 85" stroke="#b85450" stroke-width="1.8" fill="none"/>
    <path d="M 437 85 L 469 85" stroke="#b85450" stroke-width="1.8" fill="none"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="193" y="90" fill="#2b6e9e">1</text>
    <text x="245" y="90" fill="#8a3a36">1</text>
    <text x="297" y="90" fill="#8a3a36">1</text>
    <text x="349" y="90" fill="#2b6e9e">2</text>
    <text x="401" y="90" fill="#8a3a36">2</text>
    <text x="453" y="90" fill="#8a3a36">2</text>
  </g>

  <path d="M 323 106 L 323 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="16" y="150" font-size="12" fill="#666">② 去重</text>
  <g filter="url(#sk)">
    <rect x="276" y="130" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="328" y="130" width="46" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="299" y="150">1</text>
    <text x="351" y="150">2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="445" y="120" width="180" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="535" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">k = 6</text>
  <text x="535" y="170" text-anchor="middle" font-size="11" fill="#7a5415">不同值只有 2 个</text>
  <text x="535" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">→ 全部取！</text>

  <path d="M 323 166 L 323 184" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="16" y="212" font-size="12" fill="#666">③ 降序排序</text>
  <g filter="url(#sk)">
    <rect x="276" y="192" width="46" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="328" y="192" width="46" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2e6e2e">
    <text x="299" y="212">2</text>
    <text x="351" y="212">1</text>
  </g>

  <path d="M 323 228 L 323 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="250" width="310" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="325" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">返回 [2, 1]（严格递减），和 = 3 ✓</text>

  <text x="320" y="308" text-anchor="middle" font-size="12" fill="#666">正数 ⇒ 多取一个不同值，和就严格变大，能取尽取</text>
</svg>
