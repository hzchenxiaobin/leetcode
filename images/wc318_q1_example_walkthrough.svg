<svg xmlns="http://www.w3.org/2000/svg" width="660" height="392" viewBox="0 0 660 392" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="392" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：[2,2,2,2] —— 依次合并不连锁</text>
  <path d="M 160 40 Q 330 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row: original -->
  <text x="78" y="78" text-anchor="end" font-size="11" font-weight="bold" fill="#555">原始</text>
  <g filter="url(#sk)">
    <rect x="90" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="198" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="252" y="56" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="112" y="78" filter="url(#sk)">2</text><text x="166" y="78" filter="url(#sk)">2</text>
    <text x="220" y="78" filter="url(#sk)">2</text><text x="274" y="78" filter="url(#sk)">2</text>
  </g>
  <text x="312" y="78" font-size="10.5" fill="#888">n−1 = 3 步操作，依次执行</text>

  <!-- row: i=0 -->
  <text x="78" y="126" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=0</text>
  <g filter="url(#sk)">
    <rect x="90" y="104" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="144" y="104" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="198" y="104" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="252" y="104" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="126" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="166" y="126" fill="#b85450" filter="url(#sk)">0</text>
    <text x="220" y="126" fill="#333" filter="url(#sk)">2</text>
    <text x="274" y="126" fill="#333" filter="url(#sk)">2</text>
  </g>
  <text x="312" y="126" font-size="10.5" fill="#4a7a3a" font-weight="bold">2==2 → nums[0]=4, nums[1]=0</text>

  <!-- row: i=1 -->
  <text x="78" y="174" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=1</text>
  <g filter="url(#sk)">
    <rect x="90" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="144" y="152" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="198" y="152" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="252" y="152" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="174" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="166" y="174" fill="#b85450" filter="url(#sk)">0</text>
    <text x="220" y="174" fill="#333" filter="url(#sk)">2</text>
    <text x="274" y="174" fill="#333" filter="url(#sk)">2</text>
  </g>
  <text x="312" y="174" font-size="10.5" fill="#888">0≠2 → 跳过（零吸收，无需特判）</text>

  <!-- row: i=2 -->
  <text x="78" y="222" text-anchor="end" font-size="11" font-weight="bold" fill="#555">i=2</text>
  <g filter="url(#sk)">
    <rect x="90" y="200" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="144" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="198" y="200" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="222" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="166" y="222" fill="#b85450" filter="url(#sk)">0</text>
    <text x="220" y="222" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="274" y="222" fill="#b85450" filter="url(#sk)">0</text>
  </g>
  <text x="312" y="222" font-size="10.5" fill="#4a7a3a" font-weight="bold">2==2 → nums[2]=4, nums[3]=0</text>

  <!-- no-remerge annotation between i=2 and move-zero rows -->
  <path d="M 112 244 Q 166 264 220 244" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="166" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">×</text>
  <text x="240" y="260" font-size="10" fill="#b85450" font-weight="bold">两个 4 相等也不再合并</text>

  <!-- row: move zeros -->
  <text x="78" y="284" text-anchor="end" font-size="11" font-weight="bold" fill="#555">搬零</text>
  <g filter="url(#sk)">
    <rect x="90" y="262" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="144" y="262" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="198" y="262" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
    <rect x="252" y="262" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="112" y="284" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="166" y="284" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="220" y="284" fill="#888" filter="url(#sk)">0</text>
    <text x="274" y="284" fill="#888" filter="url(#sk)">0</text>
  </g>
  <text x="312" y="284" font-size="10.5" fill="#4a7a3a" font-weight="bold">非零保序前置，末尾补零</text>

  <!-- output badge -->
  <g filter="url(#sk)"><rect x="90" y="316" width="200" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="190" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">输出 [4,4,0,0] ✓</text>

  <!-- example 2 strip -->
  <g filter="url(#sk)"><rect x="330" y="312" width="300" height="56" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="480" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a5f14">对照示例 2：[0,1]</text>
  <text x="480" y="354" text-anchor="middle" font-size="10.5" fill="#a5844a">无合并可做，仅搬零 → [1,0]</text>
</svg>
