<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1, 0, 48, null, null, 12, 49]</text>

  <!-- 左：原树 -->
  <line x1="105" y1="101" x2="55" y2="134" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="101" x2="175" y2="134" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="175" y1="166" x2="150" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="175" y1="166" x2="230" y2="204" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="105" cy="85" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="#2f4a28" filter="url(#rough2)">1</text>
  <circle cx="55" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="55" y="155" text-anchor="middle" font-size="12" fill="#33445f" filter="url(#rough2)">0</text>
  <circle cx="175" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175" y="155" text-anchor="middle" font-size="12" fill="#33445f" filter="url(#rough2)">48</text>
  <circle cx="150" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#33445f" filter="url(#rough2)">12</text>
  <circle cx="230" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="225" text-anchor="middle" font-size="12" fill="#33445f" filter="url(#rough2)">49</text>

  <text x="140" y="262" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">中序遍历：0 → 1 → 12 → 48 → 49</text>

  <!-- 右：走查表 -->
  <rect x="282" y="64" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="303" y="83" text-anchor="middle" font-size="10.5" fill="#33445f" filter="url(#rough2)">步</text>
  <rect x="324" y="64" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="354" y="83" text-anchor="middle" font-size="10.5" fill="#33445f" filter="url(#rough2)">cur</text>
  <rect x="384" y="64" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="416" y="83" text-anchor="middle" font-size="10.5" fill="#33445f" filter="url(#rough2)">prev</text>
  <rect x="448" y="64" width="74" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="485" y="83" text-anchor="middle" font-size="10.5" fill="#33445f" filter="url(#rough2)">cur−prev</text>
  <rect x="522" y="64" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="546" y="83" text-anchor="middle" font-size="10.5" fill="#33445f" filter="url(#rough2)">ans</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="282" y="96" width="42" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="303" y="115" fill="#555">1</text>
    <rect x="324" y="96" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="354" y="115" fill="#555">0</text>
    <rect x="384" y="96" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="416" y="115" fill="#999">—</text>
    <rect x="448" y="96" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="485" y="115" fill="#999">—</text>
    <rect x="522" y="96" width="48" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="546" y="115" fill="#555">∞</text>

    <rect x="282" y="126" width="42" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="303" y="145" fill="#555">2</text>
    <rect x="324" y="126" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="354" y="145" fill="#555">1</text>
    <rect x="384" y="126" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="416" y="145" fill="#555">0</text>
    <rect x="448" y="126" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="485" y="145" fill="#3a5a30">1</text>
    <rect x="522" y="126" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="546" y="145" fill="#3a5a30">1</text>

    <rect x="282" y="156" width="42" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="303" y="175" fill="#555">3</text>
    <rect x="324" y="156" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="354" y="175" fill="#555">12</text>
    <rect x="384" y="156" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="416" y="175" fill="#555">1</text>
    <rect x="448" y="156" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="485" y="175" fill="#555">11</text>
    <rect x="522" y="156" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="546" y="175" fill="#3a5a30">1</text>

    <rect x="282" y="186" width="42" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="303" y="205" fill="#555">4</text>
    <rect x="324" y="186" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="354" y="205" fill="#555">48</text>
    <rect x="384" y="186" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="416" y="205" fill="#555">12</text>
    <rect x="448" y="186" width="74" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="485" y="205" fill="#555">36</text>
    <rect x="522" y="186" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="546" y="205" fill="#3a5a30">1</text>

    <rect x="282" y="216" width="42" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="303" y="235" fill="#555">5</text>
    <rect x="324" y="216" width="60" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="354" y="235" fill="#555">49</text>
    <rect x="384" y="216" width="64" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <text x="416" y="235" fill="#555">48</text>
    <rect x="448" y="216" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="485" y="235" fill="#3a5a30">1</text>
    <rect x="522" y="216" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="546" y="235" fill="#3a5a30">1</text>
  </g>

  <rect x="60" y="286" width="460" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="308" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">第一次访问没有 prev，跳过比较，只把 prev 设为 0；</text>
  <text x="78" y="326" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">之后依次得到 1−0=1、12−1=11、48−12=36、49−48=1；</text>
  <text x="78" y="344" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">ans 不断取 min：∞ → 1 → 1 → 1 → 1，最终答案 1；</text>
  <text x="78" y="362" font-size="10.5" fill="#666" filter="url(#rough2)">48 与 12 相差 36，而 0 与 1 只差 1 —— 跨项差不会更小。</text>
</svg>
