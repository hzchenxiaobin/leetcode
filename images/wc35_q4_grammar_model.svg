<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 434" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="434" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">合法片段 = 一棵标签树：括号匹配 + 两个特例</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个位置只有一种解释，扫描因此是确定性的</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="110" y="93" text-anchor="middle" font-size="12" fill="#3a4a66">&lt;TAG_NAME&gt;</text>

    <rect x="222" y="70" width="176" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="310" y="93" text-anchor="middle" font-size="12" fill="#8a6a20">TAG_CONTENT</text>

    <rect x="440" y="70" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="510" y="93" text-anchor="middle" font-size="12" fill="#3a4a66">&lt;/TAG_NAME&gt;</text>
  </g>

  <path d="M 182 88 L 216 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 88 L 434 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 108 L 310 124 L 140 124 L 140 136" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 108 L 310 136" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 108 L 310 124 L 480 124 L 480 136" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="52" y="138" width="176" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="140" y="160" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">文本 text</text>
    <text x="140" y="177" text-anchor="middle" font-size="10" fill="#555">任意字符，可为空</text>
    <text x="140" y="190" text-anchor="middle" font-size="10" fill="#555">但 &gt; 与 ] 都不触发解析</text>

    <rect x="232" y="138" width="156" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="310" y="160" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">嵌套标签</text>
    <text x="310" y="177" text-anchor="middle" font-size="10" fill="#555">整体必须同样合法</text>
    <text x="310" y="190" text-anchor="middle" font-size="10" fill="#555">名字必须配对</text>

    <rect x="392" y="138" width="176" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="480" y="160" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">cdata</text>
    <text x="480" y="177" text-anchor="middle" font-size="10" fill="#555">&lt;![CDATA[ … ]]&gt;</text>
    <text x="480" y="190" text-anchor="middle" font-size="10" fill="#555">内部一律当普通字符</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="216" width="252" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="68" y="238" font-size="11.5" fill="#8a3a36" font-weight="bold">名字规则（规则 3、6）</text>
    <text x="68" y="258" font-size="10.5" fill="#555">NAME 只含大写字母，且 1 ≤ |NAME| ≤ 9</text>
    <text x="68" y="275" font-size="10.5" fill="#555">&lt; 或 &lt;/ 之后到下一个 &gt; 的字符</text>
    <text x="68" y="292" font-size="10.5" fill="#555">全部当作 NAME，哪怕含空格 / ! / [</text>

    <rect x="322" y="216" width="246" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="338" y="238" font-size="11.5" fill="#3a4a66" font-weight="bold">包裹规则（规则 1、2、7）</text>
    <text x="338" y="258" font-size="10.5" fill="#555">code 必须整体等于一个闭合标签</text>
    <text x="338" y="275" font-size="10.5" fill="#555">cdata 只能在标签内部出现</text>
    <text x="338" y="292" font-size="10.5" fill="#555">结束标记取第一个 ]]&gt;</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="52" y="320" width="516" height="44" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="8"/>
    <text x="66" y="340" font-size="10.5" fill="#333">&lt;DIV&gt;hi&lt;![CDATA[&lt;Bad&gt;]]&gt;&lt;B&gt;x&lt;/B&gt;&lt;/DIV&gt;</text>
    <text x="66" y="356" font-size="10" fill="#4a7a3a">合法：cdata 里的 &lt;Bad&gt; 不被解析，B 正常配对</text>
  </g>

  <text x="310" y="386" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">反例：&lt;A&gt;&lt;B&gt;&lt;/A&gt;&lt;/B&gt; 交叉嵌套 ✗　　&lt;A&gt;&lt;/A&gt;x 根标签之外还有内容 ✗</text>
  <text x="310" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是「数括号」不够：还要管名字、根唯一性、以及 cdata 这个黑洞</text>
</svg>
