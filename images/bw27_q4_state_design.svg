<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态设计：两机器人同行同步下移，列对 (c1, c2) 唯一刻画局面</text>

  <!-- 网格 -->
  <g filter="url(#rough2)">
    <rect x="90" y="52" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="130" y="52" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="170" y="52" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="210" y="52" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>

    <rect x="90" y="92" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="130" y="92" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="170" y="92" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="210" y="92" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>

    <rect x="90" y="132" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="130" y="132" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="170" y="132" width="40" height="40" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="210" y="132" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="70" y="78" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R1</text>
  <text x="262" y="78" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">R2</text>
  <path d="M 110 96 Q 150 96 190 100" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 230 96 Q 210 110 190 114" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 190 136 Q 130 136 110 138" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 状态说明 -->
  <rect x="310" y="56" width="220" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="326" y="80" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[r][c1][c2] =</text>
  <text x="326" y="100" font-size="11.5" fill="#555" filter="url(#rough2)">两机器人都在第 r 行、</text>
  <text x="326" y="118" font-size="11.5" fill="#555" filter="url(#rough2)">分别位于 c1、c2 列时，</text>
  <text x="326" y="136" font-size="11.5" fill="#555" filter="url(#rough2)">从第 r 行摘到底的最大总数</text>
  <text x="326" y="156" font-size="11" fill="#b85450" filter="url(#rough2)">同行 → r 唯一，3 维足够</text>

  <!-- 转移 -->
  <text x="60" y="206" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">转移：下一行 c1′ ∈ {c1−1, c1, c1+1}，c2′ ∈ {c2−1, c2, c2+1}，共 3×3 = 9 种组合</text>
  <g filter="url(#rough2)">
    <rect x="80" y="222" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="160" y="222" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="240" y="222" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <text y="245" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">j1 = c1−1</tspan><tspan x="195">j1 = c1</tspan><tspan x="275">j1 = c1+1</tspan></text>

  <g filter="url(#rough2)">
    <rect x="80" y="266" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <rect x="160" y="266" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="240" y="266" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <text y="289" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="115">j2 = c2−1</tspan><tspan x="195">j2 = c2</tspan><tspan x="275">j2 = c2+1</tspan></text>

  <rect x="350" y="240" width="180" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="366" y="262" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">同行重合 c1 = c2 时：</text>
  <text x="366" y="282" font-size="11" fill="#555" filter="url(#rough2)">樱桃只算一次：</text>
  <text x="366" y="298" font-size="11" fill="#555" filter="url(#rough2)">gain = g[c1] 而非两份</text>

  <!-- 底部 -->
  <text x="60" y="340" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">初始 dp[0][0][cols−1] = 第 0 行两格之和；答案 = max dp[rows−1][·][·]</text>
  <text x="60" y="362" font-size="11" fill="#555" filter="url(#rough2)">两机器人每行同步走一步 → 永远同行，把「两条路径」压成一个 3 维状态（若可乱序则状态要带两行）</text>
</svg>
