<svg xmlns="http://www.w3.org/2000/svg" width="680" height="562" viewBox="0 0 680 562" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="562" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：固定左端点沿 Trie 链下行，新节点 ⟺ 新子数组</text>
  <path d="M 130 42 Q 340 52 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums row -->
  <text x="138" y="88" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="200" y="64" width="44" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="252" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="304" y="64" width="44" height="36" rx="4" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
    <rect x="356" y="64" width="44" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <rect x="408" y="64" width="44" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="222" y="88">2</text>
    <text x="274" y="88">3</text>
    <text x="326" y="88">3</text>
    <text x="378" y="88">2</text>
    <text x="430" y="88">2</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="222" y="114">下标 0</text>
    <text x="274" y="114">下标 1</text>
    <text x="326" y="114">下标 2</text>
    <text x="378" y="114">下标 3</text>
    <text x="430" y="114">下标 4</text>
  </g>
  <text x="478" y="88" font-size="11.5" fill="#2b6e9e">蓝格 = 可被 p=2 整除（共 3 个）</text>

  <!-- trie edges -->
  <g filter="url(#sk)" stroke-width="2" fill="none">
    <path d="M 340 160 L 185 218" stroke="#4a8edb"/>
    <path d="M 340 160 L 495 218" stroke="#c98a2b"/>
    <path d="M 185 218 L 110 276" stroke="#4a8edb"/>
    <path d="M 185 218 L 260 276" stroke="#b85450"/>
    <path d="M 110 276 L 110 334" stroke="#4a8edb"/>
    <path d="M 110 334 L 110 392" stroke="#4a8edb"/>
    <path d="M 110 392 L 110 450" stroke="#999" stroke-dasharray="5,4"/>
    <path d="M 495 218 L 440 276" stroke="#c98a2b"/>
    <path d="M 495 218 L 580 276" stroke="#4a8e4a"/>
    <path d="M 440 276 L 440 334" stroke="#c98a2b"/>
    <path d="M 440 334 L 440 392" stroke="#c98a2b"/>
    <path d="M 580 276 L 580 334" stroke="#4a8e4a"/>
  </g>

  <!-- root -->
  <g filter="url(#sk)">
    <ellipse cx="340" cy="160" rx="34" ry="20" fill="#f0ece3" stroke="#5a5a5a" stroke-width="1.6"/>
  </g>
  <text x="340" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">root</text>

  <!-- trie nodes -->
  <g filter="url(#sk)">
    <circle cx="185" cy="218" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <circle cx="495" cy="218" r="17" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="110" cy="276" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <circle cx="260" cy="276" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="440" cy="276" r="17" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="580" cy="276" r="17" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="110" cy="334" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <circle cx="440" cy="334" r="17" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="580" cy="334" r="17" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="110" cy="392" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
    <circle cx="440" cy="392" r="17" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="110" cy="450" r="17" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="4,3"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="185" y="223">2</text>
    <text x="495" y="223">3</text>
    <text x="110" y="281">3</text>
    <text x="260" y="281">2</text>
    <text x="440" y="281">3</text>
    <text x="580" y="281">2</text>
    <text x="110" y="339">3</text>
    <text x="440" y="339">2</text>
    <text x="580" y="339">2</text>
    <text x="110" y="397">2</text>
    <text x="440" y="397">2</text>
    <text x="110" y="455">2</text>
  </g>

  <!-- endpoint annotations -->
  <g font-size="10.5" font-family="monospace">
    <text x="140" y="396" fill="#2b6e9e">[2,3,3,2]</text>
    <text x="470" y="396" fill="#9a6a15">[3,3,2,2]</text>
    <text x="292" y="280" fill="#a04038">[2,2]</text>
    <text x="604" y="338" fill="#2e6e2e">[3,2,2]</text>
    <text x="140" y="454" fill="#777" font-family="'Comic Sans MS','Kaiti SC',楷体,cursive">cnt=3 &gt; k=2 → break</text>
  </g>
  <path d="M 296 172 Q 296 194 340 176" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="296" y="150" font-size="10.5" fill="#666">固定 l，r 每右移一格，node 下行一格</text>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="40" y="478" width="600" height="70" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="500" text-anchor="middle" font-size="12" fill="#333">root 到某节点的路径 = 一个子数组内容；再次走到已有节点时只「下行」不计数（每步 O(1)）</text>
  <g font-size="11">
    <circle cx="92" cy="519" r="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
    <text x="104" y="523" fill="#333">l=0 建 ×4</text>
    <circle cx="196" cy="519" r="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
    <text x="208" y="523" fill="#333">l=1 建 ×4</text>
    <circle cx="300" cy="519" r="6" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
    <text x="312" y="523" fill="#333">l=2 建 ×2</text>
    <circle cx="404" cy="519" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
    <text x="416" y="523" fill="#333">l=3 建 ×1</text>
    <circle cx="508" cy="519" r="6" fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="3,2" filter="url(#sk)"/>
    <text x="520" y="523" fill="#333">cnt 超限 break</text>
  </g>
  <text x="340" y="542" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">新节点总数 4 + 4 + 2 + 1 + 0 = 11 = 答案</text>
</svg>
