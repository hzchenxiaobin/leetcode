<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "1100101"（n = 7）→ 答案 5</text>
  <path d="M 190 38 Q 360 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#888">正向求 pre、反向求 suf，再按分割点 m 合并：ans = min(pre[m] + suf[m])</text>

  <!-- car row -->
  <g filter="url(#sk)">
    <rect x="228" y="72" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="272" y="72" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="316" y="72" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="360" y="72" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="404" y="72" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="448" y="72" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="492" y="72" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="248" y="94">1</text>
    <text x="292" y="94">1</text>
    <text x="336" y="94">0</text>
    <text x="380" y="94">0</text>
    <text x="424" y="94">1</text>
    <text x="468" y="94">0</text>
    <text x="512" y="94">1</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="248" y="120">下标 0</text>
    <text x="292" y="120">1</text>
    <text x="336" y="120">2</text>
    <text x="380" y="120">3</text>
    <text x="424" y="120">4</text>
    <text x="468" y="120">5</text>
    <text x="512" y="120">6</text>
  </g>

  <!-- highlight column m=2 -->
  <g filter="url(#sk)">
    <rect x="271" y="140" width="66" height="134" rx="6" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>

  <!-- header row: m -->
  <g font-size="11" font-weight="bold" fill="#999" text-anchor="middle">
    <text x="168" y="162">0</text>
    <text x="236" y="162">1</text>
    <text x="304" y="162">2</text>
    <text x="372" y="162">3</text>
    <text x="440" y="162">4</text>
    <text x="508" y="162">5</text>
    <text x="576" y="162">6</text>
    <text x="644" y="162">7</text>
  </g>
  <text x="130" y="162" text-anchor="end" font-size="11.5" font-weight="bold" fill="#777" filter="url(#sk)">分割点 m</text>

  <!-- pre row -->
  <g filter="url(#sk)">
    <rect x="141" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="209" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="277" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="345" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="413" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="481" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="549" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="617" y="178" width="54" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#33475e" text-anchor="middle">
    <text x="168" y="195">0</text>
    <text x="236" y="195">1</text>
    <text x="304" y="195">2</text>
    <text x="372" y="195">2</text>
    <text x="440" y="195">2</text>
    <text x="508" y="195">4</text>
    <text x="576" y="195">4</text>
    <text x="644" y="195">6</text>
  </g>
  <text x="130" y="195" text-anchor="end" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">pre[m]</text>

  <!-- suf row -->
  <g filter="url(#sk)">
    <rect x="141" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="209" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="277" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="345" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="413" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="481" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="549" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="617" y="210" width="54" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#8a6415" text-anchor="middle">
    <text x="168" y="227">7</text>
    <text x="236" y="227">5</text>
    <text x="304" y="227">3</text>
    <text x="372" y="227">3</text>
    <text x="440" y="227">3</text>
    <text x="508" y="227">1</text>
    <text x="576" y="227">1</text>
    <text x="644" y="227">0</text>
  </g>
  <text x="130" y="227" text-anchor="end" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">suf[m]</text>

  <!-- sum row -->
  <g filter="url(#sk)">
    <rect x="141" y="242" width="54" height="28" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.3"/>
    <rect x="209" y="242" width="54" height="28" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.3"/>
    <rect x="277" y="242" width="54" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="345" y="242" width="54" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="413" y="242" width="54" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="481" y="242" width="54" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="549" y="242" width="54" height="28" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="617" y="242" width="54" height="28" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="168" y="261" fill="#888">7</text>
    <text x="236" y="261" fill="#888">6</text>
    <text x="304" y="261" fill="#2e6e2e">5</text>
    <text x="372" y="261" fill="#2e6e2e">5</text>
    <text x="440" y="261" fill="#2e6e2e">5</text>
    <text x="508" y="261" fill="#2e6e2e">5</text>
    <text x="576" y="261" fill="#2e6e2e">5</text>
    <text x="644" y="261" fill="#888">6</text>
  </g>
  <text x="130" y="261" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">pre[m]+suf[m]</text>
  <text x="304" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">min = 5</text>

  <!-- explanation cards -->
  <g filter="url(#sk)">
    <rect x="36" y="302" width="196" height="88" rx="8" fill="#f2f6fb" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="134" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">pre[2] = 2</text>
  <text x="134" y="348" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">ℓ = 2：左弹 s[0]、s[1]</text>
  <text x="134" y="370" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">每辆 1，共 2（全直删则要 4）</text>

  <text x="247" y="352" text-anchor="middle" font-size="17" font-weight="bold" fill="#666" filter="url(#sk)">＋</text>

  <g filter="url(#sk)">
    <rect x="262" y="302" width="196" height="88" rx="8" fill="#fffaf0" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">suf[2] = 3</text>
  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">r = 6：右弹 s[6]（1）</text>
  <text x="360" y="370" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">＋ 直删 s[4]（2）</text>

  <text x="473" y="352" text-anchor="middle" font-size="17" font-weight="bold" fill="#666" filter="url(#sk)">＝</text>

  <g filter="url(#sk)">
    <rect x="488" y="302" width="196" height="88" rx="8" fill="#f4f9f4" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="586" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">合计 = 5</text>
  <text x="586" y="348" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">2 + 1 + 2 = 5</text>
  <text x="586" y="370" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">并列解：r = 4 时右弹 s[4..6] 也为 3</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="40" y="406" width="640" height="58" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="360" y="429" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">最优方案：左弹 2 次 ＋ 右弹 1 次 ＋ 直删 1 个 '1'，总代价 2 + 1 + 2 = 5</text>
  <text x="360" y="451" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">题面的另一方案「左弹 2 次 ＋ 右弹 3 次 = 5」即 ℓ=2, r=4，同样在 suf[2] 取到最小</text>
</svg>
