<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个观察：目标坍缩 · 乘积不变量 · 失配右推</text>

  <!-- 观察一：目标坍缩 -->
  <rect x="28" y="46" width="88" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">观察一</text>
  <text x="72" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">目标坍缩</text>

  <rect x="132" y="48" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="65" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">目标 A：全部变成 1</text>
  <rect x="132" y="78" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="95" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">目标 B：全部变成 −1</text>

  <text x="300" y="62" font-size="10.5" fill="#333" filter="url(#rough2)">值域只有 ±1，「全等」只有这两种形态；</text>
  <text x="300" y="80" font-size="10.5" fill="#333" filter="url(#rough2)">两个目标各算一遍最少操作数再取 min。</text>
  <text x="300" y="98" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">只算「变成多数派」是经典 WA！</text>

  <!-- 观察二：乘积不变量 -->
  <rect x="28" y="122" width="88" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="146" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">观察二</text>
  <text x="72" y="164" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">乘积不变量</text>

  <g filter="url(#rough2)">
    <rect x="132" y="132" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="172" y="132" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="151" y="151" text-anchor="middle" font-size="12" fill="#333">−1</text>
    <text x="191" y="151" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="127" y="127" width="90" height="38" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" rx="8"/>
    <path d="M 224 146 L 246 146" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="250" y="132" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="290" y="132" width="38" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="269" y="151" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="309" y="151" text-anchor="middle" font-size="12" fill="#333">−1</text>
  </g>

  <text x="344" y="140" font-size="10.5" fill="#333" filter="url(#rough2)">一次操作同时翻转两个元素，</text>
  <text x="344" y="158" font-size="10.5" fill="#333" filter="url(#rough2)">数组总乘积始终不变 ⇒</text>
  <text x="344" y="176" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">失配数必须为偶数，奇则无解</text>

  <!-- 观察三：失配右推 -->
  <rect x="28" y="198" width="88" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="222" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">观察三</text>
  <text x="72" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">失配右推</text>

  <text x="136" y="214" font-size="10.5" fill="#333" filter="url(#rough2)">左侧已对齐目标后，位置 i 的失配只能由「操作 i」修复——操作 i−1 会破坏</text>
  <text x="136" y="230" font-size="10.5" fill="#333" filter="url(#rough2)">已对齐的前缀，纯属浪费。操作 i 修好 i 的同时把失配连带推给 i+1：</text>
  <text x="136" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">失配像粒子向右漂移，每推一格花一次操作，</text>
  <text x="136" y="262" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">直到撞上下一个失配，双双湮灭 ✓</text>

  <!-- 配对示意 -->
  <text x="36" y="292" font-size="10.5" fill="#666" filter="url(#rough2)">失配配对示意（nums = [1, −1, 1, 1, −1, 1]，目标全 1）：</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="136" y="302" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="182" y="302" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="228" y="302" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="302" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="302" width="42" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="366" y="302" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="157" y="321" fill="#333">1</text>
    <text x="203" y="321" fill="#b85450" font-weight="bold">−1</text>
    <text x="249" y="321" fill="#333">1</text>
    <text x="295" y="321" fill="#333">1</text>
    <text x="341" y="321" fill="#b85450" font-weight="bold">−1</text>
    <text x="387" y="321" fill="#333">1</text>
  </g>

  <text x="157" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="203" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="249" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="295" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="341" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="387" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="203" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">p₁</text>
  <text x="341" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">p₂</text>

  <path d="M 203 298 Q 272 270 341 298" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="424" y="320" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ops = 4 − 1 = 3</text>

  <rect x="36" y="372" width="488" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">最少操作数 = (p₂ − p₁) + (p₄ − p₃) + …：相邻失配两两配对的距离之和</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">失配个数为奇数 ⇒ 乘积不变量被破坏 ⇒ 该目标不可达（记 ∞）</text>
</svg>
