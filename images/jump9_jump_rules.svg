<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">跳跃规则：向右只能落到「更小」，向左只能跳上「更大」</text>

  <!-- 规则面板 -->
  <rect x="40" y="44" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="68" text-anchor="middle" font-size="11" fill="#2f5d26" filter="url(#rough2)">向右跳（j &gt; i）：nums[j] &lt; nums[i]（放电）</text>
  <rect x="340" y="44" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="68" text-anchor="middle" font-size="11" fill="#9a7218" filter="url(#rough2)">向左跳（j &lt; i）：nums[j] &gt; nums[i]（充电）</text>

  <!-- 数组 [2,3,1] -->
  <rect x="195" y="150" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="184" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="220" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 0</text>
  <rect x="295" y="150" width="70" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#9a7218" filter="url(#rough2)">3</text>
  <text x="330" y="220" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 1</text>
  <rect x="395" y="150" width="70" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="220" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i = 2</text>

  <!-- 被禁止的直跳 -->
  <path d="M234,144 Q282,118 326,144" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">直接跳 0→1？需要 3 &lt; 2 ✗</text>

  <!-- ① 向右跳 -->
  <path d="M236,142 Q335,90 426,142" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="345" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 向右跳：1 &lt; 2 ✓</text>

  <!-- ② 向左跳 -->
  <path d="M424,206 Q378,258 336,206" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="380" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 向左跳：3 &gt; 1 ✓</text>

  <!-- 比喻框 -->
  <rect x="40" y="304" width="290" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">所在位置的值 = 弹弓高度</text>
  <text x="185" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向右「放电」：只能落到更小的值</text>
  <text x="185" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">向左「充电」：一步跳上前缀最大值</text>

  <!-- 结论框 -->
  <rect x="350" y="304" width="270" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d26" filter="url(#rough2)">从 0 出发：0 → 2 → 1</text>
  <text x="485" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">先向右绕过中间的 3，再向左跳上它</text>
  <text x="485" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans[0] = 3</text>
</svg>
