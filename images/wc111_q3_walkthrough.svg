<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">示例 "IDID" 的逐步填表</text>
  <rect x="20" y="44" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">步骤</text>
  <rect x="116" y="44" width="90" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">字符</text>
  <rect x="212" y="44" width="104" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">取 lo / hi</text>
  <rect x="322" y="44" width="102" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="63" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">lo, hi 更新</text>
  <rect x="20" y="74" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="116" y="74" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">I</text>
  <rect x="212" y="74" width="104" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">取 lo=0</text>
  <rect x="322" y="74" width="102" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="93" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">lo=1, hi=4</text>
  <rect x="20" y="108" width="90" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="116" y="108" width="90" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">D</text>
  <rect x="212" y="108" width="104" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">取 hi=4</text>
  <rect x="322" y="108" width="102" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="127" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">lo=1, hi=3</text>
  <rect x="20" y="142" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="116" y="142" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">I</text>
  <rect x="212" y="142" width="104" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">取 lo=1</text>
  <rect x="322" y="142" width="102" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="161" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">lo=2, hi=3</text>
  <rect x="20" y="176" width="90" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="116" y="176" width="90" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">D</text>
  <rect x="212" y="176" width="104" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">取 hi=3</text>
  <rect x="322" y="176" width="102" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="195" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">lo=2, hi=2</text>
  <rect x="20" y="210" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65.0" y="229" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">—</text>
  <rect x="116" y="210" width="90" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="161.0" y="229" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">结尾</text>
  <rect x="212" y="210" width="104" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="229" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">补上 lo=2</text>
  <rect x="322" y="210" width="102" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373.0" y="229" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">结束</text>
  <rect x="56" y="258" width="448" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">perm = [0, 4, 1, 3, 2]，与题面示例输出一致</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">校验：0<4>1<3>2，正好对应 I, D, I, D</text>
</svg>
