<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：交替目标只有两种，且逐位互补</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上框：约束传递 -->
  <g filter="url(#sk)">
    <rect x="50" y="54" width="540" height="148" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04348">约束传递：s[i] ≠ s[i+1]，定下 s[0]，整串被唯一锁定</text>

  <!-- 行 A：s[0]='0' -->
  <text x="118" y="116" text-anchor="end" font-size="13" fill="#a04348" font-weight="bold">s[0]='0' ⇒</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="130" y="96" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="180" y="96" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="230" y="96" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="280" y="96" width="36" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <text x="148" y="116" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="198" y="116" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="248" y="116" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="298" y="116" text-anchor="middle" fill="#2b6e9e">1</text>
  </g>
  <g font-size="11" fill="#999">
    <text x="173" y="116" text-anchor="middle">≠</text>
    <text x="223" y="116" text-anchor="middle">≠</text>
    <text x="273" y="116" text-anchor="middle">≠</text>
  </g>
  <text x="326" y="116" font-size="13" fill="#2b6e9e">…（目标 A）</text>

  <!-- 行 B：s[0]='1' -->
  <text x="118" y="152" text-anchor="end" font-size="13" fill="#a04348" font-weight="bold">s[0]='1' ⇒</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="130" y="132" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="180" y="132" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="230" y="132" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="280" y="132" width="36" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <text x="148" y="152" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="198" y="152" text-anchor="middle" fill="#2e6e2e">0</text>
    <text x="248" y="152" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="298" y="152" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>
  <g font-size="11" fill="#999">
    <text x="173" y="152" text-anchor="middle">≠</text>
    <text x="223" y="152" text-anchor="middle">≠</text>
    <text x="273" y="152" text-anchor="middle">≠</text>
  </g>
  <text x="326" y="152" font-size="13" fill="#2e6e2e">…（目标 B）</text>

  <!-- 右侧注 -->
  <text x="487" y="112" text-anchor="middle" font-size="12" fill="#a04348">候选目标只有 2 个，</text>
  <text x="487" y="130" text-anchor="middle" font-size="12" fill="#a04348">与长度 n 无关</text>
  <text x="320" y="190" text-anchor="middle" font-size="11.5" fill="#a04348">任何交替串必为 A 或 B 之一 —— 「枚举全部目标」只需比较两个候选</text>

  <!-- 下探箭头 -->
  <path d="M 320 202 L 320 226" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="336" y="220" font-size="12.5" fill="#3a3a3a" font-weight="bold">A 与 B 逐位相反：A[i] ≠ B[i]</text>

  <!-- 中框：逐位验证 -->
  <g filter="url(#sk)">
    <rect x="50" y="230" width="540" height="180" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">逐位验证（取 s = "0110"，n = 4）：每个位置恰与一个目标匹配</text>

  <!-- 行 A：0101，末两格红 -->
  <text x="100" y="285" text-anchor="end" font-size="13" fill="#2b6e9e" font-weight="bold">A =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="264" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="158" y="264" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="206" y="264" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="254" y="264" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="132" y="285" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="180" y="285" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="228" y="285" text-anchor="middle" fill="#a04348">0</text>
    <text x="276" y="285" text-anchor="middle" fill="#a04348">1</text>
  </g>
  <text x="314" y="285" font-size="12.5" fill="#a04348" font-weight="bold" font-family="monospace">diffA = 2（红格数）</text>

  <!-- 行 s：0110 -->
  <text x="100" y="323" text-anchor="end" font-size="13" fill="#333" font-weight="bold">s =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="302" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="158" y="302" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="206" y="302" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="254" y="302" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <text x="132" y="323" text-anchor="middle" fill="#333">0</text>
    <text x="180" y="323" text-anchor="middle" fill="#333">1</text>
    <text x="228" y="323" text-anchor="middle" fill="#333">1</text>
    <text x="276" y="323" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="314" y="323" font-size="12.5" fill="#333" font-weight="bold" font-family="monospace">n = 4</text>

  <!-- 行 B：1010，前两格红 -->
  <text x="100" y="361" text-anchor="end" font-size="13" fill="#2e6e2e" font-weight="bold">B =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="340" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="158" y="340" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="206" y="340" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="254" y="340" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <text x="132" y="361" text-anchor="middle" fill="#a04348">1</text>
    <text x="180" y="361" text-anchor="middle" fill="#a04348">0</text>
    <text x="228" y="361" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="276" y="361" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>
  <text x="314" y="361" font-size="12.5" fill="#a04348" font-weight="bold" font-family="monospace">diffB = 2（红格数）</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="110" y="384" width="16" height="13" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="132" y="395" font-size="11.5" fill="#555">红格 = 该位置与 s 不同（计入该目标的差异）</text>
  <text x="470" y="395" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">每列恰一个红格 ✓</text>

  <!-- 底部橙条 -->
  <g filter="url(#sk)">
    <rect x="50" y="422" width="540" height="46" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="441" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">每列恰贡献 1 ⇒ diffA + diffB = n</text>
  <text x="320" y="459" text-anchor="middle" font-size="12.5" fill="#7a5415">答案 = min(diffA, n − diffA)：一趟扫描 + 一次减法，无需两遍循环</text>
</svg>
