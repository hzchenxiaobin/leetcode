<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：[6,4,3,2,7,6,2] ⟶ [12,7,6]</text>

  <!-- 表格外框与表头 -->
  <rect x="36" y="48" width="648" height="314" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="37" y="49" width="646" height="33" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="54" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="94" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="258" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">gcd 检查 → 动作</text>
  <text x="542" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">栈（底 → 顶）</text>
  <path d="M 36 82 L 684 82" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 72 48 L 72 362" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 116 48 L 116 362" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 400 48 L 400 362" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 36 122 L 684 122" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 162 L 684 162" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 202 L 684 202" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 242 L 684 242" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 282 L 684 282" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 322 L 684 322" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- 第 7 行高亮 -->
  <rect x="38" y="323" width="644" height="38" fill="#fff8e1" opacity="0.85" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="54" y="105" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="94" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="124" y="105" font-size="10.5" fill="#555" filter="url(#rough2)">栈空，直接压入</text>
  <rect x="410" y="88" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 2 -->
  <text x="54" y="145" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="94" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="124" y="145" font-size="10.5" fill="#555" filter="url(#rough2)">gcd(6,4)=2&gt;1 → 弹出，x←lcm(6,4)=12；栈空</text>
  <rect x="410" y="128" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- 行 3 -->
  <text x="54" y="185" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="94" y="185" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="124" y="185" font-size="10.5" fill="#555" filter="url(#rough2)">gcd(12,3)=3&gt;1 → x←12；栈空，压入</text>
  <rect x="410" y="168" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- 行 4 -->
  <text x="54" y="225" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="94" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="124" y="225" font-size="10.5" fill="#555" filter="url(#rough2)">gcd(12,2)=2&gt;1 → x←12；栈空，压入</text>
  <rect x="410" y="208" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>

  <!-- 行 5 -->
  <text x="54" y="265" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="94" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="124" y="265" font-size="10.5" fill="#555" filter="url(#rough2)">gcd(12,7)=1 → 互质边界，直接压入</text>
  <rect x="410" y="248" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <rect x="456" y="248" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <!-- 行 6 -->
  <text x="54" y="305" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="94" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="124" y="305" font-size="10.5" fill="#555" filter="url(#rough2)">gcd(7,6)=1 → 直接压入</text>
  <rect x="410" y="288" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <rect x="456" y="288" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="502" y="288" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="522" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 行 7（级联，高亮） -->
  <text x="54" y="345" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="94" y="345" text-anchor="middle" font-size="11.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="124" y="345" font-size="10.5" fill="#a08030" filter="url(#rough2)">gcd(6,2)=2&gt;1 → x←6；再查 gcd(7,6)=1，级联停止</text>
  <rect x="410" y="328" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <rect x="456" y="328" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="502" y="328" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="522" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 底部结论 -->
  <rect x="36" y="374" width="648" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="400" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">最终栈 = [12, 7, 6]：相邻两两互质，无任何可合并对 —— 即唯一终态</text>
</svg>
