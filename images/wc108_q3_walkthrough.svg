<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 326"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="326" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：[[2,1,3],[6,5,4],[7,8,9]] → 13</text>
  <rect x="60" y="56" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行</text>
  <rect x="120" y="56" width="190" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp 值</text>
  <rect x="310" y="56" width="330" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">说明</text>
  <rect x="60" y="100" width="60" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="125.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="100" width="190" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="125.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 1, 3]</text>
  <rect x="310" y="100" width="330" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="125.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">初始行</text>
  <rect x="60" y="144" width="60" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="169.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="144" width="190" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="169.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[7, 6, 5]</text>
  <rect x="310" y="144" width="330" height="44" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="169.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 = min(2,1)+6；6 = min(2,1,3)+5；5 = min(1,3)+4</text>
  <rect x="60" y="188" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="213.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="188" width="190" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="213.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[13, 13, 14]</text>
  <rect x="310" y="188" width="330" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475.0" y="213.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13 = min(7,6)+7，13 = min(7,6,5)+8，14 = min(6,5)+9</text>
  <text x="330" y="264" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最后一行最小值 13，对应路径 1 → 5 → 7</text>
  <text x="330" y="306" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 [[-19,57],[-40,-5]]：dp = [-19,57] → [min(-19,57)-40, min(-19,57)-5] = [-59, -24]，取 -59</text>
</svg>
