<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">字母表是环：从 a 到 b 只有"一路向后"和"一路向前"两条单调路径</text>

  <!-- 起点、终点 -->
  <circle cx="90" cy="150" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <circle cx="470" cy="150" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="156" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <!-- 上：向后 -->
  <path d="M 116 138 C 190 78, 370 78, 444 138" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">一路向后：逐步累加 nextCost[]</text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">步数 (b − a) mod 26</text>

  <!-- 下：向前 -->
  <path d="M 116 162 C 190 222, 370 222, 444 162" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">一路向前：逐步累加 previousCost[]</text>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">步数 (a − b) mod 26</text>

  <text x="280" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（折返只会重复经过边，权非负 ⇒ 删掉更省）</text>

  <rect x="120" y="286" width="320" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cost(a,b) = min(向后总代价, 向前总代价)</text>
</svg>
