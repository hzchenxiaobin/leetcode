<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：power = [1,1,3,4]</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">vals = [1, 3, 4]，cnt = {1:2, 3:1, 4:1}，j = 首个 vals[j] ≥ v−2 的下标</text>

  <!-- table header -->
  <path d="M20,90 L500,92" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M20,124 C180,122 360,126 500,124" stroke="#8a8a8a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="90" width="480" height="34" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M20,90 L500,92" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M20,124 C180,122 360,126 500,124" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <text x="35" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">i</text>
  <text x="71" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">v</text>
  <text x="146" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">j（首个 ≥ v−2）</text>
  <text x="226" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">dp[j]</text>
  <text x="285" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">不取 dp[i]</text>
  <text x="363" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">取 dp[j]+v·cnt</text>
  <text x="452" y="111" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">dp[i+1]</text>

  <!-- row separators -->
  <path d="M20,168 C180,170 360,166 500,168" stroke="#c9c9c9" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M20,212 C180,210 360,214 500,212" stroke="#c9c9c9" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M20,256 C180,258 360,254 500,256" stroke="#8a8a8a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- row 1: i=0, v=1 -->
  <text x="35" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="71" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="146" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（v−2 = −1）</text>
  <text x="226" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="285" y="150" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="363" y="150" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0+1×2 = 2</text>
  <text x="452" y="150" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">2（取）</text>

  <!-- row 2: i=1, v=3 -->
  <text x="35" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="71" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="194" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0（1 与 3 差 2 ✗）</text>
  <text x="226" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="285" y="194" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="363" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0+3×1 = 3</text>
  <text x="452" y="194" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">3（取）</text>

  <!-- row 3: i=2, v=4 (highlight) -->
  <rect x="21" y="213" width="478" height="42" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="35" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="71" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="146" y="238" text-anchor="middle" font-size="10.5" fill="#2d4d24" filter="url(#rough2)">1（1 与 4 差 3 ✓）</text>
  <text x="226" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="238" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="363" y="238" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2+4×1 = 6</text>
  <text x="452" y="238" text-anchor="middle" font-size="12.5" fill="#2d4d24" font-weight="bold" filter="url(#rough2)">6（取）</text>

  <!-- column separators -->
  <path d="M53,90 L52,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M92,90 L93,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M200,90 L201,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M252,90 L253,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M318,90 L319,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M408,90 L407,256" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- answer box -->
  <rect x="48" y="272" width="424" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">答案 dp[3] = 6 = 1×2 + 4：值 1（两个）与值 4 相差 3，兼容共存</text>
  <text x="260" y="313" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">第 3 行注意：取 4 的基准不是 dp[2]（含冲突值 3）而是 dp[1]</text>
</svg>
