<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [1, 13, 10, 12, 31]</text>
  <path d="M 200 38 Q 340 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row backgrounds -->
  <g filter="url(#sk)"><rect x="50" y="102" width="580" height="50" fill="#ffffff" stroke="none"/></g>
  <g filter="url(#sk)"><rect x="50" y="152" width="580" height="50" fill="#ffffff" stroke="none"/></g>
  <g filter="url(#sk)"><rect x="50" y="202" width="580" height="50" fill="#fff8e1" stroke="none"/></g>
  <g filter="url(#sk)"><rect x="50" y="252" width="580" height="50" fill="#ffffff" stroke="none"/></g>
  <g filter="url(#sk)"><rect x="50" y="302" width="580" height="50" fill="#f4f4f4" stroke="none"/></g>

  <!-- header -->
  <g filter="url(#sk)"><rect x="50" y="64" width="580" height="38" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="77" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">步骤</text>
  <text x="135" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">num</text>
  <text x="232" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">rev(num)</text>
  <text x="430" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">加入后集合</text>
  <text x="595" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">|S|</text>

  <!-- vertical lines -->
  <g filter="url(#sk)">
    <line x1="105" y1="64" x2="105" y2="352" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="165" y1="64" x2="165" y2="352" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="300" y1="64" x2="300" y2="352" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="560" y1="64" x2="560" y2="352" stroke="#9db8d8" stroke-width="1.2"/>
  </g>

  <!-- horizontal lines -->
  <g filter="url(#sk)">
    <line x1="50" y1="152" x2="630" y2="152" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="50" y1="202" x2="630" y2="202" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="50" y1="252" x2="630" y2="252" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="50" y1="302" x2="630" y2="302" stroke="#9db8d8" stroke-width="1.2"/>
  </g>

  <!-- outer border -->
  <g filter="url(#sk)">
    <rect x="50" y="64" width="580" height="288" fill="none" stroke="#4a8edb" stroke-width="1.8"/>
  </g>

  <!-- row 0 -->
  <text x="77" y="132" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <text x="135" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">1</text>
  <text x="232" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="430" y="132" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">{1}</text>
  <text x="595" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">1</text>

  <!-- row 1 -->
  <text x="77" y="182" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">1</text>
  <text x="135" y="182" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">13</text>
  <text x="232" y="182" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">31</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">{1, 13, 31}</text>
  <text x="595" y="182" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">3</text>

  <!-- row 2 (leading zero highlight) -->
  <text x="77" y="232" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#sk)">2</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#sk)">10</text>
  <text x="232" y="232" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#sk)">1（01 丢前导零）</text>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#a06a10" font-family="monospace" filter="url(#sk)">{1, 10, 13, 31}</text>
  <text x="595" y="232" text-anchor="middle" font-size="12" fill="#a06a10" font-weight="bold" filter="url(#sk)">4</text>

  <!-- row 3 -->
  <text x="77" y="282" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">3</text>
  <text x="135" y="282" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">12</text>
  <text x="232" y="282" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">21</text>
  <text x="430" y="282" text-anchor="middle" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">{1, 10, 12, 13, 21, 31}</text>
  <text x="595" y="282" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">6</text>

  <!-- row 4 (no change) -->
  <text x="77" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">4</text>
  <text x="135" y="332" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#sk)">31</text>
  <text x="232" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">13（均已存在）</text>
  <text x="430" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">集合不变</text>
  <text x="595" y="332" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">6</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="110" y="368" width="460" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 |S| = 6 → 返回 6（1、10、12、13、21、31）</text>
</svg>
