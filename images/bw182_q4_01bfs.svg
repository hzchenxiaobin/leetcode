<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">0-1 BFS：轻边权 0、重边权 1，用双端队列维护有序性</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">求「最少重边数」等价于边权只有 0/1 的最短路</text>
  <rect x="30" y="76" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">dist[v] = source → v 的最少重边数；dist[target] ≤ k 即可行</text>
  <text x="30" y="140" text-anchor="start" font-size="10.5" fill="#333">deque 队首 ← 0 权边扩展 ——[ 轻边 0 ]—— 重边 1 ——→ 队尾</text>
  <rect x="60" y="158" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="183" text-anchor="middle" font-size="10.5" fill="#888">front</text>
  <rect x="180" y="158" width="100" height="38" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="183" text-anchor="middle" font-size="10.5" fill="#888">…</text>
  <rect x="300" y="158" width="100" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="350" y="183" text-anchor="middle" font-size="10.5" fill="#888">back</text>
  <rect x="30" y="216" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">轻边：c = 0</text>
  <text x="150" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">push_front，不增加代价</text>
  <rect x="290" y="216" width="240" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">重边：c = 1</text>
  <text x="410" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">push_back，代价 +1</text>
  <rect x="30" y="296" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">dist[u] + c &lt; dist[v] 时松弛；弹出顺序按代价非降 ⇒ 每个点只被正确确定一次</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">单次判定 O(n + m)；总复杂度 O((n + m) log m)，m ≤ 10^3</text>
</svg>
