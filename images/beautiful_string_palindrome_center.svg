<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">无 ≥2 回文 ⟺ 无 len2 / len3 回文</text>

  <!-- 例 A：奇数长回文 abcba -->
  <text x="40" y="66" font-size="13" fill="#446688" filter="url(#rough2)">奇数长 L=5</text>
  <rect x="152" y="50" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="50" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="240" y="50" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="284" y="50" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="328" y="50" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="216" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="260" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <text x="304" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="348" y="78" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="172" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="216" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="260" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="304" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="348" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="260" y="132" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">中心 b·c·b 首尾相等 s[1]=s[3] ⟹ 含 len3 回文</text>

  <!-- 例 B：偶数长回文 abccba -->
  <text x="40" y="166" font-size="13" fill="#446688" filter="url(#rough2)">偶数长 L=6</text>
  <rect x="130" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="174" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="150" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="262" y="150" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="306" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="150" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="194" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="238" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <text x="282" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <text x="326" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="370" y="178" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="150" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="194" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="238" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="282" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="326" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="370" y="206" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="260" y="232" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">中心两位相等 s[2]=s[3] ⟹ 含 len2 回文</text>

  <!-- 结论框 -->
  <rect x="50" y="256" width="420" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">L ≥ 4 的回文，中心必含 len2（偶）或 len3（奇）回文</text>
  <text x="260" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">于是只需两条局部规则：</text>
  <text x="260" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s[i] ≠ s[i-1]（禁 len2） 且 s[i] ≠ s[i-2]（禁 len3）</text>
</svg>
