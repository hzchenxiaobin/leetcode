<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：DP 表的每一行都是杨辉三角（startPos=1, endPos=2, k=3）</text>

  <!-- ===== header row: positions −2..4 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="74" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">位置 j</text>

    <rect x="130" y="52" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="161" y="74" text-anchor="middle" font-size="12" fill="#666">−2</text>
    <rect x="192" y="52" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="223" y="74" text-anchor="middle" font-size="12" fill="#666">−1</text>
    <rect x="254" y="52" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="285" y="74" text-anchor="middle" font-size="12" fill="#666">0</text>
    <rect x="316" y="52" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="347" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="347" y="82" text-anchor="middle" font-size="9" fill="#446688">起点</text>
    <rect x="378" y="52" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="409" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
    <text x="409" y="82" text-anchor="middle" font-size="9" fill="#d6a040">终点</text>
    <rect x="440" y="52" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="471" y="74" text-anchor="middle" font-size="12" fill="#666">3</text>
    <rect x="502" y="52" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="533" y="74" text-anchor="middle" font-size="12" fill="#666">4</text>
  </g>

  <!-- ===== i = 0 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="114" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 0</text>
    <rect x="254" y="90" width="62" height="44" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="4"/>
    <rect x="316" y="90" width="62" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="347" y="118" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="475" y="116" font-size="11" fill="#446688">出发：dp[0][1] = 1</text>
  </g>

  <!-- ===== i = 1 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 1</text>
    <rect x="254" y="134" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="162" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <rect x="378" y="134" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="409" y="162" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="475" y="160" font-size="11" fill="#666">0、2 各有 1 种走法</text>
  </g>

  <!-- ===== i = 2 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 2</text>
    <rect x="192" y="178" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="223" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <rect x="316" y="178" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="347" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <rect x="440" y="178" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="471" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <text x="475" y="204" font-size="11" fill="#666">← 1 + 2 + 1 →</text>
  </g>

  <!-- ===== i = 3 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="246" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i = 3</text>
    <rect x="130" y="222" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="161" y="250" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
    <rect x="254" y="222" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="285" y="250" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
    <rect x="378" y="222" width="62" height="44" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <text x="409" y="250" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">3</text>
    <rect x="502" y="222" width="62" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="533" y="250" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  </g>

  <!-- transfer arrows into answer cell -->
  <g filter="url(#rough2)">
    <path d="M 347 220 Q 375 214 400 220" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <path d="M 471 220 Q 443 214 418 220" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)"/>
    <text x="409" y="284" text-anchor="middle" font-size="11" fill="#b85450">dp[i][j] = dp[i−1][j−1] + dp[i−1][j+1]　→　dp[3][2] = 2 + 1 = 3 ✓</text>
  </g>

  <line x1="40" y1="300" x2="580" y2="300" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <!-- ===== closed-form box ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="314" width="500" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="310" y="340" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">每一行的非零项恰是杨辉三角：1 ／ 1 1 ／ 1 2 1 ／ 1 3 3 1</text>
    <text x="310" y="364" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">闭式：dp[i][j] = C(i, (i + (j − startPos)) / 2)（i 与 j−startPos 同奇偶时）</text>
    <text x="310" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">DP 与组合数同源：dp[3][2] = C(3, (3+1)/2) = C(3, 2) = 3</text>
  </g>
</svg>
