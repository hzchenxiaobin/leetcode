<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：接球标记 + 取模跳转</text>
  <path d="M 215 40 Q 320 47 425 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <rect x="230" y="52" width="180" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="73" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace">received[1] = true</text>
  <text x="320" y="91" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace">cur = 1, i = 1</text>
  <path d="M 320 102 L 320 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- process -->
  <rect x="200" y="122" width="240" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="320" y="144" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-family="monospace">next = (cur-1+i×k) % n + 1</text>
  <text x="320" y="164" text-anchor="middle" font-size="10.5" fill="#557">顺时针走 i×k 步，模 n 绕回圈内</text>
  <path d="M 320 176 L 320 202" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision -->
  <polygon points="320,202 430,252 320,302 210,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">received[next]</text>
  <text x="320" y="265" text-anchor="middle" font-size="12" fill="#7a5415">已接过球？</text>

  <!-- yes branch -->
  <path d="M 430 252 L 462 252" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="445" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <rect x="462" y="220" width="168" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="546" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">第 2 次接球 → 跳出</text>
  <text x="546" y="262" text-anchor="middle" font-size="11" fill="#8a4040">answer = 未接球的朋友</text>
  <text x="546" y="278" text-anchor="middle" font-size="11" fill="#8a4040">按 1..n 升序收集返回</text>

  <!-- no branch: loop back -->
  <text x="334" y="320" font-size="12" font-weight="bold" fill="#2e6e2e">否</text>
  <path d="M 320 302 L 320 346 L 112 346 L 112 150 L 200 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="37" y="196" width="150" height="72" rx="8" fill="#f4f7fa" stroke="#8aa8c0" stroke-width="1.4" filter="url(#sk)"/>
  <text x="112" y="220" text-anchor="middle" font-size="11" fill="#345" font-family="monospace">received[next]=true</text>
  <text x="112" y="240" text-anchor="middle" font-size="11" fill="#345" font-family="monospace">cur = next</text>
  <text x="112" y="258" text-anchor="middle" font-size="11" fill="#345" font-family="monospace">i = i + 1</text>

  <text x="546" y="346" text-anchor="middle" font-size="10.5" fill="#888">抽屉原理：循环至多 n 轮必停</text>
</svg>
