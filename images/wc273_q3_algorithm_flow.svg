<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：分组 → 逐组滚动前缀和 → 闭式回填</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 分组 -->
  <g filter="url(#sk)">
    <rect x="118" y="50" width="404" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#333">① 按值分组：遍历 i = 0 … n−1</text>
  <text x="320" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a">pos[arr[i]].append(i)　（组内天然升序，免排序）</text>

  <path d="M 320 94 L 320 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 取组 -->
  <g filter="url(#sk)">
    <rect x="118" y="116" width="404" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="136" text-anchor="middle" font-size="12" fill="#333">② 取一个未处理的组 g（长度 m）</text>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#446688">total = Σ g[k]，prefix = 0，i = 0</text>

  <path d="M 320 160 L 320 178" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ③ 闭式回填 -->
  <g filter="url(#sk)">
    <rect x="100" y="182" width="440" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="203" text-anchor="middle" font-size="12" fill="#333">③ ans[g[i]] ← (2i − m)·g[i] + total − 2·prefix</text>
  <text x="320" y="220" text-anchor="middle" font-size="11" fill="#333">然后 prefix += g[i]，i ← i + 1</text>
  <text x="320" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">⚠ 必须先套公式再累加 prefix，顺序写反必错</text>

  <path d="M 320 246 L 320 262" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1 -->
  <g filter="url(#sk)">
    <polygon points="320,266 402,292 320,318 238,292" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">i &lt; m ?</text>

  <!-- 是 → 回到 ③ -->
  <path d="M 238 292 L 84 292 L 84 214 L 96 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="96" y="256" font-size="10.5" font-weight="bold" fill="#4a7a3a">是：下一位置</text>

  <!-- 否 ↓ -->
  <path d="M 320 318 L 320 338" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="332" font-size="10.5" fill="#888">否</text>

  <!-- 菱形 2 -->
  <g filter="url(#sk)">
    <polygon points="320,342 402,368 320,394 238,368" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="373" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">还有未处理的组 ?</text>

  <!-- 是 → 回到 ② -->
  <path d="M 402 368 L 556 368 L 556 138 L 526 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="564" y="250" font-size="10.5" font-weight="bold" fill="#4a7a3a">是：</text>
  <text x="564" y="266" font-size="10.5" font-weight="bold" fill="#4a7a3a">下一组</text>

  <!-- 否 ↓ -->
  <path d="M 320 394 L 320 414" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="332" y="408" font-size="10.5" fill="#888">否</text>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <rect x="232" y="418" width="176" height="40" rx="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">返回 ans</text>
</svg>
