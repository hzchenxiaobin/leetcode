<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="800" height="540" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [5, −7, 3, 5]，goal = 6</text>
  <path d="M 200 42 Q 400 50 600 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="40" y="62" width="345" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="58" y="88" font-size="13.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">左半 [5, −7]：翻倍枚举</text>

  <g font-size="11">
    <g filter="url(#rough2)"><rect x="58" y="100" width="32" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="74" y="120" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">0</text>
    <path d="M 96 115 L 120 115" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="108" y="107" font-size="9.5" fill="#b85450" filter="url(#rough2)">+5</text>
    <g filter="url(#rough2)"><rect x="126" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="141" y="120" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="156" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="171" y="120" text-anchor="middle" fill="#2b4a6b" filter="url(#rough2)">5</text>
    <path d="M 192 115 L 216 115" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="204" y="107" font-size="9.5" fill="#b85450" filter="url(#rough2)">−7</text>
    <g filter="url(#rough2)"><rect x="222" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="237" y="120" text-anchor="middle" fill="#2b4a6b" font-size="10" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="252" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="267" y="120" text-anchor="middle" fill="#2b4a6b" font-size="10" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="282" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/></g>
    <text x="297" y="120" text-anchor="middle" fill="#2b4a6b" font-size="10" filter="url(#rough2)">−7</text>
    <g filter="url(#rough2)"><rect x="312" y="100" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="327" y="120" text-anchor="middle" fill="#8a6520" font-size="10" font-weight="bold" filter="url(#rough2)">−2</text>
  </g>

  <text x="58" y="160" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">X = { 0, 5, −7, −2 }</text>
  <text x="58" y="184" font-size="10.5" fill="#888" filter="url(#rough2)">∅→0，{5}→5，{−7}→−7，{5,−7}→−2</text>
  <text x="58" y="212" font-size="10.5" fill="#666" filter="url(#rough2)">空子集（和为 0）天然包含在内</text>

  <g filter="url(#rough2)"><rect x="415" y="62" width="345" height="172" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="433" y="88" font-size="13.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">右半 [3, 5]：翻倍枚举 + 排序</text>

  <g font-size="11">
    <g filter="url(#rough2)"><rect x="433" y="100" width="32" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="449" y="120" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">0</text>
    <path d="M 471 115 L 495 115" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="483" y="107" font-size="9.5" fill="#b85450" filter="url(#rough2)">+3</text>
    <g filter="url(#rough2)"><rect x="501" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="516" y="120" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="531" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="546" y="120" text-anchor="middle" fill="#8a6520" filter="url(#rough2)">3</text>
    <path d="M 567 115 L 591 115" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="579" y="107" font-size="9.5" fill="#b85450" filter="url(#rough2)">+5</text>
    <g filter="url(#rough2)"><rect x="597" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="612" y="120" text-anchor="middle" fill="#8a6520" font-size="10" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="627" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="642" y="120" text-anchor="middle" fill="#8a6520" font-size="10" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="657" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="672" y="120" text-anchor="middle" fill="#8a6520" font-size="10" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="687" y="100" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="702" y="120" text-anchor="middle" fill="#2e5e2e" font-size="10" font-weight="bold" filter="url(#rough2)">8</text>
  </g>

  <text x="433" y="160" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#rough2)">Y = [ 0, 3, 5, 8 ]（升序）</text>
  <text x="433" y="184" font-size="10.5" fill="#888" filter="url(#rough2)">∅→0，{3}→3，{5}→5，{3,5}→8</text>
  <text x="433" y="212" font-size="10.5" fill="#666" filter="url(#rough2)">有序 → 可二分查找最近的 y</text>

  <path d="M 212 238 L 212 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 588 238 L 588 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="252" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">对每个 x，令 t = 6 − x，在 Y 中二分找最接近 t 的 y</text>

  <g font-size="12.5">
    <g filter="url(#rough2)"><rect x="90" y="262" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="135" y="286" text-anchor="middle" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">x</text>
    <g filter="url(#rough2)"><rect x="180" y="262" width="130" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="245" y="286" text-anchor="middle" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">t = 6 − x</text>
    <g filter="url(#rough2)"><rect x="310" y="262" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="400" y="286" text-anchor="middle" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">二分候选 y</text>
    <g filter="url(#rough2)"><rect x="490" y="262" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="540" y="286" text-anchor="middle" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">最优 y</text>
    <g filter="url(#rough2)"><rect x="590" y="262" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
    <text x="650" y="286" text-anchor="middle" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">|x + y − 6|</text>

    <g filter="url(#rough2)"><rect x="90" y="300" width="90" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="135" y="322" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="180" y="300" width="130" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="245" y="322" text-anchor="middle" fill="#333" filter="url(#rough2)">6</text>
    <g filter="url(#rough2)"><rect x="310" y="300" width="180" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="400" y="322" text-anchor="middle" fill="#333" filter="url(#rough2)">5、8</text>
    <g filter="url(#rough2)"><rect x="490" y="300" width="100" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="540" y="322" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="590" y="300" width="120" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="650" y="322" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>

    <g filter="url(#rough2)"><rect x="90" y="334" width="90" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="135" y="356" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="180" y="334" width="130" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="245" y="356" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="310" y="334" width="180" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="400" y="356" text-anchor="middle" fill="#333" filter="url(#rough2)">0、3</text>
    <g filter="url(#rough2)"><rect x="490" y="334" width="100" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="540" y="356" text-anchor="middle" fill="#333" filter="url(#rough2)">0</text>
    <g filter="url(#rough2)"><rect x="590" y="334" width="120" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="650" y="356" text-anchor="middle" fill="#333" filter="url(#rough2)">1</text>

    <g filter="url(#rough2)"><rect x="90" y="368" width="90" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="135" y="390" text-anchor="middle" fill="#333" filter="url(#rough2)">−7</text>
    <g filter="url(#rough2)"><rect x="180" y="368" width="130" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="245" y="390" text-anchor="middle" fill="#333" filter="url(#rough2)">13</text>
    <g filter="url(#rough2)"><rect x="310" y="368" width="180" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="400" y="390" text-anchor="middle" fill="#333" filter="url(#rough2)">8（仅左邻）</text>
    <g filter="url(#rough2)"><rect x="490" y="368" width="100" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="540" y="390" text-anchor="middle" fill="#333" filter="url(#rough2)">8</text>
    <g filter="url(#rough2)"><rect x="590" y="368" width="120" height="34" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/></g>
    <text x="650" y="390" text-anchor="middle" fill="#333" filter="url(#rough2)">5</text>

    <g filter="url(#rough2)"><rect x="90" y="402" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="135" y="424" text-anchor="middle" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">−2</text>
    <g filter="url(#rough2)"><rect x="180" y="402" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="245" y="424" text-anchor="middle" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">8</text>
    <g filter="url(#rough2)"><rect x="310" y="402" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="400" y="424" text-anchor="middle" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">5、8（精确命中）</text>
    <g filter="url(#rough2)"><rect x="490" y="402" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="540" y="424" text-anchor="middle" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">8</text>
    <g filter="url(#rough2)"><rect x="590" y="402" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="650" y="424" text-anchor="middle" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">0 ✓</text>
  </g>

  <g filter="url(#rough2)"><rect x="90" y="456" width="620" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="400" y="481" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">x = −2 ← 左半选 {5, −7}；y = 8 ← 右半选 {3, 5}</text>
  <text x="400" y="504" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">合并即整个数组：5 − 7 + 3 + 5 = 6，|6 − 6| = 0</text>
</svg>
