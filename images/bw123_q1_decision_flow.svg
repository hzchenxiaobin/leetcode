<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定顺序：先排序，再逐级判断</text>

  <rect x="150" y="44" width="180" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="65" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">排序，令 a ≤ b ≤ c</text>

  <path d="M 240 76 L 240 94" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="240,96 350,124 240,152 130,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="129" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">a + b ≤ c ?</text>

  <path d="M 350 124 L 394 124" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="116" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="396" y="106" width="126" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="459" y="129" text-anchor="middle" font-size="12.5" fill="#8c3a3a" font-weight="bold" filter="url(#rough2)">"none"</text>
  <text x="459" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">退化：两边和 ≤ 第三边</text>

  <path d="M 240 152 L 240 170" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="165" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="240,172 350,200 240,228 130,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="205" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">a == c ?</text>

  <path d="M 350 200 L 394 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="396" y="182" width="126" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="459" y="205" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">"equilateral"</text>
  <text x="459" y="234" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">排序后首尾相等 ⇔ 三边全等</text>

  <path d="M 240 228 L 240 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="241" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="240,248 356,276 240,304 124,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="281" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">a == b 或 b == c ?</text>

  <path d="M 356 276 L 394 276" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="396" y="258" width="126" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="459" y="281" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">"isosceles"</text>
  <text x="459" y="310" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">恰有两边相等</text>

  <path d="M 240 304 L 240 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="317" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="182" y="324" width="116" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="346" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">"scalene"</text>

  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">排序后只需检查 a + b &gt; c 一组不等式，另两组必然成立</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">落到最底下说明三边互不相等，即 scalene</text>
</svg>
