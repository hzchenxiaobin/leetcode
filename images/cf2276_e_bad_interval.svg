<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定左端点 l：坏 r 恰好是一段连续区间</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 s = 202516、l = 1 为例，横轴是右端点 r</text>

  <!-- r 的六个格子 -->
  <rect x="56" y="100" width="96" height="52" rx="7" fill="#eeeeee" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="156" y="100" width="96" height="52" rx="7" fill="#eeeeee" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="256" y="100" width="96" height="52" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="356" y="100" width="96" height="52" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="456" y="100" width="96" height="52" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="556" y="100" width="96" height="52" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="104" y="134" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">r=1</text>
  <text x="204" y="134" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">r=2</text>
  <text x="304" y="134" text-anchor="middle" font-size="16" fill="#33517a" filter="url(#rough2)">r=3</text>
  <text x="404" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#a0761e" filter="url(#rough2)">r=4</text>
  <text x="504" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#a0761e" filter="url(#rough2)">r=5</text>
  <text x="604" y="134" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">r=6</text>

  <!-- 关键标记 -->
  <text x="256" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">e*</text>
  <text x="356" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">x</text>
  <text x="556" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">y</text>

  <!-- 轴 -->
  <path d="M 56 176 L 672 176" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="676" y="181" font-size="12" fill="#5a5a5a" filter="url(#rough2)">r</text>

  <!-- 图例 -->
  <rect x="56" y="200" width="16" height="16" rx="3" fill="#eeeeee" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="213" font-size="12" fill="#555" filter="url(#rough2)">r &lt; e*：还不含 202 子序列 → 好</text>
  <rect x="56" y="228" width="16" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="241" font-size="12" fill="#555" filter="url(#rough2)">r = e*：含 202，但 e* 之后没有 5/6 → 好</text>
  <rect x="56" y="256" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="269" font-size="12" fill="#555" filter="url(#rough2)">x ≤ r &lt; y：含 2025 且不含 2026 → 坏</text>
  <rect x="56" y="284" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="297" font-size="12" fill="#555" filter="url(#rough2)">r ≥ y：出现了 6，含 2026 → 好</text>

  <text x="470" y="269" font-size="12.5" fill="#8d3a35" filter="url(#rough2)">坏区间 [A_l, B_l] = [x, y − 1]</text>
  <text x="470" y="292" font-size="12" fill="#777" filter="url(#rough2)">本例只有 l = 1 有坏区间 [4, 5]</text>
</svg>
