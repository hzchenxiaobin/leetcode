<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="960" height="580" fill="#fdfcf7"/>

  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建堆 → k 轮「弹顶 × m 塞回」→ 原数组即答案</text>
  <path d="M 240 42 Q 480 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <rect x="470" y="54" width="190" height="36" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="77" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">输入 nums、k、multiplier</text>
  <path d="M 565 90 L 565 114" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 建堆 -->
  <rect x="415" y="116" width="300" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="565" y="135" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">建小根堆：全部 (nums[i], i) 入堆</text>
  <text x="565" y="152" text-anchor="middle" font-size="10.5" fill="#888">heapify 一次 O(n)</text>
  <path d="M 565 158 L 565 184" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 主循环菱形 -->
  <polygon points="565,186 700,254 565,322 430,254" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="565" y="248" text-anchor="middle" font-size="13.5" fill="#7a5415" font-weight="bold">k &gt; 0 ?</text>
  <text x="565" y="270" text-anchor="middle" font-size="9.5" fill="#999">k ≤ 10：本题硬跑就是最优</text>

  <!-- 是：弹顶 -->
  <path d="M 700 254 L 742 254" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="721" y="244" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <rect x="746" y="228" width="188" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="840" y="249" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">弹出堆顶 (x, i)</text>
  <text x="840" y="268" text-anchor="middle" font-size="10" fill="#2e6e2e">全局最小，并列取小下标</text>
  <path d="M 840 280 L 840 306" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 乘塞回 + 写回 + k 减 -->
  <rect x="746" y="308" width="188" height="76" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <g font-size="11.5" fill="#7a5415" text-anchor="middle">
    <text x="840" y="328" font-weight="bold">x ← x · multiplier</text>
    <text x="840" y="346">压回 (x, i)，k ← k − 1</text>
    <text x="840" y="368" fill="#2e6e2e" font-weight="bold">顺手 nums[i] ← x（写回）</text>
  </g>

  <!-- 循环回箭头 -->
  <path d="M 746 346 C 690 346, 668 300, 626 268" stroke="#c98a2b" stroke-width="1.8" fill="none" stroke-dasharray="6 3" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="672" y="316" text-anchor="middle" font-size="10.5" fill="#c98a2b" font-weight="bold">循环 k 轮</text>

  <!-- 否：返回 -->
  <path d="M 565 322 L 565 348" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="578" y="344" font-size="11" fill="#666">否（k 用完）</text>
  <rect x="495" y="350" width="140" height="40" rx="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="565" y="368" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 nums</text>
  <text x="565" y="382" text-anchor="middle" font-size="9.5" fill="#2e6e2e">已原地更新，无收尾趟</text>

  <!-- 左侧说明框 -->
  <rect x="52" y="150" width="330" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="68" y="176" font-size="12.5" fill="#2b6e9e" font-weight="bold">为什么「弹一个塞一个」就够了？</text>
  <g font-size="11" fill="#444">
    <text x="68" y="200">① m ≥ 1 ⇒ 新值不小于旧值，堆序不倒</text>
    <text x="68" y="222">② 堆中始终是全部 n 个「当前值」，</text>
    <text x="68" y="240">　 弹出的必然是全局最小</text>
    <text x="68" y="262">③ 同一元素乘完仍最小 → 下一轮还是它</text>
    <text x="68" y="284" fill="#2e6e2e" font-weight="bold">　 （连续被乘 = 题目语义，示例 2）</text>
  </g>

  <!-- 左下：复杂度对照 -->
  <rect x="52" y="320" width="330" height="104" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3" filter="url(#sk)"/>
  <text x="68" y="344" font-size="12.5" fill="#5a3a7a" font-weight="bold">暴力 vs 堆：本题都过，比的是可扩展性</text>
  <g font-size="11" fill="#444">
    <text x="68" y="368">暴力：每轮线性扫最小，O(k·n) ≤ 1000 次</text>
    <text x="68" y="388">堆版：O(n + k log n)，k、n 各自放大都扛得住</text>
    <text x="68" y="410" fill="#5a3a7a" font-weight="bold">这份代码 = 同场 Q3 的「模拟阶段」，直接迁移</text>
  </g>

  <!-- 底部横条 -->
  <rect x="52" y="444" width="880" height="106" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="492" y="470" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">与同场 Q3（#3266，k ≤ 10^9 + 取模）的分岔点</text>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="492" y="494">本题：k 只有 10 轮 → 上面的循环直接跑满就是全部工作；int 也乘不爆（100 × 5^10 ≈ 9.8×10^8）</text>
    <text x="492" y="516">Q3：k 到 10^9、值到 10^9 → 在「堆顶 × m &gt; mx」处停机，剩余 k = q·n + r 按周期轮转整块快进</text>
    <text x="492" y="538" fill="#2e6e2e" font-weight="bold">签到策略：按 Q1 的语义写「弹顶 × m 塞回」，Q3 开场时这份代码原样当阶段一复用</text>
  </g>
</svg>
