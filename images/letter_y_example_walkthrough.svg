<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：grid = [[1,2,2],[1,1,0],[0,1,0]]，n = 3，m = 1</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">Y 区域 4 格（蓝底）：(0,0)、(0,2)、(1,1)、(2,1)；非 Y 5 格</text>

  <!-- 左：原矩阵 -->
  <text x="144" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">原矩阵</text>
  <text x="88" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=0</text>
  <text x="144" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=1</text>
  <text x="200" y="94" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=2</text>
  <text x="54" y="128" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="54" y="184" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="54" y="240" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>

  <g filter="url(#rough2)">
    <rect x="60" y="96" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="88" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="116" y="96" width="56" height="56" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="144" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="172" y="96" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="200" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="60" y="152" width="56" height="56" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="88" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="116" y="152" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="144" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="172" y="152" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="200" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="60" y="208" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="88" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="116" y="208" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="144" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="172" y="208" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="200" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="144" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">红框 = 与目标不符的 3 格</text>

  <!-- 中：转换箭头 -->
  <path d="M 240 176 L 324 176" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">选 (a,b) = (1,0)</text>
  <text x="282" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">Y 内全 1，Y 外全 0</text>

  <!-- 右：目标形态 -->
  <text x="424" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">目标形态</text>
  <g filter="url(#rough2)">
    <rect x="340" y="96" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="368" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="396" y="96" width="56" height="56" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="424" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="452" y="96" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="480" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="340" y="152" width="56" height="56" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="368" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="396" y="152" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="424" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="452" y="152" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="480" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="340" y="208" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="368" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="396" y="208" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="424" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="452" y="208" width="56" height="56" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="480" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="424" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">合法：Y 内全 1，Y 外全 0，1 ≠ 0</text>

  <!-- 底部：计数与代价 -->
  <g filter="url(#rough2)">
    <rect x="40" y="312" width="580" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="330" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">一次遍历得计数表：cntY = [0, 3, 1]（|Y| = 4），cntN = [3, 1, 1]（|N| = 5）</text>
  <text x="330" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">cost(1,0) = (4 − cntY[1]) + (5 − cntN[0]) = 1 + 2 = 3</text>
  <text x="330" y="390" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">其余 5 对的代价分别为 8、8、5、5、7 —— 最小值 3</text>
  <text x="330" y="416" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">具体改动：Y 内 (0,2) 由 2 改 1；Y 外 (0,1) 由 2 改 0、(1,0) 由 1 改 0</text>
</svg>
