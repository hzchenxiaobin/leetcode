<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">出口模型：边界空格是出口，入口被排除</text>

  <!-- 迷宫外框（边界） -->
  <g filter="url(#rough2)">
    <rect x="110" y="70" width="300" height="220" fill="#fff" stroke="#446688" stroke-width="3.5" rx="2"/>
  </g>

  <!-- 内部格子（示例 1 的 3x4 布局） -->
  <g filter="url(#rough2)">
    <rect x="150" y="110" width="46" height="46" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="2"/>
    <rect x="196" y="110" width="46" height="46" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="2"/>
    <rect x="242" y="110" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2"/>
    <rect x="288" y="110" width="46" height="46" fill="#bbb" stroke="#888" stroke-width="1.5" rx="2"/>

    <rect x="150" y="156" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2"/>
    <rect x="196" y="156" width="46" height="46" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="2"/>
    <rect x="242" y="156" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="2"/>
    <rect x="288" y="156" width="46" height="46" fill="#bbb" stroke="#888" stroke-width="1.5" rx="2"/>

    <rect x="150" y="202" width="46" height="46" fill="#bbb" stroke="#888" stroke-width="1.5" rx="2"/>
    <rect x="196" y="202" width="46" height="46" fill="#bbb" stroke="#888" stroke-width="1.5" rx="2"/>
    <rect x="242" y="202" width="46" height="46" fill="#bbb" stroke="#888" stroke-width="1.5" rx="2"/>
    <rect x="288" y="202" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="2"/>
  </g>

  <!-- 入口标记 -->
  <text x="265" y="185" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">入口</text>
  <text x="265" y="196" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">(1,2)</text>

  <!-- 出口标记 -->
  <g font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">
    <text x="173" y="178" text-anchor="middle">出口</text>
    <text x="173" y="194" text-anchor="middle" font-size="10" filter="url(#rough2)">(1,0)</text>
    <text x="265" y="130" text-anchor="middle">出口</text>
    <text x="265" y="142" text-anchor="middle" font-size="10" filter="url(#rough2)">(0,2)</text>
    <text x="311" y="230" text-anchor="middle">出口</text>
    <text x="311" y="242" text-anchor="middle" font-size="10" filter="url(#rough2)">(2,3)</text>
  </g>

  <!-- 关键标注：入口在边界 -->
  <path d="M 262 200 C 300 250 380 260 440 300" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="300" y="300" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <text x="415" y="322" text-anchor="middle" font-size="12" fill="#a0392f" font-weight="bold" filter="url(#rough2)">⚠ 入口本身不算出口</text>
  <text x="415" y="342" text-anchor="middle" font-size="11" fill="#a0392f" filter="url(#rough2)">（示例 2 的入口 (1,0) 就在边界上）</text>

  <!-- 判定说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="366" width="470" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="295" y="386" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">出口 = 边界上的空格；BFS 先把入口标记为已访问再入队，</text>
  <text x="295" y="402" text-anchor="middle" font-size="12.5" fill="#2f5226" filter="url(#rough2)">此后「首次触达边界空格」即返回，天然不会把入口误报为出口。</text>

  <!-- 一步出界示意 -->
  <path d="M 265 156 L 265 132" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="150" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">向上 1 步 → 答案 1</text>

  <!-- 迷宫标题 -->
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 × 4 迷宫（示例 1）：灰色为墙</text>
</svg>
