<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：s = "0110"，t = "1110"（one = 3，zero = 1）</text>
  <path d="M 150 38 Q 280 48 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="24" y="56" width="90" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="118" y="56" width="101" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="224" y="56" width="101" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="56" width="101" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="436" y="56" width="101" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="69" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">位置 i</text>
  <g font-size="14" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="168" y="79">0</text>
    <text x="274" y="79">1</text>
    <text x="380" y="79" fill="#a87b20">2</text>
    <text x="486" y="79">3</text>
  </g>

  <!-- row: s[i] -->
  <g filter="url(#sk)">
    <rect x="24" y="98" width="90" height="42" rx="6" fill="#f1f1f1" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="118" y="98" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="224" y="98" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="330" y="98" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="436" y="98" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
  </g>
  <text x="69" y="124" text-anchor="middle" font-size="10.5" fill="#555555">s[i]</text>
  <g font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="124">0</text>
    <text x="274" y="124">1</text>
    <text x="380" y="124">1</text>
    <text x="486" y="124">0</text>
  </g>

  <!-- row: ammo needed -->
  <g filter="url(#sk)">
    <rect x="24" y="146" width="90" height="42" rx="6" fill="#f1f1f1" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="118" y="146" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="224" y="146" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="330" y="146" width="101" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="436" y="146" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
  </g>
  <text x="69" y="172" text-anchor="middle" font-size="10.5" fill="#555555">对位弹药</text>
  <g font-size="12" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="172">'1' 有 ✓</text>
    <text x="274" y="172">'0' 有 ✓</text>
    <text x="380" y="172" fill="#b85450" font-weight="bold">'0' 打光!</text>
    <text x="486" y="172">'1' 有 ✓</text>
  </g>

  <!-- row: stock change -->
  <g filter="url(#sk)">
    <rect x="24" y="194" width="90" height="42" rx="6" fill="#f1f1f1" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="118" y="194" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="224" y="194" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="330" y="194" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="436" y="194" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
  </g>
  <text x="69" y="220" text-anchor="middle" font-size="10.5" fill="#555555">库存动作</text>
  <g font-size="10.5" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="220">one: 3 → 2</text>
    <text x="274" y="220">zero: 1 → 0</text>
    <text x="380" y="220">one: 2 → 1</text>
    <text x="486" y="220">one: 1 → 0</text>
  </g>

  <!-- row: t'[i] -->
  <g filter="url(#sk)">
    <rect x="24" y="242" width="90" height="42" rx="6" fill="#f1f1f1" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="118" y="242" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="224" y="242" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="330" y="242" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
    <rect x="436" y="242" width="101" height="42" rx="6" fill="#ffffff" stroke="#6a7a8a" stroke-width="1.4"/>
  </g>
  <text x="69" y="268" text-anchor="middle" font-size="10.5" fill="#555555">t'[i]</text>
  <g font-size="13" fill="#2b2b2b" text-anchor="middle">
    <text x="168" y="268">1</text>
    <text x="274" y="268">0</text>
    <text x="380" y="268">1</text>
    <text x="486" y="268">1</text>
  </g>

  <!-- row: ans[i] -->
  <g filter="url(#sk)">
    <rect x="24" y="290" width="90" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="118" y="290" width="101" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="224" y="290" width="101" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="330" y="290" width="101" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="436" y="290" width="101" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="69" y="317" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">ans[i]</text>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="168" y="317" fill="#2e6e2e">1</text>
    <text x="274" y="317" fill="#2e6e2e">1</text>
    <text x="380" y="317" fill="#b85450">0</text>
    <text x="486" y="317" fill="#2e6e2e">1</text>
  </g>

  <!-- callout -->
  <rect x="24" y="348" width="512" height="66" rx="10" fill="#f4f0fa" stroke="#7a5aa0" stroke-width="1.6" filter="url(#sk)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a80">最优重排 t' = "1011"，s ⊕ t' = "0110" ⊕ "1011" = "1101" ✓</text>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#4a4a4a">只有 i = 2 处 '0' 弹药打光、被迫垫同位 '1' 产出 0，其余三位全部对位命中</text>
</svg>
