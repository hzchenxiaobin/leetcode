<svg xmlns="http://www.w3.org/2000/svg" width="620" height="500" viewBox="0 0 620 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="620" height="500" fill="#fdfcf7"/>
  <text x="310" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪心陷阱：先抓最大分对，挤占的是别人的最优资源</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#777">自造反例（m=2, n=5）：最大分 4 是唯一的 —— 任何并列规则都救不了</text>

  <path d="M 262 58 L 262 472" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 268 272 L 605 272" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>

  <text x="135" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">反例数据</text>
  <text x="25" y="101" font-size="11" fill="#555" font-family="monospace">students = [[0,0,0,0,0],</text>
  <text x="25" y="117" font-size="11" fill="#555" font-family="monospace">            [0,0,1,1,1]]</text>
  <text x="25" y="143" font-size="11" fill="#555" font-family="monospace">mentors  = [[0,0,0,0,1],</text>
  <text x="25" y="159" font-size="11" fill="#555" font-family="monospace">            [1,1,0,0,0]]</text>

  <g filter="url(#sk)">
    <rect x="45" y="176" width="40" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="85" y="176" width="55" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="140" y="176" width="55" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="45" y="202" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="45" y="238" width="40" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="85" y="202" width="55" height="36" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="140" y="202" width="55" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="85" y="238" width="55" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="140" y="238" width="55" height="36" rx="4" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.3"/>
  </g>
  <text x="65" y="193" text-anchor="middle" font-size="10.5" fill="#2b5d8e" font-family="monospace">score</text>
  <text x="112" y="193" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">M0</text>
  <text x="167" y="193" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">M1</text>
  <text x="65" y="224" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">S0</text>
  <text x="65" y="260" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">S1</text>
  <text x="112" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03c38">4</text>
  <text x="167" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">3</text>
  <text x="112" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">3</text>
  <text x="167" y="261" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="135" y="294" text-anchor="middle" font-size="10" fill="#777">行 = 学生，列 = 导师</text>

  <text x="432" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03c38">贪心：先抓唯一最大分 4</text>
  <g filter="url(#sk)">
    <rect x="275" y="95" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="275" y="180" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="510" y="95" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="510" y="180" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="298" y="113" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">S0</text>
  <text x="298" y="198" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">S1</text>
  <text x="533" y="113" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">M0</text>
  <text x="533" y="198" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">M1</text>

  <path d="M 321 109 L 506 109" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="413" y="101" text-anchor="middle" font-size="11.5" fill="#a03c38" font-weight="bold">4（抢走 M0）</text>
  <path d="M 321 194 L 506 194" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)"/>
  <text x="413" y="187" text-anchor="middle" font-size="11.5" fill="#a03c38">只剩 0 分的 M1</text>

  <g filter="url(#sk)">
    <rect x="355" y="228" width="155" height="32" rx="15" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="432" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#a03c38">总分 4 ✗</text>

  <text x="432" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d2f">最优：S0 让一步，S1 拿到 M0</text>
  <g filter="url(#sk)">
    <rect x="275" y="310" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="275" y="395" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="510" y="310" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="510" y="395" width="46" height="28" rx="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="298" y="328" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">S0</text>
  <text x="298" y="413" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">S1</text>
  <text x="533" y="328" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">M0</text>
  <text x="533" y="413" text-anchor="middle" font-size="12" fill="#2b5d8e" font-weight="bold">M1</text>

  <path d="M 321 324 L 506 409" stroke="#4a8e4a" stroke-width="2.5" fill="none" marker-end="url(#arg)"/>
  <text x="347" y="322" font-size="12" font-weight="bold" fill="#2f5d2f">3</text>
  <path d="M 321 409 L 506 324" stroke="#4a8e4a" stroke-width="2.5" fill="none" marker-end="url(#arg)"/>
  <text x="347" y="428" font-size="12" font-weight="bold" fill="#2f5d2f">3</text>

  <g filter="url(#sk)">
    <rect x="355" y="443" width="155" height="32" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="432" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2f">总分 6 ✓</text>

  <text x="310" y="492" text-anchor="middle" font-size="11" fill="#7a5415">「互不同行不同列」的占用耦合：单边最大 ≠ 属于某个最优解 —— 匹配要 DP（小规模）/ 匈牙利（大规模），不要贪心</text>
</svg>
