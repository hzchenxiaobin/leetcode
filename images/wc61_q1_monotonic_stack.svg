<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">递减栈：栈里只留「还没等到更暖日子」的下标</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">自底向顶温度非递增；来了更暖的一天，就从栈顶开始级联弹出并结算</text>

  <text x="56" y="70" font-size="9.5" fill="#999" filter="url(#rough2)">从左到右扫描 →</text>
  <text x="22" y="100" font-size="10.5" fill="#666" filter="url(#rough2)">T =</text>

  <g filter="url(#rough2)">
    <rect x="56" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="112" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="224" y="78" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="280" y="78" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="336" y="78" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="392" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="448" y="78" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="82" y="100">73</text>
    <text x="138" y="100">74</text>
    <text x="194" y="100">75</text>
    <text x="250" y="100">71</text>
    <text x="306" y="100">69</text>
    <text x="362" y="100">72</text>
    <text x="418" y="100">76</text>
    <text x="474" y="100">73</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#999" text-anchor="middle">
    <text x="82" y="128">0</text>
    <text x="138" y="128">1</text>
    <text x="194" y="128">2</text>
    <text x="250" y="128">3</text>
    <text x="306" y="128">4</text>
    <text x="362" y="128">5</text>
    <text x="418" y="128">6</text>
    <text x="474" y="128">7</text>
  </g>

  <path d="M 360 114 C 350 190, 310 224, 268 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="166" font-size="10" fill="#b85450" filter="url(#rough2)">T[5] = 72° 到达</text>

  <g filter="url(#rough2)">
    <rect x="90" y="230" width="170" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="90" y="268" width="170" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="90" y="306" width="170" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <text x="175" y="252">① 下标 4 · 69°</text>
    <text x="175" y="290">② 下标 3 · 71°</text>
    <text x="175" y="328">下标 2 · 75°</text>
  </g>

  <text x="46" y="248" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">栈顶</text>
  <text x="46" y="326" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">栈底</text>

  <rect x="320" y="222" width="225" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="332" y="244" font-size="11" fill="#3a5a30" font-weight="bold">弹出即结算</text>
    <text x="332" y="266" font-size="10" fill="#444">弹出下标 j：ans[j] = i − j</text>
    <text x="332" y="288" font-size="10" fill="#444">① ans[4] = 5 − 4 = 1</text>
    <text x="332" y="310" font-size="10" fill="#444">② ans[3] = 5 − 3 = 2</text>
    <text x="332" y="332" font-size="10" fill="#3a5a30">结算完压入 5，栈 = [2, 5]</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个下标入栈、出栈各至多一次 ⇒ 均摊 O(n) 时间，栈空间 O(n)</text>
</svg>
