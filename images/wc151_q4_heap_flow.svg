<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#6a7480"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">三个操作的处理流程：小根堆 + 尾部裁剪</text>
  <text x="280" y="40" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">堆里存「还有空位的栈编号」，取最小值即最左空位；空栈裁剪后末尾即最右非空</text>

  <rect x="14" y="52" width="170" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="99" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">push(val)</text>
  <rect x="196" y="52" width="170" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="281" y="70" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">pop()</text>
  <rect x="378" y="52" width="170" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="463" y="70" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">popAtStack(i)</text>

  <path d="M 99 78 L 99 86" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 281 78 L 281 86" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 78 L 463 86" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="14" y="88" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="14" y="162" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="14" y="236" width="170" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="196" y="88" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="196" y="162" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="196" y="236" width="170" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="378" y="88" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="378" y="162" width="170" height="62" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="8"/>
    <rect x="378" y="236" width="170" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>

  <g font-size="9.5" filter="url(#rough2)">
    <text x="24" y="106" fill="#3a4a66" font-size="10" font-weight="bold">① 清理过期堆顶</text>
    <text x="24" y="122" fill="#555">已满 或 index ≥ size</text>
    <text x="24" y="138" fill="#555">→ 弹出丢弃，直到有效</text>

    <text x="24" y="180" fill="#3a4a66" font-size="10" font-weight="bold">② 选落点</text>
    <text x="24" y="196" fill="#555">堆空 → 右端新开一栈</text>
    <text x="24" y="212" fill="#555">否则取出最小 index</text>

    <text x="24" y="254" fill="#3a4a66" font-size="10" font-weight="bold">③ 写入 + 回填</text>
    <text x="24" y="270" fill="#555">stacks[i].push(val)</text>
    <text x="24" y="286" fill="#555">未满则 i 压回堆</text>

    <text x="206" y="106" fill="#3a5a30" font-size="10" font-weight="bold">① 裁掉尾部空栈</text>
    <text x="206" y="122" fill="#555">while 末尾栈为空：</text>
    <text x="206" y="138" fill="#555">删除（size−−）</text>

    <text x="206" y="180" fill="#3a5a30" font-size="10" font-weight="bold">② 全空判定</text>
    <text x="206" y="196" fill="#555">stacks 空 → 返回 −1</text>
    <text x="206" y="212" fill="#555">否则末尾栈即最右非空</text>

    <text x="206" y="254" fill="#3a5a30" font-size="10" font-weight="bold">③ 弹出栈顶</text>
    <text x="206" y="270" fill="#555">值 = 末尾栈的顶</text>
    <text x="206" y="286" fill="#555">该 i 压入堆</text>

    <text x="388" y="106" fill="#8a6a20" font-size="10" font-weight="bold">① 非法下标</text>
    <text x="388" y="122" fill="#555">i ≥ size 或栈为空</text>
    <text x="388" y="138" fill="#555">→ 返回 −1</text>

    <text x="388" y="180" fill="#8a6a20" font-size="10" font-weight="bold">② 弹出栈顶</text>
    <text x="388" y="196" fill="#555">值 = stacks[i].pop()</text>
    <text x="388" y="212" fill="#555">i 压入堆</text>

    <text x="388" y="254" fill="#8a6a20" font-size="10" font-weight="bold">③ 不立刻删栈</text>
    <text x="388" y="270" fill="#555">中间空栈保留在行中</text>
    <text x="388" y="286" fill="#555">仍是 push 的候选</text>
  </g>

  <path d="M 99 150 L 99 160" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 281 150 L 281 160" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 150 L 463 160" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 99 224 L 99 234" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 281 224 L 281 234" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 224 L 463 234" stroke="#6a7480" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="14" y="312" width="530" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="28" y="330" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">关键：两个方向都不扫描</text>
  <text x="28" y="346" font-size="9" fill="#555" filter="url(#rough2)">堆顶 = 最左未满栈；裁掉尾部空栈后，末尾 = 最右非空栈——各自只需 O(1) 次访问。</text>
  <text x="28" y="361" font-size="9" fill="#555" filter="url(#rough2)">堆里允许有「已满 / 已裁掉」的过期编号，出堆时检查一次即可（惰性删除）。</text>

  <text x="280" y="388" text-anchor="middle" font-size="9" fill="#9a9a9a" filter="url(#rough2)">注意：push 时若堆非空，落点不一定是末尾栈——这正是「最左未满」与朴素追加的区别</text>
</svg>
