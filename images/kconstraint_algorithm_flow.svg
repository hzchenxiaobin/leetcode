<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="460" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">shrink-while-bad 计数滑窗流程</text>
  <path d="M 210 44 Q 350 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><ellipse cx="320" cy="76" rx="96" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="80" text-anchor="middle" font-size="11.5" fill="#2b6e9e" filter="url(#sk)">初始化：left = zeros = ones = 0</text>
  <g filter="url(#sk)"><path d="M 320 96 L 320 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="210" y="114" width="220" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="138" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#sk)">right 右移，s[right] 入窗 → 计数 +1</text>
  <g filter="url(#sk)"><path d="M 320 154 L 320 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><path d="M 320 172 L 430 210 L 320 248 L 210 210 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="320" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">zeros &gt; k 且 ones &gt; k ?</text>

  <g filter="url(#sk)"><rect x="40" y="186" width="140" height="48" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="110" y="206" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">s[left] 出窗 → 计数 −1</text>
  <text x="110" y="224" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">left++</text>
  <g filter="url(#sk)"><path d="M 208 210 L 184 210" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="196" y="202" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><path d="M 110 186 Q 110 158 318 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><path d="M 320 248 L 320 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="330" y="262" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="208" y="270" width="224" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">ans += right − left + 1</text>
  <g filter="url(#sk)"><path d="M 320 308 L 320 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><path d="M 320 326 L 415 356 L 320 386 L 225 356 Z" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.4"/></g>
  <text x="320" y="361" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#sk)">right == n−1 ?</text>

  <g filter="url(#sk)"><path d="M 415 356 L 560 356 L 560 134 L 434 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="424" y="348" font-size="10.5" fill="#33506b" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><path d="M 320 386 L 320 402" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>
  <text x="330" y="400" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><ellipse cx="320" cy="426" rx="64" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans</text>

  <g filter="url(#sk)"><rect x="28" y="306" width="180" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="118" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">⚠ 最大易错点</text>
  <text x="42" y="350" font-size="11" font-weight="bold" fill="#444" filter="url(#sk)">while 条件必须是 &amp;&amp;</text>
  <text x="42" y="370" font-size="10.5" fill="#444" filter="url(#sk)">两个计数都超才收缩</text>
  <text x="42" y="390" font-size="10.5" fill="#444" filter="url(#sk)">误写 || 会把只超一边</text>
  <text x="42" y="408" font-size="10.5" fill="#444" filter="url(#sk)">的好窗口收缩 → 漏计</text>

  <g filter="url(#sk)"><rect x="480" y="394" width="200" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="580" y="416" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">k ≥ 1 → 单字符窗口恒好</text>
  <text x="580" y="436" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">left ≤ right 恒成立</text>
</svg>
