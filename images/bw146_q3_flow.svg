<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="400" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两个方向各做一次"投影 + 分块"</text>
  <text x="250" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个方向 O(n log n)，两次共 O(n log n)</text>

  <rect x="110" y="60" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="250" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">canCut(lo, hi)：取区间 (r[lo], r[hi])</text>

  <path d="M 250 100 L 250 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="122" y="126" width="256" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="250" y="151" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">按左端点排序</text>

  <path d="M 250 166 L 250 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="98" y="192" width="304" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="250" y="212" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">blocks = 1，reach = 首个区间右端点</text>
  <text x="250" y="230" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">从左到右扫描剩余区间</text>

  <path d="M 250 238 L 250 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,262 340,298 250,334 160,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="294" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">s ≥ reach ？</text>
  <text x="250" y="312" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">breakpoint</text>

  <path d="M 340 298 L 368 298" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="352" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="372" y="278" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="303" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">blocks += 1</text>

  <path d="M 250 334 L 250 352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="348" font-size="9.5" fill="#666" filter="url(#rough2)">始终 reach = max(reach, e)</text>

  <rect x="96" y="356" width="308" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="250" y="379" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">blocks ≥ 3 → true；否则试另一方向，全败则 false</text>
</svg>
