<svg xmlns="http://www.w3.org/2000/svg" width="720" height="482" viewBox="0 0 720 482"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="482" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：6 组官方样例的切块结果</text>
  <path d="M 214 44 Q 360 51 506 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="30" y="62" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例</text>
  <rect x="92" y="62" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="134" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n　k</text>
  <rect x="182" y="62" width="300" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s 按块切开</text>
  <rect x="488" y="62" width="110" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="543" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">全 1 的块</text>
  <rect x="604" y="62" width="88" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="648" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1 -->
  <rect x="30" y="106" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="106" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8　2</text>
  <rect x="182" y="106" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">10 | 01 | 11 | 00</text>
  <rect x="488" y="106" width="110" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="132" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">第 3 块</text>
  <rect x="604" y="106" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="30" y="150" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="150" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5　1</text>
  <rect x="182" y="150" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1 | 1 | 1 | 1 | 1</text>
  <rect x="488" y="150" width="110" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="176" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5 块全部</text>
  <rect x="604" y="150" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>

  <!-- 行 3 -->
  <rect x="30" y="194" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="92" y="194" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8　4</text>
  <rect x="182" y="194" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0111 | 1110</text>
  <rect x="488" y="194" width="110" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="220" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">无</text>
  <rect x="604" y="194" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>

  <!-- 行 4 -->
  <rect x="30" y="238" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="92" y="238" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5　1</text>
  <rect x="182" y="238" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0 | 0 | 1 | 0 | 1</text>
  <rect x="488" y="238" width="110" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="264" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">第 3、5 块</text>
  <rect x="604" y="238" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>

  <!-- 行 5 -->
  <rect x="30" y="282" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="92" y="282" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4　4</text>
  <rect x="182" y="282" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1101</text>
  <rect x="488" y="282" width="110" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="308" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">无</text>
  <rect x="604" y="282" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="308" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>

  <!-- 行 6 -->
  <rect x="30" y="326" width="56" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="92" y="326" width="84" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4　4</text>
  <rect x="182" y="326" width="300" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="332" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1111</text>
  <rect x="488" y="326" width="110" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="543" y="352" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">第 1 块</text>
  <rect x="604" y="326" width="88" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <rect x="30" y="386" width="662" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="361" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 1 组：11 出现在第 3 块里，前两块各有 0，第 4 块 00 免费 —— 只需为第 3 块付 1 次</text>
  <text x="361" y="432" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 3、5 组说明「块很长也没关系」：k = 4 时一块里只要有一个 0 就整块免费</text>
  <text x="361" y="454" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">第 2、4 组 k = 1，块退化成单块田，答案就是字符串里 1 的个数</text>
</svg>
