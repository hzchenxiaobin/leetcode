<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#fdfcf7"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：模拟 4 步停机，剩余 1 次按轮转分配</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#666">nums = [2,1,3,5,6]，k = 5，m = 2，mx = 6</text>

  <!-- 五个面板：初始 + 四次操作 -->
  <!-- 面板框 -->
  <g filter="url(#sk)">
    <rect x="36" y="66" width="160" height="100" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="216" y="66" width="160" height="100" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="396" y="66" width="160" height="100" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="576" y="66" width="160" height="100" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="756" y="66" width="160" height="100" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>

  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="116" y="86" font-weight="bold">初始</text>
    <text x="296" y="86" font-weight="bold">操作① 1×2</text>
    <text x="476" y="86" font-weight="bold">操作② 2×2</text>
    <text x="656" y="86" font-weight="bold">操作③ 2×2</text>
    <text x="836" y="86" font-weight="bold" fill="#7a5415">操作④ 3×2=6≤6 ✓</text>
  </g>

  <!-- 面板间箭头 -->
  <g stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)">
    <path d="M 198 108 L 212 108" marker-end="url(#ar)"/>
    <path d="M 378 108 L 392 108" marker-end="url(#ar)"/>
    <path d="M 558 108 L 572 108" marker-end="url(#ar)"/>
    <path d="M 738 108 L 752 108" marker-end="url(#ar)"/>
  </g>

  <!-- 初始格子 -->
  <g font-size="13">
    <rect x="42.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="56" y="112" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="72.5" y="94" width="27" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="86" y="112" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="102.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="116" y="112" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="132.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="146" y="112" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="162.5" y="94" width="27" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
    <text x="176" y="112" text-anchor="middle" fill="#2e6e2e" font-weight="bold">6</text>
  </g>

  <!-- 操作① 后：[2,2,3,5,6]，下标1 变 -->
  <g font-size="13">
    <rect x="222.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="236" y="112" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="252.5" y="94" width="27" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="266" y="112" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="282.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="296" y="112" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="312.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="326" y="112" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="342.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="356" y="112" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- 操作② 后：[4,2,3,5,6]，下标0 变 -->
  <g font-size="13">
    <rect x="402.5" y="94" width="27" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="416" y="112" text-anchor="middle" fill="#7a5415" font-weight="bold">4</text>
    <rect x="432.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="446" y="112" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="462.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="476" y="112" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="492.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="506" y="112" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="522.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="536" y="112" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- 操作③ 后：[4,4,3,5,6]，下标1 变 -->
  <g font-size="13">
    <rect x="582.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="596" y="112" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="612.5" y="94" width="27" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="626" y="112" text-anchor="middle" fill="#7a5415" font-weight="bold">4</text>
    <rect x="642.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="656" y="112" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="672.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="686" y="112" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="702.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="716" y="112" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- 操作④ 后：[4,4,6,5,6]，下标2 变（取等） -->
  <g font-size="13">
    <rect x="762.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="776" y="112" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="792.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="806" y="112" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="822.5" y="94" width="27" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="836" y="112" text-anchor="middle" fill="#7a5415" font-weight="bold">6</text>
    <rect x="852.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="866" y="112" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="882.5" y="94" width="27" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="896" y="112" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- 下标标注 -->
  <g font-size="8" fill="#999" text-anchor="middle">
    <text x="56" y="134">0</text>
    <text x="86" y="134">1</text>
    <text x="116" y="134">2</text>
    <text x="146" y="134">3</text>
    <text x="176" y="134">4</text>
    <text x="236" y="134">0</text>
    <text x="266" y="134">1</text>
    <text x="296" y="134">2</text>
    <text x="326" y="134">3</text>
    <text x="356" y="134">4</text>
    <text x="416" y="134">0</text>
    <text x="446" y="134">1</text>
    <text x="476" y="134">2</text>
    <text x="506" y="134">3</text>
    <text x="536" y="134">4</text>
    <text x="596" y="134">0</text>
    <text x="626" y="134">1</text>
    <text x="656" y="134">2</text>
    <text x="686" y="134">3</text>
    <text x="716" y="134">4</text>
    <text x="776" y="134">0</text>
    <text x="806" y="134">1</text>
    <text x="836" y="134">2</text>
    <text x="866" y="134">3</text>
    <text x="896" y="134">4</text>
  </g>

  <!-- k 徽标 -->
  <g font-size="11" fill="#8e5db8" font-weight="bold" text-anchor="middle">
    <text x="116" y="156">k = 5</text>
    <text x="296" y="156">k = 4</text>
    <text x="476" y="156">k = 3</text>
    <text x="656" y="156">k = 2</text>
    <text x="836" y="156">k = 1</text>
  </g>

  <!-- 停机检查 -->
  <rect x="40" y="186" width="460" height="48" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" filter="url(#sk)"/>
  <text x="270" y="207" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">停机检查：堆顶 (4,0)，4 × 2 = 8 &gt; 6 = mx → 停机</text>
  <text x="270" y="226" text-anchor="middle" font-size="10.5" fill="#b03a3a">剩余 k = 1，且此刻所有 y 都满足 y × 2 &gt; 6</text>

  <!-- divmod -->
  <rect x="520" y="186" width="410" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="725" y="207" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">出堆升序 order = [(4,0), (4,1), (5,3), (6,2), (6,4)]</text>
  <text x="725" y="226" text-anchor="middle" font-size="11" fill="#2b6e9e">q = 1 div 5 = 0，r = 1 mod 5 = 1 → 只有 rank 0 多乘一次</text>

  <!-- 分配表 -->
  <text x="310" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">分配阶段（q = 0，r = 1）</text>

  <g filter="url(#sk)">
    <rect x="60" y="274" width="70" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="130" y="274" width="120" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="250" y="274" width="150" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="400" y="274" width="80" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="480" y="274" width="80" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#2b6e9e" font-weight="bold" text-anchor="middle">
    <text x="95" y="290">rank</text>
    <text x="190" y="290">(值, 下标)</text>
    <text x="325" y="290">乘 m^(q+[rank&lt;r])</text>
    <text x="440" y="290">最终值</text>
    <text x="520" y="290">填入</text>
  </g>

  <!-- 行 0：高亮 -->
  <g filter="url(#sk)">
    <rect x="60" y="298" width="70" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="130" y="298" width="120" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="250" y="298" width="150" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="400" y="298" width="80" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="480" y="298" width="80" height="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="95" y="316" fill="#7a5415" font-weight="bold">0</text>
    <text x="190" y="316" fill="#7a5415" font-weight="bold">(4, 0)</text>
    <text x="325" y="316" fill="#7a5415" font-weight="bold">m^1 = 2</text>
    <text x="440" y="316" fill="#7a5415" font-weight="bold">8</text>
    <text x="520" y="316" fill="#7a5415" font-weight="bold">ans[0]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="324" width="70" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="324" width="120" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="250" y="324" width="150" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="324" width="80" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="480" y="324" width="80" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="95" y="342">1</text>
    <text x="190" y="342">(4, 1)</text>
    <text x="325" y="342">m^0 = 1</text>
    <text x="440" y="342">4</text>
    <text x="520" y="342">ans[1]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="350" width="70" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="350" width="120" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="250" y="350" width="150" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="350" width="80" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="480" y="350" width="80" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="95" y="368">2</text>
    <text x="190" y="368">(5, 3)</text>
    <text x="325" y="368">m^0 = 1</text>
    <text x="440" y="368">5</text>
    <text x="520" y="368">ans[3]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="376" width="70" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="376" width="120" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="250" y="376" width="150" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="376" width="80" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
    <rect x="480" y="376" width="80" height="26" fill="#fffdf3" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="95" y="394">3</text>
    <text x="190" y="394">(6, 2)</text>
    <text x="325" y="394">m^0 = 1</text>
    <text x="440" y="394">6</text>
    <text x="520" y="394">ans[2]</text>
  </g>

  <g filter="url(#sk)">
    <rect x="60" y="402" width="70" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="130" y="402" width="120" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="250" y="402" width="150" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="400" y="402" width="80" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
    <rect x="480" y="402" width="80" height="26" fill="#faf8f0" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11.5" fill="#444" text-anchor="middle">
    <text x="95" y="420">4</text>
    <text x="190" y="420">(6, 4)</text>
    <text x="325" y="420">m^0 = 1</text>
    <text x="440" y="420">6</text>
    <text x="520" y="420">ans[4]</text>
  </g>

  <!-- 结果框 -->
  <rect x="600" y="286" width="330" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="765" y="312" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">最终 ans = [8, 4, 6, 5, 6]</text>
  <text x="765" y="336" text-anchor="middle" font-size="11" fill="#2e6e2e">与官方示例逐步模拟的结果完全一致 ✓</text>

  <!-- 为什么是 (4,0) -->
  <rect x="600" y="366" width="330" height="62" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" filter="url(#sk)"/>
  <text x="765" y="388" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">为什么恰好是 (4,0) 多乘一次？</text>
  <text x="765" y="408" text-anchor="middle" font-size="10.5" fill="#444">停机后第 1 次操作取「当前最小」，</text>
  <text x="765" y="424" text-anchor="middle" font-size="10.5" fill="#444">即升序第 1 名 (4,0) → 4 × 2 = 8</text>

  <text x="310" y="456" text-anchor="middle" font-size="10.5" fill="#888">对照：不停机硬模拟第 5 次操作也是取堆顶 (4,0) → 8 ——「前 r 名多乘一次」正是逐轮操作的浓缩</text>
</svg>
