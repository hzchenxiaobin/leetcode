<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="505" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">两个示例：嵌套配对怎么花预算</text>

  <!-- ===== 面板 1：示例 1 ===== -->
  <text x="40" y="52" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1：s = "abced"，k = 2</text>
  <text x="520" y="52" text-anchor="end" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">长度 3</text>

  <!-- 配对弧 (1,4) -->
  <path d="M 186,96 C 186,50 318,50 318,96" fill="none" stroke="#d6a040" stroke-width="2.5" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="252" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">配对 (1, 4)：d(b, d) = 2</text>

  <!-- 原串 -->
  <rect x="120" y="100" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="164" y="100" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="208" y="100" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="252" y="100" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="100" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="186" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="230" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="274" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="318" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <text x="142" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="186" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="230" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="274" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="318" y="158" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="230" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">中心字符：免费</text>

  <!-- 变换箭头 -->
  <path d="M 96,120 C 88,150 88,165 96,196" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="44" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">2 次操作</text>

  <!-- 结果串 -->
  <text x="186" y="186" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">b→c</text>
  <text x="318" y="186" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">d→c</text>
  <rect x="120" y="192" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="164" y="192" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="208" y="192" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="252" y="192" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="296" y="192" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="164" y="192" width="44" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="208" y="192" width="44" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="296" y="192" width="44" height="40" rx="4" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="142" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="186" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="230" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="274" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="318" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="360" y="210" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">取下标 1、2、4 → "ccc"</text>
  <text x="360" y="232" font-size="12.5" fill="#b85450" filter="url(#rough2)">回文长度 3</text>
  <text x="280" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">总代价 2 = k ✓（预算恰好花完）</text>

  <path d="M 40,272 L 520,272" fill="none" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- ===== 面板 2：示例 2 ===== -->
  <text x="40" y="296" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：s = "aaazzz"，k = 4</text>
  <text x="520" y="296" text-anchor="end" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">长度 6</text>

  <!-- 三条嵌套配对弧 -->
  <path d="M 112,354 C 112,308 332,308 332,354" fill="none" stroke="#446688" stroke-width="2.5" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 156,354 C 156,322 288,322 288,354" fill="none" stroke="#4a7a3a" stroke-width="2" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 200,354 C 200,334 244,334 244,354" fill="none" stroke="#d6a040" stroke-width="2" marker-start="url(#arrO)" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="352" y="316" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">外 (0,5)：d(a,z) = 1</text>
  <text x="352" y="334" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">中 (1,4)：d(a,z) = 1</text>
  <text x="352" y="350" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">内 (2,3)：d(a,z) = 1</text>

  <!-- 原串 -->
  <rect x="90" y="356" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="356" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="178" y="356" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="356" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="266" y="356" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="310" y="356" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="156" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="200" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="244" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <text x="288" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <text x="332" y="381" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <text x="112" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="156" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="200" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="244" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="288" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="332" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- 变换箭头 -->
  <path d="M 66,376 C 58,402 58,424 66,436" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="26" y="410" font-size="11" fill="#b85450" filter="url(#rough2)">3 次操作</text>

  <!-- 结果串 -->
  <text x="112" y="424" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">a→z</text>
  <text x="244" y="424" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">z→a</text>
  <text x="288" y="424" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">z→a</text>
  <rect x="90" y="428" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="134" y="428" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="178" y="428" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="222" y="428" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="266" y="428" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="310" y="428" width="44" height="40" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="112" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <text x="156" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="200" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="244" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="288" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="332" y="453" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">z</text>
  <path d="M 90,472 L 354,472" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="360" y="455" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">"zaaaaz" 整串回文</text>
  <text x="360" y="475" font-size="12.5" fill="#b85450" filter="url(#rough2)">回文长度 6</text>
  <text x="280" y="494" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">总代价 1+1+1 = 3 ≤ k = 4 ✓（剩 1 次不必花）</text>
</svg>
