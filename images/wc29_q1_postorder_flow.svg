<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：一次后序 DFS，两个产物</text>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#888"
        filter="url(#rough2)">产物 ① 全局累加的坡度总和　产物 ② 向上返回的子树和</text>

  <rect x="150" y="66" width="220" height="42" rx="9" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">dfs(v)：处理以 v 为根的子树</text>

  <rect x="150" y="138" width="220" height="42" rx="9" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">L = dfs(v.left)　R = dfs(v.right)</text>

  <rect x="150" y="210" width="220" height="42" rx="9" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="236" text-anchor="middle" font-size="13" fill="#b85450"
        filter="url(#rough2)">total += abs(L − R)</text>

  <rect x="150" y="282" width="220" height="42" rx="9" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a"
        filter="url(#rough2)">return L + R + v.val</text>

  <path d="M 260 108 L 260 136" stroke="#4a7a3a" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 180 L 260 208" stroke="#4a7a3a" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 252 L 260 280" stroke="#4a7a3a" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="140" y="240" text-anchor="end" font-size="11" fill="#d6a040"
        filter="url(#rough2)">先子后父</text>
  <text x="380" y="240" text-anchor="start" font-size="11" fill="#b85450"
        filter="url(#rough2)">取绝对值</text>
  <text x="380" y="308" text-anchor="start" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">和向上回流</text>
  <text x="140" y="308" text-anchor="end" font-size="11" fill="#888"
        filter="url(#rough2)">父节点复用</text>

  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#666"
        filter="url(#rough2)">空节点直接返回 0，因此「没有左/右子树」自然等价于和为 0</text>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#888"
        filter="url(#rough2)">树中每个节点恰好访问一次，无需第二遍遍历</text>
</svg>
