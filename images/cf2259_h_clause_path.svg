<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">子句的几何结构：共端点的被「吃掉」，剩下的连成路径</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">A. 两条子句共用左端点 ⟹ 短子句的右端点落进长条子句的禁止区间</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="168" y="62" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="190" y="82" fill="#2f5a24">1</text>
    <rect x="212" y="62" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="234" y="82" fill="#8a3a36">2</text>
    <rect x="256" y="62" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="278" y="82" fill="#8a3a36">3</text>
    <rect x="300" y="62" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="322" y="82" fill="#8a3a36">4</text>
    <rect x="344" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="366" y="82" fill="#3a4a66">5</text>
    <rect x="388" y="62" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="410" y="82" fill="#3a4a66">6</text>
  </g>

  <path d="M 190 96 L 190 104 L 278 104 L 278 96" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="222" y="120" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">A: (1 ∨ 3)，i=2, v=1</text>

  <path d="M 190 130 L 190 138 L 366 138 L 366 130" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="404" y="142" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">B: (1 ∨ 5)，i=3, v=2，禁止 2…4</text>

  <path d="M 278 92 L 278 130" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">3 号被 B 禁 ⟹ A 只剩 1 可用 ⟹ 1 号被强制选</text>

  <rect x="56" y="172" width="508" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="72" y="192" font-size="10" fill="#8a3a36" filter="url(#rough2)">结论：共端点的两条子句，必有一条被逼成「强制选」，不会同时「两端自由」。</text>
  <text x="72" y="210" font-size="10" fill="#8a3a36" filter="url(#rough2)">⟹ 活跃子句两两不共端点，每点度数 ≤ 2；最左点不可能是某条边的右端点 ⟹ 无环。</text>
  <text x="72" y="226" font-size="10" fill="#8a3a36" filter="url(#rough2)">⟹ 活跃子句图是互不相交的路径之并，各连通块独立计数。</text>

  <text x="310" y="258" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">B. 链式共享端点：一条路径上「每边至少选一端」</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="146" y="272" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="168" y="292" fill="#2f5a24">1</text>
    <rect x="190" y="272" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="212" y="292" fill="#8a3a36">2</text>
    <rect x="234" y="272" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="256" y="292" fill="#2f5a24">3</text>
    <rect x="278" y="272" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="300" y="292" fill="#8a3a36">4</text>
    <rect x="322" y="272" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="344" y="292" fill="#2f5a24">5</text>
    <rect x="366" y="272" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="388" y="292" fill="#8a3a36">6</text>
    <rect x="410" y="272" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="432" y="292" fill="#2f5a24">7</text>
  </g>
  <text x="310" y="318" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">b_2 = b_4 = b_6 = 1 ⟹ 子句 (1∨3)、(3∨5)、(5∨7)，禁止集合只有 {2,4,6}</text>

  <g filter="url(#rough2)">
    <circle cx="168" cy="356" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="256" cy="356" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="344" cy="356" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="432" cy="356" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M 182 356 L 242 356" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M 270 356 L 330 356" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M 358 356 L 418 356" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="168" y="361" text-anchor="middle" font-size="11" fill="#2f5a24">1</text>
    <text x="256" y="361" text-anchor="middle" font-size="11" fill="#2f5a24">3</text>
    <text x="344" y="361" text-anchor="middle" font-size="11" fill="#2f5a24">5</text>
    <text x="432" y="361" text-anchor="middle" font-size="11" fill="#2f5a24">7</text>
  </g>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">活跃子句图 = 4 个点的路径 P4，每条边要求「至少选一个端点」</text>

  <rect x="60" y="404" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="421" font-size="10" fill="#8a6a20" filter="url(#rough2)">k 个点的路径上「每边至少选一端」的方案数 = 独立集数 = F(k+2)（F(1)=F(2)=1）。</text>
  <text x="76" y="438" font-size="10" fill="#8a6a20" filter="url(#rough2)">P4 贡献 F(6)=8；孤立自由点贡献 2 = F(3)，同一公式，逐块相乘即可。</text>
  <text x="76" y="455" font-size="9.5" fill="#999" filter="url(#rough2)">补集视角：顶点覆盖的补 = 独立集，所以覆盖数 = 独立集数。</text>
</svg>
