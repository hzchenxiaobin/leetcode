<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：两次计数 → 逐字符求商 → 取最小</text>
  <path d="M 250 44 Q 440 52 630 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 步骤 1：统计 s 词频 -->
  <rect x="50" y="90" width="200" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8" filter="url(#sk)"/>
  <text x="150" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">① 统计 s 的词频</text>
  <text x="150" y="146" text-anchor="middle" font-size="11.5" fill="#444">遍历 s 一遍</text>
  <text x="150" y="168" text-anchor="middle" font-size="11.5" fill="#444">cntS[ch] += 1</text>
  <text x="150" y="194" text-anchor="middle" font-size="11" fill="#888">O(n)，n = |s| ≤ 100</text>

  <!-- 步骤 2：统计 target 词频 -->
  <rect x="50" y="250" width="200" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="150" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">② 统计 target 的词频</text>
  <text x="150" y="306" text-anchor="middle" font-size="11.5" fill="#444">遍历 target 一遍</text>
  <text x="150" y="328" text-anchor="middle" font-size="11.5" fill="#444">cntT[ch] += 1</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" fill="#888">O(m)，m = |target| ≤ 10</text>

  <!-- 步骤 3：逐字符求商取 min -->
  <rect x="330" y="90" width="240" height="280" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="450" y="120" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">③ 对 target 中每个字母 c</text>

  <rect x="352" y="140" width="196" height="52" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" fill="#444">ans = min(ans,</text>
  <text x="450" y="182" text-anchor="middle" font-size="12.5" fill="#444">cntS[c] / cntT[c])</text>

  <rect x="352" y="208" width="196" height="64" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36">⚠️ 整数除法自动向下取整</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#8c3a36">cntS[c]=3, cntT[c]=2 时</text>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#8c3a36">该字符只能供 1 份（剩 1 个浪费）</text>

  <text x="450" y="302" text-anchor="middle" font-size="11" fill="#888">target 中没出现的字母不参与</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#888">min —— 它们不构成约束</text>
  <text x="450" y="352" text-anchor="middle" font-size="11" fill="#888">cntT[c] ≥ 1，无除零风险</text>

  <!-- 输出 -->
  <rect x="640" y="160" width="190" height="140" rx="10" fill="#f0f6fc" stroke="#4a8edb" stroke-width="2" filter="url(#sk)"/>
  <text x="735" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">④ 返回 ans</text>
  <text x="735" y="228" text-anchor="middle" font-size="11.5" fill="#444">初值设为「无穷大」</text>
  <text x="735" y="248" text-anchor="middle" font-size="11.5" fill="#444">（如 10^9 或 |s|）</text>
  <text x="735" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">最稀缺字母的份数</text>

  <!-- 箭头 -->
  <path d="M 254 150 C 290 150, 300 150, 326 150" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 254 310 C 290 310, 296 250, 326 220" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arGr)" filter="url(#sk)"/>
  <path d="M 574 230 C 600 230, 610 230, 636 230" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- 底部小结 -->
  <rect x="50" y="396" width="780" height="0" fill="none"/>
  <text x="440" y="400" text-anchor="middle" font-size="12" fill="#888">两次线性扫描 + 最多 26 次除法，时间 O(n + m)，空间 O(26) = O(1)</text>
</svg>
