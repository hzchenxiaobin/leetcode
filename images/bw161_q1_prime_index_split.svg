<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">质数下标进 A，其余进 B，最后取绝对差</text>
  <text x="84" y="78" text-anchor="end" font-size="14" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="126" y="56" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">-1</text>
  <text x="152" y="116" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 0</text>
  <rect x="188" y="56" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="214" y="116" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 1</text>
  <rect x="250" y="56" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="276.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="276" y="116" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 2</text>
  <rect x="312" y="56" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="338.0" y="81.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="338" y="116" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标 3</text>
  <text x="276" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">质数</text>
  <text x="338" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">质数</text>
  <rect x="66" y="168" width="250" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="191" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">A：质数下标</text>
  <text x="191" y="226" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7 + 0 = 7</text>
  <rect x="340" y="168" width="250" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="196" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">B：其余下标</text>
  <text x="465" y="226" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">−1 + 5 = 4</text>
  <path d="M 316 207 Q 328 207 340 207" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="276" width="300" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="300" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">|sum(A) − sum(B)| = |7 − 4|</text>
  <text x="330" y="326" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">答案 3</text>
</svg>
