<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="620" height="396" fill="#fafafa"/>
<text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">先算出每个节点的翻转收益 d，再修一次奇偶</text>
<rect x="196" y="44" width="228" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="310" y="71" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">d_i = (nums[i] XOR k) − nums[i]</text>
<path d="M310,86 L310,108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M310,110 L410,152 L310,194 L210,152 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="310" y="148" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">正收益 d &amp;gt; 0</text>
<text x="310" y="168" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">的个数为偶？</text>
<path d="M210,152 L160,152" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
<path d="M160,152 L160,214" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="184" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">是</text>
<rect x="36" y="216" width="250" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="161" y="240" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">全部翻转正收益</text>
<text x="161" y="262" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">收益 = Σd⁺</text>
<path d="M410,152 L462,152" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
<path d="M462,152 L462,214" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
<text x="438" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="330" y="216" width="270" height="76" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
<text x="465" y="238" text-anchor="middle" font-size="12" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">取两者较大：</text>
<text x="465" y="258" text-anchor="middle" font-size="12" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">Σd⁺ − min d⁺（少翻一个）</text>
<text x="465" y="278" text-anchor="middle" font-size="12" fill="#7a2f2c" font-weight="normal" filter="url(#roughs)">Σd⁺ + max d⁻（多翻一个）</text>
<path d="M161,276 L230,320" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M465,292 L390,320" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
<rect x="190" y="322" width="240" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="310" y="350" text-anchor="middle" font-size="14" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">答案 = Σnums + 收益</text>
<text x="310" y="382" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">例：[8,4], k=5 → d = (+5,−3)，正收益 1 个（奇）→ max(0, 2) = 2 → 14</text>
</svg>
