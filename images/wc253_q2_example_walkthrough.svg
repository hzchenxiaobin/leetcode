<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：堆顶动态变化与 sum 同步扣减</text>
  <path d="M 140 38 Q 340 48 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1 -->
  <text x="60" y="64" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">例 1：piles = [5, 4, 9]，k = 2</text>

  <text x="76" y="98" font-size="11.5" fill="#8a8f98" filter="url(#sk)">初始</text>
  <g filter="url(#sk)"><rect x="250" y="78" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="290" y="78" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="330" y="78" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <text x="420" y="98" font-size="12" fill="#555" filter="url(#sk)">sum = 18</text>

  <text x="60" y="138" font-size="11.5" fill="#8c3a36" filter="url(#sk)">堆顶 9：移除 4</text>
  <path d="M 196 122 L 244 122" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="108" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="290" y="108" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="330" y="108" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <text x="420" y="128" font-size="12" fill="#555" filter="url(#sk)">sum = 14</text>
  <text x="470" y="128" font-size="10.5" fill="#8a8f98" filter="url(#sk)">← 9 变 5，与原 5 并列最大</text>

  <text x="60" y="178" font-size="11.5" fill="#8c3a36" filter="url(#sk)">堆顶 5：移除 2</text>
  <path d="M 196 162 L 244 162" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="148" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="267" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="290" y="148" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="330" y="148" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="420" y="168" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">sum = 12 ✓</text>

  <!-- Example 2 -->
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">例 2：piles = [4, 3, 6, 7]，k = 3</text>

  <text x="76" y="246" font-size="11.5" fill="#8a8f98" filter="url(#sk)">初始</text>
  <g filter="url(#sk)"><rect x="250" y="226" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="290" y="226" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="330" y="226" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="370" y="226" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="387" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="452" y="246" font-size="12" fill="#555" filter="url(#sk)">sum = 20</text>

  <text x="60" y="286" font-size="11.5" fill="#8c3a36" filter="url(#sk)">堆顶 7：移除 3</text>
  <path d="M 196 270 L 244 270" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="256" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="290" y="256" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="330" y="256" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="370" y="256" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="387" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="452" y="276" font-size="12" fill="#555" filter="url(#sk)">sum = 17</text>

  <text x="60" y="326" font-size="11.5" fill="#8c3a36" filter="url(#sk)">堆顶 6：移除 3</text>
  <path d="M 196 310 L 244 310" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="296" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="290" y="296" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="330" y="296" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="370" y="296" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="387" y="316" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <text x="452" y="316" font-size="12" fill="#555" filter="url(#sk)">sum = 14</text>

  <text x="60" y="366" font-size="11.5" fill="#8c3a36" filter="url(#sk)">堆顶 4：移除 2</text>
  <path d="M 196 350 L 244 350" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="250" y="336" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="267" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="290" y="336" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="307" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="330" y="336" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="347" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="370" y="336" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="387" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="452" y="356" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">sum = 12 ✓</text>

  <!-- observation box -->
  <g filter="url(#sk)"><rect x="520" y="220" width="146" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="593" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">观察</text>
  <text x="532" y="268" font-size="10.5" fill="#3d5c34" filter="url(#sk)">· 堆顶会变：9→5 后</text>
  <text x="538" y="286" font-size="10.5" fill="#3d5c34" filter="url(#sk)">与原 5 并列最大</text>
  <text x="532" y="308" font-size="10.5" fill="#3d5c34" filter="url(#sk)">· 小堆没份：例 2 的 3</text>
  <text x="538" y="326" font-size="10.5" fill="#3d5c34" filter="url(#sk)">全程未被操作</text>
  <text x="532" y="348" font-size="10.5" fill="#3d5c34" filter="url(#sk)">· 名额自动流向</text>
  <text x="538" y="366" font-size="10.5" fill="#3d5c34" filter="url(#sk)">当前边际最大处</text>

  <!-- bottom conclusion -->
  <text x="60" y="400" font-size="12" fill="#555" filter="url(#sk)">堆内元素从大到小排列；</text>
  <text x="60" y="424" font-size="12" fill="#555" filter="url(#sk)">橙色格 = 当前堆顶（下一刀的对象）。</text>
  <text x="60" y="452" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">总移除 = 每轮 ⌊t/2⌋ 之和：例 1 摘 4+2 = 6（18−6 = 12）；例 2 摘 3+3+2 = 8（20−8 = 12）。</text>
</svg>
