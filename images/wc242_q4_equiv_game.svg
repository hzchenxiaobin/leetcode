<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">等价博弈：在前缀和数组上轮流挑严格递增的位置</text>
  <path d="M 240 44 Q 470 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: prefix sums ===== -->
  <text x="280" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 前缀和数组（示例 1）</text>

  <g font-size="13">
    <text x="88" y="128" font-size="10.5" fill="#888" font-weight="bold">位置 j:</text>
    <text x="160" y="128" text-anchor="middle" font-size="10.5" fill="#666">1</text>
    <text x="250" y="128" text-anchor="middle" font-size="10.5" fill="#666">2</text>
    <text x="340" y="128" text-anchor="middle" font-size="10.5" fill="#666">3</text>
    <text x="430" y="128" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">4</text>
    <text x="520" y="128" text-anchor="middle" font-size="10.5" fill="#7a2828" font-weight="bold">5 = n</text>

    <g filter="url(#sk)"><rect x="115" y="134" width="90" height="44" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="160" y="162" text-anchor="middle" fill="#999">-1</text>
    <g filter="url(#sk)"><rect x="205" y="134" width="90" height="44" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="250" y="162" text-anchor="middle" fill="#999">1</text>
    <g filter="url(#sk)"><rect x="295" y="134" width="90" height="44" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="340" y="162" text-anchor="middle" fill="#999">-2</text>
    <g filter="url(#sk)"><rect x="385" y="134" width="90" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
    <text x="430" y="162" text-anchor="middle" fill="#2b6e9e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="475" y="134" width="90" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
    <text x="520" y="162" text-anchor="middle" fill="#b03a3a" font-weight="bold">-3</text>
  </g>
  <text x="318" y="204" text-anchor="middle" font-size="10" fill="#888">pre[j] = 前 j 块石头之和；选位置 j 即得 pre[j] 分</text>

  <!-- rules box -->
  <g filter="url(#sk)">
    <rect x="610" y="72" width="300" height="140" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="630" y="96" font-size="12" font-weight="bold" fill="#7a5415">等价游戏规则</text>
  <text x="630" y="120" font-size="11" fill="#444">· 轮流选位置 j，必须严格大于上一个</text>
  <text x="630" y="142" font-size="11" fill="#444">· 选 j 得分 pre[j]，指针移到 j</text>
  <text x="630" y="164" font-size="11" fill="#7a2828" font-weight="bold">· 谁选中 j = n 游戏立即结束</text>
  <text x="630" y="186" font-size="11" fill="#444">· Alice 先手最大化差，Bob 最小化差</text>
  <text x="630" y="204" font-size="10" fill="#888">（首步必须 j ≥ 2，对应 x &gt; 1）</text>

  <!-- ===== Panel 2: playthrough A ===== -->
  <text x="280" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 对局 A：Alice → 4，Bob 被迫 → 5</text>

  <g font-size="13">
    <g filter="url(#sk)"><circle cx="120" cy="296" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="120" y="301" text-anchor="middle" fill="#999">1</text>
    <g filter="url(#sk)"><circle cx="250" cy="296" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" opacity="0.6"/></g>
    <text x="250" y="301" text-anchor="middle" fill="#bbb">2</text>
    <g filter="url(#sk)"><circle cx="380" cy="296" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" opacity="0.6"/></g>
    <text x="380" y="301" text-anchor="middle" fill="#bbb">3</text>
    <g filter="url(#sk)"><circle cx="510" cy="296" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
    <text x="510" y="301" text-anchor="middle" fill="#2b6e9e" font-weight="bold">4</text>
    <g filter="url(#sk)"><circle cx="640" cy="296" r="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
    <text x="640" y="301" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
  </g>
  <!-- jumps -->
  <path d="M 137 288 Q 320 236 491 288" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="314" y="254" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">Alice 选 4，得 +2</text>
  <path d="M 529 288 Q 576 250 621 288" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="578" y="262" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">Bob 被迫选 5，得 -3</text>
  <text x="760" y="292" text-anchor="middle" font-size="11.5" fill="#444">游戏结束</text>
  <text x="760" y="312" text-anchor="middle" font-size="12" fill="#7a2828" font-family="monospace" font-weight="bold">差 = 2-(-3) = 5</text>

  <!-- ===== Panel 3: playthrough B ===== -->
  <text x="280" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">③ 对局 B：Alice 一步跳到 5，直接终局</text>

  <g font-size="13">
    <g filter="url(#sk)"><circle cx="120" cy="416" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
    <text x="120" y="421" text-anchor="middle" fill="#999">1</text>
    <g filter="url(#sk)"><circle cx="250" cy="416" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" opacity="0.5"/></g>
    <text x="250" y="421" text-anchor="middle" fill="#ccc">2</text>
    <g filter="url(#sk)"><circle cx="380" cy="416" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" opacity="0.5"/></g>
    <text x="380" y="421" text-anchor="middle" fill="#ccc">3</text>
    <g filter="url(#sk)"><circle cx="510" cy="416" r="17" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" opacity="0.5"/></g>
    <text x="510" y="421" text-anchor="middle" fill="#ccc">4</text>
    <g filter="url(#sk)"><circle cx="640" cy="416" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="640" y="421" text-anchor="middle" fill="#b03a3a" font-weight="bold">5</text>
  </g>
  <path d="M 138 406 Q 390 350 618 406" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)" stroke-dasharray="6 4"/>
  <text x="384" y="372" text-anchor="middle" font-size="11" fill="#7a2828" font-weight="bold">Alice 选 5（全部吞并），得 -3</text>
  <text x="760" y="408" text-anchor="middle" font-size="11.5" fill="#444">Bob 无从出手</text>
  <text x="760" y="428" text-anchor="middle" font-size="12" fill="#7a2828" font-family="monospace" font-weight="bold">差 = -3 - 0 = -3</text>

  <!-- ===== conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="470" width="780" height="142" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="470" y="498" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Alice 在所有「对局」中挑差最大的 —— 但位置数 O(n)，路径指数级，不能枚举</text>
  <text x="470" y="524" text-anchor="middle" font-size="11.5" fill="#444">这是零和博弈 + 无后效性（只依赖当前指针 j 和轮到谁）→ 记忆化 / 倒序 DP 可解</text>
  <text x="470" y="548" text-anchor="middle" font-size="11.5" fill="#444">进一步：得分只由「被选中位置的集合」决定，与轮次无关 → dp[i] 定义为当前玩家的最大分差</text>
  <text x="470" y="578" text-anchor="middle" font-size="12" fill="#7a2828" font-weight="bold">转移：dp[i] = max{ pre[j] - dp[j] : j &gt; i }，dp[n] = 0，答案 dp[1]</text>
</svg>
