<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：降序排序 → 逐轮累加 max(h[i] − i, 0)</text>
  <path d="M 160 36 Q 310 44 460 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- A -->
  <g filter="url(#r)">
    <rect x="200" y="48" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="71" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">happiness 按幸福值降序排序</text>
  <path d="M 310 84 L 310 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- B -->
  <g filter="url(#r)">
    <rect x="230" y="102" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="125" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#r)">i ← 0，ans ← 0</text>
  <path d="M 310 138 L 310 154" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>

  <!-- diamond -->
  <g filter="url(#r)">
    <polygon points="310,158 400,196 310,234 220,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="310" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#r)">i &lt; k ?</text>

  <!-- yes branch -->
  <text x="408" y="190" font-size="12.5" font-weight="bold" fill="#b0722a" filter="url(#r)">是</text>
  <path d="M 400 196 L 444 196" stroke="#b0722a" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="448" y="170" width="152" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="524" y="192" text-anchor="middle" font-size="12.5" fill="#7a3230" filter="url(#r)">ans += max(h[i] − i, 0)</text>
  <text x="524" y="212" text-anchor="middle" font-size="12.5" fill="#7a3230" filter="url(#r)">i += 1</text>
  <!-- loop back -->
  <path d="M 524 222 L 524 250 L 220 250 L 220 200" stroke="#b0722a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="368" y="244" font-size="11" fill="#b0722a" filter="url(#r)">回到判断</text>

  <!-- no branch -->
  <text x="310" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">否（已选满 k 个）</text>
  <path d="M 310 264 L 310 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="240" y="298" width="140" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="310" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#r)">return ans</text>

  <!-- note -->
  <g filter="url(#r)">
    <rect x="40" y="382" width="540" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="62" y="402" font-size="12" fill="#444" filter="url(#r)">降序后一旦 happiness[i] ≤ i，其后贡献全为 0，可提前 break（截断 + 单调性保证）</text>
  <text x="62" y="422" font-size="12" fill="#444" filter="url(#r)">答案上界 k × max(h) ≤ 2×10¹³，C++ 累加器必须用 long long，防 int 溢出</text>
</svg>
