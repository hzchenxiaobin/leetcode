<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">回文的奇偶结构：字符成对出现，至多一个落单在中心</text>

  <!-- 偶数长度回文 -->
  <text x="110" y="64" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">长度偶：全部成对</text>
  <g filter="url(#rough2)">
    <rect x="34" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="106" y="76" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="142" y="76" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="178" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="214" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="51" y="98">a</text><text x="87" y="98">n</text><text x="123" y="98">b</text>
    <text x="159" y="98">b</text><text x="195" y="98">n</text><text x="231" y="98">a</text>
  </g>
  <path d="M 51 116 C 51 138, 231 138, 231 118" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 123 114 C 123 128, 159 128, 159 114" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="110" y="152" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">anbbna：a、n、b 都出现偶数次</text>

  <!-- 奇数长度回文 -->
  <text x="430" y="64" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">长度奇：一个中心落单</text>
  <g filter="url(#rough2)">
    <rect x="354" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="426" y="76" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="462" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="498" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="371" y="98">a</text><text x="407" y="98">n</text><text x="443" y="98" fill="#b85450">b</text>
    <text x="479" y="98">n</text><text x="515" y="98">a</text>
  </g>
  <path d="M 371 116 C 371 140, 515 140, 515 118" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="443" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">b 是唯一的奇计数字符（中心）</text>

  <!-- 计数论证 -->
  <rect x="34" y="176" width="498" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="283" y="200" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">设 s 中计数为奇数的字符有 m 种（示例：leetcode 的 l,e,t,c,o,d 共 6 种）</text>
  <text x="283" y="226" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">每个回文串至多容纳 1 种奇计数字符 → 至少需要 m 个串 → k ≥ m</text>

  <!-- 箭头总结 -->
  <path d="M 90 268 C 130 292, 200 296, 250 288" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="266" width="256" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">判定 = (m ≤ k ≤ n)：奇计数字符种数 ≤ k ≤ 串长</text>
</svg>
