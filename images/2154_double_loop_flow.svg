<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：查询 → 翻倍 → 再查询，直到失配</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="56" y="72" width="84" height="36" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="98" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 140 90 L 194 90" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="310,54 404,90 310,126 216,90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">original ∈ S ?</text>

  <!-- yes branch -->
  <text x="412" y="82" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 404 90 L 446 90" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="446" y="68" width="198" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="545" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">original ← original × 2</text>

  <!-- loop back -->
  <path d="M 545 68 L 545 38 L 310 38 L 310 50" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="427" y="30" text-anchor="middle" font-size="11.5" fill="#666">翻倍后回到判断</text>

  <!-- no branch -->
  <text x="318" y="142" font-size="12" font-weight="bold" fill="#a04038">否</text>
  <path d="M 310 126 L 310 164" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="168" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="310" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 original</text>
  <path d="M 310 212 L 310 248" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="272" y="252" width="76" height="36" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="310" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">结束</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="60" y="310" width="560" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">实现要点</text>
  <text x="340" y="356" text-anchor="middle" font-size="12" fill="#444">S 建好后再不修改——命中后查询的是新值，无需删除旧元素</text>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#444">循环至多 12 次判断、11 次翻倍，必然终止</text>
</svg>
