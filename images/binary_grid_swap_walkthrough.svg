<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例一演算：贪心冒泡两步，共 3 次交换</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11" fill="#888">tz = [0, 1, 2]（对应行 0 / 行 1 / 行 2），各位置需求 req = [2, 1, 0]（蓝色 = 已落位的行）</text>

  <!-- 初始 -->
  <text x="100" y="72" font-size="10.5" fill="#888">初始（大字 = tz，小字 = 原行号）</text>
  <g filter="url(#sk)">
    <rect x="100" y="76" width="48" height="40" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
    <rect x="156" y="76" width="48" height="40" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
    <rect x="212" y="76" width="48" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="93" font-size="15" font-weight="bold" fill="#666">0</text>
    <text x="124" y="108" font-size="9" fill="#999">行 0</text>
    <text x="180" y="93" font-size="15" font-weight="bold" fill="#666">1</text>
    <text x="180" y="108" font-size="9" fill="#999">行 1</text>
    <text x="236" y="93" font-size="15" font-weight="bold" fill="#b8641e">2</text>
    <text x="236" y="108" font-size="9" fill="#999">行 2</text>
  </g>

  <!-- 步骤1 -->
  <text x="100" y="152" font-size="10.5" fill="#555" font-weight="bold">① 位置 0 · 需求 2：只有行 2 合格</text>
  <g filter="url(#sk)">
    <rect x="100" y="158" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="156" y="158" width="48" height="40" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
    <rect x="212" y="158" width="48" height="40" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="175" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="124" y="190" font-size="9" fill="#999">行 2</text>
    <text x="180" y="175" font-size="15" font-weight="bold" fill="#666">0</text>
    <text x="180" y="190" font-size="9" fill="#999">行 0</text>
    <text x="236" y="175" font-size="15" font-weight="bold" fill="#666">1</text>
    <text x="236" y="190" font-size="9" fill="#999">行 1</text>
  </g>
  <text x="290" y="182" font-size="12" font-weight="bold" fill="#2e6e2e">ans = 2</text>

  <!-- 步骤2 -->
  <text x="100" y="236" font-size="10.5" fill="#555" font-weight="bold">② 位置 1 · 需求 1：行 1 最近合格</text>
  <g filter="url(#sk)">
    <rect x="100" y="240" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="156" y="240" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="212" y="240" width="48" height="40" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="257" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="124" y="272" font-size="9" fill="#999">行 2</text>
    <text x="180" y="257" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
    <text x="180" y="272" font-size="9" fill="#999">行 1</text>
    <text x="236" y="257" font-size="15" font-weight="bold" fill="#666">0</text>
    <text x="236" y="272" font-size="9" fill="#999">行 0</text>
  </g>
  <text x="290" y="264" font-size="12" font-weight="bold" fill="#2e6e2e">ans = 3</text>

  <!-- 步骤3 -->
  <text x="100" y="320" font-size="10.5" fill="#555" font-weight="bold">③ 位置 2 · 需求 0：行 0 直接落位</text>
  <g filter="url(#sk)">
    <rect x="100" y="324" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="156" y="324" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="212" y="324" width="48" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle">
    <text x="124" y="341" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
    <text x="124" y="356" font-size="9" fill="#999">行 2</text>
    <text x="180" y="341" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
    <text x="180" y="356" font-size="9" fill="#999">行 1</text>
    <text x="236" y="341" font-size="15" font-weight="bold" fill="#2b6e9e">0</text>
    <text x="236" y="356" font-size="9" fill="#999">行 0</text>
  </g>
  <text x="290" y="348" font-size="12" font-weight="bold" fill="#2e6e2e">ans = 3</text>

  <!-- 移动箭头 -->
  <path d="M 236 120 C 236 142, 124 130, 124 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="180" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b8641e">上移 2 格 = 2 次交换</text>
  <path d="M 236 202 C 236 224, 180 216, 180 236" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="140" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b8641e">上移 1 格 = 1 次</text>
  <path d="M 180 284 V 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="192" y="305" font-size="10" fill="#888">0 次</text>

  <!-- 右：最终网格 -->
  <text x="500" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">最终行序 [行2, 行1, 行0]</text>
  <g filter="url(#sk)">
    <rect x="420" y="96" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="460" y="96" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="500" y="96" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="420" y="130" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="460" y="130" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="500" y="130" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="420" y="164" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="460" y="164" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="500" y="164" width="40" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="440" y="118" fill="#666">1</text>
    <text x="480" y="118" fill="#2e6e2e">0</text>
    <text x="520" y="118" fill="#2e6e2e">0</text>
    <text x="440" y="152" fill="#666">1</text>
    <text x="480" y="152" fill="#666">1</text>
    <text x="520" y="152" fill="#2e6e2e">0</text>
    <text x="440" y="186" fill="#666">0</text>
    <text x="480" y="186" fill="#666">1</text>
    <text x="520" y="186" fill="#666">1</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="end">
    <text x="412" y="118">行 2</text>
    <text x="412" y="152">行 1</text>
    <text x="412" y="186">行 0</text>
  </g>
  <text x="500" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">上三角 (0,1) (0,2) (1,2) 全为 0 ✓</text>
  <g filter="url(#sk)">
    <rect x="386" y="240" width="228" height="52" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="500" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">总交换次数 = 2 + 1 + 0 = 3</text>
  <text x="500" y="280" text-anchor="middle" font-size="11" fill="#2e6e2e">与示例输出一致 ✓</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="36" y="386" width="568" height="62" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="408" text-anchor="middle" font-size="11.5" fill="#7a5415">贪心每步选「最近的合格行」上移：上移跨过的每一行都与它构成一个逆序对、恰好消去一次</text>
  <text x="320" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">总代价 = 目标排列的逆序数 = 相邻交换次数的下界 ⇒ 贪心最优（证明见正文）</text>
</svg>
