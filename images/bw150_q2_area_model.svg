<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">“线下面积”A(y) 是分段线性的单调不减函数</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个正方形对 A(y) 的贡献是 l · clamp(y − y₀, 0, l)，可直接相加（重叠重复计数）</text>

  <line x1="70" y1="300" x2="270" y2="300" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="300" x2="70" y2="100" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="278" y="304" font-size="10" fill="#999" filter="url(#rough2)">x</text>
  <text x="62" y="96" font-size="10" fill="#999" filter="url(#rough2)">y</text>

  <g filter="url(#rough2)">
    <rect x="110" y="160" width="110" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="2" filter="url(#rough2)"/>
    <rect x="110" y="160" width="110" height="40" fill="#e8f0fe" stroke="none" rx="2" filter="url(#rough2)"/>
  </g>
  <text x="165" y="186" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">线上：l·(y₀+l−y)</text>
  <text x="165" y="234" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">线下：l·(y−y₀)</text>
  <line x1="100" y1="200" x2="230" y2="200" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="236" y="196" font-size="10" fill="#b85450" filter="url(#rough2)">y</text>
  <text x="165" y="290" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">边长 l，左下角 (x₀, y₀)</text>

  <text x="310" y="92" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A(y) = Σ lᵢ · clamp(y − yᵢ, 0, lᵢ)</text>
  <text x="310" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">y ≤ yᵢ：贡献 0；y ≥ yᵢ+lᵢ：贡献 lᵢ²；中间线性增长</text>

  <line x1="320" y1="290" x2="560" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="290" x2="320" y2="130" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="566" y="294" font-size="9.5" fill="#999" filter="url(#rough2)">y</text>
  <text x="306" y="126" font-size="9.5" fill="#999" filter="url(#rough2)">A</text>

  <path d="M 320 290 L 380 290 L 460 210 L 540 210" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <line x1="320" y1="250" x2="560" y2="250" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="562" y="248" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">half</text>
  <circle cx="432" cy="243" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="440" y="234" font-size="9.5" fill="#b85450" filter="url(#rough2)">答案 y*</text>
  <text x="470" y="300" font-size="9.5" fill="#666" filter="url(#rough2)">折点 = 各正方形的顶边</text>

  <rect x="60" y="320" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="74" y="339" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">重叠要重复计数</text>
  <text x="74" y="356" font-size="10" fill="#555" filter="url(#rough2)">总面积 = Σ lᵢ²，与位置无关</text>

  <rect x="320" y="320" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="334" y="339" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">目标</text>
  <text x="334" y="356" font-size="10" fill="#555" filter="url(#rough2)">找最小的 y 使 A(y) ≥ 总面积 / 2</text>

  <text x="310" y="376" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">A 连续、单调不减 ⇒ 二分答案；又因反函数连续，A(y*) 恰等于 half</text>
</svg>
