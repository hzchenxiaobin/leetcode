<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次中序遍历，边走边比较</text>

  <rect x="100" y="46" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="11.5" fill="#33445f" filter="url(#rough2)">dfs(node)：进入一个节点</text>

  <path d="M 250 74 L 250 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,96 345,126 250,156 155,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="131" text-anchor="middle" font-size="11.5" fill="#7a5c18" filter="url(#rough2)">node 为空？</text>

  <path d="M 345 126 L 368 126" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="112" width="126" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="435" y="131" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是 → 直接 return</text>

  <path d="M 250 156 L 250 174" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="176" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="250" y="195" text-anchor="middle" font-size="11.5" fill="#33445f" filter="url(#rough2)">dfs(node.left)　先走完左子树</text>

  <path d="M 250 204 L 250 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="222" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="7" filter="url(#rough2)"/>
  <text x="250" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">有 prev 时：ans = min(ans, node.val − prev)</text>

  <path d="M 250 252 L 250 266" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="268" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="250" y="287" text-anchor="middle" font-size="11.5" fill="#33445f" filter="url(#rough2)">prev ← node.val（为下一次比较做准备）</text>

  <path d="M 250 296 L 250 310" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="312" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="250" y="331" text-anchor="middle" font-size="11.5" fill="#33445f" filter="url(#rough2)">dfs(node.right)　最后走右子树</text>

  <path d="M 250 340 L 250 354" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="356" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="376" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">遍历结束，ans 就是最小的相邻差</text>

  <text x="260" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个节点只进出一次 → 时间 O(n)，递归栈深度 O(h)</text>
</svg>
