<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">单趟扫描 + 哈希表计数：算法流程</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">banned 先转成集合，判定「是否禁用」是 O(1)</text>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="180" y="66" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="330" y="91" fill="#3a4a66" filter="url(#rough2)">① ban = set(banned)；cnt = {}；best = “”</text>
  </g>

  <path d="M 330 106 L 330 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="180" y="128" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="330" y="153" fill="#3a4a66" filter="url(#rough2)">② i 指向下一个字母；非字母则 i += 1</text>
  </g>

  <path d="M 330 168 L 330 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="180" y="190" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="330" y="215" fill="#3a4a66" filter="url(#rough2)">③ j 右移，直到遇到非字母（词边界）</text>
  </g>

  <path d="M 330 230 L 330 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="180" y="252" width="300" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="330" y="277" fill="#8a6a20" filter="url(#rough2)">④ w = lowercase(paragraph[i..j))</text>
  </g>

  <path d="M 330 292 L 330 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,312 470,350 330,388 190,350" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="355" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">w ∈ banned ?</text>

  <path d="M 470 350 L 496 350" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="483" y="340" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="498" y="328" width="124" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
    <text x="560" y="346" fill="#8a3a36" filter="url(#rough2)">整段丢弃，</text>
    <text x="560" y="362" fill="#8a3a36" filter="url(#rough2)">不计数</text>
    <text x="560" y="404" fill="#8a3a36" font-size="10" filter="url(#rough2)">回到 ②</text>
  </g>

  <path d="M 330 388 L 330 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="404" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="180" y="408" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="330" y="428" fill="#3a5a30" filter="url(#rough2)">⑤ cnt[w] += 1</text>
    <text x="330" y="445" fill="#3a5a30" filter="url(#rough2)">若 cnt[w] &gt; bestCnt：best = w，bestCnt = cnt[w]</text>
  </g>

  <path d="M 180 431 L 92 431 L 92 86 L 176 86" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="418" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i = j，继续</text>

  <text x="320" y="470" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">扫完整个 paragraph 后返回 best：出现次数最多的非禁用词</text>
</svg>
