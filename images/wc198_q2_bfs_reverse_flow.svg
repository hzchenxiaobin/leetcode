<svg xmlns="http://www.w3.org/2000/svg" width="780" height="545" viewBox="0 0 780 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="545" fill="#fdfcf7"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：BFS 定序 → 逆序合并（全程迭代）</text>
  <path d="M 120 42 Q 390 52 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== phase 1 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="190" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="135" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">阶段一：BFS 定序</text>
  <text x="245" y="78" text-anchor="start" font-size="10.5" fill="#888888" filter="url(#sk)">产出 order（父必先于子）与 parent[]（无向边定向）</text>

  <g filter="url(#sk)">
    <rect x="40" y="100" width="180" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="130" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">建无向邻接表 adj</text>
  <text x="130" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">edges 两端互存</text>

  <path d="M 226 131 L 250 131" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="258" y="100" width="250" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="383" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">从根 0 出发 BFS</text>
  <text x="383" y="138" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">order 只增不减，下标即队头</text>
  <text x="383" y="155" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">邻居跳过 v == parent[u]</text>

  <path d="M 514 131 L 538 131" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="546" y="100" width="200" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="646" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">初始化计数</text>
  <text x="646" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">cnt[u][labels[u]] = 1</text>

  <!-- ===== transition ===== -->
  <path d="M 390 168 L 390 208" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="404" y="186" text-anchor="start" font-size="10" fill="#888888" filter="url(#sk)">示例 1：order = 0, 1, 2, 4, 5, 3, 6</text>
  <text x="404" y="202" text-anchor="start" font-size="10" fill="#888888" filter="url(#sk)">逆序 = 6, 3, 5, 4, 2, 1, 0（子全在父前）</text>

  <!-- ===== phase 2 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="218" width="190" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="135" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">阶段二：逆序合并</text>
  <text x="245" y="238" text-anchor="start" font-size="10.5" fill="#888888" filter="url(#sk)">处理 u 时，子女贡献已全部并入 cnt[u]</text>

  <g filter="url(#sk)">
    <rect x="40" y="268" width="160" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="120" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">逆序遍历 order</text>
  <text x="120" y="308" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">u = order[i]</text>
  <text x="120" y="325" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">i 从 n−1 递减到 0</text>

  <path d="M 206 304 L 230 304" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="238" y="268" width="220" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="348" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">先取答案</text>
  <text x="348" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">ans[u] = cnt[u][labels[u]]</text>
  <text x="348" y="325" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#sk)">此刻 cnt[u] 已聚合整棵子树</text>

  <path d="M 464 304 L 488 304" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="498,304 575,258 652,304 575,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="575" y="300" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">parent[u]</text>
  <text x="575" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">== −1 ？</text>

  <path d="M 652 304 L 676 304" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="664" y="292" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">是（根）</text>

  <g filter="url(#sk)">
    <rect x="684" y="280" width="88" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="728" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">全部处理完</text>
  <text x="728" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e24" filter="url(#sk)">返回 ans</text>

  <path d="M 575 350 L 575 380" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="590" y="370" text-anchor="start" font-size="10" fill="#888888" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="470" y="386" width="210" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="575" y="409" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">上交：cnt[parent[u]] += cnt[u]</text>
  <text x="575" y="429" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#sk)">26 位整行逐位相加</text>

  <path d="M 470 415 C 360 444, 200 432, 122 346" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="452" text-anchor="middle" font-size="10" fill="#888888" filter="url(#sk)">取下一个 u（更靠近根）</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="466" width="430" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="255" y="488" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">为什么不递归：链形树深度可达 10⁵</text>
  <text x="255" y="507" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">Python 默认递归上限 1000，C++ 默认栈十万层也悬</text>
  <text x="255" y="524" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">BFS 序父先于子，倒序即先子后父，for 循环顶替递归栈</text>

  <g filter="url(#sk)">
    <rect x="490" y="466" width="250" height="66" rx="10" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="615" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555" filter="url(#sk)">正确性锚点</text>
  <text x="615" y="507" text-anchor="middle" font-size="10" fill="#777777" filter="url(#sk)">逆序 ⇒ 子先于父（引理 1）</text>
  <text x="615" y="524" text-anchor="middle" font-size="10" fill="#777777" filter="url(#sk)">处理 u 时 cnt[u] 已完整（引理 2）</text>
</svg>
