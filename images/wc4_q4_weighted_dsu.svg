<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">带权并查集：ratio[x] = value(x) / value(parent[x])</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">根节点的 ratio 恒为 1；路径压缩时沿路把比值乘起来，就能让每个点直接指向根</text>

  <rect x="30" y="66" width="250" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="46" y="88" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">压缩前：链 c → b → a</text>

  <circle cx="78" cy="162" r="19" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="168" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">c</text>
  <circle cx="170" cy="162" r="19" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="170" y="168" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">b</text>
  <circle cx="252" cy="162" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="168" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">a</text>

  <path d="M 98 162 L 149 162" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="123" y="150" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">1/6</text>
  <path d="M 190 162 L 231 162" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="211" y="150" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">1/2</text>

  <text x="155" y="202" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">ratio[c] = 1/6，ratio[b] = 1/2</text>

  <rect x="320" y="66" width="250" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="336" y="88" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">find(c) 之后：直接挂根</text>

  <circle cx="452" cy="106" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="112" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">a</text>
  <circle cx="372" cy="180" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="186" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">c</text>
  <circle cx="528" cy="180" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528" y="186" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">b</text>

  <path d="M 383 166 L 437 119" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="134" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">1/12</text>
  <path d="M 516 167 L 470 120" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="502" y="134" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">1/2</text>

  <text x="445" y="202" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">ratio[c] = 1/6 × 1/2 = 1/12</text>

  <rect x="30" y="236" width="540" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="258" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">回溯：p = parent[x]（必须先存！）→ ratio[x] *= ratio[p] → parent[x] = 根</text>
  <text x="44" y="278" font-size="10" fill="#555" filter="url(#rough2)">含义：value(x)/value(根) = value(x)/value(p) × value(p)/value(根)</text>

  <rect x="30" y="304" width="540" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="326" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">合并已知 a / b = v：先 find(a) 得 ra、ratio[a]；find(b) 得 rb、ratio[b]</text>
  <text x="44" y="347" font-size="10" fill="#555" filter="url(#rough2)">rb 挂到 ra 下：ratio[rb] = ratio[a] / (v × ratio[b])　（按大小合并，小树挂大树）</text>
  <text x="44" y="365" font-size="10" fill="#555" filter="url(#rough2)">ra 挂到 rb 下：ratio[ra] = v × ratio[b] / ratio[a]　（比例方向要跟着挂接方向翻）</text>
  <text x="44" y="388" font-size="10" fill="#3a5a30" filter="url(#rough2)">查询 c / d：两边都 find 后同根 ⇒ ratio[c] / ratio[d]；不同根 ⇒ −1.0</text>

  <text x="300" y="426" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">并查集只维护「相对根」的比值，不需要知道变量的绝对大小</text>
</svg>
