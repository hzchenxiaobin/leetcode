<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">转换规则 ⇒ 转移矩阵：第 i 列恰有 nums[i] 个连续的 1</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== left: one letter fans out to a run of successors (with wrap) ===== -->
  <text x="166" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">一个字母 → 一段后继（可回绕）</text>

  <rect x="120" y="84" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#r)"/>
  <text x="140" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#r)">y</text>
  <text x="140" y="138" text-anchor="middle" font-size="10.5" fill="#a07520" filter="url(#r)">nums[24] = 3</text>

  <path d="M 130 122 Q 138 146 147 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 148 122 Q 168 146 179 160" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 156 122 Q 188 150 211 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- alphabet row -->
  <rect x="38" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="70" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="102" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="134" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <rect x="166" y="164" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <rect x="198" y="164" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <rect x="230" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="262" y="164" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="53" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">w</text>
  <text x="85" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">x</text>
  <text x="117" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">y</text>
  <text x="149" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">z</text>
  <text x="181" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">a</text>
  <text x="213" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">b</text>
  <text x="245" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">c</text>
  <text x="277" y="183" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">d</text>
  <text x="30" y="182" font-size="11" fill="#888" filter="url(#r)">…</text>
  <text x="300" y="182" font-size="11" fill="#888" filter="url(#r)">…</text>

  <path d="M 151 196 Q 166 212 179 196" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="166" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#r)">越过 z ⇒ 回绕到表头</text>

  <rect x="38" y="242" width="286" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="181" y="264" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">cnt[y] 个 'y' ⇒ 各贡献一份 z、a、b</text>
  <text x="181" y="284" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">写进矩阵：列 24 在行 25、0、1 处各 +1</text>

  <!-- ===== right: matrix schematic ===== -->
  <text x="466" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">M：行 = 目标 j，列 = 源 i</text>

  <text x="376" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">…</text>
  <text x="516" y="100" text-anchor="middle" font-size="10.5" fill="#34507a" filter="url(#r)">x列</text>
  <text x="536" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a07520" filter="url(#r)">y列</text>
  <text x="556" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#r)">z列</text>

  <text x="358" y="120" text-anchor="end" font-size="10" fill="#34507a" filter="url(#r)">j=0</text>
  <text x="358" y="140" text-anchor="end" font-size="10" fill="#34507a" filter="url(#r)">j=1</text>
  <text x="358" y="182" text-anchor="end" font-size="11" fill="#888" filter="url(#r)">⋮</text>
  <text x="358" y="240" text-anchor="end" font-size="10" fill="#34507a" filter="url(#r)">j=24</text>
  <text x="358" y="260" text-anchor="end" font-size="10" fill="#34507a" filter="url(#r)">j=25</text>

  <g filter="url(#r)">
    <g fill="#f2f2f2" stroke="#cccccc" stroke-width="0.8">
      <rect x="366" y="106" width="20" height="20"/><rect x="386" y="106" width="20" height="20"/><rect x="406" y="106" width="20" height="20"/><rect x="426" y="106" width="20" height="20"/><rect x="446" y="106" width="20" height="20"/><rect x="466" y="106" width="20" height="20"/><rect x="486" y="106" width="20" height="20"/><rect x="506" y="106" width="20" height="20"/><rect x="526" y="106" width="20" height="20"/><rect x="546" y="106" width="20" height="20"/>
      <rect x="366" y="126" width="20" height="20"/><rect x="386" y="126" width="20" height="20"/><rect x="406" y="126" width="20" height="20"/><rect x="426" y="126" width="20" height="20"/><rect x="446" y="126" width="20" height="20"/><rect x="466" y="126" width="20" height="20"/><rect x="486" y="126" width="20" height="20"/><rect x="506" y="126" width="20" height="20"/><rect x="526" y="126" width="20" height="20"/><rect x="546" y="126" width="20" height="20"/>
      <rect x="366" y="146" width="20" height="20"/><rect x="386" y="146" width="20" height="20"/><rect x="406" y="146" width="20" height="20"/><rect x="426" y="146" width="20" height="20"/><rect x="446" y="146" width="20" height="20"/><rect x="466" y="146" width="20" height="20"/><rect x="486" y="146" width="20" height="20"/><rect x="506" y="146" width="20" height="20"/><rect x="526" y="146" width="20" height="20"/><rect x="546" y="146" width="20" height="20"/>
      <rect x="366" y="166" width="20" height="20"/><rect x="386" y="166" width="20" height="20"/><rect x="406" y="166" width="20" height="20"/><rect x="426" y="166" width="20" height="20"/><rect x="446" y="166" width="20" height="20"/><rect x="466" y="166" width="20" height="20"/><rect x="486" y="166" width="20" height="20"/><rect x="506" y="166" width="20" height="20"/><rect x="526" y="166" width="20" height="20"/><rect x="546" y="166" width="20" height="20"/>
      <rect x="366" y="186" width="20" height="20"/><rect x="386" y="186" width="20" height="20"/><rect x="406" y="186" width="20" height="20"/><rect x="426" y="186" width="20" height="20"/><rect x="446" y="186" width="20" height="20"/><rect x="466" y="186" width="20" height="20"/><rect x="486" y="186" width="20" height="20"/><rect x="506" y="186" width="20" height="20"/><rect x="526" y="186" width="20" height="20"/><rect x="546" y="186" width="20" height="20"/>
      <rect x="366" y="206" width="20" height="20"/><rect x="386" y="206" width="20" height="20"/><rect x="406" y="206" width="20" height="20"/><rect x="426" y="206" width="20" height="20"/><rect x="446" y="206" width="20" height="20"/><rect x="466" y="206" width="20" height="20"/><rect x="486" y="206" width="20" height="20"/><rect x="506" y="206" width="20" height="20"/><rect x="526" y="206" width="20" height="20"/><rect x="546" y="206" width="20" height="20"/>
      <rect x="366" y="226" width="20" height="20"/><rect x="386" y="226" width="20" height="20"/><rect x="406" y="226" width="20" height="20"/><rect x="426" y="226" width="20" height="20"/><rect x="446" y="226" width="20" height="20"/><rect x="466" y="226" width="20" height="20"/><rect x="486" y="226" width="20" height="20"/><rect x="506" y="226" width="20" height="20"/><rect x="526" y="226" width="20" height="20"/><rect x="546" y="226" width="20" height="20"/>
      <rect x="366" y="246" width="20" height="20"/><rect x="386" y="246" width="20" height="20"/><rect x="406" y="246" width="20" height="20"/><rect x="426" y="246" width="20" height="20"/><rect x="446" y="246" width="20" height="20"/><rect x="466" y="246" width="20" height="20"/><rect x="486" y="246" width="20" height="20"/><rect x="506" y="246" width="20" height="20"/><rect x="526" y="246" width="20" height="20"/><rect x="546" y="246" width="20" height="20"/>
    </g>
    <!-- generic columns: band of 1s (one column shows nums=2) -->
    <g fill="#e8f0fe" stroke="#446688" stroke-width="1.4">
      <rect x="366" y="146" width="20" height="20"/>
      <rect x="386" y="166" width="20" height="20"/>
      <rect x="406" y="186" width="20" height="20"/>
      <rect x="406" y="206" width="20" height="20"/>
      <rect x="426" y="206" width="20" height="20"/>
    </g>
    <!-- x column (nums=1): 1 at row j=24 -->
    <rect x="506" y="226" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <!-- y column (nums=3): 1s at j=25, j=0, j=1 (wrap) -->
    <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.6">
      <rect x="526" y="246" width="20" height="20"/>
      <rect x="526" y="106" width="20" height="20"/>
      <rect x="526" y="126" width="20" height="20"/>
    </g>
    <!-- z column (nums=2): 1s at j=0, j=1 (wrap) -->
    <g fill="#fce4ec" stroke="#b85450" stroke-width="1.8">
      <rect x="546" y="106" width="20" height="20"/>
      <rect x="546" y="126" width="20" height="20"/>
    </g>
  </g>

  <g font-size="11" fill="#333" filter="url(#r)">
    <text x="376" y="161" text-anchor="middle">1</text>
    <text x="396" y="181" text-anchor="middle">1</text>
    <text x="416" y="201" text-anchor="middle">1</text>
    <text x="416" y="221" text-anchor="middle">1</text>
    <text x="436" y="221" text-anchor="middle">1</text>
    <text x="516" y="241" text-anchor="middle">1</text>
    <text x="536" y="121" text-anchor="middle" fill="#a07520" font-weight="bold">1</text>
    <text x="536" y="141" text-anchor="middle" fill="#a07520" font-weight="bold">1</text>
    <text x="536" y="261" text-anchor="middle" fill="#a07520" font-weight="bold">1</text>
    <text x="556" y="121" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="556" y="141" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
  </g>

  <!-- wrap arc: from bottom of y-column up to its top cells, routed outside the grid -->
  <path d="M 536 270 C 600 282 604 96 542 103" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="604" y="90" text-anchor="middle" font-size="10.5" fill="#a07520" filter="url(#r)">回绕</text>
  <text x="446" y="292" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#r)">（示意，实际 26×26）</text>

  <!-- bottom formula box -->
  <rect x="42" y="330" width="556" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#34507a" filter="url(#r)">一轮转换 = 一次矩阵–向量乘：cnt′ = M · cnt</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">M[(i+k) mod 26][i] = 1（i = 0..25，k = 1..nums[i]），其余全 0</text>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">M 只由 nums 决定，与 s、轮次均无关 ⇒「固定」是能用快速幂的前提</text>
  <text x="320" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">跑 t 轮 = M^t：cnt_t = M^t · cnt_0，ans = Σ cnt_t mod 10⁹+7</text>
</svg>
