<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>
  <text x="300" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：递归修剪（三分支）</text>

  <!-- 入口 -->
  <rect x="245" y="36" width="110" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="53" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">trim(root)</text>
  <path d="M300,62 L300,82" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：空树 -->
  <polygon points="300,84 440,122 300,160 160,122" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="118" text-anchor="middle" font-size="11.5" fill="#446688" font-family="monospace" filter="url(#rough2)">root == null ?</text>
  <text x="300" y="134" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">空树无需修剪</text>
  <text x="448" y="114" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M440,122 L472,122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="474" y="104" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="530" y="126" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">return null</text>

  <path d="M300,160 L300,178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="174" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 2：太小 -->
  <polygon points="300,180 460,220 300,260 140,220" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="216" text-anchor="middle" font-size="11.5" fill="#b85450" font-family="monospace" filter="url(#rough2)">root.val &lt; low ?</text>
  <text x="300" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">根与左子树都太小</text>
  <text x="124" y="212" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M140,220 L116,220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="6" y="200" width="108" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="216" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">return</text>
  <text x="60" y="232" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">trim(root.right)</text>

  <path d="M300,260 L300,278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="274" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 3：太大 -->
  <polygon points="300,280 460,320 300,360 140,320" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-family="monospace" filter="url(#rough2)">root.val &gt; high ?</text>
  <text x="300" y="332" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">根与右子树都太大</text>
  <text x="124" y="312" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M140,320 L116,320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="6" y="300" width="108" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="316" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">return</text>
  <text x="60" y="332" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">trim(root.left)</text>

  <path d="M300,360 L300,378" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="374" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- 根合法：递归两侧 -->
  <rect x="160" y="380" width="280" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">root.left  ← trim(root.left)</text>
  <text x="300" y="418" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#rough2)">root.right ← trim(root.right)</text>
  <text x="300" y="436" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">return root</text>
  <path d="M300,444 L300,456" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="265" y="458" width="70" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="475" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">结束</text>
  <text x="300" y="491" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个节点最多进入一次 ⇒ O(n) 时间、O(h) 递归栈</text>
</svg>
