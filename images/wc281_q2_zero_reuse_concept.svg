<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：每段左侧必贴一个零节点 —— 分隔符复用为「段和容器」</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- original list -->
  <text x="22" y="80" font-size="11" fill="#666" filter="url(#rough2)">原链表</text>

  <rect x="64" y="58" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="87" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="128" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="256" y="58" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="279" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="320" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="343" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="384" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="448" y="58" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="471" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="512" y="58" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="535" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">0</text>

  <path d="M113,76 L124,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M177,76 L188,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M241,76 L252,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M305,76 L316,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M369,76 L380,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M433,76 L444,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M497,76 L508,76" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="87" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">z₀ = head</text>
  <text x="279" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">z₁</text>
  <text x="535" y="108" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">z₂（尾零）</text>

  <!-- segment arcs -->
  <path d="M132,114 Q 183 144 234,114" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="183" y="162" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">段① 3+1 → 4</text>
  <path d="M324,114 Q 407 144 490,114" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="407" y="162" text-anchor="middle" font-size="11" fill="#a04040" filter="url(#rough2)">段② 4+5+2 → 11</text>

  <!-- write-down arrows -->
  <path d="M87,112 L87,194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M279,112 L279,194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result list -->
  <text x="22" y="218" font-size="11" fill="#666" filter="url(#rough2)">结果链表</text>

  <rect x="64" y="196" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="87" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>
  <rect x="256" y="196" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="279" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">11</text>

  <path d="M113,214 L249,214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M305,214 L338,214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="218" font-size="10.5" font-style="italic" fill="#888" filter="url(#rough2)">null</text>

  <text x="87" y="250" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">复用 z₀</text>
  <text x="279" y="250" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">复用 z₁</text>
  <text x="471" y="218" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原值节点 3,1,4,5,2 全部跳过</text>
  <text x="535" y="250" text-anchor="middle" font-size="10" fill="#a04040" filter="url(#rough2)">尾零 z₂ 丢弃 ✗</text>

  <!-- conclusion -->
  <rect x="16" y="272" width="608" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">零节点：分隔符 → 结果节点，一物两用</text>
  <text x="320" y="314" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">结果链表节点数 = 段数 = 零节点数 − 1（尾零丢弃），全程零次 new → O(1) 空间</text>

  <!-- bottom note -->
  <rect x="16" y="344" width="608" height="48" rx="8" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">head 本身就是首零 z₀ → 天然的结果链表头，无需哑节点，最后直接返回 head；</text>
  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">撞零时 tail 跳到 cur 上 —— cur 正停在「下一段的左侧零」，继续当容器</text>
</svg>
