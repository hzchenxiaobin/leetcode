<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序 + 二分：找「最小可行药水强度」阈值</text>

  <!-- 变形 -->
  <g filter="url(#rough2)">
    <rect x="90" y="50" width="380" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="79" font-size="14" fill="#333" filter="url(#rough2)" text-anchor="middle">spell × potion ≥ success  ⇔  potion ≥ t = ⌈success / spell⌉</text>

  <!-- 排序后的药水 -->
  <text x="280" y="130" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">potions 排序后（示例 1：spell = 5, success = 7, t = 2）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="146" width="64" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="184" y="146" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="248" y="146" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="312" y="146" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="376" y="146" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="17" fill="#333" text-anchor="middle">
    <text x="152" y="175">1</text><text x="216" y="175">2</text><text x="280" y="175">3</text>
    <text x="344" y="175">4</text><text x="408" y="175">5</text>
  </g>
  <!-- 分界线 -->
  <path d="M 184 138 L 184 200" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="216" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">5×1=5 &lt; 7 ✗</text>
  <text x="312" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">5×{2,3,4,5} ≥ 7 ✓（4 个）</text>

  <!-- lower_bound -->
  <path d="M 176 230 C 176 250, 176 258, 176 266" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="110" y="270" width="340" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <text x="280" y="294" text-anchor="middle">lower_bound 找第一个 ≥ t 的下标 pos</text>
    <text x="280" y="318" text-anchor="middle" font-weight="bold">答案 = m − pos（右侧全都 ≥ t）</text>
  </g>
</svg>
