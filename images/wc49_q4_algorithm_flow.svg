<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟 O(n²) 二重循环，长度与条数同步维护</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个 j 只会把 nums[i] 接到一条链后面，所以判断必须按「更长的取代 / 等长的累加」分开处理</text>

  <g filter="url(#rough2)">
    <rect x="170" y="58" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="280" y="79" text-anchor="middle" font-size="11" fill="#2f3f5c">外层：i 从 0 到 n − 1</text>
  </g>

  <path d="M 280 90 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="114" width="360" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#8a6a20">内层：j 从 0 到 i − 1，只考虑 nums[j] &lt; nums[i]</text>
  </g>

  <path d="M 280 148 L 280 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,172 424,212 280,252 136,212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#3a5a30">length[j] + 1</text>
    <text x="280" y="223" text-anchor="middle" font-size="10.5" fill="#3a5a30">与 length[i] 比较</text>
  </g>

  <path d="M 136 212 L 112 212 L 112 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 252 L 280 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 424 212 L 448 212 L 448 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="24" y="274" width="176" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="112" y="294" text-anchor="middle" font-size="9.5" fill="#2f3f5c" font-weight="bold">更大（覆盖）</text>
    <text x="112" y="310" text-anchor="middle" font-size="9" fill="#333">length[i] = length[j] + 1</text>
    <text x="112" y="324" text-anchor="middle" font-size="9" fill="#333">count[i] = count[j]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="192" y="274" width="176" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="294" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold">相等（累加）</text>
    <text x="280" y="310" text-anchor="middle" font-size="9" fill="#333">count[i] += count[j]</text>
    <text x="280" y="324" text-anchor="middle" font-size="9" fill="#777">length[i] 不变</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="360" y="274" width="176" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="448" y="294" text-anchor="middle" font-size="9.5" fill="#8a3a36" font-weight="bold">更小（忽略）</text>
    <text x="448" y="310" text-anchor="middle" font-size="9" fill="#333">接不上最长链</text>
    <text x="448" y="324" text-anchor="middle" font-size="9" fill="#777">两个量都不动</text>
  </g>

  <path d="M 280 332 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="80" y="354" width="400" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="96" y="373" font-size="9.5" fill="#8a6a20">i 结算：length[i] &gt; L → L = length[i]，ans = count[i]</text>
    <text x="96" y="390" font-size="9.5" fill="#8a6a20">　　　　　length[i] == L → ans += count[i]</text>
  </g>

  <text x="280" y="421" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">全部 i 扫完返回 ans；初始 L = 0、ans = 0</text>
</svg>
