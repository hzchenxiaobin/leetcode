<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="93"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：分段求和，两段游程互不干扰</text>

  <!-- 示例 2 -->
  <text x="70" y="62" font-size="13.5" fill="#333" filter="url(#rough2)">示例 2：nums = [0, 0, 0, 2, 0, 0]</text>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <rect x="100" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="148" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="196" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="244" y="76" width="48" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="292" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="340" y="76" width="48" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="124" y="100" fill="#1d3a17" font-weight="bold">0</text>
    <text x="172" y="100" fill="#1d3a17" font-weight="bold">0</text>
    <text x="220" y="100" fill="#1d3a17" font-weight="bold">0</text>
    <text x="268" y="100">2</text>
    <text x="316" y="100" fill="#1d3a17" font-weight="bold">0</text>
    <text x="364" y="100" fill="#1d3a17" font-weight="bold">0</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle">
    <text x="124" y="132">+1</text>
    <text x="172" y="132">+2</text>
    <text x="220" y="132">+3</text>
    <text x="316" y="132">+1</text>
    <text x="364" y="132">+2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="410" y="82" width="118" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <text x="469" y="100" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">游程 3：6 个</text>
  <text x="469" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">游程 2：3 个</text>

  <g filter="url(#rough2)">
    <rect x="130" y="160" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="187" text-anchor="middle" font-size="15" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">答案 = 6 + 3 = 9</text>

  <!-- 示例 1 -->
  <text x="70" y="238" font-size="13.5" fill="#333" filter="url(#rough2)">示例 1：nums = [1, 3, 0, 0, 2, 0, 0, 4]</text>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="72"  y="252" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="118" y="252" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="164" y="252" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="210" y="252" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="256" y="252" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="302" y="252" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="348" y="252" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="394" y="252" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="95"  y="275">1</text>
    <text x="141" y="275">3</text>
    <text x="187" y="275" fill="#1d3a17" font-weight="bold">0</text>
    <text x="233" y="275" fill="#1d3a17" font-weight="bold">0</text>
    <text x="279" y="275">2</text>
    <text x="325" y="275" fill="#1d3a17" font-weight="bold">0</text>
    <text x="371" y="275" fill="#1d3a17" font-weight="bold">0</text>
    <text x="417" y="275">4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="448" y="254" width="86" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="491" y="277" text-anchor="middle" font-size="14" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">3+3=6</text>

  <!-- 示例 3 -->
  <text x="70" y="330" font-size="13.5" fill="#333" filter="url(#rough2)">示例 3：nums = [2, 10, 2019] 全无 0，答案 0</text>
  <g filter="url(#rough2)">
    <rect x="446" y="312" width="66" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="479" y="334" text-anchor="middle" font-size="13" fill="#7a2f2b" font-weight="bold" filter="url(#rough2)">run 恒 0</text>

  <g filter="url(#rough2)">
    <rect x="60" y="356" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[0,0] 只在游程内数一次：跨过 2 的「0…0」不是连续子数组。</text>
</svg>
