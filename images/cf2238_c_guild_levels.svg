<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">公会 = 子树的某一层：同一集合可能由不同 (v,h) 生成</text>
  <path d="M 96 38 Q 380 46 664 38" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 左：树 -->
  <rect x="20" y="46" width="392" height="296" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="38" y="70" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">看 v = 2 的子树：按「到 2 的距离」分层</text>

  <path d="M 200 100 L 112 162" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 200 100 L 292 162" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 112 176 L 74 240" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 112 176 L 152 240" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="44" y="140" width="176" height="140" rx="14" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="50" y="136" font-size="11" fill="#3c5e2e" filter="url(#rough2)">subtree(2)</text>

  <circle cx="200" cy="100" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <circle cx="112" cy="176" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="112" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <circle cx="292" cy="176" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="182" text-anchor="middle" font-size="14" fill="#5a6b7a" filter="url(#rough2)">3</text>

  <circle cx="74" cy="256" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="74" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>

  <circle cx="152" cy="256" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="152" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <text x="38" y="300" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">h = 0 ⇒ {2}（只有 v 自己）</text>
  <text x="38" y="322" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">h = 1 ⇒ {4, 5}（绿色两点）</text>

  <!-- 右：去重说明 -->
  <rect x="428" y="46" width="312" height="296" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="448" y="76" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">同一个集合的多个来源</text>
  <text x="448" y="104" font-size="12.5" fill="#5a4a1a" filter="url(#rough2)">• (v = 2, h = 1) ⇒ {4, 5}</text>
  <text x="448" y="128" font-size="12.5" fill="#5a4a1a" filter="url(#rough2)">• (v = 1, h = 2) ⇒ {4, 5}</text>
  <text x="448" y="156" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 必须按集合去重</text>

  <text x="448" y="190" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">唯一代表：集合的 LCA</text>
  <text x="448" y="216" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">LCA({4, 5}) = 2</text>
  <text x="448" y="240" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">只保留 (2, 1)，(1, 2) 作废</text>

  <text x="448" y="276" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">单点集合：{u} ⇔ (u, 0)</text>
  <text x="448" y="300" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">共 n 个，互不相同</text>
  <text x="448" y="326" font-size="12" fill="#5a6b7a" filter="url(#rough2)">一个集合里所有点深度相同</text>
</svg>
