<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：首字符分发 + 1 个前瞻字符，token 唯一确定</text>

  <!-- token 字面 -->
  <rect x="60" y="56" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="230" y="56" width="60" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">()</text>
  <rect x="400" y="56" width="80" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(al)</text>

  <!-- 解释箭头 -->
  <path d="M90,98 L90,120" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,98 L260,120" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M440,98 L440,120" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 解释结果 -->
  <rect x="60" y="126" width="60" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="230" y="126" width="60" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="400" y="126" width="80" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">al</text>

  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">三个字面 token → 各自的解释串（互不为前缀）</text>

  <!-- 分发表 -->
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">分发表：先看 command[i]，必要时再看 command[i+1]</text>

  <rect x="70" y="220" width="105" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.5" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">首字符</text>
  <rect x="175" y="220" width="105" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227.5" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前瞻 1 字符</text>
  <rect x="280" y="220" width="105" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332.5" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出</text>
  <rect x="385" y="220" width="105" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437.5" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i 步进</text>

  <rect x="70" y="254" width="105" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.5" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="175" y="254" width="105" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227.5" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">—</text>
  <rect x="280" y="254" width="105" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332.5" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">G</text>
  <rect x="385" y="254" width="105" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437.5" y="279" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+1</text>

  <rect x="70" y="294" width="105" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.5" y="319" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>
  <rect x="175" y="294" width="105" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227.5" y="319" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">)</text>
  <rect x="280" y="294" width="105" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332.5" y="319" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>
  <rect x="385" y="294" width="105" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437.5" y="319" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+2</text>

  <rect x="70" y="334" width="105" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.5" y="359" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(</text>
  <rect x="175" y="334" width="105" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227.5" y="359" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="280" y="334" width="105" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332.5" y="359" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">al</text>
  <rect x="385" y="334" width="105" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437.5" y="359" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+4</text>

  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">每个起点至多一个 token 可匹配 ⇒ 单遍扫描、i 只前进不回溯</text>
</svg>
