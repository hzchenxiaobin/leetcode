<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：1 显著 ⟹ 0 的个数 ≤ √(1 的个数) ≤ √n ≈ 200</text>
  <path d="M 170 42 Q 380 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== demo substring ===== -->
  <text x="95" y="88" font-size="11" fill="#666666" filter="url(#rough2)">一个 1 显著子串</text>

  <g filter="url(#rough2)">
    <rect x="175" y="66" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="221" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="267" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="313" y="66" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="359" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="405" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="451" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="497" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="195" y="89" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="241" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="287" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="333" y="89" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="379" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="425" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="471" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="517" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>

  <text x="175" y="126" font-size="10.5" fill="#666666" filter="url(#rough2)">橙 = 0（z = 2 个）　蓝 = 1（k = 6 个）</text>

  <text x="580" y="86" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">k ≥ z²</text>
  <text x="580" y="110" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6 ≥ 4 ✓</text>

  <!-- ===== derivation chain ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="160" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="150" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1 显著：k ≥ z²</text>
  <line x1="256" y1="186" x2="284" y2="186" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="290" y="160" width="140" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="360" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">z ≤ √k</text>
  <line x1="436" y1="186" x2="464" y2="186" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="470" y="160" width="240" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="590" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">z ≤ √k ≤ √n</text>
  <text x="590" y="201" text-anchor="middle" font-size="11" fill="#444444" filter="url(#rough2)">n ≤ 4×10⁴ ⇒ z ≤ 200</text>

  <!-- ===== statement bar ===== -->
  <g filter="url(#rough2)">
    <rect x="50" y="238" width="660" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="380" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">0 的个数只有 O(√n) ≈ 200 量级 —— 把枚举对象从「1 的个数」换成「0 的个数」！</text>

  <!-- ===== comparison panels ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="330" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="205" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 枚举 1 的个数 k</text>
  <text x="205" y="350" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">固定 L 后枚举第 k 个 1，k = 1..m</text>
  <text x="205" y="370" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">m 最多 4×10⁴ 个</text>
  <text x="205" y="390" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">总计 O(n·m) = O(n²) ≈ 1.6×10⁹</text>
  <text x="205" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">全 1 串退化为平方级 ✗</text>

  <g filter="url(#rough2)">
    <rect x="390" y="300" width="330" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="555" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓ 枚举 0 的个数 z（本题解法）</text>
  <text x="555" y="350" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">固定 L 后枚举 0 的个数 z = 0, 1, 2, …</text>
  <text x="555" y="370" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">z ≤ ⌊√n⌋ ≤ 200</text>
  <text x="555" y="390" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">总计 O(n·√n) ≈ 8×10⁶</text>
  <text x="555" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">比枚举 1 快约 200 倍 ✓</text>
</svg>
