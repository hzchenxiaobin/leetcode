<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">三组示例的逐字节走查</text>
    <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">每个格子两行：十进制值 / 8 位二进制</text>
  </g>

  <!-- 示例 1 -->
  <g filter="url(#rough2)">
    <text x="40" y="64" font-size="11" fill="#444" font-weight="bold">① data = [197, 130, 1]</text>
    <rect x="40" y="74" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="88" y="96" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">197</text>
    <text x="88" y="112" text-anchor="middle" font-size="9" fill="#555">11000101</text>
    <text x="88" y="138" text-anchor="middle" font-size="9" fill="#446688">首字节 need=1</text>

    <rect x="148" y="74" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="196" y="96" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">130</text>
    <text x="196" y="112" text-anchor="middle" font-size="9" fill="#555">10000010</text>
    <text x="196" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a">续字节 10 ✓</text>

    <rect x="256" y="74" width="96" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="304" y="96" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">1</text>
    <text x="304" y="112" text-anchor="middle" font-size="9" fill="#555">00000001</text>
    <text x="304" y="138" text-anchor="middle" font-size="9" fill="#8a6a20">1 字节 need=0</text>

    <text x="380" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>

  <!-- 示例 2 -->
  <g filter="url(#rough2)">
    <text x="40" y="172" font-size="11" fill="#444" font-weight="bold">② data = [235, 140, 4]　第 3 个字节不是 10 开头</text>
    <rect x="40" y="182" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="88" y="204" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">235</text>
    <text x="88" y="220" text-anchor="middle" font-size="9" fill="#555">11101011</text>
    <text x="88" y="246" text-anchor="middle" font-size="9" fill="#446688">首字节 need=2</text>

    <rect x="148" y="182" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="196" y="204" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">140</text>
    <text x="196" y="220" text-anchor="middle" font-size="9" fill="#555">10001100</text>
    <text x="196" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a">续字节 10 ✓</text>

    <rect x="256" y="182" width="96" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="304" y="204" text-anchor="middle" font-size="12" fill="#8c3a3a" font-weight="bold">4</text>
    <text x="304" y="220" text-anchor="middle" font-size="9" fill="#8c3a3a">00000100</text>
    <text x="304" y="246" text-anchor="middle" font-size="9" fill="#b85450">✗ 非 10 开头</text>

    <text x="380" y="212" font-size="12" fill="#b85450" font-weight="bold">✗ false</text>
  </g>

  <!-- 示例 3 -->
  <g filter="url(#rough2)">
    <text x="40" y="280" font-size="11" fill="#444" font-weight="bold">③ data = [240, 162, 138, 147]　4 字节字符正好收尾</text>
    <rect x="40" y="290" width="96" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="88" y="312" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">240</text>
    <text x="88" y="328" text-anchor="middle" font-size="9" fill="#555">11110000</text>
    <text x="88" y="354" text-anchor="middle" font-size="9" fill="#446688">首字节 need=3</text>

    <rect x="148" y="290" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="196" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">162</text>
    <text x="196" y="328" text-anchor="middle" font-size="9" fill="#555">10100010</text>
    <text x="196" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a">续字节 ✓</text>

    <rect x="256" y="290" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="304" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">138</text>
    <text x="304" y="328" text-anchor="middle" font-size="9" fill="#555">10001010</text>
    <text x="304" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a">续字节 ✓</text>

    <rect x="364" y="290" width="96" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="412" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">147</text>
    <text x="412" y="328" text-anchor="middle" font-size="9" fill="#555">10010011</text>
    <text x="412" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a">续字节 ✓</text>

    <text x="488" y="320" font-size="12" fill="#4a7a3a" font-weight="bold">✓ true</text>
  </g>

  <g filter="url(#rough2)">
    <text x="300" y="382" text-anchor="middle" font-size="10" fill="#999">续字节的判定式统一为 (b &gt;&gt; 6) == 0b10，即 b 落在 0x80–0xBF 之间</text>
  </g>
</svg>
