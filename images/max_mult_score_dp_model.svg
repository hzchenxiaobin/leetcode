<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：按序匹配 = 常数阶段的线性 DP</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- a row -->
  <text x="62" y="78" font-size="15" font-weight="bold" fill="#2b6e9e">a</text>
  <g filter="url(#sk)">
    <rect x="90" y="58" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="160" y="58" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="230" y="58" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="300" y="58" width="62" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="121" y="79" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <text x="191" y="79" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <text x="261" y="79" text-anchor="middle" font-size="13" fill="#2b6e9e">5</text>
  <text x="331" y="79" text-anchor="middle" font-size="13" fill="#2b6e9e">6</text>
  <text x="121" y="106" text-anchor="middle" font-size="10" fill="#888">a[0]</text>
  <text x="191" y="106" text-anchor="middle" font-size="10" fill="#888">a[1]</text>
  <text x="261" y="106" text-anchor="middle" font-size="10" fill="#888">a[2]</text>
  <text x="331" y="106" text-anchor="middle" font-size="10" fill="#888">a[3]</text>

  <!-- pairing arrows: a[k] -> b[i_k] -->
  <path d="M 121 112 Q 116 152 116 198" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 191 112 Q 172 152 172 198" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 261 112 Q 230 156 228 198" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 331 112 Q 390 160 396 198" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="478" y="150" font-size="11" fill="#2e6e2e" font-weight="bold">i₀ &lt; i₁ &lt; i₂ &lt; i₃</text>
  <text x="478" y="168" font-size="11" fill="#2e6e2e">连线不交叉，</text>
  <text x="478" y="184" font-size="11" fill="#2e6e2e">配对顺序固定</text>

  <!-- b row -->
  <text x="62" y="230" font-size="15" font-weight="bold" fill="#7a5415">b</text>
  <g filter="url(#sk)">
    <rect x="90" y="212" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="150" y="212" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="210" y="212" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="270" y="212" width="56" height="32" rx="4" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.3"/>
    <rect x="330" y="212" width="56" height="32" rx="4" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.3"/>
    <rect x="390" y="212" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="450" y="212" width="56" height="32" rx="4" fill="#fdfcf7" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="118" y="233" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="178" y="233" text-anchor="middle" font-size="13" fill="#2e6e2e">−6</text>
  <text x="238" y="233" text-anchor="middle" font-size="13" fill="#2e6e2e">4</text>
  <text x="298" y="233" text-anchor="middle" font-size="13" fill="#666">−5</text>
  <text x="358" y="233" text-anchor="middle" font-size="13" fill="#666">−3</text>
  <text x="418" y="233" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <text x="478" y="233" text-anchor="middle" font-size="13" fill="#666">−7</text>
  <text x="118" y="258" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="178" y="258" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="238" y="258" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="298" y="258" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="358" y="258" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="418" y="258" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="478" y="258" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- state box -->
  <g filter="url(#sk)">
    <rect x="60" y="282" width="520" height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="80" y="304" font-size="13" font-weight="bold" fill="#7a5415">状态设计：滚动数组 f[0..4]</text>
  <text x="80" y="326" font-size="12" fill="#444">f[k] = 在已扫描的 b 前缀内，把 a[0..k−1] 全部配对的最大得分</text>
  <text x="80" y="342" font-size="12" fill="#444">f[0] ≡ 0：一个都不配的空方案，得分恒为 0</text>

  <!-- transition box -->
  <g filter="url(#sk)">
    <rect x="60" y="360" width="520" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="382" font-size="12" fill="#2b6e9e">新来元素 x = b[j]：要么不配（f 不变），要么配给某个 a[k−1]</text>
  <text x="80" y="404" font-size="13" fill="#2b6e9e" font-weight="bold" font-family="monospace">f[k] ← max( f[k],  f[k−1] + a[k−1] · x )</text>

  <text x="320" y="448" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">阶段数 = 5 是常数 → 一维滚动即可，O(1) 空间</text>
</svg>
