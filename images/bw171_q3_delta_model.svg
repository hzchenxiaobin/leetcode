<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">基线「全用技巧 1」，改用技巧 2 等价于加 Δ = t2 − t1</text>

  <!-- 基线 -->
  <text x="40" y="70" font-size="11" fill="#4a7a3a" filter="url(#rough2)">基线</text>
  <rect x="86" y="52" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="119" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t1[0]</text>
  <rect x="158" y="52" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="191" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t1[1]</text>
  <rect x="230" y="52" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="263" y="75" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t1[2]</text>
  <text x="316" y="75" font-size="12" fill="#4a7a3a" filter="url(#rough2)">base = Σ t1</text>

  <!-- 箭头 -->
  <path d="M120,96 L120,120" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- 差值 -->
  <text x="26" y="146" font-size="11" fill="#b85450" filter="url(#rough2)">Δ</text>
  <rect x="86" y="126" width="66" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="119" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+5</text>
  <rect x="158" y="126" width="66" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="191" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+1</text>
  <rect x="230" y="126" width="66" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="263" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>

  <!-- 公式 -->
  <rect x="60" y="180" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">总分 = base + Σ_{改用技巧 2 的任务} Δ</text>

  <rect x="60" y="230" width="400" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">「技巧 1 至少 k 个」⟺「技巧 2 至多 n−k 个」</text>
  <text x="260" y="266" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">于是问题 = 至多挑 n−k 个 Δ，让和最大</text>
</svg>
