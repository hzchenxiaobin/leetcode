<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="415" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 1, 2, 1, 2, 1]（n = 6），k = 3</text>

  <!-- ===== 第一步：cost 表 ===== -->
  <g font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="52">0</text><text x="152" y="52">1</text><text x="196" y="52">2</text>
    <text x="240" y="52">3</text><text x="284" y="52">4</text><text x="328" y="52">5</text>
  </g>
  <text x="78" y="76" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)">
    <rect x="88" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="132" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="308" y="58" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="76">1</text><text x="152" y="76">1</text><text x="196" y="76">2</text>
    <text x="240" y="76">1</text><text x="284" y="76">2</text><text x="328" y="76">1</text>
  </g>
  <text x="78" y="108" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">cost</text>
  <g filter="url(#rough2)">
    <rect x="88" y="90" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="132" y="90" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="176" y="90" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="220" y="90" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="264" y="90" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="308" y="90" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="108" font-weight="bold">1</text><text x="152" y="108">2</text><text x="196" y="108">0</text>
    <text x="240" y="108">2</text><text x="284" y="108">0</text><text x="328" y="108">2</text>
  </g>

  <rect x="368" y="44" width="272" height="76" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="504" y="66" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost[0] = max(nums[5], nums[1]) + 1 − nums[0]</text>
  <text x="504" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">　　　　= max(1, 1) + 1 − 1 = 1</text>
  <text x="504" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cost[2] = cost[4] = 0：2 已严格大于两侧邻居（白捡的峰）</text>

  <!-- ===== 情形 A ===== -->
  <text x="40" y="148" font-size="11.5" fill="#446688" filter="url(#rough2)">情形 A（0 不选）：链 1..5 恰选 3 个 → 只能 {1, 3, 5}</text>
  <g filter="url(#rough2)">
    <rect x="88" y="158" width="40" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="132" y="158" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="176" y="158" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="220" y="158" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="264" y="158" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="308" y="158" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="177" font-weight="bold" fill="#b85450">✗</text>
    <text x="152" y="177" fill="#4a7a3a">2</text><text x="196" y="177" fill="#999">0</text>
    <text x="240" y="177" fill="#4a7a3a">2</text><text x="284" y="177" fill="#999">0</text>
    <text x="328" y="177" fill="#4a7a3a">2</text>
  </g>
  <text x="368" y="176" font-size="11.5" fill="#b85450" filter="url(#rough2)">代价 = 2 + 2 + 2 = 6</text>

  <!-- ===== 情形 B ===== -->
  <text x="40" y="206" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">情形 B（0 选）：链 2..4 再选 2 个 → 只能 {2, 4}</text>
  <g filter="url(#rough2)">
    <rect x="88" y="216" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="132" y="216" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="176" y="216" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="220" y="216" width="40" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="264" y="216" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="308" y="216" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="235" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="152" y="235" font-weight="bold" fill="#b85450">✗</text>
    <text x="196" y="235" fill="#4a7a3a">0</text>
    <text x="240" y="235" fill="#999">2</text>
    <text x="284" y="235" fill="#4a7a3a">0</text>
    <text x="328" y="235" font-weight="bold" fill="#b85450">✗</text>
  </g>
  <text x="368" y="234" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">代价 = cost[0] + 0 + 0 = 1 ✓</text>

  <!-- ===== 答案与最终数组 ===== -->
  <text x="40" y="266" font-size="12" fill="#333" filter="url(#rough2)">答案 = min(6, 1) = 1：把 nums[0] 从 1 抬到 2</text>

  <line x1="80" y1="380" x2="356" y2="380" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="88" y="308" width="40" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="132" y="344" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="308" width="40" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="220" y="344" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="308" width="40" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="308" y="344" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="330">2</text><text x="152" y="366">1</text><text x="196" y="330">2</text>
    <text x="240" y="366">1</text><text x="284" y="330">2</text><text x="328" y="366">1</text>
  </g>
  <g font-size="11" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="300">峰</text><text x="196" y="300">峰</text><text x="284" y="300">峰</text>
  </g>
  <g font-size="10" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="396">0</text><text x="152" y="396">1</text><text x="196" y="396">2</text>
    <text x="240" y="396">3</text><text x="284" y="396">4</text><text x="328" y="396">5</text>
  </g>

  <rect x="368" y="288" width="272" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="504" y="310" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最终数组 [2, 1, 2, 1, 2, 1]</text>
  <text x="504" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">下标 0、2、4 均严格大于两侧邻居</text>
  <text x="504" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 个峰 ≥ k = 3，总操作数 1</text>
  <text x="504" y="376" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">原数组只有 2、4 两个峰，0 次操作不够</text>
</svg>
