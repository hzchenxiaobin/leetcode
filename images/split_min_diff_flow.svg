<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#3a3a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="640" height="612" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：双标记 + 前缀和，一次线性扫描</text>

  <!-- Step 1 -->
  <rect x="50" y="54" width="540" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="70" y="80" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">Step 1：从右向左预处理 dec[]</text>
  <text x="70" y="102" font-size="11" fill="#444" filter="url(#rough2)">dec[n−1] = true；dec[j] = dec[j+1] 且 nums[j] &gt; nums[j+1]</text>
  <text x="70" y="122" font-size="11" fill="#444" filter="url(#rough2)">一次性回答所有「right = nums[i+1..n−1] 是否严格递减」</text>
  <text x="70" y="142" font-size="10" fill="#888" filter="url(#rough2)">O(n) 时间 / O(n) 空间</text>

  <path d="M 320 150 L 320 166" fill="none" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="50" y="170" width="540" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="70" y="196" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">Step 2：从左向右扫描 i = 0 … n−2</text>
  <text x="70" y="218" font-size="11" fill="#444" filter="url(#rough2)">维护 incOK：一旦 nums[i−1] ≥ nums[i] 即永久置 false（不可恢复）</text>
  <text x="70" y="238" font-size="11" fill="#444" filter="url(#rough2)">维护 leftSum：rightSum = total − leftSum，无需重复求和</text>
  <text x="70" y="258" font-size="10" fill="#888" filter="url(#rough2)">一次性回答所有「left = nums[0..i] 是否严格递增」</text>

  <path d="M 320 266 L 320 282" fill="none" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="50" y="286" width="540" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="70" y="312" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">Step 3：逐点判定合法性并计算差值</text>
  <text x="70" y="334" font-size="11" fill="#444" filter="url(#rough2)">若 incOK 且 dec[i+1]：d = |2·leftSum − total|，更新 ans = min(ans, d)</text>
  <text x="70" y="354" font-size="11" fill="#444" filter="url(#rough2)">否则该分割点无效，跳过</text>
  <text x="70" y="374" font-size="10" fill="#888" filter="url(#rough2)">每个分割点的判定与求值均为 O(1)</text>

  <path d="M 320 382 L 320 398" fill="none" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="50" y="402" width="540" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="70" y="428" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">Step 4：扫描结束，汇总答案</text>
  <text x="70" y="450" font-size="11" fill="#444" filter="url(#rough2)">ans 从未被更新 → 无合法分割，返回 −1</text>
  <text x="70" y="470" font-size="11" fill="#444" filter="url(#rough2)">否则返回 ans（最小绝对差）</text>

  <!-- 示例走查 -->
  <rect x="50" y="496" width="540" height="100" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" rx="10" filter="url(#rough2)"/>
  <text x="70" y="520" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例走查：nums = [1,3,2]，total = 6</text>
  <text x="70" y="542" font-size="11" fill="#444" filter="url(#rough2)">i=0：inc✓ 且 dec✓ → d = |2·1 − 6| = 4</text>
  <text x="70" y="562" font-size="11" fill="#444" filter="url(#rough2)">i=1：inc✓ 且 dec✓ → d = |2·4 − 6| = 2</text>
  <text x="70" y="584" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">ans = min(4, 2) = 2</text>
</svg>
