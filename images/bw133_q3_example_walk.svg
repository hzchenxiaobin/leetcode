<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：nums = [0,1,1,0,1]，答案 4</text>

  <text x="70" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i</text>
  <text x="145" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums[i]</text>
  <text x="228" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">flip</text>
  <text x="315" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cur</text>
  <text x="398" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">动作</text>
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans</text>

  <path d="M 40 80 L 490 80" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="70" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="145" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="228" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="106" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="398" y="106" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">翻，flip→1</text>
  <text x="470" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 40 118 L 490 118" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="145" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="142" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="398" y="142" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">翻，flip→0</text>
  <text x="470" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 40 154 L 490 154" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="178" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="398" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">跳过</text>
  <text x="470" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 40 190 L 490 190" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="145" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="228" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="315" y="214" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="398" y="214" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">翻，flip→1</text>
  <text x="470" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <path d="M 40 226 L 490 226" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="70" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="145" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="315" y="250" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="398" y="250" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">翻，flip→0</text>
  <text x="470" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 40 262 L 490 262" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="150" y="282" width="220" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">ans = 4</text>

  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cur = nums[i] ^ flip：只看「被翻转了奇数次还是偶数次」</text>
</svg>
