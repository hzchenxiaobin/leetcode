<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">排列顺序：负数段升序在前，正数段升序在后</text>

  <!-- 负数段 -->
  <text x="66" y="70" font-size="11" fill="#b85450" filter="url(#rough2)">负数（大的在前）</text>
  <rect x="56" y="80" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="85" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−5</text>
  <rect x="118" y="80" width="58" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="147" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−4</text>

  <!-- 正数段 -->
  <text x="252" y="70" font-size="11" fill="#4a7a3a" filter="url(#rough2)">正数（小的在前）</text>
  <rect x="250" y="80" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="279" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="312" y="80" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="341" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="374" y="80" width="58" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="403" y="107" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="260" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n = 5, target = −3 的答案：[−5, −4, 1, 2, 3]</text>

  <!-- 排序论证 -->
  <rect x="56" y="164" width="408" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">给定符号集合后，任何逆序对 (i&lt;j, a[i]&gt;a[j]) 交换后字典序都会变小</text>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⇒ 字典序最小 ⇒ 升序排列（无逆序对）</text>

  <!-- 反例 -->
  <rect x="56" y="228" width="408" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">错误做法：按 1..n 原顺序输出 → n=3, target=0 得 [1,2,−3]</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">正确：[−3,1,2]，首位 −3 &lt; 1，字典序更小</text>
</svg>
