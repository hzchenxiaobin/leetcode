<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例走查：(1, 1) → (3, 5) 的倒推过程</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每轮只动较大坐标；一次取模 = 连续减多次</text>

  <rect x="36" y="60" width="548" height="216" fill="#fffdf8" stroke="#cbb994" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <rect x="36" y="60" width="548" height="28" fill="#e8eefc" stroke="#9bb0d0" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <path d="M 176 60 L 176 276" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 286 60 L 286 276" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 436 60 L 436 276" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 88 L 584 88" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 134 L 584 134" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 180 L 584 180" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 36 226 L 584 226" stroke="#cbb994" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="10" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="79">当前 (x, y)</text>
    <text x="231" y="79">比较</text>
    <text x="361" y="79">动作</text>
    <text x="510" y="79">结果</text>
  </g>

  <g font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="115">(3, 5)</text>
    <text x="231" y="115" fill="#8a3a36">tx &lt; ty</text>
    <text x="361" y="115" font-size="9.5">ty %= tx：5 % 3 = 2</text>
    <text x="510" y="115">(3, 2)</text>

    <text x="106" y="161">(3, 2)</text>
    <text x="231" y="161" fill="#8a3a36">tx &gt; ty</text>
    <text x="361" y="161" font-size="9.5">tx %= ty：3 % 2 = 1</text>
    <text x="510" y="161">(1, 2)</text>

    <text x="106" y="207">(1, 2)</text>
    <text x="231" y="207" fill="#3a5a30">tx == sx</text>
    <text x="361" y="207" font-size="9.5">退出循环</text>
    <text x="510" y="207">(1, 2)</text>

    <text x="106" y="253">(1, 2)</text>
    <text x="231" y="253" fill="#3a5a30">终止判定</text>
    <text x="361" y="253" font-size="8.8">sy ≤ ty 且 (ty − sy) % sx = 0</text>
    <text x="510" y="253" fill="#4a7a3a" font-weight="bold">true ✓</text>
  </g>

  <text x="310" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">正向验证：三步都合法，说明倒推链确实能走回起点</text>

  <rect x="82" y="308" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="329" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">(1, 1)</text>
  <rect x="212" y="308" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="250" y="329" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(1, 2)</text>
  <rect x="342" y="308" width="76" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="329" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">(3, 2)</text>
  <rect x="472" y="308" width="76" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="510" y="329" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">(3, 5)</text>

  <path d="M 158 324 L 208 324" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 324 L 338 324" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 418 324 L 468 324" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="183" y="318" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+y</text>
  <text x="313" y="318" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+x</text>
  <text x="443" y="318" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">+y</text>

  <text x="310" y="376" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">反例 (1, 1) → (2, 2)：tx == ty 不是起点，取模得 0，判 false</text>
</svg>
