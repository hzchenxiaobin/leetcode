<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">闰年判定流程：四年一闰，百年不闰，四百年再闰</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">只有 2 月的天数取决于闰平年，其余月份查表即可</text>

  <g filter="url(#rough2)">
    <rect x="225" y="58" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="79" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">年份 Y</text>
  </g>

  <path d="M 280 92 L 280 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,104 362,138 280,172 198,138" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="143" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">Y % 4 == 0 ?</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 362 138 L 428 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <text x="392" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
    <rect x="430" y="122" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="476" y="142" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">平年（28）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 172 L 280 188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="291" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,190 362,224 280,258 198,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="229" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">Y % 100 != 0 ?</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 198 224 L 132 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="168" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="40" y="208" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="85" y="228" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">闰年（29）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 258 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="291" y="270" font-size="11" fill="#b85450" font-weight="bold">否</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="280,276 362,310 280,344 198,310" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="315" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">Y % 400 == 0 ?</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 198 310 L 132 310" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="168" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="40" y="294" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="85" y="314" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">闰年（29）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 362 310 L 428 310" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <text x="392" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
    <rect x="430" y="294" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="476" y="314" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">平年（28）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="62" width="148" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="98" y="82" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">经典陷阱</text>
    <text x="98" y="100" text-anchor="middle" font-size="9.5" fill="#555">1900 % 100 == 0</text>
    <text x="98" y="115" text-anchor="middle" font-size="9.5" fill="#555">且 1900 % 400 != 0</text>
    <text x="98" y="130" text-anchor="middle" font-size="9.5" fill="#b85450">→ 平年，2 月 28 天</text>
    <text x="98" y="148" text-anchor="middle" font-size="9.5" fill="#555">2000 % 400 == 0</text>
    <text x="98" y="163" text-anchor="middle" font-size="9.5" fill="#4a7a3a">→ 闰年，2 月 29 天</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="90" y="364" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="280" y="386" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">(Y % 4 == 0 &amp;&amp; Y % 100 != 0) || (Y % 400 == 0)</text>
  </g>
</svg>
