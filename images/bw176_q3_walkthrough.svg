<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="580" height="310" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333">演算：nums = [1,4,3,5]，colors = [1,1,2,2]</text>

  <text x="36" y="58" font-size="11" fill="#666">i</text>
  <text x="86" y="58" font-size="11" fill="#666">nums</text>
  <text x="166" y="58" font-size="11" fill="#666">color</text>
  <text x="256" y="58" font-size="11" fill="#666">与 i−1 同色?</text>
  <text x="386" y="58" font-size="11" fill="#666">dp[i−1]</text>
  <text x="466" y="58" font-size="11" fill="#666">dp[i]</text>

  <g font-size="12" fill="#333">
    <text x="36" y="88">0</text><text x="86" y="88">1</text><text x="166" y="88">1</text>
    <text x="256" y="88">—</text><text x="386" y="88">—</text><text x="466" y="88">1</text>
    <text x="36" y="116">1</text><text x="86" y="116">4</text><text x="166" y="116">1</text>
    <text x="256" y="116" fill="#b85450">是</text><text x="386" y="116">1</text><text x="466" y="116">4</text>
    <text x="36" y="144">2</text><text x="86" y="144">3</text><text x="166" y="144">2</text>
    <text x="256" y="144" fill="#4a7a3a">否</text><text x="386" y="144">4</text><text x="466" y="144">7</text>
    <text x="36" y="172">3</text><text x="86" y="172">5</text><text x="166" y="172">2</text>
    <text x="256" y="172" fill="#b85450">是</text><text x="386" y="172">7</text><text x="466" y="172" fill="#4a7a3a">9</text>
  </g>

  <rect x="36" y="192" width="508" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="214" font-size="11" fill="#333">i=2：三种来源 4、3+dp[0]=4、3+dp[1]=7 → 7（偷 1、2 号，颜色不同）</text>
  <text x="50" y="230" font-size="11" fill="#333">i=3：同色禁用相邻分支，只能 5+dp[1]=9 或 dp[2]=7 → 9（偷 1、3 号）</text>

  <rect x="36" y="250" width="508" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="50" y="278" font-size="12" fill="#333">答案 dp[3] = 9</text>
  <text x="200" y="278" font-size="10" fill="#666">若误把相邻异色也禁止，i=2 只会得 4，最终答案变 7</text>
</svg>
