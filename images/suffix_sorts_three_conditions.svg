<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：「排序后相等」＝ 前缀 + 形状 + 内容，三个独立条件</text>
  <path d="M 100 38 Q 320 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">对下标 i 操作：只把后缀 nums[i..n−1] 按非递增排序，前缀不动</text>

  <g filter="url(#sk)">
    <rect x="150" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="194" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="238" y="66" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="312" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="356" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="444" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="172" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="216" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="296" y="88" text-anchor="middle" font-size="14" fill="#888">⋯</text>
  <text x="334" y="88" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">9</text>
  <text x="378" y="88" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">7</text>
  <text x="422" y="88" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">7</text>
  <text x="466" y="88" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">3</text>

  <path d="M 150 110 Q 216 118 282 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 312 110 Q 400 118 488 110" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="216" y="130" text-anchor="middle" font-size="12" fill="#2b6e9e">前缀：原样保留</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#8a6415">后缀：非递增排序</text>

  <text x="320" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">与 target 逐位相等 ⟺</text>

  <g filter="url(#sk)">
    <rect x="150" y="172" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="194" y="172" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="238" y="172" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="312" y="172" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="356" y="172" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="400" y="172" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="444" y="172" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="172" y="194" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="216" y="194" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="260" y="194" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="296" y="194" text-anchor="middle" font-size="14" fill="#888">⋯</text>
  <text x="334" y="194" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">9</text>
  <text x="378" y="194" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="422" y="194" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">7</text>
  <text x="466" y="194" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">3</text>

  <path d="M 150 216 Q 216 224 282 216" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 312 216 Q 400 224 488 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="216" y="236" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">条件 A：逐位相等 ⟺ i ≤ m</text>
  <text x="400" y="236" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">条件 B：target[i..] 非递增</text>

  <g filter="url(#sk)">
    <rect x="46" y="252" width="270" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="324" y="252" width="270" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="181" y="273" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">条件 A（前缀原样保留）</text>
  <text x="181" y="292" text-anchor="middle" font-size="11.5" fill="#2b6e9e">nums[0..i−1] ＝ target[0..i−1] ⟺ i ≤ m</text>
  <text x="181" y="308" text-anchor="middle" font-size="11.5" fill="#2b6e9e">m ＝ 首个失配下标（无则 n）</text>
  <text x="459" y="273" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">条件 B + C（后缀排序）</text>
  <text x="459" y="292" text-anchor="middle" font-size="11.5" fill="#2e6e2e">B：target[i..] 非递增 ⟺ i ≥ s</text>
  <text x="459" y="308" text-anchor="middle" font-size="11.5" fill="#2e6e2e">C：两后缀多重集相同 ⟺ bad ＝ 0</text>

  <g filter="url(#sk)">
    <rect x="40" y="338" width="560" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">三个条件都能「从右往左一趟扫描、每步 O(1)」增量维护</text>
  <text x="320" y="386" text-anchor="middle" font-size="12" fill="#8a6415">频差桶 bad ＝ 非零频差值的个数，bad ＝ 0 ⟺ 后缀多重集相等</text>
</svg>
