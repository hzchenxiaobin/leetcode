<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：veganFriendly=1, maxPrice=50, maxDistance=10</text>
  <text x="310" y="48" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">逐行判定三项条件，保留 3 家，再按 (rating, id) 降序</text>

  <rect x="40" y="72" width="541" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="67.5" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">id</text>
  <text x="131" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">rating</text>
  <text x="201" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">vegan</text>
  <text x="270" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">price</text>
  <text x="346" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">distance</text>
  <text x="457" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="554" y="94" text-anchor="middle" font-size="10.5" fill="#2f4560" font-weight="bold" filter="url(#rough2)">保留</text>

  <rect x="40" y="112" width="541" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="67.5" y="137" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="131" y="137" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="201" y="137" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="270" y="137" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">40</text>
  <text x="346" y="137" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">10</text>
  <text x="457" y="137" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">✓ 三项均通过</text>
  <text x="554" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="40" y="158" width="541" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="67.5" y="183" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="131" y="183" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">8</text>
  <text x="201" y="183" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="270" y="183" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">50</text>
  <text x="346" y="183" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="457" y="183" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">✗ vegan=0 被剔除</text>
  <text x="554" y="183" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="40" y="204" width="541" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="67.5" y="229" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="131" y="229" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">8</text>
  <text x="201" y="229" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="270" y="229" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">30</text>
  <text x="346" y="229" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="457" y="229" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">✓ 三项均通过</text>
  <text x="554" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="40" y="250" width="541" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="67.5" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="131" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">10</text>
  <text x="201" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="270" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">10</text>
  <text x="346" y="275" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="457" y="275" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">✗ vegan=0 被剔除</text>
  <text x="554" y="275" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="40" y="296" width="541" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="67.5" y="321" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="131" y="321" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="201" y="321" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="270" y="321" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">15</text>
  <text x="346" y="321" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="457" y="321" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">✓ 三项均通过</text>
  <text x="554" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <path d="M 310 340 L 310 356" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="360" width="400" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">保留三家后比键：(8, 3) &gt; (4, 1) &gt; (1, 5)</text>
  <text x="310" y="401" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结果 [3, 1, 5]</text>

  <text x="310" y="438" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">示例 2（veganFriendly=0）：素食与非素食全留，(8,3) 与 (8,2) 同分，id 大者在前 → [4,3,2,1,5]</text>
  <text x="310" y="460" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">示例 3（maxPrice=30, maxDistance=3）：只剩 id=4 与 id=5，rating 10 &gt; 1 → [4,5]</text>
</svg>
