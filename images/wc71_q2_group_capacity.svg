<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">关键观察：同色组恰好 x+1 只，能回答 x 的也至多 x+1 只</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">回答 x 意为「还有 x 只同色同伴」，故该颜色共 x+1 只（含自己）</text>

  <rect x="36" y="66" width="290" height="176" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="181" y="88" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">蓝组：共 4 只 = x+1（x = 3）</text>

  <g filter="url(#rough2)">
    <ellipse cx="79" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <ellipse cx="93" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <circle cx="86" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="86" y="145" text-anchor="middle" font-size="11" fill="#3a4a66">A</text>

    <ellipse cx="143" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <ellipse cx="157" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <circle cx="150" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="150" y="145" text-anchor="middle" font-size="11" fill="#3a4a66">B</text>

    <ellipse cx="207" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <ellipse cx="221" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <circle cx="214" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="214" y="145" text-anchor="middle" font-size="11" fill="#3a4a66">C</text>

    <ellipse cx="271" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <ellipse cx="285" cy="120" rx="4" ry="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.2"/>
    <circle cx="278" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="278" y="145" text-anchor="middle" font-size="11" fill="#3a4a66">D</text>
  </g>

  <text x="181" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">四只互为同色同伴，被问到时都回答 3</text>
  <text x="181" y="202" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">没人问过的同伴照样存在，只计入总数</text>
  <text x="181" y="224" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">组内兔子数被题目「钉死」为 x+1</text>

  <rect x="350" y="66" width="254" height="176" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="477" y="88" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">回答 3 的共 c = 9 只 → 装 3 组</text>

  <g filter="url(#rough2)">
    <rect x="360" y="100" width="66" height="52" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <circle cx="380" cy="118" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="406" cy="118" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="380" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="406" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>

    <rect x="434" y="100" width="66" height="52" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <circle cx="454" cy="118" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="480" cy="118" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="454" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="480" cy="140" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>

    <rect x="508" y="100" width="66" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <circle cx="528" cy="118" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="554" cy="118" r="6" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1"/>
    <circle cx="528" cy="140" r="6" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1"/>
    <circle cx="554" cy="140" r="6" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1"/>
  </g>

  <text x="477" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每组容量 = x+1 = 4</text>
  <text x="477" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 3 组只坐 1 只，也要补满 4 只</text>
  <text x="477" y="210" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">贡献 3 × 4 = 12 只（不是 9 只）</text>
  <text x="477" y="230" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">空位由没被问到的同色兔子补齐</text>

  <rect x="36" y="262" width="568" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">一般化：对每个不同的回答值 x，设回答 x 的兔子有 c 只</text>
  <text x="56" y="305" font-size="11" fill="#555" filter="url(#rough2)">最少组数 k = ⌈c / (x+1)⌉，该值贡献 k · (x+1) 只兔子</text>
  <text x="56" y="325" font-size="11" fill="#555" filter="url(#rough2)">不同 x 的颜色互不相同，互不干扰，总数 = Σ k(x) · (x+1)</text>

  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">answers = [1,1,2]：x=1 两只 → 1 组 2 只；x=2 一只 → 1 组 3 只；合计 5 只</text>
</svg>
