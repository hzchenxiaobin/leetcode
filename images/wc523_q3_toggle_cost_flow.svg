<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">toggle：判定开销、记快照 / 退快照</text>

  <rect x="196" y="40" width="128" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">toggle(seat)</text>

  <path d="M 260 70 L 260 84" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 196 120 L 260 88 L 324 120 L 260 152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">已预订？</text>
  <text x="332" y="112" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 324 120 L 358 120" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="168" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 260 152 L 260 180" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="94" width="146" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="114" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">释放座位</text>
  <text x="435" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">total −= 快照 · cnt −= 1</text>

  <path d="M 196 218 L 260 186 L 324 218 L 260 250 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">中间座 B / C？</text>
  <text x="332" y="210" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 324 218 L 358 218" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="266" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 260 250 L 260 278" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="200" width="146" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="223" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">成本 = 1 秒</text>

  <text x="188" y="320" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">A 看 B · D 看 C</text>
  <path d="M 196 316 L 260 284 L 324 316 L 260 348 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">相邻中间座已订？</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（预订瞬间看一眼）</text>
  <text x="332" y="308" font-size="11" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 324 316 L 358 316" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="364" font-size="11" fill="#666" filter="url(#rough2)">否</text>
  <path d="M 260 348 L 260 370" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="298" width="146" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="321" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">成本 = 3 秒</text>

  <rect x="194" y="374" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">成本 = 1 秒</text>

  <path d="M 435 236 C 470 320, 430 410, 368 432" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 334 C 458 380, 410 424, 372 432" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 410 L 260 432" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="436" width="250" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="458" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">快照 cost[seat] = 成本</text>
  <text x="265" y="477" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">total += 成本 · cnt += 1</text>
</svg>
