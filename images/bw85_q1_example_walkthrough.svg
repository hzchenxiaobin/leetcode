<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：WBBWWBBWBW，k = 7 的四个窗口</text>

  <!-- 4 行窗口 -->
  <!-- 行数据 -->
  <!-- A: WBBWWBB | 3  B: BBWWBBW | 3  C: BWWBBWB | 3  D: WWBBWBW | 4 -->

  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <!-- row A -->
    <rect x="120" y="48" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="158" y="48" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="48" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="48" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="272" y="48" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="48" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="48" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="69" fill="#b85450" font-weight="bold">W</text>
    <text x="177" y="69" fill="#1a2b45">B</text>
    <text x="215" y="69" fill="#1a2b45">B</text>
    <text x="253" y="69" fill="#b85450" font-weight="bold">W</text>
    <text x="291" y="69" fill="#b85450" font-weight="bold">W</text>
    <text x="329" y="69" fill="#1a2b45">B</text>
    <text x="367" y="69" fill="#1a2b45">B</text>
    <text x="86" y="69" font-size="12.5">[0,7)</text>
    <text x="424" y="69" font-size="14" fill="#b85450" font-weight="bold">3</text>

    <!-- row B -->
    <rect x="120" y="92" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="92" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="92" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="234" y="92" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="272" y="92" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="92" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="92" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="139" y="113" fill="#1a2b45">B</text>
    <text x="177" y="113" fill="#1a2b45">B</text>
    <text x="215" y="113" fill="#b85450" font-weight="bold">W</text>
    <text x="253" y="113" fill="#b85450" font-weight="bold">W</text>
    <text x="291" y="113" fill="#1a2b45">B</text>
    <text x="329" y="113" fill="#1a2b45">B</text>
    <text x="367" y="113" fill="#b85450" font-weight="bold">W</text>
    <text x="86" y="113" font-size="12.5">[1,8)</text>
    <text x="424" y="113" font-size="14" fill="#b85450" font-weight="bold">3</text>

    <!-- row C -->
    <rect x="120" y="136" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="136" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="196" y="136" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="234" y="136" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="136" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="136" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="348" y="136" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="157" fill="#1a2b45">B</text>
    <text x="177" y="157" fill="#b85450" font-weight="bold">W</text>
    <text x="215" y="157" fill="#b85450" font-weight="bold">W</text>
    <text x="253" y="157" fill="#1a2b45">B</text>
    <text x="291" y="157" fill="#1a2b45">B</text>
    <text x="329" y="157" fill="#b85450" font-weight="bold">W</text>
    <text x="367" y="157" fill="#1a2b45">B</text>
    <text x="86" y="157" font-size="12.5">[2,9)</text>
    <text x="424" y="157" font-size="14" fill="#b85450" font-weight="bold">3</text>

    <!-- row D -->
    <rect x="120" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="158" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="196" y="180" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="234" y="180" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="310" y="180" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="180" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="139" y="201" fill="#b85450" font-weight="bold">W</text>
    <text x="177" y="201" fill="#b85450" font-weight="bold">W</text>
    <text x="215" y="201" fill="#1a2b45">B</text>
    <text x="253" y="201" fill="#1a2b45">B</text>
    <text x="291" y="201" fill="#b85450" font-weight="bold">W</text>
    <text x="329" y="201" fill="#1a2b45">B</text>
    <text x="367" y="201" fill="#b85450" font-weight="bold">W</text>
    <text x="86" y="201" font-size="12.5">[3,10)</text>
    <text x="424" y="201" font-size="14" fill="#b85450" font-weight="bold">4</text>
  </g>

  <text x="460" y="128" font-size="12" fill="#888" filter="url(#rough2)">← 白色数</text>

  <!-- min 标注 -->
  <path d="M 424 88 C 448 88 448 100 448 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 424 132 C 448 132 448 120 448 112" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 424 176 C 456 176 456 150 452 130" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="470" y="112" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">min = 3</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="80" y="252" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="274" text-anchor="middle" font-size="14.5" fill="#1d3a17" filter="url(#rough2)">四个窗口的白色数 {3, 3, 3, 4}</text>
  <text x="280" y="296" text-anchor="middle" font-size="15" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">最少涂色次数 = min = 3 ✓（与官方一致）</text>

  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">滑动一步只看首尾两格：窗口 A→B 时，离开的 W 使计数 −1，进入的 B 不变</text>
  <text x="280" y="358" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">n − k + 1 = 4 个窗口、n − k = 3 次滑动，全程 O(n)</text>
</svg>
