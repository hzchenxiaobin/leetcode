<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，一次 swap</text>

  <ellipse cx="115" cy="54" rx="38" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M115,71 V86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="90" width="166" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">first = head，先走 k−1 步</text>
  <text x="115" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">⇒ 停在正数第 k</text>
  <path d="M115,138 V150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="32" y="154" width="166" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">second = head</text>
  <path d="M115,186 V198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="115,202 192,246 115,290 38,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">first.next</text>
  <text x="115" y="258" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">为空？</text>

  <path d="M192,246 H244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="240" font-size="11" fill="#888" filter="url(#rough2)">否</text>

  <rect x="248" y="224" width="206" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">first = first.next</text>
  <text x="351" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">second = second.next</text>

  <path d="M445,224 V80 H20 V246 H33" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="75" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">回到判断（循环推进）</text>

  <path d="M115,290 V306" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="304" font-size="10.5" fill="#888" filter="url(#rough2)">是（触尾）</text>

  <rect x="32" y="310" width="166" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="333" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">swap(first.val, second.val)</text>
  <path d="M198,329 H230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="280" cy="329" rx="46" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">return head</text>

  <rect x="250" y="95" width="170" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="114" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">不变量：</text>
  <text x="335" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">first 领先 second k−1 条边</text>
  <text x="335" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">first 触尾停下时</text>
  <text x="335" y="168" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">second = 倒数第 k ✓</text>
</svg>
