<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c07a20"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">瓶颈最短路：体力 = 路径上的最大边权</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: grid with two paths ===== -->
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 体力消耗 = 路径上最大边权，而不是边权之和（示例 1）</text>

  <!-- grid cells: cols x=96,164,232 (w=64); rows y=112,170,228 (h=54) -->
  <g filter="url(#sk)"><rect x="96" y="112" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="112" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="232" y="112" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="96" y="170" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="170" width="64" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="232" y="170" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="96" y="228" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="228" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="232" y="228" width="64" height="54" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>

  <!-- height labels (top-left inside cells) -->
  <text x="106" y="129" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="174" y="129" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="242" y="129" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="106" y="187" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="174" y="187" font-size="13" font-weight="bold" fill="#b85450">8</text>
  <text x="242" y="187" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="106" y="245" font-size="13" font-weight="bold" fill="#333">5</text>
  <text x="174" y="245" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="242" y="245" font-size="13" font-weight="bold" fill="#333">5</text>

  <!-- path A (orange): (0,0)->(0,1)->(0,2)->(1,2)->(2,2) -->
  <polyline points="128,139 196,139 264,139 264,197 264,255" fill="none" stroke="#d6a040" stroke-width="4.5" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round" marker-mid="url(#arO)" marker-end="url(#arO)" filter="url(#sk)"/>
  <!-- path B (green): (0,0)->(1,0)->(2,0)->(2,1)->(2,2) -->
  <polyline points="128,139 128,197 128,255 196,255 264,255" fill="none" stroke="#4a8e4a" stroke-width="4.5" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round" marker-mid="url(#arG)" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- edge weight labels: A -->
  <text x="162" y="131" text-anchor="middle" font-size="9.5" fill="#c07a20" font-weight="bold">1</text>
  <text x="230" y="131" text-anchor="middle" font-size="9.5" fill="#c07a20" font-weight="bold">0</text>
  <text x="257" y="171" text-anchor="middle" font-size="9.5" fill="#c07a20" font-weight="bold">0</text>
  <text x="256" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <!-- edge weight labels: B -->
  <text x="139" y="171" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="139" y="228" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="162" y="249" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="230" y="249" text-anchor="middle" font-size="9.5" fill="#2e6e2e" font-weight="bold">2</text>

  <!-- s / t markers -->
  <circle cx="128" cy="139" r="5.5" fill="#b85450" stroke="#8a3a36" stroke-width="1.2" filter="url(#sk)"/>
  <text x="110" y="132" font-size="11" font-weight="bold" fill="#b85450">s</text>
  <circle cx="264" cy="255" r="5.5" fill="#b85450" stroke="#8a3a36" stroke-width="1.2" filter="url(#sk)"/>
  <text x="274" y="246" font-size="11" font-weight="bold" fill="#b85450">t</text>

  <!-- legend -->
  <line x1="312" y1="118" x2="344" y2="118" stroke="#d6a040" stroke-width="4" stroke-opacity="0.85" filter="url(#sk)"/>
  <text x="352" y="122" font-size="10.5" fill="#444">路径 A：右→右→下→下</text>
  <line x1="312" y1="140" x2="344" y2="140" stroke="#4a8e4a" stroke-width="4" stroke-opacity="0.85" filter="url(#sk)"/>
  <text x="352" y="144" font-size="10.5" fill="#444">路径 B：下→下→右→右（最优）</text>

  <!-- annotations under grid -->
  <rect x="62" y="300" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="80" y="310" font-size="11" fill="#444">路径 A：边权 1, 0, 0, 3 → 边权和 = 4（更小！），最大边权 = 3 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <rect x="62" y="324" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="80" y="334" font-size="11" fill="#444">路径 B：边权 2, 2, 2, 2 → 边权和 = 8，最大边权 = 2 <tspan fill="#2e6e2e" font-weight="bold">✓ 更优</tspan></text>
  <text x="62" y="358" font-size="11" fill="#7a2828" font-weight="bold">按「求和」跑普通 Dijkstra 会选 A —— 但体力只看最大边权，答案是 B！</text>

  <!-- ===== Panel 2: max-relaxation ===== -->
  <g filter="url(#sk)">
    <rect x="530" y="96" width="370" height="250" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="550" y="122" font-size="13" font-weight="bold" fill="#2b6e9e">② max-Dijkstra：只改松弛算子</text>
  <text x="550" y="150" font-size="11.5" fill="#444" font-family="monospace">dist[v] ← min( dist[v] ,</text>
  <text x="568" y="168" font-size="11.5" fill="#b03a3a" font-family="monospace" font-weight="bold">max( dist[u] , w(u,v) ) )</text>
  <text x="550" y="192" font-size="11.5" fill="#444" font-family="monospace">w(u,v) = | h[u] − h[v] |</text>
  <path d="M 550 206 Q 715 212 880 206" stroke="#4a8edb" stroke-width="1" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="550" y="230" font-size="11" fill="#2e6e2e">✓ 代价单调不减：max(dist[u], w) ≥ dist[u]</text>
  <text x="550" y="250" font-size="11" fill="#2e6e2e">✓ 边权非负：|h[u] − h[v]| ≥ 0</text>
  <text x="550" y="278" font-size="11" fill="#444">Dijkstra 贪心只需要这两条性质，</text>
  <text x="550" y="296" font-size="11" fill="#444">与「代价是否可加」无关 → 换 max 照样正确</text>
  <text x="550" y="326" font-size="10" fill="#888">（严格证明见题解 §5）</text>

  <!-- ===== Panel 3: three solutions ===== -->
  <text x="60" y="400" font-size="13" font-weight="bold" fill="#5a3a7a">③ 一题三解：瓶颈最短路（minimax path）</text>

  <g filter="url(#sk)">
    <rect x="60" y="420" width="270" height="110" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="444" font-size="12" font-weight="bold" fill="#2b4a6e">max-Dijkstra（本题主解）</text>
  <text x="80" y="468" font-size="10.5" fill="#444" font-family="monospace">松弛：max(dist[u], w)</text>
  <text x="80" y="486" font-size="10.5" fill="#444">弹出即确定，可提前终止</text>
  <text x="80" y="512" font-size="11" font-weight="bold" fill="#446688" font-family="monospace">O(mn·log mn)</text>

  <g filter="url(#sk)">
    <rect x="335" y="420" width="270" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="355" y="444" font-size="12" font-weight="bold" fill="#7a5415">二分答案 + BFS</text>
  <text x="355" y="468" font-size="10.5" fill="#444" font-family="monospace">二分阈值 t ∈ [0, max−min]</text>
  <text x="355" y="486" font-size="10.5" fill="#444">BFS 只走落差 ≤ t 的边</text>
  <text x="355" y="512" font-size="11" font-weight="bold" fill="#a06a10" font-family="monospace">O(mn·log D)</text>

  <g filter="url(#sk)">
    <rect x="610" y="420" width="270" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="630" y="444" font-size="12" font-weight="bold" fill="#2e5a24">排序 + 并查集</text>
  <text x="630" y="468" font-size="10.5" fill="#444" font-family="monospace">边按权值升序加入</text>
  <text x="630" y="486" font-size="10.5" fill="#444">起终点首次连通即答案</text>
  <text x="630" y="512" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">O(mn·log mn)</text>

  <!-- ===== key insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="556" width="860" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="582" font-size="12" font-weight="bold" fill="#2b2b2b">关键洞察</text>
  <text x="80" y="606" font-size="11" fill="#444">Dijkstra 的贪心只要求「路径代价沿路径单调不减 + 边权非负」，并不要求代价可加；</text>
  <text x="80" y="626" font-size="11" fill="#444">把 + 换成 max（或任何单调不减的聚合），整套框架照用 —— 这就是「半环上的最短路」。</text>
  <text x="80" y="652" font-size="11" fill="#7a2828">求和 Dijkstra 的错误恰恰提醒：先看清代价的聚合方式，再套模板。</text>
</svg>
