<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按缺口长度分层：同层 64 个格子可以并排算</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.6" fill="#5a6a7a" filter="url(#rough2)">格子 (g, i) 表示状态 f(i, i+g)（主干 7 个点、缺口长度 g = 2..6 时的全部状态）</text>

  <!-- 行标签 + 网格 -->
  <g font-size="11.4" fill="#555" text-anchor="end">
    <text x="86" y="98" filter="url(#rough2)">g = 2</text>
    <text x="86" y="146" filter="url(#rough2)">g = 3</text>
    <text x="86" y="194" filter="url(#rough2)">g = 4</text>
    <text x="86" y="242" filter="url(#rough2)">g = 5</text>
    <text x="86" y="290" filter="url(#rough2)">g = 6</text>
  </g>

  <g filter="url(#rough2)">
    <!-- g=2, i=0..4 -->
    <rect x="104" y="80" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="158" y="80" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="80" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="266" y="80" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="80" width="46" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- g=3, i=0..3 -->
    <rect x="104" y="128" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="158" y="128" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="212" y="128" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="266" y="128" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <!-- g=4, i=0..2 -->
    <rect x="104" y="176" width="46" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="158" y="176" width="46" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="212" y="176" width="46" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <!-- g=5, i=0..1 -->
    <rect x="104" y="224" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="158" y="224" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <!-- g=6, i=0 -->
    <rect x="104" y="272" width="46" height="26" rx="4" fill="#446688" stroke="#2f4a66" stroke-width="2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="127" y="97" fill="#2f4a66" filter="url(#rough2)">f(0,2)</text>
    <text x="181" y="97" fill="#2f4a66" filter="url(#rough2)">f(1,3)</text>
    <text x="235" y="97" fill="#2f4a66" filter="url(#rough2)">f(2,4)</text>
    <text x="289" y="97" fill="#2f4a66" filter="url(#rough2)">f(3,5)</text>
    <text x="343" y="97" fill="#2f4a66" filter="url(#rough2)">f(4,6)</text>
    <text x="127" y="145" fill="#33582a" filter="url(#rough2)">f(0,3)</text>
    <text x="181" y="145" fill="#33582a" filter="url(#rough2)">f(1,4)</text>
    <text x="235" y="145" fill="#33582a" filter="url(#rough2)">f(2,5)</text>
    <text x="289" y="145" fill="#33582a" filter="url(#rough2)">f(3,6)</text>
    <text x="127" y="193" fill="#8a6015" filter="url(#rough2)">f(0,4)</text>
    <text x="181" y="193" fill="#8a6015" filter="url(#rough2)">f(1,5)</text>
    <text x="235" y="193" fill="#8a6015" filter="url(#rough2)">f(2,6)</text>
    <text x="127" y="241" fill="#8c3a37" filter="url(#rough2)">f(0,5)</text>
    <text x="181" y="241" fill="#8c3a37" filter="url(#rough2)">f(1,6)</text>
    <text x="127" y="289" fill="#ffffff" filter="url(#rough2)">f(0,6)</text>
  </g>

  <!-- 递推箭头 -->
  <path d="M 127 128 L 127 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 181 128 L 127 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 127 176 L 127 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 181 176 L 127 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104" y="320" font-size="10.8" fill="#8a6015" filter="url(#rough2)">f(i,j) ← 1 − f(i+1,j)（或 1 − f(i,j−1)）</text>
  <text x="104" y="340" font-size="10.8" fill="#8a6015" filter="url(#rough2)">两个来源正好是上一层（两种状态各一条向量）</text>
  <text x="104" y="360" font-size="10.8" fill="#8a6015" filter="url(#rough2)">的位 i 与位 i+1，所以「右移一位再按位与」即可</text>

  <!-- 右侧说明 -->
  <rect x="404" y="76" width="352" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="100" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">两条可利用的结构</text>
  <text x="418" y="124" font-size="11.4" fill="#33582a" filter="url(#rough2)">① 层内独立：同层不同 i 之间没有依赖，</text>
  <text x="418" y="144" font-size="11.4" fill="#33582a" filter="url(#rough2)">　　一次按位运算即可同时算 64 个格子</text>
  <text x="418" y="166" font-size="11.4" fill="#33582a" filter="url(#rough2)">② 层间只隔一层：第 g 层只读第 g−1 层，</text>
  <text x="418" y="182" font-size="11.4" fill="#33582a" filter="url(#rough2)">　　两层数组滚动即可，空间 O(L)</text>

  <rect x="404" y="204" width="352" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="228" font-size="12.4" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">为什么要位并行</text>
  <text x="418" y="252" font-size="11.4" fill="#8c3a37" filter="url(#rough2)">格子总数 Σ(L−g) ≈ L²/2，逐个算在 L = 2·10^5</text>
  <text x="418" y="272" font-size="11.4" fill="#8c3a37" filter="url(#rough2)">时是 2·10^10，必然超时；压成 64 位字后</text>
  <text x="418" y="292" font-size="11.4" fill="#8c3a37" filter="url(#rough2)">只剩 L²/128 ≈ 3·10^8 次字运算，约 0.6 s。</text>

  <rect x="404" y="332" width="352" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="356" font-size="12.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">逐层宽度还在收缩</text>
  <text x="418" y="380" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">第 g 层只有 L−g 个格子 ⟹ 循环上界也随层减小，</text>
  <text x="418" y="396" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">再省掉约一半的字运算。</text>
</svg>
