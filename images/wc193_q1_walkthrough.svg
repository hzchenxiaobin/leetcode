<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：nums = [3, 1, 2, 10, 1]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一步只读上一格结果，不回头重扫 nums 的前缀</text>

  <rect x="75" y="66" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <line x1="135" y1="66" x2="135" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="245" y1="66" x2="245" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="365" y1="66" x2="365" y2="96" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="190" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">nums[i]</text>
  <text x="305" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">res[i−1]</text>
  <text x="455" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">res[i] = res[i−1] + nums[i]</text>

  <rect x="75" y="98" width="470" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="190" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="305" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="455" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">3（边界，等于 nums[0]）</text>

  <rect x="75" y="128" width="470" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="305" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="455" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3 + 1 = 4</text>

  <rect x="75" y="158" width="470" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="190" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="305" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="455" y="176" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 + 2 = 6</text>

  <rect x="75" y="188" width="470" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="105" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="190" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="305" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="455" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6 + 10 = 16</text>

  <rect x="75" y="218" width="470" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="190" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="305" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">16</text>
  <text x="455" y="236" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">16 + 1 = 17</text>

  <rect x="110" y="258" width="400" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">结果 res = [3, 4, 6, 16, 17]，与官方输出一致</text>
  <text x="310" y="293" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4 次递推 + 1 次边界初始化 = n 次操作</text>
</svg>
