<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="350" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：arr = [1, 2, 34, 3, 4, 5, 7, 23, 12]</text>
  <path d="M 110 36 Q 250 42 390 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 三连奇数标注 -->
  <rect x="348" y="58" width="184" height="58" rx="10" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">三个连续奇数</text>

  <!-- 单元格 -->
  <rect x="54" y="64" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="77" font-size="9" fill="#999999" filter="url(#rough2)">0</text>
  <text x="80" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>

  <rect x="114" y="64" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="77" font-size="9" fill="#999999" filter="url(#rough2)">1</text>
  <text x="140" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="174" y="64" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="77" font-size="9" fill="#999999" filter="url(#rough2)">2</text>
  <text x="200" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">34</text>

  <rect x="234" y="64" width="52" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="77" font-size="9" fill="#999999" filter="url(#rough2)">3</text>
  <text x="260" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>

  <rect x="294" y="64" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="77" font-size="9" fill="#999999" filter="url(#rough2)">4</text>
  <text x="320" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="354" y="64" width="52" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="77" font-size="9" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="380" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>

  <rect x="414" y="64" width="52" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="77" font-size="9" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="440" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>

  <rect x="474" y="64" width="52" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="482" y="77" font-size="9" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="500" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">23</text>

  <rect x="534" y="64" width="52" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="542" y="77" font-size="9" fill="#999999" filter="url(#rough2)">8</text>
  <text x="560" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">12</text>

  <!-- 连线到 cnt 气泡 -->
  <path d="M 80 112 L 80 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 140 112 L 140 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 200 112 L 200 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 260 112 L 260 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 320 112 L 320 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 380 112 L 380 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 440 112 L 440 149" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 500 112 L 500 146" stroke="#bbbbbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 560 112 L 560 149" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- cnt 气泡 -->
  <text x="30" y="168" text-anchor="middle" font-size="11" font-style="italic" fill="#3a3a3a" filter="url(#rough2)">cnt</text>

  <circle cx="80" cy="164" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="80" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <circle cx="140" cy="164" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <circle cx="200" cy="164" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <circle cx="260" cy="164" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <circle cx="320" cy="164" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <circle cx="380" cy="164" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="380" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <circle cx="440" cy="164" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">2</text>
  <circle cx="500" cy="164" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="500" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" filter="url(#rough2)">3</text>
  <circle cx="560" cy="164" r="13" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="560" y="168" text-anchor="middle" font-size="11.5" fill="#999999" filter="url(#rough2)">–</text>

  <text x="320" y="198" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt = 以下标 i 结尾的连续奇数个数</text>

  <!-- 底部注释 -->
  <rect x="25" y="214" width="185" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">遇偶清零</text>
  <text x="117" y="264" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">下标 1、2、4 是偶数</text>
  <text x="117" y="284" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt 清零，奇数段被切断</text>
  <text x="117" y="304" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">前后奇数互不相连</text>

  <rect x="228" y="214" width="185" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">奇数累加</text>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">i=5,6,7：5、7、23 全奇</text>
  <text x="320" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt：1 → 2 → 3</text>
  <text x="320" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">第三步即命中</text>

  <rect x="431" y="214" width="185" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="523" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">达 3 即真</text>
  <text x="523" y="264" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">i=7 时 cnt = 3 → true</text>
  <text x="523" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">i=8 的 12 无需再看</text>
  <text x="523" y="304" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">存在性判定可提前退出</text>
</svg>
