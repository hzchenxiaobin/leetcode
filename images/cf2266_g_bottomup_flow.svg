<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 464" width="700" height="464"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="464" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">自底向上 O(n)：一遍后序算出全部 g_u 与 m_u</text>
  <path d="M 34 37 Q 270 43 506 37" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="80" y="46" width="380" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">以 1 为根，用显式栈做迭代 DFS，得到后序 order[]</text>

  <rect x="80" y="112" width="380" height="52" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">倒序扫描 order[]：u = order[i]，孩子此时已算完</text>

  <rect x="80" y="178" width="380" height="52" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">A ← Σ a_c（c 取 u 的直接孩子，用初值 a_c）</text>

  <rect x="80" y="244" width="380" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="12.5" fill="#3c6330" filter="url(#rough2)">g_u ← gcd(b_u, A)；∀ 孩子 c，若 g_c &lt; b_c 再 gcd 上 g_c</text>

  <rect x="80" y="310" width="380" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">m_u ← a_u + ⌊(b_u − 1 − a_u)/g_u⌋·g_u；ans ← ans + m_u</text>

  <rect x="80" y="376" width="380" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="408" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">输出 ans（64 位整数）</text>

  <path d="M 270 98 V 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 164 V 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 230 V 242" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 296 V 308" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 362 V 374" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="474" y="70" font-size="11" fill="#446688" filter="url(#rough2)">链 2·10^5：递归会爆栈</text>
  <text x="474" y="136" font-size="11" fill="#446688" filter="url(#rough2)">后序保证孩子先算完</text>
  <text x="474" y="202" font-size="11" fill="#446688" filter="url(#rough2)">Σ a_c 可达 2·10^14</text>
  <text x="474" y="220" font-size="11" fill="#446688" filter="url(#rough2)">必须 long long</text>
  <text x="474" y="268" font-size="11" fill="#3c6330" filter="url(#rough2)">叶子：A = 0 ⇒ g = b</text>
  <text x="474" y="286" font-size="11" fill="#3c6330" filter="url(#rough2)">不能变的孩子不参与</text>
  <text x="474" y="334" font-size="11" fill="#8a6015" filter="url(#rough2)">取同余类里最大的</text>
  <text x="474" y="352" font-size="11" fill="#8a6015" filter="url(#rough2)">且 &lt; b_u 的值</text>
  <text x="474" y="400" font-size="11" fill="#8c3a37" filter="url(#rough2)">上界 2·10^14 &lt; 2^63</text>

  <text x="350" y="452" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每组独立，O(n) 时间 / O(n) 空间；多测总和 Σn ≤ 2·10^5</text>
</svg>
