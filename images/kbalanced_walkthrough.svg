<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="610" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s = "(()(()))()"，k = 2 的两连消</text>
  <text x="320" y="48" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">蓝格 = '(' 游程 · 绿格 = ')' 游程 · 橙格 = 参与消解的 k-平衡 · 红框 = 暴露的旧 ')' 游程</text>

  <!-- 表头 -->
  <text x="76" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">i</text>
  <text x="123" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">c</text>
  <text x="253" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">栈（右端为栈顶）</text>
  <text x="470" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">动作</text>
  <path d="M50,76 L620,76" stroke="#999" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- i=0 -->
  <text x="76" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="112" y="82" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="82" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <text x="356" y="99" font-size="11.5" fill="#333" filter="url(#rough2)">压入新游程：'(' × 1</text>

  <!-- i=1 -->
  <text x="76" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="112" y="118" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="118" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="118" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <text x="356" y="135" font-size="11.5" fill="#333" filter="url(#rough2)">并入栈顶游程：'(' × 2</text>

  <!-- i=2 -->
  <text x="76" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="112" y="154" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="154" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="154" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="154" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <text x="356" y="171" font-size="11.5" fill="#333" filter="url(#rough2)">新 ')' 游程 1 &lt; k，不动作</text>

  <!-- i=3 -->
  <text x="76" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="112" y="190" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="190" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="190" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="190" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="242" y="190" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <text x="356" y="207" font-size="11.5" fill="#333" filter="url(#rough2)">压入新游程：'(' × 1</text>

  <!-- i=4 -->
  <text x="76" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="112" y="226" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="226" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="226" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="226" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="242" y="226" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="266" y="226" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <text x="356" y="243" font-size="11.5" fill="#333" filter="url(#rough2)">并入栈顶游程：'(' × 2</text>

  <!-- i=5 -->
  <text x="76" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="112" y="262" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="262" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="262" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="262" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="242" y="262" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="266" y="262" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="290" y="262" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="279" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <text x="356" y="279" font-size="11.5" fill="#333" filter="url(#rough2)">新 ')' 游程 1 &lt; k，不动作</text>

  <!-- i=6 第一次消解 -->
  <text x="76" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="112" y="306" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="306" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="306" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="306" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="242" y="306" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="253" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="266" y="306" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="277" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="290" y="306" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="301" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="314" y="306" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="325" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <path d="M242,300 L242,292 L288,292 L288,300" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">'(' 游程 2 ≥ k</text>
  <path d="M290,336 L290,344 L336,344 L336,336" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="358" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">')' 游程 = k</text>
  <text x="356" y="318" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">消解！')' 游程 = 2 = k，下方 '(' 游程 2 ≥ k</text>
  <text x="356" y="336" font-size="11" fill="#333" filter="url(#rough2)">弹出 4 个 → 剩 ( ( ) ，暴露出旧 ')' 游程</text>

  <!-- i=7 连锁消解 -->
  <text x="76" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <rect x="112" y="372" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="372" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="372" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="218" y="372" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="229" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="242" y="372" width="22" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="253" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <path d="M170,366 L170,358 L216,358 L216,366" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">'(' 游程 2 ≥ k</text>
  <path d="M218,400 L218,408 L264,408 L264,400" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="422" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">旧 1 + 新 1 = 2 = k</text>
  <text x="356" y="384" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">连锁消解！新 ')' 并入暴露的游程凑满 k</text>
  <text x="356" y="402" font-size="11" fill="#333" filter="url(#rough2)">下方 '(' 游程 2 ≥ k → 再弹 4 个，栈清空</text>

  <!-- i=8 -->
  <text x="76" y="457" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="112" y="440" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="457" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="440" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="457" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <text x="356" y="457" font-size="11.5" fill="#333" filter="url(#rough2)">压入新游程：'(' × 1</text>

  <!-- i=9 -->
  <text x="76" y="493" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="112" y="476" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="493" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="476" width="22" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="493" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(</text>
  <rect x="194" y="476" width="22" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="493" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">)</text>
  <text x="356" y="493" font-size="11.5" fill="#333" filter="url(#rough2)">')' 游程 1 &lt; k，不动作</text>

  <!-- 总结 -->
  <rect x="50" y="506" width="540" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">扫描结束：栈 = "()"，已不含任何 k-平衡 → 答案 "()"</text>
  <text x="320" y="550" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">关键在第 6 → 7 步：第一次消解弹空 '(' 游程，暴露出旧 ')' 游程</text>
  <text x="320" y="572" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">第 7 步的新 ')' 并入它凑满 k，连锁再消 —— 逐字符判定天然覆盖，无需 while 循环</text>
</svg>
