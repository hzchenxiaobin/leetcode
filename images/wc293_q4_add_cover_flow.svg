<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">add(left, right) 的递归流程（标记永久化）</text>
  <text x="260" y="46" text-anchor="middle" font-size="11"
        fill="#888" filter="url(#rough2)">update(o, lo, hi)：把 [left, right] 并入节点 o 管辖的 [lo, hi]</text>

  <rect x="352" y="54" width="152" height="38" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="70" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">count()</text>
  <text x="428" y="86" text-anchor="middle" font-size="11"
        fill="#4a7a3a" filter="url(#rough2)">return 根.covered —— O(1) ★</text>

  <rect x="100" y="58" width="140" height="30" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12.5"
        fill="#446688" filter="url(#rough2)">update(o, lo, hi)</text>

  <path d="M 170 88 L 170 104" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="170,106 244,132 170,158 96,132" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">与 [lo, hi]</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">不相交？</text>

  <path d="M 244 132 L 292 132" stroke="#999" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="124" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">是</text>
  <rect x="294" y="118" width="136" height="28" rx="6" fill="#f0f0f0"
        stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="137" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">return（子树不动）</text>

  <path d="M 170 158 L 170 174" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="182" y="170" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <polygon points="170,176 240,200 170,224 100,200" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="196" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">o.full 已整段</text>
  <text x="170" y="210" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">覆盖？</text>

  <path d="M 240 200 L 290 200" stroke="#d6a040" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="192" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="292" y="186" width="138" height="28" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="361" y="205" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">剪枝 return ★（并集不变）</text>

  <path d="M 170 224 L 170 238" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="182" y="234" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <polygon points="170,240 248,264 170,288 92,264" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="260" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">[lo, hi] ⊆</text>
  <text x="170" y="274" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">[left, right] ?</text>

  <path d="M 248 264 L 294 264" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="256" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="296" y="242" width="148" height="46" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">full = true（永久标记）</text>
  <text x="370" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">covered = hi − lo + 1</text>
  <text x="370" y="291" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">return</text>

  <path d="M 170 288 L 170 300" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="182" y="297" font-size="10" fill="#446688" filter="url(#rough2)">否（部分相交）</text>

  <rect x="58" y="302" width="230" height="50" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="173" y="321" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">mid = (lo + hi) / 2，递归左右儿子</text>
  <text x="173" y="338" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（儿子不存在则按需 new）</text>
  <text x="173" y="354" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#446688" filter="url(#rough2)">pushup：covered = l.covered + r.covered</text>

  <path d="M 316 54 Q 200 40 130 54" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三个「是」分支全部直接 return——标记一次到位，永不回退，故无需 pushdown</text>
</svg>
