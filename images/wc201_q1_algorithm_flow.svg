<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟扫描，坏对即弹</text>

  <g filter="url(#rough2)">
    <rect x="250" y="44" width="140" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">开始</text>

    <path d="M 320 78 C 320 86 320 92 320 98" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="195" y="102" width="250" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="127" text-anchor="middle" font-size="12.5" fill="#2b4a66">取出下一个字符 c（从左到右）</text>

    <path d="M 320 142 C 320 150 320 156 320 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="320,166 452,210 320,254 188,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="204" text-anchor="middle" font-size="12" fill="#b07818">栈非空 且</text>
    <text x="320" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">|栈顶 − c| = 32 ？</text>

    <path d="M 452 210 L 486 210" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="466" y="202" text-anchor="middle" font-size="11" fill="#555">是</text>

    <rect x="488" y="188" width="140" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="558" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">弹出栈顶</text>
    <text x="558" y="223" text-anchor="middle" font-size="11.5" fill="#8a3a36">c 丢弃（对消失）</text>

    <path d="M 558 188 C 558 120 470 122 448 122" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="516" y="150" font-size="10" fill="#888">循环</text>

    <path d="M 320 254 C 320 264 320 272 320 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="330" y="272" font-size="11" fill="#555">否</text>

    <rect x="195" y="284" width="250" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="320" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">c 入栈</text>

    <path d="M 195 304 C 120 304 120 122 193 122" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
    <text x="96" y="216" text-anchor="middle" font-size="10" fill="#888">下一个</text>

    <path d="M 320 324 C 320 334 320 342 320 350" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="334" y="342" font-size="11" fill="#555">串结束</text>

    <rect x="195" y="354" width="250" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="320" y="379" text-anchor="middle" font-size="12.5" fill="#2b4a66">返回栈内字符（自底向上拼接）</text>

    <rect x="478" y="354" width="152" height="76" rx="8" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="554" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818">不变式</text>
    <text x="554" y="396" text-anchor="middle" font-size="10.5" fill="#b07818">栈内任何时刻</text>
    <text x="554" y="412" text-anchor="middle" font-size="10.5" fill="#b07818">都没有相邻坏对</text>

    <text x="320" y="444" text-anchor="middle" font-size="11.5" fill="#666">每个字符至多一进一出 → 总操作 ≤ 2n，时间 O(n)</text>
  </g>
</svg>
