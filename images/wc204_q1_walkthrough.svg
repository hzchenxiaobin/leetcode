<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：示例 3（失配清零）与示例 5（重叠陷阱）</text>

  <!-- ===== Panel A: example 3 ===== -->
  <text x="36" y="48" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 3：arr = [1,2,1,2,1,3]，m = 2，k = 3 → target = m×(k−1) = 4</text>

  <rect x="110" y="60" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="60" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="60" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="60" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="294" y="60" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="60" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="133" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="179" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="225" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="271" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="317" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
  <text x="363" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="133" y="104" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="179" y="104" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="225" y="104" text-anchor="middle" font-size="9" fill="#999">i=2</text>
  <text x="271" y="104" text-anchor="middle" font-size="9" fill="#999">i=3</text>
  <text x="317" y="104" text-anchor="middle" font-size="9" fill="#999">i=4</text>
  <text x="363" y="104" text-anchor="middle" font-size="9" fill="#999">i=5</text>

  <!-- match arcs -->
  <path d="M 133 94 Q 179 114 225 94" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="179" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 179 94 Q 225 126 271 94" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 225 94 Q 271 114 317 94" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="271" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 271 94 Q 317 126 363 94" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="317" y="114" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">✗</text>
  <text x="368" y="108" font-size="9.5" fill="#b85450">arr[3]=2 ≠ arr[5]=3</text>

  <!-- walkthrough table -->
  <rect x="110" y="132" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="132" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="132" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="132" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="132" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">i</text>
  <text x="180" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">arr[i]</text>
  <text x="240" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">arr[i+m]</text>
  <text x="293" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">匹配</text>
  <text x="351" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">count</text>

  <rect x="110" y="154" width="40" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="154" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="154" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="154" width="46" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="154" width="70" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="169" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="180" y="169" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="240" y="169" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="293" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8e4a">✓</text>
  <text x="351" y="169" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="110" y="176" width="40" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="176" width="60" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="176" width="60" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="176" width="46" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="176" width="70" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="191" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="240" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="293" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8e4a">✓</text>
  <text x="351" y="191" text-anchor="middle" font-size="11" fill="#333">2</text>

  <rect x="110" y="198" width="40" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="198" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="198" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="198" width="46" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="198" width="70" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="213" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="180" y="213" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="240" y="213" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="293" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8e4a">✓</text>
  <text x="351" y="213" text-anchor="middle" font-size="11" fill="#333">3</text>

  <rect x="110" y="220" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="220" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="220" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="220" width="46" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="220" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">3</text>
  <text x="180" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">2</text>
  <text x="240" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">3</text>
  <text x="293" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="351" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">0（清零）</text>

  <text x="110" y="262" font-size="10.5" fill="#888">i = 4 时 i+m = 6 越界，循环结束；count 峰值 3 &lt; target 4</text>
  <rect x="110" y="272" width="276" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="248" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 返回 false：(1,2) 只连续重复了 2 次</text>

  <!-- ===== Panel B: example 5 ===== -->
  <text x="36" y="326" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">示例 5：arr = [2,2,2,2]，m = 2，k = 3 → target = 4（重叠的重复不算）</text>

  <rect x="110" y="338" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="338" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="338" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="338" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="179" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="225" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="271" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
  <text x="133" y="382" text-anchor="middle" font-size="9" fill="#999">i=0</text>
  <text x="179" y="382" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="225" y="382" text-anchor="middle" font-size="9" fill="#999">i=2</text>
  <text x="271" y="382" text-anchor="middle" font-size="9" fill="#999">i=3</text>

  <path d="M 110 394 L 110 388 L 202 388 L 202 394" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 202 394 L 202 388 L 294 388 L 294 394" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="156" y="404" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688">块 0</text>
  <text x="248" y="404" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a">块 1</text>

  <path d="M 133 398 Q 179 416 225 398" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="179" y="411" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>
  <path d="M 179 398 Q 225 428 271 398" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="417" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a8e4a">✓</text>

  <rect x="110" y="432" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="432" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="432" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="432" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="316" y="432" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">i</text>
  <text x="180" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">arr[i]</text>
  <text x="240" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">arr[i+m]</text>
  <text x="293" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">匹配</text>
  <text x="351" y="447" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">count</text>

  <rect x="110" y="454" width="40" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="454" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="454" width="60" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="454" width="46" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="454" width="70" height="22" fill="#f6f9fc" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="469" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="180" y="469" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="240" y="469" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="293" y="469" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8e4a">✓</text>
  <text x="351" y="469" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="110" y="476" width="40" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="476" width="60" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="476" width="60" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="270" y="476" width="46" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="316" y="476" width="70" height="22" fill="#ffffff" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="491" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="491" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="240" y="491" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="293" y="491" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8e4a">✓</text>
  <text x="351" y="491" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="110" y="516" font-size="10.5" fill="#888">i = 2 时 i+m = 4 越界，循环结束；count 峰值 2 = m×(2−1)：恰好 2 个全等块</text>
  <rect x="110" y="526" width="276" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="248" y="544" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 返回 false：不重叠最多重复 2 次 &lt; k = 3</text>
</svg>
