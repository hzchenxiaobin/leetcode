<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="160" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">原树</text>
  <g filter="url(#rough2)">
    <path d="M 160 74 L 110 118" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 160 74 L 215 118" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 110 138 L 72 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 110 138 L 148 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 215 138 L 260 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <ellipse cx="160" cy="60" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="160" y="66" text-anchor="middle" font-size="13" fill="#333">5</text>
    <ellipse cx="110" cy="128" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="134" text-anchor="middle" font-size="13" fill="#333">4</text>
    <ellipse cx="215" cy="128" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="215" y="134" text-anchor="middle" font-size="13" fill="#333">9</text>
    <ellipse cx="72" cy="200" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="72" y="206" text-anchor="middle" font-size="13" fill="#333">1</text>
    <ellipse cx="148" cy="200" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="148" y="206" text-anchor="middle" font-size="13" fill="#333">10</text>
    <ellipse cx="260" cy="200" rx="21" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="206" text-anchor="middle" font-size="13" fill="#333">7</text>
  </g>

  <path d="M 320 140 L 380 140" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="128" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">逐层替换</text>

  <text x="480" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">结果树</text>
  <g filter="url(#rough2)">
    <path d="M 460 74 L 415 118" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 460 74 L 505 118" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 415 138 L 385 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 415 138 L 448 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M 505 138 L 538 180" stroke="#888" stroke-width="1.5" fill="none"/>
    <ellipse cx="460" cy="60" rx="21" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="460" y="66" text-anchor="middle" font-size="13" fill="#b85450">0</text>
    <ellipse cx="415" cy="128" rx="21" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="415" y="134" text-anchor="middle" font-size="13" fill="#b85450">0</text>
    <ellipse cx="505" cy="128" rx="21" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="505" y="134" text-anchor="middle" font-size="13" fill="#b85450">0</text>
    <ellipse cx="385" cy="200" rx="21" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="385" y="206" text-anchor="middle" font-size="13" fill="#333">7</text>
    <ellipse cx="448" cy="200" rx="21" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="448" y="206" text-anchor="middle" font-size="13" fill="#333">7</text>
    <ellipse cx="538" cy="200" rx="21" ry="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="538" y="206" text-anchor="middle" font-size="13" fill="#333">11</text>
  </g>

  <!-- 底部两个演算步骤 -->
  <rect x="40" y="248" width="240" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">处理深度 0：nextSum = 4+9 = 13</text>
  <text x="160" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">childSum = 13 → 两孩子都改成 0</text>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（深度 1 无堂兄弟：层和=兄弟和）</text>

  <rect x="300" y="248" width="240" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">处理深度 1：nextSum = 1+10+7 = 18</text>
  <text x="420" y="292" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4 的 childSum = 11 → 1、10 改成 7</text>
  <text x="420" y="312" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">9 的 childSum = 7 → 7 改成 18−7 = 11</text>
</svg>
