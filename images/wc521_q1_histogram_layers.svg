<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：第 r 轮输出所有 cnt[v] ≥ r 的值（升序）</text>

  <!-- cnt 标注 -->
  <text x="180" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[1]=2</text>
  <text x="290" y="281" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[2]=1</text>
  <text x="400" y="198" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[3]=3</text>

  <!-- 层分隔虚线 -->
  <path d="M120,246 L450,246" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>
  <path d="M120,288 L450,288" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>

  <!-- 直方图柱（颜色 = 轮次/层） -->
  <rect x="150" y="288" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="246" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="288" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="288" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="246" width="60" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="204" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 单元格数值 -->
  <text x="180" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="273" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="290" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="400" y="273" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="400" y="231" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 基线与值标签 -->
  <path d="M120,330 L450,330" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 1</text>
  <text x="290" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 2</text>
  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 3</text>

  <!-- 层（轮次）标签 -->
  <text x="458" y="313" font-size="13" fill="#446688" filter="url(#rough2)">← 第 1 轮</text>
  <text x="458" y="271" font-size="13" fill="#4a7a3a" filter="url(#rough2)">← 第 2 轮</text>
  <text x="458" y="229" font-size="13" fill="#d6a040" filter="url(#rough2)">← 第 3 轮</text>

  <!-- 读出顺序徽标 1-6 -->
  <circle cx="162" cy="300" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="162" y="304" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">1</text>
  <circle cx="272" cy="300" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="272" y="304" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">2</text>
  <circle cx="382" cy="300" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="382" y="304" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">3</text>
  <circle cx="162" cy="258" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="162" y="262" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">4</text>
  <circle cx="382" cy="258" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="382" y="262" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">5</text>
  <circle cx="382" cy="216" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="382" y="220" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">6</text>

  <!-- 逐层读出说明与结果条 -->
  <text x="130" y="382" font-size="13" fill="#333" filter="url(#rough2)">按 ①→⑥ 逐层读出（轮次为主序、值升序为次序）：</text>

  <rect x="130" y="394" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="394" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="242" y="394" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="298" y="394" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="354" y="394" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="410" y="394" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="420" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="280" y="458" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = [1, 2, 3, 1, 3, 3]</text>
</svg>
