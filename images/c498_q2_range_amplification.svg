<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Q1 → Q2：题意不变，n 放大到 10⁵</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="220" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <rect x="300" y="52" width="220" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="150" y="78" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Q1：n ≤ 100</text>
  <text x="150" y="102" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">暴力 O(n²) ≈ 10⁴ 次运算</text>
  <text x="150" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 能过</text>
  <text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个 i 重复扫描区间</text>

  <text x="410" y="78" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">Q2：n ≤ 10⁵</text>
  <text x="410" y="102" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">暴力 O(n²) ≈ 10¹⁰ 次运算</text>
  <text x="410" y="126" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 超时（约百倍差距）</text>
  <text x="410" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1 秒大约只能做 10⁸~10⁹ 次</text>

  <path d="M 262 111 C 276 104, 288 104, 298 111" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">必须提速</text>

  <g filter="url(#rough2)">
    <rect x="70" y="196" width="200" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <rect x="290" y="196" width="200" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="170" y="222" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一遍：从右往左</text>
  <text x="170" y="246" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">递推 sufMin[i] =</text>
  <text x="170" y="266" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">min(nums[i], sufMin[i+1])</text>
  <text x="170" y="286" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">O(n) 预处理</text>

  <text x="390" y="222" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">第二遍：从左往右</text>
  <text x="390" y="246" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">变量维护 preMax，</text>
  <text x="390" y="266" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">检查 preMax − sufMin[i] ≤ k</text>
  <text x="390" y="286" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">命中即返回 i</text>

  <path d="M 272 244 C 284 238, 284 238, 288 244" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两遍线性扫描：时间 O(n)，空间 O(n)，10⁵ 轻松通过</text>
</svg>
