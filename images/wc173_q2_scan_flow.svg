<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 + 一次排序</text>
  <text x="300" y="48" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">过滤 O(n)，排序 O(k log k)，k 为保留的餐厅数</text>

  <rect x="120" y="60" width="360" height="34" rx="16" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="82" text-anchor="middle" font-size="10" fill="#2f4560" filter="url(#rough2)">遍历每一行 r = [id, rating, vegan, price, distance]</text>

  <path d="M 300 94 L 300 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,112 430,140 300,168 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="144" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">veganFriendly=1 且 vegan=0 ?</text>

  <path d="M 430 140 L 450 140" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="132" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">是</text>
  <rect x="452" y="124" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="512" y="144" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">跳过该行</text>

  <path d="M 300 168 L 300 188" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,192 430,220 300,248 170,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="224" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">price &gt; maxPrice ?</text>

  <path d="M 430 220 L 450 220" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="212" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">是</text>
  <rect x="452" y="204" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="512" y="224" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">跳过该行</text>

  <path d="M 300 248 L 300 268" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,272 430,300 300,328 170,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">distance &gt; maxDistance ?</text>

  <path d="M 430 300 L 450 300" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="292" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">是</text>
  <rect x="452" y="284" width="120" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="512" y="304" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">跳过该行</text>

  <path d="M 300 328 L 300 348" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="343" font-size="8.5" fill="#999" filter="url(#rough2)">否</text>

  <rect x="170" y="352" width="260" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="375" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">kept.push((rating, id))</text>

  <path d="M 300 388 L 300 402" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="406" width="260" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="429" text-anchor="middle" font-size="10.5" fill="#2f4560" filter="url(#rough2)">按 (rating, id) 降序排序</text>

  <path d="M 300 442 L 300 456" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="460" width="260" height="36" rx="16" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="483" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">输出全部 id</text>

  <path d="M 170 370 L 100 370 L 100 140 L 166 140" stroke="#aaa" stroke-width="1.2" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="258" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">处理下一行</text>

  <text x="300" y="524" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每行只做几次常数比较；k 个元素排序一次，总时间 O(n + k log k)</text>
</svg>
