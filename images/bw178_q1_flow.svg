<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两遍扫描，O(n)</text>
  <text x="260.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一遍数频次，第二遍按原顺序找答案</text>
  <rect x="90" y="62" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="220" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第一遍：统计 freq[v]</text>
  <text x="220" y="97" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">遍历 nums，v 出现一次就 +1</text>
  <path d="M 220 104 L 220 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="128" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第二遍：i 从 0 到 n−1</text>
  <text x="220" y="163" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">按原下标顺序检查 nums[i]</text>
  <path d="M 220 170 L 220 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="220,190.0 345.0,222 220,254.0 95.0,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="216" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">nums[i] 是偶数</text>
  <text x="220" y="233" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">且 freq[nums[i]] == 1 ？</text>
  <path d="M 345 222 L 378 222" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="213" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="382" y="202" width="122" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="443" y="226" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">i++ 继续</text>
  <path d="M 220 254 L 220 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="233" y="270" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="100" y="282" width="240" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="220" y="302" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 nums[i]</text>
  <text x="220" y="320" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">这是最靠前的唯一偶数</text>
  <text x="220" y="360" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">循环走完都没有命中 → 返回 -1</text>
  <rect x="90" y="376" width="260" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="102" y="396" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">时间 O(n)，空间 O(V)</text>
</svg>
