<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：一次取反 = 三元组 (i, t, s) 的余数配对</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">记 c_p = P_p mod k（前缀余数），w_t = 2·nums[t] mod k；i、t、s 为前缀下标（子数组 nums[i..s−1]）</text>

  <path d="M 98 112 L 98 92 L 432 92 L 432 112" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="84" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">子数组 nums[i..s−1]（在 t 处取反），长度 = s − i</text>

  <path d="M 56 140 L 530 140" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="146" text-anchor="middle" font-size="12" fill="#999">· · ·</text>
  <text x="330" y="146" text-anchor="middle" font-size="12" fill="#999">· · ·</text>

  <rect x="70" y="122" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="146" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold">i</text>

  <rect x="232" y="122" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="15" fill="#8a6d1a" font-weight="bold">t</text>

  <rect x="404" y="122" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="432" y="146" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">s</text>

  <text x="98" y="178" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i = first[a]</text>
  <text x="98" y="192" text-anchor="middle" font-size="9.5" fill="#666">余数 a 的最早出现</text>

  <text x="260" y="178" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">t = next_δ(i)</text>
  <text x="260" y="192" text-anchor="middle" font-size="9.5" fill="#666">occ_δ 中 ≥ i 的后继</text>

  <text x="432" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">s = last[b]</text>
  <text x="432" y="192" text-anchor="middle" font-size="9.5" fill="#666">余数 b 的最晚出现</text>

  <rect x="60" y="212" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">在 t 处取反后有效 ⟺ c_i + w_t ≡ c_s (mod k)</text>
  <text x="280" y="251" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">即 a + δ ≡ b (mod k) —— 右端余数 b 由 (a, δ) 唯一确定</text>

  <rect x="42" y="278" width="150" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="117" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 左端点取最早</text>
  <text x="117" y="318" text-anchor="middle" font-size="9.5" fill="#555">固定 (a, δ)：i 越大，可用</text>
  <text x="117" y="332" text-anchor="middle" font-size="9.5" fill="#555">的 s 越小、长度越短</text>
  <text x="117" y="348" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">→ 只用 first[a]</text>

  <rect x="205" y="278" width="150" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">② 取反点取后继</text>
  <text x="280" y="318" text-anchor="middle" font-size="9.5" fill="#555">t 越早（且 ≥ i），s 的</text>
  <text x="280" y="332" text-anchor="middle" font-size="9.5" fill="#555">可选范围越大</text>
  <text x="280" y="348" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">→ occ_δ 中二分</text>

  <rect x="368" y="278" width="150" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="443" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 右端点取最晚</text>
  <text x="443" y="318" text-anchor="middle" font-size="9.5" fill="#555">b 类最晚出现就是 last[b]</text>
  <text x="443" y="332" text-anchor="middle" font-size="9.5" fill="#555">无需再向后找</text>
  <text x="443" y="348" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ 有效 ⟺ last[b] > t*</text>

  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999">枚举 (a, δ) 共 k² 对（k ≤ 3000 → 9×10⁶ 对），每对一次二分 + 一次查表 → O(n + k² log n)</text>
</svg>
