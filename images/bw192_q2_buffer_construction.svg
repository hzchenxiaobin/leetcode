<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">充分性构造：缓冲位逐位固化（同和 ⟹ 可达）</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">source = [5, 5, 5, 5] → target = [1, 2, 3, 14]，总和都是 20；取末位为缓冲位</text>

  <g font-size="9.5" fill="#999" text-anchor="middle">
    <text x="130" y="58">0</text><text x="186" y="58">1</text><text x="242" y="58">2</text>
    <text x="298" y="58" fill="#d6a040">3 · 缓冲位</text>
  </g>

  <text x="96" y="83" text-anchor="end" font-size="10.5" fill="#888">target</text>
  <g filter="url(#rough2)">
    <rect x="104" y="64" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="160" y="64" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="216" y="64" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="272" y="64" width="52" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
  </g>
  <g font-size="12" fill="#777" text-anchor="middle">
    <text x="130" y="84">1</text><text x="186" y="84">2</text><text x="242" y="84">3</text><text x="298" y="84">14</text>
  </g>

  <text x="96" y="145" text-anchor="end" font-size="11" fill="#666">初始</text>
  <g filter="url(#rough2)">
    <rect x="104" y="124" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="160" y="124" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="216" y="124" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="272" y="124" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="130" y="146">5</text><text x="186" y="146">5</text><text x="242" y="146">5</text>
    <text x="298" y="146" fill="#a07820" font-weight="bold">5</text>
  </g>
  <text x="336" y="145" font-size="10.5" fill="#888">末位作缓冲位，吸收一切差额</text>

  <path d="M 190 160 V 186" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="96" y="215" text-anchor="end" font-size="11" fill="#666">j=0，δ=1</text>
  <g filter="url(#rough2)">
    <rect x="104" y="194" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="160" y="194" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="216" y="194" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="272" y="194" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="130" y="216" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="186" y="216" fill="#333">5</text><text x="242" y="216" fill="#333">5</text>
    <text x="298" y="216" fill="#a07820" font-weight="bold">9</text>
  </g>
  <text x="336" y="215" font-size="10.5" fill="#555">source[0]:=1；source[3] ← 5+5−1 = 9</text>

  <path d="M 190 230 V 256" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="96" y="285" text-anchor="end" font-size="11" fill="#666">j=1，δ=2</text>
  <g filter="url(#rough2)">
    <rect x="104" y="264" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="160" y="264" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="216" y="264" width="52" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="272" y="264" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="130" y="286" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="186" y="286" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="242" y="286" fill="#333">5</text>
    <text x="298" y="286" fill="#a07820" font-weight="bold">12</text>
  </g>
  <text x="336" y="285" font-size="10.5" fill="#555">source[1]:=2；source[3] ← 9+5−2 = 12</text>

  <path d="M 190 300 V 326" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="96" y="355" text-anchor="end" font-size="11" fill="#666">j=2，δ=3</text>
  <g filter="url(#rough2)">
    <rect x="104" y="334" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="160" y="334" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="216" y="334" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="272" y="334" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="130" y="356" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="186" y="356" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="242" y="356" fill="#4a7a3a" font-weight="bold">3</text>
    <text x="298" y="356" fill="#4a7a3a" font-weight="bold">14 ✓</text>
  </g>
  <text x="336" y="355" font-size="10.5" fill="#555">source[2]:=3；source[3] ← 12+5−3 = 14</text>

  <rect x="48" y="388" width="464" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Σsource = Σtarget ⇒ 缓冲位自动落位</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#555">source[n−1] = Σsource − Σtarget[0..n−2] = target[n−1]，无需单独处理</text>

  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#999">每步只碰 j 位与缓冲位，已固化的位永不再动；n ≥ 2 保证 i ≠ j</text>
</svg>
