<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次预处理 + 每个元素两次比较</text>

  <rect x="130" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v = 1 .. 16383：若是二进制回文</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">加入 pals（天然升序）</text>

  <path d="M260,90 L260,114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrJ)" filter="url(#rough2)"/>

  <rect x="130" y="118" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个 x：i = lower_bound(pals, x)</text>

  <path d="M260,160 L260,184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrJ)" filter="url(#rough2)"/>

  <rect x="64" y="188" width="180" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="154" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; |pals|：</text>
  <text x="154" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = pals[i] − x</text>

  <rect x="276" y="188" width="180" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="366" y="208" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &gt; 0：</text>
  <text x="366" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = min(best, x − pals[i−1])</text>

  <path d="M260,236 L260,258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrJ)" filter="url(#rough2)"/>

  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans.append(best)</text>

  <text x="424" y="140" font-size="10" fill="#999" filter="url(#rough2)">O(n log 254)</text>
  <text x="30" y="70" font-size="10" fill="#999" filter="url(#rough2)">只做一次</text>
</svg>
