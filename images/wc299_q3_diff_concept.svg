<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：交换一段 = 在 diff 上选一段求和</text>
  <path d="M 150 34 Q 330 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组两行 -->
  <text x="100" y="60" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="148" y="60" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="196" y="60" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="244" y="60" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="292" y="60" text-anchor="middle" font-size="10" fill="#888">4</text>

  <text x="52" y="86" font-size="13" font-family="monospace" fill="#333">nums1</text>
  <g filter="url(#sk)"><rect x="78" y="68" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="100" y="88" text-anchor="middle" font-size="13" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="126" y="68" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="148" y="88" text-anchor="middle" font-size="13" fill="#333">40</text>
  <g filter="url(#sk)"><rect x="174" y="68" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="196" y="88" text-anchor="middle" font-size="13" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="222" y="68" width="44" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="244" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">70</text>
  <g filter="url(#sk)"><rect x="270" y="68" width="44" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="292" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">30</text>

  <text x="52" y="162" font-size="13" font-family="monospace" fill="#333">nums2</text>
  <g filter="url(#sk)"><rect x="78" y="144" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="100" y="164" text-anchor="middle" font-size="13" fill="#333">50</text>
  <g filter="url(#sk)"><rect x="126" y="144" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="148" y="164" text-anchor="middle" font-size="13" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="174" y="144" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="196" y="164" text-anchor="middle" font-size="13" fill="#333">50</text>
  <g filter="url(#sk)"><rect x="222" y="144" width="44" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="244" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">40</text>
  <g filter="url(#sk)"><rect x="270" y="144" width="44" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="292" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">20</text>

  <path d="M 232 102 Q 212 120 230 138" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 304 138 Q 324 120 306 102" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="268" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">交换 [3,4]</text>

  <!-- 右侧公式 -->
  <text x="400" y="78" font-size="12" fill="#555">交换 [left,right] 后：</text>
  <g filter="url(#sk)"><rect x="400" y="88" width="232" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="516" y="108" text-anchor="middle" font-size="13" font-family="monospace" fill="#2b6e9e" font-weight="bold">sum1′ = sum1 + S</text>
  <g filter="url(#sk)"><rect x="400" y="126" width="232" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="516" y="146" text-anchor="middle" font-size="13" font-family="monospace" fill="#2e5e2e" font-weight="bold">sum2′ = sum2 − S</text>
  <text x="516" y="174" text-anchor="middle" font-size="11" fill="#555">S：同一区间上 diff 的和；不交换 ⇔ S = 0（空段）</text>

  <!-- diff 行 -->
  <text x="100" y="227" font-size="11.5" fill="#888">diff = nums2 − nums1（逐位差）</text>
  <text x="58" y="254" font-size="13" font-family="monospace" fill="#333">diff</text>
  <g filter="url(#sk)"><rect x="78" y="236" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="100" y="256" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#333">+30</text>
  <g filter="url(#sk)"><rect x="126" y="236" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="148" y="256" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#333">−20</text>
  <g filter="url(#sk)"><rect x="174" y="236" width="44" height="30" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="196" y="256" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#333">+30</text>
  <g filter="url(#sk)"><rect x="222" y="236" width="44" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="244" y="256" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04a48" font-weight="bold">−30</text>
  <g filter="url(#sk)"><rect x="270" y="236" width="44" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="292" y="256" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04a48" font-weight="bold">−10</text>

  <path d="M 222 270 L 222 278 L 314 278 L 314 270" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="268" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48" font-family="monospace">S = −30 + (−10) = −40</text>
  <path d="M 356 262 Q 384 250 400 238" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="404" y="232" font-size="11" fill="#a04a48">S 只依赖这段的 diff</text>

  <!-- 两个候选 -->
  <g filter="url(#sk)"><rect x="40" y="316" width="280" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="180" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">候选 A：让 nums1 当「分数载体」</text>
  <text x="180" y="358" text-anchor="middle" font-size="11.5" fill="#555">帮 nums1 抢 diff 和最大的一段</text>
  <text x="180" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" font-family="monospace">ans_A = sum1 + maxS</text>
  <text x="180" y="402" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">maxS = max(0, 最大子数组和)</text>

  <g filter="url(#sk)"><rect x="340" y="316" width="280" height="104" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="480" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">候选 B：让 nums2 当「分数载体」</text>
  <text x="480" y="358" text-anchor="middle" font-size="11.5" fill="#555">帮 nums2 抢 diff 和最小的一段</text>
  <text x="480" y="382" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">ans_B = sum2 − minS</text>
  <text x="480" y="402" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">minS = min(0, 最小子数组和)</text>

  <g filter="url(#sk)"><rect x="40" y="432" width="580" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="330" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">ans = max(ans_A, ans_B) —— 外层 max 可拆，两个 Kadane 各自独立</text>
</svg>
