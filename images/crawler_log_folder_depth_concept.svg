<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="350" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：只需维护一个深度计数器</text>
  <path d="M 185 42 Q 320 50 455 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="55" y="75" width="190" height="160" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <rect x="75" y="103" width="150" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="95" y="131" width="110" height="76" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="66" y="93" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">主文件夹（depth 0）</text>
  <text x="86" y="121" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">d1（depth 1）</text>
  <text x="106" y="149" font-size="11" fill="#9a7524" font-weight="bold" filter="url(#sk)">d2（depth 2）</text>
  <text x="150" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">depth = 当前文件夹距主文件夹的层数</text>

  <g filter="url(#sk)">
    <rect x="265" y="66" width="80" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="305" y="95" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" font-family="monospace" filter="url(#sk)">"../"</text>
  <path d="M 350 89 L 372 89" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="378" y="66" width="237" height="46" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="496" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#sk)">depth = max(0, depth − 1)</text>
  <text x="496" y="103" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">已在主文件夹则停在原地</text>

  <g filter="url(#sk)">
    <rect x="265" y="126" width="80" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="305" y="155" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-family="monospace" filter="url(#sk)">"./"</text>
  <path d="M 350 149 L 372 149" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="378" y="126" width="237" height="46" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="496" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#sk)">depth 不变</text>
  <text x="496" y="163" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">原地等待，直接跳过</text>

  <g filter="url(#sk)">
    <rect x="265" y="186" width="80" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="305" y="215" text-anchor="middle" font-size="14" fill="#b57a20" font-weight="bold" font-family="monospace" filter="url(#sk)">"x/"</text>
  <path d="M 350 209 L 372 209" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="378" y="186" width="237" height="46" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="496" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#sk)">depth = depth + 1</text>
  <text x="496" y="223" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">题目保证子文件夹 x 存在</text>

  <g filter="url(#sk)">
    <rect x="55" y="272" width="560" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="335" y="296" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#sk)">答案 = 执行完所有日志后的 depth</text>
  <text x="335" y="316" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">每条日志至多让深度减 1，所以最少步数恰好等于 depth</text>
</svg>
