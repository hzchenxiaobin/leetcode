<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">模拟流程：偶数除以 2、奇数减 1，直到变成 0</text>

  <!-- 左：流程图 -->
  <rect x="90" y="50" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 num</text>
  <path d="M 140 82 L 140 103" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="140,105 197,137 140,169 83,137" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num &gt; 0 ?</text>

  <path d="M 197 137 L 235 137" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="128" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="238" y="122" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="286" y="142" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 steps</text>

  <path d="M 140 169 L 140 183" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="153" y="182" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <polygon points="140,186 197,218 140,250 83,218" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="223" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">num 是偶数 ?</text>

  <path d="M 83 218 L 55 218 L 55 262" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="64" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">偶</text>
  <rect x="8" y="264" width="94" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="55" y="285" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">num ← num÷2</text>

  <path d="M 197 218 L 225 218 L 225 262" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="210" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">奇</text>
  <rect x="178" y="264" width="94" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="225" y="285" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">num ← num−1</text>

  <path d="M 55 296 L 55 316 M 225 296 L 225 316 L 225 322" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 55 316 L 139 322" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 316 L 141 322" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="324" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="344" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">steps += 1</text>
  <path d="M 90 339 C 18 339, 18 137, 79 137" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="250" font-size="11" fill="#446688" filter="url(#rough2)">循环</text>

  <!-- 右：num = 14 走查 -->
  <text x="430" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 14 的执行轨迹</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="395" y="74" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="92">14</text>
    <rect x="395" y="112" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="130">7</text>
    <rect x="395" y="150" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="168">6</text>
    <rect x="395" y="188" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="206">3</text>
    <rect x="395" y="226" width="70" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="244">2</text>
    <rect x="395" y="264" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="282">1</text>
    <rect x="395" y="302" width="70" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="430" y="320" font-weight="bold">0</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#7a5c1e">
    <path d="M 430 100 L 430 108" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)"/>
    <text x="474" y="110">偶 ÷2</text>
    <path d="M 430 138 L 430 146" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="474" y="148">奇 −1</text>
    <path d="M 430 176 L 430 184" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)"/>
    <text x="474" y="186">偶 ÷2</text>
    <path d="M 430 214 L 430 222" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="474" y="224">奇 −1</text>
    <path d="M 430 252 L 430 260" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)"/>
    <text x="474" y="262">偶 ÷2</text>
    <path d="M 430 290 L 430 298" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="474" y="300">奇 −1</text>
  </g>
  <rect x="360" y="342" width="186" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="453" y="362" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">6 次操作后归零 → 返回 6</text>
</svg>
