<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：D = 2L − S，奇偶性只由总和 S 决定，与切分点无关</text>
  <path d="M 240 46 Q 470 54 700 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 数组格子 ===== -->
  <g filter="url(#sk)">
    <rect x="308" y="76" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="76" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="440" y="76" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="506" y="76" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="572" y="76" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="338" y="103">10</text>
    <text x="404" y="103">10</text>
    <text x="470" y="103">3</text>
    <text x="536" y="103">7</text>
    <text x="602" y="103">6</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="338" y="134">下标 0</text>
    <text x="404" y="134">1</text>
    <text x="470" y="134">2</text>
    <text x="536" y="134">3</text>
    <text x="602" y="134">4</text>
  </g>

  <!-- 切分点标记 -->
  <path d="M 437 70 L 437 126" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>
  <text x="437" y="66" text-anchor="middle" font-size="11" fill="#a04038">切分点 i = 1</text>

  <!-- 总和括线 -->
  <path d="M 308 144 L 308 150 L 632 150 L 632 144" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="470" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">总和 S = 36（偶数）</text>

  <!-- 左右子数组标注 -->
  <path d="M 371 180 L 371 124" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#sk)"/>
  <text x="371" y="196" text-anchor="middle" font-size="12" fill="#2f4f6f">左子数组 [10, 10]，和 L = 20</text>
  <path d="M 536 180 L 536 124" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#sk)"/>
  <text x="536" y="196" text-anchor="middle" font-size="12" fill="#8a6515">右子数组 [3, 7, 6]，和 R = 16</text>

  <!-- ===== 公式框 ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="216" width="720" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="470" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6515">差的代数式：D = L − R = L − (S − L) = 2L − S</text>
  <text x="470" y="272" text-anchor="middle" font-size="13" fill="#8a6515">2L 恒为偶数 ⇒ D ≡ S (mod 2)：切分点怎么选都不影响奇偶性！</text>
  <text x="470" y="298" text-anchor="middle" font-size="11" fill="#8a6515">直观版：L−R 与 L+R = S 同奇偶（差与和的奇偶性总相同）</text>

  <!-- 分支箭头 -->
  <path d="M 340 320 L 285 354" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>
  <path d="M 600 320 L 655 354" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)" marker-end="url(#arD)"/>

  <!-- ===== 两种结局 ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="360" width="340" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">S 为偶数</text>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#2e5e2e">n−1 个切分点全部满足</text>
  <text x="280" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">答案 = n − 1</text>

  <g filter="url(#sk)">
    <rect x="490" y="360" width="340" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="660" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038">S 为奇数</text>
  <text x="660" y="416" text-anchor="middle" font-size="12" fill="#a04038">没有任何切分点满足</text>
  <text x="660" y="450" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038">答案 = 0</text>

  <!-- ===== 底部对照 ===== -->
  <g filter="url(#sk)">
    <rect x="110" y="512" width="720" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="130" y="540" font-size="12" fill="#2f4f6f">· 示例 1：S = 36（偶）→ D ∈ {−16, 4, 10, 24} 全为偶数 → 答案 4 = n−1</text>
  <text x="130" y="566" font-size="12" fill="#2f4f6f">· 示例 2：[1,2,2]，S = 5（奇）→ D ∈ {−3, 1} 全为奇数 → 答案 0</text>
  <text x="130" y="594" font-size="12" font-weight="bold" fill="#2f4f6f">· 一行结论：先判总和奇偶，再数切分点个数，签到收工</text>
</svg>
