<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">约束刻画：窗口内“相邻相等对”≤ 1</text>

  <!-- s = 52233 格子 -->
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <rect x="100" y="60" width="44" height="44" rx="4" fill="#eef0f2" stroke="#999" stroke-width="1.4"/>
    <text x="122" y="88" fill="#777">5</text>
    <rect x="148" y="60" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="170" y="88" fill="#2f5527">2</text>
    <rect x="196" y="60" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="218" y="88" fill="#2f5527">2</text>
    <rect x="244" y="60" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="266" y="88" fill="#2f4a66">3</text>
    <rect x="292" y="60" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="314" y="88" fill="#2f4a66">3</text>
  </g>
  <!-- 相等对标记 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <path d="M158 108 Q 170 120 182 108" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="170" y="134" fill="#2f5527">第 1 对 “22” ✓</text>
    <path d="M302 108 Q 314 120 326 108" fill="none" stroke="#446688" stroke-width="1.8"/>
    <text x="314" y="134" fill="#2f4a66">第 2 对 “33”</text>
  </g>

  <!-- 两个窗口 -->
  <rect x="52" y="160" width="180" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2f5527">
    <text x="68" y="184">窗口 "5223"（下标 0..3）</text>
    <text x="68" y="204">相等对只有 “22” 一对 → 合法</text>
    <text x="68" y="222" font-size="13" fill="#4a7a3a">长度 4 ✓</text>
  </g>
  <rect x="288" y="160" width="192" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8c3a36">
    <text x="304" y="184">窗口 "52233"（整个串）</text>
    <text x="304" y="204">“22” 和 “33” 两对 → 超额</text>
    <text x="304" y="222" font-size="13" fill="#b85450">长度 5 ✗</text>
  </g>

  <rect x="52" y="252" width="428" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a10">
    <text x="70" y="276">合法窗口 ⟺ 相邻相等对计数 ≤ 1 —— 一个“最多容忍一次违规”的形态，</text>
    <text x="70" y="298">正是滑动窗口的标准信号：右端扩张计数加一，超过 1 就从左端收缩，</text>
    <text x="70" y="316">收缩到只剩一对相等为止，每个左端点至多移动一次。</text>
  </g>
</svg>
