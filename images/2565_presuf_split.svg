<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察二：前后缀分解 —— pre / suf 两张「以 t 为刻度」的贪心表</text>
  <text x="350" y="46" text-anchor="middle" font-size="11" fill="#888">删除段 [l, y−1] 的可行性 ⟺ pre[l] ≤ suf[y]；得分 = y − l，目标：最小化</text>

  <!-- ===== t row ===== -->
  <text x="66" y="112" font-size="12" fill="#555" font-weight="bold">t =</text>

  <text x="196" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">保留前缀</text>
  <rect x="130" y="86" width="132" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="110" text-anchor="middle" font-size="13" fill="#333">t[0..l−1]</text>

  <text x="310" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除段</text>
  <rect x="266" y="86" width="88" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="110" text-anchor="middle" font-size="13" fill="#333">t[l..y−1]</text>

  <text x="424" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留后缀</text>
  <rect x="358" y="86" width="132" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="424" y="110" text-anchor="middle" font-size="13" fill="#333">t[y..m−1]</text>

  <text x="196" y="140" text-anchor="middle" font-size="10" fill="#888">0 ⋯ l−1</text>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#888">l ⋯ y−1</text>
  <text x="424" y="140" text-anchor="middle" font-size="10" fill="#888">y ⋯ m−1</text>

  <!-- ===== greedy arrows ===== -->
  <path d="M 196 152 Q 168 200 180 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="200" font-size="10.5" fill="#446688">贪心：能配就配</text>

  <path d="M 424 152 Q 452 200 440 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="200" font-size="10.5" fill="#4a7a3a">贪心：尽量靠右</text>

  <!-- ===== s row ===== -->
  <text x="66" y="276" font-size="12" fill="#555" font-weight="bold">s =</text>

  <rect x="110" y="252" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="276" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="152" y="252" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="276" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="194" y="252" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="276" text-anchor="middle" font-size="14" fill="#333">c</text>
  <text x="248" y="276" font-size="14" fill="#999">⋯</text>

  <path d="M 300 240 L 300 300" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">切分点 i</text>

  <text x="352" y="276" font-size="14" fill="#999">⋯</text>
  <rect x="380" y="252" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="276" text-anchor="middle" font-size="14" fill="#333">x</text>
  <rect x="422" y="252" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="276" text-anchor="middle" font-size="14" fill="#333">y</text>
  <rect x="464" y="252" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="484" y="276" text-anchor="middle" font-size="14" fill="#333">z</text>

  <path d="M 110 296 L 110 306 L 234 306 L 234 296" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="324" text-anchor="middle" font-size="10.5" fill="#446688">s[0..pre[l]−1]（前缀最早匹配完）</text>

  <path d="M 380 296 L 380 306 L 504 306 L 504 296" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a">s[suf[y]..n−1]（后缀最晚起点）</text>

  <!-- ===== condition box ===== -->
  <rect x="60" y="344" width="580" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="369" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">可行 ⟺ 存在切分点 i ∈ [pre[l], suf[y]] ⟺ pre[l] ≤ suf[y]</text>

  <!-- ===== definition boxes ===== -->
  <rect x="60" y="404" width="282" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="201" y="428" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">pre[l] = min{ i : t[0..l−1] ⊆ s[0..i−1] }</text>
  <text x="201" y="450" text-anchor="middle" font-size="10.5" fill="#666">pre[0] = 0，随 l 非降，左→右贪心</text>

  <rect x="358" y="404" width="282" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="499" y="428" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">suf[y] = max{ i : t[y..] ⊆ s[i..] }</text>
  <text x="499" y="450" text-anchor="middle" font-size="10.5" fill="#666">suf[m] = n，随 y 非降，右→左贪心</text>
</svg>
