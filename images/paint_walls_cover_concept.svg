<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">付费工匠的工时 = 免费工匠的白嫖窗口</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#666">以付费刷墙 i（time[i] = 3）为例，两名工匠同时开工</text>
  <path d="M 250 44 Q 430 52 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- time axis -->
  <path d="M 110 96 L 500 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#rough)"/>
  <text x="516" y="100" font-size="12" fill="#555">时间</text>
  <g filter="url(#rough)">
    <line x1="130" y1="90" x2="130" y2="96" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="250" y1="90" x2="250" y2="96" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="370" y1="90" x2="370" y2="96" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="490" y1="90" x2="490" y2="96" stroke="#3a3a3a" stroke-width="1.5"/>
  </g>
  <text x="190" y="84" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="310" y="84" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="430" y="84" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- paid painter row -->
  <text x="48" y="146" font-size="13" font-weight="bold" fill="#33507a">付费工匠</text>
  <g filter="url(#rough)">
    <rect x="130" y="118" width="360" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <line x1="250" y1="118" x2="250" y2="168" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="370" y1="118" x2="370" y2="168" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="310" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#33507a">刷墙 i（开销 cost[i]）</text>
  <text x="508" y="140" font-size="12" fill="#33507a">← 耗时 3 单位</text>
  <text x="508" y="158" font-size="12" fill="#33507a">（time[i]）</text>

  <!-- parallel dashed guides -->
  <g filter="url(#rough)">
    <line x1="130" y1="170" x2="130" y2="234" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="490" y1="170" x2="490" y2="234" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>
  <text x="310" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a">并行工作：每 1 单位时间，免费工匠白嫖 1 堵</text>

  <!-- free painter row -->
  <text x="48" y="266" font-size="13" font-weight="bold" fill="#2e6e2e">免费工匠</text>
  <g filter="url(#rough)">
    <rect x="130" y="236" width="120" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="250" y="236" width="120" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="370" y="236" width="120" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="190" y="258" text-anchor="middle" font-size="13" fill="#2e6e2e">免费墙 a</text>
  <text x="190" y="276" text-anchor="middle" font-size="10" fill="#5a8a5a">1 单位</text>
  <text x="310" y="258" text-anchor="middle" font-size="13" fill="#2e6e2e">免费墙 b</text>
  <text x="310" y="276" text-anchor="middle" font-size="10" fill="#5a8a5a">1 单位</text>
  <text x="430" y="258" text-anchor="middle" font-size="13" fill="#2e6e2e">免费墙 c</text>
  <text x="430" y="276" text-anchor="middle" font-size="10" fill="#5a8a5a">1 单位</text>
  <text x="508" y="258" font-size="12" fill="#2e6e2e">← 白嫖 3 堵</text>
  <text x="508" y="276" font-size="12" fill="#2e6e2e">（开销 0）</text>

  <!-- coverage accounting -->
  <g filter="url(#rough)">
    <rect x="110" y="322" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="185" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">墙 i 自身</text>
  <text x="185" y="364" text-anchor="middle" font-size="12" fill="#33507a">+ 1 堵</text>
  <text x="278" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#555">+</text>
  <g filter="url(#rough)">
    <rect x="300" y="322" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">白嫖免费墙</text>
  <text x="380" y="364" text-anchor="middle" font-size="12" fill="#2e6e2e">+ time[i] 堵</text>
  <text x="480" y="358" text-anchor="middle" font-size="20" font-weight="bold" fill="#555">=</text>
  <g filter="url(#rough)">
    <rect x="502" y="322" width="230" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="617" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a10">覆盖 time[i] + 1 堵</text>
  <text x="617" y="364" text-anchor="middle" font-size="12" fill="#8a5a10">只花 cost[i] 元</text>

  <!-- conclusion banner -->
  <g filter="url(#rough)">
    <rect x="60" y="440" width="740" height="70" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="430" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">付费刷墙 i ≈ 一件背包物品：重量 w = time[i] + 1，价值 c = cost[i]</text>
  <text x="430" y="492" text-anchor="middle" font-size="13" fill="#7a5415">"两名工匠并行" 被压缩成 "一件物品覆盖多少堵" —— 调度问题坍缩为选集合问题</text>
</svg>
