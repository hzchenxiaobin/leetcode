<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">两个例子：一个能变有序，一个不能</text>
  <text x="50" y="62" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">① nums = [8,4,2,30,15]</text>
  <rect x="60" y="72" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93.0" y="98.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <rect x="138" y="72" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171.0" y="98.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="216" y="72" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249.0" y="98.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="294" y="72" width="66" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.0" y="98.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">30</text>
  <rect x="372" y="72" width="66" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405.0" y="98.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">15</text>
  <path d="M150,124 L172,124" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="270" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">段内排序</text>
  <rect x="330" y="72" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350.0" y="98.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="374" y="72" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="394.0" y="98.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">4</text>
  <rect x="418" y="72" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="438.0" y="98.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">8</text>
  <rect x="462" y="72" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="482.0" y="98.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">15</text>
  <rect x="506" y="72" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="526.0" y="98.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">30</text>
  <text x="470" y="130" text-anchor="middle" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">8 ≤ 15 ✓</text>
  <text x="470" y="146" text-anchor="middle" font-size="10.5" fill="#1c3a1c" filter="url(#rough2)">→ true</text>
  <text x="50" y="186" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">② nums = [3,16,8,4,2]</text>
  <rect x="60" y="196" width="66" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="93.0" y="222.0" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">3</text>
  <text x="93" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pc 2</text>
  <rect x="138" y="196" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171.0" y="222.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">16</text>
  <text x="171" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pc 1</text>
  <rect x="216" y="196" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249.0" y="222.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="249" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pc 1</text>
  <rect x="294" y="196" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="327.0" y="222.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="327" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pc 1</text>
  <rect x="372" y="196" width="66" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405.0" y="222.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="405" y="250" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">pc 1</text>
  <path d="M150,256 L172,256" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="270" y="224" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">段内排序</text>
  <rect x="330" y="196" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350.0" y="222.0" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">3</text>
  <rect x="374" y="196" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="394.0" y="222.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">2</text>
  <rect x="418" y="196" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="438.0" y="222.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">4</text>
  <rect x="462" y="196" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="482.0" y="222.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">8</text>
  <rect x="506" y="196" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="526.0" y="222.0" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">16</text>
  <text x="470" y="254" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">3 > 2 ✗</text>
  <text x="470" y="270" text-anchor="middle" font-size="10.5" fill="#7a3030" filter="url(#rough2)">→ false</text>
  <rect x="50" y="286" width="460" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">第二例中 3 自成一段（popcount 2），无法进入后面那段，只能卡在最前</text>
</svg>
