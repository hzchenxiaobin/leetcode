<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 364"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="364" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三段是否相等</text>
  <text x="60" y="62" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1  arr = [1,0,1,0,1]：ones = 3，first=0, second=2, third=4</text>
  <text x="60" y="86" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">len = 5 - 4 = 1；arr[0..1) = [1]，arr[2..3) = [1]，arr[4..5) = [1] → 全等</text>
  <text x="60" y="110" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 [0 + 1 - 1, 2 + 1] = [0, 3]</text>
  <text x="60" y="150" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2  arr = [1,1,0,1,1]：ones = 4，4 %% 3 != 0 → [-1,-1]</text>
  <text x="60" y="190" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3  arr = [1,1,0,0,1]：ones = 3，first=0, second=1, third=4</text>
  <text x="60" y="214" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">len = 5 - 4 = 1；arr[0..1) = [1]，arr[1..2) = [1]，arr[4..5) = [1] → 全等</text>
  <text x="60" y="238" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">返回 [0 + 1 - 1, 1 + 1] = [0, 2]</text>
  <rect x="60" y="262" width="540" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="294.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全 0 的特例：ones = 0 → 直接 [0, n-1]（三段的二进制值都是 0）</text>
  <text x="330" y="344" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">三个示例分别覆盖「可行」「1 的个数不可均分」「含前导零但可行」</text>
</svg>
