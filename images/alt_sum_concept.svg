<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：下标奇偶决定符号</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- sign row -->
  <g font-size="22" font-weight="bold">
    <text x="140" y="112" text-anchor="middle" fill="#4a7a3a" filter="url(#sk)">+</text>
    <text x="280" y="112" text-anchor="middle" fill="#b85450" filter="url(#sk)">−</text>
    <text x="420" y="112" text-anchor="middle" fill="#4a7a3a" filter="url(#sk)">+</text>
    <text x="560" y="112" text-anchor="middle" fill="#b85450" filter="url(#sk)">−</text>
  </g>

  <!-- value boxes -->
  <g font-size="18" font-weight="bold">
    <g filter="url(#sk)"><rect x="100" y="122" width="80" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="140" y="151" text-anchor="middle" fill="#2e5e2e">nums[0]</text>
    <g filter="url(#sk)"><rect x="240" y="122" width="80" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="280" y="151" text-anchor="middle" fill="#9e3a36">nums[1]</text>
    <g filter="url(#sk)"><rect x="380" y="122" width="80" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
    <text x="420" y="151" text-anchor="middle" fill="#2e5e2e">nums[2]</text>
    <g filter="url(#sk)"><rect x="520" y="122" width="80" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
    <text x="560" y="151" text-anchor="middle" fill="#9e3a36">nums[3]</text>
  </g>

  <!-- index labels -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="140" y="188" filter="url(#sk)">下标 0（偶）</text>
    <text x="280" y="188" filter="url(#sk)">下标 1（奇）</text>
    <text x="420" y="188" filter="url(#sk)">下标 2（偶）</text>
    <text x="560" y="188" filter="url(#sk)">下标 3（奇）</text>
  </g>

  <!-- arrow to formula -->
  <path d="M 320 200 L 320 224" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="70" y="232" width="500" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a6e">交替和 = nums[0] − nums[1] + nums[2] − nums[3] + …</text>
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="#446688">即 Σ sign(i)·nums[i]，sign(i) = +1（i 偶）/ −1（i 奇）</text>

  <!-- summary box -->
  <g filter="url(#sk)">
    <rect x="70" y="304" width="500" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">一遍扫描即可：i % 2 == 0（或 !(i &amp; 1)）取加号，否则取减号</text>
  <text x="320" y="338" text-anchor="middle" font-size="11" fill="#999">时间 O(n)，空间 O(1)</text>
</svg>
