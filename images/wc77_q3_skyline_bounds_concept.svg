  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：每个格子的高度上界 = min(行最大值, 列最大值)</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行天际线只由 R[r] 决定，列天际线只由 C[c] 决定，两个方向互不干扰</text>
  <text x="72" y="92" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">行最大值 R[r]</text>
