  <text x="282" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">4</text>
  <rect x="54" y="107" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="72" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">8</text>
  <rect x="100" y="144" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">2</text>
  <rect x="152" y="144" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">4</text>
  <rect x="204" y="144" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">5</text>
  <rect x="256" y="144" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">7</text>
  <rect x="54" y="151" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="72" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">7</text>
  <rect x="100" y="188" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">9</text>
  <rect x="152" y="188" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">2</text>
  <rect x="204" y="188" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">6</text>
  <rect x="256" y="188" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">3</text>
  <rect x="54" y="195" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="72" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">9</text>
  <rect x="100" y="232" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">0</text>
  <rect x="152" y="232" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">3</text>
  <rect x="204" y="232" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">1</text>
  <rect x="256" y="232" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">0</text>
  <rect x="54" y="239" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="72" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="108" y="290" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="126" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">9</text>
  <rect x="160" y="290" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="178" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">4</text>
  <rect x="212" y="290" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="230" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">8</text>
  <rect x="264" y="290" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="282" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">7</text>
  <text x="204" y="338" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">列最大值 C[c]</text>
  <path d="M 162 96 L 162 78 L 330 78" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="336" y="83" font-size="10.5" fill="#b85450" filter="url(#rough2)">上界 = min(8, 4) = 4</text>
  <path d="M 322 220 L 366 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="372" y="120" width="244" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="390" y="146" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">格子上界</text>
  <text x="390" y="176" font-size="12" fill="#2f4a28" filter="url(#rough2)">h ≤ min( R[r] , C[c] )</text>
  <text x="390" y="204" font-size="10.5" fill="#555" filter="url(#rough2)">上界可达：同时取到也不会</text>
  <text x="390" y="220" font-size="10.5" fill="#555" filter="url(#rough2)">把任何一侧的天际线抬高</text>
  <text x="390" y="250" font-size="10.5" fill="#555" filter="url(#rough2)">总增量 = Σ ( min(R,C) − grid )</text>
  <text x="390" y="276" font-size="10" fill="#888" filter="url(#rough2)">贪心：每格都顶到上界即最优</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">为什么不能取 max：只要有一行被抬到超过 R[r]，该行天际线就变高，方案立刻非法</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">为什么上界可实现：第 r 行最大值那一列 c* 满足 min(R[r], C[c*]) = R[r]，行最大值不会变</text>
  <text x="320" y="418" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同理存在一格使 min = C[c]，故两套天际线在原位置被完整保留</text>
</svg>
