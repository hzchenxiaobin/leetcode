  <text x="126" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">3</text>
  <rect x="152" y="100" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">0</text>
