<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">爬楼梯 DP：dp[i] = dp[i−zero] + dp[i−one]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i]：长度恰为 i 的构造方案数；每步在末尾追加 zero 个 '0' 或 one 个 '1'</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="104" y="70" width="52" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="168" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="232" y="70" width="52" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="296" y="70" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="360" y="70" width="52" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="424" y="70" width="52" height="36" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="4"/>
  </g>
  <text x="66" y="93" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">dp[0]</text>
  <text x="130" y="93" text-anchor="middle" font-size="12" fill="#555">dp[1]</text>
  <text x="194" y="93" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp[2]</text>
  <text x="258" y="93" text-anchor="middle" font-size="12" fill="#555">…</text>
  <text x="322" y="93" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">i−zero</text>
  <text x="386" y="93" text-anchor="middle" font-size="12" fill="#555">…</text>
  <text x="450" y="93" text-anchor="middle" font-size="12" fill="#555">i−one</text>
  <text x="66" y="122" text-anchor="middle" font-size="10" fill="#d6a040">= 1（空串）</text>

  <path d="M 326 110 C 300 170, 250 170, 226 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 442 110 C 420 200, 240 210, 208 112" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="168" y="196" width="308" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8"/>
  </g>
  <text x="322" y="220" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dp[i]（当前要求解的长度 i）</text>
  <text x="322" y="240" text-anchor="middle" font-size="11" fill="#555">末尾一段要么是 zero 个 '0'，要么是 one 个 '1'，两类不交不漏</text>

  <text x="270" y="160" font-size="11" fill="#446688">回退 zero 步</text>
  <text x="300" y="192" font-size="11" fill="#4a7a3a">回退 one 步</text>

  <rect x="40" y="150" width="100" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">边界</text>
  <text x="90" y="192" text-anchor="middle" font-size="10.5" fill="#555">dp[0] = 1</text>
  <text x="90" y="210" text-anchor="middle" font-size="10.5" fill="#555">i &lt; zero：跳过那一项</text>
  <text x="90" y="228" text-anchor="middle" font-size="10.5" fill="#555">i &lt; one：跳过那一项</text>

  <rect x="40" y="254" width="436" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="258" y="273" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">答案 = Σ dp[i]（low ≤ i ≤ high），对 10⁹+7 取模</text>
  <text x="258" y="291" text-anchor="middle" font-size="10.5" fill="#555">「好字符串」= 长度落在 [low, high] 的任意构造串</text>

  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">与爬楼梯同构：zero / one 就是两种「步长」</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999">转移只看「末尾一段」，与字符串前缀无关 ⟹ 状态只需长度一维</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999">zero 与 one 相等时 dp[i] = 2·dp[i−zero]，同样成立</text>
</svg>
