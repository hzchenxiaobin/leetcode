<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三种情况都能把 z 个 AB 全部塞进去</text>

  <!-- 情况一：x > y -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="560" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="70" y="76" font-size="13.5" fill="#446688">x &gt; y（AA 是多数）</text>
    <!-- AB 链 -->
    <rect x="70" y="90" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="100" y="110" text-anchor="middle" font-size="13" fill="#333">AB…</text>
    <rect x="130" y="90" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="110" text-anchor="middle" font-size="13" fill="#333">AB</text>
    <!-- 骨架 -->
    <rect x="210" y="90" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="233" y="110" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="256" y="90" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="279" y="110" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <rect x="302" y="90" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="325" y="110" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="348" y="90" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="371" y="110" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <rect x="394" y="90" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="417" y="110" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <text x="452" y="110" text-anchor="middle" font-size="13" fill="#555">…</text>
    <text x="530" y="110" text-anchor="middle" font-size="12" fill="#446688">AB 链放最前</text>
    <text x="530" y="132" text-anchor="middle" font-size="12" fill="#446688">2z + 4y + 2</text>
  </g>

  <!-- 情况二：x < y -->
  <g filter="url(#rough2)">
    <rect x="40" y="158" width="560" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="70" y="182" font-size="13.5" fill="#4a7a3a">x &lt; y（BB 是多数）</text>
    <rect x="70" y="196" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="93" y="216" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <!-- AB 链紧跟第一个 BB -->
    <rect x="116" y="196" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="146" y="216" text-anchor="middle" font-size="13" fill="#333">AB…</text>
    <rect x="176" y="196" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="206" y="216" text-anchor="middle" font-size="13" fill="#333">AB</text>
    <!-- 骨架 -->
    <rect x="246" y="196" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="269" y="216" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="292" y="196" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="315" y="216" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <rect x="338" y="196" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="361" y="216" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="384" y="196" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="407" y="216" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <rect x="430" y="196" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="453" y="216" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <text x="488" y="216" text-anchor="middle" font-size="13" fill="#555">…</text>
    <text x="530" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a">AB 链紧跟</text>
    <text x="530" y="228" text-anchor="middle" font-size="12" fill="#4a7a3a">第一个 BB</text>
  </g>

  <!-- 情况三：x == y -->
  <g filter="url(#rough2)">
    <rect x="40" y="264" width="560" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="70" y="288" font-size="13.5" fill="#d6a040">x = y（数量相等，无 +2 奖励）</text>
    <rect x="70" y="302" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="100" y="322" text-anchor="middle" font-size="13" fill="#333">AB…</text>
    <rect x="130" y="302" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="322" text-anchor="middle" font-size="13" fill="#333">AB</text>
    <rect x="210" y="302" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="233" y="322" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="256" y="302" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="279" y="322" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <rect x="302" y="302" width="46" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="325" y="322" text-anchor="middle" font-size="13" fill="#333">AA</text>
    <rect x="348" y="302" width="46" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="371" y="322" text-anchor="middle" font-size="13" fill="#333">BB</text>
    <text x="412" y="322" text-anchor="middle" font-size="13" fill="#555">…（末尾是 BB）</text>
    <text x="530" y="322" text-anchor="middle" font-size="12" fill="#d6a040">2z + 4x</text>
  </g>

  <text x="320" y="378" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">统一公式：ans = 2z + 4·min(x,y) + (x ≠ y ? 2 : 0)</text>
</svg>
