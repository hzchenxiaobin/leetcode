<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">isPrefixAndSuffix(str1, str2) 是什么？</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Case 1: true ===== -->
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#4a7a3a">例 1：✓ 返回 true</text>

  <!-- str1 = aba -->
  <text x="60" y="112" font-size="13" fill="#555">str1 =</text>
  <g filter="url(#rough2)">
    <rect x="115" y="94" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="155" y="94" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="195" y="94" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="134" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="114" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>

  <!-- arrow prefix -->
  <path d="M 140 128 Q 150 156 172 172" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="158" font-size="12" fill="#446688" font-weight="bold">前缀 ✓</text>
  <!-- arrow suffix -->
  <path d="M 208 128 Q 232 156 268 172" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="150" font-size="12" fill="#4a7a3a" font-weight="bold">后缀 ✓</text>

  <!-- str2 = ababa -->
  <text x="60" y="202" font-size="13" fill="#555">str2 =</text>
  <g filter="url(#rough2)">
    <rect x="115" y="184" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="155" y="184" width="38" height="28" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="195" y="184" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="235" y="184" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="275" y="184" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="134" y="204" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="204" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="204" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="254" y="204" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="294" y="204" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="180" y="232" font-size="11" fill="#446688" font-weight="bold">↑ 开头 3 格 = "aba"</text>
  <text x="252" y="248" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 末尾 3 格 = "aba"</text>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="380" y="96" width="220" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="490" y="124" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">开头一段 = str1</text>
  <text x="490" y="146" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">结尾一段 = str1 → true</text>

  <!-- ===== Case 2: false ===== -->
  <text x="60" y="296" font-size="14" font-weight="bold" fill="#b85450">例 2：✗ 返回 false</text>

  <!-- str1 = abc -->
  <text x="60" y="328" font-size="13" fill="#555">str1 =</text>
  <g filter="url(#rough2)">
    <rect x="115" y="310" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="155" y="310" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="195" y="310" width="38" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="134" y="330" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="330" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="330" text-anchor="middle" font-size="14" fill="#333">c</text>

  <!-- arrows -->
  <path d="M 140 344 Q 148 366 166 376" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 344 Q 226 366 250 376" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="96" y="368" font-size="12" fill="#446688" font-weight="bold">前缀 ✓</text>
  <text x="232" y="362" font-size="12" fill="#b85450" font-weight="bold">后缀 ✗</text>

  <!-- str2 = abcd -->
  <text x="60" y="402" font-size="13" fill="#555">str2 =</text>
  <g filter="url(#rough2)">
    <rect x="115" y="384" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="155" y="384" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="195" y="384" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="235" y="384" width="38" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="134" y="404" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="404" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="404" text-anchor="middle" font-size="14" fill="#333">c</text>
  <text x="254" y="404" text-anchor="middle" font-size="14" fill="#333">d</text>
  <text x="288" y="404" font-size="12" fill="#b85450" font-weight="bold">← 结尾 "bcd" ≠ "abc"</text>

  <!-- note box -->
  <g filter="url(#rough2)">
    <rect x="380" y="300" width="220" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="490" y="328" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">必要条件：</text>
  <text x="490" y="352" text-anchor="middle" font-size="13" fill="#7a5415">|str1| ≤ |str2|</text>
  <text x="490" y="376" text-anchor="middle" font-size="12" fill="#8a6a2a">长度相等时退化为 str1 == str2</text>
  <text x="490" y="396" text-anchor="middle" font-size="12" fill="#8a6a2a">（自身也是自身的前后缀）</text>
</svg>
