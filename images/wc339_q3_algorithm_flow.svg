<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：求 base → 求 Δ → 降序排序 → 取前 k → 相加</text>

  <!-- step boxes -->
  <rect x="120" y="46" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="72" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 一遍求和：base = Σ reward2</text>

  <path d="M 270 90 L 270 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="118" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 构造增量：Δ[i] = reward1[i] − reward2[i]</text>

  <path d="M 270 162 L 270 186" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="190" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 将 Δ 从大到小排序</text>

  <path d="M 270 234 L 270 258" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="262" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ 前 k 个 Δ 求和得 gain（负 Δ 也取满）</text>

  <path d="M 270 306 L 270 330" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="334" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">⑤ 返回 base + gain</text>

  <!-- left note: complexity -->
  <rect x="8" y="50" width="104" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="71" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">n ≤ 1e5</text>
  <text x="60" y="89" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">O(n log n) 稳过</text>
  <path d="M 112 75 L 120 70" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- right note: sort alternatives -->
  <rect x="436" y="168" width="116" height="84" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="185" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">替身写法</text>
  <text x="494" y="201" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">小根堆取前 k 大</text>
  <text x="494" y="216" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">O(n log k)</text>
  <text x="494" y="231" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">nth_element</text>
  <text x="494" y="246" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">平均 O(n)</text>
  <path d="M 436 210 L 420 212" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- right note: k extremes -->
  <rect x="436" y="330" width="116" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="350" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">k = 0 ⇒ base</text>
  <text x="494" y="368" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">k = n ⇒ Σ reward1</text>
  <path d="M 436 356 L 422 356" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
</svg>
