<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="470" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：段首必质数、段尾必非质数 → 切割点只由相邻两字符决定</text>
  <path d="M 250 42 Q 440 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="128" cy="62" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="67" font-size="12" fill="#444" filter="url(#rough2)">质数数字 P = {2, 3, 5, 7}（绿框）</text>
  <circle cx="428" cy="62" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="67" font-size="12" fill="#444" filter="url(#rough2)">非质数数字 N = {1, 4, 6, 8, 9}（橙框）</text>

  <text x="105" y="144" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">s =</text>

  <g font-size="19" font-weight="bold">
    <g filter="url(#rough2)"><rect x="120" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="148" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="180" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="208" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="240" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="268" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="300" y="116" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="328" y="145" text-anchor="middle" fill="#8a5f14" filter="url(#rough2)">4</text>
    <g filter="url(#rough2)"><rect x="360" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="388" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">2</text>
    <g filter="url(#rough2)"><rect x="420" y="116" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="448" y="145" text-anchor="middle" fill="#8a5f14" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="480" y="116" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="508" y="145" text-anchor="middle" fill="#8a5f14" filter="url(#rough2)">8</text>
    <g filter="url(#rough2)"><rect x="540" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="568" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">5</text>
    <g filter="url(#rough2)"><rect x="600" y="116" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="628" y="145" text-anchor="middle" fill="#8a5f14" filter="url(#rough2)">1</text>
    <g filter="url(#rough2)"><rect x="660" y="116" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="688" y="145" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">3</text>
    <g filter="url(#rough2)"><rect x="720" y="116" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="748" y="145" text-anchor="middle" fill="#8a5f14" filter="url(#rough2)">1</text>
  </g>

  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="148" y="178" filter="url(#rough2)">0</text>
    <text x="208" y="178" filter="url(#rough2)">1</text>
    <text x="268" y="178" filter="url(#rough2)">2</text>
    <text x="328" y="178" filter="url(#rough2)">3</text>
    <text x="388" y="178" filter="url(#rough2)">4</text>
    <text x="448" y="178" filter="url(#rough2)">5</text>
    <text x="508" y="178" filter="url(#rough2)">6</text>
    <text x="568" y="178" filter="url(#rough2)">7</text>
    <text x="628" y="178" filter="url(#rough2)">8</text>
    <text x="688" y="178" filter="url(#rough2)">9</text>
    <text x="748" y="178" filter="url(#rough2)">10</text>
  </g>

  <g filter="url(#rough2)">
    <line x1="358" y1="106" x2="358" y2="188" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="538" y1="106" x2="538" y2="188" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="658" y1="106" x2="658" y2="188" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="178" y1="106" x2="178" y2="188" stroke="#b0b0b0" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle">
    <text x="358" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">✂</text>
    <text x="538" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">✂</text>
    <text x="658" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">✂</text>
    <text x="178" y="100" font-size="13" fill="#999" filter="url(#rough2)">✗</text>
    <text x="358" y="206" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">可切</text>
    <text x="538" y="206" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">可切</text>
    <text x="658" y="206" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">可切</text>
    <text x="178" y="206" font-size="10" fill="#999" filter="url(#rough2)">s[0]=2 质数 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="222" width="760" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="246" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">切割点 m（1 ≤ m &lt; n）合法 ⟺ s[m−1] ∈ N（左段尾）且 s[m] ∈ P（右段首）—— 只看相邻两个字符</text>
  <text x="80" y="268" font-size="11.5" fill="#555" filter="url(#rough2)">与 k、minLength 无关，可 O(n) 预处理；本例可切点集合 = {4, 7, 9}，完美分割 = 从中选 k−1 = 2 个、相邻间隔 ≥ minLength</text>

  <text x="140" y="302" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">P=段首</text>
  <text x="310" y="302" font-size="9.5" fill="#8a5f14" filter="url(#rough2)">N=段尾</text>

  <g filter="url(#rough2)">
    <rect x="120" y="310" width="210" height="38" rx="8" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="360" y="310" width="210" height="38" rx="8" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="600" y="310" width="210" height="38" rx="8" fill="#f5f5f0" stroke="#999" stroke-width="1.2"/>
    <rect x="126" y="316" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="296" y="316" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="366" y="316" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="536" y="316" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="606" y="316" width="28" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="776" y="316" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="140" y="334" fill="#2e6e2e" filter="url(#rough2)">P</text>
    <text x="310" y="334" fill="#8a5f14" filter="url(#rough2)">N</text>
    <text x="380" y="334" fill="#2e6e2e" filter="url(#rough2)">P</text>
    <text x="550" y="334" fill="#8a5f14" filter="url(#rough2)">N</text>
    <text x="620" y="334" fill="#2e6e2e" filter="url(#rough2)">P</text>
    <text x="790" y="334" fill="#8a5f14" filter="url(#rough2)">N</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#777">
    <text x="225" y="334" filter="url(#rough2)">··· 任意 ···</text>
    <text x="465" y="334" filter="url(#rough2)">··· 任意 ···</text>
    <text x="705" y="334" filter="url(#rough2)">··· 任意 ···</text>
  </g>
  <g text-anchor="middle">
    <text x="345" y="340" font-size="24" font-weight="bold" fill="#b85450" filter="url(#rough2)">|</text>
    <text x="585" y="340" font-size="24" font-weight="bold" fill="#b85450" filter="url(#rough2)">|</text>
  </g>
  <g text-anchor="middle" font-size="10.5">
    <text x="225" y="366" fill="#666" filter="url(#rough2)">第 1 段（长度 ≥ L）</text>
    <text x="345" y="366" fill="#b85450" font-weight="bold" filter="url(#rough2)">可切点</text>
    <text x="465" y="366" fill="#666" filter="url(#rough2)">第 2 段</text>
    <text x="585" y="366" fill="#b85450" font-weight="bold" filter="url(#rough2)">可切点</text>
    <text x="705" y="366" fill="#666" filter="url(#rough2)">第 3 段</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="386" width="760" height="64" rx="8" fill="#fdfcf7" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="410" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">端点门卫：s[0] ∈ P（第 1 段开头）、s[n−1] ∈ N（第 k 段结尾），违反任意一条直接输出 0</text>
  <text x="80" y="432" font-size="11.5" fill="#555" filter="url(#rough2)">剩下的问题：在可切点集合中恰选 k−1 个、相邻间隔 ≥ minLength —— 划分型 DP 两板斧：状态数 O(nk) + 前缀和把转移降到 O(1)</text>
</svg>
