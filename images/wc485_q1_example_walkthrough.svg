<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：官方样例走查 + 一个「测不出 bug」的反例</text>

  <!-- Panel 1：示例 2 -->
  <rect x="16" y="40" width="608" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="61" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">示例 2：s = "axeyizou"</text>
  <rect x="40" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="78" y="70" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <rect x="116" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <rect x="154" y="70" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <rect x="192" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="230" y="70" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">z</text>
  <rect x="268" y="70" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
