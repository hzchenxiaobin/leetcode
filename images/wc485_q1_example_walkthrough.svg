  <text x="132" y="116" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="170" y="116" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">辅</text>
  <text x="208" y="116" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="246" y="116" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">辅</text>
  <text x="284" y="116" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="322" y="116" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="56" y="132" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">1</text>
  <text x="94" y="132" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="132" y="132" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">2</text>
  <text x="170" y="132" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="208" y="132" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">3</text>
  <text x="246" y="132" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="284" y="132" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">4</text>
  <text x="322" y="132" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">5</text>
  <text x="36" y="132" text-anchor="start" font-size="8" fill="#446688" filter="url(#rough2)">v:</text>
  <text x="56" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="94" y="144" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="132" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="170" y="144" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="208" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="246" y="144" text-anchor="middle" font-size="8" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="284" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="322" y="144" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">·</text>
  <text x="36" y="144" text-anchor="start" font-size="8" fill="#8a6d1f" filter="url(#rough2)">c:</text>
  <rect x="372" y="72" width="230" height="56" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="487" y="95" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">v = 5，c = 3</text>
  <text x="487" y="115" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">⌊5 / 3⌋ = 1 ✓</text>

  <!-- Panel 2：示例 3 -->
  <rect x="16" y="162" width="608" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="183" text-anchor="start" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">示例 3：s = "au 123"（空格同样不是字母）</text>
  <rect x="40" y="192" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="78" y="192" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <rect x="116" y="192" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="212" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">␣</text>
  <rect x="154" y="192" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="192" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="192" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="56" y="238" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="94" y="238" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="132" y="238" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <text x="170" y="238" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <text x="208" y="238" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <text x="246" y="238" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <rect x="300" y="192" width="308" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="213" text-anchor="middle" font-size="11.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">v = 2，c = 0 → 除零保护</text>
  <text x="454" y="233" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">返回 0 ✓（不特判就是除以零）</text>

  <!-- Panel 3：反例 -->
  <rect x="16" y="266" width="608" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="287" text-anchor="start" font-size="11.5" font-weight="bold" fill="#a0433f" filter="url(#rough2)">反例：s = "ab 1"——误分类在官方样例上恰好撞对，在这里翻车</text>
  <rect x="40" y="298" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="78" y="298" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="116" y="298" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="318" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">␣</text>
  <rect x="154" y="298" width="32" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="56" y="344" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">元</text>
  <text x="94" y="344" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">辅</text>
  <text x="132" y="344" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <text x="170" y="344" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">丢</text>
  <text x="214" y="312" text-anchor="start" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">✓ 正确分类：a→v，b→c，空格/1 丢弃 → v=1，c=1 → 1</text>
  <text x="214" y="334" text-anchor="start" font-size="10.5" fill="#a0433f" filter="url(#rough2)">✗ 误写「不是元音就 c++」：v=1，c=3 → ⌊1 / 3⌋ = 0</text>
  <text x="214" y="356" text-anchor="start" font-size="9.5" fill="#a0433f" filter="url(#rough2)">示例 3 同样误算（v=2、c=3 → 0）碰巧等于正确答案——bug 隐蔽</text>

  <!-- 底部结论 -->
  <rect x="60" y="382" width="520" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">结论：先 isalpha 拦非字母（样例测不出的坑），再判元音；c = 0 的保护由示例 3 把关</text>
</svg>
