<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一次扫描，套一条公式</text>

  <rect x="175" y="42" width="170" height="32" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#2f5423" filter="url(#rough2)">输入：排列 nums（长 n）</text>

  <path d="M 260 74 L 260 94" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="140" y="98" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="13" fill="#2c4360" filter="url(#rough2)">一次扫描：i = pos(1)，j = pos(n)</text>

  <path d="M 260 132 L 260 156" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <polygon points="260,158 352,202 260,246 168,202" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="207" text-anchor="middle" font-size="14" fill="#7a5a20" filter="url(#rough2)">i &lt; j ?</text>

  <path d="M 168 202 L 92 202 L 92 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="193" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是：不交叉</text>

  <rect x="18" y="274" width="150" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="297" text-anchor="middle" font-size="13" fill="#2f5423" filter="url(#rough2)">ans = i + (n-1-j)</text>

  <path d="M 352 202 L 428 202 L 428 270" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="193" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否：i &gt; j</text>

  <rect x="318" y="274" width="184" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="294" text-anchor="middle" font-size="13" fill="#8a2f2c" filter="url(#rough2)">ans = i + (n-1-j) - 1</text>
  <text x="410" y="314" text-anchor="middle" font-size="11" fill="#8a2f2c" filter="url(#rough2)">（交叉省一步）</text>

  <path d="M 93 312 L 93 350 L 244 350" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M 410 326 L 410 350 L 276 350" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M 260 350 L 260 368" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="195" y="372" width="130" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="393" text-anchor="middle" font-size="13" fill="#2f5423" filter="url(#rough2)">返回 ans</text>
</svg>
