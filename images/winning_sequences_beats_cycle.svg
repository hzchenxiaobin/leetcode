<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">克制环与每轮得分差 Δ</text>
  <path d="M 180 42 Q 280 50 380 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: beats cycle ===== -->
  <text x="170" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 三生物互相克制（环）</text>
  <text x="170" y="90" text-anchor="middle" font-size="10" fill="#888">箭头 X → Y 表示 X 胜 Y，X 得一分</text>

  <!-- F node -->
  <g filter="url(#sk)"><circle cx="170" cy="140" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="170" y="141" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6d1f">F</text>
  <text x="170" y="159" text-anchor="middle" font-size="10" fill="#8a6d1f">火龙</text>

  <!-- W node -->
  <g filter="url(#sk)"><circle cx="90" cy="290" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="90" y="291" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b5a88">W</text>
  <text x="90" y="309" text-anchor="middle" font-size="10" fill="#2b5a88">水蛇</text>

  <!-- E node -->
  <g filter="url(#sk)"><circle cx="250" cy="290" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="250" y="291" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">E</text>
  <text x="250" y="309" text-anchor="middle" font-size="10" fill="#2e6e2e">地精</text>

  <!-- F beats E -->
  <path d="M 184 166 Q 230 205 236 262" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="252" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F 胜 E</text>
  <!-- E beats W -->
  <path d="M 220 290 Q 170 312 120 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="170" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">E 胜 W</text>
  <!-- W beats F -->
  <path d="M 104 264 Q 128 205 156 166" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="100" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">W 胜 F</text>

  <!-- same-move note -->
  <g filter="url(#sk)">
    <rect x="55" y="344" width="230" height="32" rx="8" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="170" y="364" text-anchor="middle" font-size="10.5" fill="#777">同招（如 F 对 F）→ 双方均 0 分</text>

  <!-- ===== Panel 2: delta table ===== -->
  <text x="443" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② Δ 表：Δ = Bob 分 − Alice 分</text>

  <!-- header row -->
  <g filter="url(#sk)"><rect x="340" y="88" width="50" height="24" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="365" y="104" text-anchor="middle" font-size="9" fill="#888">b \ a</text>
  <g filter="url(#sk)"><rect x="390" y="88" width="52" height="24" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="416" y="104" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">a=F</text>
  <g filter="url(#sk)"><rect x="442" y="88" width="52" height="24" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="468" y="104" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">a=W</text>
  <g filter="url(#sk)"><rect x="494" y="88" width="52" height="24" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="520" y="104" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">a=E</text>

  <!-- row b=F -->
  <g filter="url(#sk)"><rect x="340" y="112" width="50" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="365" y="132" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">b=F</text>
  <g filter="url(#sk)"><rect x="390" y="112" width="52" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/></g>
  <text x="416" y="133" text-anchor="middle" font-size="13" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="442" y="112" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="468" y="133" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">−1</text>
  <g filter="url(#sk)"><rect x="494" y="112" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="520" y="133" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">+1</text>

  <!-- row b=W -->
  <g filter="url(#sk)"><rect x="340" y="144" width="50" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="365" y="164" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">b=W</text>
  <g filter="url(#sk)"><rect x="390" y="144" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="416" y="165" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">+1</text>
  <g filter="url(#sk)"><rect x="442" y="144" width="52" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/></g>
  <text x="468" y="165" text-anchor="middle" font-size="13" fill="#999">0</text>
  <g filter="url(#sk)"><rect x="494" y="144" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="520" y="165" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">−1</text>

  <!-- row b=E -->
  <g filter="url(#sk)"><rect x="340" y="176" width="50" height="32" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
  <text x="365" y="196" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">b=E</text>
  <g filter="url(#sk)"><rect x="390" y="176" width="52" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="416" y="197" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">−1</text>
  <g filter="url(#sk)"><rect x="442" y="176" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/></g>
  <text x="468" y="197" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">+1</text>
  <g filter="url(#sk)"><rect x="494" y="176" width="52" height="32" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1"/></g>
  <text x="520" y="197" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- formula chip -->
  <g filter="url(#sk)">
    <rect x="322" y="222" width="232" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="338" y="243" font-size="10" fill="#444">按列看：a 固定时，</text>
  <text x="338" y="262" font-size="10.5" fill="#2b5a88" font-weight="bold">Bob 三招的 Δ 恰为 {+1, 0, −1} 各一次</text>

  <!-- ===== key insight ===== -->
  <g filter="url(#sk)">
    <rect x="30" y="388" width="500" height="58" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="48" y="409" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察</text>
  <text x="48" y="427" font-size="11" fill="#444">每轮 Δ ∈ {−1, 0, +1} → n 轮后总分差 d ∈ [−n, n]，恰好 2n+1 档</text>
  <text x="48" y="444" font-size="11" fill="#444">分差逐轮可累加、相邻约束只看上一招 → (i, 末招, 分差) 即充分状态</text>
</svg>
