<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：多源 BFS + 同层冲突取 max</text>

  <rect x="170" y="32" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="55" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">初始化：dist 全 −1，color 全 0，源点入队（dist = 0）</text>

  <path d="M 310 70 L 310 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="310,88 395,116 310,144 225,116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="121" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">队列非空？</text>

  <path d="M 225 116 L 160 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="192" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否（空）</text>

  <rect x="40" y="98" width="118" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="99" y="120" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">返回 color 网格</text>

  <path d="M 310 144 L 310 164" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="323" y="160" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="180" y="168" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="189" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">出队队首 (r, c)</text>

  <path d="M 310 202 L 310 214" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="180" y="218" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="239" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">枚举 (r, c) 的四邻 (nr, nc)</text>

  <path d="M 310 252 L 310 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="310,268 415,300 310,332 205,300" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="305" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist[nr][nc] == −1 ?</text>

  <path d="M 415 300 L 444 300" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="428" y="292" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="448" y="278" width="134" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="515" y="296" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">首次到达：着色并入队</text>
  <text x="515" y="312" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">dist+1、继承颜色</text>

  <path d="M 310 332 L 310 360" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="322" y="352" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <polygon points="310,364 422,398 310,432 198,398" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="395" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist[nr][nc] ==</text>
  <text x="310" y="411" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist[r][c] + 1 ?</text>

  <path d="M 422 398 L 444 398" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="430" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <rect x="448" y="376" width="134" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="515" y="394" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">同层冲突：仅更新</text>
  <text x="515" y="410" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">color 取 max（不入队）</text>

  <path d="M 310 432 L 310 448" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="310" y="468" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否：跳过（dist 更小，早已着色，颜色不再改变）</text>

  <path d="M 582 300 L 592 300" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 582 398 L 592 398" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 592 398 L 592 116" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 592 116 L 399 116" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="497" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">处理完继续循环</text>
</svg>
