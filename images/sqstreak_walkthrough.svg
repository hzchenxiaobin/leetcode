<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [4,3,6,16,8,2] 降序填表</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="60" y="74" font-size="12" fill="#888">降序处理 16, 8, 6, 4, 3, 2 —— 轮到 v 时，更大的 v² 早已算好</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="70" y="84" width="580" height="32" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="120" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">v</text>
  <text x="230" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">v²</text>
  <text x="355" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">v² ∈ S ?</text>
  <text x="500" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">dp[v]</text>
  <text x="615" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">ans</text>

  <!-- table rows -->
  <g filter="url(#sk)">
    <rect x="70" y="116" width="580" height="37" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <rect x="70" y="153" width="580" height="37" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <rect x="70" y="190" width="580" height="37" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <rect x="70" y="227" width="580" height="37" fill="#eaf6ee" stroke="#c9d4de" stroke-width="1.2"/>
    <rect x="70" y="264" width="580" height="37" fill="#ffffff" stroke="#c9d4de" stroke-width="1.2"/>
    <rect x="70" y="301" width="580" height="37" fill="#fff3d6" stroke="#c98a2b" stroke-width="1.5"/>
    <path d="M 170 84 L 170 338 M 290 84 L 290 338 M 420 84 L 420 338 M 580 84 L 580 338" stroke="#c9d4de" stroke-width="1.2" fill="none"/>
  </g>

  <text x="120" y="139" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="230" y="139" text-anchor="middle" font-size="13" fill="#333">256</text>
  <text x="355" y="139" text-anchor="middle" font-size="13" fill="#999">✗</text>
  <text x="500" y="139" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="615" y="139" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="120" y="176" text-anchor="middle" font-size="13" fill="#333">8</text>
  <text x="230" y="176" text-anchor="middle" font-size="13" fill="#333">64</text>
  <text x="355" y="176" text-anchor="middle" font-size="13" fill="#999">✗</text>
  <text x="500" y="176" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="615" y="176" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="120" y="213" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="230" y="213" text-anchor="middle" font-size="13" fill="#333">36</text>
  <text x="355" y="213" text-anchor="middle" font-size="13" fill="#999">✗</text>
  <text x="500" y="213" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="615" y="213" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="120" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="230" y="250" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="355" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="500" y="250" text-anchor="middle" font-size="12.5" fill="#2e6e2e">1 + dp[16] = 2</text>
  <text x="615" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>

  <text x="120" y="287" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="230" y="287" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="355" y="287" text-anchor="middle" font-size="13" fill="#999">✗</text>
  <text x="500" y="287" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="615" y="287" text-anchor="middle" font-size="13" fill="#333">2</text>

  <text x="120" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">2</text>
  <text x="230" y="324" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="355" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="500" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">1 + dp[4] = 3</text>
  <text x="615" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">3</text>

  <!-- chain visual -->
  <g filter="url(#sk)">
    <rect x="80" y="352" width="56" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="170" y="352" width="56" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="260" y="352" width="56" height="38" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <path d="M 136 371 L 166 371" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 226 371 L 256 371" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="108" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="198" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="288" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">16</text>
  <text x="151" y="364" text-anchor="middle" font-size="10" fill="#2e6e2e">平方</text>
  <text x="241" y="364" text-anchor="middle" font-size="10" fill="#2e6e2e">平方</text>
  <text x="430" y="376" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">最长链长度 3 ⟹ 返回 3 ✓</text>

  <text x="60" y="418" font-size="11" fill="#888">示例 2（[2,3,5,6,7]）：所有 v² ∉ S，dp 全为 1，ans = 1 &lt; 2 ⟹ 返回 −1</text>
</svg>
