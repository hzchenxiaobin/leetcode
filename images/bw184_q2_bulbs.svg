<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一个灯泡最多照亮 3 个位置 ⇒ 至少 ceil(brightness / 3) 个</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">n = 5、brightness = 5 时 2 个灯泡就够（位置 1 与 4）</text>
  <rect x="90" y="100" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="124" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="166" y="100" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="242" y="100" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="276" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="318" y="100" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="352" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="394" y="100" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="428" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="124" y="172" text-anchor="middle" font-size="9.5" fill="#888">照亮</text>
  <text x="352" y="172" text-anchor="middle" font-size="9.5" fill="#888">照亮</text>
  <ellipse cx="124" cy="210" rx="20" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="215" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">💡</text>
  <ellipse cx="352" cy="210" rx="20" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="215" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">💡</text>
  <text x="124" y="246" text-anchor="middle" font-size="9.5" fill="#8a6a20">灯泡在 1：照亮 0,1,2</text>
  <text x="352" y="246" text-anchor="middle" font-size="9.5" fill="#8a6a20">灯泡在 4：照亮 3,4</text>
  <rect x="40" y="268" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 个灯泡 = ceil(5/3) 个；每个灯泡覆盖「自己 + 左右邻居」</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">隔 3 格放一个灯泡即可让覆盖不重叠、效率最高</text>
  <rect x="40" y="324" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">总能量 = 每单位时间的最少灯泡数 × 有效时间单位总数</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">brightness ≤ n 保证 ceil(b/3) 个灯泡总能在长度为 n 的排上摆开</text>
</svg>
