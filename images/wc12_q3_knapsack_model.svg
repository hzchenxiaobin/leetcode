<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一和零 = 二维费用的 0-1 背包</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个字符串是一件物品，费用 = (0 的个数 z, 1 的个数 o)，价值恒为 1</text>

  <text x="28" y="74" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 物品 = 字符串（只看计数，与顺序无关）</text>

  <rect x="28" y="86" width="238" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="42" y="107" font-size="11" fill="#3a4a66" filter="url(#rough2)">"10"      →  (z=1, o=1)</text>

  <rect x="28" y="124" width="238" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="42" y="145" font-size="11" fill="#3a4a66" filter="url(#rough2)">"0001"    →  (z=3, o=1)</text>

  <rect x="28" y="162" width="238" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="42" y="183" font-size="11" fill="#8a3a36" filter="url(#rough2)">"111001"  →  (z=2, o=4) ✗</text>

  <text x="28" y="212" font-size="10" fill="#8a3a36" filter="url(#rough2)">o = 4 &gt; n = 3：单串自身就超标，永远选不进</text>
  <text x="28" y="228" font-size="10" fill="#888" filter="url(#rough2)">这类物品先剪掉，能省下大量无效转移</text>

  <text x="310" y="74" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 背包容量是二维的 (m, n)</text>

  <rect x="318" y="104" width="180" height="112" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.1" fill="#e8f0fe">
    <rect x="318" y="104" width="30" height="28"/><rect x="348" y="104" width="30" height="28"/>
    <rect x="378" y="104" width="30" height="28"/><rect x="408" y="104" width="30" height="28"/>
    <rect x="438" y="104" width="30" height="28"/><rect x="468" y="104" width="30" height="28"/>
    <rect x="318" y="132" width="30" height="28"/><rect x="348" y="132" width="30" height="28"/>
    <rect x="378" y="132" width="30" height="28"/><rect x="408" y="132" width="30" height="28"/>
    <rect x="438" y="132" width="30" height="28"/><rect x="468" y="132" width="30" height="28"/>
    <rect x="318" y="160" width="30" height="28"/><rect x="348" y="160" width="30" height="28"/>
    <rect x="378" y="160" width="30" height="28"/><rect x="408" y="160" width="30" height="28"/>
    <rect x="438" y="160" width="30" height="28"/><rect x="468" y="160" width="30" height="28"/>
    <rect x="318" y="188" width="30" height="28"/><rect x="348" y="188" width="30" height="28"/>
    <rect x="378" y="188" width="30" height="28"/><rect x="408" y="188" width="30" height="28"/>
    <rect x="438" y="188" width="30" height="28"/><rect x="468" y="188" width="30" height="28"/>
  </g>
  <rect x="468" y="188" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="483" y="206" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">ans</text>

  <g font-size="9.5" fill="#666" filter="url(#rough2)" text-anchor="end">
    <text x="312" y="122">j=0</text><text x="312" y="150">j=1</text>
    <text x="312" y="178">j=2</text><text x="312" y="206">j=3</text>
  </g>
  <g font-size="9.5" fill="#666" filter="url(#rough2)" text-anchor="middle">
    <text x="333" y="228">i=0</text><text x="363" y="228">1</text><text x="393" y="228">2</text>
    <text x="423" y="228">3</text><text x="453" y="228">4</text><text x="483" y="228">5</text>
  </g>

  <text x="310" y="250" font-size="10" fill="#555" filter="url(#rough2)">格子 (i, j)：零 ≤ i 且一 ≤ j 时最多选几件</text>
  <text x="310" y="266" font-size="10" fill="#3a5a30" filter="url(#rough2)">答案就是右上角 dp[m][n]，无需再取 max</text>

  <rect x="28" y="280" width="504" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="301" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">转移：dp[i][j] = max( dp[i][j], dp[i−z][j−o] + 1 )</text>
  <text x="44" y="320" font-size="10" fill="#555" filter="url(#rough2)">不选这件物品（保留旧值） vs 选它（让出 (z, o) 的容量，件数 +1），两者取大</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">目标函数是「件数最多」，所以每件物品价值都是 1；容量约束是二维的「至多」</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 1：m = 5, n = 3，"111001" 因 o = 4 被剪掉，其余 4 件刚好凑成答案 4</text>
</svg>
