<svg xmlns="http://www.w3.org/2000/svg" width="660" height="580" viewBox="0 0 660 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="580" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：从 (0,0) 出发，在 8 个骑士邻居中找值为 k 的格子</text>
  <path d="M 160 44 Q 330 52 500 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="255" y="58" width="150" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="81" text-anchor="middle" font-size="13" fill="#2c4a6e">读入 grid，共 n² 步</text>
  <path d="M 330 94 L 330 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- d1: start check -->
  <g filter="url(#sk)">
    <polygon points="230,150 330,118 430,150 330,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="146" text-anchor="middle" font-size="12.5" fill="#7a5415">grid[0][0] == 0 ?</text>
  <text x="330" y="162" text-anchor="middle" font-size="10" fill="#a07818">（起点在左上角？）</text>
  <text x="452" y="142" font-size="11" fill="#b85450" filter="url(#sk)">No</text>
  <path d="M 430 150 L 476 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="480" y="132" width="132" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="546" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">return false</text>
  <text x="340" y="200" font-size="11" fill="#4a7a3a" filter="url(#sk)">Yes</text>
  <path d="M 330 182 L 330 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- r1: init -->
  <g filter="url(#sk)">
    <rect x="240" y="212" width="180" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="235" text-anchor="middle" font-size="13" fill="#2e5e2e">cur = (0,0)，k = 1</text>
  <path d="M 330 248 L 330 268" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- d2: loop condition -->
  <g filter="url(#sk)">
    <polygon points="230,302 330,270 430,302 330,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="306" text-anchor="middle" font-size="12.5" fill="#7a5415">k ≤ n² − 1 ?</text>
  <text x="452" y="294" font-size="11" fill="#4a7a3a" filter="url(#sk)">No</text>
  <path d="M 430 302 L 476 302" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="480" y="284" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="546" y="307" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">return true</text>
  <text x="340" y="352" font-size="11" fill="#4a7a3a" filter="url(#sk)">Yes</text>
  <path d="M 330 334 L 330 358" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- r2: find next -->
  <g filter="url(#sk)">
    <rect x="205" y="362" width="250" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="330" y="383" text-anchor="middle" font-size="12.5" fill="#2c4a6e">在 cur 的 8 个骑士邻居中</text>
  <text x="330" y="402" text-anchor="middle" font-size="12.5" fill="#2c4a6e">找 grid 值为 k 的格子</text>
  <path d="M 330 414 L 330 436" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- d3: found? -->
  <g filter="url(#sk)">
    <polygon points="245,470 330,440 415,470 330,500" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="467" text-anchor="middle" font-size="12.5" fill="#7a5415">找到 ?</text>
  <text x="437" y="462" font-size="11" fill="#b85450" filter="url(#sk)">No</text>
  <path d="M 415 470 L 464 470" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="468" y="452" width="132" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="534" y="475" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">return false</text>
  <text x="340" y="518" font-size="11" fill="#4a7a3a" filter="url(#sk)">Yes</text>
  <path d="M 330 500 L 330 524" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- r3: advance -->
  <g filter="url(#sk)">
    <rect x="245" y="528" width="170" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="551" text-anchor="middle" font-size="13" fill="#2e5e2e">cur ← 邻居，k ← k+1</text>

  <!-- loop back edge to d2 -->
  <path d="M 245 546 L 96 546 L 96 302 L 224 302" stroke="#7a94b8" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">k 自增后回到循环</text>
</svg>
