<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：单次扫描计数判定（O(n)）</text>
  <path d="M 190 38 Q 280 44 370 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- start box -->
  <rect x="160" y="54" width="240" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">初始化：target = m×(k−1)</text>
  <text x="280" y="88" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">count = 0，i = 0</text>

  <path d="M 280 96 L 280 118" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond 1: range check -->
  <polygon points="280,124 340,152 280,180 220,152" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i + m &lt; n ?</text>
  <text x="362" y="146" font-size="10" font-weight="bold" fill="#b85450">否</text>
  <path d="M 340 152 L 396 152" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="400" y="134" width="112" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 false</text>
  <text x="290" y="198" font-size="10" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 280 180 L 280 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- compare box -->
  <rect x="190" y="214" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">比较 arr[i] 与 arr[i+m]</text>

  <path d="M 280 254 L 280 276" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond 2: equal? -->
  <polygon points="280,282 335,308 280,334 225,308" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">相等？</text>
  <text x="198" y="300" font-size="10" font-weight="bold" fill="#9a7020">否</text>
  <path d="M 225 308 L 172 308" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="66" y="290" width="106" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">count = 0</text>
  <text x="290" y="352" font-size="10" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 280 334 L 280 344" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- count++ box -->
  <rect x="203" y="350" width="154" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">count++</text>

  <path d="M 280 388 L 280 406" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- diamond 3: threshold check -->
  <polygon points="280,414 360,446 280,478 200,446" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="451" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">count ≥ target ?</text>
  <text x="380" y="436" font-size="10" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 360 446 L 404 446" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="408" y="428" width="118" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="467" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 true ⭐</text>
  <text x="292" y="496" font-size="10" font-weight="bold" fill="#9a7020">否</text>
  <path d="M 280 478 L 280 506" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="210" y="512" width="140" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="536" text-anchor="middle" font-size="11.5" fill="#334" filter="url(#rough2)">i++，回到循环条件</text>

  <!-- count=0 merges into i++ -->
  <path d="M 119 326 L 119 522 L 204 522" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 210 531 L 46 531 L 46 152 L 214 152" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="280" y="598" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个位置只比较一次：时间 O(n)，空间 O(1)；命中阈值立即短路返回 true</text>
</svg>
