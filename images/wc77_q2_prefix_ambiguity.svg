<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">为什么不同单词会撞码：同一个点划串有两种切分</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">变长编码 + 字母之间不留分隔符 ⇒ 前缀可以被重复利用</text>

  <!-- 拼接后的符号串（7 位） -->
  <rect x="96" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="116" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">-</text>
  <rect x="136" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="156" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">-</text>
  <rect x="176" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="196" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">.</text>
  <rect x="216" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="236" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">.</text>
  <rect x="256" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="276" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">.</text>
  <rect x="296" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="316" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">-</text>
  <rect x="336" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="356" y="108" text-anchor="middle" font-size="19" fill="#3a4a66" filter="url(#rough2)">.</text>
  <text x="398" y="100" font-size="11" fill="#666" filter="url(#rough2)">拼接结果：</text>
  <text x="398" y="118" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">--...-.</text>

  <!-- 切分 A -->
  <path d="M 96 140 L 96 146 L 376 146 L 376 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 216 146 L 216 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 296 146 L 296 140" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="20" y="163" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切分 A</text>
  <text x="156" y="166" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">g = --.</text>
  <text x="256" y="166" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">i = ..</text>
  <text x="336" y="166" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">n = -.</text>
  <path d="M 380 160 L 394 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="398" y="146" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="165" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">gin</text>

  <text x="260" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同一条串，两种合法切法（列对齐）</text>

  <!-- 切分 B -->
  <path d="M 96 218 L 96 224 L 376 224 L 376 218" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 256 224 L 256 218" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 296 224 L 296 218" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="20" y="241" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">切分 B</text>
  <text x="176" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">z = --..</text>
  <text x="276" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">e = .</text>
  <text x="336" y="244" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">n = -.</text>
  <path d="M 380 238 L 394 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="398" y="224" width="74" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="243" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">zen</text>

  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">关键：z 的码 --.. 以 g 的码 --. 为前缀，e 的码 . 又恰好补在那一位</text>
  <text x="260" y="306" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">所以去重对象只能是「翻译后的点划串」，绝不能是原单词</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若在字母之间插入分隔符，这类撞码就会消失，题目也会退化成「数不同单词」</text>
</svg>
