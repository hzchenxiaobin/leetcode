<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [1, 2, 8, 4]，k = 7，m = 3</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#888">bit 30 … 5 的代价只会更大，均不可行；表中从 bit 4 开始列出</text>

  <!-- table header -->
  <g font-size="11" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="55" y="88" width="70" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="90" y="110" fill="#2b6e9e">位 b</text>
    <g filter="url(#sk)"><rect x="125" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="165" y="110" fill="#2b6e9e">R = ans|2^b</text>
    <g filter="url(#sk)"><rect x="205" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="245" y="110" fill="#2b6e9e">c_R(1)</text>
    <g filter="url(#sk)"><rect x="285" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="325" y="110" fill="#2b6e9e">c_R(2)</text>
    <g filter="url(#sk)"><rect x="365" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="405" y="110" fill="#2b6e9e">c_R(8)</text>
    <g filter="url(#sk)"><rect x="445" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="485" y="110" fill="#2b6e9e">c_R(4)</text>
    <g filter="url(#sk)"><rect x="525" y="88" width="180" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="615" y="110" fill="#2b6e9e">最小 3 项之和 S</text>
    <g filter="url(#sk)"><rect x="705" y="88" width="80" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="745" y="110" fill="#2b6e9e">S ≤ 7 ?</text>
    <g filter="url(#sk)"><rect x="785" y="88" width="100" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
    <text x="835" y="110" fill="#2b6e9e">ans</text>
  </g>

  <!-- row bit4 -->
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="55" y="124" width="70" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="90" y="149" fill="#666" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="125" y="124" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="149" fill="#666" font-family="monospace">16</text>
    <g filter="url(#sk)"><rect x="205" y="124" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="245" y="149" fill="#999" font-family="monospace">15</text>
    <g filter="url(#sk)"><rect x="285" y="124" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="325" y="149" fill="#999" font-family="monospace">14</text>
    <g filter="url(#sk)"><rect x="365" y="124" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="405" y="149" fill="#2e6e2e" font-weight="bold" font-family="monospace">8</text>
    <g filter="url(#sk)"><rect x="445" y="124" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="485" y="149" fill="#2e6e2e" font-weight="bold" font-family="monospace">12</text>
    <g filter="url(#sk)"><rect x="525" y="124" width="180" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="615" y="149" fill="#666" font-family="monospace">8+12+14 = 34</text>
    <g filter="url(#sk)"><rect x="705" y="124" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="745" y="149" fill="#b03a3a" font-weight="bold">✗</text>
    <g filter="url(#sk)"><rect x="785" y="124" width="100" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="835" y="149" fill="#666" font-family="monospace">0</text>
  </g>

  <!-- row bit3 -->
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="55" y="164" width="70" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="90" y="189" fill="#666" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="125" y="164" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="189" fill="#666" font-family="monospace">8</text>
    <g filter="url(#sk)"><rect x="205" y="164" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="245" y="189" fill="#999" font-family="monospace">7</text>
    <g filter="url(#sk)"><rect x="285" y="164" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="325" y="189" fill="#2e6e2e" font-weight="bold" font-family="monospace">6</text>
    <g filter="url(#sk)"><rect x="365" y="164" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="405" y="189" fill="#2e6e2e" font-weight="bold" font-family="monospace">0</text>
    <g filter="url(#sk)"><rect x="445" y="164" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="485" y="189" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="525" y="164" width="180" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="615" y="189" fill="#666" font-family="monospace">0+4+6 = 10</text>
    <g filter="url(#sk)"><rect x="705" y="164" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="745" y="189" fill="#b03a3a" font-weight="bold">✗</text>
    <g filter="url(#sk)"><rect x="785" y="164" width="100" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="835" y="189" fill="#666" font-family="monospace">0</text>
  </g>

  <!-- row bit2 (success, green) -->
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="55" y="204" width="70" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="90" y="229" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="125" y="204" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="165" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="205" y="204" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="245" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">3</text>
    <g filter="url(#sk)"><rect x="285" y="204" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="325" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">2</text>
    <g filter="url(#sk)"><rect x="365" y="204" width="80" height="40" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
    <text x="405" y="229" fill="#999" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="445" y="204" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="485" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">0</text>
    <g filter="url(#sk)"><rect x="525" y="204" width="180" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="615" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">0+2+3 = 5</text>
    <g filter="url(#sk)"><rect x="705" y="204" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="745" y="229" fill="#2e6e2e" font-weight="bold">✓</text>
    <g filter="url(#sk)"><rect x="785" y="204" width="100" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="835" y="229" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
  </g>

  <!-- row bit1 -->
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="55" y="244" width="70" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="90" y="269" fill="#666" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="125" y="244" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="269" fill="#666" font-family="monospace">6</text>
    <g filter="url(#sk)"><rect x="205" y="244" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="245" y="269" fill="#2e6e2e" font-weight="bold" font-family="monospace">5</text>
    <g filter="url(#sk)"><rect x="285" y="244" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="325" y="269" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="365" y="244" width="80" height="40" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
    <text x="405" y="269" fill="#999" font-family="monospace">6</text>
    <g filter="url(#sk)"><rect x="445" y="244" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="485" y="269" fill="#2e6e2e" font-weight="bold" font-family="monospace">2</text>
    <g filter="url(#sk)"><rect x="525" y="244" width="180" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="615" y="269" fill="#666" font-family="monospace">2+4+5 = 11</text>
    <g filter="url(#sk)"><rect x="705" y="244" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="745" y="269" fill="#b03a3a" font-weight="bold">✗</text>
    <g filter="url(#sk)"><rect x="785" y="244" width="100" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="835" y="269" fill="#666" font-family="monospace">4</text>
  </g>

  <!-- row bit0 -->
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="55" y="284" width="70" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="90" y="309" fill="#666" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="125" y="284" width="80" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="165" y="309" fill="#666" font-family="monospace">5</text>
    <g filter="url(#sk)"><rect x="205" y="284" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="245" y="309" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
    <g filter="url(#sk)"><rect x="285" y="284" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="325" y="309" fill="#2e6e2e" font-weight="bold" font-family="monospace">3</text>
    <g filter="url(#sk)"><rect x="365" y="284" width="80" height="40" fill="#f0ede4" stroke="#bbb" stroke-width="1"/></g>
    <text x="405" y="309" fill="#999" font-family="monospace">5</text>
    <g filter="url(#sk)"><rect x="445" y="284" width="80" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="485" y="309" fill="#2e6e2e" font-weight="bold" font-family="monospace">1</text>
    <g filter="url(#sk)"><rect x="525" y="284" width="180" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="615" y="309" fill="#666" font-family="monospace">1+3+4 = 8</text>
    <g filter="url(#sk)"><rect x="705" y="284" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
    <text x="745" y="309" fill="#b03a3a" font-weight="bold">✗</text>
    <g filter="url(#sk)"><rect x="785" y="284" width="100" height="40" fill="#faf8f2" stroke="#bbb" stroke-width="1"/></g>
    <text x="835" y="309" fill="#666" font-family="monospace">4</text>
  </g>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="55" y="356" width="500" height="110" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="75" y="382" font-size="12" font-weight="bold" fill="#2e6e2e">最终答案 ans = 4 = (100)₂</text>
  <text x="75" y="408" font-size="11" fill="#444">构造：选 {1, 2, 4}，分别 +3、+2、+0 → {4, 4, 4}</text>
  <text x="75" y="430" font-size="11" fill="#444">总代价 3 + 2 + 0 = 5 ≤ 7 = k，AND = 4 &amp; 4 &amp; 4 = 4</text>
  <text x="75" y="452" font-size="10" fill="#888">与官方解释一致（元素 8 落选：c₄(8) = 4 太大）</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="585" y="356" width="340" height="110" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="605" y="382" font-size="12" font-weight="bold" fill="#7a5415">注意 c_R(8) 不是简单差值！</text>
  <text x="605" y="406" font-size="11" fill="#444" font-family="monospace">R=6: 8 → 1110₂ = 14，c = 6</text>
  <text x="605" y="428" font-size="11" fill="#444" font-family="monospace">R=5: 8 → 1101₂ = 13，c = 5</text>
  <text x="605" y="450" font-size="10" fill="#888">只能 +1 不能回退，「跳位」代价必须按构造法算</text>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="55" y="490" width="870" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="75" y="516" font-size="12" font-weight="bold" fill="#2b2b2b">读表要点</text>
  <text x="75" y="540" font-size="11" fill="#444">1. 每行绿色格子 = 该行 3 个最小的代价（绿色行 bit2 恰好整体可行：S = 5 ≤ 7 → ans 从 0 变为 4）</text>
  <text x="75" y="562" font-size="11" fill="#444">2. bit1、bit0 都只差一点（11 &gt; 7、8 &gt; 7），但预算不足就果断放弃——贪心不回头</text>
  <text x="75" y="582" font-size="11" fill="#7a2828">3. 检查每个新位时 R 必须携带已保留的位（ans | 2^b），例如 bit1 行的 R = 6 而不是 2</text>
</svg>
