<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="456" fill="#fafafa"/>
  <text x="24" y="28" font-size="15" fill="#444" text-anchor="start" font-weight="bold" filter="url(#rough2)">示例演算：3×7 矩阵，threshold = 4，答案是 2</text>

  <rect x="36" y="58" width="266" height="102" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <path d="M 74 58 L 74 160 M 112 58 L 112 160 M 150 58 L 150 160 M 188 58 L 188 160 M 226 58 L 226 160 M 264 58 L 264 160" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 92 L 302 92 M 36 126 L 302 126" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="36" y="58" width="76" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>

  <text x="55" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="93" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="131" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="169" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="207" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="245" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="283" y="79" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>

  <text x="55" y="113" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="93" y="113" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="131" y="113" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="169" y="113" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="207" y="113" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="245" y="113" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="283" y="113" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>

  <text x="55" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="93" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="131" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="169" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="207" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="245" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="283" y="147" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">2</text>

  <text x="36" y="182" font-size="11" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">橙色 2×2：1+1+1+1 = 4 ≤ 4　（可行）</text>
  <text x="36" y="202" font-size="11" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">最小 3×3：3×(1+1+3) = 15 &gt; 4　（不可行）</text>

  <rect x="320" y="56" width="300" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="334" y="78" font-size="11" fill="#3a4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">二分只需要问「存不存在」</text>
  <text x="334" y="100" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">边长 L 可行 ⟹ 所有 L' &lt; L 都可行</text>
  <text x="334" y="120" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">答案必然落在可行 / 不可行的分界上</text>
  <text x="334" y="140" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">所以只需 O(log) 轮 check</text>

  <rect x="36" y="222" width="568" height="148" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <path d="M 36 250 L 604 250 M 36 290 L 604 290 M 36 330 L 604 330" stroke="#c9d6e8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 104 222 L 104 370 M 404 222 L 404 370" stroke="#c9d6e8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70" y="241" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">mid</text>
  <text x="254" y="241" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">check(mid) 的依据</text>
  <text x="504" y="241" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold" filter="url(#rough2)">lo / hi / ans</text>

  <text x="70" y="275" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="118" y="275" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">任一单格 ≤ 4（如 1）→ true</text>
  <text x="416" y="275" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">lo=2 hi=3 ans=1</text>

  <text x="70" y="315" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="118" y="315" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">左上 2×2 和 = 4 ≤ 4 → true</text>
  <text x="416" y="315" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">lo=3 hi=3 ans=2</text>

  <text x="70" y="355" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="118" y="355" font-size="11" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">最小 3×3 和 = 15 &gt; 4 → false</text>
  <text x="416" y="355" font-size="11" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">lo=3 hi=2 ans=2</text>

  <text x="36" y="396" font-size="11.5" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">lo = 3 &gt; hi = 2，循环结束，返回 ans = 2</text>
  <text x="36" y="422" font-size="10.5" fill="#777" text-anchor="start" filter="url(#rough2)">三轮 check 共 O(3 × 21) 次 O(1) 查询，远少于枚举全部边长与位置</text>
  <text x="36" y="442" font-size="10.5" fill="#777" text-anchor="start" filter="url(#rough2)">边长 2 可行、边长 3 不可行 ⇒ 最大可行边长恰为 2</text>
</svg>
