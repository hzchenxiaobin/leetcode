<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">check(t)：排序后从左到右贪心扫描</text>

  <!-- sorted array row -->
  <text x="24" y="74" font-size="12" fill="#888" filter="url(#rough2)">排序后 →</text>
  <rect x="140" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[0]</text>
  <rect x="198" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[1]</text>
  <rect x="256" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[2]</text>
  <rect x="314" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="337" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[3]</text>
  <rect x="372" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[4]</text>
  <rect x="430" y="54" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="75" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[5]</text>

  <!-- branch arrows -->
  <path d="M 180 94 L 140 116" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 440 94 L 430 116" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <!-- Case A: pair up -->
  <rect x="36" y="120" width="264" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="168" y="142" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 A：a[i+1] − a[i] ≤ t</text>
  <rect x="86" y="160" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[i]</text>
  <rect x="150" y="160" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[i+1]</text>
  <path d="M 109 158 Q 141 128 173 158" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="109" cy="158" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="173" cy="158" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="141" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">配对成功，cnt++</text>
  <text x="168" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i += 2：两个元素一起消费</text>
  <text x="168" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">直觉：相邻配对最省元素</text>

  <!-- Case B: skip -->
  <rect x="316" y="120" width="228" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="12.5" fill="#a07820" font-weight="bold" filter="url(#rough2)">情形 B：a[i+1] − a[i] &gt; t</text>
  <rect x="366" y="160" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[i]</text>
  <path d="M 372 166 L 406 188" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 406 166 L 372 188" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="430" y="160" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="453" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[i+1]</text>
  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i] 报废：右边谁都配不上</text>
  <text x="430" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">i += 1：只跳过 a[i] 一个</text>
  <text x="430" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a[i+1] 保留，继续与后继尝试</text>

  <!-- why skipping is safe -->
  <rect x="36" y="288" width="508" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么单跳不亏？</text>
  <text x="290" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j &gt; i ⇒ a[j] − a[i] ≥ a[i+1] − a[i] &gt; t</text>
  <text x="290" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i] 与右侧任何元素的差都超阈值，跳过它零损失</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">「能配就配」也不亏：交换论证，见题解 §5 引理 2</text>
</svg>
