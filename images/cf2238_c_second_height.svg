<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个 u 只贡献「次高分支高度 + 1」个新集合</text>
  <path d="M 112 38 Q 380 46 648 38" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 左：三根分支柱 -->
  <rect x="20" y="46" width="340" height="338" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="36" y="66" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">u 的三个儿子分支：高度 4 / 3 / 1</text>

  <line x1="44" y1="272" x2="288" y2="272" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <line x1="152" y1="109" x2="84" y2="111" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="152" y1="109" x2="154" y2="151" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="152" y1="109" x2="224" y2="231" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="152" cy="94" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">u</text>

  <rect x="66" y="112" width="36" height="160" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="136" y="152" width="36" height="120" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="206" y="232" width="36" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="84" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">c₁</text>
  <text x="154" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c₂</text>
  <text x="224" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">c₃</text>

  <line x1="44" y1="232" x2="288" y2="232" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="44" y1="192" x2="288" y2="192" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="44" y1="152" x2="288" y2="152" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="44" y1="112" x2="288" y2="112" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="292" y="236" font-size="11" fill="#8a2a26" filter="url(#rough2)">d=1</text>
  <text x="292" y="196" font-size="11" fill="#8a2a26" filter="url(#rough2)">d=2</text>
  <text x="292" y="156" font-size="11" fill="#8a2a26" filter="url(#rough2)">d=3</text>
  <text x="292" y="116" font-size="11" fill="#8a2a26" filter="url(#rough2)">d=4</text>

  <text x="36" y="322" font-size="12" fill="#2f4a66" filter="url(#rough2)">d ≤ 3：仍有 ≥ 2 个分支活着</text>
  <text x="36" y="344" font-size="12" fill="#3c5e2e" filter="url(#rough2)">⇒ LCA = u，这一层归 u，新增 1 个</text>
  <text x="36" y="366" font-size="12" fill="#8a2a26" filter="url(#rough2)">d = 4：只剩 c₁，LCA 在 c₁ 内部，不算</text>

  <!-- 右：公式 -->
  <rect x="372" y="46" width="368" height="338" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="392" y="76" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">计数公式</text>
  <text x="392" y="108" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">h₂(u)：儿子高度的次大值</text>
  <text x="392" y="136" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">extra(u) = max(0, 1 + h₂(u))</text>
  <text x="392" y="164" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">b₂(u)：次高分支高度（默认 0）</text>
  <text x="392" y="190" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">extra(u) = b₂(u)</text>

  <line x1="392" y1="204" x2="720" y2="204" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="392" y="232" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案</text>
  <text x="392" y="260" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">ans = n + Σ b₂(u)（对所有 u 求和）</text>
  <text x="392" y="290" font-size="12" fill="#5a6b7a" filter="url(#rough2)">n：h = 0 的 n 个单点集合</text>
  <text x="392" y="314" font-size="12" fill="#5a6b7a" filter="url(#rough2)">Σ：每个 u 的「多分支层」数</text>
  <text x="392" y="344" font-size="12" fill="#5a6b7a" filter="url(#rough2)">时间 O(n)，空间 O(n)</text>
  <text x="392" y="368" font-size="12" fill="#8a2a26" filter="url(#rough2)">不足两个儿子时贡献为 0</text>
</svg>
