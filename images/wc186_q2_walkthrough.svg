  <text x="305" y="99" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5424" filter="url(#rough2)">5</text>
  <rect x="333" y="70" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="99" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5424" filter="url(#rough2)">6</text>
  <rect x="384" y="70" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
