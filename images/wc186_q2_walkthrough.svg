  <rect x="60" y="326" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="12.5" fill="#2a4660" filter="url(#rough2)">minSum = 10（a = 0：留下 [1,2,3,4]，取走两端 {5,6,1}）</text>
  <text x="260" y="370" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2a4660" filter="url(#rough2)">答案 = total − minSum = 22 − 10 = 12</text>
</svg>
