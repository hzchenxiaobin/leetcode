<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：cardPoints = [1,2,3,4,5,6,1]，k = 3</text>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">m = n − k = 4，窗口从最左滑到最右共 k + 1 = 4 个位置；橙色 = 留下，绿色 = 取走</text>

  <text x="70" y="98" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">a = 0</text>
  <rect x="78" y="70" width="46" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
