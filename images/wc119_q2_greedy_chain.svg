<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">贪心剔除链：失败即丢最大值，最多扫一遍</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">正确性靠「最大值不可能再被用上」这一单调性</text>
  <text x="30" y="74" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">剔除链：每次失败只丢掉最右边一个数</text>
  <rect x="40" y="96" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="115.0" y="122.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(3,3,6)</text>
  <text x="206" y="122" font-size="12" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">3+3=6 ✗</text>
  <rect x="40" y="186" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="115.0" y="212.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(3,3,2)</text>
  <text x="206" y="212" font-size="12" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">2+3&gt;3 ✓</text>
  <path d="M 115 144 L 115 182" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="126" y="168" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">剔除 6</text>
  <text x="40" y="268" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">为什么能剔除？若 a[n-3] + a[n-2] ≤ a[n-1]，</text>
  <text x="40" y="290" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">则任何含 a[n-1] 的三元组，另外两边之和都不超过它 → 必然失败。</text>
  <rect x="40" y="312" width="490" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="50" y="333.5" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">所以每个元素至多被剔除一次：总比较次数 ≤ n，排序才是瓶颈</text>
</svg>
