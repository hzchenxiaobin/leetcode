<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "daabcbaabcbc"，part = "abc"（m = 3）</text>

  <!-- 时间轴上的栈快照 -->
  <!-- 快照 1 -->
  <g filter="url(#rough2)">
    <rect x="36" y="56" width="88" height="110" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10"/>
    <rect x="64" y="122" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="64" y="94" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="64" y="66" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="80" y="141">d</text><text x="80" y="113">a</text><text x="80" y="85">a</text>
  </g>
  <text x="80" y="182" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">读入 d a a</text>
  <text x="80" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">无匹配</text>

  <!-- 快照 2 -->
  <g filter="url(#rough2)">
    <rect x="138" y="56" width="88" height="150" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10"/>
    <rect x="166" y="162" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="134" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="106" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="78" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="62" width="32" height="0" fill="none"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="182" y="181">d</text><text x="182" y="153">a</text>
    <text x="182" y="125">a</text><text x="182" y="97">b</text>
  </g>
  <text x="182" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">读入 b</text>
  <text x="182" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">顶3="aab" ✗</text>

  <!-- 快照 3：c 入栈弹出 -->
  <g filter="url(#rough2)">
    <rect x="240" y="56" width="88" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <rect x="268" y="162" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="268" y="134" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="268" y="106" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="268" y="78" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="284" y="181">d</text><text x="284" y="153">a</text>
    <text x="284" y="125">a</text><text x="284" y="97">b</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="308" y="94" width="18" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="317" y="110" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="284" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">读入 c：顶3="abc"</text>
  <text x="284" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓ 弹出 3 个 → daa</text>

  <!-- 快照 4 -->
  <g filter="url(#rough2)">
    <rect x="342" y="56" width="88" height="150" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10"/>
    <rect x="370" y="150" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="122" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="94" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="66" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="386" y="169">d</text><text x="386" y="141">a</text>
    <text x="386" y="113">a</text><text x="386" y="85">b</text>
  </g>
  <text x="386" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">继续 b a a b c：</text>
  <text x="386" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">再次命中弹出 → daaba</text>

  <!-- 最终 -->
  <g filter="url(#rough2)">
    <rect x="444" y="56" width="88" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <rect x="472" y="150" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="472" y="122" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="472" y="94" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="488" y="169">d</text><text x="488" y="141">a</text><text x="488" y="113">b</text>
  </g>
  <text x="488" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">末尾 b c 再命中</text>
  <text x="488" y="236" text-anchor="middle" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">答案 "dab" ✓</text>

  <!-- 快照间箭头 -->
  <g filter="url(#rough2)">
    <path d="M 128 130 L 134 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 230 130 L 236 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 332 130 L 338 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 434 130 L 440 130" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="50" y="268" width="470" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
  </g>
  <text x="285" y="290" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">12 个字符全部入栈后，栈内自底向上即最终答案 "dab"。</text>
  <text x="285" y="310" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">与官方「删最左」过程的三次删除（下标 2、4、3）一一对应。</text>

  <g filter="url(#rough2)">
    <rect x="50" y="332" width="470" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
  </g>
  <text x="285" y="352" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">注意：弹出后的匹配发生在「拼接缝」上——原串里不相邻的字符在栈里相遇，</text>
  <text x="285" y="370" text-anchor="middle" font-size="11.5" fill="#8a6a1a" filter="url(#rough2)">这正是必须用栈、而不能原地双指针删除的原因。</text>
</svg>
