<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="580" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：余数不变量判可行 → 换元归一化 → 中位数定目标</text>
  <path d="M 170 44 Q 390 54 610 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- band 1: residue invariant -->
  <text x="50" y="78" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">① 余数不变量：每次操作 ±x，元素除以 x 的余数不变 → 全部同余才可行</text>

  <text x="125" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">grid A = [[2,4],[6,8]]，x = 2</text>
  <g filter="url(#rough2)">
    <rect x="70" y="114" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="128" y="114" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="70" y="156" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="128" y="156" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="96" y="137" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="154" y="137" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">4</text>
  <text x="96" y="179" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">6</text>
  <text x="154" y="179" text-anchor="middle" font-size="13" fill="#2b4666" filter="url(#rough2)">8</text>
  <text x="125" y="212" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">mod 2 → 0 0 0 0</text>
  <g filter="url(#rough2)">
    <rect x="50" y="222" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="125" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">全部同余 → 可行 ✓</text>

  <text x="445" y="104" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">grid B = [[1,2],[3,4]]，x = 2</text>
  <g filter="url(#rough2)">
    <rect x="390" y="114" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="448" y="114" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="390" y="156" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="448" y="156" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="416" y="137" text-anchor="middle" font-size="13" fill="#8a6414" filter="url(#rough2)">1</text>
  <text x="474" y="137" text-anchor="middle" font-size="13" fill="#8a6414" filter="url(#rough2)">2</text>
  <text x="416" y="179" text-anchor="middle" font-size="13" fill="#8a6414" filter="url(#rough2)">3</text>
  <text x="474" y="179" text-anchor="middle" font-size="13" fill="#8a6414" filter="url(#rough2)">4</text>
  <text x="445" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">mod 2 → 1 0 1 0</text>
  <g filter="url(#rough2)">
    <rect x="370" y="222" width="150" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="445" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">余数不同 → 返回 −1</text>

  <!-- band 2: normalization -->
  <text x="50" y="280" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">② 换元归一化：b_i = (a_i − r) / x —— 一次操作即「某个 b_i 加 1 或减 1」</text>

  <g filter="url(#rough2)">
    <rect x="80" y="296" width="140" height="44" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="150" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a = [2, 4, 6, 8]</text>
  <text x="150" y="332" text-anchor="middle" font-size="9" fill="#778" filter="url(#rough2)">公共余数 r = 0</text>
  <path d="M 222 318 L 286 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="308" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">− r，÷ x</text>
  <g filter="url(#rough2)">
    <rect x="290" y="296" width="140" height="44" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="360" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b = [1, 2, 3, 4]</text>
  <text x="360" y="332" text-anchor="middle" font-size="9" fill="#778" filter="url(#rough2)">步长归一为 1</text>
  <path d="M 432 318 L 496 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="308" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每次操作</text>
  <g filter="url(#rough2)">
    <rect x="500" y="296" width="205" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="602" y="315" text-anchor="middle" font-size="11.5" fill="#2b4666" filter="url(#rough2)">某个 b_i 加 1 或减 1</text>
  <text x="602" y="332" text-anchor="middle" font-size="9" fill="#778" filter="url(#rough2)">目标 t′ 也必须是整数</text>

  <text x="390" y="364" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">目标值 t 必须满足 t mod x = r，对应整数 t′ = (t − r) / x → 总代价 = Σ|b_i − t′|</text>

  <!-- band 3: median -->
  <text x="50" y="406" font-size="13.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">③ 选 t′ 最小化 Σ|b_i − t′|：绝对偏差和在「中位数」处取到最小值</text>

  <g filter="url(#rough2)">
    <rect x="340" y="444" width="130" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" opacity="0.8"/>
  </g>
  <text x="405" y="438" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">中位数区间 [2, 3]</text>
  <path d="M 130 468 L 690 468" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 462 L 210 474" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 340 462 L 340 474" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 470 462 L 470 474" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 600 462 L 600 474" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <ellipse cx="210" cy="468" rx="4" ry="4" fill="#446688" filter="url(#rough2)"/>
  <ellipse cx="340" cy="468" rx="4" ry="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="470" cy="468" rx="4" ry="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="600" cy="468" rx="4" ry="4" fill="#446688" filter="url(#rough2)"/>
  <text x="210" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">2</text>
  <text x="470" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">3</text>
  <text x="600" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <text x="390" y="518" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">t′ = 2：|1−2| + |2−2| + |3−2| + |4−2| = 1 + 0 + 1 + 2 = 4</text>
  <text x="390" y="538" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">t′ = 3：|1−3| + |2−3| + |3−3| + |4−3| = 2 + 1 + 0 + 1 = 4（中间任取，最优值相同）</text>
  <text x="390" y="566" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">映射保序 → b 的中位数对应 a 的中位数：代码直接取排序后的 med = a[N/2]，最后再 ÷ x</text>
</svg>
