<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">只看每个下标被翻转次数的奇偶性</text>
  <text x="50" y="80" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">s = 0 1 0 1，k = 3（示例 2）</text>
  <text x="50" y="112" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">目标：每个 '0' 被翻奇数次，每个 '1' 被翻偶数次</text>
  <text x="70" y="156" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">下标</text>
  <text x="160" y="156" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="250" y="156" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="340" y="156" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="430" y="156" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">3</text>
  <text x="70" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[i]</text>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">需要的奇偶</text>
  <text x="160" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">奇</text>
  <text x="250" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">偶</text>
  <text x="340" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">奇</text>
  <text x="430" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">偶</text>
  <text x="70" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[i]（t = 2 时）</text>
  <text x="160" y="258" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="250" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="258" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="430" y="258" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <line x1="64" y1="164" x2="440" y2="164" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="140" width="190" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="166" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">约束一：总量</text>
  <text x="565" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Σ f[i] = t · k</text>
  <text x="565" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">同时 f[i] ≤ t</text>
  <text x="565" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（每次最多翻 1 次）</text>
  <rect x="50" y="300" width="600" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">把 f[i] 写成 r[i] + 2·g[i]（r[i] 由奇偶性固定）：</text>
  <text x="350" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">只需分配 g[i]，且 g[i] ≤ ⌊(t − r[i]) / 2⌋</text>
</svg>
