<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：极值 → 候选 → 删点对比</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="58" width="330" height="160" rx="6" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M50,100 L380,100" stroke="#446688" stroke-width="1.2"/>
    <path d="M90,58 L90,218" stroke="#446688" stroke-width="1.2"/>
    <path d="M180,58 L180,218" stroke="#446688" stroke-width="1.2"/>
    <path d="M265,58 L265,218" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="70" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">i</text>
  <text x="135" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">(x, y)</text>
  <text x="222" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">u = x+y</text>
  <text x="322" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">v = x−y</text>

  <text x="70" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="135" y="124" text-anchor="middle" font-size="12" fill="#333">(3,10)</text>
  <text x="222" y="124" text-anchor="middle" font-size="12" fill="#333">13</text>
  <text x="322" y="124" text-anchor="middle" font-size="12" fill="#333">−7</text>

  <text x="70" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="135" y="154" text-anchor="middle" font-size="12" fill="#333">(5,15)</text>
  <text x="222" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">20 ◄ max u</text>
  <text x="322" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">−10 ◄ min v</text>

  <text x="70" y="184" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="135" y="184" text-anchor="middle" font-size="12" fill="#333">(10,2)</text>
  <text x="222" y="184" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="322" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">8 ◄ max v</text>

  <text x="70" y="212" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="135" y="212" text-anchor="middle" font-size="12" fill="#333">(4,4)</text>
  <text x="222" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">8 ◄ min u</text>
  <text x="322" y="212" text-anchor="middle" font-size="12" fill="#333">0</text>

  <g filter="url(#sk)">
    <rect x="400" y="70" width="240" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="520" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">原始直径</text>
  <text x="520" y="116" text-anchor="middle" font-size="12" fill="#333">D = max(Δu, Δv)</text>
  <text x="520" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">= max(12, 18) = 18</text>

  <g filter="url(#sk)">
    <rect x="400" y="160" width="240" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="520" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">候选 C = {1, 2, 3}</text>
  <text x="520" y="202" text-anchor="middle" font-size="10.5" fill="#333">点 1 同时占 max u 与 min v；</text>
  <text x="520" y="213" text-anchor="middle" font-size="10.5" fill="#333">点 0 非极值点，不在候选中</text>

  <g filter="url(#sk)">
    <rect x="50" y="240" width="292" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="196" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">删 i=2（max v）★</text>
  <text x="196" y="282" text-anchor="middle" font-size="11.5" fill="#333">Δu′=12, Δv′=10 → 12（最优）</text>

  <g filter="url(#sk)">
    <rect x="348" y="240" width="292" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="494" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">删 i=1（max u 且 min v）</text>
  <text x="494" y="282" text-anchor="middle" font-size="11.5" fill="#333">Δu′=5, Δv′=15 → 15</text>

  <g filter="url(#sk)">
    <rect x="50" y="304" width="292" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="196" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">删 i=3（min u）</text>
  <text x="196" y="346" text-anchor="middle" font-size="11.5" fill="#333">Δu′=7, Δv′=18 → 18</text>

  <g filter="url(#sk)">
    <rect x="348" y="304" width="292" height="56" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="494" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">删 i=0（非极值点，不试）</text>
  <text x="494" y="346" text-anchor="middle" font-size="11.5" fill="#777">四个极值不动 → 直径不变 18</text>

  <path d="M 340 366 L 340 384" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="390" width="440" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="340" y="421" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">答案 = min(12, 15, 18) = 12</text>

  <text x="340" y="458" text-anchor="middle" font-size="10.5" fill="#888">删 (10,2) 后最远点对变为 (5,15) 与 (4,4)，与官方解释一致</text>
</svg>
