<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">n = 6 的逐轮走查：三行代码走出答案 3</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">种子 122 → 追加 11 → 追加 2，长度达到 6 立即停止</text>

  <!-- 表头 -->
  <rect x="36" y="62" width="488" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="81">步骤</text>
    <text x="124" y="81">i</text>
    <text x="187" y="81">s[i] 段长</text>
    <text x="271" y="81">新段字符 c</text>
    <text x="386" y="81">追加后的 s</text>
    <text x="491" y="81">len(s)</text>
  </g>

  <!-- 初始行 -->
  <rect x="36" y="92" width="488" height="32" fill="#ffffff" stroke="#ccc" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="113">初始</text>
    <text x="124" y="113">2</text>
    <text x="187" y="113">—</text>
    <text x="271" y="113">—</text>
    <text x="386" y="113" font-family="'Courier New', monospace">122</text>
    <text x="491" y="113">3</text>
  </g>

  <!-- 第 1 轮 -->
  <rect x="36" y="124" width="488" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <g font-size="11" fill="#6a5420" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="145">①</text>
    <text x="124" y="145">2</text>
    <text x="187" y="145">2</text>
    <text x="271" y="145">1（3−2）</text>
    <text x="386" y="145" font-family="'Courier New', monospace">12211</text>
    <text x="491" y="145">5</text>
  </g>

  <!-- 第 2 轮 -->
  <rect x="36" y="156" width="488" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">
    <text x="69" y="177">②</text>
    <text x="124" y="177">3</text>
    <text x="187" y="177">1</text>
    <text x="271" y="177">2（3−1）</text>
    <text x="386" y="177" font-family="'Courier New', monospace">122112</text>
    <text x="491" y="177">6</text>
  </g>

  <path d="M 491 189 L 491 199" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="215" font-size="9.5" fill="#b85450" filter="url(#rough2)">达到 n，停</text>

  <rect x="36" y="218" width="488" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54" y="240" font-size="11" fill="#3a5a30" filter="url(#rough2)">s 的前 6 位 = 1 2 2 1 1 2，其中 1 出现 3 次 ⇒ 返回 3（与官方示例一致）</text>
  <text x="54" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">若 n = 5：循环在第 ① 轮后即停（len = 5 ≥ 5），答案仍是 s[:5] = 12211 中的 3 个 1</text>

  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最后一轮追加可能一次越过 n 个位置，计数时务必截断到前 n 位</text>
</svg>
