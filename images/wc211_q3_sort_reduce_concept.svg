<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ga" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：冲突 =「年龄更小却得分更高」，排序后无冲突球队 ⟺ 得分不下降子序列</text>
  <path d="M 110 38 Q 330 46 550 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- ===== Left: (age, score) plane, example 3 ===== -->
  <text x="40" y="66" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">① 把球员画进 (年龄, 得分) 平面 —— 示例 3</text>
  <g filter="url(#r)">
    <path d="M 70 320 L 410 320" stroke="#8a8a8a" stroke-width="1.6" fill="none"/>
    <path d="M 70 320 L 70 70" stroke="#8a8a8a" stroke-width="1.6" fill="none"/>
    <path d="M 404 316 L 410 320 L 404 324 Z" fill="#8a8a8a"/>
    <path d="M 66 76 L 70 70 L 74 76 Z" fill="#8a8a8a"/>
  </g>
  <text x="400" y="338" font-size="11" fill="#666" filter="url(#r)">年龄 →</text>
  <text x="46" y="66" font-size="11" fill="#666" filter="url(#r)">得分 ↑</text>

  <!-- conflict dashed lines from genius P3 to elders -->
  <g filter="url(#r)" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" fill="none">
    <path d="M 112 130 Q 200 190 284 270"/>
    <path d="M 114 126 Q 220 170 316 234"/>
    <path d="M 116 122 Q 230 160 344 198"/>
  </g>

  <!-- green chain arrows P0 -> P1 -> P2 -->
  <g filter="url(#r)" stroke="#4a7a3a" stroke-width="2.4" fill="none">
    <path d="M 302 272 Q 312 258 318 244" marker-end="url(#ga)"/>
    <path d="M 330 230 Q 340 216 346 202" marker-end="url(#ga)"/>
  </g>

  <!-- players -->
  <g filter="url(#r)">
    <circle cx="290" cy="277" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="321" cy="235" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="352" cy="193" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="106" cy="128" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g filter="url(#r)" font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="290" y="304" fill="#2e6e2e">(8,1)</text>
    <text x="321" y="262" fill="#2e6e2e">(9,2)</text>
    <text x="352" y="220" fill="#2e6e2e">(10,3)</text>
    <text x="106" y="110" fill="#b85450">(1,5) 天才</text>
  </g>
  <text x="210" y="330" font-size="10.5" fill="#b85450" filter="url(#r)">红虚线：天才年龄最小、得分却最高 → 与三名老将全都冲突</text>
  <text x="200" y="182" font-size="10.5" fill="#2e6e2e" filter="url(#r)" transform="rotate(-32 200 182)">绿链：年龄↑ 得分↑ → 互不冲突</text>

  <!-- ===== Right: after sorting ===== -->
  <text x="452" y="66" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">② 按 (年龄, 得分) 升序排序后</text>
  <g filter="url(#r)">
    <rect x="452" y="80" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="496" y="80" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="540" y="80" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="584" y="80" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="11" text-anchor="middle" font-family="monospace">
    <text x="474" y="101" fill="#b85450" font-weight="bold">(1,5)</text>
    <text x="518" y="101" fill="#2e6e2e">(8,1)</text>
    <text x="562" y="101" fill="#2e6e2e">(9,2)</text>
    <text x="606" y="101" fill="#2e6e2e">(10,3)</text>
  </g>
  <text x="452" y="134" font-size="10.5" fill="#666" filter="url(#r)">得分序列：</text>
  <g filter="url(#r)" font-size="13" text-anchor="middle" font-weight="bold" font-family="monospace">
    <text x="474" y="158" fill="#b85450" text-decoration="line-through">5</text>
    <text x="518" y="158" fill="#2e6e2e">1</text>
    <text x="562" y="158" fill="#2e6e2e">2</text>
    <text x="606" y="158" fill="#2e6e2e">3</text>
  </g>
  <path d="M 508 170 Q 562 182 616 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <text x="562" y="192" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">选出的不下降子序列</text>
  <g filter="url(#r)">
    <rect x="452" y="204" width="176" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="540" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">球队 = 得分不下降子序列</text>
  <text x="540" y="246" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#r)">本题求「和最大」而非「最长」</text>
  <g filter="url(#r)">
    <rect x="452" y="268" width="176" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="540" y="286" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">示例 3 答案</text>
  <text x="540" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">max = 1+2+3 = 6</text>

  <!-- ===== Bottom note ===== -->
  <g filter="url(#r)">
    <rect x="40" y="348" width="604" height="66" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="370" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">排序消掉「年龄」这一维</text>
  <text x="60" y="390" font-size="11" fill="#444" filter="url(#r)">排好序后位置在前的球员年龄 ≤ 后面的，于是「无冲突」只剩一个条件：前面的得分 ≤ 后面的得分。</text>
  <text x="60" y="406" fill="#444" font-size="11" filter="url(#r)">这正是 LIS（最长不下降子序列）的求和变体：dp[i] = sᵢ + max{ dp[j] : j &lt; i, sⱼ ≤ sᵢ }。</text>
</svg>
