<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每条路径都有一个「最高点」u</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 u 为最高点的最长路径 = 左右两条下行链之和（缺一侧则记 0）</text>

  <!-- 树的边 -->
  <g stroke="#9aa5b1" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <line x1="200" y1="96" x2="120" y2="164"/>
    <line x1="200" y1="96" x2="290" y2="164"/>
    <line x1="120" y1="164" x2="75" y2="232"/>
    <line x1="120" y1="164" x2="170" y2="232"/>
  </g>

  <!-- 红色：以 2 为最高点的候选路径 4-2-5 -->
  <polyline points="75,232 120,164 170,232" fill="none" stroke="#b85450" stroke-width="3.4"
            opacity="0.55" stroke-linecap="round" filter="url(#rough2)"/>
  <!-- 绿色：真正的直径 4-2-1-3 -->
  <polyline points="75,232 120,164 200,96 290,164" fill="none" stroke="#4a7a3a" stroke-width="3.4"
            opacity="0.5" stroke-linecap="round" filter="url(#rough2)"/>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <circle cx="200" cy="96" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="120" cy="164" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="290" cy="164" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="75" cy="232" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="170" cy="232" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#2f3b4c" text-anchor="middle" filter="url(#rough2)">
    <text x="200" y="100">1</text>
    <text x="120" y="168">2</text>
    <text x="290" y="168">3</text>
    <text x="75" y="236">4</text>
    <text x="170" y="236">5</text>
  </g>

  <!-- 各节点高度（按节点数计） -->
  <g font-size="9.5" fill="#7a8794" text-anchor="middle" filter="url(#rough2)">
    <text x="228" y="90">h=3</text>
    <text x="120" y="194">h=2</text>
    <text x="290" y="192">h=1</text>
    <text x="75" y="260">h=1</text>
    <text x="170" y="260">h=1</text>
  </g>

  <!-- 两处候选 -->
  <rect x="40" y="272" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="293" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">在 2 处：1 + 1 = 2</text>

  <rect x="206" y="272" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="276" y="293" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">在 1 处：2 + 1 = 3</text>

  <!-- 右侧定义面板 -->
  <text x="450" y="84" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">高度 h 的定义</text>

  <rect x="352" y="94" width="196" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="366" y="114" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">h(空) = 0，h(叶子) = 1</text>
  <text x="366" y="132" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">h(u) = max(h(左), h(右)) + 1</text>
  <text x="366" y="148" font-size="9" fill="#6a7a95" filter="url(#rough2)">返回值 = 一条下行链的边数</text>

  <path d="M 450 156 L 450 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="174" width="196" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="366" y="194" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">候选 d(u) = h(左) + h(右)</text>
  <text x="366" y="212" font-size="9" fill="#8a7a55" filter="url(#rough2)">叶子 d = 0（只剩 0 条边）</text>

  <path d="M 450 226 L 450 238" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="244" width="196" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="366" y="264" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">答案 = max over all u d(u)</text>
  <text x="366" y="282" font-size="9" fill="#5a7a50" filter="url(#rough2)">= 整棵树的最长路径边数</text>

  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">为什么是加法：路径经过 u 时，最多向左、向右各伸一条链，长度即两链之和</text>
  <text x="280" y="352" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">路径 4 → 2 → 5 在 2 处结算（2 条边）；4 → 2 → 1 → 3 在 1 处结算（3 条边，胜出）</text>
</svg>
