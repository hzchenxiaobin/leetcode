<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一侧对差入哈希集合，另一侧查询取最大</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: build H, insert diffs ===== -->
  <g filter="url(#sk)"><rect x="40" y="66" width="220" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="150" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">hFences 并入 {1, m}</text>
  <text x="150" y="112" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">排序 → H（k₁ ≤ 602 条线）</text>

  <path d="M 264 98 L 286 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="292" y="66" width="240" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="412" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">双重循环 i &lt; j</text>
  <text x="412" y="112" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">d = H[j] − H[i] → 插入哈希集合</text>

  <path d="M 536 98 L 558 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="564" y="56" width="340" height="84" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="584" y="78" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">diffs = S_h（水平可达边长）</text>
  <g filter="url(#sk)"><rect x="600" y="92" width="34" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="617" y="110" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="642" y="92" width="34" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="659" y="110" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="684" y="92" width="34" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="701" y="110" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="726" y="92" width="34" height="26" rx="4" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="743" y="110" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">5</text>
  <text x="786" y="110" font-size="13" fill="#2e6e2e" filter="url(#sk)">…</text>
  <text x="584" y="132" font-size="10" fill="#666" filter="url(#sk)">至多 C(602,2) ≈ 1.8×10⁵ 个差值</text>

  <!-- ===== Row 2: enumerate V, query ===== -->
  <g filter="url(#sk)"><rect x="40" y="176" width="220" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="150" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">vFences 并入 {1, n}</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">排序 → V（k₂ ≤ 602 条线）</text>

  <path d="M 264 208 L 286 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="292" y="176" width="240" height="64" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="412" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">双重循环 i &lt; j</text>
  <text x="412" y="222" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">d = V[j] − V[i]；查询 d ∈ diffs ?</text>

  <path d="M 536 208 L 558 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="564" y="176" width="340" height="64" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="584" y="202" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">命中 → best = max(best, d)</text>
  <text x="584" y="222" font-size="11" fill="#7a5415" filter="url(#sk)">未命中 → 继续下一对（best 初值 −1）</text>

  <!-- connector down to decision -->
  <path d="M 412 240 L 412 262 L 190 262 L 190 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 3: decision ===== -->
  <g filter="url(#sk)"><polygon points="190,288 268,330 190,372 112,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="190" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">best 仍是 −1 ?</text>
  <text x="190" y="344" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">（交集为空）</text>

  <path d="M 268 322 Q 340 300 416 304" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="298" font-size="11" fill="#b03a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="420" y="282" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="490" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">返回 −1</text>

  <path d="M 268 338 Q 340 362 416 358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="368" font-size="11" fill="#2e6e2e" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="420" y="336" width="440" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="640" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 best² mod (10⁹ + 7)</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="420" width="828" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="444" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">实现要点</text>
  <text x="76" y="468" font-size="11" fill="#444" filter="url(#sk)">· 比较用原始边长 d，取模只在最后一步——先取模再比较会破坏大小关系</text>
  <text x="76" y="490" font-size="11" fill="#444" filter="url(#sk)">· d &lt; 10⁹ 可用 int 存差；但 d² ≈ 10¹⁸，C++ 的面积中间量必须 long long</text>
  <text x="76" y="512" font-size="11" fill="#444" filter="url(#sk)">· 哈希集合建在较小的一侧 → 空间 O(min(k₁,k₂)²)；m, n 高达 10⁹ 但不参与复杂度</text>
</svg>
