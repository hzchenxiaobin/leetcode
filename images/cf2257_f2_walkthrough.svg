<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
  </defs>
  <rect width="720" height="392" fill="#fafafa"/>
  <text x="360" y="27" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">样例第一问 ? 1 3 的走查（x = 3，d = [4,2,5]，s = [4,2,7]）</text>
  <text x="360" y="50" text-anchor="middle" font-size="10.5" fill="#777" font-weight="normal" filter="url(#rough2)">起点格子 1、终点格子 11；dp 只依赖前面 x 个格子</text>
  <rect x="40" y="80" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="62" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="84" y="80" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="106" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="128" y="80" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="150" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="172" y="80" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="194" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="216" y="80" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="238" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="260" y="80" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">6</text>
  <text x="282" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="304" y="80" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">7</text>
  <text x="326" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="348" y="80" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">8</text>
  <text x="370" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="392" y="80" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">9</text>
  <text x="414" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="436" y="80" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">10</text>
  <text x="458" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="480" y="80" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="74" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">11</text>
  <text x="502" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="106" y="144" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="normal" filter="url(#rough2)">平台 1：s = 4</text>
  <text x="238" y="144" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">平台 2：s = 2</text>
  <text x="414" y="144" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="normal" filter="url(#rough2)">平台 3：s = 7</text>
  <rect x="20" y="196" width="140" height="52" rx="6" fill="#f1f1f1" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(0, ∞, ∞)</text>
  <text x="90" y="239" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">起点之前（种子）</text>
  <rect x="195" y="196" width="140" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(4, 4, 4)</text>
  <text x="265" y="239" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">平台 1 结束</text>
  <rect x="370" y="196" width="140" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(4, 4, 4)</text>
  <text x="440" y="239" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">平台 2 结束</text>
  <rect x="545" y="196" width="140" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="615" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">(11, 11, 4)</text>
  <text x="615" y="239" text-anchor="middle" font-size="9" fill="#777" font-weight="normal" filter="url(#rough2)">平台 3 结束</text>
  <path d="M 162 222 L 192 222" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 337 222 L 367 222" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 512 222 L 542 222" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="177" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">P_1</text>
  <text x="352" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">T_2</text>
  <text x="527" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">T_3</text>
  <text x="360" y="292" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 最后一个状态的 dp[11] = 11</text>
  <text x="360" y="322" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">最优路线 1 → 4 → 6 → 8 → 11：罚分 4 + 0 + 0 + 7 = 11</text>
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#777" font-weight="normal" filter="url(#rough2)">贪心「每次跳最远」不成立：从格子 4 硬跳 7 会在平台 3 里多付一次 s，必须保留窗口</text>
</svg>
