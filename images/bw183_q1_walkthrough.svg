<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：数一数末尾 z 格里有几个非 0</text>
  <rect x="26" y="72" width="186" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="119" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">nums</text>
  <rect x="226" y="72" width="70" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="261" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">z</text>
  <rect x="306" y="72" width="90" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="351" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">末尾 z 格</text>
  <rect x="406" y="72" width="130" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="471" y="94" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">非 0 个数 = 答案</text>
  <rect x="26" y="108" width="186" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="119.0" y="139" text-anchor="middle" font-size="10.5" fill="#446688">[0,1,0,3,12]</text>
  <rect x="226" y="108" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="261.0" y="139" text-anchor="middle" font-size="10.5" fill="#446688">2</text>
  <rect x="306" y="108" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="351.0" y="139" text-anchor="middle" font-size="10.5" fill="#446688">[3,12]</text>
  <rect x="406" y="108" width="100" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="456.0" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="26" y="164" width="186" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="119.0" y="195" text-anchor="middle" font-size="10.5" fill="#446688">[0,1,0,2]</text>
  <rect x="226" y="164" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="261.0" y="195" text-anchor="middle" font-size="10.5" fill="#446688">2</text>
  <rect x="306" y="164" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="351.0" y="195" text-anchor="middle" font-size="10.5" fill="#446688">[0,2]</text>
  <rect x="406" y="164" width="100" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="456.0" y="195" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="26" y="220" width="186" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="119.0" y="251" text-anchor="middle" font-size="10.5" fill="#446688">[1,2,0]</text>
  <rect x="226" y="220" width="70" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="261.0" y="251" text-anchor="middle" font-size="10.5" fill="#446688">1</text>
  <rect x="306" y="220" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="351.0" y="251" text-anchor="middle" font-size="10.5" fill="#446688">[0]</text>
  <rect x="406" y="220" width="100" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="456.0" y="251" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="26" y="292" width="510" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="281" y="311" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">示例 3 的末尾 z = 1 格本来就是 0，无需任何交换</text>
  <text x="281" y="325" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">示例 1 需要 2 次：0↔3、0↔12（题面给的具体交换只是其中一种）</text>
  <text x="280.0" y="364" text-anchor="middle" font-size="10" fill="#999">z = 0 时后缀为空，答案为 0</text>
</svg>
