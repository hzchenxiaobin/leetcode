<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">多源 BFS：把所有起点当作第 0 层一起出发</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="85.0" y="50.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="70.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">多源初始化：每个 (1&lt;&lt;i, i) 入队，dist = 0</text>
  <text x="250" y="85.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（可以从任意节点出发）</text>
  <g filter="url(#sk2)"><rect x="85.0" y="116.0" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="144.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">BFS 逐层扩展：每层 = 多走一条边</text>
  <g filter="url(#sk2)"><rect x="85.0" y="180.0" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="200.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">出队 (mask, u)</text>
  <text x="250" y="215.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">mask == full ？</text>
  <g filter="url(#sk2)"><rect x="85.0" y="250.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="278.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">对每个邻居 v：nm = mask | (1&lt;&lt;v)</text>
  <g filter="url(#sk2)"><rect x="85.0" y="314.0" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="342.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">dist[nm][v] == -1 ？</text>
  <g filter="url(#sk2)"><rect x="85.0" y="378.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="406.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">dist[nm][v] = d + 1，入队</text>
  <path d="M 250 99 L 250 115" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 165 L 250 179" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 229 L 250 249" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 299 L 250 313" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 363 L 250 377" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 85 402 L 60 402 L 60 140 L 80 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="54" y="280" text-anchor="end" font-size="10" fill="#446688">继续 BFS</text>
  <path d="M 416 204 L 480 204" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="448" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <g filter="url(#sk2)"><rect x="475.0" y="178.0" width="170" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="560" y="200.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">返回 d</text>
  <text x="560" y="215.9" text-anchor="middle" font-size="11.5" fill="#2e5e22">（BFS 首次即最短）</text>
  <path d="M 416 338 L 480 338" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="448" y="328" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <g filter="url(#sk2)"><rect x="475.0" y="316.0" width="170" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="560" y="342.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">丢弃该状态</text>
</svg>
