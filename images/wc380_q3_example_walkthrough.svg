<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：k = 7, x = 2（计费位：第 2、4 位）</text>

  <!-- 高亮行（先画，垫在网格下） -->
  <rect x="60" y="266" width="330" height="24" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="60" y="290" width="330" height="24" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="60" y="48" width="330" height="26" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="87" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">num</text>
  <text x="175" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">二进制</text>
  <text x="267" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">价格</text>
  <text x="345" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">累加价格</text>

  <!-- 表格边框与网格 -->
  <rect x="60" y="48" width="330" height="266" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 115 48 V 314 M 235 48 V 314 M 300 48 V 314" stroke="#99a8b8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 60 74 H 390 M 60 98 H 390 M 60 122 H 390 M 60 146 H 390 M 60 170 H 390 M 60 194 H 390 M 60 218 H 390 M 60 242 H 390 M 60 266 H 390 M 60 290 H 390" stroke="#99a8b8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <text x="87" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="175" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0001</text>
  <text x="267" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="345" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="87" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="175" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0010</text>
  <text x="267" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="87" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0011</text>
  <text x="267" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="87" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="175" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0100</text>
  <text x="267" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="345" y="163" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="87" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="175" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0101</text>
  <text x="267" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="345" y="187" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="87" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="175" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0110</text>
  <text x="267" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <text x="87" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="175" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0111</text>
  <text x="267" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="235" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <text x="87" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="175" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000</text>
  <text x="267" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="259" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <text x="87" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">9</text>
  <text x="175" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1001</text>
  <text x="267" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <text x="345" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">6 ✓</text>

  <text x="87" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>
  <text x="175" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1010</text>
  <text x="267" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="345" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">8 ✗</text>

  <!-- 表下注释 -->
  <text x="60" y="338" font-size="10" fill="#666" filter="url(#rough2)">价格可为 0（num = 1、4、5）⇒ acc 单调不减而非严格递增，二分依旧成立</text>
  <text x="60" y="356" font-size="10" fill="#666" filter="url(#rough2)">分界点：acc(9) = 6 ≤ 7 廉价，acc(10) = 8 &gt; 7 超支 → 答案 9</text>

  <!-- 右侧：闭式验算 -->
  <rect x="420" y="62" width="200" height="108" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">acc(9) 闭式验算</text>
  <text x="520" y="106" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">C(9, 2) = 4（数 2、3、6、7）</text>
  <text x="520" y="126" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">C(9, 4) = 2（数 8、9）</text>
  <text x="520" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">合计 6 ≤ 7 ✓</text>

  <rect x="420" y="190" width="200" height="108" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a33333" filter="url(#rough2)">acc(10) 闭式验算</text>
  <text x="520" y="234" text-anchor="middle" font-size="10" fill="#7a3a37" filter="url(#rough2)">C(10, 2) = 5（+10 的第 2 位）</text>
  <text x="520" y="254" text-anchor="middle" font-size="10" fill="#7a3a37" filter="url(#rough2)">C(10, 4) = 3（+10 的第 4 位）</text>
  <text x="520" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">合计 8 &gt; 7 ✗</text>

  <ellipse cx="520" cy="346" rx="46" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="520" y="354" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">答案 9</text>
</svg>
