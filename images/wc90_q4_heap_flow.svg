<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="360" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">大顶堆维护「已扫描工人中最小的 k 个 quality」</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">堆内超过 k 个就弹掉最大的；堆恰好 k 个时结算一次成本</text>
  <rect x="40" y="96" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="120.1" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">按 w/q 扫描</text>
  <path d="M 160 116 L 196 116" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="198" y="96" width="122" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="120.1" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">push quality</text>
  <path d="M 322 116 L 358 116" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="360" y="96" width="122" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="421" y="120.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">size &gt; k ?</text>
  <path d="M 484 116 L 520 116" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="502" y="106" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="500" y="84" width="96" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="548" y="108.6" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">弹出堆顶(最大)</text>
  <path d="M 548 126 L 548 158 L 420 158" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="300" y="140" width="118" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="359" y="164.1" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">size == k ?</text>
  <path d="M 300 160 L 240 182" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="258" y="168" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="120" y="172" width="244" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="197.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">成本 = sumQ × (w_i / q_i)  取最小</text>
  <rect x="40" y="240" width="540" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="258" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">· 堆里只留 quality 最小的 k 人，因为 r 固定时 sumQ 越小成本越低；</text>
  <text x="50" y="272.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">· 用大顶堆可以在 O(log k) 内维护「最小 k 个」：push 后若超员就弹掉最大值；</text>
  <text x="50" y="287.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">· 排序 O(n log n)，扫描 n 次各 O(log k) → 总时间 O(n log n)。</text>
</svg>
