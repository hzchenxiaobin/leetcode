<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">k 轮前缀和的状态表 = 斜过来看的杨辉三角</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">以 n = 4 为例：每行是一轮"同时取前缀和"后的数组，自上而下 t = 0 … 5</text>

  <!-- column headers -->
  <text x="153" y="74" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">a[0]</text>
  <text x="199" y="74" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">a[1]</text>
  <text x="245" y="74" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#sk)">a[2]</text>
  <text x="291" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#sk)">a[3] ←答案</text>

  <!-- row labels -->
  <g font-size="11" fill="#7a7a7a" text-anchor="middle">
    <text x="112" y="100" filter="url(#sk)">t=0</text>
    <text x="112" y="132" filter="url(#sk)">t=1</text>
    <text x="112" y="164" filter="url(#sk)">t=2</text>
    <text x="112" y="196" filter="url(#sk)">t=3</text>
    <text x="112" y="228" filter="url(#sk)">t=4</text>
    <text x="112" y="260" filter="url(#sk)">t=5</text>
  </g>

  <!-- cells -->
  <g filter="url(#sk)">
    <rect x="130" y="80" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="80" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="80" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="80" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="130" y="112" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="112" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="112" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="112" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="130" y="144" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="144" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="144" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="144" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="130" y="176" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="176" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="176" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="176" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="130" y="208" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="208" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="208" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="208" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.6"/>

    <rect x="130" y="240" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="176" y="240" width="46" height="30" rx="4" fill="#f4f8fd" stroke="#8fb0cc" stroke-width="1.2"/>
    <rect x="222" y="240" width="46" height="30" rx="4" fill="#fff4e0" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="268" y="240" width="46" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>

  <!-- cell values -->
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="153" y="100" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="100" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="245" y="100" fill="#8a6a20" filter="url(#sk)">1</text>
    <text x="291" y="100" fill="#8a6a20" filter="url(#sk)">1</text>

    <text x="153" y="132" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="132" fill="#2b4a66" filter="url(#sk)">2</text>
    <text x="245" y="132" fill="#8a6a20" filter="url(#sk)">3</text>
    <text x="291" y="132" fill="#8a6a20" filter="url(#sk)">4</text>

    <text x="153" y="164" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="164" fill="#2b4a66" filter="url(#sk)">3</text>
    <text x="245" y="164" fill="#8a6a20" filter="url(#sk)">6</text>
    <text x="291" y="164" fill="#8a6a20" filter="url(#sk)">10</text>

    <text x="153" y="196" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="196" fill="#2b4a66" filter="url(#sk)">4</text>
    <text x="245" y="196" fill="#8a6a20" filter="url(#sk)">10</text>
    <text x="291" y="196" fill="#8a6a20" filter="url(#sk)">20</text>

    <text x="153" y="228" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="228" fill="#2b4a66" filter="url(#sk)">5</text>
    <text x="245" y="228" fill="#8a6a20" filter="url(#sk)">15</text>
    <text x="291" y="228" fill="#8a6a20" filter="url(#sk)">35</text>

    <text x="153" y="260" fill="#2b4a66" filter="url(#sk)">1</text>
    <text x="199" y="260" fill="#2b4a66" filter="url(#sk)">6</text>
    <text x="245" y="260" fill="#8a6a20" filter="url(#sk)">21</text>
    <text x="291" y="260" font-size="14" fill="#b85450" filter="url(#sk)">56</text>
  </g>

  <!-- left rotated arrow -->
  <path d="M 86 96 L 86 250" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="74" y="174" transform="rotate(-90 74 174)" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">每秒一次前缀和</text>

  <!-- arrow from 56 to formula card -->
  <path d="M 316 254 C 332 246 334 216 342 204" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- card A: general term -->
  <rect x="346" y="84" width="262" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" filter="url(#sk)"/>
  <text x="477" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">通项：a(t)[i] = C(t+i, i)</text>
  <text x="477" y="126" text-anchor="middle" font-size="11" fill="#5a7a9e" filter="url(#sk)">每个格子都落在杨辉三角同一条斜线上</text>
  <text x="477" y="142" text-anchor="middle" font-size="11" fill="#5a7a9e" filter="url(#sk)">末列（i = n−1）：C(t+n−1, n−1)</text>

  <!-- card B: answer -->
  <rect x="346" y="168" width="262" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="477" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">所求：k 秒后的 a[n−1]</text>
  <text x="477" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = C(n+k−1, k)</text>
  <text x="477" y="228" text-anchor="middle" font-size="11.5" fill="#a06058" filter="url(#sk)">本例 C(4+5−1, 5) = C(8,5) = 56</text>

  <!-- card C: hockey stick -->
  <rect x="346" y="256" width="262" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" filter="url(#sk)"/>
  <text x="477" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">每轮前缀和 ⇔ 曲棍球恒等式</text>
  <text x="477" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">下一行 = 上一行的前缀和：</text>
  <text x="477" y="315" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Σ C(t+j, t) = C(i+t+1, t+1)</text>

  <!-- conclusion strip -->
  <rect x="40" y="352" width="560" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="378" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6a20" filter="url(#sk)">结论：只需一次组合数取模 —— ans = C(n+k−1, k) mod (10^9+7)</text>

  <text x="320" y="424" text-anchor="middle" font-size="11.5" fill="#7a7a7a" font-style="italic" filter="url(#sk)">比赛时先随手推 6 行打表找规律，再回头补证明</text>
</svg>
