<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">「至多 t = 2 种不同」滑动窗口计算 count(t)</text>
  <text x="280" y="54" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">以 nums = [4, 3, 5, 4] 为例，展示 r = 3 收缩完成后的状态</text>

  <!-- 窗口虚线框（覆盖下标 2..3） -->
  <rect x="252" y="92" width="128" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="112" y="96" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="96" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="96" width="58" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="292" y="96" width="58" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="141" y="124">4</text>
    <text x="201" y="124">3</text>
    <text x="261" y="124" font-weight="bold">5</text>
    <text x="321" y="124" font-weight="bold">4</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#999" text-anchor="middle">
    <text x="141" y="160">0</text><text x="201" y="160">1</text>
    <text x="261" y="160">2</text><text x="321" y="160">3</text>
  </g>

  <!-- 指针 -->
  <path d="M261,182 C260,192 259,198 261,206" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="261" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">l</text>
  <path d="M321,182 C322,192 323,198 321,206" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="321" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">r</text>

  <!-- 左侧：收缩记录 -->
  <rect x="30" y="250" width="250" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="274" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">收缩记录（distinct 超 2 才收）</text>
  <text x="46" y="298" font-size="11.5" fill="#333" filter="url(#rough2)">r=2：移入 5 → distinct=3 &gt; 2</text>
  <text x="62" y="316" font-size="11.5" fill="#b85450" filter="url(#rough2)">移出 4 → 窗口 [3,5]，distinct=2</text>
  <text x="46" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">r=3：移入 4 → distinct=3 &gt; 2</text>
  <text x="62" y="358" font-size="11.5" fill="#b85450" filter="url(#rough2)">移出 3 → 窗口 [5,4]，distinct=2</text>

  <!-- 右侧：贡献公式 -->
  <rect x="300" y="250" width="238" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="316" y="274" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">本步贡献</text>
  <text x="316" y="300" font-size="12.5" fill="#333" filter="url(#rough2)">ans += r − l + 1 = 3 − 2 + 1 = 2</text>
  <text x="316" y="324" font-size="11.5" fill="#666" filter="url(#rough2)">以 r 结尾、左端 ≥ l 的子数组</text>
  <text x="316" y="342" font-size="11.5" fill="#666" filter="url(#rough2)">全都不超过 2 种不同元素</text>
  <text x="316" y="364" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">count(2) = 1+2+2+2 = 7</text>

  <!-- 底部结论 -->
  <text x="280" y="392" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">l、r 各自只前进 → 均摊 O(n)；freq 表 O(1) 维护 distinct</text>
</svg>
