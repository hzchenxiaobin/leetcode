<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：按位扩展的生成树（末位 ±1）</text>

  <!-- 抽象结构 -->
  <g filter="url(#rough2)">
    <line x1="280" y1="66" x2="180" y2="124" stroke="#888" stroke-width="1.4"/>
    <line x1="280" y1="66" x2="380" y2="124" stroke="#888" stroke-width="1.4"/>
    <line x1="180" y1="134" x2="120" y2="192" stroke="#888" stroke-width="1.4"/>
    <line x1="180" y1="134" x2="240" y2="192" stroke="#888" stroke-width="1.4"/>
    <line x1="380" y1="134" x2="320" y2="192" stroke="#888" stroke-width="1.4"/>
    <line x1="380" y1="134" x2="440" y2="192" stroke="#888" stroke-width="1.4"/>
  </g>

  <ellipse cx="280" cy="56" rx="30" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">…d（前缀）</text>

  <ellipse cx="180" cy="126" rx="24" ry="15" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="131" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（略）</text>
  <ellipse cx="380" cy="126" rx="24" ry="15" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="131" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（略）</text>

  <ellipse cx="120" cy="196" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="201" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">…d−1</text>
  <ellipse cx="240" cy="196" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="201" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">…d+1</text>
  <ellipse cx="320" cy="196" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="201" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">…d−1</text>
  <ellipse cx="440" cy="196" rx="34" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="201" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">…d+1</text>

  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">新末位必须与 d 恰差 1 —— 只有这两种选择</text>

  <!-- 具体例子 -->
  <text x="40" y="268" font-size="12.5" fill="#333" font-weight="bold">具体例子（两位层 → 三位层）：</text>

  <g filter="url(#rough2)">
    <line x1="100" y1="296" x2="62" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="180" y1="296" x2="126" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="180" y1="296" x2="194" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="262" y1="296" x2="248" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="262" y1="296" x2="306" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="362" y1="296" x2="352" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="362" y1="296" x2="412" y2="344" stroke="#888" stroke-width="1.3"/>
    <line x1="472" y1="296" x2="472" y2="344" stroke="#888" stroke-width="1.3"/>
  </g>

  <text y="300" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="100">10</tspan><tspan x="180">12</tspan><tspan x="262">21</tspan><tspan x="362">23</tspan><tspan x="472">98</tspan></text>

  <text y="360" font-size="11.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)"><tspan x="62">101</tspan><tspan x="126">121</tspan><tspan x="194">123</tspan><tspan x="248">210</tspan><tspan x="306">212</tspan><tspan x="352">232</tspan><tspan x="412">234</tspan><tspan x="472">898</tspan></text>

  <rect x="40" y="378" width="280" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="398" font-size="11" fill="#333" filter="url(#rough2)">末位 0 只能 +1（10 → 101）；</text>
  <text x="54" y="416" font-size="11" fill="#555" filter="url(#rough2)">末位 9 只能 −1（98 → 898）</text>

  <rect x="340" y="378" width="190" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="354" y="398" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0, 2×10⁹] 内步进数仅 3502 个</text>
  <text x="354" y="416" font-size="11" fill="#555" filter="url(#rough2)">生成而非扫描，是唯一可行路线</text>

  <text x="40" y="252" font-size="11" fill="#555" filter="url(#rough2)">种子：1..9（0 单独处理，不做前缀）</text>
</svg>
