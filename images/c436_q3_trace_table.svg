<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：s = "12936"（15 个子串 → 11 个合法）</text>
  <path d="M 90 38 Q 340 46 590 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- header -->
  <text x="44" y="66" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">j</text>
  <text x="107" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">末位 c</text>
  <text x="268" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">cnt[c]（桶下标 = 余数 r）</text>
  <text x="452" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">贡献 → 累计</text>
  <text x="584" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#888" filter="url(#rough2)">本位合法子串</text>

  <!-- row 0: j=0, c=1, cnt[1]=[1] -->
  <text x="44" y="118" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">j=0</text>
  <g filter="url(#rough2)">
    <rect x="92" y="102" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="136" y="104" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="107" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">1</text>
  <text x="149" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="149" y="140" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="424" y="122" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">+1</text>
  <text x="460" y="122" font-size="12" fill="#2b2b2b" filter="url(#rough2)">→ 1</text>
  <text x="508" y="114" font-size="10" fill="#333" filter="url(#rough2)">"1"</text>
  <text x="508" y="130" font-size="9.5" fill="#999" filter="url(#rough2)">（桶 r=0：单字符）</text>
  <path d="M 24 146 L 656 146" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 1: j=1, c=2, cnt[2]=[2,0] -->
  <text x="44" y="186" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">j=1</text>
  <g filter="url(#rough2)">
    <rect x="92" y="170" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="136" y="172" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="165" y="172" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="107" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">2</text>
  <text x="149" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="178" y="190" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="149" y="208" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="178" y="208" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="424" y="190" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">+2</text>
  <text x="460" y="190" font-size="12" fill="#2b2b2b" filter="url(#rough2)">→ 3</text>
  <text x="508" y="182" font-size="10" fill="#333" filter="url(#rough2)">"2"、"12"</text>
  <text x="508" y="198" font-size="9.5" fill="#999" filter="url(#rough2)">（偶数末位全合法）</text>
  <path d="M 24 214 L 656 214" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 2: j=2, c=9, cnt[9]=[1,0,1,1,0,0,0,0,0] -->
  <text x="44" y="254" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">j=2</text>
  <g filter="url(#rough2)">
    <rect x="92" y="238" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="136" y="240" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="165" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="194" y="240" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="223" y="240" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="252" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="281" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="339" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="368" y="240" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="107" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">9</text>
  <text x="149" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="178" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="236" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="265" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="294" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="323" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="352" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="381" y="258" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="149" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="178" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="207" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="236" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="265" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="294" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="323" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">6</text>
  <text x="352" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">7</text>
  <text x="381" y="276" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">8</text>
  <text x="424" y="258" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">+1</text>
  <text x="460" y="258" font-size="12" fill="#2b2b2b" filter="url(#rough2)">→ 4</text>
  <text x="508" y="250" font-size="10" fill="#333" filter="url(#rough2)">"9"</text>
  <text x="508" y="266" font-size="10" fill="#b85450" filter="url(#rough2)">"29"、"129" ✗</text>
  <path d="M 24 282 L 656 282" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 3: j=3, c=3, cnt[3]=[3,0,1] -->
  <text x="44" y="322" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">j=3</text>
  <g filter="url(#rough2)">
    <rect x="92" y="306" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="136" y="308" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="165" y="308" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="194" y="308" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="107" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">3</text>
  <text x="149" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="178" y="326" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="149" y="344" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="178" y="344" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="207" y="344" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="424" y="326" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">+3</text>
  <text x="460" y="326" font-size="12" fill="#2b2b2b" filter="url(#rough2)">→ 7</text>
  <text x="508" y="318" font-size="10" fill="#333" filter="url(#rough2)">"3"、"93"、"1293"</text>
  <text x="508" y="334" font-size="10" fill="#b85450" filter="url(#rough2)">"293" ✗</text>
  <path d="M 24 350 L 656 350" stroke="#ddd" stroke-width="1" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- row 4: j=4, c=6, cnt[6]=[4,0,1,0,0,0] -->
  <text x="44" y="390" font-size="12" font-weight="bold" fill="#33507a" filter="url(#rough2)">j=4</text>
  <g filter="url(#rough2)">
    <rect x="92" y="374" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="136" y="376" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="165" y="376" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="194" y="376" width="26" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="223" y="376" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="252" y="376" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="281" y="376" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="107" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">6</text>
  <text x="149" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="178" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="236" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="265" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="294" y="394" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="149" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">0</text>
  <text x="178" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">1</text>
  <text x="207" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">2</text>
  <text x="236" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">3</text>
  <text x="265" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">4</text>
  <text x="294" y="412" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">5</text>
  <text x="424" y="394" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">+4</text>
  <text x="460" y="394" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">→ 11</text>
  <text x="508" y="386" font-size="10" fill="#333" filter="url(#rough2)">"6"、"36"、"936"、"12936"</text>
  <text x="508" y="402" font-size="10" fill="#b85450" filter="url(#rough2)">"2936" ✗</text>

  <!-- summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="424" width="632" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐位贡献 1 + 2 + 1 + 3 + 4 = 11（共 15 个子串，4 个不合法）</text>
  <text x="340" y="468" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">被排除的恰是题面列举的 "29"、"129"、"293"、"2936" —— 都落在非 0 桶（红格）；绿格 = 余 0 桶</text>
</svg>
