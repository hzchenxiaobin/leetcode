<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：长度短路 + 单趟逐位比对</text>
  <path d="M 130 38 Q 280 44 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Diamond 1: length check -->
  <g filter="url(#sk)">
    <polygon points="135,110 230,78 325,110 230,142" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="230" y="114" text-anchor="middle" font-size="12" fill="#2b2b2b">|words| == |s| ?</text>
  <path d="M 325 110 L 405 110" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="358" y="102" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="405" y="92" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="460" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 false</text>

  <path d="M 230 142 L 230 168" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="160" font-size="11" fill="#4a7a3a">是</text>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="182" y="168" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="230" y="187" text-anchor="middle" font-size="12.5" fill="#2b2b2b">i = 0</text>

  <path d="M 230 198 L 230 216" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- Diamond 2: loop condition -->
  <g filter="url(#sk)">
    <polygon points="158,252 230,216 302,252 230,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">i &lt; n ?</text>
  <path d="M 302 252 L 405 252" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="345" y="244" text-anchor="middle" font-size="11" fill="#2e6e2e">否</text>
  <g filter="url(#sk)">
    <rect x="405" y="234" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="460" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 true</text>

  <path d="M 230 288 L 230 306" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="300" font-size="11" fill="#4a7a3a">是</text>

  <!-- Diamond 3: char match -->
  <g filter="url(#sk)">
    <polygon points="125,348 230,310 335,348 230,386" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="230" y="344" text-anchor="middle" font-size="11.5" fill="#2b2b2b">words[i][0]</text>
  <text x="230" y="360" text-anchor="middle" font-size="11.5" fill="#2b2b2b">== s[i] ?</text>
  <path d="M 335 348 L 405 348" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="362" y="340" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="405" y="330" width="110" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="460" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 false</text>

  <path d="M 230 386 L 230 404" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="398" font-size="11" fill="#4a7a3a">是</text>

  <!-- Increment -->
  <g filter="url(#sk)">
    <rect x="182" y="404" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="230" y="423" text-anchor="middle" font-size="12.5" fill="#2b2b2b">i++</text>

  <!-- Loop back -->
  <path d="M 182 419 L 90 419 L 90 252 L 154 252" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="480" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="280" y="453" text-anchor="middle" font-size="11" fill="#7a5415">两个短路点：① 长度不等 O(1) 拒绝；② 任一位失配立即退出</text>
</svg>
