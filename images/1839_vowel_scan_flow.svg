<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="720" height="600" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次扫描，遇下降整段重置</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">left = 段首、distinct = 段内种数；两指针只增不减，整体 O(n)</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="250" y="64" width="220" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="360" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34557e" filter="url(#sk)">初始化：left = 0，distinct = 1</text>
  <text x="360" y="100" text-anchor="middle" font-size="10.5" fill="#34557e" filter="url(#sk)">（首字符自带 1 种元音）</text>
  <path d="M 360,108 L 360,124" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop head -->
  <g filter="url(#sk)">
    <rect x="240" y="126" width="240" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">right ← 1 … n−1</text>
  <text x="360" y="162" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">逐位推进</text>
  <path d="M 360,170 L 360,186" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <polygon points="360,188 505,236 360,284 215,236" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="360" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#sk)">word[right] 与</text>
  <text x="360" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#34557e" filter="url(#sk)">word[right−1] 比较？</text>

  <!-- branch: descent -->
  <path d="M 215,236 C 185,236 157,258 153,290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="166" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">＜ 下降</text>
  <g filter="url(#sk)">
    <rect x="58" y="296" width="190" height="76" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="153" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">left = right</text>
  <text x="153" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">distinct = 1</text>
  <text x="153" y="357" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">下降点：整段重置</text>

  <!-- branch: equal -->
  <path d="M 360,284 L 360,326" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">＝ 相等</text>
  <g filter="url(#sk)">
    <rect x="272" y="330" width="176" height="64" rx="9" fill="#f5f4ec" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="360" y="355" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#666" filter="url(#sk)">什么都不做</text>
  <text x="360" y="374" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">种数不变</text>

  <!-- branch: ascent -->
  <path d="M 505,236 C 535,236 563,258 567,290" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="553" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">＞ 上升</text>
  <g filter="url(#sk)">
    <rect x="474" y="296" width="190" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="569" y="319" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">distinct += 1</text>
  <text x="569" y="338" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">上升：引入</text>
  <text x="569" y="357" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">新元音</text>

  <!-- merge to decision 2 -->
  <path d="M 153,372 C 153,410 200,424 236,433" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 360,394 L 360,402" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 567,372 C 567,410 520,424 484,433" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 2 -->
  <polygon points="360,404 478,438 360,472 242,438" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="360" y="443" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">distinct == 5 ？</text>

  <!-- yes -->
  <path d="M 360,472 L 360,486" stroke="#c98a2b" stroke-width="1.8" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="378" y="483" font-size="11.5" font-weight="bold" fill="#c98a2b" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="240" y="488" width="240" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="360" y="509" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans = max(ans,</text>
  <text x="360" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">right − left + 1)</text>

  <!-- no: bypass back to loop -->
  <path d="M 242,438 L 36,438 L 36,148 L 234,148" stroke="#8a8a8a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="150" y="428" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">否（5 种未齐）</text>

  <!-- return to loop -->
  <path d="M 480,513 C 580,513 695,505 695,430 L 695,148 L 486,148" stroke="#8a8a8a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="95" font-size="10.5" fill="#888" filter="url(#sk)">（处理完当前 right，进入下一轮）</text>

  <!-- annotation -->
  <g filter="url(#sk)">
    <rect x="496" y="398" width="186" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="589" y="420" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">※ left 只在下降点跳跃、</text>
  <text x="589" y="437" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">永不回退</text>
  <text x="589" y="456" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⇒ 两指针各至多 n 步</text>
</svg>
