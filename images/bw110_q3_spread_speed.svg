<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">值在环上以“每秒 1 格”向两侧扩散</text>

  <!-- 环形示意 -->
  <g filter="url(#rough2)">
    <ellipse cx="200" cy="180" rx="120" ry="88" fill="none" stroke="#446688" stroke-width="2"/>
    <!-- 位置格子（8 个） -->
    <g font-size="12">
      <rect x="182" y="76" width="36" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
      <text x="200" y="96" text-anchor="middle" fill="#b85450">v</text>
      <rect x="182" y="254" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
      <text x="200" y="274" text-anchor="middle" fill="#446688">q</text>
    </g>
    <!-- 扩散箭头 -->
    <path d="M 168 92 C 128 104, 104 124, 88 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 232 92 C 272 104, 296 124, 312 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 88 148 C 80 168, 80 192, 88 212" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 2" marker-end="url(#arr)"/>
    <text x="56" y="132" font-size="11" fill="#b85450">1 秒后左邻</text>
    <text x="248" y="132" font-size="11" fill="#b85450">1 秒后右邻</text>
    <text x="200" y="180" text-anchor="middle" font-size="12" fill="#888">循环数组</text>
    <text x="200" y="200" text-anchor="middle" font-size="12" fill="#888">（首尾相邻）</text>
  </g>

  <!-- 右侧解释 -->
  <g filter="url(#rough2)">
    <rect x="348" y="62" width="152" height="188" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="424" y="90" text-anchor="middle" font-size="12.5" fill="#8a6d1f">位置 q 变成 v，</text>
    <text x="424" y="112" text-anchor="middle" font-size="12.5" fill="#8a6d1f">至少需要</text>
    <text x="424" y="142" text-anchor="middle" font-size="14" fill="#333">dist(q, 最近 v)</text>
    <text x="424" y="166" text-anchor="middle" font-size="12" fill="#555">秒（环上距离）</text>
    <text x="424" y="196" text-anchor="middle" font-size="11.5" fill="#555">每秒每个位置只能</text>
    <text x="424" y="214" text-anchor="middle" font-size="11.5" fill="#555">从自身/左/右三选一</text>
    <text x="424" y="230" text-anchor="middle" font-size="11.5" fill="#b85450">t 秒后每个位置的值</text>
    <text x="424" y="248" text-anchor="middle" font-size="11.5" fill="#b85450">都来自初始环距 ≤ t 的某格</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="36" y="286" width="448" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a">全体变成 v 的耗时 = 离 v 最远那个位置的环距</text>
    <text x="260" y="332" text-anchor="middle" font-size="12" fill="#555">→ 答案 = min over v（最终值必是数组中出现过的值）</text>
  </g>
</svg>
