<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">贪心：最左未覆盖点 p 当左边界，右边界顶到 p + w</text>

  <path d="M 60 190 L 470 190" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="2" filter="url(#rough2)">
    <path d="M 90 176 L 90 204"/><path d="M 98 176 L 98 204"/><path d="M 106 176 L 106 204"/>
    <path d="M 200 176 L 200 204"/><path d="M 310 176 L 310 204"/><path d="M 420 176 L 420 204"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="98" y="166">1（3 个）</text><text x="200" y="166">2</text>
    <text x="310" y="166">3</text><text x="420" y="166">4</text>
  </g>

  <path d="M 90 118 L 200 118" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 90 112 L 90 124" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="145" y="106" font-size="11.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">矩形 1：x ∈ [1, 1+w] = [1, 2]</text>

  <path d="M 310 118 L 420 118" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 112 L 310 124" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="365" y="106" font-size="11.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">矩形 2：x ∈ [3, 4]</text>

  <g stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)">
    <path d="M 90 124 L 90 176"/><path d="M 200 124 L 200 176"/>
  </g>
  <g stroke="#446688" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)">
    <path d="M 310 124 L 310 176"/><path d="M 420 124 L 420 176"/>
  </g>
  <text x="245" y="222" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">也就吞掉了 x = 2；下一个未覆盖点是 x = 3</text>

  <rect x="60" y="244" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">交换论证：覆盖 p 的矩形右边界 ≤ p + w，把它顶到 p + w 只会多盖不少盖</text>
  <rect x="60" y="282" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">所以第一个矩形的最优选择可以直接定下来，递归处理剩下的点</text>
  <rect x="60" y="320" width="480" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">实现上不必真放矩形：排序后一次扫描，指针跳到第一个 x &gt; p + w</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">y 坐标自始至终不参与计算</text>
</svg>
