<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">后缀覆盖模型：只有「根」单词才独占一段</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "time#bell#"，indices = [0, 2, 5]</text>

  <text x="40" y="76" font-size="10" fill="#666" filter="url(#rough2)">段 1：time 独占 → 4 + 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="82" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="58" y="103" fill="#3a4a66">t</text>
    <rect x="78" y="82" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="96" y="103" fill="#3a4a66">i</text>
    <rect x="116" y="82" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="134" y="103" fill="#3a4a66">m</text>
    <rect x="154" y="82" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="172" y="103" fill="#3a4a66">e</text>
    <rect x="192" y="82" width="36" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.3"/>
    <text x="210" y="103" fill="#777">#</text>
  </g>
  <rect x="112" y="78" width="76" height="40" rx="7" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">me 复用尾段，贡献 0</text>

  <text x="40" y="152" font-size="10" fill="#666" filter="url(#rough2)">段 2：bell 独占 → 4 + 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="40" y="158" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="58" y="179" fill="#8a6a20">b</text>
    <rect x="78" y="158" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="96" y="179" fill="#8a6a20">e</text>
    <rect x="116" y="158" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="134" y="179" fill="#8a6a20">l</text>
    <rect x="154" y="158" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="172" y="179" fill="#8a6a20">l</text>
    <rect x="192" y="158" width="36" height="32" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.3"/>
    <text x="210" y="179" fill="#777">#</text>
  </g>

  <text x="330" y="76" font-size="10" fill="#444" filter="url(#rough2)">单词清单与去留</text>
  <rect x="330" y="82" width="205" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="102" font-size="10" fill="#3a4a66" filter="url(#rough2)">time → 根，计 4+1 = 5</text>

  <rect x="330" y="122" width="205" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="142" font-size="10" fill="#3a5a30" filter="url(#rough2)">me → 非根，计 0</text>

  <rect x="330" y="162" width="205" height="30" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="182" font-size="10" fill="#8a6a20" filter="url(#rough2)">bell → 根，计 4+1 = 5</text>

  <path d="M 326 132 L 250 120 L 194 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 326 177 L 234 177" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="40" y="206" width="480" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="228" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = 所有「根」单词的 (|w| + 1) 之和</text>
  <text x="56" y="248" font-size="10" fill="#555" filter="url(#rough2)">根 = 不是任何其它单词真后缀的单词；(4+1) + (4+1) = 10</text>

  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：判断的是「后缀」关系，不是前缀关系（time 与 tim 都要独占）</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">重复出现的单词天然只算一次</text>
</svg>
