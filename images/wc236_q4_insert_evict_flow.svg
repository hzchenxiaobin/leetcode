<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">addElement 三步走：落桶 → 平衡 → 淘汰</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="14" y="56" width="76" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="52" y="72" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">① 落桶</text>

  <g filter="url(#sk)">
    <rect x="240" y="54" width="160" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="200" y="102" width="240" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="470" y="102" width="110" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="200" y="150" width="240" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="470" y="150" width="110" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="225" y="198" width="190" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="72" text-anchor="middle" font-size="12.5" fill="#33517a" font-weight="bold">addElement(num)</text>
  <path d="M 320 84 L 320 98" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="320" y="122" text-anchor="middle" font-size="11.5" fill="#8a6415">num ≤ max(lo) 或 |lo| ＜ k ?</text>
  <path d="M 442 117 L 466 117" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="454" y="110" text-anchor="middle" font-size="10.5" fill="#666">是</text>
  <text x="525" y="122" text-anchor="middle" font-size="11.5" fill="#8f3830" font-weight="bold">lo ← num</text>
  <path d="M 320 134 L 320 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="330" y="143" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <text x="320" y="170" text-anchor="middle" font-size="11.5" fill="#8a6415">num ≥ min(hi) 或 |hi| ＜ k ?</text>
  <path d="M 442 165 L 466 165" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="454" y="158" text-anchor="middle" font-size="10.5" fill="#666">是</text>
  <text x="525" y="170" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">hi ← num</text>
  <path d="M 320 182 L 320 194" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="330" y="192" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <text x="320" y="218" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold">mid ← num，mid_sum ＋＝ num</text>

  <g filter="url(#sk)">
    <rect x="14" y="248" width="76" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="52" y="264" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">② 平衡</text>

  <g filter="url(#sk)">
    <rect x="110" y="248" width="150" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="290" y="248" width="170" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="480" y="240" width="150" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="240" y="312" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="110" y="370" width="420" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="185" y="268" text-anchor="middle" font-size="11.5" fill="#8f3830" font-weight="bold">|lo| ＞ k ?（lo 溢出）</text>
  <text x="185" y="286" text-anchor="middle" font-size="11" fill="#8f3830">x ＝ max(lo) 出桶</text>
  <path d="M 262 271 L 286 271" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="375" y="268" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">mid 为空 且 |hi| ＜ k ?</text>
  <text x="375" y="286" text-anchor="middle" font-size="11" fill="#8a6415">（预热期：前 2k 个元素）</text>
  <path d="M 462 271 L 476 260" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="471" y="252" text-anchor="middle" font-size="10.5" fill="#b85450">是</text>
  <text x="555" y="253" text-anchor="middle" font-size="11.5" fill="#8f3830" font-weight="bold">x 直送 hi ⚠</text>
  <text x="555" y="266" text-anchor="middle" font-size="10" fill="#8f3830">（最易漏掉的修正！）</text>
  <path d="M 375 296 L 375 308" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="385" y="306" text-anchor="middle" font-size="10.5" fill="#666">否</text>
  <text x="330" y="332" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold">x 入 mid，mid_sum ＋＝ x</text>
  <text x="330" y="350" text-anchor="middle" font-size="10.5" fill="#2e5a24">（满窗后 lo 溢出恒来 mid）</text>
  <text x="320" y="390" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">|hi| ＞ k ?（hi 溢出，仅满窗后可能发生）</text>
  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#8a6415">x ＝ min(hi) 出桶 → 恒去 mid，mid_sum ＋＝ x</text>

  <g filter="url(#sk)">
    <rect x="14" y="430" width="76" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="52" y="446" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">③ 淘汰</text>

  <g filter="url(#sk)">
    <rect x="110" y="428" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="286" y="424" width="344" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="286" y="456" width="344" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="286" y="488" width="344" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="185" y="448" text-anchor="middle" font-size="11.5" fill="#33517a" font-weight="bold">|q| ＞ m ?</text>
  <text x="185" y="466" text-anchor="middle" font-size="11" fill="#33517a">old ＝ 队首出队</text>
  <path d="M 262 451 L 282 437" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="458" y="442" text-anchor="middle" font-size="11" fill="#8f3830">old ≤ max(lo)：lo 删 old；从 mid 借最小补 lo</text>
  <text x="458" y="474" text-anchor="middle" font-size="11" fill="#8a6415">old ≥ min(hi)：hi 删 old；从 mid 借最大补 hi</text>
  <text x="458" y="506" text-anchor="middle" font-size="11" fill="#2e5a24">否则：mid 删 old，mid_sum −＝ old（无需借补）</text>

  <g filter="url(#sk)">
    <rect x="130" y="528" width="380" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="544" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">查询 calculateMKAverage：|q| ＜ m → −1</text>
  <text x="320" y="559" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">否则返回 ⌊ mid_sum / (m − 2k) ⌋</text>
</svg>
