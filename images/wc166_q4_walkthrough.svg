<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：8 → 5 → 14 → 0，三步归零</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">bit0=r0c0，bit1=r0c1，bit2=r1c0，bit3=r1c1；每步 state ← state XOR mask</text>

  <g filter="url(#rough2)">
    <rect x="24" y="62" width="512" height="28" fill="#eeeeee" stroke="#999" stroke-width="1.3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#444" font-weight="bold">
    <text x="40" y="81">步骤</text>
    <text x="122" y="81">按下格子</text>
    <text x="240" y="81">掩码（异或）</text>
    <text x="356" y="81">新状态</text>
    <text x="472" y="81">二进制</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="94" width="512" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <rect x="24" y="138" width="512" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6"/>
    <rect x="24" y="182" width="512" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <rect x="24" y="226" width="512" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#333">
    <text x="40" y="119">初始</text>
    <text x="122" y="119">—</text>
    <text x="240" y="119">—</text>
    <text x="356" y="119">8</text>
    <text x="472" y="119" font-family="monospace">1000</text>

    <text x="40" y="163">第 1 步</text>
    <text x="122" y="163">(1,0)</text>
    <text x="240" y="163" font-family="monospace">1101 = 13</text>
    <text x="356" y="163">8 ⊕ 13 = 5</text>
    <text x="472" y="163" font-family="monospace">0101</text>

    <text x="40" y="207">第 2 步</text>
    <text x="122" y="207">(0,1)</text>
    <text x="240" y="207" font-family="monospace">1011 = 11</text>
    <text x="356" y="207">5 ⊕ 11 = 14</text>
    <text x="472" y="207" font-family="monospace">1110</text>

    <text x="40" y="251">第 3 步</text>
    <text x="122" y="251">(1,1)</text>
    <text x="240" y="251" font-family="monospace">1110 = 14</text>
    <text x="356" y="251">14 ⊕ 14 = 0</text>
    <text x="472" y="251" font-family="monospace">0000</text>
  </g>

  <text x="40" y="286" font-size="9" fill="#8a8a8a" filter="url(#rough2)">掩码里为 1 的位 = 该格自身及其上下左右邻居（越界的不算）</text>

  <rect x="24" y="296" width="512" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="314" font-size="10" fill="#2f6b4f" font-weight="bold" filter="url(#rough2)">BFS 结论：dist[0] = 3，且第 1、2 层不含 0 ⇒ 3 就是最少反转次数</text>
  <text x="38" y="328" font-size="9" fill="#6b8f5e" filter="url(#rough2)">可选顺序不唯一，例如先按 (0,1) 再按 (1,0) 最后 (1,1) 同样归零</text>

  <rect x="24" y="346" width="512" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="38" y="364" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">示例 3：[[1,0,0],[1,0,0]]，start = 001001₂ = 9；2×3 反转矩阵秩仅 4，</text>
  <text x="38" y="380" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">64 个状态只有 16 个可达 ⇒ 队列耗尽仍未见 0，返回 −1</text>
</svg>
