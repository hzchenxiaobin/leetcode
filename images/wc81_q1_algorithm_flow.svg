<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="392" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：初始化哨兵 → 左扫 → 右扫取 min → 输出</text>

  <rect x="180" y="48" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">ans ← [n] * n（哨兵，n 大于任何真实距离）</text>

  <path d="M 310 82 L 310 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="106" width="320" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="128" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">左扫 i = 0 → n−1：s[i] = c ⇒ last ← i</text>
  <text x="310" y="147" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">last ≠ −1 ⇒ ans[i] ← i − last</text>

  <path d="M 470 132 L 552 132 L 552 92 L 400 92 L 400 104" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="490" y="86" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i += 1（循环）</text>

  <path d="M 310 158 L 310 178" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="180" width="320" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="202" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">右扫 j = n−1 → 0：s[j] = c ⇒ next ← j</text>
  <text x="310" y="221" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">next ≠ n ⇒ ans[j] ← min(ans[j], next − j)</text>

  <path d="M 150 206 L 68 206 L 68 166 L 220 166 L 220 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j −= 1（循环）</text>

  <path d="M 310 232 L 310 252" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="254" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="276" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">返回 ans（长度 n，每个值 ≤ n−1）</text>

  <text x="310" y="318" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">c 至少出现一次 ⇒ 每个位置至少一侧有 c，哨兵最终都会被真实距离覆盖</text>
  <text x="310" y="340" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">时间 O(n)：两遍扫描各访问每个下标一次；额外空间 O(1)：只有 last / next 两个变量</text>
  <text x="310" y="368" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意第二遍是 min 而不是覆盖，因为左扫已经给出一个候选值</text>
</svg>
