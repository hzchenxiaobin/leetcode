<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="392" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">前缀和 + 哈希：把子数组和转成两个前缀和之差</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">子数组 nums[i..j) 的和 = pre[j] − pre[i]，要它等于 goal</text>
  <rect x="60" y="82" width="180" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="106.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pre[j] = goal？</text>
  <text x="260" y="110" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">否 → 需要 pre[i] = pre[j] − goal</text>
  <rect x="60" y="156" width="250" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="182.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">哈希表：pre[i] 出现过的次数</text>
  <path d="M 185 200 L 185 224" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="226" width="250" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="252.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">累加 ans += cnt[pre − goal]</text>
  <path d="M 185 270 L 185 294" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="296" width="250" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="322.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[pre] += 1</text>
  <text x="430" y="170" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么能 O(n)：</text>
  <text x="430" y="198" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">每个右端点只查一次表</text>
  <text x="430" y="224" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">表里存的是「该前缀和</text>
  <text x="430" y="248" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">到目前为止出现次数」</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">初始化 cnt[0] = 1：允许从数组开头起的子数组（i = 0 的空前缀）</text>
</svg>
