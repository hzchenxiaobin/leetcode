<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：逐下标走查</text>
  <path d="M 200 42 Q 320 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Table 1 label -->
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">nums = [1,3,2]</text>

  <!-- Table 1 header -->
  <g filter="url(#sk)">
    <rect x="110" y="76" width="60" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="170" y="76" width="80" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="250" y="76" width="140" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="390" y="76" width="180" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="140" y="93">i</text>
    <text x="210" y="93">nums[i]</text>
    <text x="320" y="93">数位和</text>
    <text x="480" y="93">匹配？</text>
  </g>

  <!-- Table 1 rows -->
  <g filter="url(#sk)">
    <rect x="110" y="102" width="60" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="170" y="102" width="80" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="250" y="102" width="140" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="390" y="102" width="180" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="110" y="128" width="60" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="170" y="128" width="80" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="250" y="128" width="140" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="390" y="128" width="180" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="110" y="154" width="60" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="170" y="154" width="80" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="250" y="154" width="140" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="390" y="154" width="180" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="140" y="119" fill="#333">0</text>
    <text x="210" y="119" fill="#333">1</text>
    <text x="320" y="119" fill="#333">1</text>
    <text x="480" y="119" fill="#b85450">1 ≠ 0 ✗</text>
    <text x="140" y="145" fill="#333">1</text>
    <text x="210" y="145" fill="#333">3</text>
    <text x="320" y="145" fill="#333">3</text>
    <text x="480" y="145" fill="#b85450">3 ≠ 1 ✗</text>
    <text x="140" y="171" fill="#333" font-weight="bold">2</text>
    <text x="210" y="171" fill="#333">2</text>
    <text x="320" y="171" fill="#333">2</text>
    <text x="480" y="171" fill="#2e6e2e" font-weight="bold">2 = 2 ✓</text>
  </g>
  <text x="320" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">答案：2（首个 ✓ 的下标）</text>

  <!-- Table 2 label -->
  <text x="320" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">nums = [1,10,11]</text>

  <!-- Table 2 header -->
  <g filter="url(#sk)">
    <rect x="110" y="236" width="60" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="170" y="236" width="80" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="250" y="236" width="140" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="390" y="236" width="180" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="140" y="253">i</text>
    <text x="210" y="253">nums[i]</text>
    <text x="320" y="253">数位和</text>
    <text x="480" y="253">匹配？</text>
  </g>

  <!-- Table 2 rows -->
  <g filter="url(#sk)">
    <rect x="110" y="262" width="60" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="170" y="262" width="80" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="250" y="262" width="140" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="390" y="262" width="180" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="110" y="288" width="60" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="170" y="288" width="80" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="250" y="288" width="140" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="390" y="288" width="180" height="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="110" y="314" width="60" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="170" y="314" width="80" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="250" y="314" width="140" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
    <rect x="390" y="314" width="180" height="26" fill="#ffffff" stroke="#b8c6d4" stroke-width="1"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace">
    <text x="140" y="279" fill="#333">0</text>
    <text x="210" y="279" fill="#333">1</text>
    <text x="320" y="279" fill="#333">1</text>
    <text x="480" y="279" fill="#b85450">1 ≠ 0 ✗</text>
    <text x="140" y="305" fill="#333" font-weight="bold">1</text>
    <text x="210" y="305" fill="#333">10</text>
    <text x="320" y="305" fill="#333">1+0 = 1</text>
    <text x="480" y="305" fill="#2e6e2e" font-weight="bold">1 = 1 ✓</text>
    <text x="140" y="331" fill="#999">2</text>
    <text x="210" y="331" fill="#999">11</text>
    <text x="320" y="331" fill="#999">（未检查）</text>
    <text x="480" y="331" fill="#999">已提前返回</text>
  </g>
  <text x="320" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">答案：1</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="560" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#888">若整趟扫描都没有 ✓，返回 −1（如 nums = [1,2,3]）</text>
</svg>
