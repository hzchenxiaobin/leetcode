<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 402" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="402" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 枚举删除起点 + 集合去重</text>
  <rect x="36" y="66" width="488" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">建前缀和 px[i], py[i]（走完前 i 步的坐标）</text>
  <path d="M 280 108 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="116" width="488" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">全程位移 T = (px[n], py[n])</text>
  <path d="M 280 158 L 280 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="166" width="488" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">for l = 0 .. n-k：候选 = T - (P[l+k] - P[l])</text>
  <path d="M 280 208 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="216" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">把候选丢进集合 seen</text>
  <path d="M 280 258 L 280 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="266" width="488" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 |seen|</text>
  <rect x="36" y="322" width="488" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54" y="346" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">时间 O(n)：候选共 n-k+1 个，每个 O(1)；空间 O(n) 前缀和 + 集合</text>
</svg>
