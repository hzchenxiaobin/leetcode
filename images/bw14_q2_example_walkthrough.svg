<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="260" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1 演算：[[0,2],[3,4],[5,7]] 挖去 [1,6)</text>

  <!-- 数轴 -->
  <line x1="60" y1="120" x2="620" y2="120" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="12" fill="#666">
    <text x="60" y="142" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="140" y="142" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="220" y="142" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="300" y="142" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="380" y="142" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="460" y="142" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="540" y="142" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="620" y="142" text-anchor="middle" filter="url(#rough2)">7</text>
  </g>
  <g stroke="#999" stroke-width="1.2">
    <line x1="60" y1="120" x2="60" y2="128" filter="url(#rough2)"/>
    <line x1="140" y1="120" x2="140" y2="128" filter="url(#rough2)"/>
    <line x1="220" y1="120" x2="220" y2="128" filter="url(#rough2)"/>
    <line x1="300" y1="120" x2="300" y2="128" filter="url(#rough2)"/>
    <line x1="380" y1="120" x2="380" y2="128" filter="url(#rough2)"/>
    <line x1="460" y1="120" x2="460" y2="128" filter="url(#rough2)"/>
    <line x1="540" y1="120" x2="540" y2="128" filter="url(#rough2)"/>
    <line x1="620" y1="120" x2="620" y2="128" filter="url(#rough2)"/>
  </g>

  <!-- 原区间条 -->
  <rect x="60" y="62" width="160" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[0,2)</text>
  <rect x="300" y="62" width="80" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[3,4)</text>
  <rect x="460" y="62" width="160" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="54" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">[5,7)</text>

  <!-- 被挖区带 -->
  <rect x="140" y="96" width="400" height="26" rx="3" fill="#fce4ec" fill-opacity="0.75" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="340" y="92" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">toBeRemoved = [1,6)</text>

  <!-- 保留结果 -->
  <rect x="60" y="176" width="80" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[0,1) ✓</text>
  <text x="300" y="190" font-size="12" fill="#b85450" filter="url(#rough2)">[3,4) 整段被挖掉 ✗</text>
  <rect x="540" y="176" width="80" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="580" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[6,7) ✓</text>

  <text x="80" y="238" font-size="13" fill="#666" filter="url(#rough2)">输出 [[0,1],[6,7]]：按输入顺序拼接，左段在前右段在后，天然有序，无需排序合并。</text>
</svg>
