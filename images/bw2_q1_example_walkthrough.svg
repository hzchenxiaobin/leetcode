<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：三组输入的完整走查</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一步只依赖：最小元素 mn → 数位和 S → 奇偶</text>

  <rect x="30" y="62" width="160" height="256" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1（官方）</text>
  <text x="110" y="102" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">输入 [34,23,1,24,75,33,54,8]</text>
  <rect x="88" y="114" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="14" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mn = 1，只有 1 个数位</text>
  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">S = 1</text>
  <rect x="76" y="204" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="110" y="221" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S 为奇数</text>
  <rect x="80" y="248" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="271" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="110" y="304" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">最小元素个位 1，S=1 奇</text>

  <rect x="205" y="62" width="160" height="256" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">示例 2（官方）</text>
  <text x="285" y="102" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">输入 [99,77,33,66,55]</text>
  <rect x="245" y="114" width="40" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="287" y="114" width="40" height="34" fill="#fff" stroke="#666" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="136" text-anchor="middle" font-size="14" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="307" y="136" text-anchor="middle" font-size="14" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="285" y="142" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（33 的两个数位）</text>
  <text x="285" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mn = 33，分解数位 3、3</text>
  <text x="285" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">S = 3 + 3 = 6</text>
  <rect x="251" y="204" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="285" y="221" text-anchor="middle" font-size="10" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">S 为偶数</text>
  <rect x="255" y="248" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="285" y="271" text-anchor="middle" font-size="14" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="285" y="304" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">77、55 等都无需理会</text>

  <rect x="380" y="62" width="160" height="256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">自造示例 3</text>
  <text x="460" y="102" text-anchor="middle" font-size="8.5" fill="#555" filter="url(#rough2)">输入 [7, 240, 115]</text>
  <rect x="438" y="114" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="136" text-anchor="middle" font-size="14" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="460" y="164" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">mn = 7，240/115 都更大</text>
  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">S = 7</text>
  <rect x="426" y="204" width="68" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="460" y="221" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S 为奇数</text>
  <rect x="430" y="248" width="60" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="271" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="460" y="304" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">数组不必有序，照常扫描</text>

  <path d="M 190 190 L 203 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 365 190 L 378 190" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="336" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">答案 = (mn 的数位和 + 1) mod 2 —— 与数组长度、顺序无关</text>
</svg>
