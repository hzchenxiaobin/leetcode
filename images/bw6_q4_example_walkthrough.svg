<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：aabcc → ccdee 的三次转换</text>

  <!-- 步骤 1: c->e -->
  <text x="60" y="64" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 步：c → e（目标 e 不在场，安全）</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60"  y="74" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="98"  y="74" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="136" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="174" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="212" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="79" y="96">a</text><text x="117" y="96">a</text>
    <text x="155" y="96">b</text><text x="193" y="96">c</text><text x="231" y="96">c</text>
  </g>
  <path d="M 250 91 L 292 91" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c→e</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="300" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="338" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="376" y="74" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="414" y="74" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="452" y="74" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="319" y="96">a</text><text x="357" y="96">a</text>
    <text x="395" y="96">b</text><text x="433" y="96" fill="#2d5a22" font-weight="bold">e</text><text x="471" y="96" fill="#2d5a22" font-weight="bold">e</text>
  </g>
  <text x="510" y="96" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">aabee</text>

  <!-- 步骤 2: b->d -->
  <text x="60" y="146" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 步：b → d（目标 d 不在场，安全）</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60"  y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="98"  y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="174" y="156" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="212" y="156" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="79" y="178">a</text><text x="117" y="178">a</text>
    <text x="155" y="178">b</text><text x="193" y="178" fill="#2d5a22" font-weight="bold">e</text><text x="231" y="178" fill="#2d5a22" font-weight="bold">e</text>
  </g>
  <path d="M 250 173 L 292 173" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b→d</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="300" y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="338" y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="376" y="156" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="414" y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="452" y="156" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="319" y="178">a</text><text x="357" y="178">a</text>
    <text x="395" y="178" fill="#2d5a22" font-weight="bold">d</text><text x="433" y="178">e</text><text x="471" y="178">e</text>
  </g>
  <text x="510" y="178" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">aadee</text>

  <!-- 步骤 3: a->c -->
  <text x="60" y="228" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 3 步：a → c（原 c 已清空，不会污染）</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60"  y="238" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="98"  y="238" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="136" y="238" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="238" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="212" y="238" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="79" y="260" fill="#2d5a22" font-weight="bold">a</text><text x="117" y="260" fill="#2d5a22" font-weight="bold">a</text>
    <text x="155" y="260">d</text><text x="193" y="260">e</text><text x="231" y="260">e</text>
  </g>
  <path d="M 250 255 L 292 255" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a→c</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="300" y="238" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="338" y="238" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="376" y="238" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="414" y="238" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="452" y="238" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="319" y="260" fill="#7a5c1e" font-weight="bold">c</text><text x="357" y="260" fill="#7a5c1e" font-weight="bold">c</text>
    <text x="395" y="260" fill="#7a5c1e" font-weight="bold">d</text><text x="433" y="260" fill="#7a5c1e" font-weight="bold">e</text><text x="471" y="260" fill="#7a5c1e" font-weight="bold">e</text>
  </g>
  <text x="510" y="260" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">ccdee ✓</text>

  <!-- 底部说明 -->
  <rect x="60" y="294" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">顺序要点：先转换「目标字符不在当前串中」的字符</text>
  <text x="280" y="332" text-anchor="middle" font-size="12.5" fill="#8c3a34" filter="url(#rough2)">若顺序颠倒（先 a→c），新旧 c 混杂，无法再分离</text>
</svg>
