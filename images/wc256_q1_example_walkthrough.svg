<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [9,4,1,7]，k = 2 → 排序后一趟滑窗</text>
  <path d="M 240 42 Q 440 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="34" y="66" font-size="12" fill="#888" font-family="monospace">先升序排序：[9, 4, 1, 7] → [1, 4, 7, 9]（n = 4，窗口数 = n − k + 1 = 3）</text>

  <!-- row 1: i=0 -->
  <text x="30" y="118" font-size="12.5" fill="#2b6e9e" font-weight="bold">① i = 0</text>
  <g font-size="15" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="150" y="96" width="40" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g><text x="170" y="120" fill="#2b6e9e">1</text>
    <g filter="url(#sk)"><rect x="198" y="96" width="40" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g><text x="218" y="120" fill="#2b6e9e">4</text>
    <g filter="url(#sk)"><rect x="246" y="96" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="266" y="120" fill="#aaa">7</text>
    <g filter="url(#sk)"><rect x="294" y="96" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="314" y="120" fill="#aaa">9</text>
  </g>
  <path d="M 150 134 L 146 140 L 242 140 L 238 134" stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="194" y="156" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">窗口 [0,1] = {1, 4}</text>
  <g filter="url(#sk)"><rect x="560" y="104" width="130" height="30" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="625" y="123" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">diff = 4−1 = 3</text>
  <g filter="url(#sk)"><rect x="720" y="104" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="780" y="123" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" font-weight="bold">ans = 3</text>

  <!-- row 2: i=1 -->
  <text x="30" y="212" font-size="12.5" fill="#2b6e9e" font-weight="bold">② i = 1</text>
  <g font-size="15" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="150" y="190" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="170" y="214" fill="#aaa">1</text>
    <g filter="url(#sk)"><rect x="198" y="190" width="40" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g><text x="218" y="214" fill="#2b6e9e">4</text>
    <g filter="url(#sk)"><rect x="246" y="190" width="40" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g><text x="266" y="214" fill="#2b6e9e">7</text>
    <g filter="url(#sk)"><rect x="294" y="190" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="314" y="214" fill="#aaa">9</text>
  </g>
  <path d="M 198 228 L 194 234 L 290 234 L 286 228" stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="242" y="250" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">窗口 [1,2] = {4, 7}</text>
  <g filter="url(#sk)"><rect x="560" y="198" width="130" height="30" rx="6" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="625" y="217" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">diff = 7−4 = 3</text>
  <g filter="url(#sk)"><rect x="720" y="198" width="120" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="780" y="217" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" font-weight="bold">ans = 3</text>

  <!-- row 3: i=2 (best) -->
  <text x="30" y="306" font-size="12.5" fill="#2e6e2e" font-weight="bold">③ i = 2</text>
  <g font-size="15" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="150" y="284" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="170" y="308" fill="#aaa">1</text>
    <g filter="url(#sk)"><rect x="198" y="284" width="40" height="36" rx="5" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g><text x="218" y="308" fill="#aaa">4</text>
    <g filter="url(#sk)"><rect x="246" y="284" width="40" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g><text x="266" y="308" fill="#2e6e2e">7</text>
    <g filter="url(#sk)"><rect x="294" y="284" width="40" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/></g><text x="314" y="308" fill="#2e6e2e">9</text>
  </g>
  <path d="M 246 322 L 242 328 L 338 328 L 334 322" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="292" y="344" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">窗口 [2,3] = {7, 9} ★ 最优</text>
  <g filter="url(#sk)"><rect x="560" y="292" width="130" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="625" y="311" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">diff = 9−7 = 2</text>
  <g filter="url(#sk)"><rect x="720" y="292" width="120" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="780" y="311" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">ans = 2 ✓</text>

  <!-- result banner -->
  <g filter="url(#sk)">
    <rect x="60" y="396" width="760" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="440" y="420" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" font-family="monospace">只考察 n − k + 1 = 3 个窗口，而非 C(4,2) = 6 个子集</text>
  <text x="440" y="440" text-anchor="middle" font-size="11.5" fill="#a08040">最小差值 = 2，对应选出 {7, 9}——与题面枚举 6 种选法的结果一致</text>
</svg>
