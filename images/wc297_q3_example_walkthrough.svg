<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：k = 2 时 DP 退化为「最优对半分割」</text>
  <path d="M 110 36 Q 320 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="54" text-anchor="middle" font-size="11.5" fill="#666">全集 U = 11111₂，总量 8+15+10+20+8 = 61（b0…b4 对应下标 0…4）</text>

  <!-- 包格子 -->
  <g filter="url(#sk)"><rect x="190" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="242" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="294" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="346" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="398" y="62" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="216" y="81" text-anchor="middle" font-size="12" fill="#33455e">8</text>
  <text x="268" y="81" text-anchor="middle" font-size="12" fill="#33455e">15</text>
  <text x="320" y="81" text-anchor="middle" font-size="12" fill="#33455e">10</text>
  <text x="372" y="81" text-anchor="middle" font-size="12" fill="#33455e">20</text>
  <text x="424" y="81" text-anchor="middle" font-size="12" fill="#33455e">8</text>
  <text x="216" y="108" text-anchor="middle" font-size="10.5" fill="#666">b0</text>
  <text x="268" y="108" text-anchor="middle" font-size="10.5" fill="#666">b1</text>
  <text x="320" y="108" text-anchor="middle" font-size="10.5" fill="#666">b2</text>
  <text x="372" y="108" text-anchor="middle" font-size="10.5" fill="#666">b3</text>
  <text x="424" y="108" text-anchor="middle" font-size="10.5" fill="#666">b4</text>

  <!-- 第 1 层 -->
  <g filter="url(#sk)"><rect x="110" y="118" width="420" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="136" text-anchor="middle" font-size="11.5" fill="#33455e">第 1 层：f[1][s] = sum[s]（只剩一个孩子，s 只能整包全拿）</text>

  <!-- 第 2 层 -->
  <text x="320" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">第 2 层：枚举 t ⊆ U，逐个算 max( sum[U∖t], sum[t] ) 再取 min</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="56" y="180" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="206" y="180" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="270" y="180" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="420" y="180" width="64" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="484" y="180" width="88" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="131" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">t（第 2 个孩子）</text>
  <text x="238" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">sum[t]</text>
  <text x="345" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">U∖t（第 1 个孩子）</text>
  <text x="452" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">sum</text>
  <text x="528" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33455e">max</text>

  <!-- 行 1：最优（绿色高亮） -->
  <g filter="url(#sk)"><rect x="56" y="204" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="206" y="204" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="270" y="204" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="420" y="204" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="484" y="204" width="88" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="131" y="223" text-anchor="middle" font-size="11.5" fill="#2e5e2e">{10,20}</text>
  <text x="238" y="223" text-anchor="middle" font-size="11.5" fill="#2e5e2e">30</text>
  <text x="345" y="223" text-anchor="middle" font-size="11.5" fill="#2e5e2e">{8,15,8}</text>
  <text x="452" y="223" text-anchor="middle" font-size="11.5" fill="#2e5e2e">31</text>
  <text x="528" y="223" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">31 ← 最优</text>

  <!-- 行 2 -->
  <g filter="url(#sk)"><rect x="56" y="234" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="206" y="234" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="270" y="234" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="234" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="484" y="234" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="131" y="253" text-anchor="middle" font-size="11.5" fill="#333">{20,15}</text>
  <text x="238" y="253" text-anchor="middle" font-size="11.5" fill="#333">35</text>
  <text x="345" y="253" text-anchor="middle" font-size="11.5" fill="#333">{8,10,8}</text>
  <text x="452" y="253" text-anchor="middle" font-size="11.5" fill="#333">26</text>
  <text x="528" y="253" text-anchor="middle" font-size="11.5" fill="#333">35</text>

  <!-- 行 3 -->
  <g filter="url(#sk)"><rect x="56" y="264" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="206" y="264" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="270" y="264" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="264" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="484" y="264" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="131" y="283" text-anchor="middle" font-size="11.5" fill="#333">{20,8}</text>
  <text x="238" y="283" text-anchor="middle" font-size="11.5" fill="#333">28</text>
  <text x="345" y="283" text-anchor="middle" font-size="11.5" fill="#333">{8,15,10}</text>
  <text x="452" y="283" text-anchor="middle" font-size="11.5" fill="#333">33</text>
  <text x="528" y="283" text-anchor="middle" font-size="11.5" fill="#333">33</text>

  <!-- 行 4 -->
  <g filter="url(#sk)"><rect x="56" y="294" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="206" y="294" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="270" y="294" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="294" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="484" y="294" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="131" y="313" text-anchor="middle" font-size="11.5" fill="#333">{8,15}</text>
  <text x="238" y="313" text-anchor="middle" font-size="11.5" fill="#333">23</text>
  <text x="345" y="313" text-anchor="middle" font-size="11.5" fill="#333">{10,20,8}</text>
  <text x="452" y="313" text-anchor="middle" font-size="11.5" fill="#333">38</text>
  <text x="528" y="313" text-anchor="middle" font-size="11.5" fill="#333">38</text>

  <!-- 行 5 -->
  <g filter="url(#sk)"><rect x="56" y="324" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="206" y="324" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="270" y="324" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="324" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="484" y="324" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="131" y="343" text-anchor="middle" font-size="11.5" fill="#333">{20,10,8}</text>
  <text x="238" y="343" text-anchor="middle" font-size="11.5" fill="#333">38</text>
  <text x="345" y="343" text-anchor="middle" font-size="11.5" fill="#333">{8,15}</text>
  <text x="452" y="343" text-anchor="middle" font-size="11.5" fill="#333">23</text>
  <text x="528" y="343" text-anchor="middle" font-size="11.5" fill="#333">38</text>

  <!-- 行 6 -->
  <g filter="url(#sk)"><rect x="56" y="354" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="206" y="354" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="270" y="354" width="150" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="420" y="354" width="64" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="484" y="354" width="88" height="30" fill="#ffffff" stroke="#999" stroke-width="1"/></g>
  <text x="131" y="373" text-anchor="middle" font-size="11.5" fill="#333">{8,15,10,20,8}</text>
  <text x="238" y="373" text-anchor="middle" font-size="11.5" fill="#333">61</text>
  <text x="345" y="373" text-anchor="middle" font-size="11.5" fill="#333">∅</text>
  <text x="452" y="373" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="528" y="373" text-anchor="middle" font-size="11.5" fill="#333">61</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="56" y="398" width="316" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="214" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">f[2][U] = 31 ✓（[8,15,8] 与 [10,20]）</text>
  <text x="214" y="442" text-anchor="middle" font-size="11" fill="#2e5e2e">max(31, 30) = 31，与示例输出一致</text>
  <g filter="url(#sk)"><rect x="388" y="398" width="192" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="484" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">下界对齐：</text>
  <text x="484" y="436" text-anchor="middle" font-size="10.5" fill="#7a5415">max(⌈61/2⌉, 20) = 31</text>
  <text x="484" y="450" text-anchor="middle" font-size="10.5" fill="#7a5415">恰好取到，可提前收工</text>
</svg>
