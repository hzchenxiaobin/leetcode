<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="aor" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="432" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：站在 i 面前只有两种选择——「怎么来的」不影响未来</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== Section 1: sequence and two choices ====== -->
  <text x="48" y="62" font-size="12.5" font-weight="bold" fill="#446688">① 示例 2 的题目序列（格内 = [points, brainpower]）</text>
  <text x="191" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">▼ 站在 i = 1</text>

  <g filter="url(#sk)">
    <rect x="70" y="82" width="62" height="48" rx="6" fill="#fff" stroke="#999" stroke-width="1.4"/>
    <rect x="160" y="82" width="62" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="250" y="82" width="62" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="340" y="82" width="62" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="430" y="82" width="62" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="101" y="98">Q0</text><text x="191" y="98">Q1</text><text x="281" y="98">Q2</text>
    <text x="371" y="98">Q3</text><text x="461" y="98">Q4</text>
  </g>
  <g font-size="13.5" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="101" y="118">[1,1]</text><text x="191" y="118">[2,2]</text><text x="281" y="118">[3,3]</text>
    <text x="371" y="118">[4,4]</text><text x="461" y="118">[5,5]</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#b85450">
    <text x="303" y="99">✗</text><text x="393" y="99">✗</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 224 106 L 244 106" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M 205 74 Q 330 30 452 74" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#aor)"/>
  </g>
  <text x="234" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">跳过</text>
  <text x="330" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8860b">解决 i：+2 分，跳过 2 题 → 落到 j = 4</text>

  <g font-size="10.5" text-anchor="middle">
    <text x="101" y="144" fill="#999">过去</text>
    <text x="281" y="144" fill="#b85450">被锁</text>
    <text x="371" y="144" fill="#b85450">被锁</text>
    <text x="461" y="144" fill="#4a7a3a" font-weight="bold">落点 j</text>
  </g>

  <!-- ====== Section 2: transition ====== -->
  <text x="48" y="172" font-size="12.5" font-weight="bold" fill="#446688">② 位置 i 的转移——两类选择取较大（dp[i]：从 i 到末尾的最大得分）</text>
  <g filter="url(#sk)">
    <rect x="56" y="186" width="278" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="356" y="186" width="268" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="195" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24">跳过 i ⇒ dp[i+1]</text>
  <text x="195" y="225" text-anchor="middle" font-size="10.5" fill="#555">不拿分，下一题照常决策</text>
  <text x="490" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">解决 i ⇒ points[i] + dp[j]</text>
  <text x="490" y="225" text-anchor="middle" font-size="10.5" fill="#555">j = i + brainpower[i] + 1（越界算 0）</text>

  <g filter="url(#sk)">
    <rect x="56" y="246" width="568" height="42" rx="8" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">dp[i] = max( dp[i+1] , points[i] + dp[min(j, n)] )</text>

  <!-- ====== callouts ====== -->
  <g filter="url(#sk)">
    <rect x="56" y="302" width="568" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">无后效性：主动跳过来、还是被前面的题锁完「放」出来——到达方式不影响从 i 出发的收益</text>
  <text x="340" y="343" text-anchor="middle" font-size="11" fill="#555">「锁」在运行时被编译成「跳得更远」，不残留禁令 ⇒ 状态 (i) 已完备，一维 DP 足矣</text>
  <g filter="url(#sk)">
    <rect x="56" y="368" width="568" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">打家劫舍 = brainpower 恒等于 1 的特例：把「跳 1 格」推广为「跳 brainpower[i] 格」</text>
  <text x="340" y="407" text-anchor="middle" font-size="11" fill="#555">同一族转移：当前位置二选一，取舍后跳到更远位置继续</text>
</svg>
