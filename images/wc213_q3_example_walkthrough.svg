<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>
  <text x="360" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 走查：heights = [4,2,7,6,9,14,12]，bricks = 5，ladders = 1 → 答案 4</text>

  <!-- ================= 柱状图 ================= -->
  <!-- 地面线 -->
  <path d="M 56 185 L 456 185" stroke="#999" stroke-width="2" filter="url(#rough2)"/>

  <!-- 柱：0~4 已到达（蓝），5 未达（红虚线），6 未达（灰虚线） -->
  <rect x="70" y="145" width="44" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="165" width="44" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="115" width="44" height="70" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="244" y="125" width="44" height="60" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="302" y="95" width="44" height="90" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="360" y="45" width="44" height="140" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="418" y="65" width="44" height="120" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 柱内高度值 -->
  <text x="92" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="177" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="266" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="324" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="382" y="59" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">14</text>
  <text x="440" y="79" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>

  <!-- 楼号 -->
  <text x="92" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="150" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="208" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="266" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="324" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="382" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=5</text>
  <text x="440" y="203" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=6</text>

  <!-- 段间 gap 标注 -->
  <text x="121" y="131" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">−2</text>
  <text x="121" y="144" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">免费</text>
  <text x="179" y="96" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+5</text>
  <text x="179" y="110" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">梯子 ✓</text>
  <text x="237" y="116" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="295" y="80" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="295" y="94" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">砖 ×3</text>
  <text x="353" y="30" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+5</text>
  <text x="353" y="44" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">砖不够 ✗</text>
  <text x="411" y="58" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">−2</text>

  <!-- 未达红叉 -->
  <path d="M 379 28 L 397 46" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 397 28 L 379 46" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="470" y="42" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="492" y="53" font-size="10.5" fill="#666" filter="url(#rough2)">梯子跨越（1 架）</text>
  <rect x="470" y="64" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="492" y="75" font-size="10.5" fill="#666" filter="url(#rough2)">砖块支付 3，剩 2</text>
  <rect x="470" y="86" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="492" y="97" font-size="10.5" fill="#666" filter="url(#rough2)">砖块赤字 → 止步，答案 4</text>

  <!-- ================= 走查表 ================= -->
  <!-- 表头 -->
  <rect x="40" y="216" width="660" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="140" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">段 h[i]→h[i+1]</text>
  <text x="218" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="290" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">堆（梯子组）</text>
  <text x="368" y="233" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">砖余额</text>
  <text x="404" y="233" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- 行 1：i=0 下坡 -->
  <rect x="40" y="242" width="660" height="36" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="140" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4→2</text>
  <text x="218" y="264" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−2</text>
  <text x="290" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∅</text>
  <text x="368" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="404" y="264" font-size="11.5" fill="#666" filter="url(#rough2)">下坡免费通过</text>

  <!-- 行 2：i=1 入堆占梯子位 -->
  <rect x="40" y="278" width="660" height="36" rx="3" fill="#e6f4ea" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="140" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2→7</text>
  <text x="218" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">+5</text>
  <text x="290" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{5}</text>
  <text x="368" y="300" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="404" y="300" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">入堆占梯子位，size 1 ≤ 1 ✓</text>

  <!-- 行 3：i=2 下坡 -->
  <rect x="40" y="314" width="660" height="36" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="140" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7→6</text>
  <text x="218" y="336" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="290" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{5}</text>
  <text x="368" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="404" y="336" font-size="11.5" fill="#666" filter="url(#rough2)">下坡免费通过</text>

  <!-- 行 4：i=3 溢出降级 -->
  <rect x="40" y="350" width="660" height="36" rx="3" fill="#fff8e1" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i=3</text>
  <text x="140" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6→9</text>
  <text x="218" y="372" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">+3</text>
  <text x="290" y="372" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{3,5}→{5}</text>
  <text x="368" y="372" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="404" y="372" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">入堆超编 → 弹 3 用砖，5−3=2</text>

  <!-- 行 5：i=4 赤字 -->
  <rect x="40" y="386" width="660" height="36" rx="3" fill="#fce4ec" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="408" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i=4</text>
  <text x="140" y="408" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9→14</text>
  <text x="218" y="408" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">+5</text>
  <text x="290" y="408" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{5,5}→{5}</text>
  <text x="368" y="408" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="404" y="408" font-size="11.5" fill="#b85450" filter="url(#rough2)">弹 5 用砖，2−5=−3 ✗ → 返回 4</text>

  <!-- 结论框 -->
  <rect x="40" y="432" width="660" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="454" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">答案 = 4：梯子押最大的 gap 5，砖只花 3、还剩 2 —— 后面 5 付不起才止步</text>
  <text x="370" y="474" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">对照：梯子若错配给 3，砖花 5、一分不剩（bricks=4 时直接卡死，见概念图）</text>
</svg>
