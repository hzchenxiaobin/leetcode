<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="500" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：l = “23”，r = “28”，b = 8</text>
  <path d="M 160 38 Q 330 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="24" y="52" width="300" height="316" rx="12" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="174" y="80" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">F(28)：D = “34”</text>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="174" y="106" font-size="12.5" font-weight="bold" fill="#2b2b2b">pos 0：d = 3，prev = 0</text>
    <text x="174" y="127" font-size="12" fill="#555">c = 0 → C(1+7, 7) = 8　（串 00…07）</text>
    <text x="174" y="147" font-size="12" fill="#555">c = 1 → C(1+6, 6) = 7　（串 11…17）</text>
    <text x="174" y="167" font-size="12" fill="#555">c = 2 → C(1+5, 5) = 6　（串 22…27）</text>
    <text x="174" y="187" font-size="12" font-weight="bold" fill="#2b6e9e">小计 21</text>
    <text x="174" y="213" font-size="12.5" font-weight="bold" fill="#2b2b2b">pos 1：d = 4，prev = 3</text>
    <text x="174" y="234" font-size="12" fill="#555">c = 3 → C(4, 4) = 1　（串 “33”）</text>
    <text x="174" y="260" font-size="12" fill="#555">尾部：“34” 非降 → +1</text>
  </g>
  <path d="M 60 280 Q 174 288 288 280" stroke="#4a8edb" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="174" y="312" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">F(28) = 21 + 1 + 1 = 23</text>
  <text x="174" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">即 x ∈ {0…7} ∪ {9…15} ∪ {18…23} ∪ {27, 28}</text>

  <g filter="url(#sk)">
    <rect x="336" y="52" width="300" height="316" rx="12" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="486" y="80" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">F(22)：D = “26”（= l − 1 = 22）</text>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="486" y="106" font-size="12.5" font-weight="bold" fill="#2b2b2b">pos 0：d = 2，prev = 0</text>
    <text x="486" y="127" font-size="12" fill="#555">c = 0 → C(8, 7) = 8</text>
    <text x="486" y="147" font-size="12" fill="#555">c = 1 → C(7, 6) = 7</text>
    <text x="486" y="167" font-size="12" font-weight="bold" fill="#2e6e2e">小计 15</text>
    <text x="486" y="193" font-size="12.5" font-weight="bold" fill="#2b2b2b">pos 1：d = 6，prev = 2</text>
    <text x="486" y="214" font-size="12" fill="#555">c ∈ {2,3,4,5} → 4 个串</text>
    <text x="486" y="234" font-size="12" fill="#555">（“22”“23”“24”“25”）</text>
    <text x="486" y="260" font-size="12" fill="#555">尾部：“26” 非降 → +1</text>
  </g>
  <path d="M 372 280 Q 486 288 600 280" stroke="#4a8e4a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="486" y="312" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">F(22) = 15 + 4 + 1 = 20</text>
  <text x="486" y="340" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">即 x ∈ {0…7} ∪ {9…15} ∪ {18…21} ∪ {22}</text>

  <g filter="url(#sk)">
    <rect x="120" y="392" width="420" height="92" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="330" y="418" font-size="15" font-weight="bold" fill="#7a5415">答案 = F(28) − F(22) = 23 − 20 = 3</text>
    <text x="330" y="443" font-size="12.5" fill="#555">新增的合法数：23 → “27”，27 → “33”，28 → “34”</text>
    <text x="330" y="464" font-size="11" fill="#888">与官方解释一致（27、33、34）</text>
  </g>
</svg>
