<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 4 —— 两种拆法殊途同归，都花 6</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">直觉上「对半拆」与「拆出 1」代价应当不同，不变量说：都等于 C(4,2)</text>

  <!-- strategy A -->
  <text x="170" y="68" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">策略 A：对半拆</text>
  <rect x="150" y="78" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <line x1="162" y1="106" x2="126" y2="140" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="178" y1="106" x2="214" y2="140" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2×2 = 4</text>

  <rect x="100" y="140" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="140" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <line x1="120" y1="168" x2="92" y2="196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="120" y1="168" x2="148" y2="196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220" y1="168" x2="192" y2="196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220" y1="168" x2="248" y2="196" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="92" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="148" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="192" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="248" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="170" y="240" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4 → 2 + 2（代价 4）；每个 2 → 1 + 1（代价 1）</text>
  <rect x="60" y="252" width="220" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="272" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 4 + 1 + 1 = 6 ✓</text>

  <text x="325" y="165" text-anchor="middle" font-size="14" fill="#999" font-weight="bold" filter="url(#rough2)">vs</text>

  <!-- strategy B -->
  <text x="475" y="68" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">策略 B：一条链</text>
  <rect x="450" y="78" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <line x1="460" y1="106" x2="394" y2="142" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="480" y1="106" x2="522" y2="140" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1×3 = 3</text>

  <circle cx="390" cy="154" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="510" y="140" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="159" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="520" y1="168" x2="455" y2="197" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="540" y1="168" x2="583" y2="204" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="192" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1×2 = 2</text>

  <circle cx="450" cy="208" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="572" y="204" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="590" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <line x1="582" y1="230" x2="553" y2="263" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="598" y1="230" x2="615" y2="263" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="585" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1×1 = 1</text>
  <circle cx="550" cy="272" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="550" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="618" cy="272" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="618" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="475" y="302" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4 → 1 + 3（代价 3）；3 → 1 + 2（代价 2）；2 → 1 + 1（代价 1）</text>
  <rect x="360" y="314" width="230" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="334" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">合计 3 + 2 + 1 = 6 ✓</text>

  <!-- table + conclusion -->
  <text x="70" y="368" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">n</text>
  <rect x="80" y="352" width="36" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="116" y="352" width="36" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="134" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="152" y="352" width="36" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="352" width="36" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="367" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="224" y="352" width="36" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="260" y="352" width="36" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="367" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>

  <text x="64" y="390" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">f(n)</text>
  <rect x="80" y="374" width="36" height="22" rx="3" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="116" y="374" width="36" height="22" rx="3" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="134" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="374" width="36" height="22" rx="3" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="188" y="374" width="36" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="389" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="224" y="374" width="36" height="22" rx="3" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="260" y="374" width="36" height="22" rx="3" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="389" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">15</text>

  <rect x="330" y="352" width="290" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="374" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = C(n,2) = n(n−1)/2（三角形数）</text>
  <text x="475" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">任意策略总代价相同——「最小」自动达成</text>
</svg>
