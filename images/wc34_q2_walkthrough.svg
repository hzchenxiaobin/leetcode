<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：list1 建表，扫描 list2 并随时剪枝</text>
  <text x="350" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">list1 = [Shogun, Tapioca Express, Burger King, KFC]，pos = {Shogun:0, Tapioca Express:1, Burger King:2, KFC:3}</text>
  <text x="350" y="68" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">list2 = [KFC, Shogun, Burger King]</text>

  <rect x="30" y="86" width="640" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="58" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">j</text>
  <text x="180" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">list2[j]</text>
  <text x="332" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i = pos[list2[j]]</text>
  <text x="438" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i + j</text>
  <text x="522" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">best</text>
  <text x="612" y="112" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">ans</text>

  <rect x="30" y="128" width="640" height="42" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="180" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">KFC</text>
  <text x="332" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="438" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="522" y="154" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="612" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[KFC]</text>

  <rect x="30" y="172" width="640" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="58" y="198" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="180" y="198" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">Shogun</text>
  <text x="332" y="198" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="438" y="198" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="522" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="612" y="198" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">[Shogun]</text>

  <rect x="30" y="216" width="640" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="58" y="245" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="180" y="245" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">Burger King</text>
  <text x="332" y="238" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">2 &gt; best = 1</text>
  <text x="332" y="254" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">不必查询</text>
  <text x="438" y="245" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">break</text>
  <text x="522" y="245" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="612" y="245" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">[Shogun]</text>

  <rect x="30" y="284" width="640" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="305" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么 j = 2 可以直接停？</text>
  <text x="46" y="323" font-size="10.5" fill="#555" filter="url(#rough2)">i ≥ 0，故 index sum = i + j ≥ j；当 j &gt; best 时，后面每个 j′ ≥ j 都不可能 ≤ best，答案已经确定。</text>

  <rect x="30" y="348" width="640" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="366" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⚠️ 边界：必须写 j &gt; best 而不是 j ≥ best。若 best = 2、j = 2 且 i = 0，索引和 2 可以打平，</text>
  <text x="46" y="382" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">这种并列答案必须收进结果集，提前 break 会漏掉它。</text>

  <text x="350" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最终返回 ["Shogun"]，最小索引和 = 1</text>
</svg>
