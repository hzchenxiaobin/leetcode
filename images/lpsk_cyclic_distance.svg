<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="445" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">配对代价 = 26 字母环上的最短距离</text>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">一次操作 = 把某个位置的字符沿环挪一步（z 的下一个是 a）</text>

  <!-- 字母环 -->
  <circle cx="175" cy="235" r="108" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">a</text>
  <text x="200.8" y="134.1" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">b</text>
  <text x="225.2" y="143.4" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">c</text>
  <text x="246.6" y="159.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">d</text>
  <text x="263.9" y="177.6" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">e</text>
  <text x="276" y="200.7" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">f</text>
  <text x="282.2" y="226" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">g</text>
  <text x="282.2" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">h</text>
  <text x="276" y="277.3" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i</text>
  <text x="263.9" y="300.4" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j</text>
  <text x="246.6" y="319.8" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k</text>
  <text x="225.2" y="334.6" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">l</text>
  <text x="200.8" y="343.9" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">m</text>
  <text x="175" y="347" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n</text>
  <text x="149.2" y="343.9" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">o</text>
  <text x="124.8" y="334.6" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">p</text>
  <text x="103.4" y="319.8" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">q</text>
  <text x="86.1" y="300.4" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">r</text>
  <text x="74" y="277.3" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s</text>
  <text x="67.8" y="252" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">t</text>
  <text x="67.8" y="226" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">u</text>
  <text x="74" y="200.7" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">v</text>
  <text x="86.1" y="177.6" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">w</text>
  <text x="103.4" y="158.2" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">x</text>
  <text x="124.8" y="143.4" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">y</text>
  <text x="149.2" y="135.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">z</text>

  <!-- 环内标注 -->
  <text x="205" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">d(a, d) = 3</text>
  <text x="143" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">d(z, a) = 1</text>
  <text x="175" y="240" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">26 字母环</text>

  <!-- 蓝弧：a → d 沿短弧 -->
  <polyline points="175,112 178,112 180.9,112.1 183.9,112.3 186.9,112.6 189.8,112.9 192.8,113.3 195.7,113.8 198.6,114.3 201.5,114.9 204.4,115.6 207.3,116.3 210.2,117.1 213,118 215.8,119 218.6,120 221.4,121.1 224.1,122.2 226.8,123.5 229.5,124.7 232.2,126.1 234.8,127.5 237.4,129 239.9,130.5 242.4,132.1 244.9,133.8 247.3,135.5 249.7,137.3 252,139.1 254.3,141 256.6,142.9"
            fill="none" stroke="#446688" stroke-width="2.5" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 红弧：z → a 跨环口 -->
  <polyline points="145.6,115.6 148.5,114.9 151.4,114.3 154.3,113.8 157.2,113.3 160.2,112.9 163.1,112.6 166.1,112.3 169.1,112.1 172,112 175,112"
            fill="none" stroke="#b85450" stroke-width="2.5" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 右侧说明框 -->
  <rect x="330" y="96" width="215" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">距离公式</text>
  <text x="437" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = min(|x−y|, 26−|x−y|) ∈ [0, 13]</text>

  <rect x="330" y="166" width="215" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a ↔ d：短弧 3 步（经 b、c）</text>
  <text x="437" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">绕另一侧要 23 步 → 代价取 3</text>

  <rect x="330" y="236" width="215" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">a ↔ z：跨过环口 1 步</text>
  <text x="437" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">代价是 1，不是 25！</text>

  <rect x="330" y="306" width="215" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="437" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">把一对端点改成相同：</text>
  <text x="437" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">沿短弧相向移动，总操作数 = d</text>
  <text x="437" y="368" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一步也省不掉，也无需多花</text>

  <rect x="48" y="398" width="504" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">配对位置互不重叠 → 各对代价独立可加，预算直接进区间 DP</text>
</svg>
