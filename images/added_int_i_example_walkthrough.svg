<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：[2,6,4] vs [9,7,5]</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#888">原数组顺序打乱 → 排序后逐位对齐（或直接用与顺序无关的 min / max / sum）</text>

  <!-- sorted nums1 row -->
  <text x="52" y="102" font-size="13" font-weight="bold" fill="#2b6e9e">排序 nums1</text>
  <g filter="url(#sk)">
    <rect x="160" y="82" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="292" y="82" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="424" y="82" width="56" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="188" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="320" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="452" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">6</text>

  <!-- +3 arrows -->
  <g filter="url(#sk)">
    <path d="M 188 126 L 188 158" stroke="#b85450" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 320 126 L 320 158" stroke="#b85450" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M 452 126 L 452 158" stroke="#b85450" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <text x="206" y="148" font-size="12" font-weight="bold" fill="#b85450">+3</text>
  <text x="338" y="148" font-size="12" font-weight="bold" fill="#b85450">+3</text>
  <text x="470" y="148" font-size="12" font-weight="bold" fill="#b85450">+3</text>

  <!-- sorted nums2 row -->
  <g filter="url(#sk)">
    <rect x="160" y="166" width="56" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="292" y="166" width="56" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="424" y="166" width="56" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="188" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="320" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">7</text>
  <text x="452" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="52" y="192" font-size="13" font-weight="bold" fill="#2e6e2e">排序 nums2</text>
  <text x="536" y="192" font-size="13" font-weight="bold" fill="#2e6e2e">✓</text>

  <!-- three equivalent formulas -->
  <g filter="url(#sk)">
    <rect x="40" y="238" width="180" height="72" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="230" y="238" width="180" height="72" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="420" y="238" width="180" height="72" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="130" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">min 版</text>
  <text x="130" y="282" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">min(nums2) − min(nums1)</text>
  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">= 5 − 2 = 3</text>
  <text x="320" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">max 版</text>
  <text x="320" y="282" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">max(nums2) − max(nums1)</text>
  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">= 9 − 6 = 3</text>
  <text x="510" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">sum 版</text>
  <text x="510" y="282" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">(21 − 12) / 3</text>
  <text x="510" y="300" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">= 9 / 3 = 3</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="200" y="326" width="240" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">x = 3 ✓</text>
</svg>
