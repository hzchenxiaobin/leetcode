<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = ABFCACDB，一趟扫完栈剩 2 个</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: c=A push [A] -->
  <rect x="16" y="56" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="90" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 1 步 · 读入 A</text>
  <text x="90" y="100" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">栈空 → 直接入栈</text>
  <text x="28" y="140" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="28" y="146" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="42" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">A</text>

  <!-- step 2: c=B pop, empty -->
  <rect x="172" y="56" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="246" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 2 步 · 读入 B</text>
  <text x="246" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">A + B 成对 →</text>
  <text x="246" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">弹出 A，B 不入栈</text>
  <text x="184" y="140" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="184" y="146" width="28" height="28" rx="4" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="198" y="165" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">空</text>

  <!-- step 3: c=F push [F] -->
  <rect x="328" y="56" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="402" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 3 步 · 读入 F</text>
  <text x="402" y="100" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">F 谁也配不上 → 入栈</text>
  <text x="340" y="140" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="340" y="146" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="354" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>

  <!-- step 4: c=C push [F,C] -->
  <rect x="484" y="56" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="558" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 4 步 · 读入 C</text>
  <text x="558" y="100" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">F + C 不成对 → 入栈</text>
  <text x="496" y="140" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="496" y="146" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="510" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>
  <rect x="528" y="146" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="542" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>

  <!-- step 5: c=A push [F,C,A] -->
  <rect x="16" y="206" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="90" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 5 步 · 读入 A</text>
  <text x="90" y="250" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">C + A 不成对 → 入栈</text>
  <text x="28" y="290" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="28" y="296" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="42" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>
  <rect x="60" y="296" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="74" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>
  <rect x="92" y="296" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="106" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">A</text>

  <!-- step 6: c=C push [F,C,A,C] -->
  <rect x="172" y="206" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="246" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 6 步 · 读入 C</text>
  <text x="246" y="250" text-anchor="middle" font-size="10.5" fill="#33517a" filter="url(#sk)">A + C 不成对 → 入栈</text>
  <text x="184" y="290" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="184" y="296" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="198" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>
  <rect x="216" y="296" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="230" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>
  <rect x="248" y="296" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="262" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">A</text>
  <rect x="280" y="296" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="294" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>

  <!-- step 7: c=D pop -> [F,C,A] -->
  <rect x="328" y="206" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="402" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 7 步 · 读入 D</text>
  <text x="402" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">C + D 成对 →</text>
  <text x="402" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">弹出 C，D 不入栈</text>
  <text x="340" y="290" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="340" y="296" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="354" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>
  <rect x="372" y="296" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="386" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>
  <rect x="404" y="296" width="28" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="418" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">A</text>

  <!-- step 8: c=B pop -> [F,C] -->
  <rect x="484" y="206" width="148" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#sk)"/>
  <text x="558" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 8 步 · 读入 B</text>
  <text x="558" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">A + B 成对 →</text>
  <text x="558" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">弹出 A，B 不入栈</text>
  <text x="496" y="290" font-size="9.5" fill="#888" filter="url(#sk)">栈（底 → 顶）</text>
  <rect x="496" y="296" width="28" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="510" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">F</text>
  <rect x="528" y="296" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="542" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a3a" filter="url(#sk)">C</text>

  <!-- final banner -->
  <rect x="16" y="354" width="608" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">扫描结束：栈 = [F, C]，长度 = 2 = 答案 ✓</text>
  <text x="320" y="393" text-anchor="middle" font-size="10.5" fill="#4a6a3a" filter="url(#sk)">第 7、8 步是关键级联：原串中 A（下标 4）与 B（下标 7）隔着 C、D 本不相邻，</text>
  <text x="320" y="409" text-anchor="middle" font-size="10.5" fill="#4a6a3a" filter="url(#sk)">第 7 步删掉 C、D 之后它们才在栈顶相遇成对 —— 「拼接出新对」被栈自动处理</text>
</svg>
