<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案只由「分界」个数决定：m = 相邻不同字符的对数 + 1</text>
  <path d="M 118 42 Q 380 50 660 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ① m = 1 -->
  <rect x="36" y="58" width="228" height="186" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="84" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">① m = 1：全是同一字符</text>
  <rect x="54" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="71" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="90" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="107" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="126" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="143" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="162" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="54" y="160" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">0000：整串都是回文</text>
  <text x="54" y="184" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">→ 答案 1</text>
  <text x="54" y="208" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">一路删到只剩 1 个字符</text>
  <text x="54" y="230" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">n = 1 也归入这一类</text>

  <!-- ② m = 2 -->
  <rect x="266" y="58" width="228" height="186" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="84" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">② m = 2：恰好一个分界</text>
  <rect x="284" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="301" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">1</text>
  <rect x="320" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="337" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">1</text>
  <rect x="356" y="96" width="34" height="38" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="373" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">0</text>
  <text x="284" y="160" font-size="11.5" fill="#a14340" filter="url(#rough2)">形如 1…10…0 或 0…01…1</text>
  <text x="284" y="184" font-size="15" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">→ 答案 2</text>
  <text x="284" y="208" font-size="11.5" fill="#a14340" filter="url(#rough2)">跨分界的子串首尾不同</text>
  <text x="284" y="230" font-size="11.5" fill="#a14340" filter="url(#rough2)">⇒ 两段都删不空，停在 2</text>

  <!-- ③ m >= 3 -->
  <rect x="496" y="58" width="228" height="186" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="514" y="84" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">③ m ≥ 3：两个以上分界</text>
  <rect x="514" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="527" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="544" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="557" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="574" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="587" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="604" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="617" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="634" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="647" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="664" y="96" width="26" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="677" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="514" y="160" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">101100：段 = 1|0|11|00</text>
  <text x="514" y="184" font-size="15" font-weight="bold" fill="#1f3a52" filter="url(#rough2)">→ 答案 1</text>
  <text x="514" y="208" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">先把每段压到长度 1</text>
  <text x="514" y="230" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">再借「cdc」合并，直到 1 个</text>

  <!-- 关键理由 -->
  <path d="M 150 244 L 150 262 L 370 262" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 244 L 380 262" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 610 244 L 610 262 L 390 262" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 380 262 L 380 278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="280" width="688" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">关键理由：跨越分界的子串，首字符 ≠ 末字符，一定不是回文</text>
  <text x="56" y="330" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">⇒ 回文子串永远整段落在某一个「相同字符段」内部，一次操作只让某一段长度 −1</text>
  <text x="56" y="354" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">⇒ m = 2 时两段长度恒 ≥ 1，只能停在 2；m ≥ 3 时可以把三段 c d c 合并成一段</text>

  <text x="380" y="404" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">实现时不用真的分段：m = 1 + #{ i : s[i] ≠ s[i+1] }，扫一遍即可</text>
</svg>
