<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475" viewBox="0 0 720 475" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="475" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 逐位验算：代数路 × 计数路</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">arr1 = [1,2,3] = [001, 010, 011]，arr2 = [6, 5] = [110, 101]</text>

  <!-- ===== 左：二进制展开 ===== -->
  <text x="186" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">二进制展开</text>
  <g filter="url(#sk)">
    <rect x="66" y="80" width="54" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="120" y="80" width="54" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="174" y="80" width="54" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="228" y="80" width="54" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <text x="93" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">数</text>
  <text x="147" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">b₂</text>
  <text x="201" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">b₁</text>
  <text x="255" y="96" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">b₀</text>

  <!-- arr1 行：1, 2, 3 -->
  <g filter="url(#sk)">
    <rect x="66" y="106" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="106" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="174" y="106" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="228" y="106" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="66" y="132" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="132" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="174" y="132" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="228" y="132" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="66" y="158" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="158" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="174" y="158" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="228" y="158" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="93" y="123" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="147" y="123" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="201" y="123" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="255" y="123" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="93" y="149" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">2</text>
  <text x="147" y="149" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="201" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="255" y="149" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="93" y="175" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">3</text>
  <text x="147" y="175" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="201" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="255" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <path d="M 66,188 L 282,188" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#sk)"/>

  <!-- arr2 行：6, 5 -->
  <g filter="url(#sk)">
    <rect x="66" y="192" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="192" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="174" y="192" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="228" y="192" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="66" y="218" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="120" y="218" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="174" y="218" width="54" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="228" y="218" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="93" y="209" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">6</text>
  <text x="147" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="201" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="255" y="209" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="93" y="235" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">5</text>
  <text x="147" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="201" y="235" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">0</text>
  <text x="255" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6a2a" filter="url(#sk)">1</text>
  <text x="290" y="149" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">← arr1</text>
  <text x="290" y="212" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#sk)">← arr2</text>
  <text x="186" y="262" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">绿格 = 该位为 1</text>

  <!-- ===== 右：逐位统计表 ===== -->
  <text x="525" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">逐位统计：c₁×c₂ 的奇偶定该位</text>
  <g filter="url(#sk)">
    <rect x="352" y="80" width="44" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="396" y="80" width="64" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="460" y="80" width="36" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="496" y="80" width="60" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="556" y="80" width="36" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="592" y="80" width="56" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="648" y="80" width="50" height="24" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
  </g>
  <text x="374" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">bit</text>
  <text x="428" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">arr1 位串</text>
  <text x="478" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">c₁</text>
  <text x="526" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">arr2 位串</text>
  <text x="574" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">c₂</text>
  <text x="620" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">c₁×c₂</text>
  <text x="673" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#sk)">答案位</text>
  <g filter="url(#sk)">
    <rect x="352" y="104" width="44" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="396" y="104" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="460" y="104" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="496" y="104" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="556" y="104" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="592" y="104" width="56" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="648" y="104" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="352" y="130" width="44" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="396" y="130" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="460" y="130" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="496" y="130" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="556" y="130" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="592" y="130" width="56" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="648" y="130" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="352" y="156" width="44" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="396" y="156" width="64" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="460" y="156" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="496" y="156" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="556" y="156" width="36" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="592" y="156" width="56" height="26" fill="#ffffff" stroke="#999" stroke-width="1" rx="3"/>
    <rect x="648" y="156" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
  </g>
  <text x="374" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">b₂</text>
  <text x="428" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">000</text>
  <text x="478" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">0</text>
  <text x="526" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">11</text>
  <text x="574" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2</text>
  <text x="620" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">0×2=0</text>
  <text x="673" y="121" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415" filter="url(#sk)">0</text>
  <text x="374" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">b₁</text>
  <text x="428" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">011</text>
  <text x="478" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2</text>
  <text x="526" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">10</text>
  <text x="574" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">1</text>
  <text x="620" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2×1=2</text>
  <text x="673" y="147" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415" filter="url(#sk)">0</text>
  <text x="374" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">b₀</text>
  <text x="428" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">101</text>
  <text x="478" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2</text>
  <text x="526" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">01</text>
  <text x="574" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">1</text>
  <text x="620" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">2×1=2</text>
  <text x="673" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415" filter="url(#sk)">0</text>
  <text x="525" y="204" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">奇×奇 = 奇，其余为偶 → 该位 = parity(c₁) &amp; parity(c₂)</text>

  <!-- ===== 底：两路对照 ===== -->
  <g filter="url(#sk)">
    <rect x="42" y="286" width="320" height="108" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="202" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">代数路（本篇主线：分配律）</text>
  <text x="202" y="332" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#sk)">X = 1⊕2⊕3 = 000₂ = 0</text>
  <text x="202" y="354" text-anchor="middle" font-size="11" fill="#2a4a1a" filter="url(#sk)">Y = 6⊕5 = 011₂ = 3</text>
  <text x="202" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">X &amp; Y = 0 ✓</text>
  <g filter="url(#sk)">
    <rect x="378" y="286" width="320" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="538" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">计数路（每日版主线：奇偶统计）</text>
  <text x="538" y="332" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">b₂：0×2 = 0（偶）→ 0</text>
  <text x="538" y="354" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">b₁：2×1 = 2（偶）→ 0；b₀ 同</text>
  <text x="538" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">三位全 0 → 答案 0 ✓</text>

  <g filter="url(#sk)">
    <rect x="42" y="410" width="656" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="370" y="430" text-anchor="middle" font-size="10.5" fill="#5a4a1a" filter="url(#sk)">(⊕ arr1) 第 b 位 = c₁ 的奇偶，(⊕ arr2) 第 b 位 = c₂ 的奇偶 —— 两路逐位同时给出 parity(c₁) &amp; parity(c₂)</text>
  <text x="370" y="448" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">赛场上两路互为对拍，是防 WA 的天然保险</text>
</svg>
