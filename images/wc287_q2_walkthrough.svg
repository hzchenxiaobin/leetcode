<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：10 场比赛 → 败场表 → 分桶输出</text>
  <path d="M 180 36 Q 330 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- section 1: matches -->
  <text x="40" y="54" text-anchor="start" font-size="11" fill="#888">① 比赛列表（10 场）</text>
  <g filter="url(#sk)">
    <rect x="40" y="62" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[1,3]</text>
  <g filter="url(#sk)">
    <rect x="148" y="62" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="188" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[2,3]</text>
  <g filter="url(#sk)">
    <rect x="256" y="62" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="296" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[3,6]</text>
  <g filter="url(#sk)">
    <rect x="364" y="62" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="404" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[5,6]</text>
  <g filter="url(#sk)">
    <rect x="472" y="62" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="512" y="81" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[5,7]</text>
  <g filter="url(#sk)">
    <rect x="40" y="96" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[4,5]</text>
  <g filter="url(#sk)">
    <rect x="148" y="96" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="188" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[4,8]</text>
  <g filter="url(#sk)">
    <rect x="256" y="96" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="296" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[4,9]</text>
  <g filter="url(#sk)">
    <rect x="364" y="96" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="404" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[10,4]</text>
  <g filter="url(#sk)">
    <rect x="472" y="96" width="80" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="512" y="115" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">[10,9]</text>

  <path d="M 296 130 L 296 152" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="146" text-anchor="start" font-size="11" fill="#888">一趟计数</text>

  <!-- section 2: loss table -->
  <text x="40" y="174" text-anchor="start" font-size="11" fill="#888">② 败场表 loss[p]（玩家 : 败场）</text>
  <g filter="url(#sk)">
    <rect x="40" y="182" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="80" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">1:0</text>
  <g filter="url(#sk)">
    <rect x="148" y="182" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="188" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">2:0</text>
  <g filter="url(#sk)">
    <rect x="256" y="182" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="296" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">3:2</text>
  <g filter="url(#sk)">
    <rect x="364" y="182" width="80" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="404" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">4:1</text>
  <g filter="url(#sk)">
    <rect x="472" y="182" width="80" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="512" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">5:1</text>
  <g filter="url(#sk)">
    <rect x="40" y="218" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="80" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">6:2</text>
  <g filter="url(#sk)">
    <rect x="148" y="218" width="80" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="188" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">7:1</text>
  <g filter="url(#sk)">
    <rect x="256" y="218" width="80" height="30" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="296" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">8:1</text>
  <g filter="url(#sk)">
    <rect x="364" y="218" width="80" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="404" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36" font-family="monospace">9:2</text>
  <g filter="url(#sk)">
    <rect x="472" y="218" width="80" height="30" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="512" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">10:0</text>

  <path d="M 296 254 L 296 298" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="280" text-anchor="start" font-size="11" fill="#888">按败场分桶</text>

  <!-- section 3: buckets -->
  <text x="40" y="296" text-anchor="start" font-size="11" fill="#888">③ 分桶结果</text>
  <g filter="url(#sk)">
    <rect x="40" y="306" width="195" height="76" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="137" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">败场 0 的玩家：1, 2, 10</text>
  <text x="137" y="358" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-family="monospace">answer[0] = [1, 2, 10]</text>
  <g filter="url(#sk)">
    <rect x="255" y="306" width="205" height="76" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="357" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">败场 1 的玩家：4, 5, 7, 8</text>
  <text x="357" y="358" text-anchor="middle" font-size="12.5" fill="#7a5415" font-family="monospace">answer[1] = [4, 5, 7, 8]</text>
  <g filter="url(#sk)">
    <rect x="480" y="306" width="150" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="555" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36">败场 2：3, 6, 9</text>
  <text x="555" y="358" text-anchor="middle" font-size="12.5" fill="#a03a36">丢弃，不入答案</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="396" width="540" height="26" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="413" text-anchor="middle" font-size="11.5" fill="#888">两个列表各自升序输出 —— 正是示例 1 的输出 [[1,2,10],[4,5,7,8]]</text>
</svg>
