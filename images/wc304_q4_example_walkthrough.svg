<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例 1 演算：edges = [3,3,4,2,3]，最长环 = 3</text>

  <ellipse cx="70" cy="80" rx="18" ry="18" fill="#eeeeee" stroke="#999"
           stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="70" y="85" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">0</text>
  <text x="94" y="68" font-size="14" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">✗</text>
  <text x="70" y="116" text-anchor="middle" font-size="11" fill="#999"
        filter="url(#rough2)">入度 0</text>

  <ellipse cx="70" cy="160" rx="18" ry="18" fill="#eeeeee" stroke="#999"
           stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="70" y="165" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">1</text>
  <text x="94" y="148" font-size="14" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">✗</text>
  <text x="70" y="196" text-anchor="middle" font-size="11" fill="#999"
        filter="url(#rough2)">入度 0</text>

  <path d="M 87 86 L 158 114" stroke="#999" stroke-width="1.6" fill="none"
        stroke-linecap="round" stroke-dasharray="5 4"
        marker-end="url(#arrX)" filter="url(#rough2)"/>
  <path d="M 87 154 L 158 126" stroke="#999" stroke-width="1.6" fill="none"
        stroke-linecap="round" stroke-dasharray="5 4"
        marker-end="url(#arrX)" filter="url(#rough2)"/>

  <ellipse cx="175" cy="120" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2.5" filter="url(#rough2)"/>
  <text x="175" y="125" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">3</text>
  <text x="175" y="155" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">入度 3</text>

  <ellipse cx="290" cy="80" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="85" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">2</text>
  <text x="290" y="116" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">入度 1</text>

  <ellipse cx="290" cy="160" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2.5" filter="url(#rough2)"/>
  <text x="290" y="165" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">4</text>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">入度 1</text>

  <path d="M 192 114 L 273 86" stroke="#b85450" stroke-width="2.4" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 290 98 L 290 142" stroke="#b85450" stroke-width="2.4" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 273 154 L 192 126" stroke="#b85450" stroke-width="2.4" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="330" y="118" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">环</text>
  <text x="330" y="136" text-anchor="middle" font-size="10.5" fill="#b85450"
        filter="url(#rough2)">剥不动</text>

  <rect x="378" y="52" width="170" height="118" rx="9" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="76" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#a07820" filter="url(#rough2)">剥离过程</text>
  <text x="463" y="97" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">初始队列：{0, 1}</text>
  <text x="463" y="116" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">出队 0 → indeg[3]：3→2</text>
  <text x="463" y="135" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">出队 1 → indeg[3]：2→1</text>
  <text x="463" y="158" text-anchor="middle" font-size="11" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">队空 ⇒ 幸存 {2,3,4}</text>

  <rect x="55" y="236" width="493" height="46" rx="9" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="255" text-anchor="middle" font-size="11.5" fill="#333"
        filter="url(#rough2)">示例 2　edges = [2,−1,3,1]：剥 0 使 indeg[2] 归 0，再剥 2、剥 3、剥 1</text>
  <text x="301" y="274" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">整图剥光，幸存者为空 ⇒ 无环 ⇒ 返回 −1</text>

  <rect x="55" y="298" width="493" height="64" rx="9" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="301" y="322" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">幸存者 {2,3,4}：从 2 出发，2 → 4 → 3 → 回到 2，走 3 步 ⇒ 环长 3</text>
  <text x="301" y="346" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">ans = max(−1, 3) = 3 ✓（分量大小 5，但环长只有 3：挂链不算）</text>
</svg>
