<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：spells = [5, 1, 3]，success = 7</text>
  <text x="280" y="56" font-size="13" fill="#888" filter="url(#rough2)" text-anchor="middle">potions 排序后 = [1, 2, 3, 4, 5]，m = 5</text>

  <!-- 三行演算 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#333">
    <rect x="40" y="76" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="58" y="99">spell = 5：t = ⌈7/5⌉ = 2 → lower_bound 位置 1</text>
    <text x="58" y="122" font-weight="bold">pairs[0] = 5 − 1 = 4</text>
    <rect x="40" y="142" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="58" y="165">spell = 1：t = ⌈7/1⌉ = 7 → 没有药水 ≥ 7</text>
    <text x="58" y="188" font-weight="bold">pairs[1] = 5 − 5 = 0</text>
    <rect x="40" y="208" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="58" y="231">spell = 3：t = ⌈7/3⌉ = 3 → lower_bound 位置 2</text>
    <text x="58" y="254" font-weight="bold">pairs[2] = 5 − 2 = 3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="150" y="282" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="305" font-size="13.5" fill="#333" filter="url(#rough2)" text-anchor="middle">输出 [4, 0, 3] ✓</text>
</svg>
