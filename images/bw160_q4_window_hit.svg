<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="370" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">检查函数：区间 GCD 用稀疏表 O(1) 查询，贪心改「窗口最右端」</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每个被打破的位置最多覆盖它右侧的一批窗口</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">nums =</text>
  <rect x="110" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="132.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="156" y="62" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="178.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="202" y="62" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="224.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="224.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="248" y="62" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270.0" y="88.0" font-size="14" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="270.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="40" y="140" width="540" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="166.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">设 k = 1：窗口长度 2，逐个检查 [0,1]、[1,2]、[2,3] 的 GCD</text>
  <rect x="40" y="200" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110.0" y="218.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">窗口</text>
  <rect x="180" y="200" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215.0" y="218.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">GCD</text>
  <rect x="250" y="200" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280.0" y="218.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">&gt; 1 ?</text>
  <rect x="310" y="200" width="290" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="455.0" y="218.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="40" y="228" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110.0" y="246.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,1] = (2,4)</text>
  <rect x="180" y="228" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="246.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="250" y="228" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="246.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="310" y="228" width="290" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.0" y="246.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">改 nums[1]，last = 1，used = 1</text>
  <rect x="40" y="256" width="140" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110.0" y="274.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,2] = (4,9)</text>
  <rect x="180" y="256" width="70" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="274.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="250" y="256" width="60" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="274.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="310" y="256" width="290" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.0" y="274.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">已被 last=1 打破，跳过</text>
  <rect x="40" y="284" width="140" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110.0" y="302.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,3] = (9,6)</text>
  <rect x="180" y="284" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215.0" y="302.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="250" y="284" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="302.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="310" y="284" width="290" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455.0" y="302.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">需要再改一次，但 maxC = 1 不够</text>
  <rect x="40" y="322" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="338.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">贪心：窗口 [i, i+k] 必须被命中一次，选最右端点 i+k 覆盖最多后续窗口</text>
  <text x="310.0" y="358.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">（经典区间刺点问题，按右端点贪心最优）</text>
</svg>
