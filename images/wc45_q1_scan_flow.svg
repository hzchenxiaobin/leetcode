<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">算法流程：一趟扫描，两个整数累加位移</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">不需要存路径，也不需要哈希表，只需要 x 与 y 两个变量</text>

  <!-- 左列三个框 -->
  <g filter="url(#r)">
    <rect x="62" y="74" width="244" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="62" y="148" width="244" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="62" y="226" width="244" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="13.5">
    <text x="184" y="103" fill="#33517a" filter="url(#r)">读入 moves，n = |moves|</text>
    <text x="184" y="172" fill="#a0761e" filter="url(#r)">可选剪枝：n 为奇数</text>
    <text x="184" y="192" fill="#a0761e" font-size="12" filter="url(#r)">→ 直接返回 false</text>
    <text x="184" y="255" fill="#2e6e2e" filter="url(#r)">x = 0，y = 0</text>
  </g>
  <g filter="url(#r)">
    <path d="M184,120 L184,146" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M184,198 L184,222" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- 分支容器 -->
  <g filter="url(#r)">
    <rect x="368" y="118" width="276" height="196" rx="10" fill="#fdf6f6" stroke="#b85450" stroke-width="2"/>
    <path d="M306,249 L364,249" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="506" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#r)">逐个字符 ch 分派</text>
  <g font-size="13.5" filter="url(#r)">
    <rect x="386" y="156" width="240" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="386" y="196" width="240" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="386" y="236" width="240" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="386" y="276" width="240" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="404" y="177" fill="#33517a" font-weight="bold">'R'</text>
    <text x="470" y="177" fill="#33517a">→ x += 1</text>
    <text x="404" y="217" fill="#33517a" font-weight="bold">'L'</text>
    <text x="470" y="217" fill="#33517a">→ x −= 1</text>
    <text x="404" y="257" fill="#2e6e2e" font-weight="bold">'U'</text>
    <text x="470" y="257" fill="#2e6e2e">→ y += 1</text>
    <text x="404" y="297" fill="#2e6e2e" font-weight="bold">'D'</text>
    <text x="470" y="297" fill="#2e6e2e">→ y −= 1</text>
  </g>

  <!-- 输出框 -->
  <g filter="url(#r)">
    <rect x="330" y="342" width="340" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <path d="M506,314 L506,338" stroke="#5a5a5a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#r)">return x == 0 &amp;&amp; y == 0</text>

  <text x="62" y="356" font-size="12" fill="#777" filter="url(#r)">两个轴互不干扰，</text>
  <text x="62" y="376" font-size="12" fill="#777" filter="url(#r)">所以一个不等式组就够了</text>
</svg>
