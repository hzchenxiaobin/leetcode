<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">每个结尾 i 只保留「不同或值 + 能取到它的最大起点 s」</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">nums = [2, 1, 8]，k = 10</text>

  <text x="140" y="76" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">i = 0</text>
  <g filter="url(#rough2)">
    <rect x="60" y="86" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>
  <text x="140" y="106" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">OR 2   s=0   len 1</text>

  <text x="310" y="76" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">i = 1</text>
  <g filter="url(#rough2)">
    <rect x="230" y="86" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="230" y="124" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>
  <text x="310" y="106" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">OR 1   s=1   len 1</text>
  <text x="310" y="144" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">OR 3   s=0   len 2</text>

  <text x="480" y="76" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">i = 2</text>
  <g filter="url(#rough2)">
    <rect x="400" y="86" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <rect x="400" y="124" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6"/>
    <rect x="400" y="162" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <text x="475" y="106" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">OR 8   s=2   len 1</text>
  <text x="475" y="144" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">OR 9   s=1   len 2</text>
  <text x="475" y="182" font-size="12" fill="#2d5a22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">OR 11  s=0  len 3 ✓</text>

  <path d="M 222 100 L 228 100" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 392 138 L 398 138" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="200" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每一列由左列「并上当前元素」得到：8 → 9 → 11</text>
  <text x="475" y="216" font-size="11" fill="#8a2b26" text-anchor="middle" filter="url(#rough2)">只有 11 ≥ k，取 len 最小者</text>

  <rect x="60" y="234" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = 3，对应子数组 [2,1,8]（或值 11）</text>
  <rect x="60" y="280" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">同列的或值严格递增 ⇒ 每列至多 31 项（32 位或值链）</text>
  <rect x="60" y="326" width="440" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">同一个或值只留最大起点 s：窗口越短越好</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">len 一律按 i − s + 1 计算</text>
</svg>
