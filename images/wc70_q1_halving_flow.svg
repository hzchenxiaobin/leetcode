<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：每轮把 n 减 1，用 mid 判断 k 落在哪半</text>
  <rect x="196" y="34" width="228" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="57" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">输入 n, k；flip ← 0</text>
  <path d="M 310 70 L 310 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="310,94 402,126 310,158 218,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">n == 1 ?</text>
  <path d="M 402 126 L 446 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="452" y="108" width="152" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="528" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33552a" filter="url(#rough2)">返回 flip</text>
  <path d="M 310 158 L 310 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="196" y="192" width="228" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="214" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">mid ← 1 &lt;&lt; (n - 2)</text>
  <path d="M 310 226 L 310 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="310,250 420,282 310,314 200,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">k &gt; mid ?</text>
  <path d="M 420 282 L 450 282" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="273" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="456" y="256" width="168" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="540" y="277" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">k ← k - mid</text>
  <text x="540" y="296" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">flip ← flip ⊕ 1</text>
  <path d="M 540 306 L 540 360 L 396 360" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 314 L 310 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="214" y="342" width="178" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="303" y="365" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">n ← n - 1</text>
  <path d="M 214 360 L 74 360 L 74 126 L 212 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="240" text-anchor="start" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">回到开头</text>
  <text x="320" y="400" text-anchor="middle" font-size="10.5" fill="#5a6a80" filter="url(#rough2)">每层规模减半，最多 30 层；整行字符串一个字节都不用生成</text>
  <text x="320" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">等价闭式：答案 = popcount(k - 1) mod 2（Thue–Morse 序列）</text>
</svg>
