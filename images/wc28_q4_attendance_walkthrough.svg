<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">演算：n = 0 → 3 的六状态计数</text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#sk)">每轮把 6 个数按「追加 P / A / L」重新分配，行末合计即长度为 n 的合法记录数</text>

  <g filter="url(#sk)">
    <rect x="57" y="84" width="68" height="34" rx="5" fill="#ecebe4" stroke="#b9b39f" stroke-width="1.3"/>
    <rect x="129" y="84" width="66" height="34" rx="5" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.3"/>
    <rect x="199" y="84" width="66" height="34" rx="5" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.3"/>
    <rect x="269" y="84" width="66" height="34" rx="5" fill="#e8f0fa" stroke="#2b6e9e" stroke-width="1.3"/>
    <rect x="339" y="84" width="66" height="34" rx="5" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.3"/>
    <rect x="409" y="84" width="66" height="34" rx="5" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.3"/>
    <rect x="479" y="84" width="66" height="34" rx="5" fill="#fdf2e0" stroke="#b07a20" stroke-width="1.3"/>
    <rect x="553" y="84" width="72" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" text-anchor="middle" fill="#3d3d3d">
    <text x="91" y="106">n</text>
    <text x="162" y="106">(0, 0)</text>
    <text x="232" y="106">(0, 1)</text>
    <text x="302" y="106">(0, 2)</text>
    <text x="372" y="106">(1, 0)</text>
    <text x="442" y="106">(1, 1)</text>
    <text x="512" y="106">(1, 2)</text>
    <text x="589" y="106">合计</text>
  </g>

  <g filter="url(#sk)">
    <rect x="57" y="122" width="568" height="34" rx="5" fill="#f7f6f0" stroke="#d8d4c4" stroke-width="1"/>
    <rect x="57" y="160" width="568" height="34" rx="5" fill="#ffffff" stroke="#d8d4c4" stroke-width="1"/>
    <rect x="57" y="198" width="568" height="34" rx="5" fill="#f7f6f0" stroke="#d8d4c4" stroke-width="1"/>
    <rect x="57" y="236" width="568" height="34" rx="5" fill="#ffffff" stroke="#d8d4c4" stroke-width="1"/>
    <rect x="553" y="198" width="72" height="34" rx="5" fill="#dff0e4" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="553" y="236" width="72" height="34" rx="5" fill="#fbe7c8" stroke="#b07a20" stroke-width="2"/>
  </g>
  <g filter="url(#sk)" font-size="13" text-anchor="middle" fill="#4a4a4a">
    <text x="91" y="144">0</text>
    <text x="91" y="182">1</text>
    <text x="91" y="220">2</text>
    <text x="91" y="258">3</text>
    <text x="162" y="144">1</text>
    <text x="162" y="182">1</text>
    <text x="162" y="220">2</text>
    <text x="162" y="258">4</text>
    <text x="232" y="144">0</text>
    <text x="232" y="182">1</text>
    <text x="232" y="220">1</text>
    <text x="232" y="258">2</text>
    <text x="302" y="144">0</text>
    <text x="302" y="182">0</text>
    <text x="302" y="220">1</text>
    <text x="302" y="258">1</text>
    <text x="372" y="144">0</text>
    <text x="372" y="182">1</text>
    <text x="372" y="220">3</text>
    <text x="372" y="258">8</text>
    <text x="442" y="144">0</text>
    <text x="442" y="182">0</text>
    <text x="442" y="220">1</text>
    <text x="442" y="258">3</text>
    <text x="512" y="144">0</text>
    <text x="512" y="182">0</text>
    <text x="512" y="220">0</text>
    <text x="512" y="258">1</text>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="589" y="144" fill="#3d3d3d">1</text>
    <text x="589" y="182" fill="#3d3d3d">3</text>
    <text x="589" y="220" fill="#2e6e2e">8</text>
    <text x="589" y="258" fill="#8a5c12">19</text>
  </g>

  <text x="57" y="296" font-size="12" fill="#4a4a4a" filter="url(#sk)">n = 2 的 (1, 0) = 3 对应 AP、PA、LA 三个串；(0, 2) = 1 是 LL，它的下一字符不能再是 L。</text>
  <text x="57" y="320" font-size="12" fill="#4a4a4a" filter="url(#sk)">n = 3 合计 19 = 27 − 7（含两个及以上 A 的串）− 1（三个 L 连排），与暴力枚举一致。</text>
  <text x="57" y="344" font-size="12" fill="#8a8a8a" filter="url(#sk)">起始行 n = 0 只有一个空串；每推进一步就相当于在右侧追加一个字符，6 个格子始终不变。</text>

  <text x="340" y="386" font-size="11" fill="#8a8a8a" filter="url(#sk)">官方示例：n = 2 → 8，n = 1 → 3</text>
</svg>
