<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="331" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [102, 90, 14]，k = 2</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="60" y="56" width="110" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="170" y="56" width="150" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="320" y="56" width="110" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="430" y="56" width="110" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="540" y="56" width="60" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="115" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">元素 x</text>
  <text x="245" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">数字降序 → best</text>
  <text x="375" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">best 值</text>
  <text x="485" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">增益</text>
  <text x="570" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">操作?</text>

  <!-- row 1: 102 -->
  <g filter="url(#sk)">
    <rect x="60" y="94" width="110" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="170" y="94" width="150" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="320" y="94" width="110" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="430" y="94" width="110" height="34" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="1.6"/>
    <rect x="540" y="94" width="60" height="34" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="115" y="116" text-anchor="middle" font-size="12" fill="#333">102</text>
  <text x="245" y="116" text-anchor="middle" font-size="12" fill="#333">"102"→"210"</text>
  <text x="375" y="116" text-anchor="middle" font-size="12" fill="#333">210</text>
  <text x="485" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">+108</text>
  <text x="570" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✓ ①</text>

  <!-- row 2: 14 -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="110" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="170" y="132" width="150" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="320" y="132" width="110" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="430" y="132" width="110" height="34" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="1.6"/>
    <rect x="540" y="132" width="60" height="34" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="115" y="154" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="245" y="154" text-anchor="middle" font-size="12" fill="#333">"14"→"41"</text>
  <text x="375" y="154" text-anchor="middle" font-size="12" fill="#333">41</text>
  <text x="485" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">+27</text>
  <text x="570" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✓ ②</text>

  <!-- row 3: 90 -->
  <g filter="url(#sk)">
    <rect x="60" y="170" width="110" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="170" y="170" width="150" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="320" y="170" width="110" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="430" y="170" width="110" height="34" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2"/>
    <rect x="540" y="170" width="60" height="34" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="115" y="192" text-anchor="middle" font-size="12" fill="#333">90</text>
  <text x="245" y="192" text-anchor="middle" font-size="12" fill="#333">"90"→"90"</text>
  <text x="375" y="192" text-anchor="middle" font-size="12" fill="#333">90</text>
  <text x="485" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#888888">0</text>
  <text x="570" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">✗</text>

  <!-- gain sort note -->
  <path d="M 485 210 Q 485 226 485 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="330" y="244" width="310" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="485" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">增益排序：[+108, +27, 0]，前 k=2 大 → 108 + 27</text>

  <!-- sum line -->
  <path d="M 320 210 Q 260 240 220 264" stroke="#3a3a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result computation -->
  <g filter="url(#sk)">
    <rect x="60" y="244" width="240" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="180" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">原总和 = 102 + 90 + 14 = 206</text>

  <g filter="url(#sk)">
    <rect x="60" y="296" width="580" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="350" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8761a">答案 = 206 + 108 + 27 = 341</text>

  <!-- final array -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="580" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="350" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">操作后数组 [210, 90, 41]：210 + 90 + 41 = 341，两种口径一致 ∎</text>
</svg>
