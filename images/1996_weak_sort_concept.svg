<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：排序降维 —— 支配者必在「攻击更大」的右侧</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- group separators -->
  <path d="M 192 72 L 192 148" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#sk)"/>
  <path d="M 392 72 L 392 148" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#sk)"/>

  <!-- character cards, sorted by attack asc, defense desc in ties -->
  <g filter="url(#sk)">
    <rect x="84" y="80" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="116" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(3,6)</text>

  <g filter="url(#sk)">
    <rect x="214" y="80" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="246" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(5,5)</text>

  <g filter="url(#sk)">
    <rect x="284" y="80" width="64" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="316" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10" filter="url(#sk)">(5,2)</text>

  <g filter="url(#sk)">
    <rect x="424" y="80" width="64" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="456" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">(6,4)</text>

  <g filter="url(#sk)">
    <rect x="494" y="80" width="64" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="526" y="107" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">(6,1)</text>

  <!-- domination arrow: (6,4) dominates (5,2) -->
  <path d="M 350 102 Q 387 84 422 100" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="386" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">(6,4) 支配 (5,2)</text>

  <!-- group labels -->
  <text x="116" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">攻击 = 3</text>
  <text x="281" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">攻击 = 5 · 防御降序</text>
  <text x="491" y="142" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">攻击 = 6 · 防御降序</text>

  <!-- attack axis -->
  <path d="M 62 172 L 632 172" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="347" y="192" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">攻击从左到右递增（升序排序后）</text>

  <!-- per-group notes -->
  <text x="116" y="216" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">(3,6)：右侧防御最大 5，非弱</text>
  <text x="281" y="216" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">(5,2)：防 2 &lt; 4，被 (6,4) 压制</text>
  <text x="281" y="232" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">(5,5)：右侧防御 ≤ 4，非弱</text>
  <text x="491" y="216" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">末组无更大攻击者</text>
  <text x="491" y="232" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">(6,4)、(6,1) 均非弱</text>

  <!-- explanation boxes -->
  <g filter="url(#sk)">
    <rect x="36" y="254" width="300" height="110" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="186" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">攻击升序 ⇒ 支配者必在右侧</text>
  <text x="52" y="302" font-size="11.5" fill="#444" filter="url(#sk)">j 支配 i ⇔ 攻j &gt; 攻i 且 防j &gt; 防i</text>
  <text x="52" y="320" font-size="11.5" fill="#444" filter="url(#sk)">排序后 j 必在 i 之后 → 单向扫描即可</text>
  <text x="52" y="338" font-size="11.5" fill="#444" filter="url(#sk)">栈中留着的都是「还没找到支配者」的角色</text>

  <g filter="url(#sk)">
    <rect x="352" y="254" width="292" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="498" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">同攻击防御降序 ⇒ 组内互不支配</text>
  <text x="368" y="302" font-size="11.5" fill="#444" filter="url(#sk)">同组先处理者防御 ≥ 后来者</text>
  <text x="368" y="320" font-size="11.5" fill="#444" filter="url(#sk)">「栈顶防御 &lt; d」在同组内永不成立</text>
  <text x="368" y="338" font-size="11.5" fill="#444" filter="url(#sk)">严格性交给了排序的次关键字</text>

  <!-- captions -->
  <text x="340" y="388" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">二维偏序 → 一维「右侧是否存在严格更大防御」</text>
  <text x="340" y="412" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">与 354 俄罗斯套娃信封同款技巧：主键定方向，次键反序消同值歧义</text>
</svg>
