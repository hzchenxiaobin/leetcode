<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8378"/>
    </marker>
  </defs>

  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">另解：边权排序 + 并查集 —— 首次连通瞬间即答案</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="68" text-anchor="middle" font-size="10.5" fill="#888">示例 1 的全部 12 条边按权值升序依次为：0, 0, 1, 2, 2, 2, 2, 3, 5, 5, 6, 6（红框 = 起点 s 与终点 t 所在格）</text>

  <!-- ===== four snapshots; grids at x=70,285,500,715; cells 36x30, gap 3 ===== -->
  <text x="127" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">① w = 0</text>
  <text x="342" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">② w = 1</text>
  <text x="557" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">③ w = 2</text>
  <text x="772" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">④ w ≥ 5</text>

  <!-- snapshot 1 -->
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <g filter="url(#sk)"><rect x="70" y="120" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b85450" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="109" y="120" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="148" y="120" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="70" y="153" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="109" y="153" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="148" y="153" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="70" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="109" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="148" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="88" y="140">1</text><text x="127" y="140">2</text><text x="166" y="140">2</text>
    <text x="88" y="173">3</text><text x="127" y="173">8</text><text x="166" y="173">2</text>
    <text x="88" y="206">5</text><text x="127" y="206">3</text><text x="166" y="206">5</text>
  </g>
  <text x="99" y="132" font-size="8.5" font-weight="bold" fill="#b85450">s</text>
  <text x="177" y="198" font-size="8.5" font-weight="bold" fill="#b85450">t</text>

  <!-- snapshot 2 -->
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <g filter="url(#sk)"><rect x="285" y="120" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="324" y="120" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="363" y="120" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="285" y="153" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="324" y="153" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="363" y="153" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="285" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="324" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="363" y="186" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="303" y="140">1</text><text x="342" y="140">2</text><text x="381" y="140">2</text>
    <text x="303" y="173">3</text><text x="342" y="173">8</text><text x="381" y="173">2</text>
    <text x="303" y="206">5</text><text x="342" y="206">3</text><text x="381" y="206">5</text>
  </g>
  <text x="314" y="132" font-size="8.5" font-weight="bold" fill="#b85450">s</text>
  <text x="392" y="198" font-size="8.5" font-weight="bold" fill="#b85450">t</text>

  <!-- snapshot 3 (answer moment) -->
  <g filter="url(#sk)">
    <rect x="492" y="112" width="126" height="112" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <g filter="url(#sk)"><rect x="500" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="539" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="578" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="500" y="153" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="539" y="153" width="36" height="30" rx="4" fill="#f0ede4" stroke="#b8b3a8" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="578" y="153" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="500" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="539" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="578" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="518" y="140">1</text><text x="557" y="140">2</text><text x="596" y="140">2</text>
    <text x="518" y="173">3</text><text x="557" y="173">8</text><text x="596" y="173">2</text>
    <text x="518" y="206">5</text><text x="557" y="206">3</text><text x="596" y="206">5</text>
  </g>
  <text x="529" y="132" font-size="8.5" font-weight="bold" fill="#b85450">s</text>
  <text x="607" y="198" font-size="8.5" font-weight="bold" fill="#b85450">t</text>

  <!-- snapshot 4 -->
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <g filter="url(#sk)"><rect x="715" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="754" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="793" y="120" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="715" y="153" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="754" y="153" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="793" y="153" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="715" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="754" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <g filter="url(#sk)"><rect x="793" y="186" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2"/></g>
    <text x="733" y="140">1</text><text x="772" y="140">2</text><text x="811" y="140">2</text>
    <text x="733" y="173">3</text><text x="772" y="173">8</text><text x="811" y="173">2</text>
    <text x="733" y="206">5</text><text x="772" y="206">3</text><text x="811" y="206">5</text>
  </g>
  <text x="744" y="132" font-size="8.5" font-weight="bold" fill="#b85450">s</text>
  <text x="822" y="198" font-size="8.5" font-weight="bold" fill="#b85450">t</text>

  <!-- arrows between snapshots -->
  <path d="M 192 168 L 277 168" stroke="#8a8378" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="234" y="158" text-anchor="middle" font-size="9.5" fill="#666">+w=1</text>
  <path d="M 407 168 L 492 168" stroke="#8a8378" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="449" y="158" text-anchor="middle" font-size="9.5" fill="#666">+w=2 ×4</text>
  <path d="M 622 168 L 707 168" stroke="#8a8378" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="664" y="158" text-anchor="middle" font-size="9.5" fill="#999">+w=3,5,6 …</text>

  <!-- captions under each snapshot -->
  <g font-size="9.5" fill="#555" text-anchor="middle">
    <text x="127" y="236">加 w=0 的 2 条边</text>
    <text x="127" y="252">(0,1)–(0,2)、(0,2)–(1,2)</text>
    <text x="127" y="272" fill="#b85450" font-weight="bold">✗ s、t 不连通</text>

    <text x="342" y="236">加 w=1 的 1 条边</text>
    <text x="342" y="252">(0,0)–(0,1)</text>
    <text x="342" y="272" fill="#b85450" font-weight="bold">✗ t=(2,2) 仍孤立</text>

    <text x="557" y="236">加 w=2 的 4 条边</text>
    <text x="557" y="252">(0,0)–(1,0)、(1,0)–(2,0)、</text>
    <text x="557" y="266">(2,0)–(2,1)、(2,1)–(2,2)</text>
    <text x="557" y="286" fill="#2e6e2e" font-weight="bold">✓ 首次连通 → 答案 = 2</text>

    <text x="772" y="236">继续加到 w=5</text>
    <text x="772" y="252">(1,1) 才并入大块</text>
    <text x="772" y="272" fill="#999">（答案早在 ③ 已确定）</text>
  </g>

  <!-- ===== bottom insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="322" width="860" height="286" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="350" font-size="12" font-weight="bold" fill="#2b2b2b">为什么「首次连通」就是答案？</text>
  <text x="80" y="378" font-size="11" fill="#444">升序加边 ⇒ 任意时刻，同一连通块内任意两点之间都存在一条路径，其最大边权 ≤ 当前 w；</text>
  <text x="80" y="402" font-size="11" fill="#444">若阈值 t &lt; w*（使 s、t 首次连通的那条边的权值），则该边不存在 ⇒ s、t 必不连通；</text>
  <text x="80" y="426" font-size="11" fill="#444">若 t ≥ w*，则 s→t 的这条路径上所有边权都 ≤ t ⇒ 连通。</text>
  <text x="80" y="456" font-size="11.5" fill="#b03a3a" font-weight="bold">故首次连通瞬间的当前边权 w* 恰是最小可行阈值 = 瓶颈距离（本题 = 2）。</text>
  <path d="M 80 474 Q 490 480 900 474" stroke="#d5cfc0" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="80" y="500" font-size="11" fill="#444">与 Kruskal 最小生成树同源：Kruskal 终止于「选满 n−1 条边」，本题终止于「s、t 连通」——</text>
  <text x="80" y="522" font-size="11" fill="#444">两者结论一致：s、t 的瓶颈距离 = 二者在最小生成树上路径的最大边权。</text>
  <text x="80" y="552" font-size="11" fill="#2e6e2e" font-weight="bold">复杂度：排序 O(mn·log mn) 主导；并查集合并 / 查询近常数（路径压缩 + 按秩合并）。</text>
</svg>
