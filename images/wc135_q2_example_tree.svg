<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 的逐节点答案</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">新值 = 原树中 ≥ 该值的所有节点值之和</text>

  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原树（值）</text>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新树（后缀和）</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="140" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="140" y="115" fill="#3a4a66">4</text>
    <circle cx="96" cy="156" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="96" y="161" fill="#3a4a66">1</text>
    <circle cx="184" cy="156" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="184" y="161" fill="#3a4a66">6</text>
    <circle cx="74" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="74" y="205" fill="#3a4a66">0</text>
    <circle cx="118" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="118" y="205" fill="#3a4a66">2</text>
    <circle cx="162" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="162" y="205" fill="#3a4a66">5</text>
    <circle cx="206" cy="200" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="206" y="205" fill="#3a4a66">7</text>
    <circle cx="130" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="130" y="245" fill="#3a4a66">3</text>
    <circle cx="240" cy="240" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="240" y="245" fill="#3a4a66">8</text>
  </g>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1.1">
    <path d="M 130 124 L 104 144" fill="none"/>
    <path d="M 150 124 L 176 144" fill="none"/>
    <path d="M 88 168 L 80 188" fill="none"/>
    <path d="M 104 168 L 112 188" fill="none"/>
    <path d="M 176 168 L 168 188" fill="none"/>
    <path d="M 192 168 L 200 188" fill="none"/>
    <path d="M 112 210 L 124 230" fill="none"/>
    <path d="M 214 210 L 232 230" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="420" cy="110" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="420" y="115" fill="#8a3a36">30</text>
    <circle cx="376" cy="156" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="376" y="161" fill="#8a3a36">36</text>
    <circle cx="464" cy="156" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="464" y="161" fill="#8a3a36">21</text>
    <circle cx="354" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="354" y="205" fill="#8a3a36">36</text>
    <circle cx="398" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="398" y="205" fill="#8a3a36">35</text>
    <circle cx="442" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="442" y="205" fill="#8a3a36">26</text>
    <circle cx="486" cy="200" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="486" y="205" fill="#8a3a36">15</text>
    <circle cx="410" cy="240" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="410" y="245" fill="#8a3a36">33</text>
    <circle cx="520" cy="240" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="520" y="245" fill="#8a3a36">8</text>
  </g>

  <g filter="url(#rough2)" stroke="#d8b4b0" stroke-width="1.1">
    <path d="M 410 124 L 384 144" fill="none"/>
    <path d="M 430 124 L 456 144" fill="none"/>
    <path d="M 368 168 L 360 188" fill="none"/>
    <path d="M 384 168 L 392 188" fill="none"/>
    <path d="M 456 168 L 448 188" fill="none"/>
    <path d="M 472 168 L 480 188" fill="none"/>
    <path d="M 392 210 L 404 230" fill="none"/>
    <path d="M 494 210 L 512 230" fill="none"/>
  </g>

  <rect x="40" y="272" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#8a6a20">总和 = 30：节点 4 → 30（4+6+7+5+8 = 30）；节点 1 → 1+2+3+4+5+6+7+8 = 36</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#8a6a20">最大值 8 的新值仍是 8（没有比它更大的键）</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999">层序输出：[30,36,21,36,35,26,15,null,null,null,33,null,null,null,8]</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999">与题目示例输出逐位一致，验证了「逆向中序累加」的正确性</text>
</svg>
