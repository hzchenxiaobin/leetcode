<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一次操作 = 翻转整个后缀，前缀毫发无损</text>

  <text x="44" y="58" font-size="11" fill="#666" filter="url(#rough2)">翻转前</text>
  <rect x="186" y="46" width="236" height="58" rx="8" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="304" y="42" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">后缀 i = 2 起全部翻</text>

  <rect x="80" y="58" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="58" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="58" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="58" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="58" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="58" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="162" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="218" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="274" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="330" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="386" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 260 116 L 260 148" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="268" y="136" font-size="11" fill="#d6a040" filter="url(#rough2)">翻转后缀（1 次操作）</text>

  <text x="44" y="172" font-size="11" fill="#666" filter="url(#rough2)">翻转后</text>
  <rect x="80" y="156" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="156" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="156" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="248" y="156" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="304" y="156" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="360" y="156" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="106" y="181" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">0</text>
  <text x="162" y="181" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">1</text>
  <text x="218" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="274" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="386" y="181" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <text x="106" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不变</text>
  <text x="162" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不变</text>
  <text x="218" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反相</text>
  <text x="274" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反相</text>
  <text x="330" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反相</text>
  <text x="386" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">反相</text>

  <rect x="70" y="234" width="380" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">前缀 [0, i−1] 完全不受影响 ⇒ 已确定的 1 不会被破坏</text>

  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">代价只有 1，影响却覆盖整段后缀：用「翻转次数的奇偶」记录它</text>
</svg>
