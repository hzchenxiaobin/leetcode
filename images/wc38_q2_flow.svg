<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 逐个尝试 → 超期换最长</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="150" y="46" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="67" font-size="11" fill="#3a4a66">courses 按 lastDay 升序排序</text>
  </g>

  <path d="M 280 78 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="130" y="104" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="125" font-size="11" fill="#3a5a30">初始化：大顶堆 heap = ∅，total = 0</text>
  </g>

  <path d="M 280 136 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="130" y="162" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="184" font-size="11" fill="#8a6a20">取下一门课 (d, last)：total += d，d 入堆</text>
  </g>

  <path d="M 280 196 L 280 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <polygon points="280,220 430,254 280,288 130,254" fill="#fafafa" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="258" font-size="11" fill="#3a4a66">total &gt; last ？</text>
  </g>

  <path d="M 130 254 L 74 254 L 74 320" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="246" font-size="10" fill="#b85450">是</text>

  <path d="M 430 254 L 486 254 L 486 320" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="246" font-size="10" fill="#4a7a3a">否</text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="18" y="324" width="196" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="116" y="344" font-size="10.5" fill="#8a3a36">m = 弹出堆顶（最长）</text>
    <text x="116" y="360" font-size="10.5" fill="#8a3a36">total -= m</text>

    <rect x="384" y="324" width="158" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="463" y="344" font-size="10.5" fill="#3a5a30">保留这门课</text>
    <text x="463" y="360" font-size="10.5" fill="#3a5a30">课程数 +1 不变</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="150" y="384" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="403" font-size="11" fill="#3a4a66">循环结束后返回 len(heap)</text>
  </g>

  <path d="M 116 370 L 116 398 L 148 398" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 463 370 L 463 398 L 412 398" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
