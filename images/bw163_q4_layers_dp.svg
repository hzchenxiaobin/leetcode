<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">按「已用传送次数」分层：每层先传送落地，再向右/向下做 DP</text>
  <rect x="60" y="78" width="150" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135.0" y="107.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[0] 层</text>
  <rect x="240" y="78" width="190" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335.0" y="106.675" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">传送落地值 = min over 值≥当前</text>
  <rect x="460" y="78" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545.0" y="107.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">向右/向下扫一遍</text>
  <path d="M 135 130 L 135 150" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 335 104 L 456 104" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 103 L 238 103" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="152" width="150" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135.0" y="181.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[1] 层</text>
  <rect x="240" y="152" width="190" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335.0" y="180.675" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">传送落地值 = min over 值≥当前</text>
  <rect x="460" y="152" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545.0" y="181.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">向右/向下扫一遍</text>
  <path d="M 135 204 L 135 224" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 335 178 L 456 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 177 L 238 177" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="226" width="150" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135.0" y="255.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[2] 层</text>
  <rect x="240" y="226" width="190" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335.0" y="254.675" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">传送落地值 = min over 值≥当前</text>
  <rect x="460" y="226" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545.0" y="255.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">向右/向下扫一遍</text>
  <path d="M 135 278 L 135 298" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 335 252 L 456 252" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 251 L 238 251" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="300" width="150" height="50" rx="4" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135.0" y="329.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[3] 层</text>
  <rect x="240" y="300" width="190" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335.0" y="328.675" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">传送落地值 = min over 值≥当前</text>
  <rect x="460" y="300" width="170" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545.0" y="329.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">向右/向下扫一遍</text>
  <path d="M 210 325 L 238 325" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="636" y="330" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">…</text>
  <rect x="50" y="360" width="610" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="382" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">答案取 dp[k]（至多 k 次传送）在终点的值；k ≤ 10，m·n ≤ 6400</text>
</svg>
