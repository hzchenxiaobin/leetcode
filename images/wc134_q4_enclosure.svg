<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">m 个封锁格子最多能围住 m(m−1)/2 个格子</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">m ≤ 200 → 上界 19900；BFS 越过这个数就一定没被围住</text>

  <rect x="46" y="66" width="300" height="270" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="196" y="88" text-anchor="middle" font-size="10.5" fill="#888">10⁶ × 10⁶ 的大网格（局部示意）</text>

  <g filter="url(#rough2)">
    <rect x="86" y="96" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="110" y="96" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="134" y="96" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="158" y="96" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="182" y="96" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="110" y="120" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="134" y="120" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="158" y="120" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="182" y="120" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="134" y="144" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="158" y="144" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="182" y="144" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="158" y="168" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="182" y="168" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
    <rect x="182" y="192" width="12" height="12" fill="#b85450" stroke="#8a3a36" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8">
    <rect x="110" y="120" width="10" height="10" opacity="0.4"/>
    <rect x="122" y="132" width="10" height="10" opacity="0.5"/>
    <rect x="134" y="132" width="10" height="10" opacity="0.5"/>
    <rect x="146" y="144" width="10" height="10" opacity="0.5"/>
    <rect x="110" y="144" width="10" height="10" opacity="0.5"/>
    <rect x="122" y="144" width="10" height="10" opacity="0.5"/>
    <rect x="134" y="156" width="10" height="10" opacity="0.5"/>
    <rect x="146" y="168" width="10" height="10" opacity="0.5"/>
    <rect x="158" y="156" width="10" height="10" opacity="0.5"/>
  </g>

  <circle cx="140" cy="150" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="150" y="154" font-size="10.5" fill="#446688">source</text>

  <path d="M 196 214 C 230 206, 250 196, 268 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="238" font-size="10" fill="#4a7a3a">三角“斜线”包围 = 面积极端</text>

  <circle cx="330" cy="300" r="4" fill="#8a6a20" filter="url(#rough2)"/>
  <text x="340" y="304" font-size="10.5" fill="#8a6a20">target</text>

  <rect x="366" y="66" width="164" height="128" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="380" y="86" font-size="11" fill="#8a3a36" font-weight="bold">被围住（返回 false）</text>
  <text x="380" y="108" font-size="10" fill="#555">BFS 走完全部可达格</text>
  <text x="380" y="126" font-size="10" fill="#555">仍不到 target，且</text>
  <text x="380" y="144" font-size="10" fill="#555">访问数始终 ≤ 19900</text>
  <text x="380" y="168" font-size="10" fill="#8a3a36">→ 队列空 = 封闭</text>

  <rect x="366" y="208" width="164" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="380" y="228" font-size="11" fill="#3a5a30" font-weight="bold">没被围住（可通行）</text>
  <text x="380" y="250" font-size="10" fill="#555">访问数 &gt; 19900 仍</text>
  <text x="380" y="268" font-size="10" fill="#555">没碰到 target</text>
  <text x="380" y="290" font-size="10" fill="#555">→ 边界无墙，能绕出去</text>
  <text x="380" y="314" font-size="10" fill="#4a7a3a">→ 视作“逃出成功”</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999">每多一个封锁格子，最多把包围圈“拉长一格”，故面积上界 ~ m²/2</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999">m ≤ 200 时上界仅 19900，BFS 规模与网格大小无关</text>
</svg>
