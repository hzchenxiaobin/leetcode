<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="356" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">单调栈：一遍求出每个元素左右边界</text>
  <rect x="170" y="58" width="300" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="83.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i 从左到右扫描</text>
  <rect x="170" y="120" width="300" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="145.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">弹栈：栈顶值 ≥ arr[i] 就弹出</text>
  <rect x="170" y="182" width="300" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="207.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">left[i] = i − 栈顶下标（空栈取 i+1）</text>
  <rect x="170" y="244" width="300" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="269.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">压入 i，保持栈内值严格递增</text>
  <path d="M 320,100 L 320,120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,162 L 320,182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,224 L 320,244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="300" width="290" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175.0" y="324.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右侧镜像：弹 &gt; 者，得到 right[i]</text>
  <rect x="340" y="300" width="290" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485.0" y="324.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 += arr[i] × left[i] × right[i]</text>
</svg>
