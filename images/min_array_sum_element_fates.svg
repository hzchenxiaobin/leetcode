<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">一个元素只有 5 条去路（以 x = 19, k = 3 为例）</text>

  <!-- lane 1: keep -->
  <rect x="40" y="64" width="44" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#666" filter="url(#rough2)">19</text>
  <path d="M 90 79 L 106 79" stroke="#999" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="110" y="64" width="210" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="84" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不动</text>
  <path d="M 324 79 L 334 79" stroke="#999" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="338" y="64" width="46" height="30" fill="#eeeeee" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#666" filter="url(#rough2)">19</text>
  <text x="402" y="84" font-size="11" fill="#888" filter="url(#rough2)">花费 (0,0)</text>

  <!-- lane 2: op1 only -->
  <rect x="40" y="110" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">19</text>
  <path d="M 90 125 L 106 125" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="110" y="110" width="210" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="130" text-anchor="middle" font-size="11.5" fill="#33506e" filter="url(#rough2)">仅① ⌈19/2⌉ = 10</text>
  <path d="M 324 125 L 334 125" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="338" y="110" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">10</text>
  <text x="402" y="130" font-size="11" fill="#888" filter="url(#rough2)">花费 (1,0)</text>

  <!-- lane 3: op2 only -->
  <rect x="40" y="156" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">19</text>
  <path d="M 90 171 L 106 171" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="110" y="156" width="210" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="215" y="176" text-anchor="middle" font-size="11.5" fill="#3a6130" filter="url(#rough2)">仅② 19−3 = 16（需 x ≥ k）</text>
  <path d="M 324 171 L 334 171" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="338" y="156" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">16</text>
  <text x="402" y="176" font-size="11" fill="#888" filter="url(#rough2)">花费 (0,1)</text>

  <!-- lane 4: op1 then op2 -->
  <rect x="40" y="202" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">19</text>
  <path d="M 90 217 L 106 217" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="110" y="202" width="210" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">先①后② 10→7（需 ⌈x/2⌉≥k）</text>
  <path d="M 324 217 L 334 217" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="338" y="202" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">7</text>
  <text x="402" y="222" font-size="11" fill="#888" filter="url(#rough2)">花费 (1,1)</text>

  <!-- lane 5: op2 then op1 -->
  <rect x="40" y="248" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">19</text>
  <path d="M 90 263 L 106 263" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="110" y="248" width="210" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="215" y="268" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">先②后① 16→8（需 x ≥ k）</text>
  <path d="M 324 263 L 334 263" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="338" y="248" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">8</text>
  <text x="402" y="268" font-size="11" fill="#888" filter="url(#rough2)">花费 (1,1)</text>

  <!-- note boxes -->
  <rect x="30" y="300" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">顺序引理：两序皆可行时，先①后② ≤ 先②后①（此处 7 ≤ 8）</text>
  <rect x="30" y="348" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">但门槛不同：先①后②需 x ≥ 2k−1，先②后①只需 x ≥ k</text>
  <text x="270" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">x ∈ [k, 2k−2] 时只有先②后①可用 —— 两个叠招分支都不能删</text>
</svg>
