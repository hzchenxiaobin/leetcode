<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280.0" y="26.0" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：a = [4,4,2,3,1,5]</text>
  <text x="280.0" y="44.0" text-anchor="middle" font-size="9.4" fill="#888" filter="url(#rough2)">后缀 min 指 min(a[i+1..n−1])；最右一列由「前缀 max ≤ 后缀 min」判定</text>
  <rect x="44.0" y="54.0" width="474.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="75.0" text-anchor="start" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="104.0" y="75.0" text-anchor="start" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <text x="166.0" y="75.0" text-anchor="start" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">前缀 max</text>
  <text x="284.0" y="75.0" text-anchor="start" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">后缀 min</text>
  <text x="430.0" y="75.0" text-anchor="start" font-size="10.2" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">可切？</text>
  <rect x="44.0" y="86.0" width="474.0" height="34.0" fill="#fafafa" stroke="#bbb" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="108.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="104.0" y="108.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="166.0" y="108.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="284.0" y="108.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430.0" y="108.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">✗</text>
  <rect x="44.0" y="120.0" width="474.0" height="34.0" fill="#fafafa" stroke="#bbb" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="142.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="104.0" y="142.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="166.0" y="142.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="284.0" y="142.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430.0" y="142.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">✗</text>
  <rect x="44.0" y="154.0" width="474.0" height="34.0" fill="#fafafa" stroke="#bbb" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="176.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="104.0" y="176.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="166.0" y="176.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="284.0" y="176.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430.0" y="176.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">✗</text>
  <rect x="44.0" y="188.0" width="474.0" height="34.0" fill="#fafafa" stroke="#bbb" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="210.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="104.0" y="210.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="166.0" y="210.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="284.0" y="210.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430.0" y="210.0" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">✗</text>
  <rect x="44.0" y="222.0" width="474.0" height="34.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="104.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="166.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="284.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="430.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 切</text>
  <rect x="44.0" y="262.0" width="474.0" height="46.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="58.0" y="282.0" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">切点只有 i = 4（4 ≤ 5）→ 块数 = 1 + 1 = 2</text>
  <text x="58.0" y="299.0" text-anchor="start" font-size="9.6" fill="#555" filter="url(#rough2)">两块为 [4,4,2,3,1] 与 [5]：排序后 [1,2,3,4,4] + [5] = 整体有序</text>
  <text x="280.0" y="334.0" text-anchor="middle" font-size="9.6" fill="#777" filter="url(#rough2)">反证视角：i = 0 处左 max 为 4，右侧最小为 1，排序后 4 必在 1 之后 → 不能切</text>
  <text x="280.0" y="354.0" text-anchor="middle" font-size="9.6" fill="#777" filter="url(#rough2)">这也解释了为什么「只看相邻元素逆序」不够：右块的全局最小值才决定能否跨界</text>
</svg>
