<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 3 演算：s = "1000100"，全局 ones = 2</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">游程：r0=1(len1)｜r1=000(len3)｜r2=1(len1)｜r3=00(len2)</text>

  <rect x="40" y="62" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">查询</text>
  <rect x="150" y="62" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">(il, ir) 与候选 j</text>
  <rect x="300" y="62" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">Δ = 左 + 右</text>
  <rect x="420" y="62" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">答案</text>

  <rect x="40" y="100" width="110" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="126" text-anchor="middle" font-size="11" fill="#333">[1, 5]</text>
  <text x="95" y="145" text-anchor="middle" font-size="9.5" fill="#888">子串 "00010"</text>
  <rect x="150" y="100" width="150" height="60" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="122" text-anchor="middle" font-size="10" fill="#333">il=1, ir=3</text>
  <text x="225" y="140" text-anchor="middle" font-size="10" fill="#333">唯一候选 j=2</text>
  <rect x="300" y="100" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="122" text-anchor="middle" font-size="10.5" fill="#8a3a36">左 3（完整）</text>
  <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#8a3a36">右 1（被 r 截断）</text>
  <rect x="420" y="100" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4" filter="url(#rough2)"/>
  <text x="470" y="127" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">2 + 4 = 6</text>

  <rect x="40" y="168" width="110" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="194" text-anchor="middle" font-size="11" fill="#333">[0, 6]</text>
  <text x="95" y="213" text-anchor="middle" font-size="9.5" fill="#888">整串</text>
  <rect x="150" y="168" width="150" height="60" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="190" text-anchor="middle" font-size="10" fill="#333">il=0, ir=3</text>
  <text x="225" y="208" text-anchor="middle" font-size="10" fill="#333">j=1 跳过，j=2 命中</text>
  <rect x="300" y="168" width="120" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="190" text-anchor="middle" font-size="10.5" fill="#8a3a36">左 3（完整）</text>
  <text x="360" y="208" text-anchor="middle" font-size="10.5" fill="#8a3a36">右 2（完整）</text>
  <rect x="420" y="168" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4" filter="url(#rough2)"/>
  <text x="470" y="195" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">2 + 5 = 7</text>

  <rect x="40" y="236" width="110" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="262" text-anchor="middle" font-size="11" fill="#333">[0, 4]</text>
  <text x="95" y="281" text-anchor="middle" font-size="9.5" fill="#888">子串 "10001"</text>
  <rect x="150" y="236" width="150" height="60" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="258" text-anchor="middle" font-size="10" fill="#333">il=0, ir=2</text>
  <text x="225" y="276" text-anchor="middle" font-size="10" fill="#333">jlo=1 &gt; jhi=1？无候选</text>
  <rect x="300" y="236" width="120" height="60" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="268" text-anchor="middle" font-size="10.5" fill="#888">右 0 段为空</text>
  <rect x="420" y="236" width="100" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="4" filter="url(#rough2)"/>
  <text x="470" y="263" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">2 + 0 = 2</text>

  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#888">prompt 输出 [6, 7, 2] 与上表一致；[0,4] 的 j 区间为空，直接返回全局 ones</text>
</svg>
