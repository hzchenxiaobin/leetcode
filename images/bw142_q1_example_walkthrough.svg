<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三个示例的段长与方案枚举</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">公式：ans = 1 + Σ(c_i − 1) = n − 段数 + 1</text>

  <rect x="32" y="62" width="496" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">word</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">段长</text>
  <text x="400" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">可达的原串</text>
  <text x="500" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">ans</text>

  <rect x="32" y="98" width="496" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="11" fill="#8a6a20">"abbcccc"</text>
  <text x="250" y="122" text-anchor="middle" font-size="10.5" fill="#555">1, 2, 4</text>
  <text x="250" y="142" text-anchor="middle" font-size="9.5" fill="#888">n = 7，段数 = 3</text>
  <text x="400" y="118" text-anchor="middle" font-size="9.5" fill="#555">abbcccc / abbccc / abbcc</text>
  <text x="400" y="134" text-anchor="middle" font-size="9.5" fill="#555">abbc / abcccc</text>
  <text x="400" y="154" text-anchor="middle" font-size="9" fill="#888">只缩 "cccc" 一段（3 种）+ 原串</text>
  <text x="500" y="134" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">5</text>

  <rect x="32" y="180" width="496" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="204" text-anchor="middle" font-size="11" fill="#3a5a30">"abcd"</text>
  <text x="250" y="204" text-anchor="middle" font-size="10.5" fill="#555">1, 1, 1, 1</text>
  <text x="250" y="222" text-anchor="middle" font-size="9.5" fill="#888">n = 4，段数 = 4</text>
  <text x="400" y="204" text-anchor="middle" font-size="9.5" fill="#555">只有 "abcd" 本身</text>
  <text x="400" y="222" text-anchor="middle" font-size="9" fill="#888">每段都不可缩短</text>
  <text x="500" y="216" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">1</text>

  <rect x="32" y="246" width="496" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="270" text-anchor="middle" font-size="11" fill="#8a3a36">"aaaa"</text>
  <text x="250" y="270" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <text x="250" y="288" text-anchor="middle" font-size="9.5" fill="#888">n = 4，段数 = 1</text>
  <text x="400" y="270" text-anchor="middle" font-size="9.5" fill="#555">aaaa / aaa / aa / a</text>
  <text x="400" y="288" text-anchor="middle" font-size="9" fill="#888">唯一一段缩到 1..3 个</text>
  <text x="500" y="282" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">4</text>

  <rect x="32" y="312" width="496" height="34" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="10" fill="#666">"abbcccc" 里 "bb" 缩成 "b" 得到 "abcccc"，与缩 "cccc" 得到的串互不相同 → 枚举完备且不重</text>
</svg>
