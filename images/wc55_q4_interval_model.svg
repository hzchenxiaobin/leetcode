<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">区间模型：有序不相交的半开区间表</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">被跟踪的数集 = 若干互不相接的 [l, r) 之并，add 时合并、remove 时切段</text>

  <!-- 第 1 行：addRange -->
  <text x="60" y="96" font-size="11" fill="#3a4a66" filter="url(#rough2)">① addRange(10, 20)：空表 → 新增一段 [10, 20)</text>
  <path d="M 70 130 L 570 130" stroke="#bbbbbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="135" y="119" width="328" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="299" y="134" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10, 20)</text>
  <text x="135" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>
  <text x="266" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">14</text>
  <text x="332" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">16</text>
  <text x="463" y="158" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">20</text>

  <!-- 第 2 行：removeRange -->
  <text x="60" y="198" font-size="11" fill="#8a3a36" filter="url(#rough2)">② removeRange(14, 16)：[10, 20) 被切成 [10, 14) 与 [16, 20)</text>
  <path d="M 70 240 L 570 240" stroke="#bbbbbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="135" y="229" width="131" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="244" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[10, 14)</text>
  <rect x="332" y="229" width="131" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="397" y="244" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">[16, 20)</text>
  <path d="M 266 224 L 332 224" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="299" y="216" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">缺口</text>

  <!-- 第 3 行：queryRange -->
  <text x="60" y="316" font-size="11" fill="#4a7a3a" filter="url(#rough2)">③ queryRange(13, 15)：覆盖 13 的区间右端 14 &lt; 15，跨过缺口</text>
  <path d="M 70 350 L 570 350" stroke="#bbbbbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="135" y="339" width="131" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="339" width="131" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="233" y="335" width="66" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="266" y="380" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">查询 [13, 15)</text>
  <path d="M 233 388 L 299 388" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="478" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">query(10,14) → true</text>
  <text x="478" y="358" font-size="10" fill="#b85450" filter="url(#rough2)">query(13,15) → false</text>

  <!-- 底部不变式 -->
  <rect x="55" y="396" width="530" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="411" font-size="10" fill="#3a5a30" filter="url(#rough2)">不变式：表中区间按左端点有序、两两不相接（右端点 &lt; 下一段左端点）。</text>
  <text x="70" y="424" font-size="10" fill="#3a5a30" filter="url(#rough2)">因此 queryRange 只需看「左端点 ≤ left 的最后一段」是否一直盖到 right。</text>
</svg>
