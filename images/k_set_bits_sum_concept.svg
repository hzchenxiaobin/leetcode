<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">nums = [5,10,1,5,2]，k = 1：只看「下标」的二进制</text>

  <!-- 表头 -->
  <text x="72" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="196" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">i 的二进制</text>
  <text x="300" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">置位数</text>
  <text x="402" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums[i]</text>

  <!-- 选中行背景（i = 1, 2, 4） -->
  <rect x="34" y="133" width="430" height="46" fill="#e6f4ea" rx="6" filter="url(#rough2)"/>
  <rect x="34" y="181" width="430" height="46" fill="#e6f4ea" rx="6" filter="url(#rough2)"/>
  <rect x="34" y="277" width="430" height="46" fill="#e6f4ea" rx="6" filter="url(#rough2)"/>

  <!-- 行 0：000，0 个置位，不选 -->
  <rect x="40" y="88" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="136" y="88" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="113" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="178" y="88" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="196" y="113" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="220" y="88" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="238" y="113" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="272" y="88" width="56" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="113" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <rect x="352" y="88" width="100" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="402" y="113" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">5</text>
  <text x="466" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 1：001，1 个置位，选中 -->
  <rect x="40" y="136" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="136" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="161" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="178" y="136" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="196" y="161" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="220" y="136" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="272" y="136" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="352" y="136" width="100" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#b27a10" filter="url(#rough2)">10</text>
  <text x="466" y="162" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 2：010，1 个置位，选中 -->
  <rect x="40" y="184" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="209" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="184" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="209" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="178" y="184" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="220" y="184" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="238" y="209" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="272" y="184" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="352" y="184" width="100" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#b27a10" filter="url(#rough2)">1</text>
  <text x="466" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 3：011，2 个置位，不选 -->
  <rect x="40" y="232" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="257" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="136" y="232" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="257" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="178" y="232" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="220" y="232" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="272" y="232" width="56" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="257" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">2</text>
  <rect x="352" y="232" width="100" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="402" y="257" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">5</text>
  <text x="466" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="402" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 ≠ k，跳过</text>

  <!-- 行 4：100，1 个置位，选中 -->
  <rect x="40" y="280" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="305" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="136" y="280" width="36" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="154" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="178" y="280" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="196" y="305" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="220" y="280" width="36" height="40" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="238" y="305" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="272" y="280" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="352" y="280" width="100" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#b27a10" filter="url(#rough2)">2</text>
  <text x="466" y="306" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 汇总 -->
  <path d="M 260 328 L 260 352" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="356" width="280" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 10 + 1 + 2 = 13</text>
</svg>
