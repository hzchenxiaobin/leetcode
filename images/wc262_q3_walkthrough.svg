<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" viewBox="0 0 780 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="620" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：update(1,3) 更正之后，过时的 (10,1) 在查询时被当场识破</text>
  <path d="M 150 42 Q 390 52 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="60" y="70" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">前奏：建立记录，(10,1) 尚且有效</text>

  <g filter="url(#rough2)">
    <rect x="50" y="82" width="160" height="170" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="130" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6414" filter="url(#rough2)">① update(1,10)</text>
  <path d="M 60 112 L 200 112" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ts2price = {1: 10}</text>
  <text x="130" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxTs = 1</text>
  <text x="130" y="170" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">maxHeap：</text>
  <g filter="url(#rough2)">
    <rect x="98" y="180" width="64" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="130" y="199" text-anchor="middle" font-size="10.5" fill="#2b4666" filter="url(#rough2)">(10,1)</text>
  <text x="130" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">multiset = {10}</text>

  <g filter="url(#rough2)">
    <rect x="226" y="82" width="160" height="170" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="306" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6414" filter="url(#rough2)">② update(2,5)</text>
  <path d="M 236 112 L 376 112" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="306" y="132" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ts2price = {1:10, 2:5}</text>
  <text x="306" y="150" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxTs = 2</text>
  <text x="306" y="170" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">maxHeap：</text>
  <g filter="url(#rough2)">
    <rect x="258" y="180" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="322" y="180" width="56" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="286" y="199" text-anchor="middle" font-size="10.5" fill="#2b4666" filter="url(#rough2)">(10,1)</text>
  <text x="350" y="199" text-anchor="middle" font-size="10.5" fill="#2b4666" filter="url(#rough2)">(5,2)</text>
  <text x="306" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">multiset = {5, 10}</text>

  <g filter="url(#rough2)">
    <rect x="402" y="82" width="160" height="170" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="482" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">③ current()</text>
  <path d="M 412 112 L 552 112" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="482" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxTs = 2</text>
  <text x="482" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ts2price[2] = 5</text>
  <g filter="url(#rough2)">
    <rect x="422" y="176" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="482" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 5 ✓</text>
  <text x="482" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">O(1)，不碰堆</text>

  <g filter="url(#rough2)">
    <rect x="578" y="82" width="160" height="170" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="658" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">④ maximum()</text>
  <path d="M 588 112 L 728 112" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="658" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">堆顶 (10,1)：</text>
  <text x="658" y="154" text-anchor="middle" font-size="10.5" fill="#3a5c2e" filter="url(#rough2)">ts2price[1] = 10 ✓</text>
  <g filter="url(#rough2)">
    <rect x="598" y="176" width="120" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="658" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 10 ✓</text>
  <text x="658" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">multiset rbegin() = 10</text>

  <!-- row 2 -->
  <text x="60" y="286" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">高潮：update(1,3) 更正，(10,1) 沦为过时条目</text>

  <g filter="url(#rough2)">
    <rect x="50" y="298" width="230" height="190" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="165" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⑤ update(1,3) —— 更正！</text>
  <path d="M 60 328 L 270 328" stroke="#f0c8c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="348" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ts2price[1]：10 → 3（覆盖）</text>
  <text x="165" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">maxHeap 只 push 不删：</text>
  <g filter="url(#rough2)">
    <rect x="68" y="376" width="62" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="138" y="376" width="62" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="208" y="376" width="62" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="99" y="395" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">10,1</text>
  <text x="169" y="395" text-anchor="middle" font-size="10" fill="#2b4666" filter="url(#rough2)">5,2</text>
  <text x="239" y="395" text-anchor="middle" font-size="10" fill="#2b4666" filter="url(#rough2)">3,1</text>
  <path d="M 74 380 L 124 400" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 124 380 L 74 400" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="99" y="418" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">过时残留 ✗</text>
  <text x="239" y="418" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">新条目 ✓</text>
  <text x="165" y="442" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">multiset：erase(10)、insert(3)</text>
  <text x="165" y="462" text-anchor="middle" font-size="10.5" fill="#2b4666" filter="url(#rough2)">→ {3, 5}，无残留</text>

  <g filter="url(#rough2)">
    <rect x="298" y="298" width="250" height="190" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="423" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">⑥ maximum() —— 延迟删除时刻</text>
  <path d="M 308 328 L 538 328" stroke="#cfe3cc" stroke-width="1" filter="url(#rough2)"/>
  <text x="423" y="350" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">堆顶 (10,1)：ts2price[1] = 3 ≠ 10</text>
  <text x="423" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 过时，pop 弹出 ✗</text>
  <text x="423" y="396" text-anchor="middle" font-size="10.5" fill="#3a5c2e" filter="url(#rough2)">新堆顶 (5,2)：ts2price[2] = 5 ✓</text>
  <g filter="url(#rough2)">
    <rect x="333" y="410" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="423" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 5 ✓</text>
  <text x="423" y="466" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">multiset：rbegin() = 5，殊途同归</text>

  <g filter="url(#rough2)">
    <rect x="566" y="298" width="190" height="190" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="661" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">⑦ minimum()</text>
  <path d="M 576 328 L 746 328" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="661" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">先 update(4,2)：{1:3, 2:5, 4:2}</text>
  <text x="661" y="370" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">minHeap 堆顶 (2,4)：</text>
  <text x="661" y="390" text-anchor="middle" font-size="10.5" fill="#3a5c2e" filter="url(#rough2)">ts2price[4] = 2 ✓</text>
  <g filter="url(#rough2)">
    <rect x="586" y="404" width="150" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="661" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 2 ✓</text>
  <text x="661" y="462" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">multiset begin() = 2</text>

  <!-- takeaway -->
  <g filter="url(#rough2)">
    <rect x="70" y="512" width="640" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="390" y="536" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b5312" filter="url(#rough2)">关键瞬间：旧条目从不主动删除，只在挡住堆顶时被「当场识破」弹出；</text>
  <text x="390" y="558" text-anchor="middle" font-size="11" fill="#6b5312" filter="url(#rough2)">每个条目至多 push 一次、pop 一次——单次查询或许连弹多个，总账均摊 O(log n)</text>
</svg>
