<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：三条代码路径覆盖四组数据</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">T = 存活对上的 Σ A[p]A[q]，答案 = (−1)^{n+m} · T mod (10⁹+7)</text>
  <rect x="24" y="64" width="672" height="76" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="40" y="85" width="66" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="107" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3 × 3</text>
  <text x="122" y="94" font-size="12" fill="#233" filter="url(#rough2)">n、m 都奇 → T 只取奇行奇列：T = (1+2+3+4)² = 100</text>
  <text x="122" y="118" font-size="11" fill="#777" filter="url(#rough2)">奇行 ∩ 奇列就是四个角：1+2+3+4 = 10，符号 (−1)^6 = +1</text>
  <text x="676" y="108" text-anchor="end" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">100</text>
  <rect x="24" y="148" width="672" height="76" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="40" y="169" width="66" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3 × 2</text>
  <text x="122" y="178" font-size="12" fill="#233" filter="url(#rough2)">n 奇 m 偶 → X = 奇数行的列和 = (4, 5)，T = 2·X₁X₂ = 40</text>
  <text x="122" y="202" font-size="11" fill="#777" filter="url(#rough2)">符号 (−1)^5 = −1 ⇒ 输出 10⁹+7−40 = 999999967</text>
  <text x="676" y="192" text-anchor="end" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">999999967</text>
  <rect x="24" y="232" width="672" height="76" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="40" y="253" width="66" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="275" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2 × 4</text>
  <text x="122" y="262" font-size="12" fill="#233" filter="url(#rough2)">n、m 都偶 → P = 第 1 行，q = 第 2 行，quad(P,q) = 3</text>
  <text x="122" y="286" font-size="11" fill="#777" filter="url(#rough2)">T = 2·3 = 6，符号 (−1)^6 = +1 ⇒ 输出 6</text>
  <text x="676" y="276" text-anchor="end" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <rect x="24" y="316" width="672" height="76" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="40" y="337" width="66" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="73" y="359" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">4 × 4</text>
  <text x="122" y="346" font-size="12" fill="#233" filter="url(#rough2)">偶数行 2、4 各结算一次：quad = −6 与 −12（P 逐行累加）</text>
  <text x="122" y="370" font-size="11" fill="#777" filter="url(#rough2)">T = 2·(−18) = −36，符号 +1 ⇒ 输出 10⁹+7−36 = 999999971</text>
  <text x="676" y="360" text-anchor="end" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">999999971</text>
  <text x="44" y="418" font-size="11.5" fill="#777" filter="url(#rough2)">样例 1、2 之外，3 与 4 演示「偶数行结算」：P 是前面所有奇数行的逐列和，quad 只需前缀/后缀和</text>
</svg>
