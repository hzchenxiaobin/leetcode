<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">增量法：分割点右移一格，只有字符 s[i] 换了边</text>

  <rect x="52" y="58" width="118" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="111" y="84" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">左半 s[0..i-1]</text>

  <line x1="180" y1="52" x2="180" y2="106" stroke="#b85450" stroke-width="2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="180" y="46" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">分割点 i</text>

  <rect x="190" y="58" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="219" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07420" filter="url(#rough2)">s[i]</text>

  <rect x="256" y="58" width="118" height="42" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="315" y="84" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">右半 s[i+1..]</text>

  <path d="M 219 102 C 210 122, 190 128, 172 142" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="248" y="128" font-size="11" fill="#b85450" filter="url(#rough2)">s[i] 搬到左边</text>

  <rect x="44" y="146" width="172" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5424" filter="url(#rough2)">左半 s[0..i]（含 s[i]）</text>

  <line x1="224" y1="140" x2="224" y2="194" stroke="#b85450" stroke-width="2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="224" y="134" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">分割点 i+1</text>

  <rect x="234" y="146" width="118" height="42" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="293" y="172" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">右半 s[i+1..]</text>

  <polygon points="428,146 486,178 428,210 370,178" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="183" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">s[i] = ?</text>

  <path d="M 428 210 C 428 224, 420 230, 408 236" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="232" font-size="12" fill="#446688" filter="url(#rough2)">'0'</text>

  <rect x="322" y="240" width="172" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="408" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">score + 1</text>
  <text x="408" y="274" text-anchor="middle" font-size="11" fill="#5a8a4a" filter="url(#rough2)">左边多了一个 '0'</text>

  <path d="M 428 210 C 428 262, 420 276, 408 284" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="288" width="172" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="408" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">score − 1</text>
  <text x="408" y="322" text-anchor="middle" font-size="11" fill="#a06058" filter="url(#rough2)">右边少了一个 '1'</text>
  <text x="446" y="266" font-size="12" fill="#446688" filter="url(#rough2)">'1'</text>

  <rect x="40" y="352" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="165" y="369" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">初始化：score = [s[0]='0'] + 右半 1 的总数</text>
  <text x="165" y="385" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">（即分割点为 1 时的得分）</text>

  <rect x="300" y="352" width="186" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="393" y="369" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">i 从 1 到 n−2，每搬一个字符更新一次</text>
  <text x="393" y="385" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">ans = max(ans, score)</text>
</svg>
