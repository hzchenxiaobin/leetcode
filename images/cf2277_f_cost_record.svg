<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">代价只看一件事：u 是不是 r→u 路径上最早执行的点</text>
  <path d="M 90 42 Q 400 49 710 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左：u 最早 ================= -->
  <text x="200" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">情形 A：t(u)=2 比祖辈都小</text>

  <!-- 子树 u 的虚线圈 -->
  <rect x="56" y="222" width="288" height="152" rx="14" fill="#fff8e1" fill-opacity="0.65"
        stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="72" y="242" font-size="11" fill="#8a6015" filter="url(#rough2)">subtree(u)</text>

  <path d="M 200 108 L 200 168" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 200 188 L 200 246" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 200 274 L 130 316" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 274 L 270 316" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="200" cy="96" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r</text>
  <rect x="228" y="82" width="46" height="20" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="251" y="96" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=5</text>

  <circle cx="200" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="200" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x</text>
  <rect x="226" y="168" width="46" height="20" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="249" y="182" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=4</text>

  <circle cx="200" cy="260" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">u</text>
  <rect x="228" y="248" width="46" height="20" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="251" y="262" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">t=2</text>

  <circle cx="122" cy="326" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="331" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="122" y="356" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=6</text>

  <circle cx="278" cy="326" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="278" y="331" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d</text>
  <text x="278" y="356" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=7</text>

  <text x="200" y="400" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">没有祖辈先执行 ⇒ a_c+a_d+a_u 仍躺在子树里</text>
  <text x="200" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cost(u) = a_u + a_c + a_d = S(u)</text>

  <!-- 分隔线 -->
  <path d="M 396 74 Q 400 240 396 410" stroke="#c8c8c8" stroke-width="1.4" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>

  <!-- ================= 右：x 更早 ================= -->
  <text x="600" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">情形 B：祖辈 x 的 t=1 更早</text>

  <rect x="456" y="222" width="288" height="152" rx="14" fill="#fce4ec" fill-opacity="0.6"
        stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="472" y="242" font-size="11" fill="#b85450" filter="url(#rough2)">subtree(u) 已被搬空</text>

  <path d="M 600 108 L 600 168" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 600 188 L 600 246" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 600 274 L 530 316" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 600 274 L 670 316" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="600" cy="96" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r</text>
  <rect x="628" y="82" width="46" height="20" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="651" y="96" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">t=5</text>

  <circle cx="600" cy="180" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="600" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">x</text>
  <rect x="626" y="168" width="46" height="20" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="649" y="182" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">t=1</text>

  <circle cx="600" cy="260" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="600" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">u</text>
  <rect x="628" y="248" width="46" height="20" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="651" y="262" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">t=3</text>

  <circle cx="522" cy="326" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="522" y="331" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="522" y="356" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=6</text>

  <circle cx="678" cy="326" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="678" y="331" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d</text>
  <text x="678" y="356" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">t=7</text>

  <path d="M 536 268 Q 512 196 584 166" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="152" font-size="11" fill="#b85450" filter="url(#rough2)">t=1 时整块搬到 x</text>
  <text x="452" y="172" font-size="11" fill="#b85450" filter="url(#rough2)">（x 在 subtree(u) 之外）</text>

  <text x="600" y="400" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">轮到 u 时子树里一个 token 都不剩</text>
  <text x="600" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">cost(u) = 0</text>

  <!-- 结论框 -->
  <rect x="120" y="444" width="560" height="44" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="472" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">于是 weight(r) = Σ_u cost(u) = Σ_{u 是 r→u 路径最小值} S_r(u)（S_r 为 r 为根时的子树和）</text>
</svg>
