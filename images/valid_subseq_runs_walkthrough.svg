<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,1,1,2,1,2] 的奇偶段分解</text>
  <path d="M 240 40 Q 470 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row labels -->
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="80" y="90">数值</text>
    <text x="80" y="150">奇偶</text>
    <text x="80" y="204">分段</text>
    <text x="80" y="272">每段取一</text>
  </g>

  <!-- row 1: values (skip idx3 marked) -->
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="116" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="90" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="116" y="91">1</text>
    <text x="178" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="152" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="178" y="91">2</text>
    <text x="240" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="214" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="240" y="91">1</text>
    <text x="302" y="64" font-size="12" fill="#b85450" font-weight="bold">✗</text>
    <g filter="url(#sk2)"><rect x="276" y="70" width="52" height="32" rx="4" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/></g>
    <text x="302" y="91" fill="#b85450">1</text>
    <text x="364" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="338" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="364" y="91">2</text>
    <text x="426" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="400" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="426" y="91">1</text>
    <text x="488" y="64" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
    <g filter="url(#sk2)"><rect x="462" y="70" width="52" height="32" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
    <text x="488" y="91">2</text>
  </g>

  <!-- row 2: parity -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="90" y="128" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="116" y="149" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="152" y="128" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="178" y="149" fill="#2b4a6e">0</text>
    <g filter="url(#sk2)"><rect x="214" y="128" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="240" y="149" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="276" y="128" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="302" y="149" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="338" y="128" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="364" y="149" fill="#2b4a6e">0</text>
    <g filter="url(#sk2)"><rect x="400" y="128" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
    <text x="426" y="149" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="462" y="128" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
    <text x="488" y="149" fill="#2b4a6e">0</text>
  </g>

  <!-- row 3: segments -->
  <g font-size="13" fill="#7a5415" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="88" y="180" width="56" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="116" y="202">①</text>
    <g filter="url(#sk2)"><rect x="150" y="180" width="56" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="178" y="202">②</text>
    <g filter="url(#sk2)"><rect x="212" y="180" width="120" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="272" y="202">③（两个 1 同段）</text>
    <g filter="url(#sk2)"><rect x="336" y="180" width="56" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="364" y="202">④</text>
    <g filter="url(#sk2)"><rect x="398" y="180" width="56" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="426" y="202">⑤</text>
    <g filter="url(#sk2)"><rect x="460" y="180" width="56" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="488" y="202">⑥</text>
  </g>
  <text x="285" y="238" text-anchor="middle" font-size="11" fill="#999">奇偶序列 1,0,1,1,0,1,0 → 6 个极大同奇偶段</text>

  <!-- row 4: picked subsequence -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="120" y="252" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="146" y="273" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="182" y="252" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="208" y="273" fill="#2b4a6e">2</text>
    <g filter="url(#sk2)"><rect x="244" y="252" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="270" y="273" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="306" y="252" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="332" y="273" fill="#2b4a6e">2</text>
    <g filter="url(#sk2)"><rect x="368" y="252" width="52" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="394" y="273" fill="#2d5a26">1</text>
    <g filter="url(#sk2)"><rect x="430" y="252" width="52" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="456" y="273" fill="#2b4a6e">2</text>
  </g>
  <text x="300" y="308" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">交替子序列 [1, 2, 1, 2, 1, 2]，长度 = 段数 6</text>

  <!-- right panel: scorecard -->
  <g filter="url(#sk)">
    <rect x="620" y="60" width="300" height="168" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="770" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">三个候选结算</text>
  <text x="646" y="116" font-size="12" fill="#2d5a26" font-weight="bold">全奇（奇数个数）odd = 4</text>
  <text x="646" y="142" font-size="12" fill="#2b4a6e" font-weight="bold">全偶（偶数个数）even = 3</text>
  <text x="646" y="168" font-size="12" fill="#7a5415" font-weight="bold">交替（段数）runs = 6 ← 最大</text>
  <text x="646" y="200" font-size="13" fill="#b03a3a" font-weight="bold">ans = max(4, 3, 6) = 6 ✓</text>

  <g filter="url(#sk)">
    <rect x="620" y="248" width="300" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="646" y="276" font-size="13" font-weight="bold" fill="#2d5a26">为什么跳过第 4 个元素？</text>
  <text x="646" y="300" font-size="11" fill="#444">它落在第③段内，该段已取过一个奇数；</text>
  <text x="646" y="322" font-size="11" fill="#444">再取就会出现相邻同奇偶 → 交替性破坏。</text>
  <text x="646" y="350" font-size="11" fill="#2d5a26" font-weight="bold">每段恰取一个 ⟹ 长度 = 段数 6 = 最长交替</text>

  <!-- bottom strip: other examples -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="520" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="84" y="368" font-size="13" font-weight="bold" fill="#2b6e9e">复核另外两个示例</text>
  <text x="84" y="394" font-size="11.5" fill="#444">[1,2,3,4]：奇偶 1,0,1,0 → 段 1|0|1|0，runs = 4；odd = 2，even = 2 → ans = 4</text>
  <text x="84" y="418" font-size="11.5" fill="#444">[1,3]：奇偶 1,1 → 只有 1 段，runs = 1；odd = 2，even = 0 → 靠全奇撑住</text>
  <text x="84" y="440" font-size="11.5" fill="#b03a3a" font-weight="bold">两个示例都验证：ans = max(odd, even, runs) ✓</text>
</svg>
