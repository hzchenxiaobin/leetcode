<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：当前序列首尾配对，强队就恰好碰弱队</text>
  <text x="330" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">n = 8 的第 1 轮：下标 i 与下标 m−1−i 配对，m 为当前序列长度</text>

  <text x="84" y="72" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">强队</text>
  <text x="330" y="72" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">配对结果（新序列）</text>
  <text x="576" y="72" font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">弱队（倒序）</text>

  <rect x="56" y="78" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="100" font-size="13" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="250" y="78" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="100" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(1,8)</text>
  <rect x="548" y="78" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="100" font-size="13" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <path d="M 112 95 L 248 95" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 412 95 L 546 95" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="126" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="148" font-size="13" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="250" y="126" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="148" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(2,7)</text>
  <rect x="548" y="126" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="148" font-size="13" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <path d="M 112 143 L 248 143" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 412 143 L 546 143" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="174" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="196" font-size="13" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="250" y="174" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="196" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(3,6)</text>
  <rect x="548" y="174" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="196" font-size="13" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 112 191 L 248 191" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 412 191 L 546 191" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="222" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="84" y="244" font-size="13" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="250" y="222" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="330" y="244" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(4,5)</text>
  <rect x="548" y="222" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="576" y="244" font-size="13" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 112 239 L 248 239" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 412 239 L 546 239" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="278" width="580" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="302" font-size="11.5" fill="#3a5f2e" font-weight="bold" filter="url(#rough2)">为什么「首尾配对」可以一轮轮套下去？</text>
  <text x="58" y="326" font-size="11" fill="#444" filter="url(#rough2)">① 序列按「队内最强 rank」升序排列：最左最强，最右最弱。</text>
  <text x="58" y="348" font-size="11" fill="#444" filter="url(#rough2)">② 首尾配对后，(1,8) 的最强仍是 1，仍排在新序列最左；(4,5) 最弱，排最右。</text>
  <text x="58" y="370" font-size="11" fill="#444" filter="url(#rough2)">③ 新序列依旧升序 ⇒ 同一规则可反复使用，无需重新排序。</text>
  <text x="58" y="392" font-size="11" fill="#444" filter="url(#rough2)">④ 每轮长度减半，共 log₂(n) 轮；每轮给每项外面再加一层括号。</text>
</svg>
