<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两个官方示例的分层演算</text>
  <text x="131" y="62" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">示例 1  grid = [[1,0,1],[0,0,0],[1,0,1]]</text>
  <rect x="44" y="76" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="73.0" y="112.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5e22" filter="url(#rough2)">0</text>
  <rect x="102" y="76" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131.0" y="112.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="76" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="189.0" y="112.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5e22" filter="url(#rough2)">0</text>
  <rect x="44" y="134" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="73.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="102" y="134" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="160" y="134" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="44" y="192" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="73.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5e22" filter="url(#rough2)">0</text>
  <rect x="102" y="192" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="131.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="192" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="189.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5e22" filter="url(#rough2)">0</text>
  <text x="44" y="272" font-size="11.5" fill="#b85450" filter="url(#rough2)">第 1 层染 4 个边格</text>
  <text x="44" y="291" font-size="11.5" fill="#b85450" filter="url(#rough2)">第 2 层染到中心 (1,1)</text>
  <text x="431" y="62" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">示例 2  grid = [[1,0,0],[0,0,0],[0,0,0]]</text>
  <rect x="344" y="76" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="373.0" y="112.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5e22" filter="url(#rough2)">0</text>
  <rect x="402" y="76" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="431.0" y="112.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
