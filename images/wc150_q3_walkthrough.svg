  <rect x="344" y="134" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="402" y="134" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="431.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="460" y="134" width="58" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="489.0" y="170.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="344" y="192" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="373.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="402" y="192" width="58" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="431.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <rect x="460" y="192" width="58" height="58" fill="#f6c9d2" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="489.0" y="228.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="344" y="272" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">第 1 层 2 格，第 2 层 3 格</text>
  <text x="344" y="291" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">第 4 层才染到 (2,2)</text>
  <rect x="44" y="306" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="69" y="320" font-size="11.5" fill="#444" filter="url(#rough2)">0 = 陆地</text>
  <rect x="194" y="306" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="320" font-size="11.5" fill="#444" filter="url(#rough2)">1 = 第 1 层</text>
  <rect x="344" y="306" width="18" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="320" font-size="11.5" fill="#444" filter="url(#rough2)">2 = 第 2 层</text>
  <rect x="494" y="306" width="18" height="18" fill="#f6c9d2" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="519" y="320" font-size="11.5" fill="#444" filter="url(#rough2)">3–4 = 更远</text>
  <text x="44" y="362" font-size="11.5" fill="#444" filter="url(#rough2)">格内数字 = 到最近陆地的曼哈顿距离，也是多源 BFS 的层号</text>
  <text x="44" y="386" font-size="11.5" fill="#b85450" filter="url(#rough2)">示例 1 答案 2（中心），示例 2 答案 4（右下角）：答案 = 最大层号</text>
</svg>
