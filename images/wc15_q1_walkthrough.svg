<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1,1,0,1,1,1]</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">每读一个元素，cur 与 best 的取值走查</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444" font-weight="bold">
    <rect x="50" y="78" width="60" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="110" y="78" width="70" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="180" y="78" width="70" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="250" y="78" width="70" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="320" y="78" width="200" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="80" y="97" fill="#444">i</text>
    <text x="145" y="97" fill="#444">nums[i]</text>
    <text x="215" y="97" fill="#444">cur</text>
    <text x="285" y="97" fill="#444">best</text>
    <text x="420" y="97" fill="#444">更新说明</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="108" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="110" y="108" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="180" y="108" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="250" y="108" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="320" y="108" width="200" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="80" y="127" fill="#555">0</text>
    <text x="145" y="127" fill="#3a5a30" font-weight="bold">1</text>
    <text x="215" y="127" fill="#555">1</text>
    <text x="285" y="127" fill="#555">1</text>
    <text x="420" y="127" fill="#555">新段开始，best 更新为 1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="138" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="110" y="138" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="180" y="138" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="250" y="138" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="320" y="138" width="200" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="80" y="157" fill="#555">1</text>
    <text x="145" y="157" fill="#3a5a30" font-weight="bold">1</text>
    <text x="215" y="157" fill="#555">2</text>
    <text x="285" y="157" fill="#555">2</text>
    <text x="420" y="157" fill="#555">段内继续 +1，best 更新为 2</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="168" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="110" y="168" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <rect x="180" y="168" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="250" y="168" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="320" y="168" width="200" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="80" y="187" fill="#555">2</text>
    <text x="145" y="187" fill="#8a3a36" font-weight="bold">0</text>
    <text x="215" y="187" fill="#b85450">0</text>
    <text x="285" y="187" fill="#555">2</text>
    <text x="420" y="187" fill="#555">遇 0：段结束，段长 2 已入账</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="198" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="110" y="198" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="180" y="198" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="250" y="198" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="320" y="198" width="200" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="80" y="217" fill="#555">3</text>
    <text x="145" y="217" fill="#3a4a66" font-weight="bold">1</text>
    <text x="215" y="217" fill="#555">1</text>
    <text x="285" y="217" fill="#555">2</text>
    <text x="420" y="217" fill="#555">新段开始，best 保持 2</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="228" width="60" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="110" y="228" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="180" y="228" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="250" y="228" width="70" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <rect x="320" y="228" width="200" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.1" rx="3"/>
    <text x="80" y="247" fill="#555">4</text>
    <text x="145" y="247" fill="#3a4a66" font-weight="bold">1</text>
    <text x="215" y="247" fill="#555">2</text>
    <text x="285" y="247" fill="#555">2</text>
    <text x="420" y="247" fill="#555">段内继续 +1，与 best 相同</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="258" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="110" y="258" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="180" y="258" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="250" y="258" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="320" y="258" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="80" y="277" fill="#8a6a20">5</text>
    <text x="145" y="277" fill="#8a6a20" font-weight="bold">1</text>
    <text x="215" y="277" fill="#8a6a20" font-weight="bold">3</text>
    <text x="285" y="277" fill="#8a6a20" font-weight="bold">3</text>
    <text x="420" y="277" fill="#8a6a20">段内 +1，best 刷新为 3</text>
  </g>

  <rect x="130" y="300" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">返回 best = 3（下标 3..5 的 1,1,1）</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#999">注意最后一步：数组以 1 结尾，答案正是在这一步被刷新出来的</text>
</svg>
