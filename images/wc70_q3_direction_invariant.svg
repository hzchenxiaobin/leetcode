<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：L 只向左漂、R 只向右漂，谁也穿不过谁</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一次移动 = 把一个字母与相邻的空位 X 交换（方向单一，空位被动让路）</text>

  <rect x="30" y="60" width="238" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="149" y="80" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① XL → LX：L 左移一格</text>
  <rect x="66" y="92" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="81" y="113" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">X</text>
  <rect x="101" y="92" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="116" y="113" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">L</text>
  <path d="M 141 107 L 159 107" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="168" y="92" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="183" y="113" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="203" y="92" width="30" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="218" y="113" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">X</text>
  <text x="149" y="146" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">下标 3 → 2：只减不增</text>
  <text x="149" y="166" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">L 左边必须是 X，否则动不了</text>

  <rect x="292" y="60" width="238" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="411" y="80" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② RX → XR：R 右移一格</text>
  <rect x="328" y="92" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="343" y="113" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="363" y="92" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="378" y="113" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">X</text>
  <path d="M 403 107 L 421 107" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430" y="92" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="445" y="113" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">X</text>
  <rect x="465" y="92" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="480" y="113" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="411" y="146" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">下标只增不减（R 向右走）</text>
  <text x="411" y="166" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">R 右边必须是 X，否则动不了</text>

  <rect x="30" y="196" width="500" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="218" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">不变量（任何合法移动序列都保持）</text>
  <text x="46" y="242" font-size="10.5" fill="#555" filter="url(#rough2)">• 去掉所有 X 后，剩下的 L / R 序列完全相同 —— 字母之间无法穿越</text>
  <text x="46" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">• 每个 L 的下标只减不增，每个 R 的下标只增不减（单调漂移）</text>
  <text x="46" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">• 两串等长且非 X 子序列相同 ⇒ X 的个数也相同，空位数守恒</text>
  <text x="46" y="310" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⇒「同序 + 方向合法」既必要也充分，双指针一遍扫描即可判定</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：RXXLRXRXL 与 XRLXXRRLX 去掉 X 后都是 R L R R L，第 3.4 节逐对核对</text>
</svg>
