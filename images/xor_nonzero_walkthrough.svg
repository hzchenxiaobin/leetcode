<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：X = 0 与 X ≠ 0 各走一遍</text>

  <!-- 示例 1 -->
  <text x="60" y="58" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：nums = [1, 2, 3]（X = 0，有非零元素）</text>

  <text x="232" y="64" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">删它</text>
  <rect x="210" y="72" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="232" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="262" y="72" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="314" y="72" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="94" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">X = 1 ⊕ 2 ⊕ 3 = 0</text>

  <path d="M283,110 L283,146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="134" font-size="12" fill="#666" filter="url(#rough2)">删掉一个非零元素 1</text>

  <rect x="262" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="314" y="152" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="174" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="174" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2 ⊕ 3 = 1 ≠ 0 ✓</text>

  <text x="320" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = n − 1 = 3 − 1 = 2</text>

  <!-- 示例 2 -->
  <text x="60" y="252" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：nums = [2, 3, 4]（X ≠ 0）</text>

  <rect x="210" y="266" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="288" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="262" y="266" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="288" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="314" y="266" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="288" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="420" y="288" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">X = 2 ⊕ 3 ⊕ 4 = 5 ≠ 0 ✓</text>

  <path d="M283,304 L283,336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="326" font-size="12" fill="#666" filter="url(#rough2)">全部保留，一个都不删</text>

  <text x="320" y="364" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = n = 3</text>

  <!-- 底部说明 -->
  <rect x="60" y="386" width="520" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="411" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">删除元素 e ⟺ 剩余异或变为 X ⊕ e；X = 0 时恰为 e 本身</text>
</svg>
