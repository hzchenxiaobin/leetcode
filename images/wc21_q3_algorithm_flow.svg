<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 剪枝 → 双指针判定 → 首个命中即返回</text>

  <rect x="170" y="46" width="280" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="70" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">输入 s 与 dictionary（k ≤ 1000 个词）</text>

  <path d="M 310 84 L 310 106" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="110" width="320" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="130" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">按 key = (−|w|, w) 排序</text>
  <text x="310" y="148" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度降序；长度相同则字典序升序</text>

  <path d="M 310 160 L 310 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 180 L 420 214 L 310 248 L 200 214 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">队列还有词？</text>

  <path d="M 310 248 L 310 270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="264" font-size="10" fill="#4a7a3a" filter="url(#rough2)">还有</text>

  <path d="M 200 214 L 142 214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">空了</text>

  <rect x="18" y="190" width="124" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="210" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">队列为空</text>
  <text x="80" y="228" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回空串 ""</text>

  <rect x="160" y="272" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">取队首 w：长度剪枝 + 字符频次剪枝</text>
  <text x="310" y="309" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">双指针贪心扫 s 判定子序列</text>

  <path d="M 310 318 L 310 328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 330 L 425 362 L 310 394 L 195 362 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">w 是 s 的子序列？</text>

  <path d="M 425 362 L 452 362" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="354" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="455" y="338" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="530" y="358" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">命中 → 返回 w</text>
  <text x="530" y="376" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">首个合法词即答案</text>

  <path d="M 310 394 L 310 432 L 100 432 L 100 295 L 156 295" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="424" font-size="10" fill="#b85450" filter="url(#rough2)">否：丢弃 w，取下一个</text>

  <text x="310" y="458" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">排序一次 O(k log k · L)；每个词判定 O(n + |w|)，命中即提前返回</text>
</svg>
