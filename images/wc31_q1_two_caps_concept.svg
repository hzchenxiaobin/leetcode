<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案被两个上限同时夹住</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">吃的枚数有上限，种类数本身也有上限，取二者较小值</text>

  <rect x="45" y="76" width="210" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">上限 A：只能吃 n/2 枚</text>
  <text x="150" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每种糖至少占 1 枚</text>
  <text x="150" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">所以 种类数 ≤ n/2</text>

  <rect x="305" y="76" width="210" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="410" y="100" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">上限 B：总共只有 U 种</text>
  <text x="410" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数组里出现的不同数值个数</text>
  <text x="410" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">所以 种类数 ≤ U</text>

  <path d="M 150 166 L 150 190 L 240 190 L 240 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 166 L 410 190 L 320 190 L 320 212" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="216" width="230" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="15" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">ans = min(U, n/2)</text>

  <rect x="55" y="286" width="450" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">关键：这个上界同时是可达的 —— 先每种取一枚（≤ U 枚），</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">不足 n/2 就用重复糖补齐，因此答案是精确值而非估计。</text>
</svg>
