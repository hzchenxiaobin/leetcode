<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="510" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：discount = 50</text>
  <path d="M 240 44 Q 440 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="68" text-anchor="middle" font-size="13" fill="#666">sentence = "there are $1 $2 and 5$ candies in the shop"</text>

  <!-- 单词网格 第 1 行 -->
  <rect x="80" y="86" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="149" y="106" text-anchor="middle" font-size="13.5" fill="#333">there</text>
  <text x="149" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>
  <rect x="232" y="86" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="301" y="106" text-anchor="middle" font-size="13.5" fill="#333">are</text>
  <text x="301" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>
  <rect x="384" y="86" width="138" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="453" y="106" text-anchor="middle" font-size="13.5" fill="#333">$1</text>
  <text x="453" y="124" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓ 价格</text>
  <rect x="536" y="86" width="138" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2" filter="url(#sk)"/>
  <text x="605" y="106" text-anchor="middle" font-size="13.5" fill="#333">$2</text>
  <text x="605" y="124" text-anchor="middle" font-size="10.5" fill="#2e6e2e">✓ 价格</text>
  <rect x="688" y="86" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="757" y="106" text-anchor="middle" font-size="13.5" fill="#333">and</text>
  <text x="757" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>

  <!-- 单词网格 第 2 行 -->
  <rect x="80" y="142" width="138" height="46" rx="6" fill="#fdf0f0" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="149" y="162" text-anchor="middle" font-size="13.5" fill="#333">5$</text>
  <text x="149" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">✗ $ 不在开头</text>
  <rect x="232" y="142" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="301" y="162" text-anchor="middle" font-size="13.5" fill="#333">candies</text>
  <text x="301" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>
  <rect x="384" y="142" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="453" y="162" text-anchor="middle" font-size="13.5" fill="#333">in</text>
  <text x="453" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>
  <rect x="536" y="142" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="605" y="162" text-anchor="middle" font-size="13.5" fill="#333">the</text>
  <text x="605" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>
  <rect x="688" y="142" width="138" height="46" rx="6" fill="#f5f5f5" stroke="#aaa" stroke-width="1.4" filter="url(#sk)"/>
  <text x="757" y="162" text-anchor="middle" font-size="13.5" fill="#333">shop</text>
  <text x="757" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">✗ 非价格</text>

  <!-- 两个价格词的换算 -->
  <rect x="80" y="210" width="360" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="260" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">$1 → 打对折</text>
  <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#333">p = 1，v = 1 × 50 = 50</text>
  <text x="260" y="286" text-anchor="middle" font-size="12.5" fill="#333">0 元 + 50 分 → "$0.50"</text>

  <rect x="460" y="210" width="360" height="92" rx="10" fill="#fef9ef" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="640" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">$2 → 打对折</text>
  <text x="640" y="262" text-anchor="middle" font-size="12.5" fill="#333">p = 2，v = 2 × 50 = 100</text>
  <text x="640" y="286" text-anchor="middle" font-size="12.5" fill="#333">1 元 + 00 分 → "$1.00"（角分补零！）</text>

  <!-- 输出 -->
  <rect x="80" y="326" width="740" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="450" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">输出（非价格单词逐字保留，单词间单空格）</text>
  <text x="450" y="382" text-anchor="middle" font-size="13" fill="#333">"there are $0.50 $1.00 and 5$ candies in the shop"</text>
  <text x="450" y="406" text-anchor="middle" font-size="11" fill="#888">"5$" 的 '$' 不在开头 → 不是价格；若写代码时把它当价格就错了</text>

  <!-- 底部提醒 -->
  <rect x="80" y="440" width="740" height="48" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#sk)"/>
  <text x="450" y="460" text-anchor="middle" font-size="12" fill="#8c3a36">⚠ "$" 单独出现、"$1e5"、"$$"、"$100$" 这类词必须原样保留</text>
  <text x="450" y="479" text-anchor="middle" font-size="12" fill="#8c3a36">判定漏掉任何一条边界，或角分忘补零（.5 ≠ .50），都会直接 WA</text>
</svg>
