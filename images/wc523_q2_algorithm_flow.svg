<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <ellipse cx="260" cy="36" rx="76" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="41" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 n, s</text>

  <path d="M 260 58 L 260 76" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="95" y="80" width="330" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="98" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">埃氏筛求出 ≤ n 的全部质数</text>
  <text x="260" y="115" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">存入数组 P，天然升序，O(n log log n)</text>

  <path d="M 260 122 L 260 140" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="144" width="260" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">sum = 0，ans = []</text>

  <path d="M 260 180 L 260 198" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,200 378,238 260,276 142,238" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">还有质数 p</text>
  <text x="260" y="251" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">且 sum + p ≤ s ？</text>

  <path d="M 380 238 L 396 238" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="398" y="214" width="112" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="234" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">sum += p</text>
  <text x="454" y="252" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans.push(p)</text>

  <path d="M 454 212 L 454 162 L 394 162" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="454" y="152" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">取下一个质数</text>

  <path d="M 260 276 L 260 294" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="290" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="115" y="298" width="290" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">停止：p 及之后的所有质数都装不下</text>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans（升序前缀）</text>

  <path d="M 260 340 L 260 356" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="260" cy="378" rx="60" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">结束</text>
</svg>
