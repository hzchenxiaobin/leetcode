<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">构造 + 二分查询</text>
  <rect x="150" y="60" width="340" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="86.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">构造：扫一遍票，维护 cnt 与 leader</text>
  <rect x="150" y="128" width="340" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="153.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">新票 p：cnt[p]++，若 cnt[p] ≥ cnt[leader] 则 leader = p</text>
  <rect x="150" y="196" width="340" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="222.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lead[i] 记录第 i 张票投完后的领先者</text>
  <rect x="150" y="264" width="340" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="290.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">查询：upper_bound(times, t) − 1 得下标 idx</text>
  <rect x="150" y="332" width="340" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="358.68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">返回 lead[idx]</text>
  <path d="M 320,104 L 320,128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,172 L 320,196" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 320,240 L 320,264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 320,308 L 320,332" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">单次查询 O(log n)，构造 O(n)</text>
</svg>
