<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <path d="M0,8 L4,1 L8,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：窗口里 0 不超过 1 个 ⇔ 一次翻转就能整段变 1</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">nums = [1,0,1,1,0,1]，窗口 [2,5] 内只有下标 4 一个 0，翻转后得 1,1,1,1</text>

  <text x="82" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="134" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="186" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="238" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="290" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="342" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>

  <rect x="60" y="110" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="82" y="137" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="112" y="110" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="134" y="137" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">0</text>
  <rect x="164" y="110" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="186" y="137" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="216" y="110" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="238" y="137" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>
  <rect x="268" y="110" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="290" y="137" text-anchor="middle" font-size="15" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="320" y="110" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="342" y="137" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">1</text>

  <rect x="156" y="94" width="216" height="72" rx="10" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,4" filter="url(#rough2)"/>
  <text x="156" y="86" font-size="10.5" fill="#4a7a3a">合法窗口：窗口内 0 的个数 ≤ 1，可一次翻转</text>

  <path d="M 186 198 L 186 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="186" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a">left = 2</text>
  <path d="M 342 198 L 342 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <text x="342" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a">right = 5</text>
  <text x="280" y="228" text-anchor="middle" font-size="9.5" fill="#b85450">窗口长度 4，其中被翻的 0 恰好 1 个</text>

  <text x="280" y="254" text-anchor="middle" font-size="10.5" fill="#555">窗口 [2,5] 内只有下标 4 这一个 0，翻转它 ⇒ 1111，长度 4</text>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#555">反之，任何「翻一个 0 换来的连续 1」都落在某个「0 的个数 ≤ 1」的窗口里</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">所以答案 = 所有「至多含一个 0」的窗口的最大长度</text>
</svg>
