<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐行裁剪入池 → 池排序 → 取前 k 个</text>

  <!-- 开始 -->
  <rect x="150" y="36" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">开始：pool ← 空，i ← 0</text>
  <path d="M 260 66 L 260 86" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形：i < n ? -->
  <polygon points="260,88 328,114 260,140 192,114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">i &lt; n ?</text>
  <text x="270" y="158" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="336" y="106" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 循环体 -->
  <path d="M 260 140 L 260 168" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="165" y="170" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">第 i 行 grid[i] 降序排序</text>

  <path d="M 260 200 L 260 220" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="148" y="222" width="224" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">取前 limits[i] 个加入 pool</text>

  <path d="M 260 252 L 260 272" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="205" y="274" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回边 -->
  <path d="M 205 288 L 118 288 L 118 114 L 190 114" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="110" y="210" font-size="9.5" fill="#557a4a" filter="url(#rough2)">循</text>
  <text x="110" y="224" font-size="9.5" fill="#557a4a" filter="url(#rough2)">环</text>

  <!-- 否：右链 -->
  <path d="M 328 114 L 364 114" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="368" y="99" width="142" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="439" y="119" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">pool 降序排序</text>

  <path d="M 439 129 L 439 150" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="368" y="152" width="142" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="439" y="172" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">ans ← pool 前 k 个之和</text>
  <text x="439" y="190" text-anchor="middle" font-size="10" fill="#9a7d33" filter="url(#rough2)">（必须 long long）</text>

  <path d="M 439 198 L 439 220" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <ellipse cx="439" cy="240" rx="58" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="439" y="245" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">返回 ans</text>

  <text x="260" y="345" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">左循环：行排序 O(nm log m)；右链：池排序 O(S log S)，S = Σ limits[i] ≤ n·m</text>
</svg>
