<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：只能向右跳 ⇒ DAG，最大跳跃次数 = 最长路径</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- gray edges (other valid jumps, target=2) -->
  <g filter="url(#sk)">
    <path d="M 75 194 Q 285 112 495 194" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-end="url(#arG)"/>
    <path d="M 75 192 Q 337 82 600 192" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-end="url(#arG)"/>
    <path d="M 180 192 Q 337 132 495 192" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-end="url(#arG)"/>
    <path d="M 180 190 Q 390 102 600 190" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-end="url(#arG)"/>
    <path d="M 285 196 Q 337 176 390 196" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-dasharray="4 3" marker-end="url(#arG)"/>
    <path d="M 495 196 Q 547 174 600 196" stroke="#c9c9c9" stroke-width="1.2" fill="none" marker-end="url(#arG)"/>
  </g>

  <!-- red edges: longest path 0->1->3->5 -->
  <g filter="url(#sk)">
    <path d="M 75 196 Q 127 172 180 196" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
    <path d="M 180 194 Q 285 162 390 194" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
    <path d="M 390 194 Q 495 162 600 194" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  </g>

  <!-- nodes: index circles -->
  <g filter="url(#sk)"><circle cx="75" cy="210" r="17" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="75" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><circle cx="180" cy="210" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="180" y="215" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><circle cx="285" cy="210" r="17" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.6" stroke-dasharray="4 3"/></g>
  <text x="285" y="215" text-anchor="middle" font-size="13" fill="#999999">2</text>
  <g filter="url(#sk)"><circle cx="390" cy="210" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="390" y="215" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><circle cx="495" cy="210" r="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="495" y="215" text-anchor="middle" font-size="13" fill="#2b6e9e">4</text>
  <g filter="url(#sk)"><circle cx="600" cy="210" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="600" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">5</text>

  <!-- values under nodes -->
  <text x="30" y="215" font-size="11" fill="#888">nums:</text>
  <text x="75" y="248" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="285" y="248" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="390" y="248" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="495" y="248" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="600" y="248" text-anchor="middle" font-size="11" fill="#666">2</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <line x1="60" y1="282" x2="98" y2="282" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="106" y="286" font-size="11" fill="#444">最长路径 0→1→3→5（3 跳）</text>
  <g filter="url(#sk)">
    <line x1="330" y1="282" x2="362" y2="282" stroke="#c9c9c9" stroke-width="1.4"/>
  </g>
  <text x="370" y="286" font-size="11" fill="#444">其他可跳边</text>
  <g filter="url(#sk)">
    <circle cx="492" cy="282" r="8" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="3 2"/>
  </g>
  <text x="506" y="286" font-size="11" fill="#444">不可达（dp = −1）</text>

  <!-- insight box A -->
  <g filter="url(#sk)">
    <rect x="30" y="312" width="300" height="104" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="180" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① i &lt; j ⇒ 边只朝右</text>
  <text x="180" y="362" text-anchor="middle" font-size="11" fill="#555">每次跳跃下标严格增大 ⇒ 图中无环（DAG）</text>
  <text x="180" y="382" text-anchor="middle" font-size="11" fill="#555">无后效性 ⇒ 每个下标只需算一次</text>
  <text x="180" y="402" text-anchor="middle" font-size="11" fill="#555">按下标从小到大即拓扑序</text>

  <!-- insight box B -->
  <g filter="url(#sk)">
    <rect x="350" y="312" width="300" height="104" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="500" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 最大跳跃次数 = 最长路径</text>
  <text x="500" y="362" text-anchor="middle" font-size="11" fill="#555">即从 0 到 n−1 的最长路径边数</text>
  <text x="500" y="382" text-anchor="middle" font-size="11" fill="#555">dp[i] = max(dp[j] + 1)</text>
  <text x="500" y="402" text-anchor="middle" font-size="11" fill="#555">与最长递增子序列 LIS 同构</text>
</svg>
