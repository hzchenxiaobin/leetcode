<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从右往左回推：perm[i] = perm[i+1] ⊕ encoded[i]（示例 encoded = [6,5,4,6]）</text>

  <!-- perm 行 -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="60" y="80" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="90" y="108">2</text>
    <rect x="150" y="80" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="180" y="108">4</text>
    <rect x="240" y="80" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="270" y="108">1</text>
    <rect x="330" y="80" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="360" y="108">5</text>
    <rect x="420" y="80" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="450" y="108">3</text>
  </g>
  <text x="90" y="150" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">perm[0]</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">perm[4]，已知</text>

  <!-- encoded 行 + 回推箭头 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <path d="M420,120 Q360,180 300,124" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <text x="360" y="176" fill="#b85450">e[3]=6：5 = 3 ⊕ 6</text>
    <path d="M330,120 Q270,212 210,124" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <text x="270" y="208" fill="#b85450">e[2]=4：1 = 5 ⊕ 4</text>
    <path d="M240,120 Q180,244 120,124" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <text x="180" y="240" fill="#b85450">e[1]=5：4 = 1 ⊕ 5</text>
    <path d="M150,120 Q90,276 30,110" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <text x="70" y="270" fill="#b85450">e[0]=6：2 = 4 ⊕ 6</text>
  </g>

  <rect x="150" y="290" width="220" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">perm = [2, 4, 1, 5, 3] ✓</text>

  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">异或的自反性：a ⊕ b ⊕ b = a，因此知道相邻异或与其中一边就能还原另一边</text>
</svg>
