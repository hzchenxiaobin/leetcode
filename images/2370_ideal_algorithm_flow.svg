<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="600" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍扫描，邻域取最大 + 1</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="240" y="52" width="200" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">开始：读入 s 与 k</text>
  <g filter="url(#sk)"><path d="M 340 86 L 340 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <!-- init -->
  <g filter="url(#sk)"><rect x="220" y="106" width="240" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="340" y="130" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">dp[0..25] ← 0，ans ← 0</text>
  <g filter="url(#sk)"><path d="M 340 144 L 340 164" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <!-- main loop container -->
  <g filter="url(#sk)"><rect x="56" y="168" width="380" height="340" rx="12" fill="#fbfaf5" stroke="#999" stroke-width="1.3" stroke-dasharray="7,5"/></g>
  <text x="246" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#777" filter="url(#sk)">对 s 中每个字符 ch（从左到右，仅一遍）</text>

  <g filter="url(#sk)"><rect x="146" y="202" width="200" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="246" y="224" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">ci ← ch − 'a'</text>
  <g filter="url(#sk)"><path d="M 246 236 L 246 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="76" y="252" width="340" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="246" y="274" text-anchor="middle" font-size="12" fill="#a06a10" filter="url(#sk)">lo ← max(0, ci−k)，hi ← min(25, ci+k)（夹断）</text>
  <g filter="url(#sk)"><path d="M 246 286 L 246 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="76" y="302" width="340" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="246" y="324" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">best ← max(dp[lo..hi])（读写入前的旧值）</text>
  <g filter="url(#sk)"><path d="M 246 336 L 246 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="121" y="352" width="250" height="34" rx="8" fill="#fbe3b3" stroke="#d6a040" stroke-width="2"/></g>
  <text x="246" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">dp[ci] ← best + 1</text>
  <g filter="url(#sk)"><path d="M 246 386 L 246 400" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <g filter="url(#sk)"><rect x="111" y="402" width="270" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="246" y="424" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">ans ← max(ans, dp[ci])</text>

  <!-- loopback -->
  <g filter="url(#sk)"><path d="M 246 436 L 246 470 L 78 470 L 78 219 L 142 219" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#ar)"/></g>
  <text x="160" y="464" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">取下一个字符</text>

  <!-- exit -->
  <g filter="url(#sk)"><path d="M 246 508 L 246 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/></g>

  <!-- return -->
  <g filter="url(#sk)"><rect x="126" y="530" width="240" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="246" y="557" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10" filter="url(#sk)">返回 ans</text>

  <!-- side notes -->
  <g filter="url(#sk)"><rect x="470" y="168" width="186" height="340" rx="10" fill="#f6f3ea" stroke="#b8a878" stroke-width="1.5"/></g>
  <text x="563" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#sk)">实现要点</text>
  <text x="563" y="218" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">先读后写：best 读的是</text>
  <text x="563" y="234" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">写入前的 dp（含 dp[ci] 旧值）</text>
  <text x="563" y="260" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">邻域含 ci 自身</text>
  <text x="563" y="276" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">⇒ 新值恒大于旧值</text>
  <text x="563" y="292" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">⇒ 直接覆盖即提升</text>
  <text x="563" y="318" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">夹断防越界：C++ 负下标</text>
  <text x="563" y="334" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">是 UB；Python 负 lo 切片</text>
  <text x="563" y="350" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">会静默取错区间</text>
  <text x="563" y="376" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">每字符 O(2k+1) ≤ 51</text>
  <text x="563" y="392" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">总计 O(n·51) ≈ 5×10^6</text>
  <text x="563" y="418" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">ans 在每次写入时收集，</text>
  <text x="563" y="434" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#sk)">结尾无需再扫 max(dp)</text>
</svg>
