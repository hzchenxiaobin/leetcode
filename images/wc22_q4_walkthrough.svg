  <rect width="730" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="365.0" y="26.0" text-anchor="middle" font-size="14.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">示例演算：ring = "godding"，key = "godding" 的逐层 dp 表</text>
