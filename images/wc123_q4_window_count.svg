<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">右端固定时，合法的左端点是一段连续区间</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">distinct 随窗口扩大单调不减 ⇒ 左端点集合是 [left, right]，数量 right − left + 1</text>

  <rect x="60" y="80" width="60" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="90" y="108" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="128" y="80" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="158" y="108" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="196" y="80" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="226" y="108" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="264" y="80" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="294" y="108" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="332" y="80" width="60" height="44" fill="#fafafa" stroke="#bbb" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="362" y="108" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>

  <text x="90" y="142" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="158" y="142" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="226" y="142" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="294" y="142" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="362" y="142" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>

  <path d="M 158 168 L 158 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="186" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">left</text>
  <path d="M 294 168 L 294 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="294" y="186" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">right</text>

  <text x="410" y="100" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">窗口 [left, right]</text>
  <text x="410" y="118" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">distinct = 2 ≤ limit</text>

  <rect x="60" y="206" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="226" font-size="11.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">合法的 起点取值 left … right，共 right − left + 1 个</text>
  <text x="72" y="245" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">因为 distinct 只增不减，起点更靠左必然 distinct 更大，故合法起点恰好是一段后缀。</text>

  <text x="60" y="280" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">left 只会右移，总数不超过 n 次；每个元素进出窗口各一次，atMost 是严格的 O(n)。</text>
  <text x="60" y="302" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">易错：这里的 distinct 用「计数降到 0 才删除」维护，不能用 set 大小硬猜。</text>
</svg>
