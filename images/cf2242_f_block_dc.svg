<svg xmlns="http://www.w3.org/2000/svg" width="780" height="424" viewBox="0 0 780 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="424" fill="#fafafa" filter="url(#rough2)"/>
  <text x="390" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块函数：整段值域“一起加 / 一起减”，只在 a−k 处裂开</text>
  <path d="M 140 44 Q 390 49 640 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="60" width="352" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="87" text-anchor="start" font-size="13" fill="#2b3a4a" filter="url(#rough2)">不变量：区间 [L,R] 里的 x，此刻值都是 x+k</text>

  <path d="M 34 150 L 366 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="168" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="340" y="168" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">2n</text>
  <rect x="40" y="114" width="160" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#2f4d24" filter="url(#rough2)">x + k &lt; a</text>
  <rect x="202" y="114" width="160" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="132" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">x + k ≥ a</text>
  <path d="M 201 140 L 201 148" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="201" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">分裂点 mid = a − k</text>

  <rect x="400" y="60" width="352" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="87" text-anchor="start" font-size="13" fill="#2f4d24" filter="url(#rough2)">R + k &lt; a：整段工作，k ← k + a</text>
  <rect x="400" y="112" width="352" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="139" text-anchor="start" font-size="13" fill="#6b4e12" filter="url(#rough2)">L + k ≥ a：整段休息，k ← k − a</text>
  <rect x="400" y="164" width="352" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="191" text-anchor="start" font-size="13" fill="#7a2f2c" filter="url(#rough2)">否则在 mid 处一分为二，两个子区间继续</text>

  <text x="30" y="222" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">分治树（深度 = 块长 B）：</text>
  <rect x="320" y="236" width="120" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="258" text-anchor="middle" font-size="12" fill="#2b3a4a" filter="url(#rough2)">[0, 2n]，偏移 k</text>
  <path d="M 350 270 L 300 292" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 270 L 460 292" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="294" width="96" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="248" y="315" text-anchor="middle" font-size="12" fill="#2f4d24" filter="url(#rough2)">左半段</text>
  <rect x="464" y="294" width="96" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="512" y="315" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">右半段</text>
  <path d="M 230 326 L 186 344" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 266 326 L 290 344" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 494 326 L 450 344" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 530 326 L 554 344" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="346" width="88" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="144" y="365" text-anchor="middle" font-size="11" fill="#2f4d24" filter="url(#rough2)">x ↦ x+k₁</text>
  <rect x="246" y="346" width="88" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="365" text-anchor="middle" font-size="11" fill="#2f4d24" filter="url(#rough2)">x ↦ x+k₂</text>
  <rect x="408" y="346" width="88" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="452" y="365" text-anchor="middle" font-size="11" fill="#6b4e12" filter="url(#rough2)">x ↦ x+k₃</text>
  <rect x="554" y="346" width="88" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="598" y="365" text-anchor="middle" font-size="11" fill="#6b4e12" filter="url(#rough2)">x ↦ x+k₄</text>
  <text x="668" y="290" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">叶子最多</text>
  <text x="668" y="312" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">2^B 个</text>

  <rect x="30" y="384" width="722" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="404" text-anchor="start" font-size="12" fill="#7a2f2c" filter="url(#rough2)">每天最多劈一次 ⇒ 块函数 ≤ 2^B 段、O(2^B) 填表；B ≈ log₂n 时两块代价同阶。</text>
</svg>
