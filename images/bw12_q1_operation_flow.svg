<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：三操作与哈希表的交互</text>

  <g filter="url(#rough2)">
    <rect x="20" y="60" width="150" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="20" y="152" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="20" y="244" width="150" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="95" y="84" fill="#3a4a66" font-weight="bold">addScore(p, s)</text>
    <text x="95" y="102" fill="#666" font-size="10">累加，不是覆盖</text>
    <text x="95" y="118" fill="#777" font-size="10">首次入榜从 0 起加</text>
    <text x="95" y="176" fill="#3a5a30" font-weight="bold">top(K)</text>
    <text x="95" y="194" fill="#666" font-size="10">倒出 values</text>
    <text x="95" y="210" fill="#777" font-size="10">部分排序取前 K 求和</text>
    <text x="95" y="268" fill="#8a3a36" font-weight="bold">reset(p)</text>
    <text x="95" y="286" fill="#666" font-size="10">置 0，保留键</text>
    <text x="95" y="302" fill="#777" font-size="10">0 分不影响 top 之和</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="260" y="140" width="150" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="335" y="168" fill="#8a6a20" font-weight="bold">scores = {}</text>
    <text x="335" y="188" fill="#666" font-size="10.5">playerId → 当前累计分</text>
    <text x="335" y="206" fill="#777" font-size="10">唯一状态，O(1) 定位</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 170 91 L 256 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 258 172 L 172 180" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <path d="M 170 275 L 256 208" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>
  <text x="215" y="70" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">scores[p] += s</text>
  <text x="205" y="200" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">读 values</text>
  <text x="215" y="292" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">scores[p] = 0</text>

  <g filter="url(#rough2)">
    <rect x="360" y="240" width="160" height="66" fill="#fff" stroke="#666" stroke-width="1.3" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="440" y="262" fill="#555" font-weight="bold">对照重量级方案</text>
    <text x="440" y="278" fill="#777">哈希 + multiset 同步维护</text>
    <text x="440" y="294" fill="#777">top O(K+log m)，更新 O(log m)</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 410 240 L 335 222" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none"/>
  </g>
  <text x="440" y="228" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1000 次调用下收益买不回复杂度</text>
</svg>
