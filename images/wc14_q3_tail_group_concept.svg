<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">分组由「右端」唯一确定，与总长无关</text>
  <text x="280" y="52" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">清洗并大写后 n = 7，取 k = 3：n mod k = 1，故最左一组只有 1 个字符</text>

  <rect x="88" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">A</text>
  <rect x="142" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">B</text>
  <rect x="196" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="250" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="304" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">C</text>
  <rect x="358" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="384" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">D</text>
  <rect x="412" y="70" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="438" y="94" font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">9</text>

  <rect x="88" y="110" width="52" height="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="110" width="104" height="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="304" y="110" width="160" height="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <text x="114" y="136" font-size="10" fill="#b85450" text-anchor="middle" filter="url(#rough2)">组 1（1 个）</text>
  <text x="194" y="136" font-size="10" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">组 2（3 个）</text>
  <text x="384" y="136" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">组 3（3 个）</text>

  <path d="M 462 178 L 96 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 438 160 L 438 174" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="157" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">起点在右端</text>
  <text x="280" y="198" font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">每数满 k 个字符就落一个 '-'，一直向左推到串首，余下的前缀自然成短组</text>

  <rect x="28" y="222" width="504" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="44" y="246" font-size="12" fill="#8a3b37" text-anchor="start" font-weight="bold" filter="url(#rough2)">✗ 从左按 k 切：AB1 - 2CD - 9</text>
  <text x="44" y="268" font-size="10.5" fill="#8a3b37" text-anchor="start" filter="url(#rough2)">余数被挤到最右组，末组只剩 1 个字符，违反「只有首组可短」；</text>
  <text x="44" y="284" font-size="10.5" fill="#8a3b37" text-anchor="start" filter="url(#rough2)">想修正就得把破折号整体右移，最坏退化成 O(n²/k) 的逐位搬移。</text>

  <rect x="28" y="302" width="504" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="44" y="326" font-size="12" fill="#3c6630" text-anchor="start" font-weight="bold" filter="url(#rough2)">✓ 从右按 k 切：A - B12 - CD9</text>
  <text x="44" y="348" font-size="10.5" fill="#3c6630" text-anchor="start" filter="url(#rough2)">余数 r = n mod k = 1 恰好留在最左组，形状唯一，一趟扫描即可定稿；</text>
  <text x="44" y="364" font-size="10.5" fill="#3c6630" text-anchor="start" filter="url(#rough2)">r = 0 时首组也正好 k 个，无需任何特判。</text>
</svg>
