<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：例 2 的逐 T 表格 + 「抬升解锁批发」反例</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">例 2 nums=[2,3,3,3,5]，c₁=2，c₂=1：n=5，Σ=16，mn=2，mx=5</text>

  <!-- table -->
  <g filter="url(#rough2)">
    <rect x="30" y="60" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="80" y="60" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="156" y="60" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="218" y="60" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="272" y="60" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="334" y="60" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="378" y="60" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="444" y="60" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="55" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">T</text>
    <text x="118" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">S=5T−16</text>
    <text x="187" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">d=T−2</text>
    <text x="245" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">S−d</text>
    <text x="303" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">⌊S/2⌋</text>
    <text x="356" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">p</text>
    <text x="411" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">零售</text>
    <text x="477" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">C(T)</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)">
    <rect x="30" y="88" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="30" y="116" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="30" y="144" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="30" y="172" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="55" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">5</text>
    <text x="118" y="105" text-anchor="middle" font-size="11.5" fill="#333">9</text>
    <text x="187" y="105" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <text x="245" y="105" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="303" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">4</text>
    <text x="356" y="105" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="411" y="105" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <text x="477" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">6</text>
    <text x="55" y="133" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="118" y="133" text-anchor="middle" font-size="11.5" fill="#333">14</text>
    <text x="187" y="133" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <text x="245" y="133" text-anchor="middle" font-size="11.5" fill="#333">10</text>
    <text x="303" y="133" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="356" y="133" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="411" y="133" text-anchor="middle" font-size="11.5" fill="#333">0</text>
    <text x="477" y="133" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="55" y="161" text-anchor="middle" font-size="11.5" fill="#333">7</text>
    <text x="118" y="161" text-anchor="middle" font-size="11.5" fill="#333">19</text>
    <text x="187" y="161" text-anchor="middle" font-size="11.5" fill="#333">5</text>
    <text x="245" y="161" text-anchor="middle" font-size="11.5" fill="#333">14</text>
    <text x="303" y="161" text-anchor="middle" font-size="11.5" fill="#333">9</text>
    <text x="356" y="161" text-anchor="middle" font-size="11.5" fill="#333">9</text>
    <text x="411" y="161" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <text x="477" y="161" text-anchor="middle" font-size="11.5" fill="#333">11</text>
    <text x="55" y="189" text-anchor="middle" font-size="11.5" fill="#333">8</text>
    <text x="118" y="189" text-anchor="middle" font-size="11.5" fill="#333">24</text>
    <text x="187" y="189" text-anchor="middle" font-size="11.5" fill="#333">6</text>
    <text x="245" y="189" text-anchor="middle" font-size="11.5" fill="#333">18</text>
    <text x="303" y="189" text-anchor="middle" font-size="11.5" fill="#333">12</text>
    <text x="356" y="189" text-anchor="middle" font-size="11.5" fill="#333">12</text>
    <text x="411" y="189" text-anchor="middle" font-size="11.5" fill="#333">0</text>
    <text x="477" y="189" text-anchor="middle" font-size="11.5" fill="#333">12</text>
  </g>
  <text x="270" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">全程 ⌊S/2⌋ ≤ S−d（总量瓶颈主导），越抬越贵 → 谷底就在 T = mx，ans = 6 ✓</text>

  <!-- lift counterexample -->
  <text x="270" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">抬升反例 nums=[1,5,5,5]，c₁=100，c₂=1（n=4，Σ=16，mn=1，mx=5，T*=7）</text>

  <g filter="url(#rough2)">
    <rect x="30" y="258" width="225" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <rect x="300" y="258" width="210" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="142" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">T = 5：独裁</text>
    <text x="142" y="300" text-anchor="middle" font-size="11" fill="#333">缺口 [4,0,0,0]，S=4，d=4</text>
    <text x="142" y="318" text-anchor="middle" font-size="11" fill="#333">S−d = 0 → p = 0</text>
    <text x="142" y="338" text-anchor="middle" font-size="11.5" fill="#333">全零售 C = 4×100 = <tspan font-weight="bold" fill="#b85450">400</tspan></text>
    <text x="405" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">T* = 7：解锁</text>
    <text x="405" y="300" text-anchor="middle" font-size="11" fill="#333">缺口 [6,2,2,2]，S=12，d=6</text>
    <text x="405" y="318" text-anchor="middle" font-size="11" fill="#333">S−d = 6 = ⌊S/2⌋ → p = 6</text>
    <text x="405" y="338" text-anchor="middle" font-size="11.5" fill="#333">批发全配对 C = 6×1 = <tspan font-weight="bold" fill="#4a7a3a">6</tspan></text>
  </g>
  <path d="M260,304 L295,304" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">抬 2 格</text>

  <g filter="url(#rough2)">
    <text x="270" y="372" text-anchor="middle" font-size="10.5" fill="#555">批发必须落在「两个不同」元素——缺口全堆在一个元素时一次也做不了；</text>
    <text x="270" y="388" text-anchor="middle" font-size="10.5" fill="#555">抬 T 让三个原本到站的元素重新「捐出」缺口，以每格 n−1=3 的速度稀释独裁，400 → 6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="402" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="270" y="424" text-anchor="middle" font-size="12" fill="#333">候选 {5, 6, 7, 8} = {mx, T*−1, T*, T*+1}，在 T* = 7 命中最优 6</text>
    <text x="270" y="442" text-anchor="middle" font-size="10.5" fill="#555">C(T) 是「先线性、后逐奇偶递增」的 V 形——谷底不一定在 mx，但一定在候选集里</text>
  </g>
</svg>
