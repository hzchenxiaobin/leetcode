<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">把 n 个方程两边全部异或：右边成对抵消</text>
  <text x="280" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">以 n = 4 为例</text>

  <!-- 方程组 -->
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">derived[0] = o0 ⊕ o1</text>
  <text x="280" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">derived[1] = o1 ⊕ o2</text>
  <text x="280" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">derived[2] = o2 ⊕ o3</text>
  <text x="280" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">derived[3] = o3 ⊕ o0（环回边）</text>
  <text x="280" y="166" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">把右边全部摊开（2n = 8 项）</text>

  <!-- 摊开的项：o0 o1 o1 o2 o2 o3 o3 o0 -->
  <rect x="76" y="178" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="94" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">o0</text>
  <rect x="120" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o1</text>
  <rect x="164" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o1</text>
  <rect x="208" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o2</text>
  <rect x="252" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o2</text>
  <rect x="296" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o3</text>
  <rect x="340" y="178" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="358" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o3</text>
  <rect x="384" y="178" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="402" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">o0</text>

  <!-- 相邻配对的花括号 -->
  <path d="M120,212 C136,226 184,226 200,212" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="160" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">o1 ⊕ o1 = 0</text>
  <path d="M208,212 C224,226 272,226 288,212" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="248" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">o2 ⊕ o2 = 0</text>
  <path d="M296,212 C312,226 360,226 376,212" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="336" y="238" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">o3 ⊕ o3 = 0</text>

  <!-- 首尾两个 o0 的配对弧线 -->
  <path d="M94,212 C120,288 376,288 402,212" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="248" y="296" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首尾两个 o0 也各出现一次，同样配对抵消</text>

  <!-- 必要条件 -->
  <rect x="50" y="312" width="460" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2n 项 → n 对，每对异或为 0 ⟹ ⊕ derived[i] ≡ 0（必要条件）</text>

  <!-- 充分性 -->
  <rect x="50" y="368" width="460" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">反过来若 ⊕ derived[i] = 0：令 o0 = 0，递推 o[i+1] = o[i] ⊕ derived[i]</text>
  <text x="280" y="410" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">环回方程恰好闭合 ⟹ 条件充分，二者等价</text>
</svg>
