<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">安全 ⟺ 从该点出发走不到任何环</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">示例 1：graph = [[1,2],[2,3],[5],[0],[5],[],[]]，环 {0,1,3} 是「不安全」的源头</text>

  <!-- 边 -->
  <path d="M 138 110 L 250 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 136 96 Q 270 50 408 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 288 110 L 400 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 130 L 270 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 240 Q 160 226 124 132" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 124 L 460 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 372 288 L 452 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 不安全：环 0,1,3 -->
  <circle cx="120" cy="110" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" fill="#8a3a36">0</text>
  <circle cx="270" cy="110" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
  <circle cx="270" cy="240" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="245" text-anchor="middle" font-size="13" fill="#8a3a36">3</text>
  <text x="212" y="182" text-anchor="middle" font-size="12" fill="#b85450">有环</text>

  <!-- 安全：2,4,5,6 -->
  <circle cx="420" cy="110" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="115" text-anchor="middle" font-size="13" fill="#3a5a30">2</text>
  <circle cx="470" cy="215" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="220" text-anchor="middle" font-size="13" fill="#3a5a30">5</text>
  <circle cx="470" cy="310" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="315" text-anchor="middle" font-size="13" fill="#3a5a30">6</text>
  <circle cx="360" cy="300" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="305" text-anchor="middle" font-size="13" fill="#3a5a30">4</text>

  <text x="540" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a">终端</text>
  <text x="540" y="315" text-anchor="middle" font-size="10" fill="#4a7a3a">终端</text>
  <text x="330" y="342" text-anchor="middle" font-size="10" fill="#4a7a3a">4 与 2 的出边全部指向安全点</text>

  <!-- 图例 -->
  <rect x="24" y="150" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="44" y="162" font-size="10.5" fill="#3a5a30">安全</text>
  <rect x="24" y="184" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="44" y="196" font-size="10.5" fill="#8a3a36">不安全</text>

  <text x="300" y="368" text-anchor="middle" font-size="10" fill="#999">环上的点出度永远清不到 0，因此永远进不了「安全」集合</text>
</svg>
