<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">离线交换：房间按面积降序入库，查询按 minSize 降序发问</text>

  <!-- rooms 列表 -->
  <text x="115" y="60" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">rooms 按 size 降序</text>
  <g filter="url(#rough2)">
    <rect x="40" y="72" width="150" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="104" width="150" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="136" width="150" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="168" width="150" height="30" fill="#f4f4f4" stroke="#ddd" stroke-width="1" rx="4"/>
    <rect x="40" y="200" width="150" height="30" fill="#f4f4f4" stroke="#ddd" stroke-width="1" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="52" y="92">id=3 · size=5</text>
    <text x="52" y="124">id=1 · size=4</text>
    <text x="52" y="156">id=2 · size=3</text>
    <text x="52" y="188" fill="#aaa">id=5 · size=2</text>
    <text x="52" y="220" fill="#aaa">id=4 · size=1</text>
  </g>
  <text x="115" y="248" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">后两个面积太小，本次查询用不上</text>

  <!-- 中间：有序集合快照 -->
  <text x="300" y="60" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ids 有序集合（逐步增长）</text>
  <g filter="url(#rough2)">
    <rect x="215" y="72" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="215" y="136" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="215" y="200" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="300" y="92">{ 3 }</text>
    <text x="300" y="156">{ 1, 3 }</text>
    <text x="300" y="220">{ 1, 2, 3 }</text>
  </g>

  <!-- queries 列表 -->
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">queries 按 minSize 降序</text>
  <g filter="url(#rough2)">
    <rect x="400" y="72" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="400" y="136" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="400" y="200" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">
    <text x="460" y="92">[pref=2, min=5]</text>
    <text x="460" y="156">[pref=2, min=4]</text>
    <text x="460" y="220">[pref=2, min=3]</text>
  </g>

  <!-- 箭头：房间入库、集合回答查询 -->
  <g filter="url(#rough2)">
    <path d="M 192 87 L 211 87" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 192 119 L 211 145" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 192 151 L 211 209" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 387 87 L 396 87" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 387 151 L 396 151" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 387 215 L 396 215" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 底部说明 -->
  <rect x="40" y="280" width="235" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="304" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">minSize 从大到小回答：</text>
  <text x="56" y="322" font-size="11" fill="#3a4a66" filter="url(#rough2)">回答前把所有"面积 ≥ minSize"</text>
  <text x="56" y="338" font-size="11" fill="#3a4a66" filter="url(#rough2)">的房间恰好全部入库，候选集正确。</text>

  <rect x="285" y="280" width="235" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="301" y="304" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">双指针：房间指针 i 只前进，</text>
  <text x="301" y="322" font-size="11" fill="#2f5226" filter="url(#rough2)">每个房间至多入库一次；</text>
  <text x="301" y="338" font-size="11" fill="#2f5226" filter="url(#rough2)">每个查询一次前驱后继查询 O(log n)。</text>

  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">离线的关键收益：把"每个查询都要动态筛选房间"变成"按 minSize 单调推进的一次扫描"</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">答案要按查询原下标回填，注意先记录 order 再重排查询</text>
</svg>
