<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：因子封闭 + 前缀 lcm 单调不减</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- k badge -->
  <g filter="url(#sk)"><rect x="545" y="56" width="66" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="578" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5f14" font-family="monospace">k = 6</text>

  <!-- panel 1: factor closure -->
  <text x="60" y="74" font-size="13" font-weight="bold" fill="#2b5a94">性质一（因子封闭）：合法子数组的每个元素都整除 k —— 非因子一票否决</text>
  <g filter="url(#sk)"><rect x="130" y="88" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="158" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">3</text>
  <g filter="url(#sk)"><rect x="206" y="88" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="234" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">6</text>
  <g filter="url(#sk)"><rect x="282" y="88" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="310" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">2</text>
  <g filter="url(#sk)"><rect x="358" y="88" width="56" height="44" rx="6" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="386" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a" font-family="monospace">7</text>
  <g filter="url(#sk)"><rect x="434" y="88" width="56" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="462" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5a94" font-family="monospace">1</text>
  <text x="158" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="234" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="310" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="386" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="462" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="386" y="170" text-anchor="middle" font-size="10" fill="#b85450">break！</text>
  <text x="505" y="106" font-size="11" fill="#b03a3a">含 7 的任何子数组</text>
  <text x="505" y="122" font-size="11" fill="#b03a3a">lcm 必 ≠ 6 → 截停</text>

  <!-- panel 2: monotone climb -->
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#8a5f14">性质二（单调不减）：前缀 lcm 只在 k 的因子里爬升，永不超过 k</text>

  <!-- ceiling -->
  <path d="M 70 232 L 430 232" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="250" y="224" text-anchor="middle" font-size="11" fill="#a5844a">天花板：k = 6</text>

  <!-- level labels -->
  <text x="62" y="236" text-anchor="end" font-size="11" fill="#888" font-family="monospace">6</text>
  <text x="62" y="278" text-anchor="end" font-size="11" fill="#888" font-family="monospace">3</text>
  <text x="62" y="306" text-anchor="end" font-size="11" fill="#888" font-family="monospace">1</text>

  <!-- staircase (start i=0): 1 -> 3 -> 6 -> 6 -->
  <path d="M 80 302 L 140 302 L 148 274 L 220 274 L 228 232 L 380 232" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <!-- hit dots -->
  <g filter="url(#sk)"><circle cx="285" cy="232" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><circle cx="345" cy="232" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="283" y="256" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">✓ [3,6]</text>
  <text x="348" y="256" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">✓ [3,6,2]</text>
  <!-- element ticks -->
  <text x="160" y="322" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">+3</text>
  <text x="240" y="322" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">+6</text>
  <text x="315" y="322" text-anchor="middle" font-size="10" fill="#888" font-family="monospace">+2（因子，lcm 不变）</text>
  <!-- break mark -->
  <text x="396" y="236" font-size="13" font-weight="bold" fill="#b03a3a">✗</text>
  <text x="396" y="254" font-size="10" fill="#b85450">遇 7 截停</text>

  <!-- invariant box -->
  <g filter="url(#sk)"><rect x="452" y="262" width="168" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="536" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a5f14">只收 k 的因子 ⇒</text>
  <text x="536" y="299" text-anchor="middle" font-size="11" fill="#8a5f14" font-family="monospace">l | k 恒成立</text>
  <text x="536" y="316" text-anchor="middle" font-size="11" fill="#8a5f14" font-family="monospace">l ≤ k ≤ 1000</text>
  <text x="536" y="333" text-anchor="middle" font-size="10" fill="#a5844a">C++ int 永不溢出</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="60" y="360" width="520" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">先判 k % nums[j] 再更新 l：一石二鸟</text>
  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#888">既剪枝（非因子即停），又保住 l | k —— 免去 l &gt; k 判断与溢出风险</text>
</svg>
