<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n ≤ 5：一行压成一个 ≤ 5 位的掩码，配对判相交</text>

  <!-- 行 → 掩码 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="120" y="58" fill="#444">第 0 行：0 1 1 0</text>
    <rect x="62" y="70" width="34" height="30" rx="3" fill="#eef0f2" stroke="#999" stroke-width="1.3"/>
    <text x="79" y="90" fill="#777">0</text>
    <rect x="96" y="70" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="113" y="90" fill="#2f4a66">1</text>
    <rect x="130" y="70" width="34" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="147" y="90" fill="#2f4a66">1</text>
    <rect x="164" y="70" width="34" height="30" rx="3" fill="#eef0f2" stroke="#999" stroke-width="1.3"/>
    <text x="181" y="90" fill="#777">0</text>
    <path d="M216 85 L256 85" stroke="#666" stroke-width="1.6" fill="none"/>
    <text x="240" y="76" font-size="10.5" fill="#666">压位</text>
    <rect x="262" y="70" width="130" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="327" y="90" fill="#7a5a10">mask = 0110 (6)</text>
  </g>

  <!-- 与运算成功 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="52" y="140" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="107" y="163" fill="#2f4a66">a = 0110</text>
    <rect x="180" y="140" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="235" y="163" fill="#2f5527">b = 0001</text>
    <text x="320" y="163" fill="#444">a &amp; b =</text>
    <rect x="372" y="140" width="96" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="420" y="163" fill="#2f5527">0000 ✓</text>
  </g>
  <text x="260" y="200" text-anchor="middle" font-size="11.5" fill="#2f5527" filter="url(#rough2)">每一列都不同时为 1 → 这两行组成大小 2 的好子集</text>

  <!-- 与运算失败 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="52" y="222" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="107" y="245" fill="#2f4a66">a = 0110</text>
    <rect x="180" y="222" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="235" y="245" fill="#8c3a36">c = 1111</text>
    <text x="320" y="245" fill="#444">a &amp; c =</text>
    <rect x="372" y="222" width="96" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="420" y="245" fill="#8c3a36">0110 ✗</text>
  </g>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">中间两列同时为 1，列和 = 2 &gt; ⌊2/2⌋，不合格</text>

  <rect x="40" y="298" width="440" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#7a5a10">
    <text x="58" y="316">掩码种类 ≤ 2⁵ = 32 种：记录每种掩码首次出现的行号 first[]，</text>
    <text x="58" y="334">再两两枚举掩码对 (a, b) 判 a &amp; b == 0 —— 与行数 m = 10⁴ 无关！</text>
  </g>
</svg>
