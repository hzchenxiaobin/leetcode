<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="42"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算走查：word = "zjpc"（示例 3，答案 34）</text>

  <!-- 起点指针 -->
  <rect x="30" y="52" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="75" text-anchor="middle" font-size="13" fill="#33506e" font-weight="bold" filter="url(#rough2)">指针初始 → 'a'</text>

  <!-- 步骤表 -->
  <g filter="url(#rough2)">
    <rect x="30" y="106" width="500" height="34" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="90" y="128">目标字符</text>
    <text x="230" y="128">下标差 d</text>
    <text x="360" y="128">移动步数 min(d,26−d)</text>
    <text x="480" y="128">键入</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="140" width="500" height="32" fill="#e8f0fe" rx="4"/>
    <rect x="30" y="172" width="500" height="32" fill="#f4f8ff" rx="4"/>
    <rect x="30" y="204" width="500" height="32" fill="#e8f0fe" rx="4"/>
    <rect x="30" y="236" width="500" height="32" fill="#f4f8ff" rx="4"/>
    <line x1="180" y1="140" x2="180" y2="268" stroke="#c3d2e4" stroke-width="1"/>
    <line x1="300" y1="140" x2="300" y2="268" stroke="#c3d2e4" stroke-width="1"/>
    <line x1="430" y1="140" x2="430" y2="268" stroke="#c3d2e4" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="90" y="161">a → z</text><text x="230" y="161">25</text><text x="360" y="161">1</text><text x="480" y="161">1</text>
    <text x="90" y="193">z → j</text><text x="230" y="193">16</text><text x="360" y="193">10</text><text x="480" y="193">1</text>
    <text x="90" y="225">j → p</text><text x="230" y="225">6</text><text x="360" y="225">6</text><text x="480" y="225">1</text>
    <text x="90" y="257">p → c</text><text x="230" y="257">13</text><text x="360" y="257">13</text><text x="480" y="257">1</text>
  </g>

  <!-- 汇总 -->
  <path d="M 280 272 C 280 290, 280 296, 280 306" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="80" y="310" width="400" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总时间 = 4 次键入 + (1+10+6+13) 移动 = 34 秒</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">z→j：d=16，逆走 26−16=10 步更省；p→c：d=13 正好对半</text>
</svg>
