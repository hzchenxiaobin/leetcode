<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：删零映射 r(x) 的像集 = [1, n] 中的无零数</text>
  <path d="M 120 44 Q 320 52 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="63" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">r(x) = 删去 x 的十进制表示中的所有 0；以 n ≥ 205 为例</text>

  <!-- left column: x values -->
  <text x="100" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">x（1 ≤ x ≤ n）</text>
  <g filter="url(#sk)">
    <rect x="72" y="104" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="72" y="148" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="72" y="192" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="72" y="236" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="72" y="280" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="100" y="126" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <text x="100" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#sk)">7</text>
  <text x="93" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <text x="112" y="214" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="87" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <text x="100" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="113" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">5</text>
  <text x="87" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">2</text>
  <text x="100" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="113" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">5</text>

  <!-- mapping label -->
  <text x="272" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">r(x) 删零</text>
  <path d="M 236 108 Q 272 118 308 108" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>

  <!-- right pool -->
  <rect x="415" y="88" width="165" height="215" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="497" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">[1, n] 的无零数</text>
  <g filter="url(#sk)">
    <rect x="456" y="124" width="56" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="456" y="164" width="56" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="456" y="204" width="56" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="456" y="244" width="56" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="484" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">1</text>
  <text x="484" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">7</text>
  <text x="484" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">15</text>
  <text x="484" y="264" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">25</text>
  <text x="497" y="294" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">每位 ∈ {1,…,9}</text>

  <!-- arrows -->
  <path d="M 132 121 Q 300 121 452 137" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <path d="M 132 165 Q 300 168 452 177" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <path d="M 132 209 C 230 209 320 185 452 143" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="268" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">10 与 1 记同一个 1</text>
  <path d="M 132 253 Q 300 248 452 221" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <path d="M 132 297 Q 300 290 452 261" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>

  <!-- conclusion boxes -->
  <rect x="60" y="322" width="252" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="186" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">像 ⊆ 池：r(x) ≤ x ≤ n 且 r(x) 无零</text>
  <text x="186" y="364" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">删零只删不加，像逃不出池子</text>

  <rect x="330" y="322" width="252" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="456" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">池 ⊆ 像：y 无零 ⇒ r(y) = y</text>
  <text x="456" y="364" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">池里每个数都被自己打到，一个不漏</text>

  <rect x="100" y="392" width="440" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="415" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">⇒ 答案 = [1, n] 中无零数的个数（纯计数问题）</text>
</svg>
