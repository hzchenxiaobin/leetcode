<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：连锁即路径</text>

  <!-- 示例 3：链式连锁 -->
  <text x="36" y="62" font-size="12.5" fill="#666" filter="url(#rough2)">示例 3：从 0 出发</text>
  <g filter="url(#rough2)">
    <circle cx="80" cy="100" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="180" cy="100" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="280" cy="100" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="380" cy="100" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="470" cy="100" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="105">0</text><text x="180" y="105">1</text><text x="280" y="105">2</text>
    <text x="380" y="105">3</text><text x="470" y="105">4</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 103 94 C 125 88, 140 88, 158 93" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <path d="M 103 108 C 145 118, 215 118, 258 108" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <path d="M 303 100 L 357 100" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
    <path d="M 403 100 L 447 100" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrR)"/>
  </g>
  <rect x="60" y="134" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="7" filter="url(#rough2)"/>
  <text x="175" y="152" text-anchor="middle" font-size="12" fill="#2e4d24" filter="url(#rough2)">可达 {0,1,2,3,4}，计数 5 → 答案</text>

  <!-- 示例 1：单向 -->
  <text x="36" y="206" font-size="12.5" fill="#666" filter="url(#rough2)">示例 1：单向覆盖</text>
  <g filter="url(#rough2)">
    <circle cx="130" cy="248" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="330" cy="248" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="253">0</text><text x="330" y="253">1</text>
  </g>
  <path d="M 307 242 C 260 232, 190 232, 153 241" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 153 256 C 200 268, 265 268, 307 256" fill="none" stroke="#9aa5ad" stroke-width="1.8" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="232" y="288" text-anchor="middle" font-size="11.5" fill="#8b949b" filter="url(#rough2)">虚线方向无边</text>

  <rect x="60" y="306" width="420" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">从 0 出发只能引爆自己（计数 1）；从 1 出发引爆 {1, 0}（计数 2）</text>
  <text x="270" y="341" text-anchor="middle" font-size="12.5" fill="#7a3b37" filter="url(#rough2)">答案 = max(1, 2) = 2 —— 起点选择很重要！</text>
</svg>
