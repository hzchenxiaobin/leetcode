<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按「末尾连续 1 的个数 t」给 x 分段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">x = 43 = 101011₂，末尾 2 个 1（t = 2），看三行二进制如何对齐</text>

  <text x="96" y="86" text-anchor="end" font-size="11.5" fill="#3a4a66" font-weight="bold">x = 43</text>
  <rect x="112" y="68" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="68" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="86" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="192" y="68" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="86" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="232" y="68" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="86" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">0</text>
  <rect x="272" y="68" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="86" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">1</text>
  <rect x="312" y="68" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="86" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">1</text>
  <text x="366" y="86" font-size="9.5" fill="#888">bit5 … bit0</text>

  <text x="96" y="132" text-anchor="end" font-size="11.5" fill="#3a4a66" font-weight="bold">x+1 = 44</text>
  <rect x="112" y="114" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="114" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="132" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="192" y="114" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="132" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="232" y="114" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="132" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">1</text>
  <rect x="272" y="114" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="292" y="132" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="312" y="114" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="132" text-anchor="middle" font-size="12" fill="#333">0</text>

  <text x="96" y="178" text-anchor="end" font-size="11.5" fill="#8a3a36" font-weight="bold">OR = 47</text>
  <rect x="112" y="160" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="178" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="160" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="172" y="178" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="192" y="160" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="212" y="178" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="232" y="160" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="178" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">1</text>
  <rect x="272" y="160" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="292" y="178" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">1</text>
  <rect x="312" y="160" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="332" y="178" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">1</text>

  <path d="M 262 196 L 262 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="210" font-size="10" fill="#666">低 t+1 位全变 1</text>

  <rect x="36" y="220" width="488" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">x + 1：低 t 位清零、第 t 位置 1（其余高位不动）</text>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">x OR (x+1)：低 t 位又被或回 1 → 结果 = x + 2^t</text>

  <rect x="36" y="288" width="488" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#3a5a30">44 = 101100₂ 把低 2 位清零、bit2 置 1；43 OR 44 = 101111₂ = 47 = 43 + 2²</text>
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888">关键：进位只影响「末尾那一段 1」，高位原样保留</text>
</svg>
