<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">核心观察二：前导零贡献 0 —— started 状态整个省掉</text>

  <!-- ① 补零不变性 -->
  <rect x="55" y="52" width="170" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"007"（补零到 3 位）</text>
  <text x="140" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">digit_sum = 0+0+7 = 7</text>

  <text x="280" y="82" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>

  <rect x="335" y="52" width="170" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"7"（原数）</text>
  <text x="420" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">digit_sum = 7</text>

  <text x="280" y="126" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">约束对象是「数位和」→ 补零表示与原数的数位和完全相同</text>

  <!-- ② 状态简化 -->
  <text x="280" y="156" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">通用数位 DP 的四状态 → 本题三状态</text>

  <rect x="52" y="168" width="88" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pos</text>

  <rect x="152" y="168" width="88" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">tight</text>

  <rect x="252" y="168" width="96" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="300" y="189" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" text-decoration="line-through" filter="url(#rough2)">started</text>
  <path d="M 258,172 L 342,196" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="360" y="168" width="88" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sum</text>

  <text x="470" y="189" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <path d="M 280,204 L 280,224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="230" width="88" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos</text>

  <rect x="236" y="230" width="88" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tight</text>

  <rect x="352" y="230" width="88" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">sum</text>

  <!-- ③ 两个保障 -->
  <rect x="30" y="284" width="245" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① x = 0 不会误计</text>
  <text x="152" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">digit_sum(0) = 0</text>
  <text x="152" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">而 min_sum ≥ 1 → 天然排除</text>

  <rect x="285" y="284" width="245" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="407" y="306" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 位数更短 = 高位补零</text>
  <text x="407" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">补零后的值只小不小</text>
  <text x="407" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">「≤ s」的 tight 语义不受干扰</text>

  <rect x="30" y="362" width="500" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个 x ∈ [0, s] 与唯一的「L 位填数路径」一一对应，数位和相同</text>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dfs(pos, sum, tight) 三状态计数不重不漏</text>
</svg>
