<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="356" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">BFS：每一层是一次掷骰</text>
  <rect x="170" y="62" width="300" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="88.68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">队列初始：方格 1，距离 0</text>
  <rect x="170" y="130" width="300" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="156.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">弹出 cur，枚举 next ∈ [cur+1, cur+6]</text>
  <rect x="170" y="198" width="300" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="224.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dest = 有蛇梯 ? board 值 : next</text>
  <rect x="170" y="266" width="300" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="292.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dist[dest] 未访问 → 距离 +1 入队</text>
  <path d="M 320,106 L 320,130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,174 L 320,198" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 320,242 L 320,266" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第一次弹出 n² 时的距离即最少掷骰次数；队列空仍未到达则返回 −1</text>
</svg>
