<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">直觉陷阱：按数值大小排序 ✗</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: numeric descending (wrong) -->
  <g filter="url(#sk)">
    <rect x="30" y="60" width="300" height="210" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="180" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">直觉：数值大的放前面</text>
  <text x="180" y="108" text-anchor="middle" font-size="12" fill="#444">顺序 [16, 8, 2]</text>

  <g filter="url(#sk)">
    <rect x="52" y="126" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="134" y="126" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="202" y="126" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="92" y="148" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">10000</text>
  <text x="167" y="148" text-anchor="middle" font-size="13" fill="#2b4e6e" font-family="monospace">1000</text>
  <text x="220" y="148" text-anchor="middle" font-size="13" fill="#3a6a2a" font-family="monospace">10</text>
  <text x="252" y="148" font-size="10" fill="#888">(16)(8)(2)</text>

  <g filter="url(#sk)">
    <path d="M 180 170 Q 180 180 180 188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="180" y="212" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">拼接串 10000100010</text>
  <text x="180" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#b03a3a">= 1058 ✗</text>
  <text x="180" y="258" text-anchor="middle" font-size="11" fill="#b03a3a">6 个候选中最小！</text>

  <!-- Right panel: optimal -->
  <g filter="url(#sk)">
    <rect x="350" y="60" width="300" height="210" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="500" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">最优顺序（恰是数值升序）</text>
  <text x="500" y="108" text-anchor="middle" font-size="12" fill="#444">顺序 [2, 8, 16]</text>

  <g filter="url(#sk)">
    <rect x="372" y="126" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="410" y="126" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="478" y="126" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="390" y="148" text-anchor="middle" font-size="13" fill="#3a6a2a" font-family="monospace">10</text>
  <text x="443" y="148" text-anchor="middle" font-size="13" fill="#2b4e6e" font-family="monospace">1000</text>
  <text x="518" y="148" text-anchor="middle" font-size="13" fill="#8a6a1a" font-family="monospace">10000</text>
  <text x="566" y="148" font-size="10" fill="#888">(2)(8)(16)</text>

  <g filter="url(#sk)">
    <path d="M 500 170 Q 500 180 500 188" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="500" y="212" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">拼接串 10100010000</text>
  <text x="500" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">= 1296 ✓</text>
  <text x="500" y="258" text-anchor="middle" font-size="11" fill="#2e6e2e">全部候选中最大</text>

  <!-- VS in the middle -->
  <g filter="url(#sk)">
    <circle cx="340" cy="150" r="22" fill="#fff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="340" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#666">vs</text>

  <!-- Bottom insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="292" width="600" height="88" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="60" y="316" font-size="13" font-weight="bold" fill="#2b2b2b">为什么直觉失效？</text>
  <text x="60" y="338" font-size="11.5" fill="#444">所有候选等长（L₂+L₈+L₁₆ = 11 位）→ 比较数值 ⇔ 比较拼接串的字典序。</text>
  <text x="60" y="358" font-size="11.5" fill="#444">一个数该不该排前面，取决于它的二进制串的「拼接统治力」，与数值大小无关——</text>
  <text x="60" y="374" font-size="11.5" fill="#7a5415">谁前谁后，由 3.2 节的拼接比较器决定。</text>
</svg>
