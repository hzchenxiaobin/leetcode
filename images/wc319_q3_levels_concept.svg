<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#fafafa"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：层与层互相独立，逐层归约为「任意交换排序」</text>
  <path d="M 310 40 Q 480 48 650 40" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 左：示例 1 的树，按层着色 ===== -->
  <g stroke="#9a9a9a" stroke-width="1.6">
    <line x1="250" y1="70" x2="170" y2="150" filter="url(#rough2)"/>
    <line x1="250" y1="70" x2="330" y2="150" filter="url(#rough2)"/>
    <line x1="170" y1="150" x2="115" y2="230" filter="url(#rough2)"/>
    <line x1="170" y1="150" x2="210" y2="230" filter="url(#rough2)"/>
    <line x1="330" y1="150" x2="300" y2="230" filter="url(#rough2)"/>
    <line x1="330" y1="150" x2="390" y2="230" filter="url(#rough2)"/>
    <line x1="300" y1="230" x2="275" y2="310" filter="url(#rough2)"/>
    <line x1="390" y1="230" x2="365" y2="310" filter="url(#rough2)"/>
  </g>

  <!-- level dashed boxes -->
  <rect x="212" y="44" width="76" height="56" rx="10" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="220" y="58" font-size="10.5" fill="#446688" filter="url(#rough2)">层 0</text>
  <rect x="134" y="124" width="232" height="56" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="142" y="138" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">层 1</text>
  <rect x="80" y="204" width="345" height="56" rx="10" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="88" y="218" font-size="10.5" fill="#d6a040" filter="url(#rough2)">层 2</text>
  <rect x="239" y="284" width="162" height="56" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="247" y="298" font-size="10.5" fill="#b85450" filter="url(#rough2)">层 3</text>

  <!-- nodes -->
  <circle cx="250" cy="70" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">1</text>

  <circle cx="170" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">4</text>
  <circle cx="330" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">3</text>

  <circle cx="115" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">7</text>
  <circle cx="210" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">6</text>
  <circle cx="300" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">8</text>
  <circle cx="390" cy="230" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">5</text>

  <circle cx="275" cy="310" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="275" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3030" filter="url(#rough2)">9</text>
  <circle cx="365" cy="310" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="365" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a3030" filter="url(#rough2)">10</text>

  <!-- 同层任意两点交换：7 <-> 5 -->
  <path d="M 118 248 Q 252 272 382 248" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">7 ↔ 5：同层任意两点可交换</text>

  <text x="252" y="372" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">层 0=[1]，层 1=[4,3]，层 2=[7,6,8,5]，层 3=[9,10]（BFS 从左到右读层）</text>

  <!-- ===== 右：四步推导 ===== -->
  <rect x="480" y="56" width="450" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="80" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">操作：同层任意两点，交换值</text>
  <text x="500" y="102" font-size="11" fill="#333" filter="url(#rough2)">每步选同一层的任意两个节点，交换它们的值；</text>
  <text x="500" y="120" font-size="11" fill="#333" filter="url(#rough2)">交换的是「值」，节点位置与父子关系都不变；</text>
  <text x="500" y="138" font-size="11" fill="#333" filter="url(#rough2)">跨子树、不相邻也可以（左图 7 ↔ 5）。</text>

  <path d="M 705 144 L 705 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="480" y="160" width="450" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="184" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">目标：每层从左到右严格递增</text>
  <text x="500" y="206" font-size="11" fill="#333" filter="url(#rough2)">层内有序即可，对其它层没有任何要求；</text>
  <text x="500" y="224" font-size="11" fill="#333" filter="url(#rough2)">一次操作也绝不触碰其它层 ⇒ 各层独立求解。</text>

  <path d="M 705 248 L 705 260" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="480" y="264" width="450" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="288" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">拆解：答案 = Σ 各层最少交换次数</text>
  <text x="500" y="310" font-size="11" fill="#333" filter="url(#rough2)">对每层单独求「任意交换排序的最少次数」；</text>
  <text x="500" y="328" font-size="11" fill="#333" filter="url(#rough2)">最宽一层 ≤ ⌈N/2⌉ ≈ 5×10⁴ 个节点。</text>

  <path d="M 705 352 L 705 364" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="480" y="368" width="450" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="392" font-size="13" font-weight="bold" fill="#7a3030" filter="url(#rough2)">归约：单层 ⇒ 置换环模板</text>
  <text x="500" y="414" font-size="11" fill="#333" filter="url(#rough2)">值互不相同 ⇒ 每个值的目标位置唯一；</text>
  <text x="500" y="432" font-size="11" fill="#333" filter="url(#rough2)">最少交换 = n − c（c 为置换环个数）→ 见下图。</text>
</svg>
