<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态：以 (i,j) 为右下角锚定正方形</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[i][j] = 最大全 1 边长 = 该格贡献的正方形个数</text>

  <!-- 4x3 网格，行列下标从 0 开始；高亮以 (2,3) 为右下角的 3x3 全 1 方块 -->
  <g filter="url(#rough2)">
    <rect x="100" y="86" width="46" height="46" fill="#eeeeee" stroke="#999" stroke-width="1.3"/>
    <rect x="146" y="86" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="192" y="86" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="86" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>

    <rect x="100" y="132" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="146" y="132" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="192" y="132" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="132" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>

    <rect x="100" y="178" width="46" height="46" fill="#eeeeee" stroke="#999" stroke-width="1.3"/>
    <rect x="146" y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="192" y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="178" width="46" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#555">
    <text x="123" y="115">0</text>
    <text x="169" y="115">1</text>
    <text x="215" y="115">1</text>
    <text x="261" y="115">1</text>
    <text x="123" y="161">1</text>
    <text x="169" y="161">1</text>
    <text x="215" y="161">1</text>
    <text x="261" y="161">1</text>
    <text x="123" y="207">0</text>
    <text x="169" y="207">1</text>
    <text x="215" y="207">1</text>
    <text x="261" y="207">1</text>
  </g>

  <!-- 高亮的 3x3 全 1 区域 -->
  <rect x="146" y="86" width="138" height="138" fill="none" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>

  <!-- 锚点格 (2,3) -->
  <rect x="238" y="178" width="46" height="46" fill="#fff3cd" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="261" y="200" font-size="10" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">dp=3</text>
  <text x="261" y="220" font-size="9" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">(i,j)</text>

  <path d="M 288 200 L 318 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="96" width="206" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="336" y="120" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">以 (i,j) 为右下角的最大方块</text>
  <text x="336" y="142" font-size="10.5" fill="#555" filter="url(#rough2)">边长 3 × 3 全为 1</text>
  <text x="336" y="162" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 边长 1、2、3 的方块都全 1</text>

  <text x="280" y="264" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同一锚点上的方块层层嵌套：最大边长 t ⇒ 边长 1..t 各恰好一个</text>

  <rect x="120" y="282" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">答案 = Σ dp[i][j]</text>
  <text x="280" y="325" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">逐格累加即可，无需按边长分类枚举</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">灰色格 dp = 0；首行首列的 1 格 dp = 1</text>
</svg>
