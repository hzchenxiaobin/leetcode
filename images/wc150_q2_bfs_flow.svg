<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BFS 逐层快照：每轮只处理「当前这一层」</text>

  <!-- A 初始化 -->
  <rect x="80" y="50" width="400" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="94" y="66" font-size="10" fill="#777" filter="url(#rough2)">初始化</text>
  <text x="94" y="82" font-size="10.5" fill="#2f4360" filter="url(#rough2)">queue = [root]，level = 1，ans = 1，best = −∞</text>

  <!-- A -> B -->
  <path d="M 280 92 L 280 106" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 判断 -->
  <polygon points="280,108 412,140 280,172 148,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">queue 非空？</text>

  <!-- B -> G 否 -->
  <path d="M 412 140 L 422 140" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="132" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="424" y="120" width="118" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="483" y="145" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 ans</text>

  <!-- B -> C -->
  <path d="M 280 172 L 280 182" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C 快照 -->
  <rect x="100" y="184" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="10.5" fill="#2f4360" filter="url(#rough2)">sz = queue 长度（快照），levelSum = 0</text>

  <!-- C -> D -->
  <path d="M 280 224 L 280 238" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D 内层循环 -->
  <rect x="80" y="240" width="400" height="46" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="94" y="258" font-size="10" fill="#444" filter="url(#rough2)">循环 sz 次：出队一个节点，levelSum += node.val</text>
  <text x="94" y="276" font-size="10" fill="#777" filter="url(#rough2)">左右儿子非空则入队（它们属于下一层）</text>

  <!-- D -> E -->
  <path d="M 280 286 L 280 292" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E 比较 -->
  <polygon points="280,294 410,330 280,366 150,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">levelSum &gt; best ?</text>

  <!-- E -> F 是 -->
  <path d="M 410 330 L 418 330" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="420" y="310" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="482" y="326" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">best = levelSum</text>
  <text x="482" y="340" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">ans = level</text>

  <!-- E -> H 否 -->
  <path d="M 280 366 L 280 382" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="378" font-size="9.5" fill="#b85450" filter="url(#rough2)">否（不改答案）</text>

  <!-- F -> H -->
  <path d="M 482 350 L 482 399 L 362 399" stroke="#8a9bb5" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- H 递增 -->
  <rect x="180" y="384" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="405" text-anchor="middle" font-size="10.5" fill="#2f4360" filter="url(#rough2)">level += 1</text>

  <!-- 回边 -->
  <path d="M 180 400 L 52 400 L 52 140 L 146 140" stroke="#8a9bb5" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="266" font-size="9.5" fill="#8a9bb5" filter="url(#rough2)">回到</text>
  <text x="58" y="280" font-size="9.5" fill="#8a9bb5" filter="url(#rough2)">下一轮</text>
</svg>
