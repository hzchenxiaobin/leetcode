<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="280" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：nums = [2, 3, 7, 5, 10] 的逐行演算</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="54" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="105" y="76" text-anchor="middle">i</text>
    <rect x="140" y="54" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="180" y="76" text-anchor="middle">nums[i]</text>
    <rect x="220" y="54" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="76" text-anchor="middle">runMax</text>
    <rect x="300" y="54" width="90" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="345" y="76" text-anchor="middle">conver[i]</text>
    <rect x="390" y="54" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="430" y="76" text-anchor="middle">score</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="70" y="92" width="70" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="105" y="112" text-anchor="middle">0</text>
    <rect x="140" y="92" width="80" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="180" y="112" text-anchor="middle">2</text>
    <rect x="220" y="92" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="260" y="112" text-anchor="middle">2</text>
    <rect x="300" y="92" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="345" y="112" text-anchor="middle">4</text>
    <rect x="390" y="92" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="430" y="112" text-anchor="middle">4</text>

    <rect x="70" y="126" width="70" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="105" y="146" text-anchor="middle">1</text>
    <rect x="140" y="126" width="80" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="180" y="146" text-anchor="middle">3</text>
    <rect x="220" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="260" y="146" text-anchor="middle">3</text>
    <rect x="300" y="126" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="345" y="146" text-anchor="middle">6</text>
    <rect x="390" y="126" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="430" y="146" text-anchor="middle">10</text>

    <rect x="70" y="160" width="70" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="105" y="180" text-anchor="middle">2</text>
    <rect x="140" y="160" width="80" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="180" y="180" text-anchor="middle">7</text>
    <rect x="220" y="160" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="260" y="180" text-anchor="middle">7</text>
    <rect x="300" y="160" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="345" y="180" text-anchor="middle">14</text>
    <rect x="390" y="160" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="430" y="180" text-anchor="middle">24</text>

    <rect x="70" y="194" width="70" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="105" y="214" text-anchor="middle">3</text>
    <rect x="140" y="194" width="80" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="180" y="214" text-anchor="middle">5</text>
    <rect x="220" y="194" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="260" y="214" text-anchor="middle">7（不变）</text>
    <rect x="300" y="194" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="345" y="214" text-anchor="middle">12</text>
    <rect x="390" y="194" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="430" y="214" text-anchor="middle">36</text>

    <rect x="70" y="228" width="70" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="105" y="248" text-anchor="middle">4</text>
    <rect x="140" y="228" width="80" height="30" rx="4" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1"/>
    <text x="180" y="248" text-anchor="middle">10</text>
    <rect x="220" y="228" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="260" y="248" text-anchor="middle">10</text>
    <rect x="300" y="228" width="90" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="345" y="248" text-anchor="middle">20</text>
    <rect x="390" y="228" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="430" y="248" text-anchor="middle" font-weight="bold" fill="#b85450">56</text>
  </g>

  <text x="280" y="274" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">i = 3 处 runMax 保持 7：conver[3] = 5 + 7 = 12，这就是"前缀最大"的含义</text>
</svg>
