<svg xmlns="http://www.w3.org/2000/svg" width="640" height="352" viewBox="0 0 640 352" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="352" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：k = 2, n = 4 —— 同色格必须相等</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 配对弧线 -->
  <text x="255" y="52" text-anchor="middle" font-size="11" fill="#888">配对 j ↔ (j+2) mod 4（0↔2，1↔3）</text>
  <path d="M 177 62 Q 239 40 301 62" stroke="#4a8edb" stroke-width="1.4" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <path d="M 239 66 Q 301 46 363 66" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>

  <!-- 矩阵三行 -->
  <text x="142" y="93" text-anchor="end" font-size="11" fill="#666">行 0（偶·左移）</text>
  <text x="142" y="147" text-anchor="end" font-size="11" fill="#666">行 1（奇·右移）</text>
  <text x="142" y="201" text-anchor="end" font-size="11" fill="#666">行 2（偶·左移）</text>

  <!-- 行 0：1 2 1 2 -->
  <g filter="url(#sk)"><rect x="150" y="70" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="177" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="212" y="70" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="239" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">2</text>
  <g filter="url(#sk)"><rect x="274" y="70" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="301" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="336" y="70" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="363" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">2</text>

  <!-- 行 1：5 5 5 5 -->
  <g filter="url(#sk)"><rect x="150" y="124" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="177" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="212" y="124" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="239" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">5</text>
  <g filter="url(#sk)"><rect x="274" y="124" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="301" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="336" y="124" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="363" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">5</text>

  <!-- 行 2：6 3 6 3 -->
  <g filter="url(#sk)"><rect x="150" y="178" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="177" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="212" y="178" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="239" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">3</text>
  <g filter="url(#sk)"><rect x="274" y="178" width="54" height="38" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="301" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="336" y="178" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="363" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">3</text>

  <!-- 列下标与配对目标 -->
  <text x="142" y="231" text-anchor="end" font-size="10.5" fill="#999">j</text>
  <text x="177" y="231" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="239" y="231" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="301" y="231" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="363" y="231" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="142" y="247" text-anchor="end" font-size="10" fill="#888">(j+2) mod 4</text>
  <text x="177" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="239" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10">3</text>
  <text x="301" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">0</text>
  <text x="363" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06a10">1</text>

  <!-- 右侧逐行检查面板 -->
  <g filter="url(#sk)"><rect x="410" y="70" width="212" height="168" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="426" y="92" font-size="12.5" font-weight="bold" fill="#7a5415">逐行检查（k=2, n=4）</text>
  <text x="426" y="118" font-size="11.5" fill="#2e6e2e" font-family="monospace">行0：1=1 ✓  2=2 ✓</text>
  <text x="426" y="142" font-size="11.5" fill="#2e6e2e" font-family="monospace">行1：5=5 ✓  5=5 ✓</text>
  <text x="426" y="166" font-size="11.5" fill="#2e6e2e" font-family="monospace">行2：6=6 ✓  3=3 ✓</text>
  <text x="426" y="192" font-size="11" fill="#666">g = gcd(4,2) = 2</text>
  <text x="426" y="210" font-size="11" fill="#666">每行 = 长度 2 的块 × 2</text>
  <text x="426" y="230" font-size="12" font-weight="bold" fill="#2e6e2e">全部通过 → 返回 true</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="40" y="256" width="560" height="74" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">对照示例 1：n=3, k=4 → s=1 → 行 0 首检 1 ≠ 2 → 立即 false（短路的价值）</text>
  <text x="320" y="304" text-anchor="middle" font-size="12" fill="#666">对照示例 3：所有元素相等 → 任何循环移位都不改变 → 恒 true</text>
</svg>
