<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="340" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：456 + 77 = 533，逐列走三遍循环</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">buf 按「低位先写」的顺序追加，最后整体反转得到答案</text>

  <g filter="url(#rough2)">
    <rect x="30" y="66" width="76" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="106" y="66" width="96" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="202" y="66" width="96" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="298" y="66" width="96" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="394" y="66" width="86" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="480" y="66" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>

    <rect x="30" y="98" width="76" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="106" y="98" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="202" y="98" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="298" y="98" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="394" y="98" width="86" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="98" width="150" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>

    <rect x="30" y="136" width="76" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="106" y="136" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="202" y="136" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="298" y="136" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="394" y="136" width="86" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="136" width="150" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>

    <rect x="30" y="174" width="76" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="106" y="174" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="202" y="174" width="96" height="38" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="298" y="174" width="96" height="38" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="394" y="174" width="86" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="174" width="150" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#3a4a66" text-anchor="middle">
    <text x="68" y="87">位</text>
    <text x="154" y="87">num1[i]</text>
    <text x="250" y="87">num2[j]</text>
    <text x="346" y="87">carry 入</text>
    <text x="437" y="87">sum</text>
    <text x="555" y="87">写入位 / 进位出</text>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#444" text-anchor="middle">
    <text x="68" y="122">个位</text>
    <text x="154" y="122">6</text>
    <text x="250" y="122">7</text>
    <text x="346" y="122">0</text>
    <text x="437" y="122" font-weight="bold" fill="#8a6a20">13</text>
    <text x="555" y="122">写 3，进 1</text>

    <text x="68" y="160">十位</text>
    <text x="154" y="160">5</text>
    <text x="250" y="160">7</text>
    <text x="346" y="160">1</text>
    <text x="437" y="160" font-weight="bold" fill="#8a6a20">13</text>
    <text x="555" y="160">写 3，进 1</text>

    <text x="68" y="198">百位</text>
    <text x="154" y="198">4</text>
    <text x="250" y="198" font-size="11">0（越界）</text>
    <text x="346" y="198">1</text>
    <text x="437" y="198" font-weight="bold" fill="#8a6a20">5</text>
    <text x="555" y="198">写 5，进 0</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="34" y="248">buf = ["3", "3", "5"]（低位在前）</text>
    <text x="34" y="274">反转后得 "533"，即 456 + 77 的正确结果</text>
    <text x="34" y="300" fill="#999">第三列 num2 已越界，按 0 参与求和；carry 出为 0 且两指针都越界，循环自然结束</text>
    <text x="34" y="324" fill="#bbb">每列都满足 sum ≤ 9 + 9 + 1 = 19，所以 carry 恒为 0 或 1</text>
  </g>
</svg>
