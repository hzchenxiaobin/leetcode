<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="490" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：abs 对称 → 只查「半个三角形」</text>
  <path d="M 160 42 Q 360 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="70" text-anchor="middle" font-size="12.5" fill="#555">以示例 1 为例：nums = [5, 1, 4, 1]，D = indexDifference = 2，V = 4（n = 4）</text>

  <!-- column headers: nums[j] values + j indices -->
  <text x="182" y="90" text-anchor="end" font-size="11" fill="#888">nums[j] →</text>
  <text x="222" y="90" text-anchor="middle" font-size="12" fill="#555">5</text>
  <text x="286" y="90" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="350" y="90" text-anchor="middle" font-size="12" fill="#555">4</text>
  <text x="414" y="90" text-anchor="middle" font-size="12" fill="#555">1</text>
  <text x="182" y="106" text-anchor="end" font-size="11" fill="#888">j →</text>
  <text x="222" y="106" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="286" y="106" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="350" y="106" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="414" y="106" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- row labels i = k (value) -->
  <text x="182" y="140" text-anchor="end" font-size="10.5" fill="#555">i=0 (5)</text>
  <text x="182" y="188" text-anchor="end" font-size="10.5" fill="#555">i=1 (1)</text>
  <text x="182" y="236" text-anchor="end" font-size="10.5" fill="#555">i=2 (4)</text>
  <text x="182" y="284" text-anchor="end" font-size="10.5" fill="#555">i=3 (1)</text>

  <!-- 4x4 pair grid -->
  <g filter="url(#sk)">
    <!-- row i=0 -->
    <rect x="190" y="112" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="254" y="112" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="318" y="112" width="64" height="48" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="382" y="112" width="64" height="48" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <!-- row i=1 -->
    <rect x="190" y="160" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="254" y="160" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="318" y="160" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="382" y="160" width="64" height="48" rx="4" fill="#f0f3f7" stroke="#8fa0b3" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- row i=2 -->
    <rect x="190" y="208" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="254" y="208" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="318" y="208" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="382" y="208" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <!-- row i=3 -->
    <rect x="190" y="256" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="254" y="256" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="318" y="256" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="382" y="256" width="64" height="48" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>

  <!-- cell texts -->
  <text x="350" y="131" text-anchor="middle" font-size="10.5" fill="#333">|5−4|=1</text>
  <text x="350" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  <text x="414" y="131" text-anchor="middle" font-size="10.5" fill="#333">|5−1|=4</text>
  <text x="414" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">✓ 命中</text>
  <text x="414" y="188" text-anchor="middle" font-size="10.5" fill="#8a94a3">未及</text>

  <!-- right-side notes -->
  <text x="462" y="118" font-size="12.5" font-weight="bold" fill="#2b2b2b">为何只需「半个三角形」？</text>
  <text x="462" y="142" font-size="11" fill="#444">① abs 对称：(i,j) 与 (j,i) 同生共死</text>
  <text x="462" y="164" font-size="11" fill="#444">② j − i &lt; D：下标距离不足，直接免检</text>
  <text x="462" y="186" font-size="11" fill="#444">③ j 从 i + D 起步：循环体内只剩值差一判</text>
  <path d="M 458 182 Q 420 165 388 142" stroke="#4a8edb" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="462" y="202" width="240" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="476" y="219" font-size="11" fill="#2e6e2e">首个命中 (0,3)：|5−1| = 4 ≥ 4（压线达标）</text>
  <text x="476" y="235" font-size="11" font-weight="bold" fill="#2e6e2e">→ 返回 [0, 3]，立即停止扫描</text>
  <path d="M 458 216 Q 452 178 448 146" stroke="#4a8e4a" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="462" y="252" width="240" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="476" y="269" font-size="10.5" fill="#666">(1,3) 也在检查范围内，但按字典序</text>
  <text x="476" y="285" font-size="10.5" fill="#666">排在 (0,3) 之后——已提前返回，轮不到它</text>

  <!-- caption + legend -->
  <text x="70" y="322" font-size="10.5" fill="#666">D = 0 时对角线 (i, i) 也会被检查——题面允许 i = j。</text>
  <rect x="70" y="334" width="18" height="13" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="94" y="345" font-size="10.5" fill="#555">命中返回</text>
  <rect x="170" y="334" width="18" height="13" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" filter="url(#sk)"/>
  <text x="194" y="345" font-size="10.5" fill="#555">需检查</text>
  <rect x="270" y="334" width="18" height="13" rx="3" fill="#f0f3f7" stroke="#8fa0b3" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="294" y="345" font-size="10.5" fill="#555">未及（提前返回）</text>
  <rect x="420" y="334" width="18" height="13" rx="3" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2" filter="url(#sk)"/>
  <text x="444" y="345" font-size="10.5" fill="#555">免检（对称已覆盖 / 距离不足）</text>

  <!-- bottom takeaway box -->
  <g filter="url(#sk)">
    <rect x="70" y="366" width="580" height="98" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="392" font-size="12" font-weight="bold" fill="#2b2b2b">对称性把检查量砍半：至多 n(n+1)/2 ≈ 5×10³ 次检查（n ≤ 100），O(n²) 稳过签到。</text>
  <text x="90" y="418" font-size="11" fill="#444">但本场 Q3（#2905）与本题题面完全相同、仅把 n 放大到 10⁵ —— O(n²) 必然超时。</text>
  <text x="90" y="444" font-size="11" fill="#444">赛时直接按「前缀 min/max 两个代表」写 O(n)，一份代码通吃 Q1 与 Q3（见 Q3 题解）。</text>
</svg>
