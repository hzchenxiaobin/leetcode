<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：例 1 的 8 个好人集合逐一判定</text>
  <path d="M 170 40 Q 340 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="25" y="54" width="630" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">statements 摘要：0 说 1 好；1 说 0 好；2 说 1 坏</text>
  <text x="340" y="101" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace">掩码（bit i ↔ 玩家 i）：good = [010, 001, 000]，bad = [000, 000, 010]</text>
  <text x="340" y="124" text-anchor="middle" font-size="11.5" fill="#446688">判定：对每个 i ∈ S 查 good[i] ⊆ S 且 bad[i] ∩ S = ∅</text>

  <g filter="url(#sk)">
    <rect x="40" y="160" width="600" height="294" rx="4" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
    <rect x="40" y="160" width="600" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="42" y="290" width="596" height="32" fill="#e6f4ea"/>
    <path d="M 40 223 L 640 223" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 40 256 L 640 256" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 40 323 L 640 323" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 40 356 L 640 356" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 40 389 L 640 389" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 40 422 L 640 422" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 120 160 L 120 454" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 210 160 L 210 454" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 480 160 L 480 454" stroke="#999999" stroke-width="1" fill="none"/>
    <path d="M 555 160 L 555 454" stroke="#999999" stroke-width="1" fill="none"/>
  </g>
  <text x="80" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">S（二进制）</text>
  <text x="165" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">好人集合</text>
  <text x="345" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">击杀理由 / 备注</text>
  <text x="517" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">可行</text>
  <text x="597" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">|S|</text>

  <text x="80" y="211" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">000</text>
  <text x="165" y="211" text-anchor="middle" font-size="11" fill="#333">∅</text>
  <text x="220" y="211" font-size="11" fill="#444">空集：无好人，无真话需要兑现</text>
  <text x="517" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="597" y="211" text-anchor="middle" font-size="11" fill="#333">0</text>

  <text x="80" y="244" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">001</text>
  <text x="165" y="244" text-anchor="middle" font-size="11" fill="#333">{0}</text>
  <text x="220" y="244" font-size="11" fill="#b85450">0 说 1 好，但 1∉S</text>
  <text x="517" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗</text>
  <text x="597" y="244" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="80" y="277" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">010</text>
  <text x="165" y="277" text-anchor="middle" font-size="11" fill="#333">{1}</text>
  <text x="220" y="277" font-size="11" fill="#b85450">1 说 0 好，但 0∉S</text>
  <text x="517" y="277" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗</text>
  <text x="597" y="277" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="80" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">011</text>
  <text x="165" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">{0,1}</text>
  <text x="220" y="310" font-size="11" fill="#2e6e2e">无违反：0、1 互证清白</text>
  <text x="517" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="597" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2 ←最大</text>

  <text x="80" y="343" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">100</text>
  <text x="165" y="343" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="220" y="343" font-size="11" fill="#444">无违反：2 说 1 坏，1∉S ✓</text>
  <text x="517" y="343" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="597" y="343" text-anchor="middle" font-size="11" fill="#333">1</text>

  <text x="80" y="376" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">101</text>
  <text x="165" y="376" text-anchor="middle" font-size="11" fill="#333">{0,2}</text>
  <text x="220" y="376" font-size="11" fill="#b85450">0 说 1 好，但 1∉S</text>
  <text x="517" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗</text>
  <text x="597" y="376" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="80" y="409" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">110</text>
  <text x="165" y="409" text-anchor="middle" font-size="11" fill="#333">{1,2}</text>
  <text x="220" y="409" font-size="11" fill="#b85450">1 说 0 好，但 0∉S</text>
  <text x="517" y="409" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗</text>
  <text x="597" y="409" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="80" y="442" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">111</text>
  <text x="165" y="442" text-anchor="middle" font-size="11" fill="#333">{0,1,2}</text>
  <text x="220" y="442" font-size="11" fill="#b85450">2 说 1 坏，但 1∈S</text>
  <text x="517" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✗</text>
  <text x="597" y="442" text-anchor="middle" font-size="11" fill="#333">3</text>

  <g filter="url(#sk)">
    <rect x="25" y="476" width="630" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="340" y="500" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">最大 popcount = 2（S = {0,1}）→ 返回 2</text>
  <text x="340" y="524" text-anchor="middle" font-size="11" fill="#444">三个可行世界：∅（全员恶人）、{2}（只有 2 是好人）、{0,1}（2 在说谎）—— 全部自洽，取好人最多者</text>
</svg>
