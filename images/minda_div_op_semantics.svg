<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作的本质：x ÷ 最大真因数 = 换成最小素因子</text>
  <path d="M 235 42 Q 450 50 665 42" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== Panel A: 25 ===== -->
  <rect x="55" y="64" width="380" height="266" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="245" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">① 复合数：25 = 1×25 = 5×5</text>
  <text x="245" y="122" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">因数两两配对，真因数：1、5</text>
  <text x="245" y="148" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">最大真因数 = 25 ÷ 最小素因子 5 = 5</text>

  <g filter="url(#rough2)">
    <rect x="115" y="172" width="66" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="148" y="206" text-anchor="middle" font-size="19" fill="#333">25</text>
    <path d="M 183 198 L 241 198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="212" y="186" text-anchor="middle" font-size="11" fill="#8a6215">÷ 5</text>
    <rect x="245" y="172" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="278" y="206" text-anchor="middle" font-size="19" fill="#333">5</text>
    <text x="322" y="202" font-size="12" fill="#3a6e3a">= spf(25) ✓</text>
  </g>
  <text x="245" y="256" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">一步掉到最小素因子 5；5 已是素数，再除 ÷1 不动</text>
  <text x="245" y="284" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">（操作次数再多，值也停在 5）</text>

  <!-- ===== Panel B: 12 ===== -->
  <rect x="465" y="64" width="380" height="266" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="655" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">② 复合数：12 = 1×12 = 2×6 = 3×4</text>
  <text x="655" y="122" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">真因数：1、2、3、4、6，最大的是 6</text>
  <text x="655" y="148" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">最大真因数 = 12 ÷ 最小素因子 2 = 6</text>

  <g filter="url(#rough2)">
    <rect x="525" y="172" width="66" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="558" y="206" text-anchor="middle" font-size="19" fill="#333">12</text>
    <path d="M 593 198 L 651 198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="622" y="186" text-anchor="middle" font-size="11" fill="#8a6215">÷ 6</text>
    <rect x="655" y="172" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="688" y="206" text-anchor="middle" font-size="19" fill="#333">2</text>
    <text x="730" y="202" font-size="12" fill="#3a6e3a">= spf(12) ✓</text>
  </g>
  <text x="655" y="256" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">一步掉到最小素因子 2；2 已是素数，卡死</text>
  <text x="655" y="284" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">（一次操作后值域收敛到素数）</text>

  <!-- ===== Panel C: 素数与 1 ===== -->
  <rect x="55" y="350" width="790" height="190" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04a46" filter="url(#rough2)">③ 素数与 1：纹丝不动 —— 无解（−1）的来源</text>

  <g filter="url(#rough2)">
    <text x="95" y="408" font-size="12" fill="#555">素数 7 的真因数只有 1</text>
    <rect x="95" y="424" width="54" height="46" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
    <text x="122" y="454" text-anchor="middle" font-size="18" fill="#333">7</text>
    <path d="M 151 447 L 205 447" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="178" y="436" text-anchor="middle" font-size="11" fill="#8a6215">÷ 1</text>
    <rect x="209" y="424" width="54" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="236" y="454" text-anchor="middle" font-size="18" fill="#a04a46">7</text>
    <text x="278" y="451" font-size="12" fill="#a04a46">原地踏步 ✗</text>
  </g>

  <g filter="url(#rough2)">
    <text x="430" y="408" font-size="12" fill="#555">1 没有真因数</text>
    <rect x="430" y="424" width="54" height="46" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.8"/>
    <text x="457" y="454" text-anchor="middle" font-size="18" fill="#777">1</text>
    <text x="498" y="451" font-size="12" fill="#777">不能操作</text>
  </g>

  <g filter="url(#rough2)">
    <text x="610" y="408" font-size="12" fill="#555">示例 2：[7, 7, 6]</text>
    <rect x="610" y="424" width="42" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="631" y="453" text-anchor="middle" font-size="16" fill="#333">7</text>
    <rect x="658" y="424" width="42" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="679" y="453" text-anchor="middle" font-size="16" fill="#a04a46">7</text>
    <rect x="706" y="424" width="42" height="46" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="727" y="453" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="610" y="496" font-size="11.5" fill="#a04a46">第 2 个 7 想变得 ≤ 6，但 7 ÷ 1 = 7</text>
    <text x="610" y="516" font-size="11.5" fill="#a04a46">⇒ 无解，返回 −1</text>
  </g>

  <!-- ===== 底部结论 ===== -->
  <rect x="55" y="560" width="790" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="588" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6215" filter="url(#rough2)">每个位置只有两种命运：x（0 次操作）或 spf(x)（1 次操作）——再操作也是原地踏步</text>
  <text x="450" y="614" text-anchor="middle" font-size="12.5" fill="#8a6215" filter="url(#rough2)">问题归约：每位从 { x, spf(x) } 二选一，使数组非递减，最小化「选 spf」的个数</text>
</svg>
