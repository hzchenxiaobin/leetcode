  <text x="132" y="240.5" font-size="10.5" fill="#3a5a30" text-anchor="start" font-weight="bold" filter="url(#rough2)">基础满意 = 1 + 1 + 1 + 7 = 10</text>
  <text x="132" y="257" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">（所有 grumpy = 0 的分钟）</text>
  <rect x="370" y="214" width="226" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="382" y="240.5" font-size="10.5" fill="#8a6a10" text-anchor="start" font-weight="bold" filter="url(#rough2)">窗口 [5,7] 额外加成 = 1 + 0 + 5 = 6</text>
  <text x="382" y="257" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">其中 6 号分钟的 7 已经满意过</text>
  <path d="M 346 245 L 368 245" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="292" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="232" y="319.3" font-size="12" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">答案 = 10 + 6 = 16</text>
