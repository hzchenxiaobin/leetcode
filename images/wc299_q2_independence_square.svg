<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察一：两侧互不耦合 —— 答案 = g(n)²</text>
  <path d="M 160 36 Q 320 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：街道示意（上侧放 1、3；下侧放 1、4） -->
  <text x="56" y="60" font-size="12" fill="#555">上侧 n 个地块</text>
  <text x="78" y="72" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="122" y="72" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="166" y="72" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="210" y="72" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="254" y="72" text-anchor="middle" font-size="10" fill="#888">5</text>

  <g filter="url(#sk)"><rect x="56" y="76" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><path d="M 68 106 L 68 96 L 78 86 L 88 96 L 88 106 Z" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><rect x="100" y="76" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="144" y="76" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><path d="M 156 106 L 156 96 L 166 86 L 176 96 L 176 106 Z" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><rect x="188" y="76" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="232" y="76" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <g filter="url(#sk)"><rect x="48" y="124" width="232" height="26" fill="#f3f0e7" stroke="#c9c2ad" stroke-width="1"/></g>
  <path d="M 54 137 L 274 137" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="290" y="141" font-size="11" fill="#999">街道</text>

  <g filter="url(#sk)"><rect x="56" y="154" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><path d="M 68 184 L 68 174 L 78 164 L 88 174 L 88 184 Z" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><rect x="100" y="154" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="144" y="154" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="188" y="154" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#sk)"><path d="M 200 184 L 200 174 L 210 164 L 220 174 L 220 184 Z" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><rect x="232" y="154" width="44" height="44" rx="4" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>

  <!-- 第 1 列高亮：两侧对脸同放 -->
  <g filter="url(#sk)"><rect x="50" y="64" width="56" height="140" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="112" y="76" font-size="13" font-weight="bold" fill="#b07818">①</text>

  <g filter="url(#sk)"><rect x="48" y="209" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="66" y="219" font-size="11.5" fill="#555">① 两侧第 1 地块对脸同放 —— 跨侧无约束</text>
  <g filter="url(#sk)"><rect x="48" y="227" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="66" y="237" font-size="11.5" fill="#555">上侧 1、3 与下侧 1、4：各自不相邻 ✓</text>
  <g filter="url(#sk)"><rect x="48" y="245" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="66" y="255" font-size="11.5" fill="#555">同侧若相邻（如 4、5 同放）—— 违例</text>

  <!-- 右：乘法原理 -->
  <g filter="url(#sk)"><rect x="350" y="56" width="252" height="204" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="476" y="80" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">乘法原理：两侧独立</text>
  <text x="476" y="104" text-anchor="middle" font-size="12" fill="#444">全局合法 ⟺ 上侧合法 ∧ 下侧合法</text>
  <g filter="url(#sk)"><rect x="362" y="116" width="228" height="36" rx="6" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="476" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" font-family="monospace">ans = g(n) × g(n) = g(n)²</text>
  <text x="476" y="172" text-anchor="middle" font-size="11.5" fill="#555">g(n) := 一侧 n 个地块的合法方式数</text>
  <text x="476" y="192" text-anchor="middle" font-size="11.5" fill="#555">方案对 (A, B) ↔ 全局方案，一一对应</text>
  <text x="476" y="212" text-anchor="middle" font-size="11.5" fill="#555">每一步加法与平方都取模</text>
  <text x="476" y="238" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">ans ≡ g(n)² (mod 10⁹ + 7)</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="64" y="272" width="512" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">归约：两侧 2n 地块 —两侧独立→ g(n)² —末位二分→ g(i)=g(i−1)+g(i−2)</text>
  <text x="320" y="320" text-anchor="middle" font-size="11.5" fill="#555">g(0)=1（全不放）、g(1)=2（放 / 不放）⟹ 序列 1, 2, 3, 5, 8, 13, …</text>
  <text x="320" y="344" text-anchor="middle" font-size="11.5" fill="#a04a48">⚠ 不是一条长 2n 的链！链式递推在 n=1 给 3 ≠ 4 —— 虚构「跨侧相邻」杀死对脸方案</text>

  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#888">识别信号：相邻不取 + 计数 = 打家劫舍计数版；再外套一层乘法原理的平方</text>
</svg>
