<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="920" height="600" fill="#fdfcf7"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">子串回文判定：正向哈希 = 反向哈希？</text>
  <path d="M 250 42 Q 460 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: T ===== -->
  <text x="120" y="102" font-size="13" font-weight="bold" fill="#2b6e9e">正向 T（n = 6）：</text>
  <g font-size="10" fill="#999">
    <text x="260" y="88" text-anchor="middle">i=0</text>
    <text x="324" y="88" text-anchor="middle">1</text>
    <text x="388" y="88" text-anchor="middle">2</text>
    <text x="452" y="88" text-anchor="middle">3</text>
    <text x="516" y="88" text-anchor="middle">4</text>
    <text x="580" y="88" text-anchor="middle">5</text>
  </g>
  <g font-size="15">
    <g filter="url(#sk)"><rect x="228" y="96" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="260" y="125" text-anchor="middle" fill="#888">a</text>
    <g filter="url(#sk)"><rect x="292" y="96" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="324" y="125" text-anchor="middle" fill="#888">b</text>
    <g filter="url(#sk)"><rect x="356" y="96" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="388" y="125" text-anchor="middle" fill="#888">a</text>
    <g filter="url(#sk)"><rect x="420" y="96" width="64" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4"/></g>
    <text x="452" y="125" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="484" y="96" width="64" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4"/></g>
    <text x="516" y="125" text-anchor="middle" fill="#7a5415" font-weight="bold">b</text>
    <g filter="url(#sk)"><rect x="548" y="96" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="580" y="125" text-anchor="middle" fill="#888">a</text>
  </g>
  <path d="M 420 154 L 416 162 L 548 162 L 544 154" stroke="#c98a2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="484" y="180" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">节点 2 的区间 [l,r] = [3,4]，子串 "ab"</text>

  <!-- mirror mapping arrows -->
  <path d="M 452 150 Q 430 210 390 240" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <path d="M 516 150 Q 494 210 454 240" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <text x="560" y="212" font-size="10" fill="#997020">镜像：i ↦ n−1−i</text>
  <text x="560" y="228" font-size="10" fill="#997020">（3↦2，4↦1）</text>

  <!-- ===== Row 2: rev(T) ===== -->
  <text x="120" y="252" font-size="13" font-weight="bold" fill="#5a3a7a">反向 rev(T)：</text>
  <g font-size="10" fill="#999">
    <text x="260" y="238" text-anchor="middle">j=0</text>
    <text x="324" y="238" text-anchor="middle">1</text>
    <text x="388" y="238" text-anchor="middle">2</text>
    <text x="452" y="238" text-anchor="middle">3</text>
    <text x="516" y="238" text-anchor="middle">4</text>
    <text x="580" y="238" text-anchor="middle">5</text>
  </g>
  <g font-size="15">
    <g filter="url(#sk)"><rect x="228" y="246" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="260" y="275" text-anchor="middle" fill="#888">a</text>
    <g filter="url(#sk)"><rect x="292" y="246" width="64" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4"/></g>
    <text x="324" y="275" text-anchor="middle" fill="#7a5415" font-weight="bold">b</text>
    <g filter="url(#sk)"><rect x="356" y="246" width="64" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4"/></g>
    <text x="388" y="275" text-anchor="middle" fill="#7a5415" font-weight="bold">a</text>
    <g filter="url(#sk)"><rect x="420" y="246" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="452" y="275" text-anchor="middle" fill="#888">a</text>
    <g filter="url(#sk)"><rect x="484" y="246" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="516" y="275" text-anchor="middle" fill="#888">b</text>
    <g filter="url(#sk)"><rect x="548" y="246" width="64" height="44" fill="#f0ede4" stroke="#bbb" stroke-width="1" rx="4"/></g>
    <text x="580" y="275" text-anchor="middle" fill="#888">a</text>
  </g>
  <path d="M 292 304 L 288 312 L 420 312 L 416 304" stroke="#c98a2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="356" y="330" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">镜像区间 [n−1−r, n−1−l] = [1,2]，子串 "ba"</text>

  <!-- compare box -->
  <g filter="url(#sk)">
    <rect x="620" y="240" width="260" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="640" y="264" font-size="12" font-weight="bold" fill="#b03a3a">"ab" ≠ "ba" ⟹ 非回文</text>
  <text x="640" y="288" font-size="11" fill="#444" font-family="monospace">F(3,4) ≠ G(1,2)</text>
  <text x="640" y="310" font-size="10" fill="#888">哈希值不等 ⟹ 串必不相等</text>
  <text x="640" y="328" font-size="10" fill="#888">哈希相等 ⟹ 串相等（w.h.p.）</text>

  <!-- ===== formula panel ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="360" width="440" height="130" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="384" font-size="13" font-weight="bold" fill="#2b6e9e">前缀哈希（模大素数 M，随机底数 B）</text>
  <text x="80" y="408" font-size="11" fill="#444" font-family="monospace">f[i+1] = f[i]·B + T[i]</text>
  <text x="80" y="430" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">F(l,r) = f[r+1] − f[l]·B^(r−l+1)</text>
  <text x="80" y="452" font-size="11" fill="#444" font-family="monospace">g[i+1] = g[i]·B + rev(T)[i]</text>
  <text x="80" y="474" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">G(L,R) = g[R+1] − g[L]·B^(R−L+1)</text>

  <!-- palindrome criterion panel -->
  <g filter="url(#sk)">
    <rect x="520" y="360" width="360" height="130" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="540" y="384" font-size="13" font-weight="bold" fill="#2e6e2e">回文判据</text>
  <text x="540" y="410" font-size="12" fill="#444" font-family="monospace">P 回文 ⟺ P = reverse(P)</text>
  <text x="540" y="436" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">F(l,r) = G(n−1−r, n−1−l)</text>
  <text x="540" y="462" font-size="10" fill="#888">预处理 O(n) 后，每次判定 O(1)</text>
  <text x="540" y="480" font-size="10" fill="#888">n 个节点共 n 次判定</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="510" width="820" height="70" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="534" font-size="12" font-weight="bold" fill="#2b2b2b">防卡哈希</text>
  <text x="80" y="556" font-size="11" fill="#444">M = 2⁶¹−1（梅森素数）+ 随机底数 B：单次比较碰撞概率 ≤ n/M，n 次比较总失败率 ≤ n²/M ≈ 10⁻⁸</text>
  <text x="80" y="574" font-size="11" fill="#7a2828">要 100% 确定，可改用 Manacher 回文半径判定（见文末扩展）</text>
</svg>
