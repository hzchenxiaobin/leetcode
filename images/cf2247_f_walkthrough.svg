<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：3×3 中间一格被堵（自造示例，答案 18）</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">自由格只允许向下 / 向右 ⇒ 一共只有两条路径：P1 走上再下，P2 走左再右</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="50" y="70" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="78" y="103" fill="#8a6a20">1,1 s</text>
    <rect x="114" y="70" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="142" y="103" fill="#3a4a66">1,2</text>
    <rect x="178" y="70" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="206" y="103" fill="#3a4a66">1,3</text>

    <rect x="50" y="134" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="78" y="167" fill="#3a5a30">2,1</text>
    <rect x="114" y="134" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="142" y="168" fill="#8a3a36">2,2 ×</text>
    <rect x="178" y="134" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="206" y="167" fill="#3a4a66">2,3</text>

    <rect x="50" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="78" y="231" fill="#3a5a30">3,1</text>
    <rect x="114" y="198" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="142" y="231" fill="#3a5a30">3,2</text>
    <rect x="178" y="198" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <text x="206" y="231" fill="#8a6a20">3,3 t</text>
  </g>

  <path d="M 50 246 L 234 246" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="142" y="272" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">P1 = s→(1,2)→(1,3)→(2,3)→t，P2 = s→(2,1)→(3,1)→(3,2)→t</text>

  <line x1="262" y1="64" x2="262" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="340" y="86" text-anchor="middle" font-weight="bold">P(c)</text>
    <text x="432" y="86" text-anchor="middle" font-weight="bold">|C|</text>
    <text x="500" y="86" text-anchor="middle" font-weight="bold">贡献</text>

    <rect x="272" y="98" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="340" y="110" text-anchor="middle">{P1}</text>
    <text x="432" y="110" text-anchor="middle">3</text>
    <text x="500" y="110" text-anchor="middle">7</text>

    <rect x="272" y="122" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="340" y="134" text-anchor="middle">{P2}</text>
    <text x="432" y="134" text-anchor="middle">3</text>
    <text x="500" y="134" text-anchor="middle">7</text>

    <rect x="272" y="146" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="340" y="158" text-anchor="middle">{P1, P2}</text>
    <text x="432" y="158" text-anchor="middle">2</text>
    <text x="500" y="158" text-anchor="middle">3</text>

    <rect x="272" y="170" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="340" y="182" text-anchor="middle">∅</text>
    <text x="432" y="182" text-anchor="middle">1</text>
    <text x="500" y="182" text-anchor="middle">1</text>
  </g>

  <rect x="268" y="196" width="276" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="406" y="214" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2^3−1 + 2^3−1 + 2^2−1 + 2^1−1</text>
  <text x="406" y="230" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">= 7 + 7 + 3 + 1 = 18</text>

  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">障碍格 (2,2) 与「走不到的格子」共享 P = ∅，所以它们组成同一个大类</text>
  <text x="280" y="316" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">用官方样例 5（4×4）再验一次：2^7−1 + 2^5−1 + 4×(2^1−1) = 127 + 31 + 4 = 162 ✓</text>

  <rect x="40" y="336" width="480" height="48" fill="#f2f7fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="56" y="356" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">注意：同一类的格子必须在所有路径上「同进同退」，并不要求彼此相邻；</text>
  <text x="56" y="373" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">而同一层（i+j 相同）的两个不同格子不可能同类，除非它们都是 P = ∅。</text>
</svg>
