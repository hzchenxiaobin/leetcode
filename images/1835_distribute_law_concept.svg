<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：AND 对 XOR 可分配</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">逐位看：&amp; 是 GF(2) 的乘法、⊕ 是 GF(2) 的加法 —— 乘法对加法分配，天经地义</text>

  <!-- ===== 左：原始问题（数对矩阵） ===== -->
  <text x="190" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">原始问题：n × m 个数对的 AND 再整体 ⊕</text>
  <text x="160" y="82" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">arr2 →</text>
  <g filter="url(#sk)">
    <rect x="118" y="86" width="40" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="162" y="86" width="40" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="138" y="101" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">6</text>
  <text x="182" y="101" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">5</text>
  <g filter="url(#sk)">
    <rect x="72" y="114" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="72" y="144" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="72" y="174" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="92" y="131" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">1</text>
  <text x="92" y="161" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">2</text>
  <text x="92" y="191" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#sk)">3</text>
  <text x="66" y="131" text-anchor="end" font-size="9" fill="#888" filter="url(#sk)">arr1</text>
  <g filter="url(#sk)">
    <rect x="118" y="114" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="114" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="144" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="144" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="118" y="174" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="174" width="40" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="138" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">0</text>
  <text x="182" y="131" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="138" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="182" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">0</text>
  <text x="138" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="182" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="190" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">全部异或：0 ⊕ 1 ⊕ 2 ⊕ 0 ⊕ 2 ⊕ 1 = 0</text>
  <text x="190" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#sk)">n, m ≤ 10⁵ → 数对高达 10¹⁰ 个</text>
  <text x="190" y="264" text-anchor="middle" font-size="10" fill="#8a5048" filter="url(#sk)">逐个计算 AND 必超时，必须整体化简</text>

  <!-- ===== 右：分配律恒等式 ===== -->
  <text x="528" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">分配律恒等式</text>
  <g filter="url(#sk)">
    <rect x="380" y="88" width="300" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="530" y="108" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#sk)">x &amp; (y₁ ⊕ y₂ ⊕ …)</text>
  <text x="530" y="126" text-anchor="middle" font-size="12" fill="#2a4a1a" filter="url(#sk)">= (x&amp;y₁) ⊕ (x&amp;y₂) ⊕ …</text>
  <g filter="url(#sk)">
    <rect x="380" y="144" width="300" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="530" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5a4a1a" filter="url(#sk)">单 bit 数值自测：x = 1，y = [1, 0, 1]</text>
  <text x="530" y="182" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#sk)">左边：1 &amp; (1⊕0⊕1) = 1 &amp; 0 = 0</text>
  <text x="530" y="200" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#sk)">右边：(1&amp;1)⊕(1&amp;0)⊕(1&amp;1) = 1⊕0⊕1 = 0 ✓</text>
  <text x="528" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">同一 bit 上：&amp; 即乘法、⊕ 即模 2 加法</text>

  <!-- ===== 中：两步收拢 ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="282" width="170" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="121" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">起点：数对枚举</text>
  <text x="121" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">⊕ (a &amp; b)，遍历全部数对</text>
  <text x="121" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">n·m 项（≈10¹⁰）</text>
  <path d="M 210,317 L 260,317" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="236" y="300" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">① 对 j 收拢</text>
  <g filter="url(#sk)">
    <rect x="272" y="282" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="357" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">固定 a，合并 arr2</text>
  <text x="357" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">⊕ (a &amp; Y)</text>
  <text x="357" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">n 项；Y = arr2 全员异或</text>
  <path d="M 446,317 L 496,317" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="472" y="300" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">② 对 i 收拢</text>
  <g filter="url(#sk)">
    <rect x="508" y="282" width="176" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="596" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">X &amp; Y</text>
  <text x="596" y="330" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">X = arr1 全员异或</text>
  <text x="596" y="346" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">1 项，O(n+m)</text>

  <!-- ===== 底：结论 + 翻车点 ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="372" width="354" height="106" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="213" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">答案 = (⊕ arr1) &amp; (⊕ arr2)</text>
  <text x="213" y="420" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">两次线性扫描 + 一次按位与：O(n+m) 时间、O(1) 空间</text>
  <text x="213" y="444" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">相比暴力约 10¹⁰ 次运算，快约五个数量级</text>
  <g filter="url(#sk)">
    <rect x="410" y="372" width="274" height="106" rx="8" fill="#fdf2f2" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="547" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">✗ 赛场两个典型翻车点</text>
  <text x="425" y="416" font-size="10" fill="#a04038" filter="url(#sk)">① 「&amp; 不该对 ⊕ 分配」——普通代数的错觉</text>
  <text x="425" y="436" font-size="10" fill="#a04038" filter="url(#sk)">② 凭手感猜成 X ⊕ Y 或 X | Y</text>
  <text x="425" y="460" font-size="9.5" fill="#8a5048" filter="url(#sk)">自测示例 2：12⊕4 = 8 ≠ 4；12|4 = 12 ≠ 4</text>
</svg>
