<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">固定边 (i, j)，枚举三角形第三个顶点 k → 两个子多边形</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = min over k∈(i,j) { dp[i][k] + dp[k][j] + v[i]·v[k]·v[j] }</text>

  <g filter="url(#rough2)">
    <polygon points="120,300 300,320 380,200 300,90 150,80 90,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <polygon points="90,190 380,200 300,320" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" opacity="0.85"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66">
    <circle cx="120" cy="300" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="304">0</text>
    <circle cx="300" cy="320" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="324">1</text>
    <circle cx="380" cy="200" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="380" y="204">2</text>
    <circle cx="300" cy="90" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="94">3</text>
    <circle cx="150" cy="80" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="84">4</text>
    <circle cx="90" cy="190" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="90" y="194">5</text>
  </g>

  <text x="238" y="348" font-size="10.5" fill="#8a6a20">三角形 (0, 2, 5)：得分 v0·v2·v5</text>
  <path d="M 120 300 L 380 200" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 380 200 L 90 190" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="300" y="118" font-size="10" fill="#8a3a36">边 (0,5) 属于边界</text>

  <rect x="404" y="76" width="140" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="474" y="96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">子问题 1</text>
  <text x="474" y="118" text-anchor="middle" font-size="10" fill="#555">顶点 0,1,2,3,4,5</text>
  <text x="474" y="136" text-anchor="middle" font-size="10" fill="#555">… 即 dp[0][k]</text>
  <text x="474" y="158" text-anchor="middle" font-size="10" fill="#888">区间 [0, k]</text>
  <text x="474" y="176" text-anchor="middle" font-size="10" fill="#888">规模更小</text>

  <rect x="404" y="202" width="140" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="474" y="222" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">子问题 2</text>
  <text x="474" y="244" text-anchor="middle" font-size="10" fill="#555">顶点 k,…,j</text>
  <text x="474" y="262" text-anchor="middle" font-size="10" fill="#555">即 dp[k][j]</text>
  <text x="474" y="282" text-anchor="middle" font-size="10" fill="#888">区间 [k, j]</text>

  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#999">按区间长度递增填表：长度 &lt; 2 的区间没有三角形，得分 0；k 在所有可能位置中取最小</text>
</svg>
