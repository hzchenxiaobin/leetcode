<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">在第 x 层扔一枚蛋：两种结局各消耗 1 次操作</text>
  <rect x="70" y="60" width="96" height="300" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <line x1="70" y1="60" x2="166" y2="60" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="110" x2="166" y2="110" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="160" x2="166" y2="160" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="210" x2="166" y2="210" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="260" x2="166" y2="260" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="310" x2="166" y2="310" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="360" x2="166" y2="360" stroke="#c4ccd4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">楼层 n</text>
  <rect x="70" y="180" width="96" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="0" filter="url(#rough2)"/>
  <text x="118" y="210" text-anchor="middle" font-size="16" fill="#8d3b37" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="40" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n</text>
  <text x="40" y="360" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <path d="M170 200 L210 150" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M170 210 L210 280" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <rect x="214" y="106" width="380" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404.0" y="144.55" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">碎了：f ∈ [0, x-1]</text>
  <text x="404.0" y="164.55" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">剩 k-1 枚蛋，还剩 t-1 次操作</text>
  <rect x="214" y="258" width="380" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404.0" y="296.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">没碎：f ∈ [x, n]</text>
  <text x="404.0" y="316.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">仍 k 枚蛋，还剩 t-1 次操作</text>
  <text x="310" y="386" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最坏情况：t = 1 + max(两种结局所需次数)</text>
</svg>
