<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="58" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="900" height="460" fill="#fdfcf7"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：3×3 反例的 dp 表与最优切割树（答案 13）</text>
  <path d="M 190 40 Q 450 48 710 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左：dp 表 ===== -->
  <text x="205" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">dp 表（行 = 高 i，列 = 宽 j）</text>
  <g font-size="10" fill="#888">
    <text x="141" y="80" text-anchor="middle">j=1</text>
    <text x="205" y="80" text-anchor="middle">j=2</text>
    <text x="269" y="80" text-anchor="middle">j=3</text>
    <text x="100" y="105" text-anchor="end">i=1</text>
    <text x="100" y="149" text-anchor="end">i=2</text>
    <text x="100" y="193" text-anchor="end">i=3</text>
  </g>
  <!-- 行1：0 0 4 -->
  <g filter="url(#sk)"><rect x="110" y="88" width="62" height="44" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <text x="141" y="115" text-anchor="middle" font-size="15" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="174" y="88" width="62" height="44" fill="#f0f0f0" stroke="#9e9e9e" stroke-width="1.1"/></g>
  <text x="205" y="115" text-anchor="middle" font-size="15" fill="#aaa">0</text>
  <g filter="url(#sk)"><rect x="238" y="88" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="269" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">4</text>
  <!-- 行2：3 6 9 -->
  <g filter="url(#sk)"><rect x="110" y="132" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="141" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="174" y="132" width="62" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="205" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a20">6</text>
  <g filter="url(#sk)"><rect x="238" y="132" width="62" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="269" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a20">9</text>
  <!-- 行3：3 6 13 -->
  <g filter="url(#sk)"><rect x="110" y="176" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="141" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="174" y="176" width="62" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="205" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)"><rect x="238" y="176" width="62" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/></g>
  <text x="269" y="203" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a48">13</text>

  <!-- 关键格注解 -->
  <circle cx="72" cy="243" r="4" fill="#d6a040"/>
  <text x="84" y="247" font-size="11" fill="#444"><tspan font-weight="bold" fill="#a06a20">dp[2][2] = 6</tspan>：竖切两个 2×1 → 3 + 3，胜过整块报价 4</text>
  <circle cx="72" cy="271" r="4" fill="#d6a040"/>
  <text x="84" y="275" font-size="11" fill="#444"><tspan font-weight="bold" fill="#a06a20">dp[2][3] = 9</tspan>：竖切 k=1 → dp[2][1] + dp[2][2] = 3 + 6</text>
  <circle cx="72" cy="299" r="4" fill="#b85450"/>
  <text x="84" y="303" font-size="11" fill="#444"><tspan font-weight="bold" fill="#a04a48">dp[3][3] = 13</tspan>：横切 k=1 → dp[1][3] + dp[2][3] = 4 + 9</text>
  <text x="60" y="333" font-size="10.5" fill="#888">填表顺序：i 从小到大、j 从小到大（依赖的状态先算好）</text>
  <text x="60" y="353" font-size="10.5" fill="#888">每格基线 = price[i][j]（无报价则 0），再用横切 / 竖切取 max 更新</text>

  <!-- ===== 右：最优切割树 ===== -->
  <text x="685" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">回溯：dp[3][3] = 13 的最优切割树</text>
  <!-- 根 -->
  <g filter="url(#sk)"><rect x="610" y="80" width="110" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="665" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">3×3 → 13</text>
  <!-- 第二层 -->
  <g filter="url(#sk)"><rect x="485" y="148" width="100" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="535" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1×3 卖 4</text>
  <g filter="url(#sk)"><rect x="700" y="148" width="100" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="750" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">2×3 → 9</text>
  <!-- 第三层 -->
  <g filter="url(#sk)"><rect x="615" y="216" width="90" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="660" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2×1 卖 3</text>
  <g filter="url(#sk)"><rect x="740" y="216" width="90" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="785" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">2×2 → 6</text>
  <!-- 第四层 -->
  <g filter="url(#sk)"><rect x="680" y="284" width="90" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="725" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2×1 卖 3</text>
  <g filter="url(#sk)"><rect x="800" y="284" width="90" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="845" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2×1 卖 3</text>
  <!-- 边 + 切法标注 -->
  <path d="M 640 110 Q 570 128 540 146" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="563" y="126" font-size="9.5" fill="#a04a48" font-weight="bold">横切 k=1</text>
  <path d="M 690 110 Q 735 128 748 146" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 725 178 Q 685 196 663 214" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="672" y="200" font-size="9.5" fill="#a04a48" font-weight="bold">竖切 k=1</text>
  <path d="M 775 178 Q 782 196 784 214" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 768 246 Q 745 264 730 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="726" y="268" font-size="9.5" fill="#a04a48" font-weight="bold">竖切 k=1</text>
  <path d="M 802 246 Q 825 264 843 282" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- 合计 -->
  <g filter="url(#sk)"><rect x="500" y="350" width="390" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="695" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">叶子卖出合计：4 + 3 + 3 + 3 = 13 ✓ = dp[3][3]</text>
  <text x="685" y="424" text-anchor="middle" font-size="10.5" fill="#888">内部节点 = 一刀；绿色叶子 = 按报价整块卖出（此例全卖、无丢弃）</text>

  <!-- 左下：反例回顾 -->
  <g filter="url(#sk)"><rect x="60" y="374" width="330" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="225" y="397" text-anchor="middle" font-size="11" fill="#444">单刀视角：整块 10 ≥ 4 + 5 = 9，似乎不该切</text>
  <text x="225" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">递归深挖后 13 ＞ 10 —— 这正是 DP 必要性的最小反例</text>
</svg>
