  <text x="344" y="104" text-anchor="start" font-size="10.5" fill="#8a5a10" font-weight="bold" filter="url(#rough2)">①② 逐行、逐列各扫一遍</text>
  <text x="344" y="128" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">同色连续段长度 ≥ 3</text>
  <text x="344" y="148" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">→ 段内每格都打标记</text>
  <text x="344" y="178" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">③ 全部标记完成后再清零</text>
  <text x="344" y="198" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">→ 这一步才是「同时」</text>
  <text x="344" y="228" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">④ 十字格被标两次也只清一次</text>
  <text x="344" y="258" text-anchor="start" font-size="10.5" fill="#444" filter="url(#rough2)">⑤ 0 表示空格，不参与匹配</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">标记数组 dead 与数值数组 board 分离：清零发生在检测之后，</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">下标不会因「边扫边删」而错位，也不必担心重复消除。</text>
