<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="376" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：cnt = 以当前元素结尾的连续奇数个数</text>
  <path d="M 140 40 Q 320 47 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="452" y="54" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="472" y="66" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">奇数</text>
  <rect x="516" y="54" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="536" y="66" font-size="10.5" fill="#446688" filter="url(#rough2)">偶数</text>

  <!-- ① 连续奇数：cnt 递增 -->
  <text x="70" y="76" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 遇奇数：cnt + 1，逐格累积</text>

  <rect x="70" y="88" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <rect x="132" y="88" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="194" y="88" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">23</text>

  <text x="127" y="170" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+1</text>
  <text x="189" y="170" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+1</text>

  <circle cx="96" cy="174" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="96" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <circle cx="158" cy="174" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="158" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">2</text>
  <circle cx="220" cy="174" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="220" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" filter="url(#rough2)">3</text>

  <text x="172" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt 达 3 ⇒ 返回 true ✓</text>

  <!-- ② 偶数：清零 -->
  <text x="70" y="228" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 遇偶数：cnt 清零，重新计数</text>

  <rect x="70" y="240" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <rect x="132" y="240" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">7</text>
  <rect x="194" y="240" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="256" y="240" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">23</text>

  <path d="M 220 286 L 220 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="302" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">清零</text>

  <text x="127" y="322" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+1</text>
  <text x="251" y="322" font-size="10" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">+1</text>

  <circle cx="96" cy="326" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="96" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <circle cx="158" cy="326" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="158" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">2</text>
  <circle cx="220" cy="326" r="15" fill="#b85450" filter="url(#rough2)"/>
  <text x="220" y="331" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">0</text>
  <circle cx="282" cy="326" r="14" fill="#446688" filter="url(#rough2)"/>
  <text x="282" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>

  <text x="190" y="360" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">跨过偶数的连续奇数段不存在</text>

  <!-- 右侧要点面板 -->
  <rect x="430" y="88" width="182" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">计数器不变量</text>
  <text x="521" y="134" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt = 以当前元素结尾</text>
  <text x="521" y="150" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">的连续奇数（后缀）个数</text>

  <path d="M 521 156 L 521 170" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="430" y="176" width="182" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="521" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">判定条件</text>
  <text x="521" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cnt == 3 ⇒ 返回 true</text>

  <path d="M 521 232 L 521 246" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="430" y="252" width="182" height="68" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="521" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">清零规则</text>
  <text x="521" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">遇偶数：连续段被切断</text>
  <text x="521" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">cnt ← 0，从零重数</text>
</svg>
