<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="510" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：逐列布尔 DP，滚动数组 + 提前终止</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">reach[r] 表示「当前列行 r 是否可达」，ans 维护最后一个非空可达列</text>

  <!-- 开始 -->
  <rect x="90" y="62" width="240" height="34" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">reach ← [true] × m，ans ← 0</text>
  <path d="M210,96 L210,110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="110" y="112" width="200" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="133" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">for c = 1 … n−1</text>
  <path d="M210,144 L210,158" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算新列 -->
  <rect x="30" y="160" width="360" height="78" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="183" text-anchor="middle" font-size="12" fill="#3a5a2e" filter="url(#rough2)">对每个目标行 nr：</text>
  <text x="210" y="202" text-anchor="middle" font-size="12" fill="#3a5a2e" filter="url(#rough2)">nreach[nr] ← ∃ r ∈ {nr−1, nr, nr+1}：</text>
  <text x="210" y="221" text-anchor="middle" font-size="12" fill="#3a5a2e" filter="url(#rough2)">reach[r] 且 grid[nr][c] &gt; grid[r][c−1]</text>
  <path d="M210,238 L210,252" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="210,254 346,294 210,334 74,294" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">nreach</text>
  <text x="210" y="308" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">全为 false ？</text>
  <path d="M346,294 L382,294" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="362" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 提前终止 -->
  <rect x="386" y="268" width="114" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">提前终止</text>
  <text x="443" y="308" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">返回 ans (= c−1)</text>

  <path d="M210,334 L210,350" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="348" font-size="11" fill="#3a5a2e" filter="url(#rough2)">否</text>

  <!-- 回写滚动数组 -->
  <rect x="90" y="352" width="240" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="375" text-anchor="middle" font-size="12.5" fill="#3a5a2e" filter="url(#rough2)">reach ← nreach；ans ← c</text>
  <path d="M210,388 L210,402" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 末列菱形 -->
  <polygon points="210,404 330,440 210,476 90,440" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="445" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">c = n−1 ？</text>
  <path d="M330,440 L362,440" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="432" text-anchor="middle" font-size="11" fill="#3a5a2e" filter="url(#rough2)">是</text>

  <!-- 正常返回 -->
  <rect x="366" y="414" width="114" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="423" y="434" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">返回 ans</text>
  <text x="423" y="454" text-anchor="middle" font-size="11" fill="#3a5a2e" filter="url(#rough2)">(= n−1)</text>

  <!-- 回边 -->
  <path d="M90,440 L46,440 L46,128 L106,128" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="432" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <text x="36" y="288" text-anchor="middle" font-size="10.5" fill="#446688" transform="rotate(-90 36 288)" filter="url(#rough2)">下一列 c+1</text>
</svg>
