<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>
  <text x="22" y="30" font-size="14" fill="#333" filter="url(#rough2)">演算：n = 8, k = 22（自造样例，要求 m = 11）</text>

  <rect x="20" y="46" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="68" font-size="12.5" fill="#333" filter="url(#rough2)">① m = k/2 = 11，检查 7 ≤ 11 ≤ ⌊64/4⌋ = 16 ✓（否则输出 −1）</text>

  <rect x="20" y="84" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="106" font-size="12.5" fill="#333" filter="url(#rough2)">② 解 s：s = 2 的区间是 [8, 12] ∋ 11 ✓（s 个上升段）</text>

  <rect x="20" y="122" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="144" font-size="12.5" fill="#333" filter="url(#rough2)">③ T = m + s(s−1)/2 = 12 是峰的总和，U = T − (n−1) = 5 是其余峰之和</text>

  <rect x="20" y="160" width="580" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="182" font-size="12.5" fill="#333" filter="url(#rough2)">④ 取峰 P = {5, 7}（必含 n−1 = 7，另一个从 [2, 6] 中和为 5）</text>

  <rect x="20" y="198" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="220" font-size="12.5" fill="#333" filter="url(#rough2)">⑤ 谷 V = {0, 1}，内部点 {2,3,4} 挂峰 5、{6} 挂峰 7</text>

  <rect x="20" y="236" width="580" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="258" font-size="12.5" fill="#333" filter="url(#rough2)">⑥ 环排列 0→2→3→4→5→1→6→7→0，m′ = (5−0) + (7−1) = 11 ✓</text>

  <rect x="20" y="274" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="296" font-size="12.5" fill="#333" filter="url(#rough2)">⑦ 位置 0…7 上的标号依次是 1, 6, 2, 3, 4, 5, 7, 8</text>

  <rect x="20" y="312" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="334" font-size="12.5" fill="#333" filter="url(#rough2)">⑧ 相邻位置连边：1−6, 2−6, 2−3, 3−4, 4−5, 5−7, 7−8（共 n−1 = 7 条）</text>

  <rect x="20" y="350" width="580" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="372" font-size="12.5" fill="#333" filter="url(#rough2)">⑨ 校验：2+1+1+1+4+5+1+7 = 22 = k，且 1→2→…→8→1 全部走通 ✓</text>

  <text x="22" y="408" font-size="12" fill="#446688" filter="url(#rough2)">拆开看：2+1+1+1 是上升段 0→5，5 是上升段 1→7，4 与 7 分别是下降段 5→1 与 7→0</text>
</svg>
