<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双指针：度数排序后数「deg 和 &gt; k」的点对（示例 2，k=4）</text>

  <!-- 排序后的度数数组 -->
  <text x="60" y="66" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">排序后 deg：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="50" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="206" y="50" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="50" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="318" y="50" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="374" y="50" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">
    <text x="178" y="76">1</text><text x="234" y="76">3</text><text x="290" y="76">3</text><text x="346" y="76">4</text><text x="402" y="76">5</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="178" y="106">节点 4</text><text x="234" y="106">节点 2</text><text x="290" y="106">节点 3</text><text x="346" y="106">节点 1</text><text x="402" y="106">节点 5</text>
  </g>

  <!-- 步骤演算 -->
  <g filter="url(#rough2)">
    <rect x="40" y="126" width="480" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="40" y="168" width="480" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="40" y="210" width="480" height="42" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="40" y="252" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="52" y="152">① l=0(1), r=4(5)：1+5=6 &gt; 4 → [l, r−1] 共 r−l=4 对都合法，cnt += 4，r−−</text>
    <text x="52" y="194">② l=0(1), r=3(4)：1+4=5 &gt; 4 → cnt += 3，r−−</text>
    <text x="52" y="236">③ l=0(1), r=2(3)：1+3=4 不大于 4 → l++（1 太小，配谁都到不了）</text>
    <text x="52" y="278" fill="#2f5226" font-weight="bold">④ l=1(3), r=2(3)：3+3=6 &gt; 4 → cnt += 1，r−− → l=r 结束，cnt = 4+3+1 = 8</text>
  </g>

  <!-- 双指针指针箭头 -->
  <g filter="url(#rough2)">
    <path d="M 178 118 L 178 98" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 402 118 L 402 98" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="178" y="118" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="402" y="118" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">r</text>

  <!-- 原理说明 -->
  <rect x="40" y="310" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么对 r 一次性记账？</text>
  <text x="56" y="352" font-size="11" fill="#8a6a20" filter="url(#rough2)">排序后若 sd[l]+sd[r] &gt; k，则</text>
  <text x="56" y="370" font-size="11" fill="#8a6a20" filter="url(#rough2)">l..r−1 任何一个配 sd[r] 都 &gt; k。</text>

  <rect x="290" y="310" width="230" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="332" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="306" y="352" font-size="11" fill="#3a4a66" filter="url(#rough2)">排序 O(n log n)，每个查询双指针</text>
  <text x="306" y="370" font-size="11" fill="#3a4a66" filter="url(#rough2)">O(n)；20 个查询绰绰有余。</text>
</svg>
