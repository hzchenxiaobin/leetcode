<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：闭区间二分 [lo, hi]，每轮 O(n) 验证 mid</text>
  <path d="M 180 40 Q 350 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="220" y="54" width="260" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="350" y="75" text-anchor="middle" font-size="11.5" fill="#2e6e2e">lo = 1，hi = max(nums)，ans = hi</text>

  <path d="M 350 88 L 350 102" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1：lo <= hi ? -->
  <g filter="url(#sk)">
    <polygon points="350,106 465,142 350,178 235,142" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="147" text-anchor="middle" font-size="13" fill="#a04348">lo ≤ hi ?</text>

  <!-- 否 → 返回 -->
  <path d="M 465 142 L 497 142" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="481" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04348">否</text>
  <g filter="url(#sk)">
    <rect x="500" y="124" width="130" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="565" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- 是 → mid -->
  <path d="M 350 178 L 350 198" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="362" y="194" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="225" y="202" width="250" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="350" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">mid = lo + (hi − lo) / 2</text>

  <path d="M 350 238 L 350 258" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 2：ops(mid) <= maxOperations ? -->
  <g filter="url(#sk)">
    <polygon points="350,262 510,312 350,362 190,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="317" text-anchor="middle" font-size="12.5" fill="#a04348">ops(mid) ≤ maxOperations ?</text>

  <!-- 是 → 收缩右界 -->
  <path d="M 190 312 L 154 312" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是 ✓</text>
  <g filter="url(#sk)">
    <rect x="22" y="286" width="126" height="58" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <text x="85" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans ← mid</text>
    <text x="85" y="324" text-anchor="middle" font-size="12" fill="#2e6e2e">hi ← mid − 1</text>
    <text x="85" y="339" text-anchor="middle" font-size="10" fill="#4a7a3a">（收缩右界）</text>
  </g>

  <!-- 否 → 放宽限制 -->
  <path d="M 510 312 L 546 312" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="528" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04348">否</text>
  <g filter="url(#sk)">
    <rect x="549" y="286" width="127" height="58" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <text x="612" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">lo ← mid + 1</text>
    <text x="612" y="322" text-anchor="middle" font-size="10.5" fill="#7a5415">操作不够 ⇒</text>
    <text x="612" y="338" text-anchor="middle" font-size="10.5" fill="#7a5415">放宽 x</text>
  </g>

  <!-- 两支汇合回循环头 -->
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 85 344 L 85 400 L 12 400"/>
    <path d="M 612 344 L 612 455 L 12 455"/>
    <path d="M 12 455 L 12 142 L 231 142" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)" fill="#3a3a3a">
    <circle cx="12" cy="400" r="3"/>
    <circle cx="12" cy="455" r="3"/>
  </g>
  <text x="330" y="474" text-anchor="middle" font-size="11.5" fill="#2e6e2e">两支都汇合回到循环头，继续判断 lo ≤ hi（区间每轮至少缩一半，⌈log₂M⌉ 轮终止）</text>

  <!-- 底部说明条 -->
  <g filter="url(#sk)">
    <rect x="30" y="486" width="640" height="58" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="350" y="508" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">check(mid)：ops = 0；对每个 n 累加 ops += (n − 1) / mid（整数除法）</text>
  <text x="350" y="528" text-anchor="middle" font-size="12" fill="#7a5415">ops 必须用 long long（最坏 Σ ≈ 10¹⁴，超 int）；一旦 ops &gt; maxOperations 立即返回 false 剪枝</text>
</svg>
