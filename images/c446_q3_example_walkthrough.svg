<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="81" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [1,2,3,4,5]，k = 3</text>
  <path d="M 160 35 Q 340 42 520 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="56" text-anchor="middle" font-size="11.5" fill="#555">cnt = 以 i 结尾、余数 r 的子数组个数（处理后）；result 为每步累加后</text>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="26" y="66" width="628" height="34" rx="6" fill="#f0ead8" stroke="#b8a86a" stroke-width="1.3"/>
  </g>
  <text x="52" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">i</text>
  <text x="106" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">nums[i]</text>
  <text x="168" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">v</text>
  <text x="278" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">迁移（延伸 + 新段）</text>
  <text x="415" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">cnt [r0 r1 r2]</text>
  <text x="570" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4e1a">result [r0 r1 r2]</text>

  <!-- 行分隔线 -->
  <path d="M 26 108 L 654 108" stroke="#d8d2c0" stroke-width="1" filter="url(#sk)"/>

  <!-- 行 0 -->
  <text x="52" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b">0</text>
  <text x="106" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b">1</text>
  <text x="168" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b">1</text>
  <text x="278" y="125" text-anchor="middle" font-size="11" fill="#2e6e2e">旧桶全空；新起 [0..0]</text>
  <text x="278" y="140" text-anchor="middle" font-size="10.5" fill="#2e6e2e">nxt[1] += 1</text>
  <g filter="url(#sk)">
    <rect x="382" y="112" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="397" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="416" y="112" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="431" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <g filter="url(#sk)">
    <rect x="450" y="112" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="465" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="536" y="112" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="551" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="570" y="112" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="585" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <g filter="url(#sk)">
    <rect x="604" y="112" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="619" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <path d="M 26 148 L 654 148" stroke="#e4dfcf" stroke-width="1" filter="url(#sk)"/>

  <!-- 行 1 -->
  <text x="52" y="172" text-anchor="middle" font-size="12.5" fill="#2b2b2b">1</text>
  <text x="106" y="172" text-anchor="middle" font-size="12.5" fill="#2b2b2b">2</text>
  <text x="168" y="172" text-anchor="middle" font-size="12.5" fill="#2b2b2b">2</text>
  <text x="278" y="165" text-anchor="middle" font-size="11" fill="#555">延伸：r=1（1 个）→ (1·2) mod 3 = 2</text>
  <text x="278" y="180" text-anchor="middle" font-size="10.5" fill="#2e6e2e">新起 [1..1]：nxt[2] += 1</text>
  <g filter="url(#sk)">
    <rect x="382" y="152" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="397" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="416" y="152" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="431" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="450" y="152" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="465" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="536" y="152" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="551" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="570" y="152" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="585" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <g filter="url(#sk)">
    <rect x="604" y="152" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="619" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <path d="M 26 188 L 654 188" stroke="#e4dfcf" stroke-width="1" filter="url(#sk)"/>

  <!-- 行 2（高亮 v=0） -->
  <g filter="url(#sk)">
    <rect x="26" y="192" width="628" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="52" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a">2</text>
  <text x="106" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a">3</text>
  <text x="168" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">0</text>
  <text x="278" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">v = 0！延伸：r=2（2 个）→ 0</text>
  <text x="278" y="223" text-anchor="middle" font-size="10.5" fill="#2e6e2e">新起 [2..2]：nxt[0] += 1</text>
  <g filter="url(#sk)">
    <rect x="382" y="192" width="30" height="30" rx="4" fill="#fde2e2" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="397" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">3</text>
  <g filter="url(#sk)">
    <rect x="416" y="192" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="431" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="450" y="192" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="465" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="536" y="192" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="551" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <g filter="url(#sk)">
    <rect x="570" y="192" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="585" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <g filter="url(#sk)">
    <rect x="604" y="192" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="619" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <path d="M 26 232 L 654 232" stroke="#e4dfcf" stroke-width="1" filter="url(#sk)"/>

  <!-- 行 3 -->
  <text x="52" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b">3</text>
  <text x="106" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b">4</text>
  <text x="168" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b">1</text>
  <text x="278" y="249" text-anchor="middle" font-size="11" fill="#555">延伸：r=0（3 个）→ 0（钉死在 0）</text>
  <text x="278" y="264" text-anchor="middle" font-size="10.5" fill="#2e6e2e">新起 [3..3]：nxt[1] += 1</text>
  <g filter="url(#sk)">
    <rect x="382" y="236" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="397" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <g filter="url(#sk)">
    <rect x="416" y="236" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="431" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <g filter="url(#sk)">
    <rect x="450" y="236" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="465" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="536" y="236" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="551" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">6</text>
  <g filter="url(#sk)">
    <rect x="570" y="236" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="585" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="604" y="236" width="30" height="30" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="619" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <path d="M 26 272 L 654 272" stroke="#e4dfcf" stroke-width="1" filter="url(#sk)"/>

  <!-- 行 4 -->
  <text x="52" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b">4</text>
  <text x="106" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b">5</text>
  <text x="168" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b">2</text>
  <text x="278" y="289" text-anchor="middle" font-size="11" fill="#555">延伸：r=0（3 个）→ 0；r=1（1 个）→ 2</text>
  <text x="278" y="304" text-anchor="middle" font-size="10.5" fill="#2e6e2e">新起 [4..4]：nxt[2] += 1</text>
  <g filter="url(#sk)">
    <rect x="382" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="397" y="296" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <g filter="url(#sk)">
    <rect x="416" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="431" y="296" text-anchor="middle" font-size="12" fill="#2b2b2b">0</text>
  <g filter="url(#sk)">
    <rect x="450" y="276" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="465" y="296" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="536" y="276" width="98" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="551" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">9</text>
  <text x="585" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="619" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="585" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓ 与期望输出 [9, 2, 4] 一致</text>

  <!-- 底部两个说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="292" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="186" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">i = 2（v = 0）之后：</text>
  <text x="186" y="388" text-anchor="middle" font-size="11" fill="#b03a3a">所有跨越 nums[2] = 3 的子数组</text>
  <text x="186" y="406" text-anchor="middle" font-size="11" fill="#b03a3a">余数被「钉死」在 0，再不翻身。</text>
  <text x="186" y="424" text-anchor="middle" font-size="11" fill="#b03a3a">起点 3 × 终点 3 = 9 个 = result[0]</text>

  <g filter="url(#sk)">
    <rect x="348" y="344" width="292" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="494" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">对账（不自检翻车的最快手段）</text>
  <text x="494" y="388" text-anchor="middle" font-size="11" fill="#2e6e2e">Σ result[x] = 9 + 2 + 4 = 15</text>
  <text x="494" y="406" text-anchor="middle" font-size="11" fill="#2e6e2e">= n(n+1)/2 = 5·6/2</text>
  <text x="494" y="424" text-anchor="middle" font-size="11" fill="#2e6e2e">每个子数组恰好被数一次</text>

  <text x="340" y="462" text-anchor="middle" font-size="10.5" fill="#888">注意：k = 3 是素数，非零余数相乘不归零；k 为合数时（如 mod 4 下 2×2）非零余数也会跌进 0 桶</text>
</svg>
