<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">交换论证：最左命中 i 完胜更右的命中 j</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Strip A: swap at i -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#2e6e2e">换 i（最左命中）</text>
  <g filter="url(#sk)">
    <rect x="120" y="84" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="164" y="84" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="208" y="84" width="40" height="40" rx="4" fill="#f4f4f0" stroke="#b0b0a8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="252" y="84" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="300" y="84" width="44" height="40" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <rect x="348" y="84" width="44" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="140" y="110" text-anchor="middle" font-size="12" fill="#5a5a5a">s[0]</text>
  <text x="184" y="110" text-anchor="middle" font-size="12" fill="#5a5a5a">s[1]</text>
  <text x="228" y="110" text-anchor="middle" font-size="14" fill="#8a8a80">⋯</text>
  <text x="272" y="110" text-anchor="middle" font-size="11" fill="#5a5a5a">s[i-1]</text>
  <text x="322" y="110" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="bold">s[i+1]</text>
  <text x="370" y="110" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">s[i]</text>
  <text x="412" y="110" font-size="14" fill="#8a8a80">⋯⋯</text>
  <text x="322" y="138" text-anchor="middle" font-size="10" fill="#2e6e2e">位置 i 变小</text>
  <g filter="url(#sk)">
    <path d="M 120 132 Q 196 142 292 132" stroke="#4a8e4a" stroke-width="1.4" fill="none"/>
  </g>
  <text x="196" y="152" text-anchor="middle" font-size="11" fill="#2e6e2e">前缀 s[0..i-1] 原封不动</text>

  <!-- comparison -->
  <g filter="url(#sk)">
    <path d="M 322 160 L 322 216" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4"/>
  </g>
  <text x="345" y="180" font-size="12" font-weight="bold" fill="#b85450">同一个位置 i：</text>
  <text x="345" y="198" font-size="12" fill="#b85450">上面是 s[i+1]，下面仍是 s[i]</text>
  <text x="345" y="216" font-size="12" font-weight="bold" fill="#2e6e2e">s[i+1] &lt; s[i] ⟹ 换 i 的串严格更小</text>

  <!-- Strip B: swap at j -->
  <text x="60" y="248" font-size="13" font-weight="bold" fill="#2b6e9e">换 j（更右命中，j &gt; i）</text>
  <g filter="url(#sk)">
    <rect x="120" y="260" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="164" y="260" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="208" y="260" width="40" height="40" rx="4" fill="#f4f4f0" stroke="#b0b0a8" stroke-width="1.2" stroke-dasharray="4,3"/>
    <rect x="252" y="260" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa89a" stroke-width="1.2"/>
    <rect x="300" y="260" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="348" y="260" width="44" height="40" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="140" y="286" text-anchor="middle" font-size="12" fill="#5a5a5a">s[0]</text>
  <text x="184" y="286" text-anchor="middle" font-size="12" fill="#5a5a5a">s[1]</text>
  <text x="228" y="286" text-anchor="middle" font-size="14" fill="#8a8a80">⋯</text>
  <text x="272" y="286" text-anchor="middle" font-size="11" fill="#5a5a5a">s[i-1]</text>
  <text x="322" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">s[i]</text>
  <text x="370" y="286" text-anchor="middle" font-size="11" fill="#b85450">s[i+1]</text>
  <text x="412" y="286" font-size="14" fill="#8a8a80">⋯⋯</text>
  <text x="322" y="314" text-anchor="middle" font-size="10" fill="#b85450">位置 i 仍是大值</text>
  <g filter="url(#sk)">
    <path d="M 120 308 Q 196 318 292 308" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>
  <text x="196" y="328" text-anchor="middle" font-size="11" fill="#2b6e9e">前缀 s[0..i-1] 与上面完全相同</text>

  <!-- Bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">多个命中并存时换最左的：更靠左的首个差异，压倒一切更靠右的选择</text>
</svg>
