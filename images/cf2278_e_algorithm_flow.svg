<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="268" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：取反 → 排序 → 分成 −/+ 两段</text>
  <path d="M 96 42 Q 268 48 440 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="48" y="56" width="440" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="84" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1. 读入 n 与 a_1 … a_n（多测循环，逐组独立）</text>

  <path d="M 268 102 L 268 122" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="124" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="152" text-anchor="middle" font-size="13" fill="#2f5d22" filter="url(#rough2)">2. b_i = (−1)^(i−1) · a_i ：奇数位保留，偶数位取反</text>

  <path d="M 268 170 L 268 190" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="192" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="220" text-anchor="middle" font-size="13" fill="#2f5d22" filter="url(#rough2)">3. 把 b 升序排序（只有大小关系重要）</text>

  <path d="M 268 238 L 268 258" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="260" width="440" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="282" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">4. o = ⌊n/2⌋ 个最小的 b 放到系数 −1 的偶位</text>
  <text x="268" y="302" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">其余 e = ⌈n/2⌉ 个放到系数 +1 的奇位</text>

  <path d="M 268 314 L 268 332" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="334" width="440" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="268" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">5. 输出 Σ_{i&gt;o} b_(i) − Σ_{i≤o} b_(i)</text>

  <rect x="514" y="56" width="250" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="526" y="78" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么可以任意重排？</text>
  <text x="526" y="98" font-size="11" fill="#446688" filter="url(#rough2)">令牌换位只依赖相邻对，冒泡</text>
  <text x="526" y="116" font-size="11" fill="#446688" filter="url(#rough2)">排序可造出任意排列，符号被强制</text>

  <rect x="514" y="192" width="250" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="526" y="214" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么取最小的 o 个？</text>
  <text x="526" y="234" font-size="11" fill="#8a6015" filter="url(#rough2)">交换论证：若 −1 位上的值比某</text>
  <text x="526" y="252" font-size="11" fill="#8a6015" filter="url(#rough2)">个 +1 位上的值还大，对调这两位</text>
  <text x="526" y="270" font-size="11" fill="#8a6015" filter="url(#rough2)">中较优者，和严格变大。</text>
  <text x="526" y="292" font-size="11" fill="#8a6015" filter="url(#rough2)">故最优一定把最小的放 −1 位。</text>

  <text x="48" y="404" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序后的 b（示意，o = 3）：</text>

  <rect x="252" y="388" width="56" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">b₁</text>
  <rect x="316" y="388" width="56" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="408" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">b₂</text>
  <rect x="380" y="388" width="56" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="408" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">b₃</text>
  <rect x="444" y="388" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="408" text-anchor="middle" font-size="11" fill="#2f5d22" filter="url(#rough2)">b₄</text>
  <rect x="508" y="388" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="408" text-anchor="middle" font-size="11" fill="#2f5d22" filter="url(#rough2)">b₅</text>
  <rect x="572" y="388" width="56" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600" y="408" text-anchor="middle" font-size="11" fill="#2f5d22" filter="url(#rough2)">b₆</text>

  <text x="280" y="432" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">系数 −1</text>
  <text x="536" y="432" text-anchor="middle" font-size="10.5" fill="#2f5d22" filter="url(#rough2)">系数 +1</text>
  <path d="M 440 384 L 440 420" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="656" y="410" font-size="11" fill="#8a6015" filter="url(#rough2)">切点 = ⌊n/2⌋</text>
</svg>
