<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">终止性：状态集合单调增长且被 343 个格点卡住</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">一旦某一代「没有新点」，集合永久封闭 → 目标不可能再出现</text>
  <rect x="30" y="76" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">S₀ ⊆ S₁ ⊆ S₂ ⊆ ⋯ ⊆ { (x,y,z) : 0 ≤ x,y,z ≤ 6 }，共 343 个点</text>
  <rect x="44" y="132" width="472" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <rect x="44" y="132" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="294" y="155" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">|S| 单调不减</text>
  <text x="516" y="126" text-anchor="end" font-size="9.5" fill="#888">343</text>
  <text x="44" y="186" text-anchor="start" font-size="9.5" fill="#888">0</text>
  <rect x="44" y="208" width="472" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">每代：枚举当前集合的全部点对</text>
  <text x="280" y="242" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">c = floor((a+b)/2) 逐坐标取平均</text>
  <rect x="44" y="264" width="472" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">去掉已在集合里的点</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">得到「新点」集合 fresh</text>
  <rect x="44" y="320" width="472" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">fresh 为空 → 返回 -1</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">fresh 含 target → 返回当前代数</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">因此循环次数 ≤ 343，每代最多 343²/2 次配对，整体不到 10^8 但实际远小于此</text>
</svg>
