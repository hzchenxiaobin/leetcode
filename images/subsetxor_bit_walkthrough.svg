<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">按位演算：nums = [5, 1, 6] → ans = 28</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: binary grid -->
  <text x="60" y="68" font-size="13" font-weight="bold" fill="#2b6e9e">二进制对齐</text>
  <text x="122" y="88" text-anchor="middle" font-size="11" fill="#888">bit2</text>
  <text x="166" y="88" text-anchor="middle" font-size="11" fill="#888">bit1</text>
  <text x="210" y="88" text-anchor="middle" font-size="11" fill="#888">bit0</text>

  <g filter="url(#sk)">
    <rect x="102" y="96" width="40" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="146" y="96" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="190" y="96" width="40" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="88" y="113" text-anchor="end" font-size="12" fill="#333" font-weight="bold">5 =</text>
  <text x="122" y="113" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="166" y="113" text-anchor="middle" font-size="12" fill="#4a8edb">0</text>
  <text x="210" y="113" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>

  <g filter="url(#sk)">
    <rect x="102" y="128" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="146" y="128" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="190" y="128" width="40" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="88" y="145" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1 =</text>
  <text x="122" y="145" text-anchor="middle" font-size="12" fill="#4a8edb">0</text>
  <text x="166" y="145" text-anchor="middle" font-size="12" fill="#4a8edb">0</text>
  <text x="210" y="145" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>

  <g filter="url(#sk)">
    <rect x="102" y="160" width="40" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="146" y="160" width="40" height="26" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="190" y="160" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="88" y="177" text-anchor="end" font-size="12" fill="#333" font-weight="bold">6 =</text>
  <text x="122" y="177" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="166" y="177" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">1</text>
  <text x="210" y="177" text-anchor="middle" font-size="12" fill="#4a8edb">0</text>

  <g filter="url(#sk)">
    <rect x="102" y="192" width="128" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="88" y="209" text-anchor="end" font-size="12" fill="#8a6415" font-weight="bold">OR =</text>
  <text x="166" y="209" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">1 1 1 → 7</text>

  <text x="166" y="244" text-anchor="middle" font-size="11" fill="#555">只要某位在至少一个元素中为 1，</text>
  <text x="166" y="260" text-anchor="middle" font-size="11" fill="#555">它就进入 OR，并在一半子集中点亮</text>

  <!-- Right: contribution table -->
  <text x="435" y="68" font-size="13" font-weight="bold" fill="#2e6e2e">每位贡献（点亮子集数 × 位权）</text>
  <g filter="url(#sk)">
    <rect x="270" y="78" width="330" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="300" y="95" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">位（权值）</text>
  <text x="385" y="95" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">谁拥有</text>
  <text x="475" y="95" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">点亮子集数</text>
  <text x="565" y="95" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">贡献</text>

  <g filter="url(#sk)">
    <rect x="270" y="108" width="330" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="300" y="125" text-anchor="middle" font-size="12" fill="#333">bit2（4）</text>
  <text x="385" y="125" text-anchor="middle" font-size="12" fill="#333">仅 6</text>
  <text x="475" y="125" text-anchor="middle" font-size="12" fill="#333">2² = 4</text>
  <text x="565" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4 × 4 = 16</text>

  <g filter="url(#sk)">
    <rect x="270" y="138" width="330" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="300" y="155" text-anchor="middle" font-size="12" fill="#333">bit1（2）</text>
  <text x="385" y="155" text-anchor="middle" font-size="12" fill="#333">5、6</text>
  <text x="475" y="155" text-anchor="middle" font-size="12" fill="#333">2² = 4</text>
  <text x="565" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2 × 4 = 8</text>

  <g filter="url(#sk)">
    <rect x="270" y="168" width="330" height="26" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="300" y="185" text-anchor="middle" font-size="12" fill="#333">bit0（1）</text>
  <text x="385" y="185" text-anchor="middle" font-size="12" fill="#333">5、1</text>
  <text x="475" y="185" text-anchor="middle" font-size="12" fill="#333">2² = 4</text>
  <text x="565" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1 × 4 = 4</text>

  <g filter="url(#sk)">
    <rect x="270" y="198" width="330" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="385" y="216" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">合计</text>
  <text x="565" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">16 + 8 + 4 = 28</text>

  <!-- Bottom: formula check -->
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#555">枚举复核：8 个子集的异或值 0 + 5 + 1 + 6 + 4 + 3 + 7 + 2 = 28 ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="282" width="560" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">ans = OR(nums) × 2ⁿ⁻¹ = 7 × 2³⁻¹ = 7 × 4 = 28</text>
  <text x="320" y="324" text-anchor="middle" font-size="11" fill="#2b6e9e">与逐子集枚举、按位贡献两条路径三方一致 —— 赛时交叉验证的意义</text>
</svg>
