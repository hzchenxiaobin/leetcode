<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">降序排序 + 回溯 + 三条剪枝</text>

  <rect x="90" y="46" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="73" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">sum % 4 ≠ 0 或 max(a) &gt; target → 直接 false</text>
  <path d="M 280 90 L 280 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="112" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="139" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">火柴降序排序；side[0..3] 全置 0，进入 dfs(0)</text>
  <path d="M 280 156 L 280 174" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="178" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="201" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">dfs(i)：把第 i 根火柴放进某条边</text>
  <text x="280" y="221" font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">k = 0, 1, 2, 3 依次尝试</text>
  <path d="M 280 234 L 280 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="256" width="210" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="160" y="278" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">剪枝①：side[k] + a[i]</text>
  <text x="160" y="297" font-size="10.5" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">超过 target → 跳过</text>

  <rect x="295" y="256" width="210" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="400" y="278" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">剪枝②：k &gt; 0 且两者剩余</text>
  <text x="400" y="297" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">容量相同 → 跳过（对称）</text>

  <path d="M 280 316 L 280 334" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="338" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="365" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">side[k] += a[i] → dfs(i+1)；失败则撤回 side[k]</text>
  <path d="M 280 382 L 280 400" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="404" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="425" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">i == n → true（容量约束 ⇒ 四条边都恰好 target）</text>
  <text x="280" y="443" font-size="10.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">四个 k 都失败 → 返回 false 并回溯</text>
</svg>
