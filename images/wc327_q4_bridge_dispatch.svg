<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="16" y="26" font-size="18" font-weight="bold" fill="#2b2b2b">桥口调度：桥每次空闲，做一次决策</text>
  <path d="M 14 34 Q 180 44 350 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="200" y="44" width="240" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <path d="M 320 82 L 320 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">桥空闲（arrived = n 则结束）</text>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="320,114 462,152 320,190 178,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 464 152 L 488 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 192 L 320 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">wait_right 非空？</text>
  <text x="320" y="166" text-anchor="middle" font-size="10.5" fill="#8a6415">右岸有已搬箱的工人？</text>
  <text x="477" y="144" font-size="11" fill="#555555">是</text>
  <text x="328" y="210" font-size="11" fill="#555555">否</text>

  <!-- R->L action -->
  <g filter="url(#sk)">
    <rect x="492" y="112" width="136" height="80" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 560 110 L 560 63 L 444 63" stroke="#888888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  </g>
  <text x="560" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">效率最低者过桥 R→L</text>
  <text x="560" y="147" text-anchor="middle" font-size="11" fill="#8a6415">cur += left_w</text>
  <text x="560" y="163" text-anchor="middle" font-size="11" fill="#8a6415">ans = cur；arrived++</text>
  <text x="560" y="181" text-anchor="middle" font-size="10" fill="#8a6415">入 workL（cur + put）</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="320,224 462,262 320,300 178,262" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <path d="M 176 262 L 164 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 302 L 320 334" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">wait_left 非空</text>
  <text x="320" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">且 picked &lt; n ？</text>
  <text x="171" y="254" font-size="11" fill="#555555">是</text>
  <text x="328" y="322" font-size="11" fill="#555555">否</text>

  <!-- L->R action -->
  <g filter="url(#sk)">
    <rect x="14" y="222" width="146" height="80" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <path d="M 87 220 L 87 63 L 196 63" stroke="#888888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  </g>
  <text x="87" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">效率最低者过桥 L→R</text>
  <text x="87" y="257" text-anchor="middle" font-size="11" fill="#2b6e9e">cur += right_w</text>
  <text x="87" y="273" text-anchor="middle" font-size="10.5" fill="#2b6e9e">picked++（达 n 后不再派）</text>
  <text x="87" y="291" text-anchor="middle" font-size="10" fill="#2b6e9e">入 workR（cur + pick）</text>

  <!-- fast forward -->
  <g filter="url(#sk)">
    <rect x="196" y="338" width="248" height="80" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 320 420 L 320 446 L 636 446 L 636 22 L 420 22 L 420 40" stroke="#888888" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">快进时钟（桥口无就绪工人）</text>
  <text x="320" y="380" text-anchor="middle" font-size="11" fill="#b85450">cur = max(cur, min(workL 顶, workR 顶))</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#b85450">收集 finish ≤ cur 的工人回 wait 集合</text>
  <text x="320" y="412" text-anchor="middle" font-size="10" fill="#888888">随后回到顶部重新决策</text>
  <text x="500" y="440" text-anchor="middle" font-size="10" fill="#888888">过桥 / 快进之后，回到「桥空闲」</text>

  <!-- efficiency callout -->
  <g filter="url(#sk)">
    <rect x="14" y="338" width="168" height="80" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="98" y="358" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">效率 eff(i) =</text>
  <text x="98" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">left_i + right_i</text>
  <text x="98" y="390" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">（pick / put 不参与！）</text>
  <text x="98" y="406" text-anchor="middle" font-size="10" fill="#888888">和越大越低效；平局 i 大者低</text>
</svg>
