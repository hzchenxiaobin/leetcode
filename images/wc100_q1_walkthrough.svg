<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">三个示例的判定过程</text>
  <rect x="40" y="64" width="145" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112.5" y="85.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">数组</text>
  <rect x="200" y="64" width="175" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287.5" y="85.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">相邻比较</text>
  <rect x="390" y="64" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="85.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">标志</text>
  <rect x="560" y="64" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620.0" y="85.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">结果</text>
  <rect x="40" y="112" width="145" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112.5" y="135.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[1,2,2,3]</text>
  <rect x="200" y="112" width="175" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287.5" y="135.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1≤2, 2≤2, 2≤3</text>
  <rect x="390" y="112" width="155" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="135.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">inc=true, dec=false</text>
  <rect x="560" y="112" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620.0" y="137.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">true</text>
  <rect x="40" y="170" width="145" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112.5" y="193.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[6,5,4,4]</text>
  <rect x="200" y="170" width="175" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287.5" y="193.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">6≥5, 5≥4, 4≥4</text>
  <rect x="390" y="170" width="155" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="193.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">inc=false, dec=true</text>
  <rect x="560" y="170" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620.0" y="195.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">true</text>
  <rect x="40" y="228" width="145" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112.5" y="251.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[1,3,2]</text>
  <rect x="200" y="228" width="175" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287.5" y="251.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1&lt;3 上升, 3&gt;2 下降</text>
  <rect x="390" y="228" width="155" height="40" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="251.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">inc=false, dec=false</text>
  <rect x="560" y="228" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620.0" y="253.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">false</text>
  <text x="350" y="310" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">「非递增」也满足「非递减」？不——两者是独立的两个条件，满足任一即可</text>
</svg>
