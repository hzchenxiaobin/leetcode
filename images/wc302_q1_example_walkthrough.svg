<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,3,2,1,3,2,2]</text>

  <!-- step 1: scan and count -->
  <rect x="36" y="42" width="488" height="120" rx="12" fill="#f0f6fc" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54" y="66" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 步 · 一次扫描，频次入表</text>

  <!-- little cells being scanned -->
  <rect x="54" y="80" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="86" y="80" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="102" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="118" y="80" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="134" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="80" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="80" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="198" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="80" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="246" y="80" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- counting table -->
  <rect x="330" y="76" width="176" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="96" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt（哈希表）</text>
  <text x="418" y="116" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 → 2　　3 → 2</text>
  <text x="418" y="136" text-anchor="middle" font-size="11.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">2 → 3</text>

  <path d="M 284 98 L 322 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="140" font-size="10.5" fill="#888" filter="url(#rough2)">扫完 7 个元素，cnt 就绪</text>

  <!-- step 2: pairing -->
  <rect x="36" y="178" width="488" height="120" rx="12" fill="#f0f9f1" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54" y="202" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 步 · 每组两两配对</text>

  <!-- value 1 pair -->
  <rect x="54" y="216" width="150" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="129" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">值 1：●●</text>
  <text x="129" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊2/2⌋ = 1 对</text>
  <text x="129" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">剩余 0 个</text>

  <!-- value 3 pair -->
  <rect x="214" y="216" width="150" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="289" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">值 3：●●</text>
  <text x="289" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊2/2⌋ = 1 对</text>
  <text x="289" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">剩余 0 个</text>

  <!-- value 2 pair -->
  <rect x="374" y="216" width="150" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="449" y="238" text-anchor="middle" font-size="12" fill="#a08030" font-weight="bold" filter="url(#rough2)">值 2：●●● ⭐</text>
  <text x="449" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⌊3/2⌋ = 1 对</text>
  <text x="449" y="275" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">剩余 1 个（孤儿）</text>

  <!-- step 3: result -->
  <path d="M 280 302 V 318" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="330" width="380" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">pairs = 1+1+1 = 3；leftover = 7 − 2×3 = 1</text>
  <text x="280" y="372" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer = [3, 1] ✓</text>
</svg>
