<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="450" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">单个分叉点：给 ≤ 10 棵子树排序 —— 加权锦标赛上的最小反馈弧</text>

  <!-- ===================== 左上：分叉点与三棵子树 ===================== -->
  <ellipse cx="70" cy="86" rx="26" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="91" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">z</text>

  <path d="M96,80 L148,58" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M96,86 L148,86" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M96,92 L148,114" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="152" y="42" width="128" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="62" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">子树A：{2, 4, 9}</text>
  <rect x="152" y="82" width="128" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="102" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">子树B：{1, 6, 8}</text>
  <rect x="152" y="122" width="128" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="142" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">子树C：{3, 5, 7}</text>

  <text x="216" y="172" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">三棵子树各含 3 个标记（括号为 pos 值），</text>
  <text x="216" y="188" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">z 处的顺序 = 三段连续区间的排列</text>

  <!-- ===================== 左下：cost 矩阵 ===================== -->
  <text x="130" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cost(行先于列) = #{x ∈ 行, y ∈ 列 : pos[x] &gt; pos[y]}</text>

  <rect x="60" y="228" width="52" height="30" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="248" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">先\后</text>
  <rect x="112" y="228" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="248" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="164" y="228" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="248" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="216" y="228" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="248" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>

  <rect x="60" y="258" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="278" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="112" y="258" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="278" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="164" y="258" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="216" y="258" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>

  <rect x="60" y="288" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="308" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="112" y="288" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="164" y="288" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="308" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="216" y="288" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>

  <rect x="60" y="318" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="338" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="112" y="318" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="338" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="164" y="318" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="338" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="216" y="318" width="52" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="242" y="338" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>

  <text x="164" y="372" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">互补关系：cost(i,j) + cost(j,i) = 3 × 3 = 9</text>

  <!-- ===================== 右上：偏好成环 ===================== -->
  <rect x="352" y="40" width="304" height="158" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="504" y="62" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">两两偏好成环（非传递骰子）</text>

  <!-- 三角：箭头 X → Y 表示 “Y 更该排在 X 前” -->
  <ellipse cx="420" cy="92" rx="17" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="97" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <ellipse cx="588" cy="92" rx="17" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="588" y="97" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">B</text>
  <ellipse cx="504" cy="160" rx="17" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="504" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>

  <path d="M440,86 L566,86" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="504" y="80" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">B 先更省：4 &lt; 5</text>
  <path d="M582,106 L522,148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="576" y="136" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">C 先更省：3 &lt; 6</text>
  <path d="M486,148 L428,108" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="428" y="136" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">A 先更省：4 &lt; 5</text>

  <!-- 右下：最优排序 -->
  <rect x="352" y="214" width="304" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="504" y="238" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">最优排序：A, C, B（或 C, B, A）</text>
  <text x="504" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">代价 = cost(A→C) + cost(A→B) + cost(C→B) = 4 + 5 + 3 = 12</text>
  <text x="504" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两个最优解都至少违反一条两两偏好</text>
  <text x="504" y="300" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 贪心 / 相邻交换排序失效，必须状压 DP</text>

  <!-- 底部：状压 DP -->
  <rect x="30" y="338" width="620" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="362" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">子集 DP：dp[S] = 已把 S 中的子树整体放在最前的最小代价</text>
  <text x="340" y="386" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[S ∪ {i}] = dp[S] + Σ_{j∈S} cost[j][i]，末位新增只与已放集合有关</text>
  <text x="340" y="410" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">单个分叉点 O(2^k · k)；字母表恰为 'a' ~ 'j' 共 10 个字母 → k ≤ 10</text>
  <text x="340" y="428" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">状压的钥匙就藏在题面里：2¹⁰ × 10 ≈ 10⁴，枚举 10! ≈ 3.6×10⁶ 则不可行</text>
</svg>
