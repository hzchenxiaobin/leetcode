<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：candiesCount = [7,4,5,3,8]，s = [0,7,11,16,19,27]</text>
  <path d="M 100 38 Q 320 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- position strip -->
  <g filter="url(#sk)"><rect x="55" y="52" width="81" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="95" y="67" text-anchor="middle" font-size="10.5" fill="#2b6e9e">类型 0</text>
  <text x="95" y="81" text-anchor="middle" font-size="10" fill="#2b6e9e">1~7</text>
  <g filter="url(#sk)"><rect x="141" y="52" width="46" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="164" y="67" text-anchor="middle" font-size="10.5" fill="#2b6e9e">类型 1</text>
  <text x="164" y="81" text-anchor="middle" font-size="10" fill="#2b6e9e">8~11</text>
  <g filter="url(#sk)"><rect x="192" y="52" width="58" height="36" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="221" y="67" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a06b1a">类型 t=2</text>
  <text x="221" y="81" text-anchor="middle" font-size="10" fill="#a06b1a">12~16</text>
  <g filter="url(#sk)"><rect x="255" y="52" width="34" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="272" y="67" text-anchor="middle" font-size="10.5" fill="#2b6e9e">类型 3</text>
  <text x="272" y="81" text-anchor="middle" font-size="10" fill="#2b6e9e">17~19</text>
  <g filter="url(#sk)"><rect x="294" y="52" width="92" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="340" y="67" text-anchor="middle" font-size="10.5" fill="#2b6e9e">类型 4</text>
  <text x="340" y="81" text-anchor="middle" font-size="10" fill="#2b6e9e">20~27</text>
  <text x="404" y="66" text-anchor="start" font-size="10.5" fill="#a06b1a">查询对象 t=2：全局第 12~16 颗</text>
  <text x="404" y="84" text-anchor="start" font-size="10.5" fill="#888">每天 1 颗时恰占第 11~15 天</text>

  <!-- row backgrounds -->
  <g filter="url(#sk)"><rect x="50" y="132" width="540" height="36" rx="3" fill="#eaf6ee"/></g>
  <g filter="url(#sk)"><rect x="50" y="168" width="540" height="36" rx="3" fill="#fce4ec"/></g>
  <g filter="url(#sk)"><rect x="50" y="204" width="540" height="36" rx="3" fill="#eaf6ee"/></g>

  <!-- table grid -->
  <g filter="url(#sk)"><rect x="50" y="104" width="540" height="144" fill="none" stroke="#b0b0b0" stroke-width="1.4" rx="4"/></g>
  <path d="M 50 132 L 590 132" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 168 L 590 168" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 50 204 L 590 204" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 185 104 L 185 248" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 320 104 L 320 248" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 455 104 L 455 248" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>
  <path d="M 515 104 L 515 248" stroke="#b0b0b0" stroke-width="1.1" filter="url(#sk)"/>

  <!-- header -->
  <text x="117" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">查询 [t, d, cap]</text>
  <text x="252" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">最早天 ⌊s[t]/cap⌋</text>
  <text x="387" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">最晚天 s[t+1]−1</text>
  <text x="485" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">d 落点</text>
  <text x="552" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">结果</text>

  <!-- rows -->
  <text x="117" y="154" text-anchor="middle" font-size="11.5" fill="#555">[0, 2, 2]</text>
  <text x="252" y="154" text-anchor="middle" font-size="11.5" fill="#555">⌊0/2⌋ = 0</text>
  <text x="387" y="154" text-anchor="middle" font-size="11.5" fill="#555">7 − 1 = 6</text>
  <text x="485" y="154" text-anchor="middle" font-size="11" fill="#2e6e2e">0≤2≤6 ✓</text>
  <text x="552" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">true</text>

  <text x="117" y="190" text-anchor="middle" font-size="11.5" fill="#555">[4, 2, 4]</text>
  <text x="252" y="190" text-anchor="middle" font-size="11.5" fill="#555">⌊19/4⌋ = 4</text>
  <text x="387" y="190" text-anchor="middle" font-size="11.5" fill="#555">27 − 1 = 26</text>
  <text x="485" y="190" text-anchor="middle" font-size="11" fill="#b03a3a">2 &lt; 4 太早 ✗</text>
  <text x="552" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">false</text>

  <text x="117" y="226" text-anchor="middle" font-size="11.5" fill="#555">[2, 13, 10⁹]</text>
  <text x="252" y="226" text-anchor="middle" font-size="11.5" fill="#555">⌊16/10⁹⌋ = 0</text>
  <text x="387" y="226" text-anchor="middle" font-size="11.5" fill="#555">16 − 1 = 15</text>
  <text x="485" y="226" text-anchor="middle" font-size="11" fill="#2e6e2e">0≤13≤15 ✓</text>
  <text x="552" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">true</text>

  <!-- intuitive explanations -->
  <text x="60" y="268" text-anchor="start" font-size="11" fill="#2e6e2e">① 前两天各吃 2 颗也才吃 5 颗，第 2 天仍在类型 0（第 1~7 颗）里 → true</text>
  <text x="60" y="290" text-anchor="start" font-size="11" fill="#b03a3a">② 每天吃满 4 颗，到第 2 天结束共 12 颗 &lt; 20（类型 4 起点序号）→ false（吃太慢）</text>
  <text x="60" y="312" text-anchor="start" font-size="11" fill="#2e6e2e">③ 每天吃 1 颗时类型 2 占第 11~15 天，第 13 天恰在其中 → true</text>

  <!-- example 2 box -->
  <g filter="url(#sk)"><rect x="45" y="324" width="550" height="88" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">示例 2 同法：candiesCount = [5,2,6,4,1]，s = [0,5,7,13,17,18]</text>
  <text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#555">[3,1,2]: ⌊13/2⌋=6 &gt; 1 ✗　　[4,10,3]: 5 ≤ 10 ≤ 17 ✓</text>
  <text x="320" y="384" text-anchor="middle" font-size="10.5" fill="#555">[3,10,100]: 0 ≤ 10 ≤ 16 ✓　　[4,100,30]: 100 &gt; 17 ✗</text>
  <text x="320" y="402" text-anchor="middle" font-size="10.5" fill="#555">[1,3,1]: ⌊5/1⌋=5 &gt; 3 ✗　　⇒ [false, true, true, false, false] ✓</text>
</svg>
