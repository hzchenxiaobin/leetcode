<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1,2,3,4,null,null,null,5,null,6]，k = 2</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">树形 1(2(4(5(6))), 3)；叶节点只有 3 和 6，BFS 从 2 出发逐层扩展</text>

  <rect x="24" y="62" width="592" height="26" rx="4" fill="#eef2f7" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="44" y="80">出队节点</text>
    <text x="146" y="80">dist</text>
    <text x="230" y="80">是叶节点？</text>
    <text x="352" y="80">新发现（dist + 1）</text>
    <text x="512" y="80">说明</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1" filter="url(#rough2)">
    <path d="M 24 104 L 616 104"/>
    <path d="M 24 136 L 616 136"/>
    <path d="M 24 168 L 616 168"/>
    <path d="M 24 200 L 616 200"/>
    <path d="M 24 232 L 616 232"/>
  </g>

  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="44" y="126">2（源点）</text>
    <text x="146" y="126">0</text>
    <text x="230" y="126" fill="#8a3a36">否（有左孩子 4）</text>
    <text x="352" y="126">1(1)、4(1)</text>
    <text x="512" y="126" fill="#666">起点先入队</text>

    <text x="44" y="158">1</text>
    <text x="146" y="158">1</text>
    <text x="230" y="158" fill="#8a3a36">否（有右孩子 3）</text>
    <text x="352" y="158">3(2)</text>
    <text x="512" y="158" fill="#666">3 是叶，先入队</text>

    <text x="44" y="190">4</text>
    <text x="146" y="190">1</text>
    <text x="230" y="190" fill="#8a3a36">否（有左孩子 5）</text>
    <text x="352" y="190">5(2)</text>
    <text x="512" y="190" fill="#666">同层继续扩展</text>

    <text x="44" y="222">3</text>
    <text x="146" y="222">2</text>
    <text x="230" y="222" fill="#3a5a30" font-weight="bold">是 ✓</text>
    <text x="352" y="222">—</text>
    <text x="512" y="222" fill="#3a5a30" font-weight="bold">返回 3 = 答案</text>
  </g>

  <rect x="24" y="244" width="592" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="38" y="263" font-size="11" fill="#3a5a30" filter="url(#rough2)">叶 6 在 dist = 3 才被访问到，比 3 更远；BFS 先碰到 3，所以 3 就是最近叶</text>

  <rect x="24" y="288" width="592" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="38" y="310" font-size="11" fill="#8a6a20" filter="url(#rough2)">示例 1：root = [1,3,2]，k = 1 —— 叶 3 与 2 的 dist 都是 1，返回任一即可（题目接受 2 或 3）</text>
  <text x="38" y="334" font-size="11" fill="#8a6a20" filter="url(#rough2)">示例 2：root = [1]，k = 1 —— 根自己就是叶，dist = 0，答案 1（循环第一次就返回）</text>

  <text x="24" y="374" font-size="10.5" fill="#666" filter="url(#rough2)">并列时返回谁由邻接表顺序决定，因此对拍只能比较「距离」而不能写死返回值</text>
</svg>
