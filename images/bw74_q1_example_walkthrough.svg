<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算：[3,2,3,2,2,2] 逐桶两两配对</text>

  <!-- 数组行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="128" y="56" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="176" y="56" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="224" y="56" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="272" y="56" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="320" y="56" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="104" y="79">3</text><text x="152" y="79">2</text><text x="200" y="79">3</text>
    <text x="248" y="79">2</text><text x="296" y="79">2</text><text x="344" y="79">2</text>
  </g>

  <!-- 值 3 的两块相连 -->
  <g filter="url(#rough2)">
    <path d="M 104 96 C 100 130, 200 138, 200 98" fill="none" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="152" cy="152" rx="86" ry="26" fill="none" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="152" y="158" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">值 3 的一对 → (3,3)</text>

  <!-- 值 2 的四块相连 -->
  <g filter="url(#rough2)">
    <path d="M 248 96 C 250 122, 300 132, 340 108" fill="none" stroke="#d6a040" stroke-width="2"/>
    <path d="M 296 96 C 296 112, 306 118, 336 96" fill="none" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <ellipse cx="330" cy="150" rx="96" ry="26" fill="none" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="330" y="156" font-size="13" fill="#a07820" filter="url(#rough2)" text-anchor="middle">值 2 的两对 → (2,2)、(2,2)</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="120" y="196" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="224" font-size="14.5" fill="#2a4a22" filter="url(#rough2)" text-anchor="middle">3 对 = n = 3，全部元素入对 → true</text>
  <text x="280" y="266" font-size="12.5" fill="#999" filter="url(#rough2)" text-anchor="middle">每个桶内按出现顺序相邻配对即可，无需关心具体顺序</text>
</svg>
