<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">分钱：先每人垫 1 元，再数 8 元档</text>

  <rect x="120" y="48" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">money &lt; children ？</text>
  <rect x="30" y="52" width="60" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">−1</text>
  <path d="M 120 68 L 94 68" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="100" y="58" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 260 92 L 260 116" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="108" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="90" y="120" width="340" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">剩余 extra = money − children</text>
  <text x="260" y="162" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">q = min( ⌊extra / 7⌋ , children )</text>

  <path d="M 260 176 L 260 198" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="110" y="202" width="300" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">q == children？（想让人人都拿 8）</text>

  <path d="M 410 222 L 452 222 L 452 258" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="430" y="212" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="352" y="262" width="200" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="284" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">extra == 7·children → 返回 children</text>
  <text x="452" y="302" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">否则 → 返回 children − 1</text>

  <path d="M 260 246 L 260 268" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="272" width="270" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="294" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">leftover = extra − 7q（范围 0..6）</text>
  <text x="195" y="312" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">若只剩 1 人且 leftover == 3 → 返回 q − 1</text>
  <path d="M 330 298 L 350 298" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="352" y="330" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="353" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">否则返回 q</text>
  <path d="M 195 328 L 195 348 L 346 348" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="356" font-size="12" fill="#666" filter="url(#rough2)">（1+3=4 美元，恰好踩中"不许拿 4"）</text>
</svg>
