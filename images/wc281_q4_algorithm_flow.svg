<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：因子表 → GCD 频次表 → 因子对枚举</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="16" y="56" width="182" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="107" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 求 k 的全部因子</text>
  <text x="107" y="100" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">d 从 1 到 √k，成对收集 d 与 k/d</text>
  <text x="107" y="120" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">注意 d² = k 时只收一次</text>
  <text x="107" y="146" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">O(√k)，得到 d(k) ≤ 128 个因子</text>

  <path d="M202,108 L222,108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="224" y="56" width="182" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a24" filter="url(#rough2)">② 统计 GCD 频次</text>
  <text x="315" y="100" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">遍历 nums，g = gcd(x, k)</text>
  <text x="315" y="120" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">freq[g]++（键只会是 k 的因子）</text>
  <text x="315" y="146" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">O(n log k) —— 全程主瓶颈</text>

  <path d="M410,108 L430,108" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="432" y="56" width="182" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="523" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">③ 枚举因子对 (d1 ≤ d2)</text>
  <text x="523" y="100" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">判定 d1·d2 % k == 0</text>
  <text x="523" y="120" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">合法 → 按频次累加答案（见下方）</text>
  <text x="523" y="146" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">O(d(k)²) ≤ 16384 次判定</text>

  <!-- Step 3 inner: decision 1 -->
  <path d="M523,160 L523,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="523,202 600,228 523,254 446,228" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="523" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">d1·d2 % k == 0 ?</text>

  <path d="M446,228 L336,228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="220" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <rect x="180" y="212" width="152" height="32" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="233" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不合法 → 跳过</text>

  <path d="M523,254 L523,282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="272" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- decision 2 -->
  <polygon points="523,284 594,308 523,332 452,308" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="523" y="312" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">d1 == d2 ?</text>

  <path d="M452,308 L375,308 L375,334" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="300" font-size="10" fill="#446688" filter="url(#rough2)">d1 = d2</text>
  <rect x="300" y="336" width="150" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="357" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans += c·(c−1)/2</text>
  <text x="375" y="390" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">同因子内部：C(c, 2) 组合</text>

  <path d="M594,308 L542,308 L542,334" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="552" y="300" font-size="10" fill="#446688" filter="url(#rough2)">d1 &lt; d2</text>
  <rect x="470" y="336" width="144" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="542" y="357" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans += f(d1)·f(d2)</text>
  <text x="542" y="390" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">跨因子：两类各取一个</text>

  <!-- Bottom bar -->
  <rect x="16" y="402" width="608" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">总复杂度：时间 O(√k + n·log k + d(k)²) ≈ O(n log k)，空间 O(d(k))</text>
</svg>
