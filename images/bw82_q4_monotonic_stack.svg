<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="102"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单调栈：一次扫描同时求出每个位置的左右「严格更小」边界</text>

  <!-- 数组 -->
  <text x="280" y="62" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">nums = [1, 3, 4, 3, 1]（示例 1）</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="140" y="76" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="162" y="100">1</text>
    <rect x="184" y="66" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="206" y="90">3</text>
    <rect x="228" y="56" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="250" y="80">4</text>
    <rect x="272" y="66" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="294" y="90">3</text>
    <rect x="316" y="76" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="338" y="100">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="162" y="132">i=0</text>
    <text x="206" y="132">i=1</text>
    <text x="250" y="132">i=2</text>
    <text x="294" y="132">i=3</text>
    <text x="338" y="132">i=4</text>
  </g>

  <!-- 结果表 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="80" y="150" width="400" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="120" y="172">left[i]</text>
    <text x="200" y="172" fill="#446688">−1</text>
    <text x="240" y="172" fill="#446688">0</text>
    <text x="280" y="172" fill="#446688">1</text>
    <text x="320" y="172" fill="#446688">0</text>
    <text x="360" y="172" fill="#446688">−1</text>
    <rect x="80" y="184" width="400" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="120" y="206">right[i]</text>
    <text x="200" y="206" fill="#446688">5</text>
    <text x="240" y="206" fill="#446688">4</text>
    <text x="280" y="206" fill="#446688">3</text>
    <text x="320" y="206" fill="#446688">4</text>
    <text x="360" y="206" fill="#446688">5</text>
    <rect x="80" y="218" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="120" y="240">len[i]</text>
    <text x="200" y="240" fill="#d6a040" font-weight="bold">5</text>
    <text x="240" y="240" fill="#d6a040" font-weight="bold">3</text>
    <text x="280" y="240" fill="#d6a040" font-weight="bold">1</text>
    <text x="320" y="240" fill="#d6a040" font-weight="bold">3</text>
    <text x="360" y="240" fill="#d6a040" font-weight="bold">5</text>
    <rect x="80" y="252" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="120" y="274">min×len &gt; 6 ?</text>
    <text x="200" y="274">5✗</text>
    <text x="240" y="274" fill="#b85450" font-weight="bold">9✓</text>
    <text x="280" y="274">4✗</text>
    <text x="320" y="274" fill="#b85450" font-weight="bold">9✓</text>
    <text x="360" y="274">5✗</text>
  </g>
  <text x="480" y="172" font-size="12" fill="#888" filter="url(#rough2)">(左边界下标)</text>
  <text x="480" y="206" font-size="12" fill="#888" filter="url(#rough2)">(右边界下标)</text>

  <!-- 栈内演化 -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="280" y="322" text-anchor="middle">栈内演化（存下标，值递增）：0 → 0,1 → 0,1,2 → 弹 2、弹 1、压 3 → …</text>
    <text x="280" y="344" text-anchor="middle">扫描 i=3（值 3）时依次弹出 i=2（值 4）、i=1（值 3）：i=2 的右边界即 3，左边界为栈中新顶 0</text>
  </g>
  <text x="280" y="374" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">相等元素的处理约定：两侧都以「严格更小」为界（弹栈条件 ≥），等值时窗口互不包含 → 覆盖不重不漏</text>
</svg>
