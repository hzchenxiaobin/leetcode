<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：steps = 5，arrLen = 10^6 ⇒ m = 3</text>
  <text x="290" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">dp[p] 逐层更新，每格 = 左上 + 正上 + 右上（越界记 0）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="100" y="64" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="140" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66">s \ p</text>
    <text x="230" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66">p = 0</text>
    <text x="330" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66">p = 1</text>
    <text x="430" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66">p = 2</text>
  </g>

  <!-- 行 s=0 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="96" width="80" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="140" y="118" fill="#666">s = 0</text>
    <rect x="180" y="96" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="230" y="118" fill="#333">1</text>
    <rect x="280" y="96" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="330" y="118" fill="#333">0</text>
    <rect x="380" y="96" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="430" y="118" fill="#333">0</text>
  </g>

  <!-- 行 s=1 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="130" width="80" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="140" y="152" fill="#666">s = 1</text>
    <rect x="180" y="130" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="230" y="152" fill="#333">1</text>
    <rect x="280" y="130" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="330" y="152" fill="#333">1</text>
    <rect x="380" y="130" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="430" y="152" fill="#333">0</text>
  </g>

  <!-- 行 s=2 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="164" width="80" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="140" y="186" fill="#666">s = 2</text>
    <rect x="180" y="164" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="230" y="186" fill="#333">2</text>
    <rect x="280" y="164" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="330" y="186" fill="#333">2</text>
    <rect x="380" y="164" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="430" y="186" fill="#333">1</text>
  </g>

  <!-- 行 s=3 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="198" width="80" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="140" y="220" fill="#666">s = 3</text>
    <rect x="180" y="198" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="230" y="220" fill="#333">4</text>
    <rect x="280" y="198" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="330" y="220" fill="#333">5</text>
    <rect x="380" y="198" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="430" y="220" fill="#333">3</text>
  </g>

  <!-- 行 s=4 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="100" y="232" width="80" height="34" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" rx="4"/>
    <text x="140" y="254" fill="#666">s = 4</text>
    <rect x="180" y="232" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="230" y="254" fill="#333">9</text>
    <rect x="280" y="232" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="330" y="254" fill="#8a6a20">12</text>
    <rect x="380" y="232" width="100" height="34" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="4"/>
    <text x="430" y="254" fill="#333">8</text>
  </g>

  <!-- 行 s=5（答案行） -->
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle" font-weight="bold">
    <rect x="100" y="266" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="140" y="288" fill="#3a5a30">s = 5</text>
    <rect x="180" y="266" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="230" y="288" fill="#8a3a36">21</text>
    <rect x="280" y="266" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="330" y="288" fill="#3a5a30">29</text>
    <rect x="380" y="266" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="288" fill="#3a5a30">20</text>
  </g>

  <path d="M 482 283 L 508 283" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566" y="287" text-anchor="end" font-size="11" fill="#8a3a36" filter="url(#rough2)">答案 = 21</text>

  <g filter="url(#rough2)">
    <rect x="100" y="316" width="380" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9"/>
    <text x="114" y="336" font-size="10.5" fill="#3a4a66">看 s = 5 的 p = 1 格：29 = 9（左上）+ 12（正上）+ 8（右上）。</text>
    <text x="114" y="356" font-size="10.5" fill="#3a4a66">p = 2 只能来自 p = 1、p = 2 两格，因为 p = 3 已被截断掉。</text>
  </g>

  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">arrLen 从 10^6 变成 3 列，答案 21 与 Motzkin 数 M_5 一致</text>
</svg>
