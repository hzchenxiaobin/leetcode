<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">input(c) 的两种走向</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">普通字符：沿 Trie 走一步、读缓存；'#'：落库并刷新整条路径</text>

  <rect x="210" y="60" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="83" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">input(char c)</text>

  <path d="M 310 98 L 310 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,116 410,156 310,196 210,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="161" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">c == '#' ?</text>

  <path d="M 410 156 L 440 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="444" y="96" width="164" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30">
    <text x="526" y="116" text-anchor="middle" font-weight="bold">落库 + 刷新路径</text>
    <text x="526" y="138" text-anchor="middle">s ← prefix</text>
    <text x="526" y="156" text-anchor="middle">cnt[s] += 1</text>
    <text x="526" y="174" text-anchor="middle">沿 s 的路径插入 Trie</text>
    <text x="526" y="192" text-anchor="middle">逐节点 offer(次数, s)</text>
    <text x="526" y="210" text-anchor="middle">prefix ← ""，cur ← root</text>
  </g>

  <path d="M 526 218 L 526 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="444" y="248" width="164" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="526" y="273" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">返回 []（空列表）</text>

  <path d="M 310 196 L 310 234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="222" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="150" y="238" width="300" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="300" y="259" text-anchor="middle">prefix += c</text>
    <text x="300" y="279" text-anchor="middle">cur = child(cur, c)，不存在则 cur = −1</text>
  </g>

  <path d="M 300 292 L 300 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="326" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#6b5518">
    <text x="300" y="347" text-anchor="middle">cur = −1 → 返回 []</text>
    <text x="300" y="367" text-anchor="middle">否则返回 cur 节点缓存的 top3（不排序、不 DFS）</text>
  </g>

  <rect x="30" y="400" width="560" height="52" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#8d3a36">
    <text x="46" y="422">插入只走 s 这唯一一条路径 ⇒ 只有这条路径上的节点 top3 需要刷新，别的子树完全不受影响；</text>
    <text x="46" y="442">每次 offer 只是「删旧项 + 插入并截断到 3」，代价 O(3) = O(1)，整句插入 O(L)。</text>
  </g>
</svg>
