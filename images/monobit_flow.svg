<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="470" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：迭代生成全 1 数</text>
  <path d="M 110 38 Q 260 47 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="160" y="52" width="80" height="32" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#2b6e9e">开始</text>
  <path d="M 200 84 L 200 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init ans -->
  <g filter="url(#sk)">
    <rect x="110" y="106" width="180" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="200" y="131" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">ans = 1 （计入 0）</text>
  <path d="M 200 146 L 200 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init x -->
  <g filter="url(#sk)">
    <rect x="110" y="168" width="180" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="200" y="193" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">x = 1</text>
  <path d="M 200 208 L 200 228" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision -->
  <polygon points="200,230 285,265 200,300 115,265" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" filter="url(#sk)">x ≤ n ?</text>

  <!-- yes branch -->
  <text x="212" y="316" font-size="12" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">是</text>
  <path d="M 200 300 L 200 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="110" y="322" width="180" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="200" y="347" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">ans += 1</text>
  <path d="M 200 362 L 200 382" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="110" y="384" width="180" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="200" y="409" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">x = 2x + 1</text>

  <!-- loop back -->
  <path d="M 110 404 L 40 404 L 40 265 L 108 265" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="52" y="340" font-size="11" fill="#4a8e4a" filter="url(#sk)">循环</text>

  <!-- no branch -->
  <text x="298" y="254" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <path d="M 285 265 L 353 265" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="355" y="243" width="130" height="44" rx="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="420" y="270" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" font-family="monospace">return ans</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="440" width="445" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="262" y="456" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">x 依次取 1, 3, 7, 15, ⋯；n ≤ 1000 时最多循环 10 次，O(log n)。</text>
</svg>
