<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">含 x 的牌只有三种型，兼容关系固定（x = a 为例）</text>
  <rect x="300" y="70" width="100" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350.0" y="96.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">A: xx</text>
  <rect x="104" y="176" width="120" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="164.0" y="201.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">B_c: xc</text>
  <rect x="254" y="176" width="120" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314.0" y="201.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">B_d: xd</text>
  <rect x="404" y="176" width="120" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464.0" y="201.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">B_e: xe</text>
  <rect x="180" y="272" width="120" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240.0" y="297.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">C_p: px</text>
  <rect x="380" y="272" width="120" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="297.025" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">C_q: qx</text>
  <path d="M 350 116 L 224 174" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 116 L 374 174" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 116 L 524 174" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 116 L 240 270" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 116 L 440 270" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 197 L 254 197" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 104 176 Q 60 197 104 218" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">同型 ✗</text>
  <path d="M 374 197 L 404 197" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">不同字母的 B 之间 ✓</text>
  <path d="M 300 293 L 380 293" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="340" y="316" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">不同字母的 C 之间 ✓</text>
  <line x1="300" y1="218" x2="300" y2="272" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="408" y="250" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">B 与 C ✗</text>
  <text x="66" y="380" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">xx 与任何含 x 的牌都只差 1 位 ✓；xc 与 cx 两位都不同 ✗</text>
</svg>
