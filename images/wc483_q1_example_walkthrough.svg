<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：三个示例恰好覆盖三种形态</text>

  <!-- 示例 1：s = "1112"，整串保留 -->
  <text x="34" y="82" font-size="12" fill="#555" filter="url(#rough2)">示例 1</text>
  <text x="34" y="100" font-size="12" fill="#555" filter="url(#rough2)">s = "1112"</text>
  <rect x="170" y="58" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="84" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <rect x="214" y="58" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="234" y="84" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <rect x="258" y="58" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="278" y="84" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">1</text>
  <rect x="302" y="58" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="322" y="84" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="162" y="50" width="188" height="56" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="234" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="278" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="322" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=3</text>
  <path d="M 356 78 L 386 78" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="58" width="132" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="83" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 "1112"</text>
  <text x="458" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">末位恰是 '2'，整串即答案</text>

  <!-- 示例 2：s = "221"，删尾 -->
  <text x="34" y="172" font-size="12" fill="#555" filter="url(#rough2)">示例 2</text>
  <text x="34" y="190" font-size="12" fill="#555" filter="url(#rough2)">s = "221"</text>
  <rect x="170" y="148" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="174" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">2</text>
  <rect x="214" y="148" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="234" y="174" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="258" y="148" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="278" y="174" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">1</text>
  <line x1="263" y1="153" x2="293" y2="183" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="293" y1="153" x2="263" y2="183" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="162" y="140" width="100" height="56" rx="6" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="234" y="204" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=1</text>
  <text x="278" y="204" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <path d="M 306 168 L 386 168" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="148" width="132" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="173" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 "22"</text>
  <text x="458" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">删掉 i=1 之后的尾部字符</text>

  <!-- 示例 3：s = "1"，无解 -->
  <text x="34" y="262" font-size="12" fill="#555" filter="url(#rough2)">示例 3</text>
  <text x="34" y="280" font-size="12" fill="#555" filter="url(#rough2)">s = "1"</text>
  <rect x="170" y="238" width="40" height="40" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="264" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">1</text>
  <text x="190" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="256" y="262" font-size="11.5" fill="#b85450" filter="url(#rough2)">没有 '2' ⇒ 不存在偶数子序列</text>
  <path d="M 400 258 L 386 258" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="392" y="238" width="132" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="458" y="263" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 ""</text>

  <!-- 底部小结 -->
  <rect x="40" y="322" width="480" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三个示例 = 三种形态，恰好把边界全覆盖：</text>
  <text x="280" y="372" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 末位恰是 '2'：整串保留，一个字符都不删</text>
  <text x="280" y="394" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">② 末位是 '1'：从右往左第一个 '2' 定终点，其后全删</text>
  <text x="280" y="416" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">③ 一个 '2' 都没有：无解，返回空串</text>
</svg>
