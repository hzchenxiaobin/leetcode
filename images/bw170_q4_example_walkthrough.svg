<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：4848 的逐步结算</text>

  <!-- 表头 -->
  <text x="46" y="58" font-size="11" fill="#999" filter="url(#rough2)">步</text>
  <text x="92" y="58" font-size="11" fill="#999" filter="url(#rough2)">填入</text>
  <text x="156" y="58" font-size="11" fill="#999" filter="url(#rough2)">prev2 / prev1</text>
  <text x="300" y="58" font-size="11" fill="#999" filter="url(#rough2)">结算 prev1</text>
  <text x="424" y="58" font-size="11" fill="#999" filter="url(#rough2)">add</text>
  <path d="M36,66 L484,66" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="50" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="98" y="92" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="92" font-size="11" fill="#666" filter="url(#rough2)">NONE / 4</text>
  <text x="304" y="92" font-size="11" fill="#999" filter="url(#rough2)">首位，跳过</text>
  <text x="434" y="92" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="50" y="120" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="120" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="160" y="120" font-size="11" fill="#666" filter="url(#rough2)">4 / 8</text>
  <text x="304" y="120" font-size="11" fill="#999" filter="url(#rough2)">prev2 不存在，跳过</text>
  <text x="434" y="120" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="50" y="148" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="98" y="148" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="148" font-size="11" fill="#666" filter="url(#rough2)">8 / 4</text>
  <text x="304" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8 &gt; 4 且 8 &gt; 4 → 峰</text>
  <text x="434" y="148" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="50" y="176" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="98" y="176" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="160" y="176" font-size="11" fill="#666" filter="url(#rough2)">4 / 8</text>
  <text x="304" y="176" font-size="11" fill="#d6a040" filter="url(#rough2)">4 &lt; 8 且 4 &lt; 8 → 谷</text>
  <text x="434" y="176" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>

  <text x="50" y="204" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="98" y="204" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="160" y="204" font-size="11" fill="#666" filter="url(#rough2)">8 / —</text>
  <text x="304" y="204" font-size="11" fill="#b85450" filter="url(#rough2)">末位，不结算</text>
  <text x="434" y="204" font-size="12" fill="#333" filter="url(#rough2)">—</text>

  <path d="M36,216 L484,216" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="230" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">波动值 = 0 + 0 + 1 + 1 = 2</text>

  <text x="260" y="288" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">三处「跳过」对应三种边界：首位、prev2 缺失、末位</text>
</svg>
