<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">枚举前一半，镜像拼出回文（n 位数只需枚举一半）</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 5 时前半长为 3，枚举 100 .. 999 共 900 个</text>

  <text x="48" y="88" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">前半 h</text>
  <g filter="url(#rough2)">
    <rect x="120" y="70" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="4"/>
    <rect x="168" y="70" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="4"/>
    <rect x="216" y="70" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="142" y="93" fill="#3a4a66">1</text>
    <text x="190" y="93" fill="#3a4a66">2</text>
    <text x="238" y="93" fill="#3a4a66">3</text>
  </g>

  <path d="M 286 87 L 318 87" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">镜像</text>

  <g filter="url(#rough2)">
    <rect x="330" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="378" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="426" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="474" y="70" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
    <rect x="522" y="70" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="352" y="93" fill="#3a5a30">1</text>
    <text x="400" y="93" fill="#3a5a30">2</text>
    <text x="448" y="93" fill="#3a5a30">3</text>
    <text x="496" y="93" fill="#3a5a30">2</text>
    <text x="537" y="93" fill="#3a5a30">1</text>
  </g>
  <text x="330" y="124" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">回文 12321（首尾镜像，中间位只出现一次）</text>

  <rect x="48" y="146" width="464" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="62" y="168" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">构造规则（长度 n，前半长度 half = ceil(n / 2)）</text>
  <text x="62" y="188" font-size="10.5" fill="#555" filter="url(#rough2)">n 为偶数：h + reverse(h)　　n 为奇数：h + reverse(h 去掉最后一位)</text>
  <text x="62" y="204" font-size="10" fill="#888" filter="url(#rough2)">前半首位不为 0，因此拼出的回文天然没有前导零</text>

  <path d="M 280 208 L 280 228" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="230" width="384" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="251" font-size="11" fill="#3a4a66" filter="url(#rough2)">若回文 % k == 0，把它记作 k 回文整数</text>
  <text x="102" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">n = 5 时枚举量 9 × 10^2 = 900，n = 10 时也只有 9 × 10^4</text>

  <path d="M 280 278 L 280 298" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="300" width="384" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="321" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">把它的"数位多重集"作为签名收进集合</text>
  <text x="102" y="339" font-size="10.5" fill="#555" filter="url(#rough2)">例如 2112 与 1221 的签名都是 "1122"，只需处理一次</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">只枚举回文而不是枚举所有 n 位数，是本题复杂度的关键</text>
</svg>
