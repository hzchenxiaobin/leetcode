<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单个目标的代价 O(log n)：二分定位 + 前缀和</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="167" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">lower_bound(a, x) → i（示例取 x = 11 ⇒ i = 1）</text>

  <text x="98" y="106" text-anchor="end" font-size="12" fill="#555">排序后 a =</text>
  <g filter="url(#sk)"><rect x="110" y="84" width="54" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="137" y="107" text-anchor="middle" font-size="13" fill="#2b6e9e">10</text>
  <g filter="url(#sk)"><rect x="170" y="84" width="54" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="197" y="107" text-anchor="middle" font-size="13" fill="#2e6e2e">12</text>
  <g filter="url(#sk)"><rect x="230" y="84" width="54" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="257" y="107" text-anchor="middle" font-size="13" fill="#2e6e2e">13</text>
  <g filter="url(#sk)"><rect x="290" y="84" width="54" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="317" y="107" text-anchor="middle" font-size="13" fill="#2e6e2e">14</text>
  <g filter="url(#sk)"><rect x="350" y="84" width="54" height="36" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="377" y="107" text-anchor="middle" font-size="13" fill="#2e6e2e">15</text>

  <path d="M 167 70 L 167 206" stroke="#c98a2b" stroke-width="1.8" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>

  <text x="137" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">[0, i) 全 &lt; x</text>
  <text x="322" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">[i, n) 全 ≥ x（等于 x 贡献 0，放哪边都行）</text>

  <text x="98" y="188" text-anchor="end" font-size="12" fill="#555">前缀和 pre =</text>
  <g filter="url(#sk)"><rect x="110" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="137" y="186" text-anchor="middle" font-size="12.5" fill="#555">0</text>
  <g filter="url(#sk)"><rect x="170" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="197" y="186" text-anchor="middle" font-size="12.5" fill="#555">10</text>
  <g filter="url(#sk)"><rect x="230" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="257" y="186" text-anchor="middle" font-size="12.5" fill="#555">22</text>
  <g filter="url(#sk)"><rect x="290" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="317" y="186" text-anchor="middle" font-size="12.5" fill="#555">35</text>
  <g filter="url(#sk)"><rect x="350" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="377" y="186" text-anchor="middle" font-size="12.5" fill="#555">49</text>
  <g filter="url(#sk)"><rect x="410" y="166" width="54" height="30" rx="5" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="437" y="186" text-anchor="middle" font-size="12.5" fill="#555">64</text>
  <text x="437" y="216" text-anchor="middle" font-size="10.5" fill="#888">pre[n]</text>

  <g filter="url(#sk)"><rect x="60" y="232" width="520" height="92" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="256" text-anchor="middle" font-size="12.5" fill="#2b6e9e">cost_L = x·i − pre[i] = 11×1 − 10 = 1 （左边每个补 x − aⱼ）</text>
  <text x="320" y="280" text-anchor="middle" font-size="12.5" fill="#2e6e2e">cost_R = (pre[n] − pre[i]) − x·(n−i) = 54 − 44 = 10 （右边每个削 aⱼ − x）</text>
  <text x="320" y="308" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">cost(11) = 1 + 10 = 11 ✓ 正是示例 2 的答案</text>
</svg>
