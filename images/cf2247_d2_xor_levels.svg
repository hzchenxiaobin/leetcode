<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">
    把 a 补到 N = 8 个位置，每个内部节点比较「左块最大」与「右块最小」
  </text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    末尾补 +∞；节点坏 ⇒ 分界 m = 奇数·2^v 坏；M = 最高的坏层级 ⇒ 答案 2^M
  </text>

  <!-- level tags -->
  <g font-size="12" fill="#446688" filter="url(#rough2)">
    <text x="6" y="112">v = 2</text>
    <text x="6" y="202">v = 1</text>
    <text x="6" y="292">v = 0</text>
  </g>

  <!-- edges -->
  <g stroke="#8899aa" stroke-width="1.2" fill="none" filter="url(#rough3)">
    <path d="M68,360 L105,306"/><path d="M142,360 L105,306"/>
    <path d="M216,360 L253,306"/><path d="M290,360 L253,306"/>
    <path d="M364,360 L401,306"/><path d="M438,360 L401,306"/>
    <path d="M512,360 L549,306"/><path d="M586,360 L549,306"/>
    <path d="M105,266 L179,216"/><path d="M253,266 L179,216"/>
    <path d="M401,266 L475,216"/><path d="M549,266 L475,216"/>
    <path d="M179,176 L327,126"/><path d="M475,176 L327,126"/>
  </g>

  <!-- leaves -->
  <g filter="url(#rough2)">
    <rect x="36" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="258" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="332" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="406" y="360" width="64" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="480" y="360" width="64" height="40" rx="4" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.3"/>
    <rect x="554" y="360" width="64" height="40" rx="4" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.3"/>
  </g>
  <g font-size="13.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="68" y="386">2</text><text x="142" y="386">5</text><text x="216" y="386">3</text>
    <text x="290" y="386">4</text><text x="364" y="386">1</text><text x="438" y="386">6</text>
    <text x="512" y="386" fill="#999">∞</text><text x="586" y="386" fill="#999">∞</text>
  </g>
  <g font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="68" y="418">0</text><text x="142" y="418">1</text><text x="216" y="418">2</text>
    <text x="290" y="418">3</text><text x="364" y="418">4</text><text x="438" y="418">5</text>
    <text x="512" y="418">6</text><text x="586" y="418">7</text>
  </g>

  <!-- v = 0 nodes -->
  <g filter="url(#rough2)">
    <rect x="53" y="266" width="104" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="201" y="266" width="104" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="349" y="266" width="104" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="497" y="266" width="104" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" fill="#2f5c28" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="291">2 ≤ 5</text><text x="253" y="291">3 ≤ 4</text>
    <text x="401" y="291">1 ≤ 6</text><text x="549" y="291">∞ ≤ ∞</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="340">m = 1</text><text x="253" y="340">m = 3</text>
    <text x="401" y="340">m = 5</text><text x="549" y="340">m = 7</text>
  </g>

  <!-- v = 1 nodes -->
  <g filter="url(#rough2)">
    <rect x="114" y="176" width="130" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="410" y="176" width="130" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" text-anchor="middle" filter="url(#rough2)">
    <text x="179" y="201" fill="#a33">5 &gt; 3</text>
    <text x="475" y="201" fill="#2f5c28">6 ≤ ∞</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="179" y="232">m = 2</text><text x="475" y="232">m = 6</text>
  </g>

  <!-- root -->
  <rect x="252" y="86" width="150" height="40" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="327" y="111" text-anchor="middle" font-size="12" fill="#a33" filter="url(#rough2)">5 &gt; 1</text>
  <text x="327" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m = 4</text>

  <rect x="60" y="432" width="560" height="30" rx="8" fill="#ffffff" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="452" font-size="12.5" fill="#b85450" filter="url(#rough2)">
    坏层级 v = 1 与 v = 2 各有一个节点 ⇒ M = 2 ⇒ 答案 2² = 4
  </text>
</svg>
