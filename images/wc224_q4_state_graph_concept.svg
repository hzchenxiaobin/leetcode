<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="450" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：状态 (m, c, t) 博弈图 —— 逆向归纳，未解析 = 平局 = 猫胜</text>

  <!-- ===== Panel A: state & value domain ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">① 状态与值域</text>

  <rect x="40" y="66" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="87" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">老鼠 m</text>
  <text x="108" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">,</text>
  <rect x="114" y="66" width="64" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="87" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">猫 c</text>
  <text x="182" y="88" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">,</text>
  <rect x="188" y="66" width="58" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="87" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">轮次 t</text>

  <text x="141" y="122" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">棋盘至多 8 × 8 = 64 格</text>
  <text x="141" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">状态总数 ≤ 64 × 64 × 2 = 8192</text>

  <rect x="36" y="154" width="210" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="177" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">1000 步规则 = 把平局判给猫</text>
  <text x="141" y="196" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⇒ 值域二值 {鼠胜, 猫胜}</text>
  <text x="141" y="215" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">⇒ 步数维度彻底消失</text>

  <text x="141" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">带步数暴力：约 8×10⁶ 个状态，DFS 还会死循环</text>
  <text x="141" y="282" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">去掉步数：8192 个，缩小约千倍</text>

  <!-- ===== Panel B: retrograde analysis ===== -->
  <text x="474" y="54" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">② 逆向归纳：从终止态往回推</text>

  <rect x="288" y="66" width="118" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="347" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">m = c 同格</text>
  <text x="347" y="106" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">猫胜</text>

  <rect x="416" y="66" width="118" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">m = 食物</text>
  <text x="475" y="106" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#rough2)">鼠胜</text>

  <rect x="544" y="66" width="118" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="603" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">c = 食物</text>
  <text x="603" y="106" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">猫胜（抢食）</text>

  <text x="474" y="134" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">终止态结果已知，直接入队；向「前驱」（能一步走到它的状态）传播</text>

  <path d="M347,120 L347,140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M475,120 L475,140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M603,120 L603,140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="288" y="144" width="374" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">后继里有「自己赢」的 → 当前玩家选它，标记入队</text>
  <text x="475" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">赢，只需一条路</text>

  <rect x="288" y="196" width="374" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="216" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">走法送死 loss+1；计满 degree（全部送死）→ 判负入队</text>
  <text x="475" y="234" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不输，至少要有一条不送死的路（含通向平局的路）</text>

  <rect x="288" y="254" width="374" height="40" rx="8" fill="#fcfcfc" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="475" y="271" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">其余状态保持「未解析」—— 双方都无强制胜负</text>
  <text x="475" y="287" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">循环 / 僵持 / 守而不攻</text>

  <rect x="288" y="306" width="374" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="475" y="328" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">队列空后仍未解析 = 平局 = 猫胜</text>
  <text x="475" y="346" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">老鼠 1000 次操作内到不了食物，超时判负</text>
  <text x="475" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蹲住咽喉的猫不需要「抓」—— 等超时即可</text>

  <!-- ===== bottom strip ===== -->
  <rect x="36" y="390" width="626" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="349" y="410" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">前驱 = 能一步走到该状态的状态；跳跃对称（A 能跳到 B ⇔ B 能跳回 A）</text>
  <text x="349" y="428" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">⇒ 可达表既是后继表又是前驱表，无需显式建图、无需反向边</text>
</svg>
