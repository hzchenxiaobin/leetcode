<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="500" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：记上一个 1 的下标，逐个算间隙</text>

  <!-- ===== 示例 1 ===== -->
  <g>
    <rect x="30" y="44" width="600" height="200" rx="10" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.4" filter="url(#rough2)"/>
  </g>
  <text x="48" y="72" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">示例 1　nums = [1,0,0,0,1,0,0,1]，k = 2　→　true</text>
  <text x="80" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">遇 1 于 i</text>
  <text x="170" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">prev</text>
  <text x="275" y="102" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i − prev − 1</text>
  <text x="350" y="102" font-size="11" fill="#888" filter="url(#rough2)">判定与动作</text>
  <path d="M 48 112 L 612 112" stroke="#c8d4e3" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <text x="80" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">0</text>
  <text x="170" y="140" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="275" y="140" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="350" y="140" font-size="11.5" fill="#444" filter="url(#rough2)">首个 1，直接通过；prev ← 0</text>

  <text x="80" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">4</text>
  <text x="170" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="275" y="170" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">3 ≥ 2 ✓</text>
  <text x="350" y="170" font-size="11.5" fill="#444" filter="url(#rough2)">通过；prev ← 4</text>

  <text x="80" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">7</text>
  <text x="170" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="275" y="200" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <text x="350" y="200" font-size="11.5" fill="#444" filter="url(#rough2)">通过；prev ← 7</text>

  <path d="M 48 210 L 612 210" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="48" y="232" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">两个相邻间隙 3 与 2 均 ≥ k = 2，扫描正常结束 → 返回 true ✓</text>

  <!-- ===== 示例 2 ===== -->
  <g>
    <rect x="30" y="262" width="600" height="200" rx="10" fill="#ffffff" stroke="#c8d4e3" stroke-width="1.4" filter="url(#rough2)"/>
  </g>
  <text x="48" y="290" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">示例 2　nums = [1,0,0,1,0,1]，k = 2　→　false</text>
  <text x="80" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">遇 1 于 i</text>
  <text x="170" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">prev</text>
  <text x="275" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i − prev − 1</text>
  <text x="350" y="320" font-size="11" fill="#888" filter="url(#rough2)">判定与动作</text>
  <path d="M 48 330 L 612 330" stroke="#c8d4e3" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <text x="80" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">0</text>
  <text x="170" y="356" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="275" y="356" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="350" y="356" font-size="11.5" fill="#444" filter="url(#rough2)">首个 1，直接通过；prev ← 0</text>

  <text x="80" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">3</text>
  <text x="170" y="384" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="275" y="384" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">2 ≥ 2 ✓</text>
  <text x="350" y="384" font-size="11.5" fill="#444" filter="url(#rough2)">通过；prev ← 3</text>

  <g>
    <rect x="42" y="394" width="576" height="28" rx="5" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  </g>
  <text x="80" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">5</text>
  <text x="170" y="412" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="412" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 &lt; 2 ✗</text>
  <text x="350" y="412" font-size="11.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">违规 → 立即 return false</text>

  <path d="M 48 432 L 612 432" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="48" y="452" font-size="11.5" fill="#8f3830" filter="url(#rough2)">第二个 1 与第三个 1 之间只夹了 1 个 0，1 &lt; k = 2，故返回 false</text>

  <text x="330" y="486" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">「—」表示没有前驱，首个 1 不参与间距判定（哨兵 prev = −1 的语义）</text>
</svg>
