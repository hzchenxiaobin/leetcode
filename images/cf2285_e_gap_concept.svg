<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：公差被「两个未修改位置」锁定 → O(nk)</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">枚举「最左的未修改位置 i」，再花 O(k) 确定公差 d 并向右推进</text>

  <g filter="url(#rough2)">
    <rect x="24" y="62" width="532" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="40" y="84" font-size="11.5" fill="#2f4f6f" font-weight="bold">① 公差必须是整数</text>
    <text x="40" y="102" font-size="10.5" fill="#3a4a66">区间长度 ≥ 2 时相邻两格都要放整数，所以 d = a[l+1] − a[l] 一定是整数。</text>
    <text x="40" y="119" font-size="10.5" fill="#3a4a66">对候选 (i, j) 只查 (a[j] − a[i]) 能否被 (j − i) 整除，能则 d 被它唯一确定。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="140" width="532" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="40" y="162" font-size="11.5" fill="#3a5a30" font-weight="bold">② 至多 k 次修改 ⇒ 任意连续 k+1 格中至少 1 格没被改</text>
    <text x="40" y="180" font-size="10.5" fill="#3f5a38">取「最左未修改位置 i」与「次左未修改位置 j」，则 (i, j) 内每一格都必须改。</text>
    <text x="40" y="197" font-size="10.5" fill="#3f5a38">所以 j − i − 1 ≤ k，即 j − i ≤ k+1：每个 i 只有 O(k) 个候选 j，也就只有 O(k) 个候选公差。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="218" width="532" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="40" y="240" font-size="11.5" fill="#8a6a20" font-weight="bold">③ 两点定直线，其余位置逐格核对</text>
    <text x="40" y="258" font-size="10.5" fill="#6b5a30">c = a[i] − i·d，位置 m 匹配 ⟺ a[m] = c + m·d；不匹配的位置必须花 1 次修改。</text>
    <text x="40" y="275" font-size="10.5" fill="#6b5a30">问题化为：对每条候选直线，求「不匹配点 ≤ k 个」的最长窗口。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="296" width="532" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="40" y="318" font-size="11.5" fill="#8a3a36" font-weight="bold">④ 区间够长时 d 是唯一众数</text>
    <text x="40" y="336" font-size="10.5" fill="#7a4a46">若 r ≥ i+2k+1，窗口 [i, i+2k+1] 共 2k+2 格、d 的匹配数 ≥ k+2，其它 d 至多 k 个。</text>
    <text x="40" y="353" font-size="10.5" fill="#7a4a46">因此众数唯一、可直接用它向右推；区间若落在窗口内，边扫边取众数即可。</text>
  </g>

  <path d="M 290 364 L 290 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="24" y="378" width="532" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="40" y="398" font-size="11" fill="#3a5a30" font-weight="bold">复杂度 O(n·k)</text>
    <text x="40" y="415" font-size="10.5" fill="#3f5a38">每处 i：窗口扫描 O(min(n−i, 2k+1)) ＋ 贪心跳跃 O(k)；Σ n·k ≤ 10⁷ ⇒ 约 2·10⁷ 次内层动作。</text>
  </g>
</svg>
