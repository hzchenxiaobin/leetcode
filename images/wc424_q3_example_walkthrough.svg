<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：k = 1 失败 → k = 2 恰好可行</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= left panel: k = 1 ================= -->
  <g filter="url(#sk)">
    <rect x="25" y="50" width="305" height="325" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="177" y="76" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">k = 1：只用前 1 个查询 [0,2,1]</text>

  <!-- diff row -->
  <text x="80" y="114" text-anchor="end" font-size="11" fill="#888" font-weight="bold">diff</text>
  <g filter="url(#sk)">
    <rect x="84" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="132" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="180" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="228" y="92" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="106" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414" font-weight="bold">+1</text>
  <text x="154" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414">0</text>
  <text x="202" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414">0</text>
  <text x="250" y="114" text-anchor="middle" font-size="12.5" fill="#999">−1</text>

  <!-- arrow -->
  <path d="M 178 126 L 178 140" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="190" y="136" font-size="10" fill="#888">前缀和</text>

  <!-- cover row -->
  <text x="104" y="170" text-anchor="end" font-size="11" fill="#888" font-weight="bold">cover</text>
  <g filter="url(#sk)">
    <rect x="108" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="156" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="204" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="130" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="178" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="226" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">1</text>

  <!-- nums row -->
  <text x="104" y="222" text-anchor="end" font-size="11" fill="#888" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="108" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="156" y="200" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="204" y="200" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="130" y="222" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">2</text>
  <text x="178" y="222" text-anchor="middle" font-size="12.5" fill="#2e6e2e">0</text>
  <text x="226" y="222" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">2</text>

  <!-- verdicts -->
  <text x="130" y="254" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">2 &gt; 1 ✗</text>
  <text x="178" y="254" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">0 ≤ 1 ✓</text>
  <text x="226" y="254" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">2 &gt; 1 ✗</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="45" y="268" width="265" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="177" y="294" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold">check(1) = false</text>
  <text x="177" y="316" text-anchor="middle" font-size="11" fill="#444">下标 0、2 各需要减 2，可用减量只有 1</text>
  <text x="177" y="336" text-anchor="middle" font-size="11" fill="#444">二分里对应 lo = mid + 1，往右找</text>

  <!-- ================= right panel: k = 2 ================= -->
  <g filter="url(#sk)">
    <rect x="350" y="50" width="305" height="325" rx="12" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="502" y="76" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">k = 2：叠加前 2 个查询 [0,2,1] + [0,2,1]</text>

  <!-- diff row -->
  <text x="380" y="114" text-anchor="end" font-size="11" fill="#888" font-weight="bold">diff</text>
  <g filter="url(#sk)">
    <rect x="384" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="432" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="92" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="528" y="92" width="44" height="34" rx="4" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="406" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414" font-weight="bold">+2</text>
  <text x="454" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414">0</text>
  <text x="502" y="114" text-anchor="middle" font-size="12.5" fill="#8a6414">0</text>
  <text x="550" y="114" text-anchor="middle" font-size="12.5" fill="#999">−2</text>

  <!-- arrow -->
  <path d="M 502 126 L 502 140" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="514" y="136" font-size="10" fill="#888">前缀和</text>

  <!-- cover row -->
  <text x="404" y="170" text-anchor="end" font-size="11" fill="#888" font-weight="bold">cover</text>
  <g filter="url(#sk)">
    <rect x="408" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="456" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="504" y="148" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="430" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="478" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="526" y="170" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">2</text>

  <!-- nums row -->
  <text x="404" y="222" text-anchor="end" font-size="11" fill="#888" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="408" y="200" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="456" y="200" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="504" y="200" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="430" y="222" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="478" y="222" text-anchor="middle" font-size="12.5" fill="#2e6e2e">0</text>
  <text x="526" y="222" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">2</text>

  <!-- verdicts -->
  <text x="430" y="254" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2 ≤ 2 ✓</text>
  <text x="478" y="254" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">0 ≤ 2 ✓</text>
  <text x="526" y="254" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">2 ≤ 2 ✓</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="370" y="268" width="265" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="502" y="294" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">check(2) = true → 答案 k* = 2</text>
  <text x="502" y="316" text-anchor="middle" font-size="11" fill="#444">两条 [0,2] val=1 叠加：cover = [2,2,2]</text>
  <text x="502" y="336" text-anchor="middle" font-size="11" fill="#444">每步减 min(当前值, val) 即恰好清零</text>

  <!-- footnote -->
  <text x="340" y="392" text-anchor="middle" font-size="10.5" fill="#999">二分轨迹：[0,3] → mid=1 ✗ → [2,3] → mid=2 ✓ → 收敛 k* = 2；灰色虚线格 = j = n 的哨兵位</text>
</svg>
