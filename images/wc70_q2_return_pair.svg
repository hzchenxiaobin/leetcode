<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">返回值是二元组 (小树根, 大树根)，两种情形只差「根归谁」</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">留下根的那一侧，负责把递归回来的同侧部分接回自己的空指针</text>

  <!-- 情形 A -->
  <rect x="28" y="62" width="244" height="290" fill="#f7fbf4" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#33552c" font-weight="bold" filter="url(#rough2)">情形 A：root.val ≤ target</text>
  <text x="150" y="106" text-anchor="middle" font-size="10" fill="#46603c" filter="url(#rough2)">根一定落在小树</text>

  <path d="M 150 160 L 196 186" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="150" cy="145" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#33552c" filter="url(#rough2)">r</text>
  <circle cx="196" cy="193" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="198" text-anchor="middle" font-size="11" fill="#33552c" filter="url(#rough2)">a</text>
  <circle cx="84" cy="193" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="84" y="198" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">b</text>
  <text x="150" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">b 向上返回，不属于本层</text>

  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#33552c" filter="url(#rough2)">root.right ← a（小半边接回）</text>
  <text x="150" y="276" text-anchor="middle" font-size="10.5" fill="#33552c" filter="url(#rough2)">return (root, b)</text>
  <text x="150" y="306" text-anchor="middle" font-size="9.5" fill="#7a8f70" filter="url(#rough2)">a 是右子树里最上层的</text>
  <text x="150" y="322" text-anchor="middle" font-size="9.5" fill="#7a8f70" filter="url(#rough2)">≤ target 节点，正好接班</text>

  <!-- 情形 B -->
  <rect x="288" y="62" width="244" height="290" fill="#f6f9ff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="86" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">情形 B：root.val &gt; target</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#3a5a78" filter="url(#rough2)">根一定落在大树</text>

  <path d="M 410 160 L 364 186" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="410" cy="145" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="150" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">r</text>
  <circle cx="364" cy="193" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="364" y="198" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">b</text>
  <circle cx="476" cy="193" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="476" y="198" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">a</text>
  <text x="410" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">a 向上返回，不属于本层</text>

  <text x="410" y="256" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">root.left ← b（大半边接回）</text>
  <text x="410" y="276" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">return (a, root)</text>
  <text x="410" y="306" text-anchor="middle" font-size="9.5" fill="#6b8299" filter="url(#rough2)">b 是左子树里最上层的</text>
  <text x="410" y="322" text-anchor="middle" font-size="9.5" fill="#6b8299" filter="url(#rough2)">&gt; target 节点，正好接班</text>

  <!-- 中缝箭头 -->
  <path d="M 274 210 L 286 210" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">二元组语义在每一层都一致：左边永远 ≤ target，右边永远 &gt; target</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">递归只需向下一个孩子要答案，本层再做一次指针改写，因此总代价 O(n)</text>
</svg>
