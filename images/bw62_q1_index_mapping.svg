<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：下标 i 的商余分解映射到 (i/n, i%n)</text>

  <!-- 一维数组 -->
  <text x="60" y="72" font-size="13" fill="#888" filter="url(#rough2)">一维 original（L = m×n = 6）：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="162" y="84" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="254" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="300" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="93" y="105">1</text><text x="139" y="105">2</text><text x="185" y="105">3</text>
    <text x="231" y="105">4</text><text x="277" y="105">5</text><text x="323" y="105">6</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="93" y="132">i=0</text><text x="139" y="132">i=1</text><text x="185" y="132">i=2</text>
    <text x="231" y="132">i=3</text><text x="277" y="132">i=4</text><text x="323" y="132">i=5</text>
  </g>

  <!-- 二维矩阵 m=2, n=3 -->
  <text x="400" y="72" font-size="13" fill="#888" filter="url(#rough2)">二维 m×n = 2×3：</text>
  <g filter="url(#rough2)">
    <rect x="400" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="480" y="84" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="122" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="440" y="122" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="480" y="122" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="420" y="105">1</text><text x="460" y="105">2</text><text x="500" y="105">3</text>
    <text x="420" y="143">4</text><text x="460" y="143">5</text><text x="500" y="143">6</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="372" y="105">row 0</text><text x="372" y="143">row 1</text>
  </g>

  <!-- 映射箭头 -->
  <path d="M 93 122 C 200 170, 330 170, 408 118" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="182" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">i=0 → (0/3, 0%3) = (0, 0)</text>
  <path d="M 231 122 C 300 152, 360 152, 402 132" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="152" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">i=3 → (3/3, 3%3) = (1, 0)</text>

  <!-- 公式框 -->
  <rect x="60" y="208" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="14" fill="#2d5a22" filter="url(#rough2)">row = i / n（整除），col = i % n（取余）</text>
  <text x="280" y="256" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">i = row × n + col（表示唯一）</text>

  <rect x="60" y="288" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">可行性判定先行：m × n == L 才有解</text>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">（m·n 最大 1.6×10⁹，C++ 乘法建议用 long long）</text>
</svg>
