<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="93" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树形 DP 第一遍：子树大小与根的距离和</text>
  <path d="M 180.0 44 Q 330.0 54 480.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="330.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">n = 6，根取 0；sz 为子树节点数，depth 为到根的距离</text>
  <path d="M 330 96 L 190 166" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <path d="M 330 96 L 440 166" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <path d="M 440 166 L 350 236" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <path d="M 440 166 L 450 236" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <path d="M 440 166 L 550 236" stroke="#555" stroke-width="1.7" fill="none" filter="url(#rough)"/>
  <g filter="url(#rough2)"><circle cx="330" cy="96" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="330" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">0</text>
  <text x="330" y="136" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=6</text>
  <text x="330" y="152" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=8</text>
  <g filter="url(#rough2)"><circle cx="190" cy="166" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="190" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="190" y="206" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=1</text>
  <text x="190" y="222" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=12</text>
  <g filter="url(#rough2)"><circle cx="440" cy="166" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="440" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="440" y="206" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=4</text>
  <text x="440" y="222" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=6</text>
  <g filter="url(#rough2)"><circle cx="350" cy="236" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="350" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <text x="350" y="276" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=1</text>
  <text x="350" y="292" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=10</text>
  <g filter="url(#rough2)"><circle cx="450" cy="236" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="450" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4</text>
  <text x="450" y="276" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=1</text>
  <text x="450" y="292" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=10</text>
  <g filter="url(#rough2)"><circle cx="550" cy="236" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="550" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>
  <text x="550" y="276" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">sz=1</text>
  <text x="550" y="292" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">ans=10</text>
  <text x="120" y="96" text-anchor="start" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">depth:</text>
  <text x="120" y="116" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">0→0  1→1</text>
  <text x="120" y="134" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">2→1  3,4,5→2</text>
  <g filter="url(#rough2)"><rect x="90" y="302" width="480" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="330" y="324" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">ans[0] = Σ depth = 0+1+1+2+2+2 = 8</text>
  <text x="330" y="343" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#rough2)">sz 由下往上累加：sz[u] = 1 + Σ sz[child]</text>
  <g filter="url(#rough2)"><rect x="90" y="362" width="480" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="330.0" y="384" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">一遍 DFS 同时得到 depth 与 sz；ans[0] 就是距离和</text>
  <text x="330.0" y="402" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">后序（从叶子往根）累加 sz，保证用子树算完再用到父节点</text>
  </svg>