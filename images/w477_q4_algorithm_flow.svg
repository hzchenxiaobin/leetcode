<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：从「数元素子集」转向「数位列子集」，四步流水线</text>

  <rect x="20" y="54" width="146" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="93" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 求 S = OR(nums)</text>
  <text x="93" y="96" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = popcount(S) ≤ 20</text>
  <text x="93" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一趟 O(n)</text>

  <rect x="192" y="54" width="156" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 压签名 sig(x)</text>
  <text x="270" y="96" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">值天然 ⊆ S，重编号到 k 位</text>
  <text x="270" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">桶计数 cnt[sig]++</text>

  <rect x="374" y="54" width="130" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="76" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ SOS 子集和</text>
  <text x="439" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f[U] = #{sig ⊆ U}</text>
  <text x="439" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">O(k · 2ᵏ) 高维前缀和</text>

  <rect x="100" y="180" width="160" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">④ 容斥求和</text>
  <text x="180" y="222" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">ans = Σ (−1)^(|T|+1) · 2^f[T̄]</text>
  <text x="180" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2 的幂预计算，逐项查表</text>

  <rect x="300" y="180" width="150" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 防负取模</text>
  <text x="375" y="222" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">((ans % MOD) + MOD) % MOD</text>
  <text x="375" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">± 交替累加可能为负</text>

  <path d="M 166 92 L 190 92" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 92 L 372 92" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 439 132 C 439 158 439 158 340 158 L 230 158 C 195 158 180 164 180 176" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 218 L 298 218" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="282" width="400" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">时间 O(nk + k·2ᵏ) ≈ 2×10⁷，空间 O(2ᵏ + n)</text>

  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">瓶颈全在 2ᵏ 一侧：k ≤ 20 与 n 无关，是题目的善意</text>
</svg>
