<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "bdda" → 输出 "addb"</text>

  <!-- suffix-min table -->
  <text x="90" y="60" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">后缀最小 suf：</text>
  <g filter="url(#sk)"><rect x="160" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="194" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="228" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="262" y="44" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="296" y="44" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="177" y="62" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="211" y="62" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="245" y="62" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="279" y="62" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">a</text>
  <text x="313" y="62" text-anchor="middle" font-size="12.5" fill="#a06a1a" filter="url(#sk)">{</text>
  <text x="177" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">suf[0]</text>
  <text x="211" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">suf[1]</text>
  <text x="245" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">suf[2]</text>
  <text x="279" y="84" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">suf[3]</text>
  <text x="313" y="84" text-anchor="middle" font-size="11" fill="#a06a1a" filter="url(#sk)">哨兵</text>
  <text x="470" y="62" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">s = b d d a（a 殿后，</text>
  <text x="470" y="80" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">每个后缀的最小都是 a）</text>

  <!-- column headers -->
  <text x="76" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">步骤</text>
  <text x="180" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">压入后栈 t（右=顶）</text>
  <text x="392" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a" filter="url(#sk)">判断：top ≤ suf[i+1] ?</text>
  <text x="600" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">纸上 p</text>

  <!-- step 1 -->
  <text x="76" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i=0 压 b</text>
  <g filter="url(#sk)"><rect x="166" y="140" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="181" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">b</text>
  <text x="392" y="159" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk)">b ≤ a ?　否</text>
  <text x="600" y="159" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#sk)">（空）</text>
  <path d="M 76 172 L 76 196" fill="none" stroke="#8aa2b8" stroke-width="1.2" filter="url(#sk)"/>

  <!-- step 2 -->
  <text x="76" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i=1 压 d</text>
  <g filter="url(#sk)"><rect x="166" y="202" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="202" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="181" y="221" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">b</text>
  <text x="211" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">d</text>
  <text x="392" y="221" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk)">d ≤ a ?　否</text>
  <text x="600" y="221" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#sk)">（空）</text>
  <path d="M 76 234 L 76 258" fill="none" stroke="#8aa2b8" stroke-width="1.2" filter="url(#sk)"/>

  <!-- step 3 -->
  <text x="76" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i=2 压 d</text>
  <g filter="url(#sk)"><rect x="166" y="264" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="264" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="226" y="264" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="181" y="283" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">b</text>
  <text x="211" y="283" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">d</text>
  <text x="241" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">d</text>
  <text x="392" y="283" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk)">d ≤ a ?　否</text>
  <text x="600" y="283" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#sk)">（空）</text>
  <path d="M 76 296 L 76 320" fill="none" stroke="#8aa2b8" stroke-width="1.2" filter="url(#sk)"/>

  <!-- step 4: push a then drain all -->
  <text x="76" y="344" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i=3 压 a</text>
  <g filter="url(#sk)"><rect x="166" y="326" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="326" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="226" y="326" width="30" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="256" y="326" width="30" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="181" y="345" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">b</text>
  <text x="211" y="345" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">d</text>
  <text x="241" y="345" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">d</text>
  <text x="271" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">a</text>
  <text x="392" y="345" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">a ≤ '{' ?　是 → 全部弹出！</text>
  <text x="600" y="345" text-anchor="middle" font-size="13" fill="#2e5e2e" filter="url(#sk)">addb</text>
  <path d="M 271 358 L 271 382" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- drain animation -->
  <text x="340" y="412" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk)">s 已扫空，m = +∞，栈里 b d d a 依次弹出到 p：</text>
  <g filter="url(#sk)"><rect x="212" y="428" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="272" y="428" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="332" y="428" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="392" y="428" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="232" y="449" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">a</text>
  <text x="292" y="449" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">d</text>
  <text x="352" y="449" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">d</text>
  <text x="412" y="449" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">b</text>
  <path d="M 252 444 L 268 444" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 312 444 L 328 444" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 372 444 L 388 444" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="232" y="476" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">先弹</text>
  <text x="412" y="476" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">后弹</text>

  <!-- why not pop earlier -->
  <g filter="url(#sk)"><rect x="100" y="496" width="480" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="340" y="514" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#sk)">若 i=0 时忍不住弹出 b：p 以 b 开头 → "bdda"，</text>
  <text x="340" y="532" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">而 "addb" &lt; "bdda" —— 忍住，等 a 进栈！</text>
</svg>
