<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrR2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="350" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Bob 全程取 0 时，所有可能的终局都落在 [d, d+c] 上</text>
  <path d="M 128 42 Q 390 49 652 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">示意取 a = 0, b = 3, c = 10 ⇒ d = a − b = −3，d + c = 7（横轴不严格按比例）</text>

  <!-- 结局区间 -->
  <rect x="180" y="150" width="380" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="179" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">终局比分 A − B = d + x，x ∈ [0, c]</text>

  <!-- 三个关键点 -->
  <text x="180" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">d = −3</text>
  <text x="340" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="560" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">d + c = 7</text>

  <path d="M 180 148 L 180 196" stroke="#a14340" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 340 148 L 340 196" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 560 148 L 560 196" stroke="#33582a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="340" cy="173" r="4" fill="#2b2b2b" filter="url(#rough2)"/>

  <!-- 横轴 -->
  <path d="M 120 214 L 690 214" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 208 L 180 220" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 340 208 L 340 220" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 560 208 L 560 220" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="700" y="219" font-size="11.5" fill="#446688" filter="url(#rough2)">A − B</text>

  <!-- 两个距离 -->
  <path d="M 180 240 L 340 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-start="url(#arrL)" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">|d| = 3（Alice 空手）</text>

  <path d="M 340 282 L 560 282" stroke="#b85450" stroke-width="1.8" fill="none" marker-start="url(#arrL)" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <text x="450" y="301" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">|d + c| = 7（Alice 拿光）</text>

  <text x="150" y="284" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">Bob 每轮都取 0</text>
  <text x="150" y="300" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">⇒ 只由 Alice 消耗 c</text>

  <!-- 结论 -->
  <rect x="40" y="312" width="700" height="30" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">|d + x| 在 [0, c] 上的最大值只可能在端点 ⇒ 上界 = max(|d|, |d + c|)</text>
</svg>
