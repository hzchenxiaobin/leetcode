<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15.5" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：[4,2,9,3,5,null,7] → 15</text>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">按后序访问：先叶子，再父节点</text>

  <rect x="40" y="70" width="460" height="32" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">节点</text>
  <text x="146" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">L</text>
  <text x="218" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">R</text>
  <text x="292" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">|L − R|</text>
  <text x="382" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">返回 S(v)</text>
  <text x="468" y="91" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">累计</text>

  <rect x="40" y="102" width="460" height="204" fill="none"
        stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 40 136 L 500 136" stroke="#bbb" stroke-width="1"
        filter="url(#rough2)"/>
  <path d="M 40 170 L 500 170" stroke="#bbb" stroke-width="1"
        filter="url(#rough2)"/>
  <path d="M 40 204 L 500 204" stroke="#bbb" stroke-width="1"
        filter="url(#rough2)"/>
  <path d="M 40 238 L 500 238" stroke="#bbb" stroke-width="1"
        filter="url(#rough2)"/>
  <path d="M 40 272 L 500 272" stroke="#bbb" stroke-width="1"
        filter="url(#rough2)"/>

  <text x="66" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="218" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="292" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="382" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="468" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="66" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="146" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="218" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="292" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="382" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="468" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="66" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="146" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="218" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="292" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="382" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="468" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="66" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="218" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="292" y="227" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="382" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="468" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="66" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <text x="146" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="218" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="292" y="261" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="382" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>
  <text x="468" y="261" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>

  <text x="66" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="146" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="218" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>
  <text x="292" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="382" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">26</text>
  <text x="468" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">15</text>

  <path d="M 330 320 Q 400 330 470 320" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="400" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">2 + 7 + 6 = 15</text>
  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">S(v) 一列就是父节点要用的输入</text>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">节点 9 缺左子树：L 记 0，坡度 = |0 − 7| = 7</text>
</svg>
