<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：k 次移位合并 + 奇偶判据统一</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板① 移位合并 -->
  <g filter="url(#sk)"><rect x="36" y="54" width="276" height="152" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="52" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 移位合并：循环周期 n</text>

  <g filter="url(#sk)"><rect x="60" y="92" width="44" height="34" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="82" y="114" text-anchor="middle" font-size="14" fill="#444">5</text>
  <g filter="url(#sk)"><rect x="112" y="92" width="44" height="34" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="134" y="114" text-anchor="middle" font-size="14" fill="#444">6</text>
  <g filter="url(#sk)"><rect x="164" y="92" width="44" height="34" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="186" y="114" text-anchor="middle" font-size="14" fill="#444">7</text>
  <g filter="url(#sk)"><rect x="216" y="92" width="44" height="34" rx="4" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="238" y="114" text-anchor="middle" font-size="14" fill="#444">8</text>

  <path d="M 262 130 Q 163 158 66 130" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="163" y="158" text-anchor="middle" font-size="10.5" fill="#666">循环：连移 n 位 = 回到自身</text>

  <text x="174" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">k 次同向移位 = 1 次移 (k mod n) 位</text>
  <text x="174" y="201" text-anchor="middle" font-size="10.5" fill="#a06a10">本约束 n ≤ 25 &lt; k ≤ 50：取模是必需而非优化</text>

  <!-- 面板② 奇偶判据统一 -->
  <g filter="url(#sk)"><rect x="324" y="54" width="280" height="152" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="340" y="78" font-size="13" font-weight="bold" fill="#7a5415">② 奇偶反向 · 判据同一</text>
  <text x="340" y="102" font-size="11" fill="#444" font-family="monospace">偶行·左移 k：new[j] = old[(j+k)%n]</text>
  <text x="340" y="124" font-size="11" fill="#444" font-family="monospace">奇行·右移 k：new[j] = old[(j−k)%n]</text>
  <text x="340" y="146" font-size="10.5" fill="#666">「复原」= ∀j 逐位相等；奇行条件换元</text>
  <text x="340" y="163" font-size="10.5" fill="#666">j → (j+k)%n（双射）后与偶行完全一致</text>
  <g filter="url(#sk)"><rect x="336" y="172" width="256" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1"/></g>
  <text x="464" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">row[j] = row[(j+k)%n]（∀j）</text>

  <!-- 汇合箭头 -->
  <path d="M 174 210 Q 200 240 268 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 464 210 Q 438 240 372 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="60" y="252" width="520" height="94" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" font-family="monospace">返回 true ⟺ ∀i∀j：mat[i][j] = mat[i][(j+k) mod n]</text>
  <text x="320" y="307" text-anchor="middle" font-size="11.5" fill="#555">一次双重循环原地比较：行奇偶、移位方向、k ≥ n 全被 (j+k) mod n 吸收</text>
  <text x="320" y="330" text-anchor="middle" font-size="11.5" fill="#555">推论：true ⟺ 每行是长度 g = gcd(n,k) 的块重复 n/g 次（示例 2 的 [1,2,1,2]）</text>

  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#888">把「模拟 k 轮」读成「不变量判定」—— O(k·m·n) 降为 O(m·n)</text>
</svg>
