<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：encoding = [3,8,0,9,2,5]</text>
  <rect x="50" y="58" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="80.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">调用</text>
  <rect x="170" y="58" width="210" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="80.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">动作</text>
  <rect x="390" y="58" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="80.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">返回</text>
  <rect x="480" y="58" width="180" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="80.55" text-anchor="middle" font-size="13" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">剩余编码</text>
  <rect x="50" y="104" width="110" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="126.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">next(2)</text>
  <rect x="170" y="104" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="125.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3 ≥ 2：段内扣 2</text>
  <rect x="390" y="104" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="126.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <rect x="480" y="104" width="180" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="125.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[1,8] [0,9] [2,5]</text>
  <rect x="50" y="156" width="110" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="178.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">next(1)</text>
  <rect x="170" y="156" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="177.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1 ≥ 1：扣成 0</text>
  <rect x="390" y="156" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="178.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">8</text>
  <rect x="480" y="156" width="180" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="177.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[0,8] [0,9] [2,5]</text>
  <rect x="50" y="208" width="110" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="230.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">next(1)</text>
  <rect x="170" y="208" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="229.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">跳过 0 段，扣 5</text>
  <rect x="390" y="208" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="230.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">5</text>
  <rect x="480" y="208" width="180" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="229.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">[0,8] [0,9] [1,5]</text>
  <rect x="50" y="260" width="110" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="282.2" text-anchor="middle" font-size="12" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">next(2)</text>
  <rect x="170" y="260" width="210" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="281.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">只剩 1 个 5 ⇒ 不够</text>
  <rect x="390" y="260" width="80" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="282.9" text-anchor="middle" font-size="14" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">−1</text>
  <rect x="480" y="260" width="180" height="36" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="281.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">序列耗尽</text>
  <text x="340" y="322" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-style="" filter="url(#rough2)">输出 [8,8,5,−1]，与题面一致</text>
</svg>
