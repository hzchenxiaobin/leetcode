<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Trie + 每个节点缓存子树前 3 名</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">同一前缀的句子共享一条路径，查询直接读缓存，插入只刷新路径上的节点</text>

  <rect x="28" y="96" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="118" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">root</text>

  <rect x="140" y="96" width="72" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="176" y="118" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">'i'</text>

  <path d="M 102 113 L 136 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="190" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="213" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">前缀 "i "</text>

  <rect x="190" y="190" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">前缀 "is"</text>

  <rect x="360" y="190" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="213" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">前缀 "ir"</text>

  <path d="M 168 130 C 140 152, 104 162, 90 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 132 L 250 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 186 130 C 260 156, 380 150, 424 186" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="90" y="252" text-anchor="middle">i love you  5</text>
    <text x="90" y="270" text-anchor="middle">i love leetcode  2</text>
    <text x="260" y="252" text-anchor="middle">island  3</text>
    <text x="430" y="252" text-anchor="middle">ironman  2</text>
  </g>

  <rect x="20" y="286" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="303" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">top3：2 条</text>
  <rect x="190" y="286" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="303" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">top3：1 条</text>
  <rect x="360" y="286" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="303" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">top3：1 条</text>

  <rect x="522" y="180" width="118" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="581" y="200" text-anchor="middle" font-size="10.5" fill="#8d3a36" font-weight="bold" filter="url(#rough2)">排序键</text>
  <text x="581" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(−次数, 句子)</text>
  <text x="581" y="248" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">次数大的先</text>
  <text x="581" y="266" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">同次数按</text>
  <text x="581" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ASCII 升序</text>

  <rect x="20" y="336" width="620" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#6b5518">
    <text x="36" y="360">为什么只存 3 个：查询永远只要前 3 名，第 4 名及以后在任何查询里都不可能出场。</text>
    <text x="36" y="382">次数只增不减 ⇒ 第 3 名的门槛单调不降；被淘汰的句子只有自己被再次输入时才需要重新参选。</text>
    <text x="36" y="404">节点上的列表 = 该前缀下所有历史句子按 (−次数, 字典序) 的前 3 名，长度不足 3 就有几条给几条。</text>
  </g>
</svg>
