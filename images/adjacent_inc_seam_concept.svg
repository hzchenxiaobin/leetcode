<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：枚举接缝 j，两侧游程长度取 min</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 1：nums = [2,5,7,8,9,2,3,4,3,1]，接缝取 j = 4</text>

  <!-- 接缝虚线（画在格子下层） -->
  <line x1="270" y1="56" x2="270" y2="134" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="278" y="60" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">接缝：j | j+1</text>

  <!-- nums 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="50" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="94" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="138" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="182" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="226" y="64" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="270" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="314" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="358" y="64" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="402" y="64" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="446" y="64" width="44" height="42" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="72" y="91">2</text>
    <text x="116" y="91">5</text>
    <text x="160" y="91">7</text>
    <text x="204" y="91">8</text>
    <text x="248" y="91">9</text>
    <text x="292" y="91">2</text>
    <text x="336" y="91">3</text>
    <text x="380" y="91">4</text>
    <text x="424" y="91">3</text>
    <text x="468" y="91">1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="72" y="126">0</text>
    <text x="116" y="126">1</text>
    <text x="160" y="126">2</text>
    <text x="204" y="126">3</text>
    <text x="248" y="126">4</text>
    <text x="292" y="126">5</text>
    <text x="336" y="126">6</text>
    <text x="380" y="126">7</text>
    <text x="424" y="126">8</text>
    <text x="468" y="126">9</text>
  </g>

  <!-- inc 箭头：从接缝向左 -->
  <path d="M 264 150 L 58 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">inc[4] = 5：从 nums[4] = 9 向左最长递增 5 格</text>

  <!-- nxt 箭头：从接缝向右 -->
  <path d="M 276 202 L 396 202" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">nxt[5] = 3：从 nums[5] = 2 向右最长递增 3 格</text>

  <!-- 候选值框 -->
  <rect x="90" y="246" width="380" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">k(4) = min( inc[4], nxt[5] ) = min(5, 3) = 3</text>

  <!-- 提示框 -->
  <rect x="55" y="312" width="450" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">接缝处 9 &gt; 2 不要求递增——两段只需各自严格递增</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">k 由接缝两侧游程的较短一侧决定；枚举所有 j 取最大</text>
</svg>
