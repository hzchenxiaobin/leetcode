<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#667788"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 开始 -->
  <rect x="210" y="14" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="35" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M260,46 L260,58" fill="none" stroke="#667788" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="175" y="60" width="170" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = 1,  mask = 0</text>
  <path d="M260,98 L260,110" fill="none" stroke="#667788" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：还有字符? -->
  <polygon points="260,112 350,150 260,188 170,150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">还有字符?</text>

  <!-- 否 -> 返回 -->
  <path d="M350,150 L390,150" fill="none" stroke="#667788" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="394" y="132" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="449" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 ans ✓</text>

  <!-- 是 -> 读字符 -->
  <path d="M260,188 L260,202" fill="none" stroke="#667788" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="200" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <rect x="180" y="204" width="160" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">bit = 1 &lt;&lt; (c − 'a')</text>
  <path d="M260,238 L260,252" fill="none" stroke="#667788" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：重复? -->
  <polygon points="260,254 365,296 260,338 155,296" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">bit &amp; mask ≠ 0 ?</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(c 在当前段?)</text>

  <!-- 是 -> 切割 -->
  <path d="M155,296 L138,296" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="146" y="286" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">是</text>
  <rect x="10" y="278" width="128" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="74" y="294" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">ans++ ;</text>
  <text x="74" y="310" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">mask = bit（新段）</text>
  <!-- 橙框回边：回到读字符 -->
  <path d="M74,278 L74,221 L176,221" fill="none" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 否 -> 并入 -->
  <path d="M365,296 L382,296" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="374" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="386" y="278" width="126" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="449" y="301" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">mask |= bit</text>
  <!-- 绿框回边：回到读字符 -->
  <path d="M449,278 L449,221 L344,221" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 底部注释 -->
  <rect x="55" y="352" width="410" height="38" fill="#f5f0fa" stroke="#8866aa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11.5" fill="#66447a" filter="url(#rough2)">mask 记录当前段出现过的字母；切割后新段以 c 开头（mask = bit）而非空集</text>
</svg>
