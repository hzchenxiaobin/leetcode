<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">构造：下标 mod c 轮流分组</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [1,2,2,3,3,4,4]，最长平台 c = 2，第 i 个元素放进第 i mod c 组</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="52" y="72">下标 i</text>
    <text x="86" y="72">0</text>
    <text x="118" y="72">1</text>
    <text x="150" y="72">2</text>
    <text x="182" y="72">3</text>
    <text x="214" y="72">4</text>
    <text x="246" y="72">5</text>
    <text x="278" y="72">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="78" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="102" y="78" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="134" y="78" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="166" y="78" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="198" y="78" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="230" y="78" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="262" y="78" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="86"  y="99" fill="#3a4a66">1</text>
    <text x="118" y="99" fill="#3a5a30">2</text>
    <text x="150" y="99" fill="#3a4a66">2</text>
    <text x="182" y="99" fill="#3a5a30">3</text>
    <text x="214" y="99" fill="#3a4a66">3</text>
    <text x="246" y="99" fill="#3a5a30">4</text>
    <text x="278" y="99" fill="#3a4a66">4</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <text x="86"  y="126" fill="#3a4a66">组0</text>
    <text x="118" y="126" fill="#3a5a30">组1</text>
    <text x="150" y="126" fill="#3a4a66">组0</text>
    <text x="182" y="126" fill="#3a5a30">组1</text>
    <text x="214" y="126" fill="#3a4a66">组0</text>
    <text x="246" y="126" fill="#3a5a30">组1</text>
    <text x="278" y="126" fill="#3a4a66">组0</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 316 94 L 380 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <path d="M 316 118 L 380 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="326" y="88" font-size="9.5" fill="#3a4a66" font-weight="bold">蓝色 → 组 0</text>
    <text x="326" y="134" font-size="9.5" fill="#3a5a30" font-weight="bold">绿色 → 组 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="148" width="240" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="156" y="172" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">组 0：[1, 2, 3, 4]</text>
    <text x="156" y="192" text-anchor="middle" font-size="10" fill="#555">收下标 0, 2, 4, 6</text>
    <text x="156" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">严格递增 ✓ 长 4 ≥ k=3 ✓</text>
    <text x="156" y="228" text-anchor="middle" font-size="9.5" fill="#888">相邻元素下标差恰为 c = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="292" y="148" width="240" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="412" y="172" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">组 1：[2, 3, 4]</text>
    <text x="412" y="192" text-anchor="middle" font-size="10" fill="#555">收下标 1, 3, 5</text>
    <text x="412" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">严格递增 ✓ 长 3 ≥ k=3 ✓</text>
    <text x="412" y="228" text-anchor="middle" font-size="9.5" fill="#888">相邻元素下标差恰为 c = 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="252" width="488" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="280" y="276" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">为什么组内严格递增？</text>
    <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555">同组相邻两元素下标差恰为 c。反设 nums[i] = nums[i+c]，</text>
    <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#555">由数组非降，位置 i..i+c 共 c+1 个元素全部相等，</text>
    <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">出现长度 c+1 的平台，与 c 是最长平台矛盾 ∎</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="356" width="488" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="280" y="380" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">为什么每组长度 ≥ k？</text>
    <text x="280" y="402" text-anchor="middle" font-size="10.5" fill="#555">组 j 收下标 j, j+c, j+2c, …，长度为 ⌈(n−j)/c⌉；最短的组 c−1 长 ⌈(n−c+1)/c⌉</text>
    <text x="280" y="420" text-anchor="middle" font-size="10.5" fill="#555">若 c·k ≤ n，则 n − c + 1 ≥ c(k−1) + 1，除以 c 向上取整恰 ≥ k</text>
    <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">⇒ 组数恰为 c 的合法划分存在，与下界匹配，c·k ≤ n 还是充分条件</text>
  </g>
</svg>
