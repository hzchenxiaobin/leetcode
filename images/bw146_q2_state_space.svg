<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">路径异或值只有 16 种可能：可以当作 DP 的一维</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 的一条路径：2 → 5 → 9 → 15 → 11</text>

  <circle cx="70" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="118" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="170" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="118" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="270" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <circle cx="370" cy="112" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="118" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">15</text>
  <circle cx="470" cy="112" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="470" y="118" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">11</text>

  <path d="M 94 112 L 142 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⊕7</text>
  <path d="M 194 112 L 242 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⊕12</text>
  <path d="M 294 112 L 342 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⊕6</text>
  <path d="M 394 112 L 442 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="100" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⊕4</text>

  <text x="280" y="160" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每一步都是"当前异或值 ⊕ 格子值"，结果永远落在 0..15</text>

  <rect x="56" y="180" width="452" height="26" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="58" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="86" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="114" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="142" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="170" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="198" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="226" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="254" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="282" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="310" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="338" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="366" y="182" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="394" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="422" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="450" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="478" y="182" width="26" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="71" y="222" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">0</text>
  <text x="379" y="222" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">11 = k</text>
  <text x="491" y="222" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">15</text>

  <rect x="66" y="240" width="428" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">grid 值 &lt; 16 ⇒ 每个数至多 4 位 ⇒ 异或不会产生第 5 位</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">于是"异或值"只需 16 个桶，可作为 DP 的第三维</text>
</svg>
