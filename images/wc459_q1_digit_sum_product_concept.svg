<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数字和 + 数字积 → 整除判断</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input n -->
  <g filter="url(#sk2)">
    <rect x="250" y="60" width="140" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">n = 99</text>

  <!-- split arrows -->
  <path d="M 270 104 Q 170 130 150 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 104 Q 470 130 490 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- digit sum branch -->
  <g filter="url(#sk2)">
    <rect x="40" y="160" width="230" height="92" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="155" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">数字和 S</text>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="155" y="206" text-anchor="middle">9 + 9 = 18</text>
    <text x="155" y="228" text-anchor="middle" font-size="11" fill="#666">逐位累加，从 0 开始</text>
    <text x="155" y="244" text-anchor="middle" font-size="11" fill="#666">s += d</text>
  </g>

  <!-- digit product branch -->
  <g filter="url(#sk2)">
    <rect x="370" y="160" width="230" height="92" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="485" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">数字积 P</text>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="485" y="206" text-anchor="middle">9 × 9 = 81</text>
    <text x="485" y="228" text-anchor="middle" font-size="11" fill="#b85450">注意：从 1 开始！</text>
    <text x="485" y="244" text-anchor="middle" font-size="11" fill="#666">p *= d（含 0 则 P=0）</text>
  </g>

  <!-- merge arrows -->
  <path d="M 200 252 Q 260 276 288 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 252 Q 380 276 352 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- S+P box -->
  <g filter="url(#sk2)">
    <rect x="210" y="296" width="220" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" font-family="monospace">S + P = 18 + 81 = 99</text>

  <!-- divisibility check -->
  <g filter="url(#sk2)">
    <rect x="440" y="290" width="180" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="530" y="308" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">99 % 99 == 0</text>
  <text x="530" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">true ✓</text>
  <path d="M 430 306 L 438 306" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="40" y="336" width="560" height="18" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="349" text-anchor="middle" font-size="11" fill="#888">S ≥ 1 恒成立（n 为正整数），S+P ≥ 1，无除零风险；一遍逐位分解即可。</text>
</svg>
