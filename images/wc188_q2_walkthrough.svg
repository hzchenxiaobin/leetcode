<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：arr = [2, 3, 1, 6, 7]</text>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">前缀异或 P = [0, 2, 1, 0, 6, 1]，P[m] 对应 k = m − 1</text>

  <rect x="46" y="70" width="436" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <path d="M104,70 V102" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,70 V102" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,70 V102" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,70 V102" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="91" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">m</text>
  <text x="147" y="91" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">P[m]</text>
  <text x="246" y="91" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">命中下标 i</text>
  <text x="350" y="91" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">新增</text>
  <text x="440" y="91" text-anchor="middle" font-size="11.5" fill="#2a4660" filter="url(#rough2)">累计 ans</text>
  <rect x="46" y="102" width="436" height="32" fill="#f2f2f2" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,102 V134" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,102 V134" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,102 V134" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,102 V134" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="123" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="147" y="123" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="246" y="123" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">种子</text>
  <text x="350" y="123" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="440" y="123" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <rect x="46" y="134" width="436" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,134 V166" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,134 V166" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,134 V166" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,134 V166" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="155" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="147" y="155" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="246" y="155" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="350" y="155" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="440" y="155" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <rect x="46" y="166" width="436" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,166 V198" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,166 V198" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,166 V198" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,166 V198" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="187" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="147" y="187" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="246" y="187" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="350" y="187" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="440" y="187" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <rect x="46" y="198" width="436" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,198 V230" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,198 V230" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,198 V230" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,198 V230" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="219" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">3</text>
  <text x="147" y="219" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">0</text>
  <text x="246" y="219" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">i = 0</text>
  <text x="350" y="219" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">2</text>
  <rect x="46" y="230" width="436" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,230 V262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,230 V262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,230 V262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,230 V262" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="147" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="246" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="350" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="440" y="251" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <rect x="46" y="262" width="436" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <path d="M104,262 V294" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M190,262 V294" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M302,262 V294" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M398,262 V294" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="75" y="283" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">5</text>
  <text x="147" y="283" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">1</text>
  <text x="246" y="283" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">i = 2</text>
  <text x="350" y="283" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">2</text>
  <text x="440" y="283" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">4</text>

  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">P[3] = P[0] = 0 ⇒ i = 0、k = 2，j 可取 1、2 → (0,1,2)、(0,2,2)</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">P[5] = P[2] = 1 ⇒ i = 2、k = 4，j 可取 3、4 → (2,3,4)、(2,4,4)</text>
  <text x="260" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">两处各 2 个，共 2 + 2 = 4 个三元组，与示例输出一致 ✓</text>
</svg>
