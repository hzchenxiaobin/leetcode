<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">把 a₁..a_r 的 run 压缩后「从右往左」读</text>
  <text x="380" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">run 链 (v₀,len₀), (v₁,len₁), …；遇到重复的 v 立即截断</text>

  <!-- 链: 右 → 左 -->
  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <rect x="470" y="86" width="140" height="52" rx="8" fill="#e8f0fe"/>
    <rect x="300" y="86" width="140" height="52" rx="8" fill="#e6f4ea"/>
    <rect x="130" y="86" width="140" height="52" rx="8" fill="#fff8e1"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="540" y="108">v₀ = 3, len₀ = 2</text>
    <text x="540" y="128">最近的一段</text>
    <text x="370" y="108">v₁ = 1, len₁ = 1</text>
    <text x="370" y="128">上一段</text>
    <text x="200" y="108">v₂ = 3, len₂ = 1</text>
    <text x="200" y="128">更早的一段</text>
  </g>
  <path d="M462,112 L450,112" stroke="#b85450" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M292,112 L280,112" stroke="#b85450" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="380" y="164" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">v₂ = v₀ 重复 ⇒ 链在 v₂ 前截断（同一玩家只能占一个名次）</text>

  <!-- 交错符号项 -->
  <g font-size="16" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="540" y="212">+ len₀ · (n−1)!</text>
    <text x="370" y="212">− len₁ · (n−2)!</text>
    <text x="200" y="212">+ len₂ · (n−3)!</text>
  </g>
  <g stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)">
    <path d="M540,226 L540,248"/>
    <path d="M370,226 L370,248"/>
    <path d="M200,226 L200,248"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="3 3" filter="url(#rough2)">
    <path d="M540,248 L200,248"/>
  </g>

  <!-- 公式 -->
  <g stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" filter="url(#rough2)">
    <rect x="60" y="272" width="640" height="46" rx="10"/>
  </g>
  <text x="380" y="300" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">F(r) = Σ_j (−1)^j · len_j · (n−1−j)!   （对所有保留下来的 run 求和）</text>
  <g stroke="#b85450" stroke-width="1.6" fill="#fce4ec" filter="url(#rough2)">
    <rect x="60" y="328" width="640" height="46" rx="10"/>
  </g>
  <text x="380" y="356" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">G(r,x) = Σ_{j &lt; cut(x)} (−1)^j · len_j · (n−2−j)!   （只到 x 所在 run 之前）</text>
  <text x="380" y="390" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">F(r)：第 r 轮「匹配」的排列数；G(r,x)：第 r 轮匹配且 p_{r+1} = x 的排列数</text>
</svg>
