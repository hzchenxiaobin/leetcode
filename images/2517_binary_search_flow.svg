<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：排序 + 二分答案 + 贪心 check</text>

  <!-- 1 sort -->
  <g filter="url(#sk)"><rect x="250" y="46" width="140" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66">① 排序 price（升序）</text>
  <path d="M 320 82 L 320 106" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 2 init -->
  <g filter="url(#sk)"><rect x="196" y="108" width="248" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="130" text-anchor="middle" font-size="12" fill="#2b4a66">② lo = 0，hi = M = price[n−1] − price[0]，ans = 0</text>
  <path d="M 320 142 L 320 166" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- diamond A: lo <= hi? -->
  <g filter="url(#sk)"><polygon points="320,168 406,204 320,240 234,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">lo ≤ hi ?</text>
  <path d="M 406 204 L 476 204" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="428" y="196" text-anchor="middle" font-size="11" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="478" y="186" width="118" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="537" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">返回 ans ✔</text>
  <path d="M 320 240 L 320 264" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="334" y="258" text-anchor="start" font-size="11" fill="#888">是</text>

  <!-- 3 mid -->
  <g filter="url(#sk)"><rect x="232" y="266" width="176" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#2b4a66">③ mid = (lo + hi) / 2</text>
  <path d="M 320 300 L 320 324" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- check group -->
  <g filter="url(#sk)"><rect x="70" y="326" width="500" height="96" rx="10" fill="#fffdf2" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="7 5"/></g>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a">check(mid)：贪心判定「能否选 k 颗使相邻差都 ≥ mid」</text>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#8a6a2a">cnt = 1, last = price[0]；遍历 i = 1..n−1：</text>
  <text x="320" y="402" text-anchor="middle" font-size="11.5" fill="#8a6a2a">若 price[i] − last ≥ mid ⇒ cnt++，last = price[i]（cnt ≥ k 立即返回 true）</text>
  <path d="M 320 422 L 320 448" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- diamond B: feasible? -->
  <g filter="url(#sk)"><polygon points="320,450 420,494 320,538 220,494" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="499" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a">cnt ≥ k（可行）?</text>
  <path d="M 220 494 L 176 494" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="198" y="486" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 420 494 L 464 494" stroke="#b85450" stroke-width="1.8" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="442" y="486" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- left branch: feasible -->
  <g filter="url(#sk)"><rect x="22" y="458" width="152" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="98" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">ans = mid</text>
  <text x="98" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">lo = mid + 1</text>
  <text x="98" y="522" text-anchor="middle" font-size="10" fill="#4a7a3a">向右找更大 ✓</text>

  <!-- right branch: infeasible -->
  <g filter="url(#sk)"><rect x="466" y="458" width="152" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="542" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">hi = mid − 1</text>
  <text x="542" y="504" text-anchor="middle" font-size="10" fill="#b85450">向左收紧 ✗</text>

  <!-- loop back arrows -->
  <path d="M 98 458 Q 98 204 234 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 542 458 Q 542 204 406 204" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="62" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a">回到 ③ 继续二分</text>
</svg>
