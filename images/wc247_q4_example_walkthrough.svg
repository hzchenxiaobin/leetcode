<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>
  <text x="470" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：prevRoom = [-1,0,0,1,2] —— 逆 BFS 序一遍求出所有子树大小</text>
  <path d="M 210 38 Q 470 48 730 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- BFS strip -->
  <text x="255" y="66" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">BFS 序 order（父恒先于子出现）</text>
  <g filter="url(#sk)">
    <rect x="120" y="76" width="46" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="176" y="76" width="46" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="232" y="76" width="46" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="288" y="76" width="46" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="344" y="76" width="46" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="143" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">0</text>
  <text x="199" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <text x="255" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="311" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="367" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <path d="M 390 134 Q 255 160 122 136" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="255" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03d38" filter="url(#sk)">逆序处理（孩子先于父）</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="100" y="186" width="610" height="30" rx="5" fill="#f0efe9" stroke="#c5c2b8" stroke-width="1.2"/>
  </g>
  <text x="130" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">u</text>
  <text x="200" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">parent</text>
  <text x="300" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">操作</text>
  <text x="566" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">sz 数组</text>
  <text x="462" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">[0]</text>
  <text x="514" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">[1]</text>
  <text x="566" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">[2]</text>
  <text x="618" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">[3]</text>
  <text x="670" y="222" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">[4]</text>

  <!-- rows: y = 228, 276, 324, 372, 420 ; sz boxes x=440,492,544,596,648 w=44 -->
  <text x="130" y="252" text-anchor="middle" font-size="13" fill="#888" filter="url(#sk)">—</text>
  <text x="200" y="252" text-anchor="middle" font-size="13" fill="#888" filter="url(#sk)">—</text>
  <text x="230" y="252" font-size="12.5" fill="#444" filter="url(#sk)">初始：全部为 1</text>
  <text x="130" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">4</text>
  <text x="200" y="300" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">2</text>
  <text x="230" y="300" font-size="12.5" fill="#444" filter="url(#sk)">sz[2] += sz[4]</text>
  <text x="130" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">3</text>
  <text x="200" y="348" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">1</text>
  <text x="230" y="348" font-size="12.5" fill="#444" filter="url(#sk)">sz[1] += sz[3]</text>
  <text x="130" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">2</text>
  <text x="200" y="396" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">0</text>
  <text x="230" y="396" font-size="12.5" fill="#444" filter="url(#sk)">sz[0] += sz[2]</text>
  <text x="130" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#sk)">1</text>
  <text x="200" y="444" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">0</text>
  <text x="230" y="444" font-size="12.5" fill="#444" filter="url(#sk)">sz[0] += sz[1]</text>

  <!-- sz arrays -->
  <!-- row 0: all gray [1,1,1,1,1] y=228 -->
  <g filter="url(#sk)">
    <rect x="440" y="228" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="492" y="228" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="544" y="228" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="596" y="228" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="648" y="228" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="462" y="252">1</text><text x="514" y="252">1</text><text x="566" y="252">1</text><text x="618" y="252">1</text><text x="670" y="252">1</text>
  </g>

  <!-- row 1: [1,1,2,1,1] highlight idx2 y=276 -->
  <g filter="url(#sk)">
    <rect x="440" y="276" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="492" y="276" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="544" y="276" width="44" height="38" rx="5" fill="#fdebd0" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="596" y="276" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="648" y="276" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="462" y="300">1</text><text x="514" y="300">1</text><text x="618" y="300">1</text><text x="670" y="300">1</text>
  </g>
  <text x="566" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06514" filter="url(#sk)">2</text>

  <!-- row 2: [1,2,2,1,1] highlight idx1 y=324 -->
  <g filter="url(#sk)">
    <rect x="440" y="324" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="492" y="324" width="44" height="38" rx="5" fill="#fdebd0" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="544" y="324" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="596" y="324" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="648" y="324" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="462" y="348">1</text><text x="566" y="348">2</text><text x="618" y="348">1</text><text x="670" y="348">1</text>
  </g>
  <text x="514" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06514" filter="url(#sk)">2</text>

  <!-- row 3: [3,2,2,1,1] highlight idx0 y=372 -->
  <g filter="url(#sk)">
    <rect x="440" y="372" width="44" height="38" rx="5" fill="#fdebd0" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="492" y="372" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="544" y="372" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="596" y="372" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="648" y="372" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="514" y="396">2</text><text x="566" y="396">2</text><text x="618" y="396">1</text><text x="670" y="396">1</text>
  </g>
  <text x="462" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06514" filter="url(#sk)">3</text>

  <!-- row 4: [5,2,2,1,1] highlight idx0 y=420 -->
  <g filter="url(#sk)">
    <rect x="440" y="420" width="44" height="38" rx="5" fill="#fdebd0" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="492" y="420" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="544" y="420" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="596" y="420" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
    <rect x="648" y="420" width="44" height="38" rx="5" fill="#f5f5f5" stroke="#b8b8b8" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="514" y="444">2</text><text x="566" y="444">2</text><text x="618" y="444">1</text><text x="670" y="444">1</text>
  </g>
  <text x="462" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06514" filter="url(#sk)">5</text>

  <!-- side annotation -->
  <text x="740" y="330" font-size="12" fill="#555" filter="url(#sk)">橙色 = 本步</text>
  <text x="740" y="350" font-size="12" fill="#555" filter="url(#sk)">刚更新的格子</text>
  <text x="740" y="376" font-size="12" fill="#888" filter="url(#sk)">逆序保证累加时</text>
  <text x="740" y="396" font-size="12" fill="#888" filter="url(#sk)">孩子的 sz 已就绪</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="60" y="478" width="820" height="118" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="470" y="510" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5518" filter="url(#sk)">最终 sz = [5, 2, 2, 1, 1] → ∏ sz = 5·2·2·1·1 = 20，n! = 120</text>
  <text x="470" y="540" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">ans = 120 × 20^(p−2) ≡ 120 / 20 = 6 (mod 10⁹+7) ✓</text>
  <text x="470" y="568" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">除法经一次费马逆元完成：先累乘、后整体求幂</text>
</svg>
