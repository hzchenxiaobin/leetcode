<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">置换环分解：最少交换 = n − 环数</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#888">把 pos = [3, 2, 1, 0] 画成「i → pos[i]」的有向图，箭头颜色相同的属于同一个环</text>

  <g filter="url(#sk)">
    <circle cx="140" cy="140" r="26" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="280" cy="140" r="26" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="420" cy="140" r="26" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="560" cy="140" r="26" fill="#ffffff" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" font-family="monospace" fill="#2b6e9e">
    <text x="140" y="146">0</text>
    <text x="280" y="146">1</text>
    <text x="420" y="146">2</text>
    <text x="560" y="146">3</text>
  </g>

  <path d="M 140 114 Q 350 34 560 114" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="350" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">0 → 3</text>
  <path d="M 560 166 Q 350 250 140 166" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="350" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">3 → 0</text>
  <path d="M 280 114 Q 350 82 420 114" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="350" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">1 → 2</text>
  <path d="M 420 166 Q 350 198 280 166" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="350" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">2 → 1</text>

  <g filter="url(#sk)">
    <rect x="68" y="244" width="246" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="191" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">环 A：(0 → 3 → 0)</text>
  <text x="191" y="288" text-anchor="middle" font-size="11.5" fill="#555">长度 2，需 2 − 1 = 1 次交换</text>

  <g filter="url(#sk)">
    <rect x="326" y="244" width="246" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="449" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">环 B：(1 → 2 → 1)</text>
  <text x="449" y="288" text-anchor="middle" font-size="11.5" fill="#555">长度 2，需 2 − 1 = 1 次交换</text>

  <g filter="url(#sk)">
    <rect x="68" y="314" width="504" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">答案 = Σ(环长 − 1) = n − 环数 = 4 − 2 = 2</text>

  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#888">自环（长度 1）= 已就位，无需交换；数组完全有序时有 n 个自环 → 答案 0</text>
</svg>
