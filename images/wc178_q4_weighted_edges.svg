<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="30" font-size="15" fill="#444" font-weight="bold">核心建模：把「改方向」变成 0/1 边权</text>
    <text x="280" y="52" font-size="11" fill="#888">从格子 (i, j) 走向四个相邻格子：顺箭头 0 代价，其余方向 1 代价</text>
  </g>

  <rect x="232" y="160" width="96" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="184" font-size="11.5" fill="#8a6a20" font-weight="bold">grid[i][j] = 1</text>
    <text x="280" y="203" font-size="10.5" fill="#8a6a20">当前指向：右 →</text>
  </g>

  <path d="M 330 188 L 386 188" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 230 188 L 174 188" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 280 158 L 280 124" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 280 218 L 280 252" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="396" y="164" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="456" y="184" font-size="11" fill="#3a5a30" font-weight="bold">右 → 权 0</text>
    <text x="456" y="201" font-size="9.5" fill="#3a5a30">不用改，代价 0</text>
  </g>

  <rect x="44" y="164" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="109" y="184" font-size="10.5" fill="#8a3a36" font-weight="bold">左 ← / 上 ↑ / 下 ↓</text>
    <text x="109" y="201" font-size="9.5" fill="#8a3a36">都要改一次，代价 1</text>
  </g>

  <rect x="200" y="74" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="101" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">上 ↑ 权 1（改方向）</text>

  <rect x="200" y="258" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="285" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">下 ↓ 权 1（改方向）</text>

  <rect x="60" y="318" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="340" font-size="11" fill="#3a4a66" font-weight="bold">最短路权值和 = 最少修改次数</text>
    <text x="280" y="357" font-size="10" fill="#3a4a66">dist[m−1][n−1] 就是答案（终点到达即结束，箭头无关）</text>
  </g>

  <text x="280" y="388" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">边权只有 0 和 1，所以不必用堆：0-1 BFS 即可 O(mn)</text>
</svg>
