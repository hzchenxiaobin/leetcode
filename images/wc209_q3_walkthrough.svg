<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：双副本展开 + 滑动窗口逐步走查</text>

  <!-- 左框：示例 1 -->
  <g filter="url(#r)">
    <rect x="42" y="48" width="270" height="324" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="177" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#r)">示例 1：angle = 90°</text>
  <text x="56" y="90" font-size="10" fill="#555" filter="url(#r)">points=[[2,1],[2,2],[3,3]]，loc=(1,1)</text>
  <text x="56" y="108" font-size="10" fill="#555" filter="url(#r)">极角：0°, 45°, 45°（(2,2) 与 (3,3) 同向）</text>
  <text x="56" y="126" font-size="10" font-weight="bold" fill="#446688" filter="url(#r)">双副本 [0, 45, 45, 360, 405, 405]</text>

  <g filter="url(#r)">
    <line x1="56" y1="138" x2="298" y2="138" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="10" fill="#666" filter="url(#r)">
    <text x="62" y="152">i</text>
    <text x="92" y="152">θ[i]</text>
    <text x="142" y="152">θi − θj</text>
    <text x="248" y="152">窗内点数</text>
  </g>
  <g filter="url(#r)">
    <rect x="50" y="158" width="254" height="20" fill="#fff8e1"/>
  </g>
  <g font-size="10.5" fill="#444" filter="url(#r)">
    <text x="62" y="172">0</text><text x="92" y="172">0°</text><text x="142" y="172">—</text><text x="252" y="172">1</text>
    <text x="62" y="194">1</text><text x="92" y="194">45°</text><text x="142" y="194">45 ≤ 90 ✓</text><text x="252" y="194">2</text>
    <text x="62" y="216" font-weight="bold" fill="#b03a3a">2</text><text x="92" y="216" font-weight="bold" fill="#b03a3a">45°</text><text x="142" y="216" font-weight="bold" fill="#b03a3a">45 ≤ 90 ✓</text><text x="252" y="216" font-weight="bold" fill="#b03a3a">3 ★max</text>
    <text x="62" y="238">3</text><text x="92" y="238">360°</text><text x="142" y="238">315 &gt; 90，j 跳到 3</text><text x="252" y="238">1</text>
    <text x="62" y="260">4</text><text x="92" y="260">405°</text><text x="142" y="260">45 ≤ 90 ✓</text><text x="252" y="260">2</text>
    <text x="62" y="282">5</text><text x="92" y="282">405°</text><text x="142" y="282">45 ≤ 90 ✓</text><text x="252" y="282">3</text>
  </g>
  <text x="177" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#r)">窗口 max = 3 → 3 + 0 = 3 ✓</text>
  <text x="177" y="328" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#r)">45° 跨度装进 90° 视野；i=5 的 3 与 i=2 是同一批点的第二副本</text>
  <text x="177" y="348" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#r)">无重合点 → cnt = 0</text>

  <!-- 右框：示例 3 -->
  <g filter="url(#r)">
    <rect x="308" y="48" width="270" height="324" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="443" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#a67c1b" filter="url(#r)">示例 3：angle = 13°</text>
  <text x="322" y="90" font-size="10" fill="#555" filter="url(#r)">points=[[1,0],[2,1]]，loc=(1,1)</text>
  <text x="322" y="108" font-size="10" fill="#555" filter="url(#r)">极角：(1,0)→270°，(2,1)→0°</text>
  <text x="322" y="126" font-size="10" font-weight="bold" fill="#a67c1b" filter="url(#r)">双副本 [0, 270, 360, 630]</text>

  <g filter="url(#r)">
    <line x1="322" y1="138" x2="564" y2="138" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="10" fill="#666" filter="url(#r)">
    <text x="328" y="152">i</text>
    <text x="358" y="152">θ[i]</text>
    <text x="408" y="152">θi − θj</text>
    <text x="514" y="152">窗内点数</text>
  </g>
  <g font-size="10.5" fill="#444" filter="url(#r)">
    <text x="328" y="172">0</text><text x="358" y="172">0°</text><text x="408" y="172">—</text><text x="518" y="172">1</text>
    <text x="328" y="194">1</text><text x="358" y="194">270°</text><text x="408" y="194">270 &gt; 13，j 跳到 1</text><text x="518" y="194">1</text>
    <text x="328" y="216">2</text><text x="358" y="216">360°</text><text x="408" y="216">90 &gt; 13，j 跳到 2</text><text x="518" y="216">1</text>
    <text x="328" y="238">3</text><text x="358" y="238">630°</text><text x="408" y="238">—，j = 3</text><text x="518" y="238">1</text>
  </g>
  <text x="443" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">窗口 max = 1 → 1 + 0 = 1 ✓</text>
  <text x="443" y="284" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#r)">相邻极角最小差 90° &gt; 13°，窗口装不下第二个点</text>

  <g filter="url(#r)">
    <rect x="320" y="298" width="246" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="443" y="318" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a" filter="url(#r)">试想 angle = 95°：</text>
  <text x="443" y="336" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#r)">i=2 时 360 − 270 = 90 ≤ 95 ✓ → 窗内 2 个 → 答案变 2</text>
  <text x="443" y="352" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#r)">张角差一点，结果天差地别——eps 容差就在这里见真章</text>

  <!-- 底部横条 -->
  <g filter="url(#r)">
    <rect x="42" y="384" width="536" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="310" y="405" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#r)">示例 2：极角 [0°, 45°, 56.3°] 同窗 3 个 + 与你重合的点 (1,1) → 3 + 1 = 4，重合点永远单独计数</text>
</svg>
