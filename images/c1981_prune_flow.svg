<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程:逐行转移,双重维护 dp 与 over</text>

  <!-- 开始 -->
  <rect x="190" y="40" width="180" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">dp[0] = 1,over = ∞</text>
  <path d="M 280 72 L 280 90" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 取行 -->
  <rect x="170" y="92" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取下一行 row,算 rmin = min(row)</text>
  <path d="M 280 128 L 280 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="170,188 280,148 390,188 280,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">s + v &gt; target ?</text>
  <text x="280" y="200" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">(s 遍历 dp 可达和,v 遍历 row)</text>

  <!-- 是 → 左 -->
  <path d="M 170 188 L 148 188" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="16" y="170" width="130" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81" y="186" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">超额:折叠</text>
  <text x="81" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nover ← min(nover, s+v)</text>

  <!-- 否 → 右 -->
  <path d="M 390 188 L 412 188" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="414" y="170" width="130" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="479" y="186" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">不超:照常保留</text>
  <text x="479" y="201" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ndp[s+v] ← 1</text>

  <!-- 汇合 -->
  <path d="M 81 208 L 81 232 L 205 232 L 205 246" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 479 208 L 479 232 L 355 232 L 355 246" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- over 延续 -->
  <rect x="155" y="248" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="9.5" fill="#8a6420" filter="url(#rough2)">over &lt; ∞ ?(上一轮已有超额)</text>
  <text x="280" y="280" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">nover ← min(nover, over + rmin)</text>
  <path d="M 280 290 L 280 306" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 滚动 -->
  <rect x="170" y="308" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">dp ← ndp,over ← nover</text>
  <path d="M 280 340 L 280 354" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 还有行? -->
  <polygon points="190,386 280,356 370,386 280,416" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">还有下一行?</text>

  <!-- 回环 -->
  <path d="M 190 386 L 90 386 L 90 110 L 166 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="248" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是,继续</text>

  <!-- 终止 -->
  <path d="M 370 386 L 396 386" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="382" y="378" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="398" y="360" width="152" height="52" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="474" y="380" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ans = min( min|target−s|,</text>
  <text x="474" y="397" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">over − target )</text>

  <text x="280" y="450" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">注:over 的最优延续是每行都选最小值 rmin——其余超额延伸只会更超额</text>
</svg>
