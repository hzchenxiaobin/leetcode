<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "abceded" → word2 = "baecfef"</text>

  <!-- 划分 -->
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">最优划分（按颜色切成三段）：</text>

  <!-- 段1 ab/ba -->
  <rect x="150" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>
  <rect x="194" y="60" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="150" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="172" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">b</text>
  <rect x="194" y="90" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a</text>

  <!-- 段2 ce/ec -->
  <rect x="258" y="60" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>
  <rect x="302" y="60" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">e</text>
  <rect x="258" y="90" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">e</text>
  <rect x="302" y="90" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="324" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c</text>

  <!-- 段3 ded/fef -->
  <rect x="366" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">d</text>
  <rect x="410" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">e</text>
  <rect x="454" y="60" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="476" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">d</text>
  <rect x="366" y="90" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="388" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f</text>
  <rect x="410" y="90" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="432" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">e</text>
  <rect x="454" y="90" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="476" y="110" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f</text>

  <text x="110" y="80" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">word1</text>
  <text x="110" y="110" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">word2</text>

  <!-- 演算表 -->
  <!-- 表头 -->
  <rect x="40" y="140" width="106" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">段 → 目标</text>
  <rect x="146" y="140" width="150" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">错配桶</text>
  <rect x="296" y="140" width="52" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">M</text>
  <rect x="348" y="140" width="52" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">P</text>
  <rect x="400" y="140" width="76" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="159" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">正序 A</text>
  <rect x="476" y="140" width="84" height="28" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="518" y="159" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">镜像 B(+1)</text>

  <!-- 行1 ab -->
  <rect x="40" y="168" width="106" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ab"→"ba"</text>
  <rect x="146" y="168" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="221" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(a,b) 与 (b,a) 各 1</text>
  <rect x="296" y="168" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="322" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="348" y="168" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="374" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="168" width="76" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="438" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2−1 = 1</text>
  <rect x="476" y="168" width="84" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="518" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1+0 = 1</text>

  <!-- 行2 ce -->
  <rect x="40" y="202" width="106" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ce"→"ec"</text>
  <rect x="146" y="202" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="221" y="224" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(c,e) 与 (e,c) 各 1</text>
  <rect x="296" y="202" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="322" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="348" y="202" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="374" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="202" width="76" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="438" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2−1 = 1</text>
  <rect x="476" y="202" width="84" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="518" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1+0 = 1</text>

  <!-- 行3 ded -->
  <rect x="40" y="236" width="106" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"ded"→"fef"</text>
  <rect x="146" y="236" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="221" y="258" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">(d,f)×2，无 (f,d)</text>
  <rect x="296" y="236" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="322" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="348" y="236" width="52" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="374" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="400" y="236" width="76" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="438" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2−0 = 2</text>
  <rect x="476" y="236" width="84" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="518" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1+2 = 3</text>

  <!-- 合计 -->
  <rect x="40" y="272" width="312" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="196" y="294" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计：min 逐段取 = 1 + 1 + 2 = 4 ✓</text>
  <rect x="352" y="272" width="208" height="34" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="456" y="288" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">与题面解释一致：两次交换</text>
  <text x="456" y="301" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">"ab"、"ce" + 两次替换 "ded"</text>

  <!-- 注释 -->
  <rect x="40" y="322" width="520" height="110" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="56" y="344" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">三个值得注意的细节：</text>
  <text x="56" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">① "ab" 段两种方案打平：1 次交换 与 「反转后恰好全对（1+0）」同为 1，任选其一；</text>
  <text x="56" y="386" font-size="10.5" fill="#333" filter="url(#rough2)">② "ded" 是回文：镜像比较与正序完全相同，反转白付 1（1+2=3 劣于 2）；</text>
  <text x="56" y="406" font-size="10.5" fill="#333" filter="url(#rough2)">③ "ded" 的两个错配同为 (d,f)，找不到 (f,d) 伙伴配对交换，只能逐个替换。</text>
  <text x="56" y="426" font-size="10.5" fill="#b85450" filter="url(#rough2)">④ 整段不划分也算得 4（M=6, P=2：两次交换 + 两次替换）——最优解不唯一，DP 殊途同归。</text>
</svg>
