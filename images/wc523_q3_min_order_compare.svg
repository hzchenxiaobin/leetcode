<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">getMinTime：顺序决定靠窗座吃不吃 +2 延迟</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">同样把 B3、A3 都订上，两种顺序开销完全不同</text>

  <rect x="30" y="68" width="220" height="216" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">先 B3 后 A3 → 吃延迟</text>

  <rect x="52" y="106" width="176" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① toggle B3（中间座）</text>
  <text x="140" y="141" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">开销 1 秒</text>
  <path d="M 140 150 L 140 158" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="52" y="164" width="176" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② toggle A3（靠窗座）</text>
  <text x="140" y="199" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">B3 已订 → 开销 3 秒</text>
  <text x="140" y="236" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">总时间 = 1 + 3 = 4 秒</text>
  <text x="140" y="256" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（示例 1 里的 total = 4）</text>

  <rect x="270" y="68" width="220" height="216" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">先 A3 后 B3 → 无延迟</text>

  <rect x="292" y="106" width="176" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="124" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① toggle A3（靠窗座）</text>
  <text x="380" y="141" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">B3 还空着 → 开销 1 秒</text>
  <path d="M 380 150 L 380 158" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="292" y="164" width="176" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="182" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② toggle B3（中间座）</text>
  <text x="380" y="199" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">开销 1 秒</text>
  <text x="380" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">总时间 = 1 + 1 = 2 秒</text>
  <text x="380" y="256" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（示例 1 里的 minTime = 2）</text>

  <rect x="30" y="300" width="460" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">把所有靠窗座排在所有中间座前面预订 → 人人都 1 秒</text>
  <text x="260" y="350" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">⇒ getMinTime() = 已预订座位数 cnt</text>
</svg>
