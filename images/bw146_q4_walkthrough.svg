<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 走查：只有 i = 2 与 i = 3 有贡献</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,2,2,3,3,4]，答案 4</text>

  <rect x="30" y="62" width="248" height="186" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="154" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 2，a = nums[2] = 2</text>
  <text x="154" y="112" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">左半 [1, 2]，右半 [3, 3, 4]</text>
  <text x="154" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">左取 {1,2} ⇒ t = 1（a 在左）</text>
  <text x="154" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右取 {3,4}：2 种 ✓</text>
  <text x="154" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">右取 {3,3}：✗ 3 与 a 并列</text>
  <text x="154" y="212" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">贡献 2</text>
  <text x="154" y="234" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">t ≥ 2 的 6 项在此为 0</text>

  <rect x="282" y="62" width="248" height="186" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="406" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 3，a = nums[3] = 3</text>
  <text x="406" y="112" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">左半 [1, 2, 2]，右半 [3, 4]</text>
  <text x="406" y="136" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">右取 {3,4} ⇒ t = 1（a 在右）</text>
  <text x="406" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左取两个 2 之一：2 种 ✓</text>
  <text x="406" y="184" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">左取 {1,2} 时 1、2、4 互异</text>
  <text x="406" y="212" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">贡献 2</text>
  <text x="406" y="234" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">右半只有 1 种取法</text>

  <rect x="130" y="262" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">合计 2 + 2 = 4</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">与示例输出一致</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">其余中间位置（i = 0,1,4,5）两侧元素不足，贡献均为 0</text>
</svg>
