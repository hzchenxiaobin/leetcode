<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三个条件 = 两种「值域切分」+ 一种「同字母归并」</text>
  <path d="M 190 40 Q 340 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 条件 1 -->
  <text x="50" y="66" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b">条件 1：a 全小、b 全大</text>
  <g filter="url(#sk)">
    <circle cx="345" cy="58" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="345" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">c</text>
  <path d="M 345 72 L 345 130" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="50" y="80" width="292" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="348" y="80" width="292" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="196" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">a 的字母 → 全部 ≤ c</text>
  <text x="494" y="98" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">b 的字母 → 全部 &gt; c</text>
  <text x="64" y="117" text-anchor="middle" font-size="9.5" fill="#555">a</text>
  <text x="86" y="117" text-anchor="middle" font-size="9.5" fill="#555">b</text>
  <text x="108" y="117" text-anchor="middle" font-size="9.5" fill="#555">c</text>
  <text x="130" y="117" text-anchor="middle" font-size="9.5" fill="#555">d</text>
  <text x="152" y="117" text-anchor="middle" font-size="9.5" fill="#555">e</text>
  <text x="174" y="117" text-anchor="middle" font-size="9.5" fill="#555">f</text>
  <text x="196" y="117" text-anchor="middle" font-size="9.5" fill="#555">g</text>
  <text x="218" y="117" text-anchor="middle" font-size="9.5" fill="#555">h</text>
  <text x="240" y="117" text-anchor="middle" font-size="9.5" fill="#555">i</text>
  <text x="262" y="117" text-anchor="middle" font-size="9.5" fill="#555">j</text>
  <text x="284" y="117" text-anchor="middle" font-size="9.5" fill="#555">k</text>
  <text x="306" y="117" text-anchor="middle" font-size="9.5" fill="#555">l</text>
  <text x="328" y="117" text-anchor="middle" font-size="9.5" fill="#555">m</text>
  <text x="350" y="117" text-anchor="middle" font-size="9.5" fill="#555">n</text>
  <text x="372" y="117" text-anchor="middle" font-size="9.5" fill="#555">o</text>
  <text x="394" y="117" text-anchor="middle" font-size="9.5" fill="#555">p</text>
  <text x="416" y="117" text-anchor="middle" font-size="9.5" fill="#555">q</text>
  <text x="438" y="117" text-anchor="middle" font-size="9.5" fill="#555">r</text>
  <text x="460" y="117" text-anchor="middle" font-size="9.5" fill="#555">s</text>
  <text x="482" y="117" text-anchor="middle" font-size="9.5" fill="#555">t</text>
  <text x="504" y="117" text-anchor="middle" font-size="9.5" fill="#555">u</text>
  <text x="526" y="117" text-anchor="middle" font-size="9.5" fill="#555">v</text>
  <text x="548" y="117" text-anchor="middle" font-size="9.5" fill="#555">w</text>
  <text x="570" y="117" text-anchor="middle" font-size="9.5" fill="#555">x</text>
  <text x="592" y="117" text-anchor="middle" font-size="9.5" fill="#555">y</text>
  <text x="614" y="117" text-anchor="middle" font-size="9.5" fill="#555">z</text>
  <text x="345" y="142" text-anchor="middle" font-size="11" fill="#444">等价于 max(a) &lt; min(b)；两侧值域不重叠，天然严格</text>

  <!-- 条件 2 -->
  <text x="50" y="170" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b">条件 2：b 全小、a 全大（对调即可）</text>
  <g filter="url(#sk)">
    <circle cx="345" cy="168" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="345" y="172.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#b03a3a">c</text>
  <path d="M 345 178 L 345 234" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="50" y="184" width="292" height="44" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="348" y="184" width="292" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="196" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">b 的字母 → 全部 ≤ c</text>
  <text x="494" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a86">a 的字母 → 全部 &gt; c</text>
  <text x="64" y="221" text-anchor="middle" font-size="9.5" fill="#555">a</text>
  <text x="108" y="221" text-anchor="middle" font-size="9.5" fill="#555">c</text>
  <text x="152" y="221" text-anchor="middle" font-size="9.5" fill="#555">e</text>
  <text x="196" y="221" text-anchor="middle" font-size="9.5" fill="#555">g</text>
  <text x="240" y="221" text-anchor="middle" font-size="9.5" fill="#555">i</text>
  <text x="284" y="221" text-anchor="middle" font-size="9.5" fill="#555">k</text>
  <text x="328" y="221" text-anchor="middle" font-size="9.5" fill="#555">m</text>
  <text x="372" y="221" text-anchor="middle" font-size="9.5" fill="#555">o</text>
  <text x="416" y="221" text-anchor="middle" font-size="9.5" fill="#555">q</text>
  <text x="460" y="221" text-anchor="middle" font-size="9.5" fill="#555">s</text>
  <text x="504" y="221" text-anchor="middle" font-size="9.5" fill="#555">u</text>
  <text x="548" y="221" text-anchor="middle" font-size="9.5" fill="#555">w</text>
  <text x="592" y="221" text-anchor="middle" font-size="9.5" fill="#555">y</text>
  <text x="345" y="246" text-anchor="middle" font-size="11" fill="#444">与条件 1 共用同一组频次 / 前缀和，公式里两项对调</text>

  <!-- 警示框 -->
  <g filter="url(#sk)">
    <rect x="50" y="256" width="590" height="46" rx="8" fill="#fff1d6" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="345" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6220">边界 c 只能取 'a'..'y'：c = 'z' 时「&gt; z」是空集，b（非空）无字母可放</text>
  <text x="345" y="292" text-anchor="middle" font-size="11" fill="#8a6220">所以条件 1/2 的循环上界是 25，不是 26 —— 详见「边界情况」第 1 条</text>

  <!-- 条件 3 -->
  <text x="50" y="330" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b">条件 3：同字母归并 —— 两串都变成同一个字母 c</text>
  <g filter="url(#sk)">
    <rect x="70" y="342" width="170" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="280" y="342" width="170" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="85" y="358" text-anchor="start" font-size="11" font-weight="bold" fill="#2b5a86">a = "aba"</text>
  <g filter="url(#sk)">
    <rect x="100" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="126" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="152" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="110" y="379" text-anchor="middle" font-size="11" fill="#2b5a86">a</text>
  <text x="136" y="379" text-anchor="middle" font-size="11" fill="#2b5a86">b</text>
  <text x="162" y="379" text-anchor="middle" font-size="11" fill="#2b5a86">a</text>
  <text x="295" y="358" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e">b = "caa"</text>
  <g filter="url(#sk)">
    <rect x="310" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="336" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="362" y="364" width="20" height="20" rx="3" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="320" y="379" text-anchor="middle" font-size="11" fill="#2e6e2e">c</text>
  <text x="346" y="379" text-anchor="middle" font-size="11" fill="#2e6e2e">a</text>
  <text x="372" y="379" text-anchor="middle" font-size="11" fill="#2e6e2e">a</text>
  <path d="M 155 402 Q 200 436 264 438" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 365 402 Q 330 436 316 438" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="290" cy="444" r="22" fill="#fff1d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="290" y="449" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">全 c</text>
  <g filter="url(#sk)">
    <rect x="470" y="342" width="180" height="56" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="560" y="360" text-anchor="middle" font-size="10.5" fill="#444">不切分值域，无 'y' 限制</text>
  <text x="560" y="376" text-anchor="middle" font-size="10.5" fill="#444">c ∈ 'a'..'z'（26 个）</text>
  <text x="560" y="392" text-anchor="middle" font-size="10.5" fill="#444">只需「= c」的单点频次</text>
  <g filter="url(#sk)">
    <rect x="470" y="410" width="180" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="560" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">代价(c) =</text>
  <text x="560" y="446" text-anchor="middle" font-size="10.5" fill="#b03a3a">(lenA − cntA[c])</text>
  <text x="560" y="462" text-anchor="middle" font-size="10.5" fill="#b03a3a">+ (lenB − cntB[c])</text>
</svg>
