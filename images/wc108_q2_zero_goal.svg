<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="392" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">goal = 0 的特例：全是 0 的段怎么数</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">nums = [0,0,0,0]，goal = 0：任意子数组和都为 0</text>
  <rect x="60" y="82" width="540" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="106.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 子数组个数 = C(5, 2) = 10（长度 4 的数组有 10 个非空子数组）</text>
  <text x="60" y="156" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">前缀和序列：0, 0, 0, 0, 0（每个位置的 pre 都相同）</text>
  <text x="60" y="186" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">查表方式：cnt[pre − 0] = cnt[pre] 就是「此前有多少个相同前缀」</text>
  <rect x="60" y="208" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="232.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=1: ans += 1</text>
  <rect x="330" y="208" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455.0" y="232.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=2: ans += 2</text>
  <rect x="60" y="262" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="286.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=3: ans += 3</text>
  <rect x="330" y="262" width="250" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455.0" y="286.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=4: ans += 4</text>
  <text x="330" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 1+2+3+4 = 10，与 C(5,2) 一致</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 的 5 个 0 给出 15 = C(6,2)，正是同一个公式</text>
</svg>
