<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [3, 5, 9]，四值记作 (f00, f01, f10, f11)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">橙色 = 本次被重算的叶→根路径节点；C 叶未被两次查询触碰，四值始终不变</text>

  <text x="92" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始建树</text>
  <rect x="30" y="80" width="124" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">根 [0..2]：0 9 5 12</text>
  <rect x="30" y="130" width="100" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="148" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[0..1]：0 5 3 5</text>
  <rect x="140" y="130" width="80" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2]：0 0 0 9</text>
  <path d="M 80 156 L 55 178" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 180 156 L 122 178" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="14" y="180" width="82" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[0]：0 0 0 3</text>
  <rect x="106" y="180" width="82" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[1]：0 0 0 5</text>
  <text x="92" y="238" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">根 f11 = 12（3+9）</text>

  <text x="280" y="72" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询① [1, −2]</text>
  <rect x="218" y="80" width="124" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">根 [0..2]：0 9 3 12</text>
  <rect x="218" y="130" width="100" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[0..1]：0 0 3 3</text>
  <rect x="328" y="130" width="80" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[2]：0 0 0 9</text>
  <path d="M 268 156 L 243 178" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 368 156 L 310 178" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="202" y="180" width="82" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[0]：0 0 0 3</text>
  <rect x="294" y="180" width="82" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="335" y="198" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[1]：0 0 0 0</text>
  <text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 根 f11 = 12（3+9）</text>

  <text x="468" y="72" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">查询② [0, −3]</text>
  <rect x="406" y="80" width="124" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="468" y="98" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">根 [0..2]：0 9 0 9</text>
  <rect x="406" y="130" width="100" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="456" y="148" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[0..1]：0 0 0 0</text>
  <rect x="516" y="130" width="40" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="536" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">同前</text>
  <path d="M 456 156 L 431 178" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="390" y="180" width="82" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="431" y="198" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">[0]：0 0 0 0</text>
  <rect x="482" y="180" width="82" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="523" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[1]：0 0 0 0</text>
  <text x="468" y="238" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = 根 f11 = 9</text>

  <rect x="30" y="268" width="500" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案总和 = 12 + 9 = 21 ✓</text>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">注意修改持久：查询②时 nums[1] 仍是 −2（上一次改的），nums = [−3, −2, 9]</text>
  <text x="280" y="331" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">根的 f11 里「3+9」与「选 9」两条路线自动换轨：左端变 −3 后 3+9 路线劣化，max 落到 9</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">叶子 [1] 更新为 x 后四值 = (0, 0, 0, max(0, x))；x = −2 为负 → f11 落到 0</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个查询只有叶→根 O(log n) ≈ 17 个节点需要重算，n、q 均到 5×10⁴ 也从容</text>
  <text x="280" y="414" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（四值顺序：f00 首尾都不选 · f01 左不选右可选 · f10 左可选右不选 · f11 都可选）</text>
</svg>
