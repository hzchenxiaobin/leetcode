<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先判可行性，再用一次 k 循环把元素放到位</text>
  <text x="320" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">全程只有一层循环：没有展平数组，没有逐行拷贝，也没有额外队列</text>

  <g filter="url(#sk)">
    <rect x="170" y="62" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="290" y="84" text-anchor="middle" font-size="11" fill="#2f4a63">输入 mat（m × n）、r、c</text>
  </g>
  <path d="M 290 96 L 290 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="290,120 412,160 290,200 168,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <text x="290" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a20">m·n == r·c ？</text>
  </g>

  <g filter="url(#sk)">
    <rect x="460" y="136" width="160" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="540" y="157" text-anchor="middle" font-size="10.5" fill="#8a3a36">返回原矩阵 mat</text>
    <text x="540" y="174" text-anchor="middle" font-size="9.5" fill="#8a3a36">（元素与形状都不变）</text>
  </g>
  <path d="M 412 160 L 454 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="433" y="152" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">否</text>

  <path d="M 290 200 L 290 222" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="216" font-size="10" fill="#4a7a3a" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="170" y="224" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="290" y="246" text-anchor="middle" font-size="11" fill="#2f5a24">ans ← r 行 c 列的全 0 矩阵</text>
  </g>
  <path d="M 290 258 L 290 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="112" y="282" width="356" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="290" y="304" text-anchor="middle" font-size="10.5" fill="#2f4a63">for k = 0 … m·n − 1：</text>
    <text x="290" y="322" text-anchor="middle" font-size="10.5" fill="#2f4a63">ans[k / c][k % c] ← mat[k / n][k % n]</text>
    <text x="290" y="339" text-anchor="middle" font-size="9.5" fill="#667">读写指针同步前进，源与目标是同一条行优先序列</text>
  </g>
  <path d="M 290 348 L 290 368" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="370" width="240" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="290" y="391" text-anchor="middle" font-size="11" fill="#2f5a24">返回 ans</text>
  </g>

  <g filter="url(#sk)">
    <rect x="486" y="230" width="138" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="555" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20">复杂度</text>
    <text x="555" y="272" text-anchor="middle" font-size="9.5" fill="#555">时间 O(mn)</text>
    <text x="555" y="290" text-anchor="middle" font-size="9.5" fill="#555">额外空间 O(1)</text>
    <text x="555" y="308" text-anchor="middle" font-size="9.5" fill="#555">输出 O(rc)</text>
    <text x="555" y="324" text-anchor="middle" font-size="9" fill="#777">判断本身 O(1)</text>
  </g>
  <text x="486" y="352" font-size="9.5" fill="#777" filter="url(#sk)">等价写法：维护游标</text>
  <text x="486" y="366" font-size="9.5" fill="#777" filter="url(#sk)">(nr, nc)，每写一格 nc++</text>
  <text x="486" y="380" font-size="9.5" fill="#777" filter="url(#sk)">满 c 列则 nr++, nc = 0</text>

  <text x="320" y="410" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">两条分支互斥：不可行时一个新元素都不搬运，可行时每个元素恰好搬运一次</text>
</svg>
