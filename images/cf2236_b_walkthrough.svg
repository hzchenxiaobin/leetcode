<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330.0" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">五组官方样例：逐个数出每个余类里的 1</text>
  <g filter="url(#rough2)">
    <rect x="24" y="52" width="606" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <text x="40" y="78" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">组</text>
  <text x="100" y="78" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">n, k</text>
  <text x="200" y="78" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">s</text>
  <text x="320" y="78" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">每个余类中 1 的个数</text>
  <text x="570" y="78" text-anchor="start" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">结论</text>
  <g filter="url(#rough2)">
    <rect x="24" y="94" width="606" height="42" fill="#fffdf5" stroke="#ddd" stroke-width="1.0" rx="2"/>
  </g>
  <text x="50" y="120" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="100" y="120" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">4, 2</text>
  <text x="200" y="120" text-anchor="start" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">1010</text>
  <text x="320" y="120" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="normal" filter="url(#rough2)">r=0: 2 个，r=1: 0 个</text>
  <text x="590" y="120" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">YES</text>
  <g filter="url(#rough2)">
    <rect x="24" y="136" width="606" height="42" fill="#ffffff" stroke="#ddd" stroke-width="1.0" rx="2"/>
  </g>
  <text x="50" y="162" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="100" y="162" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">3, 2</text>
  <text x="200" y="162" text-anchor="start" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">111</text>
  <text x="320" y="162" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">r=0: 2 个，r=1: 1 个</text>
  <text x="590" y="162" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">NO</text>
  <g filter="url(#rough2)">
    <rect x="24" y="178" width="606" height="42" fill="#fffdf5" stroke="#ddd" stroke-width="1.0" rx="2"/>
  </g>
  <text x="50" y="204" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="100" y="204" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">3, 3</text>
  <text x="200" y="204" text-anchor="start" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">111</text>
  <text x="320" y="204" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">r=0: 1，r=1: 1，r=2: 1</text>
  <text x="590" y="204" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">NO</text>
  <g filter="url(#rough2)">
    <rect x="24" y="220" width="606" height="42" fill="#ffffff" stroke="#ddd" stroke-width="1.0" rx="2"/>
  </g>
  <text x="50" y="246" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="100" y="246" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">3, 1</text>
  <text x="200" y="246" text-anchor="start" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">110</text>
  <text x="320" y="246" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="normal" filter="url(#rough2)">r=0: 2 个</text>
  <text x="590" y="246" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">YES</text>
  <g filter="url(#rough2)">
    <rect x="24" y="262" width="606" height="42" fill="#fffdf5" stroke="#ddd" stroke-width="1.0" rx="2"/>
  </g>
  <text x="50" y="288" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="100" y="288" text-anchor="start" font-size="11" fill="#333" font-weight="normal" filter="url(#rough2)">1, 1</text>
  <text x="200" y="288" text-anchor="start" font-size="11.5" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320" y="288" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">r=0: 1 个</text>
  <text x="590" y="288" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">NO</text>
  <text x="330.0" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">反例：n = 3, k = 2, s = 110 —— 整串只有 2 个 1，但 r = 1 这一链只有 1 个 1</text>
  <text x="330.0" y="358" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="normal" filter="url(#rough2)">所以判据是「每个余类各自为偶数」，而不是「整串 1 的个数为偶数」</text>
  <text x="330.0" y="382" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="normal" filter="url(#rough2)">组 1 的两条链 0→2 与 1→3 各含偶数个 1，一次操作即可清零</text>
</svg>
