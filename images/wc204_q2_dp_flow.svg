<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="548" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：单趟扫描 · 三路分支（O(n) 时间 / O(1) 空间）</text>
  <path d="M 150 34 Q 280 40 410 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="185" y="44" width="190" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">初始化 pos = neg = 0</text>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M 280 84 L 280 106" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <polygon points="280,112 354,148 280,184 206,148" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i &lt; n ?</text>
  <text x="364" y="142" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 354 148 L 398 148" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="402" y="130" width="112" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="458" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans ⭐</text>
  <text x="290" y="200" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">是</text>
  <path d="M 280 184 L 280 204" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="215" y="208" width="130" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">x = nums[i]</text>

  <path d="M 280 240 L 280 262" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="280" cy="268" r="3.5" fill="#3a3a3a" filter="url(#rough2)"/>

  <path d="M 280 268 Q 226 278 106 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="206" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">x &gt; 0</text>
  <path d="M 280 268 L 280 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="286" font-size="10.5" font-weight="bold" fill="#9a7020" filter="url(#rough2)">x &lt; 0</text>
  <path d="M 280 268 Q 334 278 454 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="354" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 0</text>

  <rect x="22" y="296" width="158" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="322" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">pos = pos + 1</text>
  <text x="101" y="344" text-anchor="middle" font-size="10" fill="#334" filter="url(#rough2)">neg = neg&gt;0 ? neg+1 : 0</text>

  <rect x="196" y="296" width="168" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">tmp = pos</text>
  <text x="280" y="333" text-anchor="middle" font-size="10" fill="#334" filter="url(#rough2)">pos = neg&gt;0 ? neg+1 : 0</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#334" filter="url(#rough2)">neg = tmp + 1</text>

  <rect x="380" y="296" width="158" height="64" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="324" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">pos = 0</text>
  <text x="459" y="344" text-anchor="middle" font-size="11" fill="#334" filter="url(#rough2)">neg = 0</text>

  <path d="M 101 360 L 101 380 L 272 380" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 460 360 L 460 380 L 288 380" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 280 360 L 280 400" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="186" y="404" width="188" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans = max(ans, pos)</text>

  <path d="M 280 438 L 280 458" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="226" y="462" width="108" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="482" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i++</text>

  <path d="M 226 478 L 44 478 L 44 148 L 202 148" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="110" y="470" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">回到循环</text>

  <text x="280" y="528" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每步转移后立即收集 ans = max(ans, pos)——pos 是「以 i 结尾」的局部量，峰值要边扫边记</text>
</svg>
