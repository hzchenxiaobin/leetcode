<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">优先队列 BFS：从边界向内「注水」</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">堆里只放「水位已确定」的格子，每次取水位最低的那个向外扩散一格</text>

  <rect x="140" y="62" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 所有边界格入堆，并标记 visited</text>

  <rect x="140" y="122" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">② 弹出堆顶 (h, r, c)，h 即它的水位</text>

  <rect x="140" y="182" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">③ 枚举 4 邻居 nb，跳过已访问</text>

  <rect x="120" y="242" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">④ water += max(0, h - height[nb])</text>
  <text x="280" y="281" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">push(max(h, height[nb]), nb)，标记 nb</text>

  <polygon points="280,314 344,342 280,370 216,342" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">堆空？</text>

  <rect x="428" y="318" width="116" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="486" y="346" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">返回 water</text>

  <path d="M 280 102 L 280 122" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 162 L 280 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 222 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 294 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 344 342 L 428 342" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 342 L 62 342 L 62 142 L 140 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="352" y="334" font-size="10" fill="#2f5a28" filter="url(#rough2)">是</text>
  <text x="196" y="334" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">不变量：弹出水位单调不减，所以某格第一次被触达时的水位，就是它的最终水位</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">时间 O(mn log(mn))，空间 O(mn)；每格恰好入堆、出堆各一次</text>
</svg>
