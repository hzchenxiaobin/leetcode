<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">树状数组：一边扫描，一边回答「之前有几个更小的」</text>

  <!-- 步骤 1 -->
  <rect x="40" y="46" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="115" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">求前缀和 P[0..n]</text>
  <text x="115" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">O(n)</text>

  <path d="M192,72 L228,72" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr5)" filter="url(#rough2)"/>

  <rect x="232" y="46" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="307" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序去重 + 求排名</text>
  <text x="307" y="86" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">O(n log n)</text>

  <path d="M384,72 L420,72" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr5)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="60" y="120" width="400" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">for j = 0 .. n</text>

  <rect x="88" y="156" width="170" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="173" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans += query(rank[j] − 1)</text>
  <text x="173" y="190" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">严格小于才计数</text>

  <path d="M262,176 L288,176" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr5)" filter="url(#rough2)"/>

  <rect x="292" y="156" width="150" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="367" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">add(rank[j], 1)</text>
  <text x="367" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">把自己放进集合</text>

  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每次查询 / 插入均 O(log n)</text>

  <path d="M260,252 L260,278" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr5)" filter="url(#rough2)"/>

  <rect x="150" y="284" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans（long long / Python int）</text>
  <text x="260" y="320" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">最大约 5×10⁹，必须 64 位</text>

  <text x="430" y="120" font-size="11" fill="#999" filter="url(#rough2)">O(n log n)</text>
</svg>
