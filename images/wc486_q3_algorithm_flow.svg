<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：三次 BFS + 逐点勾股判定</text>

  <rect x="270" y="36" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="53" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,62 L320,74" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="76" width="290" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">建无向邻接表 g（每条边两个方向都加）</text>
  <path d="M320,110 L320,122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="124" width="340" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">BFS(x)、BFS(y)、BFS(z)</text>
  <text x="320" y="159" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">→ 距离数组 dx、dy、dz（dist = −1 兼作 visited）</text>
  <path d="M320,166 L320,178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="225" y="180" width="190" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="199" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">u = 0，ans = 0</text>
  <path d="M320,208 L320,220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,222 425,254 320,286 215,254" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="260" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">u &lt; n ?</text>

  <text x="441" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M425,254 L462,254" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="466" y="236" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="531" y="259" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="334" y="298" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M320,286 L320,300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="320,302 455,340 320,378 185,340" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">排序得 (a, b, c)</text>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">a² + b² == c² ? *</text>

  <text x="462" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M455,340 L472,340" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="476" y="322" width="90" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="521" y="345" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans++</text>

  <text x="334" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M320,378 L320,394" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="396" width="96" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="416" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">u++</text>

  <path d="M521,358 L521,411 L368,411" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M272,411 L140,411 L140,254 L215,254" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="452" font-size="10.5" fill="#b85450" filter="url(#rough2)">* 乘法用 64 位整数（c² 可达百亿级，int32 溢出；Python 无此问题）</text>
</svg>
