<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 3 演算：a = [6, 10, 20, 30]</text>
  <text x="330" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把每个不同的值当成候选周期 p，数它整除几个元素，越多越好</text>

  <!-- 表头 -->
  <rect x="40" y="66" width="580" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2f4a63">
    <text x="90" y="90" text-anchor="middle">候选 p</text>
    <text x="245" y="90" text-anchor="middle">保留的 a_i（p 的倍数）</text>
    <text x="400" y="90" text-anchor="middle">cnt(p)</text>
    <text x="535" y="90" text-anchor="middle">需删除 n − cnt(p)</text>
  </g>
  <path d="M 140 66 L 140 272" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 350 66 L 350 272" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 450 66 L 450 272" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <rect x="40" y="104" width="580" height="42" fill="#fafafa" stroke="#cbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#444">
    <text x="90" y="130" text-anchor="middle">6</text>
    <text x="245" y="130" text-anchor="middle">6, 30</text>
    <text x="400" y="130" text-anchor="middle">2</text>
    <text x="535" y="130" text-anchor="middle">2</text>
  </g>

  <!-- 第 2 行：最优 -->
  <rect x="40" y="146" width="580" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#3a5a30">
    <text x="90" y="172" text-anchor="middle" font-weight="bold">10</text>
    <text x="245" y="172" text-anchor="middle">10, 20, 30</text>
    <text x="400" y="172" text-anchor="middle" font-weight="bold">3</text>
    <text x="535" y="172" text-anchor="middle" font-weight="bold">1 ← 最优</text>
  </g>

  <!-- 第 3 行 -->
  <rect x="40" y="188" width="580" height="42" fill="#fafafa" stroke="#cbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#444">
    <text x="90" y="214" text-anchor="middle">20</text>
    <text x="245" y="214" text-anchor="middle">20</text>
    <text x="400" y="214" text-anchor="middle">1</text>
    <text x="535" y="214" text-anchor="middle">3</text>
  </g>

  <!-- 第 4 行 -->
  <rect x="40" y="230" width="580" height="42" fill="#fafafa" stroke="#cbb" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#444">
    <text x="90" y="256" text-anchor="middle">30</text>
    <text x="245" y="256" text-anchor="middle">30</text>
    <text x="400" y="256" text-anchor="middle">1</text>
    <text x="535" y="256" text-anchor="middle">3</text>
  </g>

  <rect x="40" y="66" width="580" height="206" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="40" y="290" width="580" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="54" y="313" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">答案 = 4 − max{2, 3, 1, 1} = 4 − 3 = 1：删掉 6，保留 10, 20, 30，周期 p = 10</text>
  <text x="54" y="334" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">验证：此时 1 恰好落在 10 的倍数上，前 10 位 0000000001 只有一个 1 ⇒ rhythmic</text>

  <text x="330" y="370" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">样例 1（a = [3,7,5,3]）：p = 3 时 cnt = 2（两个 3），删 7 与 5 ⇒ 2</text>
  <text x="330" y="388" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">样例 4（a = [2,3,5]）：三个数互不整除，cnt 全是 1 ⇒ 只能留一个，删 2</text>
</svg>
