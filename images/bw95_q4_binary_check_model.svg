<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="39"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">二分答案 + O(n) 判定的组装</text>

  <!-- 左：单调性 -->
  <text x="150" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">check(m) 关于 m 单调</text>
  <line x1="70" y1="240" x2="250" y2="240" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="240" x2="70" y2="80" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 70 220 L 168 220 C 190 220, 200 200, 208 160" fill="none" stroke="#e6f4ea" stroke-width="14" opacity="0.85" filter="url(#rough2)"/>
  <path d="M 208 160 L 250 88" fill="none" stroke="#fce4ec" stroke-width="14" opacity="0.85" filter="url(#rough2)"/>
  <line x1="168" y1="240" x2="168" y2="220" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="80" y="104" font-size="12" fill="#2d5a22" filter="url(#rough2)">可行 ✓</text>
  <text x="216" y="112" font-size="12" fill="#b85450" filter="url(#rough2)">不可行 ✗</text>
  <text x="168" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">m*（最大可行值）</text>
  <text x="150" y="286" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">同一方案：能保 m 就能保 m'&lt;m</text>
  <text x="150" y="302" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">答案区间 [0, max(power)+k]</text>

  <!-- 右：check 流程 -->
  <text x="425" y="66" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">check(m)：一次线性扫描</text>
  <g filter="url(#rough2)">
    <rect x="330" y="82" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="330" y="132" width="190" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <rect x="330" y="182" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <rect x="330" y="232" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="425" y="103" fill="#333">i 从左到右：cover += expire[i]</text>
    <text x="425" y="153" fill="#7a5c1e">power[i] + cover &lt; m ? 缺 t 座</text>
    <text x="425" y="203" fill="#b85450">补 t 座到 p=min(i+r,n−1)</text>
    <text x="425" y="253" fill="#2d5a22">p+r+1 处差分挂 −t 回收</text>
  </g>
  <path d="M 425 116 L 425 128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 166 L 425 178" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 216 L 425 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇合 -->
  <rect x="120" y="322" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总复杂度 O(n log(max(power)+k)) ≈ 35 轮 × O(n)</text>
</svg>
