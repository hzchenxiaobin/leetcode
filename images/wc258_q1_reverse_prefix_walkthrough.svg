<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">双指针原地交换演算</text>
  <path d="M 220 40 Q 320 48 420 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">word = "abcdefd"，ch = 'd'，i = 3</text>

  <!-- Row A -->
  <text x="34" y="96" font-size="12" fill="#b8564e" font-weight="bold">① 交换 word[0] ↔ word[3]</text>
  <g font-size="16" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="102" width="44" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g><text x="176" y="129">a</text>
    <g filter="url(#sk)"><rect x="202" y="102" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="224" y="129">b</text>
    <g filter="url(#sk)"><rect x="250" y="102" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="272" y="129">c</text>
    <g filter="url(#sk)"><rect x="298" y="102" width="44" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g><text x="320" y="129">d</text>
    <g filter="url(#sk)"><rect x="346" y="102" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="368" y="129">e</text>
    <g filter="url(#sk)"><rect x="394" y="102" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="416" y="129">f</text>
    <g filter="url(#sk)"><rect x="442" y="102" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="464" y="129">d</text>
  </g>
  <circle cx="176" cy="154" r="2.2" fill="#c98a2b"/>
  <path d="M 176 154 Q 248 178 318 154" stroke="#c98a2b" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arO)"/>
  <text x="176" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">l = 0</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">r = 3</text>

  <!-- Row B -->
  <text x="34" y="216" font-size="12" fill="#b8564e" font-weight="bold">② 交换 word[1] ↔ word[2]</text>
  <g font-size="16" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="222" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="176" y="249">d</text>
    <g filter="url(#sk)"><rect x="202" y="222" width="44" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g><text x="224" y="249">b</text>
    <g filter="url(#sk)"><rect x="250" y="222" width="44" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g><text x="272" y="249">c</text>
    <g filter="url(#sk)"><rect x="298" y="222" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="320" y="249">a</text>
    <g filter="url(#sk)"><rect x="346" y="222" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="368" y="249">e</text>
    <g filter="url(#sk)"><rect x="394" y="222" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="416" y="249">f</text>
    <g filter="url(#sk)"><rect x="442" y="222" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="464" y="249">d</text>
  </g>
  <circle cx="224" cy="274" r="2.2" fill="#c98a2b"/>
  <path d="M 224 274 Q 248 296 270 274" stroke="#c98a2b" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arO)"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">l = 1</text>
  <text x="272" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">r = 2</text>

  <!-- Row C -->
  <text x="34" y="336" font-size="12" fill="#2e6e2e" font-weight="bold">③ l = 2 ≥ r = 1，指针相遇，停止</text>
  <g font-size="16" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="154" y="342" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="176" y="369">d</text>
    <g filter="url(#sk)"><rect x="202" y="342" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="224" y="369">c</text>
    <g filter="url(#sk)"><rect x="250" y="342" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="272" y="369">b</text>
    <g filter="url(#sk)"><rect x="298" y="342" width="44" height="42" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g><text x="320" y="369">a</text>
    <g filter="url(#sk)"><rect x="346" y="342" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="368" y="369">e</text>
    <g filter="url(#sk)"><rect x="394" y="342" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="416" y="369">f</text>
    <g filter="url(#sk)"><rect x="442" y="342" width="44" height="42" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g><text x="464" y="369">d</text>
  </g>
  <path d="M 154 394 L 154 402 L 342 402 L 342 394" stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="248" y="418" text-anchor="middle" font-size="11" fill="#2b6e9e">前缀反转完成</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="170" y="430" width="300" height="36" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="454" text-anchor="middle" font-size="16" fill="#7a5415" font-family="monospace" font-weight="bold">"dcbaefd" ✓</text>
</svg>
