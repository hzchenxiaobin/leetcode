<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：n = 12 → 7 步（2 + 2 + 3）</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每段 Copy All 一次、Paste k 次，段因子 f = k+1，代价也是 f</text>

  <rect x="60" y="62" width="410" height="30" fill="#eeeeee" stroke="#999999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="120" y="82">步骤</text>
    <text x="210" y="82">操作</text>
    <text x="320" y="82">屏幕 A 数</text>
    <text x="430" y="82">剪贴板</text>
  </g>

  <g filter="url(#rough2)" opacity="0.75">
    <rect x="60" y="92" width="410" height="52" fill="#e8f0fe"/>
    <rect x="60" y="144" width="410" height="52" fill="#e6f4ea"/>
    <rect x="60" y="196" width="410" height="78" fill="#fff8e1"/>
  </g>

  <g filter="url(#rough2)" fill="none" stroke-width="1.1" stroke="#cccccc">
    <rect x="60" y="92" width="410" height="52"/>
    <rect x="60" y="144" width="410" height="52"/>
    <rect x="60" y="196" width="410" height="78"/>
    <path d="M 120 92 L 120 274"/><path d="M 210 92 L 210 274"/>
    <path d="M 320 92 L 320 274"/><path d="M 430 92 L 430 274"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="120" y="112">1</text><text x="210" y="112">Copy</text><text x="320" y="112">1</text><text x="430" y="112">1</text>
    <text x="120" y="138">2</text><text x="210" y="138">Paste</text><text x="320" y="138">2</text><text x="430" y="138">1</text>
    <text x="120" y="164">3</text><text x="210" y="164">Copy</text><text x="320" y="164">2</text><text x="430" y="164">2</text>
    <text x="120" y="190">4</text><text x="210" y="190">Paste</text><text x="320" y="190">4</text><text x="430" y="190">2</text>
    <text x="120" y="216">5</text><text x="210" y="216">Copy</text><text x="320" y="216">4</text><text x="430" y="216">4</text>
    <text x="120" y="242">6</text><text x="210" y="242">Paste</text><text x="320" y="242">8</text><text x="430" y="242">4</text>
    <text x="120" y="268">7</text><text x="210" y="268">Paste</text><text x="320" y="268">12</text><text x="430" y="268">4</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke-width="1.6">
    <path d="M 478 94 L 490 94 L 490 142 L 478 142" stroke="#446688"/>
    <path d="M 478 146 L 490 146 L 490 194 L 478 194" stroke="#4a7a3a"/>
    <path d="M 478 198 L 490 198 L 490 272 L 478 272" stroke="#d6a040"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66">
    <text x="498" y="122">f = 2</text>
    <text x="498" y="174" fill="#3a5a30">f = 2</text>
    <text x="498" y="238" fill="#8a6a20">f = 3</text>
  </g>

  <rect x="40" y="292" width="258" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="313" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">12 的所有乘法分拆与代价</text>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="54" y="334">12 = 2·2·3　→ 2+2+3 = 7　✓ 最小</text>
    <text x="54" y="354">12 = 3·4　　 → 3+4 = 7　（同为最优）</text>
    <text x="54" y="374">12 = 2·6 / 12 → 8 / 12　（更差）</text>
  </g>

  <rect x="312" y="292" width="268" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="326" y="313" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">再算几组：答案 = Σ 素因子</text>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="326" y="334">24 = 2³·3 → 2+2+2+3 = 9；1000 = 2³·5³ → 21</text>
    <text x="326" y="354">97 是素数 → 1 + 96 次 Paste = 97</text>
    <text x="326" y="374">n = 1 → 初值已满足，0 次操作</text>
  </g>

  <text x="310" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同一组因子换个顺序只是把段前后调换，总代价不变——所以只要分解，不需要考虑顺序</text>
</svg>
